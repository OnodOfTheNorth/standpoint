name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content lints (strict)
        run: pnpm --filter @standpoint/content exec tsx src/compile.ts --strict
      - name: Type check
        run: pnpm typecheck
      - name: Unit, analysis and persona tests
        run: pnpm test
      - name: Build the site
        run: pnpm --filter @standpoint/ontology build && pnpm --filter @standpoint/web build
      - name: Install Playwright browser
        run: pnpm --filter @standpoint/web exec playwright install --with-deps chromium
      - name: End-to-end (one full run per mode)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
