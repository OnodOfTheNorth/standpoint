traditions:
  - id: fascism.italian
    regions: [Italy, Libya, Ethiopia, Balkans]
    self: >-
      We are the nation in arms, born in the trenches of the Carso. Liberal parliaments are talking
      shops of factions; socialism sets Italian against Italian in a class war that profits only the
      foreigner. Fascism stands for the State as the highest expression of the nation: everything
      within the State, nothing outside the State, nothing against the State. We will discipline
      capital and labor alike in corporations under the State, restore order to factories and fields,
      avenge the mutilated victory, and win Italy the empire the plutocratic powers denied her.
      Believe, obey, fight.
    record:
      - date: 1919
        text: >-
          Benito Mussolini founds the Fasci italiani di combattimento in Milan on 23 March.
      - date: "1920-1922"
        text: >-
          Squads financed by landowners in the Po Valley and Tuscany, and increasingly by industrialists,
          burn the halls of socialist and Catholic unions, peasant leagues, cooperatives and newspapers,
          killing hundreds of people, while police and army largely stand aside.
      - date: 1922
        text: >-
          After the March on Rome of 28 October, King Victor Emmanuel III refuses to declare martial law
          and appoints Mussolini prime minister on 30 October.
      - date: "1924-1926"
        text: >-
          Fascists murder the socialist deputy Giacomo Matteotti in June 1924. The laws of 1925–26 ban
          all other parties, abolish the free press, set up a special tribunal and internal exile, and
          recognize only fascist unions; strikes become a crime. Antonio Gramsci is imprisoned from 1926
          until shortly before his death in 1937.
      - date: "1929-1937"
        text: >-
          In Libya the army deports about 100,000 people of the Jebel Akhdar into concentration camps,
          where tens of thousands die. In the 1935–36 invasion of Ethiopia it uses mustard gas on soldiers
          and civilians; after an attempt on Viceroy Graziani in February 1937, reprisals in Addis Ababa
          kill people in numbers estimated from several thousand to about 30,000.
      - date: "1938-1945"
        text: >-
          The racial laws of 1938 expel Jews from schools, professions and the civil service. Under German
          occupation and the Salò republic from 1943, some 7,000 to 8,500 Jews are deported from Italy and
          Italian-held territory, most of them to their deaths.
      - date: "1940-1945"
        text: >-
          Italy joins Germany's war, invades Greece, occupies parts of Yugoslavia, where thousands of
          Slovene and Croat internees die in camps such as Rab, and sends an army to the Soviet Union.
          Mussolini is deposed in July 1943, heads the German-backed Salò republic, and is shot by
          partisans in April 1945.
    descendsFrom:
      - {id: anarchism.syndicalist, event: "Interventionist revolutionary syndicalists (Rossoni, Bianchi, Panunzio) join the fascist movement", date: "1914-1919"}
      - {id: nationalism.ethnic, event: "Merger with the Italian Nationalist Association", date: 1923}
    breaksWith:
      - {id: marxism.classical, event: "Mussolini expelled from the Italian Socialist Party for backing entry into the war", date: 1914}
    analysis:
      conditions: >-
        Italy in 1919–1922 had postwar inflation, millions of demobilized soldiers, factory occupations in
        September 1920 and peasant leagues in the Po Valley that imposed hiring rules and wage scales on
        landowners. The liberal state could neither concede to the workers nor repress them itself, so
        landowners and then industrialists paid squads to destroy labor's organizations, and the state
        tolerated them and then handed them power.
      class_base: >-
        Leaders and squad members came from demobilized junior officers, students and the urban petty
        bourgeoisie; money came from agrarian and then industrial capital. In power, the corporate state
        cut wages (by decree in 1927 and again in the depression), banned strikes, and rescued banks and
        industry through the state holding IRI (1933), while the middle strata gained state jobs and status.
      function: >-
        It is the first case of the pattern the frame describes: when labor contests profits and no
        socialist movement can take power, capital turns to a mass movement that destroys the workers'
        organizations. Its line runs through the postwar MSI (1946) to Brothers of Italy, which has led
        Italy's government since 2022 and rejects the fascist label; its methods return wherever core
        capital faces a squeeze and an unorganized, angry middle.
      disputed: >-
        The Comintern (Dimitrov, 1935) defined fascism as the open terrorist dictatorship of the most
        reactionary elements of finance capital. Trotsky stressed the mass movement of an enraged petty
        bourgeoisie that big capital used to smash the workers' organizations; Gramsci read it as a form
        of Caesarism; August Thalheimer as Bonapartism.
    keyTexts:
      - {author: Benito Mussolini and Giovanni Gentile, title: The Doctrine of Fascism, year: 1932}
      - {author: Giovanni Gentile, title: Manifesto of the Fascist Intellectuals, year: 1925}
      - {author: Angelo Tasca, title: "The Rise of Italian Fascism (Naissance du fascisme)", year: 1938}
      - {author: Daniel Guérin, title: "Fascism and Big Business (Fascisme et grand capital)", year: 1936}
      - {author: Robert O. Paxton, title: The Anatomy of Fascism, year: 2004}

  - id: fascism.nazism
    regions: [Germany, Austria, occupied Europe]
    self: >-
      The German people were stabbed in the back in 1918, robbed at Versailles and handed over to
      Jewish finance and Jewish Marxism, which divide the nation in order to rule it. We are National
      Socialists. The nation is a community of blood, the Volksgemeinschaft, in which class war gives
      way to common service: the common good before the individual good. Race is the motor of history
      and the Jew its enemy. Germany must have living space in the East to feed its children. One
      people, one Reich, one leader.
    record:
      - date: 1933
        text: >-
          Hitler is appointed chancellor on 30 January through a deal with conservative elites. The decree
          after the Reichstag fire suspends civil rights; the Communist Party is crushed and the Enabling
          Act passes in March with Centre Party votes. Dachau opens for political prisoners in March; on
          2 May the SA occupies union offices and dissolves the free trade unions; the SPD is banned in
          June and all other parties by July.
      - date: "1932-1933"
        disputed: true
        text: >-
          In November 1932 industrialists and bankers petition Hindenburg to appoint Hitler, and on 20
          February 1933 leading industrialists pledge some three million marks for the election. Henry
          Ashby Turner (1985) argues big business gave little before 1933; others hold its support was
          decisive at the moment of appointment.
      - date: "1935-1938"
        text: >-
          The Nuremberg Laws strip Jews of citizenship and ban marriage with non-Jews. In the November
          1938 pogrom synagogues are burned, at least 91 Jews are killed and some 30,000 Jewish men are
          sent to concentration camps; Jewish property is transferred to German firms and individuals.
      - date: "1939-1945"
        text: >-
          The Aktion T4 program and its successors murder some 200,000 to 300,000 disabled people, first
          with gas in killing centers whose staff then move to the extermination camps.
      - date: "1939-1945"
        text: >-
          Germany wages wars of conquest: Poland in September 1939, Western Europe in 1940, Yugoslavia and
          Greece in 1941, and from June 1941 a war of annihilation against the Soviet Union under plans to
          starve and expel tens of millions. About 27 million Soviet citizens die, and about 3.3 million of
          5.7 million Soviet prisoners of war die in German custody.
      - date: "1941-1945"
        text: >-
          The Holocaust: about six million Jews are murdered by mass shooting, in gas vans, and in the
          extermination camps of Chełmno, Bełżec, Sobibór, Treblinka, Majdanek and Auschwitz-Birkenau,
          coordinated at the Wannsee Conference in January 1942. Between 200,000 and 500,000 Roma and Sinti
          are murdered.
      - date: "1939-1945"
        text: >-
          More than 12 million people are taken from occupied Europe for forced labor; concentration camp
          prisoners work for firms such as IG Farben at Auschwitz-Monowitz, Krupp and Siemens. Germany
          surrenders on 8 May 1945; leaders are tried at Nuremberg in 1945–46.
    descendsFrom:
      - {id: nationalism.ethnic, event: "Völkisch movement and the German Workers' Party that Hitler joined", date: 1919}
      - {id: fascism.italian, event: "The March on Rome as the model for the Munich putsch", date: 1923}
    breaksWith:
      - {id: conservatism.reactionary, event: "Absorption and dissolution of the conservative-nationalist DNVP coalition partner", date: 1933}
    analysis:
      conditions: >-
        In 1929–1933 Germany had about six million unemployed, deflationary austerity imposed by emergency
        decree, the withdrawal of US loans, a working class split between Social Democrats and Communists,
        and ruined peasants and small proprietors. German capital, stripped of colonies and markets at
        Versailles, wanted rearmament and expansion. When the Weimar settlement's wage and welfare
        commitments could not be reconciled with restoring profits, conservative elites around Papen,
        Hindenburg, the army, sections of heavy industry and the East Elbian landowners handed power to
        the movement with a mass base that promised to destroy labor's organizations.
      class_base: >-
        Its voters were mainly Protestant rural and small-town proprietors, peasants, salaried employees,
        pensioners and students; its storm troopers were often unemployed young men. Power rested on an
        alliance with heavy industry, the landowners and the army. Banning unions froze wages near 1932
        levels while profits recovered; armaments contracts, the seizure of Jewish property and the forced
        labor of occupied Europe enriched German firms.
      function: >-
        It is the reference point and banner for neo-Nazi movements and for Holocaust denial today. Aimé
        Césaire (1950) argued that Nazism applied to Europeans the methods of conquest, camps and
        extermination that colonial powers had used on Africans and Asians; the plans for the East were
        modeled openly on settler colonialism. In the frame's terms it is the extreme case of a core
        capital, shut out of the division of the world, turning imperial methods inward and eastward.
      disputed: >-
        The Comintern line (1935) saw the open dictatorship of finance capital; Franz Neumann (Behemoth,
        1942) a cartel of party, army, bureaucracy and monopoly capital; Tim Mason a primacy of politics in
        which the state at times overrode capital's interests; Götz Aly (Hitler's Beneficiaries, 2005)
        argued ordinary Germans were bought with plunder.
    keyTexts:
      - {author: Adolf Hitler, title: Mein Kampf, year: 1925}
      - {author: Franz Neumann, title: "Behemoth: The Structure and Practice of National Socialism", year: 1942}
      - {author: Raul Hilberg, title: The Destruction of the European Jews, year: 1961}
      - {author: Aimé Césaire, title: Discourse on Colonialism, year: 1950}
      - {author: Adam Tooze, title: "The Wages of Destruction: The Making and Breaking of the Nazi Economy", year: 2006}

  - id: fascism.national-syndicalism
    regions: [Spain, Portugal, Latin America]
    self: >-
      We reject the liberal capitalism that leaves the worker alone before his employer, and the Marxism
      that sets Spaniard against Spaniard and takes its orders from Moscow. Spain is a unity of destiny
      in the universal. Production must be organized in national syndicates that bring together everyone
      who works in a branch, owners, technicians and workers, under a national state that serves them
      all. Credit must be nationalized and the land given to those who work it. We are neither right nor
      left. When justice or the fatherland is offended, we answer with fists and pistols.
    record:
      - date: 1931
        text: >-
          Ramiro Ledesma Ramos launches La Conquista del Estado and, with Onésimo Redondo, the Juntas de
          Ofensiva Nacional-Sindicalista (JONS).
      - date: "1933-1936"
        text: >-
          José Antonio Primo de Rivera founds the Falange in October 1933; it merges with the JONS in 1934
          and adopts the 27 Points. Falangist gunmen and their opponents kill each other in the streets;
          the party wins under one percent of the vote in February 1936 and is banned in March.
      - date: 1934
        text: >-
          In Portugal, Salazar dissolves Rolão Preto's national syndicalist Blue Shirts and absorbs his
          own corporatism into the Estado Novo without them.
      - date: 1936
        text: >-
          The Falange joins the military uprising of July and grows into a mass militia; Falangist squads
          take part in the killings behind the lines. Historians estimate the Nationalist repression during
          and after the war at about 130,000 to 150,000 dead. José Antonio is executed by the Republic in November.
      - date: 1937
        disputed: true
        text: >-
          Franco's Unification Decree merges the Falange with the Carlists into a single party under his
          command; Manuel Hedilla, who resists, is sentenced to death and reprieved. Dissident Falangists
          hold that Franco betrayed national syndicalism; most historians note that the Falange staffed the
          state's union apparatus and repression for decades.
      - date: "1938-1977"
        text: >-
          The Labor Charter (1938) and the Law of Union Unity (1940) force all workers and employers into
          vertical syndicates run by the Falange; the CNT and UGT are outlawed and strikes remain a crime
          until 1977.
      - date: "1939-1943"
        text: >-
          Nearly 300 concentration camps and forced labor battalions hold hundreds of thousands of
          Republican prisoners; the Falange's Blue Division sends some 45,000 volunteers to fight beside
          Germany against the Soviet Union.
    descendsFrom:
      - {id: fascism.italian, event: "Ledesma and José Antonio take the corporate state and the squad from Mussolini", date: "1931-1933"}
    breaksWith:
      - {id: conservatism.monarchist, event: "Falange refuses to join the monarchist National Bloc", date: 1934}
    analysis:
      conditions: >-
        Spain's Second Republic (1931) attempted land reform and secularization during the depression in a
        country with the world's largest anarcho-syndicalist union and a mass socialist union, and with
        day laborers in Andalusia and Extremadura occupying estates in 1936. A national syndicalism that
        promised workers social justice under the nation stayed small until the army's rising needed a
        mass party and an apparatus for repression.
      class_base: >-
        Students, sons of landowning and professional families and some urban employees at the start;
        under Franco, tens of thousands of officials in the syndicate bureaucracy. Landowners recovered
        land taken in the reform and employers gained wages fixed by the state with strikes banned.
      function: >-
        Small Falangist groups survive in Spain and the national-syndicalist label is used by third-position
        groups elsewhere. It offers language that sounds anticapitalist (nationalize credit, land to the
        tiller) while its record is the abolition of independent unions and the return of land to large
        owners, binding workers' anger to national unity under employers.
      disputed: >-
        Historians dispute whether Francoism was fascist, with the Falange as its fascist component, or a
        military and clerical dictatorship that used a fascist party; Juan Linz's concept of an
        “authoritarian regime” and Stanley Payne's work stand on one side, Paul Preston's emphasis on
        extermination of the enemy on the other.
    keyTexts:
      - {author: José Antonio Primo de Rivera, title: Founding speech of Falange Española at the Teatro de la Comedia, year: 1933}
      - {author: Falange Española de las JONS, title: The 27 Points, year: 1934}
      - {author: Ramiro Ledesma Ramos, title: Discurso a las juventudes de España, year: 1935}
      - {author: Stanley G. Payne, title: "Fascism in Spain, 1923-1977", year: 1999}
      - {author: Paul Preston, title: The Spanish Holocaust, year: 2012}

  - id: fascism.clerical
    regions: [Romania, Austria, Croatia, Slovakia]
    self: >-
      Our nation is a Christian nation or it is nothing. Liberalism, Freemasonry, Bolshevism and the Jews
      have torn our people from the Church and from the soil, and left the peasant in debt to the money
      lender and the worker in the hands of atheist agitators. We will rebuild a Christian corporative
      order in which faith, family and work are protected, and the nation is purified of those who
      corrupt it. We are soldiers of Christ and of the nation, ready to die for both, as the Archangel
      Michael fought the dragon.
    record:
      - date: "1927-1941"
        text: >-
          Corneliu Codreanu founds the Legion of the Archangel Michael in Romania, later the Iron Guard.
          Legionaries assassinate Prime Ministers Ion Duca (1933) and Armand Călinescu (1939); during their
          January 1941 rebellion they carry out a pogrom in Bucharest that kills about 125 Jews.
      - date: "1933-1934"
        disputed: true
        text: >-
          Engelbert Dollfuss suspends the Austrian parliament in March 1933; in February 1934 the army and
          the Heimwehr shell Vienna's social democratic housing estates, several hundred are killed, and the
          Social Democratic Party and free unions are banned. The May 1934 constitution creates a Christian
          corporative state. Austrian historians still dispute whether to call it Austrofascism or a
          Catholic corporative dictatorship.
      - date: "1939-1945"
        text: >-
          The Slovak state under the priest Jozef Tiso, allied with Germany, deports about 58,000 Jews to
          German camps in 1942 and pays Germany 500 marks for each person deported.
      - date: "1941-1945"
        text: >-
          The Independent State of Croatia under Ante Pavelić's Ustaša, set up under German and Italian
          sponsorship, murders Serbs, Jews and Roma; the US Holocaust Memorial Museum estimates 320,000 to
          340,000 Serbs were killed, and 77,000 to 99,000 people at the Jasenovac camp complex, where the
          Franciscan Miroslav Filipović served as a commandant.
      - date: "1941-1946"
        disputed: true
        text: >-
          The role of Archbishop Alojzije Stepinac of Zagreb is disputed: he welcomed the Croatian state and
          served as its military vicar, and also intervened for some victims. Yugoslavia convicted him of
          collaboration in 1946; the Catholic Church beatified him in 1998.
    descendsFrom:
      - {id: conservatism.cst, event: "Austria's 1934 constitution cites the corporatism of Quadragesimo anno", date: 1934}
      - {id: fascism.italian, event: "Mussolini's patronage of the Heimwehr and of the Ustaša in exile", date: "1929-1934"}
    breaksWith:
      - {id: fascism.nazism, event: "Austrian Nazis murder Dollfuss in the failed July putsch", date: 1934}
    analysis:
      conditions: >-
        Interwar Central and Eastern Europe was agrarian and peripheral, hit by the collapse of grain prices
        in 1929–33, and its new states held large minorities and Jewish urban middle classes. The churches
        were the main mass institutions in the countryside, and fear of Bolshevism ran high after 1917–19.
        Where peasants were in debt and trade and the professions were held disproportionately by Jews or
        other minorities, these movements turned debt and land hunger into religious-national hatred and
        promised to hand minorities' property and posts to the Christian nation.
      class_base: >-
        Lower clergy, seminarians and students, the rural petty bourgeoisie and parts of the peasantry,
        with support from landowners and, in Austria, industrialists and an Italian-funded militia.
        Confiscation of Jewish property and the crushing of Vienna's unions transferred wealth and cut wages.
      function: >-
        Its symbols persist: the Ustaša salute in Croatia, Legionary cults in Romania, open veneration of
        Tiso by Marian Kotleba's party in Slovakia. It fuses church loyalty with ethnic exclusion and turns
        peripheral grievances against minorities rather than against the westward flow of profit and
        labor out of the region.
      disputed: >-
        Scholars dispute whether clerical fascism is a real category or confuses Catholic and Orthodox
        authoritarianism with fascism. Marxist readings, such as Nicos Poulantzas (Fascism and
        Dictatorship, 1970), treat these as peripheral forms of the exceptional state serving agrarian
        capital and a weak national bourgeoisie.
    keyTexts:
      - {author: Corneliu Zelea Codreanu, title: "For My Legionaries (Pentru legionari)", year: 1936}
      - {author: Radu Ioanid, title: "The Sword of the Archangel: Fascist Ideology in Romania", year: 1990}
      - {author: Matthew Feldman and Marius Turda (eds.), title: "'Clerical Fascism' in Interwar Europe", year: 2008}
      - {author: Nicos Poulantzas, title: Fascism and Dictatorship, year: 1970}

  - id: fascism.traditionalist
    regions: [Italy, Europe, Russia, United States]
    self: >-
      The modern world is not progress but the last stage of a long fall, the dark age the traditions
      foretold. Once there were sacred kings and castes of priests and warriors that mirrored a
      transcendent order. Then came the age of merchants, liberalism and capitalism, and then the age of
      the masses: democracy, socialism, communism, America and Russia as two jaws of one pincer. We do not
      try to save this world. We stand upright among the ruins, inwardly detached, keeping the values of
      the warrior and the ascetic, and we ride the tiger until it tires.
    record:
      - date: 1934
        text: >-
          Julius Evola publishes Revolt Against the Modern World; from 1938 he writes for the racial
          journal La Difesa della razza, and in 1941 his racial doctrine wins Mussolini's approval.
      - date: 1951
        text: >-
          Evola is tried in Rome as the inspiration of a neo-fascist armed group and acquitted; in 1953 he
          publishes Men Among the Ruins as a guide for the postwar right.
      - date: 1964
        text: >-
          In Fascism Viewed from the Right Evola criticizes fascism as too plebeian and too modern.
      - date: "1969-1980"
        disputed: true
        text: >-
          Militants of Ordine Nuovo, founded in 1956 by Evola's admirer Pino Rauti, and of later groups are
          tied to the bombings of Piazza Fontana (1969, 17 dead), Brescia (1974, 8 dead) and Bologna station
          (1980, 85 dead). Courts convicted neo-fascists for Brescia and Bologna and intelligence officers
          for misleading the Bologna inquiry; for Piazza Fontana responsibility was established but no one
          was finally convicted. Evola's defenders deny he bears any responsibility.
      - date: "1990s-2010s"
        text: >-
          Aleksandr Dugin translates and promotes Evola in Russia; Steve Bannon cites him in a 2014 talk;
          his works become standard reading on the online far right.
    descendsFrom:
      - {id: conservatism.reactionary, event: "Evola joins René Guénon's Traditionalism to counter-revolutionary thought", date: 1927}
      - {id: fascism.italian, event: "Evola writes on race doctrine for the fascist press", date: 1938}
    breaksWith:
      - {id: fascism.italian, event: "Fascism Viewed from the Right rejects fascism's populism", date: 1964}
    analysis:
      conditions: >-
        It arose among aristocratic and esoteric intellectuals in interwar Italy who found fascism too
        modern and too popular, and revived after 1945 among defeated fascists for whom open politics was
        closed. With elections out of reach, a metaphysics of inner revolt and elite cadres suited
        militants who could not win votes, and produced both withdrawal and terror.
      class_base: >-
        Downwardly mobile intellectuals, students from bourgeois and aristocratic families and former
        officers, and today an online readership of young men. It offers status through esoteric rank to
        people who feel displaced, without asking for any material program.
      function: >-
        It supplies the metaphysical vocabulary (the dark age, tradition against modernity, hierarchy as
        sacred) for the online far right and for Dugin's Eurasianism. By treating inequality as cosmic
        order, it ratifies existing class and racial hierarchies while presenting itself as anti-bourgeois;
        Italy's years of bombings show its use as cover for violence against the left in which parts of
        the state were entangled.
      disputed: >-
        Evola's defenders place him in an aristocratic reaction critical of fascism rather than in fascism
        itself. Furio Jesi (Cultura di destra, 1979) read Traditionalism as a machine for producing myths
        for political use; materialists debate whether such ideas drive anything or decorate movements
        whose motors are class and nation.
    keyTexts:
      - {author: Julius Evola, title: Revolt Against the Modern World, year: 1934}
      - {author: Julius Evola, title: Men Among the Ruins, year: 1953}
      - {author: Julius Evola, title: Ride the Tiger, year: 1961}
      - {author: René Guénon, title: The Crisis of the Modern World, year: 1927}
      - {author: Mark Sedgwick, title: "Against the Modern World: Traditionalism and the Secret Intellectual History of the Twentieth Century", year: 2004}

  - id: fascism.third-position
    regions: [Italy, Britain, France, Russia, Europe]
    self: >-
      Neither capitalism nor communism, neither Washington nor Moscow. Both are materialist systems that
      reduce people to producers and consumers and dissolve nations into one global market. We stand for
      the nation, the family and the worker against usury, the banks and the multinationals. We want
      property spread among families, cooperatives, national control of credit and homes for our own
      people before profit. We salute every people fighting for its sovereignty against the global
      system, and we build our own social centers, unions and food banks where the left has abandoned
      the neighborhoods.
    record:
      - date: 1930
        text: >-
          Otto Strasser, expelled from the Nazi party, founds the Black Front for an anticapitalist national
          socialism; his brother Gregor is murdered in the June 1934 purge.
      - date: 1978
        text: >-
          Roberto Fiore, Gabriele Adinolfi and others found Terza Posizione in Rome; after the 1980 Bologna
          bombing inquiries, Fiore flees to London and is convicted in Italy in absentia of subversive
          association, not of the bombing.
      - date: "1983-1990"
        text: >-
          Britain's National Front splits, and its Political Soldier faction, led by Nick Griffin and Derek
          Holland, praises Gaddafi's Libya, Khomeini's Iran and Louis Farrakhan's Nation of Islam as allies
          against the global system.
      - date: 1993
        text: >-
          Eduard Limonov and Aleksandr Dugin found the National Bolshevik Party in Russia; it is banned in
          2007.
      - date: "2003-2011"
        text: >-
          CasaPound occupies a building in Rome in December 2003 and builds social centers modeled on the
          left's; in December 2011 a sympathizer, Gianluca Casseri, shoots dead two Senegalese street
          vendors in Florence.
      - date: 2021
        text: >-
          During protests against Italy's Covid pass, Forza Nuova, founded by Fiore in 1997, leads an
          attack on the headquarters of the CGIL union confederation in Rome on 9 October; Fiore and other
          leaders are arrested.
    descendsFrom:
      - {id: fascism.italian, event: "Revival of the Salò republic's socialization program (Verona Manifesto)", date: 1943}
      - {id: fascism.traditionalist, event: "Evola's ideal of the political soldier taken up by Terza Posizione", date: 1978}
    breaksWith:
      - {id: fascism.nazism, event: "Otto Strasser expelled from the Nazi party", date: 1930}
    analysis:
      conditions: >-
        It arose in the 1970s among young neo-fascists who rejected the parliamentary, NATO-aligned postwar
        far right, and grew from deindustrialization, the end of the Cold War and the retreat of communist
        parties from working-class districts. Where the left closed its branches and stopped running
        services, these groups occupied buildings and ran housing and food actions “for Italians first,”
        copying the left's forms to recruit.
      class_base: >-
        Young men from declining working-class and lower-middle-class districts, students and small
        traders, led by cadres from neo-fascist political families.
      function: >-
        It turns anger at finance and globalization against migrants and the organized left, as the 2021
        attack on the CGIL showed. Its language of usury names finance as a foreign, rootless power, a
        figure that has historically slid into antisemitism. It divides workers in the core by nation and
        leaves the outflow of value from the periphery untouched, and its praise for nationalists in the
        South is selective and tactical.
      disputed: >-
        Antifascist scholars and the left dispute how much its anti-imperialist language should be taken
        as a danger of confusion on the left and how much it is a marginal fringe. Historians also dispute
        whether Strasser's national socialism differed in substance from Hitler's, given that it shared
        the antisemitism and anti-Marxism.
    keyTexts:
      - {author: Otto Strasser, title: Aufbau des deutschen Sozialismus, year: 1932}
      - {author: Nicholas Goodrick-Clarke, title: "Black Sun: Aryan Cults, Esoteric Nazism, and the Politics of Identity", year: 2002}
      - {author: Graham Macklin, title: "Failed Führers: A History of Britain's Extreme Right", year: 2020}
      - {author: "Caterina Froio, Pietro Castelli Gattinara, Giorgia Bulli and Matteo Albanese", title: "CasaPound Italia: Contemporary Extreme-Right Politics", year: 2020}

  - id: fascism.identitarian
    regions: [France, Austria, Germany, Italy, Europe]
    self: >-
      Every people has the right to remain itself. Europe's peoples are being replaced in their own
      homelands by mass immigration and falling birth rates, while an elite calls this progress. We are
      not racists: we defend the identity of every people, the right of Africans and Arabs to their
      homelands as much as ours to ours. Our generation has been handed the bill for multiculturalism.
      Our answer is remigration, the return of non-European migrants to their countries of origin, and a
      cultural reconquest through nonviolent action, youth activism and the battle of ideas.
    record:
      - date: 2003
        text: >-
          After Unité Radicale is dissolved following a member's attempt to shoot President Chirac on 14
          July 2002, its cadres found the Bloc identitaire in France.
      - date: "2011-2012"
        text: >-
          Renaud Camus publishes Le Grand Remplacement; in October 2012 Génération identitaire occupies the
          building site of a mosque in Poitiers. The French government dissolves the group in March 2021.
      - date: 2017
        text: >-
          The Defend Europe campaign charters the ship C-Star to obstruct NGO rescues of migrants in the
          Mediterranean.
      - date: 2019
        disputed: true
        text: >-
          A gunman kills 51 Muslim worshippers at two mosques in Christchurch, New Zealand; his manifesto is
          titled The Great Replacement, and he had donated money to Martin Sellner of the Austrian
          identitarian movement. Attacks in El Paso (2019, 23 dead) and Buffalo (2022, 10 Black people
          killed) cite the same idea. The movement says it is nonviolent and bears no responsibility;
          critics hold that the replacement narrative supplies the motive.
      - date: "2023-2024"
        text: >-
          At a private meeting in Potsdam in November 2023, Sellner presents a remigration plan to AfD
          politicians and others; after its exposure in January 2024, hundreds of thousands protest across
          Germany.
      - date: 2025
        text: >-
          The AfD, whose leader adopts the word remigration at its January party conference, wins 20.8
          percent in Germany's federal election and comes second.
    descendsFrom:
      - {id: fascism.third-position, event: "Cadres of the national-revolutionary Unité Radicale found the Bloc identitaire", date: 2003}
    breaksWith:
      - {id: fascism.nazism, event: "Public rejection of national socialism and antisemitism in favor of ethnopluralism", date: 2003}
    analysis:
      conditions: >-
        It arose in Western Europe after 2000 in deindustrialized regions, through eurozone austerity
        after 2008, the refugee arrivals of 2015 and jihadist attacks in France. As wages stagnated and
        public services were cut, visible change in a neighborhood's population offered a cause that could
        be named without naming employers, landlords or the European Central Bank.
      class_base: >-
        An activist core of students and educated young men skilled in media, with echoes among small
        proprietors and parts of the core working class in declining regions. It offers native workers a
        claim on jobs, housing and welfare against migrants.
      function: >-
        It supplied the replacement frame now used by national-conservative and right-populist parties,
        moving electoral politics toward mass deportation. Migrants with insecure legal status are cheaper
        to employ, and deportation threats discipline them without ending the demand for their labor. The
        border system that results keeps the wage gap between periphery and core, through which value
        flows north, in place.
      disputed: >-
        Roger Griffin treats identitarianism as fascism adapted to metapolitics; Cas Mudde places it in a
        populist radical right that works inside liberal democracy. Materialists dispute whether
        replacement fear is mainly class anger redirected or a cultural reaction with its own dynamics.
    keyTexts:
      - {author: Renaud Camus, title: Le Grand Remplacement, year: 2011}
      - {author: Guillaume Faye, title: Archeofuturism, year: 1998}
      - {author: Markus Willinger, title: "Generation Identity: A Declaration of War Against the '68ers", year: 2013}
      - {author: José Pedro Zúquete, title: "The Identitarians: The Movement against Globalism and Islam in Europe", year: 2018}

  - id: fascism.neoreaction
    regions: [United States, Silicon Valley, Honduras]
    self: >-
      Democracy is not the end of history but a failed experiment. Real power today sits in what we call
      the Cathedral, the universities and press that manufacture opinion and answer to no one. Rule by
      the many produces short-term thinking, endless spending and a permanent bureaucracy that no
      election removes. A state should be run like a well-managed company: a sovereign executive,
      accountable for results, with citizens free to leave if they dislike it. Formalize power instead of
      hiding it. Order, competence and exit over voice. Not a revolution of the mob, but a reboot.
    record:
      - date: 2007
        text: >-
          Curtis Yarvin, writing as Mencius Moldbug, begins the blog Unqualified Reservations (2007–2014).
      - date: 2009
        text: >-
          The investor Peter Thiel writes in The Education of a Libertarian that he no longer believes
          “freedom and democracy are compatible.”
      - date: 2012
        text: >-
          Nick Land's essay series The Dark Enlightenment names the current.
      - date: "2020-2022"
        text: >-
          Próspera, a charter city in Honduras backed by investors including Thiel's network and built on
          the exit model the current promotes, opens under the ZEDE law. After Honduras repeals the law in
          2022, Próspera claims about 10.7 billion dollars from the state in investor-state arbitration.
      - date: 2021
        text: >-
          JD Vance, then a Senate candidate, cites Yarvin in an interview and proposes firing every
          mid-level civil servant and replacing them with loyalists.
      - date: 2025
        disputed: true
        text: >-
          With Vance as vice president, the new administration creates the Department of Government
          Efficiency under Elon Musk, carries out mass dismissals of federal employees and dismantles USAID.
          Commentators link this to Yarvin's 2012 proposal to retire all government employees; the
          administration does not cite him, and how much he influenced it is disputed.
    descendsFrom:
      - {id: libertarianism.paleo, event: "Hans-Hermann Hoppe's Democracy: The God That Failed", date: 2001}
      - {id: conservatism.reactionary, event: "Yarvin revives Carlyle and Filmer against popular sovereignty", date: 2007}
      - {id: technology.r-acc, event: "Nick Land's turn from cybernetic accelerationism to neoreaction", date: 2012}
    breaksWith:
      - {id: libertarianism.minarchist, event: "Abandonment of the hope that elections can secure property", date: 2009}
    analysis:
      conditions: >-
        It arose in the United States in the late 2000s among software engineers and investors, after the
        2008 crash and bailouts, and in an industry where the founder-run firm looked like an efficient
        sovereign and software platforms appeared able to route around states. Founders whose wealth came
        from monopoly platforms and venture finance experienced regulation, labor law and public opinion
        as friction; a theory that the firm should replace the elected state matched their position.
      class_base: >-
        A fraction of finance and technology capital (venture investors and founders) and well-paid
        engineers, with an online audience of young men in tech. Its proposals, from sovereign corporations
        and charter cities to purging the civil service, transfer public functions and assets to private
        owners and remove the job protections and electoral channels through which workers press claims.
      function: >-
        In 2025 it moved from blogs into the personnel and rhetoric of the US executive branch, supplying
        a rationale for dismantling the civil service and aid agencies while concentrating executive power.
        Abroad, charter cities use investor-state arbitration to override the decisions of peripheral
        governments, which secures foreign investors' claims on land and law.
      disputed: >-
        Its adherents, and many scholars, place it outside fascism: it has no mass movement, no party
        militia and no myth of national rebirth, which Paxton and Griffin treat as essential. Materialist
        critics place it with fascism because its function, executive rule on behalf of capital against
        labor and electoral constraint, fits the frame's definition.
    keyTexts:
      - {author: Mencius Moldbug (Curtis Yarvin), title: An Open Letter to Open-Minded Progressives, year: 2008}
      - {author: Nick Land, title: The Dark Enlightenment, year: 2012}
      - {author: Hans-Hermann Hoppe, title: "Democracy: The God That Failed", year: 2001}
      - {author: Peter Thiel, title: The Education of a Libertarian, year: 2009}
      - {author: Elizabeth Sandifer, title: Neoreaction a Basilisk, year: 2017}

  - id: fascism.ecofascism
    regions: [Germany, United States, Europe, New Zealand]
    self: >-
      The earth is dying under too many people consuming too much, and the liberal and Marxist answers,
      more growth, open borders and redistribution, only make it worse. A people is rooted in its land
      as a forest is rooted in its soil; cut the bond and both die. Mass migration from high-birth
      countries into Europe and North America multiplies consumption and paves over the last wild
      places. We say: protect nature by protecting the homeland, its borders and its people. Reduce
      numbers, restore an organic order, and defend the land as you would defend your own blood.
    record:
      - date: "1933-1942"
        text: >-
          Under Walther Darré, Reich minister of food and agriculture, the Nazi state's blood and soil
          policy binds hereditary farms to families of certified German descent (1933), passes a Reich
          nature protection law (1935), and prepares the settlement of German farmers on land in the East
          to be cleared of its Slavic and Jewish inhabitants.
      - date: "1935-1945"
        disputed: true
        text: >-
          Historians dispute the weight of the Nazi green wing: Janet Biehl and Peter Staudenmaier (1995)
          argue its conservationism was substantial, while Frank Uekötter (2006) finds it marginal and
          opportunistic beside rearmament and war.
      - date: 1974
        text: >-
          Garrett Hardin's Lifeboat Ethics argues against food aid and immigration to rich countries on
          ecological grounds; the argument is later claimed by the ecofascist current, which Hardin did not belong to.
      - date: 2019
        text: >-
          The Christchurch gunman, who kills 51 Muslim worshippers, calls himself an eco-fascist in his
          manifesto; the El Paso gunman, who kills 23 people, most of them Latino, presents his attack as
          an act against immigration and environmental destruction.
      - date: 2019
        text: >-
          The Rassemblement National's European election campaign presents borders as the environment's
          best ally, an example of nationalist ecology entering a mainstream party, which rejects the
          ecofascist label.
    descendsFrom:
      - {id: fascism.nazism, event: "Darré's blood and soil agrarianism", date: 1930}
      - {id: ecology.neo-malthusian, event: "Population-bomb and lifeboat arguments recast as arguments about borders and race", date: 1974}
    breaksWith: []
    analysis:
      conditions: >-
        It grows as ecological breakdown becomes undeniable in the core while the options on offer are
        green growth, which has not stopped it, and redistribution, which the right rejects. If neither
        the profit system nor the transfer of resources from periphery to core is named, scarcity appears
        as too many people, and in the core that quickly comes to mean the wrong people arriving.
      class_base: >-
        Small, mostly young online milieus, with themes that reach landowning rural and small-proprietor
        constituencies who resent both environmental regulation and migrants. Core populations would keep
        their consumption; migrants and peripheral peoples would bear the cost.
      function: >-
        It prepares a response to climate breakdown in which the core keeps its consumption and its claim
        on the periphery's resources and on atmospheric space, closes its borders, and leaves the periphery
        to absorb the damage, the politics Christian Parenti (Tropic of Chaos, 2011) called the armed
        lifeboat. The rich countries account for most historical excess emissions (Hickel, 2020), so the
        program defends that appropriation by force.
      disputed: >-
        The Zetkin Collective and Andreas Malm (White Skin, Black Fuel, 2021) argue the far right today is
        mostly fossil-fuel denialist and ecofascism a minor current that may grow as denial fails; others
        see its logic already at work in mainstream border politics.
    keyTexts:
      - {author: Janet Biehl and Peter Staudenmaier, title: "Ecofascism: Lessons from the German Experience", year: 1995}
      - {author: Garrett Hardin, title: "Lifeboat Ethics: The Case Against Helping the Poor", year: 1974, note: "claimed by the current; Hardin was not a fascist"}
      - {author: Frank Uekötter, title: "The Green and the Brown: A History of Conservation in Nazi Germany", year: 2006}
      - {author: Zetkin Collective and Andreas Malm, title: "White Skin, Black Fuel: On the Danger of Fossil Fascism", year: 2021}
      - {author: Sam Moore and Alex Roberts, title: "The Rise of Ecofascism: Climate Change and the Far Right", year: 2022}
