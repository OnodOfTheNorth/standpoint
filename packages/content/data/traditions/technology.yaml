traditions:
  - id: technology.effective-altruism
    regions: [Britain, United States, worldwide]
    self: >-
      We ask a simple question and take the answer seriously: how can we do the most good with the time
      and money we have? Some charities are hundreds of times more effective than others; a few
      thousand dollars spent on malaria nets can save a life. Distance does not reduce a person's claim
      on us, and neither does species. So we give a large share of our incomes, choose careers for their
      impact, and use evidence and reasoning rather than sentiment to set priorities: global health and
      poverty, animal welfare, and the prevention of catastrophes such as pandemics and dangerous AI.
    record:
      - date: 2007–2009
        text: >-
          Holden Karnofsky and Elie Hassenfeld found GiveWell (2007) to rank charities by cost per life
          saved; Toby Ord and William MacAskill found Giving What We Can at Oxford (2009), whose members
          pledge at least ten percent of their income.
      - date: 2011
        text: >-
          The name "effective altruism" is adopted, and the Centre for Effective Altruism is formed in Oxford.
      - date: 2014–2017
        text: >-
          Open Philanthropy, funded by Dustin Moskovitz and Cari Tuna, becomes the movement's largest
          funder, giving to global health, farm animal welfare, biosecurity and AI safety; in November
          2025 it renames itself Coefficient Giving and courts other large donors.
      - date: 2010–2024
        text: >-
          Charities recommended by GiveWell, above all for malaria nets, preventive malaria medicine and
          vitamin A, receive over a billion dollars in donations directed by its rankings, most spent in
          sub-Saharan Africa.
      - date: 2022–2023
        disputed: true
        text: >-
          The crypto exchange FTX collapses in November 2022, and its founder Sam Bankman-Fried, the
          movement's best-known donor and an advocate of "earning to give", is convicted of fraud in 2023.
          Movement leaders say they were deceived; critics argue that its utilitarian reasoning and
          closeness to wealthy donors made such a case likely.
      - date: 2023
        disputed: true
        text: >-
          OpenAI's board, including members with ties to the movement, removes chief executive Sam Altman
          in November; he is reinstated within days. One reading sees safety-minded directors overridden by
          investors; another sees the movement overreaching into corporate governance.
    descendsFrom:
      - {id: liberalism.utilitarian, event: "Peter Singer's Famine, Affluence, and Morality", date: 1972}
    breaksWith: []
    analysis:
      conditions: >-
        It arose after 2008 among graduates of elite universities in Britain and the United States who
        could expect high incomes in finance and technology, at a time of large tech fortunes looking for
        philanthropic outlets and of new data on the cost-effectiveness of health interventions in poor
        countries. Utilitarian philosophy at Oxford gave it a method.
      class_base: >-
        Highly educated professionals and students in the core, tech and finance workers, and a handful
        of billionaire donors whose funding shapes its priorities.
      function: >-
        It moves real money to cheap health interventions in the periphery, which saves lives, while
        treating poverty as a problem of insufficient transfers rather than of the drain that produces
        it; its doctrine of earning to give legitimates high-income careers in finance and tech as ways
        of doing good. By the frame it softens the drain without touching its mechanisms; its growing
        share of AI-safety funding moves its weight toward the core's technology sector.
      disputed: >-
        Defenders (Singer, MacAskill) hold that effective giving is compatible with policy work and
        structural change; critics (Srinivasan, Crary) hold that its method excludes politics and power by design.
    keyTexts:
      - {author: Peter Singer, title: "Famine, Affluence, and Morality", year: 1972}
      - {author: Peter Singer, title: "The Life You Can Save", year: 2009}
      - {author: William MacAskill, title: "Doing Good Better: How Effective Altruism Can Help You Make a Difference", year: 2015}
      - {author: Peter Singer, title: "The Most Good You Can Do", year: 2015}

  - id: technology.longtermism
    regions: [Britain, United States]
    self: >-
      Future people count. If humanity survives and spreads, the vast majority of people who will ever
      live are not yet born, and their lives matter as much as ours. That makes positively influencing
      the long-term future a key moral priority of our time, and above all reducing the risk of
      catastrophes from which civilization could never recover: engineered pandemics, nuclear war and
      advanced AI that escapes human control. Climate change matters too. We are at a hinge of history,
      with technologies powerful enough to end the human story or to secure a vast future.
    record:
      - date: 2002–2003
        text: >-
          Nick Bostrom publishes "Existential Risks" (2002) and "Astronomical Waste" (2003), arguing that
          reducing the risk of human extinction outweighs almost any other good.
      - date: 2005
        text: >-
          The Future of Humanity Institute is founded at Oxford under Bostrom; the university closes it
          in April 2024.
      - date: 2012–2019
        text: >-
          The Centre for the Study of Existential Risk opens at Cambridge (2012); Hilary Greaves and William
          MacAskill's "The Case for Strong Longtermism" (2019) states the doctrine formally.
      - date: 2022
        text: >-
          MacAskill's What We Owe the Future becomes a bestseller; the FTX Future Fund, launched that year
          to fund longtermist causes, collapses with FTX in November.
      - date: 2023
        text: >-
          A one-sentence Statement on AI Risk, calling extinction risk from AI a global priority, is signed
          by heads of leading AI labs and many researchers; the British government hosts the first AI
          Safety Summit at Bletchley Park.
      - date: 2023–2024
        disputed: true
        text: >-
          Timnit Gebru and Émile Torres group longtermism with transhumanism and related currents as a
          "TESCREAL bundle" descended from twentieth-century eugenics. Longtermists reject the genealogy
          and point to their funding of pandemic preparedness and global health.
    descendsFrom:
      - {id: technology.effective-altruism, event: "Cause prioritization extended to the far future", date: 2017}
      - {id: technology.transhumanism, event: "Bostrom's work on existential risk", date: 2002}
    breaksWith: []
    analysis:
      conditions: >-
        It arose in the same Oxford and Bay Area milieu as effective altruism, as rapid progress in
        biotechnology and AI made catastrophic risks from technology concrete, and as technology fortunes
        sought causes on the scale of their wealth.
      class_base: >-
        Philosophers, researchers and policy professionals in the core, AI-lab staff, and a few very large
        donors from the technology and crypto sectors.
      function: >-
        It channels money and political attention to research institutes, AI safety teams and
        international risk governance, giving a small expert stratum and the frontier labs a central role
        in deciding how powerful technologies are governed. By weighing far-future people over present
        victims it moves resources away from compensation and development in the periphery, so its effect
        on the drain is none, and its emphasis on a few labs can entrench their position.
      disputed: >-
        Its defenders argue that pandemic preparedness and AI safety protect the poor most; critics
        (Gebru, Torres, Crary) argue that it hands the future to those who own today's technology.
    keyTexts:
      - {author: Derek Parfit, title: Reasons and Persons, year: 1984}
      - {author: Nick Bostrom, title: "Astronomical Waste: The Opportunity Cost of Delayed Technological Development", year: 2003}
      - {author: Toby Ord, title: "The Precipice: Existential Risk and the Future of Humanity", year: 2020}
      - {author: William MacAskill, title: What We Owe the Future, year: 2022}

  - id: technology.transhumanism
    regions: [United States, Britain, worldwide]
    self: >-
      Human nature is not the end of evolution but a work in progress. Aging, disease, limited
      intelligence and death are not sacred; they are problems, and science can address them. We affirm
      the right of every person to use technology to extend their healthy life, improve their mind and
      body, and become more than human if they choose: morphological freedom. We reject both state
      control of the human body and the bioconservative claim that our present form is a gift we may not
      improve. With reason, compassion and technology, our descendants, and perhaps we ourselves, can
      become posthuman.
    record:
      - date: 1957
        text: >-
          Julian Huxley, biologist and first director-general of UNESCO, coins "transhumanism" in an essay
          proposing that humanity transcend itself through science.
      - date: 1972
        text: >-
          The Alcor Life Extension Foundation is founded in California to preserve the bodies of the dead
          by freezing in hope of future revival.
      - date: 1988–1992
        text: >-
          Max More and Tom Morrow launch Extropy magazine (1988) and the Extropy Institute (1992), joining
          life extension and enhancement to libertarian politics.
      - date: 1998
        text: >-
          Nick Bostrom and David Pearce found the World Transhumanist Association, renamed Humanity+ in
          2008, and issue the Transhumanist Declaration.
      - date: 2016–2024
        text: >-
          Neuralink, founded in 2016, implants its first brain-computer interface in a human patient in
          2024; Ray Kurzweil's predictions of a "singularity" around 2045 circulate widely in Silicon Valley.
      - date: 1959–1962
        disputed: true
        text: >-
          Huxley serves as president of the British Eugenics Society. Critics see a continuous line from
          eugenics to transhumanism; transhumanists answer that voluntary individual enhancement is the
          opposite of state eugenics.
    descendsFrom:
      - {id: liberalism.classical, event: "Extropian principles of self-ownership extended to the body", date: 1988}
      - {id: liberalism.utilitarian, event: "Pearce's Hedonistic Imperative to abolish suffering", date: 1995}
    breaksWith: []
    analysis:
      conditions: >-
        It arose where rapid advances in computing, genetics and medicine met wealth seeking longer life:
        late twentieth-century California and Oxford, at the high tide of the information economy and the
        mapping of the human genome.
      class_base: >-
        Engineers, programmers, scientists and technology investors in the core, with a following among
        students and readers of science fiction; its leading funders are technology billionaires.
      function: >-
        It supplies an ideology for biotechnology, longevity and neurotechnology investment, whose
        products would reach first those who can pay, and frames the human body as a site for markets in
        improvement. Its effect on the drain is none directly; enhancement sold in markets would turn
        existing class advantage into biological advantage.
      disputed: >-
        Democratic transhumanists (Hughes) argue for public provision that would reduce inequality;
        bioconservatives and Marxist critics hold that under capital enhancement will be distributed by wealth.
    keyTexts:
      - {author: Julian Huxley, title: "Transhumanism", year: 1957}
      - {author: "FM-2030", title: "Are You a Transhuman?", year: 1989}
      - {author: Ray Kurzweil, title: "The Singularity Is Near: When Humans Transcend Biology", year: 2005}
      - {author: Nick Bostrom, title: "In Defense of Posthuman Dignity", year: 2005}
      - {author: Max More and Natasha Vita-More (eds.), title: The Transhumanist Reader, year: 2013}

  - id: technology.l-acc
    regions: [Britain, Western Europe, North America]
    self: >-
      The left has retreated into nostalgia, localism and protest: folk politics that cannot match the
      scale of global capital. We want the future back. Capitalism develops technology only where it
      pays, and holds back its power to free people from work. The task is not to smash the machines or
      return to small communities but to take hold of modern technology, platforms and planning tools and
      repurpose them for common ends. Our demands: full automation, a shorter working week, universal
      basic income, and an end to the work ethic, won by building a counter-hegemony with its own
      expertise, media and institutions.
    record:
      - date: 1971–1973
        text: >-
          Chile's Popular Unity government builds Project Cybersyn with Stafford Beer, a network for
          real-time planning of the nationalized economy; the current later claims it as a precursor.
      - date: 2013
        text: >-
          Alex Williams and Nick Srnicek publish "#Accelerate: Manifesto for an Accelerationist Politics",
          separating the acceleration of technology from the acceleration of capitalism.
      - date: 2014–2015
        text: >-
          The anthology #Accelerate (2014) gathers the current's sources; Inventing the Future (2015) sets
          out its program, and the collective Laboria Cuboniks publishes Xenofeminism.
      - date: 2019
        text: >-
          Aaron Bastani's Fully Automated Luxury Communism popularizes the vision; the British Labour Party
          promises to cut the average full-time working week to 32 hours within a decade, a demand the
          post-work left had campaigned for.
    descendsFrom:
      - {id: marxism.autonomism, event: "Reading of Marx's Fragment on Machines", date: 2013}
      - {id: technology.r-acc, event: "Goldsmiths symposium on accelerationism", date: 2010}
    breaksWith:
      - {id: technology.r-acc, event: "#Accelerate manifesto separates technology from capitalism", date: 2013}
    analysis:
      conditions: >-
        It arose in Britain after 2008, among young graduates facing precarious work and debt, as
        austerity discredited the center and the occupations and protests of 2011 failed to change
        policy. Automation and platform technology were visibly reshaping work, and the left seemed to have
        no vision of the future to offer.
      class_base: >-
        Young graduates, academics, cultural and technical workers in the core, many in insecure
        employment; its audience overlaps with the new left media and Labour's left wing.
      function: >-
        It gives the core left a program of post-work abundance that answers the right's monopoly on the
        future. Its demands, shorter hours and income guarantees, would shift productivity gains from
        profit to free time in the core; it says little about the periphery's mines and assembly lines on
        which automation depends, so its effect on the drain is none unless joined to them.
      disputed: >-
        Autonomists (Mueller) and ecosocialists argue technologies embody capitalist control and cannot
        simply be repurposed; left accelerationists answer that refusal leaves the future to capital.
    keyTexts:
      - {author: Alex Williams and Nick Srnicek, title: "#Accelerate: Manifesto for an Accelerationist Politics", year: 2013}
      - {author: Robin Mackay and Armen Avanessian (eds.), title: "#Accelerate: The Accelerationist Reader", year: 2014}
      - {author: Nick Srnicek and Alex Williams, title: "Inventing the Future: Postcapitalism and a World Without Work", year: 2015}
      - {author: Aaron Bastani, title: "Fully Automated Luxury Communism: A Manifesto", year: 2019}

  - id: technology.r-acc
    oneAuthor: >-
      Right accelerationism is Nick Land's body of work, from the Warwick CCRU texts to his neoreactionary
      turn; later writers either repeat him or, like the "unconditional accelerationists", form a different
      current, so the tradition has one thinker.
    regions: [Britain, China, online]
    self: >-
      Capital is not a system run by humans for human ends. It is an alien intelligence assembling itself
      out of markets, machines and code, dissolving every tradition, state and identity in its way. Every
      project of restraint, socialist planning, the welfare state, the regulation of AI, slows the process
      but cannot stop it, because whoever stops is overtaken. We do not mourn this or pretend to steer it.
      Thought should follow the process to its end: the meltdown of the human security system, and the
      arrival of something that will no longer need us.
    record:
      - date: 1995–2003
        text: >-
          The Cybernetic Culture Research Unit, led by Sadie Plant and Nick Land, operates at the
          University of Warwick and then outside it, producing writing that fuses cybernetics, Deleuze and
          Guattari, rave culture and occultism.
      - date: 1998
        text: >-
          Land leaves academic life; he later moves to Shanghai, where he writes on China, cities and
          capital.
      - date: 2010–2011
        text: >-
          Benjamin Noys names the current "accelerationism" (2010); Land's essays are collected as Fanged
          Noumena (2011), reviving interest among a new generation.
      - date: 2012
        text: >-
          Land's The Dark Enlightenment, drawing on Curtis Yarvin's writings as Mencius Moldbug, sets out
          neo-reaction: rule by a corporate sovereign and exit from liberal politics.
      - date: 2012–2017
        disputed: true
        text: >-
          Land's later writings on race and intelligence, including "hyper-racism", are read by critics
          as a turn to racial nationalism and by admirers as a philosophy of capital indifferent to any
          human group.
    descendsFrom: []
    breaksWith:
      - {id: marxism.western, event: "CCRU rejects critique and humanism for identification with capital's process", date: 1995}
    analysis:
      conditions: >-
        It arose in 1990s Britain, after the defeat of organized labor and the fall of the Soviet bloc,
        when global markets and the internet seemed to sweep everything before them and no political force
        appeared able to resist. A philosophy that identified with the winning process expressed the
        defeat of every project of collective control.
      class_base: >-
        A small milieu of philosophers, artists and online writers; through neo-reaction and e/acc its
        ideas reach technology investors and founders who seek justification for operating beyond
        democratic and state limits.
      function: >-
        It supplies an ideology in which the accumulation of capital and computing power is destiny and
        all regulation futile, which serves the most mobile capital against labor law, taxation and
        public ownership. Through neo-reaction it feeds projects of corporate sovereignty and exit. By the
        frame it sustains the drain.
      disputed: >-
        Some left readers (Mackay, Williams) treat Land as a diagnostician of capital whose insights can
        be turned to other ends; others (Noys) see the whole current as an aestheticized surrender to capital.
    keyTexts:
      - {author: Gilles Deleuze and Félix Guattari, title: "L'Anti-Œdipe", year: 1972}
      - {author: Jean-François Lyotard, title: Économie libidinale, year: 1974}
      - {author: Nick Land, title: "Fanged Noumena: Collected Writings 1987–2007", year: 2011}
      - {author: Nick Land, title: The Dark Enlightenment, year: 2012}

  - id: technology.e-acc
    regions: [United States, online]
    self: >-
      We believe in growth, technology and markets as the engines of human flourishing. Technology is how
      humanity has escaped poverty, disease and toil, and it is the only way to escape what remains. AI
      will be the most powerful tool ever built, and every delay in building it costs lives. Our enemy is
      deceleration: the precautionary bureaucrats, the doomers, the degrowthers and the regulators captured
      by incumbents. We want abundant energy, abundant intelligence and a civilization that keeps
      climbing the energy ladder, toward the stars. Accelerate.
    record:
      - date: 2022
        text: >-
          Pseudonymous writers "Beff Jezos" and "bayeslord" publish the principles of effective
          accelerationism (e/acc) online, presenting technological and economic growth as a thermodynamic
          imperative and opposing the AI-safety wing of effective altruism.
      - date: 2023
        text: >-
          Marc Andreessen, co-founder of the venture fund Andreessen Horowitz, publishes "Why AI Will Save
          the World" (June) and "The Techno-Optimist Manifesto" (October), which names effective
          accelerationism and lists Nick Land among its patron saints.
      - date: 2023
        text: >-
          Forbes identifies "Beff Jezos" as Guillaume Verdon, a former quantum computing engineer at Google
          who founded a hardware startup.
      - date: 2024
        text: >-
          Andreessen and Ben Horowitz announce their support for Donald Trump's presidential campaign,
          citing AI, crypto and technology regulation.
      - date: 2023–2025
        disputed: true
        text: >-
          After OpenAI's board briefly removed Sam Altman in November 2023, the episode is framed online as
          a victory of accelerationists over safety advocates. In January 2025 the new US administration
          revokes the previous AI executive order, and its July 2025 AI Action Plan calls for removing
          regulatory barriers to win the AI race. Supporters see e/acc ideas shaping policy; others see
          ordinary industry lobbying under a new name.
    descendsFrom:
      - {id: technology.r-acc, event: "Land's accelerationism recast as thermodynamic techno-capitalist optimism", date: 2022}
      - {id: technology.cyberlibertarian, event: "Silicon Valley's tradition of technology against the state", date: 2022}
    breaksWith:
      - {id: technology.effective-altruism, event: "e/acc defines itself against AI-safety advocates it calls decels", date: 2022}
    analysis:
      conditions: >-
        It arose in 2022–2023 when large language models made AI commercially central and the
        AI-safety movement pressed for licensing and pauses; investors and founders needed a public
        philosophy to answer it, at a time when higher interest rates and regulation threatened tech valuations.
      class_base: >-
        Venture capitalists, founders and engineers in the US technology sector, and a wider online
        following among young men in tech and crypto.
      function: >-
        It legitimates the removal of regulatory, labor and distributive limits on technology firms and
        their investors as a moral duty, and aligns the tech sector with political forces promising
        deregulation. The gains go to the owners of AI, chips and platforms; the costs fall on workers
        displaced or monitored by these systems and on the communities that supply minerals, data labor
        and energy. By the frame it sustains the drain.
      disputed: >-
        Some ecomodernist and abundance liberals share its pro-building stance while rejecting its
        politics; critics see it as an investors' ideology with no independent content.
    keyTexts:
      - {author: Marc Andreessen, title: "Why AI Will Save the World", year: 2023}
      - {author: Marc Andreessen, title: The Techno-Optimist Manifesto, year: 2023}
      - {author: David Deutsch, title: "The Beginning of Infinity: Explanations That Transform the World", year: 2011}

  - id: technology.technocracy
    regions: [United States, Canada, China]
    self: >-
      The price system is obsolete. A continent with modern machines could produce plenty for everyone,
      yet businessmen restrict output to keep prices up and politicians who understand nothing of
      engineering run public affairs. Production and distribution are technical problems. Measure them
      in physical units, energy above all, and let engineers and scientists manage them for the greatest
      output with the least waste. Replace money with energy certificates, replace politics with
      administration by competence, and abundance will follow.
    record:
      - date: 1919–1921
        text: >-
          Howard Scott and associates form the Technical Alliance in New York; Thorstein Veblen's The
          Engineers and the Price System (1921) calls for a "soviet of technicians" to run industry.
      - date: 1932–1933
        text: >-
          Technocracy becomes a national craze during the Depression after an Energy Survey of North
          America at Columbia University; the movement splits early in 1933 and Scott founds Technocracy
          Incorporated.
      - date: 1934
        text: >-
          Technocracy Inc. publishes its Technocracy Study Course, proposing energy accounting and a
          continental "Technate" run by functional departments; members wear grey uniforms and drive grey cars.
      - date: 1940–1943
        text: >-
          The Canadian government bans Technocracy Inc. under wartime regulations; the ban is lifted in 1943.
      - date: 2002–2012
        disputed: true
        text: >-
          Most members of the Standing Committee of China's Communist Party Politburo in these years are
          trained engineers. Some scholars call this technocratic rule; others note that the engineers ruled
          as party leaders, not as technicians replacing politics.
    descendsFrom: []
    breaksWith:
      - {id: liberalism.classical, event: "Veblen and the Technical Alliance reject the price system", date: 1921}
    analysis:
      conditions: >-
        It arose in the United States when mass production and electrification had raised productive
        capacity far beyond what the market could sell, and the Depression left factories idle while
        people went hungry. Engineers, newly numerous and confident, blamed the businessmen and the
        price system.
      class_base: >-
        Engineers, technicians and some professionals in North America; in its later broad sense,
        state planners and managers trained in science and engineering.
      function: >-
        The movement itself is marginal today, but its premise, that technical experts should govern
        society by measurement rather than politics, lives on in data-driven governance, central-bank
        independence and plans for AI-run administration. It displaces owners' control over output in
        theory, but in practice concentrates authority in managers and experts and excludes workers from
        decision; its effect on the drain is none.
      disputed: >-
        Marxists debate whether a planning stratum of engineers is a step toward socialism (as in
        Soviet and Chinese planning) or a new managerial class (Burnham, Djilas).
    keyTexts:
      - {author: Frederick Winslow Taylor, title: The Principles of Scientific Management, year: 1911}
      - {author: Thorstein Veblen, title: The Engineers and the Price System, year: 1921}
      - {author: "Technocracy, Inc.", title: Technocracy Study Course, year: 1934}

  - id: technology.cyberlibertarian
    regions: [United States, worldwide]
    self: >-
      The internet is the greatest tool for individual liberty ever built. Code crosses borders that
      governments cannot police, encryption lets anyone speak privately, and mathematics cannot be
      censored. Information wants to be free. Governments of the industrial world, you have no
      sovereignty where we gather. With strong cryptography and digital money no central bank can
      debase, people can trade, speak and organize without asking permission. Don't regulate the
      network; route around those who try. Build the tools, and the state's monopolies will erode by themselves.
    record:
      - date: 1990
        text: >-
          John Perry Barlow, Mitch Kapor and John Gilmore found the Electronic Frontier Foundation to defend
          civil liberties online.
      - date: 1988–1993
        text: >-
          Timothy May circulates The Crypto Anarchist Manifesto (1988); the Cypherpunks mailing list forms
          in 1992, and Eric Hughes writes "A Cypherpunk's Manifesto" (1993).
      - date: 1996
        text: >-
          Barlow publishes "A Declaration of the Independence of Cyberspace" in response to the US
          Communications Decency Act, whose Section 230 shields online platforms from liability for users' posts.
      - date: 2008–2009
        text: >-
          A person or group writing as Satoshi Nakamoto publishes the Bitcoin white paper (2008) and launches
          the network (2009).
      - date: 2013
        text: >-
          US authorities shut down Silk Road, a darknet market using bitcoin; its founder Ross Ulbricht is
          sentenced to life in prison in 2015; President Trump pardons him in January 2025.
      - date: 2021–2025
        disputed: true
        text: >-
          El Salvador makes bitcoin legal tender in 2021; in January 2025, under an
          IMF loan agreement, it makes acceptance voluntary. Supporters credit bitcoin with tourism and
          investment; critics point to low everyday use and fiscal risk.
    descendsFrom:
      - {id: libertarianism.ancap, event: "Crypto-anarchy and the cypherpunks", date: 1988}
    breaksWith: []
    analysis:
      conditions: >-
        It arose in 1990s California as the internet was privatized and commercialized, among engineers
        and entrepreneurs who joined the counterculture's distrust of authority to the free-market
        enthusiasm of the Reagan era, a fusion Barbrook and Cameron called "the Californian Ideology".
      class_base: >-
        Programmers, technology entrepreneurs and early investors, crypto holders, and online communities
        hostile to state regulation; in the periphery, some savers seeking escape from inflation and capital controls.
      function: >-
        It defends the technology sector against regulation, taxation and liability, which let a handful
        of platforms grow into monopolies the founders never imagined. Crypto offers some people in the
        periphery a hedge against weak currencies, but also exposes them to volatility and fraud. Its
        effect on the drain is none; it extends the market into money and information.
      disputed: >-
        Some anarchists and dissidents value its tools as real protection against state surveillance;
        critics (Golumbia, Winner) see it as an industry ideology that strengthened corporate power.
    keyTexts:
      - {author: Timothy C. May, title: The Crypto Anarchist Manifesto, year: 1988}
      - {author: Eric Hughes, title: "A Cypherpunk's Manifesto", year: 1993}
      - {author: "Esther Dyson, George Gilder, George Keyworth and Alvin Toffler", title: "Cyberspace and the American Dream: A Magna Carta for the Knowledge Age", year: 1994}
      - {author: John Perry Barlow, title: A Declaration of the Independence of Cyberspace, year: 1996}
      - {author: Satoshi Nakamoto, title: "Bitcoin: A Peer-to-Peer Electronic Cash System", year: 2008}
