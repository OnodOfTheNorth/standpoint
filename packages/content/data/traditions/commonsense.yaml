# Common-sense formations: political outlooks held by people who belong to no school.
# Each `self` is in the voice of an ordinary holder, not a theorist.
traditions:
  - id: commonsense.anti-politics
    regions: [worldwide]
    self: >
      I'm not left or right; I'm fed up. They're all the same. They come round before the
      election with promises, then you never see them again until the next one, and meanwhile
      they've given jobs to their cousins and voted themselves a pay rise. I work, I pay my taxes,
      I don't ask for much. What I want is honest people who do what they say, and if there aren't
      any, then throw the lot of them out and let someone ordinary have a go. Politics is a
      business, and we're the customers who never get a refund.
    record:
      - date: 1946
        text: >
          In Italy the Fronte dell'Uomo Qualunque (Common Man's Front), built around Guglielmo
          Giannini's weekly paper, wins 5.3 percent and 30 seats in the Constituent Assembly on a
          program of hostility to all parties; it dissolves within a few years.
      - date: 1956
        text: >
          In France Pierre Poujade's shopkeepers' tax revolt, campaigning under the slogan "Sortez
          les sortants" (throw out the incumbents), wins 52 seats in the National Assembly. Among
          its deputies is the young Jean-Marie Le Pen.
      - date: 1990
        text: >
          In Peru Alberto Fujimori, an agronomist with no party career, defeats the novelist Mario
          Vargas Llosa for the presidency; in 1992 he closes Congress and the courts with army
          backing, a move polls at the time showed most Peruvians supported.
      - date: 2001
        text: >
          In Argentina, amid a bank freeze and default, crowds banging pots chant "¡Que se vayan
          todos!" (all of them must go). President De la Rúa resigns on 20 December, and the
          presidency changes hands four more times in under two weeks.
      - date: 2013
        text: >
          Italy's Five Star Movement, founded by the comedian Beppe Grillo in 2009 on a platform of
          contempt for the established parties, wins about a quarter of the vote and becomes the
          largest single list in the Chamber of Deputies.
      - date: 2019
        text: >
          In Lebanon the October protests against a tax on messaging calls take up the slogan
          "kellon yaani kellon" (all of them means all of them), aimed at every sectarian party
          leader; Prime Minister Saad Hariri resigns within two weeks.
      - date: 2019
        text: >
          In Ukraine the comedian Volodymyr Zelensky, best known for playing a schoolteacher who
          becomes president in a television series, wins the presidency with 73 percent in the
          runoff.
    analysis:
      conditions: >
        It spreads where parties of different labels govern alike, where office is a route to
        private gain, and where the decline of mass parties and unions has cut ordinary people off
        from any political body they belong to. Each wave above followed a crisis in which every
        established party was implicated: postwar purges, colonial war and inflation, debt default,
        bank collapse.
      class_base: >
        It is strongest among small proprietors, the self-employed and unorganized workers,
        people who pay taxes directly, depend on no party patronage and belong to no union, and
        who experience the state mainly as a collector and an inspector.
      function: >
        It withdraws consent from the political class without supplying an alternative
        organization, so it can be captured by whoever claims to stand outside politics: a wealthy
        outsider, a comedian, a general, or a neighborhood assembly. Its anger at personal
        corruption leaves untouched the interests politicians serve, and the abstention it breeds
        leaves organized money as the most constant participant in public life.
      disputed: >
        Some Marxists read it, following Gramsci on common sense, as a healthy kernel of class
        distrust to be developed; others read it as a disposition that has historically fed
        Bonapartist and right-populist movements more often than left ones.
    keyTexts:
      - {author: Colin Hay, title: Why We Hate Politics, year: 2007}
      - {author: Peter Mair, title: "Ruling the Void: The Hollowing of Western Democracy", year: 2013}
      - {author: Marina Sitrin, title: "Horizontalism: Voices of Popular Power in Argentina", year: 2006}

  - id: commonsense.self-reliance
    regions: [worldwide]
    self: >
      Nobody owes you a living. My parents came with nothing, worked two jobs, saved every coin and
      sent us to school, and now I run my own shop. If you get up early, keep your word, stay off
      the drink and put a bit by, you'll get somewhere. I don't want handouts and I don't want the
      government in my business. Help yourself first, help your family, and then you can help
      others. People who blame the system for everything are just waiting for someone to rescue
      them.
    record:
      - date: 1859–1871
        text: >
          Samuel Smiles's Self-Help, opening with "Heaven helps those who help themselves", becomes
          a bestseller in Britain; Nakamura Masanao's Japanese translation of 1871 becomes one of the
          most widely read books of the Meiji era.
      - date: 1955
        text: >
          Singapore's Central Provident Fund begins as a compulsory individual savings scheme; after
          independence the governing party makes individual accounts, rather than tax-funded
          benefits, the core of social security, and its leaders repeatedly reject a "welfare
          state".
      - date: 1980
        text: >
          Britain's Housing Act gives council tenants the right to buy their homes at a discount;
          over the next two decades well over a million homes are sold, and the stock of social
          housing is not replaced.
      - date: 1986
        text: >
          Hernando de Soto's The Other Path presents Peru's street vendors and informal builders as
          entrepreneurs held back by red tape; it shapes land-titling programs in Peru and World
          Bank policy across the South.
      - date: 1996
        text: >
          In the United States, the Personal Responsibility and Work Opportunity Reconciliation Act
          replaces cash welfare with time-limited assistance conditioned on work.
      - date: 2006–2010
        text: >
          Muhammad Yunus and the Grameen Bank receive the Nobel Peace Prize for microcredit to the
          poor as entrepreneurs; in 2010 a debt crisis among microfinance borrowers in Andhra
          Pradesh, India, leads to emergency regulation. The state government linked aggressive
          loan collection to a wave of borrower suicides; the microfinance industry disputed the
          link and blamed political interference.
        disputed: true
    analysis:
      conditions: >
        It grows wherever people can rise by effort within their lifetime, in booms, in frontier
        and migrant economies, in families climbing out of the peasantry, and survives long after
        the conditions that made it true have narrowed. It is renewed wherever public provision is
        thin and families must rely on their own savings.
      class_base: >
        Small proprietors, the self-employed, independent farmers, upwardly mobile migrants and
        workers who own their homes; it is also held by many wage workers who take pride in never
        having asked for help.
      function: >
        It honors real effort and thrift, and it explains outcomes by individual conduct, which
        makes low wages and unemployment look like personal failings; this lowers the political cost
        of cutting benefits and weakening unions. Policies sold in its name, such as the sale of
        public housing and work-conditioned welfare, move risks from the state and employers onto
        households.
    keyTexts:
      - {author: Benjamin Franklin, title: The Way to Wealth, year: 1758}
      - {author: Samuel Smiles, title: Self-Help, year: 1859}
      - {author: Hernando de Soto, title: The Other Path, year: 1986}

  - id: commonsense.declinist
    regions: [worldwide]
    self: >
      This country used to be something. When I was young you could leave your door unlocked, a
      man with one wage could keep a family, the factory was hiring, people went to church and
      respected their elders. Look at it now. Shops boarded up, drugs, kids who don't know their
      own history, and the people at the top couldn't care less. I'm not saying the old days were
      perfect, but they were better, and anyone who lived through both will tell you so. Somebody
      ought to bring it back.
    record:
      - date: 1918
        text: >
          Oswald Spengler's The Decline of the West, which presents civilizations as organisms that
          grow, age and die, becomes a bestseller in defeated Germany and gives intellectual form to
          a widespread sense of decline.
      - date: 2005
        text: >
          Russian President Vladimir Putin calls the collapse of the Soviet Union "the greatest
          geopolitical catastrophe of the century"; Levada Center polls through the 2010s find
          majorities of Russians regretting the collapse, about two-thirds in 2018.
      - date: 2016
        text: >
          Britain votes 51.9 percent to leave the European Union under the slogan "Take back
          control", and Donald Trump wins the US presidency under "Make America Great Again"; both
          campaigns promise the return of a lost national greatness and run strongest in
          deindustrialized towns.
      - date: 2018
        text: >
          Jair Bolsonaro, who had for years praised Brazil's 1964–1985 military government, wins the
          Brazilian presidency on promises of order, family and national restoration.
      - date: 2022
        text: >
          Ferdinand Marcos Jr. wins the Philippine presidency with about 59 percent, after years of
          social media campaigns presenting his father's rule (1965–1986), including martial law, as
          a golden age of order and building. Historians and survivors of martial law reject that
          account.
        disputed: true
    analysis:
      conditions: >
        It is fed by real losses: deindustrialization, the collapse of the Soviet economy, the
        dismantling of public enterprises, rising insecurity, the decay of towns and of the
        institutions (unions, parishes, clubs) that once organized life. Memory then turns the
        period before the loss into a golden age, usually omitting who was excluded from it.
      class_base: >
        Older workers and pensioners in declining regions, small proprietors squeezed by chains and
        imports, and former public employees; in the periphery, people who lived through structural
        adjustment or the collapse of a developmental state.
      function: >
        It names real damage but locates the cause in moral decay, outsiders or betrayal, and
        directs the wish for restoration toward leaders who promise to bring back the past. That
        leaves the causes of the loss, capital moving to cheaper labor and the privatization of
        public wealth, to be managed by the same interests; where the lost past was a public
        economy, the same nostalgia can fuel demands to rebuild it.
    keyTexts:
      - {author: Oswald Spengler, title: The Decline of the West, year: 1918}
      - {author: Svetlana Boym, title: The Future of Nostalgia, year: 2001}
      - {author: Arlie Russell Hochschild, title: Strangers in Their Own Land, year: 2016}

  - id: commonsense.live-and-let-live
    regions: [worldwide]
    self: >
      Live and let live, that's my motto. What my neighbor does in his own house is his business,
      as long as he isn't hurting anybody. I don't need the government, the priest or the
      activists telling me how to live, and I won't tell them. Some things I'd never do myself, but
      that's me. People get too worked up about other people's lives. Mind your own, be polite,
      pay your way, and leave everyone else in peace.
    record:
      - date: 1933
        text: >
          The United States repeals national Prohibition through the Twenty-first Amendment, after
          more than a decade of mass defiance of the ban on alcohol.
      - date: 1957–1967
        text: >
          Britain's Wolfenden Report holds that private morality is "not the law's business" and
          recommends decriminalizing homosexual acts between consenting adults in private; the
          Sexual Offences Act of 1967 does so for men over 21 in England and Wales.
      - date: 1976
        text: >
          The Netherlands revises its Opium Act and adopts a policy of tolerating small-scale sale
          and use of cannabis, the basis of its coffeeshops.
      - date: 2012
        text: >
          Voters in Colorado and Washington approve the legal sale of cannabis to adults by ballot
          initiative, the first US states to do so.
      - date: 2015
        text: >
          Ireland becomes the first country to legalize same-sex marriage by popular vote, with 62
          percent in favor.
      - date: 2018–2019
        text: >
          Taiwanese voters reject changing the Civil Code's definition of marriage by referendum;
          the legislature then legalizes same-sex marriage in 2019 through a separate statute, a
          compromise between private tolerance and public reluctance.
    analysis:
      conditions: >
        It spreads with urban life, wage work and mobility, which loosen the grip of village,
        church and family over individual conduct, and with long experience of the costs of
        enforcing private morality by law. It is also the working ethic of mixed neighborhoods and
        workplaces, where getting along requires not interfering.
      class_base: >
        Broad and cross-class: urban workers, salaried professionals, small proprietors and many
        rural people who distrust officials; it is the default outlook of people who want to be left
        alone more than they want any program.
      function: >
        It has won real protections of private life against police, church and state. Extended
        from private conduct to economic life, it becomes a case for leaving property and markets
        alone, which favors those who own; its distaste for conflict also discourages the
        collective action that people without property need to defend their livelihoods.
    keyTexts:
      - {author: John Stuart Mill, title: On Liberty, year: 1859}
      - {author: Committee on Homosexual Offences and Prostitution, title: Report of the Committee on Homosexual Offences and Prostitution (Wolfenden Report), year: 1957}

  - id: commonsense.rigged
    regions: [worldwide]
    self: >
      The game is rigged. The rich write the rules, the politicians sign them, and the rest of us
      pay. When the banks crashed they got billions; when I missed two payments they took my car.
      The big companies pay less tax than I do. The cops arrest the kid with a bag of weed and
      never the man who stole a pension fund. I don't need a professor to tell me this. You can see
      it every day if you open your eyes. Things won't change until ordinary people stop putting up
      with it.
    record:
      - date: 1892
        text: >
          The US People's Party adopts the Omaha Platform, declaring that "the fruits of the toil of
          millions are boldly stolen to build up colossal fortunes for a few", and calls for public
          ownership of railroads and a graduated income tax.
      - date: 1934
        text: >
          Louisiana senator Huey Long launches the Share Our Wealth society, promising to cap
          fortunes and guarantee every family a homestead and income; it claims millions of members
          within a year.
      - date: 2011
        text: >
          Occupy Wall Street begins in New York in September under the slogan "We are the 99
          percent" and spreads to hundreds of cities worldwide.
      - date: 2016
        text: >
          The Panama Papers leak exposes offshore holdings of politicians and business leaders in
          dozens of countries; Iceland's prime minister resigns. In the same year both Bernie
          Sanders and Donald Trump campaign against a "rigged" economy and political system.
      - date: 2019–2020
        text: >
          In Chile a metro fare rise sets off mass protests under the slogan "No son 30 pesos, son 30
          años" (it's not 30 pesos, it's 30 years); in 2020 about 78 percent vote to replace the
          constitution written under the military government.
      - date: 2024
        text: >
          In Kenya young protesters organized online oppose a finance bill raising taxes on bread,
          fuel and mobile money to meet lender targets; after protesters break into parliament and
          police kill dozens, the president withdraws the bill.
    analysis:
      conditions: >
        It spreads where inequality is visible and the rules plainly bend for the rich: bank
        bailouts beside foreclosures, tax havens beside wage taxes, impunity for executives beside
        mass incarceration of the poor. Each wave above followed a moment when the bending became
        public.
      class_base: >
        Wage workers, indebted households, small farmers and traders, and the young without
        prospects, across left and right; it unites people who differ on everything else.
      function: >
        It turns a sense of unfairness into suspicion of the powerful and can drive unions, tax
        campaigns, constitutional change and antitrust. Because it frames the problem as cheating, it
        can also be satisfied by punishing particular cheats, or captured by a wealthy outsider who
        promises to unrig the game, or turned toward hidden-cabal explanations that name ethnic or
        religious scapegoats.
      disputed: >
        Marxists divide on whether "rigged" talk is a first step to class consciousness or a trap
        that implies a fair capitalism to be restored.
    keyTexts:
      - {author: Joseph E. Stiglitz, title: The Price of Inequality, year: 2012}
      - {author: Martin Gilens and Benjamin I. Page, title: "Testing Theories of American Politics: Elites, Interest Groups, and Average Citizens", year: 2014}
      - {author: Michael Kazin, title: The Populist Persuasion, year: 1995}

  - id: commonsense.look-after-your-own
    regions: [worldwide]
    self: >
      You look after your own. Family first, then your street, your town, your people. Nobody else
      is going to do it; the government certainly won't. When times are hard there's only so much
      to go round, and it's only fair that those who were here, who built the place and paid in,
      come first. I've got nothing against anyone. But charity begins at home, and a man who lets
      his own go short to help strangers isn't a saint; he's a fool.
    record:
      - date: 1966
        text: >
          Bal Thackeray founds the Shiv Sena in Bombay on a "sons of the soil" platform demanding
          jobs for Marathi speakers over migrants from South India; the movement later governs
          Maharashtra and the city.
      - date: 1968
        text: >
          After Enoch Powell's "Rivers of Blood" speech against Commonwealth immigration, London
          dockers and Smithfield meat porters march in his support.
      - date: 1983
        text: >
          Nigeria's government, amid falling oil revenue, orders undocumented West African migrants
          to leave within weeks; about a million or more, mostly Ghanaians, are expelled.
      - date: 2008
        text: >
          Attacks on foreign nationals spread across South African townships in May, with residents
          accusing migrants of taking jobs and houses; 62 people are killed and tens of thousands
          displaced.
      - date: 2009
        text: >
          Wildcat strikes spread from the Lindsey oil refinery across British construction sites
          against the use of contractors employing Italian and Portuguese workers, under the slogan
          "British jobs for British workers".
    analysis:
      conditions: >
        It is strongest where the means of life are scarce and insecure and no public institution
        guarantees them, so that family, kin and nation are the only reliable supports, and where
        employers or governments draw new labor from outside at lower wages. Each episode above
        followed a slump, a housing shortage or the arrival of cheaper labor.
      class_base: >
        Workers in insecure jobs, the unemployed, small proprietors and residents of poor
        neighborhoods competing for housing and services; it is also held by propertied families
        who pass wealth to their own.
      function: >
        It defends real, local solidarity among people who have only each other, and it can win
        protections for those already inside. Drawn at the border of family, ethnicity or
        citizenship, it divides workers who share employers and landlords, so that anger at
        shortage lands on the newcomer instead of on those who control jobs and housing, and
        migrants without full rights become cheaper labor for employers.
      disputed: >
        Some materialists treat it as economic-corporate consciousness that can grow into class
        solidarity through common struggle; others stress that, organized around nation or kin, it
        has repeatedly been the social base of chauvinist and fascist movements.
    keyTexts:
      - {author: Edward C. Banfield, title: The Moral Basis of a Backward Society, year: 1958}
      - {author: Arlie Russell Hochschild, title: Strangers in Their Own Land, year: 2016}
      - {author: David Goodhart, title: The Road to Somewhere, year: 2017}
