traditions:
  - id: socdem.revisionist
    regions: [Germany, Central Europe]
    self: >
      Capitalism is not collapsing, the middle strata are not vanishing, and the workers are not
      growing poorer. The movement is everything; the final goal, as a fixed endpoint, is nothing.
      Socialism will come not through catastrophe and a seizure of power but through the steady
      extension of democracy into the economy: universal suffrage, trade unions, cooperatives,
      municipal enterprise and labor law, won step by step. Social democracy should have the courage
      to appear as what it already is in practice, a democratic socialist party of reform, and to
      ground its aims in ethics rather than in a dialectic of history.
    record:
      - date: 1899–1903
        text: >
          After Bernstein's articles and his book The Preconditions of Socialism, the SPD congresses
          at Hanover (1899) and Dresden (1903) formally condemn revisionism, while the party's unions
          and parliamentary practice remain reformist.
      - date: 1907
        text: >
          At the International Socialist Congress in Stuttgart, a committee majority including
          Bernstein, David and van Kol proposes that socialists may support a "socialist colonial
          policy"; the plenary rejects it by 127 votes to 108.
      - date: 1914
        text: >
          The SPD's Reichstag group votes for war credits on 4 August; Bernstein votes with the
          group, then turns against the war and joins the anti-war USPD in 1917.
      - date: 1918–1919
        disputed: true
        text: >
          SPD leaders Ebert, Scheidemann and Noske head the new republic, reach an agreement with
          the army command, and use army and Freikorps units to crush the Spartacist rising in
          January 1919; Freikorps officers murder Luxemburg and Liebknecht. The SPD reading: it
          defended a parliamentary republic against a minority uprising and civil war. The communist
          reading: it saved the officer corps and capital from a workers' revolution.
      - date: 1918–1920
        text: >
          The Stinnes–Legien agreement brings union recognition and the eight-hour day, and the
          Works Councils Act of 1920 gives workers' councils limited rights in firms.
      - date: 1959
        text: >
          The SPD's Bad Godesberg program drops Marxism and accepts the market economy:
          "competition as far as possible, planning as far as necessary."
    descendsFrom:
      - {id: marxism.classical, event: "Bernstein's articles in Die Neue Zeit after Engels's death", date: 1896}
    breaksWith:
      - {id: marxism.classical, event: "Revisionism controversy; Luxemburg's Reform or Revolution", date: 1899}
      - {id: marxism.leninism, event: "German revolution and the founding of the KPD", date: 1918}
    analysis:
      conditions: >
        It arose in the German boom of the 1890s, after the long depression, when real wages were
        rising and the SPD was legal again after 1890. The party and unions now had treasuries,
        buildings, newspapers and paid officials, and their members had improving wages: stakes in
        legality and in gradual gains. Theory caught up with a practice that was already reformist.
      class_base: >
        Skilled, organized male workers in German industry, union officials, party functionaries,
        cooperative managers, and in the south smallholding farmers courted by David's agrarian
        program.
      function: >
        The tradition ended formally at Bad Godesberg, but its method, reform within capitalism
        through the parliamentary state, became the common sense of all later social democracy. Its
        openness to a "socialist colonial policy" in 1907 shows the link openly: wage gains for
        organized workers in an imperial power were compatible with, and partly financed by, empire.
      disputed: >
        Lenin and Engels traced reformism to a labor aristocracy fed by imperial superprofits; other
        Marxists attribute it mainly to union bureaucracy and the stability of legal institutions,
        whatever the source of the surplus.
    keyTexts:
      - {author: Eduard Bernstein, title: "The Preconditions of Socialism (Evolutionary Socialism)", year: 1899}
      - {author: Eduard David, title: Sozialismus und Landwirtschaft, year: 1903}

  - id: socdem.fabian
    regions: [Britain, India, British Commonwealth]
    self: >
      Socialism will come not by barricades but by the inevitability of gradualness: patient
      research, persuasion of every party, and the steady extension of public ownership and public
      administration through democratic means. We investigate the facts of poverty, draft the
      reform, and permeate those who hold power until the reform becomes common sense. Municipal gas
      and water, a national minimum of wages, health and education, pensions for the old, and the
      common ownership of the means of production: these are won by experts serving an informed
      electorate, one measured step after another.
    record:
      - date: 1884–1895
        text: >
          The Fabian Society is founded in London (1884), publishes Fabian Essays in Socialism
          (1889), and the Webbs found the London School of Economics (1895).
      - date: 1900
        text: >
          The Society is a founding affiliate of the Labour Representation Committee. The same
          year, Shaw's Fabianism and the Empire endorses imperial administration, and the Society
          declines to oppose the Boer War.
      - date: 1909
        text: >
          Beatrice Webb's Minority Report to the Royal Commission on the Poor Laws proposes
          replacing the workhouse with public services for health, unemployment and old age, a
          blueprint for the later welfare state. Leading Fabians, including the Webbs and Shaw, also
          endorse eugenics in these years, as much of the British reform establishment did.
      - date: 1918
        text: >
          Sidney Webb drafts the Labour Party constitution, including Clause IV's commitment to
          common ownership of the means of production.
      - date: 1935
        disputed: true
        text: >
          The Webbs publish Soviet Communism: A New Civilisation?, praising Soviet planning
          during the years of collectivization and famine. Admirers read it as an investigation of a
          new economic system; critics read it as apologetics that ignored repression and famine.
      - date: 1945–1951
        text: >
          A large share of the Labour MPs elected in 1945 are Fabian members; the Attlee government
          carries out much of the Fabian program of nationalization and social insurance.
    descendsFrom:
      - {id: liberalism.utilitarian, event: "Fabians adapt Benthamite administrative reform and J. S. Mill's late socialism", date: 1884}
    breaksWith:
      - {id: marxism.classical, event: "Fabian Essays adopt Jevons's marginal utility theory in place of Marx's labor theory of value", date: 1889}
    analysis:
      conditions: >
        It arose in 1880s London, amid surveys revealing mass poverty, the extension of the franchise
        in 1884, a growing salaried professional stratum, and expanding municipal government, in a
        country whose Treasury drew on a world empire. Reformers who had expertise but no mass base
        sought influence through administrative skill and access to whoever governed.
      class_base: >
        Salaried professionals, civil servants, academics and journalists; later Labour's
        intellectual and policy wing.
      function: >
        The Society remains a Labour think tank that drafts reforms within the Treasury's budget
        rules, mediating between the labor movement and the state; its model delivers public services
        designed and managed from above. Fabian planning ideas, taken home by colonial students at
        the LSE, shaped postcolonial planning in India and elsewhere. Its early stance on empire paired
        reform at home with administration of empire abroad.
    keyTexts:
      - {author: George Bernard Shaw (ed.), title: Fabian Essays in Socialism, year: 1889}
      - {author: Sidney Webb and Beatrice Webb, title: Industrial Democracy, year: 1897}
      - {author: Sidney Webb and Beatrice Webb, title: "The Break-Up of the Poor Law: Being Part One of the Minority Report of the Poor Law Commission", year: 1909}
      - {author: R. H. Tawney, title: Equality, year: 1931}

  - id: socdem.labourism
    regions: [Britain, Australia, New Zealand, Ireland, Caribbean]
    self: >
      We are the political arm of the trade unions: working people sending their own into
      Parliament to get a fair deal for the people who do the work. Not theory but decent wages,
      safe jobs, a roof over every head, a pension, a health service free at the point of use, and
      the right to organize. We win by the ballot box and the bargaining table, and we keep faith
      with the communities, chapels, clubs and pits that built us. Change comes when the movement
      holds together and its leaders never forget where they came from.
    record:
      - date: 1900–1906
        text: >
          After the Taff Vale judgment (1901) makes unions liable for strike damages, unions back the
          Labour Representation Committee, which becomes the Labour Party in 1906; the Trade
          Disputes Act of 1906 restores union immunity.
      - date: 1901–1907
        text: >
          In Australia, Labor supports the Immigration Restriction Act (1901), the basis of the
          White Australia policy; Chris Watson leads the first national labor government (1904); the
          Harvester Judgment (1907) sets a basic wage to support a family.
      - date: 1926
        text: >
          The Trades Union Congress calls off the General Strike after nine days; the miners fight on
          alone and are defeated months later.
      - date: 1931
        text: >
          Prime Minister Ramsay MacDonald, facing demands for cuts to unemployment benefit, forms a
          National Government with Conservatives and Liberals and is expelled from Labour.
      - date: 1945–1951
        text: >
          The Attlee government creates the National Health Service (1948), nationalizes coal,
          rail, electricity and steel, and grants independence to India and Pakistan (1947); it
          also decides in secret to build a British atomic bomb (1947) and wages counterinsurgency
          in Malaya from 1948.
      - date: 1984–1985
        text: >
          During the miners' strike, Labour leader Neil Kinnock declines full support because the
          union held no national ballot; the strike ends in defeat and pit closures follow.
    descendsFrom:
      - {id: liberalism.classical, event: "Lib-Lab trade union MPs sit as Liberals", date: 1874}
    breaksWith:
      - {id: liberalism.social, event: "Labour's 1918 constitution and independent challenge displace the Liberal Party", date: 1918}
    analysis:
      conditions: >
        It formed in Britain and the settler dominions, with large organized industrial workforces,
        early legal unions, parliamentary routes opened by franchise extension, and imperial
        prosperity. Unions whose bargaining power was threatened in the courts (Taff Vale) bought
        political representation to protect it.
      class_base: >
        Unionized manual workers (miners, railway, engineering, docks) and union officials; later
        public-sector workers and urban professionals.
      function: >
        In office it delivers wage and service gains to workers in its own country while
        administering the state within fiscal rules and the Western security alliance. Those gains
        rest partly on returns from British and Australian capital abroad and on the order that
        protects them. White Australia shows the older mechanism plainly: wages were protected by
        excluding Asian and Pacific workers.
      disputed: >
        Marxists in Lenin's line explain labourism by a labor aristocracy sharing imperial surplus;
        Miliband (Parliamentary Socialism) explains it by commitment to parliamentary procedure
        itself.
    keyTexts:
      - {author: Labour Party, title: Labour and the New Social Order, year: 1918}
      - {author: Clement Attlee, title: The Labour Party in Perspective, year: 1937}
      - {author: Labour Party, title: "Let Us Face the Future", year: 1945}

  - id: socdem.keynesian
    regions: [Western Europe, North America, Australasia]
    self: >
      Unemployment is not a law of nature or a moral failing; it is a failure of demand that
      governments can and must cure. Markets left alone can settle at mass idleness, as the 1930s
      proved. A state that manages total spending, runs deficits in slumps, invests in public works
      and housing, and backs a strong welfare state and free collective bargaining can sustain full
      employment and rising wages in a mixed economy. Capitalism tamed, not abolished: the
      euthanasia of the rentier, the socialization of investment where needed, and prosperity
      shared through the democratic state.
    record:
      - date: 1936
        text: >
          Keynes publishes The General Theory of Employment, Interest and Money, arguing that
          economies can remain at high unemployment without government management of demand.
      - date: 1944
        text: >
          At Bretton Woods, Keynes's plan for an international clearing union that would have
          pressed surplus countries as well as deficit countries to adjust is set aside for the US
          plan; the IMF and World Bank are founded with voting weighted by capital subscription.
      - date: 1944–1973
        text: >
          Britain's 1944 White Paper commits government to a "high and stable level of employment";
          across Western Europe unemployment stays low for about three decades of high growth.
      - date: 1976
        text: >
          Britain takes an IMF loan with spending cuts attached, and Prime Minister Callaghan tells
          the Labour conference that governments can no longer spend their way out of recession.
      - date: 2008–2010
        text: >
          Governments return to fiscal stimulus after the financial crash (the G20 London summit,
          2009), then turn to austerity from 2010.
    descendsFrom:
      - {id: liberalism.social, event: "Keynes, a Liberal economist, turns the New Liberal case for state action into a theory of effective demand", date: 1936}
    breaksWith:
      - {id: liberalism.classical, event: "Rejection of Say's law and the Treasury view of balanced budgets", date: 1936}
    analysis:
      conditions: >
        It arose from the mass unemployment of the 1930s and became policy after 1945 under strong
        unions, Soviet competition, and a US-led monetary order with capital controls. Capital
        accepted full employment and high wages as the price of stability while the threat of
        communism and labor militancy was high, and while rapid growth and cheap oil and raw
        materials from the periphery, whose terms of trade were falling, made the bargain affordable.
      class_base: >
        Unionized industrial workers in the core, public-sector employees, economists and
        administrators, and fractions of industrial capital producing for domestic mass markets.
      function: >
        It survives as the left case for stimulus and public investment, including green investment
        programs. Demand management works where a state controls its currency and capital flows;
        under free capital mobility, bond markets punish deficits, as in 1976 and 1983. Its program
        raises demand and wages within the core and has no account of the unequal exchange with
        the periphery that cheapened core imports during its golden age.
      disputed: >
        Kalecki (1943) predicted that business would turn against full employment because it erodes
        workplace discipline; post-Keynesians and Marxists still dispute whether the 1970s crisis
        was a wage squeeze on profits or a falling rate of profit.
    keyTexts:
      - {author: John Maynard Keynes, title: "The General Theory of Employment, Interest and Money", year: 1936}
      - {author: William Beveridge, title: Full Employment in a Free Society, year: 1944}
      - {author: Anthony Crosland, title: The Future of Socialism, year: 1956}

  - id: socdem.nordic
    regions: [Sweden, Norway, Denmark, Finland]
    self: >
      We built the people's home, a society where no one is a stepchild and care is a right, not
      charity. Strong unions and employers bargain centrally; solidaristic wage policy gives equal
      pay for equal work across firms and pushes capital toward the most productive jobs; active
      labor market policy retrains those displaced. Universal welfare paid for by everyone's taxes
      binds the middle class to the system. Open trade and competitive firms fund it. We are
      reformists by conviction: a labor movement governing for decades through the democratic
      state can tame capitalism and give working people security and dignity.
    record:
      - date: 1932–1933
        text: >
          The Swedish Social Democrats under Per Albin Hansson take office and strike a deal with
          the Farmers' League: public works and crisis employment policy in exchange for
          agricultural price support.
      - date: 1934–1976
        text: >
          Under sterilization laws passed and administered largely by Social Democratic governments,
          about 63,000 people in Sweden are sterilized, many under pressure, on eugenic and social
          grounds; Norway, Denmark and Finland run similar programs.
      - date: 1938
        text: >
          The Saltsjöbaden Agreement between the LO union confederation and the employers'
          federation sets the rules of central bargaining with little state involvement.
      - date: 1951
        text: >
          LO economists Gösta Rehn and Rudolf Meidner present the model of solidaristic wages,
          restrictive fiscal policy and active labor market policy.
      - date: 1976–1991
        disputed: true
        text: >
          LO adopts Meidner's plan for wage-earner funds that would gradually transfer ownership of
          large firms to union-controlled funds; after an employers' demonstration of some 75,000 in
          1983, a much reduced version is enacted and then abolished in 1991–92. Supporters saw a
          road to economic democracy blocked by capital; opponents saw socialization by stealth that
          threatened investment.
      - date: 1990–1994
        text: >
          After a banking crisis, governments of both blocs cut spending, reform pensions, make the
          central bank independent, and open schools and care services to private providers paid by
          public vouchers.
      - date: 2022
        text: >
          Sweden's Social Democratic government applies to join NATO, ending two centuries of
          military non-alignment, alongside Finland.
    descendsFrom:
      - {id: socdem.revisionist, event: "Branting leads the first Social Democratic government in Sweden", date: 1920}
    breaksWith:
      - {id: marxism.leninism, event: "Left wing leaves the Swedish Social Democratic Party, later forming the Communist Party", date: 1917}
    analysis:
      conditions: >
        It arose in small export economies built on iron, timber and engineering, with high union
        density, a farming class that allied with labor, and close integration into world trade
        (Sweden sold iron ore to both sides in the Second World War). Central bargaining in the
        export sector required wage restraint compatible with competitiveness, which unions traded
        for full employment and universal welfare.
      class_base: >
        Industrial workers in LO, white-collar and public-sector unions (with many women in public
        care work), and historically farmers; export capital, notably the Wallenberg group, as the
        bargaining partner.
      function: >
        The welfare states remain, but services are increasingly run by private firms for profit
        under public financing. High living standards rest partly on the global reach of Nordic
        firms whose supply chains run through low-wage countries (garments from Bangladesh, mining
        inputs), on North Sea oil, and on Norway's sovereign fund, invested worldwide, so welfare at
        home and unequal exchange abroad coexist. Sweden is among the largest arms exporters per
        head.
      disputed: >
        Nordic social democrats argue the model rests on productivity, trust and bargaining, not on
        transfers from the periphery; drain analysts (Hickel and co-authors) argue that core
        consumption embodies net appropriation of Southern labor and resources, the Nordic states
        included.
    keyTexts:
      - {author: Gösta Rehn and Rudolf Meidner (LO), title: Trade Unions and Full Employment, year: 1951}
      - {author: Rudolf Meidner, title: "Employee Investment Funds: An Approach to Collective Capital Formation", year: 1978}
      - {author: Walter Korpi, title: The Democratic Class Struggle, year: 1983}
      - {author: Gøsta Esping-Andersen, title: The Three Worlds of Welfare Capitalism, year: 1990}

  - id: socdem.post-keynesian
    regions: [Britain, United States, Italy, Australia, Latin America]
    self: >
      Keynes's revolution was stopped halfway. The textbooks turned it into a story of sticky wages inside
      a self-correcting market; we took it to its end. Output is set by effective demand, and investment
      drives saving, not the other way round. Money is created by bank lending when firms and households
      borrow, so it cannot be fixed by a central bank rule. The split between wages and profits is a
      matter of power and pricing, not of the marginal product of a "quantity of capital" that cannot be
      measured. Finance makes capitalism unstable from within. A state that issues its own currency can
      and should guarantee full employment, limited by real resources and inflation, not by its budget.
    record:
      - date: 1956
        text: >
          Joan Robinson publishes The Accumulation of Capital, extending Keynes's theory of demand to
          growth and distribution over the long run, drawing on Marx and Kalecki.
      - date: 1960–1966
        text: >
          In the Cambridge capital controversy Robinson, Sraffa and their colleagues show that capital
          goods cannot be summed into one quantity independent of the profit rate; in 1966 Paul Samuelson
          concedes in "A Summing Up" that reswitching can occur.
      - date: 1962
        disputed: true
        text: >
          A budget drafted with Nicholas Kaldor for Cheddi Jagan's government in British Guiana sets off a
          general strike and riots in Georgetown. Jagan's supporters held that the opposition was organized
          with American and British backing against an elected socialist government; opponents held that
          the taxes fell on wage earners and the opposition was popular.
      - date: 1978
        text: >
          Paul Davidson and Sidney Weintraub found the Journal of Post Keynesian Economics in the United
          States, giving the current its name and a forum outside the main journals.
      - date: 2008
        text: >
          After the financial crash commentators widely describe it as a "Minsky moment," after Hyman
          Minsky's theory that stable periods breed the debt that produces crashes.
      - date: 2016–2020
        text: >
          Stephanie Kelton advises Bernie Sanders's campaigns, and Modern Monetary Theory, a branch of the
          current, enters public debate in the United States.
    descendsFrom:
      - {id: socdem.keynesian, event: "Keynes's Cambridge circle, with Kalecki, carries the General Theory to growth and distribution", date: 1956}
    breaksWith:
      - {id: liberalism.social, event: "Rejection of the neoclassical synthesis of Samuelson and Hicks", date: 1960}
    analysis:
      conditions: >
        It arose in Cambridge, England, as postwar growth under capital controls and strong unions made
        full employment ordinary, and as American economics absorbed Keynes into marginalist price theory.
        It gained its name and institutions in the 1970s when monetarism displaced Keynesian policy, and
        returned to public view when the debt-led growth of the 1990s and 2000s ended in the 2008 crash.
      class_base: >
        Academic economists outside the leading departments, some union and labor-party economists,
        financial-market analysts drawn to Minsky, and since 2008 activists of the American and British
        left looking for a case for public spending. It has no mass base of its own; its program speaks
        for wage earners and for capital producing for domestic demand against finance and rentiers.
      function: >
        It supplies the left wing of social democracy with an account of demand, money and finance and a
        case for full employment through public spending and a job guarantee. Its monetary sovereignty
        argument holds for issuers of reserve currencies; a peripheral country that must import in
        dollars meets its limit in the balance of payments, so the program, applied in the core, leaves
        the currency hierarchy and the drain that sustains core demand in place unless joined to controls
        on trade and capital.
      disputed: >
        Marxists answer that post-Keynesians treat the profit rate as a matter of distribution and policy
        and miss the compulsion to accumulate; post-Keynesians answer that the Marxist falling rate of
        profit has no stable empirical basis. Economists of the periphery (Prabhat Patnaik, Fadhel Kaboub)
        press the point that monetary sovereignty is a privilege of the core.
    keyTexts:
      - {author: Michał Kalecki, title: "Political Aspects of Full Employment", year: 1943}
      - {author: Joan Robinson, title: "The Accumulation of Capital", year: 1956}
      - {author: Piero Sraffa, title: "Production of Commodities by Means of Commodities", year: 1960}
      - {author: Hyman P. Minsky, title: "Stabilizing an Unstable Economy", year: 1986}
      - {author: Stephanie Kelton, title: "The Deficit Myth", year: 2020}

  - id: socdem.third-way
    regions: [Britain, United States, Germany, Brazil]
    self: >
      The old left defended the state and the new right worshipped the market; both failed.
      Globalization, the knowledge economy and individual aspiration are facts, not choices. We keep
      social democracy's values of opportunity, responsibility and community and modernize its means.
      No rights without responsibilities. Welfare should be a springboard, not a safety net: invest in
      education, skills and childcare, make work pay, and equip people to compete in a global
      economy. Fiscal prudence and stable markets make social justice affordable. What matters is
      what works.
    record:
      - date: 1993–1999
        text: >
          The Clinton administration signs NAFTA (1993), replaces the main federal cash welfare
          program with time-limited assistance tied to work (1996), and signs the law removing the
          separation of commercial and investment banking (1999).
      - date: 1995–1997
        text: >
          Tony Blair rewrites Clause IV of Labour's constitution, dropping common ownership; in
          office from 1997 his government makes the Bank of England independent and introduces a
          national minimum wage (1998).
      - date: 1995–2002
        text: >
          In Brazil, Fernando Henrique Cardoso, a former dependency theorist, governs with the
          Real plan, privatizations of mining, telecommunications and banks, and IMF-backed
          stabilization.
      - date: 1999–2003
        text: >
          Third Way governments join NATO's bombing of Yugoslavia (1999, Germany's first combat
          deployment since 1945); Blair's government joins the US invasion of Iraq (2003).
      - date: 2003–2005
        text: >
          Gerhard Schröder's SPD–Green government enacts Agenda 2010 and the Hartz reforms, cutting
          long-term unemployment benefits and expanding low-wage "mini-jobs".
      - date: 1997–2010
        disputed: true
        text: >
          Under New Labour, relative child and pensioner poverty fall measurably through tax credits
          and spending on health and schools, while income at the very top rises fastest. Supporters
          cite the poverty figures; critics cite wage subsidies to low-paying employers and a growth
          model resting on the City of London.
    descendsFrom:
      - {id: socdem.labourism, event: "Blair rewrites Clause IV", date: 1995}
      - {id: liberalism.social, event: "Revival of social-liberal themes of opportunity and responsibility", date: 1994}
    breaksWith:
      - {id: socdem.keynesian, event: "Demand management and public ownership give way to supply-side policy", date: 1995}
    analysis:
      conditions: >
        It followed the defeats of labor parties from 1979 to 1992, deindustrialization, the
        lifting of capital controls, financialization in Britain and the United States, and the
        Soviet collapse that removed the external threat that had disciplined capital. With capital
        free to leave and unions weakened, parties seeking office competed for the confidence of
        finance and the votes of suburban professionals.
      class_base: >
        The professional-managerial strata, city voters tied to finance and services, donors from
        finance and technology, and a residual union base with nowhere else to go.
      function: >
        It governed within neoliberal fiscal and trade rules, using growth in finance to fund
        targeted transfers and services. Tax credits topped up low wages, which subsidized employers
        who paid them. Its governments promoted NAFTA, WTO rules and IMF conditionality and joined
        wars, so the gains to its voters came within an order that maintained the flow of value from
        the periphery to the core.
      disputed: >
        Defenders point to falls in poverty and rises in public service spending; Marxist and left
        social democratic critics (Hall, "The Great Moving Nowhere Show", 1998) call it the
        consolidation of Thatcherism.
    keyTexts:
      - {author: Peter Mandelson and Roger Liddle, title: "The Blair Revolution: Can New Labour Deliver?", year: 1996}
      - {author: Anthony Giddens, title: "The Third Way: The Renewal of Social Democracy", year: 1998}
      - {author: Tony Blair and Gerhard Schröder, title: "Europe: The Third Way / Die Neue Mitte", year: 1999}

  - id: socdem.democratic-socialism
    regions: [Europe, Latin America, Caribbean, North America]
    self: >
      Socialism means democracy carried all the way: into the workplace, the economy and the
      distribution of wealth, not only into parliament. We seek a society where the commanding heights
      are in public and social ownership, where workers have a real voice, and where production
      serves need, reached through elections, mass movements and unions, never through one-party
      rule. We reject capitalism's rule of property and the Soviet road that sacrificed liberty to
      the plan. Reforms matter, but we want more than a kinder capitalism: we want to change who
      owns and who decides.
    record:
      - date: 1951
        text: >
          The refounded Socialist International's Frankfurt Declaration defines democratic socialism
          against both capitalism and Soviet communism.
      - date: 1970–1973
        disputed: true
        text: >
          Salvador Allende's Popular Unity government in Chile nationalizes copper by a unanimous
          vote of Congress (1971), accelerates land reform and takes over banks and large firms; it is
          overthrown by a military coup on 11 September 1973 in which Allende dies. The US had funded
          the opposition and squeezed Chile's credit (documented by the Church Committee, 1975); how
          far Washington took part in planning the coup itself is disputed. The opposition-controlled
          Chamber of Deputies had resolved in August 1973 that the government was acting outside the
          constitution; supporters say the resolution prepared the coup.
      - date: 1972–1980
        disputed: true
        text: >
          Michael Manley's government in Jamaica raises the levy on bauxite exports, sets a minimum
          wage and expands literacy and housing, then breaks with the IMF; it loses the 1980 election
          amid violence that kills about 800. Manley accused the US of destabilization; Washington
          denied it.
      - date: 1981–1983
        text: >
          François Mitterrand's government nationalizes 36 banks and major industrial groups, then
          turns to austerity in 1983 under pressure on the franc.
      - date: 2015
        text: >
          Greece's Syriza government calls a referendum on creditor terms; 61 percent vote no, and
          the government signs a third memorandum with harsher terms days later.
      - date: 2015–2020
        text: >
          Jeremy Corbyn leads the British Labour Party, winning 40 percent of the vote in 2017 and
          losing heavily in 2019; Bernie Sanders's presidential campaigns (2016, 2020) bring
          democratic socialism into US politics.
    descendsFrom:
      - {id: socdem.revisionist, event: "Frankfurt Declaration of the refounded Socialist International", date: 1951}
    breaksWith:
      - {id: marxism.ml, event: "Frankfurt Declaration condemns Soviet communism", date: 1951}
      - {id: socdem.third-way, event: "Corbyn's election as Labour leader repudiates New Labour", date: 2015}
    analysis:
      conditions: >
        It took its postwar form as socialist parties with Marxist roots, in countries with universal
        suffrage and strong unions, defined themselves against the Soviet model during the Cold War.
        In the periphery it arose in export economies (copper, bauxite) where elections opened a
        path to office for parties of workers and the poor. Elections can win office without
        delivering control of capital, credit, the army or foreign markets.
      class_base: >
        Organized workers, public-sector employees, students and the intelligentsia; in Chile and
        Jamaica also miners, the urban poor and peasants. Its recent core revival draws on young
        graduates carrying debt and paying high rents, whose education no longer leads to property
        and who therefore want housing, health and education taken out of the market.
      function: >
        When democratic socialists have moved against property by elected means (Chile, Jamaica,
        France, Greece), capital flight, credit cutoffs, external pressure and in Chile a coup
        followed, and the outcomes were overthrow, electoral defeat or retreat. In the core it
        defends public services and unions and pushes the center-left; on imperial questions its
        representatives are divided, some opposing wars and others voting for military budgets.
      disputed: >
        Leninists and Chile's MIR argued Popular Unity fell because it left the old state and army
        intact; democratic socialists and Berlinguer drew the lesson that a far broader majority was
        needed; others stress external intervention above both.
    keyTexts:
      - {author: Socialist International, title: "Aims and Tasks of Democratic Socialism (Frankfurt Declaration)", year: 1951}
      - {author: Salvador Allende, title: "First Message to the Congress", year: 1971}
      - {author: Michael Harrington, title: Socialism, year: 1972}
      - {author: Tony Benn, title: Arguments for Socialism, year: 1979}

  - id: socdem.left-populism
    regions: [Spain, France, Argentina, Latin America]
    self: >
      Politics is not the administration of consensus; it is the construction of a people.
      Neoliberalism hollowed out popular sovereignty and handed decisions to experts, markets and
      Brussels, leaving the majority voiceless. Its crisis opens a populist moment, and the question
      is whether the right builds a people against immigrants or we build one against the oligarchy.
      We link scattered demands for housing, wages, dignity, the planet and women's equality into a
      chain of equivalence around shared symbols and leaders, drawing a frontier between those below
      and those above, and we radicalize democracy through its institutions, not against them.
    record:
      - date: 2003–2015
        text: >
          Ernesto Laclau theorizes and publicly defends the Kirchner governments in Argentina as a
          populist reconstruction of the national-popular camp.
      - date: 2014–2015
        text: >
          Podemos, founded in January 2014 by Pablo Iglesias, Íñigo Errejón and others from the 15-M
          protest milieu, wins five European Parliament seats within months and about 20 percent of
          the vote with allied lists in the December 2015 general election.
      - date: 2020–2023
        disputed: true
        text: >
          Unidas Podemos governs Spain in coalition with the PSOE; the monthly minimum wage rises
          from €736 in 2018 to €1,080 in 2023, and a 2021 labor reform restricts temporary contracts.
          Supporters cite these gains; critics on the left note that the coalition accepted EU fiscal
          rules and NATO commitments and that Podemos later fractured into Sumar and a rump.
      - date: 2016–2024
        text: >
          Jean-Luc Mélenchon's La France Insoumise, founded in 2016, takes 19.6 percent (2017) and
          22 percent (2022) in the first round of the presidential election, and leads the New
          Popular Front that becomes the largest bloc in the 2024 legislative election.
    descendsFrom:
      - {id: marxism.gramscian, event: "Laclau and Mouffe rework Gramsci's hegemony without a privileged class agent", date: 1985}
      - {id: nationalism.peronism, event: "Laclau's formation in the Argentine national left", date: "1960s"}
    breaksWith:
      - {id: marxism.classical, event: "Hegemony and Socialist Strategy rejects the working class as the necessary agent of socialism", date: 1985}
    analysis:
      conditions: >
        Its European form grew from post-2008 austerity in southern Europe, youth unemployment above
        50 percent in Spain in 2013, the 15-M squares of 2011, and the collapse of trust in
        center-left parties that administered cuts; Latin American governments of the 2000s supplied
        the model. When the main parties converge on austerity, a discourse opposing the people to
        the elite can gather scattered discontent.
      class_base: >
        University-educated young people in precarious jobs, downwardly mobile middle strata and
        urban renters; weaker among industrial workers and rural voters.
      function: >
        It competes with right populism for the same discontent. In government it has delivered wage
        floors and labor protections while staying within EU fiscal rules and NATO, because a
        discursive frontier without changes in ownership leaves capital's position intact, so its
        gains depend on coalition arithmetic and can be reversed by the next government.
      disputed: >
        Marxists argue that dissolving class into "the people" erases the question of who owns
        what; left populists answer that class identity never forms spontaneously and must be
        built politically.
    keyTexts:
      - {author: Ernesto Laclau and Chantal Mouffe, title: "Hegemony and Socialist Strategy", year: 1985}
      - {author: Ernesto Laclau, title: On Populist Reason, year: 2005}
      - {author: Íñigo Errejón and Chantal Mouffe, title: "Podemos: In the Name of the People", year: 2016}
      - {author: Chantal Mouffe, title: For a Left Populism, year: 2018}
