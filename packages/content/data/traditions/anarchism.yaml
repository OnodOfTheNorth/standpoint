traditions:
  - id: anarchism.communist
    regions: [Southern Europe, Russia and Ukraine, Río de la Plata, East Asia, worldwide]
    self: >
      We want a society without state, capital or wage: land, tools and the product held in
      common, each contributing according to ability and taking according to need. Not a plan
      imposed from above but a federation of free communes, workplaces and associations built
      from below by mutual aid, the same cooperation that has carried every social species
      through hard times. We refuse to seize the state, because any machine of command, whoever
      drives it, breeds a new ruling minority. The means are the ends in embryo: direct action,
      free agreement and solidarity now, not after the revolution.
    record:
      - date: 1876
        text: >
          The Italian Federation of the First International (Cafiero, Malatesta, Covelli) moves
          from collective ownership of the means of production to common ownership of the product
          as well; the Jura Federation adopts the position in 1880.
      - date: 1905
        text: >
          The Argentine Regional Workers' Federation (FORA), then the largest labor body in Latin
          America, resolves at its fifth congress to propagate the principles of anarchist
          communism among its members.
      - date: 1918–1921
        disputed: true
        text: >
          The Makhnovist movement in southern Ukraine distributes landlord estates, convenes free
          congresses of peasants and workers, and fields an insurgent army that fights Denikin and
          Wrangel, at times alongside the Red Army, until the Red Army destroys it in 1921.
          Bolshevik accounts called it kulak banditry responsible for pogroms; anarchist accounts
          and later historians note that Makhno's forces executed the pogromist ataman Grigoriev,
          punished antisemitic violence in their ranks and had Jewish commanders.
      - date: 1929–1931
        disputed: true
        text: >
          The Korean Anarchist Federation in Manchuria organizes the Korean People's Association in
          Manchuria, a self-administered zone of Korean emigrant farmers around Shinmin, ended by
          assassinations and the Japanese invasion of 1931. Some historians treat it as an anarchist
          territory; others as an emigrant self-government in which anarchists held influence.
      - date: 1936–1938
        disputed: true
        text: >
          After the CNT's Zaragoza congress adopts libertarian communism as its program (May
          1936), hundreds of rural collectives form in Aragon, many abolishing money in favor of
          local vouchers, until the Republican government dissolves the Council of Aragon in August
          1937. Libertarian historians (Leval) describe voluntary collectives that raised output;
          others (Bolloten, Casanova) document pressure from militia columns on reluctant
          smallholders.
    descendsFrom:
      - {id: anarchism.mutualist, event: "Bakuninist collectivists defeat the Proudhonists on collective land ownership at the Basel Congress of the International", date: 1869}
    breaksWith:
      - {id: marxism.classical, event: "Expulsion of Bakunin and Guillaume from the First International at the Hague Congress", date: 1872}
    analysis:
      conditions: >
        It took shape where capitalism penetrated agrarian and artisan societies that had no usable
        parliamentary channel: Italy, Spain, Russia, Argentina, Korea and Japan. To peasants with
        memories of common land and to artisans losing their workshops, the state arrived as tax
        collector, conscription officer and rural police for the landlord, so the state and not
        only the employer presented itself as the enemy, and the village commune supplied the
        model of the alternative.
      class_base: >
        Historically skilled artisans defending workshop autonomy, landless day laborers in
        Andalusia and southern Italy, immigrant workers in Buenos Aires and the United States, and
        sections of the peasantry. Today it recruits mainly among students, precarious service
        workers and downwardly mobile educated youth in core cities: groups with little stake in
        existing institutions and no leverage through elections.
      function: >
        In the present it organizes in the gaps the state leaves: mutual aid and disaster relief
        networks, squats, tenant and anti-eviction groups, anti-fascist mobilization. These meet
        needs and train organizers, and the movement supplies forms (assemblies, affinity groups)
        to wider protest waves. Because it refuses state power, it has rarely held territory
        against an organized state or capital for long; where it did (Ukraine 1919, Aragon 1936)
        it built armies and coercive bodies that its own doctrine had no name for. It opposes
        militarism and empire in principle, but it rejects the sovereign states of the periphery
        too, so it offers no program for a poor country trying to control its own resources.
      disputed: >
        Lenin (The State and Revolution) held that refusing to take and transform state power
        leaves the old state standing; anarchists and council communists reply that the Soviet
        record shows a captured state producing a new ruling stratum.
    keyTexts:
      - {author: Peter Kropotkin, title: The Conquest of Bread, year: 1892}
      - {author: Peter Kropotkin, title: "Mutual Aid: A Factor of Evolution", year: 1902}
      - {author: Errico Malatesta, title: Anarchy, year: 1891}
      - {author: Alexander Berkman, title: "Now and After: The ABC of Communist Anarchism", year: 1929}

  - id: anarchism.syndicalist
    regions: [Spain, France, Italy, Sweden, Latin America, worldwide]
    self: >
      The union is both the weapon of today and the cell of tomorrow. We organize workers by
      industry, without paid bureaucrats or political parties, and fight by direct action: the
      strike, the boycott, the go-slow, the occupation. Every struggle for bread trains the class to
      run production itself. The revolutionary general strike will expropriate the owners, and the
      same federations of workplace and local unions that won it will coordinate the economy
      afterwards. Parliament turns militants into managers of other people's exploitation. The
      emancipation of the workers must be the work of the workers themselves.
    record:
      - date: 1906
        text: >
          The French CGT adopts the Charter of Amiens, declaring the union independent of all
          parties and naming the general strike as the means of expropriating capital.
      - date: 1919
        text: >
          The CNT's 44-day strike at the Barcelona power company La Canadiense shuts down most of
          the city's electricity and industry; the government decrees the eight-hour day for all
          sectors in April 1919, among the first in the world.
      - date: 1922
        text: >
          Syndicalist unions from Europe and Latin America found the International Workers'
          Association in Berlin, rejecting the Moscow-led Red International of Labour Unions.
      - date: 1936
        text: >
          In July CNT militants and workers defeat the military uprising in Barcelona; unions take
          over factories, transport, utilities and services across Catalonia, later recognized by
          the Generalitat's collectivization decree of October 1936.
      - date: 1936
        disputed: true
        text: >
          In November four CNT members (García Oliver, Montseny, Peiró, López) join Largo
          Caballero's Republican government. The CNT leadership defended this as the price of
          antifascist unity and arms; the Friends of Durruti and many rank-and-file militants saw
          it as abandoning the revolution to the Republican state.
      - date: 1937
        disputed: true
        text: >
          In the May Days in Barcelona, government police try to seize the CNT-held telephone
          exchange; several days of street fighting between CNT and POUM workers and government and
          PSUC forces leave hundreds dead. The CNT leaders call for a ceasefire; afterwards the POUM
          is banned and collectives are rolled back. Communists described it as a putsch by
          uncontrolled elements endangering the war; anarchists and the POUM as a Stalinist
          counter-revolution.
    descendsFrom:
      - {id: anarchism.communist, event: "Anarchists enter the unions after the failure of propaganda by the deed; Pelloutier leads the Bourses du Travail", date: 1895}
    breaksWith:
      - {id: marxism.classical, event: "Charter of Amiens declares union independence from the socialist party", date: 1906}
      - {id: marxism.leninism, event: "Founding of the IWA against the Comintern's Red International of Labour Unions", date: 1922}
    analysis:
      conditions: >
        It grew between the 1890s and 1930s where industry concentrated workers in sizable
        workplaces while the political system offered them nothing: in Spain, rotating
        governments and rigged rural elections under local bosses; in France and Italy, socialist
        parties absorbed in electoral routine while troops broke strikes. Where the vote was
        useless, the strike was the lever, because withdrawing labor stops profit at its source.
      class_base: >
        Textile, metal, transport and building workers in medium-sized industry, dockers, and
        agricultural laborers in Andalusia; in the Americas, migrant and seasonal workers. Today it
        is a small current of service, logistics and precarious workers organized in unions such as
        the CNT and CGT in Spain, SAC in Sweden and USI in Italy.
      function: >
        Its unions keep alive a model of bargaining without full-time officials and of direct
        action against individual employers, which wins concrete cases for workers that larger
        unions ignore. Its workplace-centered strategy fits poorly with dispersed service work and
        with supply chains whose production sits in the periphery, where a core strike stops only
        part of the chain. The Spanish record showed that running an economy at war required
        functions of a state, which the movement exercised under other names and then ceded to the
        Republican government.
      disputed: >
        Trotsky and the Friends of Durruti argued the CNT held power in Barcelona in July 1936 and
        declined to take it; syndicalists reply that the union federation was the organ of power
        and the error was entering the government, not refusing to form one.
    keyTexts:
      - {author: Rudolf Rocker, title: "Anarcho-Syndicalism: Theory and Practice", year: 1938}
      - {author: Émile Pataud and Émile Pouget, title: "How We Shall Bring About the Revolution", year: 1909}
      - {author: Diego Abad de Santillán, title: "El organismo económico de la revolución", year: 1936}

  - id: anarchism.platformist
    regions: [South America, France, Ireland, South Africa, worldwide]
    self: >
      Anarchism lost in Russia and Ukraine not because its ideas were wrong but because it was
      disorganized. We build specific anarchist political organizations with theoretical unity,
      tactical unity, collective responsibility and federalism, so that anarchists act as an
      organized minority inside mass movements of workers, tenants, peasants and neighborhoods,
      without commanding them. Especifismo, developed in South America, names the method: the
      political organization and the social movement are distinct levels. Our task is to push
      popular movements toward direct participation, combativeness and independence from parties
      and the state, never to substitute for them.
    record:
      - date: 1926
        text: >
          The Dielo Truda group of exiled Makhnovist veterans in Paris (Makhno, Arshinov, Mett and
          others) publishes the Organizational Platform of the General Union of Anarchists. Voline,
          Faure and Malatesta reject its collective responsibility as authoritarian.
      - date: 1954–1957
        disputed: true
        text: >
          Georges Fontenis's Libertarian Communist Federation in France supports Algerian
          independence; its newspaper is seized repeatedly and members prosecuted until the group
          collapses. Synthesist anarchists charge that a secret internal faction had turned it into
          a Leninist-style party; defenders say discipline was what let it act under wartime
          repression.
      - date: 1956
        text: >
          The Uruguayan Anarchist Federation (FAU) is founded. In the late 1960s it builds a
          worker-student front (ROE) and an armed wing (OPR-33) that carries out kidnappings and
          expropriations; it is largely destroyed by arrests, torture and disappearances under the
          military government of 1973–1985.
      - date: 2003
        text: >
          The Rio de Janeiro Anarchist Federation (FARJ) is founded and, with other Brazilian
          groups, systematizes especifismo; South Africa's Zabalaza Anarchist Communist Front forms
          in the same year and works in township movements.
      - date: 2005
        text: >
          Platformist and especifista organizations from several continents form the Anarkismo
          network.
    descendsFrom:
      - {id: anarchism.communist, event: "Makhnovist exiles draw lessons from the defeat in Ukraine", date: 1926}
    breaksWith:
      - {id: anarchism.communist, event: "Platform controversy: synthesist anarchists reject collective responsibility", date: 1927}
    analysis:
      conditions: >
        It arose from defeat: the Bolsheviks' disciplined party had outfought a dispersed anarchist
        movement in 1917–1921, and anarchists competing with Leninist parties for influence over
        mass movements concluded they had to match their organization. Its South American form grew
        under military governments in Uruguay and Brazil, where open mass work was dangerous and a
        tight organization was a condition of survival.
      class_base: >
        Cadres drawn from students, teachers, union activists and community organizers, working in
        movements of informal workers, favela and township residents, landless rural workers and
        public-sector unions, mostly in South America and southern Africa.
      function: >
        It operates as a disciplined minority inside social movements, competing with left parties
        and NGOs for their direction. Where those movements win against evictions, privatization or
        austerity, local value stays local, which matters most in the periphery where the groups are
        strongest. The federations themselves stay small, and their influence depends on the
        movements they work in.
      disputed: >
        Synthesist and insurrectionary anarchists call it a party in all but name; Leninists call it
        a vanguard that will not admit it is one.
    keyTexts:
      - {author: Dielo Truda group, title: "Organizational Platform of the General Union of Anarchists (Draft)", year: 1926}
      - {author: Georges Fontenis, title: Manifesto of Libertarian Communism, year: 1953}
      - {author: Federação Anarquista do Rio de Janeiro, title: "Anarquismo Social e Organização", year: 2008}
      - {author: Michael Schmidt and Lucien van der Walt, title: "Black Flame: The Revolutionary Class Politics of Anarchism and Syndicalism", year: 2009}

  - id: anarchism.insurrectionary
    regions: [Italy, Greece, Chile, Mexico, France]
    self: >
      We do not wait for the masses, the organization or the right conditions. Every formal
      organization, permanent federation and union becomes a mediator that bargains with power and
      disciplines revolt. We act now, in small informal affinity groups bound by trust, attacking the
      structures of domination directly and spreading revolt by example. Insurrection is not the
      seizure of power but the breaking of social peace, the moment when people stop delegating
      their lives. Permanent conflict, autonomy, no negotiation and no demands: a demand asks the
      enemy to grant what we can take.
    record:
      - date: 1877
        text: >
          Cafiero, Malatesta and a band of about thirty enter villages in the Matese mountains near
          Benevento, burn the land and tax registers and declare the king deposed; troops capture
          them within days.
      - date: 1881
        text: >
          The International Social Revolutionary Congress in London endorses propaganda by the
          deed.
      - date: 1892–1900
        text: >
          A wave of bombings and assassinations: Vaillant's bomb in the French Chamber of Deputies
          (1893), Henry's bomb at the Café Terminus (1894), Caserio's killing of President Carnot
          (1894), and Bresci's killing of King Umberto I (1900) in reprisal for the 1898 Milan
          massacre of bread protesters. France answers with the 1893–94 laws restricting anarchist
          speech and association.
      - date: 2008
        text: >
          After police kill fifteen-year-old Alexandros Grigoropoulos in Athens, weeks of riots and
          occupations spread across Greece, with insurrectionary anarchists prominent in them.
      - date: 2012
        disputed: true
        text: >
          A cell of the Informal Anarchist Federation shoots and wounds Ansaldo Nucleare executive
          Roberto Adinolfi in Genoa; Alfredo Cospito is later held under Italy's 41-bis isolation
          rules and wages a hunger strike in 2022–2023. Italian prosecutors describe a structured
          terrorist network; defendants and supporters describe autonomous cells and call 41-bis
          detention torture.
    descendsFrom:
      - {id: anarchism.communist, event: "London congress endorses propaganda by the deed", date: 1881}
    breaksWith:
      - {id: anarchism.syndicalist, event: "Rejection of permanent mass organizations after the Italian movement of 1977", date: 1977}
    analysis:
      conditions: >
        It flourishes when legal channels close or mass movements are defeated: Italy in the 1870s
        and 1890s under bans on association, Italy after the movement of 1977 collapsed into the
        years of armed conflict, Greece and Chile after austerity and police violence. When mass
        organizations are outlawed or incorporated into bargaining, small groups turn to attacking
        symbols and property directly.
      class_base: >
        Historically itinerant artisans and the urban poor; today students, unemployed and
        precarious youth, and sections of marginalized urban populations, with a small committed
        core of militants who often spend long periods in prison.
      function: >
        Its actions rarely damage capital at scale, but they draw heavy repression whose legal tools
        (anti-terror statutes, association bans, prison isolation rules) are then applied
        to broader movements. In riots such as Greece 2008 it can act as a catalyst; in quieter
        periods it remains a closed milieu.
      disputed: >
        Trotsky ("Why Marxists Oppose Individual Terrorism", 1911) and most of the left call it
        substitution of a few for the class that invites repression; insurrectionists reply that
        mass organizations have been absorbed and that diffuse revolt is the only form left.
    keyTexts:
      - {author: Luigi Galleani, title: "The End of Anarchism?", year: 1925}
      - {author: Alfredo M. Bonanno, title: Armed Joy, year: 1977}
      - {author: The Invisible Committee, title: The Coming Insurrection, year: 2007}

  - id: anarchism.mutualist
    regions: [France, United States, Belgium, Spain]
    self: >
      Property, meaning the right to collect rent, interest and profit without working, is theft;
      possession, the worker's right to the land and tools she uses, is liberty. We want neither
      capitalism nor state communism but a society of free contracts among equals: producers
      exchanging labor for labor at cost, workers' associations running large industry, and people's
      banks lending at the cost of administration so that interest and rent wither away. Replace
      government with a web of reciprocal contracts and federations from the commune upward. Reform
      the economy and the state dissolves into it.
    record:
      - date: 1848–1849
        text: >
          Proudhon is elected to the Constituent Assembly in June 1848 and founds the People's Bank
          to lend without interest; it gathers thousands of subscribers but is wound up in 1849 when
          he is jailed for attacking President Louis-Napoléon Bonaparte in print.
      - date: 1864–1869
        text: >
          Proudhonist workers led by Tolain help found the First International; they are outvoted on
          collective ownership of land at the Brussels (1868) and Basel (1869) congresses.
      - date: 1871
        disputed: true
        text: >
          Proudhonists sit on the council of the Paris Commune, whose decree of 16 April hands
          workshops abandoned by their owners to workers' cooperative associations. Marx read the
          Commune as a workers' government; Proudhonists read it as a federation of autonomous
          communes.
      - date: 1875
        text: >
          Proudhon's posthumous La Pornocratie argues that women belong in the household under
          paternal authority, and his notebooks contain antisemitic passages; later mutualists and
          anarchists, beginning with Joseph Déjacque in 1857, repudiate both.
      - date: 2007
        text: >
          Kevin Carson's Studies in Mutualist Political Economy revives mutualism as a market
          anti-capitalism in debate with both Marxists and right-libertarians.
    descendsFrom: []
    breaksWith:
      - {id: marxism.classical, event: "Marx answers Proudhon's System of Economic Contradictions with The Poverty of Philosophy", date: 1847}
    analysis:
      conditions: >
        It arose in France in the 1840s, in an economy of small workshops threatened by mechanized
        industry and by credit concentrated in the Banque de France and Paris financiers. Artisans
        who still owned their tools met exploitation as interest, rent and unfair exchange more than
        as the wage, so they sought cheap credit and exchange at cost.
      class_base: >
        Artisans and independent craft producers, small farmers, and later cooperative members; in
        the present, small producers, cooperators and a current of online market anti-capitalists.
      function: >
        It lives on in credit unions, cooperatives, time banks and local currencies, which give small
        producers credit and outlets outside the large banks. They operate inside capitalist markets,
        so competition still selects winners who expand and hire, and losers who sell their labor;
        the reform touches interest and rent but leaves that differentiation in place.
      disputed: >
        Marx held that exchange-based reform leaves the law of value intact; mutualists, following
        Tucker's account of the land, money, tariff and patent monopolies, answer that it is
        state-backed privilege that turns markets into capitalism.
    keyTexts:
      - {author: Pierre-Joseph Proudhon, title: "What Is Property?", year: 1840}
      - {author: Pierre-Joseph Proudhon, title: General Idea of the Revolution in the Nineteenth Century, year: 1851}
      - {author: Pierre-Joseph Proudhon, title: The Principle of Federation, year: 1863}
      - {author: William B. Greene, title: Mutual Banking, year: 1850}
      - {author: Kevin A. Carson, title: Studies in Mutualist Political Economy, year: 2007}

  - id: anarchism.individualist
    regions: [United States, France, Germany]
    self: >
      The individual is sovereign over person and property, and no majority, priest or state has
      the right to rule her. Our principle is equal liberty: each may do as she wills so long as she
      does not invade the equal liberty of another. Exploitation comes from privileges the state
      grants: the money monopoly, the land monopoly, tariffs and patents. Abolish them and free
      competition will drive interest, rent and profit toward zero, so labor receives its full
      product. We need no mass revolution, only individuals who stop consenting, who resist
      passively and associate voluntarily, as unique ones in a union of egoists.
    record:
      - date: 1827
        text: >
          Josiah Warren opens the Cincinnati Time Store, where goods are traded for notes promising
          equivalent hours of labor; it runs until 1830.
      - date: 1851
        text: >
          Warren and Stephen Pearl Andrews found the community of Modern Times on Long Island on the
          principle of individual sovereignty; it survives into the 1860s.
      - date: 1881–1908
        text: >
          Benjamin Tucker publishes Liberty in Boston and New York, the main organ of American
          individualist anarchism; it ends after a fire destroys his stock in 1908.
      - date: 1911–1913
        text: >
          The Bonnot gang, from the illegalist milieu around the Paris paper l'anarchie, carries out
          armed bank robberies; its members are killed by police or tried, and several are executed
          or sentenced to hard labor.
      - date: 1965
        text: >
          Murray Rothbard claims Spooner and Tucker as forerunners of a free-market anarchism while
          rejecting their labor theory of value and their hostility to rent and interest.
    descendsFrom:
      - {id: anarchism.mutualist, event: "Tucker translates Proudhon's What Is Property?", date: 1876}
    breaksWith:
      - {id: anarchism.communist, event: "Tucker's Liberty denies that communist anarchists are anarchists", date: 1886}
    analysis:
      conditions: >
        It arose in the nineteenth-century United States, where a large class of independent farmers
        and artisans met a federal state that granted land to railroads, protected manufacturers by
        tariff and chartered national banks (1863–64). The land open to settlement was land being
        taken from Indigenous nations. When independent producers lose to privileged corporations,
        the enemy appears as legal privilege rather than as the wage relation.
      class_base: >
        Self-employed artisans, small farmers and freethinking professionals; today freelancers,
        software workers and parts of the European counterculture.
      function: >
        As an organized current it is small. Its main historical effect has been to supply a
        vocabulary (individual sovereignty, voluntaryism, taxation as theft) that anarcho-capitalism
        adopted after dropping its labor theory and its attack on rent and interest. In that
        migration, language built to defend small producers against monopoly came to defend large
        property against regulation and taxation.
      disputed: >
        Marxists hold that competition among small owners regenerates concentration; individualists
        reply that concentration rests on state privilege and would not survive without it.
    keyTexts:
      - {author: Max Stirner, title: The Ego and Its Own, year: 1844}
      - {author: Josiah Warren, title: Equitable Commerce, year: 1846}
      - {author: Lysander Spooner, title: "No Treason", year: 1867}
      - {author: Benjamin R. Tucker, title: "Instead of a Book, by a Man Too Busy to Write One", year: 1893}

  - id: anarchism.green
    regions: [United States, Britain, France, Germany]
    self: >
      The domination of nature grows out of the domination of people by people. State and capital
      treat forests, rivers and human beings alike as resources to extract. We reject industrial
      growth whether capitalist or socialist and want decentralized, small-scale communities living
      within the limits of their bioregion, using appropriate technology and deciding face to face.
      Ecological defense is direct action: blockades, tree-sits, occupations, and the sabotage of
      machinery that destroys wild land. A livable planet and a free society are the same project,
      and neither can wait for parliaments.
    record:
      - date: 1980
        text: >
          Earth First! is founded in the United States and uses tree-sits, road blockades and tree
          spiking against logging; by 1990 its anarchist and left wing, led by Judi Bari, who sought
          an alliance with timber workers, has displaced the founders.
      - date: 1990
        disputed: true
        text: >
          A car bomb injures Judi Bari and Darryl Cherney in Oakland; police and the FBI accuse them
          of carrying it. No one is charged, and in 2002 a federal jury awards them 4.4 million
          dollars for false arrest and violation of their civil rights. The bomber remains unknown.
      - date: 1992–2006
        disputed: true
        text: >
          The Earth Liberation Front, formed in Britain, carries out arson against developments,
          logging companies and SUV dealers in the United States, including the 1998 fire at Vail;
          the FBI's Operation Backfire leads to convictions in 2006. The FBI called it the leading
          domestic terrorism threat; supporters stress that the actions targeted property and killed
          no one.
      - date: 2008–2018
        text: >
          Anarchists, farmers and ecologists occupy the planned airport site at Notre-Dame-des-Landes
          as a "zone to defend"; the French government abandons the airport in January 2018.
    descendsFrom:
      - {id: anarchism.communist, event: "Kropotkin's case for decentralized, integrated farming and industry in Fields, Factories and Workshops", date: 1899}
    breaksWith:
      - {id: anarchism.communalism, event: "Bookchin's attack on deep ecology at the National Gathering of the Greens", date: 1987}
    analysis:
      conditions: >
        It arose in core countries during postwar growth, as pesticides, nuclear power, clear-cutting
        and road building made destruction visible. Unions and labor parties were committed to growth
        and jobs, so ecological opposition found no home in them and organized outside, often in
        conflict with the workers whose wages depended on extraction.
      class_base: >
        Educated youth and students, rural back-to-the-land communities and some small farmers. The
        parallel struggles in the periphery against mines, dams and plantations are led mostly by
        Indigenous and peasant communities that do not call themselves anarchist.
      function: >
        Blockades and occupations raise the cost and delay of extraction projects and sometimes stop
        them. When a project is blocked in a core country while demand for the material continues,
        extraction can move to the periphery, where costs fall on communities with less protection.
        Its conflicts with timber and mining workers have at times pushed those workers toward their
        employers.
      disputed: >
        Ecosocialists argue that without a class strategy it cannot touch the accumulation that drives
        extraction; green anarchists answer that industrial socialism shares the same growth logic.
    keyTexts:
      - {author: Peter Kropotkin, title: "Fields, Factories and Workshops", year: 1899}
      - {author: Lewis Herber (Murray Bookchin), title: Our Synthetic Environment, year: 1962}
      - {author: Dave Foreman and Bill Haywood (eds.), title: "Ecodefense: A Field Guide to Monkeywrenching", year: 1985}

  - id: anarchism.primitivist
    regions: [United States, Britain]
    self: >
      Civilization itself is the problem. With the domestication of plants and animals came surplus,
      property, the division of labor, patriarchy, the state and war. Symbolic culture, measured
      time and number estranged us from immediate life. Industrial technology is not neutral: it needs
      mines, factories and a class to run them, and it is consuming the living world. Foraging bands
      lived with more leisure, equality and health than most people since. We want rewilding: the
      unmaking of mass society and a return to face-to-face life within wild nature. Reforming the
      machine only perfects it.
    record:
      - date: 1983
        text: >
          The Detroit paper Fifth Estate turns against technology and civilization, and Fredy Perlman
          publishes Against His-Story, Against Leviathan!
      - date: 1994
        text: >
          John Zerzan's Future Primitive gathers the case against agriculture, symbolic culture and
          the division of labor.
      - date: 1995
        disputed: true
        text: >
          The Washington Post and New York Times publish the manifesto of Theodore Kaczynski, whose
          mail bombs (1978–1995) killed three people and injured twenty-three. Zerzan and some
          primitivists expressed sympathy for his critique; Kaczynski rejected anarchism and the left,
          and most primitivists reject identification with him.
      - date: 2000–2008
        text: >
          Green Anarchy magazine, published from Eugene, Oregon, serves as the current's main organ.
    descendsFrom:
      - {id: anarchism.green, event: "Fifth Estate's turn against industrial civilization", date: 1983}
    breaksWith:
      - {id: anarchism.communalism, event: "Bookchin's Social Anarchism or Lifestyle Anarchism", date: 1995}
    analysis:
      conditions: >
        It emerged in the United States after the defeat of the 1960s and 1970s movements, amid
        deindustrialization and ecological alarm. When no social force seems able to redirect
        industrial society, the critique moves from who controls technology to technology itself.
      class_base: >
        Small numbers of educated, mostly white North American and European people, often
        marginally employed, with a wider online audience.
      function: >
        It has little organizational presence; its arguments circulate in subcultures. Its horizon
        implies a collapse of industrial food, medicine and transport whose costs would fall hardest
        on those who depend on them most, which is most of the world's poor. By treating core and
        periphery as one civilization, it leaves out the transfer of resources and labor between them.
      disputed: >
        Anthropologists dispute Sahlins's "original affluent society" data on forager leisure and
        health; primitivists reply that even revised figures compare well with agrarian life.
    keyTexts:
      - {author: Fredy Perlman, title: "Against His-Story, Against Leviathan!", year: 1983}
      - {author: John Zerzan, title: Future Primitive and Other Essays, year: 1994}
      - {author: Marshall Sahlins, title: Stone Age Economics, year: 1972, note: "anthropological source the current relies on; Sahlins was not a primitivist"}

  - id: anarchism.communalism
    regions: [United States, Spain, Kurdistan]
    self: >
      Capitalism's grow-or-die logic is destroying the biosphere, and the domination of nature grows
      out of the domination of human by human. The answer is neither the nation-state nor the lone
      individual but the free municipality: citizens assembling face to face in neighborhood and
      town assemblies, making policy directly, and sending mandated, recallable delegates to
      confederal councils that coordinate a region. Libertarian municipalism contests local
      elections to build this dual power. The economy is municipalized, owned by the community, not
      by bosses or by any one trade. Social ecology joins reason, ethics and ecology.
    record:
      - date: 1987
        text: >
          At the National Gathering of the US Greens, Bookchin attacks deep ecology as
          misanthropic, splitting the American green movement.
      - date: 1995
        text: >
          Bookchin's Social Anarchism or Lifestyle Anarchism denounces individualist, primitivist and
          lifestyle currents as a retreat from social revolution.
      - date: 2002
        text: >
          In The Communalist Project Bookchin declares communalism a distinct ideology, no longer a
          form of anarchism.
      - date: 2004
        text: >
          Abdullah Öcalan, imprisoned on İmralı, reads Bookchin and corresponds with him through his
          lawyers; the Kurdish movement adopts libertarian municipalism as the basis of democratic
          confederalism.
      - date: 2015–2023
        disputed: true
        text: >
          Barcelona en Comú governs Barcelona under Ada Colau as part of a municipalist wave that
          drew partly on Bookchin. Communalists argue it became a conventional party running a city
          within Spanish law; its members say Bookchin was one influence among several and that
          assemblies shaped its program.
    descendsFrom:
      - {id: anarchism.communist, event: "Bookchin moves from Trotskyism to anarchism", date: 1958}
      - {id: marxism.trotskyism, event: "Bookchin's formation in the Communist and Trotskyist movements", date: 1939}
    breaksWith:
      - {id: anarchism.primitivist, event: "Social Anarchism or Lifestyle Anarchism", date: 1995}
      - {id: anarchism.communist, event: "The Communalist Project separates communalism from anarchism", date: 2002}
    analysis:
      conditions: >
        It formed in the postwar United States as the New Left ebbed and suburbanization and
        ecological damage advanced, with the Vermont town meeting as a living model. As the industrial
        workforce shrank, Marxist and syndicalist strategies centered on the workplace lost purchase,
        and Bookchin relocated the agent of change to the citizen in the municipality.
      class_base: >
        Educated activists and residents of small towns and city neighborhoods in the core; through
        democratic confederalism, a mass base among Kurdish peasants and urban poor.
      function: >
        Its largest real effect runs through democratic confederalism. In the core, municipalist
        platforms win city councils, but city budgets depend on property taxes, bond markets and
        national transfers, which limits what they can change. Treating everyone as a citizen of
        the municipality puts landlord and tenant, employer and worker in the same assembly, which
        sets aside the conflicts between them.
      disputed: >
        Social anarchists call municipal elections a trap; Marxists argue a municipality cannot
        confront national and global capital; communalists answer that confederation supplies scale.
    keyTexts:
      - {author: Murray Bookchin, title: Post-Scarcity Anarchism, year: 1971}
      - {author: Murray Bookchin, title: The Ecology of Freedom, year: 1982}
      - {author: Murray Bookchin, title: The Rise of Urbanization and the Decline of Citizenship, year: 1987}
      - {author: Murray Bookchin, title: "The Next Revolution: Popular Assemblies and the Promise of Direct Democracy", year: 2015}

  - id: anarchism.confederalism
    regions: [Kurdistan, North and East Syria, Turkey]
    self: >
      The nation-state is the cage capitalism built for peoples; for Kurds it has meant denial,
      massacre and division among four states. Our answer is not another state but democratic
      confederalism: communes, councils and assemblies in every village and neighborhood,
      confederated across ethnic and religious lines, with autonomous women's councils and male and
      female co-chairs at every level, a social economy of cooperatives, and ecology as a principle.
      Jineolojî, the science of women, holds that no society is free until women are. A democratic
      nation, not a nation-state, built now and defended with arms.
    record:
      - date: 2005
        text: >
          From prison Öcalan issues the Declaration of Democratic Confederalism; the PKK, founded in
          1978 as a Marxist-Leninist party for an independent Kurdistan, drops the goal of a separate
          state.
      - date: 2012–2014
        text: >
          As Syrian government forces withdraw from the north in July 2012, the PYD and its YPG and
          YPJ militias take Kobani, Afrin and Jazira; in January 2014 the cantons adopt a Social
          Contract with communes, co-chairs and quotas for women and minorities.
      - date: 2014–2015
        text: >
          YPG and YPJ fighters, with US air support from October, break the Islamic State's siege
          of Kobani in January 2015.
      - date: 2015–2019
        disputed: true
        text: >
          The Syrian Democratic Forces, allied with the US-led coalition, take Raqqa (2017) and
          Baghuz (2019). Supporters call the alliance a tactical necessity for survival; critics
          (Syrian opposition groups, Turkey, some anti-imperialist leftists) call it dependence on
          the US military. Amnesty International (2015) reported forced displacement and home
          demolitions in Arab villages; the administration denied a policy and cited security.
      - date: 2018–2019
        text: >
          Turkish forces and allied Syrian militias take Afrin in 2018 and a strip along the border
          in 2019, displacing hundreds of thousands of Kurds.
      - date: 2025
        text: >
          In February Öcalan calls on the PKK to lay down arms; the PKK announces its dissolution in
          May. In March the SDF agrees with Syria's new government to integrate its civil and military
          institutions into the Syrian state.
    descendsFrom:
      - {id: marxism.ml, event: "PKK founded as a Marxist-Leninist national liberation party", date: 1978}
      - {id: anarchism.communalism, event: "Öcalan adopts Bookchin's libertarian municipalism", date: 2004}
    breaksWith:
      - {id: marxism.ml, event: "Declaration of Democratic Confederalism abandons the goal of a Kurdish nation-state", date: 2005}
    analysis:
      conditions: >
        The Kurdish nation was divided among Turkey, Iraq, Iran and Syria after the First World War
        and faced bans on its language, forced resettlement and landlord power in the countryside. A
        stateless nation facing four states could not win its own state, especially after the Soviet
        collapse and Öcalan's capture; self-administration needs no outside recognition. The Syrian
        civil war's vacuum after 2012 gave it territory.
      class_base: >
        Kurdish peasants, rural and urban poor, and women mobilized through the women's movement,
        led by a cadre trained in the PKK; in North and East Syria also Arab tribal populations whose
        support is negotiated. Landowners and merchants largely kept their property.
      function: >
        It administers territory holding much of Syria's oil and wheat, with a cooperative sector
        alongside private property and markets. Its survival came to depend on the United States,
        which used the SDF as a ground force against the Islamic State and as leverage against
        Damascus, Iran and Russia, while backing Turkey in NATO. That dependence on a core power
        is the central contradiction of the project, and the 2025 agreements show that its survival
        depends on deals between states.
      disputed: >
        Some anti-imperialist Marxists treat it as a US proxy; supporters treat the alliance as
        tactical. Anarchists debate whether a project led by a disciplined party, with compulsory
        self-defense service, belongs to their tradition.
    keyTexts:
      - {author: Abdullah Öcalan, title: Democratic Confederalism, year: 2011}
      - {author: Abdullah Öcalan, title: "Liberating Life: Woman's Revolution", year: 2013}
      - {author: Michael Knapp, Anja Flach and Ercan Ayboga, title: "Revolution in Rojava: Democratic Autonomy and Women's Liberation in Syrian Kurdistan", year: 2016}

  - id: anarchism.feminist
    regions: [Argentina, Spain, Japan, United States, Bolivia]
    self: >
      State, capital and patriarchy are one system of domination, and a revolution that leaves the
      father, the husband and the priest in command of women has changed nothing. We fight for
      women's control of their bodies, sexuality, work and children, against marriage as property,
      against compulsory motherhood, and against the hierarchies that reappear inside the left
      itself. Domination is learned first at home, so the personal is political. We organize
      autonomously, as women, without leaders, and build the new relations now: free love, shared
      care, collective child-rearing. Neither God, nor boss, nor husband.
    record:
      - date: 1896–1897
        text: >
          Women anarchist communists in Buenos Aires publish La Voz de la Mujer under the slogan
          "Neither God, nor boss, nor husband".
      - date: 1911–1923
        text: >
          In Japan, Kanno Sugako is executed in 1911 after the High Treason Incident, and Itō Noe is
          killed by military police with Ōsugi Sakae in 1923 after the Great Kantō earthquake.
      - date: 1916–1919
        text: >
          Emma Goldman is jailed for distributing birth control information (1916) and for opposing
          conscription (1917), and deported to Soviet Russia in 1919.
      - date: 1936–1939
        text: >
          Mujeres Libres, founded by Lucía Sánchez Saornil, Mercedes Comaposada and Amparo Poch,
          reaches about 20,000 members in Republican Spain, running literacy and job training; in
          1938 the libertarian movement's leadership refuses to recognize it as an autonomous branch.
      - date: 1992
        text: >
          María Galindo and Julieta Paredes found Mujeres Creando in Bolivia, combining street
          graffiti, cooperatives and public actions against church, state and parties.
    descendsFrom:
      - {id: anarchism.communist, event: "La Voz de la Mujer in Buenos Aires", date: 1896}
    breaksWith:
      - {id: anarchism.syndicalist, event: "The libertarian movement refuses Mujeres Libres recognition as an autonomous branch", date: 1938}
      - {id: feminism.liberal, event: "Goldman's critique of suffrage as the goal of women's emancipation", date: 1910}
    analysis:
      conditions: >
        It arose as women entered textile and garment industries while barred from votes, property
        and divorce, and as socialist parties treated the woman question as secondary. Factory work
        plus unpaid housework made the family visible as a site of domination parallel to the
        workplace.
      class_base: >
        Garment and textile workers, many of them immigrants, along with teachers, nurses and
        intellectuals; today feminist collectives and student and activist milieus, especially in
        Latin America.
      function: >
        It feeds the assembly-based, leaderless style of Latin American feminist mass movements and
        keeps unpaid care work and hierarchy inside the left on the agenda. Because it refuses
        state routes, legal and policy gains are left mainly to liberal feminism, whose gains go
        mostly to professional women.
      disputed: >
        Social reproduction Marxists argue patriarchy is organized through capital's need for
        reproduced labor power rather than as a separate system; anarcha-feminists answer that male
        domination predates capitalism and survives revolutions that ignore it.
    keyTexts:
      - {author: Voltairine de Cleyre, title: Sex Slavery, year: 1890}
      - {author: Emma Goldman, title: Anarchism and Other Essays, year: 1910}
      - {author: Peggy Kornegger, title: "Anarchism: The Feminist Connection", year: 1975}
      - {author: Martha A. Ackelsberg, title: "Free Women of Spain: Anarchism and the Struggle for the Emancipation of Women", year: 1991}

  - id: anarchism.christian
    regions: [Russia, United States, France, Canada]
    self: >
      Jesus told us not to resist evil with violence, not to swear oaths, not to judge, and to give
      to God what is God's. Taken seriously, the Sermon on the Mount abolishes the state, which rests
      on violence, oaths, courts, armies and prisons. A Christian cannot be a soldier, a judge or a
      jailer, or pay for war. We do not seize power; we refuse to cooperate with it and live the
      Kingdom now, in communities of voluntary poverty, hospitality and nonviolent resistance. The
      powers of this world are fallen, and the church's task is to witness against them, not bless
      them.
    record:
      - date: 1895–1899
        text: >
          Tolstoy backs the Doukhobors, who burn their weapons in 1895 and refuse military service;
          he gives the proceeds of his novel Resurrection to fund their emigration to Canada in 1899.
      - date: 1901
        text: >
          The Holy Synod of the Russian Orthodox Church excommunicates Tolstoy.
      - date: 1908–1910
        text: >
          Tolstoy's Letter to a Hindu and his correspondence with Gandhi shape Gandhi's doctrine of
          nonviolent resistance; Gandhi names his South African commune Tolstoy Farm.
      - date: 1933
        text: >
          Dorothy Day and Peter Maurin found the Catholic Worker in New York, with houses of
          hospitality and farms; from 1955 Day and others are jailed for refusing to take shelter in
          civil defense drills.
      - date: 1980–2018
        text: >
          Plowshares activists from the Catholic Worker and Catholic left milieu hammer on nuclear
          warheads at a General Electric plant (1980) and enter the Kings Bay submarine base (2018),
          serving prison terms.
    descendsFrom: []
    breaksWith:
      - {id: conservatism.reactionary, event: "Excommunication of Tolstoy by the Holy Synod", date: 1901}
    analysis:
      conditions: >
        In Russia it arose under an autocracy fused with the Orthodox church, with mass conscription
        and landlord estates; where the church blessed the tsar and the army, a literal reading of
        the Gospel turned against both. In the United States it grew in the Depression and against
        the nuclear arms race.
      class_base: >
        Peasant sectarians (Doukhobors, Molokans) and conscience-driven nobles and intellectuals in
        Russia; in the Catholic Worker, educated lay Catholics and clergy serving the urban poor.
      function: >
        Small communities feed and house the homeless and carry out direct action against nuclear
        weapons, aiming at the military apparatus of the most powerful core state. Their charity
        absorbs some of the cost of poverty that the state sheds, and their refusal of all coercion,
        including revolutionary coercion, keeps them out of any contest for power.
      disputed: >
        Lenin ("Leo Tolstoy as the Mirror of the Russian Revolution", 1908) read Tolstoyan
        nonresistance as peasant protest that disarms the oppressed; Christian anarchists answer that
        violence reproduces the domination it fights.
    keyTexts:
      - {author: Leo Tolstoy, title: The Kingdom of God Is Within You, year: 1894}
      - {author: Dorothy Day, title: The Long Loneliness, year: 1952}
      - {author: Jacques Ellul, title: Anarchy and Christianity, year: 1988}

  - id: zapatismo
    regions: [Chiapas, Mexico, Latin America]
    self: >
      We are the product of five hundred years of struggle. Ya basta! We rose on 1 January 1994, the
      day NAFTA took effect, because a bad government that sells the land and lets our children die
      of curable diseases left us no other road. We do not want to take power; we want a world where
      many worlds fit. Our autonomous governments rule by obeying: those who command, command by
      obeying, rotate and can be recalled. Our schools teach in our languages, our clinics serve us,
      our recovered land is worked in common. Below and to the left, we walk asking questions.
    record:
      - date: 1983
        text: >
          Cadres of the Forces of National Liberation, a Guevarist organization, found the EZLN in
          the Lacandon jungle; over a decade the guerrilla is reshaped by Tzeltal, Tzotzil, Chol and
          Tojolabal community assemblies.
      - date: 1994
        disputed: true
        text: >
          On 1 January the EZLN occupies San Cristóbal de las Casas and other towns; after about
          twelve days of fighting the government declares a ceasefire. Deaths are put at about 145 by
          the government and at several hundred by other counts.
      - date: 1996
        text: >
          The EZLN and the federal government sign the San Andrés Accords on Indigenous Rights and
          Culture; the government does not implement them, and the EZLN rejects the reduced
          constitutional reform passed in 2001.
      - date: 1997
        disputed: true
        text: >
          Paramilitaries kill 45 Tzotzil members of the pacifist group Las Abejas, who sympathized
          with the Zapatistas, at Acteal. Survivors and human rights groups describe a
          state-backed counterinsurgency; the government described a local conflict, and in 2009
          the Supreme Court released many of those convicted over due process violations.
      - date: 2003
        text: >
          The Zapatistas create five Caracoles and Councils of Good Government to coordinate
          autonomous municipalities, schools, clinics and cooperatives.
      - date: 2017–2018
        text: >
          With the National Indigenous Congress, the EZLN backs María de Jesús Patricio as an
          independent presidential candidate; she does not gather enough signatures to appear on the
          ballot.
      - date: 2023
        text: >
          The EZLN dissolves the Councils of Good Government and the autonomous municipalities,
          replacing them with many local autonomous governments, and announces land worked in common
          without property titles.
    descendsFrom:
      - {id: marxism.guevarism, event: "FLN cadres found the EZLN in the Lacandon jungle", date: 1983}
      - {id: nationalism.indigenous-sovereignty, event: "Encounter with Maya community assemblies transforms the guerrilla", date: "1983–1993"}
    breaksWith:
      - {id: marxism.guevarism, event: "The uprising renounces the vanguard and the seizure of state power", date: 1994}
    analysis:
      conditions: >
        In Chiapas, ranchers held much of the best land while Maya smallholders farmed marginal
        plots. The 1992 reform of Article 27 ended land redistribution and allowed common land to be
        sold, ahead of NAFTA, and the collapse of the international coffee agreement in 1989 cut the
        income of small coffee growers. With both the land route and the market route closed at once,
        communities organized by catechists of the San Cristóbal diocese and by the guerrilla rose.
      class_base: >
        Maya peasant smallholders and landless settlers in the Lacandon jungle, with women organized
        through the Revolutionary Women's Law of 1993.
      function: >
        It holds autonomous territory where land taken from ranchers in 1994 is worked collectively,
        outside state programs and partly outside market circuits, which keeps that land and labor
        from being drawn into commodity production. Mining concessions, tourism, the Maya Train and
        cartel violence press on that territory. Because it does not contest the national state,
        national policy goes ahead around it, while its example and networks inspire movements far
        beyond Mexico.
      disputed: >
        Marxist critics (e.g., of Holloway) argue that refusing power leaves the Mexican state and
        NAFTA intact; supporters point to three decades of autonomy under siege. Parts of the
        Mexican electoral left accused the EZLN of helping the right by rejecting López Obrador.
    keyTexts:
      - {author: EZLN, title: Sixth Declaration of the Lacandon Jungle, year: 2005}
      - {author: Subcomandante Marcos, title: "Our Word Is Our Weapon: Selected Writings", year: 2001}
      - {author: EZLN, title: "Critical Thought in the Face of the Capitalist Hydra I", year: 2015}
      - {author: John Holloway, title: "Change the World Without Taking Power", year: 2002, note: "interpretation by a sympathetic theorist"}
