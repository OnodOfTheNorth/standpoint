  # ------------------------------------------------------------------
  - id: marxism.african-socialism
    regions: [Tanzania, Ghana, Guinea-Bissau, Cape Verde, Burkina Faso, Sahel]
    self: >-
      Socialism, like democracy, is an attitude of mind, and Africa lived it before Europe named it:
      ujamaa, familyhood, where no one hoarded while others starved and the land belonged to all. We
      build a modern socialism on those foundations: land owned by the nation, self-reliance in place of
      begging for aid, education for liberation, and the unity of Africa, because no African state is
      free while any is colonized and none can develop alone. We differ among ourselves: Nkrumah came to
      see class struggle inside Africa, and Cabral taught that liberation is a return to the source, a
      people's right to its own history and its own productive forces.
    record:
      - date: 1957–1966
        disputed: true
        text: >-
          Ghana becomes independent under Kwame Nkrumah, builds the Akosombo dam and a state industrial
          sector, and is overthrown by a military coup in February 1966. Nkrumah and later researchers
          alleged US involvement; documents show US officials' foreknowledge and approval, while the extent
          of direct involvement is disputed.
      - date: 1967
        text: >-
          Tanzania's Arusha Declaration nationalizes banks and major firms and binds party leaders to a code
          against private business.
      - date: 1973–1976
        disputed: true
        text: >-
          Tanzania's villagization moves millions of rural people, often by compulsion, into planned ujamaa
          villages. Supporters credit the period with large gains in schooling, literacy and clinics;
          critics point to coercion and falling agricultural output.
      - date: 1963–1974
        text: >-
          Amílcar Cabral's PAIGC wages armed struggle against Portuguese rule in Guinea-Bissau; Cabral is
          assassinated in January 1973, independence is declared that September, and Portugal's colonial
          wars help bring down its dictatorship in 1974.
      - date: 1983–1987
        text: >-
          Thomas Sankara's government in Burkina Faso vaccinates some 2.5 million children in a two-week
          campaign, plants millions of trees, refuses IMF terms and campaigns against debt; he is killed in
          the 1987 coup led by Blaise Compaoré.
      - date: 1985–1986
        text: >-
          Nyerere steps down and Tanzania accepts an IMF programme; across the continent structural
          adjustment ends most African socialist experiments.
      - date: 2023–2025
        disputed: true
        text: >-
          Military governments in Mali, Burkina Faso and Niger, invoking Sankara and pan-Africanism, form
          the Alliance of Sahel States, leave ECOWAS and press foreign mining companies for larger shares.
          Whether they carry this tradition or borrow its symbols is disputed.
    descendsFrom:
      - {id: nationalism.pan-africanism, event: "Fifth Pan-African Congress in Manchester", date: 1945}
    breaksWith:
      - {id: marxism.ml, event: "Nyerere's 'Ujamaa' rejects class war as foreign to Africa", date: 1962}
    analysis:
      conditions: >-
        Colonial economies left export monocultures (cocoa, sisal, groundnuts, copper), little industry, a
        small wage-working class and a peasant majority, and independence was led by a mission-educated
        petty bourgeoisie of teachers, clerks and lawyers. With no strong national industrial bourgeoisie,
        the state and its educated cadres became the main agent of accumulation, and a communal idiom
        bound peasant majorities to that state project.
      class_base: >-
        Historically the educated petty bourgeoisie that staffed party and state, with peasant support;
        Issa Shivji called the result a bureaucratic bourgeoisie, and Cabral asked whether that stratum
        would commit "class suicide". Today: ruling parties that keep the founders' names (Tanzania's CCM)
        while running market economies; a new pan-Africanist current among urban youth, students and
        diaspora intellectuals; and the Sahel military governments that invoke it.
      function: >-
        It now works in two directions. As the founding memory of ruling parties that accepted structural
        adjustment, it lends legitimacy to governments that broker mineral and agricultural exports on
        world-market terms, the comprador function. As inspiration for a new sovereigntist wave, it backs
        demands for control over mineral rents and an end to the CFA franc, which by the frame would reduce
        the drain. Which of the two dominates depends on who captures the rent, not on the slogans.
      disputed: >-
        Whether African socialism was socialism or state-led capitalism run by a bureaucratic bourgeoisie
        (Shivji; Fanon's warning about the national bourgeoisie; Nkrumah's own 1970 dismissal of "African
        socialism"); and whether the Sahel governments' sovereigntism is anti-imperialist or a military
        exchange of patrons from France to Russia.
    keyTexts:
      - {author: Julius K. Nyerere, title: "Ujamaa: The Basis of African Socialism", year: 1962}
      - {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}
      - {author: Amílcar Cabral, title: "The Weapon of Theory", year: 1966}
      - {author: Julius K. Nyerere and TANU, title: "The Arusha Declaration", year: 1967}
      - {author: Kwame Nkrumah, title: "Class Struggle in Africa", year: 1970}

  # ------------------------------------------------------------------
  - id: marxism.arab-socialism
    regions: [Egypt, Iraq, Syria, Lebanon, Palestine, Sudan, Yemen, Tunisia]
    self: >-
      Freedom, socialism and unity. The Arab nation, cut apart by colonial borders and wounded by Zionist
      settlement in Palestine, can be free only when it controls its own oil, land, canals and banks.
      Socialism means land reform that breaks the feudal landowners, nationalization of foreign companies,
      planned industry, free schooling and health care. Arab Marxists add the decisive lesson of 1967:
      the national bourgeoisie and the officers who spoke for it could not finish the liberation they
      began, because their class interest stopped short of mobilizing the masses. Only the workers, the
      peasants and the refugee camps, organized and armed with theory, can carry it through.
    record:
      - date: 1958–1963
        disputed: true
        text: >-
          After the 1958 revolution in Iraq the Iraqi Communist Party becomes the largest organized
          political force; the Ba'athist coup of February 1963 is followed by the killing of thousands of
          communists. Reports that US intelligence supplied lists of names are disputed.
      - date: 1961–1965
        text: >-
          Egypt's July Laws (1961) and National Charter (1962) define Arab socialism: nationalized banks and
          industry, land reform and planning. Egypt's communist organizations dissolve themselves into the
          ruling Arab Socialist Union in 1965.
      - date: 1967–1970
        disputed: true
        text: >-
          After the June 1967 defeat the Arab Nationalist Movement turns Marxist-Leninist: the PFLP is
          founded under George Habash, and the DFLP splits from it in 1969. In September 1970 the PFLP
          seizes four airliners and, after taking the passengers off, blows up three at Dawson's Field and
          the fourth in Cairo; the crisis precedes the Jordanian army's offensive against the Palestinian
          organizations. Its supporters call its armed actions resistance; Israel, the US and the EU list
          it as a terrorist organization.
      - date: 1969–1990
        text: >-
          South Yemen, under the National Liberation Front and from 1978 the Yemeni Socialist Party, is the
          only Marxist-Leninist state in the Arab world, with land reform and a 1974 family law expanding
          women's rights; a 1986 war inside the party kills thousands; the state unites with North Yemen in
          1990.
      - date: 1971
        disputed: true
        text: >-
          In Sudan an officers' coup linked to the Communist Party is reversed within three days, and the
          Numeiri government executes party leader Abdel Khaliq Mahjoub and union leader al-Shafi' Ahmad
          al-Shaykh. The party's role in planning the coup is disputed.
      - date: 1987
        text: >-
          The Lebanese Marxist theorists Mahdi Amel and Hussein Muruwwa are assassinated in Beirut.
    descendsFrom:
      - {id: marxism.ml, event: "Arab communist parties of the Comintern era", date: 1924}
      - {id: nationalism.nasserism, event: "The Arab Nationalist Movement's turn to Marxism after the 1967 defeat", date: "1967–1969"}
    breaksWith:
      - {id: nationalism.baathism, event: "Ba'athist coup and killings of communists in Iraq", date: 1963}
    analysis:
      conditions: >-
        Oil under foreign concessions, British and French mandates and bases, land concentrated in a few
        families, and the 1948 Nakba, which made Palestine the measure of every Arab government. Officers
        from the rural lower-middle class took power in Egypt (1952), Iraq (1958) and Syria, nationalized
        foreign assets and land, and built public sectors; Marxists organized the workers and the poor who
        were both the base and the rivals of these states.
      class_base: >-
        Arab socialist states: officers, the state bureaucracy, the state-educated middle strata and
        land-reform peasants. Arab Marxist parties: oil, rail and port workers (Iraq; the railway workers
        of Atbara in Sudan), intellectuals, the Shia poor and Kurds in Iraq, and the Palestinian refugee
        camps. Today: small parties, PFLP support in the camps and occupied territories, and the left of
        Tunisia's UGTT and of Sudan's unions and professional associations.
      function: >-
        From Sadat's opening (1974) through IMF programmes the public sectors these states built were sold
        off, and Islamist movements won much of the urban poor's allegiance. Arab Marxism acts today
        mainly through Palestinian resistance factions, unions and intellectuals. By the frame, the
        question it keeps open is who controls oil and gas rent: Gulf monarchies recycle it into core
        finance and arms purchases, which sustains the drain, while the Arab socialist states for a time
        turned it toward domestic industry.
      disputed: >-
        Whether the Nasserist and Ba'athist states were socialist, state capitalist or a "military
        society" (Anouar Abdel-Malek; Hassan Riad, the pen name of Samir Amin; Mahmoud Hussein), and
        whether Arab Marxists were right to dissolve into or ally with them (Egypt in 1965) or to oppose
        them (the Iraqi party after 1963).
    keyTexts:
      - {author: Anouar Abdel-Malek, title: "Égypte, société militaire", year: 1962}
      - {author: Gamal Abdel Nasser, title: "The Charter of National Action", year: 1962}
      - {author: "Hassan Riad (Samir Amin)", title: "L'Égypte nassérienne", year: 1964}
      - {author: Ghassan Kanafani, title: "The 1936–39 Revolt in Palestine", year: 1972}
