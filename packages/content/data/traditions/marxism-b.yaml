# Marxisms, part 2: Eurocommunism, structural and autonomist Marxism, the
# world-economy schools, analytical and market socialism, ecological and
# social-reproduction Marxisms, and the Marxisms of the global South.
# Part 1 is marxism.yaml. name/family/parent/era merge from the registry.
traditions:
  # ------------------------------------------------------------------
  - id: marxism.eurocommunism
    regions: [Italy, Spain, France]
    self: >-
      Socialism in western Europe must be built in western European conditions: by winning a majority,
      with parliament, plural parties, civil liberties, independent unions and alternation in
      government, and in full independence from Moscow. A socialism without political liberties is not
      the socialism we fight for; democracy is a historically universal value. After Chile we know that
      a left with 51 percent cannot govern against the other 49, so the working class must unite with
      the middle strata and the Catholic masses in a broad bloc for democratic transformation. The
      propulsive force of October is exhausted. Ours is a third road, between social democracy and the
      Soviet model.
    record:
      - date: 1968
        text: >-
          The Italian and Spanish communist parties condemn the Warsaw Pact invasion of Czechoslovakia.
      - date: 1973
        text: >-
          After the coup in Chile, PCI leader Enrico Berlinguer proposes a "historic compromise" with the
          Christian Democrats.
      - date: 1975–1977
        text: >-
          Joint declarations by the Italian, Spanish and French parties (Livorno 1975, Madrid 1977) commit
          them to pluralism and civil liberties; Santiago Carrillo's Eurocommunism and the State (1977)
          gives the current its name in print.
      - date: 1976–1979
        disputed: true
        text: >-
          The PCI wins 34.4 percent and supports Christian Democratic governments from outside ("national
          solidarity"), accepting wage restraint and austerity; in 1978 the Red Brigades kidnap and kill
          Aldo Moro, the Christian Democrat most open to the compromise. The PCI's vote falls to 30.4
          percent in 1979. Whether the compromise brought the party to the threshold of government or
          cost it working-class support while helping impose austerity is disputed.
      - date: 1977–1982
        text: >-
          In Spain's transition the PCE signs the Moncloa Pacts (1977), which tie wage rises to forecast
          rather than past inflation; its vote falls to about 4 percent in 1982.
      - date: 1981
        text: >-
          After martial law in Poland, Berlinguer declares that the "propulsive force" of the October
          Revolution is exhausted.
      - date: 1991–1999
        text: >-
          The PCI dissolves into the Democratic Party of the Left, a centre-left party; its successors
          govern Italy in the late 1990s, privatizing state firms and taking part in NATO's 1999 bombing
          of Yugoslavia under a prime minister from the former PCI, Massimo D'Alema.
    descendsFrom:
      - {id: marxism.gramscian, event: "Togliatti's 'Italian road to socialism'", date: 1956}
      - {id: marxism.ml, event: "Independence from Moscow; condemnation of the invasion of Czechoslovakia", date: 1968}
    breaksWith:
      - {id: marxism.ml, event: "Berlinguer declares the 'propulsive force' of October exhausted", date: 1981}
    analysis:
      conditions: >-
        Western Europe's postwar boom expanded salaried and service strata and raised core workers'
        living standards, while mass communist parties were kept out of national government by US
        pressure and NATO membership. The 1973 coup in Chile seemed to show that a left government with a
        narrow majority would be overthrown, and Soviet invasions discredited the Soviet model with
        western voters. A route through broad majorities that accepted NATO and the market was the
        remaining road to office.
      class_base: >-
        Organized industrial workers of northern Italy and Spain, municipal administrators in red regions
        such as Emilia-Romagna, the cooperative movement, public employees and intellectuals. The
        parties' growing layer of local-government administrators had a direct interest in coalitions and
        office.
      function: >-
        As a current it ended in 1991; it matters now as the route by which the West's largest communist
        parties became centre-left parties that administered European fiscal rules, privatized state
        firms and joined NATO wars. The mechanism: an electoral alliance with middle strata in a core
        state required accepting the market and the Atlantic alliance, and once that was accepted, the
        party's administrators managed the core state, including its external role.
      disputed: >-
        Whether the end in a centre-left party betrayed Eurocommunism's democratic socialism (left
        Eurocommunists such as Nicos Poulantzas, who wanted the parliamentary road joined to
        self-management from below) or was its logical result (Marxist-Leninist and Trotskyist critics,
        Ernest Mandel among them).
    keyTexts:
      - {author: Enrico Berlinguer, title: "Reflections on Italy after the Events in Chile", year: 1973}
      - {author: Santiago Carrillo, title: "Eurocommunism and the State", year: 1977}
      - {author: Nicos Poulantzas, title: "State, Power, Socialism", year: 1978}

  # ------------------------------------------------------------------
  - id: marxism.structural
    regions: [France, Latin America, Britain, Greece]
    self: >-
      Marx founded a science through an epistemological break with humanist ideology: history is a
      process without a subject. A society is a structured whole of economic, political and ideological
      levels, each relatively autonomous, determined by the economy only in the last instance. Ideology
      is not false ideas but material practices in apparatuses, school, family, church and media, that
      interpellate individuals as subjects who then work by themselves. The state is not a tool to be
      seized but the material condensation of a relation of class forces. Only rigorous concepts can
      guide a politics that means to change those structures, and they are worth the effort.
    record:
      - date: 1965
        text: >-
          Louis Althusser publishes For Marx and, with students including Étienne Balibar and Jacques
          Rancière, Reading Capital.
      - date: 1966
        text: >-
          Students around Althusser at the École normale supérieure found the Maoist Union of Communist
          Youth (Marxist-Leninist), breaking with the French Communist Party's youth organization.
      - date: 1968–1969
        text: >-
          Nicos Poulantzas's Political Power and Social Classes (1968) and his review of Ralph Miliband's
          The State in Capitalist Society (1969) open the Miliband–Poulantzas debate on the state.
      - date: 1969
        text: >-
          Marta Harnecker's handbook The Elementary Concepts of Historical Materialism, built on
          Althusser's categories, becomes a standard text of party education across Latin America and
          sells over a million copies.
      - date: 1970
        text: >-
          Althusser's essay "Ideology and Ideological State Apparatuses" is published.
      - date: 1978–1980
        text: >-
          E. P. Thompson's The Poverty of Theory attacks the school; Poulantzas dies in 1979; in 1980
          Althusser kills his wife, Hélène Rytmann, and is declared unfit to stand trial, which ends his
          public career.
    descendsFrom:
      - {id: marxism.western, event: "Althusser's For Marx and Reading Capital", date: 1965}
    breaksWith:
      - {id: marxism.western, event: "Rejection of Marxist humanism and Hegelian Marxism", date: 1965}
    analysis:
      conditions: >-
        After de-Stalinization in 1956 the French Communist Party embraced a humanist Marxism (Roger
        Garaudy) that Althusser saw as an opening to reformism; the Sino-Soviet split gave Maoism
        prestige among Paris students; and the rapid growth of French universities and the prestige of
        structuralism in linguistics and anthropology created an audience for Marxism presented as
        science.
      class_base: >-
        Academic philosophers and social scientists in France, Britain, Greece and Latin America, and
        their students; through Harnecker's handbooks, the cadre schools of Latin American parties. Today
        it is carried mainly in universities, by salaried professionals.
      function: >-
        Its concepts, ideological state apparatuses, relative autonomy, interpellation, the state as a
        condensation of class forces, are standard tools in social and state theory. In Latin America,
        Poulantzas's account of the state as a field of struggle informed governing strategy in the pink
        tide (García Linera cites it), supporting work inside the existing state; critics say it gave
        theoretical cover to governments that managed export-led extraction without breaking with it.
      disputed: >-
        The Miliband–Poulantzas debate over whether the state serves capital through the people who staff
        it or through structural constraint; and E. P. Thompson's charge that the school erased human
        agency and experience from history.
    keyTexts:
      - {author: Louis Althusser, title: "For Marx", year: 1965}
      - {author: "Louis Althusser, Étienne Balibar et al.", title: "Reading Capital", year: 1965}
      - {author: Nicos Poulantzas, title: "Political Power and Social Classes", year: 1968}
      - {author: Marta Harnecker, title: "Los conceptos elementales del materialismo histórico", year: 1969}
      - {author: Louis Althusser, title: "Ideology and Ideological State Apparatuses", year: 1970}

  # ------------------------------------------------------------------
  - id: marxism.autonomism
    regions: [Italy, Western Europe, Argentina]
    self: >-
      Start from the workers, not from capital. Capital does not move by itself: every restructuring
      answers a working class that had grown too strong, and every new machine is a weapon against a
      particular class composition. So the struggle is not for better work but against work, against
      the wage relation itself. The factory has spread across society: students, housewives, the
      unemployed and the precarious are all inside the social factory. We organize autonomously, from
      parties, from unions, from the state. Today living knowledge, the general intellect, is the chief
      productive force, and the cooperation of the multitude already produces the common that capital
      captures and fences in.
    record:
      - date: 1961–1964
        text: >-
          Raniero Panzieri's Quaderni Rossi (1961) and Mario Tronti's Classe Operaia (1964) found
          workerism (operaismo) through inquiries among workers at Fiat and Olivetti.
      - date: 1969
        text: >-
          Italy's Hot Autumn strike wave; the groups Potere Operaio and Lotta Continua are founded.
      - date: 1972
        text: >-
          The International Wages for Housework Campaign is launched from Padua by Mariarosa Dalla Costa,
          Selma James, Silvia Federici and others.
      - date: 1977
        text: >-
          The movement of 1977, of students and precarious youth, clashes with the PCI; the union leader
          Luciano Lama is driven out of Rome University.
      - date: 1979
        disputed: true
        text: >-
          Antonio Negri and others are arrested on 7 April, accused of directing the Red Brigades.
          Prosecutors held that Autonomia was the political leadership of armed groups; defenders called
          the case the criminalization of a movement. Negri is cleared of the Moro kidnapping but convicted
          on other charges.
      - date: 2000
        text: >-
          Hardt and Negri's Empire becomes a key text of the alter-globalization movement.
    descendsFrom:
      - {id: marxism.western, event: "Founding of Quaderni Rossi", date: 1961}
    breaksWith:
      - {id: marxism.eurocommunism, event: "Movement of 1977 against the PCI and the union leadership", date: 1977}
    analysis:
      conditions: >-
        Italy's postwar boom drew millions of young migrants from the south to the assembly lines of
        Turin and Milan. These unskilled "mass workers" had no ties to the craft culture of the PCI and
        the unions, which bargained over productivity on behalf of skilled workers; their revolts (Piazza
        Statuto in 1962, the Hot Autumn) broke out around those organizations, and a theory followed that
        started from workers' own refusal.
      class_base: >-
        Historically mass workers at Fiat and other plants, students, then precarious and unemployed young
        people and graduates. Today precarious knowledge and platform workers, students, the
        social-centre scene in Italy and Spain, and academics in the core.
      function: >-
        Its theory of immaterial labour and the multitude speaks to precarious graduates in the core whose
        work is cognitive and whose contracts are short. Empire (2000) declared that imperialism had given
        way to a decentred network of rule a year before the US invaded Afghanistan and three before it
        invaded Iraq. By the frame, a theory that dissolves the hierarchy of core and periphery removes
        the drain from view, and with it the main division in the world working class.
      disputed: >-
        Atilio Boron's Empire and Imperialism (2005) and other Latin American Marxists argued that Hardt
        and Negri erased the national and imperial hierarchy; defenders reply that Empire includes its
        own hierarchies and that the older theory of imperialism cannot explain global supply chains.
    keyTexts:
      - {author: Raniero Panzieri, title: "The Capitalist Use of Machinery", year: 1961}
      - {author: Mario Tronti, title: "Workers and Capital", year: 1966}
      - {author: Mariarosa Dalla Costa and Selma James, title: "The Power of Women and the Subversion of the Community", year: 1972}
      - {author: Antonio Negri, title: "Marx Beyond Marx", year: 1979}
      - {author: Michael Hardt and Antonio Negri, title: "Empire", year: 2000}

  # ------------------------------------------------------------------
  - id: marxism.dependency
    regions: [Latin America, Brazil, Chile, Africa]
    self: >-
      Underdevelopment is not a stage the rich countries passed through and the poor will leave behind;
      it is the other face of the same process. Latin America was drawn into the world market in the
      sixteenth century to produce what the centre needed, and its surplus has flowed outward ever since,
      through trade, profit remittances, royalties and debt. Our bourgeoisies are partners of foreign
      capital, not its rivals. To make up for the value transferred abroad, capital here pays wages below
      what workers need to live: superexploitation. Development inside dependency deepens dependency.
      The way out runs through socialism, not through another round of foreign investment.
    record:
      - date: 1949–1950
        text: >-
          Raúl Prebisch and the UN Economic Commission for Latin America argue that the terms of trade move
          against exporters of primary goods, a non-Marxist starting point that the dependency school
          radicalizes.
      - date: 1957–1967
        text: >-
          Paul Baran's The Political Economy of Growth (1957) and Andre Gunder Frank's "development of
          underdevelopment" (1966–67) argue that integration into the world market produces backwardness.
      - date: 1967–1973
        text: >-
          Ruy Mauro Marini, Theotônio dos Santos and Vânia Bambirra, exiled from Brazil after the 1964 coup,
          work in Santiago during the Allende government; the 1973 coup sends them into exile again.
      - date: 1969–2002
        text: >-
          Fernando Henrique Cardoso and Enzo Faletto argue that "associated dependent development" is
          possible; as president of Brazil (1995–2002) Cardoso privatizes state firms including the mining
          company Vale.
      - date: 1972
        text: >-
          Walter Rodney's How Europe Underdeveloped Africa carries the argument into African history.
      - date: 1980s
        text: >-
          The Latin American debt crisis and IMF adjustment programmes, which cut wages and public spending
          to service foreign debt, are read by the school as confirmation.
    descendsFrom:
      - {id: marxism.leninism, event: "Baran's Political Economy of Growth extends the theory of imperialism", date: 1957}
    breaksWith:
      - {id: marxism.ml, event: "Critique of Communist parties' alliance with the 'national bourgeoisie' and of the feudalism thesis", date: 1967}
    analysis:
      conditions: >-
        Import-substituting industrialization in Latin America from the 1930s to the 1960s brought
        factories but did not end dependence: foreign subsidiaries took the dynamic sectors and remitted
        profits, machinery had to be imported and paid for with primary exports whose relative prices
        fell, and balance-of-payments crises recurred. The Cuban revolution (1959) showed that a break was
        possible; the coups in Brazil (1964) and elsewhere showed where reformist alliances with the
        national bourgeoisie led.
      class_base: >-
        Social scientists in Latin American universities and research centres, students, left parties and
        movements (Brazil's landless workers' movement reads Marini); today heterodox economists and
        sociologists across the South and a revival among scholars of global value chains.
      function: >-
        It is the main source of the claim that poverty in the periphery is produced by integration into
        the world economy, a claim this instrument's frame shares. Its revival measures superexploitation
        in global value chains, where wages in Southern supplier plants fall far below core wages for
        comparable productivity (John Smith, Intan Suwandi). Its Cardoso branch shows the opposite use:
        "associated development" became a rationale for opening to foreign capital, and its author
        presided over privatization.
      disputed: >-
        Bill Warren argued that imperialism pioneers capitalist development in the periphery; Robert
        Brenner (1977) and Ernesto Laclau (1971) argued that dependency theory defines capitalism by trade
        rather than by relations of production; dependency theorists reply that the world market, not the
        single nation, is where value is produced and distributed.
    keyTexts:
      - {author: Paul A. Baran, title: "The Political Economy of Growth", year: 1957}
      - {author: Andre Gunder Frank, title: "Capitalism and Underdevelopment in Latin America", year: 1967}
      - {author: Theotônio dos Santos, title: "The Structure of Dependence", year: 1970}
      - {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}
      - {author: Ruy Mauro Marini, title: "Dialéctica de la dependencia", year: 1973}

  # ------------------------------------------------------------------
  - id: marxism.world-systems
    regions: [United States, Latin America, East Asia]
    self: >-
      The unit of analysis is not the nation but the world-system. Since the long sixteenth century there
      has been one capitalist world-economy, with a single division of labour among core, semi-periphery
      and periphery, a system of competing states, and a succession of hegemonic powers: the Dutch, the
      British, the Americans. The endless accumulation of capital is its defining drive. Each hegemony
      rises and declines in long cycles, and the present system is approaching limits it cannot overcome.
      We are in a structural crisis, a bifurcation whose outcome is not given: what comes next will be
      decided by struggle, and it may be better or worse.
    record:
      - date: 1974
        text: >-
          Immanuel Wallerstein publishes the first volume of The Modern World-System.
      - date: 1976
        text: >-
          The Fernand Braudel Center is founded at Binghamton University as the school's institutional
          base.
      - date: 1977
        text: >-
          Robert Brenner's critique of "neo-Smithian Marxism" opens a lasting debate over whether
          capitalism arose from trade or from class relations in the countryside.
      - date: 1994
        text: >-
          Giovanni Arrighi's The Long Twentieth Century traces cycles of accumulation and the turn to
          finance at the end of each hegemony.
      - date: 2005
        text: >-
          Wallerstein and Samir Amin are among the signers of the Porto Alegre Manifesto at the World
          Social Forum.
      - date: 2007
        text: >-
          Arrighi's Adam Smith in Beijing reads China's rise as the possible end of Western hegemony.
    descendsFrom:
      - {id: marxism.dependency, event: "Wallerstein's synthesis of dependency theory and Braudel's history", date: 1974}
    breaksWith:
      - {id: marxism.analytical, event: "The Brenner debate on the origins of capitalism", date: 1977}
    analysis:
      conditions: >-
        The early 1970s ended the postwar order: the dollar left gold (1971), oil prices jumped, the US
        lost in Vietnam, and dozens of newly independent states stayed poor despite independence. The
        nation-state no longer looked like the unit in which development happened, and a theory that took
        the whole world economy as its object answered the moment.
      class_base: >-
        Academic sociologists and historians, first in the US and then across the South; readers in NGOs,
        alter-globalization movements and Southern policy circles. It has no organization of its own.
      function: >-
        Its vocabulary of core, semi-periphery and periphery is now common, including in this instrument's
        Situation layer. Arrighi's reading of East Asia's rise as a shift of hegemony informs arguments for
        multipolarity among Southern intellectuals and officials. Because it defines capitalism mainly
        through world markets and states, it says less about who acts inside a country, which limits its
        use as a strategy.
      disputed: >-
        Robert Brenner and Ellen Meiksins Wood argue that capitalism is defined by class relations in
        production, which arose in English agriculture, not by world trade; world-systems writers reply
        that no part of the system can be understood apart from the whole.
    keyTexts:
      - {author: Immanuel Wallerstein, title: "The Modern World-System I", year: 1974}
      - {author: "Giovanni Arrighi, Terence K. Hopkins and Immanuel Wallerstein", title: "Antisystemic Movements", year: 1989}
      - {author: Giovanni Arrighi, title: "The Long Twentieth Century", year: 1994}
      - {author: Immanuel Wallerstein, title: "World-Systems Analysis: An Introduction", year: 2004}
      - {author: Giovanni Arrighi, title: "Adam Smith in Beijing", year: 2007}

  # ------------------------------------------------------------------
  - id: marxism.third-worldism
    regions: [Africa, Middle East, Latin America, South Asia]
    self: >-
      The main line of class struggle in the world runs between the imperialist centre and the exploited
      periphery. Through unequal exchange an hour of labour in the South trades for a fraction of an hour
      in the North, and wealth flows north in every transaction. That drain, not superior virtue or
      skill, underwrites the centre's living standards, and the centre's working classes share in it.
      Socialism in the periphery requires delinking: subordinating external relations to popular
      development at home instead of adjusting to the world market. The peoples of Asia, Africa and Latin
      America, their national and popular movements, are the main force of world transformation. Bandung
      was a beginning.
    record:
      - date: 1955
        text: >-
          The Bandung conference of 29 Asian and African states sets out principles of sovereignty and
          non-alignment.
      - date: 1966
        text: >-
          The Tricontinental Conference in Havana joins movements of Asia, Africa and Latin America against
          imperialism.
      - date: 1969–1973
        text: >-
          Arghiri Emmanuel's Unequal Exchange (1969) and Samir Amin's Accumulation on a World Scale (1970)
          and Unequal Development (1973) give the current its economics; Charles Bettelheim replies to
          Emmanuel that the wage gap reflects productivity, not the exploitation of the South by core
          workers.
      - date: 1974
        text: >-
          The UN General Assembly adopts the Declaration on a New International Economic Order demanded by
          the Group of 77; core states do not implement it.
      - date: 1985
        text: >-
          Amin's Delinking sets out a strategy of subordinating external relations to internal popular
          development.
      - date: 2016–2024
        text: >-
          John Smith, Zak Cope, Intan Suwandi, and Jason Hickel with co-authors publish estimates of the
          value drained from the South through unequal exchange, reaching tens of trillions of dollars
          since 1960.
    descendsFrom:
      - {id: marxism.maoism, event: "Lin Biao's thesis of the world countryside encircling the world cities", date: 1965}
      - {id: marxism.dependency, event: "Emmanuel's Unequal Exchange", date: 1969}
    breaksWith:
      - {id: marxism.ml, event: "Emmanuel–Bettelheim debate on unequal exchange and core workers", date: 1969}
    analysis:
      conditions: >-
        Decolonization between 1945 and 1975 produced dozens of formally independent states that still
        exported raw materials at falling relative prices and imported manufactures and capital. Labour
        parties in the core often backed their own states' colonial wars (the French socialists in
        Algeria) or kept silent. Intellectuals in the periphery concluded that independence had not
        stopped the transfer of value and that core labour was not a reliable ally.
      class_base: >-
        Intellectuals and policy cadres of the periphery (Dakar, Cairo, Havana, Dar es Salaam), national
        liberation movements, and later Southern NGOs and social forums. In the core, small groups, and
        since the 2010s a growing readership among young activists and academics who read Hickel and
        Smith.
      function: >-
        It names and measures the drain directly, which makes it the current closest to this instrument's
        own frame, and that is stated plainly here. Its claim that core workers share in the drain
        divides movements in the core: it obliges them to weigh the periphery, and critics say it can
        demobilize core workers or treat them as enemies. Its delinking strategy informs Southern
        arguments for capital controls, food sovereignty and South–South trade.
      disputed: >-
        The labour aristocracy debate: Emmanuel and Zak Cope hold that core workers as a whole gain from
        unequal exchange; Bettelheim and Charles Post hold that wage gaps reflect productivity and that
        core reformism has other causes; Amin held that core workers gain in part, which is the frame's
        line.
    keyTexts:
      - {author: Arghiri Emmanuel, title: "Unequal Exchange", year: 1969}
      - {author: Samir Amin, title: "Accumulation on a World Scale", year: 1970}
      - {author: Samir Amin, title: "Unequal Development", year: 1973}
      - {author: Samir Amin, title: "Delinking", year: 1985}
      - {author: Zak Cope, title: "Divided World Divided Class", year: 2012}

  # ------------------------------------------------------------------
  - id: marxism.analytical
    regions: [United States, Britain, Belgium, Scandinavia]
    self: >-
      Marx's central claims about exploitation, class and history deserve to be stated with the clarity
      of modern philosophy and social science, and then tested. We drop what does not survive, the labour
      theory of value as a theory of prices, dialectics as a special logic, functional explanation
      without a mechanism, and we keep what does: exploitation as an injustice rooted in unequal
      ownership of productive assets, class as a relation of control, history driven by the development
      of the productive forces, and socialism as both just and feasible. No-bullshit Marxism is not
      Marxism diluted. It is the version that can hold its own in any seminar room.
    record:
      - date: 1978
        text: >-
          G. A. Cohen's Karl Marx's Theory of History: A Defence restates historical materialism in the
          terms of analytic philosophy.
      - date: 1979
        text: >-
          The September Group begins meeting, including Cohen, Jon Elster, John Roemer, Erik Olin Wright,
          Adam Przeworski, Philippe Van Parijs and Robert Brenner.
      - date: 1982–1985
        text: >-
          Roemer's A General Theory of Exploitation and Class (1982), Elster's Making Sense of Marx (1985)
          and Wright's Classes (1985).
      - date: 1994–1995
        text: >-
          Roemer's A Future for Socialism proposes coupon market socialism; Van Parijs's Real Freedom for
          All argues for a universal basic income.
      - date: 2009–2010
        text: >-
          Cohen's Why Not Socialism? and Wright's Envisioning Real Utopias.
      - date: 1979–present
        text: >-
          No party or movement has organized under its name; its influence runs through universities and
          policy debates.
    descendsFrom:
      - {id: marxism.western, event: "The analytic turn in Anglo-American Marxist philosophy", date: 1978}
    breaksWith:
      - {id: marxism.classical, event: "Abandonment of the labour theory of value after the Sraffian critique", date: 1977}
      - {id: marxism.structural, event: "Rejection of Althusserian structuralism and dialectics", date: 1978}
    analysis:
      conditions: >-
        After 1968 a generation of radicals entered Anglo-American universities dominated by analytic
        philosophy and rational-choice social science; the Sraffian critique (Ian Steedman's Marx After
        Sraffa, 1977) shook the labour theory of value; and the decline of Marxist parties left academic
        Marxism needing to justify itself in that academy's terms.
      class_base: >-
        Academic philosophers, sociologists, political scientists and economists in the US, Britain,
        Belgium and Scandinavia; its readership is salaried professional.
      function: >-
        It supplies the normative and empirical vocabulary of academic democratic socialism and of
        basic-income advocacy, and Wright's class maps are standard in sociology. Its methodological
        individualism and its focus on just distribution centre debate on who owns what within a nation.
        Roemer's theory of exploitation can be applied across borders, but the current's programmes
        (coupon socialism, basic income) are designed for core welfare states, where a basic income would
        be funded in part from incomes that rest on the drain.
      disputed: >-
        Ellen Meiksins Wood (1989) and other critics argue that dropping dialectics and the labour theory
        of value removes what made Marxism distinct; the analytical Marxists reply that a claim that
        cannot be stated clearly cannot be defended.
    keyTexts:
      - {author: G. A. Cohen, title: "Karl Marx's Theory of History: A Defence", year: 1978}
      - {author: John E. Roemer, title: "A General Theory of Exploitation and Class", year: 1982}
      - {author: Jon Elster, title: "Making Sense of Marx", year: 1985}
      - {author: Erik Olin Wright, title: "Classes", year: 1985}
      - {author: G. A. Cohen, title: "Why Not Socialism?", year: 2009}

  # ------------------------------------------------------------------
  - id: marxism.market-socialism
    regions: [former Yugoslavia, Hungary, Cuba, Vietnam]
    self: >-
      Socialism means social ownership of the means of production, not the abolition of markets. Lange
      showed that a socialist economy can use prices to allocate resources efficiently, and experience
      since has shown that planning every product from the centre chokes on information and incentives.
      So keep markets for consumer goods and much else, but abolish the capitalist's claim on profit:
      firms owned by their workers or by the public, competing on quality and price, with investment
      steered democratically. Yugoslav self-management, cooperatives such as Mondragon, and the reform
      economists of the East proved that markets can serve socialism. Markets are older than capitalism
      and will outlive it.
    record:
      - date: 1936–1937
        text: >-
          Oskar Lange's "On the Economic Theory of Socialism" answers Ludwig von Mises and Friedrich Hayek
          in the socialist calculation debate.
      - date: 1950–1965
        text: >-
          After the break with Stalin, Yugoslavia hands enterprises to elected workers' councils (1950) and
          in 1965 widens market allocation; growth is fast through the 1960s.
      - date: 1968
        text: >-
          Hungary's New Economic Mechanism gives state enterprises autonomy to respond to prices and
          profits.
      - date: 1970s–1991
        disputed: true
        text: >-
          Yugoslavia combines self-management with rising unemployment, about a million citizens working
          abroad, widening regional gaps and foreign debt near $20 billion; IMF austerity in the 1980s
          precedes the federation's breakup. Whether market self-management caused the crisis (its critics)
          or debt, austerity and Cold War politics did (Susan Woodward and others) is disputed.
      - date: 1983
        text: >-
          Alec Nove's The Economics of Feasible Socialism argues for a mixed socialist economy of state,
          cooperative and small private firms.
      - date: 2011
        text: >-
          Cuba's party congress approves guidelines that expand cooperatives and small private businesses
          within a planned economy.
    descendsFrom:
      - {id: marxism.classical, event: "The socialist calculation debate", date: 1936}
    breaksWith:
      - {id: marxism.ml, event: "Tito–Stalin split and the turn to self-management", date: 1948}
    analysis:
      conditions: >-
        The Austrian challenge (Mises, 1920) forced socialists to show how a socialist economy could
        calculate. By the 1960s the planned economies of eastern Europe needed to move from building heavy
        industry to raising productivity and consumer supply, where command planning's problems of
        information and incentives bit hardest. Yugoslavia, expelled from the Soviet bloc in 1948, also
        needed Western credit and markets.
      class_base: >-
        Reform economists and planners in eastern Europe, enterprise managers who gained autonomy and
        income from it, and skilled workers in successful firms; in the West, academic economists and the
        cooperative movement. In Yugoslavia managers and technical staff gained most from enterprise
        autonomy, while workers in weaker regions and firms bore the unemployment.
      function: >-
        It is the main socialist answer to the calculation critique and makes socialism legible to
        economists and professionals. By the frame it regulates the law of value without abolishing it:
        firms that compete on world markets remain under the pressure of world prices, which is how
        Yugoslav enterprises ended by exporting labour and borrowing abroad. Its present uses are in
        cooperative sectors and in reform programmes in Cuba and Vietnam.
      disputed: >-
        Ernest Mandel and Alec Nove debated (1986–87) whether markets would restore capitalist pressures
        under socialism; followers of Hayek hold that without private ownership of capital, prices carry
        no real information about scarcity.
    keyTexts:
      - {author: Oskar Lange, title: "On the Economic Theory of Socialism", year: 1936}
      - {author: Alec Nove, title: "The Economics of Feasible Socialism", year: 1983}
      - {author: David Schweickart, title: "Against Capitalism", year: 1993}
      - {author: John E. Roemer, title: "A Future for Socialism", year: 1994}

  # ------------------------------------------------------------------
  - id: marxism.ecosocialism
    regions: [Western Europe, North America, Latin America]
    self: >-
      Capital must grow or die, and a planet does not grow. Marx already saw the metabolic rift:
      capitalist agriculture robbing the soil and shipping its nutrients to the cities, breaking the
      cycle between society and nature. Green capitalism cannot heal the rift, because the profit motive
      turns every efficiency gain into new expansion. We want public ownership of energy and key
      industries, democratic ecological planning, a just transition led by the workers and communities
      who bear its costs, and the rich countries paying their climate debt to the South. The choice is
      ecosocialism or ecological barbarism.
    record:
      - date: 1988
        text: >-
          James O'Connor founds the journal Capitalism Nature Socialism and theorizes a "second
          contradiction" between capital and its natural conditions.
      - date: 2000
        text: >-
          John Bellamy Foster's Marx's Ecology recovers Marx's theory of the metabolic rift.
      - date: 2001–2009
        text: >-
          Joel Kovel and Michael Löwy issue An Ecosocialist Manifesto (2001); the Belém Ecosocialist
          Declaration follows at the 2009 World Social Forum.
      - date: 2010
        text: >-
          Bolivia hosts the World People's Conference on Climate Change and the Rights of Mother Earth at
          Cochabamba, which demands climate debt payments from the rich countries.
      - date: 2012
        text: >-
          France's Left Party adopts a manifesto for ecosocialism; ecological planning becomes central to
          the programme of La France Insoumise.
      - date: 2016
        text: >-
          Andreas Malm's Fossil Capital argues that British industry turned to coal because steam gave
          capital control over labour.
    descendsFrom:
      - {id: marxism.classical, event: "Recovery of Marx's theory of the metabolic rift", date: 1988}
    breaksWith:
      - {id: ecology.green-growth, event: "Rejection of market-based climate policy at Copenhagen and Cochabamba", date: "2009–2010"}
    analysis:
      conditions: >-
        From the 1970s ecological damage became visible and political, Green parties recruited the new
        middle strata away from the left, and Chernobyl (1986) discredited Soviet productivism. Marxists
        answered by recovering Marx's ecology. Since the 2000s climate breakdown and struggles in the
        periphery against mines, dams and oil have given the current a material base beyond academia.
      class_base: >-
        In the core: academics, students, environmental NGO staff and professionals, with some
        energy-sector and public-sector unions. In the periphery: indigenous and peasant movements against
        extraction, and for a time governments such as Bolivia's under the MAS.
      function: >-
        It contests green capitalism by insisting that public ownership and planning, not carbon markets,
        decide the transition. Core ecosocialist programmes often centre on national Green New Deals that
        depend on lithium, copper and cobalt mined in the periphery; by the frame, a core transition that
        leaves mine wages and mineral prices set by core buyers sustains the drain, which is why the
        current's Southern wing demands climate debt and sovereignty over minerals.
      disputed: >-
        Degrowth communists (Kohei Saito, Jason Hickel) hold that rich-country output must shrink;
        ecomodernist socialists (Matt Huber, Leigh Phillips) hold that material abundance for workers is
        the only basis for a winning climate politics.
    keyTexts:
      - {author: James O'Connor, title: "Capitalism, Nature, Socialism: A Theoretical Introduction", year: 1988}
      - {author: John Bellamy Foster, title: "Marx's Ecology", year: 2000}
      - {author: Joel Kovel and Michael Löwy, title: "An Ecosocialist Manifesto", year: 2001}
      - {author: Joel Kovel, title: "The Enemy of Nature", year: 2002}
      - {author: Andreas Malm, title: "Fossil Capital", year: 2016}

  # ------------------------------------------------------------------
  - id: marxism.degrowth-communism
    regions: [Japan, Western Europe, North America]
    self: >-
      Late Marx broke with productivism. Studying natural science and the Russian peasant commune, he
      came to see a communism of the commons, steady and sustainable, not an endless race of the
      productive forces. Green growth is a fantasy: rich economies have not cut their use of energy and
      materials fast enough, and will not while growth is the goal. In the rich countries we must scale
      down what is useless and destructive, SUVs, private jets, advertising, planned obsolescence, expand
      the commons, shorten the working week and put use value before exchange value. This is not
      austerity. It is radical abundance: public wealth in place of private riches.
    record:
      - date: 2017
        text: >-
          Kohei Saito's Karl Marx's Ecosocialism argues from Marx's notebooks that his late work was
          ecological and turned against productivism.
      - date: 2020
        text: >-
          Saito's Capital in the Anthropocene sells over half a million copies in Japan; Jason Hickel's
          Less Is More argues for degrowth in rich countries.
      - date: 2023
        text: >-
          Saito's Marx in the Anthropocene appears in English; the Beyond Growth conference is held in the
          European Parliament.
      - date: 2024
        text: >-
          Ecomodernist Marxists, notably Matt Huber and Leigh Phillips, publish critiques of Saito, opening
          a debate over whether workers will support a politics of less.
      - date: 2017–present
        text: >-
          No party in government has adopted degrowth communism; the current lives in publishing, academia
          and climate activism.
    descendsFrom:
      - {id: marxism.ecosocialism, event: "Saito's reading of Marx's ecological notebooks", date: 2017}
      - {id: ecology.degrowth, event: "Convergence with the degrowth movement", date: 2020}
    breaksWith:
      - {id: marxism.classical, event: "Rejection of the productivist historical materialism of the Second International", date: 2020}
    analysis:
      conditions: >-
        Growth in the core slowed after 2008, and Japan has had little for three decades, so young people
        in rich countries already live with flat wages and expensive housing while climate breakdown is
        visible. When growth no longer brings them rising wages, a politics that asks for less growth and
        more public provision costs them less and offers them more.
      class_base: >-
        Students, young graduates in insecure work, academics, and NGO and climate-movement staff in
        Japan, western Europe and North America: overwhelmingly salaried and student strata in the core.
      function: >-
        Cutting the core's material and energy throughput directly reduces the resources and labour the
        core claims from the periphery, so by the frame it reduces the drain, provided it comes with fair
        prices for Southern exports and room for Southern growth, as Hickel insists. Without that, a core
        slowdown can cut demand for Southern exports, and core workers asked to consume less may turn to
        parties that promise them growth.
      disputed: >-
        Matt Huber argues that degrowth speaks for professional strata and cannot win workers; Saito and
        Hickel reply that public abundance, shorter hours and decommodified services are material gains
        for workers, and that the climate leaves no other road.
    keyTexts:
      - {author: Kohei Saito, title: "Karl Marx's Ecosocialism", year: 2017}
      - {author: Kohei Saito, title: "Capital in the Anthropocene", year: 2020}
      - {author: Jason Hickel, title: "Less Is More", year: 2020}
      - {author: Kohei Saito, title: "Marx in the Anthropocene", year: 2023}

  # ------------------------------------------------------------------
  - id: marxism.social-reproduction
    regions: [Argentina, Spain, Italy, United States, Britain]
    self: >-
      Capital needs workers, and workers have to be made: born, fed, washed, taught, nursed and
      comforted, every day and in every generation. Most of that work is done unpaid in homes, or
      underpaid in schools, hospitals and care homes, overwhelmingly by women and more and more by
      migrant women. The production of life and the production of profit form one system, so the
      oppression of women, and racial and migrant hierarchies too, are built into how capitalism
      reproduces its workforce. That is why strikes by teachers, nurses and care workers, and the women's
      strike, are class struggle. Feminism for the 99 percent, not for the boardroom.
    record:
      - date: 1972–1975
        text: >-
          The Wages for Housework campaign (Dalla Costa, James, Federici) and the domestic labour debate
          argue over whether housework creates value for capital.
      - date: 1983
        text: >-
          Lise Vogel's Marxism and the Oppression of Women sets out a unitary theory rooting women's
          oppression in capitalism's need to reproduce labour power.
      - date: 2015–2017
        text: >-
          Argentina's Ni Una Menos movement (2015) and the International Women's Strike (8 March 2017)
          mobilize millions.
      - date: 2017
        text: >-
          Tithi Bhattacharya's edited volume Social Reproduction Theory names the current.
      - date: 2018
        text: >-
          Spanish unions report 5.3 million taking part in the 8 March feminist strike; in the US,
          statewide teachers' strikes begin in West Virginia, read by the current as struggles over social
          reproduction.
      - date: 2019
        text: >-
          Cinzia Arruzza, Tithi Bhattacharya and Nancy Fraser publish Feminism for the 99%.
    descendsFrom:
      - {id: marxism.western, event: "The Marxist-feminist domestic labour debate", date: 1972}
      - {id: marxism.autonomism, event: "Wages for Housework", date: 1972}
    breaksWith:
      - {id: marxism.classical, event: "Critique of Engels's view that wage work alone would free women", date: 1972}
      - {id: feminism.liberal, event: "Feminism for the 99% against corporate feminism", date: 2019}
    analysis:
      conditions: >-
        After the 1960s women entered paid work in the core in large numbers while unpaid housework stayed
        with them; from the 1980s welfare-state cuts pushed care back into households; and core households
        increasingly bought care from migrant women from the Philippines, Latin America and eastern
        Europe. The double day and the care gap posed the current's question: who makes the workers, and
        who pays for it?
      class_base: >-
        Women workers in education, health and care; feminist activists; academics. In Argentina and Spain
        the mass feminist movements cut across classes, with the current among their organizers.
      function: >-
        It ties feminist mobilization to labour struggle in sectors that cannot be offshored, schools,
        hospitals and care homes, which gives strikes there real leverage over the state budget. It also
        exposes a drain of care: core households and health systems rely on women trained at the
        periphery's expense and paid below core rates, while their own children are cared for by others
        at home (Rhacel Parreñas). Core feminist programmes that depend on cheap migrant care sustain that
        transfer.
      disputed: >-
        Whether housework produces value for capital (Wages for Housework) or only use values that lower
        the cost of labour power (Vogel); and whether patriarchy is a system alongside capitalism
        (dual-systems theory, Heidi Hartmann) or part of capitalism's reproduction (the unitary theory).
    keyTexts:
      - {author: Mariarosa Dalla Costa and Selma James, title: "The Power of Women and the Subversion of the Community", year: 1972}
      - {author: Silvia Federici, title: "Wages Against Housework", year: 1975}
      - {author: Lise Vogel, title: "Marxism and the Oppression of Women", year: 1983}
      - {author: Tithi Bhattacharya (ed.), title: "Social Reproduction Theory", year: 2017}
      - {author: "Cinzia Arruzza, Tithi Bhattacharya and Nancy Fraser", title: "Feminism for the 99%", year: 2019}

  # ------------------------------------------------------------------
  - id: marxism.black-radical
    regions: [United States, Caribbean, Britain, Southern Africa]
    self: >-
      Capitalism was racial capitalism from its birth, built on the Atlantic slave trade, the plantation
      and colonial plunder, and race still sorts who works, who is policed and who is left to die. Du
      Bois showed that the enslaved freed themselves by a general strike, and that white workers took a
      psychological wage of whiteness in place of solidarity; C. L. R. James put the Haitian revolution
      at the centre of the modern world; Rodney showed how Europe underdeveloped Africa. Black liberation
      is not a side issue for socialism. It is at the centre, and it is internationalist, joined to
      Africa, the Caribbean and every colonized people.
    record:
      - date: 1919–1928
        text: >-
          The African Blood Brotherhood joins Black radicals to the communist movement; the Comintern's
          1928 resolution calls for self-determination for African Americans in the Black Belt South.
      - date: 1931–1938
        text: >-
          Communists defend the Scottsboro defendants and organize Alabama sharecroppers; Du Bois publishes
          Black Reconstruction (1935) and C. L. R. James The Black Jacobins (1938).
      - date: 1966–1971
        text: >-
          The Black Panther Party, founded in Oakland in 1966, runs free breakfast and health programmes and
          armed patrols watching the police; the FBI's COINTELPRO targets it, and Chicago police kill Fred
          Hampton in a 1969 raid, the subject of a $1.85 million settlement in 1982.
      - date: 1968–1971
        text: >-
          The League of Revolutionary Black Workers organizes Black auto workers in Detroit against both
          the companies and the union leadership.
      - date: 1980
        disputed: true
        text: >-
          Walter Rodney is killed by a bomb in Guyana. A 2016 commission of inquiry found that the
          government of Forbes Burnham was involved; Burnham's party rejected its findings.
      - date: 1983
        text: >-
          Cedric Robinson's Black Marxism sets out the concept of racial capitalism.
      - date: 2020
        text: >-
          Protests after the police killing of George Floyd draw an estimated 15 to 26 million people in
          the US; the Movement for Black Lives calls for divestment from policing and for reparations.
    descendsFrom:
      - {id: nationalism.pan-africanism, event: "Pan-African congresses and the radical Black press", date: 1919}
      - {id: marxism.leninism, event: "Comintern resolution on the Negro question", date: 1928}
    breaksWith:
      - {id: marxism.ml, event: "George Padmore's break with the Comintern over its retreat from anti-colonial work", date: 1933}
    analysis:
      conditions: >-
        Slavery and its aftermath in the Americas, sharecropping, Jim Crow, and a labour market split by
        race in which Black workers were hired last, paid least and used as strikebreakers while many
        white unions excluded them; colonial rule in Africa and the Caribbean. The split gave employers a
        lever over all workers and gave white workers a status wage in place of solidarity, so class and
        race could not be fought apart.
      class_base: >-
        Black industrial workers, sharecroppers, the urban unemployed, and Caribbean and African
        intellectuals; today Black working-class communities and organizers in prison abolition, tenant
        and labour campaigns, with an academic wing (Robin D. G. Kelley, Ruth Wilson Gilmore).
      function: >-
        In the US it supplies the main account linking police, prisons and racialized surplus
        populations: prisons absorb people, land and capital left idle by deindustrialization (Gilmore).
        After 2020, corporations and foundations adopted the language of racial justice and funded
        nonprofits, which moved organizers into salaried professional roles and took the race half of
        racial capitalism without the capitalism half. Internationally it binds Black politics in the core
        to Africa, the Caribbean and Palestine.
      disputed: >-
        Class-first critics (Adolph Reed Jr., Walter Benn Michaels) argue that race-centred politics serves
        a Black professional stratum and divides workers; the tradition replies that race structures class
        itself. Robinson's claim that Marxism is itself Eurocentric is contested by Marxists inside the
        tradition and outside it.
    keyTexts:
      - {author: W. E. B. Du Bois, title: "Black Reconstruction in America", year: 1935}
      - {author: C. L. R. James, title: "The Black Jacobins", year: 1938}
      - {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}
      - {author: Cedric J. Robinson, title: "Black Marxism", year: 1983}
      - {author: Ruth Wilson Gilmore, title: "Golden Gulag", year: 2007}

  # ------------------------------------------------------------------
  - id: marxism.mariategui
    regions: [Peru, Bolivia, Andes]
    self: >-
      Socialism in Latin America will be neither copy nor imitation: it must be a heroic creation, giving
      life to Indo-American socialism in our own reality and our own language. In Peru the problem of the
      Indian is the problem of land, not of race, education or charity; it is the gamonal landlord and
      the great estate. The indigenous community, with its living habits of cooperation, is a seed of
      socialism, not a relic. Our bourgeoisie is tied to imperialism and will never carry out an agrarian
      revolution. Only a socialist movement that unites the indigenous peasantry with the workers of the
      cities and the mines can free the nation.
    record:
      - date: 1926
        text: >-
          José Carlos Mariátegui founds the journal Amauta in Lima.
      - date: 1928–1929
        text: >-
          He breaks with Víctor Raúl Haya de la Torre's APRA over the class character of anti-imperialism,
          publishes Seven Interpretive Essays on Peruvian Reality and founds the Socialist Party of Peru;
          the CGTP labour confederation follows in 1929.
      - date: 1929–1930
        text: >-
          At the Buenos Aires conference of Latin American communist parties, Comintern delegates reject
          the Peruvian theses on race and the party's socialist name; after Mariátegui's death in April
          1930 the party becomes the Communist Party of Peru.
      - date: 1970–1980
        disputed: true
        text: >-
          The faction that becomes the Shining Path takes its name from the slogan "along the shining path
          of José Carlos Mariátegui"; most Peruvian Marxists reject its claim to his legacy.
      - date: 2021–2023
        disputed: true
        text: >-
          Pedro Castillo, a rural teacher, wins the presidency for Perú Libre, a party that calls itself
          Marxist-Leninist-Mariateguist (he leaves it in 2022). In December 2022 he announces the
          dissolution of Congress and is removed and arrested; about 50 protesters are killed by security
          forces in the following months. His supporters call his removal a coup by the Lima elite; his
          opponents call his act a self-coup.
    descendsFrom:
      - {id: marxism.leninism, event: "Founding of the Socialist Party of Peru, affiliated to the Comintern", date: 1928}
    breaksWith:
      - {id: marxism.ml, event: "Buenos Aires conference rejects the Peruvian theses", date: 1929}
    analysis:
      conditions: >-
        Peru in the 1920s combined coastal export enclaves (sugar, cotton, and US-owned mines such as
        Cerro de Pasco) with highland estates where an indigenous majority worked under servile tenure,
        and the Leguía government opened the country to US capital. The enclaves drew cheap labour and
        food from the highlands, so foreign capital and the gamonal landlords sustained each other;
        indigenous risings in the south between 1915 and 1924 showed the force shut out of national
        politics.
      class_base: >-
        Historically Lima workers, students, provincial intellectuals and indigenous peasant organizers.
        Today Andean left intellectuals, teachers' unions, peasant patrols (rondas) and indigenous and
        rural voters of the southern highlands, the base that elected Castillo.
      function: >-
        It is the Latin American tradition that joins land, indigeneity and anti-imperialism. In the Andes
        it frames struggles over mining rents and water (copper, gold, lithium) as struggles over land and
        sovereignty against the coastal and comprador elites who broker mineral exports. The Peruvian
        crisis of 2021–23 showed the mechanism: a rural indigenous electorate won the presidency; a
        Congress dominated by parties of the coast and the export economy blocked and then removed the
        president after his attempt to dissolve it; and the protests that followed were met with lethal
        force.
      disputed: >-
        Whether the indigenous community is a base for socialism (Mariátegui; García Linera) or a peasant
        economy that capitalism will dissolve and socialism must modernize (the Comintern in 1929, many
        orthodox Marxist-Leninists); and who inherits Mariátegui, a claim contested among the Shining Path,
        the Peruvian communist parties and the Andean indigenous left.
    keyTexts:
      - {author: José Carlos Mariátegui, title: "Seven Interpretive Essays on Peruvian Reality", year: 1928}
      - {author: José Carlos Mariátegui, title: "Aniversario y balance", year: 1928}
      - {author: José Carlos Mariátegui, title: "Defensa del marxismo", year: 1934, note: "essays of 1928–1929, published posthumously"}
      - {author: René Zavaleta Mercado, title: "Lo nacional-popular en Bolivia", year: 1986}
      - {author: Álvaro García Linera, title: "Forma valor y forma comunidad", year: 1995}

  # ------------------------------------------------------------------
  - id: marxism.guevarism
    regions: [Cuba, Latin America, Colombia, Bolivia]
    self: >-
      We need not always wait for all the conditions for revolution; the insurrectionary focus can
      create them. In the Americas the countryside is the main terrain of armed struggle. Socialism is
      not a better way to hand out consumer goods: it is the making of a new man and a new woman, through
      voluntary work, moral incentives and budgetary planning in place of the market's profit and loss.
      Internationalism is a duty, not a sentiment: create two, three, many Vietnams. The true
      revolutionary is guided by great feelings of love. Che gave his life in Bolivia for those words,
      and the Cuban revolution has kept faith with them through sixty years of blockade.
    record:
      - date: 1959–1962
        text: >-
          The 26th of July Movement and the Rebel Army take power in Cuba on 1 January 1959; nationalizations
          follow, the US-backed invasion at the Bay of Pigs fails (1961), and the US imposes a full trade
          embargo (1962).
      - date: 1961
        text: >-
          Cuba's literacy campaign sends over 250,000 teachers and volunteers into the countryside; recorded
          illiteracy falls from about 24 percent to about 4 percent.
      - date: 1963–1965
        text: >-
          In Cuba's "great debate", Guevara as minister of industry argues for budgetary planning and moral
          incentives against advocates of enterprise self-financing and material incentives, with Ernest
          Mandel and Charles Bettelheim taking part. In Algiers in 1965 he criticizes the socialist
          countries for trading with poor countries at world-market prices.
      - date: 1965–1967
        text: >-
          Guevara fights in the Congo (1965) and leads a guerrilla in Bolivia, where the Bolivian army,
          with a CIA officer present, captures and executes him on 9 October 1967.
      - date: 1960s–1979
        disputed: true
        text: >-
          Guerrilla fronts on the foco model appear in Venezuela, Peru, Guatemala, Argentina and Colombia;
          most are destroyed, while Nicaragua's Sandinistas, combining rural, urban and broad-alliance
          strategies, take power in 1979. Whether the defeats show the theory's error (Communist parties,
          Debray's later self-criticism) or local conditions and repression (Guevarists) is disputed.
      - date: 1975–1991
        text: >-
          Cuban troops fight in Angola against South African invasions; after the battle of Cuito
          Cuanavale (1987–88), agreements lead to Namibia's independence (1990). Cuban medical brigades
          serve in dozens of countries.
    descendsFrom:
      - {id: marxism.ml, event: "The Cuban Revolution", date: 1959}
    breaksWith:
      - {id: marxism.ml, event: "Algiers speech criticizing Soviet trade terms and the Communist parties' peaceful road", date: 1965}
    analysis:
      conditions: >-
        Latin America in the 1950s: great estates, rural poverty, US-backed dictatorships such as
        Batista's that closed legal routes, and the US-organized overthrow of Guatemala's elected reform
        government in 1954, which Guevara witnessed. Where reform governments were overthrown and
        Communist parties pursued legal popular fronts, armed struggle by a small determined group looked
        like the only path, and Cuba seemed to prove it.
      class_base: >-
        Historically students and young professionals who went to the mountains, joined in places by
        peasants and rural workers. Today the Cuban state and party carry its symbols; Colombia's ELN
        still organizes on Guevarist lines; and Che's image is carried by youth movements across Latin
        America and beyond, most with no foco strategy at all.
      function: >-
        The foco survives as a strategy in few places. The tradition's present function is moral and
        internationalist: the ideal of sacrifice and the new man, and Cuba's medical internationalism,
        which supplies doctors to poor countries and also earns the blockaded state its largest source of
        foreign exchange. Guevara's Algiers critique, that trade at world prices transfers value from poor
        to rich even between socialist states, anticipates the unequal exchange argument of the frame.
      disputed: >-
        Whether Guevara's budgetary system and moral incentives could sustain production (Bettelheim and
        Cuba's later reforms said not; Mandel and Guevarists said yes); and whether foco theory was a
        strategy or a voluntarist error that sent a generation to defeat.
    keyTexts:
      - {author: Ernesto Che Guevara, title: "Guerrilla Warfare", year: 1960}
      - {author: Ernesto Che Guevara, title: "Socialism and Man in Cuba", year: 1965}
      - {author: Ernesto Che Guevara, title: "Message to the Tricontinental", year: 1967}
