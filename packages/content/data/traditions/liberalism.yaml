traditions:
  - id: liberalism.classical
    regions: [Britain, France, United States, worldwide]
    self: >
      Every person has a right to life, liberty and estate, and government exists to secure these
      rights, by the consent of the governed, under laws that bind rulers as tightly as the ruled.
      Commerce and the division of labor, freed from privilege and monopoly, make nations rich and
      people peaceful; toleration of conscience ends the wars of religion; constitutions that separate
      powers keep any faction from becoming a tyrant. We are not for the rich but for the rule of law,
      careers open to talent, and free trade against guilds, mercantilists and hereditary orders.
      The individual, not the tribe, estate or class, is the unit of moral worth.
    record:
      - date: 1688–1689
        text: >
          The Glorious Revolution deposes James II; the Bill of Rights subordinates the crown to a
          Parliament elected by property owners, and the Toleration Act grants worship to
          Protestant dissenters.
      - date: 1787
        text: >
          The US Constitution establishes separated powers and, later, a Bill of Rights; it also
          counts enslaved people as three-fifths of a person for representation and obliges states
          to return people who escape slavery.
      - date: 1789
        text: >
          The French National Assembly adopts the Declaration of the Rights of Man and of the
          Citizen; the Le Chapelier law of 1791 then bans workers' combinations as restraints on
          free contract.
      - date: 1833
        text: >
          Britain abolishes slavery in most of its colonies, paying £20 million in compensation to
          slaveholders, about 40 percent of the government's annual budget; the enslaved receive
          nothing and must serve years of unpaid "apprenticeship".
      - date: 1839–1842
        text: >
          Britain wages the First Opium War to force China to admit British opium and open its ports;
          the Treaty of Nanking cedes Hong Kong and imposes an indemnity.
      - date: 1846
        text: >
          After a campaign led by Cobden and Bright's Anti-Corn Law League, Parliament repeals the
          Corn Laws, ending protection for landlords' grain.
      - date: 1845–1852
        disputed: true
        text: >
          During the Irish famine about a million people die and a million emigrate while Ireland
          continues to export food; relief is limited by the Whig government's commitment to market
          principles. One reading: doctrinaire laissez-faire turned blight into mass death. Another
          (some economic historians): the scale of the crop failure exceeded what any government of
          the time could have relieved, though more could have been done.
    descendsFrom:
      - {id: liberalism.republican, event: "Commonwealthmen and Whig opposition to Stuart absolutism", date: 1688}
    breaksWith:
      - {id: conservatism.burkean, event: "Burke–Paine controversy splits the Whigs over the French Revolution", date: 1790}
    analysis:
      conditions: >
        It arose in England, where agrarian capitalism, merchant wealth and Atlantic trade (including
        the slave trade) had produced a propertied class in conflict with the Stuart crown over
        taxation and royal monopolies. Property owners needed protection from arbitrary taxation and
        confiscation, so they made a Parliament of property sovereign and described property as
        prior to the state. Locke helped draft the Fundamental Constitutions of Carolina (1669),
        which gave masters absolute power over enslaved people, and argued that land left
        "unimproved" in America could be appropriated.
      class_base: >
        Commercial landowners, merchants, manufacturers and professionals; in the nineteenth century
        industrial capital, which wanted cheap food (and so cheap wages) and open markets.
      function: >
        Its principles of secure property, contract enforcement, independent courts and free trade
        form the legal core of the present world economy: investment treaties, WTO rules and IMF
        conditions protect existing property titles across borders. Because those titles are held
        disproportionately by core capital, enforcing them uniformly secures the core's claims on
        peripheral land, mines and firms and the income that flows from them.
      disputed: >
        Losurdo (Liberalism: A Counter-History, 2011) argues that liberal liberty was from the start
        reserved for a community of free property owners; liberals reply that its universal
        principles were the ones abolitionists and anticolonialists turned against slavery and
        empire.
    keyTexts:
      - {author: John Locke, title: Two Treatises of Government, year: 1689}
      - {author: Montesquieu, title: The Spirit of the Laws, year: 1748}
      - {author: Adam Smith, title: "An Inquiry into the Nature and Causes of the Wealth of Nations", year: 1776}
      - {author: Benjamin Constant, title: "The Liberty of the Ancients Compared with that of the Moderns", year: 1819}
      - {author: Frédéric Bastiat, title: The Law, year: 1850}

  - id: liberalism.utilitarian
    regions: [Britain, British India, worldwide]
    self: >
      Nature has placed mankind under two sovereign masters, pain and pleasure. The test of every
      law, institution and custom is whether it promotes the greatest happiness of the greatest
      number, counted impartially: each to count for one, none for more than one. Not natural rights,
      which are nonsense upon stilts, not tradition, not the will of God as told by priests, but
      measurable consequences. Reform the prisons, the poor law, the courts, the franchise and the
      tariff by evidence and calculation. Liberty of thought and discussion matters because it is how
      we find the truth and how individuals develop.
    record:
      - date: 1791
        text: >
          Bentham publishes his design for the Panopticon, a prison in which inmates can always be
          watched from a central tower; it is not built in his form, but it shapes later prison
          architecture.
      - date: 1819–1858
        text: >
          James Mill, author of The History of British India (1817), takes a senior post at the East
          India Company, where John Stuart Mill also works from 1823 to 1858, drafting dispatches for
          the government of India.
      - date: 1834
        text: >
          The Poor Law Amendment Act, drafted by Benthamites Edwin Chadwick and Nassau Senior, ends
          most outdoor relief and makes the workhouse deliberately worse than the lowest paid work.
      - date: 1867
        text: >
          John Stuart Mill, as a member of Parliament, moves to give women the vote on the same terms
          as men; the amendment fails by 196 votes to 73.
      - date: 1981
        text: >
          Executive Order 12291 requires US federal agencies to justify major regulations by
          cost-benefit analysis, which becomes standard in regulatory agencies and development
          banks worldwide.
    descendsFrom:
      - {id: liberalism.classical, event: "Bentham's A Fragment on Government attacks Blackstone", date: 1776}
    breaksWith:
      - {id: liberalism.classical, event: "Bentham's critique of natural rights in Anarchical Fallacies", date: "1790s"}
    analysis:
      conditions: >
        It arose in industrializing Britain, which needed rational administration of courts, prisons,
        poor relief and public health, and a new middle class wanted to sweep away aristocratic
        sinecures and custom. A calculus of aggregate welfare gave reformers a criterion against
        tradition and privilege, and gave administrators at home and in India a tool of rule.
      class_base: >
        Middle-class reformers, civil servants, economists and colonial administrators; today
        economists, policy analysts and the effective altruism milieu.
      function: >
        It lives on as cost-benefit analysis and welfare economics in finance ministries, regulators
        and the World Bank. Costs and benefits are measured by willingness to pay, which depends on
        income, so the preferences of the rich weigh more, and across borders a statistical life in a
        poor country is valued lower than one in a rich country. Projects and climate policies
        appraised this way favor the core.
      disputed: >
        Defenders answer that weighting by need, as Sidgwick and later welfare economists propose,
        corrects this bias and that effective altruism directs resources to the global poor; critics
        reply that such corrections are rarely applied in policy.
    keyTexts:
      - {author: Jeremy Bentham, title: An Introduction to the Principles of Morals and Legislation, year: 1789}
      - {author: John Stuart Mill, title: On Liberty, year: 1859}
      - {author: John Stuart Mill, title: Utilitarianism, year: 1863}
      - {author: Henry Sidgwick, title: The Methods of Ethics, year: 1874}

  - id: liberalism.social
    regions: [Britain, United States, France, Canada]
    self: >
      Liberty means nothing to someone starving, sick, unschooled or at the mercy of an employer who
      can dismiss them at will. The state is not liberty's enemy but one of its conditions: it must
      secure for every citizen the real capacity to make something of their life. Public education,
      social insurance, labor law, progressive taxation and the regulation of monopoly are liberal
      measures, because they widen the circle of people who are actually free. We keep what
      classical liberalism won, civil liberties, constitutional government and markets, and complete
      it.
    record:
      - date: 1906–1914
        text: >
          Britain's Liberal government introduces old-age pensions (1908), the People's Budget with
          land and income taxes (1909), and national health and unemployment insurance (1911), and
          curbs the veto of the House of Lords.
      - date: 1935
        disputed: true
        text: >
          The US Social Security Act, part of the New Deal, excludes agricultural and domestic
          workers, which leaves out most Black workers in the South. One reading: Southern
          Democrats imposed the exclusion to preserve the racial labor system. Another (DeWitt and
          others): officials excluded these groups for administrative reasons of tax collection.
      - date: 1942
        text: >
          The Liberal William Beveridge's report proposes social insurance "from the cradle to the
          grave", the plan for Britain's postwar welfare state.
      - date: 1964–1965
        text: >
          The Johnson administration passes the Civil Rights Act, the Voting Rights Act, Medicare and
          the War on Poverty, and in the same year escalates the war in Vietnam with ground troops and
          sustained bombing.
    descendsFrom:
      - {id: liberalism.classical, event: "T. H. Green's Oxford lectures redefine liberty as positive capacity", date: 1879}
    breaksWith:
      - {id: liberalism.classical, event: "The People's Budget and National Insurance end Liberal laissez-faire", date: 1909}
    analysis:
      conditions: >
        It arose in late nineteenth-century Britain during the long depression, after the franchise
        reached many working men (1884), when surveys revealed mass poverty and the army found Boer
        War recruits unfit. A Liberal Party competing with rising Labour for working-class votes needed
        a program that answered insecurity while keeping private property.
      class_base: >
        Professionals, the Nonconformist middle class and reform-minded business, with a
        working-class electorate; today center-left parties' professional and public-sector base.
      function: >
        It shapes the programs of center-left parties such as the US Democrats and Canadian Liberals.
        Social insurance and services stabilize demand and the supply of healthy, schooled labor, and
        reduce the insecurity that fuels socialist movements. They are financed by taxing core
        economies whose incomes include returns from the periphery; the New Liberal J. A. Hobson
        himself (Imperialism, 1902) traced empire to the underconsumption that redistribution at
        home could cure.
    keyTexts:
      - {author: T. H. Green, title: Liberal Legislation and Freedom of Contract, year: 1881}
      - {author: L. T. Hobhouse, title: Liberalism, year: 1911}
      - {author: John Dewey, title: Liberalism and Social Action, year: 1935}
      - {author: William Beveridge, title: Social Insurance and Allied Services, year: 1942}

  - id: liberalism.egalitarian
    regions: [United States, Britain, worldwide (academic)]
    self: >
      Justice is the first virtue of social institutions. Choose principles as if from behind a veil
      of ignorance, not knowing whether you will be born rich or poor, talented or not, of which sex,
      race or faith: you would choose equal basic liberties for all, fair equality of opportunity, and
      inequalities only where they benefit the least advantaged. Talents and family fortune are
      arbitrary from a moral point of view. A just society is a fair system of cooperation among free
      and equal citizens, a property-owning democracy that disperses wealth so no class dominates
      political life.
    record:
      - date: 1971
        text: >
          John Rawls publishes A Theory of Justice, which revives normative political philosophy in
          the English-speaking world and becomes its main reference point.
      - date: 1979
        text: >
          Charles Beitz argues the difference principle should apply globally; Rawls's The Law of
          Peoples (1999) rejects this and limits duties to poor countries to a duty of assistance.
      - date: 1990
        text: >
          The UN Development Programme's first Human Development Report, built by Mahbub ul Haq with
          Amartya Sen's capabilities approach, introduces the Human Development Index as a measure
          beside GDP.
      - date: 1971–2019
        disputed: true
        text: >
          Admirers trace Rawlsian reasoning in constitutional jurisprudence and debates on the welfare
          state; Katrina Forrester (In the Shadow of Justice, 2019) argues the theory arrived as the
          welfare state was being dismantled and drew political philosophy away from the struggles
          that had built it.
    descendsFrom:
      - {id: liberalism.social, event: "A Theory of Justice", date: 1971}
    breaksWith:
      - {id: liberalism.utilitarian, event: "Rawls's charge that utilitarianism ignores the separateness of persons", date: 1971}
    analysis:
      conditions: >
        It arose in the United States of the 1960s, amid the civil rights movement, the Great
        Society, the Vietnam war and postwar affluence. A growing welfare state needed a
        justification that answered both Marxism and utilitarian aggregation, and Rawls supplied one
        from the social contract.
      class_base: >
        Academics, lawyers, judges and policy professionals.
      function: >
        It supplies the language that justifies redistribution inside national welfare states. Its
        model assumes a closed society, and The Law of Peoples limits obligations abroad to
        assistance, so the transfer of value from periphery to core falls outside its principles of
        justice. Its ideal of a "property-owning democracy" that disperses capital has no party or
        movement behind it.
      disputed: >
        Cosmopolitan Rawlsians (Beitz, Pogge) extend the difference principle to the world; G. A.
        Cohen (Rescuing Justice and Equality, 2008) argues that allowing incentive inequalities
        betrays it; Nozick argues it licenses taking what people are entitled to.
    keyTexts:
      - {author: John Rawls, title: A Theory of Justice, year: 1971}
      - {author: Amartya Sen, title: Inequality Reexamined, year: 1992}
      - {author: Ronald Dworkin, title: "Sovereign Virtue: The Theory and Practice of Equality", year: 2000}
      - {author: John Rawls, title: "Justice as Fairness: A Restatement", year: 2001}

  - id: liberalism.progressive
    regions: [United States, Canada, Western Europe, Australia]
    self: >
      We believe in a society where everyone, whatever their race, gender, sexuality, faith or
      origin, can live with dignity and reach their potential. Rights won by movements, from civil
      rights to marriage equality, must be defended and extended. Government should guarantee health
      care, act boldly on climate, rein in corporate power, protect voting rights and the rule of law,
      and confront the racism and sexism built into institutions. We work through elections, courts,
      civil society and broad coalitions, because progress is real but never automatic. Diversity is
      a strength, science should guide policy, and nobody should be left behind.
    record:
      - date: 2010
        text: >
          The US Affordable Care Act expands Medicaid and subsidizes private insurance; about 20
          million people gain coverage.
      - date: 2011
        disputed: true
        text: >
          The Obama administration joins the NATO air campaign in Libya under UN Security Council
          Resolution 1973, which ends with the overthrow and killing of Gaddafi and a long civil war,
          and expands drone strikes in Pakistan, Yemen and Somalia. Supporters say the Libya mission
          prevented a massacre in Benghazi; critics, including Russia, China and the African Union,
          say it exceeded the mandate to protect civilians.
      - date: 2015
        text: >
          The US Supreme Court rules in Obergefell v. Hodges that same-sex couples have a
          constitutional right to marry.
      - date: 2015–2025
        text: >
          Justin Trudeau's Liberal government in Canada introduces a child benefit (2016), legalizes
          cannabis (2018) and imposes a national carbon price (2019); it also buys the Trans Mountain
          oil pipeline (2018) to ensure its expansion. The consumer carbon charge is ended in 2025.
      - date: 2022
        text: >
          The Biden administration's Inflation Reduction Act funds clean energy mainly through tax
          credits, while new export controls on advanced chips to China extend the tariffs of the
          previous administration.
      - date: 2023–2024
        disputed: true
        text: >
          The Biden administration supplies Israel with weapons during the war in Gaza. It describes
          this as support for an ally's self-defense after the attacks of 7 October 2023; critics,
          including South Africa in its genocide case at the International Court of Justice
          (provisional measures ordered January 2024) and many within the Democratic coalition, call
          it complicity in mass killing of civilians.
    descendsFrom:
      - {id: liberalism.social, event: "The civil rights revolution enters liberal politics with the Civil Rights Act", date: 1964}
      - {id: feminism.liberal, event: "Second-wave feminist rights agenda", date: 1966}
    breaksWith:
      - {id: liberalism.classical, event: "Johnson's Howard University address: formal equality is not enough", date: 1965}
    analysis:
      conditions: >
        It took its present shape after the 1970s, as deindustrialization and union decline shifted
        center-left parties' base from industrial workers to college-educated professionals and
        minority voters, and as rights were expanded through courts. Parties that lost their union
        base rebuilt coalitions around educated urban voters, so recognition and rights moved to the
        center of their programs.
      class_base: >
        The professional-managerial strata, college-educated urban voters, public-sector, cultural,
        nonprofit and technology workers, and Black, Latino and other minority voters.
      function: >
        It governs core states, extending formal equality and some public services while leaving
        ownership and the power of finance largely intact. In foreign and economic policy it upholds
        US primacy through alliances, sanctions and export controls, so inclusion at home coexists
        with policies that maintain the drain from the periphery.
      disputed: >
        Nancy Fraser ("progressive neoliberalism", 2017) and Piketty (the "Brahmin left") read it as
        a coalition of professionals with finance; liberals answer that it passed the largest health
        and climate measures in decades against united opposition.
    keyTexts:
      - {author: Ronald Dworkin, title: Taking Rights Seriously, year: 1977}
      - {author: Iris Marion Young, title: Justice and the Politics of Difference, year: 1990}
      - {author: Paul Krugman, title: The Conscience of a Liberal, year: 2007}
      - {author: Martha C. Nussbaum, title: "Creating Capabilities: The Human Development Approach", year: 2011}

  - id: liberalism.republican
    regions: [Italy, Britain, United States, Spanish America, France]
    self: >
      Liberty is not merely being left alone; it is not living at the mercy of another. A slave with
      a kind master who never interferes is still unfree, because the master could. Freedom means
      non-domination: standing as an equal citizen who can look others in the eye, protected by laws
      you help make and can contest. That requires a mixed constitution that disperses power, civic
      virtue and participation, and limits on private power too: the employer who can fire at will,
      the husband who rules the household, the creditor who holds your life. From Rome to
      Machiavelli, the Commonwealthmen and Pettit: the free citizen in a free state.
    record:
      - date: 1649–1660
        text: >
          The English Commonwealth abolishes the monarchy and the House of Lords; Harrington's
          Oceana (1656) proposes a republic grounded in a wide distribution of landed property.
      - date: 1776–1787
        disputed: true
        text: >
          The American Revolution and Constitution. Bailyn, Wood and Pocock argue the revolution was
          driven by republican fear of corruption and dependence; others read it as Lockean liberal
          and commercial. Citizenship excluded enslaved people, and women had no vote.
      - date: 1810–1830
        text: >
          The Spanish American independence movements found republics with written constitutions, as
          in Bolívar's Angostura address (1819); most limit the vote by property and literacy.
      - date: 1870s–1880s
        text: >
          The Knights of Labor in the United States attack the wage system as "wage slavery",
          arguing that dependence on an employer is incompatible with republican citizenship, and
          promote producer cooperatives.
      - date: 2004–2008
        text: >
          Spain's Zapatero government adopts Pettit's republicanism as a reference; Pettit reviews
          its record in Examen a Zapatero (2008).
    descendsFrom: []
    breaksWith:
      - {id: conservatism.monarchist, event: "Execution of Charles I and abolition of the monarchy", date: 1649}
      - {id: liberalism.classical, event: "Pettit's Republicanism separates non-domination from liberal non-interference", date: 1997}
    analysis:
      conditions: >
        It grew in city republics where armed, propertied citizens faced princes and great families,
        and later in Atlantic revolutions where colonial elites and artisans rejected dependence on a
        metropolis. Independence was tied to property: the citizen was the man who owned enough not to
        depend on another, so the ideal always raised the question of who has material independence.
      class_base: >
        Historically freeholders, artisans and merchants, with women, servants and the enslaved
        excluded from citizenship; today academic philosophers, left-liberal and some socialist
        parties, and labor republicans.
      function: >
        It gives a language for criticizing employers, creditors and landlords without an
        anti-capitalist commitment. Its logic points toward dispersing property, since wage
        dependence and debt are forms of domination, but its institutional versions mostly stop at
        contestation procedures and regulation. Applied between states, non-domination supports
        indebted countries against creditor conditions, though few of its proponents press that.
      disputed: >
        Marxist republicans (William Clare Roberts, Marx's Inferno, 2017) read Marx as a radical
        republican for whom capital is impersonal domination; liberal critics argue non-domination
        adds little to non-interference.
    keyTexts:
      - {author: Niccolò Machiavelli, title: Discourses on Livy, year: 1531}
      - {author: James Harrington, title: The Commonwealth of Oceana, year: 1656}
      - {author: J. G. A. Pocock, title: The Machiavellian Moment, year: 1975}
      - {author: Philip Pettit, title: "Republicanism: A Theory of Freedom and Government", year: 1997}
      - {author: Quentin Skinner, title: Liberty before Liberalism, year: 1998}

  - id: liberalism.ordoliberal
    regions: [Germany, European Union]
    self: >
      Competition is the most effective instrument for breaking up power. Laissez-faire failed
      because it let cartels and monopolies grow until they captured the state; collectivism failed
      because the planner gathers all power in one hand. We want an economic constitution: a strong,
      impartial state that sets and enforces a framework of rules, stable money, open markets,
      private property, liability, freedom of contract, consistent policy, and then refrains from
      steering outcomes. Antitrust protects competition, not competitors. Sound money is the
      foundation of a free society. This order gave Germany its postwar recovery and Europe its
      competition law.
    record:
      - date: 1936
        text: >
          Walter Eucken, Franz Böhm and Hans Grossmann-Doerth publish the Freiburg School's program,
          "Our Task", calling for an economic order secured by law.
      - date: 1948
        text: >
          Ludwig Erhard accompanies the currency reform in the western zones of Germany by abolishing
          most price controls overnight; shops fill, and unemployment and prices rise before the
          boom of the 1950s.
      - date: 1957
        text: >
          West Germany passes the Act against Restraints of Competition and the Bundesbank Act,
          creating an independent central bank; the Treaty of Rome writes competition rules into the
          European Economic Community.
      - date: 1992–1997
        text: >
          The Maastricht Treaty and the Stability and Growth Pact set limits on deficits (3 percent of
          GDP) and debt (60 percent) and give the European Central Bank independence and a mandate
          for price stability, largely on the Bundesbank model.
      - date: 2010–2015
        disputed: true
        text: >
          In the eurozone crisis, the German government insists on spending cuts and structural
          reforms as conditions of loans to Greece, Portugal, Ireland and others; Greek output falls
          by about a quarter. Ordoliberals call this enforcing rules and preventing moral hazard;
          critics call it debt deflation that protected French and German banks' exposure.
    descendsFrom:
      - {id: liberalism.classical, event: "Freiburg School's founding program", date: 1936}
    breaksWith:
      - {id: liberalism.classical, event: "Rüstow's critique of laissez-faire at the Colloque Walter Lippmann", date: 1938}
    analysis:
      conditions: >
        It formed in Germany after the hyperinflation of 1923, the cartelized Weimar economy, the
        Depression and the Nazi command economy. German savers and the small-business middle class
        had lost their savings to inflation, and export industry needed stable money and open
        markets; the postwar occupation and Marshall aid gave the doctrine its chance.
      class_base: >
        Export-oriented industrial capital, the small and medium firms of the Mittelstand, savers,
        central bankers and legal scholars; unionized export workers were bound in through
        codetermination, which ordoliberals tolerated.
      function: >
        It shapes the rules of the eurozone. Deficit countries cannot devalue, so adjustment falls on
        their wages and public spending, while Germany's export surplus rests on a real exchange
        rate held low inside the euro and on wage restraint at home. Within Europe this works as a
        transfer from the southern and eastern periphery to the northern core; worldwide the doctrine
        supports a rules-based trade order that protects established exporters.
      disputed: >
        Ordoliberals attribute the German surplus to competitiveness and fiscal discipline; critics
        (Flassbeck and Lapavitsas, among others) attribute it to wage suppression and the design of the
        euro.
    keyTexts:
      - {author: Walter Eucken, Franz Böhm and Hans Grossmann-Doerth, title: "Our Task", year: 1936}
      - {author: Wilhelm Röpke, title: The Social Crisis of Our Time, year: 1942}
      - {author: Walter Eucken, title: Grundsätze der Wirtschaftspolitik, year: 1952}
      - {author: Ludwig Erhard, title: Prosperity through Competition, year: 1957}

  - id: liberalism.chicago
    regions: [United States, Chile, Latin America, worldwide]
    self: >
      Economic freedom is an indispensable means to political freedom. Markets coordinate the
      activity of millions without coercion; prices carry information and incentives no planner can
      match. Much of what government does to help, from rent control and tariffs to minimum wages and
      occupational licensing, hurts the people it means to help, and the evidence shows it.
      Inflation is always and everywhere a monetary phenomenon: keep money growth steady and let
      markets work. Judge policy by rigorous price theory and empirical test, not by good intentions.
      School vouchers, a negative income tax, floating exchange rates, a volunteer army: freedom to
      choose.
    record:
      - date: 1956–1964
        text: >
          Under a US-funded agreement, the University of Chicago trains economists from Chile's
          Catholic University, the later "Chicago Boys".
      - date: 1970–1973
        text: >
          Friedman serves on the Gates Commission, whose recommendations lead the United States to
          end conscription in 1973.
      - date: 1975–1990
        disputed: true
        text: >
          After the 1973 coup, Pinochet's military government appoints Chicago-trained economists;
          following Friedman's 1975 visit it applies "shock treatment", privatizes state firms, cuts
          tariffs to a uniform 10 percent and privatizes pensions (1980), while official commissions
          later document over 3,000 killed or disappeared and some 38,000 tortured or imprisoned for
          political reasons. In the 1982 crash output falls about 14 percent and unemployment exceeds
          20 percent. Defenders credit the reforms with Chile's later growth and fall in poverty;
          critics argue they required repression and left one of the most unequal societies in the
          OECD.
      - date: 1978
        text: >
          Robert Bork's The Antitrust Paradox argues antitrust should protect only consumer welfare;
          US courts and agencies adopt the standard, permitting far larger mergers.
      - date: 1979–1982
        disputed: true
        text: >
          The Federal Reserve under Volcker adopts monetary targeting in the spirit of monetarism;
          interest rates near 20 percent end US inflation and help trigger the Latin American debt
          crisis when Mexico cannot pay in 1982. Supporters credit the policy with restoring
          monetary stability; critics point to the lost decade it imposed on debtor countries.
    descendsFrom:
      - {id: liberalism.classical, event: "Knight, Viner and Simons build the first Chicago school", date: "1930s"}
    breaksWith:
      - {id: socdem.keynesian, event: "Friedman's monetarist counter-revolution and his presidential address on the natural rate of unemployment", date: 1968}
      - {id: liberalism.austrian, event: "Friedman's positive economics against Austrian deductive method", date: 1953}
    analysis:
      conditions: >
        It rose under postwar US dominance and gained policy influence in the 1970s, when
        stagflation and a squeeze on profits discredited Keynesian management. Business needed a
        theory to break the wage-price spiral and union power, and monetarism justified high interest
        rates and unemployment as the cure; foundations such as the Volker Fund financed the school.
      class_base: >
        Finance capital and holders of financial assets, who gain from positive real interest rates;
        multinational capital seeking open markets; the economics profession and central bankers.
      function: >
        Its price theory is the default of economics departments, central banks and antitrust
        agencies. Economists trained in it staffed finance ministries across the periphery that
        opened trade and capital accounts. Open capital accounts and dollar-denominated debt expose
        peripheral economies to US interest rate cycles, so tightening in Washington transfers income
        from debtors in the South to creditors in the North, as in 1982.
      disputed: >
        Harvey (A Brief History of Neoliberalism, 2005) reads neoliberalism as a project to restore
        elite income; Duménil and Lévy read it as finance reasserting itself after a fall in
        profitability; Chicago economists read it as the correction of policy errors.
    keyTexts:
      - {author: Milton Friedman, title: Capitalism and Freedom, year: 1962}
      - {author: Milton Friedman and Anna J. Schwartz, title: "A Monetary History of the United States, 1867–1960", year: 1963}
      - {author: George J. Stigler, title: The Theory of Economic Regulation, year: 1971}
      - {author: Gary S. Becker, title: The Economic Approach to Human Behavior, year: 1976}

  - id: liberalism.austrian
    regions: [Austria, Britain, United States, Argentina]
    self: >
      Economics begins with human action: individuals choosing means to ends under uncertainty. Value
      is subjective, and prices are the signals that let dispersed, tacit knowledge, which no single
      mind could gather, coordinate the plans of millions. That is why socialism cannot calculate:
      without private ownership of the means of production there are no market prices for capital
      goods and so no rational allocation. Planning, however well meant, leads down the road to
      serfdom, because a plan must be imposed. Credit expansion distorts the structure of production
      and causes boom and bust. We defend spontaneous order, the rule of law and sound money, because
      no one can know enough to direct society.
    record:
      - date: 1920
        text: >
          Mises's "Economic Calculation in the Socialist Commonwealth" opens the socialist
          calculation debate, later answered by Lange and Lerner.
      - date: 1927
        disputed: true
        text: >
          In Liberalism Mises writes that fascism had "for the moment, saved European civilization"
          and that its merit "will live on eternally in history", while calling it an emergency
          makeshift that would fail. Critics read this as endorsement of fascism against the labor
          movement; defenders read it as a conditional judgment within a liberal rejection of
          dictatorship.
      - date: 1944–1947
        text: >
          Hayek's The Road to Serfdom becomes a bestseller in its condensed US edition, and in 1947
          he founds the Mont Pelerin Society with Mises, Friedman, Röpke and others.
      - date: 1974
        text: >
          Hayek shares the economics Nobel with Gunnar Myrdal; Margaret Thatcher later names him a
          central influence on her government.
      - date: 1977–1981
        disputed: true
        text: >
          Hayek visits Pinochet's Chile and in a 1981 El Mercurio interview says he prefers "a
          liberal dictator to a democratic government lacking liberalism". Critics read this as
          support for the military government; defenders as a statement about transitional
          arrangements under a constitution of liberty.
    descendsFrom:
      - {id: liberalism.classical, event: "Menger's Principles of Economics founds the Austrian school", date: 1871}
    breaksWith:
      - {id: marxism.classical, event: "Böhm-Bawerk's Karl Marx and the Close of His System", date: 1896}
      - {id: socdem.keynesian, event: "Keynes–Hayek debate", date: 1931}
    analysis:
      conditions: >
        It arose in Vienna in the late Habsburg empire and developed in the 1920s against a mass
        socialist party whose city government built public housing financed by progressive taxes.
        Economists tied to the Chamber of Commerce and the liberal propertied bourgeoisie defended
        property against this movement by arguing that planning could not work at all.
      class_base: >
        Historically the commercial and rentier bourgeoisie of Vienna; later foundation funders and
        financiers favoring hard money; today also small investors, gold and cryptocurrency holders
        and small business owners.
      function: >
        It supplies the case against planning and against central bank management. Hard money
        raises the real value of debts, transferring income from debtors to creditors. In the
        periphery its prescriptions, such as dollarization in Argentina, give up monetary
        sovereignty and tie the economy to US monetary policy and to foreign creditors.
      disputed: >
        Austrians hold that 1989 vindicated the calculation argument; Lange and Lerner answered it in
        the 1930s, and Cockshott and Cottrell (Towards a New Socialism, 1993) argue that modern
        computing makes planning in labor time feasible; some market socialists accept Hayek's
        knowledge argument.
    keyTexts:
      - {author: Carl Menger, title: Principles of Economics, year: 1871}
      - {author: Ludwig von Mises, title: Economic Calculation in the Socialist Commonwealth, year: 1920}
      - {author: Friedrich A. Hayek, title: The Road to Serfdom, year: 1944}
      - {author: Friedrich A. Hayek, title: The Use of Knowledge in Society, year: 1945}
      - {author: Ludwig von Mises, title: "Human Action: A Treatise on Economics", year: 1949}

  - id: liberalism.technocratic
    regions: [European Union, United States, international institutions]
    self: >
      Most problems are not left or right; they are solvable if we follow the evidence. Independent
      central banks keep inflation low, trade raises living standards, markets do most things well,
      and governments correct their failures with smart regulation, carbon prices and well-designed
      transfers. Decisions with long horizons and technical complexity belong to accountable experts,
      insulated from short-term electoral pressure and populist passion. We defend open societies,
      international rules and pragmatic compromise. What matters is what works, measured carefully:
      randomized trials, cost-benefit analysis, nudges. Reason, not rage.
    record:
      - date: 1989–1990
        text: >
          John Williamson summarizes the "Washington Consensus": fiscal discipline, trade and
          financial liberalization, privatization and deregulation, the program pressed on indebted
          countries by the IMF, World Bank and US Treasury.
      - date: 1989–1998
        text: >
          Central bank independence and inflation targeting spread from New Zealand (1989) to the
          Bank of England (1997) and the European Central Bank (1998).
      - date: 1995
        text: >
          The World Trade Organization is founded; its TRIPS agreement obliges members to grant
          twenty-year patents, including on medicines, raising drug prices in poorer countries.
      - date: 2011
        text: >
          Under bond market pressure, unelected economists Mario Monti (Italy) and Lucas Papademos
          (Greece) head governments that implement austerity programs.
      - date: 2017–2023
        disputed: true
        text: >
          Emmanuel Macron governs France as a centrist reformer; a fuel tax provokes the yellow vest
          protests (2018), and a pension reform raising the retirement age is passed in 2023
          without a final vote under Article 49.3. Supporters call it necessary reform against
          entrenched interests; opponents call it rule by decree against the majority.
    descendsFrom:
      - {id: liberalism.utilitarian, event: "Cost-benefit reasoning becomes the method of government", date: 1981}
      - {id: liberalism.chicago, event: "Post-Cold War convergence on market economics and independent central banks", date: 1990}
    breaksWith:
      - {id: conservatism.right-populism, event: "Brexit referendum and the 2016 US election split expertise from electoral majorities", date: 2016}
    analysis:
      conditions: >
        It took shape after the Cold War, with globalized production, financialized economies and
        the decline of mass parties. With capital mobile, governments sought the confidence of bond
        markets by delegating economic decisions to independent agencies and rules, and expertise
        replaced the mass party as the source of legitimacy.
      class_base: >
        The professional-managerial strata in finance, consulting, academia, international
        organizations and EU institutions, and affluent urban voters.
      function: >
        Its rules protect asset values and creditors: independent central banks prioritize price
        stability over employment, and trade rules such as TRIPS protect the patents of core firms,
        transferring income from patients and producers in the periphery to patent holders. By
        removing economic policy from electoral control it narrows the choices before voters, which
        feeds the populist backlash it opposes.
      disputed: >
        Proponents cite the fall in extreme poverty from 1990 to 2015; Hickel and others answer that
        most of the fall occurred in China, which did not follow the Washington Consensus, and that
        the result depends on a very low poverty line.
    keyTexts:
      - {author: John Williamson, title: What Washington Means by Policy Reform, year: 1990}
      - {author: Richard H. Thaler and Cass R. Sunstein, title: "Nudge: Improving Decisions about Health, Wealth, and Happiness", year: 2008}
      - {author: Abhijit V. Banerjee and Esther Duflo, title: "Poor Economics", year: 2011}
      - {author: Paul Tucker, title: "Unelected Power: The Quest for Legitimacy in Central Banking and the Regulatory State", year: 2018}

  - id: liberalism.internationalist
    regions: [United States, Western Europe, international institutions]
    self: >
      Wars come from anarchy among states, and peace is built through law, institutions, trade and
      self-government. Free nations that trade with one another and submit their disputes to courts
      and assemblies rarely fight each other. We built the League, then the United Nations, the
      Bretton Woods institutions, the Universal Declaration of Human Rights, the international
      criminal courts and the alliances that kept the postwar peace. Sovereignty is a responsibility,
      not a license to massacre: when a state turns on its own people, the world has a responsibility
      to protect them. A rules-based order is humanity's best hope.
    record:
      - date: 1919
        text: >
          Wilson's League of Nations is founded without the United States, whose Senate rejects the
          treaty; the conference rejects Japan's proposal to affirm racial equality, and the mandate
          system places former German and Ottoman territories under British and French rule.
      - date: 1944–1948
        text: >
          The Bretton Woods institutions (1944), with voting weighted by capital, and the United
          Nations (1945), with permanent vetoes for five powers, are founded; the UN adopts the
          Universal Declaration of Human Rights (1948).
      - date: 1999
        disputed: true
        text: >
          NATO bombs Yugoslavia for 78 days without Security Council authorization to stop the
          expulsion of Kosovo Albanians; about 500 civilians are killed by the bombing. Supporters
          say it stopped ethnic cleansing; critics say it broke the UN Charter and set a precedent
          for unauthorized war.
      - date: 2002
        disputed: true
        text: >
          The International Criminal Court begins work; for its first two decades almost all those it
          indicts are African. It later issues warrants for Vladimir Putin (2023) and for Benjamin
          Netanyahu and Yoav Gallant (2024). Supporters see a court growing into its universal
          mandate; critics see justice applied to the weak while the United States stays outside.
      - date: 2005–2011
        disputed: true
        text: >
          The UN World Summit endorses the responsibility to protect (2005); it is invoked for the
          2011 Libya intervention, which ends in the overthrow of the government and a long civil
          war. Supporters say it prevented a massacre; critics say it turned protection into a
          change of government.
    descendsFrom:
      - {id: liberalism.classical, event: "Kant's Perpetual Peace and the free-trade peace of Cobden", date: 1795}
    breaksWith: []
    analysis:
      conditions: >
        Its Wilsonian moment came as the United States emerged from the First World War as the
        world's creditor; its institutions were built after 1945, when the United States held about
        half of world industrial output. A dominant economy gains from open markets and from rules it
        writes, which lock in its advantage at lower cost than direct rule.
      class_base: >
        Internationally oriented finance and multinational capital, foreign policy professionals,
        human rights and NGO professionals, and international civil servants.
      function: >
        It presents the primacy of the United States and Europe as a rules-based order. The United
        States holds a veto in the IMF; dollar clearing and payment networks allow sanctions that cut
        countries off from trade; the rules are applied selectively. These institutions keep
        peripheral economies open to core capital and enforce their debts, sustaining the drain.
      disputed: >
        Liberal internationalists credit the order with decades without war between great powers and
        with growth in Asia; anti-imperialists see institutionalized hegemony; realists (Mearsheimer,
        The Great Delusion, 2018) argue liberal hegemony itself caused wars.
    keyTexts:
      - {author: Immanuel Kant, title: Perpetual Peace, year: 1795}
      - {author: Norman Angell, title: The Great Illusion, year: 1910}
      - {author: Woodrow Wilson, title: Fourteen Points Address, year: 1918}
      - {author: Robert O. Keohane, title: After Hegemony, year: 1984}
      - {author: G. John Ikenberry, title: Liberal Leviathan, year: 2011}

  - id: communitarianism
    regions: [United States, Britain, Singapore, East Asia]
    self: >
      We are not unencumbered selves who choose our ends from nowhere. We are born into families,
      communities, traditions and nations that give us language, loyalties and a sense of what
      matters. A politics of rights without responsibilities, of markets and bureaucracies without
      communities, dissolves the very bonds that make people capable of freedom. A society must
      deliberate about the good, not only about procedures. Strengthen families, neighborhoods,
      voluntary associations and civic virtue; balance individual rights with the common good; and
      resist both market and state when they turn citizens into consumers and clients.
    record:
      - date: 1981–1983
        text: >
          MacIntyre's After Virtue, Sandel's Liberalism and the Limits of Justice and Walzer's Spheres
          of Justice establish the communitarian critique of liberal individualism; MacIntyre and
          Taylor later reject the label.
      - date: 1991
        text: >
          Amitai Etzioni launches the Responsive Communitarian Platform and the journal The
          Responsive Community.
      - date: 1991
        text: >
          Singapore's parliament adopts the White Paper on Shared Values, putting nation before
          community and society above self, as part of the government's "Asian values" doctrine.
      - date: 1994–1998
        disputed: true
        text: >
          Clinton and Blair adopt the language of rights and responsibilities; Blair's government
          introduces anti-social behaviour orders (1998). Etzioni and others claim direct influence;
          critics say the vocabulary was borrowed to dress conditional welfare and policing.
      - date: 2010
        disputed: true
        text: >
          David Cameron's "Big Society" promises to transfer services to community and voluntary
          groups. Supporters saw civil society renewed; critics saw cover for cuts in public spending.
    descendsFrom:
      - {id: liberalism.republican, event: "Revival of civic virtue and Aristotelian ethics", date: 1981}
    breaksWith:
      - {id: liberalism.egalitarian, event: "Sandel's critique of Rawls's unencumbered self", date: 1982}
    analysis:
      conditions: >
        It arose in the 1980s, as Reagan and Thatcher's market individualism and the rights-based
        liberal left both appeared to erode families and towns, while deindustrialization destroyed
        working communities. The breakdown caused by capital moving away was explained largely as a
        crisis of values and individualist ideas.
      class_base: >
        Academics, clergy, leaders of civic associations and centrist politicians, appealing to
        small-town and suburban middle classes.
      function: >
        It supplies a language of responsibility and community used by the center-left and by the
        postliberal right. Framing social breakdown as moral directs policy at the conduct of the
        poor (behavior orders, welfare conditionality) and at volunteers replacing public services,
        rather than at the movement of capital. In Singapore it legitimated a dominant-party state's
        discipline of labor in an export economy.
      disputed: >
        Left communitarians (Walzer's spheres that block money from buying everything) argue it
        limits markets; Marxists answer that it idealizes communities while ignoring the class
        divisions inside them.
    keyTexts:
      - {author: Alasdair MacIntyre, title: After Virtue, year: 1981}
      - {author: Michael J. Sandel, title: Liberalism and the Limits of Justice, year: 1982}
      - {author: Michael Walzer, title: Spheres of Justice, year: 1983}
      - {author: Charles Taylor, title: "Sources of the Self", year: 1989}
      - {author: Amitai Etzioni, title: The Spirit of Community, year: 1993}
