traditions:
  - id: feminism.liberal
    regions: [Britain, United States, worldwide]
    self: >-
      Women are persons, with the same reason and the same rights as men. Our cause is equality before
      the law and equal opportunity in life: the vote, property in our own names, education, entry to
      every profession, equal pay for equal work, the right to decide whether and when to bear children,
      and safety from violence. We win through law, courts, elections and persuasion, and two centuries
      of victories show that the method works. Every barrier that falls proves the next one can fall
      too. A woman's place is wherever she chooses to be.
    record:
      - date: 1792
        text: >-
          Mary Wollstonecraft publishes A Vindication of the Rights of Woman.
      - date: 1848
        text: >-
          The Seneca Falls Convention in New York adopts the Declaration of Sentiments, demanding the vote
          and equal rights in property and marriage.
      - date: "1893-1928"
        text: >-
          New Zealand grants women the national vote in 1893; Britain extends it to some women in 1918 and
          on equal terms in 1928; the United States ratifies the Nineteenth Amendment in 1920.
      - date: 1966
        text: >-
          Betty Friedan and others found the National Organization for Women to enforce the 1964 Civil
          Rights Act's ban on sex discrimination in employment.
      - date: "1979-1995"
        text: >-
          The UN adopts the Convention on the Elimination of All Forms of Discrimination against Women in
          1979; the Beijing World Conference on Women (1995) adopts a Platform for Action signed by 189
          governments.
      - date: "2010s"
        disputed: true
        text: >-
          A gender pay gap persists in every country. Liberal feminists read the unexplained remainder as
          discrimination; some economists attribute most of it to occupation and hours; Claudia Goldin
          (Nobel prize 2023) locates much of it in the premium employers pay for long, inflexible hours
          after women have children.
    descendsFrom:
      - {id: liberalism.classical, event: "Wollstonecraft extends the rights of man to women", date: 1792}
    breaksWith:
      - {id: conservatism.burkean, event: "Wollstonecraft's reply to Burke's Reflections", date: 1790}
    analysis:
      conditions: >-
        It arose with capitalist property and the bourgeois revolutions, when legal personhood and
        contract became the basis of property and citizenship and married women were excluded from both
        under coverture. In the twentieth century, employers' demand for clerical and professional labor
        and the spread of schooling made women's entry into paid work profitable for firms and necessary
        for households.
      class_base: >-
        Educated middle-class and professional women, and today political and corporate elites. Employers
        gain a larger pool of labor; professional women gain promotion; the care work they leave is
        increasingly done by lower-paid women, often migrants from the periphery, in what Arlie
        Hochschild called global care chains.
      function: >-
        It is the feminism of states, corporations and international institutions, such as the World
        Bank's treatment of gender equality as smart economics (2012). By framing liberation as
        labor-market participation and representation at the top, it extends paid work for women and
        passes care down a chain to poorer women, which softens the order for some women while leaving
        the wage relation and the global division of labor in place.
      disputed: >-
        Nancy Fraser (2009) argues liberal feminism supplied neoliberalism with a new spirit. Liberal
        feminists and many others answer that legal and labor-market equality have been the precondition
        for every further gain, including for working-class women (equal pay law, access to abortion).
    keyTexts:
      - {author: Mary Wollstonecraft, title: A Vindication of the Rights of Woman, year: 1792}
      - {author: John Stuart Mill, title: The Subjection of Women, year: 1869}
      - {author: Betty Friedan, title: The Feminine Mystique, year: 1963}
      - {author: Martha C. Nussbaum, title: "Women and Human Development: The Capabilities Approach", year: 2000}

  - id: feminism.radical
    regions: [United States, Britain, worldwide]
    self: >-
      The personal is political. Women's subordination is not an accident of law or wages. It is the
      oldest and deepest system of power, patriarchy, and it runs through sexuality, the family,
      violence and the body itself. Men as a class benefit from women's unpaid work, sexual availability
      and fear. Rape, battering, pornography and prostitution are not deviations from the system; they
      are the system working. We organize as women, separately where we must, through consciousness
      raising, rape crisis centers and shelters, naming what had no name and taking back our bodies.
    record:
      - date: 1968
        text: >-
          New York Radical Women protest the Miss America pageant in Atlantic City in September.
      - date: "1969-1970"
        text: >-
          The Redstockings Manifesto (1969), Shulamith Firestone's The Dialectic of Sex and Kate Millett's
          Sexual Politics (both 1970) set out women as a sex class and patriarchy as a system.
      - date: "1971-1972"
        text: >-
          Activists open the first battered women's shelter at Chiswick in London (1971) and rape crisis
          centers in US cities; these become publicly funded services across many countries.
      - date: "1983-1986"
        disputed: true
        text: >-
          Andrea Dworkin and Catharine MacKinnon draft an ordinance treating pornography as a civil rights
          violation; Minneapolis's mayor vetoes it and US courts strike down Indianapolis's version. The
          “sex wars” split feminism: radical feminists see pornography as harm to women, while their
          feminist opponents see the ordinances as censorship that would be turned against women and sexual minorities.
      - date: 1999
        disputed: true
        text: >-
          Sweden criminalizes buying sex but not selling it; Norway (2009), France (2016) and Ireland (2017)
          follow. The Swedish government's 2010 evaluation found street prostitution halved; sex workers'
          organizations and Amnesty International (2016) report greater danger to sellers.
    descendsFrom: []
    breaksWith:
      - {id: feminism.liberal, event: "New York Radical Women reject the reform agenda of the National Organization for Women", date: 1968}
      - {id: marxism.classical, event: "Firestone's Dialectic of Sex puts sex class in place of economic class", date: 1970}
    analysis:
      conditions: >-
        It arose in the late 1960s among women in the civil rights, antiwar and student movements who
        found themselves typing and making coffee for men who talked about liberation. Mass higher
        education and the contraceptive pill (1960) had made women's sexuality and careers open questions,
        and the male-led New Left would not treat them as political.
      class_base: >-
        College-educated women, at first mostly white in the United States, with wide reach among
        working-class women through shelters and rape crisis services, and later among professionals in
        NGOs and the state agencies that fund those services.
      function: >-
        Its account of men's violence reshaped law worldwide: marital rape criminalized, domestic violence
        laws, the 2017 MeToo wave. Locating oppression in men as a class unites women across classes,
        which wins on violence and sexuality but leaves untouched the wage, care and world-market
        structures that divide women, and its turn to criminal law has expanded policing and prisons,
        what Elizabeth Bernstein called carceral feminism.
      disputed: >-
        Christine Delphy grounds men's class power in the household economy; Marxist feminists such as
        Lise Vogel reject patriarchy as a separate system; Heidi Hartmann's dual-systems theory (1979)
        holds capitalism and patriarchy are two linked systems.
    keyTexts:
      - {author: Shulamith Firestone, title: The Dialectic of Sex, year: 1970}
      - {author: Kate Millett, title: Sexual Politics, year: 1970}
      - {author: Andrea Dworkin, title: "Pornography: Men Possessing Women", year: 1981}
      - {author: Catharine A. MacKinnon, title: Toward a Feminist Theory of the State, year: 1989}

  - id: feminism.materialist
    regions: [France, Italy, Britain, worldwide]
    self: >-
      Women are not a natural group but a social class, made by a relation of exploitation. In marriage
      the husband appropriates his wife's unpaid labor, a domestic mode of production that runs alongside
      the capitalist one. The division into men and women is not nature dressed up in culture; it is
      produced by that exploitation, as the division into bosses and workers is produced by the wage.
      Our main enemy is this system of appropriation, and we fight it as a class fights, with our own
      organizations and without waiting for the revolution men promise us.
    record:
      - date: 1970
        text: >-
          Christine Delphy publishes The Main Enemy, founding French materialist feminism; in August
          activists lay a wreath at the Arc de Triomphe for the unknown soldier's wife, a founding act of
          the women's liberation movement.
      - date: "1971-1975"
        text: >-
          The Manifesto of the 343, women who declare they have had illegal abortions, appears in April
          1971; the Veil law legalizes abortion in France in 1975.
      - date: 1972
        text: >-
          Mariarosa Dalla Costa and Selma James publish The Power of Women and the Subversion of the
          Community, and the International Wages for Housework Campaign is launched in Padua.
      - date: "1977-1980"
        text: >-
          Delphy, Colette Guillaumin, Monique Wittig and others found the journal Questions féministes with
          Simone de Beauvoir as director; it splits in 1980 over political lesbianism.
      - date: 1979
        disputed: true
        text: >-
          Michèle Barrett and Mary McIntosh dispute Delphy's thesis in Feminist Review, arguing housework
          produces no value and the household is not a mode of production; Delphy holds that unpaid
          appropriation is exploitation whether or not it produces value.
    descendsFrom:
      - {id: marxism.classical, event: "Delphy applies the concept of class exploitation to the household", date: 1970}
    breaksWith:
      - {id: marxism.classical, event: "Rejection of the French Communist Party's line that women's oppression is secondary", date: 1970}
      - {id: feminism.difference, event: "Questions féministes against the cult of femininity in the Psych et Po current", date: 1977}
    analysis:
      conditions: >-
        It arose in France after May 1968, when women on the far left found their housework and sexual
        labor treated as private. French law still required a husband's consent for his wife to take a
        job until 1965, so the household was visibly a place where labor was performed without a wage and
        claimed through marriage and family law.
      class_base: >-
        Researchers and activists of the women's liberation movement, speaking for wives and housewives as
        a class. Its demands, public childcare, care leave and pension credits for carers, would move
        unpaid work into paid or public forms and so benefit working women most.
      function: >-
        Its account of unpaid work is now measured by time-use surveys: the ILO (2018) counts some 16
        billion hours of unpaid care each day, three quarters of it by women. In the world economy unpaid
        care in the periphery lowers the cost of the labor that produces exports, so socializing care
        both frees women's time and raises the price at which peripheral labor is sold.
      disputed: >-
        Barrett and McIntosh and later social reproduction theorists treat domestic labor as part of
        capitalist reproduction, not a separate patriarchal economy; queer critics question whether women
        can be defined as a class at all.
    keyTexts:
      - {author: Christine Delphy, title: "The Main Enemy (L'ennemi principal)", year: 1970}
      - {author: Colette Guillaumin, title: "Pratique du pouvoir et idée de Nature", year: 1978}
      - {author: Heidi Hartmann, title: "The Unhappy Marriage of Marxism and Feminism", year: 1979}
      - {author: Monique Wittig, title: "One Is Not Born a Woman", year: 1981}
      - {author: Christine Delphy, title: "Close to Home: A Materialist Analysis of Women's Oppression", year: 1984}

  - id: feminism.black
    regions: [United States, Caribbean, Britain, Brazil]
    self: >-
      We are Black women, and we refuse to choose between our race, our sex and our class, because we
      live them all at once. White feminism spoke of woman as if she were white and middle class; the
      Black freedom movement spoke of the Black man. As the Combahee River Collective said, if Black
      women were free, everyone else would have to be free, since our freedom would require the
      destruction of all the systems of oppression. We start from our own lives, as domestic workers,
      mothers, prisoners and organizers, and build politics from there.
    record:
      - date: 1851
        disputed: true
        text: >-
          Sojourner Truth speaks at the women's rights convention in Akron, Ohio. The famous version with
          its refrain “Ain't I a Woman?” comes from Frances Gage's account of 1863; the report published in
          1851 differs in wording.
      - date: 1892
        text: >-
          Anna Julia Cooper publishes A Voice from the South, and Ida B. Wells publishes Southern Horrors,
          her investigation of lynching.
      - date: 1949
        text: >-
          Claudia Jones, a Communist organizer from Trinidad, publishes An End to the Neglect of the
          Problems of the Negro Woman, analyzing a triple oppression of race, class and sex; she is deported
          from the United States in 1955.
      - date: 1977
        text: >-
          The Combahee River Collective, Black lesbian socialists in Boston, issue their statement on
          interlocking oppressions.
      - date: 1989
        text: >-
          Kimberlé Crenshaw coins the term intersectionality in a legal analysis of how antidiscrimination
          law failed Black women workers.
      - date: "2013-2020"
        text: >-
          Alicia Garza, Patrisse Cullors and Opal Tometi start Black Lives Matter; after George Floyd's
          murder in 2020, between 15 and 26 million people take part in protests in the United States.
    descendsFrom:
      - {id: marxism.black-radical, event: "Claudia Jones's analysis of triple oppression in the Communist Party", date: 1949}
    breaksWith:
      - {id: feminism.liberal, event: "Combahee River Collective Statement against white middle-class feminism", date: 1977}
      - {id: nationalism.black-nationalism, event: "Combahee's rejection of male-centered Black nationalism", date: 1977}
    analysis:
      conditions: >-
        Slavery and then segregated labor markets put Black women in domestic service and farm work, the
        two occupations excluded from the 1935 Social Security Act and the main New Deal labor laws. That
        left them in the lowest-paid, least protected jobs, a position that neither a politics of race
        alone nor of sex alone described.
      class_base: >-
        Black women across classes: domestic and care workers, public-sector employees, and academics and
        professionals. Its later institutional home in universities, NGOs and corporate diversity offices
        has shifted its weight toward the professional end.
      function: >-
        Intersectionality is now a standard tool in law, NGOs and human resources. In its corporate form
        it measures representation at the top without changing wages at the bottom; in its socialist
        Combahee form it directs attention to the most exploited strata, domestic, care and imprisoned
        workers, where class, race and sex meet.
      disputed: >-
        Adolph Reed Jr. and other Marxist critics see intersectionality as a list of identities easily
        absorbed by corporate diversity management. Keeanga-Yamahtta Taylor (How We Get Free, 2017)
        argues its Combahee origins are anticapitalist and that it is a theory of how one class is divided.
    keyTexts:
      - {author: Combahee River Collective, title: The Combahee River Collective Statement, year: 1977}
      - {author: Angela Y. Davis, title: "Women, Race and Class", year: 1981}
      - {author: bell hooks, title: "Ain't I a Woman: Black Women and Feminism", year: 1981}
      - {author: Kimberlé Crenshaw, title: "Demarginalizing the Intersection of Race and Sex", year: 1989}
      - {author: Patricia Hill Collins, title: Black Feminist Thought, year: 1990}

  - id: feminism.difference
    regions: [France, Italy, United States]
    self: >-
      Equality on men's terms is a trap. To ask to be the same as men is to accept that the male is the
      human norm and the feminine a lack. Women's experience of the body, of birth, of care and of
      relation is a different way of being and knowing, and a society that values only autonomy,
      competition and abstraction is built in man's image. We do not want to erase sexual difference
      but to give it symbolic and political existence: a culture, a law and an ethics in which the
      feminine is no longer the inferior term.
    record:
      - date: 1974
        text: >-
          Luce Irigaray publishes Speculum of the Other Woman and loses her teaching post at Vincennes.
      - date: 1975
        text: >-
          Hélène Cixous publishes The Laugh of the Medusa; the Milan Women's Bookstore opens and becomes the
          center of Italian sexual-difference thought.
      - date: 1979
        disputed: true
        text: >-
          Antoinette Fouque's Psychanalyse et Politique group registers the name MLF as a trademark. Fouque's
          supporters call it protection of the movement's name; most other French feminists call it an
          appropriation of a collective movement.
      - date: 1982
        text: >-
          Carol Gilligan's In a Different Voice argues women's moral reasoning centers on care and
          relationship, founding the ethics of care.
      - date: "1999-2000"
        text: >-
          France amends its constitution and passes the parity law requiring equal numbers of male and
          female candidates, defended partly on the ground that humanity is made of two sexes.
    descendsFrom: []
    breaksWith:
      - {id: feminism.liberal, event: "Irigaray's critique of equality as sameness", date: 1974}
    analysis:
      conditions: >-
        It arose in France and Italy in the 1970s, where feminism faced both a Marxist left that put
        women's issues last and a liberal agenda that offered entry into male institutions on male terms,
        and where psychoanalysis set the intellectual idiom. As women entered paid work under a double
        shift, equality as sameness meant doing men's jobs plus the housework; valuing difference
        expressed a refusal of that bargain.
      class_base: >-
        Women intellectuals in universities, publishing and psychoanalysis, women's bookshops and
        collectives; its ethics of care speaks to mothers and paid care workers.
      function: >-
        It underwrites parity laws and care-ethics arguments for paid care leave and higher pay for care
        work. Conservatives and states promoting motherhood can also take it up. When difference is
        affirmed without changing the division of labor, it can justify women's concentration in low-paid
        care work and their withdrawal from better-paid jobs.
      disputed: >-
        Materialist feminists (Delphy, Guillaumin) reject difference as the naturalization of a social
        relation; difference feminists answer that materialists erase the body and accept the male model.
        Black and decolonial feminists object that both treat woman as one universal figure.
    keyTexts:
      - {author: Luce Irigaray, title: Speculum of the Other Woman, year: 1974}
      - {author: Hélène Cixous, title: The Laugh of the Medusa, year: 1975}
      - {author: Carol Gilligan, title: In a Different Voice, year: 1982}
      - {author: Milan Women's Bookstore Collective, title: "Sexual Difference: A Theory of Social-Symbolic Practice (Non credere di avere dei diritti)", year: 1987}

  - id: feminism.queer
    regions: [United States, Europe, Latin America, worldwide]
    self: >-
      There is no natural man or woman underneath it all. Gender is something done and repeated under
      pressure, and the norms that make some bodies and desires intelligible make others unlivable.
      Heterosexuality is not nature but a regime that manufactures its own outsiders. We refuse the
      demand to be normal, and the deal that offers respectability to those who marry and assimilate
      while abandoning the rest. Our politics is a coalition of everyone the norm wounds: queers, trans
      people, sex workers, the gender nonconforming. We learned it in the AIDS years, when the state let us die.
    record:
      - date: 1969
        text: >-
          Patrons of the Stonewall Inn in New York, among them trans women and homeless queer youth, resist
          a police raid on 28 June; the Gay Liberation Front forms within weeks.
      - date: 1987
        text: >-
          ACT UP is founded in New York as AIDS kills hundreds of thousands of Americans while the federal
          government delays; its direct actions force changes in drug approval and pricing.
      - date: 1990
        text: >-
          Judith Butler's Gender Trouble and Eve Kosofsky Sedgwick's Epistemology of the Closet appear;
          Teresa de Lauretis names queer theory; Queer Nation is founded.
      - date: "2003-2015"
        text: >-
          US courts strike down sodomy laws (2003) and establish same-sex marriage (2015). Lisa Duggan
          criticizes the mainstream movement's turn to marriage and military service as a new
          homonormativity, and Jasbir Puar (2007) names homonationalism, the use of gay rights to justify
          war and anti-Muslim policy.
      - date: 2012
        text: >-
          Argentina's Gender Identity Law lets people change their legal gender by self-declaration,
          without medical or judicial requirements.
      - date: 2024
        disputed: true
        text: >-
          England's Cass Review concludes that the evidence for puberty blockers in minors is weak, and
          their routine use is halted. Supporters call it careful medicine; trans organizations and a
          number of clinicians and academics dispute its methods and conclusions.
    descendsFrom: []
    breaksWith:
      - {id: feminism.radical, event: "Barnard Conference on Sexuality and Gayle Rubin's Thinking Sex", date: 1982}
      - {id: liberalism.progressive, event: "Critique of marriage-centered, homonormative rights politics", date: 2003}
    analysis:
      conditions: >-
        Wage labor, by freeing individuals from household production, made urban gay and lesbian life
        possible (John D'Emilio, 1983). The AIDS crisis under austerity governments forced a confrontational
        politics, and the turn of the university humanities to poststructuralism gave it a theory.
      class_base: >-
        Academics and students in the humanities and urban queer and trans communities across classes,
        including the precarious: homeless queer youth, sex workers and trans people shut out of formal
        employment.
      function: >-
        Its ideas shape law on gender recognition and much of culture. Corporate Pride sells identities
        back as markets while the critique of normality stays in the seminar room; its focus on discourse
        and norms can leave property untouched. Its coalition of the precarious points at the reserve army
        of labor. Abroad, core states use gay rights as a diplomatic marker, which lets governments in the
        periphery cast their own LGBT citizens as foreign agents.
      disputed: >-
        Marxist critics (Rosemary Hennessy, 2000; Kevin Floyd, 2009) argue queer theory lost the tie to
        capitalism that D'Emilio drew; queer Marxists reply that it is being rebuilt; gender-critical
        feminists reject the denaturalization of sex itself.
    keyTexts:
      - {author: Michel Foucault, title: "The History of Sexuality, Volume 1", year: 1976}
      - {author: John D'Emilio, title: Capitalism and Gay Identity, year: 1983}
      - {author: Judith Butler, title: Gender Trouble, year: 1990}
      - {author: Eve Kosofsky Sedgwick, title: Epistemology of the Closet, year: 1990}
      - {author: Jasbir K. Puar, title: "Terrorist Assemblages: Homonationalism in Queer Times", year: 2007}

  - id: feminism.gender-critical
    regions: [Britain, Ireland, United States, Spain]
    self: >-
      Sex is real, binary and unchangeable, and women's oppression is built on it: on female bodies,
      pregnancy and men's violence. Gender is the set of stereotypes laid on sex to keep women down; we
      want to abolish gender, not multiply it. When the law replaces sex with self-declared gender
      identity, women lose the single-sex spaces, sports, prisons and statistics that protect them, and
      lesbians are told their attraction is bigotry. We are feminists, not conservatives. We defend
      children who do not fit stereotypes from medicalization, and women's right to speak about their own bodies.
    record:
      - date: 1979
        text: >-
          Janice Raymond publishes The Transsexual Empire, arguing that transsexual medicine reinforces
          gender stereotypes.
      - date: "2017-2020"
        text: >-
          Groups such as Woman's Place UK organize against the British government's proposal to allow legal
          gender change by self-declaration; the government drops the proposal in September 2020.
      - date: 2019
        disputed: true
        text: >-
          Members of the US Women's Liberation Front speak at a Heritage Foundation panel against the
          Equality Act. Gender-critical feminists call such alliances tactical cooperation on a single
          issue; critics call them evidence of a shared agenda with the religious right.
      - date: 2021
        text: >-
          In Forstater v CGD Europe the Employment Appeal Tribunal rules that gender-critical belief is a
          protected philosophical belief under Britain's Equality Act 2010.
      - date: "2022-2023"
        text: >-
          The Scottish Parliament passes a self-declaration gender recognition bill in December 2022; in
          January 2023 the UK government blocks it under section 35 of the Scotland Act, the first use of
          that power.
      - date: 2025
        text: >-
          In For Women Scotland v The Scottish Ministers the UK Supreme Court rules that sex in the Equality
          Act 2010 means biological sex.
    descendsFrom:
      - {id: feminism.radical, event: "Raymond's The Transsexual Empire", date: 1979}
    breaksWith:
      - {id: feminism.queer, event: "Opposition to self-declared gender recognition in the UK consultation", date: 2018}
    analysis:
      conditions: >-
        It arose where states and institutions moved to put gender identity in place of sex in law and
        policy, as in the UK and Ireland, and where a strong radical feminist current survived from the
        women's liberation movement. Under austerity, refuges, single-sex wards, prison places and sports
        categories were a fixed or shrinking stock, which sharpened a dispute over definition into a
        dispute over allocation.
      class_base: >-
        Mostly older educated women and lesbians, some working-class women's groups, small donors and
        media allies on left and right; in the United States, legal alliances with religious-right
        organizations such as the “Alliance Defending Freedom.”
      function: >-
        It has shaped UK law and policy and lent arguments to US conservative state laws on trans people.
        Framing the conflict as women against trans people allocates scarce public services by sex instead
        of expanding them, and lets right-wing parties take up women's safety while cutting the refuges
        and services that deal with men's violence.
      disputed: >-
        Gender-critical writers hold that sex-based oppression, resting on reproduction and the division of
        labor, is the materialist position. Trans Marxists (Transgender Marxism, 2021) argue gender is
        produced by the social organization of reproduction and that the movement's politics serves the right.
    keyTexts:
      - {author: Janice G. Raymond, title: The Transsexual Empire, year: 1979}
      - {author: Sheila Jeffreys, title: "Gender Hurts: A Feminist Analysis of the Politics of Transgenderism", year: 2014}
      - {author: Kathleen Stock, title: "Material Girls: Why Reality Matters for Feminism", year: 2021}
      - {author: Holly Lawford-Smith, title: Gender-Critical Feminism, year: 2022}

  - id: feminism.islamic
    regions: [Iran, Malaysia, Morocco, Egypt, Indonesia, Muslim diaspora]
    self: >-
      The Qur'an did not subordinate women; patriarchal interpretation did. God created men and women
      from a single soul and made them protectors of one another. Khadija employed the Prophet; his wives
      taught, traded and judged. What passes for sharia on women, male guardianship, unilateral divorce,
      obedience, is fiqh, human jurisprudence by men of particular centuries, and it can be read again.
      We claim equality and justice from inside our faith, not against it. We refuse both the patriarchs
      who speak for Islam and the outsiders who think we must leave our religion to be free.
    record:
      - date: 1987
        text: >-
          Fatima Mernissi publishes The Veil and the Male Elite, rereading the hadith used against women.
      - date: 1988
        text: >-
          Sisters in Islam is founded in Malaysia to argue for women's rights within Islam and campaign on
          family law.
      - date: 1992
        text: >-
          Shahla Sherkat founds the magazine Zanan in Tehran, which rereads Islamic jurisprudence on women;
          it is closed in 2008 and reopens in 2014. Amina Wadud's Qur'an and Woman appears the same year.
      - date: 2004
        text: >-
          Morocco's new family code raises the marriage age to 18, places the family under the joint
          responsibility of both spouses and restricts polygamy, drafted with women's associations and
          justified in religious terms.
      - date: "2005-2009"
        text: >-
          Amina Wadud leads a mixed-gender Friday prayer in New York in 2005; in 2009 the Musawah movement
          for equality in the Muslim family is launched in Kuala Lumpur.
      - date: "1990s-"
        disputed: true
        text: >-
          Several leading figures, Wadud and Mernissi among them, hesitated over or rejected the label
          Islamic feminism; secular feminists contest it as a contradiction, and many Islamists as a
          Western import.
    descendsFrom:
      - {id: religious.post-islamism, event: "Iranian reformist women's press rereads jurisprudence after the revolution", date: 1992}
    breaksWith:
      - {id: religious.islamism-khomeinist, event: "Zanan challenges clerical rulings on women", date: 1992}
    analysis:
      conditions: >-
        It arose in the 1990s where Islamist movements and states had made religion the language of law,
        while mass female schooling and urban work produced women able to argue in that language; in Iran
        women were a majority of university entrants by around 2000. When family law claims divine
        authority, only an argument from scripture can move it.
      class_base: >-
        Educated urban Muslim women: scholars, lawyers, journalists and NGO workers, linked in
        transnational networks partly funded by foundations.
      function: >-
        It wins step-by-step family-law reform and breaks the Islamist claim to speak alone for religion.
        Reforming guardianship, divorce and inheritance changes women's access to property and paid work,
        and draws them further into labor markets; foreign donors' interest lets opponents cast it as a
        Western project.
      disputed: >-
        Haideh Moghissi (Feminism and Islamic Fundamentalism, 1999) argues it legitimates religious states
        and cannot deliver equality inside a religious frame; Saba Mahmood (Politics of Piety, 2005)
        argues secular feminist frames misread Muslim women's own aims; Marxist readings ask whether the
        reforms reach poor rural women.
    keyTexts:
      - {author: Fatima Mernissi, title: "The Veil and the Male Elite (Le Harem politique)", year: 1987}
      - {author: Leila Ahmed, title: Women and Gender in Islam, year: 1992}
      - {author: Amina Wadud, title: "Qur'an and Woman", year: 1992}
      - {author: Ziba Mir-Hosseini, title: "Islam and Gender: The Religious Debate in Contemporary Iran", year: 1999}
      - {author: Asma Barlas, title: "'Believing Women' in Islam", year: 2002}

  - id: feminism.decolonial
    regions: [Latin America, South Asia, Africa, worldwide]
    self: >-
      Northern feminism spoke of women in the poor countries as one passive victim waiting to be rescued
      by development programs, or by bombs. We are not your object. Our oppression is made by
      colonialism, the world market, debt, the plantation and the export factory as much as by men, and
      our struggles are rooted in land, water, community and the body as territory. Peasant women,
      indigenous women, Dalit women, garment workers: we theorize from where we stand, and our liberation
      cannot be separated from the liberation of our peoples.
    record:
      - date: 1984
        text: >-
          Chandra Talpade Mohanty publishes Under Western Eyes, a critique of how Western feminist
          scholarship portrays “Third World women” as a single victim.
      - date: 1985
        text: >-
          The DAWN network, founded in Bangalore in 1984, brings a Southern critique of development and
          structural adjustment to the UN World Conference on Women in Nairobi.
      - date: 1986
        text: >-
          Maria Mies publishes Patriarchy and Accumulation on a World Scale, on how the international
          division of labor makes women's unpaid and cheap work a basis of accumulation.
      - date: 1994
        text: >-
          The Zapatista uprising publishes the Women's Revolutionary Law, including the rights to choose a
          partner, to decide how many children to have, and to hold command.
      - date: 2007
        text: >-
          María Lugones publishes Heterosexualism and the Colonial/Modern Gender System, arguing that
          colonialism imposed the gender order it claimed to find.
      - date: 2016
        text: >-
          Berta Cáceres, Lenca leader of COPINH, is murdered in Honduras after leading opposition to the
          Agua Zarca dam; seven men are convicted in 2018 and an executive of the dam company in 2021.
      - date: 1997
        disputed: true
        text: >-
          Oyèrónkẹ́ Oyěwùmí argues in The Invention of Women that precolonial Yoruba society was not organized
          by gender but by seniority; other scholars, such as Bibi Bakare-Yusuf, dispute the reading of the evidence.
    descendsFrom:
      - {id: nationalism.decolonial, event: "Lugones extends Quijano's coloniality of power to gender", date: 2007}
      - {id: marxism.dependency, event: "Mies and the Bielefeld school on women's labor in the world economy", date: 1986}
    breaksWith:
      - {id: feminism.liberal, event: "Mohanty's Under Western Eyes", date: 1984}
    analysis:
      conditions: >-
        It arose from women in the periphery facing the debt crisis and structural adjustment of the
        1980s, when cuts to food subsidies and services were absorbed by women's unpaid work; export zones
        hiring young women as the cheapest labor; land grabs; and women-in-development programs designed
        in the North. Gender became a direct lever of the transfer of value from periphery to core.
      class_base: >-
        Peasant and indigenous women, workers in export manufacturing, and Southern feminist scholars and
        NGO networks.
      function: >-
        It contests both corporate feminism and the use of women's rights to justify military
        intervention, as in the 2001 invasion of Afghanistan (Lila Abu-Lughod, Do Muslim Women Need
        Saving?, 2013). Where it organizes export-zone workers and defends land and water, it raises the
        cost of peripheral labor and resources and reduces what flows north.
      disputed: >-
        Mies and Silvia Federici ground it in accumulation and the international division of labor;
        Lugones and Oyěwùmí locate the origin in colonial ways of knowing. Marxist critics of postcolonial
        theory such as Vivek Chibber (2013) argue that culture-first frames lose class.
    keyTexts:
      - {author: Chandra Talpade Mohanty, title: "Under Western Eyes: Feminist Scholarship and Colonial Discourses", year: 1984}
      - {author: Maria Mies, title: Patriarchy and Accumulation on a World Scale, year: 1986}
      - {author: Gita Sen and Caren Grown, title: "Development, Crises and Alternative Visions: Third World Women's Perspectives", year: 1987}
      - {author: Oyèrónkẹ́ Oyěwùmí, title: The Invention of Women, year: 1997}
      - {author: María Lugones, title: "Heterosexualism and the Colonial/Modern Gender System", year: 2007}
