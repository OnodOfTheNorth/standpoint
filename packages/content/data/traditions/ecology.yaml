traditions:
  - id: ecology.green-growth
    regions: [Western Europe, North America, international institutions, worldwide]
    self: >-
      We refuse the false choice between prosperity and the planet. Pollution is a cost that markets
      fail to count, and once governments put a price on carbon, set clear standards and invest in
      research, the ingenuity of firms and households turns toward clean production. Sustainable
      development means meeting the needs of the present without compromising the ability of future
      generations to meet theirs. Solar, wind, batteries and efficiency are already cheaper than the
      old fuels in much of the world. Growth pays for the transition and keeps the public with it; the
      task is to steer it, through international agreement, toward a clean economy.
    record:
      - date: 1972
        text: >-
          The United Nations Conference on the Human Environment in Stockholm puts environmental
          protection on the international agenda and founds the UN Environment Programme.
      - date: 1987
        text: >-
          The World Commission on Environment and Development, chaired by Gro Harlem Brundtland, issues
          Our Common Future, which makes "sustainable development" the official framework, reconciling
          environmental protection with continued economic growth.
      - date: 1992–1997
        text: >-
          The Rio Earth Summit adopts the UN Framework Convention on Climate Change (1992); the Kyoto
          Protocol (1997) sets binding targets for rich countries and creates emissions trading and the
          Clean Development Mechanism, through which Northern emitters buy credits for projects in the South.
      - date: 2005
        text: >-
          The European Union launches its Emissions Trading System; over-allocation of permits keeps
          prices low in its first phases, and reforms tighten the cap later.
      - date: 2015
        text: >-
          The Paris Agreement commits every signatory to national emission targets, to be raised over
          time, with a goal of holding warming well below 2°C.
      - date: 2019–2022
        text: >-
          The European Green Deal (2019) and the United States Inflation Reduction Act (2022) make large
          public subsidies for clean industry the center of climate policy in the core.
      - date: 2005–2023
        disputed: true
        text: >-
          Several dozen countries, most of them rich, cut territorial and consumption-based carbon
          emissions while their economies grew. Supporters read this as proof that absolute decoupling
          works; critics answer that the rate of decline is far too slow for the remaining carbon budget
          and that material footprints have not fallen.
    descendsFrom:
      - {id: liberalism.social, event: "Brundtland Commission's program of sustainable development", date: 1987}
      - {id: liberalism.utilitarian, event: "Pigou's theory of external costs and corrective taxes", date: 1920}
    breaksWith:
      - {id: ecology.neo-malthusian, event: "Brundtland replaces the limits-to-growth frame with sustainable development", date: 1987}
    analysis:
      conditions: >-
        It arose from the collision of the 1970s limits-to-growth debate with the neoliberal turn: by
        the late 1980s ecological damage could no longer be denied, but states and firms committed to
        growth and open markets would accept only remedies that left accumulation running. Pricing
        pollution and subsidizing clean technology fit that requirement, so it became the official
        language of governments and international institutions.
      class_base: >-
        Professionals and managers in ministries, international agencies, consultancies and green
        finance; renewable energy, electric vehicle and grid capital; urban educated voters in the core
        who want climate action without loss of living standards.
      function: >-
        It turns climate policy into new fields of investment, carbon markets, offsets, renewables and
        electric vehicles, with risk carried by public budgets and returns kept by private owners. It
        has cut coal use in parts of the core. The minerals, land and cheap manufacturing the build-out
        needs come largely from the periphery at prices set in core markets, and offsets let core
        emitters claim cuts made on Southern land, so by the frame it sustains the drain while softening
        the core's own emissions.
      disputed: >-
        Some socialists (Pollin) argue that a large public green investment program within growth can
        serve workers in core and periphery; degrowth and Third Worldist critics (Hickel, Kallis) hold
        that green growth locks in the drain and cannot meet the carbon budget.
    keyTexts:
      - {author: World Commission on Environment and Development, title: Our Common Future, year: 1987}
      - {author: "David Pearce, Anil Markandya and Edward B. Barbier", title: Blueprint for a Green Economy, year: 1989}
      - {author: Nicholas Stern, title: "The Economics of Climate Change: The Stern Review", year: 2006}
      - {author: OECD, title: Towards Green Growth, year: 2011}

  - id: ecology.ecomodernism
    regions: [United States, Britain, Northern Europe]
    self: >-
      Modernization is the solution, not the problem. Human beings have always reshaped nature, and
      the societies that did it most intensively, with cities, high-yield farms and dense energy, now
      use less land per person and have fewer children. We want to decouple human welfare from nature:
      grow more food on less land, replace wood and coal with nuclear fission and other dense, clean
      sources, and let forests and wildlife return to the land we no longer need. The world's poor need
      far more energy, not less. Romantic environmentalism, which fears technology and preaches
      sacrifice, has failed; abundance is the path to a great Anthropocene.
    record:
      - date: 2003–2004
        text: >-
          Michael Shellenberger and Ted Nordhaus found the Breakthrough Institute in Oakland (2003) and
          publish "The Death of Environmentalism" (2004), attacking the mainstream green movement for
          politics of limits and regulation.
      - date: 2009
        text: >-
          Stewart Brand, founder of the Whole Earth Catalog, publishes Whole Earth Discipline, endorsing
          nuclear power, genetically modified crops and urbanization as environmental strategies.
      - date: 2015
        text: >-
          Eighteen authors publish An Ecomodernist Manifesto, calling for decoupling human development
          from environmental impact through intensification and nuclear power.
      - date: 2015–2022
        text: >-
          A pro-growth, often ecomodernist-labeled left emerges: Leigh Phillips's Austerity Ecology (2015) and
          Matthew Huber's Climate Change as Class War (2022) argue that abundant public energy, not
          degrowth, is the socialist climate program.
      - date: 2022
        text: >-
          California's legislature votes to extend the Diablo Canyon nuclear plant toward 2030 after a
          campaign in which pro-nuclear groups, ecomodernists among them, took part.
      - date: 2018–2022
        disputed: true
        text: >-
          Shellenberger publishes Apocalypse Never (2020) and runs for governor of California as a
          Democrat (2018) and then as an independent (2022) on a platform hostile to climate alarm. Critics
          read his path as ecomodernism's drift toward minimizing the crisis; supporters read it as a
          principled break with alarmism, and other ecomodernists distance themselves from it.
    descendsFrom:
      - {id: ecology.green-growth, event: "Breakthrough Institute's critique of regulation-based environmentalism", date: 2004}
      - {id: liberalism.technocratic, event: "Decoupling through innovation as a policy program", date: 2015}
    breaksWith:
      - {id: ecology.deep-ecology, event: "The Death of Environmentalism", date: 2004}
      - {id: ecology.degrowth, event: "Ecomodernist Manifesto rejects limits and sacrifice", date: 2015}
    analysis:
      conditions: >-
        It arose in the United States after the failure of cap-and-trade legislation and the Copenhagen
        summit of 2009, when a politics of limits had visibly failed to win majorities. Cheap shale gas,
        falling solar prices and fast growth in Asia made a promise of clean abundance credible to
        audiences tired of being told to consume less.
      class_base: >-
        Engineers, scientists, technology investors and policy professionals in the core, the nuclear
        and agribusiness industries, and on its left wing some union-oriented socialists who see energy
        workers as the base of climate politics.
      function: >-
        It offers capital-intensive sectors, nuclear construction, industrial agriculture and large
        utilities, an environmental justification and a claim on public finance. Land sparing through
        intensification concentrates farming in large holdings and sets other land aside, which in the
        periphery can displace smallholders. Its insistence on energy for the poor answers a real
        Southern demand, but it leaves the price and ownership of that energy to existing markets, so
        by the frame its effect on the drain is to sustain it.
      disputed: >-
        Ecomodernist socialists (Huber, Phillips) hold that public ownership of abundant energy breaks
        capital's control; ecosocialists (Foster, Saito) answer that abundance without limits only
        accelerates the metabolic rift.
    keyTexts:
      - {author: Michael Shellenberger and Ted Nordhaus, title: "The Death of Environmentalism: Global Warming Politics in a Post-Environmental World", year: 2004}
      - {author: Ted Nordhaus and Michael Shellenberger, title: "Break Through: From the Death of Environmentalism to the Politics of Possibility", year: 2007}
      - {author: Stewart Brand, title: "Whole Earth Discipline: An Ecopragmatist Manifesto", year: 2009}
      - {author: "John Asafu-Adjaye, Linus Blomqvist, Stewart Brand and others", title: An Ecomodernist Manifesto, year: 2015}

  - id: ecology.degrowth
    regions: [France, Spain, Italy, Germany, Japan, Latin America]
    self: >-
      Growth has become a religion, and rich countries are its most devout believers. Yet they already
      produce far more than people need for a good life; what they lack is fair distribution, free
      time and security. Endless growth on a finite planet is impossible, and no rich country has cut
      its use of energy and materials anywhere near fast enough while growing. We call for a planned,
      democratic reduction of production and consumption in rich countries: cut what is wasteful and
      harmful, guarantee everyone's needs through public services, share out work and shorten the
      week, and end the drain of resources from the South so that poor countries can meet their needs.
    record:
      - date: 1971–1979
        text: >-
          Nicholas Georgescu-Roegen's The Entropy Law and the Economic Process (1971) argues that the
          economy is bound by thermodynamics; André Gorz uses the word décroissance in 1972, and a French
          collection of Georgescu-Roegen's essays is published as Demain la décroissance (1979).
      - date: 2002
        text: >-
          A colloquium in Paris, "Défaire le développement, refaire le monde", launches décroissance as a
          movement in France, rejecting sustainable development as a contradiction in terms.
      - date: 2008–2010
        text: >-
          The first international degrowth conference is held in Paris (2008), the second in Barcelona
          (2010), where a research network around Joan Martinez-Alier and Giorgos Kallis forms.
      - date: 2018
        text: >-
          More than two hundred academics publish an open letter calling on the European Union to plan
          for a post-growth future, leading to a Post-Growth conference at the European Parliament.
      - date: 2020
        text: >-
          Kohei Saito's Hitoshinsei no 'Shihonron', arguing for degrowth communism, becomes a bestseller
          in Japan; Jason Hickel's Less Is More brings degrowth to a wide English-language readership.
      - date: 2023
        text: >-
          The "Beyond Growth" conference at the European Parliament gives degrowth and post-growth
          economists a platform alongside the European Commission's president.
      - date: 2008–2024
        disputed: true
        text: >-
          Southern movements and governments have received degrowth unevenly. Its advocates (Hickel,
          Kallis) insist it applies only to rich countries and pairs with Southern sufficiency and climate
          debt; some Southern economists and governments read any call to limit growth as a new
          constraint on their development.
    descendsFrom:
      - {id: marxism.western, event: "Gorz's political ecology", date: 1972}
      - {id: ecology.neo-malthusian, event: "The Limits to Growth report to the Club of Rome", date: 1972}
    breaksWith:
      - {id: ecology.green-growth, event: "Paris colloquium rejects sustainable development", date: 2002}
      - {id: ecology.neo-malthusian, event: "Degrowth rejects population control in favour of cutting the consumption of the rich", date: 2008}
    analysis:
      conditions: >-
        It grew where growth had stopped delivering to the young: in Southern Europe after the euro
        crisis of 2010, and in Japan after three decades of stagnation, among graduates facing flat
        wages, insecure work and expensive housing while climate breakdown became visible. A program of
        less output and more public provision costs such people little and offers them time and security.
      class_base: >-
        Academics, students, young graduates in insecure work, NGO and climate-movement staff in Western
        Europe and Japan, with alliances to peasant and Indigenous movements in Latin America that resist
        extraction.
      function: >-
        Cutting the core's throughput of energy and materials directly reduces the land, minerals and
        labor the core takes from the periphery, so by the frame it reduces the drain, provided it is
        joined to fair prices for Southern exports and room for Southern growth. Without a base among
        core workers, it can be read as austerity, and lower core demand can hurt Southern exporters in
        the short run.
      disputed: >-
        Ecomodernist socialists (Huber, Phillips) see degrowth as a middle-class politics that will
        never win workers; degrowth communists (Saito) and Hickel answer that public abundance and
        shorter hours make it a workers' program.
    keyTexts:
      - {author: Nicholas Georgescu-Roegen, title: The Entropy Law and the Economic Process, year: 1971}
      - {author: André Gorz, title: Écologie et politique, year: 1975}
      - {author: Serge Latouche, title: Petit traité de la décroissance sereine, year: 2007}
      - {author: "Giacomo D'Alisa, Federico Demaria and Giorgos Kallis (eds.)", title: "Degrowth: A Vocabulary for a New Era", year: 2014}
      - {author: Giorgos Kallis, title: Degrowth, year: 2018}
      - {author: Jason Hickel, title: "Less Is More: How Degrowth Will Save the World", year: 2020}

  - id: ecology.deep-ecology
    regions: [Norway, United States, Australia]
    self: >-
      Shallow ecology fights pollution and resource depletion so that people in rich countries can
      stay healthy and comfortable. Deep ecology asks deeper questions. The flourishing of human and
      non-human life has value in itself, independent of its usefulness to us. The richness and
      diversity of life are values in themselves. Humans have no right to reduce them except to satisfy
      vital needs, and present human interference is excessive and worsening. We seek self-realization
      through identification with the wider web of life, simple living, protection of wild places, and,
      over generations and by humane means, a smaller human population.
    record:
      - date: 1973
        text: >-
          Arne Naess publishes "The Shallow and the Deep, Long-Range Ecology Movement" in Inquiry, from a
          lecture given in Bucharest in 1972, distinguishing resource-management environmentalism from a
          deep ecology grounded in the value of all life.
      - date: 1980
        text: >-
          Earth First! is founded in the United States with the slogan "No compromise in defense of Mother
          Earth", taking deep ecology as its philosophy and using blockades, tree-sits and sabotage.
      - date: 1984–1985
        text: >-
          Naess and George Sessions draft the eight-point deep ecology platform; Bill Devall and Sessions
          publish Deep Ecology: Living as if Nature Mattered.
      - date: 1987
        disputed: true
        text: >-
          Articles in the Earth First! Journal, including one signed "Miss Ann Thropy", welcome AIDS and
          famine as checks on human numbers, and Murray Bookchin denounces deep ecology as misanthropic.
          Deep ecologists, Naess among them, reject such statements as betrayals of the platform; social
          ecologists hold that misanthropy follows from treating humanity in general as the problem.
      - date: 1989
        text: >-
          Ramachandra Guha publishes "Radical American Environmentalism and Wilderness Preservation: A
          Third World Critique", arguing that deep ecology's wilderness ideal justifies evicting peasants
          and tribal peoples in India and elsewhere.
    descendsFrom:
      - {id: nationalism.gandhian, event: "Naess's Gandhian ethics of non-violence and self-realization", date: 1974}
    breaksWith:
      - {id: anarchism.communalism, event: "Bookchin's attack on deep ecology at the National Gathering of the Greens", date: 1987}
    analysis:
      conditions: >-
        It arose in rich, sparsely populated settings, Norway and the American West, during the postwar
        boom, among people for whom wild land was a place of recreation and contemplation rather than of
        work, and at a moment when industrial destruction of forests and rivers had become visible and
        mainstream environmentalism offered only better management.
      class_base: >-
        Educated middle strata in the core: academics, outdoor professionals, conservation staff and the
        counterculture, with a militant wing among rural activists in the American West and Australia.
      function: >-
        It supplies the strongest moral case for protecting wild nature for its own sake and has helped
        save forests and species. Its main institutional form, the protected area, has in the periphery
        often meant excluding peasants, herders and Indigenous peoples from land they used, while leaving
        core consumption untouched; and its population plank has been borrowed by neo-Malthusian and
        ecofascist currents. Its effect on the drain is none.
      disputed: >-
        Defenders (Naess, Sessions) stress that the platform calls first for less consumption by the
        rich and opposed evictions; critics in the Guha and Bookchin lines hold that its abstraction from
        class and empire is built in.
    keyTexts:
      - {author: Arne Naess, title: "The Shallow and the Deep, Long-Range Ecology Movement", year: 1973}
      - {author: Bill Devall and George Sessions, title: "Deep Ecology: Living as if Nature Mattered", year: 1985}
      - {author: Arne Naess, title: "Økologi, samfunn og livsstil", year: 1974, note: "5th edition 1976; English: Ecology, Community and Lifestyle (1989)"}
      - {author: Aldo Leopold, title: A Sand County Almanac, year: 1949}

  - id: ecology.environmental-justice
    regions: [United States, Nigeria, India, Latin America, worldwide]
    self: >-
      We do not speak of the environment as wilderness somewhere else. The environment is where we live,
      work, play and pray, and the poison always ends up in the same places: Black and brown
      neighborhoods, Indigenous land, the villages of the South. The landfill, the refinery, the
      pipeline and the mine are put where people have the least power to refuse them. Environmental
      justice means that no community is a sacrifice zone, that those who are harmed have the right to
      speak for themselves and to say no, and that those who polluted, at home and abroad, pay their
      debt.
    record:
      - date: 1982
        text: >-
          In Warren County, North Carolina, a mostly Black county, residents and civil rights activists
          block trucks carrying soil contaminated with PCBs to a new landfill; more than five hundred
          people are arrested, and the protest is commonly taken as the movement's starting point.
      - date: 1984
        disputed: true
        text: >-
          A gas leak at the Union Carbide pesticide plant in Bhopal, India, exposes hundreds of thousands
          of people to methyl isocyanate. The state government's figure is about 3,800 deaths; activist
          and medical estimates run to 8,000 in the first weeks and over 15,000 in total. The company
          settles with the Indian government in 1989 for 470 million dollars.
      - date: 1987–1991
        text: >-
          The United Church of Christ's Commission for Racial Justice publishes Toxic Wastes and Race in
          the United States (1987), finding race the strongest predictor of hazardous waste siting; the
          First National People of Color Environmental Leadership Summit adopts seventeen Principles of
          Environmental Justice (1991).
      - date: 1995
        disputed: true
        text: >-
          Nigeria's military government hangs Ken Saro-Wiwa and eight other Ogoni leaders who had led
          protests against oil pollution in Ogoniland. Shell denies any complicity; in 2009 it pays 15.5
          million dollars to settle a US lawsuit by the victims' families without admitting liability.
          Ogoni activists read the case as a company and a government acting together; Shell reads it as a
          domestic Nigerian matter.
      - date: 2016–2017
        text: >-
          The Standing Rock Sioux and thousands of supporters camp in North Dakota against the Dakota
          Access Pipeline; the camps are cleared in 2017 and the pipeline is completed.
    descendsFrom:
      - {id: religious.christian-socialism, event: "Church-based civil rights organizing and the UCC report Toxic Wastes and Race", date: 1987}
      - {id: nationalism.indigenous-sovereignty, event: "Founding of the Indigenous Environmental Network", date: 1990}
    breaksWith:
      - {id: ecology.green-growth, event: "Southwest Organizing Project letter accusing the national environmental groups of ignoring communities of color", date: 1990}
    analysis:
      conditions: >-
        It arose where the costs of production are dumped: firms and states site waste, refineries and
        mines where land is cheap and residents lack political power, which in the United States means
        Black, Latino and Indigenous communities and in the world economy means the periphery. Deregulation
        and the export of hazardous industry from the 1980s multiplied such conflicts.
      class_base: >-
        Working-class communities of color in the core, Indigenous nations, and peasants, fishers and
        urban poor in the periphery, organized through churches, civil rights groups, tribal governments
        and, increasingly, NGOs and legal clinics.
      function: >-
        It raises the cost of dumping and extraction where communities organize, and puts the class and
        racial distribution of harm at the center of environmental politics. Victories in the core can
        shift hazards abroad, as the 1991 World Bank memo signed by Lawrence Summers on moving dirty
        industry to low-wage countries made explicit, so by the frame the current reduces the drain where
        it links Northern and Southern struggles and only softens it where it stops at national borders.
      disputed: >-
        Marxists debate whether it is a class movement in racial form (Pulido) or a cross-class
        community movement whose NGO wing has been absorbed into liberal environmental policy.
    keyTexts:
      - {author: United Church of Christ Commission for Racial Justice, title: Toxic Wastes and Race in the United States, year: 1987}
      - {author: Robert D. Bullard, title: "Dumping in Dixie: Race, Class, and Environmental Quality", year: 1990}
      - {author: First National People of Color Environmental Leadership Summit, title: Principles of Environmental Justice, year: 1991}
      - {author: Ramachandra Guha and Joan Martinez-Alier, title: "Varieties of Environmentalism: Essays North and South", year: 1997}
      - {author: Joan Martinez-Alier, title: "The Environmentalism of the Poor", year: 2002}

  - id: ecology.neo-malthusian
    regions: [United States, Britain, worldwide]
    self: >-
      The arithmetic is simple and unforgiving: a finite planet cannot support unlimited numbers of
      people consuming ever more. Population multiplies every other environmental pressure, from
      cleared forests to emissions to collapsing fisheries. Technology has bought time, but only by
      drawing down soils, aquifers and fossil carbon. We favor humane measures: universal access to
      contraception, education and rights for women, an end to incentives for large families, and
      honest public talk about limits. Ignoring numbers because the subject is uncomfortable does not
      make the limits go away; it only leaves nature to impose them by famine and collapse.
    record:
      - date: 1968
        text: >-
          Paul Ehrlich's The Population Bomb predicts mass famines in the 1970s; Garrett Hardin's "The
          Tragedy of the Commons" argues that freedom to breed must be curtailed.
      - date: 1972
        text: >-
          The Limits to Growth, commissioned by the Club of Rome, models collapse within a century if
          population and industrial growth continue.
      - date: 1974
        text: >-
          At the World Population Conference in Bucharest, governments of the South, led by India,
          Algeria and others, reject population control as a substitute for development; India's delegate
          declares that "development is the best contraceptive".
      - date: 1975–1977
        disputed: true
        text: >-
          During India's Emergency the government carries out more than eight million sterilizations in
          a year, many coerced through quotas and threats to jobs and rations. International population
          agencies and lenders had pressed for faster results; how far they share responsibility is disputed.
      - date: 1980
        disputed: true
        text: >-
          China adopts its one-child policy, which lasts until 2015 and is enforced with fines, forced
          abortions and sterilizations. Susan Greenhalgh traces its design to projections by Song Jian
          adapted from The Limits to Growth; others weigh Chinese planning priorities more heavily.
      - date: 1980–1990
        text: >-
          Ehrlich bets the economist Julian Simon that five metals will grow dearer over ten years; all
          five fall in price, and Ehrlich pays.
    descendsFrom:
      - {id: liberalism.classical, event: "Malthus's Essay on the Principle of Population", date: 1798}
    breaksWith: []
    analysis:
      conditions: >-
        It arose in the core during the postwar population boom in the newly independent South, when
        Cold War planners feared that hunger would breed communism and US foundations and aid agencies
        funded family planning abroad; at home, suburban affluence and visible pollution made limits a
        mass concern among the educated.
      class_base: >-
        Foundation, aid and scientific elites in the core, some state planners in the South, and a mass
        base among educated core environmentalists.
      function: >-
        It locates the cause of ecological pressure in the births of the poor rather than in the
        consumption and investment of the rich, so it directs aid and policy at women in the periphery
        and leaves core production and the drain untouched. Its arguments have been taken up by border
        nationalism and ecofascism, which most neo-Malthusians reject.
      disputed: >-
        Some ecosocialists accept population as a real variable in a finite world while insisting it acts
        through social relations (Foster); Hartmann and Mamdani hold that the current has served mainly to
        shift blame from the core to the poor.
    keyTexts:
      - {author: Thomas Robert Malthus, title: An Essay on the Principle of Population, year: 1798}
      - {author: William Vogt, title: Road to Survival, year: 1948}
      - {author: Paul R. Ehrlich, title: The Population Bomb, year: 1968}
      - {author: Garrett Hardin, title: "The Tragedy of the Commons", year: 1968}
      - {author: "Donella H. Meadows, Dennis L. Meadows, Jørgen Randers and William W. Behrens III", title: The Limits to Growth, year: 1972}
