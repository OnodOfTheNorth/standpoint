traditions:
  - id: conservatism.realism
    regions: [United States, Britain, worldwide]
    self: >-
      International politics, like all politics, is a struggle for power. There is no world government above
      states, so each must look to its own security, and the balance of power, not law or good intentions, is what
      keeps the peace. We judge a foreign policy by its consequences, not by the virtue of its slogans. Crusades to
      remake other nations in our image end in overreach, quagmire and the ruin of the crusader. Prudence is the
      supreme virtue of statecraft: know your interests, respect the interests of other great powers, and fight only
      when vital interests are at stake.
    record:
      - date: 1939
        text: >-
          E. H. Carr's The Twenty Years' Crisis attacked the interwar faith in the League of Nations and international law
          as the ideology of satisfied powers, founding the realist critique of liberal internationalism.
      - date: 1947
        text: >-
          George Kennan, writing as "X" in Foreign Affairs, set out the policy of containing the Soviet Union; he later
          objected that it had been militarized beyond what he intended.
      - date: 1948
        text: >-
          Hans Morgenthau's Politics Among Nations defined international politics as a struggle for power, with interest
          defined as power as its guide, and became the field's standard text in the United States.
      - date: "1965-1975"
        text: >-
          Morgenthau, Kennan and other realists opposed the American war in Vietnam as outside any vital interest, while
          the realist statecraft of Nixon and Kissinger pursued détente with the Soviet Union and the opening to China.
      - date: "1970-1976"
        disputed: true
        text: >-
          Kissinger's support for the overthrow of Allende in Chile and for Pakistan's war in Bangladesh in 1971 is read by
          critics as realism's indifference to the victims of great-power interest, and by defenders as Cold War necessity
          or as departures from realism.
      - date: 2002
        text: >-
          Thirty-three scholars of international relations, among them Waltz, Mearsheimer and Walt, paid for a New York
          Times advertisement declaring that war with Iraq was not in the national interest of the United States.
      - date: 2014
        disputed: true
        text: >-
          Mearsheimer argued that NATO and EU expansion provoked Russia's seizure of Crimea; supporters credit the
          warning, opponents hold that it denies Ukrainians agency and excuses aggression.
    breaksWith:
      - {id: liberalism.internationalist, event: "Carr's critique of interwar idealism in The Twenty Years' Crisis", date: 1939}
      - {id: conservatism.neo, event: "Opposition to the invasion of Iraq", date: 2002}
    analysis:
      conditions: >-
        It arose as the United States took over Britain's place as the leading world power after 1945 and needed a
        doctrine for managing rivalry with the Soviet Union. Emigré scholars such as Morgenthau, who had watched the
        League fail, gave the new superpower a language of interest and balance in place of the liberal promise of
        law among nations.
      class_base: >-
        Diplomats, military planners and the foreign-policy establishment of the great powers, with support among
        industrial and finance capital that wants stable spheres and calculable risks rather than open-ended war. It
        speaks for the state as a unit and so treats the class interests behind state policy as given.
      function: >-
        Today it argues for restraint against liberal and neoconservative interventionism, and for accepting spheres of
        influence among great powers, including Russia and China. Because it treats states as the only actors and power
        as the only currency, it can oppose particular wars while accepting the hierarchy of the world economy, in which
        great powers' "vital interests" include secure access to the periphery's resources and markets.
      disputed: >-
        Marxists split on realism: some use its debunking of liberal pretexts (as in critiques of humanitarian war), while
        others hold that it naturalizes imperialism by explaining war through the anarchy of states rather than the
        competition of capitals.
    keyTexts:
      - {author: E. H. Carr, title: "The Twenty Years' Crisis, 1919–1939", year: 1939}
      - {author: Hans J. Morgenthau, title: Politics Among Nations, year: 1948}
      - {author: George F. Kennan, title: "American Diplomacy, 1900–1950", year: 1951}
      - {author: Kenneth N. Waltz, title: Theory of International Politics, year: 1979}
      - {author: John J. Mearsheimer, title: The Tragedy of Great Power Politics, year: 2001}
