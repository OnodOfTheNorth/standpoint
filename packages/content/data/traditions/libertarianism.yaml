traditions:
  - id: libertarianism.minarchist
    regions: [United States, Britain, worldwide]
    self: >
      Individuals have rights, and there are things no person or group may do to them without
      violating those rights. A minimal state, limited to protecting people against force, theft and
      fraud and to enforcing contracts, is justified; any more extensive state violates people's
      right not to be forced. Taxation of earnings from labor is on a par with forced labor. We offer
      not a utopia imposed from above but a framework for utopias, where people freely build the
      communities they choose. The night-watchman state: police, courts and defense, and everything
      else left to voluntary exchange and association.
    record:
      - date: 1971–1972
        text: >
          The US Libertarian Party is founded; in 1972 a faithless elector gives its ticket of John
          Hospers and Tonie Nathan one electoral vote, the first ever cast for a woman.
      - date: 1974
        text: >
          Robert Nozick's Anarchy, State, and Utopia gives the minimal state its academic defense
          and a reply to Rawls.
      - date: 1975
        text: >
          Ronald Reagan tells Reason magazine that "the very heart and soul of conservatism is
          libertarianism", signaling the movement's alliance with the Republican right.
      - date: 1977–1980
        text: >
          The Cato Institute is established with Charles Koch's money; in 1980 the Libertarian ticket
          of Ed Clark and David Koch wins about 1 percent of the presidential vote.
      - date: 2008–2016
        text: >
          Ron Paul's Republican primary campaigns and the Tea Party spread libertarian themes; in
          2016 Gary Johnson wins 3.3 percent, the Libertarian Party's best result.
    descendsFrom:
      - {id: liberalism.classical, event: "Nozick's revival of Lockean rights theory", date: 1974}
      - {id: libertarianism.objectivist, event: "Rand's circle trains the first libertarian cadres", date: "1960s"}
    breaksWith:
      - {id: liberalism.egalitarian, event: "Nozick's entitlement theory against Rawls", date: 1974}
      - {id: libertarianism.ancap, event: "Nozick argues a dominant protective agency becomes a minimal state without violating rights", date: 1974}
    analysis:
      conditions: >
        It grew in the postwar United States as federal taxation and regulation expanded and Cold War
        anti-communism shaped politics; opposition to the draft during the Vietnam war gave it a
        youth following. Owners of new private fortunes and of small businesses facing federal taxes
        and regulation found in rights theory a principled case against both.
      class_base: >
        Small business owners, the self-employed, engineers and technology workers, and wealthy
        donors, above all the Koch network.
      function: >
        Through think tanks such as Cato and Reason, and mainly through the Republican Party, it
        shapes tax, deregulation and school choice policy. Cutting taxes on income and capital and
        removing regulation raises the returns to property. The minimal state it keeps (police,
        courts and defense) is the part that protects property, including the property of core
        investors abroad, though its noninterventionist wing opposes US wars.
      disputed: >
        Libertarians argue market liberalization is the surest route out of poverty for poor
        countries; dependency and world-systems theorists argue that open markets lock poor
        countries into the bottom of the world division of labor.
    keyTexts:
      - {author: Albert Jay Nock, title: "Our Enemy, the State", year: 1935}
      - {author: John Hospers, title: "Libertarianism: A Political Philosophy for Tomorrow", year: 1971}
      - {author: Robert Nozick, title: "Anarchy, State, and Utopia", year: 1974}
      - {author: Randy E. Barnett, title: "The Structure of Liberty: Justice and the Rule of Law", year: 1998}

  - id: libertarianism.ancap
    regions: [United States, Honduras, Argentina, worldwide (online)]
    self: >
      The state is a gang of thieves writ large: an organization that claims a monopoly on violence
      in a territory and funds itself by taxation, which is theft. If aggression is wrong for one
      person, it is wrong for a group calling itself the government. Every service the state provides,
      from roads to courts to defense, can be supplied better by voluntary exchange, competing
      private defense agencies and private arbitration. Self-ownership and the non-aggression
      principle are the whole of political ethics; property is acquired by homesteading and voluntary
      transfer. No rulers, no taxes, no central banks: a society of free contract.
    record:
      - date: 1965–1968
        text: >
          Murray Rothbard and Leonard Liggio publish Left and Right, seeking an alliance with the
          anti-war New Left against the state and the Vietnam war.
      - date: 1973
        text: >
          Rothbard's For a New Liberty and David Friedman's The Machinery of Freedom set out a
          stateless society of private courts and defense agencies.
      - date: 2008–2009
        disputed: true
        text: >
          The pseudonymous Satoshi Nakamoto publishes the Bitcoin white paper and launches the
          network, which anarcho-capitalists embrace as money outside state control. Whether its
          origins lie in anarcho-capitalism or in the wider cypherpunk movement is disputed.
      - date: 2013–2024
        disputed: true
        text: >
          Honduras passes a law for semi-autonomous employment and development zones (ZEDEs); the
          private charter city Próspera opens on Roatán with backing from Pronomos Capital, whose
          investors include Peter Thiel. Congress repeals the law in 2022, Próspera files a claim of
          about 10.7 billion dollars against Honduras under the CAFTA-DR treaty, and the Supreme
          Court rules the zones unconstitutional in 2024. Supporters call it investment and
          jobs; opponents, including Garífuna communities, call it a sale of territory and law.
    descendsFrom:
      - {id: anarchism.individualist, event: "Rothbard adopts Spooner and Tucker's anti-statism while rejecting their labor theory of value", date: 1965}
      - {id: liberalism.austrian, event: "Rothbard builds on Mises's economics in Man, Economy, and State", date: 1962}
    breaksWith:
      - {id: libertarianism.objectivist, event: "Rothbard's break with Rand's circle", date: 1958}
      - {id: libertarianism.minarchist, event: "Rothbard's 'Robert Nozick and the Immaculate Conception of the State'", date: 1977}
    analysis:
      conditions: >
        It formed in the United States of the 1960s and 1970s, where anti-war and anti-draft
        sentiment and distrust of the state met an Austrian economics marginal in universities.
        Radical hostility to the state without hostility to capital took hold among small owners and
        technical youth; later the internet and cryptography opened domains that seemed beyond state
        regulation.
      class_base: >
        Small entrepreneurs, software engineers, cryptocurrency investors and traders, with funding
        from parts of technology capital.
      function: >
        Its practical projects are exits from public law: private jurisdictions and cryptocurrency.
        In charter cities in the periphery such as Próspera, foreign investors write their own rules
        and use investment treaties to claim compensation when the host state objects, which moves
        control over land and law from peripheral states to core capital. In Argentina, a president
        who calls himself an anarcho-capitalist has governed with IMF and US Treasury support (see
        paleolibertarianism).
      disputed: >
        Anarcho-capitalists argue private zones bring capital and jobs to poor countries that their
        own states failed; dependency theorists and Honduran opponents argue they repeat the
        enclave economy of the banana companies.
    keyTexts:
      - {author: Gustave de Molinari, title: The Production of Security, year: 1849}
      - {author: Murray N. Rothbard, title: "For a New Liberty: The Libertarian Manifesto", year: 1973}
      - {author: David Friedman, title: The Machinery of Freedom, year: 1973}
      - {author: Murray N. Rothbard, title: The Ethics of Liberty, year: 1982}

  - id: libertarianism.objectivist
    regions: [United States]
    self: >
      Reality exists; reason is man's only means of knowledge; man is an end in himself, and his own
      life is his highest value. The moral purpose of a life is one's own rational happiness, won by
      productive work and by trading value for value, never by sacrificing oneself to others or others
      to oneself. Altruism, the morality of self-sacrifice, is the ethics of looters and moochers.
      The only social system consistent with man's nature is laissez-faire capitalism, with a
      government limited to protecting rights by banning the initiation of force. We are radicals for
      capitalism, not because it is efficient, but because it is moral.
    record:
      - date: 1947
        text: >
          Ayn Rand testifies as a friendly witness before the House Un-American Activities Committee
          about pro-Soviet content in Hollywood films.
      - date: 1957–1968
        text: >
          Atlas Shrugged is published; the Nathaniel Branden Institute teaches Objectivism through
          lectures across the country until Rand breaks with Branden in 1968.
      - date: 1974
        text: >
          At West Point, Rand says that Native Americans had no right to the land because they had no
          concept of property rights, and that Europeans were right to take it.
      - date: 1985–1990
        text: >
          Leonard Peikoff founds the Ayn Rand Institute; in 1989–90 David Kelley is expelled for
          tolerating libertarians and founds a rival institute, now The Atlas Society.
      - date: 1987–2008
        text: >
          Alan Greenspan, a member of Rand's inner circle in the 1950s and 1960s, chairs the Federal
          Reserve from 1987 to 2006; in 2008 he tells Congress he found "a flaw" in his model of
          self-correcting markets.
    descendsFrom:
      - {id: liberalism.classical, event: "Rand's moral defense of capitalism in The Fountainhead", date: 1943}
    breaksWith:
      - {id: conservatism.fusionism, event: "Whittaker Chambers's review of Atlas Shrugged in National Review", date: 1957}
    analysis:
      conditions: >
        Rand's family pharmacy in Petrograd was expropriated after the Bolshevik revolution, and she
        emigrated in 1926. Her philosophy found its audience in the postwar US boom and the Cold War,
        answering the New Deal's moral claim on behalf of the poor with a moral claim on behalf of
        the producer.
      class_base: >
        Entrepreneurs, engineers, executives and ambitious students; strong in Silicon Valley and
        finance.
      function: >
        It provides a moral vocabulary in which great wealth is earned by productive genius and
        taxation and regulation are theft from producers. That vocabulary legitimates high returns to
        founders and investors and opposition to unions, and through figures such as Greenspan it
        has shaped financial deregulation.
      disputed: >
        Objectivists insist their defense of capitalism is moral, not interested; Marxists and many
        conservatives (Chambers) read it as an apology for the owners of capital dressed as ethics.
    keyTexts:
      - {author: Ayn Rand, title: Atlas Shrugged, year: 1957}
      - {author: Ayn Rand, title: The Virtue of Selfishness, year: 1964}
      - {author: Ayn Rand, title: "Capitalism: The Unknown Ideal", year: 1966}
      - {author: Leonard Peikoff, title: "Objectivism: The Philosophy of Ayn Rand", year: 1991}

  - id: libertarianism.georgist
    regions: [United States, Britain, Denmark, Taiwan, Australia]
    self: >
      No one made the land, and its value is created by the whole community: the city that grows
      around it, the roads, the schools, the neighbors. Yet landowners pocket that value as rent, and
      so poverty deepens as progress advances. Abolish the taxes on labor and capital, on wages, trade,
      buildings and enterprise, and collect the rent of land for the community through a single tax
      on land values. Speculation ends, idle land comes into use, wages rise, enterprise is freed, and
      government is funded without robbing anyone. The earth is the common heritage of all.
    record:
      - date: 1879
        text: >
          Henry George publishes Progress and Poverty, which sells millions of copies in the
          following decades.
      - date: 1886
        text: >
          George runs for mayor of New York for the United Labor Party with union backing and takes
          about 68,000 votes, second to Abram Hewitt and ahead of Theodore Roosevelt.
      - date: 1894
        text: >
          Single-tax colonies are founded at Fairhope, Alabama (1894) and Arden, Delaware (1900),
          collecting land rent in place of other taxes.
      - date: 1898
        text: >
          The German administration of Kiautschou in China, under Wilhelm Schrameier, taxes land
          value increases; Sun Yat-sen adopts "equalization of land rights" into his Principle of the
          People's Livelihood.
      - date: 1909–1920
        text: >
          Lloyd George's People's Budget introduces land value duties under pressure from Georgist
          Liberals; they yield little and are repealed in 1920.
      - date: 1954
        text: >
          Taiwan's law on equalization of urban land rights introduces a land value tax and a tax on
          land value increments, following the Republic of China constitution.
      - date: 1957–1960
        text: >
          Denmark's Georgist Justice Party joins a coalition government.
    descendsFrom:
      - {id: liberalism.classical, event: "Ricardo's theory of rent and Mill's case for taxing the unearned increment of land", date: 1817}
    breaksWith:
      - {id: marxism.classical, event: "Socialists expelled from the United Labor Party at Syracuse", date: 1887}
    analysis:
      conditions: >
        It arose in the United States of the 1870s, amid railroad land grants, speculation in western
        land, land monopolies in California and rising rents in New York. Rapid growth raised land
        values faster than wages, so the gains of progress appeared to go to landowners rather than
        to labor or industry.
      class_base: >
        Skilled workers and tenants, small farmers, small manufacturers and merchants opposed to
        landlords; George's early campaign against Chinese immigration (1869) shows his appeal to
        white workingmen in California. Today urban economists, housing campaigners and some
        technology professionals.
      function: >
        A land value tax, which economists across the spectrum endorse, would shift income from
        landed capital and from homeowners whose wealth lies mostly in land toward wages and
        productive investment. It targets one fraction of property and leaves the wage relation and
        the ownership of produced capital in place. Where it was applied with land reform under a
        developmental state, as in Taiwan, it helped channel capital from land into industry.
      disputed: >
        Marx (letter to Sorge, 1881) called George's program an attempt to save capitalism by
        removing its landlord fraction; Georgists answer that land rent is the root of involuntary
        poverty and that Marxists conflate land with capital.
    keyTexts:
      - {author: Henry George, title: Progress and Poverty, year: 1879}
      - {author: Henry George, title: Social Problems, year: 1883}
      - {author: Henry George, title: Protection or Free Trade, year: 1886}

  - id: libertarianism.left
    regions: [Britain, United States, Belgium, worldwide (academic)]
    self: >
      Each person fully owns themselves: no one may conscript your body or your labor. But no one
      made the earth. Natural resources belong to everyone in some egalitarian way, so whoever takes
      more than an equal share owes compensation to the rest. Self-ownership plus egalitarian
      ownership of the world justifies strong civil liberties and a ban on forced labor and
      paternalism, and also a substantial basic income or equal endowment funded by taxing land,
      natural resources and inheritance. Libertarians are right about persons and wrong about
      things; egalitarians are right about things and wrong about persons.
    record:
      - date: 1797
        text: >
          Thomas Paine's Agrarian Justice proposes a national fund, paid from a tax on inherited
          property as compensation for the loss of the natural inheritance in land, giving every
          person a capital sum at 21 and a pension at 50.
      - date: 1976–1982
        text: >
          Alaska creates the Permanent Fund from oil revenues (1976) and pays an annual dividend to
          every resident from 1982, a model left-libertarians cite.
      - date: 1986
        text: >
          Philippe Van Parijs and others found the Basic Income European Network, later the Basic
          Income Earth Network.
      - date: 1994–2003
        text: >
          Hillel Steiner's An Essay on Rights, Peter Vallentyne and Steiner's anthologies (2000) and
          Michael Otsuka's Libertarianism without Inequality (2003) set out the position.
      - date: 2017–2018
        text: >
          Finland pays 2,000 unemployed people an unconditional monthly payment for two years, one
          of several basic income trials cited in the debate.
    descendsFrom:
      - {id: libertarianism.georgist, event: "Steiner revives the claim on land rent within a theory of rights", date: 1994}
      - {id: liberalism.classical, event: "Locke's proviso that enough and as good be left for others", date: 1689}
    breaksWith:
      - {id: libertarianism.minarchist, event: "Rejection of Nozick's weak reading of the Lockean proviso", date: 1994}
    analysis:
      conditions: >
        It took form in Anglo-American and Belgian academic philosophy in the 1980s and 1990s, after
        the Rawls–Nozick debate and as socialist planning lost credibility. An egalitarianism that
        accepts self-ownership answers Nozick on his own ground.
      class_base: >
        Academics and basic income advocates in policy circles and the technology sector.
      function: >
        It supplies a philosophical case for basic income and for taxing land, resources and
        inheritance. Such a program would move rent from landed capital and resource owners to
        everyone, but it leaves the wage relation and the ownership of produced capital in place. A
        basic income funded nationally from core resource rents divides that rent among citizens of
        rich countries; Steiner's global fund would instead require large transfers from the
        resource-owning core.
      disputed: >
        G. A. Cohen (Self-Ownership, Freedom, and Equality, 1995) argues that self-ownership itself
        licenses exploitation and must be rejected; right-libertarians argue that equal-share claims
        on resources are confiscation.
    keyTexts:
      - {author: Thomas Paine, title: Agrarian Justice, year: 1797}
      - {author: Hillel Steiner, title: An Essay on Rights, year: 1994}
      - {author: Philippe Van Parijs, title: "Real Freedom for All: What (If Anything) Can Justify Capitalism?", year: 1995}
      - {author: Peter Vallentyne and Hillel Steiner (eds.), title: "Left-Libertarianism and Its Critics: The Contemporary Debate", year: 2000}
      - {author: Michael Otsuka, title: Libertarianism without Inequality, year: 2003}

  - id: libertarianism.paleo
    regions: [United States, Argentina, Germany, worldwide (online)]
    self: >
      Liberty does not survive in a vacuum. It depends on strong families, churches, private
      property, local communities and a culture of self-reliance, the very institutions the
      managerial state and its allies in media and academia are dismantling. Libertarians who sneer at
      tradition and cheer every cultural revolution hand the state its best weapon. We are against the
      Fed, the welfare state and the empire alike, and we are culturally conservative. Decentralize,
      secede if need be, let communities associate and exclude as they choose, restore sound money,
      and go over the heads of the elites to the people.
    record:
      - date: 1982
        text: >
          Lew Rockwell founds the Ludwig von Mises Institute, with Rothbard as its leading scholar.
      - date: 1989–1992
        disputed: true
        text: >
          Rothbard leaves the Libertarian Party, allies with paleoconservatives in the John Randolph
          Club, and in "Right-Wing Populism" (1992) proposes a strategy of outreach to the populist
          right, including favorable comments on David Duke's campaign; he backs Pat Buchanan in the
          1992 primaries. Critics read this as accommodation with white nationalism; defenders as a
          tactical bid for a mass base against the state.
      - date: 1988–1994
        disputed: true
        text: >
          Newsletters published under Ron Paul's name carry racist and homophobic passages; reported
          in 2008, they are disowned by Paul, who says he did not write them. Reporters attributed
          them to Rockwell's circle; Rockwell denied it.
      - date: 2008–2012
        text: >
          Ron Paul's Republican primary campaigns win about 2 million votes in 2012 and make the Mises
          Institute's ideas widely known among young voters.
      - date: 2023–2025
        disputed: true
        text: >
          Javier Milei, who calls himself an anarcho-capitalist and cites Rothbard and Hoppe, is
          elected president of Argentina in alliance with the conservative right. His government
          devalues the peso by about 54 percent, cuts public spending, transfers and pensions deeply,
          reaches a fiscal surplus, and takes a 20-billion-dollar IMF program (2025) and a US
          Treasury swap line. Monthly inflation falls from 25.5 percent (December 2023) to low single
          digits; measured poverty rises to about 53 percent in early 2024 and then falls below its
          2023 level. Supporters credit the end of high inflation; critics point to falling real
          wages and pensions and to new foreign debt.
    descendsFrom:
      - {id: libertarianism.ancap, event: "Rothbard and Rockwell's paleo turn", date: 1989}
      - {id: conservatism.paleo, event: "Alliance with paleoconservatives in the John Randolph Club", date: 1989}
    breaksWith:
      - {id: libertarianism.minarchist, event: "Rothbard leaves the Libertarian Party, attacking 'Beltway' libertarians", date: 1989}
    analysis:
      conditions: >
        The end of the Cold War removed the anti-communism that had held the American right together,
        and the Libertarian Party had stalled electorally. Rothbard sought a mass base among white
        working- and middle-class voters angry at the federal government, which required cultural
        conservatism. Argentina's chronic inflation and fiscal crises later gave the program a
        national electorate.
      class_base: >
        Small business owners, rural and exurban middle classes, gold and cryptocurrency investors,
        and young men organized online; in Argentina also informal workers and others exhausted by
        inflation.
      function: >
        It joins anti-state economics to cultural conservatism and nationalism, turning the anger of
        small owners at monopoly, finance and taxation against the state, migrants and minorities,
        while its fiscal program favors owners and creditors. In Argentina, spending cuts and
        devaluation lowered real wages and pensions to produce the surplus that services foreign
        debt, and a large-investment incentive scheme (RIGI) guarantees foreign investors in mining
        and energy stable taxes for decades, so creditors and resource investors gain while wage
        earners and pensioners pay.
      disputed: >
        Supporters argue disinflation protects the poor more than any transfer; critics point to
        Hoppe's call (Democracy: The God That Failed) for advocates of alternative lifestyles to be
        "physically removed" from covenant communities as evidence of the current's direction.
    keyTexts:
      - {author: Llewellyn H. Rockwell Jr., title: The Case for Paleo-Libertarianism, year: 1990}
      - {author: Murray N. Rothbard, title: "Right-Wing Populism: A Strategy for the Paleo Movement", year: 1992}
      - {author: Hans-Hermann Hoppe, title: "Democracy: The God That Failed", year: 2001}
