traditions:
  - id: religious.liberation-theology
    regions: [Latin America, Brazil, Central America, Philippines, South Africa]
    self: >-
      We read the Gospel from the underside of history. God took sides in the Exodus, in the
      prophets, and in a Jesus who announced good news to the poor and was executed by an empire.
      A faith that blesses hunger and the order that produces it is idolatry. So we begin with the
      poor themselves, gathered in base communities to read scripture against their own lives, and
      we use the best social science we have, Marxism included, to understand why they are poor.
      The preferential option for the poor is not charity. It is solidarity with the poor as they
      become the subjects of their own liberation, here as well as hereafter.
    record:
      - date: 1968
        text: >-
          The Second General Conference of Latin American Bishops at Medellín, Colombia, names
          “institutionalized violence” and commits the church to the poor and to base communities.
      - date: 1979
        text: >-
          Base communities and clergy take part in the Sandinista revolution in Nicaragua; the priests
          Ernesto Cardenal, Fernando Cardenal and Miguel d'Escoto serve in the revolutionary government.
      - date: 1980
        text: >-
          Archbishop Óscar Romero of San Salvador is shot dead while saying Mass on 24 March, a day after
          calling on soldiers to stop killing; the UN Truth Commission (1993) named Major Roberto
          D'Aubuisson as having ordered the killing. He was canonized in 2018.
      - date: 1984
        text: >-
          The Vatican's Congregation for the Doctrine of the Faith under Cardinal Ratzinger issues
          Libertatis nuntius against uncritical borrowing from Marxism; Leonardo Boff is ordered to
          silence in 1985, and John Paul II appoints conservative bishops across Latin America.
      - date: 1989
        text: >-
          Soldiers of the Salvadoran army's Atlacatl Battalion murder six Jesuits, among them the
          theologian Ignacio Ellacuría, with their housekeeper and her daughter at the Central
          American University on 16 November.
      - date: 2013
        disputed: true
        text: >-
          After Pope Francis's election, Gustavo Gutiérrez is received at the Vatican. Supporters read
          the Francis years as a vindication; others note that Francis came from Argentina's
          “theology of the people,” which shared the option for the poor but rejected Marxist class analysis.
    descendsFrom:
      - {id: conservatism.cst, event: "Second Vatican Council opens the church to the modern world and the poor", date: "1962-1965"}
      - {id: marxism.dependency, event: "Medellín-era theologians adopt dependency theory as their social analysis", date: 1968}
    breaksWith:
      - {id: conservatism.christian-democracy, event: "Christians for Socialism meeting in Santiago de Chile breaks with Christian Democratic reformism", date: 1972}
    analysis:
      conditions: >-
        Latin America in the 1960s combined export agriculture, extreme land concentration and
        growing urban slums with the Cuban revolution, the failure of the Alliance for Progress and
        the opening of Vatican II. Priests and nuns sent to live among peasants met poverty that
        dependency theory explained as structural, and the parish was often the only institution in
        a village that the army and the landlord could not simply close.
      class_base: >-
        Peasants, landless laborers and the urban poor, organized through base communities, with
        radicalized clergy, religious orders and lay professionals as cadre. The mechanism is the
        church's legitimacy: a meeting called to read the Bible was harder to ban than a union
        meeting, so the base community became the place where people learned to read, keep minutes
        and plan land occupations.
      function: >-
        Today it lives on in land movements (Brazil's Landless Workers' Movement grew from the
        church's Pastoral Land Commission, founded 1975), in indigenous and ecological struggles,
        and in Francis-era Vatican language. It gives religious authority to struggles against land
        concentration and extraction where secular left organization is weak, and it competes with
        Pentecostal prosperity preaching for the same poor, which teaches individual rise instead of
        collective action.
      disputed: >-
        Michael Löwy (The War of Gods, 1996) treats it as a genuine social movement allied with
        socialism. Other materialists read it as a clerical effort to keep the poor inside the church
        against secular Marxism, and point to how quickly Rome contained it after 1984.
    keyTexts:
      - {author: Gustavo Gutiérrez, title: "A Theology of Liberation (Teología de la liberación)", year: 1971}
      - {author: Leonardo Boff and Clodovis Boff, title: Introducing Liberation Theology, year: 1987}
      - {author: Ernesto Cardenal, title: "The Gospel in Solentiname (El Evangelio en Solentiname)", year: 1975}
      - {author: Jon Sobrino, title: "Jesus the Liberator (Jesucristo liberador)", year: 1991}

  - id: religious.christian-socialism
    regions: [Britain, Germany, Switzerland, United States, Scandinavia]
    self: >-
      The kingdom of God is not only where souls go after death. It is a way of ordering life
      together that Jesus taught us to pray for on earth. An economy that treats workers as hands
      and land as a commodity sins against the God who made every person in his image and gave the
      earth to all. We take the Hebrew prophets and the Sermon on the Mount as social teaching.
      Competition for private gain cannot be the law of a Christian society; cooperation and common
      ownership can. The church's task is to name the sin built into institutions and to stand with
      labor in redeeming them.
    record:
      - date: 1848
        text: >-
          After the Chartist petition of April 1848, F. D. Maurice, Charles Kingsley and J. M. Ludlow
          launch Christian Socialism in London; they back producer cooperatives and found the
          Working Men's College in 1854.
      - date: 1907
        text: >-
          Walter Rauschenbusch, a Baptist pastor in New York's Hell's Kitchen, publishes Christianity
          and the Social Crisis, the founding text of the American Social Gospel.
      - date: 1908
        text: >-
          The new Federal Council of Churches in the United States adopts the Social Creed of the
          Churches, calling for the abolition of child labor, shorter hours and a living wage.
      - date: "1906-1935"
        text: >-
          British Labour draws much of its early leadership from Nonconformist chapels and Christian
          socialists, among them Keir Hardie and George Lansbury, who led the party from 1932 to 1935.
      - date: "1885-1920"
        disputed: true
        text: >-
          Leading Social Gospel figures backed Prohibition, eugenic measures and, in Josiah Strong's
          Our Country (1885), Anglo-Saxon expansion. Defenders treat these as the era's commonplaces;
          critics read them as the program of a Protestant middle class reforming workers from above.
      - date: 1955
        text: >-
          Martin Luther King Jr., who credited Rauschenbusch with shaping his theology, leads the
          Montgomery bus boycott, carrying the Social Gospel into the civil rights movement.
    descendsFrom: []
    breaksWith:
      - {id: liberalism.classical, event: "Maurice and Ludlow reject laissez-faire political economy as unchristian", date: 1848}
    analysis:
      conditions: >-
        Industrial capitalism in Britain, Germany and the United States filled cities with workers
        whom the churches were losing. Clergy working in slums saw poverty produced by wages and
        rents, not by vice, and a church that wanted to keep the working class had to speak to its
        conditions.
      class_base: >-
        Reforming clergy and Protestant middle-class professionals, with a following among skilled
        workers raised in chapel culture. The mechanism is the chapel as a training ground: lay
        preaching, Sunday schools and temperance societies gave workers speaking and organizing
        skills they took into unions and labor parties.
      function: >-
        Today it supplies moral language to the defense of the welfare state, to church-based
        organizing such as the Poor People's Campaign (relaunched 2018) and to the Christian left in
        labor parties. It mostly argues for redistribution inside the core country and rarely
        addresses the transfer of value from the periphery, so it softens the order's harshest edges
        at home more than it changes the order.
      disputed: >-
        Marx and Engels dismissed Christian socialism in the Communist Manifesto (1848) as holy water
        on the aristocrat's grievances. Ernst Bloch (Atheism in Christianity, 1968) and later
        Christian Marxists argued the biblical tradition carries a real revolutionary charge.
    keyTexts:
      - {author: F. D. Maurice, title: The Kingdom of Christ, year: 1838}
      - {author: Walter Rauschenbusch, title: Christianity and the Social Crisis, year: 1907}
      - {author: Walter Rauschenbusch, title: A Theology for the Social Gospel, year: 1917}
      - {author: R. H. Tawney, title: Religion and the Rise of Capitalism, year: 1926}

  - id: religious.islamism-brotherhood
    regions: [Egypt, Arab world, Palestine, Turkey, Europe]
    self: >-
      Islam is a complete order: faith and worship, homeland and nationality, religion and state.
      Our countries were occupied because Muslims abandoned the comprehensive practice of their
      faith, and they will be free when they return to it. We work by stages: reform the individual,
      then the family, then society, then the government. We build schools, clinics, charities and
      professional associations, we contest elections wherever we are allowed to, and we call for
      government according to the sharia through the will of the people. The Qur'an is our
      constitution. Islam is the solution.
    record:
      - date: 1928
        text: >-
          Hassan al-Banna, a schoolteacher, founds the Society of the Muslim Brothers in Ismailia,
          Egypt, home of the British-run Suez Canal Company; by the late 1940s it claims hundreds of
          thousands of members.
      - date: 1949
        text: >-
          After Brotherhood volunteers fight in Palestine in 1948, Prime Minister Nuqrashi dissolves the
          society and is assassinated by a member in December 1948; Banna is shot dead in Cairo in
          February 1949, widely attributed to state security agents.
      - date: 1954
        disputed: true
        text: >-
          After shots are fired at Nasser in Alexandria in October, the government bans the Brotherhood
          and imprisons thousands; Sayyid Qutb writes Milestones in prison and is hanged in 1966. The
          government held the Brotherhood responsible; the Brotherhood holds the attempt was staged.
      - date: 1982
        text: >-
          The Syrian army crushes a Brotherhood-led uprising in Hama, killing between about 10,000 and
          40,000 people by differing estimates.
      - date: 1987
        text: >-
          The Brotherhood's Palestinian branch founds Hamas at the start of the first intifada; Hamas
          wins the 2006 Palestinian legislative elections and governs Gaza from 2007.
      - date: 2012
        text: >-
          The Brotherhood's “Freedom and Justice Party” wins the most seats in Egypt's 2011–12
          parliamentary elections, and Mohamed Morsi is elected president in June 2012.
      - date: 2013
        disputed: true
        text: >-
          The army under Abdel Fattah el-Sisi removes Morsi on 3 July after mass protests; on 14 August
          security forces clear the Rabaa sit-in, killing at least 817 people by Human Rights Watch's
          count. Supporters of the army call it a second revolution; the Brotherhood calls it a coup.
    descendsFrom: []
    breaksWith:
      - {id: nationalism.nasserism, event: "Ban after the Manshiyya shooting and the mass arrests", date: 1954}
    analysis:
      conditions: >-
        It formed in British-occupied Egypt among the first generation of schooled urban men, who
        faced a foreign-owned canal, a landlord parliament and a secular elite that copied Europe.
        Colonial capitalism created teachers, clerks and students with no place in the order run by
        pashas and foreign firms, and no voice in the secular nationalism of the notables; the
        Brotherhood gave them both an organization and a language.
      class_base: >-
        The pious urban middle strata: teachers, engineers, doctors, lawyers, merchants and owners of
        small and medium firms, organized through the professional syndicates the Brotherhood led in
        Egypt by the 1990s. It reaches the poor through charity and clinic networks that filled the
        gap left as structural adjustment cut public services, which builds loyalty among the poor
        while leadership stays with business and professional members.
      function: >-
        Where it has governed (Egypt 2012–13, Tunisia, Morocco) it kept IMF programs, existing
        treaties and market policy, offering moral reform without touching property or the country's
        place in the world market. Gulf monarchies and Egypt's army still treat it as a threat because
        its electoral route competes with their own claim to rule, while Turkey and Qatar sponsor it.
        In Palestine the same current leads armed resistance to occupation, so its function differs
        sharply by place.
      disputed: >-
        Chris Harman (The Prophet and the Proletariat, 1994) treats Islamism as a petty-bourgeois
        movement the left may sometimes ally with against the state and imperialism. Samir Amin
        (Political Islam in the Service of Imperialism, 2007) reads it as compatible with comprador
        capitalism and useful to imperialism.
    keyTexts:
      - {author: Sayyid Qutb, title: "Social Justice in Islam (al-'Adala al-ijtima'iyya fi al-Islam)", year: 1949}
      - {author: Sayyid Qutb, title: "Milestones (Ma'alim fi al-Tariq)", year: 1964}
      - {author: Richard P. Mitchell, title: The Society of the Muslim Brothers, year: 1969}
      - {author: Carrie Rosefsky Wickham, title: "The Muslim Brotherhood: Evolution of an Islamist Movement", year: 2013}

  - id: religious.islamism-khomeinist
    regions: [Iran, Iraq, Lebanon, Bahrain, Yemen]
    self: >-
      While the Hidden Imam is absent, guardianship of the community belongs to the just and learned
      jurist. God's law did not lapse when the Prophet died; someone must apply it, and only one who
      knows it and is just may do so. We overthrew a Shah who sold our oil and our dignity to America
      and Israel. We stand with the oppressed of the earth, the mostazafin, against the arrogant
      powers. Neither East nor West, but the Islamic Republic. From Tehran to Beirut to Sana'a, the
      resistance has shown that faith can defeat empires.
    record:
      - date: 1963
        text: >-
          Ruhollah Khomeini leads clerical opposition to the Shah's White Revolution; after the June
          1963 uprising he is arrested, and in 1964, after denouncing immunity for US military
          personnel, he is exiled.
      - date: 1970
        text: >-
          In Najaf, Khomeini lectures on Islamic Government, setting out the doctrine of velayat-e faqih,
          guardianship of the jurist.
      - date: 1979
        text: >-
          Mass demonstrations and strikes, decisive among them the oil workers' strike, bring down the
          Shah; a referendum establishes the Islamic Republic and the December constitution makes the
          jurist's guardianship supreme. Students seize the US embassy in November.
      - date: "1980-1988"
        text: >-
          Iraq invades Iran in September 1980; the war kills hundreds of thousands on both sides, and
          Iraq uses chemical weapons against Iranian troops and Kurdish civilians while Western states
          continue to support Baghdad.
      - date: 1988
        disputed: true
        text: >-
          After suppressing the Mojahedin, the Fadaiyan, the Tudeh party and Kurdish parties through the
          1980s, the Islamic Republic executes thousands of political prisoners in the summer of 1988.
          Estimates range from about 2,800 to more than 5,000; some opposition groups give far higher figures.
      - date: 1982
        text: >-
          After Israel invades Lebanon, Hezbollah forms with Revolutionary Guards support; Israel
          withdraws from southern Lebanon in 2000.
      - date: 2022
        disputed: true
        text: >-
          Mahsa (Jina) Amini dies in morality-police custody in September, setting off the “Woman, Life,
          Freedom” protests; rights groups count more than 500 protesters killed and several executed.
          Her family and witnesses say she was beaten; the authorities attribute her death to illness.
    descendsFrom:
      - {id: religious.islamic-socialism, event: "Revolutionary vocabulary of the mostazafin taken partly from Shariati's lectures", date: "1969-1977"}
    breaksWith:
      - {id: religious.islamic-socialism, event: "Open war with the People's Mojahedin after President Banisadr's impeachment", date: 1981}
      - {id: marxism.ml, event: "Arrest of the Tudeh party leadership and ban of the party", date: 1983}
    analysis:
      conditions: >-
        The 1953 coup against Mosaddegh, organized by the CIA and MI6, discredited the secular
        nationalist route. The Shah's oil-funded modernization and 1963 land reform pushed rural
        migrants into south Tehran and squeezed bazaar merchants, while the clergy kept an independent
        network of mosques, seminaries and religious taxes that the Shah could not dissolve.
      class_base: >-
        The revolution joined bazaar merchants (who funded the clergy through religious taxes), the
        clergy, students and the urban poor. The system that followed rests on clergy and on a stratum
        whose income depends on it: the bonyads (foundations that took over Pahlavi assets) and the
        Revolutionary Guards' business holdings, both fed by oil rent, with subsidies sustaining poorer
        supporters.
      function: >-
        Iran is the main state in the region that keeps its oil under national control and arms
        forces opposed to US and Israeli power, and it has been under sanctions since 1979, tightened
        to near-total from 2018, and under direct Israeli and US strikes in 2025. In the frame's terms,
        sovereign control of a strategic resource raises supply prices and draws sanctions and war. At
        home the same state privatized large parts of the economy after 2006, jails independent union
        leaders such as those of the Tehran bus workers and Haft Tappeh sugar workers, and polices women's dress.
      disputed: >-
        Ervand Abrahamian (Khomeinism, 1993) reads it as a populism of the propertied middle class
        comparable to Latin American populism. Anti-imperialist currents treat Iran first as a besieged
        sovereign state; the Iranian left in exile and many Iranian workers describe a capitalist
        clerical and military state.
    keyTexts:
      - {author: Ruhollah Khomeini, title: "Islamic Government (Hokumat-e Eslami)", year: 1970}
      - {author: Ervand Abrahamian, title: Iran Between Two Revolutions, year: 1982}
      - {author: Ervand Abrahamian, title: "Khomeinism: Essays on the Islamic Republic", year: 1993}

  - id: religious.salafism-quietist
    regions: [Saudi Arabia, Gulf, Jordan, Egypt, Yemen, Europe]
    self: >-
      We follow the Qur'an and the Sunna as the first three generations, the salaf, understood them,
      and nothing added after them. The cure for the umma is not parties, elections or revolutions;
      those are innovations that split the Muslims. The cure is purification of belief from shirk and
      innovation, and education of the people in correct creed. We obey the Muslim ruler in what is
      right, even if he is unjust, and advise him privately, because rebellion brings bloodshed and
      strife worse than any tyranny. When the people return to tawhid, God will change their condition.
    record:
      - date: 1744
        text: >-
          Muhammad ibn Abd al-Wahhab and Muhammad ibn Saud make their pact in Diriyah, the alliance of
          scholars and dynasty on which later Saudi states rest.
      - date: "1961-1999"
        text: >-
          Muhammad Nasir al-Din al-Albani teaches hadith at the Islamic University of Medina and later in
          Damascus and Amman; his program of purification and education becomes the core of the quietist current.
      - date: 1990
        text: >-
          Senior Saudi scholars led by Abd al-Aziz ibn Baz approve the stationing of US troops after
          Iraq's invasion of Kuwait. Sahwa preachers oppose it, and a loyalist current around Rabi
          al-Madkhali forms in defense of the rulers.
      - date: "1970s-2010s"
        disputed: true
        text: >-
          Saudi state and private money funds mosques, scholarships and publishing worldwide. The scale is
          disputed: frequently quoted figures of 75 to 100 billion dollars rest on no published accounting.
      - date: 2011
        text: >-
          During the Arab uprisings quietist scholars condemn protest as strife, while Egypt's Salafi Call
          forms the al-Nour party, which wins about a quarter of the seats in the 2011–12 elections and
          backs the army's removal of Morsi in 2013.
      - date: "2014-2020"
        text: >-
          In Libya, Madkhali-aligned armed units fight on both sides, inside Khalifa Haftar's forces and
          in Tripoli's Special Deterrence Force, each obeying the authority that holds their ground.
    descendsFrom: []
    breaksWith:
      - {id: religious.islamism-brotherhood, event: "Albani's and Madkhali's condemnation of party organization (hizbiyya) and of Qutb", date: "1990s"}
      - {id: religious.salafi-jihadism, event: "Senior scholars' condemnation of excommunication of rulers and of rebellion", date: 1990}
    analysis:
      conditions: >-
        It grew where states wanted religious legitimacy without mobilized politics. Saudi oil revenue
        after 1973 funded universities, missionary bodies and publishing; the defeat of Arab nationalism
        in 1967 left a demand for certainty; and millions of Egyptian, Yemeni and South Asian workers in
        the Gulf brought Salafi practice home.
      class_base: >-
        Scholars paid by state salaries and endowments, backed by the Gulf rentier states, at the top.
        Followers include young urban men of the lower middle and working classes, migrants and converts
        in Europe; strict practice gives them order and a status that does not depend on income or
        on success in the market.
      function: >-
        It legitimates hereditary and military rulers allied with the United States (Saudi Arabia,
        the Emirates, Egypt) by treating strikes and protest as sin. That protects the Gulf arrangement
        in which oil is priced in dollars and surpluses are recycled into US Treasury bonds and arms
        purchases, because the doctrine of obedience rules out the political challenge that could
        change it.
      disputed: >-
        Stéphane Lacroix and Quintan Wiktorowicz stress that quietism is a strategy rather than a fixed
        doctrine, since quietists politicize under pressure (al-Nour, the Libyan units). Reading it only
        as state ideology misses its appeal among the poor as a refusal of consumer modernity.
    keyTexts:
      - {author: Muhammad ibn Abd al-Wahhab, title: Kitab al-Tawhid, year: "c. 1740"}
      - {author: Quintan Wiktorowicz, title: "Anatomy of the Salafi Movement", year: 2006}
      - {author: Roel Meijer (ed.), title: "Global Salafism: Islam's New Religious Movement", year: 2009}
      - {author: Stéphane Lacroix, title: "Awakening Islam: The Politics of Religious Dissent in Contemporary Saudi Arabia", year: 2011}

  - id: religious.salafi-jihadism
    regions: [Afghanistan, Iraq, Syria, Sahel, Somalia, Yemen]
    self: >-
      The lands of Islam are occupied by crusaders and Zionists and ruled by apostates who govern by
      man-made law. Jihad against them is an individual duty on every capable Muslim, as it was when
      the Soviets invaded Afghanistan. Parliaments set the law of men above the law of God, and a
      century of preaching has not removed a single tyrant. We fight the near enemy that betrays the
      religion and the far enemy that keeps it in power, to restore the caliphate and rule by what God
      revealed. The Brotherhood bargained and the palace scholars sold the religion; we gave our lives.
    record:
      - date: "1979-1989"
        disputed: true
        text: >-
          Arab volunteers join the Afghan mujahidin against the Soviet intervention, recruited from 1984
          by Abdullah Azzam's Services Bureau, while Saudi Arabia, Pakistan and the United States fund
          Afghan factions. Whether US money reached the Arab volunteers directly is disputed.
      - date: 1988
        text: >-
          Al-Qaeda is founded in Peshawar around Osama bin Laden and Egyptian militants of Ayman
          al-Zawahiri's circle.
      - date: 1998
        text: >-
          Bin Laden and Zawahiri's World Islamic Front calls for killing Americans and their allies; in
          August the bombings of the US embassies in Nairobi and Dar es Salaam kill 224 people, most of
          them Kenyans and Tanzanians.
      - date: 2001
        text: >-
          The 11 September attacks kill nearly 3,000 people in the United States. The US invades
          Afghanistan in October and Iraq in 2003; the wars that followed killed several hundred thousand
          people directly.
      - date: 2014
        text: >-
          The Islamic State takes Mosul and declares a caliphate; in August it kills and enslaves Yazidis
          at Sinjar, which a UN Commission of Inquiry found in 2016 to be genocide. It loses its last
          territory at Baghuz in March 2019.
      - date: "2012-2025"
        text: >-
          Al-Qaeda and Islamic State affiliates spread across Mali, Burkina Faso and Niger after the
          2011 war in Libya; by the 2020s the central Sahel accounts for the largest share of deaths
          from such attacks worldwide.
      - date: 2024
        text: >-
          Hayat Tahrir al-Sham, which had cut its ties to al-Qaeda in 2016–17, leads the offensive that
          ends the Assad government in Damascus in December; its leader Ahmed al-Sharaa becomes transitional president.
    descendsFrom:
      - {id: religious.islamism-brotherhood, event: "Qutb's Milestones and its doctrine of modern ignorance (jahiliyya)", date: 1964}
      - {id: religious.salafism-quietist, event: "Wahhabi creed fused with Qutbist activism in the Saudi Sahwa and the Afghan camps", date: "1980s"}
    breaksWith:
      - {id: religious.islamism-brotherhood, event: "Zawahiri's The Bitter Harvest condemns the Brotherhood's electoral politics", date: 1991}
      - {id: religious.salafism-quietist, event: "Bin Laden denounces the Saudi scholars' approval of US troops", date: 1996}
    analysis:
      conditions: >-
        It grew from the defeat of Arab nationalism in 1967 and the crushing of Brotherhood gradualism,
        took form in the Afghan war funded by Gulf money and Western states, and spread fastest where
        states collapsed under invasion or civil war: Iraq after the US occupation dissolved the army in
        2003, Syria and Libya after 2011, the Sahel after Libya's arsenals scattered. Collapse leaves
        armed young men without wages and villages without protection; the movement offers pay, courts
        and revenge.
      class_base: >-
        Leaders come largely from the educated middle class (engineers, doctors, the heirs of business
        fortunes); fighters from the rural and urban unemployed, the displaced and, in the Sahel, herding
        communities in conflict with farmers and states. Money comes from private Gulf donors, taxes on
        smuggling routes, kidnapping and, for the Islamic State, oil sales.
      function: >-
        Its attacks supplied the justification for the US-led wars of 2001–2021, for mass surveillance,
        for US and French military basing across Africa and for anti-Muslim politics in Europe and
        India. Most of its victims are Muslims. By attacking civilians and fighting rival resistance
        forces, it splits opposition to foreign domination and invites the intervention that keeps the
        region's resources under outside control.
      disputed: >-
        Mahmood Mamdani (Good Muslim, Bad Muslim, 2004) treats it chiefly as a product of Cold War and
        imperial policy. Others, such as Shiraz Maher (2016), insist it is an autonomous religious-political
        project whose doctrine must be taken on its own terms.
    keyTexts:
      - {author: Sayyid Qutb, title: Milestones, year: 1964}
      - {author: Muhammad abd al-Salam Faraj, title: "The Neglected Duty (al-Farida al-gha'iba)", year: 1981}
      - {author: Abu Bakr Naji, title: "The Management of Savagery (Idarat al-Tawahhush)", year: 2004}
      - {author: Shiraz Maher, title: "Salafi-Jihadism: The History of an Idea", year: 2016}
      - {author: Mahmood Mamdani, title: "Good Muslim, Bad Muslim", year: 2004}

  - id: religious.post-islamism
    regions: [Turkey, Tunisia, Morocco, Indonesia, Iran]
    self: >-
      We are Muslims and democrats, and we see no contradiction. Islam gives us our values: justice,
      consultation, dignity and care for the poor. It does not hand us a ready-made state. The ballot,
      the constitution and the market are the frame in which a pious majority can finally live its
      faith openly after decades of secular bans. We left the slogan of the Islamic state behind
      because we learned, in prison and in office, that faith imposed by law breeds hypocrisy. We are
      to the Muslim world what Christian democrats were to Europe.
    record:
      - date: 1997
        text: >-
          A year after Asef Bayat names “post-Islamism” to describe Iran's reformist turn, Mohammad
          Khatami wins Iran's presidency with about 69 percent on a reform platform.
      - date: 2002
        text: >-
          Recep Tayyip Erdoğan and Abdullah Gül, having left Necmettin Erbakan's National Outlook
          movement to found the AKP in 2001, win Turkey's November election with 34 percent of the vote
          and nearly two-thirds of the seats.
      - date: 2011
        text: >-
          Ennahda wins 37 percent and 89 of 217 seats in Tunisia's constituent assembly election and
          governs in coalition; the 2014 constitution passes by broad consensus. Morocco's PJD leads the
          government from 2011.
      - date: 2016
        text: >-
          Ennahda's tenth congress separates religious outreach from party politics and adopts the label
          “Muslim democrats.”
      - date: 2016
        disputed: true
        text: >-
          After the failed coup attempt of 15 July in Turkey, more than 100,000 public employees are
          dismissed by decree and a 2017 referendum creates an executive presidency. The government
          blames the Gülen movement, which denies involvement; critics see a purge reaching far beyond the plotters.
      - date: 2021
        text: >-
          Morocco's PJD falls from 125 seats to 13. In Tunisia President Kais Saied suspends parliament
          in July; Ennahda's leader Rached Ghannouchi is imprisoned from 2023.
    descendsFrom:
      - {id: religious.islamism-brotherhood, event: "Ennahda founded as the Islamic Tendency Movement; Turkey's National Outlook as a parallel current", date: 1981}
    breaksWith:
      - {id: religious.islamism-brotherhood, event: "Ennahda's tenth congress separates preaching from politics", date: 2016}
      - {id: nationalism.kemalism, event: "AKP ends the military's tutelage through the 2010 constitutional referendum", date: 2010}
    analysis:
      conditions: >-
        It arose where Islamist parties entered elections and met either closure (Turkey's Welfare Party
        was forced from office in 1997 and banned in 1998) or office. In Turkey export-led liberalization
        after 1980 enriched provincial manufacturers who resented both Istanbul's secular big capital and
        the army's tutelage; they needed a party that was pious, pro-market and acceptable to Europe.
      class_base: >-
        The pious provincial industrial and commercial bourgeoisie (organized in Turkey's MÜSİAD),
        construction capital and the religious middle classes, with the urban poor reached through
        municipal services, housing programs and consumer credit.
      function: >-
        It governs the semi-periphery inside IMF and European frameworks: privatization,
        construction-led growth on foreign borrowing and flexible labor law, as the 2014 Soma mine
        disaster that killed 301 miners exposed. It integrates pious majorities into the market order
        while renegotiating the national elite's share of it, which leaves the outflow of value to
        core creditors and firms intact.
      disputed: >-
        Cihan Tuğal (Passive Revolution, 2009) reads the AKP as a Gramscian passive revolution that
        absorbed Islamist radicalism into neoliberal hegemony. Bayat sees post-Islamism as a genuine
        democratization driven by social movements from below.
    keyTexts:
      - {author: Rached Ghannouchi, title: "Public Freedoms in the Islamic State (al-Hurriyat al-'amma fi al-dawla al-islamiyya)", year: 1993}
      - {author: Asef Bayat, title: "Making Islam Democratic: Social Movements and the Post-Islamist Turn", year: 2007}
      - {author: Cihan Tuğal, title: "Passive Revolution: Absorbing the Islamic Challenge to Capitalism", year: 2009}
      - {author: Asef Bayat (ed.), title: "Post-Islamism: The Changing Faces of Political Islam", year: 2013}

  - id: religious.islamic-socialism
    regions: [Pakistan, Iran, Indonesia, Libya, Syria, Algeria]
    self: >-
      The Prophet's companion Abu Dharr confronted the governor of Damascus for hoarding gold while the
      poor went hungry. The earth belongs to God, and wealth is a trust held for the community. Zakat,
      the ban on usury and the Qur'an's warning to those who hoard gold and silver point to an order
      without exploitation. Islam came to free the oppressed from the arrogant, not to bless landlords
      and kings. We need no atheist doctrine to nationalize the banks and give land to those who till
      it; our own faith demands it.
    record:
      - date: "1912-1924"
        text: >-
          Sarekat Islam becomes the first mass movement in the Dutch East Indies; its leader
          Tjokroaminoto writes Islam and Socialism (1924), and its left wing passes into the Indonesian
          Communist Party.
      - date: 1959
        text: >-
          Mustafa al-Siba'i, head of the Syrian Muslim Brotherhood, publishes The Socialism of Islam.
      - date: 1965
        text: >-
          The People's Mojahedin is founded in Iran, joining Shia Islam with Marxist social analysis; Ali
          Shariati's lectures in Tehran (1969–1972) carry a similar message to a generation of students.
      - date: "1967-1977"
        text: >-
          Zulfikar Ali Bhutto founds the Pakistan Peoples Party under the slogan “Islam is our faith,
          democracy is our politics, socialism is our economy”; in power he nationalizes heavy industry,
          banks and insurance and decrees land reform, before General Zia's coup in 1977 and his hanging in 1979.
      - date: 1977
        text: >-
          Muammar Gaddafi, having set out his Third Universal Theory in the Green Book (1975–79), proclaims
          the Jamahiriya; oil revenue funds housing, health and education until the NATO-backed war of 2011.
      - date: 1986
        disputed: true
        text: >-
          After open war with the Islamic Republic from 1981, the Mojahedin relocate to Iraq and fight
          alongside Saddam Hussein's army. Critics say the organization became a closed sect aligned with
          Iran's enemies; its supporters call it resistance by any available means.
    descendsFrom:
      - {id: religious.islamism-brotherhood, event: "Siba'i's Socialism of Islam within the Syrian Brotherhood", date: 1959}
    breaksWith:
      - {id: religious.islamism-khomeinist, event: "Khomeini brands the Mojahedin hypocrites and armed conflict begins", date: 1981}
    analysis:
      conditions: >-
        It arose in colonized and newly independent Muslim societies where the language of mass
        mobilization was religious while the program they needed was land reform and nationalization.
        Peasants who would not follow an atheist party could be brought to nationalization under an
        Islamic banner, and nationalist rulers used the same banner to head off both communists and Islamists.
      class_base: >-
        A radical intelligentsia of students and teachers, and state-building military and party
        leaders, with mass support among peasants and urban workers. Nationalization created a public
        sector of salaried staff who became its base and later its ceiling, as in Pakistan, where the
        party's leadership remained rooted in Sindhi landowning families.
      function: >-
        Today it is mostly a memory and a vocabulary. The PPP keeps the slogan while governing with
        landlords; Islamic finance has turned the ban on usury into a banking industry serving Gulf
        capital. It remains a resource for Muslim workers and peasants to argue for redistribution in
        their own idiom, and where it drove the nationalization of oil and banks (Libya, Pakistan in the
        1970s) it reduced the outflow of profit to foreign owners.
      disputed: >-
        Materialists dispute whether these projects were socialist or state capitalism led by a national
        bourgeoisie and the military. Maxime Rodinson (Islam and Capitalism, 1966) argued that Islam's
        texts neither require nor forbid capitalism, so the label borrows religious authority for
        whatever program its users hold.
    keyTexts:
      - {author: Mustafa al-Siba'i, title: "The Socialism of Islam (Ishtirakiyyat al-Islam)", year: 1959}
      - {author: Ali Shariati, title: "On the Sociology of Islam", year: 1979}
      - {author: Muammar Gaddafi, title: The Green Book, year: 1975}
      - {author: Maxime Rodinson, title: Islam and Capitalism, year: 1966}

  - id: religious.religious-zionism
    regions: [Israel, West Bank, Jewish diaspora]
    self: >-
      The return of the Jewish people to the Land of Israel is not only a national movement. It is the
      beginning of the redemption. Rav Kook taught that even secular pioneers draining the swamps were
      doing holy work they did not yet understand, and that the State of Israel is the foundation of
      God's throne in the world. Torah, people and land are one. No part of the Land promised to our
      fathers may be surrendered, because it is not ours to give. We settle Judea and Samaria as our
      ancestors did, and we will build a state that lives by Torah.
    record:
      - date: 1902
        text: >-
          Rabbi Yitzchak Yaakov Reines founds the Mizrachi movement in Vilna as the religious faction
          within the Zionist Organization.
      - date: 1924
        text: >-
          Abraham Isaac Kook founds the Merkaz HaRav yeshiva in Jerusalem; after 1952 his son Zvi Yehuda
          Kook leads it and teaches settlement of the whole land as a religious obligation.
      - date: "1967-1974"
        text: >-
          After Israel captures the West Bank, Gaza, Sinai and the Golan in June 1967, Kook's students read
          the conquest as redemption; Moshe Levinger leads settlers into Hebron in 1968, and Gush Emunim
          forms in 1974 to settle the occupied territories.
      - date: 1994
        text: >-
          Baruch Goldstein, a settler from Kiryat Arba, kills 29 Palestinian worshippers at the Ibrahimi
          Mosque in Hebron; in 1995 Yigal Amir, a religious nationalist student, assassinates Prime
          Minister Yitzhak Rabin over the Oslo Accords.
      - date: 2005
        text: >-
          The army evacuates about 8,000 settlers from Gaza in the disengagement, a crisis for a movement
          that had treated the state as sacred.
      - date: 2024
        disputed: true
        text: >-
          About 500,000 settlers live in the West Bank outside East Jerusalem. In July the International
          Court of Justice advises that Israel's occupation is unlawful and the settlements breach
          international law; Israel rejects the opinion and holds the territory to be disputed, not occupied.
      - date: "2022-2025"
        text: >-
          Bezalel Smotrich and Itamar Ben-Gvir enter government after their lists win 14 seats; Smotrich
          takes authority over civil administration in the West Bank, and both call for Palestinian
          emigration from Gaza and renewed Jewish settlement there during the war that began in October 2023.
    descendsFrom: []
    breaksWith:
      - {id: nationalism.zionism-labor, event: "National Religious Party leaves its historic partnership with Labor and joins Begin's government", date: 1977}
    analysis:
      conditions: >-
        It began as an Orthodox minority that accepted Zionism against the rejection of most Orthodox
        rabbis, and became a mass political force after the 1967 conquest supplied land to settle and the
        1973 war shook Labor's authority. State subsidies for settlement (cheaper housing, tax benefits,
        roads and security) made settlement both a religious duty and a material gain.
      class_base: >-
        Religious-nationalist middle classes, settler communities funded through the state budget and
        yeshiva networks, and a growing number of lower-middle-class voters drawn by Ben-Gvir. The
        mechanism is land: settlement converts Palestinian land into cheap housing and public-sector jobs
        in security and administration for Israeli citizens.
      function: >-
        It is now the leading force driving annexation in the West Bank and the main opponent of any
        Palestinian state. Land seizure forces Palestinians into precarious wage work in Israel and the
        settlements or out of the country, and the settlement project anchors a US-aligned power in a
        region whose oil and trade routes matter to the core.
      disputed: >-
        Materialists dispute whether Israeli expansion is driven mainly by the US strategic interest in
        a regional ally or by the internal dynamics of a settler society that at times exceeds US
        preference; Gershon Shafir (1989) traces the conflict to the settler labor and land market.
    keyTexts:
      - {author: Abraham Isaac Kook, title: "Orot (Lights)", year: 1920}
      - {author: Ian S. Lustick, title: "For the Land and the Lord: Jewish Fundamentalism in Israel", year: 1988}
      - {author: Gershom Gorenberg, title: "The Accidental Empire: Israel and the Birth of the Settlements, 1967-1977", year: 2006}
      - {author: Gershon Shafir, title: "Land, Labor and the Origins of the Israeli-Palestinian Conflict, 1882-1914", year: 1989}

  - id: religious.engaged-buddhism
    regions: [Vietnam, India, Sri Lanka, Thailand, Myanmar, Cambodia]
    self: >-
      Suffering is not only in the individual mind. It is built into institutions that run on greed,
      hatred and delusion, the three poisons. If bombs are falling on a village, a meditation that
      ignores them is not practice. So we bring mindfulness into the street: rebuilding villages bombed
      by both sides, leading Dalits out of caste into the Buddha's community, organizing villages to
      meet their own needs, walking for peace through minefields. We hold to nonviolence,
      interdependence and sufficiency, and we take only what we need so that others may live.
    record:
      - date: 1956
        text: >-
          B. R. Ambedkar converts to Buddhism with several hundred thousand Dalit followers at Nagpur on
          14 October, as a collective exit from caste.
      - date: 1958
        text: >-
          A. T. Ariyaratne founds the Sarvodaya Shramadana movement in Sri Lanka, organizing village
          self-help work camps that later reach thousands of villages.
      - date: 1963
        text: >-
          The monk Thích Quảng Đức burns himself to death in Saigon on 11 June in protest at the Diệm
          government's persecution of Buddhists; the Buddhist crisis feeds into the November coup.
      - date: "1964-1967"
        disputed: true
        text: >-
          Thich Nhat Hanh founds the School of Youth for Social Service and the Order of Interbeing, is
          exiled in 1966 for his peace campaign, and is nominated for the Nobel Peace Prize by Martin Luther
          King Jr. His supporters saw a third way to peace; Saigon and the National Liberation Front each
          treated the Buddhist peace movement as aiding the other side.
      - date: 2007
        text: >-
          Thousands of Burmese monks lead protests after a sudden fuel price rise in August and September;
          the army crushes them, raiding monasteries and killing protesters.
    descendsFrom:
      - {id: nationalism.gandhian, event: "Ariyaratne takes the name and method of Gandhian Sarvodaya", date: 1958}
      - {id: nationalism.ambedkarite, event: "Ambedkar's mass conversion at Nagpur", date: 1956}
    breaksWith:
      - {id: religious.buddhist-nationalism, event: "Engaged Buddhist networks condemn monk-led anti-Muslim campaigns in Myanmar and Sri Lanka", date: "2012-2017"}
    analysis:
      conditions: >-
        War in Vietnam, caste in India and the rapid capitalist transformation of the Thai and Sri Lankan
        countryside put monks and lay Buddhists among people whose suffering had obvious social causes,
        while both Cold War camps pressed the monastic order to take sides.
      class_base: >-
        Monastic orders and a lay intelligentsia; Dalit converts, mostly urban workers and the landless,
        for whom conversion was a collective break with caste duties; villagers in self-help movements;
        and, in the West, educated professionals drawn to meditation.
      function: >-
        In Asia it is a resource for Dalit politics and peace movements. In the core its meditation has
        been sold back as corporate mindfulness, which turns a teaching about greed into a tool for
        managing workers' stress and raising productivity without changing the conditions that cause it.
      disputed: >-
        Ronald Purser (McMindfulness, 2019) holds that Western engaged Buddhism has largely been absorbed.
        Others point to Dalit Buddhism as a clear case of religion as caste and class struggle, and critics
        of Sarvodaya argue that village self-help softened demands for land reform on the Sri Lankan state.
    keyTexts:
      - {author: Thich Nhat Hanh, title: "Vietnam: Lotus in a Sea of Fire", year: 1967}
      - {author: B. R. Ambedkar, title: The Buddha and His Dhamma, year: 1957}
      - {author: Buddhadasa Bhikkhu, title: Dhammic Socialism, year: 1986, note: "English collection edited by Donald K. Swearer"}
      - {author: Sallie B. King, title: Socially Engaged Buddhism, year: 2009}

  - id: religious.buddhist-nationalism
    regions: [Sri Lanka, Myanmar, Thailand]
    self: >-
      The Buddha entrusted his teaching to this land, and our people have guarded it for more than two
      thousand years against invaders, missionaries and kings who would have erased it. Buddhism
      vanished from Afghanistan and from India itself; it can vanish here. A nation without its faith is
      a body without a soul. Foreign money, conversion campaigns and a fast-growing minority press on
      us from every side, while politicians sell the country to outsiders. We protect our race and our
      religion, and the monks must speak because the laymen will not.
    record:
      - date: 1956
        text: >-
          S. W. R. D. Bandaranaike wins Sri Lanka's election with the backing of monks' organizations; the
          Sinhala Only Act makes Sinhala the sole official language, followed by anti-Tamil riots in 1956
          and 1958. A monk assassinates Bandaranaike in 1959.
      - date: 1972
        text: >-
          Sri Lanka's republican constitution gives Buddhism the foremost place; Tamil grievances over
          language, university places and land deepen toward the civil war of 1983–2009.
      - date: 2009
        disputed: true
        text: >-
          The army defeats the Tamil Tigers. A UN Panel of Experts (2011) found credible reports that up to
          40,000 civilians died in the final months; the Sri Lankan government rejects the figure and the
          panel's findings.
      - date: 2014
        text: >-
          Bodu Bala Sena, founded by monks in 2012, holds a rally at Aluthgama that is followed by deadly
          anti-Muslim riots.
      - date: 2017
        disputed: true
        text: >-
          After years of campaigning by the monk-led Ma Ba Tha, whose 2015 race and religion laws restrict
          interfaith marriage and conversion, Myanmar's army drives more than 700,000 Rohingya into
          Bangladesh. A UN fact-finding mission (2018) calls for genocide prosecution and The Gambia
          brings a case at the ICJ; the army calls it clearance operations against insurgents.
      - date: 2022
        text: >-
          President Gotabaya Rajapaksa, elected in 2019 on a Sinhala Buddhist platform, flees Sri Lanka
          after the debt default and mass protests; the island enters an IMF program in 2023.
    descendsFrom:
      - {id: nationalism.ethnic, event: "Anagarika Dharmapala's Sinhala Buddhist revival and the Maha Bodhi Society", date: 1891}
    breaksWith:
      - {id: nationalism.civic, event: "Sinhala Only Act abandons the independence settlement of equal citizenship", date: 1956}
    analysis:
      conditions: >-
        British rule favored English-educated elites and Christian missions and recruited minorities into
        clerical posts and plantation labor. After independence, in an export economy of tea, rubber and
        rice with few good jobs, the state became the main employer, and language and religion became
        the rules for access to its posts, schools and land.
      class_base: >-
        The rural Sinhala Buddhist petty bourgeoisie: village teachers, ayurvedic physicians, monks and
        small traders, the forces that carried Bandaranaike in 1956. In Myanmar the monastic order has
        been allied with the army. Each gains from rules that reserve jobs, land and trade for the
        majority community.
      function: >-
        It turns the anger of poor and middle-income people at debt, austerity and joblessness against
        Muslim and Tamil minorities and their shops, and it lends religious authority to the armed forces.
        The creditors, the IMF program and the export model that produced the debt are left untouched.
      disputed: >-
        Materialists dispute whether this is the nationalism of a people oppressed under colonial rule or
        the chauvinism of a majority over minorities. The JVP, which combined Sinhala nationalism and
        Marxism in its 1971 and 1987–89 risings and has governed since 2024, embodies the ambiguity.
    keyTexts:
      - {author: Mahanama (attributed), title: Mahavamsa, year: "c. 500"}
      - {author: Walpola Rahula, title: "The Heritage of the Bhikkhu (Bhiksuvage Urumaya)", year: 1946}
      - {author: Stanley J. Tambiah, title: "Buddhism Betrayed? Religion, Politics, and Violence in Sri Lanka", year: 1992}

  - id: religious.confucian
    regions: [China, Taiwan, South Korea, Singapore, Vietnam, Japan]
    self: >-
      Order begins with the cultivated person and the family: cultivate yourself, regulate your family,
      govern the state, bring peace to all under heaven. Rule by virtue and ritual makes people ashamed
      of wrongdoing; rule by punishment only makes them clever at evading it. A ruler holds the Mandate
      of Heaven only while he cares for the people's livelihood, and when he fails it passes, as Mencius
      taught. We stand for filial duty, learning open to all, harmony without uniformity, and the duty of
      the educated to serve. After a century of revolutions against tradition, our civilization needs its roots.
    record:
      - date: 1905
        text: >-
          The Qing court abolishes the civil service examinations, ending some 1,300 years of selecting
          officials by examination in the Confucian classics.
      - date: 1919
        text: >-
          The May Fourth Movement attacks Confucianism as the root of China's weakness; the Cultural
          Revolution's campaign to criticize Lin Biao and Confucius follows in 1974.
      - date: 1958
        text: >-
          Mou Zongsan, Tang Junyi, Xu Fuguan and Carsun Chang publish their manifesto on Chinese culture in
          Hong Kong, founding New Confucianism outside the mainland.
      - date: "1982-1990"
        text: >-
          Singapore's government promotes Confucian ethics in schools as part of a religious knowledge
          program, then drops the program in 1990.
      - date: 2004
        disputed: true
        text: >-
          China opens its first Confucius Institute in Seoul; hundreds follow worldwide, and many in the
          United States close after 2019. Beijing calls them centers for language and culture; US agencies
          describe them as instruments of influence.
      - date: 2011
        text: >-
          A bronze statue of Confucius is set up beside Tiananmen Square in January and quietly removed in
          April; from 2013 the Party promotes “excellent traditional Chinese culture” alongside Marxism.
    descendsFrom: []
    breaksWith:
      - {id: marxism.maoism, event: "New Confucians in Hong Kong and Taiwan reject the mainland revolution and its break with tradition", date: 1958}
    analysis:
      conditions: >-
        The revival came under two pressures. Diaspora scholars in Hong Kong and Taiwan defended Chinese
        civilization against both Westernization and Communism, and the East Asian export economies of
        the 1970s and 1980s sought a cultural account, and a discipline, for rapid industrialization.
        After 1989 the reform-era Party looked for sources of legitimacy beyond Marxism.
      class_base: >-
        Academics and state cultural institutions, and in the developmental states the bureaucratic elite
        and employers, who invoked filial duty and harmony to discipline labor. Placing the care of the
        old and sick on families rather than the state lowered public spending and wage costs.
      function: >-
        It gives governments in China, Singapore and South Korea an idiom of harmony, hierarchy and family
        responsibility. In China the Party now presents it as heritage alongside Marxism, which supports a
        non-Western claim to legitimacy in a multipolar world, while at home family responsibility for
        eldercare keeps public spending down.
      disputed: >-
        Arif Dirlik (Confucius in the Borderlands, 1995) read the revival as an ideology of discipline for
        capitalist development. Others treat it as part of a project of civilizational sovereignty against
        Western cultural dominance, compatible with socialist construction.
    keyTexts:
      - {author: Confucius (as recorded by his disciples), title: The Analects, year: "c. -400", note: "compiled in the fifth and fourth centuries BCE"}
      - {author: Mencius, title: The Mencius, year: "c. -300"}
      - {author: "Mou Zongsan, Tang Junyi, Xu Fuguan and Carsun Chang", title: "A Manifesto for a Re-appraisal of Sinology and Reconstruction of Chinese Culture", year: 1958}
      - {author: Tu Weiming, title: "Confucian Thought: Selfhood as Creative Transformation", year: 1985}

  - id: religious.political-meritocracy
    regions: [China, Singapore]
    self: >-
      One person, one vote is not the only legitimate way to choose leaders, and for a country of 1.4
      billion people it may not be the best. China selects and promotes officials through decades of
      tested performance at village, county, provincial and national level; no one reaches the top
      without having governed tens of millions. We combine democracy at the bottom, experiment in the
      middle and meritocracy at the top. Election cycles reward short-term thinking and demagogues.
      The real question is whether those chosen are able and virtuous and serve the people.
    record:
      - date: "1959-1994"
        text: >-
          Singapore's People's Action Party recruits candidates through party and civil service scouting;
          a 1994 white paper ties ministers' pay to top private-sector salaries, which Lee Kuan Yew presents
          as the price of meritocracy.
      - date: "1980s"
        text: >-
          China's reform-era cadre evaluation system rates local officials on targets, chiefly economic
          growth, and uses the ratings for promotion.
      - date: 2006
        text: >-
          Daniel A. Bell publishes Beyond Liberal Democracy, and with Jiang Qing's proposals for a Confucian
          constitutional order the case for political meritocracy enters Western and Chinese debate.
      - date: 2013
        disputed: true
        text: >-
          The anti-corruption campaign begins; over the following decade more than a million officials are
          disciplined. Supporters read it as restoring standards of merit; critics as a purge of rivals.
      - date: 2018
        disputed: true
        text: >-
          The National People's Congress removes the two-term limit on the presidency. Critics read this as
          a retreat from rule-bound succession; defenders as continuity needed for long-term planning.
    descendsFrom:
      - {id: religious.confucian, event: "Bell and Jiang Qing adapt the Confucian ideal of rule by the worthy to the reform-era cadre system", date: 2006}
      - {id: communitarianism, event: "Daniel Bell's turn from communitarian critique of liberalism to Confucian meritocracy", date: 2006}
    breaksWith:
      - {id: liberalism.egalitarian, event: "Rejection of political equality in choosing leaders", date: 2006}
    analysis:
      conditions: >-
        After the Cultural Revolution the reform-era Party gave up mass mobilization as a method of rule
        and rejected multiparty elections after 1989, and it needed a theory that matched the actual
        practice of choosing cadres by tested performance. Singapore, a city-state built on foreign
        investment, needed a justification for single-party government by a trained elite.
      class_base: >-
        The cadre and bureaucratic stratum and the educated professionals who pass the exams that lead
        into it. Selection by examination and performance favors families who can pay for education, so
        the system tends to reproduce an educated elite while presenting the result as merit.
      function: >-
        It offers an articulate defense of the Chinese model against the claim that liberal democracy is
        universal, which supports multipolar arguments abroad. At home it frames unequal access as fair
        competition, and promotion by growth targets drove local governments into debt-financed construction.
      disputed: >-
        Marxists in and around the Communist Party hold that its legitimacy rests on the mass line and
        working-class leadership, not Confucian merit, and reject Bell's reading. Western left critics see
        the ideology of a new bureaucratic and capitalist stratum; others see a working alternative to
        electoral competition in the service of development.
    keyTexts:
      - {author: Daniel A. Bell, title: "Beyond Liberal Democracy: Political Thinking for an East Asian Context", year: 2006}
      - {author: Daniel A. Bell, title: "The China Model: Political Meritocracy and the Limits of Democracy", year: 2015}
      - {author: Jiang Qing, title: A Confucian Constitutional Order, year: 2013}
      - {author: Tongdong Bai, title: "Against Political Equality: The Confucian Case", year: 2019}
