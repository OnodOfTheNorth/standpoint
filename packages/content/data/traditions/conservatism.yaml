traditions:
  - id: conservatism.burkean
    regions: [Britain, Ireland, United States, Anglosphere]
    self: >-
      Society is a partnership between those who are living, those who are dead and those
      who are yet to be born. No single generation, and no clever theory, holds enough wisdom
      to redesign it from first principles. Our institutions, the common law, the church,
      property, local loyalties and a constitution grown over centuries, carry the tested
      experience of people who solved problems we have forgotten we ever had. We change in
      order to preserve: we repair the part that fails and keep the frame that works. Real
      liberties are inherited, specific and defended by habit, not declared on paper.
      Prejudice, rightly understood, is reason that has become second nature.
    record:
      - date: "1774-1782"
        text: >-
          Burke, as a Rockingham Whig member of Parliament, opposed the coercion of the
          American colonies and supported relief of the legal disabilities on Irish Catholics.
      - date: 1790
        text: >-
          Burke's Reflections on the Revolution in France predicted that a constitution built
          on abstract rights would end in terror and military rule; it opened the Revolution
          Controversy with Price, Wollstonecraft and Paine.
      - date: "1787-1795"
        disputed: true
        text: >-
          Burke led the impeachment of Warren Hastings over East India Company rule in Bengal;
          Hastings was acquitted. One reading holds this a critique of colonial plunder as
          such; another holds it was an effort to make British rule in India honourable and
          therefore durable.
      - date: 1834
        text: >-
          Peel's Tamworth Manifesto accepted the 1832 Reform Act as settled and committed the
          Conservatives to correcting proven abuses while defending established institutions,
          the template for Burkean party practice.
      - date: "1950s-1980s"
        text: >-
          Oakeshott and later Scruton restated the tradition against post-war planning and
          against market radicalism alike, defending practical knowledge against what
          Oakeshott called rationalism in politics.
    descendsFrom:
      - {id: liberalism.classical, event: "Whig defence of the settlement of 1688, restated in Burke's Appeal from the New to the Old Whigs", date: 1791}
    breaksWith:
      - {id: liberalism.republican, event: "Revolution Controversy with Price and Paine", date: 1790}
    analysis:
      conditions: >-
        It arose in a Britain where a landed aristocracy, already commercial and joined to
        merchant and financial capital after 1688, watched a revolution across the Channel
        sell church land and abolish seigneurial dues by legislative vote. The doctrine of
        prescription (title secured by long possession) answered that precedent: it put
        existing estates and the funded national debt beyond the reach of a majority.
      class_base: >-
        Landed capital and the established professions first, then the propertied middle
        classes generally. Prescription and gradual reform protect whatever distribution of
        property already exists, so the doctrine serves those who already hold; small owners
        join it because the same argument protects their house and savings.
      function: >-
        Today it supplies the vocabulary of caution used against rapid change of any kind,
        including against neoliberal shock reform as well as against redistribution. Because
        it judges an institution by its age and its fit with habit rather than by who it
        serves, it defends existing property relations, including core ownership of assets in
        the periphery, while allowing reforms that keep the frame intact.
      disputed: >-
        Some read Burke's Irish and Indian speeches as an anti-colonial resource; C. B.
        Macpherson (Burke, 1980) read him as a defender of the capitalist market order in
        traditionalist dress.
    keyTexts:
      - {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}
      - {author: Edmund Burke, title: An Appeal from the New to the Old Whigs, year: 1791}
      - {author: Michael Oakeshott, title: Rationalism in Politics and Other Essays, year: 1962}
      - {author: Roger Scruton, title: The Meaning of Conservatism, year: 1980}

  - id: conservatism.reactionary
    regions: [France, Spain, Italy, Austria, Latin America]
    self: >-
      The Revolution was not a political accident but a revolt against God: man's attempt to
      make himself the author of society, which only Providence can be. Authority descends
      from above or it is mere force. Take away the anointed king and the standing altar and
      what remains is the executioner, the soldier and the mob, and the mob always finds a
      tyrant. The liberal promise of a society built on contract and reason ended in the
      guillotine because it denied original sin. We do not want to slow the Revolution down.
      We want to undo it, and restore the order of hierarchy, family and faith in which men
      can be good.
    record:
      - date: "1814-1830"
        text: >-
          The Bourbon Restoration in France passed the 1825 indemnity compensating émigrés for
          confiscated land and the 1825 Anti-Sacrilege Act; the July Revolution of 1830 ended
          the senior Bourbon line.
      - date: "1815-1848"
        text: >-
          The Holy Alliance of Russia, Austria and Prussia and Metternich's system policed
          Europe against revolution, including the 1819 Carlsbad Decrees censoring the press
          and universities of the German Confederation.
      - date: 1823
        text: >-
          A French army restored Ferdinand VII of Spain to absolute rule after the liberal
          Trienio; the Carlist wars (1833-1876) followed over succession, the fueros and the
          place of the Church.
      - date: 1864
        text: >-
          Pius IX's Syllabus of Errors condemned the proposition that the Pope should reconcile
          himself with progress, liberalism and modern civilization.
      - date: "1936-1939"
        text: >-
          Carlist Requeté militias fought on Franco's side in the Spanish Civil War and were
          merged into the single party in 1937.
    descendsFrom:
      - {id: conservatism.burkean, event: "Maistre and Bonald take up Burke's case against the Revolution in more absolute form", date: 1796}
    breaksWith:
      - {id: liberalism.republican, event: "Execution of Louis XVI", date: 1793}
      - {id: liberalism.classical, event: "Civil Constitution of the Clergy and sale of church lands", date: 1790}
    analysis:
      conditions: >-
        The Revolution sold church land as national property (1790) and abolished seigneurial
        dues (1789-1793), stripping the clergy and nobility of their income in land and
        tithe. Reaction was the doctrine of the classes that lost that rent, and of peasant
        regions such as the Vendée and Navarre where conscription and anticlerical laws hit
        parish life.
      class_base: >-
        The landed nobility and upper clergy, with peasants in regions where the parish and
        the communal rights tied to the old order mattered more than the land the Revolution
        offered. The restored courts rewarded nobles with indemnities paid from general
        taxation, a transfer from taxpayers to the old landed class.
      function: >-
        As a governing project it is nearly gone. It survives as the deepest right-wing
        critique of liberal individualism, drawn on by integralists, traditionalists and
        neo-reactionaries. Because it grounds authority in hierarchy rather than consent, it
        removes the distribution of property from political contest altogether.
    keyTexts:
      - {author: Joseph de Maistre, title: Considerations on France, year: 1796}
      - {author: Louis de Bonald, title: Théorie du pouvoir politique et religieux, year: 1796}
      - {author: Juan Donoso Cortés, title: "Essay on Catholicism, Liberalism and Socialism", year: 1851}

  - id: conservatism.monarchist
    regions: [Europe, Gulf states, Morocco, Thailand, Japan, worldwide]
    self: >-
      A crown places the highest office beyond the reach of money, party and ambition. The
      monarch is raised for the role from birth, owes nothing to donors, answers to the whole
      nation across generations and embodies its continuity in a way no elected president
      can. Where the throne stands, the state is a patrimony to be handed on intact, not a
      prize to be looted in four-year terms. Whether the king reigns or rules, we hold that
      legitimate authority is inherited, personal and sacred, and that the republic's
      promise of rule by all usually means rule by the best-funded faction.
    record:
      - date: 1815
        text: >-
          The Congress of Vienna restored the dynasties displaced by revolution and Napoleon on
          the principle of legitimacy.
      - date: "1917-1922"
        text: >-
          The Romanov, Habsburg, Hohenzollern and Ottoman dynasties fell in war and revolution;
          Italy abolished its monarchy by referendum in 1946 (about 54 to 46 percent).
      - date: "1952-1979"
        text: >-
          Revolutions removed monarchies in Egypt (1952), Iraq (1958), Libya (1969),
          Ethiopia (1974) and Iran (1979), most of them allied to Britain or the United States.
      - date: 1975
        disputed: true
        text: >-
          Juan Carlos I took the Spanish throne under Franco's succession law and presided over
          the transition to parliamentary monarchy. Monarchists credit him with defeating the
          coup attempt of 23 February 1981; critics argue his role before and during that night
          was more ambiguous than the official account. He abdicated in 2014 amid financial
          scandals.
      - date: "1932-present"
        text: >-
          Saudi Arabia, an absolute monarchy since 1932, nationalized Aramco in stages (1973-
          1980) and, like the other Gulf monarchies, recycles oil revenue into Western financial
          markets and arms purchases while hosting or funding US forces in the region.
      - date: 2008
        text: >-
          Nepal's constituent assembly abolished the monarchy after a decade of Maoist-led
          insurgency and the 2006 mass movement; in Thailand, prosecutions under the lèse-
          majesté law (Article 112) rose sharply against protesters after 2020.
    descendsFrom:
      - {id: conservatism.reactionary, event: "Legitimist defence of the restored dynasties", date: 1815}
    breaksWith:
      - {id: liberalism.republican, event: "Abolition of the French monarchy", date: 1792}
    analysis:
      conditions: >-
        Monarchy is old; monarchism as a doctrine arose once republics became a live option,
        after 1776 and 1792. It took its sharpest form where a landed nobility and an
        established church held office and land through lineage, so that inherited rule at the
        top mirrored inherited property below.
      class_base: >-
        Historically the landed nobility and those dependent on court patronage. In the Gulf
        the ruling family is itself a fraction of capital that controls oil rent through the
        state. In constitutional monarchies, a cross-class loyalty strongest among older,
        rural and religious voters, while the crown keeps large untaxed or lightly taxed land
        holdings.
      function: >-
        In the Gulf, monarchy is the political form of states that turn oil rent into
        holdings in core financial markets and purchases of core weapons, which supports the
        dollar and core arms industries. In constitutional monarchies it supplies a symbol of
        continuity above party, which lends the existing order a legitimacy no election can
        revoke.
    keyTexts:
      - {author: Robert Filmer, title: Patriarcha, year: 1680}
      - {author: Walter Bagehot, title: The English Constitution, year: 1867}
      - {author: Hans-Hermann Hoppe, title: "Democracy: The God That Failed", year: 2001}

  - id: conservatism.traditionalist
    regions: [United States, Britain]
    self: >-
      Civilization rests on a moral order that is transcendent and permanent. Before politics
      come the permanent things: faith, family, the inherited wisdom of the West, beauty, the
      small community and the land held by those who love it. Modernity has traded these for
      appetite, for mass consumption, mass media, the managerial state and the managerial
      corporation alike, and its people are rich and rootless. We do not defend capitalism as
      such. We defend custom, convention and continuity, the things that make a decent life
      possible, and we mistrust anyone, socialist or industrialist, who would sacrifice them
      to efficiency.
    record:
      - date: 1930
        text: >-
          The Southern Agrarians' I'll Take My Stand defended the rural South against
          industrialism; some contributors also defended segregation.
      - date: 1948
        text: >-
          Richard Weaver's Ideas Have Consequences traced modern decline to the medieval
          abandonment of universals.
      - date: 1953
        text: >-
          Russell Kirk's The Conservative Mind gave the post-war American right a lineage from
          Burke to Eliot; Kirk founded Modern Age in 1957.
      - date: 1981
        text: >-
          Kirk attacked libertarians as chirping sectaries in Modern Age, marking the limits of
          the fusionist alliance from the traditionalist side.
      - date: 1991
        text: >-
          Kirk opposed the Gulf War, a stand later taken up by paleoconservatives against
          neoconservative foreign policy.
    descendsFrom:
      - {id: conservatism.burkean, event: "Kirk's canon from Burke to Eliot", date: 1953}
    breaksWith:
      - {id: libertarianism.minarchist, event: "Kirk's 'Libertarians: The Chirping Sectaries'", date: 1981}
    analysis:
      conditions: >-
        Post-war suburbanization and the spread of corporate industry eroded small-town and
        rural life in the United States, while the right needed an answer to the New Deal that
        was more than business advocacy. Mass production and mass marketing displaced local
        crafts, shops and farms, and the cultural institutions tied to them.
      class_base: >-
        Small-town professionals, clergy, humanities academics and rural middle classes whose
        standing rested on local institutions that national corporations and the federal
        state were displacing.
      function: >-
        Its critique names real effects of capital on community: commodified leisure,
        uprooted labor, places emptied by relocation. Because it locates the cause in lost
        belief rather than in production for profit, its remedy is moral renewal, and in
        practice its adherents have allied with the business right whose investment decisions
        drive the changes they mourn.
    keyTexts:
      - {author: Russell Kirk, title: The Conservative Mind, year: 1953}
      - {author: Richard M. Weaver, title: Ideas Have Consequences, year: 1948}
      - {author: Twelve Southerners, title: "I'll Take My Stand", year: 1930}
      - {author: T. S. Eliot, title: The Idea of a Christian Society, year: 1939}

  - id: conservatism.one-nation
    regions: [Britain, Commonwealth]
    self: >-
      A nation is not a market with a flag. When rich and poor become two nations who know
      nothing of each other, the country is in danger, and the duty of those who hold
      property and power is to bind it together again. Privilege carries obligation. We
      accept decent housing, public health and a mixed economy not as concessions to
      socialism but as the conservative way to keep a people whole and loyal to its
      institutions: crown, parliament, church and the common law. We reform so that the
      nation holds together, neither torn by class war from below nor abandoned by laissez-
      faire from above.
    record:
      - date: 1845
        text: >-
          Disraeli's novel Sybil described Britain as two nations, the rich and the poor, and
          called on the landed aristocracy to lead social reform.
      - date: 1867
        text: >-
          Disraeli's Second Reform Act roughly doubled the electorate, enfranchising many urban
          working men.
      - date: 1875
        text: >-
          Disraeli's government passed the Artisans' Dwellings Act, the Public Health Act and
          the Conspiracy and Protection of Property Act, which legalized peaceful picketing.
      - date: "1951-1957"
        text: >-
          As housing minister and then chancellor, Harold Macmillan met a target of 300,000 new
          homes a year by 1953, many of them council homes, within the post-war settlement of
          full employment and the welfare state.
      - date: "1970-1974"
        text: >-
          Edward Heath's government nationalized Rolls-Royce (1971) and introduced an incomes
          policy; it lost the February 1974 election called during the miners' strike.
      - date: "1979-1990"
        text: >-
          Under Thatcher the one-nation 'wets' were removed from cabinet and the post-war
          settlement was dismantled; the current survived as a minority within the party.
    descendsFrom:
      - {id: conservatism.burkean, event: "Disraeli's Young England group", date: 1842}
    breaksWith:
      - {id: liberalism.classical, event: "Peel's repeal of the Corn Laws splits the Conservative Party", date: 1846}
      - {id: liberalism.chicago, event: "Thatcher's monetarist turn and the removal of the 'wets'", date: 1981}
    analysis:
      conditions: >-
        Industrial Britain produced an urban working class with the vote and, from the 1880s,
        a growing socialist challenge. Landed and later industrial elites needed working-class
        votes. Disraeli's 1872 Crystal Palace speech joined social reform at home to empire
        abroad, and imperial income helped fund the concessions.
      class_base: >-
        Landed capital and industrial capital oriented to the home and imperial market, with a
        cross-class electorate of patriotic and deferential workers. Social reform and housing
        purchased working-class loyalty to crown and empire while ownership of land and
        industry stayed where it was.
      function: >-
        It is the clearest case of the frame's claim that concessions to core workers were
        funded by imperial income and forced by the threat of socialism. When profits fell and
        the empire was gone in the 1970s, the cross-class bargain lost its funding and the
        party turned to Thatcherism, which recovered profits by breaking unions. What remains
        defends parts of the post-war settlement without the conditions that paid for it.
      disputed: >-
        Labour-aristocracy theorists (Lenin, Emmanuel) read the concessions as paid from
        imperial superprofits; many British labour historians stress domestic union strength
        and productivity growth instead.
    keyTexts:
      - {author: Benjamin Disraeli, title: "Sybil, or The Two Nations", year: 1845}
      - {author: Harold Macmillan, title: The Middle Way, year: 1938}
      - {author: Ian Gilmour, title: "Inside Right: A Study of Conservatism", year: 1977}

  - id: conservatism.christian-democracy
    regions: [Germany, Italy, Benelux, Austria, Chile, Latin America, European Union]
    self: >-
      The human person, made in God's image, is the measure of politics: not the lonely
      individual of the liberals nor the collective of the socialists, but the person in
      families, parishes, unions, firms and nations. The state serves those communities under
      subsidiarity; capital and labor are partners bound by justice; the market is a servant,
      made social by law. After the ruin of two wars we built the social market economy,
      reconciled France and Germany, founded a united Europe, and held the line against both
      fascism and communism. Ours is the politics of the reconciled middle, and it has
      governed Europe longer than any rival.
    record:
      - date: 1919
        text: >-
          Luigi Sturzo founded the Italian People's Party; it was dissolved under fascism in
          1926 and refounded as Christian Democracy (DC) in 1943.
      - date: 1948
        text: >-
          Italian Christian Democracy won the April election against the Communist-Socialist
          Popular Democratic Front with funding from the CIA, later confirmed in US records;
          it led every Italian government until the party collapsed in the 1992-1994 bribery
          investigations.
      - date: "1949-1963"
        text: >-
          Adenauer's CDU governments in West Germany built the social market economy with
          Ludwig Erhard, legislated co-determination in coal and steel (1951) and a pay-as-you-
          go pension reform (1957), signed reparations to Israel (1952) and took West Germany
          into NATO (1955). Hans Globke, co-author of an official commentary on the Nuremberg
          race laws, headed Adenauer's chancellery from 1953 to 1963.
      - date: "1950-1957"
        text: >-
          Schuman, Adenauer and De Gasperi led the Schuman Declaration (1950), the European
          Coal and Steel Community (1951) and the Treaty of Rome (1957).
      - date: "1964-1973"
        disputed: true
        text: >-
          In Chile, Eduardo Frei Montalva's government ran an agrarian reform and the partial
          'Chileanization' of copper. The party's leadership then welcomed the 1973 coup before
          moving into opposition to Pinochet. Its defenders say constitutional breakdown left
          no other outcome; critics say its alliance with the right helped prepare the coup.
      - date: "2010-2015"
        text: >-
          Christian democratic governments led by Angela Merkel's CDU shaped the eurozone's
          response to the debt crisis, conditioning loans to Greece, Portugal and Ireland on
          spending cuts and privatization.
    descendsFrom:
      - {id: conservatism.cst, event: "Rerum Novarum and the rise of Catholic social parties", date: 1891}
    breaksWith:
      - {id: conservatism.integralism, event: "Catholic acceptance of liberal democracy against Action Française, condemned by Rome", date: 1926}
    analysis:
      conditions: >-
        Catholic and later Protestant populations in industrializing Europe were pulled
        between socialist labor movements and anticlerical liberal states. After 1945, US-
        backed reconstruction needed a mass anti-communist party in Italy and West Germany;
        Marshall aid and the 1948 currency reform gave such parties a growing economy to
        administer.
      class_base: >-
        A cross-class confessional coalition of farmers, small business, Catholic workers'
        associations and industrial capital, held together by church networks. Co-
        determination and family allowances secured the loyalty of Christian unions while
        industrial capital kept ownership and control of investment.
      function: >-
        Through the European People's Party, the largest group in the European Parliament, it
        administers EU fiscal rules and trade policy. The eurozone's rules protect creditor
        banks and the export surplus of German-centred industry, and EU trade and investment
        agreements secure access for core capital in the periphery, while the social market's
        protections are reserved mainly for core workers.
    keyTexts:
      - {author: Jacques Maritain, title: Christianity and Democracy, year: 1943}
      - {author: Jacques Maritain, title: Man and the State, year: 1951}
      - {author: Alfred Müller-Armack, title: Wirtschaftslenkung und Marktwirtschaft, year: 1947}
      - {author: Ludwig Erhard, title: Wohlstand für Alle, year: 1957}

  - id: conservatism.cst
    regions: [worldwide, Europe, Latin America, Africa, Philippines]
    self: >-
      The Church offers no third economic system; she offers the truth about the human person.
      Labor has priority over capital, because work is done by persons and capital is only its
      instrument. Private property is a right, but it carries a universal destination: the
      goods of the earth are meant for all. Workers have a right to a just wage that can
      support a family and to form unions. The state must protect the weak and respect
      subsidiarity, leaving to families and associations what they can do. Liberal
      capitalism, which treats labor as a commodity, and collectivism, which absorbs the
      person into the state, fail the same test: human dignity.
    record:
      - date: 1891
        text: >-
          Leo XIII's Rerum Novarum defended private property, condemned socialism, and affirmed
          workers' right to form associations and to a wage sufficient to support a frugal and
          upright worker.
      - date: 1931
        disputed: true
        text: >-
          Pius XI's Quadragesimo Anno set out subsidiarity and proposed vocational corporations.
          Dollfuss's Austria (1934) and Salazar's Portugal (1933) claimed it as inspiration.
          Critics see a real affinity between its corporatism and those states; defenders say
          they borrowed its language while suppressing the free associations it required.
      - date: 1967
        text: >-
          Paul VI's Populorum Progressio criticized trade between rich and poor nations as
          unjust when prices are set by the strong, and declared development the new name for
          peace.
      - date: 1981
        text: >-
          John Paul II's Laborem Exercens taught the priority of labor over capital, in the
          year of the Polish Solidarity movement he supported.
      - date: 1984
        text: >-
          The Congregation for the Doctrine of the Faith under Cardinal Ratzinger rejected the
          use of Marxist analysis in liberation theology (Libertatis Nuntius), followed by a
          second instruction in 1986.
      - date: 2015
        text: >-
          Francis's Laudato si' called for integral ecology and spoke of an ecological debt owed
          by the global North to the South; Fratelli tutti (2020) rejected trickle-down theories.
    descendsFrom: []
    breaksWith:
      - {id: liberalism.classical, event: "Rerum Novarum rejects labor as a mere commodity", date: 1891}
      - {id: conservatism.monarchist, event: "Leo XIII's Ralliement urges French Catholics to accept the Republic", date: 1892}
    analysis:
      conditions: >-
        Industrialization dissolved guilds and peasant communities, and mass socialist parties
        were winning Catholic workers in Germany, Belgium, Italy and France while liberal
        states took church land and schools. The Church needed a doctrine that answered
        workers' grievances without class struggle, to keep Catholic workers in Catholic
        unions and parties.
      class_base: >-
        Catholic workers, peasants and small owners, organized across classes through parish,
        Catholic unions and lay movements, and the Church itself as an institution with
        property, schools and hospitals to protect.
      function: >-
        It names the drain in moral language (unjust terms of trade, ecological debt, the
        Jubilee 2000 campaign for debt cancellation) and lends authority to campaigns for debt
        relief in the South. Its defence of private property and its rejection of class
        struggle keep it from endorsing the means by which the drain would be broken, so in
        practice it softens rather than reduces it.
      disputed: >-
        Liberation theologians (Gutiérrez) read the preferential option for the poor as
        demanding structural transformation; Catholic neoconservatives (Michael Novak, George
        Weigel) read Centesimus Annus (1991) as endorsing the market economy.
    keyTexts:
      - {author: Leo XIII, title: Rerum Novarum, year: 1891}
      - {author: Pius XI, title: Quadragesimo Anno, year: 1931}
      - {author: John Paul II, title: Laborem Exercens, year: 1981}
      - {author: Francis, title: "Laudato si'", year: 2015}

  - id: conservatism.distributism
    regions: [Britain, Ireland, Canada, United States, Basque Country]
    self: >-
      The trouble with capitalism is not too many capitalists but too few. Property is good
      for people, so good that every family should have some. A free society is one where most
      households own the means of their living: the farm, the shop, the workshop, the tools,
      the share in a cooperative. Big business and the big state both reduce men to wage
      dependence, and the servile state is where they meet, with workers secured by law in
      their dependence on owners. We want ownership spread wide by law, guilds instead of
      monopolies, credit unions instead of banks, and the household as the unit of the
      economy.
    record:
      - date: 1912
        text: >-
          Hilaire Belloc's The Servile State argued that capitalism and state collectivism
          converge on a society of secure but propertyless dependents.
      - date: 1926
        text: >-
          The Distributist League was founded with G. K. Chesterton as president; it never
          became an electoral force.
      - date: "1920s-1930s"
        text: >-
          The Antigonish Movement in Nova Scotia, led by the priest Moses Coady, organized
          fishers, miners and farmers into credit unions and cooperatives through adult
          education.
      - date: 1936
        text: >-
          Distributists and Southern Agrarians published Who Owns America?, a joint case for
          widespread property against corporate concentration.
      - date: 1956
        text: >-
          The priest José María Arizmendiarrieta's students founded the first Mondragón
          cooperative in the Basque Country; the group grew into a federation of worker-owned
          firms that also runs plants abroad employing non-member wage workers.
      - date: 1922
        disputed: true
        text: >-
          Belloc's book The Jews proposed a formal separation of Jews from national life.
          Critics read it and his other writings as antisemitic; defenders say he meant to
          prevent persecution and that distributism does not depend on it.
    descendsFrom:
      - {id: conservatism.cst, event: "Rerum Novarum's call for property to be spread among as many as possible", date: 1891}
    breaksWith:
      - {id: socdem.fabian, event: "Belloc and Chesterton's polemics with Shaw and Wells over collectivism", date: 1912}
    analysis:
      conditions: >-
        Enclosure, large-scale industry and chain retail displaced English small producers, and
        Irish tenants fought for the land; Catholic social teaching gave the defence of small
        property a doctrine. Each round of concentration turned more owners into wage earners.
      class_base: >-
        The petty bourgeoisie and peasantry, whose independence depends on owning tools and
        land, and the Catholic writers who spoke for them.
      function: >-
        It informs cooperative movements, credit unions and the postliberal critique of
        monopoly. Competition and economies of scale keep concentrating capital, so widely
        spread ownership is undone unless law suspends market concentration, which requires
        the state power distributists distrust. Where it has survived at scale, as at
        Mondragón, it competes on world markets and employs wage labor abroad, so the law of
        value reasserts itself inside the cooperative form.
    keyTexts:
      - {author: Hilaire Belloc, title: The Servile State, year: 1912}
      - {author: G. K. Chesterton, title: The Outline of Sanity, year: 1926}
      - {author: Hilaire Belloc, title: An Essay on the Restoration of Property, year: 1936}

  - id: conservatism.integralism
    regions: [Europe, United States, Latin America]
    self: >-
      Man has one final end, eternal life with God, and every order of human life must be
      ordered to it, the political order included. The state is not neutral and never was;
      liberal neutrality simply installs a rival religion of the autonomous individual. As
      the soul rules the body, the spiritual power stands above the temporal: the state
      should recognize the true faith, protect the Church's mission and legislate for the
      common good, which includes the good of souls. This is not a novelty but the teaching of
      Gelasius, Boniface VIII, Leo XIII and the Syllabus, which the Church has never retracted.
    record:
      - date: 1864
        text: >-
          Pius IX's Syllabus of Errors condemned the propositions that Church and state should
          be separated and that Catholicism should no longer be the religion of the state.
      - date: 1885
        text: >-
          Leo XIII's Immortale Dei set out the Christian constitution of states, with the state
          bound to profess and protect the true religion.
      - date: "1909-1921"
        text: >-
          The Sodalitium Pianum, an integrist network led by Umberto Benigni, reported
          suspected modernists among clergy and scholars to Rome until its dissolution.
      - date: "1933-1975"
        disputed: true
        text: >-
          Catholic confessional states were built in Salazar's Portugal, Dollfuss's Austria
          (after the suppression of the Social Democrats in February 1934) and Franco's Spain
          (Concordat of 1953). Some read them as integralism in practice; integralists and many
          historians argue they used Catholicism to serve national and military power.
      - date: 1965
        disputed: true
        text: >-
          Vatican II's Dignitatis Humanae declared a civil right to religious liberty. Most
          theologians read it as ending the confessional-state ideal; integralists read it as
          compatible with the older teaching.
      - date: "2016-2022"
        text: >-
          A revival among Catholic scholars in the United States and Britain, including Thomas
          Pink, Edmund Waldstein and Adrian Vermeule, argued for law ordered to the common good
          and against liberal neutrality.
    descendsFrom:
      - {id: conservatism.reactionary, event: "Ultramontane revival and the Syllabus of Errors", date: 1864}
    breaksWith:
      - {id: conservatism.christian-democracy, event: "Dignitatis Humanae and Catholic acceptance of religious liberty", date: 1965}
    analysis:
      conditions: >-
        The Church lost the Papal States (1870), land and schools to liberal states, and needed
        a doctrine of its rightful public power. The recent revival followed legal defeats for
        Christian conservatives, notably Obergefell (2015) in the United States, which left
        them a minority in a liberal order they no longer expected to win within.
      class_base: >-
        Historically the clergy, Catholic landowners and peasants in confessional regions.
        Today a small stratum of Catholic intellectuals, lawyers and students, mostly drawn
        from the professional-managerial class.
      function: >-
        As a mass force it is small. It supplies a justification for using state power
        against liberal neutrality, which the national-conservative right adopts selectively on
        family, sexuality and education. Its own criticisms of capitalism carry little weight in
        those coalitions, because the capital fractions that fund them accept moral legislation
        and resist economic regulation.
    keyTexts:
      - {author: Pius IX, title: Quanta Cura (with the Syllabus of Errors), year: 1864}
      - {author: Leo XIII, title: Immortale Dei, year: 1885}
      - {author: Thomas Crean and Alan Fimister, title: "Integralism: A Manual of Political Philosophy", year: 2020}
      - {author: Adrian Vermeule, title: Common Good Constitutionalism, year: 2022}

  - id: conservatism.evangelical-right
    regions: [United States, Brazil, Uganda, Kenya, Guatemala, worldwide]
    self: >-
      America was founded by people who believed that rights come from God and that a free
      people must be a virtuous people. For a generation we kept out of politics while the
      courts drove prayer from schools, legalized the killing of unborn children and redefined
      marriage. We stood up because we had to. We are not seeking a theocracy; we are seeking
      the freedom to raise our children in our faith, to run our schools, churches and
      businesses by our convictions, and to defend life from conception. We stand with Israel,
      because God blesses those who bless Abraham's children. We will not be silenced.
    record:
      - date: "1971-1983"
        disputed: true
        text: >-
          The movement's origin is contested. Its leaders cite Roe v. Wade (1973) and school
          prayer rulings; the historian Randall Balmer argues the trigger was IRS action against
          tax exemptions for segregated Christian schools, ending in Bob Jones University v.
          United States (1983).
      - date: 1979
        text: >-
          Jerry Falwell founded the Moral Majority; white evangelicals voted heavily for Reagan
          in 1980. Pat Robertson founded the Christian Coalition in 1989.
      - date: 2004
        text: >-
          Evangelical mobilization helped re-elect George W. Bush as eleven states passed
          constitutional bans on same-sex marriage.
      - date: "2016-2024"
        text: >-
          About eight in ten white evangelical voters backed Donald Trump in 2016, 2020 and 2024,
          according to exit polls.
      - date: 2022
        text: >-
          Dobbs v. Jackson overturned Roe v. Wade after decades of evangelical and Catholic
          mobilization and the confirmation of judges vetted by conservative legal networks.
      - date: "2009-2023"
        disputed: true
        text: >-
          Uganda's anti-homosexuality bills (2009, law in 2023) followed visits by US
          evangelical activists. Critics say US groups shaped the laws; Ugandan sponsors and the
          US groups say the laws were a Ugandan initiative.
    descendsFrom:
      - {id: conservatism.fusionism, event: "New Right alliance in the Reagan coalition", date: 1980}
    breaksWith:
      - {id: religious.christian-socialism, event: "Fundamentalist-modernist controversy and the rejection of the Social Gospel", date: "1920s"}
    analysis:
      conditions: >-
        Sun Belt growth and suburbanization, the movement of white Southerners out of the
        Democratic Party after civil rights legislation, the decline of mainline churches and
        federal court rulings on schools and sexuality. Church networks gave the Republican
        Party an organization among working- and middle-class white voters it had lacked.
      class_base: >-
        White evangelical congregations across classes, weighted toward small business,
        rural areas and Sun Belt suburbs, led by megachurch, broadcasting and publishing
        entrepreneurs. In Latin America and Africa, Pentecostal churches recruit heavily among
        the urban poor.
      function: >-
        It supplies mass votes to a coalition whose economic program (tax cuts, deregulation,
        weaker unions) mainly serves capital. Moral issues decided through judicial
        appointments are exchanged for electoral loyalty while business wings set economic
        policy. Its Christian Zionism adds a religious constituency for US military support to
        Israel.
      disputed: >-
        Thomas Frank (What's the Matter with Kansas?, 2004) argued that moral issues lead such
        voters against their economic interests; Larry Bartels and others argue that these
        voters weigh economics as much as others and hold moral goods they genuinely rank first.
    keyTexts:
      - {author: Francis A. Schaeffer, title: A Christian Manifesto, year: 1981}
      - {author: Jerry Falwell, title: "Listen, America!", year: 1980}
      - {author: Rousas John Rushdoony, title: The Institutes of Biblical Law, year: 1973}

  - id: conservatism.fusionism
    regions: [United States]
    self: >-
      Liberty and virtue need each other. Virtue that is coerced is not virtue, so government
      must be limited; but liberty without virtue decays into license, so the culture must
      rest on faith and tradition. That is why we join the free market, constitutional limits
      on government and a strong defense against communism with respect for religion, family
      and moral order. We stand athwart history yelling Stop. We built the movement that
      elected Ronald Reagan, outlasted the Soviet Union and broke the hold of the New Deal
      consensus on American policy.
    record:
      - date: 1955
        text: >-
          William F. Buckley Jr. founded National Review, uniting traditionalists, libertarians
          and anti-communists; in 1962 he moved to expel the John Birch Society from the
          movement.
      - date: 1964
        text: >-
          Barry Goldwater won the Republican nomination and lost the election, carrying six
          states.
      - date: "1981-1989"
        text: >-
          The Reagan administration cut the top income tax rate from 70 to 28 percent by 1988,
          fired more than 11,000 striking air traffic controllers (1981), expanded military
          spending, and backed the Contras in Nicaragua and the governments of El Salvador and
          Guatemala during their civil wars; the Iran-Contra affair broke in 1986.
      - date: "1989-1991"
        disputed: true
        text: >-
          The Soviet Union collapsed. Fusionists credit Reagan's military and ideological
          pressure; others attribute it to internal economic stagnation and Gorbachev's
          reforms.
      - date: 1994
        text: >-
          Republicans won the House on the Contract with America; welfare reform followed in
          1996 under Clinton.
    descendsFrom:
      - {id: conservatism.traditionalist, event: "Frank Meyer's fusion of tradition and liberty in National Review", date: 1962}
      - {id: liberalism.austrian, event: "Hayek and Mises as the movement's economics", date: 1955}
    breaksWith:
      - {id: libertarianism.minarchist, event: "Libertarian walkout from Young Americans for Freedom in St. Louis", date: 1969}
    analysis:
      conditions: >-
        The New Deal coalition dominated US politics after 1932 and the Cold War made anti-
        communism a mass cause. Businesses opposed to labor law and progressive taxation
        needed a mass base, and anti-communism plus moral traditionalism supplied it.
      class_base: >-
        Business owners, especially Sun Belt and medium-sized firms opposed to unions, joined
        to religious and anti-communist middle classes. The cultural appeal brought voters to
        a program of lower taxes on capital and weaker labor law.
      function: >-
        Its period of dominance delivered the neoliberal turn in the United States: tax cuts on
        capital income, financial deregulation and the defeat of public-sector unions. Through
        the Treasury, the IMF and the World Bank it backed structural adjustment that opened
        peripheral economies to core capital on core terms, sustaining the drain. National
        conservatives now contest its free-trade wing.
    keyTexts:
      - {author: Frank S. Meyer, title: In Defense of Freedom, year: 1962}
      - {author: William F. Buckley Jr., title: God and Man at Yale, year: 1951}
      - {author: Barry Goldwater, title: The Conscience of a Conservative, year: 1960}
      - {author: George H. Nash, title: The Conservative Intellectual Movement in America Since 1945, year: 1976}

  - id: conservatism.paleo
    regions: [United States]
    self: >-
      We are the Old Right: a republic, not an empire. The managerial elite that runs the
      government, the corporations, the universities and the media has no loyalty to the
      actual nation, its people, culture, borders or history. It wages endless wars abroad
      for abstract democracy, imports cheap labor to undercut its own citizens, ships the
      factories overseas, and calls anyone who objects a bigot. We want our country back: no
      foreign adventures, tariffs to protect our industry, an end to mass immigration, and a
      federalism that lets real communities govern themselves by their own customs and faith.
    record:
      - date: 1981
        text: >-
          Reagan withdrew consideration of M. E. Bradford for chairman of the National Endowment
          for the Humanities after neoconservative opposition, opening the paleo-neocon split.
      - date: "1991-1992"
        text: >-
          Pat Buchanan opposed the Gulf War, challenged George H. W. Bush in the 1992 primaries
          and declared a culture war at the Republican convention.
      - date: 1995
        text: >-
          Samuel Francis, the current's leading theorist, was dismissed by The Washington Times
          after a speech at an American Renaissance conference on white racial identity; the
          current divided over whether race belonged in its program.
      - date: 1996
        text: >-
          Buchanan won the New Hampshire primary on opposition to NAFTA and immigration; his
          2000 Reform Party run won under one percent.
      - date: 2002
        text: >-
          Buchanan and others founded The American Conservative, which opposed the 2003 invasion
          of Iraq.
      - date: 2016
        text: >-
          Donald Trump won the presidency on tariffs, immigration restriction and 'America
          First', a program close to Buchanan's 1990s campaigns.
    descendsFrom:
      - {id: conservatism.traditionalist, event: "Southern traditionalism of Bradford and Kirk", date: 1980}
    breaksWith:
      - {id: conservatism.neo, event: "Bradford's withdrawn NEH nomination", date: 1981}
    analysis:
      conditions: >-
        Deindustrialization of the US interior after the 1970s, NAFTA (1994), immigration
        after the 1965 Hart-Celler Act and the end of the Cold War, which removed anti-
        communism as the glue of the right. Free trade and capital mobility moved
        manufacturing to lower-wage countries and eroded the income of workers and small
        manufacturers in the interior.
      class_base: >-
        Small and medium domestic capital exposed to import competition, the small-town petty
        bourgeoisie, and older white workers in deindustrialized regions, with an intellectual
        cadre from Southern traditionalism.
      function: >-
        It points at real effects of capital mobility but names its agent as a cultural
        managerial elite and immigrants rather than the firms that relocate. Tariffs and
        immigration restriction can raise some core wages and protect domestic capital, but
        they turn workers' grievance toward migrants and leave unequal exchange in place: it
        opposes wars abroad, not the terms of trade that drain the periphery.
      disputed: >-
        Francis took the managerial-class concept from James Burnham. Marxists dispute whether
        managers form a ruling class of their own or a salaried stratum serving capital.
    keyTexts:
      - {author: Patrick J. Buchanan, title: "A Republic, Not an Empire", year: 1999}
      - {author: Samuel T. Francis, title: "Beautiful Losers: Essays on the Failure of American Conservatism", year: 1993}
      - {author: Paul Gottfried, title: "After Liberalism: Mass Democracy in the Managerial State", year: 1999}
      - {author: James Burnham, title: The Managerial Revolution, year: 1941}

  - id: conservatism.neo
    regions: [United States, Britain]
    self: >-
      A neoconservative is a liberal who has been mugged by reality. Many of us came from the
      anti-Stalinist left and the Democratic Party, and we learned two things. At home, well-
      meant social engineering often destroys the families and institutions it claims to help,
      so policy must respect culture and evidence. Abroad, tyranny is real, weakness invites
      aggression, and American power used with confidence is the best guarantee of a decent
      world order. We are not isolationists, nor realists who shrug at the character of
      regimes. Liberal democracy is worth defending and, where possible, spreading. Moral
      clarity is the precondition of peace.
    record:
      - date: 1965
        text: >-
          Irving Kristol and Daniel Bell founded The Public Interest, a journal critical of Great
          Society programs on empirical grounds.
      - date: 1976
        text: >-
          The Committee on the Present Danger campaigned against détente and arms control;
          many members took posts under Reagan.
      - date: 1979
        text: >-
          Jeane Kirkpatrick's essay Dictatorships and Double Standards argued for supporting
          authoritarian allies against communist movements; Reagan made her UN ambassador.
      - date: 1998
        text: >-
          The Project for the New American Century (founded 1997) urged President Clinton to
          remove Saddam Hussein from power.
      - date: 2003
        text: >-
          The US-led invasion of Iraq was justified by claims of weapons of mass destruction;
          the Iraq Survey Group (2004) found no stockpiles. The Coalition Provisional Authority's
          Order 39 opened most Iraqi sectors outside oil to full foreign ownership, and de-
          Ba'athification dismissed tens of thousands of public employees.
      - date: "2003-2011"
        disputed: true
        text: >-
          Deaths from the Iraq war are disputed: Iraq Body Count documented over 100,000
          civilian deaths from violence; a 2006 Lancet survey estimated about 650,000 excess
          deaths by mid-2006. Neoconservatives attribute most deaths to insurgents and sectarian
          militias; critics place responsibility on the invasion itself.
    descendsFrom:
      - {id: marxism.third-camp, event: "Anti-Stalinist left at City College and Shachtman's later followers", date: "1940s"}
      - {id: liberalism.internationalist, event: "Cold War liberalism of Henry Jackson", date: 1972}
    breaksWith:
      - {id: liberalism.progressive, event: "McGovern's nomination and the New Left's rise in the Democratic Party", date: 1972}
    analysis:
      conditions: >-
        The defeat in Vietnam, the crisis of the 1970s and the backlash against the Great
        Society; after 1991, the United States as sole superpower with a military budget in
        search of a doctrine.
      class_base: >-
        Defense industry, finance with global exposure, and a professional cadre in think
        tanks, journals and the foreign-policy bureaucracy, with an electoral base borrowed
        from the evangelical right.
      function: >-
        It treats US military primacy as a public good. Primacy secures the dollar's reserve
        role, sea lanes and access to oil on terms set in the core, and wars to overthrow governments,
        as in Iraq, opened economies to foreign capital, as Order 39 shows. Its doctrine
        sustains the drain by force where other means fail.
      disputed: >-
        David Harvey (The New Imperialism, 2003) and others read the Iraq war as driven by oil
        and capital accumulation; Francis Fukuyama (America at the Crossroads, 2006) and many
        participants describe sincere ideological conviction and misjudged security fears.
    keyTexts:
      - {author: Irving Kristol, title: "Neoconservatism: The Autobiography of an Idea", year: 1995}
      - {author: Jeane Kirkpatrick, title: Dictatorships and Double Standards, year: 1979}
      - {author: Norman Podhoretz, title: Breaking Ranks, year: 1979}
      - {author: Robert Kagan, title: Of Paradise and Power, year: 2003}

  - id: conservatism.national
    regions: [United States, Hungary, Poland, Italy, Israel, Britain]
    self: >-
      The nation is the largest community in which people can truly govern themselves, share
      loyalties and sacrifice for one another. Globalism, with its open borders, offshored
      industry and rule by unaccountable courts and international bodies, has hollowed out
      our nations for the benefit of a mobile elite. We want sovereign states that control
      their borders, rebuild their industrial base, honor God and the Bible's moral
      inheritance, strengthen the family and raise children who know their history. We reject
      both the liberal empire that would impose one model on all peoples and the libertarian
      market that treats a country as an economy. Many nations, each free to be itself.
    record:
      - date: 2019
        text: >-
          The Edmund Burke Foundation held the first National Conservatism Conference in
          Washington; a Statement of Principles followed in 2022.
      - date: "2010-2026"
        text: >-
          Viktor Orbán's Fidesz governments in Hungary adopted a 2011 constitution invoking
          Christian heritage, built a border fence (2015), expanded family tax benefits, passed
          laws on NGOs and universities that led the Central European University to leave
          Budapest (2019), and restricted depictions of homosexuality to minors (2021); the EU
          froze funds over rule-of-law concerns (2022). Fidesz lost the April 2026 election to Péter
          Magyar's Tisza party.
      - date: "2015-2023"
        text: >-
          Poland's Law and Justice government introduced the Family 500+ child benefit (2016)
          and restructured the judiciary in disputes with the EU; its Constitutional Tribunal
          nearly banned abortion (2020). It lost power in 2023.
      - date: 2025
        text: >-
          The second Trump administration, with Vice President JD Vance, a speaker at National
          Conservatism conferences, imposed broad tariffs on imports from most countries,
          expanded deportations and extended the 2017 tax cuts.
    descendsFrom:
      - {id: conservatism.paleo, event: "Trump's 2016 campaign on tariffs, borders and 'America First'", date: 2016}
      - {id: conservatism.burkean, event: "Hazony's Anglo-American conservative tradition", date: 2018}
    breaksWith:
      - {id: conservatism.fusionism, event: "Rejection of free-trade conservatism at the first NatCon conference", date: 2019}
    analysis:
      conditions: >-
        The 2008 crisis, the loss of manufacturing jobs in core regions after China joined the
        WTO (2001), the 2015 European migration crisis and the relative decline of US power.
        Offshoring lowered wages and emptied regional economies, and parties of free trade lost
        those voters.
      class_base: >-
        Domestic-market capital, industrial and technology firms seeking protection or state
        contracts, small business, rural and small-town voters and a share of core workers,
        with a cadre from think tanks and religious intellectuals.
      function: >-
        It is a core response to a contested drain: as China and others capture more value, it
        seeks to bring industry back by tariffs and industrial policy and to control migrant
        labor at the border. Tariffs raise prices for core consumers while protecting domestic
        capital; deportation and restricted status cheapen the labor of migrants who remain;
        sanctions and export controls on technology deepen core monopolies rather than ending
        them.
      disputed: >-
        Some analysts on the left read it as a real break with neoliberalism toward state-led
        capitalism; others point to continued tax cuts for capital (2017, 2025) and read it as
        neoliberalism with tariffs.
    keyTexts:
      - {author: Yoram Hazony, title: The Virtue of Nationalism, year: 2018}
      - {author: Yoram Hazony, title: "Conservatism: A Rediscovery", year: 2022}
      - {author: Oren Cass, title: The Once and Future Worker, year: 2018}
      - {author: Michael Lind, title: The New Class War, year: 2020}

  - id: conservatism.right-populism
    regions: [Europe, United States, Brazil, Philippines, India, worldwide]
    self: >-
      We speak for the people the elites forgot: those who work, pay taxes, obey the law and
      love their country, and who have been told for thirty years to keep quiet and accept
      whatever Brussels, Washington, the banks, the media and the universities decided. They
      opened our borders without asking us. They sold our jobs abroad. They call us racists
      when we want safe streets and respect for our culture. We are not against democracy; we
      are democracy, the majority taking back control from a class that despises it.
      Referendums, borders, law and order, and a government that puts its own citizens first.
    record:
      - date: 1972
        text: >-
          Jean-Marie Le Pen founded the Front National with veterans of the Algerian war and
          the OAS and some former Vichy collaborators; Marine Le Pen expelled her father in
          2015, renamed the party Rassemblement National in 2018 and won 41.5 percent in the
          2022 presidential runoff.
      - date: 2016
        text: >-
          The Brexit referendum passed with 51.9 percent for leaving the EU after a UKIP-led
          campaign on sovereignty and immigration; Donald Trump was elected US president.
      - date: 2021
        text: >-
          On 6 January, supporters of Trump stormed the US Capitol to stop certification of the
          2020 election.
      - date: "2019-2025"
        text: >-
          Jair Bolsonaro's Brazilian government passed a pension reform (2019) while Amazon
          deforestation rose; his supporters stormed government buildings in Brasília on 8
          January 2023, and the Supreme Federal Court convicted him in 2025 of plotting a coup.
      - date: "2016-2022"
        disputed: true
        text: >-
          Rodrigo Duterte's drug war in the Philippines: police reported about 6,000 deaths in
          operations, while human-rights groups estimate 12,000 to 30,000. Supporters credit it
          with reducing crime; Duterte was arrested and sent to the International Criminal Court
          in 2025.
    descendsFrom:
      - {id: conservatism.paleo, event: "Buchanan's insurgent campaigns", date: 1992}
    breaksWith:
      - {id: conservatism.fusionism, event: "Trump's capture of the Republican nomination against the party leadership", date: 2016}
      - {id: conservatism.christian-democracy, event: "Populist parties overtake the centre-right across Europe", date: "2010s"}
    analysis:
      conditions: >-
        Neoliberal restructuring and stagnant wages in the core since the 1980s, the loss of
        social democracy's working-class base after the third way, the 2008 and euro crises
        and new migration flows. In Brazil and the Philippines, a commodity bust, crime and
        corruption scandals discredited the parties in office.
      class_base: >-
        Its core is the petty bourgeoisie (small business, the self-employed, farmers), joined
        by a growing share of core workers without degrees in deindustrialized regions and
        financed by capital fractions such as Brazilian agribusiness and domestic real estate.
      function: >-
        It turns wage earners' anger at stagnation against migrants, minorities and cultural
        elites. In office it typically cuts taxes on capital and weakens labor (Bolsonaro's
        pension reform, Trump's 2017 tax law) while restricting migration, so the grievance
        is mobilized and its material cause left untouched. Where no socialist movement
        organizes that anger, this current does.
      disputed: >-
        Some antifascist Marxists treat it as proto-fascist; left populists (Chantal Mouffe)
        treat its voters as winnable by a rival populism. Political scientists divide over
        economic grievance versus cultural backlash (Norris and Inglehart, Cultural Backlash,
        2019).
    keyTexts:
      - {author: Christopher Lasch, title: The Revolt of the Elites and the Betrayal of Democracy, year: 1995}
      - {author: David Goodhart, title: The Road to Somewhere, year: 2017}
      - {author: Roger Eatwell and Matthew Goodwin, title: "National Populism: The Revolt Against Liberal Democracy", year: 2018}

  - id: conservatism.gaullism
    regions: [France, Francophone Africa]
    self: >-
      France cannot be France without grandeur. A nation keeps its soul only if it keeps its
      sovereignty: its own foreign policy, its own deterrent, its own decisions, free of
      Washington and Moscow alike. The state is the instrument of the national will and must
      be strong, with a president who answers to the people directly, over the heads of the
      parties. We built the Fifth Republic, planned the economy to modernize it, accepted
      Algeria's independence when France's interest required it, left NATO's integrated
      command, recognized China and defended the right of peoples to decide their own fate. A
      Europe of nations, not a federal empire.
    record:
      - date: 1940
        text: >-
          De Gaulle's appeal of 18 June from London founded Free France against the armistice
          and Vichy.
      - date: 1958
        disputed: true
        text: >-
          De Gaulle returned to power during the Algerian crisis; the Fifth Republic
          constitution passed by referendum with about 83 percent. Gaullists call this a legal
          investiture by parliament; critics note it came under the threat of an army operation
          against Paris prepared by officers in Algiers.
      - date: "1958-1962"
        text: >-
          The war in Algeria continued, including torture by French forces and the police
          killing of Algerian demonstrators in Paris on 17 October 1961 under prefect Maurice
          Papon (estimates range from dozens to over 200), until the Évian Accords of 1962.
      - date: "1960-1964"
        text: >-
          France conducted its first atomic test in the Algerian Sahara (1960); French troops
          restored Gabon's president Léon M'ba after a coup (1964), part of the Françafrique
          network run by Jacques Foccart, with the CFA franc's reserves held at the French
          Treasury.
      - date: "1964-1966"
        text: >-
          France recognized the People's Republic of China (1964), converted dollar reserves
          into gold against the dollar's privilege (1965), and left NATO's integrated military
          command (1966).
      - date: "1968-1969"
        text: >-
          The May 1968 general strike shook the government; de Gaulle dissolved the Assembly and
          won the June election, then resigned in 1969 after losing a referendum.
    descendsFrom:
      - {id: nationalism.civic, event: "Republican nationalism of the Third Republic, claimed by Free France", date: 1940}
    breaksWith:
      - {id: conservatism.christian-democracy, event: "Founding of the RPF against the Fourth Republic's party system", date: 1947}
    analysis:
      conditions: >-
        Defeat in 1940, US dominance after 1945, the loss of Indochina (1954) and the Algerian
        war. French capital needed state-led modernization (the Plan, nuclear power,
        aerospace) to compete with US and German capital.
      class_base: >-
        A cross-class national coalition led by state-linked industrial capital and the high
        civil service, with Catholic, rural and petty-bourgeois voters. Planning and state
        champions channeled credit to national industry.
      function: >-
        It is a doctrine of autonomy inside the core. It contested US monopolies over finance
        (gold conversion) and weapons (an independent deterrent) while France kept its own
        drain from West and Central Africa through the CFA franc and military bases. It
        reduces one core power's privilege while sustaining another's.
      disputed: >-
        Fanny Pigeaud and Ndongo Samba Sylla (Africa's Last Colonial Currency, 2018) read the
        CFA franc as a drain mechanism; the French Treasury and its defenders present it as a
        guarantee of monetary stability.
    keyTexts:
      - {author: Charles de Gaulle, title: "The Edge of the Sword (Le Fil de l'épée)", year: 1932}
      - {author: Charles de Gaulle, title: War Memoirs, year: 1954}
      - {author: Charles de Gaulle, title: Memoirs of Hope, year: 1970}

  - id: conservatism.postliberal
    regions: [United States, Britain]
    self: >-
      Liberalism failed because it succeeded. It promised to free the individual from every
      unchosen bond, family, place, church, nation and nature, and it delivered: a rootless
      people managed by a meritocratic elite, a market that turns everything into a commodity
      and a state that polices the rubble. Left-liberals and right-liberals are two wings of
      one project. We want a politics of the common good, not of rights alone: strong
      families, rooted communities, labor protected against capital, a state unafraid to
      shape the economy and culture toward human flourishing, and an elite renewed to serve
      the many rather than itself.
    record:
      - date: 2009
        text: >-
          Maurice Glasman launched Blue Labour in Britain, arguing for a Labour politics of
          family, faith, work and place.
      - date: 2016
        text: >-
          John Milbank and Adrian Pabst's The Politics of Virtue set out a postliberal program
          of mutualism and the common good.
      - date: 2018
        text: >-
          Patrick Deneen's Why Liberalism Failed became a widely read statement of the case.
      - date: 2019
        text: >-
          Sohrab Ahmari's essay Against David French-ism attacked the fusionist accommodation of
          liberal pluralism; in 2022 he co-founded Compact magazine.
      - date: 2023
        text: >-
          Deneen's book "Regime Change" called for a new elite to replace the liberal one; postliberal
          writers found an audience among Republican politicians including JD Vance.
    descendsFrom:
      - {id: communitarianism, event: "MacIntyre's critique of liberal individualism", date: 1981}
      - {id: conservatism.cst, event: "Common-good politics drawn from Catholic social teaching", date: 2016}
    breaksWith:
      - {id: conservatism.fusionism, event: "Ahmari-French debate", date: 2019}
    analysis:
      conditions: >-
        The 2008 crisis and the collapse of trust in the liberal centre; falling life
        expectancy in deindustrialized regions; and the legal and cultural defeat of Christian
        conservatives on marriage and sexuality.
      class_base: >-
        Mainly a stratum of the professional-managerial class, Catholic and convert academics
        and journalists, seeking a base among workers without degrees by offering protection
        for family and work.
      function: >-
        It names commodification and meritocracy as enemies and supports labor protections,
        family benefits and industrial policy. Its proposals pass into national-conservative
        governments, which enact the cultural part (abortion restrictions, curricula) more
        readily than the labor part, because the capital that funds those coalitions accepts
        the first and resists the second.
      disputed: >-
        Its proponents (Glasman, Pabst) see a pro-worker realignment; critics in the socialist
        press (Jacobin) read it as an elite cultural movement using workers' grievances.
    keyTexts:
      - {author: Patrick J. Deneen, title: Why Liberalism Failed, year: 2018}
      - {author: Patrick J. Deneen, title: "Regime Change: Toward a Postliberal Future", year: 2023}
      - {author: Alasdair MacIntyre, title: After Virtue, year: 1981}
      - {author: John Milbank and Adrian Pabst, title: "The Politics of Virtue: Post-Liberalism and the Human Future", year: 2016}
