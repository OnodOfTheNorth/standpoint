traditions:
  - id: nationalism.civic
    regions: [France, United States, India, South Africa, worldwide]
    self: >-
      A nation is a daily plebiscite: a people bound not by blood or creed but by the will to
      live together under shared laws, shared memories and a shared future. Anyone who accepts
      the constitution, learns the language and takes up the duties of citizenship belongs.
      The civic nation freed peasants from lords and subjects from kings; it made citizens
      equal before the law and gave them a homeland to defend and improve. Without it there is
      no solidarity strong enough to fund a welfare state, raise an army of citizens or hold
      majorities to account. Patriotism of the constitution, not of the tribe.
    record:
      - date: 1789
        text: >-
          The Declaration of the Rights of Man and of the Citizen placed sovereignty in the
          nation; the levée en masse of 1793 created a conscript citizen army.
      - date: "1794-1802"
        text: >-
          The French Convention abolished slavery in the colonies after the Haitian revolution
          forced the issue; Napoleon restored it in 1802.
      - date: "1881-1882"
        text: >-
          The Ferry laws made French primary schooling free, compulsory and secular and taught
          only in French, suppressing Breton, Occitan and other languages. In Algeria the 1881
          Code de l'indigénat kept Muslim Algerians as subjects rather than citizens.
      - date: "1868-1924"
        text: >-
          The US Fourteenth Amendment (1868) established birthright citizenship, while the
          Chinese Exclusion Act (1882) and the national-origins quotas of 1924 sorted
          immigrants by descent.
      - date: 1950
        text: >-
          India's constitution made citizenship independent of religion. The 2019 Citizenship
          Amendment Act, which fast-tracked non-Muslim refugees from three neighbouring
          countries, was contested as a departure from that principle.
      - date: 1994
        text: >-
          South Africa's transition founded a non-racial citizenship after apartheid, on the
          civic model of the Freedom Charter (1955).
    descendsFrom:
      - {id: liberalism.republican, event: "The French Revolution places sovereignty in the nation", date: 1789}
    breaksWith:
      - {id: nationalism.ethnic, event: "Renan's 'What Is a Nation?' answering German claims to Alsace-Lorraine", date: 1882}
    analysis:
      conditions: >-
        The bourgeois revolutions needed to unify national markets, abolish internal tolls and
        privileged orders, and raise citizen armies. A single legal personhood and a single
        language served a single market in labor and goods.
      class_base: >-
        The commercial and industrial bourgeoisie and the professions, who mobilized peasants
        and urban workers through citizenship, schooling and conscription.
      function: >-
        Inside core states the civic-ethnic difference matters a great deal. At the border,
        though, civic membership rules sort the world's workers by birthplace just as ethnic
        ones do, and that sorting sustains the international wage gap on which unequal
        exchange depends. In postcolonial states (India 1950, South Africa 1994) civic
        nationalism has been a defence against partition along religious or racial lines.
      disputed: >-
        Hobsbawm treated the civic nation as a progressive historical form; Balibar (Race,
        Nation, Class, 1988, with Wallerstein) argued every nation-form produces a fictive
        ethnicity.
    keyTexts:
      - {author: Emmanuel-Joseph Sieyès, title: What Is the Third Estate?, year: 1789}
      - {author: Ernest Renan, title: What Is a Nation?, year: 1882}
      - {author: Maurizio Viroli, title: "For Love of Country: An Essay on Patriotism and Nationalism", year: 1995}

  - id: nationalism.ethnic
    regions: [Central and Eastern Europe, Balkans, worldwide]
    self: >-
      A nation is a people: a community of descent, language, memory and soil, older than any
      state and deeper than any contract. Its members know one another because they share
      ancestors, songs, a mother tongue and a homeland where their dead are buried. Every
      people has the right to its own state, in which it is master of its own house, and the
      duty to keep its identity alive through the generations. Civic nationalism mistakes a
      passport for a people; empires and globalists treat peoples as interchangeable. A world
      of distinct nations, each at home, is richer and more just than one homogenized
      humanity.
    record:
      - date: 1808
        text: >-
          Fichte's Addresses to the German Nation, delivered under French occupation, grounded
          the nation in language and called for national education.
      - date: "1848-1918"
        text: >-
          Czech, Polish, Hungarian, Irish, Serbian and other national movements organized
          against Habsburg, Russian, Ottoman and British rule; most won states between 1878 and
          1922.
      - date: 1923
        text: >-
          The Greek-Turkish population exchange, ratified at Lausanne, moved about 1.2 million
          Orthodox Christians and about 400,000 Muslims by religion, a model later cited for
          other transfers.
      - date: 1994
        text: >-
          In Rwanda, Hutu Power mobilization led to the genocide of roughly 500,000 to 800,000
          Tutsi and the killing of Hutu opponents in about a hundred days.
      - date: "1991-1995"
        text: >-
          The Yugoslav wars brought expulsions of whole populations by Serb, Croat and other
          forces; at Srebrenica in 1995 Bosnian Serb forces killed about 8,000 Bosniak men and
          boys, ruled a genocide by the ICTY and the ICJ.
      - date: "1988-1991"
        text: >-
          The Baltic national movements (the Singing Revolution) won independence from the
          USSR through mass non-violent mobilization.
    descendsFrom:
      - {id: nationalism.civic, event: "Fichte adapts the revolutionary idea of national sovereignty to a nation defined by language", date: 1808}
    breaksWith:
      - {id: nationalism.civic, event: "German national movement against French universalism under Napoleonic occupation", date: 1806}
    analysis:
      conditions: >-
        It arises where a people lacks a state of its own or lives under a foreign dynasty,
        and its educated class is shut out of imperial office. Language and descent then mark
        who gets jobs, land and office, and the national movement fights to change the marker.
      class_base: >-
        In the phase of an oppressed nation: teachers, clergy, lawyers and the petty
        bourgeoisie, mobilizing peasants through language and religion (Hroch's phases). In
        power: the national bourgeoisie that captures the state, and often the land and
        businesses of expelled minorities.
      function: >-
        The frame distinguishes two cases. For nations still under foreign rule (Kurds,
        Palestinians, Western Saharans) it can carry an anti-colonial struggle. In established
        states it sorts residents by descent and keeps minorities and migrants as an excluded
        or cheaper layer; ethnic citizenship rules and exclusion from land and office let the
        majority's owners, and some of its workers, share in what is taken from the minority.
      disputed: >-
        Lenin argued that supporting the self-determination of oppressed nations advances
        working-class unity; Luxemburg argued it divides workers along national lines.
    keyTexts:
      - {author: Johann Gottfried Herder, title: Ideas on the Philosophy of the History of Mankind, year: 1784}
      - {author: Johann Gottlieb Fichte, title: Addresses to the German Nation, year: 1808}
      - {author: Anthony D. Smith, title: The Ethnic Origins of Nations, year: 1986}

  - id: nationalism.pan-africanism
    regions: [Africa, Caribbean, African diaspora]
    self: >-
      Africa must unite. Africans on the continent and in the diaspora are one people,
      scattered by the slave trade and divided by borders that Europeans drew in Berlin.
      Divided into fifty small states, we remain suppliers of raw materials to the factories
      of others, our currencies and armies tied to former masters. United, with a common
      market, a continental government and a common defence, we can industrialize, control
      our resources and stand as equals in the world. The independence of Ghana is
      meaningless unless it is linked to the total liberation of Africa. We face neither East
      nor West; we face forward.
    record:
      - date: "1900-1945"
        text: >-
          The first Pan-African Conference met in London (1900), followed by Du Bois's Pan-
          African Congresses (1919-1927) and the Manchester Congress of 1945, where Nkrumah,
          Kenyatta, Padmore and Du Bois demanded independence.
      - date: 1957
        text: >-
          Ghana became independent under Nkrumah, who hosted the All-African Peoples'
          Conference in Accra in 1958.
      - date: 1961
        text: >-
          Patrice Lumumba, Congo's first prime minister, was killed in Katanga with the
          participation of Belgian officers; a Belgian parliamentary inquiry (2001) found Belgium
          morally responsible.
      - date: 1963
        text: >-
          The Organisation of African Unity was founded in Addis Ababa; Nkrumah's call for a
          continental union government was rejected, and in 1964 the OAU affirmed the colonial
          borders.
      - date: 1966
        disputed: true
        text: >-
          Nkrumah was overthrown by a military and police coup. Declassified US records show
          foreknowledge and contact with the plotters; the extent of US and British involvement
          is disputed, as is the weight of internal causes such as the cocoa price collapse and
          one-party rule.
      - date: "2002-2021"
        text: >-
          The African Union replaced the OAU (2002); the African Continental Free Trade Area was
          signed in 2018 and began trading in 2021.
      - date: "2023-2024"
        disputed: true
        text: >-
          The military governments of Mali, Burkina Faso and Niger expelled French troops, formed
          the Alliance of Sahel States and left ECOWAS, citing pan-African sovereignty. Supporters
          see a break with French control; critics see juntas that replaced French with Russian
          partners and postponed elections.
    descendsFrom:
      - {id: nationalism.black-nationalism, event: "Garvey's influence on Nkrumah and the Manchester generation", date: "1920s"}
    breaksWith:
      - {id: marxism.ml, event: "Padmore's break with the Comintern over its retreat from anti-colonial work", date: 1933}
    analysis:
      conditions: >-
        The Atlantic slave trade, the partition of Africa at Berlin (1884-1885) and colonial
        economies built to ship raw materials to Europe. Each colony traded with its metropole
        rather than its neighbours, and intra-African trade remains a small share of the
        continent's total.
      class_base: >-
        In movement, the educated diaspora and colonial intelligentsia, joined by urban
        workers, ex-servicemen and cash-crop farmers. In power, the new state bureaucracy and a
        national bourgeoisie in formation.
      function: >-
        The frame reads continental union as a delinking strategy: a larger market and common
        currency would reduce dependence on raw-material exports priced in core currencies. It
        stalled because ruling strata that broker raw-material exports gain from separate
        states, each negotiating alone with core buyers and creditors.
      disputed: >-
        Fanon ("The Pitfalls of National Consciousness") read the postcolonial bourgeoisie as
        comprador from birth; others credit postcolonial states with real national development
        cut short by debt and adjustment. Materialists also divide over the Sahel states.
    keyTexts:
      - {author: W. E. B. Du Bois, title: The World and Africa, year: 1947}
      - {author: George Padmore, title: Pan-Africanism or Communism?, year: 1956}
      - {author: Kwame Nkrumah, title: Africa Must Unite, year: 1963}
      - {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}

  - id: nationalism.black-nationalism
    regions: [United States, Caribbean, Britain]
    self: >-
      Black people in America are a nation within a nation: a people with a common history of
      enslavement, a common culture and a common oppressor, colonized at home. Integration asks
      us to beg for a seat at the table of those who robbed us. We want what every nation
      wants: to control the politics, economics and institutions of our own communities, to
      defend ourselves, to own our land and businesses, to teach our children our history,
      and to stand with Africa and all colonized peoples. Do for self. Up, you mighty race; you
      can accomplish what you will.
    record:
      - date: "1914-1927"
        disputed: true
        text: >-
          Marcus Garvey founded the UNIA (1914), which claimed millions of members, and the
          Black Star Line (1919). He was convicted of mail fraud (1923) and deported (1927).
          Supporters call the prosecution, pressed by J. Edgar Hoover's Bureau, political;
          the government held it was ordinary fraud. Garvey was pardoned posthumously in 2025.
      - date: "1930-1965"
        text: >-
          The Nation of Islam was founded in Detroit (1930); Malcolm X became its best-known
          minister, broke with it in 1964 and was assassinated in 1965.
      - date: "1966-1971"
        text: >-
          The Black Panther Party ran armed patrols of the police and free breakfast programs;
          the FBI targeted it through COINTELPRO, and Chicago police killed Fred Hampton in a
          1969 raid.
      - date: 1968
        text: >-
          The Republic of New Afrika was declared in Detroit, claiming five Southern states as
          a Black national territory.
      - date: 1972
        text: >-
          The National Black Political Convention in Gary, Indiana adopted an agenda for
          independent Black politics.
      - date: 1995
        text: >-
          The Nation of Islam under Louis Farrakhan organized the Million Man March in
          Washington.
    descendsFrom:
      - {id: nationalism.pan-africanism, event: "Garvey's Universal Negro Improvement Association", date: 1914}
    breaksWith:
      - {id: liberalism.social, event: "Garvey's feud with the NAACP over integration", date: "1920s"}
    analysis:
      conditions: >-
        The Great Migration into Northern cities, housing segregation, exclusion from unions
        and credit (redlining from the 1930s) and racial terror in the South. Segregation
        created a captive market and a separate institutional life in which a Black petty
        bourgeoisie formed, and a population that met the state mainly as police.
      class_base: >-
        Garvey drew on Black workers and migrants; the Nation of Islam on the urban poor and
        prisoners; cultural nationalism on students and professionals; Black capitalism on
        small business owners.
      function: >-
        The frame reads Black America as an internal colony whose super-exploitation, through
        lower wages, rent extracted from segregated housing and mass incarceration, cheapens
        labor for capital as a whole. Nationalism aimed at community control of land and
        institutions contests that; 'Black capitalism', promoted by the Nixon administration
        in 1969, integrates a Black business stratum into the same relations.
      disputed: >-
        Harry Haywood and the Comintern's 1928 thesis held Black Americans to be an oppressed
        nation in the Black Belt; class-first Marxists such as Adolph Reed Jr. treat them as a
        racialized part of the US working class.
    keyTexts:
      - {author: Marcus Garvey, title: The Philosophy and Opinions of Marcus Garvey, year: 1923}
      - {author: Harry Haywood, title: Negro Liberation, year: 1948}
      - {author: Malcolm X and Alex Haley, title: The Autobiography of Malcolm X, year: 1965}
      - {author: Stokely Carmichael and Charles V. Hamilton, title: "Black Power: The Politics of Liberation in America", year: 1967}

  - id: nationalism.nasserism
    regions: [Egypt, Arab world]
    self: >-
      We are one Arab nation from the Atlantic to the Gulf, divided by colonialism, robbed by
      feudal landlords and foreign companies, and humiliated in 1948 by the loss of Palestine.
      On 23 July 1952 the Free Officers ended the rule of a king who served the British. We
      gave the land to the fellah, took back the Suez Canal, built the High Dam, nationalized
      the banks and factories, and opened schools and jobs to the sons of peasants. Positive
      neutrality, non-alignment, Arab unity and an Arab socialism rooted in our own faith and
      history. Raise your head, brother; the age of servitude is over.
    record:
      - date: 1952
        text: >-
          The Free Officers overthrew King Farouk; the September Agrarian Reform Law capped
          holdings at 200 feddans (lowered to 100 in 1961 and 50 in 1969) and redistributed land
          to peasants.
      - date: 1954
        text: >-
          After an assassination attempt on Nasser, the Muslim Brotherhood was banned and its
          members imprisoned; Sayyid Qutb was executed in 1966. Communists were imprisoned from
          1959 to 1964. Independent parties and unions were folded into a single organization.
      - date: 1956
        text: >-
          After the US and World Bank withdrew funding for the High Dam, Nasser nationalized the
          Suez Canal Company. Britain, France and Israel invaded and withdrew under US and Soviet
          pressure. The dam was built with Soviet finance and completed in 1970.
      - date: "1958-1961"
        text: >-
          Egypt and Syria merged as the United Arab Republic; Syria seceded in 1961.
      - date: 1961
        text: >-
          The July Laws nationalized banks, insurance and large industry; the 1962 National
          Charter declared Arab socialism and guaranteed university education free of charge.
      - date: "1962-1967"
        text: >-
          Egypt sent up to 70,000 troops to back the republic in Yemen's civil war; in June 1967
          Israel defeated Egypt, Syria and Jordan and occupied Sinai. Nasser resigned and
          withdrew the resignation after mass demonstrations.
      - date: 1974
        text: >-
          Sadat's infitah (opening) reversed much of the program, inviting foreign capital and
          later aligning Egypt with the United States.
    descendsFrom:
      - {id: nationalism.civic, event: "Wafdist Egyptian nationalism of the 1919 revolution", date: 1919}
    breaksWith:
      - {id: religious.islamism-brotherhood, event: "Manshiyya assassination attempt and ban of the Brotherhood", date: 1954}
      - {id: nationalism.baathism, event: "Syrian secession from the United Arab Republic", date: 1961}
    analysis:
      conditions: >-
        Egypt was a British-dominated cotton exporter in which a small landlord class held a
        large share of cultivated land while most peasants were landless or nearly so; foreign
        capital owned the canal and much of finance; and the 1948 defeat discredited the
        monarchy.
      class_base: >-
        An officer corps from rural middle and lower-middle strata, the state bureaucracy, and
        mass support from peasants given land and urban workers given jobs and security, while
        independent unions and parties were absorbed into the single party.
      function: >-
        In its time it was a national-bourgeois project of import substitution that reduced
        the drain: canal revenue stayed in Egypt and land rent was cut. A state bourgeoisie
        formed in the public sector and, after 1974, converted state positions into private
        capital, becoming a comprador layer. Its legacy is now claimed by an army-dominated
        state tied to Gulf capital and IMF loans.
      disputed: >-
        Samir Amin (as Hassan Riad, L'Égypte nassérienne, 1964) read it as a national-
        bourgeois project unable to go beyond state capitalism; Mahmoud Hussein (Class
        Conflict in Egypt, 1973) read it as a state bourgeoisie disciplining workers and
        peasants.
    keyTexts:
      - {author: Gamal Abdel Nasser, title: The Philosophy of the Revolution, year: 1954}
      - {author: Hassan Riad (Samir Amin), title: L'Égypte nassérienne, year: 1964}
      - {author: Mohamed Hassanein Heikal, title: "Cutting the Lion's Tail: Suez Through Egyptian Eyes", year: 1986}

  - id: nationalism.baathism
    regions: [Syria, Iraq, Arab world]
    self: >-
      One Arab nation with an eternal mission. The Arabs are a single people whose unity was
      broken by Ottoman decay and by the Western partition of Sykes-Picot. Our resurrection,
      which is what ba'th means, requires three things at once: unity, because the borders are
      colonial lines; liberty, from imperialism and from the feudal and tribal bonds that keep
      us small; and socialism, an Arab socialism serving the nation rather than a class war
      imported from abroad. A vanguard must awaken the nation's will, transform its economy
      and liberate Palestine. Islam was the expression of the Arab spirit; Arabism is its
      heir.
    record:
      - date: 1947
        text: >-
          Michel Aflaq and Salah al-Din al-Bitar held the founding congress in Damascus; the
          party merged with Akram al-Hawrani's Arab Socialist Party in the early 1950s.
      - date: 1963
        disputed: true
        text: >-
          The Ba'th took power in Iraq in February, killing Abd al-Karim Qasim, followed by mass
          killings of communists, and in Syria in March. Some historians cite evidence of CIA
          contact with the Iraqi plotters; others find it inconclusive.
      - date: 1966
        text: >-
          A coup in Syria expelled the party's founders; the movement split into rival Syrian and
          Iraqi branches.
      - date: "1972-1980"
        text: >-
          Iraq nationalized the Iraq Petroleum Company (1972) and used oil revenue for
          electrification, health care and a literacy campaign recognized by UNESCO.
      - date: 1982
        disputed: true
        text: >-
          The Syrian army under Hafez al-Assad crushed a Muslim Brotherhood uprising in Hama;
          death estimates range from about 2,000 (government accounts) to over 20,000.
      - date: "1980-1991"
        text: >-
          Iraq fought Iran (1980-1988), with Western and Gulf support, and in the 1988 Anfal
          campaign killed tens of thousands of Kurds, including about 5,000 in the chemical
          attack on Halabja. It invaded Kuwait in 1990 and was placed under UN sanctions until
          2003.
      - date: "2003-2024"
        text: >-
          The US invasion ended Ba'th rule in Iraq and banned the party; in Syria, after a civil
          war from 2011, the government of Bashar al-Assad fell in December 2024.
    descendsFrom:
      - {id: nationalism.ethnic, event: "Sati' al-Husri's linguistic and cultural Arab nationalism", date: "1920s"}
    breaksWith:
      - {id: nationalism.nasserism, event: "Syrian secession from the United Arab Republic", date: 1961}
      - {id: marxism.ml, event: "Killings of Iraqi communists after the February coup", date: 1963}
    analysis:
      conditions: >-
        Mandate partition, landlord-dominated countrysides in Syria and Iraq, and armies in
        which rural and minority communities (Alawites in Syria, Sunni Arabs from Tikrit in
        Iraq) found a path upward. Oil rent in Iraq gave the state an income independent of
        domestic taxation.
      class_base: >-
        The rural lower-middle class and minority communities entering the officer corps and
        teaching; in power, a state bourgeoisie living on oil rent and the public sector, bound
        together by family and sect networks. Land reforms broke landlord power and
        nationalization put oil revenue under state control.
      function: >-
        Both states controlled national oil and resisted alignment with the United States,
        which helps explain the sanctions and wars they drew. Their internal repression and
        their wars (Iraq against Iran with Western and Gulf backing) at times served rival
        core powers. With Iraq invaded and Assad gone, the tradition survives mainly in exile.
      disputed: >-
        The frame's reading treats them as national-bourgeois states under siege; Hanna Batatu
        and later critics describe bureaucratic state capitalisms whose ruling families became
        a new comprador layer, as in Syria's liberalization after 2000.
    keyTexts:
      - {author: Arab Ba'th Party, title: Constitution of the Arab Ba'th Party, year: 1947}
      - {author: Michel Aflaq, title: "Fi Sabil al-Ba'th (On the Way of Resurrection)", year: 1959}
      - {author: Hanna Batatu, title: The Old Social Classes and the Revolutionary Movements of Iraq, year: 1978}

  - id: nationalism.kemalism
    regions: [Turkey]
    self: >-
      Peace at home, peace in the world. From the ruins of a defeated empire that the victors
      had carved up at Sèvres, the Turkish nation won its independence by its own arms and
      built a modern republic. Our six arrows are republicanism, nationalism, populism,
      statism, laicism and revolutionism. Sovereignty belongs unconditionally to the nation,
      not to a sultan or caliph; religion is free in conscience and kept out of government; the
      state builds the industry private capital will not; citizens are equal regardless of
      class; and the nation rises to the level of contemporary civilization. Happy is the one
      who says, I am a Turk.
    record:
      - date: "1915-1917"
        disputed: true
        text: >-
          Under the Committee of Union and Progress, before the republic, Ottoman Armenians were
          deported and killed, with estimates of 600,000 to 1.5 million dead; many later
          Kemalist cadres had been CUP members, and the republic kept confiscated Armenian
          property. Turkey's official position denies that the events were genocide; most
          historians of the period and the International Association of Genocide Scholars hold
          that they were.
      - date: "1919-1923"
        text: >-
          The nationalist movement defeated Greek, Armenian and French forces; the Treaty of
          Lausanne (1923) replaced Sèvres and ratified the Greek-Turkish population exchange, and
          the republic was proclaimed on 29 October 1923.
      - date: "1924-1934"
        text: >-
          The caliphate was abolished (1924), a civil code based on Switzerland's adopted (1926),
          the Latin alphabet introduced (1928), and women given the national vote (1934).
      - date: "1925-1938"
        text: >-
          The army suppressed the Sheikh Said rebellion (1925) and the Dersim uprising (1937-1938),
          killing thousands and deporting more; Kurdish identity and language were denied
          or restricted for decades.
      - date: 1934
        text: >-
          The first five-year industrial plan, financed partly by Soviet credit, built state
          textile, sugar and steel enterprises.
      - date: "1960-1997"
        text: >-
          The army, claiming guardianship of Kemalism, took power or forced out governments in
          1960, 1971, 1980 and 1997; Kemalist officers were prosecuted in the Ergenekon and
          Sledgehammer trials (2008-2012) under the AKP, many later acquitted.
    descendsFrom:
      - {id: nationalism.ethnic, event: "Ziya Gökalp's Turkism and the Committee of Union and Progress", date: 1913}
    breaksWith:
      - {id: conservatism.monarchist, event: "Abolition of the Ottoman sultanate", date: 1922}
    analysis:
      conditions: >-
        European creditors controlled Ottoman revenue through the Public Debt Administration
        (from 1881), the capitulations exempted foreigners from Ottoman law and taxes, and the
        victors planned partition in 1920. Commerce had been largely in Greek, Armenian and
        Jewish hands; the removal of the Christian commercial classes and the transfer of their
        property created a Muslim-Turkish bourgeoisie under state patronage.
      class_base: >-
        A military-bureaucratic cadre, the Turkish bourgeoisie it fostered, and Anatolian
        landowners left in place: there was no land reform in the 1930s, and Kurdish
        landlords who cooperated kept their estates.
      function: >-
        It began as the war of an oppressed nation against partition and creditor control,
        with Soviet backing, which reduced the drain. It became an oppressor-nation
        nationalism toward Kurds and the remaining minorities, and its army kept Turkey in
        NATO from 1952 as a frontline state. Today it is the creed of the CHP opposition and the
        secular urban middle classes.
      disputed: >-
        Çağlar Keyder reads Kemalism as a bureaucratic project that created a national
        bourgeoisie; Kurdish and Armenian scholars read it as a founding violence against
        minorities inseparable from that project.
    keyTexts:
      - {author: Ziya Gökalp, title: The Principles of Turkism, year: 1923}
      - {author: Mustafa Kemal Atatürk, title: "Nutuk (The Great Speech)", year: 1927}
      - {author: Çağlar Keyder, title: State and Class in Turkey, year: 1987}

  - id: nationalism.peronism
    regions: [Argentina]
    self: >-
      Social justice, economic independence, political sovereignty. On 17 October 1945 the
      descamisados filled the Plaza de Mayo and the workers entered Argentine history as its
      protagonists. Perón gave them what the oligarchy and the foreign companies had refused:
      recognized unions, paid holidays, pensions, the aguinaldo, the women's vote, and railways
      bought back from the British. Neither Yankees nor Marxists: we are the third position,
      the organized community, the alliance of workers, national industry and the armed
      forces against the agro-export oligarchy and imperialism. The unions are the backbone of
      the movement. For a Peronist there is nothing better than another Peronist.
    record:
      - date: "1945-1955"
        text: >-
          After the 17 October 1945 mobilization Perón won the 1946 election. Real wages rose and
          labor's share of national income reached about half by the early 1950s; the IAPI state
          trading agency captured grain export earnings for industry; British-owned railways were
          bought (1948); women won the vote (1947).
      - date: "1946-1955"
        disputed: true
        text: >-
          Opposition newspapers were closed or expropriated (La Prensa, 1951) and opponents
          jailed. Argentina admitted Nazi war criminals including Eichmann and Mengele; the
          extent of Perón's personal role is disputed between historians who document
          state-run escape networks and others who stress Vatican and émigré channels.
      - date: 1955
        text: >-
          Navy aircraft bombed the Plaza de Mayo in June, killing over 300; Perón was overthrown in
          September and Peronism was banned until 1973. Perón had been excommunicated during his
          conflict with the Church.
      - date: "1973-1976"
        text: >-
          Perón returned; the Peronist right and left fought at Ezeiza (1973); the Triple A death
          squad organized under minister José López Rega killed hundreds of leftists before the
          1976 military coup.
      - date: "1989-1999"
        text: >-
          Carlos Menem, elected as a Peronist, privatized state enterprises including YPF and
          pegged the peso to the dollar (1991).
      - date: "2003-2015"
        text: >-
          Néstor and Cristina Kirchner restructured defaulted debt with large losses for
          creditors (2005), paid off the IMF (2006), renationalized pensions (2008) and took
          control of YPF (2012). The anti-Peronist Javier Milei won the presidency in 2023.
    descendsFrom:
      - {id: conservatism.cst, event: "Catholic social doctrine claimed as the source of justicialismo", date: 1946}
    breaksWith:
      - {id: conservatism.cst, event: "Conflict with the Church, legal divorce and Perón's excommunication", date: 1955}
    analysis:
      conditions: >-
        Argentina was an agro-export economy tied to Britain (the Roca-Runciman pact of 1933).
        The Depression and the Second World War forced import-substituting industry, and mass
        migration from the provinces to Buenos Aires created a new, unorganized working class.
      class_base: >-
        An alliance of industrial workers organized in the CGT, domestic-market industrialists,
        and parts of the army and Church. The IAPI took export rent from the landed oligarchy
        and transferred it to industrial wages and credit.
      function: >-
        It is a national-popular movement of a semi-peripheral country whose program of
        capturing export rent reduces the drain, which is why it has repeatedly drawn the
        opposition of agro-export capital, creditors and the IMF. But the label covers opposed
        class contents, from Menem's privatizations, which extended foreign ownership, to the
        Kirchners' confrontation with creditors; which fraction leads (the CGT leadership,
        provincial governors or the Kirchnerist left) decides what it does.
      disputed: >-
        Milcíades Peña and Argentine Trotskyists read it as bourgeois nationalism that tied
        workers to the state; John William Cooke and Juan José Hernández Arregui saw it as the
        political form of the Argentine working class. Liberals and some on the left call it
        fascist, which Peronists reject.
    keyTexts:
      - {author: Juan Domingo Perón, title: La comunidad organizada, year: 1949}
      - {author: Eva Perón, title: La razón de mi vida, year: 1951}
      - {author: Juan José Hernández Arregui, title: La formación de la conciencia nacional, year: 1960}

  - id: nationalism.bolivarianism
    regions: [Venezuela, Latin America]
    self: >-
      Bolívar's dream lives: a Great Fatherland of free Latin American peoples, independent of
      the empire to the north. For decades our oil wealth flowed to a few families and foreign
      companies while the barrios went hungry. With Chávez the people took back PDVSA and
      turned oil rent into missions: literacy, clinics with Cuban doctors, subsidized food,
      millions of homes. We built participatory democracy from below in communal councils,
      an ALBA of solidarity instead of a free-trade area of the corporations, and a twenty-
      first-century socialism rooted in Bolívar, Simón Rodríguez and Zamora. We have faced a
      coup, an oil lockout, sanctions and armed attack. They shall not return.
    record:
      - date: "1989-1992"
        text: >-
          Troops killed hundreds, by official count, and possibly far more, suppressing the 1989
          Caracazo riots against IMF-linked price rises; in 1992 Lieutenant Colonel Hugo Chávez
          led a failed coup against President Carlos Andrés Pérez.
      - date: "1998-1999"
        text: >-
          Chávez won the presidency; a new constitution was approved by referendum.
      - date: "2002-2003"
        disputed: true
        text: >-
          A coup removed Chávez for about 47 hours in April 2002 before mass protests and loyal
          troops restored him; a management lockout at PDVSA followed. The government says the
          United States backed the coup; US officials denied involvement while welcoming
          Chávez's removal at first.
      - date: "2003-2012"
        text: >-
          Oil-funded missions expanded literacy, health care and food subsidies; official
          figures show household poverty roughly halved between 2003 and 2008. Venezuela
          founded ALBA (2004) and PetroCaribe (2005) and took majority control of foreign oil
          projects (2007).
      - date: "2014-2021"
        disputed: true
        text: >-
          After oil prices fell, GDP contracted by roughly three-quarters, hyperinflation
          followed and about 7.7 million people emigrated by 2024. Critics attribute the
          collapse mainly to price controls, corruption and oil mismanagement that preceded
          sanctions; the government and economists such as Mark Weisbrot and Jeffrey Sachs
          attribute much of it to US financial (2017) and oil (2019) sanctions.
      - date: 2024
        disputed: true
        text: >-
          The electoral council declared Nicolás Maduro the winner without publishing precinct
          results; the opposition published tally sheets it said showed Edmundo González had
          won.
      - date: 2026
        text: >-
          In January, after months of US strikes on boats in the Caribbean, US forces struck
          targets in Venezuela and seized Maduro, who was taken to New York on drug-trafficking
          charges; Delcy Rodríguez became acting president. The US called it law enforcement;
          the Venezuelan government and many states called it aggression and abduction.
    descendsFrom:
      - {id: marxism.guevarism, event: "Alliance with Cuba and the turn to 'socialism of the twenty-first century'", date: 2005}
    breaksWith:
      - {id: conservatism.christian-democracy, event: "Rejection of the Punto Fijo system shared by COPEI and Acción Democrática", date: 1992}
    analysis:
      conditions: >-
        An oil-rentier state in which rent had been shared through the two Punto Fijo parties
        until the 1980s debt crisis; IMF adjustment in 1989; and large barrio populations
        outside the formal economy and the old patronage networks.
      class_base: >-
        Urban informal workers and the barrios, parts of the army, and public employees; in
        power, a new stratum of state contractors and officers controlling imports, mining and
        access to dollars.
      function: >-
        It captured oil rent from foreign companies and the old comprador elite and spent it on
        the poor, reducing the drain, and it drew a coup, sanctions and military attack. It left
        the economy dependent on oil for almost all export earnings and on imports bought with
        rent, so when oil prices fell and sanctions cut off finance the redistribution
        collapsed. A fixed, overvalued exchange rate let those with access to official dollars
        profit from arbitrage, forming a new rentier layer.
      disputed: >-
        Materialists divide over how much of the collapse sanctions explain, and over whether
        the state is a besieged transitional project (the frame's reading) or a new rentier
        capitalism, as the Venezuelan Communist Party argued after breaking with Maduro in 2020.
    keyTexts:
      - {author: Asamblea Nacional Constituyente, title: Constitution of the Bolivarian Republic of Venezuela, year: 1999}
      - {author: István Mészáros, title: Beyond Capital, year: 1995}
      - {author: Marta Harnecker, title: "Understanding the Venezuelan Revolution: Hugo Chávez Talks to Marta Harnecker", year: 2005}

  - id: nationalism.three-principles
    regions: [China, Taiwan]
    self: >-
      Nationalism, democracy and the people's livelihood: these three principles will save
      China. The dynasty sold China to the foreign powers until it became worse than a colony,
      a hypo-colony, the slave of many masters at once. First, the nation must be free and all
      its peoples equal. Second, the people must hold sovereignty, through a government of
      five powers that adds examination and control to the Western three. Third, the people's
      livelihood: equalize land rights so that the rising value of land goes to society, and
      regulate capital so that private monopolies cannot control the people's living. China
      will be strong when its people are united, sovereign and fed.
    record:
      - date: "1905-1912"
        text: >-
          Sun Yat-sen founded the Tongmenghui in Tokyo (1905); the 1911 revolution ended the
          Qing dynasty, and Sun became provisional president of the Republic before ceding
          office to Yuan Shikai.
      - date: 1924
        text: >-
          The reorganized Kuomintang allied with the Soviet Union and the Communists in the First
          United Front and founded the Whampoa Military Academy.
      - date: 1927
        text: >-
          Chiang Kai-shek's forces and allied gangs killed communists and trade unionists in
          Shanghai, ending the United Front and founding the Nanjing government.
      - date: "1947-1987"
        text: >-
          After the February 28 Incident (1947) in Taiwan, in which troops killed thousands of
          Taiwanese, the KMT ruled the island under martial law until 1987.
      - date: "1949-1953"
        text: >-
          In Taiwan the KMT carried out a land reform, capping rents at 37.5 percent of the crop
          and buying out landlords under the Land-to-the-Tiller Act (1953), as Sun's program
          prescribed and it had not done on the mainland.
      - date: 1940
        text: >-
          Mao's On New Democracy endorsed the 'revolutionary Three Principles' of 1924, and the
          People's Republic still honours Sun as a forerunner.
    descendsFrom:
      - {id: libertarianism.georgist, event: "Sun's adoption of Henry George's land-value tax in the livelihood principle", date: 1905}
      - {id: nationalism.civic, event: "Republican revolution against the Qing", date: 1911}
    breaksWith:
      - {id: marxism.ml, event: "Chiang's purge of the Communists ending the First United Front", date: 1927}
    analysis:
      conditions: >-
        China under unequal treaties, foreign concessions and foreign control of customs
        revenue, followed after 1916 by warlord rule. Overseas Chinese merchants funded Sun's
        movement.
      class_base: >-
        Overseas merchants, the treaty-port bourgeoisie, students and New Army officers. Later
        the KMT on the mainland rested on landlords, Shanghai banking and the army, which is why
        it did not carry out land reform there; in Taiwan the landlords were Taiwanese, not part
        of the KMT's own base, so reform cost it little.
      function: >-
        It is the founding ideology of the Republic of China on Taiwan and is claimed by Beijing
        as a forerunner. Taiwan's industrial rise combined land reform, state banks and export
        orientation under US protection, with US aid and market access granted for Cold War
        reasons.
      disputed: >-
        Mao (On New Democracy, 1940) distinguished the revolutionary Three Principles from the
        KMT's practice and classed the Chiang government as the party of the big landlord and
        comprador classes; KMT historians present it as a national government under invasion
        and civil war.
    keyTexts:
      - {author: Sun Yat-sen, title: The Three Principles of the People, year: 1924}
      - {author: Sun Yat-sen, title: Fundamentals of National Reconstruction, year: 1924}
      - {author: Chiang Kai-shek, title: "China's Destiny", year: 1943}

  - id: nationalism.developmental-state
    regions: [South Korea, Taiwan, Japan, Singapore, East Asia]
    self: >-
      A nation that arrives late cannot leave its fate to the market or to foreign advisers.
      We had no resources, a land ruined by war and a powerful enemy across the border. So the
      state set national goals, steered credit through its banks to the industries that
      mattered, steel, ships, chemicals, cars and semiconductors, held firms to export
      targets, and invested in land reform, schooling and infrastructure. Within a generation
      we went from aid recipient to industrial power. This is economic nationalism: the market
      as an instrument of the nation, the bureaucracy as its general staff, and hard work and
      saving as patriotic duty. Catch up, or be dominated.
    record:
      - date: "1946-1953"
        text: >-
          Land reforms in Japan under US occupation, and in South Korea and Taiwan, broke
          landlord power and created smallholding peasantries.
      - date: 1961
        text: >-
          Park Chung-hee's military coup in South Korea set up the Economic Planning Board,
          brought the banks under state control and began five-year plans with export targets
          (1962); the heavy and chemical industry drive followed in 1973.
      - date: "1964-1973"
        text: >-
          South Korea sent about 320,000 troops to the Vietnam War and received US payments and
          procurement contracts that financed industrialization.
      - date: "1970-1987"
        text: >-
          Labor was held down by law and force: the garment worker Jeon Tae-il burned himself to
          death in 1970 protesting sweatshop conditions; the 1972 Yushin constitution gave Park
          indefinite rule; in 1980 the army killed protesters in Gwangju (official count about
          200, other estimates over 600). The 1987 uprising and strike wave won direct elections
          and independent unions.
      - date: 1987
        text: >-
          Taiwan's government founded TSMC with state capital, which became the world's largest
          contract chipmaker.
      - date: 1997
        disputed: true
        text: >-
          In the Asian financial crisis South Korea took a US$57 billion IMF-led package tied to
          capital-account opening and chaebol restructuring. The IMF blamed crony capitalism;
          Ha-Joon Chang and Robert Wade blamed premature financial liberalization.
    descendsFrom:
      - {id: nationalism.three-principles, event: "KMT state planning and land reform in Taiwan", date: 1949}
    breaksWith:
      - {id: liberalism.classical, event: "Friedrich List's national system against Smithian free trade, taken as model", date: 1841}
    analysis:
      conditions: >-
        Cold War frontline states with US aid, a US security guarantee and access to the US
        market; land reforms pressed by the example of communist reform in North Korea and
        China; and infrastructure and bureaucracy left by Japanese colonial rule.
      class_base: >-
        A military-bureaucratic state that created chaebol capital through directed credit, a
        smallholding peasantry made by land reform, and workers who paid with long hours and
        suppressed unions until 1987.
      function: >-
        It is the clearest case of semi-peripheral catch-up by suspending market allocation in
        finance: directed credit and capital controls kept surplus at home instead of letting
        it drain out. The United States permitted it because it needed showcase allies. Once
        firms such as Samsung and TSMC joined the core, they in turn draw value from lower-wage
        suppliers elsewhere in Asia. It now informs industrial policy debates everywhere.
      disputed: >-
        The World Bank's East Asian Miracle (1993) credited market-friendly policy; Chang
        (Kicking Away the Ladder, 2002) and Amsden credited state direction. Amin's followers
        question whether it can be repeated without Cold War sponsorship.
    keyTexts:
      - {author: Friedrich List, title: The National System of Political Economy, year: 1841}
      - {author: Chalmers Johnson, title: MITI and the Japanese Miracle, year: 1982}
      - {author: Alice H. Amsden, title: "Asia's Next Giant: South Korea and Late Industrialization", year: 1989}
      - {author: Robert Wade, title: Governing the Market, year: 1990}

  - id: nationalism.gandhian
    regions: [India, South Africa, worldwide]
    self: >-
      Swaraj is self-rule, and it begins in the self. The English did not take India; we gave
      it to them by embracing their civilization of machines, lawyers and greed. Real
      independence means villages that govern themselves and spin their own cloth, a nation
      that needs no empire because it wants no luxury, and a politics of satyagraha, truth-
      force, that defeats injustice by suffering it without hatred, never by inflicting it.
      The means are the end in the making. Non-violence is the law of our species. The earth
      provides enough for every man's need, not every man's greed. Sarvodaya, the welfare of
      all, begins with the last person.
    record:
      - date: "1906-1914"
        disputed: true
        text: >-
          Gandhi led satyagraha campaigns against registration and pass laws for Indians in South
          Africa. His writings of that period also used racial language about Black Africans
          (documented by Desai and Vahed, The South African Gandhi, 2015); defenders say his
          views changed, critics that they shaped his politics there.
      - date: "1920-1922"
        text: >-
          The Non-cooperation Movement boycotted British goods, courts and schools; Gandhi
          suspended it after protesters killed policemen at Chauri Chaura.
      - date: 1930
        text: >-
          The Salt March opened the Civil Disobedience Movement; tens of thousands were jailed.
      - date: 1932
        disputed: true
        text: >-
          Gandhi fasted against separate electorates for the Depressed Classes; the Poona Pact
          replaced them with reserved seats in joint electorates. Gandhians read it as keeping
          Hindu society united and winning more seats for Dalits; Ambedkar called it coercion
          that left Dalit representatives dependent on caste-Hindu votes.
      - date: 1942
        text: >-
          The Quit India movement led to the arrest of the Congress leadership and tens of
          thousands of others.
      - date: "1947-1948"
        text: >-
          Gandhi fasted against Partition violence in Calcutta and Delhi and was assassinated on
          30 January 1948 by Nathuram Godse, a Hindu nationalist who blamed him for concessions
          to Muslims and Pakistan.
      - date: 1951
        text: >-
          Vinoba Bhave's Bhoodan movement collected pledges of over four million acres of land
          for the landless; a minority of it was ever distributed.
    descendsFrom:
      - {id: anarchism.christian, event: "Correspondence with Tolstoy and the founding of Tolstoy Farm", date: 1910}
    breaksWith:
      - {id: liberalism.classical, event: "Hind Swaraj rejects Western parliamentary and industrial civilization", date: 1909}
    analysis:
      conditions: >-
        British machine textiles had ruined Indian handloom weaving, land revenue squeezed
        peasants, and famines recurred. Khadi and the boycott struck at the import of
        Lancashire cloth, the core of the colonial trade relation.
      class_base: >-
        The movement joined peasants, artisans and the urban middle classes, and was financed
        by Indian industrialists such as G. D. Birla and Jamnalal Bajaj, who gained from the
        boycott of British goods. Non-violence and restraint of peasant movements against
        Indian landlords kept this cross-class coalition together.
      function: >-
        Gandhian non-cooperation was among the most effective anti-colonial mobilizations and
        reduced the drain by cutting British sales and revenue. Its doctrine of trusteeship,
        owners as trustees of their wealth, protected Indian property owners from class
        struggle, so independence passed power to an alliance of Indian capital and landed
        interests. Today its methods inform non-violent movements worldwide and its village
        economics inform ecological thought.
      disputed: >-
        R. Palme Dutt (India To-day, 1940) and E. M. S. Namboodiripad read Gandhi as the leader
        of the national bourgeoisie; Subaltern Studies historians such as Partha Chatterjee
        read his politics as peasant-centred and irreducible to class. Ambedkarites contest it
        on caste.
    keyTexts:
      - {author: M. K. Gandhi, title: Hind Swaraj, year: 1909}
      - {author: M. K. Gandhi, title: "An Autobiography, or The Story of My Experiments with Truth", year: 1927}
      - {author: M. K. Gandhi, title: Constructive Programme, year: 1941}
      - {author: J. C. Kumarappa, title: Economy of Permanence, year: 1945}

  - id: nationalism.ambedkarite
    regions: [India, Nepal, South Asian diaspora]
    self: >-
      Caste is not a division of labor; it is a division of laborers, graded one above the
      other, sanctioned by scripture and enforced by violence. No nation can be built on it,
      and swaraj means nothing to the untouchable if it hands power to his oppressors.
      Educate, agitate, organize. We burned the Manusmriti at Mahad, wrote a constitution that
      abolishes untouchability, won reservations as the price of a common citizenship, and
      left Hinduism for the Buddha's path of liberty, equality and fraternity. Political
      democracy cannot last unless social democracy lies beneath it. We seek the annihilation
      of caste, not its reform.
    record:
      - date: 1927
        text: >-
          Ambedkar led the Mahad satyagraha for Dalit access to a public tank and publicly burned
          the Manusmriti on 25 December.
      - date: 1932
        disputed: true
        text: >-
          The Poona Pact replaced the separate electorates granted to the Depressed Classes with
          reserved seats in joint electorates after Gandhi's fast. Ambedkarites hold it was
          extracted under duress and left Dalit legislators answerable to caste-Hindu voters;
          Gandhians hold it preserved Hindu unity and doubled reserved seats.
      - date: 1936
        text: >-
          Ambedkar wrote Annihilation of Caste and founded the Independent Labour Party for
          workers and Dalits.
      - date: "1947-1951"
        text: >-
          As chair of the Drafting Committee he shaped the constitution, which abolished
          untouchability (Article 17) and provided reservations in legislatures, education and
          public employment; he resigned as law minister in 1951 when the Hindu Code Bill
          stalled.
      - date: 1956
        text: >-
          Ambedkar converted to Buddhism at Nagpur with several hundred thousand followers, weeks
          before his death.
      - date: "1972-2012"
        text: >-
          The Dalit Panthers formed in Maharashtra (1972); Kanshi Ram founded the Bahujan Samaj
          Party (1984), and Mayawati served four times as chief minister of Uttar Pradesh.
    descendsFrom:
      - {id: liberalism.social, event: "Ambedkar's study under John Dewey at Columbia", date: 1915}
    breaksWith:
      - {id: nationalism.gandhian, event: "Poona Pact and the dispute over separate electorates", date: 1932}
      - {id: marxism.ml, event: "Ambedkar's critique of the Communists in 'Buddha or Karl Marx'", date: 1956}
    analysis:
      conditions: >-
        Caste bound Dalits to forced, degraded and unpaid labor, kept them landless and barred
        them from wells, temples and schools. Colonial census and electoral reform opened
        space to claim separate political representation.
      class_base: >-
        Dalit agricultural laborers and urban workers, and a growing educated Dalit middle
        class produced by reservations, whose position depends on the constitutional state and
        public employment.
      function: >-
        Caste segments the Indian labor force so that the most degraded work (manual
        scavenging, agricultural labor) is done at the lowest wages; contesting caste raises the
        floor of the whole labor market. Reservations apply only to the public sector, and
        since liberalization in 1991 public employment has shrunk while jobs moved to the
        private sector, weakening the movement's main lever.
      disputed: >-
        Class-first Marxists hold that caste will dissolve through class struggle; Anand
        Teltumbde (Republic of Caste, 2018) argues it must be fought directly as part of class
        struggle; many Ambedkarites reject Marxism altogether.
    keyTexts:
      - {author: Jotirao Phule, title: Gulamgiri, year: 1873}
      - {author: B. R. Ambedkar, title: Annihilation of Caste, year: 1936}
      - {author: B. R. Ambedkar, title: What Congress and Gandhi Have Done to the Untouchables, year: 1945}
      - {author: B. R. Ambedkar, title: The Buddha and His Dhamma, year: 1957}

  - id: nationalism.hindutva
    regions: [India, Indian diaspora]
    self: >-
      Hindutva is not a religion but the essence of a civilization: the nation of all who
      regard Bharat as both fatherland and holy land. For a thousand years this nation was
      invaded, its temples broken, its people divided by caste, region and language, and at
      last it was partitioned on the basis of religion. We organize Hindu society so that it
      never again stands divided and humiliated. Through daily discipline in the shakha,
      service in floods and famines, and cultural renewal, we seek a strong, self-reliant
      India that honours its own heritage, treats all citizens equally without appeasing
      anyone, and takes its place as a teacher to the world.
    record:
      - date: "1923-1925"
        text: >-
          V. D. Savarkar's Essentials of Hindutva defined the nation (1923); K. B. Hedgewar
          founded the Rashtriya Swayamsevak Sangh in Nagpur (1925).
      - date: 1948
        disputed: true
        text: >-
          The RSS was banned after Nathuram Godse assassinated Gandhi and the ban was lifted in
          1949. The RSS says Godse had left it; his brother Gopal Godse said he never did.
      - date: 1992
        text: >-
          On 6 December, kar sevaks mobilized by the VHP and BJP demolished the Babri Masjid in
          Ayodhya; around 2,000 people died in the riots that followed. A court acquitted all
          accused leaders in 2020; the Supreme Court (2019) awarded the site for a temple while
          calling the demolition an egregious violation of the rule of law, and the temple was
          consecrated in 2024.
      - date: 2002
        disputed: true
        text: >-
          In Gujarat, under Chief Minister Narendra Modi, communal violence killed over 1,000
          people by official count (others estimate around 2,000), most of them Muslims. A
          Supreme Court-appointed investigation found no prosecutable evidence against Modi
          (upheld in 2022); critics hold the state government complicit.
      - date: "2014-2024"
        text: >-
          The BJP won national majorities in 2014 and 2019 and led a coalition after 2024. Its
          governments extended bank accounts, cooking-gas connections and household toilets to
          hundreds of millions, revoked Jammu and Kashmir's autonomy (2019), passed the
          Citizenship Amendment Act (2019) and consolidated labor laws in four codes (2019-2020).
    descendsFrom:
      - {id: nationalism.ethnic, event: "Savarkar's Essentials of Hindutva", date: 1923}
    breaksWith:
      - {id: nationalism.gandhian, event: "Hedgewar leaves Congress politics to found the RSS", date: 1925}
    analysis:
      conditions: >-
        The colonial census sorted Indians by religion, separate electorates (1909) and the
        Muslim League followed, and riots recurred. The Ram temple campaign surged in 1990, the
        year lower-caste reservations under the Mandal Commission were implemented; Hindu unity
        offered upper castes a way to absorb lower-caste mobilization into a religious majority
        and turn conflict toward Muslims.
      class_base: >-
        Historically upper-caste urban traders and professionals; under the BJP extended to
        backward castes and Dalits through welfare and Hindu identity; since 2014 backed by
        large Indian capital (the Adani and Ambani groups among others) that gained from
        infrastructure contracts and privatization.
      function: >-
        In semi-peripheral India it joins integration into global capital (eased foreign
        investment, labor codes that raised the threshold for layoffs without permission from
        100 to 300 workers) with Hindu majoritarianism. Religious polarization divides workers
        and peasants along religious lines, which weakens their bargaining against employers
        and landlords.
      disputed: >-
        Some Indian Marxists (Aijaz Ahmad) call it a form of fascism, citing early leaders'
        admiration of Mussolini; its adherents and many political scientists call it a
        conservative cultural nationalism. Materialists also divide over whether it represents
        national capital or big capital tied to foreign investors.
    keyTexts:
      - {author: V. D. Savarkar, title: Essentials of Hindutva, year: 1923}
      - {author: M. S. Golwalkar, title: We or Our Nationhood Defined, year: 1939, note: "Later disowned by the RSS as not representing its views"}
      - {author: Deendayal Upadhyaya, title: Integral Humanism, year: 1965}
      - {author: M. S. Golwalkar, title: Bunch of Thoughts, year: 1966}

  - id: nationalism.indigenous-sovereignty
    regions: [North America, Australia, Aotearoa New Zealand, Latin America, Arctic, worldwide]
    self: >-
      We are nations, not minorities. Our peoples governed these lands under our own laws for
      thousands of years before any settler state existed, and we never surrendered our
      sovereignty: we signed treaties as nations, and those treaties were broken. Our relation
      to land is not ownership but kinship and responsibility, to the generations behind us
      and the seven generations ahead. We demand recognition of our self-government, the
      return of stolen land, free, prior and informed consent over anything done on our
      territories, and the right to live, speak, worship and raise our children as who we are.
      Water is life. Land back.
    record:
      - date: "1968-1973"
        text: >-
          The American Indian Movement was founded (1968); Indigenous activists occupied
          Alcatraz (1969-1971) and held Wounded Knee for 71 days (1973).
      - date: 1969
        text: >-
          First Nations organizations defeated the Canadian government's White Paper, which
          proposed to abolish Indian status and treaty relations.
      - date: "1972-1992"
        text: >-
          The Aboriginal Tent Embassy was set up in Canberra (1972); the High Court's Mabo
          decision (1992) rejected the doctrine that Australia had been no one's land. A 2023
          referendum on an Indigenous Voice to Parliament failed, about 60 to 40.
      - date: 2007
        text: >-
          The UN General Assembly adopted the Declaration on the Rights of Indigenous Peoples;
          Canada, Australia, New Zealand and the United States voted against and later endorsed
          it.
      - date: "2016-2017"
        text: >-
          The Standing Rock Sioux and allies blockaded construction of the Dakota Access
          Pipeline; police and private security cleared the camps and the pipeline was built.
      - date: 2020
        text: >-
          The US Supreme Court held in McGirt v. Oklahoma that the Muscogee (Creek) reservation
          had never been disestablished for purposes of federal criminal law.
    descendsFrom: []
    breaksWith:
      - {id: liberalism.social, event: "Rejection of Canada's assimilationist White Paper", date: 1969}
      - {id: marxism.classical, event: "Russell Means's speech rejecting Marxism as a European tradition", date: 1980}
    analysis:
      conditions: >-
        Settler states took land by war, broken treaty and allotment (the US Dawes Act of
        1887), removed children to residential and boarding schools, and opened Indigenous land
        to mining, oil, dams and pipelines.
      class_base: >-
        Indigenous communities as nations: reservation and reserve residents, many poor, wage
        workers and peasants in Latin America, with tribal governments and a professional
        stratum. Revenue from tribal enterprises and resource royalties forms a governing layer
        whose interests can diverge from those of members.
      function: >-
        Land claims and consent requirements raise the cost of resource access for extractive
        capital, which is why they draw police and corporate security, as at Standing Rock. The
        frame reads settler colonialism as an ongoing structure. In much of Latin America
        Indigenous peoples are the peasantry of the periphery, so their land struggles are at
        once national and agrarian.
      disputed: >-
        Glen Coulthard argues that recognition within settler states incorporates rather than
        liberates; Marxists in Mariátegui's line treat the Indigenous question as an agrarian
        and class question, while others treat it as a distinct national one.
    keyTexts:
      - {author: Vine Deloria Jr., title: Custer Died for Your Sins, year: 1969}
      - {author: George Manuel and Michael Posluns, title: "The Fourth World: An Indian Reality", year: 1974}
      - {author: Linda Tuhiwai Smith, title: Decolonizing Methodologies, year: 1999}
      - {author: Glen Sean Coulthard, title: "Red Skin, White Masks", year: 2014}

  - id: nationalism.decolonial
    regions: [Latin America, Andes, worldwide]
    self: >-
      There is no modernity without coloniality. The world order born in 1492 classified
      humanity by race, placed Europe at the centre of history and knowledge, and divided the
      world's labor accordingly: wages for whites, servitude and slavery for the rest.
      Political independence did not end this; the coloniality of power persists in our
      states, economies, universities and minds. To decolonize is to delink from the
      Eurocentric matrix, including its liberal and Marxist versions, and to recover the
      knowledges and ways of life colonialism tried to erase: buen vivir, sumak kawsay, the
      pluriverse. Not one world, but a world in which many worlds fit.
    record:
      - date: 1992
        text: >-
          Indigenous movements across the Americas organized counter-commemorations of the
          Quincentenary; Aníbal Quijano published Colonialidad y modernidad/racionalidad.
      - date: "1998-2007"
        text: >-
          The modernity/coloniality group, including Quijano, Walter Mignolo, Enrique Dussel,
          Catherine Walsh, Arturo Escobar, María Lugones and Nelson Maldonado-Torres, developed
          the program in a series of meetings and publications.
      - date: "2008-2009"
        text: >-
          Ecuador's constitution recognized the rights of nature and sumak kawsay; Bolivia's
          made it a plurinational state with vivir bien as a principle.
      - date: 2011
        text: >-
          In Bolivia, Indigenous marchers opposed the Morales government's road through the
          TIPNIS reserve; the government cited development needs, the marchers their right to
          consent.
      - date: 2015
        text: >-
          Rhodes Must Fall in Cape Town removed a statue of Cecil Rhodes and launched campaigns
          to decolonize university curricula in South Africa and Britain.
    descendsFrom:
      - {id: marxism.mariategui, event: "Mariátegui's treatment of the Indigenous question", date: 1928}
      - {id: marxism.dependency, event: "Quijano's work within dependency theory", date: "1970s"}
    breaksWith:
      - {id: marxism.classical, event: "Mignolo's call to delink from Marxism as a Eurocentric universal", date: 2007}
    analysis:
      conditions: >-
        The defeat of Latin American revolutionary movements and the debt crisis exhausted the
        politics of the 1970s, while Indigenous movements rose (Ecuador's 1990 uprising, the
        Zapatistas in 1994, Bolivia's water war in 2000) and universities expanded in the South
        and in US area studies.
      class_base: >-
        In movement, Indigenous and Afro-descendant peasants and communities; as theory, an
        academic stratum in US and Latin American universities, through which it circulates
        by hiring, translation and curriculum more than through peasant organizations.
      function: >-
        It shares the frame's view of the world economy as one system built on a colonial
        division of labor. Where it stresses delinking in knowledge over delinking in
        production and trade, universities and NGOs can absorb it as curricular reform without
        touching property or terms of trade. Where it backs Indigenous land and anti-extraction
        struggles, it contests the drain directly.
      disputed: >-
        Vivek Chibber (Postcolonial Theory and the Specter of Capital, 2013) argues that such
        culturalism displaces class; decolonial writers answer that Marxism shares Europe's
        linear history. Samir Amin criticized Eurocentrism (1988) from within Marxism.
    keyTexts:
      - {author: Enrique Dussel, title: Philosophy of Liberation, year: 1977}
      - {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000}
      - {author: Walter D. Mignolo, title: Local Histories/Global Designs, year: 2000}
      - {author: Arturo Escobar, title: Designs for the Pluriverse, year: 2018}

  - id: nationalism.zionism-labor
    regions: [Israel, Palestine, Jewish diaspora]
    self: >-
      The Jewish people, persecuted for centuries in exile and murdered in pogroms, needed what
      every people needs: a homeland, and the dignity of working its own land. We came not as
      colonial masters living off native labor but to redeem the land with our own hands, to
      turn shopkeepers and scholars into farmers and workers. We built the kibbutz and the
      moshav, the Histadrut and Hebrew labor, a socialist commonwealth in the making. After
      the Holocaust we won the State of Israel in a war against armies that sought to destroy
      it, took in hundreds of thousands of refugees from Europe and the Arab world, and made
      the desert bloom.
    record:
      - date: "1910-1920"
        text: >-
          Degania, the first kibbutz, was founded (1910); the Histadrut labor federation was
          founded (1920) and campaigned for 'Hebrew labor', excluding Arab workers from Jewish
          enterprises.
      - date: 1948
        disputed: true
        text: >-
          Israel declared independence on 14 May and fought Palestinian forces and Arab armies;
          about 700,000 to 750,000 Palestinians fled or were expelled, and the 1950 Absentees'
          Property Law transferred their land to the state. The traditional Israeli account says
          most left in the chaos of war or at Arab leaders' urging; Benny Morris documented
          expulsions in many places; Palestinian historians and Ilan Pappé describe a planned
          ethnic cleansing.
      - date: "1948-1966"
        text: >-
          Palestinian citizens of Israel lived under military government, with permits required
          to travel and much of their land expropriated.
      - date: "1948-1960s"
        text: >-
          Jews from Arab countries and Iran arrived in large numbers and were housed in transit
          camps and development towns, with less access to land and office than the Ashkenazi
          founders.
      - date: 1967
        text: >-
          Under a Labor-led government Israel occupied the West Bank, Gaza, the Golan and Sinai;
          the first settlements were built under Labor.
      - date: "1977-1995"
        text: >-
          Labor lost power to Likud for the first time in 1977. Yitzhak Rabin signed the Oslo
          Accords (1993) and was assassinated in 1995 by a religious-nationalist opponent of the
          accords.
    descendsFrom:
      - {id: marxism.classical, event: "Ber Borochov's Poale Zion synthesis of Marxism and Zionism", date: 1906}
    breaksWith:
      - {id: nationalism.zionism-revisionist, event: "Jabotinsky leaves the Zionist executive and founds the Revisionist movement", date: 1925}
    analysis:
      conditions: >-
        Pogroms and exclusion in the Russian Empire drove Jewish emigration; Britain sponsored a
        Jewish national home (Balfour, 1917; the Mandate) in a Palestine with an Arab peasant
        majority. The Jewish National Fund bought land from absentee landlords, often
        displacing tenant farmers, and Hebrew labor created a separate Jewish labor market
        protected from lower Arab wages.
      class_base: >-
        Jewish immigrant workers and settlers organized through the Histadrut, which was also a
        major employer, and the kibbutz movement; later the Ashkenazi middle class and the
        state elite.
      function: >-
        The frame reads it as a settler-colonial project in the periphery, the oppressor-nation
        case, whose labor institutions protected Jewish workers by excluding Arab ones. Israel
        today receives about US$3.8 billion a year in US military aid and serves as a US
        strategic partner in the region. The Labor party has collapsed electorally, but the
        state institutions it built remain.
      disputed: >-
        Labor Zionists and many liberals hold Zionism to be the national liberation of a
        persecuted people; Maxime Rodinson (Israel: A Colonial-Settler State?, 1973) and
        Palestinian scholars read it as settler colonialism. Gershon Shafir (1989) reads Hebrew
        labor as ethnic exclusion rather than socialism.
    keyTexts:
      - {author: Theodor Herzl, title: The Jewish State, year: 1896}
      - {author: Ber Borochov, title: Our Platform, year: 1906}
      - {author: David Ben-Gurion, title: Rebirth and Destiny of Israel, year: 1954}

  - id: nationalism.zionism-revisionist
    regions: [Israel, Palestine, Jewish diaspora]
    self: >-
      The Jewish people has a right to the whole of its historic homeland and a duty to defend
      it by its own strength. No people has ever given up its land willingly to another; the
      Arabs of this land will make peace with us only when they face an iron wall they cannot
      breach. Not class struggle but one aim, the Jewish state, served by a disciplined
      national movement, free enterprise and military readiness. We drove out the British,
      gave the forgotten Jews of the East their due, and built a strong, proud Israel that does
      not apologize for existing or for defending itself.
    record:
      - date: "1923-1925"
        text: >-
          Ze'ev Jabotinsky's essay The Iron Wall argued that Arab acceptance would come only
          through Jewish military strength; he founded the Revisionist movement in 1925 and the
          Betar youth movement.
      - date: "1944-1948"
        text: >-
          The Irgun, under Menachem Begin, fought the British; its bombing of the King David
          Hotel (1946) killed 91. In April 1948 Irgun and Lehi fighters killed over 100
          villagers at Deir Yassin.
      - date: "1977-1982"
        text: >-
          Likud under Begin won power with strong Mizrahi support, made peace with Egypt and
          returned Sinai (1979), and expanded West Bank settlement. In 1982 Israel invaded
          Lebanon; Lebanese Phalangists killed hundreds to thousands of Palestinians at Sabra and
          Shatila, and the Kahan Commission found Defense Minister Ariel Sharon indirectly
          responsible.
      - date: 2018
        text: >-
          A Likud-led government passed the Nation-State Basic Law defining Israel as the nation-
          state of the Jewish people and settlement as a national value.
      - date: 2024
        text: >-
          The International Court of Justice advised that Israel's occupation of Palestinian
          territory is unlawful; Israel rejected the opinion.
      - date: "2023-2025"
        disputed: true
        text: >-
          After the Hamas-led attack of 7 October 2023 killed about 1,200 people in Israel, the
          Netanyahu government's war in Gaza killed over 65,000 Palestinians by the October
          2025 ceasefire, according to Gaza's Health Ministry, whose figures Israel disputes.
          South Africa and a UN commission of inquiry (2025) called it genocide; Israel and the
          United States reject the charge and call it self-defence against Hamas.
    descendsFrom:
      - {id: nationalism.ethnic, event: "Jabotinsky's integral nationalism", date: 1923}
    breaksWith:
      - {id: nationalism.zionism-labor, event: "Break with the Labor-led Zionist Organization; New Zionist Organization founded", date: 1935}
    analysis:
      conditions: >-
        The Mandate after the clashes of 1921 and 1929, and the crisis of Central European
        Jewish middle classes in the 1930s; later the resentment of Mizrahi immigrants against
        Labor's patronage system, which carried Likud to power in 1977.
      class_base: >-
        Originally the Central European Jewish middle class and youth; from 1977 Mizrahi
        working and lower-middle classes, small business and settlers; since the 1985
        stabilization plan and the privatizations that followed, much of Israeli capital.
      function: >-
        The frame reads it as oppressor-nation nationalism in a settler-colonial setting.
        Settlement in the West Bank transfers land and water to settlers and Israeli firms, and
        Palestinian workers serve as a reserve of labor entering Israel by permit, cut off by
        closure at will. US military support underwrites it.
      disputed: >-
        Its adherents hold that settlement is a return to Judea and Samaria and a security
        need; Palestinians, most states and the ICJ (2024) hold the occupation and settlements
        unlawful.
    keyTexts:
      - {author: Ze'ev Jabotinsky, title: The Iron Wall, year: 1923}
      - {author: Menachem Begin, title: The Revolt, year: 1951}
      - {author: Benjamin Netanyahu, title: A Place Among the Nations, year: 1993}

  - id: nationalism.palestinian
    regions: [Palestine, Jordan, Lebanon, Syria, Palestinian diaspora]
    self: >-
      We are the people of Palestine, Muslims and Christians rooted in this land for
      generations, driven from our homes in 1948 and living since then under occupation,
      siege or in exile. We never stopped being a people. We demand what every people is owed:
      the return of the refugees, self-determination, and an independent state with Jerusalem
      as its capital, or, as many of us now say, equal rights in one democratic state between
      the river and the sea. We have resisted by every means a people under occupation has:
      the strike, the stone, the boycott, the rifle and the poem. Sumud, steadfastness, is our
      answer.
    record:
      - date: "1936-1939"
        text: >-
          The Arab Revolt began with a six-month general strike; British forces suppressed it,
          killing several thousand Palestinians.
      - date: 1948
        text: >-
          In the Nakba about 700,000 to 750,000 Palestinians fled or were expelled and over 400
          villages were depopulated; UN General Assembly Resolution 194 said refugees wishing to
          return should be permitted to do so.
      - date: "1964-1974"
        text: >-
          The PLO was founded (1964); Fatah took it over under Yasser Arafat (1969). Fighting
          with Jordan in Black September (1970) drove the PLO to Lebanon; the Black September
          group killed eleven Israeli athletes at Munich (1972); the UN recognized the PLO as the
          Palestinians' representative (1974).
      - date: "1987-1993"
        text: >-
          The First Intifada mobilized strikes, boycotts, popular committees and stone-throwing
          youth across the occupied territories.
      - date: "1993-2007"
        text: >-
          In the Oslo Accords the PLO recognized Israel and a Palestinian Authority was created
          (1994) while settlements grew. The Second Intifada (2000) brought suicide bombings by
          Hamas and other groups and Israeli reoccupation of West Bank cities. Hamas won the
          2006 legislative elections and took Gaza in 2007, which Israel and Egypt then placed
          under blockade.
      - date: "2023-2025"
        text: >-
          The Hamas-led attack of 7 October 2023 killed about 1,200 people in Israel and took
          about 250 hostages; Israel's war in Gaza that followed killed tens of thousands and
          displaced most of the population before the October 2025 ceasefire.
    descendsFrom:
      - {id: nationalism.nasserism, event: "Arab nationalist movement and Egypt's sponsorship of the PLO", date: 1964}
    breaksWith:
      - {id: nationalism.nasserism, event: "Fatah's turn to independent Palestinian action after the 1967 defeat", date: 1967}
      - {id: religious.islamism-brotherhood, event: "Hamas-Fatah split and Hamas's takeover of Gaza", date: 2007}
    analysis:
      conditions: >-
        British Mandate rule and land purchases that displaced tenant farmers; the
        dispossession of 1948; refugee camps in Lebanon, Jordan and Syria; and occupation since
        1967 with land confiscation and settlement.
      class_base: >-
        Landed notable families led before 1948 while peasants did most of the fighting; after
        1948, refugees and camp populations, students and a diaspora professional class funded
        by Gulf earnings. Under Oslo the Palestinian Authority created a salaried bureaucracy
        and security forces dependent on donor aid and on tax revenues that Israel collects and
        can withhold.
      function: >-
        The frame treats it as the clearest oppressed-nation case of the present; its
        struggle cuts across US regional strategy and the Gulf states' normalization with
        Israel (the Abraham Accords, 2020). Inside it, the Authority's security coordination
        with Israel functions as a comprador layer whose income depends on keeping order;
        Hamas and the left factions reject that coordination.
      disputed: >-
        Many Palestinian leftists call the Authority comprador; Fatah calls it a constrained
        state in formation. Whether armed attacks on civilians can ever be legitimate
        resistance divides Palestinians and is rejected by most states; one state versus two
        divides the movement.
    keyTexts:
      - {author: Palestine National Council, title: Palestinian National Charter, year: 1968}
      - {author: Ghassan Kanafani, title: "The 1936-39 Revolt in Palestine", year: 1972}
      - {author: Edward W. Said, title: The Question of Palestine, year: 1979}
      - {author: Rashid Khalidi, title: "The Iron Cage: The Story of the Palestinian Struggle for Statehood", year: 2006}

  - id: nationalism.eurasianism
    regions: [Russia, Central Asia]
    self: >-
      Russia is not a European nation that failed but a distinct civilization, Eurasia, heir
      of Byzantium and the steppe, Orthodox and many-peopled, with its own destiny. History is
      a struggle between land power and sea power, between tradition and liberal
      postmodernity, between a multipolar world and the unipolar rule of the Atlantic West.
      Liberalism dissolves every people into consumers and every value into a price. We defend
      the plurality of civilizations, each with its own values and its own sphere, against the
      universal empire of the dollar and NATO. Russia's mission is to be the pole around which
      a multipolar world can form.
    record:
      - date: 1921
        text: >-
          Russian émigrés including Nikolai Trubetskoy and Pyotr Savitsky published Exodus to
          the East, founding classical Eurasianism.
      - date: 1993
        text: >-
          Aleksandr Dugin co-founded the National Bolshevik Party with Eduard Limonov; he left it
          in 1998.
      - date: 1997
        disputed: true
        text: >-
          Dugin's Foundations of Geopolitics proposed a Russian-led Eurasian bloc. It was reported
          to be used in Russian General Staff Academy teaching; how far it shaped state policy is
          disputed.
      - date: 2014
        text: >-
          After Russia annexed Crimea, Dugin called for intervention across eastern Ukraine and
          left Moscow State University after remarks urging the killing of Ukrainian
          nationalists.
      - date: 2015
        disputed: true
        text: >-
          The Eurasian Economic Union of Russia, Belarus, Kazakhstan, Armenia and Kyrgyzstan took
          effect. Some read it as Eurasianism in policy; others as ordinary regional economic
          integration that borrows the name.
      - date: 2022
        text: >-
          Russia launched its full-scale invasion of Ukraine; Dugin's daughter Darya Dugina was
          killed by a car bomb near Moscow, which Russia blamed on Ukraine.
    descendsFrom:
      - {id: fascism.traditionalist, event: "Dugin's reading of Guénon and Evola", date: "1980s"}
    breaksWith:
      - {id: liberalism.chicago, event: "Opposition to shock therapy and the Yeltsin government in the 1993 crisis", date: 1993}
    analysis:
      conditions: >-
        The collapse of the USSR and shock therapy: output fell by around 40 percent, male life
        expectancy fell below 60 by 1994, and privatization transferred state assets to a few
        owners. NATO's eastward expansion from 1999 supplied the external threat its geopolitics
        describes.
      class_base: >-
        A section of the security services, Orthodox nationalists and intellectuals, and
        state-linked capital in energy and arms whose markets increasingly lie outside the
        West.
      function: >-
        In the world system, Russia's challenge to US-led order raises the cost of NATO
        expansion, and Western sanctions push Russian trade toward China, India and the South.
        Because it replaces class with civilization as the unit of analysis, it leaves Russia's
        concentrated private ownership of oil, gas and metals untouched.
      disputed: >-
        Multipolarist writers read Russia as a semi-peripheral state resisting core
        domination; Boris Kagarlitsky (imprisoned in Russia from 2023) and much of the Ukrainian
        left read it as a regional imperialism that exports capital and annexes territory.
    keyTexts:
      - {author: Nikolai Trubetskoy, title: Europe and Mankind, year: 1920}
      - {author: Pyotr Savitsky and others, title: Exodus to the East, year: 1921}
      - {author: Aleksandr Dugin, title: Foundations of Geopolitics, year: 1997}
      - {author: Aleksandr Dugin, title: The Fourth Political Theory, year: 2009}
