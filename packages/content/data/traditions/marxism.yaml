# Marxisms, part 1: the classical trunk, Leninism and its state lineages,
# Trotskyisms, the lefts, Western Marxism and Gramsci.
# Continued in marxism-b.yaml (Eurocommunism through Arab socialism).
# name/family/parent/era merge from registry/traditions.yaml.
traditions:
  # ------------------------------------------------------------------
  - id: marxism.classical
    regions: [Germany, Austria, Central Europe, Western Europe, Russian Empire]
    self: >-
      We are the party of the working class, organized as a class. Marx and Engels showed that
      capitalism concentrates capital, socializes production and creates, in the proletariat, the
      force that will abolish it. Socialism is no utopia and no conspiracy: it is the outcome of
      development, made conscious and organized. So we build what the class needs in order to rule:
      a mass party with its own press, unions, cooperatives, schools, choirs and sports clubs, and a
      parliamentary group that uses every election to count and educate our forces. We do not make
      the revolution by decree; we prepare the class that will inherit it, and we refuse every war
      between the peoples.
    record:
      - date: 1875
        text: >-
          Lassallean and Eisenach socialists unite at Gotha to form the Socialist Workers' Party of
          Germany; Marx's critique of their programme circulates privately and is published only in 1891.
      - date: 1878–1890
        text: >-
          Under Bismarck's Anti-Socialist Laws the party's organizations and press are banned while its
          deputies may still sit; its vote rises from about 312,000 in 1881 to about 1.4 million in 1890.
      - date: 1889
        text: >-
          The Second International is founded in Paris and calls for international demonstrations for
          the eight-hour day on 1 May 1890.
      - date: 1891
        text: >-
          The SPD's Erfurt Programme joins a Marxist statement of aims, drafted by Kautsky, to immediate
          demands for universal suffrage, the eight-hour day and social insurance, drafted by Bernstein.
      - date: 1912
        text: >-
          The SPD wins 34.8 percent and 110 seats and becomes the largest party in the Reichstag; the
          International's Basel congress pledges its parties to oppose a European war.
      - date: 1914
        disputed: true
        text: >-
          On 4 August the SPD's Reichstag group votes for war credits, as do the French socialists in
          their chamber, and the International stops functioning. The explanation is disputed: Lenin
          blamed a bureaucratized leadership and a labour aristocracy bought with imperial superprofits;
          others hold that the parties followed members who accepted the war as one of national defence.
    breaksWith:
      - {id: anarchism.communist, event: "Expulsion of Bakunin at the Hague congress; anarchists excluded from the Second International at London", date: "1872–1896"}
    analysis:
      conditions: >-
        Rapid industrialization in Germany and western Europe after 1870 gathered workers into large
        plants and dense urban districts, and the gradual widening of manhood suffrage opened legal room
        for mass organization. Long hours, insecurity and exclusion from political rights gave workers
        reasons to join; large workplaces made joining practical. For the first time a party could
        collect votes and dues from millions.
      class_base: >-
        Historically: skilled and semi-skilled industrial workers of core Europe, with a growing layer of
        paid party and union officials and a smaller layer of intellectuals. The officials' livelihood
        depended on the organization's legal survival, which gave them a material interest in avoiding
        confrontations that risked it (Robert Michels's observation from inside the SPD). Today the
        tradition has no mass organization of its own; its readers are mainly academics and members of
        left parties in the core, largely salaried and student strata.
      function: >-
        Its strategy, patient accumulation of votes, members and institutions inside one national state,
        is revived today by neo-Kautskyan currents in the US and European democratic-socialist left. That
        strategy takes the national working class as its unit and leaves the periphery outside its frame.
        In 1914 the limit decided the outcome: organizations built inside the national state followed it
        into war when its imperial position was at stake. The same strategy today can win reforms in the
        core that are funded in part by the drain, without having to account for it.
      disputed: >-
        Whether 1914 expressed a labour aristocracy and bureaucracy (Lenin, Zinoviev) or the pull that
        legal mass organization exerts on any class party (Michels, Carl Schorske); and whether Lenin
        himself was a Kautskyan in strategy (Lars Lih), the reading that underwrites the present
        neo-Kautskyan revival (Eric Blanc).
    keyTexts:
      - {author: Karl Marx, title: "Capital, Volume I", year: 1867}
      - {author: Friedrich Engels, title: "Anti-Dühring", year: 1878}
      - {author: Karl Kautsky, title: "The Class Struggle (Erfurt Program)", year: 1892}
      - {author: Karl Kautsky, title: "The Road to Power", year: 1909}

  # ------------------------------------------------------------------
  - id: marxism.austromarxism
    regions: [Austria, Central Europe]
    self: >-
      We hold to Marx and to democracy at once. Revolution is the goal; the road, where workers can win
      a majority, is the ballot, defended by our own Schutzbund if the bourgeoisie tears up the
      constitution. We studied what orthodoxy ignored: the fusion of banks and industry into finance
      capital, the nations as communities of fate and culture whose rights socialists must guarantee,
      the social function of law. And we built what others only promised: Red Vienna, its light and airy
      council flats, clinics, baths, kindergartens and libraries, paid for by taxing luxury and
      landlords. Socialism begins when the workers build their own culture, not only when they take
      the state.
    record:
      - date: 1907–1910
        text: >-
          Otto Bauer's The Question of Nationalities proposes cultural autonomy for nations as
          associations of persons across territory; Rudolf Hilferding's Finance Capital analyses the
          fusion of bank and industrial capital on which Lenin later drew.
      - date: 1919–1934
        text: >-
          The Social Democratic city government of Vienna builds more than 60,000 municipal flats,
          financed largely by a progressive housing tax and luxury taxes, with clinics, baths,
          kindergartens and libraries.
      - date: 1921
        text: >-
          The party leads the International Working Union of Socialist Parties (the "Two-and-a-Half
          International"), refusing both the Comintern's conditions and the reformist Second
          International; it merges into the Labour and Socialist International in 1923.
      - date: 1926
        text: >-
          The Linz Programme: power is to be won by elections, and a dictatorship of the proletariat is
          envisaged only as defence if the bourgeoisie overthrows the republic.
      - date: 1933–1934
        disputed: true
        text: >-
          Chancellor Dollfuss suspends parliament in March 1933 and bans the Schutzbund; in February 1934
          Schutzbund members resist a police search in Linz, fighting spreads to Vienna, the army defeats
          them in four days, the party is banned and several leaders are executed. Whether the
          leadership's refusal to resist in March 1933 doomed the later rising, or whether resistance
          against army, Heimwehr and an Italian-backed government could not have succeeded at any point,
          is disputed.
    descendsFrom:
      - {id: marxism.classical, event: "Founding of the Marx-Studien series in Vienna", date: 1904}
    breaksWith:
      - {id: marxism.leninism, event: "Refusal to join the Comintern; founding of the Vienna Union", date: 1921}
    analysis:
      conditions: >-
        A multinational empire whose working class was divided by language, so the national question ran
        through the socialist movement itself; then, after 1918, a small republic in which Vienna held
        nearly a third of the population and most of the industry while the countryside voted Catholic
        and conservative. A national majority stayed out of reach while the capital was secure, so the
        party built socialism in one city through municipal taxation and housing.
      class_base: >-
        Vienna's organized industrial and municipal workers, a large union apparatus, and a secular,
        largely Jewish intelligentsia. Today the tradition has no organization of its own. Its legacy
        lives in Vienna's municipal housing, which still houses about a quarter of the city's residents,
        and in the arguments of left social democrats and housing campaigners in core cities.
      function: >-
        Red Vienna is the leading reference case for decommodified housing: public ownership of land and
        flats takes one sector out of the rental market and lowers workers' cost of living without
        touching ownership of production. The model rests on the tax base of a core city, and cities
        whose budgets depend on property-market revenue face the opposite incentive. Bauer's
        national-cultural autonomy remains a reference for multinational states.
      disputed: >-
        Leninists and Trotskyists read Austro-Marxist "slow revolution" as revolutionary words covering
        reformist practice, with February 1934 as its result; defenders say it was the only strategy
        open to a minority class in a peasant country. Lenin and Stalin (1913) rejected Bauer's
        extraterritorial national autonomy as dividing workers by nation.
    keyTexts:
      - {author: Karl Renner, title: "The Institutions of Private Law and Their Social Functions", year: 1904}
      - {author: Otto Bauer, title: "The Question of Nationalities and Social Democracy", year: 1907}
      - {author: Rudolf Hilferding, title: "Finance Capital", year: 1910}
      - {author: Otto Bauer, title: "The Austrian Revolution", year: 1923}

  # ------------------------------------------------------------------
  - id: marxism.leninism
    regions: [Russia, worldwide]
    self: >-
      Capitalism has become imperialism: monopolies, finance capital, the export of capital, and the
      division of the world among great powers whose rivalry ends in war. No vote will stop it. The
      working class needs its own party: disciplined, rooted in the factories, guided by theory, able
      to survive repression and to lead when the crisis comes. The state is a machine of class rule;
      the workers must smash the old one and replace it with their own, on the model of the Paris
      Commune and the soviets. Every oppressed nation has the right to secede. In October 1917 we
      showed that it can be done, and we called on the colonies to rise with us.
    record:
      - date: 1903
        text: >-
          At the Second Congress of the Russian Social Democratic Labour Party the party splits over
          membership rules and the editorial board; Lenin's supporters take the name Bolsheviks.
      - date: 1914–1917
        text: >-
          Lenin calls the war imperialist on both sides and urges turning it into civil war; at
          Zimmerwald (1915) and Kienthal (1916) the Bolsheviks lead the left wing of anti-war socialists.
      - date: 1917
        text: >-
          On 25 October (7 November) the Bolshevik-led Military Revolutionary Committee of the Petrograd
          Soviet takes power; the Congress of Soviets decrees peace and hands landed estates to peasant
          committees.
      - date: 1918
        disputed: true
        text: >-
          The Constituent Assembly, where the Socialist Revolutionaries won a plurality, is dispersed after
          one session. Leninists hold that the soviets were the higher form of popular rule and that the
          SR lists predated the Left SR split; opponents hold that it ended the only nationally elected
          body.
      - date: 1918–1921
        disputed: true
        text: >-
          Civil war against White armies and intervention by more than a dozen foreign states, with mass
          executions on both sides; the Cheka conducts the Red Terror from September 1918, and grain is
          requisitioned under war communism. Supporters call this the price of survival under siege;
          critics, including other socialists and anarchists, see in it the origin of one-party rule.
      - date: 1919–1920
        text: >-
          The Communist International is founded in Moscow; its Second Congress adopts Lenin's theses on
          the national and colonial question, committing communists to support anti-colonial movements.
      - date: 1921
        disputed: true
        text: >-
          Kronstadt sailors demand soviets without Bolshevik monopoly and are suppressed; the Tenth
          Congress bans factions and introduces the New Economic Policy, restoring private trade.
          Leninists cite famine, émigré contacts and the danger to Petrograd; anarchists and council
          communists see a workers' revolt crushed by a party state.
    descendsFrom:
      - {id: marxism.classical, event: "Split of the RSDLP into Bolsheviks and Mensheviks", date: 1903}
    breaksWith:
      - {id: marxism.classical, event: "Second International parties vote war credits; Lenin calls for a new International", date: 1914}
      - {id: socdem.revisionist, event: "Comintern's 21 conditions require the expulsion of reformists", date: 1920}
    analysis:
      conditions: >-
        Late, state-driven industrialization financed heavily by French and other foreign capital packed
        workers into some of the largest factories in Europe, in a country where most people were
        peasants short of land and where the autocracy allowed no legal parties until 1905. Clandestine
        organization was a condition of existence, not a preference. The First World War then broke the
        state, the army and the food supply at once, and a party built for illegality could join urban
        workers, peasant soldiers and land-hungry villages.
      class_base: >-
        In 1917: factory workers of Petrograd and Moscow, soldiers and sailors drawn from the peasantry,
        and a cadre of professional revolutionaries mostly from the intelligentsia. Today nearly every
        communist current claims Lenin, but groups that call themselves simply Leninist are small; in the
        core their members are mostly students, young graduates and some union militants. The mass base
        of Leninism today runs through its descendants, chiefly Marxism-Leninism and Maoism in the
        periphery.
      function: >-
        Lenin's account of imperialism as monopoly, finance and the division of the world is the main
        ancestor of the analytic frame this instrument uses, and is stated here as such. It ties class
        struggle in the core to anti-colonial struggle in the periphery, and its organizational model, a
        disciplined party of cadres, has been taken up by national liberation movements far beyond
        workers' parties. In the core, small Leninist groups recruit mainly at universities and rarely
        reach industrial workers, so the theory's practical weight there is far below its intellectual
        weight.
      disputed: >-
        Whether Leninism led to Stalinism (continuity: anarchists, council communists, and liberal
        historians such as Richard Pipes) or was broken from it by isolation, civil war and bureaucracy
        (Trotskyists, Stephen Cohen, Lars Lih).
    keyTexts:
      - {author: V. I. Lenin, title: "What Is to Be Done?", year: 1902}
      - {author: V. I. Lenin, title: "The Right of Nations to Self-Determination", year: 1914}
      - {author: V. I. Lenin, title: "Imperialism, the Highest Stage of Capitalism", year: 1917}
      - {author: V. I. Lenin, title: "The State and Revolution", year: 1917}
      - {author: V. I. Lenin, title: "\"Left-Wing\" Communism: An Infantile Disorder", year: 1920}

  # ------------------------------------------------------------------
  - id: marxism.ml
    regions: [former Soviet Union, Vietnam, Laos, Cuba, India (Kerala, West Bengal, Tripura), Nepal, South Africa, Greece, Portugal, worldwide]
    self: >-
      Marxism-Leninism is the science of the working class, tested in the building of socialism. Under
      Lenin and Stalin a ruined peasant empire became an industrial power in two decades, abolished
      unemployment, taught a nation to read, gave free health care and housing, and broke the Nazi war
      machine. Socialism can be built in one country if the party of the working class holds state
      power, plans the economy and defends it against encirclement. After 1945 the socialist camp and
      the liberation movements it armed and fed freed a third of humanity from capitalism and colonial
      rule. We study our errors with the method that won those victories, and we defend the socialist
      states that remain.
    record:
      - date: 1928–1940
        text: >-
          The First and Second Five-Year Plans and forced collectivization: industrial output,
          urbanization and schooling grow at unprecedented speed, peasants are compelled into collective
          farms, and over a million people labelled kulaks are deported.
      - date: 1932–1933
        disputed: true
        text: >-
          Famine in Ukraine, Kazakhstan, the Volga and the North Caucasus, with deaths commonly estimated
          at about 5.5 to 8 million while grain procurement continued. Whether it was a deliberate attack
          on Ukrainians (the Holodomor genocide thesis, held by Ukraine and many historians) or the result
          of harvest failure, procurement policy and repression without intent to destroy a nation (R. W.
          Davies and Stephen Wheatcroft; most Marxist-Leninists) is disputed.
      - date: 1937–1938
        disputed: true
        text: >-
          Archival NKVD figures record about 1.5 million arrests and about 680,000 executions in two
          years, and the Gulag camps hold well over a million prisoners at a time. Marxist-Leninists range
          from treating the purges as a grave error to treating them as a response to real conspiracies;
          most historians find the great majority of cases fabricated.
      - date: 1939
        disputed: true
        text: >-
          A non-aggression pact with Nazi Germany, with a secret protocol dividing eastern Europe; the USSR
          occupies eastern Poland and later the Baltic states. Supporters read it as buying time after
          Britain and France rejected collective security at Munich; critics as a partition of neighbours
          by agreement.
      - date: 1941–1945
        text: >-
          The USSR bears the main weight of the land war against Nazi Germany, at a cost of about 27
          million Soviet dead; the Red Army takes Berlin in May 1945.
      - date: 1945–1965
        text: >-
          Communist-led states are established across eastern Europe, partly through the Red Army's
          presence, and by revolution in China, northern Korea and northern Vietnam. Soviet life expectancy
          rises from the low 40s in the 1920s to the high 60s by the early 1960s.
      - date: 1989–1991
        text: >-
          The eastern European party-states fall in 1989 and the USSR is dissolved in 1991. In Russia
          output falls by roughly 40 percent over the 1990s and male life expectancy drops to about 58 by
          1994.
    descendsFrom:
      - {id: marxism.leninism, event: "Lenin's death and Stalin's doctrine of socialism in one country", date: 1924}
    breaksWith:
      - {id: marxism.trotskyism, event: "Defeat of the Left Opposition; Trotsky expelled from the party", date: 1927}
      - {id: socdem.revisionist, event: "Comintern's 'class against class' line brands social democracy 'social fascism'", date: 1928}
    analysis:
      conditions: >-
        After the European revolutions of 1918–23 failed, the Soviet state stood alone: a peasant country
        with little industry, encircled by hostile powers and expecting war (the 1927 war scare, then
        Nazi Germany). Building heavy industry and an army within a decade without foreign credit meant
        taking a surplus from the countryside by force and holding consumption down, which required a
        centralized party-state able to override every other interest. Marxism-Leninism codified that
        experience as doctrine.
      class_base: >-
        In the USSR: the party-state cadre and the millions of workers' and peasants' children promoted
        into industry, administration and the army, whose rise depended on the plan. Today it is the
        governing doctrine in Vietnam, Laos and Cuba (and, in modified form, China), where its base is
        state cadres together with workers and peasants who gained land, schooling and health care. It
        leads mass parties of workers and agricultural labourers in Kerala and West Bengal, and parties
        with real weight in Nepal, South Africa (SACP), Greece (KKE) and Portugal (PCP). In Russia the
        KPRF draws mainly older voters who lost in the 1990s. In the core, students and young precarious
        workers make up most new members.
      function: >-
        In the periphery, Marxist-Leninist parties organize workers and peasants, and in government they
        run sovereign development under pressure: Cuba under a US embargo since 1960–62; Vietnam since
        1986 combining party rule with export manufacturing for core firms, which keeps the state in
        control of land and finance while also supplying low-wage labour to global value chains. In the
        core, the current's defence of besieged socialist states and of a multipolar world sets it
        against its own governments, which is why it is most active in anti-sanctions and anti-war
        campaigns. In Russia the KPRF acts as a loyal parliamentary opposition that backs the war in
        Ukraine.
      disputed: >-
        The class character of the USSR: socialist (Marxist-Leninists), a degenerated workers' state
        (orthodox Trotskyists), state capitalist (Tony Cliff; Charles Bettelheim and Maoists for the
        period after 1956), or ruled by a new class (Milovan Djilas). The frame judges it by direction
        and siege; these readings dispute what the direction was.
    keyTexts:
      - {author: J. V. Stalin, title: "The Foundations of Leninism", year: 1924}
      - {author: J. V. Stalin, title: "Dialectical and Historical Materialism", year: 1938}
      - {author: "Commission of the Central Committee of the CPSU(B)", title: "History of the Communist Party of the Soviet Union (Bolsheviks): Short Course", year: 1938}
      - {author: J. V. Stalin, title: "Economic Problems of Socialism in the USSR", year: 1952}

  # ------------------------------------------------------------------
  - id: marxism.maoism
    regions: [China, India, Philippines, Nepal, Peru]
    self: >-
      Chairman Mao applied the universal truth of Marxism-Leninism to the concrete practice of the
      Chinese revolution. In a semi-colonial, semi-feudal country the peasants are the main force:
      surround the cities from the countryside through protracted people's war. New Democracy unites
      workers, peasants, petty bourgeoisie and national bourgeoisie against imperialism, feudalism and
      bureaucrat-capitalism. The mass line: from the masses, to the masses. Knowledge begins in practice.
      Above all, class struggle continues under socialism; a new bourgeoisie grows inside the party
      itself, and only the masses, mobilized to criticize and supervise, can stop capitalist
      restoration. The Chinese people stood up in 1949 because of this line.
    record:
      - date: 1927–1935
        text: >-
          After the Guomindang's massacre of communists in Shanghai (1927), Mao builds rural base areas
          through land redistribution; the Long March and the Zunyi conference (1935) make him the party's
          leading figure.
      - date: 1937–1949
        text: >-
          The party leads guerrilla resistance behind Japanese lines and then wins the civil war; the
          People's Republic is proclaimed on 1 October 1949.
      - date: 1950–1953
        disputed: true
        text: >-
          Land reform transfers landlord land to some 300 million peasants. Estimates of landlords and
          others killed range from several hundred thousand to two million or more; the party described
          the violence as peasants settling accounts with landlord power, critics as mass killing directed
          by the party.
      - date: 1958–1962
        disputed: true
        text: >-
          The Great Leap Forward's communes and steel campaign are followed by famine. Demographic
          estimates of excess deaths range from about 15 to 45 million, most near 30 million; the size,
          the weight of weather and the Soviet withdrawal of aid, and the degree of leadership
          responsibility are disputed, and some Maoist writers reject the demographic data.
      - date: 1960–1963
        text: >-
          The Sino-Soviet split: Soviet experts are withdrawn in 1960, and the CPC's 1963 Proposal
          Concerning the General Line accuses the Soviet leadership of revisionism.
      - date: 1949–1976
        text: >-
          Life expectancy rises from roughly 35–40 years to about 65, and literacy and rural health care
          (the "barefoot doctors") spread widely; industrial output grows fast while rural consumption
          rises slowly.
      - date: 1966–1976
        disputed: true
        text: >-
          The Cultural Revolution: Mao calls students and workers to attack "capitalist roaders" in the
          party; Red Guard factions fight each other, officials and intellectuals are persecuted, and most
          scholarly estimates of deaths fall between about 1 and 2 million. Maoists defend it as mass
          struggle against restoration; the CPC's own 1981 resolution calls it the most severe setback
          since 1949.
    descendsFrom:
      - {id: marxism.ml, event: "Zunyi conference: Mao's line wins leadership of the CPC", date: 1935}
    breaksWith:
      - {id: marxism.ml, event: "Sino-Soviet split over de-Stalinization and peaceful coexistence", date: "1956–1963"}
    analysis:
      conditions: >-
        A semi-colonial China divided among foreign concessions and warlords, where landlords often took
        half the harvest in rent and the urban working class was small. The 1927 massacres destroyed the
        party in the cities, so it survived only where it could offer peasants land; Japan's invasion in
        1937 then made it the most effective organizer of national resistance. Land plus national defence
        turned peasants into a revolutionary army.
      class_base: >-
        Historically: poor and middle peasants, organized by cadres of intellectual and rural origin. In
        China today Mao Zedong Thought is an official guiding ideology of the CPC, but a distinct Maoist
        left draws on laid-off state workers, retirees, migrant workers and some students, as in the 2018
        Jasic campaign in which students backed factory workers trying to form a union. Abroad it shapes
        peasant-based parties and insurgencies in India, the Philippines and Nepal.
      function: >-
        Within China, Mao's image serves two opposed purposes: it legitimates the ruling party, and it
        gives workers and those left behind by the reforms an idiom of grievance against inequality and
        corruption, which is why Maoist student activists were detained after Jasic. Internationally,
        Mao's theory of peasant war and his division of the world into oppressor and oppressed nations
        remain the most influential Marxist account of revolution in the agrarian periphery.
      disputed: >-
        Whether Mao-era China was socialist (Maoists), state capitalist (the later Bettelheim), a
        bureaucratically deformed workers' state (Trotskyists), or an industrializing developmental state
        (many economists); and whether the Cultural Revolution was a struggle against restoration
        (Maoists) or a catastrophe (the CPC in 1981, most historians).
    keyTexts:
      - {author: Mao Zedong, title: "Report on an Investigation of the Peasant Movement in Hunan", year: 1927}
      - {author: Mao Zedong, title: "On Practice", year: 1937}
      - {author: Mao Zedong, title: "On Contradiction", year: 1937}
      - {author: Mao Zedong, title: "On New Democracy", year: 1940}
      - {author: Mao Zedong, title: "On the Correct Handling of Contradictions Among the People", year: 1957}

  # ------------------------------------------------------------------
  - id: marxism.mlm
    regions: [India, Philippines, Peru, Nepal, Turkey]
    self: >-
      Marxism-Leninism-Maoism is the third and higher stage of Marxism. Mao's contributions are
      universal: protracted people's war as the military theory of the proletariat everywhere, the mass
      line, and the Cultural Revolution as the means of preventing restoration. Capitalism was restored
      in the USSR after 1956 and in China after 1976; no socialist state exists today. Most of the
      world's people live in semi-feudal, semi-colonial countries where agrarian revolution against
      landlords, compradors and imperialism is on the agenda, and in India and the Philippines people's
      wars are being fought now. In the imperialist countries our task is to build the party and to
      serve the people.
    record:
      - date: 1968–1969
        text: >-
          Jose Maria Sison re-establishes the Communist Party of the Philippines; its New People's Army,
          founded in 1969, wages the longest-running communist insurgency in Asia.
      - date: 1980–1992
        disputed: true
        text: >-
          The Communist Party of Peru (Shining Path) begins armed struggle in 1980; its leader Abimael
          Guzmán is captured in 1992. Peru's Truth and Reconciliation Commission (2003) estimated about
          69,000 dead in the conflict and attributed the largest share, roughly half, to the PCP and most
          of the rest to state forces. PCP supporters reject the commission as an organ of the state;
          other Maoist parties also condemned PCP killings of peasants.
      - date: 1993
        text: >-
          The Revolutionary Internationalist Movement, founded in 1984, adopts "Marxism-Leninism-Maoism"
          as its formulation, following the PCP.
      - date: 1996–2008
        disputed: true
        text: >-
          The CPN (Maoist) wages people's war in Nepal, a conflict in which about 17,000 die; it signs a
          peace agreement in 2006, wins the most seats in the 2008 Constituent Assembly, and the monarchy
          is abolished. Its supporters credit it with the republic and federalism; MLM critics call its
          entry into parliamentary government an abandonment of the revolution.
      - date: 2004
        disputed: true
        text: >-
          The CPI (Maoist) forms by merger in India and fights in the forested adivasi regions of central
          and eastern India; Prime Minister Manmohan Singh calls it the country's single biggest internal
          security challenge (2006). Its supporters and some civil-liberties groups describe the
          counterinsurgency, including the Salwa Judum militia that the Supreme Court ordered disbanded in
          2011, as a war on adivasis to open their land to mining.
      - date: 2024–2025
        text: >-
          An expanded Indian security offensive kills hundreds of cadres, including general secretary
          Nambala Keshava Rao in 2025, and several senior leaders surrender with their units.
    descendsFrom:
      - {id: marxism.maoism, event: "Arrest of the 'Gang of Four', read as capitalist restoration in China", date: 1976}
    breaksWith:
      - {id: marxism.scc, event: "Deng's reform and opening rejected as revisionism", date: 1978}
      - {id: marxism.hoxhaism, event: "Hoxha's denunciation of Mao Zedong Thought", date: 1978}
    analysis:
      conditions: >-
        Rural peripheries where landlessness, debt bondage, caste or ethnic exclusion and a distant armed
        state coexist with mining and plantation capital: the Andean highlands of Peru, Nepal's western
        hills, Philippine haciendas, and the forested adivasi belt of India, which lies over much of the
        country's coal, iron ore and bauxite. Where peasants face landlords, mining companies and police
        together, an armed party that offers land, protection and punishment of local oppressors can
        recruit.
      class_base: >-
        Landless and poor peasants, adivasi and other indigenous forest communities, and rural youth, led
        by cadres who are often university-educated (Guzmán taught philosophy; Sison taught at the
        University of the Philippines). In the core, MLM groups are small and drawn mainly from students
        and young activists.
      function: >-
        In India's mineral belt the insurgency has been the main armed obstacle to opening forest land to
        mining and steel companies, which raises the cost of extraction; the state's response has
        militarized adivasi areas and displaced villages. Because its method is armed, it is also the
        main target of security doctrine, which governments use to justify emergency laws applied to
        wider dissent, as in the 2018 Bhima Koregaon arrests of activists and lawyers.
      disputed: >-
        Whether "semi-feudalism" still describes India and the Philippines (MLM parties; Amit Bhaduri's
        side of the Indian mode-of-production debate) or capitalist relations now dominate agriculture
        (Utsa Patnaik's side, most Indian Marxists outside MLM); and whether armed struggle advances or
        endangers the communities it recruits from, with the PCP's killing of 69 villagers at Lucanamarca
        (1983) as the extreme case cited.
    keyTexts:
      - {author: Lin Biao, title: "Long Live the Victory of People's War!", year: 1965}
      - {author: Charu Majumdar, title: "Eight Documents", year: "1965", note: "written 1965–1967"}
      - {author: "Amado Guerrero (Jose Maria Sison)", title: "Philippine Society and Revolution", year: 1970}
      - {author: "Abimael Guzmán", title: "Interview with Chairman Gonzalo", year: 1988}
      - {author: Revolutionary Internationalist Movement, title: "Long Live Marxism-Leninism-Maoism!", year: 1993}

  # ------------------------------------------------------------------
  - id: marxism.hoxhaism
    regions: [Albania (historical), Ecuador, Tunisia, Turkey, Dominican Republic]
    self: >-
      When Khrushchev betrayed Stalin and Marxism-Leninism, socialist Albania refused to follow. When Mao
      embraced the theory of three worlds and shook hands with Nixon, Albania refused again, and showed
      that Mao Zedong Thought had never been Marxism-Leninism but an eclectic, petty-bourgeois
      nationalism. A small people of two million, relying on its own forces, electrified every village,
      wiped out illiteracy, built industry and took no foreign loans, while standing against both
      superpowers at once. Revisionism in all its forms, Soviet, Chinese, Yugoslav and Eurocommunist,
      leads back to capitalism. We defend the purity of Marxism-Leninism because every compromise has
      ended in restoration.
    record:
      - date: 1944
        text: >-
          Communist-led partisans liberate Albania without the Soviet army; Enver Hoxha leads party and
          state until his death in 1985.
      - date: 1948–1968
        text: >-
          Albania breaks with Yugoslavia (1948), then with the USSR after de-Stalinization (1961), siding
          with China; it formally leaves the Warsaw Pact in 1968.
      - date: 1967–1970
        text: >-
          Religious institutions are closed and Albania declares itself an atheist state (1967); the state
          reports every village electrified by 1970.
      - date: 1949–1985
        disputed: true
        text: >-
          The Sigurimi security service and labour camps such as Spaç and Burrel hold political prisoners;
          post-1991 Albanian figures count roughly 5,000 to 6,000 people executed for political reasons
          and tens of thousands imprisoned or internally exiled. Supporters point to real Western-backed
          infiltration (the British and US operations of 1949–53) and hostile neighbours; critics describe
          the persecution of all dissent.
      - date: 1976–1978
        text: >-
          The 1976 constitution bans foreign credits and concessions; after China ends its aid in 1978,
          Albania is the most isolated state in Europe, and parties abroad that side with it form the
          pro-Albanian current.
      - date: 1990–1992
        text: >-
          Protests and mass emigration force multi-party elections; the Party of Labour renames itself the
          Socialist Party in 1991 and loses power in 1992.
      - date: 1994
        text: >-
          Pro-Albanian parties form the International Conference of Marxist-Leninist Parties and
          Organizations, whose larger members include parties in Ecuador, Tunisia, Turkey and the
          Dominican Republic.
    descendsFrom:
      - {id: marxism.ml, event: "Albanian party's rejection of Soviet de-Stalinization", date: 1961}
    breaksWith:
      - {id: marxism.ml, event: "Soviet–Albanian split", date: 1961}
      - {id: marxism.maoism, event: "Sino-Albanian split; Hoxha's Imperialism and the Revolution", date: 1978}
    analysis:
      conditions: >-
        A small, mostly agrarian country of about a million people in 1945, with neighbours (Yugoslavia,
        Greece) holding claims on its territory, dependent in turn on Yugoslav, Soviet and Chinese aid.
        The leadership read each patron's reforms, Tito's, Khrushchev's, Deng's, as a threat both of
        absorption and of its own replacement, and broke with each. Doctrinal purity and autarky followed
        from that sequence of breaks as much as from principle.
      class_base: >-
        In Albania: the party and security apparatus drawn from the wartime partisan movement, and
        workers and peasants mobilized into new industry and collective farms. Today: the pro-Albanian
        parties, whose base includes teachers and student movements in Ecuador (PCMLE), workers and
        unionists in Tunisia (the Workers' Party, active in the UGTT federation), and workers and
        students in Turkey (EMEP); plus small online circles in the core.
      function: >-
        These parties act as a disciplined left wing of union struggles and electoral fronts in Latin
        America and North Africa, with weight in teachers' and student unions. Because they judge China
        and every existing state capitalist, they stand apart from the multipolar politics of other
        Marxist-Leninists. Albania's own record shows the limit of delinking at very small scale: without
        the market and technology of a large economy or a bloc, self-reliance meant stagnation in the
        1980s.
      disputed: >-
        Whether Albanian autarky was a form of the delinking Samir Amin advocated or isolation chosen by
        a leadership protecting itself; and whether Hoxha's critique of Mao exposed a real departure from
        Marxism-Leninism (Hoxhaists) or was dogmatism (Maoists).
    keyTexts:
      - {author: Enver Hoxha, title: "Imperialism and the Revolution", year: 1978}
      - {author: Enver Hoxha, title: "Reflections on China", year: 1979}
      - {author: Enver Hoxha, title: "The Khrushchevites", year: 1980}
      - {author: Enver Hoxha, title: "Eurocommunism Is Anti-Communism", year: 1980}

  # ------------------------------------------------------------------
  - id: marxism.juche
    regions: [North Korea, Korean community in Japan]
    self: >-
      Man is the master of everything and decides everything. Juche means independence in politics,
      self-sufficiency in the economy and self-reliance in defence, with the masses as masters of the
      revolution under the guidance of the leader and the party. Led by President Kim Il Sung, the
      Korean people defeated Japanese colonialism, repelled US aggression, rebuilt from ashes after the
      country was bombed flat, and have defended their sovereignty for more than seventy years against
      the strongest military power on earth and the harshest sanctions any nation has faced. Our nuclear
      deterrent guarantees that what was done to Iraq and Libya will never be done to us.
    record:
      - date: 1950–1953
        disputed: true
        text: >-
          The Korean War begins on 25 June 1950 with a northern offensive across the 38th parallel,
          according to most historians and the UN at the time; the DPRK holds that the South attacked
          first. US bombing drops about 635,000 tons on Korea and destroys most towns in the North. An
          armistice is signed in 1953, and no peace treaty has followed.
      - date: 1955–1956
        text: >-
          Kim Il Sung's speech on establishing Juche in ideological work (1955); an attempt by pro-Soviet
          and pro-Chinese leaders to curb his power in August 1956 fails, and they are purged.
      - date: 1953–1975
        text: >-
          Rapid postwar reconstruction with Soviet and Chinese aid; most estimates put output per head
          above the South's until about the mid-1970s.
      - date: 1994–1998
        disputed: true
        text: >-
          After subsidized Soviet trade ends and floods strike, famine follows. Demographic estimates of
          deaths mostly range from about 600,000 to 1 million, with figures from about 240,000 to over 3
          million cited. The DPRK attributes it to natural disasters and sanctions; critics to the
          system's rigidity and its priorities in distribution.
      - date: 2006–2017
        text: >-
          Six nuclear tests from 2006 and an intercontinental missile test in 2017; UN Security Council
          sanctions widen to cover most of the country's exports.
      - date: 2014
        disputed: true
        text: >-
          A UN Commission of Inquiry reports crimes against humanity, including political prison camps it
          estimated held 80,000 to 120,000 people. The DPRK rejects the report as politically motivated
          and denies that the camps exist.
      - date: 2024–2025
        text: >-
          A mutual defence treaty with Russia (2024); North Korean troops fight in Russia's Kursk region,
          which Pyongyang confirmed in 2025. In 2024 the leadership also abandons the goal of peaceful
          reunification and designates the South a hostile state.
    descendsFrom:
      - {id: marxism.ml, event: "Juche speech and the purge of the August faction", date: "1955–1956"}
    breaksWith:
      - {id: marxism.ml, event: "Constitution drops Marxism-Leninism, naming Juche the guiding idea", date: 1992}
    analysis:
      conditions: >-
        Thirty-five years of Japanese colonial rule, a division of the country by the US and the USSR in
        1945, a war that levelled the North, and a permanent armed standoff with US forces stationed in
        the South. During the Sino-Soviet split, Juche let the leadership refuse subordination to either
        patron while drawing aid from both. After 1991 the end of Soviet subsidized trade and continuing
        sanctions made self-reliance less a choice than a condition.
      class_base: >-
        Inside the DPRK: the Workers' Party, the army and the families ranked loyal under the songbun
        system, who have privileged access to Pyongyang, higher education and goods. Since the famine of
        the 1990s a layer of traders and financiers (donju) has grown in tolerated markets beside the
        state sector. Outside, small solidarity groups and the declining Chongryon association of
        Koreans in Japan.
      function: >-
        The DPRK is the clearest case of a small state that the US has neither coerced nor overthrown,
        and it attributes that to nuclear weapons; other governments draw the same lesson from the fates
        of Iraq (2003) and Libya (2011). Sanctions have nearly cut it off from the world economy apart
        from China and now Russia, so the drain reaches it chiefly as exclusion, not extraction. For the
        core, the North's weapons justify US bases and missile defence in East Asia, which are also
        positioned against China.
      disputed: >-
        Whether the DPRK is a socialist state under siege (its supporters and some Marxist-Leninists), a
        hereditary national-security state that has left Marxism behind (most historians; Hoxhaist and
        MLM parties reject Juche as non-Marxist), or a garrison state shaped chiefly by the unended war
        (Bruce Cumings's emphasis).
    keyTexts:
      - {author: Kim Il Sung, title: "On Eliminating Dogmatism and Formalism and Establishing Juche in Ideological Work", year: 1955}
      - {author: Kim Jong Il, title: "On the Juche Idea", year: 1982}
      - {author: Kim Il Sung, title: "With the Century", year: 1992}

  # ------------------------------------------------------------------
  - id: marxism.scc
    regions: [China]
    self: >-
      Seek truth from facts. China is in the primary stage of socialism and will be for a long time; to
      build socialism we first had to free and develop the productive forces. The market is a means,
      not a system: capitalism has planning and socialism can use markets, so long as public ownership
      is the mainstay and the Communist Party leads. Reform and opening lifted some 800 million people
      out of extreme poverty, built the world's largest industrial base and restored China's place in
      the world. Now the principal contradiction is between the people's growing needs for a better
      life and unbalanced, inadequate development, and we pursue common prosperity, ecological
      civilization and a community with a shared future for mankind.
    record:
      - date: 1978–1984
        text: >-
          The Third Plenum of December 1978 launches reform and opening: collective farming gives way to
          the household responsibility system, and special economic zones open to foreign capital from
          1980.
      - date: 1989
        disputed: true
        text: >-
          Troops clear protests centred on Tiananmen Square on 3–4 June. The government gave about 200 to
          300 dead, including soldiers; other estimates run from several hundred to several thousand. The
          CPC holds that the action ended turmoil and secured the stability that made later growth
          possible; critics call it a massacre of unarmed civilians.
      - date: 1995–2010
        text: >-
          Restructuring of state and collective enterprises lays off tens of millions of workers; China
          joins the WTO in 2001 and becomes the largest manufacturing country by about 2010.
      - date: 1981–2021
        text: >-
          By the World Bank's measure, extreme poverty falls from about 88 percent of the population in
          1981 to under 1 percent by 2019, some 800 million people; the government declares absolute rural
          poverty eliminated in 2021. Income inequality rises sharply over the same decades.
      - date: 2013
        text: >-
          The Belt and Road Initiative begins, financing ports, railways and power plants across Asia,
          Africa and Latin America.
      - date: 2017–2019
        disputed: true
        text: >-
          Large-scale detention of Uyghurs and other Muslims in facilities in Xinjiang. China calls them
          vocational education and training centres for counter-terrorism and says all trainees had
          graduated by 2019; outside researchers estimate up to a million or more detained, and the UN
          human rights office (2022) found that the detentions may amount to crimes against humanity.
      - date: 2018–2025
        text: >-
          The US imposes tariffs (2018, widened in 2025) and export controls on advanced chips (2022);
          China leads world production of solar panels, batteries and electric vehicles.
    descendsFrom:
      - {id: marxism.maoism, event: "Third Plenum of the 11th Central Committee", date: 1978}
    breaksWith:
      - {id: marxism.maoism, event: "Arrest of the Gang of Four and the 1981 resolution repudiating the Cultural Revolution", date: "1976–1981"}
    analysis:
      conditions: >-
        By 1976 China had heavy industry and near-universal basic schooling and health care, but rural
        incomes were low and consumption stagnant. The 1972 opening to the US gave access to Western
        technology and markets just as core capital, facing falling profits after 1973, was looking for
        cheap and disciplined labour abroad. Hundreds of millions of rural workers with land-use rights
        but no urban residence rights (hukou) supplied factories at wages far below core levels, while
        the village plot carried part of the cost of keeping their families.
      class_base: >-
        A party-state of about 100 million members that commands the banks, land and strategic
        industries; a large private capitalist class, admitted to the party since 2001; state-enterprise
        managers and an urban professional stratum; and broad support built on four decades of rising
        incomes. Nearly 300 million migrant workers form the core of the industrial workforce, with no
        right to organize outside the official union.
      function: >-
        China's rise erodes the core's monopolies of technology, finance and market access: it leads in
        solar, batteries, electric vehicles and much telecommunications equipment, lends to the South
        outside IMF conditions, and its manufacturing wages have risen manyfold since 2000, raising the
        cost of the world's manufactured goods. By the frame, that is why it draws tariffs, chip
        embargoes and military encirclement. At the same time Chinese firms buy minerals and build
        infrastructure across the South on commercial terms, and private capital accumulates under party
        supervision, so whether China reduces the drain or joins the core as a new beneficiary is the
        live question.
      disputed: >-
        The class character of China is the sharpest split among materialists. The CPC and many
        Marxist-Leninists call it socialism in its primary stage; Samir Amin called it a sovereign state
        project neither simply capitalist nor socialist, and Giovanni Arrighi a market economy not ruled
        by capital; Minqi Li and Ho-fung Hung call it capitalist, and third-camp Trotskyists and some
        Maoists an imperialist power. The frame judges it by its direction and its place in the whole,
        and the direction is exactly what these writers dispute.
    keyTexts:
      - {author: Deng Xiaoping, title: "Emancipate the Mind, Seek Truth from Facts and Unite as One in Looking to the Future", year: 1978}
      - {author: Communist Party of China, title: "Resolution on Certain Questions in the History of Our Party since the Founding of the People's Republic of China", year: 1981}
      - {author: Deng Xiaoping, title: "Excerpts from Talks Given in Wuchang, Shenzhen, Zhuhai and Shanghai", year: 1992}
      - {author: Xi Jinping, title: "The Governance of China", year: 2014}

  # ------------------------------------------------------------------
  - id: marxism.trotskyism
    regions: [France, Argentina, Britain, Brazil, Sri Lanka (historical), Bolivia (historical)]
    self: >-
      Permanent revolution: where imperialism rules, the bourgeoisie is too bound to foreign capital and
      the landlords to carry out even its own democratic tasks, so the working class must lead the nation
      and go straight on to socialism, and the revolution survives only by spreading. Socialism in one
      country was the programme of a bureaucracy that usurped October. The Soviet Union was a
      degenerated workers' state: its planned property was worth defending against imperialism, its
      bureaucracy had to be overthrown by the workers. We carry the programme of Lenin's Comintern:
      workers' democracy, the united front against fascism, transitional demands that lead from today's
      struggles to the question of power, and a world party.
    record:
      - date: 1923–1929
        text: >-
          The Left Opposition fights the growing party bureaucracy and argues for planned industrialization
          and workers' democracy within the party; Trotsky is expelled in 1927 and deported in 1929.
      - date: 1930–1933
        text: >-
          Trotsky urges a united front of the German Communist and Social Democratic parties against
          Nazism, against the Comintern's line that social democracy was "social fascism".
      - date: 1938–1940
        text: >-
          The Fourth International is founded and adopts the Transitional Programme; Trotsky is killed in
          Mexico in 1940 by Ramón Mercader, an agent of the Soviet NKVD.
      - date: 1946–1964
        text: >-
          Trotskyists draft the Thesis of Pulacayo adopted by Bolivia's miners' union (1946); in Ceylon the
          LSSP becomes a mass party, then is expelled from the International in 1964 for entering a
          coalition government.
      - date: 1953–1963
        text: >-
          The International splits over how to relate to Stalinist and nationalist movements; a majority
          reunites in 1963 as the United Secretariat while other international tendencies stay apart.
      - date: 2002
        text: >-
          Trotskyist candidates together win about 10 percent of the vote in the first round of the French
          presidential election.
      - date: 2011
        text: >-
          Trotskyist parties form Argentina's Workers' Left Front (FIT), which has since won seats in the
          national Congress.
    descendsFrom:
      - {id: marxism.leninism, event: "Formation of the Left Opposition", date: 1923}
    breaksWith:
      - {id: marxism.ml, event: "Expulsion of the Left Opposition; call for a new International after the German defeat", date: "1927–1933"}
    analysis:
      conditions: >-
        The defeat of revolutions in Germany, Hungary and Italy left Soviet Russia isolated and short of
        everything, governed by a party whose apparatus was growing into a privileged administrative
        layer. Trotskyism formed as the opposition of a defeated section of the revolutionary leadership.
        Expelled from the Communist parties, its members rebuilt as small groups held together by
        programme, which is one material reason for their frequent splits.
      class_base: >-
        Mostly intellectuals and minority worker militants, with exceptions: plantation and urban
        workers in Ceylon, Bolivia's tin miners, Saigon workers in the 1930s, and today industrial and
        precarious workers in parts of Argentina. In Europe and North America its members are chiefly
        students, teachers, and public-sector and white-collar union activists.
      function: >-
        In the core, Trotskyist groups act as an organized left inside unions and broad parties and as a
        school for activists who often move on into union leadership or social democracy. They oppose
        their own governments' wars, but most refuse political support to China, Russia or Iran, so they
        reject the multipolar camp that other anti-imperialists back. In Argentina the FIT gives a
        section of workers an electoral voice independent of Peronism.
      disputed: >-
        Whether permanent revolution (Trotskyists) or a stage of national-democratic revolution in
        alliance with a national bourgeoisie (Marxist-Leninists, Maoist New Democracy) fits the
        periphery; and whether refusing to back states targeted by the core is principled internationalism
        (Trotskyists) or, by the frame, a failure to weigh the drain and the siege (the charge of
        ultra-leftism from the anti-imperialist left).
    keyTexts:
      - {author: Leon Trotsky, title: "Results and Prospects", year: 1906}
      - {author: Leon Trotsky, title: "The Permanent Revolution", year: 1930}
      - {author: Leon Trotsky, title: "The Revolution Betrayed", year: 1936}
      - {author: Leon Trotsky, title: "The Death Agony of Capitalism and the Tasks of the Fourth International (The Transitional Programme)", year: 1938}

  # ------------------------------------------------------------------
  - id: marxism.third-camp
    regions: [Britain, Ireland, United States, Australia]
    self: >-
      Neither Washington nor Moscow, but international socialism. Where workers do not control the
      state, they own nothing that the state owns. The Soviet Union was ruled by a bureaucracy that
      exploited its workers and accumulated capital to compete militarily with the West: bureaucratic
      state capitalism. Socialism is the self-emancipation of the working class, from below, or it is
      nothing. So we back no ruling class, East or West, and we judge every state by what it does to its
      own workers and to the peoples it dominates. The main enemy is at home, and solidarity runs from
      workers to workers across every border the rulers draw.
    record:
      - date: 1940
        text: >-
          The US Socialist Workers Party splits over the Soviet invasion of Finland; Max Shachtman's
          minority rejects defence of the USSR and forms the Workers Party.
      - date: 1948–1950
        text: >-
          Tony Cliff analyses the USSR as state capitalist (1948); his group is expelled from the Fourth
          International for refusing to side with North Korea and China in the Korean War.
      - date: 1960s–1970s
        text: >-
          A wing of Shachtman's followers moves into the leadership of US social democracy and the AFL-CIO;
          Shachtman backs the US war in Vietnam, and some of his former followers later join the
          neoconservative movement.
      - date: 1977–1978
        text: >-
          The British SWP, renamed that year from the International Socialists, launches the Anti-Nazi
          League, which with Rock Against Racism mobilizes tens of thousands against the National Front.
      - date: 2003
        text: >-
          The SWP is a leading force in the Stop the War Coalition, organizer of the 15 February London
          march against the invasion of Iraq, estimated at about 750,000 by police and 2 million by
          organizers.
      - date: 2013
        text: >-
          The British SWP's handling of a rape complaint against a leading member provokes a crisis and
          large-scale resignations.
    descendsFrom:
      - {id: marxism.trotskyism, event: "Dispute over the class nature of the USSR", date: 1940}
    breaksWith:
      - {id: marxism.trotskyism, event: "Cliff's group expelled from the Fourth International over the Korean War", date: 1950}
      - {id: marxism.ml, event: "The USSR analysed as state capitalist", date: 1948}
    analysis:
      conditions: >-
        After 1945 Soviet power spread across eastern Europe mainly through the army and party apparatus,
        not workers' revolutions, and the Cold War pressed socialists in Britain and the US to choose a
        camp. Refusing both let these groups recruit workers and students repelled by Soviet repression
        (Hungary 1956, Czechoslovakia 1968) and by Western wars (Suez, Vietnam, Iraq).
      class_base: >-
        Students, teachers, public-sector and white-collar union activists, and some manual workers,
        mainly in Britain, Ireland, Australia and North America. In Britain they have supplied a
        disciplined organizing core to anti-racist and anti-war coalitions.
      function: >-
        Its line holds China and Russia to be imperialist rivals of the US, so in each conflict it calls
        for opposing every great power. That keeps it independent of all states, and by the frame it also
        puts semi-peripheral states under core sanctions on the same footing as the core powers that hold
        the monopolies of finance and technology. On Ukraine its currents split between opposing both
        sides and supporting Ukrainian armed resistance. On Palestine and anti-racism its organizing
        capacity is substantial.
      disputed: >-
        Whether today's world is one of inter-imperialist rivalry (Alex Callinicos) or a single imperialist
        core facing a periphery and semi-periphery (Samir Amin, Utsa and Prabhat Patnaik); the frame takes
        the second view. Also whether the USSR was state capitalist (Cliff), bureaucratic collectivist
        (Shachtman) or a degenerated workers' state (orthodox Trotskyists).
    keyTexts:
      - {author: Tony Cliff, title: "The Nature of Stalinist Russia", year: 1948}
      - {author: "C. L. R. James, Raya Dunayevskaya and Grace Lee", title: "State Capitalism and World Revolution", year: 1950}
      - {author: Max Shachtman, title: "The Bureaucratic Revolution", year: 1962}
      - {author: Hal Draper, title: "The Two Souls of Socialism", year: 1966}
      - {author: Alex Callinicos, title: "Imperialism and Global Political Economy", year: 2009}

  # ------------------------------------------------------------------
  - id: marxism.left-communism
    regions: [Italy, France]
    self: >-
      Communism is not a matter of democracy or of leaders but of programme: the invariant programme of
      the proletariat, stated in 1848 and restored by the Third International at its founding.
      Parliaments are the bourgeoisie's terrain; anti-fascist fronts disarm the workers by tying them to
      one capitalist faction against another; and the Soviet Union, with wage labour, money and
      commodity production intact, was capitalism directed by the state. The party is the organ that
      keeps the programme alive through the counter-revolutionary decades. It does not chase popularity,
      does not dissolve into fronts and does not bargain over principle: it holds the line and prepares
      until the class moves again.
    record:
      - date: 1921
        text: >-
          At Livorno the communist left led by Amadeo Bordiga splits from the Socialist Party to found the
          Communist Party of Italy; Bordiga is its first leader.
      - date: 1922–1930
        text: >-
          The Rome Theses (1922) reject united fronts with socialist parties; at the Lyon congress of 1926
          the Comintern-backed leadership of Gramsci displaces the left, and that year Bordiga confronts
          Stalin at the Comintern's Executive; he is expelled in 1930.
      - date: 1928–1939
        text: >-
          Exiled followers form the Italian Fraction and publish Bilan; in the Spanish Civil War its
          majority refuses to support the Republic's anti-fascist front, holding that it subordinated
          workers to a capitalist state.
      - date: 1943–1952
        text: >-
          The Internationalist Communist Party is founded in Italy (1943) and splits in 1952 between
          Onorato Damen's Battaglia Comunista and Bordiga's International Communist Party.
      - date: 1970s
        text: >-
          The communization current (Jacques Camatte, Gilles Dauvé, Théorie Communiste) grows out of the
          Italian and Dutch-German lefts and influences ultra-left and insurrectionary milieus.
      - date: 1982
        text: >-
          The International Communist Party breaks apart in a crisis, leaving several small successor
          groups.
    descendsFrom:
      - {id: marxism.leninism, event: "Founding of the Communist Party of Italy at Livorno", date: 1921}
    breaksWith:
      - {id: marxism.gramscian, event: "Lyon congress displaces Bordiga's leadership", date: 1926}
      - {id: marxism.ml, event: "Bordiga's opposition at the Comintern Executive and his expulsion", date: "1926–1930"}
    analysis:
      conditions: >-
        Italy's Biennio Rosso (1919–20) of factory occupations ended in defeat while the reformist
        Socialist Party stood aside, and fascist squads then destroyed the workers' organizations with
        the tolerance of liberal governments. The left concluded that only a party sharply separated from
        all others could lead. The Comintern's later popular fronts with liberal and socialist parties
        confirmed for them that the International now served Soviet diplomacy.
      class_base: >-
        Historically workers and militants in Naples and the industrial north of Italy; after the 1920s,
        small exile groups. Today a few small parties and a wider readership among students, precarious
        intellectuals and ultra-left circles in Italy, France and online.
      function: >-
        Its refusal of all fronts, anti-fascist, electoral or national, keeps a strict class line at the
        price of almost no practical leverage. Its lasting function is critical: it keeps in view the
        persistence of wages, money and commodity production under states that call themselves
        socialist, which is why those who judge the USSR or China capitalist read it. Bordiga treated
        anti-colonial revolutions as bourgeois revolutions to be welcomed historically but not allied
        with, and most successor groups refuse national movements altogether; either way, the drain does
        not decide its alliances.
      disputed: >-
        Whether the Soviet economy was capitalist because the law of value still operated (Bordiga, the
        later Bettelheim) or was a non-capitalist planned economy (Marxist-Leninists, Trotskyists); and
        whether refusing anti-fascist fronts in the 1930s was principle (left communists) or abstention
        that helped fascism win (Gramscians, Trotskyists).
    keyTexts:
      - {author: Amadeo Bordiga and Umberto Terracini, title: "Rome Theses", year: 1922}
      - {author: Amadeo Bordiga, title: "Lyon Theses", year: 1926}
      - {author: Amadeo Bordiga, title: "Dialogue with Stalin", year: 1952}
      - {author: Jacques Camatte, title: "Capital and Community", year: 1976}

  # ------------------------------------------------------------------
  - id: marxism.council-communism
    regions: [Germany, Netherlands, France]
    self: >-
      The emancipation of the working class must be the work of the workers themselves. Parties and
      unions belong to the old world: they bargain within capitalism and, in power, become a new master.
      In every real revolution, from 1905 to 1918 to Budapest in 1956, workers have created their own
      organs: councils of delegates elected in the workplace, mandated and recallable at any time.
      Russia proved that a party which rules in the workers' name builds state capitalism. Socialism
      means the councils managing production and distribution themselves, with labour time as the
      common measure and no one standing above the producers.
    record:
      - date: 1918–1919
        text: >-
          Workers' and soldiers' councils spread across Germany in the November Revolution; the national
          congress of councils votes for a parliamentary assembly, and the Bavarian council republic of
          April 1919 is crushed by government and Freikorps troops.
      - date: 1920
        text: >-
          The Communist Workers' Party of Germany (KAPD) splits from the KPD over parliament and the old
          unions, with about 40,000 members at its founding; Herman Gorter answers Lenin's "Left-Wing"
          Communism with an open letter.
      - date: 1921
        text: >-
          The KAPD leaves the Comintern; it and its allied workplace unions decline sharply over the
          1920s.
      - date: 1930
        text: >-
          The Dutch Group of International Communists publishes its Fundamental Principles of Communist
          Production and Distribution, a scheme of accounting by labour time under council control.
      - date: 1956
        text: >-
          Workers' councils, including the Central Workers' Council of Greater Budapest, organize strikes
          during and after the Hungarian uprising; council communists cite them as confirmation.
      - date: 1949–1968
        text: >-
          Socialisme ou Barbarie and then the Situationists carry council ideas to French students and
          workers; calls for workers' councils appear during May 1968.
    descendsFrom:
      - {id: marxism.classical, event: "German Revolution and the council movement", date: 1918}
      - {id: marxism.luxemburgism, event: "Spartacists and the founding of the KPD", date: 1919}
    breaksWith:
      - {id: marxism.leninism, event: "KAPD split over parliament and unions; Lenin's 'Left-Wing' Communism", date: 1920}
    analysis:
      conditions: >-
        The German unions and the SPD backed the war through a domestic truce, so the mass strikes of
        1917–18 were organized by shop stewards outside and against them, and in 1919 an SPD-led
        government used Freikorps troops against the left. Workers who saw unions and parties line up
        with the state turned to organs they controlled directly.
      class_base: >-
        Historically young industrial workers of Berlin, Hamburg and the Ruhr, many unemployed after 1923,
        with Dutch and German intellectuals (Pannekoek, Gorter, Rühle). Today small groups and a
        readership among anarchists, libertarian socialists and academics, mostly salaried and student
        strata.
      function: >-
        It supplies the sharpest left critique of party-states and union bureaucracy, and its demand for
        workplace self-government returns whenever workers occupy factories. Its focus on control inside
        the workplace says little about the world division of labour: councils running a core firm could
        go on benefiting from cheap inputs from the periphery unless their federation took
        responsibility for the terms of trade.
      disputed: >-
        Whether the Russian revolution degenerated because of the party form itself (council communists)
        or because of isolation, war and scarcity (Leninists, Trotskyists); and whether councils can
        coordinate a whole economy, where labour-time accounting faces objections from both Austrian
        economists and Marxist-Leninist planners.
    keyTexts:
      - {author: Herman Gorter, title: "Open Letter to Comrade Lenin", year: 1920}
      - {author: Group of International Communists, title: "Fundamental Principles of Communist Production and Distribution", year: 1930}
      - {author: Otto Rühle, title: "The Struggle Against Fascism Begins with the Struggle Against Bolshevism", year: 1939}
      - {author: Anton Pannekoek, title: "Workers' Councils", year: 1946}

  # ------------------------------------------------------------------
  - id: marxism.luxemburgism
    regions: [Germany, Poland]
    self: >-
      Socialism or barbarism. Reform is the means, revolution the goal, and whoever gives up the goal
      gives up socialism. The mass strike is not ordered from above: it grows out of the class's own
      experience, and workers learn more in a week of struggle than in years of schooling. Imperialism
      lives by devouring the non-capitalist world, and its wars are the bill. We stood with the
      Bolsheviks against the traitors of 1914, and as comrades we warned them: freedom only for the
      supporters of the government is no freedom at all. Freedom is always the freedom of the one who
      thinks differently. Without it, the life of the revolution drains away.
    record:
      - date: 1899
        text: >-
          Rosa Luxemburg's Reform or Revolution answers Eduard Bernstein and makes her the leading voice of
          the SPD's left.
      - date: 1904–1906
        text: >-
          She criticizes Lenin's centralism (1904), takes part in the 1905 revolution in Warsaw, and argues
          in The Mass Strike (1906) that mass strikes arise from the class's own movement.
      - date: 1913
        text: >-
          The Accumulation of Capital argues that capitalism must draw in non-capitalist economies to
          realize its surplus, which makes colonial expansion a necessity rather than a policy choice.
      - date: 1914–1916
        text: >-
          Karl Liebknecht votes against war credits in December 1914; Luxemburg, imprisoned for most of the
          war, writes the Junius Pamphlet, and the Spartacus group forms.
      - date: 1918–1919
        disputed: true
        text: >-
          The Spartacus League founds the Communist Party of Germany at the turn of 1919. During the
          January rising, whose timing Luxemburg doubted, Freikorps troops serving the SPD-led government
          capture and murder her and Liebknecht on 15 January. Whether SPD minister Gustav Noske approved
          the killings is disputed; the officer in charge, Waldemar Pabst, later claimed he did.
      - date: 1922
        text: >-
          Her prison manuscript The Russian Revolution, critical of the Bolsheviks' suppression of
          democratic liberties, is published by Paul Levi.
    descendsFrom:
      - {id: marxism.classical, event: "Left wing of the SPD", date: 1899}
    breaksWith:
      - {id: socdem.revisionist, event: "The revisionism debate", date: 1899}
      - {id: marxism.classical, event: "SPD vote for war credits; founding of the Spartacus League and the KPD", date: "1914–1919"}
    analysis:
      conditions: >-
        Two settings shaped it: the German SPD, whose growth bred a cautious apparatus of officials, and
        the Polish and Russian movement under tsarism, where the strikes of 1905 outran every party. The
        contrast between bureaucratic caution in the West and spontaneous mass action in the East
        produced her case for the mass strike and against both reformism and over-centralism.
      class_base: >-
        Historically the SPD left: workers in Berlin and Bremen and radical intellectuals. No mass
        organization carries the name today. Its institutional home is the Rosa Luxemburg Foundation of
        Germany's Die Linke, funded like all German party foundations from the federal budget, and its
        readers are left-party members, democratic socialists and academics, mostly in salaried strata.
      function: >-
        Her name now does two jobs that pull against each other. It lends a revolutionary pedigree to
        democratic socialists who want Marxism without Leninism, inside parliamentary parties of the kind
        she fought in 1914. Her Accumulation of Capital founds the line that capitalism depends on
        absorbing non-capitalist peripheries, an ancestor of today's theories of dispossession and drain
        (David Harvey; Utsa and Prabhat Patnaik).
      disputed: >-
        Whether "Luxemburgism" is a tradition at all or a label Comintern leaders coined in the 1920s to
        condemn a deviation; and her opposition to national self-determination, above all for Poland,
        which Lenin rejected in 1914 and which anti-colonial Marxists reject.
    keyTexts:
      - {author: Rosa Luxemburg, title: "Reform or Revolution", year: 1899}
      - {author: Rosa Luxemburg, title: "The Mass Strike, the Political Party and the Trade Unions", year: 1906}
      - {author: Rosa Luxemburg, title: "The Accumulation of Capital", year: 1913}
      - {author: Rosa Luxemburg, title: "The Junius Pamphlet", year: 1916}
      - {author: Rosa Luxemburg, title: "The Russian Revolution", year: 1922, note: "written 1918"}

  # ------------------------------------------------------------------
  - id: marxism.western
    regions: [Germany, France, Britain, North America]
    self: >-
      Marxism is not a set of economic laws or a party catechism but a critical theory of society as a
      totality. Lukács showed how the commodity form reifies consciousness itself, so that relations
      between people appear as relations between things. When the revolution failed in the West, we
      asked why: the culture industry that manufactures desire, the authoritarian personality,
      instrumental reason that turns nature and people alike into means. We defend dialectics against
      positivism and against Soviet orthodoxy alike. Our task is to understand domination in its
      subtlest forms and to keep alive the idea of a free and reconciled society, even in an age when no
      movement carries it.
    record:
      - date: 1923–1924
        text: >-
          Lukács's History and Class Consciousness and Korsch's Marxism and Philosophy appear in 1923, the
          year the Institute for Social Research is founded in Frankfurt; the Comintern's Fifth Congress
          (1924) condemns both books.
      - date: 1933–1950
        text: >-
          The Institute goes into exile, mainly at Columbia University in New York; Horkheimer and Adorno
          write Dialectic of Enlightenment; the Institute returns to Frankfurt in 1950.
      - date: 1964–1968
        text: >-
          Marcuse's One-Dimensional Man becomes a text of the New Left and the student movements of 1968.
      - date: 1969
        text: >-
          When students occupy the Institute in Frankfurt, Adorno calls the police.
      - date: 1981
        text: >-
          Habermas's Theory of Communicative Action turns the school's main line toward a theory of
          communication and liberal democracy.
    descendsFrom:
      - {id: marxism.classical, event: "History and Class Consciousness; Marxism and Philosophy", date: 1923}
    breaksWith:
      - {id: marxism.ml, event: "Comintern's Fifth Congress condemns Lukács and Korsch", date: 1924}
    analysis:
      conditions: >-
        Revolutions failed in Germany, Hungary and Italy, fascism won mass support, and after 1945 the
        core's long boom seemed to integrate workers through rising wages and mass consumption. Marxism
        lost its link to mass parties in the West and moved into universities, where the question became
        why workers did not revolt and the answer was sought in culture and consciousness (Perry
        Anderson's account).
      class_base: >-
        University intellectuals in Germany, France, Britain and North America, and a readership of
        students, artists and cultural professionals, which is to say the salaried professional stratum.
        It has never had a mass organization.
      function: >-
        It supplies the academic vocabulary of cultural critique (the culture industry, instrumental
        reason, the authoritarian personality) across the humanities, shaping how educated strata in the
        core understand domination. Its institutional heirs moved toward liberal-democratic theory:
        Habermas backed NATO's 1999 bombing of Yugoslavia and, with Frankfurt colleagues, called Israel's
        war in Gaza justified in principle (2023). Critics read that path as the result of a theory that
        studied consciousness in the core and left the colonies out.
      disputed: >-
        Domenico Losurdo (2017) argues that Western Marxism ignored or disdained the anti-colonial
        revolutions and so lost its materialism; defenders reply that its critique of domination applies
        to every power, East or West, and that Adorno and Marcuse saw clearly what the socialist states
        had become.
    keyTexts:
      - {author: Georg Lukács, title: "History and Class Consciousness", year: 1923}
      - {author: Karl Korsch, title: "Marxism and Philosophy", year: 1923}
      - {author: Max Horkheimer and Theodor W. Adorno, title: "Dialectic of Enlightenment", year: 1947}
      - {author: Herbert Marcuse, title: "One-Dimensional Man", year: 1964}
      - {author: Perry Anderson, title: "Considerations on Western Marxism", year: 1976}

  # ------------------------------------------------------------------
  - id: marxism.gramscian
    regions: [Italy, Latin America, Britain, Spain]
    self: >-
      In the East the state was everything and civil society was primordial; in the West, behind the
      state stands a sturdy structure of trenches and fortresses: churches, schools, newspapers, parties,
      unions, common sense itself. Rule there is hegemony, leadership by consent armoured by coercion.
      A class that wants to rule must first become leading: forge a historic bloc with the peasants and
      the intellectuals, wage a long war of position across civil society, train its own organic
      intellectuals, and build the party as a modern Prince, the collective will of the people and the
      nation. Pessimism of the intellect, optimism of the will.
    record:
      - date: 1919–1920
        text: >-
          Gramsci's L'Ordine Nuovo group backs the Turin factory councils; the factory occupations of
          September 1920 across northern Italy end without a seizure of power.
      - date: 1921–1926
        text: >-
          Gramsci co-founds the Communist Party of Italy and leads it from 1924; the Lyon congress (1926)
          adopts theses by Gramsci and Togliatti against Bordiga's left. In October 1926 he writes to the
          Soviet party criticizing its methods of factional struggle; Togliatti does not deliver the
          letter.
      - date: 1926–1937
        text: >-
          Arrested by the fascist government in November 1926, he is sentenced in 1928 after the
          prosecutor asks that his brain be stopped from working for twenty years; he writes the Prison
          Notebooks (1929–35) and dies in 1937.
      - date: 1944–1976
        text: >-
          Under Togliatti the PCI pursues an "Italian road to socialism", passing two million members and
          reaching 34.4 percent of the vote in 1976.
      - date: 1979
        text: >-
          Stuart Hall's Gramscian analysis of Thatcherism as "authoritarian populism" shapes the British
          left's reading of the new right.
      - date: 1970s–2010s
        text: >-
          Gramsci's concepts travel widely: France's Nouvelle Droite calls for a Gramscism of the right,
          and Podemos (founded 2014) and Bolivia's Álvaro García Linera use them for left-populist and
          governing strategy.
    descendsFrom:
      - {id: marxism.leninism, event: "Founding of the Communist Party of Italy", date: 1921}
    breaksWith:
      - {id: marxism.left-communism, event: "Lyon congress displaces Bordiga's leadership", date: 1926}
    analysis:
      conditions: >-
        Italy's uneven development, an industrial north and an agrarian south held by landlords and the
        Church, meant workers could not win alone, and the 1920 occupations failed despite a revolutionary
        situation. Fascism then won mass consent among peasants and the petty bourgeoisie. Both facts
        pressed the question of how a ruling class governs by consent, which Gramsci answered in prison.
      class_base: >-
        Historically the PCI's base: northern industrial workers, sharecroppers of central Italy and a
        large layer of intellectuals. Today Gramsci is among the most cited authors in the humanities,
        and the tradition's carriers are academics in cultural studies, party and campaign strategists,
        NGO staff and left-populist leaderships, mostly salaried professionals.
      function: >-
        Hegemony has become a general tool of political strategy across the spectrum: left-populist
        parties, the Nouvelle Droite, and right-wing media strategists who hold that politics is
        downstream of culture all use it. Detached from a party rooted in a class, the war of position
        tends to become communications and cultural work, a role suited to the professional strata who
        now carry the idea. Under Togliatti and his successors it also underwrote the PCI's road toward
        government inside NATO Italy (see Eurocommunism).
      disputed: >-
        Whether Gramsci's war of position revised Lenin toward a gradual road (the PCI's reading, and the
        ambiguity Perry Anderson diagnosed in 1976) or remained a Leninist strategy for the West in which
        coercion and the conquest of power stay central (Peter Thomas).
    keyTexts:
      - {author: Antonio Gramsci, title: "Some Aspects of the Southern Question", year: 1930, note: "written 1926"}
      - {author: Antonio Gramsci, title: "Prison Notebooks", year: 1948, note: "written 1929–1935; first edition 1948–1951"}
      - {author: Stuart Hall, title: "The Great Moving Right Show", year: 1979}
      - {author: Peter D. Thomas, title: "The Gramscian Moment", year: 2009}
