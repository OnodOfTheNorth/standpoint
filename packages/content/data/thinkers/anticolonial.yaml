thinkers:
  - id: thinker.gandhi
    name: Mohandas K. Gandhi
    born: 1869
    died: 1948
    region: India / South Africa
    traditions: [nationalism.gandhian]
    summary: Indian lawyer who developed satyagraha, mass nonviolent resistance, in South Africa and then led the Indian National Congress's campaigns against British rule. He was shot dead by a Hindu nationalist in 1948.
    argues:
      - {position: violence.political.never, in: {author: M. K. Gandhi, title: "Hind Swaraj", year: 1909}}
      - {position: tradition.modernity.decolonial, in: {author: M. K. Gandhi, title: "Hind Swaraj", year: 1909}}
      - {position: change.means.nonviolent-resistance, in: {author: M. K. Gandhi, title: "Satyagraha in South Africa", year: 1928}}
      - {position: caste.question.purify-hinduism, in: {author: M. K. Gandhi, title: "Dr. Ambedkar's Indictment", year: 1936, note: "in Harijan, reply to Annihilation of Caste"}}
      - {position: consumption.choice.buy-local-and-national, in: {author: M. K. Gandhi, title: "Constructive Programme: Its Meaning and Place", year: 1941, note: "khadi and swadeshi"}}
      - {position: automation.ownership.refuse-it, in: {author: "M. K. Gandhi", title: "Hind Swaraj", year: 1909}}
      - {position: technology.nature.autonomous-force, in: {author: "M. K. Gandhi", title: "Hind Swaraj", year: 1909}}

  - id: thinker.ambedkar
    name: B. R. Ambedkar
    born: 1891
    died: 1956
    region: India
    traditions: [nationalism.ambedkarite]
    summary: Dalit jurist and economist who led the movement against untouchability, chaired the drafting committee of India's constitution, and converted to Buddhism with hundreds of thousands of followers in 1956.
    argues:
      - {position: caste.question.annihilation, in: {author: B. R. Ambedkar, title: "Annihilation of Caste", year: 1936}}
      - {position: hist.partition-india.separation-better, in: {author: B. R. Ambedkar, title: "Pakistan or the Partition of India", year: 1945, note: "enlarged edition of Thoughts on Pakistan, 1940"}}
      - {position: caste.question.reservations-and-law, in: {author: B. R. Ambedkar, title: "States and Minorities", year: 1947}}
      - {position: firm.ownership.state, in: {author: B. R. Ambedkar, title: "States and Minorities", year: 1947, note: "state ownership of key industries and insurance"}}
      - {position: agrarian.question.collective-farms, in: {author: B. R. Ambedkar, title: "States and Minorities", year: 1947, note: "agriculture as a state industry, farmed collectively"}}

  - id: thinker.nasser
    name: Gamal Abdel Nasser
    born: 1918
    died: 1970
    region: Egypt
    traditions: [nationalism.nasserism, marxism.arab-socialism]
    summary: Army officer who led the 1952 Free Officers' coup and governed Egypt from 1954 until his death, nationalizing the Suez Canal, carrying out land reform and leading the pan-Arab and non-aligned movements.
    argues:
      - {position: liberty.concept.national-liberation, in: {author: Gamal Abdel Nasser, title: "The Philosophy of the Revolution", year: 1954}}
      - {position: alliances.policy.national-front, in: {author: Gamal Abdel Nasser, title: "The Charter of National Action", year: 1962, note: "alliance of the working forces of the people"}}
      - {position: party.system.national-front-party, in: {author: Gamal Abdel Nasser, title: "The Charter of National Action", year: 1962, note: "the Arab Socialist Union"}}
      - {position: development.path.planned-industrialization, in: {author: Gamal Abdel Nasser, title: "The Charter of National Action", year: 1962}}

  - id: thinker.aflaq
    name: Michel Aflaq
    born: 1910
    died: 1989
    region: Syria / Iraq
    traditions: [nationalism.baathism]
    summary: Syrian teacher who co-founded the Arab Ba'ath Party with Salah al-Din al-Bitar, under the slogan "unity, freedom, socialism", and spent his last decades in Baghdad.
    argues:
      - {position: religion.public.heritage-establishment, in: {author: Michel Aflaq, title: "In Memory of the Arab Prophet", year: 1943}}
      - {position: change.agent.the-nation, in: {author: Michel Aflaq, title: "Fi Sabil al-Ba'th (For the Sake of the Ba'th)", year: 1959}}

  - id: thinker.fanon
    name: Frantz Fanon
    born: 1925
    died: 1961
    region: Martinique / Algeria
    traditions: [nationalism.decolonial, marxism.third-worldism]
    summary: Martinican psychiatrist who joined the Algerian National Liberation Front, writing on the psychology of colonial racism and on violence, class and the national bourgeoisie in decolonization.
    argues:
      - {position: imperialism.nature.coloniality, in: {author: Frantz Fanon, title: "Black Skin, White Masks", year: 1952}}
      - {position: violence.political.anti-colonial, in: {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}}
      - {position: comprador.nature.broker-class, in: {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961, note: "chapter 'The Pitfalls of National Consciousness'"}}
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}}

  - id: thinker.nkrumah
    name: Kwame Nkrumah
    born: 1909
    died: 1972
    region: Ghana
    traditions: [nationalism.pan-africanism, marxism.african-socialism]
    summary: Leader of the Gold Coast independence movement and first prime minister and president of Ghana, from 1957 until his overthrow in a military coup in 1966. He campaigned for a continental union government of Africa.
    argues:
      - {position: intl.sovereignty.pooled, in: {author: Kwame Nkrumah, title: "Africa Must Unite", year: 1963}}
      - {position: poverty.cause.drain, in: {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}}
      - {position: change.means.armed-struggle, in: {author: Kwame Nkrumah, title: "Handbook of Revolutionary Warfare", year: 1968}}
      - {position: comprador.nature.broker-class, in: {author: Kwame Nkrumah, title: "Class Struggle in Africa", year: 1970}}
      - {position: hist.decolonization.flag-independence, in: {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}}

  - id: thinker.cabral
    name: Amílcar Cabral
    born: 1924
    died: 1973
    region: Guinea-Bissau / Cape Verde
    traditions: [marxism.african-socialism, nationalism.pan-africanism]
    summary: Agronomist who founded the PAIGC and led the armed struggle against Portuguese rule in Guinea-Bissau and Cape Verde. He was assassinated in Conakry months before independence was declared.
    argues:
      - {position: liberty.concept.national-liberation, in: {author: Amílcar Cabral, title: "The Weapon of Theory", year: 1966, note: "address to the Tricontinental Conference, Havana"}}
      - {position: violence.political.anti-colonial, in: {author: Amílcar Cabral, title: "Revolution in Guinea: An African People's Struggle", year: 1969}}

  - id: thinker.nyerere
    name: Julius Nyerere
    born: 1922
    died: 1999
    region: Tanzania
    traditions: [marxism.african-socialism]
    summary: Teacher who led Tanganyika to independence and served as president of Tanzania until 1985, pursuing ujamaa village socialism and self-reliance under a single party.
    argues:
      - {position: property.land.nationalize, in: {author: Julius Nyerere, title: "Ujamaa: The Basis of African Socialism", year: 1962}}
      - {position: party.system.national-front-party, in: {author: Julius Nyerere, title: "Democracy and the Party System", year: 1963}}
      - {position: firm.ownership.state, in: {author: Julius Nyerere, title: "The Arusha Declaration", year: 1967}}
      - {position: agrarian.question.communal-tenure, in: {author: Julius Nyerere, title: "Socialism and Rural Development", year: 1967}}

  - id: thinker.sankara
    name: Thomas Sankara
    born: 1949
    died: 1987
    region: Burkina Faso
    traditions: [marxism.african-socialism, nationalism.pan-africanism]
    summary: Army captain who led Burkina Faso from 1983 until he was killed in the 1987 coup that brought Blaise Compaoré to power. His government ran mass vaccination, literacy and land programmes and refused new foreign loans.
    argues:
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: Thomas Sankara, title: "Political Orientation Speech", year: 1983}}
      - {position: feminism.subordination.private-property, in: {author: Thomas Sankara, title: "The Revolution Cannot Triumph Without the Emancipation of Women", year: 1987, note: "speech of 8 March 1987"}}
      - {position: intl.institutions.creditor-instruments, in: {author: Thomas Sankara, title: "A United Front Against Debt", year: 1987, note: "speech to the Organization of African Unity, Addis Ababa"}}
      - {position: debt.sovereign.already-paid, in: {author: Thomas Sankara, title: "A United Front Against Debt", year: 1987, note: "speech to the Organization of African Unity, Addis Ababa"}}
      - {position: debt.sovereign.already-paid, in: {author: Thomas Sankara, title: "A United Front Against Debt", year: 1987, note: "debt as the reconquest of Africa; a common refusal to pay"}}
      - {position: hist.sankara.self-reliant-revolution, in: {author: Thomas Sankara, title: "Political Orientation Speech", year: 1983, note: "2 October 1983: a national democratic and popular revolution relying on the country's own forces, with agrarian transformation and the emancipation of women, against imperialist domination"}}

  - id: thinker.du-bois
    name: W. E. B. Du Bois
    born: 1868
    died: 1963
    region: United States / Ghana
    traditions: [marxism.black-radical, nationalism.pan-africanism]
    summary: American historian and sociologist, co-founder of the NAACP and organizer of the Pan-African Congresses, who moved toward Marxism and died a citizen of Ghana.
    argues:
      - {position: racism.remedy.equal-treatment-law, in: {author: W. E. B. Du Bois, title: "The Souls of Black Folk", year: 1903, note: "chapter 'Of Mr. Booker T. Washington and Others'"}}
      - {position: war.militarism.imperialist-rivalry, in: {author: W. E. B. Du Bois, title: "The African Roots of War", year: 1915}}
      - {position: labor.aristocracy.shares-but-exploited, in: {author: W. E. B. Du Bois, title: "The African Roots of War", year: 1915}}
      - {position: labor.division.race-caste-nation, in: {author: W. E. B. Du Bois, title: "Black Reconstruction in America", year: 1935}}
      - {position: hist.wwi-1914.colonial-war, in: {author: W. E. B. Du Bois, title: The African Roots of War, year: 1915, note: "The Atlantic Monthly, May 1915"}}
