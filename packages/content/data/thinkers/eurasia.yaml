thinkers:
  - id: thinker.dugin
    name: Alexander Dugin
    born: 1962
    region: Russia
    traditions: [nationalism.eurasianism]
    summary: >-
      Russian philosopher, co-founder of the National Bolshevik Party in 1993 and founder of the International
      Eurasian Movement. He holds that history is a struggle between the sea power of the Atlantic world and the
      land power of Eurasia, and proposes a Fourth Political Theory against liberalism, communism and fascism,
      built on the plurality of civilizations and of peoples rooted in tradition.
    argues:
      - {position: world.order.civilizational-poles, in: {author: Alexander Dugin, title: "Foundations of Geopolitics: The Geopolitical Future of Russia", year: 1997}}
      - {position: contradiction.primary.globalism-vs-nations, in: {author: Alexander Dugin, title: The Fourth Political Theory, year: 2009, note: "English translation 2012"}}
      - {position: imperialism.nature.globalist-project, in: {author: Alexander Dugin, title: The Fourth Political Theory, year: 2009, note: "English translation 2012"}}

  - id: thinker.panarin
    name: Alexander Panarin
    born: 1940
    died: 2003
    region: Russia
    traditions: [nationalism.eurasianism]
    summary: >-
      Political philosopher at Moscow State University who moved from liberalism in the early 1990s to a
      civilizational Eurasianism. Against Fukuyama's end of history he argued that the great civilizations would
      reassert themselves against Western globalism, and that Russia should lead a Eurasian alternative to it.
    argues:
      - {position: world.order.civilizational-poles, in: {author: Alexander Panarin, title: "Revanche of History: Russia's Strategic Initiative in the Twenty-First Century", year: 1998, note: "Russian original Revansh istorii"}}
