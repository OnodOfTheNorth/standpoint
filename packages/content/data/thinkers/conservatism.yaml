# Thinkers: the conservative family (Burkean, reactionary, one-nation,
# Catholic social teaching, distributism, traditionalist, neoconservative,
# paleoconservative, national conservative).
thinkers:
  - id: thinker.burke
    name: Edmund Burke
    born: 1729
    died: 1797
    region: Ireland / Great Britain
    traditions: [conservatism.burkean]
    summary: >
      Irish-born Whig statesman who defended the American colonists and prosecuted Warren Hastings for
      abuses in India, then denounced the French Revolution as the wreck of inherited order by abstract
      reason. He held that rights, institutions and authority are an inheritance tested by time.
    argues:
      - {position: authority.legitimacy.prescription, in: {author: Edmund Burke, title: Speech on the Reform of the Representation of the Commons in Parliament, year: 1782}}
      - {position: hist.french-revolution.burkean-catastrophe, in: {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}}
      - {position: rights.basis.inheritance, in: {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}}
      - {position: reform.revolution.change-to-conserve, in: {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}}
      - {position: wage.nature.voluntary-exchange, in: {author: Edmund Burke, title: Thoughts and Details on Scarcity, year: 1800, note: "written 1795, published posthumously"}}
      - {position: tradition.modernity.inherited-wisdom, in: {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}}

  - id: thinker.de-maistre
    name: Joseph de Maistre
    born: 1753
    died: 1821
    region: Savoy / Russia
    traditions: [conservatism.reactionary, conservatism.monarchist]
    summary: >
      Savoyard magistrate and diplomat who read the French Revolution as divine punishment, held that
      constitutions are made by God and time rather than written by men, and defended throne, altar and
      the executioner as the props of social order.
    argues:
      - {position: history.motor.providence, in: {author: Joseph de Maistre, title: Considerations on France, year: 1797}}
      - {position: hist.french-revolution.war-on-faith, in: {author: Joseph de Maistre, title: Considerations on France, year: 1797}}
      - {position: authority.legitimacy.divine-ordinance, in: {author: Joseph de Maistre, title: Essay on the Generative Principle of Political Constitutions, year: 1814}}
      - {position: human.nature.fallen, in: {author: Joseph de Maistre, title: St Petersburg Dialogues, year: 1821}}
      - {position: tradition.modernity.sacred-order, in: {author: Joseph de Maistre, title: Considerations on France, year: 1797}}

  - id: thinker.disraeli
    name: Benjamin Disraeli
    born: 1804
    died: 1881
    region: United Kingdom
    traditions: [conservatism.one-nation]
    summary: >
      British novelist and Conservative prime minister who described England as two nations, rich and poor,
      and called on the landed class to take up its duties to the poor. In office he widened the male
      franchise, passed public health and factory laws, and made Victoria Empress of India.
    argues:
      - {position: workplace.conflict.mutual-duties, in: {author: Benjamin Disraeli, title: "Sybil, or The Two Nations", year: 1845}}
      - {position: reform.revolution.change-to-conserve, in: {author: Benjamin Disraeli, title: Speech at the Crystal Palace, year: 1872}}

  - id: thinker.leo-xiii
    name: Pope Leo XIII
    born: 1810
    died: 1903
    region: Italy / Holy See
    traditions: [conservatism.cst, conservatism.integralism]
    summary: >
      Pope from 1878 to 1903 whose encyclical on capital and labor founded modern Catholic social teaching:
      private property is a natural right, socialism is rejected, and employers owe workers a wage that
      keeps a family in frugal decency. He also taught that the state must publicly profess the true
      religion.
    argues:
      - {position: state.nature.ordained-authority, in: {author: Pope Leo XIII, title: Diuturnum, year: 1881}}
      - {position: democracy.form.confessional-state, in: {author: Pope Leo XIII, title: Immortale Dei, year: 1885}}
      - {position: property.private.natural-right, in: {author: Pope Leo XIII, title: Rerum Novarum, year: 1891}}
      - {position: wage.nature.just-wage, in: {author: Pope Leo XIII, title: Rerum Novarum, year: 1891}}
      - {position: workplace.conflict.mutual-duties, in: {author: Pope Leo XIII, title: Rerum Novarum, year: 1891}}
      - {position: society.units.families, in: {author: Leo XIII, title: Rerum Novarum, year: 1891, note: "the family as a true society, older than any state"}}
      - {position: equality.concept.equal-dignity, in: {author: Leo XIII, title: Rerum Novarum, year: 1891}}
      - {position: picket.line.lawful-strikes-only, in: {author: Leo XIII, title: Rerum Novarum, year: 1891, note: "on strikes: the law should remove their causes and keep public order"}}

  - id: thinker.pius-xi
    name: Pope Pius XI
    born: 1857
    died: 1939
    region: Italy / Holy See
    traditions: [conservatism.cst]
    summary: >
      Pope from 1922 to 1939 who restated Catholic social teaching after the 1929 crash, naming
      subsidiarity as a principle and proposing vocational orders to replace class conflict. He signed the
      Lateran Treaty with Mussolini's government in 1929 and later condemned both Nazism and communism in
      separate encyclicals.
    argues:
      - {position: property.private.social-function, in: {author: Pope Pius XI, title: Quadragesimo Anno, year: 1931}}
      - {position: federalism.scale.subsidiarity, in: {author: Pope Pius XI, title: Quadragesimo Anno, year: 1931}}
      - {position: class.concept.functional-estates, in: {author: Pope Pius XI, title: Quadragesimo Anno, year: 1931}}

  - id: thinker.chesterton
    name: G. K. Chesterton
    born: 1874
    died: 1936
    region: England
    traditions: [conservatism.distributism]
    summary: >
      English writer and Catholic convert who, with Hilaire Belloc, argued that the trouble with capitalism
      is too few capitalists, and that productive property, land above all, should be spread among as many
      families as possible.
    argues:
      - {position: family.form.natural-institution, in: {author: G. K. Chesterton, title: The Superstition of Divorce, year: 1920}}
      - {position: capitalism.nature.concentrated-ownership, in: {author: G. K. Chesterton, title: The Outline of Sanity, year: 1926}}
      - {position: firm.ownership.small-proprietors, in: {author: G. K. Chesterton, title: The Outline of Sanity, year: 1926}}
      - {position: housing.tenure.homeownership, in: {author: G. K. Chesterton, title: The Outline of Sanity, year: 1926}}

  - id: thinker.schmitt
    name: Carl Schmitt
    born: 1888
    died: 1985
    region: Germany
    traditions: [conservatism.reactionary, fascism.nazism]
    summary: >
      German jurist who defined the sovereign as whoever decides on the exception and politics as the
      distinction of friend and enemy. He joined the Nazi party in 1933, publicly justified the killings of
      June 1934, and lost his party offices in 1936; he never recanted.
    argues:
      - {position: emergency.powers.sovereign-exception, in: {author: Carl Schmitt, title: Dictatorship, year: 1921}}
      - {position: law.nature.sovereign-decision, in: {author: Carl Schmitt, title: "Political Theology: Four Chapters on the Concept of Sovereignty", year: 1922}}
      - {position: conflict.nature.friend-enemy, in: {author: Carl Schmitt, title: The Concept of the Political, year: 1927}}
      - {position: world.order.civilizational-poles, in: {author: Carl Schmitt, title: The Großraum Order of International Law with a Ban on Intervention for Spatially Foreign Powers, year: 1939}}
      - {position: siege.governance.national-security-state, in: {author: Carl Schmitt, title: Political Theology, year: 1922, note: "sovereign is he who decides on the exception"}}

  - id: thinker.oakeshott
    name: Michael Oakeshott
    born: 1901
    died: 1990
    region: England
    traditions: [conservatism.burkean]
    summary: >
      English philosopher who attacked rationalism in politics, the belief that society can be run from a
      book of technique, and described the conservative disposition as preferring the familiar to the
      unknown and present enjoyment to utopian bliss.
    argues:
      - {position: knowledge.basis.tradition, in: {author: Michael Oakeshott, title: Rationalism in Politics, year: 1947}}
      - {position: change.tempo.slow-and-organic, in: {author: Michael Oakeshott, title: Rationalism in Politics and Other Essays, year: 1962, note: "essay \"On Being Conservative\" (1956)"}}

  - id: thinker.kirk
    name: Russell Kirk
    born: 1918
    died: 1994
    region: United States
    traditions: [conservatism.traditionalist]
    summary: >
      American man of letters whose history of Anglo-American conservative thought gave the post-war
      American right a lineage from Burke, built on transcendent moral order, prescription, and the
      conviction that society needs orders and classes.
    argues:
      - {position: morality.basis.natural-law, in: {author: Russell Kirk, title: The Conservative Mind, year: 1953}}
      - {position: equality.concept.natural-hierarchy, in: {author: Russell Kirk, title: The Conservative Mind, year: 1953}}
      - {position: liberty.concept.ordered-liberty, in: {author: Russell Kirk, title: The Roots of American Order, year: 1974}}
      - {position: tradition.modernity.inherited-wisdom, in: {author: Russell Kirk, title: The Conservative Mind, year: 1953}}

  - id: thinker.scruton
    name: Roger Scruton
    born: 1944
    died: 2020
    region: England
    traditions: [conservatism.burkean, conservatism.traditionalist]
    summary: >
      English philosopher who defended conservatism as love of home, of settled institutions and of the
      nation as a territorial community of strangers, and who argued that ecology is a conservative cause.
      He helped run underground seminars for dissidents in communist Czechoslovakia.
    argues:
      - {position: morality.basis.tradition, in: {author: Roger Scruton, title: The Meaning of Conservatism, year: 1980}}
      - {position: nation.belonging.assimilation, in: {author: Roger Scruton, title: The Need for Nations, year: 2004}}
      - {position: growth.ecology.home-and-stewardship, in: {author: Roger Scruton, title: "Green Philosophy: How to Think Seriously About the Planet", year: 2012}}
      - {position: ecology.crisis-cause.lost-piety, in: {author: Roger Scruton, title: "Green Philosophy: How to Think Seriously About the Planet", year: 2012}}

  - id: thinker.kagan
    name: Robert Kagan
    born: 1958
    died: null
    region: United States
    traditions: [conservatism.neo, liberalism.internationalist]
    summary: >
      American historian and co-founder of the Project for the New American Century who argues that the
      world order since 1945 rests on American military power, and that the main rivalry of the age is
      between liberal democracies and autocracies.
    argues:
      - {position: war.militarism.peace-through-strength, in: {author: Robert Kagan, title: "Of Paradise and Power: America and Europe in the New World Order", year: 2003}}
      - {position: contradiction.primary.democracy-vs-autocracy, in: {author: Robert Kagan, title: The Return of History and the End of Dreams, year: 2008}}
      - {position: world.order.american-primacy, in: {author: Robert Kagan, title: The World America Made, year: 2012}}
      - {position: hist.cold-war.victory-over-evil, in: {author: William Kristol and Robert Kagan, title: Toward a Neo-Reaganite Foreign Policy, year: 1996, note: "Foreign Affairs; credits Reagan's moral clarity and military build-up with winning the Cold War"}}

  - id: thinker.pat-buchanan
    name: Pat Buchanan
    born: 1938
    died: null
    region: United States
    traditions: [conservatism.paleo, conservatism.right-populism]
    summary: >
      American speechwriter for Nixon and Reagan and three-time presidential candidate who opposed free
      trade agreements, foreign wars and mass immigration, and warned that low birth rates and immigration
      would end the West as a civilization.
    argues:
      - {position: tax.purpose.tariffs-for-the-nation, in: {author: Patrick J. Buchanan, title: The Great Betrayal, year: 1998}}
      - {position: world.order.restraint, in: {author: Patrick J. Buchanan, title: "A Republic, Not an Empire", year: 1999}}
      - {position: population.question.too-few-births, in: {author: Patrick J. Buchanan, title: The Death of the West, year: 2002}}
      - {position: borders.migration.restrict-national, in: {author: Patrick J. Buchanan, title: State of Emergency, year: 2006}}
      - {position: culture.war.civilizational-struggle, in: {author: Patrick J. Buchanan, title: Address to the Republican National Convention, year: 1992, note: "17 August 1992: a religious war and a cultural war for the soul of America"}}
      - {position: hist.neoliberal-turn.betrayal-of-the-nation, in: {author: Patrick J. Buchanan, title: "The Great Betrayal: How American Sovereignty and Social Justice Are Being Sacrificed to the Gods of the Global Economy", year: 1998}}

  - id: thinker.hazony
    name: Yoram Hazony
    born: 1964
    died: null
    region: Israel / United States
    traditions: [conservatism.national]
    summary: >
      Israeli-American philosopher and organizer of the National Conservatism conferences who argues that
      a world of independent nation-states beats any universal empire or federation, and that public life
      should rest on the nation's inherited religion.
    argues:
      - {position: nationalism.kinds.virtue-of-nations, in: {author: Yoram Hazony, title: The Virtue of Nationalism, year: 2018}}
      - {position: intl.institutions.globalist-overreach, in: {author: Yoram Hazony, title: The Virtue of Nationalism, year: 2018}}
      - {position: religion.public.heritage-establishment, in: {author: Yoram Hazony, title: "Conservatism: A Rediscovery", year: 2022}}

  - id: thinker.maurras
    name: Charles Maurras
    born: 1868
    died: 1952
    region: France
    traditions: [conservatism.monarchist, conservatism.reactionary]
    summary: >
      French writer who led Action française from the Dreyfus affair to the Second World War. He called his
      doctrine integral nationalism: the national interest comes first, and its logical conclusion is a
      hereditary, anti-parliamentary monarchy. A virulent antisemite, he backed the Vichy government and was
      sentenced to life imprisonment in 1945.
    argues:
      - {position: democracy.form.monarchy, in: {author: Charles Maurras, title: Enquête sur la monarchie, year: 1900}}
      - {position: interests.objective.national-interest, in: {author: Charles Maurras, title: Enquête sur la monarchie, year: 1900, note: "integral nationalism: the nation's interest as the measure of politics"}}

  - id: thinker.macmillan
    name: Harold Macmillan
    born: 1894
    died: 1986
    region: United Kingdom
    traditions: [conservatism.one-nation]
    summary: >
      Conservative MP for depressed Stockton-on-Tees in the 1920s and 1930s, later prime minister from 1957
      to 1963. He argued for a planned capitalism between laissez-faire and socialism, with public direction of
      investment and a minimum standard of living, so that private enterprise could survive with consent.
    argues:
      - {position: capitalism.nature.managed-engine, in: {author: Harold Macmillan, title: The Middle Way, year: 1938}}

  - id: thinker.churchill
    name: Winston Churchill
    born: 1874
    died: 1965
    region: United Kingdom
    traditions: [conservatism.one-nation]
    summary: >
      British Conservative prime minister during the Second World War and again from 1951 to 1955, and a
      lifelong defender of the British Empire. He held the war to be a necessary struggle against Nazi
      tyranny that earlier resolve could have prevented. His war cabinet kept food exports and shipping
      policy in place during the Bengal famine of 1943, in which some three million people died.
    argues:
      - {position: hist.ww2.just-war-against-fascism, in: {author: Winston S. Churchill, title: "The Second World War, Volume I: The Gathering Storm", year: 1948}}

  - id: thinker.maritain
    name: Jacques Maritain
    born: 1882
    died: 1973
    region: France
    traditions: [conservatism.christian-democracy]
    summary: >
      French Catholic philosopher who broke with Action française after the papal condemnation of 1926 and
      became the main theorist of Christian democracy. His personalism held that society is made of persons
      with a destiny beyond the state, and he took part in the drafting debates of the Universal Declaration
      of Human Rights.
    argues:
      - {position: society.units.persons, in: {author: Jacques Maritain, title: The Person and the Common Good, year: 1947}}
      - {position: rights.basis.natural-law-duties, in: {author: Jacques Maritain, title: The Rights of Man and Natural Law, year: 1942}}
      - {position: rights.basis.universal-consensus, in: {author: Jacques Maritain, title: "Introduction to Human Rights: Comments and Interpretations", year: 1949, note: "UNESCO symposium: agreement on rights is possible among people who disagree on why"}}

  - id: thinker.belloc
    name: Hilaire Belloc
    born: 1870
    died: 1953
    region: France / England
    traditions: [conservatism.distributism]
    summary: >
      French-born English writer and Liberal MP, with Chesterton the founder of distributism. He argued that
      capitalism, in which a few own the means of production, was sliding into a servile state where the
      propertyless majority would be bound to labor by law, and that the remedy was to restore property to
      the many.
    argues:
      - {position: capitalism.nature.concentrated-ownership, in: {author: Hilaire Belloc, title: The Servile State, year: 1912}}
      - {position: firm.ownership.small-proprietors, in: {author: Hilaire Belloc, title: An Essay on the Restoration of Property, year: 1936}}

  - id: thinker.vermeule
    name: Adrian Vermeule
    born: 1968
    died: null
    region: United States
    traditions: [conservatism.integralism, conservatism.postliberal]
    summary: >
      Harvard constitutional lawyer and Catholic convert. He argues that law should be read in the light of the
      common good as the classical legal tradition understood it, that believers should reshape the
      administrative state from within, and, with Eric Posner, that in crises the executive is bound by
      politics rather than by law.
    argues:
      - {position: interests.objective.common-good, in: {author: Adrian Vermeule, title: Common Good Constitutionalism, year: 2022}}
      - {position: state.relation.restore, in: {author: Adrian Vermeule, title: Integration from Within, year: 2018, note: "American Affairs, spring 2018"}}
      - {position: emergency.powers.sovereign-exception, in: {author: Eric A. Posner and Adrian Vermeule, title: "The Executive Unbound: After the Madisonian Republic", year: 2010, note: "law does not and cannot constrain the executive in emergencies; only politics and opinion do"}}

  - id: thinker.deneen
    name: Patrick Deneen
    born: 1964
    died: null
    region: United States
    traditions: [conservatism.postliberal]
    summary: >
      Notre Dame political theorist. He argues that liberalism failed because it succeeded: by freeing
      individuals from family, place, church and custom it produced atomized consumers, a market society and
      a self-serving meritocratic elite. He proposes replacing liberal rule with a mixed government of the many and
      a new elite bound to serve them.
    argues:
      - {position: capitalism.nature.market-society, in: {author: Patrick J. Deneen, title: Why Liberalism Failed, year: 2018}}
      - {position: state.relation.restore, in: {author: Patrick J. Deneen, title: "Regime Change: Toward a Postliberal Future", year: 2023}}

  - id: thinker.buckley
    name: William F. Buckley Jr.
    born: 1925
    died: 2008
    region: United States
    traditions: [conservatism.fusionism]
    summary: >
      American writer who founded National Review in 1955 and made it the meeting place of traditionalists,
      free-market libertarians and anti-communists. His first book attacked Yale for teaching against
      Christianity and free enterprise and demanded that its trustees restore both.
    argues:
      - {position: alliances.policy.fusion-of-the-right, in: {author: William F. Buckley Jr., title: Our Mission Statement, year: 1955, note: "founding statement of National Review"}}
      - {position: university.neutrality.faith-mission, in: {author: William F. Buckley Jr., title: God and Man at Yale, year: 1951}}

  - id: thinker.meyer
    name: Frank S. Meyer
    born: 1909
    died: 1972
    region: United States
    traditions: [conservatism.fusionism]
    summary: >
      Former Communist organizer who became a senior editor of National Review. He gave the US conservative
      coalition its theory: virtue is the end of human life, but it can only be chosen freely, so the state
      must be limited to protecting liberty and order, and traditionalists and libertarians belong together.
    argues:
      - {position: alliances.policy.fusion-of-the-right, in: {author: Frank S. Meyer, title: "In Defense of Freedom: A Conservative Credo", year: 1962}}
      - {position: society.units.individuals, in: {author: Frank S. Meyer, title: "In Defense of Freedom: A Conservative Credo", year: 1962, note: "only individual persons are real; society is not an organism with ends of its own"}}

  - id: thinker.burnham
    name: James Burnham
    born: 1905
    died: 1987
    region: United States
    traditions: [conservatism.fusionism]
    summary: >
      American philosopher who led the Trotskyist movement in the 1930s, broke with Marxism in 1940 and became
      a senior editor of National Review. He argued that a managerial class was replacing capitalists in
      Nazi Germany, the Soviet Union and New Deal America alike, that minorities always rule, and that the
      United States should roll back Soviet power rather than contain it.
    argues:
      - {position: totalitarianism.concept.bureaucratic-class, in: {author: James Burnham, title: The Managerial Revolution, year: 1941, note: "written as he left the Trotskyist movement; Nazism, Stalinism and the New Deal as managerial societies"}}
      - {position: history.elites.iron-law, in: {author: James Burnham, title: "The Machiavellians: Defenders of Freedom", year: 1943}}
      - {position: hist.cold-war.victory-over-evil, in: {author: James Burnham, title: Containment or Liberation?, year: 1953, note: "argued for liberation of the Soviet bloc instead of containment"}}

  - id: thinker.goldberg
    name: Jonah Goldberg
    born: 1969
    died: null
    region: United States
    traditions: [conservatism.fusionism]
    summary: >
      American conservative journalist, long at National Review. He argued that fascism was a movement of the
      left, born of the same progressive faith in the state as American liberalism.
    argues:
      - {position: fascism.nature.a-form-of-socialism, in: {author: Jonah Goldberg, title: "Liberal Fascism: The Secret History of the American Left, From Mussolini to the Politics of Meaning", year: 2008}}

  - id: thinker.kristol
    name: Irving Kristol
    born: 1920
    died: 2009
    region: United States
    traditions: [conservatism.neo]
    summary: >
      New York editor, a Trotskyist in his youth, who founded The Public Interest and became known as the
      godfather of neoconservatism. He defended capitalism with two cheers and argued that a "new class" of
      intellectuals and public-sector professionals used its hold on universities, media and bureaucracy to
      turn opinion against business and bourgeois morality.
    argues:
      - {position: ideology.formation.elite-indoctrination, in: {author: Irving Kristol, title: Two Cheers for Capitalism, year: 1978, note: "the essays on the new class"}}

  - id: thinker.podhoretz
    name: Norman Podhoretz
    born: 1930
    died: 2025
    region: United States
    traditions: [conservatism.neo]
    summary: >
      Editor of Commentary from 1960 to 1995, who moved from the New York left to neoconservatism. He called
      for a military build-up against the Soviet Union in the late 1970s and, after 2001, for wars to remove
      hostile governments in the Middle East and spread liberal democracy there.
    argues:
      - {position: intervention.humanitarian.spread-liberty, in: {author: Norman Podhoretz, title: "World War IV: The Long Struggle Against Islamofascism", year: 2007}}

  - id: thinker.kirkpatrick
    name: Jeane Kirkpatrick
    born: 1926
    died: 2006
    region: United States
    traditions: [conservatism.neo]
    summary: >
      American political scientist, a Democrat who became Reagan's ambassador to the United Nations. She
      argued that right-wing authoritarian governments allied to the United States leave society alone and can
      evolve toward liberal democracy, while communist totalitarian ones cannot, so Washington should not
      undermine its authoritarian allies.
    argues:
      - {position: totalitarianism.concept.syndrome-model, in: {author: Jeane Kirkpatrick, title: Dictatorships and Double Standards, year: 1979, note: "Commentary, November 1979"}}

  - id: thinker.mac-donald
    name: Heather Mac Donald
    born: 1956
    died: null
    region: United States
    traditions: [conservatism.neo]
    summary: >
      American lawyer and writer at the Manhattan Institute and City Journal. She argues that the campaign
      against police after 2014 made officers withdraw from proactive policing, that violent crime rose as a
      result, and that the victims were mostly residents of poor Black neighborhoods.
    argues:
      - {position: police.accountability.back-the-police, in: {author: Heather Mac Donald, title: "The War on Cops: How the New Attack on Law and Order Makes Everyone Less Safe", year: 2016}}

  - id: thinker.gottfried
    name: Paul Gottfried
    born: 1941
    died: null
    region: United States
    traditions: [conservatism.paleo]
    summary: >
      American historian who coined the word paleoconservative. He argues that nineteenth-century liberalism
      has been replaced by a managerial state whose social engineers reshape mass opinion, and that present
      antifascism is a weapon of that state against its critics on the right.
    argues:
      - {position: ideology.formation.elite-indoctrination, in: {author: Paul Edward Gottfried, title: "After Liberalism: Mass Democracy in the Managerial State", year: 1999}}
      - {position: fascism.response.threat-overblown, in: {author: Paul E. Gottfried, title: "Antifascism: The Course of a Crusade", year: 2021}}

  - id: thinker.orban
    name: Viktor Orbán
    born: 1963
    died: null
    region: Hungary
    traditions: [conservatism.national, conservatism.right-populism]
    summary: >
      Prime minister of Hungary from 1998 to 2002 and from 2010 to 2026, leader of Fidesz. In 2014 he
      announced that Hungary would build an illiberal state organized around the national community rather
      than liberal principles, and his governments rewrote the constitution, the media and electoral law to
      that end.
    argues:
      - {position: state.relation.restore, in: {author: Viktor Orbán, title: Speech at the 25th Bálványos Summer Free University and Student Camp, year: 2014, note: "Băile Tuşnad, 26 July 2014: the 'illiberal state' speech"}}

  - id: thinker.de-gaulle
    name: Charles de Gaulle
    born: 1890
    died: 1970
    region: France
    traditions: [conservatism.gaullism]
    summary: >
      French general who led the Free French from London after 1940, headed the provisional government, and
      founded the Fifth Republic in 1958 with a strong presidency. He waged and then ended the Algerian war,
      and took France out of NATO's integrated command in 1966 to keep its policy independent of both blocs.
    argues:
      - {position: interests.objective.national-interest, in: {author: Charles de Gaulle, title: "War Memoirs, Volume I: The Call to Honour", year: 1954, note: "'a certain idea of France'"}}
      - {position: intl.sovereignty.nations-set-own-course, in: {author: Charles de Gaulle, title: Press Conference of 21 February 1966, year: 1966, note: "announcing withdrawal from NATO's integrated command"}}

  - id: thinker.seguin
    name: Philippe Séguin
    born: 1943
    died: 2010
    region: Tunisia / France
    traditions: [conservatism.gaullism]
    summary: >
      Tunis-born Gaullist deputy and minister. In 1992 he led the Gaullist opposition to the Maastricht treaty,
      arguing that national sovereignty belongs to the people and cannot be transferred by parliament to
      European institutions.
    argues:
      - {position: intl.sovereignty.nations-set-own-course, in: {author: Philippe Séguin, title: Speech to the National Assembly against the Maastricht Treaty, year: 1992, note: "motion of unconstitutionality, 5 May 1992"}}

  - id: thinker.morgenthau
    name: Hans Morgenthau
    born: 1904
    died: 1980
    region: Germany / United States
    traditions: [conservatism.realism]
    summary: >
      German-Jewish jurist who emigrated to the United States and founded postwar realist theory of
      international politics. He held that statesmen think and act in terms of interest defined as power, and
      he opposed the Vietnam War as serving no vital American interest.
    argues:
      - {position: interests.objective.national-interest, in: {author: Hans J. Morgenthau, title: Politics Among Nations, year: 1948}}
      - {position: intervention.humanitarian.national-interest-only, in: {author: Hans J. Morgenthau, title: In Defense of the National Interest, year: 1951}}

  - id: thinker.waltz
    name: Kenneth Waltz
    born: 1924
    died: 2013
    region: United States
    traditions: [conservatism.realism]
    summary: >
      American theorist of international relations who founded structural realism. He explained war by the
      absence of any authority above states, and held that the bipolar order of the Cold War was more stable
      than a world of many great powers.
    argues:
      - {position: war.militarism.anarchy-security, in: {author: Kenneth N. Waltz, title: "Man, the State, and War", year: 1959}}
      - {position: hist.cold-war.security-rivalry, in: {author: Kenneth N. Waltz, title: Theory of International Politics, year: 1979}}

  - id: thinker.kennan
    name: George F. Kennan
    born: 1904
    died: 2005
    region: United States
    traditions: [conservatism.realism]
    summary: >
      American diplomat who, writing as X in 1947, proposed patient containment of Soviet expansion until the
      Soviet system broke up or mellowed. He later criticized the militarization of containment, the
      legalistic-moralistic strain in US foreign policy, and NATO's expansion east.
    argues:
      - {position: hist.cold-war.containment-won, in: {author: George F. Kennan, title: The Sources of Soviet Conduct, year: 1947}}
      - {position: intervention.humanitarian.national-interest-only, in: {author: George F. Kennan, title: "American Diplomacy, 1900–1950", year: 1951}}

  - id: thinker.devlin
    name: Patrick Devlin
    born: 1905
    died: 1992
    region: United Kingdom
    traditions: [conservatism.burkean]
    summary: >
      English judge and law lord. Against the Wolfenden report on homosexuality and prostitution, he argued
      that a society is held together by a shared morality and may use the criminal law to protect it, as it
      protects itself against treason.
    argues:
      - {position: speech.limits.protect-the-sacred, in: {author: Patrick Devlin, title: The Enforcement of Morals, year: 1959, note: "Maccabaean Lecture; the claim that law may protect public morality"}}

  - id: thinker.voegelin
    name: Eric Voegelin
    born: 1901
    died: 1985
    region: Austria / United States
    traditions: [conservatism.traditionalist]
    summary: >
      Austrian political philosopher who fled the Nazi annexation in 1938 and taught in the United States. He
      held that Nazism and communism were political religions, modern gnostic movements that promised
      salvation within history. American traditionalist conservatives adopted him, though he rejected the label.
    argues:
      - {position: totalitarianism.concept.political-religion, in: {author: Eric Voegelin, title: The Political Religions, year: 1938}}

  - id: thinker.junger
    name: Ernst Jünger
    born: 1895
    died: 1998
    region: Germany
    traditions: [conservatism.reactionary]
    summary: >
      German storm-troop officer of the First World War and writer of the Conservative Revolution of the
      Weimar years. He described the front as the forge of a new type of man beyond the bourgeois world. He
      refused to join the Nazi party and later wrote a veiled attack on it.
    argues:
      - {position: hist.wwi-1914.front-generation, in: {author: Ernst Jünger, title: Battle as Inner Experience, year: 1922}}

  - id: thinker.falwell
    name: Jerry Falwell
    born: 1933
    died: 2007
    region: United States
    traditions: [conservatism.evangelical-right]
    summary: >
      Baptist pastor in Lynchburg, Virginia, who founded the Moral Majority in 1979 to bring evangelical voters
      into politics. He held that America was in moral decline through abortion, pornography, feminism and
      secular schooling, and that the family was the foundation of the nation.
    argues:
      - {position: culture.war.civilizational-struggle, in: {author: Jerry Falwell, title: "Listen, America!", year: 1980}}
      - {position: society.units.families, in: {author: Jerry Falwell, title: "Listen, America!", year: 1980}}

  - id: thinker.schaeffer
    name: Francis Schaeffer
    born: 1912
    died: 1984
    region: United States / Switzerland
    traditions: [conservatism.evangelical-right]
    summary: >
      American Presbyterian theologian who ran the L'Abri community in Switzerland. He argued that once
      humanism cut law loose from God, nothing restrained the state, and that Christians must resist laws
      that contradict God's law, abortion first of all.
    argues:
      - {position: rights.basis.revealed-law, in: {author: Francis A. Schaeffer, title: A Christian Manifesto, year: 1981}}
      - {position: totalitarianism.concept.godless-modernity, in: {author: Francis A. Schaeffer, title: How Should We Then Live?, year: 1976}}

  - id: thinker.rushdoony
    name: R. J. Rushdoony
    born: 1916
    died: 2001
    region: United States
    traditions: [conservatism.evangelical-right]
    summary: >
      Armenian-American Presbyterian minister who founded Christian Reconstructionism. He held that biblical
      law should govern every sphere of life, including the civil law, and that state schooling was a rival
      religion, which made him a founder of the Christian homeschooling movement.
    argues:
      - {position: law.nature.divine-law, in: {author: R. J. Rushdoony, title: The Institutes of Biblical Law, year: 1973}}
      - {position: education.purpose.parental-authority, in: {author: R. J. Rushdoony, title: The Messianic Character of American Education, year: 1963}}

  - id: thinker.rufo
    name: Christopher Rufo
    born: 1984
    died: null
    region: United States
    traditions: [conservatism.national]
    summary: >
      American activist at the Manhattan Institute who campaigned against critical race theory and diversity
      programs. He argues that the New Left captured the universities and from there the other institutions,
      and that elected governments must retake them by law; in 2023 he was appointed a trustee of New College
      of Florida to remake it.
    argues:
      - {position: ideology.formation.elite-indoctrination, in: {author: Christopher F. Rufo, title: "America's Cultural Revolution: How the Radical Left Conquered Everything", year: 2023}}
      - {position: university.neutrality.restore-by-law, in: {author: Christopher F. Rufo, title: "America's Cultural Revolution: How the Radical Left Conquered Everything", year: 2023}}

  - id: thinker.john-paul-ii
    name: John Paul II (Karol Wojtyła)
    born: 1920
    died: 2005
    region: Poland
    traditions: [conservatism.cst]
    summary: >
      Polish archbishop of Kraków elected pope in 1978. He backed the Solidarity movement, taught that labor
      has priority over capital and that mothers' work at home deserves support, and condemned both Marxist
      socialism and a capitalism without moral limits.
    argues:
      - {position: hist.collapse-1989.peoples-revolutions, in: {author: John Paul II, title: Centesimus Annus, year: 1991, note: "chapter III, the year 1989"}}
      - {position: university.neutrality.faith-mission, in: {author: John Paul II, title: Ex Corde Ecclesiae, year: 1990}}
      - {position: care.work.family-vocation, in: {author: John Paul II, title: Laborem Exercens, year: 1981, note: "section 19: grants to mothers devoting themselves exclusively to their families"}}

  - id: thinker.ratzinger
    name: Joseph Ratzinger (Benedict XVI)
    born: 1927
    died: 2022
    region: Germany
    traditions: [conservatism.cst]
    summary: >
      German theologian who headed the Congregation for the Doctrine of the Faith from 1981 to 2005 and was
      pope as Benedict XVI from 2005 to 2013. His congregation's instructions of 1984 and 1986 condemned the use
      of Marxist class analysis in liberation theology while affirming the church's option for the poor.
    argues:
      - {position: conflict.nature.organic-harmony, in: {author: Congregation for the Doctrine of the Faith (prefect Joseph Ratzinger), title: "Instruction on Certain Aspects of the 'Theology of Liberation'", year: 1984}}
      - {position: solidarity.basis.one-body, in: {author: Congregation for the Doctrine of the Faith (prefect Joseph Ratzinger), title: Instruction on Christian Freedom and Liberation, year: 1986}}

  - id: thinker.booker-t-washington
    name: Booker T. Washington
    born: 1856
    died: 1915
    region: United States
    traditions: [commonsense.self-reliance]
    summary: >
      Born into slavery in Virginia, he built the Tuskegee Institute in Alabama and founded the National Negro
      Business League. He urged Black Southerners to build property, trades and businesses before pressing
      for political rights, while privately funding legal challenges to disfranchisement.
    argues:
      - {position: racism.remedy.self-determination, in: {author: Booker T. Washington, title: Atlanta Exposition Address, year: 1895}}
      - {position: cs.hard-work.effort-pays, in: {author: Booker T. Washington, title: Up from Slavery, year: 1901}}
      - {position: picket.line.need-first, in: {author: Booker T. Washington, title: The Negro and the Labor Unions, year: 1913, note: "Atlantic Monthly, June 1913: Black workers shut out of unions took strikers' places"}}
