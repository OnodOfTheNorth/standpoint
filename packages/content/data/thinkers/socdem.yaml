thinkers:
  - id: thinker.bernstein
    name: Eduard Bernstein
    born: 1850
    died: 1932
    region: Germany
    traditions: [socdem.revisionist]
    summary: German Social Democrat and literary executor of Engels who argued that capitalism was not heading for collapse and that socialism would come through parliamentary reform, starting the revisionism controversy.
    argues:
      - {position: reform.revolution.reform-is-the-road, in: {author: Eduard Bernstein, title: "The Preconditions of Socialism", year: 1899, note: "also translated as Evolutionary Socialism"}}
      - {position: change.tempo.inevitability-of-gradualness, in: {author: Eduard Bernstein, title: "The Preconditions of Socialism", year: 1899}}
      - {position: elections.role.main-road, in: {author: Eduard Bernstein, title: "The Preconditions of Socialism", year: 1899}}

  - id: thinker.meidner
    name: Rudolf Meidner
    born: 1914
    died: 2005
    region: Sweden
    traditions: [socdem.nordic]
    summary: German-born economist of the Swedish trade union confederation LO, co-author of the Rehn-Meidner model of solidaristic wages and author of the wage-earner funds plan.
    argues:
      - {position: wage.nature.bargaining-power, in: {author: Gösta Rehn and Rudolf Meidner, title: "Trade Unions and Full Employment", year: 1951, note: "LO congress report"}}
      - {position: allocation.mechanism.mixed-steered, in: {author: Gösta Rehn and Rudolf Meidner, title: "Trade Unions and Full Employment", year: 1951}}
      - {position: firm.ownership.wage-earner-funds, in: {author: Rudolf Meidner, title: "Employee Investment Funds: An Approach to Collective Capital Formation", year: 1978}}

  - id: thinker.crosland
    name: Anthony Crosland
    born: 1918
    died: 1977
    region: Britain
    traditions: [socdem.revisionist, socdem.labourism]
    summary: British Labour politician and cabinet minister who argued that managed capitalism had changed the meaning of socialism from public ownership to social equality.
    argues:
      - {position: capitalism.nature.managed-engine, in: {author: Anthony Crosland, title: "The Future of Socialism", year: 1956}}
      - {position: tax.purpose.redistribute, in: {author: Anthony Crosland, title: "The Future of Socialism", year: 1956}}
      - {position: allocation.mechanism.mixed-steered, in: {author: Anthony Crosland, title: "The Future of Socialism", year: 1956}}

  - id: thinker.harrington
    name: Michael Harrington
    born: 1928
    died: 1989
    region: United States
    traditions: [socdem.democratic-socialism]
    summary: American writer whose book on poverty helped launch the War on Poverty, and founder of the Democratic Socialists of America, who argued for gradual socialization as "the left wing of the possible."
    argues:
      - {position: markets.nature.socialist-markets, in: {author: Michael Harrington, title: "Socialism: Past and Future", year: 1989}}
      - {position: change.tempo.inevitability-of-gradualness, in: {author: Michael Harrington, title: "Socialism: Past and Future", year: 1989, note: "visionary gradualism"}}
