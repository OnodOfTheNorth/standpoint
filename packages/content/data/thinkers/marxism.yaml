thinkers:
  - id: thinker.marx
    name: Karl Marx
    born: 1818
    died: 1883
    region: Germany / England
    traditions: [marxism.classical]
    summary: German philosopher and economist who spent most of his working life in London analysing capitalism as a system of production for profit. With Engels he founded the tradition that bears his name.
    argues:
      - {position: history.motor.class-struggle, in: {author: Karl Marx and Friedrich Engels, title: "Manifesto of the Communist Party", year: 1848}}
      - {position: value.source.labor, in: {author: Karl Marx, title: "Capital, Volume I", year: 1867}}
      - {position: wage.nature.price-of-labor-power, in: {author: Karl Marx, title: "Capital, Volume I", year: 1867}}
      - {position: state.relation.smash-and-replace, in: {author: Karl Marx, title: "The Civil War in France", year: 1871}}
      - {position: allocation.mechanism.free-access, in: {author: Karl Marx, title: "Critique of the Gotha Programme", year: 1875, note: "written 1875; first published by Engels in 1891"}}

  - id: thinker.engels
    name: Friedrich Engels
    born: 1820
    died: 1895
    region: Germany / England
    traditions: [marxism.classical]
    summary: Manchester mill manager's son and Marx's lifelong collaborator, who wrote on the English working class, the family, the state and natural science, and edited Capital after Marx's death.
    argues:
      - {position: state.nature.class-instrument, in: {author: Friedrich Engels, title: "The Origin of the Family, Private Property and the State", year: 1884}}
      - {position: feminism.subordination.private-property, in: {author: Friedrich Engels, title: "The Origin of the Family, Private Property and the State", year: 1884}}
      - {position: hist.french-revolution.bourgeois-revolution, in: {author: Friedrich Engels, title: "Socialism: Utopian and Scientific", year: 1880}}
      - {position: nature.value.metabolism, in: {author: Friedrich Engels, title: "The Part Played by Labour in the Transition from Ape to Man", year: 1896, note: "written 1876"}}

  - id: thinker.lenin
    name: Vladimir Ilyich Lenin
    born: 1870
    died: 1924
    region: Russia
    traditions: [marxism.leninism]
    summary: Leader of the Bolshevik faction of Russian Social Democracy and head of the Soviet government after October 1917. His writings on the party, the state, imperialism and the national question became the core texts of Leninism.
    argues:
      - {position: org.form.vanguard-party, in: {author: V. I. Lenin, title: "What Is to Be Done?", year: 1902}}
      - {position: nation.question.self-determination-leninist, in: {author: V. I. Lenin, title: "The Right of Nations to Self-Determination", year: 1914}}
      - {position: labor.aristocracy.bribed-stratum, in: {author: V. I. Lenin, title: "Imperialism and the Split in Socialism", year: 1916}}
      - {position: imperialism.nature.monopoly-stage, in: {author: V. I. Lenin, title: "Imperialism, the Highest Stage of Capitalism", year: 1917}}
      - {position: state.relation.smash-and-replace, in: {author: V. I. Lenin, title: "The State and Revolution", year: 1917}}

  - id: thinker.luxemburg
    name: Rosa Luxemburg
    born: 1871
    died: 1919
    region: Poland / Germany
    traditions: [marxism.luxemburgism]
    summary: Polish-born leader of the left wing of German Social Democracy and co-founder of the Spartacus League and the Communist Party of Germany. She was killed by Freikorps soldiers during the Berlin uprising of January 1919.
    argues:
      - {position: reform.revolution.revolution-necessary, in: {author: Rosa Luxemburg, title: "Social Reform or Revolution?", year: 1899}}
      - {position: change.means.strike-and-direct-action, in: {author: Rosa Luxemburg, title: "The Mass Strike, the Political Party and the Trade Unions", year: 1906}}
      - {position: nation.question.no-abstract-right, in: {author: Rosa Luxemburg, title: "The National Question and Autonomy", year: 1909}}
      - {position: crisis.cause.underconsumption, in: {author: Rosa Luxemburg, title: "The Accumulation of Capital", year: 1913}}
      - {position: siege.governance.class-democracy, in: {author: Rosa Luxemburg, title: "The Russian Revolution", year: 1922, note: "written 1918"}}

  - id: thinker.kautsky
    name: Karl Kautsky
    born: 1854
    died: 1938
    region: Austria / Germany
    traditions: [marxism.classical]
    summary: Chief theorist of German Social Democracy and the Second International, author of the Erfurt Programme's theoretical section. After 1917 he became the leading Marxist critic of Bolshevik rule.
    argues:
      - {position: change.tempo.wait-for-conditions, in: {author: Karl Kautsky, title: "The Road to Power", year: 1909}}
      - {position: imperialism.nature.foreign-policy-choice, in: {author: Karl Kautsky, title: "Ultra-imperialism", year: 1914}}
      - {position: democracy.form.representative, in: {author: Karl Kautsky, title: "The Dictatorship of the Proletariat", year: 1918}}
      - {position: hist.russian-revolution.minority-coup, in: {author: Karl Kautsky, title: "Terrorism and Communism", year: 1919}}

  - id: thinker.trotsky
    name: Leon Trotsky
    born: 1879
    died: 1940
    region: Russia / exile
    traditions: [marxism.trotskyism]
    summary: Chair of the Petrograd Soviet in 1905 and 1917 and founder of the Red Army, later expelled from the Soviet party and exiled. He founded the Fourth International and was killed in Mexico by a Soviet agent.
    argues:
      - {position: internationalism.permanent-revolution, in: {author: Leon Trotsky, title: "The Permanent Revolution", year: 1930}}
      - {position: fascism.response.workers-united-front, in: {author: Leon Trotsky, title: "For a Workers' United Front Against Fascism", year: 1931}}
      - {position: fascism.nature.petty-bourgeois-mass-movement, in: {author: Leon Trotsky, title: "What Next? Vital Questions for the German Proletariat", year: 1932}}
      - {position: hist.ussr-stalin.degenerated-workers-state, in: {author: Leon Trotsky, title: "The Revolution Betrayed", year: 1936}}

  - id: thinker.stalin
    name: Joseph Stalin
    born: 1878
    died: 1953
    region: Georgia / Soviet Union
    traditions: [marxism.ml]
    summary: General Secretary of the Soviet Communist Party who led the Soviet Union from the late 1920s until his death, through forced collectivization, the five-year plans, the purges and the war against Nazi Germany.
    argues:
      - {position: nation.question.stalin-definition, in: {author: J. V. Stalin, title: "Marxism and the National Question", year: 1913}}
      - {position: internationalism.socialism-in-one-country, in: {author: J. V. Stalin, title: "Concerning Questions of Leninism", year: 1926}}
      - {position: hist.ussr-stalin.socialism-built, in: {author: J. V. Stalin, title: "On the Draft Constitution of the U.S.S.R.", year: 1936}}
      - {position: allocation.mechanism.central-planning, in: {author: J. V. Stalin, title: "Economic Problems of Socialism in the U.S.S.R.", year: 1952}}

  - id: thinker.bukharin
    name: Nikolai Bukharin
    born: 1888
    died: 1938
    region: Russia
    traditions: [marxism.leninism]
    summary: Bolshevik economist and editor of Pravda who moved from the party's left wing to become the main defender of the New Economic Policy. He was tried and executed in the Moscow trials of 1938.
    argues:
      - {position: imperialism.nature.inter-imperialist-rivalry, in: {author: Nikolai Bukharin, title: "Imperialism and World Economy", year: 1915, note: "written 1915; book edition 1918"}}
      - {position: allocation.mechanism.central-planning, in: {author: Nikolai Bukharin and Evgenii Preobrazhensky, title: "The ABC of Communism", year: 1919}}
      - {position: history.motor.technology, in: {author: Nikolai Bukharin, title: "Historical Materialism: A System of Sociology", year: 1921}}
      - {position: hist.ussr-early.nep-road, in: {author: Nikolai Bukharin, title: "The Path to Socialism and the Worker-Peasant Alliance", year: 1925}}

  - id: thinker.mao
    name: Mao Zedong
    born: 1893
    died: 1976
    region: China
    traditions: [marxism.maoism]
    summary: Leader of the Chinese Communist Party from the 1930s and chairman of the People's Republic of China from 1949 until his death. He built the party's strategy on peasant mobilization and protracted rural war.
    argues:
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: Mao Zedong, title: "Report on an Investigation of the Peasant Movement in Hunan", year: 1927}}
      - {position: knowledge.basis.practice, in: {author: Mao Zedong, title: "On Practice", year: 1937}}
      - {position: conflict.nature.engine-antagonism, in: {author: Mao Zedong, title: "On Contradiction", year: 1937}}
      - {position: change.tempo.protracted-struggle, in: {author: Mao Zedong, title: "On Protracted War", year: 1938}}
      - {position: hist.chinese-revolution.new-democratic, in: {author: Mao Zedong, title: "On New Democracy", year: 1940}}

  - id: thinker.gramsci
    name: Antonio Gramsci
    born: 1891
    died: 1937
    region: Italy
    traditions: [marxism.gramscian]
    summary: Sardinian founder of the Communist Party of Italy and of the Turin factory-council paper L'Ordine Nuovo. Imprisoned by the Fascist government from 1926, he wrote the notebooks on hegemony and the state that made his name.
    argues:
      - {position: org.form.workers-councils, in: {author: Antonio Gramsci, title: "Workers' Democracy", year: 1919, note: "with Palmiro Togliatti, in L'Ordine Nuovo"}}
      - {position: ideology.formation.hegemony, in: {author: Antonio Gramsci, title: "Prison Notebooks", year: 1948, note: "written 1929–1935; first published 1948–1951"}}
      - {position: culture.strategy.hegemony-first, in: {author: Antonio Gramsci, title: "Prison Notebooks", year: 1948, note: "war of position; written 1929–1935"}}
      - {position: fascism.nature.crisis-of-hegemony, in: {author: Antonio Gramsci, title: "Prison Notebooks", year: 1948, note: "crisis of authority and passive revolution; written 1929–1935"}}

  - id: thinker.lukacs
    name: György Lukács
    born: 1885
    died: 1971
    region: Hungary
    traditions: [marxism.western]
    summary: Hungarian philosopher and people's commissar for culture in the 1919 Hungarian Soviet Republic. His essays on reification and class consciousness founded what was later called Western Marxism.
    argues:
      - {position: interests.objective.class-interests, in: {author: Georg Lukács, title: "History and Class Consciousness", year: 1923}}
      - {position: knowledge.basis.standpoint, in: {author: Georg Lukács, title: "History and Class Consciousness", year: 1923}}
      - {position: org.form.vanguard-party, in: {author: Georg Lukács, title: "Lenin: A Study on the Unity of His Thought", year: 1924}}

  - id: thinker.pannekoek
    name: Anton Pannekoek
    born: 1873
    died: 1960
    region: Netherlands
    traditions: [marxism.council-communism]
    summary: Dutch astronomer and leading theorist of council communism, who broke with the Comintern over parliamentary and trade-union tactics and held that workers' councils, not parties, must run production.
    argues:
      - {position: elections.role.boycott-principle, in: {author: Anton Pannekoek, title: "World Revolution and Communist Tactics", year: 1920}}
      - {position: hist.russian-revolution.bourgeois-in-socialist-costume, in: {author: Anton Pannekoek, title: "Lenin as Philosopher", year: 1938}}
      - {position: org.form.workers-councils, in: {author: Anton Pannekoek, title: "Workers' Councils", year: 1946, note: "first published under the name P. Aartsz"}}
      - {position: planning.form.labor-time-councils, in: {author: Anton Pannekoek, title: "Workers' Councils", year: 1946}}

  - id: thinker.bordiga
    name: Amadeo Bordiga
    born: 1889
    died: 1970
    region: Italy
    traditions: [marxism.left-communism]
    summary: First leader of the Communist Party of Italy, removed in 1926 and expelled in 1930. He led the abstentionist current and later the Italian communist left, which rejected both parliamentary tactics and the Soviet model.
    argues:
      - {position: elections.role.boycott-principle, in: {author: Amadeo Bordiga, title: "Theses of the Abstentionist Communist Fraction of the Italian Socialist Party", year: 1920}}
      - {position: alliances.policy.class-against-class, in: {author: Amadeo Bordiga and Umberto Terracini, title: "Rome Theses", year: 1922}}
      - {position: hist.ussr-stalin.state-capitalism, in: {author: Amadeo Bordiga, title: "Dialogue with Stalin", year: 1952}}

  - id: thinker.hoxha
    name: Enver Hoxha
    born: 1908
    died: 1985
    region: Albania
    traditions: [marxism.hoxhaism]
    summary: First secretary of the Party of Labour of Albania from 1941 until his death, who led Albania through successive breaks with Yugoslavia, the Soviet Union and China.
    argues:
      - {position: hist.yugoslavia.revisionist-capitalism, in: {author: Enver Hoxha, title: "Yugoslav \"Self-Administration\": A Capitalist Theory and Practice", year: 1978}}
      - {position: hist.china-reform.capitalist-restoration, in: {author: Enver Hoxha, title: "Reflections on China", year: 1979}}
      - {position: hist.ussr-late.capitalism-restored-1956, in: {author: Enver Hoxha, title: "The Khrushchevites", year: 1980}}

  - id: thinker.kim-il-sung
    name: Kim Il Sung
    born: 1912
    died: 1994
    region: Korea
    traditions: [marxism.juche]
    summary: Anti-Japanese guerrilla commander and founding leader of the Democratic People's Republic of Korea from 1948 until his death. He set out Juche, the doctrine of self-reliance, as the state's guiding idea.
    argues:
      - {position: hist.dprk.juche-socialism, in: {author: Kim Il Sung, title: "On Eliminating Dogmatism and Formalism and Establishing Juche in Ideological Work", year: 1955}}
      - {position: agrarian.question.collective-farms, in: {author: Kim Il Sung, title: "Theses on the Socialist Rural Question in Our Country", year: 1964}}
      - {position: intl.sovereignty.nations-set-own-course, in: {author: Kim Il Sung, title: "On Some Questions of Our Party's Juche Idea and the Government of the Republic's Internal and External Policies", year: 1972}}
      - {position: hist.dprk.divided-nation, in: {author: Kim Il Sung, title: "Ten-Point Programme of the Great Unity of the Whole Nation for the Reunification of the Country", year: 1993}}

  - id: thinker.ho-chi-minh
    name: Ho Chi Minh
    born: 1890
    died: 1969
    region: Vietnam
    traditions: [marxism.ml]
    summary: Founder of the Indochinese Communist Party and the Viet Minh, who declared Vietnam's independence in 1945 and led the Democratic Republic of Vietnam through the wars against France and the United States.
    argues:
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: Ho Chi Minh, title: "Report on the National and Colonial Questions at the Fifth Congress of the Communist International", year: 1924}}
      - {position: hist.vietnamese-revolution.national-liberation, in: {author: Ho Chi Minh, title: "Declaration of Independence of the Democratic Republic of Viet Nam", year: 1945}}
      - {position: hist.russian-revolution.anti-colonial-signal, in: {author: Ho Chi Minh, title: "The Path Which Led Me to Leninism", year: 1960}}

  - id: thinker.guevara
    name: Ernesto Che Guevara
    born: 1928
    died: 1967
    region: Argentina / Cuba
    traditions: [marxism.guevarism]
    summary: Argentine doctor who fought in the Cuban revolutionary war, then served as president of Cuba's national bank and minister of industry. He left Cuba to fight in the Congo and Bolivia, where he was captured and executed.
    argues:
      - {position: change.means.armed-struggle, in: {author: Ernesto Che Guevara, title: "Guerrilla Warfare", year: 1960}}
      - {position: hist.cuban-revolution.new-human-being, in: {author: Ernesto Che Guevara, title: "Socialism and Man in Cuba", year: 1965}}
      - {position: internationalism.tricontinental, in: {author: Ernesto Che Guevara, title: "Message to the Tricontinental", year: 1967}}

  - id: thinker.mariategui
    name: José Carlos Mariátegui
    born: 1894
    died: 1930
    region: Peru
    traditions: [marxism.mariategui]
    summary: Peruvian journalist and founder of the Peruvian Socialist Party and the journal Amauta, who read Peru's indigenous and agrarian question through Marxism.
    argues:
      - {position: indigenous.sovereignty.land-is-the-question, in: {author: José Carlos Mariátegui, title: "Seven Interpretive Essays on Peruvian Reality", year: 1928}}
      - {position: property.land.communal, in: {author: José Carlos Mariátegui, title: "Seven Interpretive Essays on Peruvian Reality", year: 1928}}
      - {position: comprador.nature.broker-class, in: {author: José Carlos Mariátegui, title: "Anti-Imperialist Point of View", year: 1929}}

  - id: thinker.amin
    name: Samir Amin
    born: 1931
    died: 2018
    region: Egypt / Senegal
    traditions: [marxism.third-worldism, marxism.dependency]
    summary: Egyptian economist who worked for decades in Dakar, analysing capitalism as a polarizing world system of centre and periphery and arguing for delinking.
    argues:
      - {position: capitalism.nature.world-system, in: {author: Samir Amin, title: "Accumulation on a World Scale", year: 1970}}
      - {position: imperialism.nature.unequal-exchange-drain, in: {author: Samir Amin, title: "Unequal Development", year: 1973}}
      - {position: development.path.delinking, in: {author: Samir Amin, title: "Delinking: Towards a Polycentric World", year: 1985, note: "French original La déconnexion, 1985"}}
      - {position: world.order.multipolar-sovereignty, in: {author: Samir Amin, title: "Beyond US Hegemony? Assessing the Prospects for a Multipolar World", year: 2006}}

  - id: thinker.emmanuel
    name: Arghiri Emmanuel
    born: 1911
    died: 2001
    region: Greece / France
    traditions: [marxism.third-worldism]
    summary: Greek-born economist in Paris whose theory of unequal exchange held that wage gaps between rich and poor countries transfer value through ordinary trade.
    argues:
      - {position: exchange.unequal.wage-gap, in: {author: Arghiri Emmanuel, title: "Unequal Exchange: A Study of the Imperialism of Trade", year: 1969}}
      - {position: labor.aristocracy.whole-core-bought, in: {author: Arghiri Emmanuel, title: "Unequal Exchange: A Study of the Imperialism of Trade", year: 1969}}

  - id: thinker.rodney
    name: Walter Rodney
    born: 1942
    died: 1980
    region: Guyana / Tanzania
    traditions: [marxism.black-radical]
    summary: Guyanese historian who taught in Jamaica and Dar es Salaam and led the Working People's Alliance in Guyana. He was killed by a bomb in Georgetown in 1980.
    argues:
      - {position: race.nature.racial-capitalism, in: {author: Walter Rodney, title: "The Groundings with My Brothers", year: 1969}}
      - {position: poverty.cause.drain, in: {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}}
      - {position: labor.division.race-caste-nation, in: {author: Walter Rodney, title: "A History of the Guyanese Working People, 1881–1905", year: 1981}}

  - id: thinker.wallerstein
    name: Immanuel Wallerstein
    born: 1930
    died: 2019
    region: United States
    traditions: [marxism.world-systems]
    summary: American sociologist who founded world-systems analysis, treating the capitalist world-economy since the sixteenth century as the unit of study.
    argues:
      - {position: capitalism.nature.world-system, in: {author: Immanuel Wallerstein, title: "The Modern World-System, Volume I", year: 1974}}
      - {position: race.nature.racial-capitalism, in: {author: Étienne Balibar and Immanuel Wallerstein, title: "Race, Nation, Class: Ambiguous Identities", year: 1988}}

  - id: thinker.brenner
    name: Robert Brenner
    born: 1943
    died: null
    region: United States
    traditions: [marxism.western]
    summary: American historian of early modern Europe whose account of agrarian class relations started the "Brenner debate" on the origins of capitalism.
    argues:
      - {position: history.motor.class-struggle, in: {author: Robert Brenner, title: "Agrarian Class Structure and Economic Development in Pre-Industrial Europe", year: 1976}}
      - {position: markets.nature.older-than-capitalism, in: {author: Robert Brenner, title: "The Origins of Capitalist Development: A Critique of Neo-Smithian Marxism", year: 1977}}

  - id: thinker.poulantzas
    name: Nicos Poulantzas
    born: 1936
    died: 1979
    region: Greece / France
    traditions: [marxism.structural]
    summary: Greek political theorist in Paris who developed a structural Marxist theory of the state, classes and the exceptional state, and later argued for a democratic road to socialism.
    argues:
      - {position: state.nature.relative-autonomy, in: {author: Nicos Poulantzas, title: "Political Power and Social Classes", year: 1968}}
      - {position: fascism.nature.crisis-of-hegemony, in: {author: Nicos Poulantzas, title: "Fascism and Dictatorship", year: 1970}}
      - {position: class.concept.relation-to-production, in: {author: Nicos Poulantzas, title: "Classes in Contemporary Capitalism", year: 1974}}
      - {position: reform.revolution.non-reformist-reforms, in: {author: Nicos Poulantzas, title: "State, Power, Socialism", year: 1978}}

  - id: thinker.miliband
    name: Ralph Miliband
    born: 1924
    died: 1994
    region: Belgium / Britain
    traditions: [marxism.western, socdem.democratic-socialism]
    summary: Belgian-born British political scientist and New Left figure who studied how the capitalist class shapes the state, and criticized the Labour Party's parliamentary road.
    argues:
      - {position: state.nature.class-instrument, in: {author: Ralph Miliband, title: "The State in Capitalist Society", year: 1969}}
      - {position: history.elites.ruling-class, in: {author: Ralph Miliband, title: "The State in Capitalist Society", year: 1969}}
      - {position: party.system.competitive-multiparty, in: {author: Ralph Miliband, title: "Socialism for a Sceptical Age", year: 1994}}

  - id: thinker.sweezy
    name: Paul Sweezy
    born: 1910
    died: 2004
    region: United States
    traditions: [marxism.dependency]
    summary: American economist and co-founder of Monthly Review, who analysed monopoly capitalism, stagnation and military spending, and debated Bettelheim on the transition to socialism.
    argues:
      - {position: crisis.cause.underconsumption, in: {author: Paul M. Sweezy, title: "The Theory of Capitalist Development", year: 1942}}
      - {position: war.militarism.arms-profits, in: {author: Paul A. Baran and Paul M. Sweezy, title: "Monopoly Capital", year: 1966}}
      - {position: markets.nature.commodity-production-is-the-root, in: {author: Paul M. Sweezy and Charles Bettelheim, title: "On the Transition to Socialism", year: 1971, note: "Sweezy's side of the exchange"}}

  - id: thinker.bettelheim
    name: Charles Bettelheim
    born: 1913
    died: 2006
    region: France
    traditions: [marxism.maoism]
    summary: French economist and adviser on planning to several post-colonial governments, who argued that the Soviet Union had become a form of state capitalism.
    argues:
      - {position: exchange.unequal.productivity-gap, in: {author: Charles Bettelheim, title: "Theoretical Comments", year: 1969, note: "appendix to Emmanuel, Unequal Exchange"}}
      - {position: planning.form.mass-line, in: {author: Charles Bettelheim, title: "Cultural Revolution and Industrial Organization in China", year: 1973}}
      - {position: hist.ussr-stalin.state-capitalism, in: {author: Charles Bettelheim, title: "Class Struggles in the USSR", year: 1974}}
