# Thinkers: migration, borders, belonging and the multinational state.
thinkers:
  - id: thinker.sivanandan
    name: A. Sivanandan
    born: 1923
    died: 2018
    region: Sri Lanka / Britain
    traditions: [marxism.black-radical, marxism.third-worldism]
    summary: >
      Sri Lankan-born director of the Institute of Race Relations in London and founding editor of Race &
      Class. He analyzed racism in Britain as a function of the labor the former colonies were made to supply
      to the metropolis, summed up in the line "we are here because you were there", and organized for
      Black and Asian workers as one political community.
    argues:
      - {position: borders.migration.right-to-stay, in: {author: A. Sivanandan, title: "A Different Hunger: Writings on Black Resistance", year: 1982}}
      - {position: migration.cause.drain, in: {author: A. Sivanandan, title: "A Different Hunger: Writings on Black Resistance", year: 1982}}

  - id: thinker.carens
    name: Joseph H. Carens
    born: 1945
    died: null
    region: United States / Canada
    traditions: [liberalism.egalitarian]
    summary: >
      Political theorist at the University of Toronto. He argues that birthright citizenship in a rich country
      is like feudal privilege, and that liberal principles of equal moral worth and freedom of movement
      require, in principle, open borders.
    argues:
      - {position: borders.migration.open-borders, in: {author: Joseph H. Carens, title: "Aliens and Citizens: The Case for Open Borders", year: 1987, note: "Review of Politics 49(2)"}}

  - id: thinker.piore
    name: Michael J. Piore
    born: 1940
    died: null
    region: United States
    traditions: [socdem.keynesian]
    summary: >
      MIT labor economist and a theorist of the dual labor market. He argues that industrial economies create
      a secondary sector of unstable, low-status jobs, and that employers recruit migrants to fill them; the
      migration follows the demand, not the other way round.
    argues:
      - {position: migration.cause.employer-demand, in: {author: Michael J. Piore, title: "Birds of Passage: Migrant Labor and Industrial Societies", year: 1979}}

  - id: thinker.kymlicka
    name: Will Kymlicka
    born: 1962
    died: null
    region: Canada
    traditions: [liberalism.egalitarian]
    summary: >
      Canadian political philosopher at Queen's University. He argues that liberal equality requires
      group-differentiated rights: self-government for national minorities and indigenous peoples, and
      polyethnic rights that let immigrant groups keep their languages and practices while taking part as
      citizens.
    argues:
      - {position: nation.belonging.multicultural, in: {author: Will Kymlicka, title: "Multicultural Citizenship: A Liberal Theory of Minority Rights", year: 1995}}
      - {position: migrant.loyalty.dual-belonging, in: {author: Will Kymlicka, title: "Multicultural Citizenship: A Liberal Theory of Minority Rights", year: 1995, note: "polyethnic rights for immigrant groups"}}

  - id: thinker.theodore-roosevelt
    name: Theodore Roosevelt
    born: 1858
    died: 1919
    region: United States
    traditions: [nationalism.civic]
    summary: >
      President of the United States from 1901 to 1909. He took the Panama Canal Zone, presided over the war
      against Filipino independence, and asserted a U.S. right to police Latin America, while at home he
      prosecuted trusts and regulated railroads. He demanded that immigrants become Americans and nothing
      else, attacking what he called hyphenated Americanism.
    argues:
      - {position: migrant.loyalty.new-country-first, in: {author: Theodore Roosevelt, title: "Americanism", year: 1915, note: "address to the Knights of Columbus, New York, 12 October 1915"}}

  - id: thinker.spooner
    name: Lysander Spooner
    born: 1808
    died: 1887
    region: United States
    traditions: [anarchism.individualist]
    summary: >
      Massachusetts lawyer and abolitionist who argued that slavery was unconstitutional and set up a private
      mail service against the Post Office's monopoly. After the Civil War he argued that the Constitution
      binds no one who did not sign it, and that no government has a claim to anyone's allegiance.
    argues:
      - {position: migrant.loyalty.no-one-owes-a-state, in: {author: Lysander Spooner, title: "No Treason, No. VI: The Constitution of No Authority", year: 1870}}

  - id: thinker.pi-i-margall
    name: Francesc Pi i Margall
    born: 1824
    died: 1901
    region: Catalonia / Spain
    traditions: [liberalism.republican]
    summary: >
      Catalan writer, translator of Proudhon and leader of the Federal Democratic Republican Party, briefly
      president of the First Spanish Republic in 1873. He argued that Spain should be rebuilt as a federation
      by pact among its historic nationalities, each self-governing, with the federal pact binding them from
      below.
    argues:
      - {position: federalism.scale.multinational-federation, in: {author: Francisco Pi y Margall, title: Las nacionalidades, year: 1877}}
