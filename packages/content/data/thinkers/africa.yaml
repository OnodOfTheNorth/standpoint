thinkers:
  # ---- Liberation movements and the national question
  - id: thinker.mandela
    name: Nelson Mandela
    born: 1918
    died: 2013
    region: South Africa
    traditions: [nationalism.civic]
    summary: >-
      Lawyer and leader of the African National Congress, which held in its 1955 "Freedom Charter" that South Africa
      belongs to all who live in it. He co-founded Umkhonto we Sizwe in 1961 to wage a sabotage campaign after the
      ANC was banned, was imprisoned from 1962 to 1990, and was president from 1994 to 1999, when his government
      kept the existing ownership of land and industry and set up the Truth and Reconciliation Commission.
    argues:
      - {position: violence.political.anti-colonial, in: {author: Nelson Mandela, title: I Am Prepared to Die, year: 1964, note: "statement from the dock at the Rivonia trial"}}
      - {position: hist.cuban-revolution.armed-the-south, in: {author: Nelson Mandela and Fidel Castro, title: "How Far We Slaves Have Come! South Africa and Cuba in Today's World", year: 1991, note: "speeches at Matanzas, 26 July 1991"}}
      - {position: racism.remedy.reconciliation, in: {author: Nelson Mandela, title: Long Walk to Freedom, year: 1994}}

  - id: thinker.slovo
    name: Joe Slovo
    born: 1926
    died: 1995
    region: South Africa
    traditions: [marxism.ml]
    summary: >-
      Lithuanian-born lawyer, general secretary of the South African Communist Party and chief of staff of
      Umkhonto we Sizwe. He held that the national democratic revolution against apartheid was the road to
      socialism, and after 1989 argued that Stalinism's "socialism without democracy", not socialism, had failed.
      He was minister of housing in Mandela's government.
    argues:
      - {position: alliances.policy.national-front, in: {author: Joe Slovo, title: The South African Working Class and the National Democratic Revolution, year: 1988}}
      - {position: hist.ussr-late.bureaucratic-stagnation, in: {author: Joe Slovo, title: Has Socialism Failed?, year: 1990}}

  - id: thinker.ruth-first
    name: Ruth First
    born: 1925
    died: 1982
    region: South Africa / Mozambique
    traditions: [marxism.ml]
    summary: >-
      South African Communist journalist and scholar, detained without trial in 1963 and exiled in 1964. She
      analyzed the military coups that followed African independence as the work of armies and elites inherited
      from colonial rule over economies still run from abroad, and studied Mozambique's migrant miners as a labor
      reserve for South African capital. She was killed by a parcel bomb sent by South African security police in
      Maputo in 1982.
    argues:
      - {position: hist.decolonization.flag-independence, in: {author: Ruth First, title: "The Barrel of a Gun: Political Power in Africa and the Coup d'État", year: 1970}}
      - {position: migration.cause.drain, in: {author: Ruth First, title: "Black Gold: The Mozambican Miner, Proletarian and Peasant", year: 1983}}

  - id: thinker.biko
    name: Steve Biko
    born: 1946
    died: 1977
    region: South Africa
    traditions: [nationalism.black-nationalism]
    summary: >-
      Medical student who founded the South African Students' Organisation in 1968 and led the Black Consciousness
      Movement. He argued that Black people must free themselves from psychological dependence on white liberals
      and organize on their own, since the whole system, not individual bigots, gave whites their privilege. He died
      from injuries inflicted in police custody in 1977.
    argues:
      - {position: racism.remedy.self-determination, in: {author: Steve Biko, title: I Write What I Like, year: 1978, note: "collected writings of 1969–1977"}}
      - {position: race.nature.structural, in: {author: Steve Biko, title: I Write What I Like, year: 1978, note: "essay 'White Racism and Black Consciousness', 1971"}}

  - id: thinker.mugabe
    name: Robert Mugabe
    born: 1924
    died: 2019
    region: Zimbabwe
    traditions: [nationalism.pan-africanism]
    summary: >-
      Leader of ZANU in the liberation war against the Rhodesian settler state, prime minister of Zimbabwe from 1980
      and president from 1987 to 2017. The army's Fifth Brigade killed an estimated 20,000 people in Matabeleland
      in 1983 to 1987. From 2000 his government seized most white-owned commercial farms in the fast-track land
      reform, which he called the Third Chimurenga; he was removed by the army in 2017.
    argues:
      - {position: settler.colonialism.expropriate-redistribute, in: {author: Robert Mugabe, title: Inside the Third Chimurenga, year: 2001, note: "collected speeches"}}

  - id: thinker.senghor
    name: Léopold Sédar Senghor
    born: 1906
    died: 2001
    region: Senegal
    traditions: [marxism.african-socialism]
    summary: >-
      Poet, co-founder of Négritude, and first president of Senegal from 1960 to 1980. He proposed an African
      socialism that took Marx's method but rejected atheism and class war, building on the communal values of
      African village life while keeping close economic ties to France.
    argues:
      - {position: tradition.modernity.selective-modernization, in: {author: Léopold Sédar Senghor, title: On African Socialism, year: 1964, note: "translated by Mercer Cook; French original Nation et voie africaine du socialisme, 1961"}}
      - {position: property.land.communal, in: {author: Léopold Sédar Senghor, title: On African Socialism, year: 1964}}

  # ---- Marxist political economy of Africa
  - id: thinker.shivji
    name: Issa Shivji
    born: 1946
    region: Tanzania
    traditions: [marxism.dependency]
    summary: >-
      Tanzanian legal scholar of the Dar es Salaam school. He argued that after the Arusha Declaration a
      "bureaucratic bourgeoisie" controlling the state and state firms replaced the commercial bourgeoisie as the
      ruling class, and that rights in Africa are won by popular struggle rather than granted by liberal law.
    argues:
      - {position: comprador.nature.bureaucratic-bourgeoisie, in: {author: Issa G. Shivji, title: Class Struggles in Tanzania, year: 1976}}
      - {position: rights.basis.won-in-struggle, in: {author: Issa G. Shivji, title: The Concept of Human Rights in Africa, year: 1989}}

  - id: thinker.ake
    name: Claude Ake
    born: 1939
    died: 1996
    region: Nigeria
    traditions: [marxism.dependency]
    summary: >-
      Nigerian political economist. He argued that colonial rule left African economies disarticulated and
      dependent and that the ruling classes that inherited the state lived off it as intermediaries for foreign
      capital, so development was never on their agenda. He died in a plane crash in 1996.
    argues:
      - {position: comprador.nature.broker-class, in: {author: Claude Ake, title: A Political Economy of Africa, year: 1981}}

  - id: thinker.mamdani
    name: Mahmood Mamdani
    born: 1946
    region: Uganda
    traditions: [nationalism.decolonial]
    summary: >-
      Ugandan political scientist, expelled with Uganda's Asians in 1972, who has taught in Kampala, Dar es Salaam,
      Cape Town and New York. He argues that colonial indirect rule split the colonized into citizens and tribal
      subjects, and that the modern nation-state was founded on making permanent minorities; decolonization means
      abolishing the political identities of settler and native.
    argues:
      - {position: settler.colonialism.decolonize-citizenship, in: {author: Mahmood Mamdani, title: "Neither Settler nor Native: The Making and Unmaking of Permanent Minorities", year: 2020}}

  - id: thinker.mbembe
    name: Achille Mbembe
    born: 1957
    region: Cameroon / South Africa
    traditions: [nationalism.decolonial]
    summary: >-
      Cameroonian historian and political theorist at the University of the Witwatersrand. He argues that race was
      produced with modern capitalism, which made the Black person the figure of the human turned into commodity,
      and that the postcolonial state rules through a logic of command inherited from the colony.
    argues:
      - {position: imperialism.nature.coloniality, in: {author: Achille Mbembe, title: Critique of Black Reason, year: 2017, note: "French original Critique de la raison nègre, 2013"}}

  - id: thinker.ngugi
    name: Ngũgĩ wa Thiong'o
    born: 1938
    died: 2025
    region: Kenya
    traditions: [nationalism.decolonial]
    summary: >-
      Kenyan novelist detained without trial in 1978 after his Gikuyu-language play was performed by peasants and
      workers in Kamiriithu, and in exile from 1982. He argued that imperialism's cultural bomb works through
      language, and gave up English to write in Gikuyu.
    argues:
      - {position: imperialism.nature.coloniality, in: {author: Ngũgĩ wa Thiong'o, title: "Decolonising the Mind: The Politics of Language in African Literature", year: 1986}}

  # ---- Black nationalism and the Black radical tradition
  - id: thinker.garvey
    name: Marcus Garvey
    born: 1887
    died: 1940
    region: Jamaica / United States
    traditions: [nationalism.black-nationalism, nationalism.pan-africanism]
    summary: >-
      Jamaican founder of the Universal Negro Improvement Association in 1914, which grew into the largest mass
      movement of Black people in the 1920s. He called for racial pride, Black-owned businesses such as the Black
      Star Line, and a return to an Africa free of European rule. Convicted of mail fraud in 1923, he was deported
      from the United States in 1927.
    argues:
      - {position: racism.remedy.self-determination, in: {author: Marcus Garvey, title: Philosophy and Opinions of Marcus Garvey, year: 1923, note: "edited by Amy Jacques Garvey"}}
      - {position: migrant.loyalty.homeland-first, in: {author: "Marcus Garvey", title: "Philosophy and Opinions of Marcus Garvey", year: 1923}}

  - id: thinker.malcolm-x
    name: Malcolm X
    born: 1925
    died: 1965
    region: United States
    traditions: [nationalism.black-nationalism]
    summary: >-
      Minister of the Nation of Islam who broke with it in 1964 and founded the Organization of Afro-American Unity.
      He held that Black communities should control their own politics and economy and defend themselves by arms
      where the government would not, and brought the cause of Black Americans before African states as a question
      of human rights. He was assassinated in New York in 1965.
    argues:
      - {position: racism.remedy.self-determination, in: {author: Malcolm X, title: The Ballot or the Bullet, year: 1964}}
      - {position: violence.political.self-defense, in: {author: Malcolm X, title: The Ballot or the Bullet, year: 1964}}

  - id: thinker.ture
    name: Kwame Ture
    born: 1941
    died: 1998
    region: Trinidad / United States / Guinea
    traditions: [nationalism.black-nationalism, nationalism.pan-africanism]
    summary: >-
      Trinidad-born chairman of the Student Nonviolent Coordinating Committee as Stokely Carmichael, who raised the
      call for Black Power in 1966, and later an organizer of the All-African People's Revolutionary Party in
      Guinea. With Charles Hamilton he named institutional racism: the routine operation of established institutions
      that keeps Black people subordinate without any individual act of hate.
    argues:
      - {position: race.nature.structural, in: {author: Stokely Carmichael and Charles V. Hamilton, title: "Black Power: The Politics of Liberation in America", year: 1967}}

  - id: thinker.cedric-robinson
    name: Cedric J. Robinson
    born: 1940
    died: 2016
    region: United States
    traditions: [marxism.black-radical]
    summary: >-
      Political scientist at the University of California, Santa Barbara. He argued that capitalism grew out of a
      European feudal order already organized by racial distinctions, so that it was racial capitalism from the
      start, and traced a Black radical tradition of resistance in Du Bois, C. L. R. James and Richard Wright.
    argues:
      - {position: race.nature.racial-capitalism, in: {author: Cedric J. Robinson, title: "Black Marxism: The Making of the Black Radical Tradition", year: 1983}}
