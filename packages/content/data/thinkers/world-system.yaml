    born: 1906
    died: 1975
    region: Germany / United States
    traditions: [liberalism.republican]
    summary: >
      German-Jewish political theorist who fled Nazi Germany and settled in New York. She held that
      totalitarianism was a new form of rule by terror and ideology over atomized masses, and that violence
      can destroy power but never create it, against Fanon and Sartre.
