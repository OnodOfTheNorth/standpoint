# Thinkers: the fascist family, represented descriptively with their record
# (Italian fascism, National Socialism, national syndicalism, Radical
# Traditionalism, identitarianism / New Right, neo-reaction).
thinkers:
  - id: thinker.mussolini
    name: Benito Mussolini
    born: 1883
    died: 1945
    region: Italy
    traditions: [fascism.italian]
    summary: >
      Italian socialist journalist turned founder of fascism, head of government from 1922 to 1943. His
      government abolished opposition parties and free trade unions, conquered Ethiopia with poison gas,
      passed antisemitic racial laws in 1938, and entered the Second World War as Hitler's ally; partisans
      shot him in April 1945.
    argues:
      - {position: war.militarism.war-ennobles, in: {author: Benito Mussolini, title: The Doctrine of Fascism, year: 1932, note: "first part drafted by Giovanni Gentile"}}
      - {position: workplace.conflict.nation-above-class, in: {author: Benito Mussolini, title: The Doctrine of Fascism, year: 1932}}
      - {position: party.system.corporative, in: {author: Benito Mussolini, title: The Doctrine of Fascism, year: 1932}}

  - id: thinker.gentile
    name: Giovanni Gentile
    born: 1875
    died: 1944
    region: Italy
    traditions: [fascism.italian]
    summary: >
      Italian idealist philosopher, Mussolini's first education minister, who gave fascism its philosophy
      of the ethical state: the individual is fully real only within the state, which embraces the whole
      of life. Partisans killed him in Florence in 1944.
    argues:
      - {position: totalitarianism.concept.total-state-ideal, in: {author: Giovanni Gentile, title: Origins and Doctrine of Fascism, year: 1929}}
      - {position: state.nature.organic-nation, in: {author: Giovanni Gentile, title: The Philosophic Basis of Fascism, year: 1928}}

  - id: thinker.hitler
    name: Adolf Hitler
    born: 1889
    died: 1945
    region: Austria / Germany
    traditions: [fascism.nazism]
    summary: >
      Austrian-born leader of the National Socialist party and dictator of Germany from 1933 to 1945. His
      government destroyed the labor movement and all opposition, launched the Second World War in Europe,
      and carried out the Holocaust, murdering six million Jews along with Roma, disabled people, Soviet
      prisoners of war and others.
    argues:
      - {position: nation.belonging.descent, in: {author: Adolf Hitler, title: Mein Kampf, year: 1925}}
      - {position: history.motor.peoples-in-struggle, in: {author: Adolf Hitler, title: Mein Kampf, year: 1925}}
      - {position: capitalism.nature.usury-finance, in: {author: Adolf Hitler, title: Mein Kampf, year: 1925, note: "vol. 1, ch. 8, on Gottfried Feder's \"breaking of interest slavery\""}}
      - {position: authority.legitimacy.leader-embodiment, in: {author: Adolf Hitler, title: Mein Kampf, year: 1925}}

  - id: thinker.primo-de-rivera
    name: José Antonio Primo de Rivera
    born: 1903
    died: 1936
    region: Spain
    traditions: [fascism.national-syndicalism]
    summary: >
      Spanish lawyer, son of the dictator Miguel Primo de Rivera, who founded the Falange in 1933 on a
      program of national syndicalism, vertical unions and national unity above class and party. The
      Republic executed him in November 1936; Franco's state then made the Falange its single party.
    argues:
      - {position: violence.political.regenerative, in: {author: José Antonio Primo de Rivera, title: Speech at the Founding of Falange Española, year: 1933}}
      - {position: unions.role.national-labor, in: {author: José Antonio Primo de Rivera, title: Programmatic Norms of the Falange (the 27 Points), year: 1934}}
      - {position: party.system.corporative, in: {author: José Antonio Primo de Rivera, title: Programmatic Norms of the Falange (the 27 Points), year: 1934}}
      - {position: finance.control.nationalize-credit, in: {author: José Antonio Primo de Rivera, title: Programmatic Norms of the Falange (the 27 Points), year: 1934, note: "point 14: nationalization of banking"}}

  - id: thinker.evola
    name: Julius Evola
    born: 1898
    died: 1974
    region: Italy
    traditions: [fascism.traditionalist]
    summary: >
      Italian esotericist who held that modern history is a fall from a sacred, hierarchical order of priests,
      warriors and castes. He criticized fascism from the right, worked with the SS's research bodies during
      the war, and after 1945 became a reference for Italy's post-war radical right.
    argues:
      - {position: progress.idea.decline-from-tradition, in: {author: Julius Evola, title: Revolt Against the Modern World, year: 1934}}
      - {position: caste.question.sacred-order, in: {author: Julius Evola, title: Revolt Against the Modern World, year: 1934}}
      - {position: equality.concept.natural-hierarchy, in: {author: Julius Evola, title: Men Among the Ruins, year: 1953}}

  - id: thinker.de-benoist
    name: Alain de Benoist
    born: 1943
    died: null
    region: France
    traditions: [fascism.identitarian]
    summary: >
      French writer and founder of the Nouvelle Droite, who borrowed Gramsci's idea of cultural hegemony for
      the right, defends the right of every people to keep its own identity on its own soil, and opposes
      liberal universalism, the market society and American power. He rejects the fascist label.
    argues:
      - {position: culture.strategy.metapolitics, in: {author: Alain de Benoist, title: Les Idées à l'endroit, year: 1979}}
      - {position: nationalism.kinds.ethnopluralism, in: {author: Alain de Benoist and Charles Champetier, title: "Manifesto for a European Renaissance", year: 1999}}
      - {position: growth.ecology.degrowth, in: {author: Alain de Benoist, title: "Demain, la décroissance ! Penser l'écologie jusqu'au bout", year: 2007}}

  - id: thinker.yarvin
    name: Curtis Yarvin
    born: 1973
    died: null
    region: United States
    traditions: [fascism.neoreaction]
    summary: >
      American software engineer who, writing as Mencius Moldbug, argued that elected government is a
      sham run by universities and the press, which he called "the Cathedral", and that states should be
      run like corporations under a single executive, with citizens free only to exit.
    argues:
      - {position: state.relation.market-exit, in: {author: Mencius Moldbug (Curtis Yarvin), title: "Patchwork: A Positive Vision", year: 2008}}
      - {position: ideology.formation.elite-indoctrination, in: {author: Mencius Moldbug (Curtis Yarvin), title: A Gentle Introduction to Unqualified Reservations, year: 2009}}
      - {position: democracy.form.monarchy, in: {author: Mencius Moldbug (Curtis Yarvin), title: A Gentle Introduction to Unqualified Reservations, year: 2009}}

  - id: thinker.ledesma-ramos
    name: Ramiro Ledesma Ramos
    born: 1905
    died: 1936
    region: Spain
    traditions: [fascism.national-syndicalism]
    summary: >
      Spanish writer who founded the weekly La Conquista del Estado in 1931 and, with Onésimo Redondo, the
      Juntas de Ofensiva Nacional-Sindicalista (JONS). His national syndicalism called for a totalitarian
      national state, syndicates in place of parties and classes, and a youth militia to seize power. He was
      shot by Republican militiamen in October 1936.
    argues:
      - {position: state.nature.organic-nation, in: {author: Ramiro Ledesma Ramos, title: La Conquista del Estado, year: 1931, note: "founding manifesto in the first issue of the weekly, 14 March 1931"}}
      - {position: fascism.nature.national-rebirth-self-view, in: {author: Ramiro Ledesma Ramos, title: Discurso a las juventudes de España, year: 1935}}

  - id: thinker.codreanu
    name: Corneliu Zelea Codreanu
    born: 1899
    died: 1938
    region: Romania
    traditions: [fascism.clerical]
    summary: >
      Founder in 1927 of the Legion of the Archangel Michael, later the Iron Guard, an Orthodox Christian
      fascist movement whose program joined national resurrection, a cult of martyrdom and violent
      antisemitism. Its members assassinated a prime minister in 1933. He was garroted in custody on King
      Carol II's orders in 1938.
    argues:
      - {position: fascism.nature.national-rebirth-self-view, in: {author: Corneliu Zelea Codreanu, title: For My Legionaries, year: 1936, note: "the 'new man' and the resurrection of the nation"}}
      - {position: society.units.nation-organism, in: {author: Corneliu Zelea Codreanu, title: For My Legionaries, year: 1936, note: "the nation as the living, the dead and the unborn together"}}

  - id: thinker.salgado
    name: Plínio Salgado
    born: 1895
    died: 1975
    region: Brazil
    traditions: [fascism.clerical]
    summary: >
      Brazilian writer who founded Ação Integralista Brasileira in 1932 under the motto God, Fatherland and
      Family. Its green-shirted mass movement called for an integral state built on Catholic spirituality,
      nationalism and corporations in place of liberal parties. After a failed putsch in 1938 he went into
      exile in Portugal, and later returned to electoral politics.
    argues:
      - {position: state.nature.organic-nation, in: {author: Plínio Salgado, title: Manifesto de Outubro, year: 1932, note: "founding manifesto of Brazilian Integralism, São Paulo, 7 October 1932"}}

  - id: thinker.marinetti
    name: Filippo Tommaso Marinetti
    born: 1876
    died: 1944
    region: Egypt / Italy
    traditions: [fascism.italian]
    summary: >
      Alexandria-born Italian poet who founded Futurism in 1909, glorifying speed, machines and war and calling
      for the destruction of museums and libraries. He co-founded the first Fasci di Combattimento in 1919 and
      remained a supporter of Mussolini to the end of the Salò republic.
    argues:
      - {position: tradition.modernity.rupture, in: {author: F. T. Marinetti, title: The Founding and Manifesto of Futurism, year: 1909}}
      - {position: war.militarism.war-ennobles, in: {author: F. T. Marinetti, title: The Founding and Manifesto of Futurism, year: 1909, note: "'war, the world's only hygiene'"}}

  - id: thinker.renaud-camus
    name: Renaud Camus
    born: 1946
    died: null
    region: France
    traditions: [fascism.identitarian]
    summary: >
      French writer who coined the phrase "great replacement" for the claim that the native peoples of Europe
      are being replaced by non-European immigrants with the complicity of a "replacist" ruling class. The
      phrase was taken up across the far right and cited by perpetrators of mass shootings in Christchurch and
      El Paso in 2019.
    argues:
      - {position: migration.cause.elite-replacement, in: {author: Renaud Camus, title: Le Grand Remplacement, year: 2011}}

  - id: thinker.freda
    name: Franco Freda
    born: 1941
    died: null
    region: Italy
    traditions: [fascism.traditionalist]
    summary: >
      Paduan publisher (Edizioni di Ar) and follower of Evola who, in La disintegrazione del sistema (1969),
      called for an alliance of all anti-bourgeois forces to destroy the liberal order and build a "true state"
      ruled by a spiritual elite, with private property abolished. Tried with Giovanni Ventura for the 1969
      Piazza Fontana bombing in Milan, he was convicted at first instance and acquitted on appeal; he served
      prison terms for subversive association and other bombings of 1969.
    argues:
      - {position: state.nature.organic-nation, in: {author: Franco Freda, title: La disintegrazione del sistema, year: 1969, note: "the 'true state' as an organic, absolute reality set against the bourgeois system"}, via: {author: Franco Ferraresi, title: "Threats to Democracy: The Radical Right in Italy after the War", year: 1996, note: "the primary was not read; Ferraresi's account of Freda and the Ar group"}}

  - id: thinker.derek-holland
    name: Derek Holland
    region: Britain
    traditions: [fascism.third-position]
    summary: >
      British Catholic activist of the National Front's "Political Soldier" wing, joint leader of the Official
      National Front with Nick Griffin and Patrick Harrington from 1984, and a founder with Roberto Fiore of the
      International Third Position in 1989. His pamphlet called for a new man who rejects materialism and
      gives his whole life to the national revolution, citing Codreanu's Iron Guard as a model.
    argues:
      - {position: fascism.nature.national-rebirth-self-view, in: {author: Derek Holland, title: "The Political Soldier: A Statement", year: 1984}}

  - id: thinker.malliarakis
    name: Jean-Gilles Malliarakis
    born: 1944
    died: 2025
    region: France
    traditions: [fascism.third-position]
    summary: >
      French nationalist-revolutionary who passed through Occident and Ordre Nouveau, led the Mouvement
      nationaliste révolutionnaire from 1979, and founded Troisième Voie in 1985 on a solidarist program of a
      third way against both capitalism and communism. He later moved to free-market liberalism and joined
      Alain Madelin's circle.
    argues:
      - {position: reform.revolution.national-revolution, in: {author: Jean-Gilles Malliarakis, title: Ni trust ni soviets, year: 1985, note: "Paris, La Librairie française / Le Trident; the primary was not read"}, via: {author: Wikipedia contributors, title: "Third Way (France)", year: 2026, note: "and the article on Jean-Gilles Malliarakis, consulted November 2026; no scholarly secondary account was found"}}
