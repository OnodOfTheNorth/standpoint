# Thinkers: the liberal family (classical, utilitarian, social, egalitarian,
# republican, ordoliberal, Austrian, Chicago, internationalist).
thinkers:
  - id: thinker.locke
    name: John Locke
    born: 1632
    died: 1704
    region: England
    traditions: [liberalism.classical]
    summary: >
      English philosopher who grounded government in the consent of property-owning individuals and
      defended a right to resist rulers who break that trust. He also invested in the Royal African
      Company and helped draft the Fundamental Constitutions of Carolina, which recognized slavery.
    argues:
      - {position: property.private.natural-right, in: {author: John Locke, title: Two Treatises of Government, year: 1689}}
      - {position: authority.legitimacy.consent, in: {author: John Locke, title: Two Treatises of Government, year: 1689}}
      - {position: violence.political.resistance-to-tyranny, in: {author: John Locke, title: Two Treatises of Government, year: 1689}}
      - {position: religion.public.separation, in: {author: John Locke, title: A Letter Concerning Toleration, year: 1689}}
      - {position: rights.basis.natural-rights, in: {author: John Locke, title: Two Treatises of Government, year: 1689}}

  - id: thinker.smith
    name: Adam Smith
    born: 1723
    died: 1790
    region: Scotland
    traditions: [liberalism.classical]
    summary: >
      Scottish moral philosopher whose account of the division of labor, the market price mechanism and
      the gains from trade became the founding text of classical political economy. He was sharply critical
      of merchants' monopolies and of employers' combinations to hold down wages.
    argues:
      - {position: allocation.mechanism.free-market, in: {author: Adam Smith, title: "An Inquiry into the Nature and Causes of the Wealth of Nations", year: 1776}}
      - {position: conflict.nature.market-harmony, in: {author: Adam Smith, title: "An Inquiry into the Nature and Causes of the Wealth of Nations", year: 1776}}
      - {position: exchange.unequal.mutual-gain, in: {author: Adam Smith, title: "An Inquiry into the Nature and Causes of the Wealth of Nations", year: 1776}}
      - {position: tax.purpose.public-goods, in: {author: Adam Smith, title: "An Inquiry into the Nature and Causes of the Wealth of Nations", year: 1776, note: "Book V, on the expenses of the sovereign"}}

  - id: thinker.madison
    name: James Madison
    born: 1751
    died: 1836
    region: United States
    traditions: [liberalism.classical, liberalism.republican]
    summary: >
      Virginia planter and chief drafter of the United States Constitution, who argued that a large
      representative republic with divided powers could contain factions, the most durable of which he
      traced to the unequal distribution of property. He held enslaved people all his life.
    argues:
      - {position: democracy.form.representative, in: {author: James Madison, title: The Federalist No. 10, year: 1787}}
      - {position: conflict.nature.institutionalized, in: {author: James Madison, title: The Federalist No. 10, year: 1787}}
      - {position: human.nature.self-interested, in: {author: James Madison, title: The Federalist No. 51, year: 1788}}

  - id: thinker.paine
    name: Thomas Paine
    born: 1737
    died: 1809
    region: England / United States / France
    traditions: [liberalism.republican, liberalism.classical]
    summary: >
      English-born pamphleteer of the American and French revolutions who attacked hereditary monarchy,
      defended the rights of man against Burke, and proposed a capital grant for every young adult funded
      by a duty on inherited property.
    argues:
      - {position: authority.legitimacy.consent, in: {author: Thomas Paine, title: Common Sense, year: 1776}}
      - {position: hist.french-revolution.rights-of-man, in: {author: Thomas Paine, title: Rights of Man, year: 1791}}
      - {position: democracy.form.representative, in: {author: Thomas Paine, title: "Rights of Man, Part the Second", year: 1792}}
      - {position: property.inheritance.universal-endowment, in: {author: Thomas Paine, title: Agrarian Justice, year: 1797}}

  - id: thinker.tocqueville
    name: Alexis de Tocqueville
    born: 1805
    died: 1859
    region: France
    traditions: [liberalism.classical]
    summary: >
      French aristocrat and deputy who studied the United States as the model of a society of equal
      conditions, praising its local self-government and voluntary associations and warning of a mild,
      tutelary despotism. As a deputy and minister he defended the French conquest of Algeria.
    argues:
      - {position: federalism.scale.subsidiarity, in: {author: Alexis de Tocqueville, title: Democracy in America, year: 1835}}
      - {position: religion.public.separation, in: {author: Alexis de Tocqueville, title: Democracy in America, year: 1835}}
      - {position: welfare.state.coercive-dependency, in: {author: Alexis de Tocqueville, title: Memoir on Pauperism, year: 1835}}

  - id: thinker.mill
    name: John Stuart Mill
    born: 1806
    died: 1873
    region: England
    traditions: [liberalism.utilitarian, liberalism.social]
    summary: >
      English philosopher and East India Company official who joined utilitarian ethics to the harm
      principle, argued for the legal equality of women, and in later work favored limits on inheritance
      and workers' cooperatives. He held that peoples he called "barbarous" could rightly be ruled
      despotically for their improvement.
    argues:
      - {position: liberty.concept.non-interference, in: {author: John Stuart Mill, title: On Liberty, year: 1859}}
      - {position: speech.limits.open-marketplace, in: {author: John Stuart Mill, title: On Liberty, year: 1859}}
      - {position: morality.basis.utility, in: {author: John Stuart Mill, title: Utilitarianism, year: 1861}}
      - {position: feminism.subordination.barriers-and-bias, in: {author: John Stuart Mill, title: The Subjection of Women, year: 1869}}
      - {position: property.inheritance.modest-yes-dynasties-no, in: {author: John Stuart Mill, title: Principles of Political Economy, year: 1848, note: "Book II, ch. 2: cap what any one person may acquire by inheritance"}}
      - {position: ideology.formation.marketplace-of-ideas, in: {author: John Stuart Mill, title: On Liberty, year: 1859, note: "chapter 2, of the liberty of thought and discussion"}}
      - {position: rights.basis.utility, in: {author: John Stuart Mill, title: Utilitarianism, year: 1861, note: "chapter 5: a right is something society ought to defend because of general utility"}}

  - id: thinker.keynes
    name: John Maynard Keynes
    born: 1883
    died: 1946
    region: England
    traditions: [liberalism.social, socdem.keynesian]
    summary: >
      English economist and Liberal who argued that a capitalist economy can settle into mass unemployment
      for lack of demand, and that the state must manage spending, investment and capital flows to keep it
      working. He led the British delegation at Bretton Woods in 1944.
    argues:
      - {position: capitalism.nature.managed-engine, in: {author: John Maynard Keynes, title: The End of Laissez-Faire, year: 1926}}
      - {position: finance.control.capital-controls, in: {author: John Maynard Keynes, title: National Self-Sufficiency, year: 1933}}
      - {position: crisis.cause.demand-failure, in: {author: John Maynard Keynes, title: "The General Theory of Employment, Interest and Money", year: 1936}}
      - {position: allocation.mechanism.mixed-steered, in: {author: John Maynard Keynes, title: "The General Theory of Employment, Interest and Money", year: 1936, note: "ch. 24: a somewhat comprehensive socialisation of investment"}}

  - id: thinker.ropke
    name: Wilhelm Röpke
    born: 1899
    died: 1966
    region: Germany / Switzerland
    traditions: [liberalism.ordoliberal]
    summary: >
      German economist who left Germany in 1933 and became a theorist of the social market economy:
      competitive markets inside a firm legal and moral frame, with property spread widely among small
      owners and farmers rather than concentrated in giant firms or the state.
    argues:
      - {position: markets.nature.framed-tool, in: {author: Wilhelm Röpke, title: The Social Crisis of Our Time, year: 1942}}
      - {position: firm.ownership.small-proprietors, in: {author: Wilhelm Röpke, title: The Social Crisis of Our Time, year: 1942}}
      - {position: allocation.mechanism.social-market, in: {author: Wilhelm Röpke, title: "A Humane Economy: The Social Framework of the Free Market", year: 1958}}

  - id: thinker.hayek
    name: Friedrich Hayek
    born: 1899
    died: 1992
    region: Austria / United Kingdom
    traditions: [liberalism.austrian]
    summary: >
      Austrian-British economist who argued that prices carry dispersed knowledge no planner can gather,
      that central planning leads toward tyranny, and that "social justice" has no meaning in a market
      order. He co-founded the Mont Pelerin Society in 1947 and later defended the Chilean military
      government's economic course.
    argues:
      - {position: crisis.cause.credit-distortion, in: {author: Friedrich Hayek, title: Prices and Production, year: 1931}}
      - {position: totalitarianism.concept.road-from-planning, in: {author: Friedrich Hayek, title: The Road to Serfdom, year: 1944}}
      - {position: calculation.debate.hayek-knowledge, in: {author: Friedrich Hayek, title: The Use of Knowledge in Society, year: 1945}}
      - {position: law.nature.rule-of-law, in: {author: Friedrich Hayek, title: The Constitution of Liberty, year: 1960}}
      - {position: inequality.justice.process-not-pattern, in: {author: Friedrich Hayek, title: "Law, Legislation and Liberty, Vol. 2: The Mirage of Social Justice", year: 1976}}
      - {position: equality.concept.before-the-law, in: {author: F. A. Hayek, title: The Constitution of Liberty, year: 1960, note: "chapter 6, equality, value and merit"}}
      - {position: fascism.nature.a-form-of-socialism, in: {author: F. A. Hayek, title: The Road to Serfdom, year: 1944, note: "chapter 12, the socialist roots of Naziism"}}
      - {position: picket.line.right-to-work, in: {author: F. A. Hayek, title: The Constitution of Liberty, year: 1960, note: "chapter 18, Labor Unions and Employment: coercion of fellow workers by picketing and the closed shop"}}

  - id: thinker.mises
    name: Ludwig von Mises
    born: 1881
    died: 1973
    region: Austria / United States
    traditions: [liberalism.austrian]
    summary: >
      Austrian economist who argued that without market prices for capital goods a socialist economy cannot
      calculate rationally, and who defended commodity money and an unhampered market. Both Hayek and the
      American anarcho-capitalists count him as a teacher.
    argues:
      - {position: money.nature.hard-money, in: {author: Ludwig von Mises, title: The Theory of Money and Credit, year: 1912}}
      - {position: calculation.debate.mises-impossible, in: {author: Ludwig von Mises, title: Economic Calculation in the Socialist Commonwealth, year: 1920}}
      - {position: value.source.subjective-utility, in: {author: Ludwig von Mises, title: "Human Action: A Treatise on Economics", year: 1949}}
      - {position: society.units.individuals, in: {author: Ludwig von Mises, title: Human Action, year: 1949, note: "methodological individualism: all action is performed by individuals"}}
      - {position: consumption.choice.consumer-sovereignty, in: {author: Ludwig von Mises, title: Human Action, year: 1949, note: "the sovereignty of the consumers"}}

  - id: thinker.friedman
    name: Milton Friedman
    born: 1912
    died: 2006
    region: United States
    traditions: [liberalism.chicago]
    summary: >
      American economist of the Chicago school who blamed the Great Depression on the Federal Reserve,
      proposed a fixed monetary rule and a negative income tax, and held that a firm's social
      responsibility is to make profits within the law. He lectured in Chile in 1975, where his former
      students ran economic policy under the military government.
    argues:
      - {position: money.nature.rule-bound-central-bank, in: {author: Milton Friedman, title: A Program for Monetary Stability, year: 1960}}
      - {position: work.future.negative-income-tax, in: {author: Milton Friedman, title: Capitalism and Freedom, year: 1962}}
      - {position: welfare.state.safety-net, in: {author: Milton Friedman, title: Capitalism and Freedom, year: 1962, note: "ch. 12: a negative income tax as the single minimum in place of the welfare programs"}}
      - {position: crisis.cause.shocks-and-errors, in: {author: Milton Friedman and Anna J. Schwartz, title: "A Monetary History of the United States, 1867–1960", year: 1963}}
      - {position: profit.legitimacy.earned-reward, in: {author: Milton Friedman, title: The Social Responsibility of Business Is to Increase Its Profits, year: 1970}}
      - {position: change.possibility.only-in-crisis, in: {author: Milton Friedman, title: "Capitalism and Freedom (preface to the 1982 edition)", year: 1982, note: "only a crisis, actual or perceived, produces real change"}}
      - {position: state.relation.shrink, in: {author: Milton Friedman, title: Capitalism and Freedom, year: 1962, note: "chapter 2, the role of government in a free society"}}
      - {position: education.purpose.parental-authority, in: {author: Milton Friedman, title: The Role of Government in Education, year: 1955, note: "school vouchers so that parents, not the state, choose schools"}}
      - {position: hist.neoliberal-turn.cure-for-stagflation, in: {author: Milton Friedman and Rose Friedman, title: Free to Choose, year: 1980}}
      - {position: investment.ethics.returns-only, in: {author: Milton Friedman, title: "The Social Responsibility of Business Is to Increase Its Profits", year: 1970, note: "New York Times Magazine, 13 September 1970: managers who pursue social goals spend other people's money"}}
      - {position: housing.tenure.market-supply, in: {author: Milton Friedman and George J. Stigler, title: "Roofs or Ceilings? The Current Housing Problem", year: 1946}}

  - id: thinker.popper
    name: Karl Popper
    born: 1902
    died: 1994
    region: Austria / New Zealand / United Kingdom
    traditions: [liberalism.classical]
    summary: >
      Austrian-British philosopher of science who held that knowledge grows by bold conjecture and
      refutation, attacked theories that claim to know where history is going, and defended piecemeal
      reform over remaking society to a blueprint.
    argues:
      - {position: reform.revolution.piecemeal-improvement, in: {author: Karl Popper, title: The Open Society and Its Enemies, year: 1945}}
      - {position: fascism.response.militant-democracy, in: {author: Karl Popper, title: The Open Society and Its Enemies, year: 1945, note: "Vol. 1, ch. 7, note 4: the paradox of tolerance"}}
      - {position: history.motor.contingency, in: {author: Karl Popper, title: The Poverty of Historicism, year: 1957, note: "first published as articles in Economica, 1944–45"}}
      - {position: knowledge.basis.empirical-science, in: {author: Karl Popper, title: "Conjectures and Refutations: The Growth of Scientific Knowledge", year: 1963}}

  - id: thinker.rawls
    name: John Rawls
    born: 1921
    died: 2002
    region: United States
    traditions: [liberalism.egalitarian]
    summary: >
      American philosopher who asked what principles people would choose if they did not know their place
      in society, and answered: equal basic liberties, fair equality of opportunity, and inequalities only
      where they benefit the least advantaged.
    argues:
      - {position: equality.concept.difference-principle, in: {author: John Rawls, title: A Theory of Justice, year: 1971}}
      - {position: inequality.justice.luck-unjust, in: {author: John Rawls, title: A Theory of Justice, year: 1971}}
      - {position: morality.basis.rights-and-consent, in: {author: John Rawls, title: A Theory of Justice, year: 1971}}
      - {position: religion.public.separation, in: {author: John Rawls, title: Political Liberalism, year: 1993}}
      - {position: conscience.refusal.selective-objection, in: {author: John Rawls, title: A Theory of Justice, year: 1971, note: "section 58, conscientious refusal and contingent pacifism"}}

  - id: thinker.sen
    name: Amartya Sen
    born: 1933
    died: null
    region: India / United Kingdom / United States
    traditions: [liberalism.social]
    summary: >
      Indian economist and philosopher who showed that famines follow from collapses in people's command
      over food rather than from shortage alone, and who judges development by what people are actually
      able to do and be.
    argues:
      - {position: population.question.development-settles-it, in: {author: Amartya Sen, title: "Population: Delusion and Reality", year: 1994}}
      - {position: liberty.concept.capability, in: {author: Amartya Sen, title: Development as Freedom, year: 1999}}
      - {position: interests.objective.basic-needs, in: {author: Amartya Sen, title: Development as Freedom, year: 1999}}

  - id: thinker.pettit
    name: Philip Pettit
    born: 1945
    died: null
    region: Ireland / Australia / United States
    traditions: [liberalism.republican]
    summary: >
      Irish philosopher who revived the republican idea of liberty as not living under anyone's arbitrary
      power, and built from it a theory of government that ordinary citizens must be able to contest.
    argues:
      - {position: liberty.concept.non-domination, in: {author: Philip Pettit, title: "Republicanism: A Theory of Freedom and Government", year: 1997}}
      - {position: democracy.form.representative, in: {author: Philip Pettit, title: "On the People's Terms: A Republican Theory and Model of Democracy", year: 2012}}

  - id: thinker.fukuyama
    name: Francis Fukuyama
    born: 1952
    died: null
    region: United States
    traditions: [liberalism.internationalist]
    summary: >
      American political scientist who argued in 1989 that liberal democracy and the market economy had no
      remaining ideological rival, and later that strong, accountable state institutions decide which
      countries prosper. He broke with the neoconservatives over the Iraq war.
    argues:
      - {position: hist.collapse-1989.end-of-history, in: {author: Francis Fukuyama, title: The End of History?, year: 1989}}
      - {position: progress.idea.steady-improvement, in: {author: Francis Fukuyama, title: The End of History and the Last Man, year: 1992}}
      - {position: poverty.cause.bad-institutions, in: {author: Francis Fukuyama, title: "State-Building: Governance and World Order in the 21st Century", year: 2004}}
      - {position: clientelism.patronage.corruption, in: {author: Francis Fukuyama, title: Political Order and Political Decay, year: 2014, note: "clientelism and the reform of patronage bureaucracies in the United States, Greece and Italy"}}

  - id: thinker.kant
    name: Immanuel Kant
    born: 1724
    died: 1804
    region: Prussia
    traditions: [liberalism.classical, liberalism.republican]
    summary: >
      Königsberg philosopher who grounded morality in the autonomy of reason. In politics he held that the one
      innate right is to act independently of the will of others under a universal law, that the rightful constitution is a representative republic
      with separated powers, and that a federation of republics could end war between states.
    argues:
      - {position: tradition.modernity.enlightenment, in: {author: Immanuel Kant, title: "An Answer to the Question: What Is Enlightenment?", year: 1784}}
      - {position: progress.idea.steady-improvement, in: {author: Immanuel Kant, title: Idea for a Universal History with a Cosmopolitan Aim, year: 1784, note: "progress of the species through 'unsocial sociability' toward a lawful civil and international order"}}
      - {position: rights.basis.natural-rights, in: {author: Immanuel Kant, title: The Metaphysics of Morals, year: 1797, note: "freedom as the one innate right, held by every person by virtue of humanity before any public act"}}
      - {position: democracy.form.representative, in: {author: Immanuel Kant, title: Toward Perpetual Peace, year: 1795, note: "first definitive article: the civil constitution of every state shall be republican"}}
      - {position: prisons.purpose.retribution, in: {author: Immanuel Kant, title: The Metaphysics of Morals, year: 1797, note: "the right to punish: the last murderer in prison must be executed before the people disperses"}}

  - id: thinker.constant
    name: Benjamin Constant
    born: 1767
    died: 1830
    region: Switzerland / France
    traditions: [liberalism.classical]
    summary: >
      Swiss-born French writer and deputy who opposed both Jacobin terror and Napoleon's rule. He argued that
      the liberty of modern commercial peoples is the peaceful enjoyment of private independence, secured by
      representative government and limits on all sovereignty, including that of the people.
    argues:
      - {position: liberty.concept.non-interference, in: {author: Benjamin Constant, title: The Liberty of the Ancients Compared with that of the Moderns, year: 1819}}
      - {position: democracy.form.representative, in: {author: Benjamin Constant, title: The Liberty of the Ancients Compared with that of the Moderns, year: 1819, note: "the representative system as the form liberty must take among the moderns"}}
      - {position: speech.limits.open-marketplace, in: {author: Benjamin Constant, title: Principles of Politics Applicable to All Representative Governments, year: 1815, note: "chapter on freedom of the press"}}
      - {position: siege.governance.constitutional-order, in: {author: Benjamin Constant, title: The Spirit of Conquest and Usurpation, year: 1814, note: "against arbitrary measures taken in the name of public safety"}}

  - id: thinker.bentham
    name: Jeremy Bentham
    born: 1748
    died: 1832
    region: England
    traditions: [liberalism.utilitarian]
    summary: >
      English jurist and reformer who founded utilitarianism: law and policy are to be judged by whether they
      increase the happiness of the greatest number. He called natural rights "nonsense upon stilts" and
      treated rights and property alike as creatures of law.
    argues:
      - {position: morality.basis.utility, in: {author: Jeremy Bentham, title: An Introduction to the Principles of Morals and Legislation, year: 1789}}
      - {position: rights.basis.utility, in: {author: Jeremy Bentham, title: Anarchical Fallacies, year: 1843, note: "written 1795–96 against the French declarations of rights; a French version appeared in 1816"}}
      - {position: property.private.convention, in: {author: Jeremy Bentham, title: Principles of the Civil Code, year: 1802, note: "published by Étienne Dumont in Traités de législation civile et pénale: property and law are born together and die together"}}
      - {position: debt.household.free-credit, in: {author: Jeremy Bentham, title: Defence of Usury, year: 1787}}
      - {position: prisons.purpose.deterrence, in: {author: Jeremy Bentham, title: An Introduction to the Principles of Morals and Legislation, year: 1789}}

  - id: thinker.green
    name: T. H. Green
    born: 1836
    died: 1882
    region: England
    traditions: [liberalism.social]
    summary: >
      Oxford idealist philosopher whose teaching turned English liberalism toward the state. He held that
      liberty is a positive power to do something worth doing, that rights exist only where a community
      recognizes them as serving a common good, and that law may restrict contracts that destroy that power.
    argues:
      - {position: liberty.concept.capability, in: {author: T. H. Green, title: Liberal Legislation and Freedom of Contract, year: 1881}}
      - {position: rights.basis.membership, in: {author: T. H. Green, title: Lectures on the Principles of Political Obligation, year: 1886, note: "delivered 1879–80; rights as powers recognized by a society directed to a common good"}}

  - id: thinker.dewey
    name: John Dewey
    born: 1859
    died: 1952
    region: United States
    traditions: [liberalism.social]
    summary: >
      American pragmatist philosopher and educator. He held that self-government is a way of life of shared inquiry,
      that schools should train children in that inquiry rather than in obedience, and that liberalism had to
      use organized social intelligence to bring the economy under public control.
    argues:
      - {position: education.purpose.critical-citizens, in: {author: John Dewey, title: Democracy and Education, year: 1916}}
      - {position: tradition.modernity.enlightenment, in: {author: John Dewey, title: Reconstruction in Philosophy, year: 1920, note: "customs and institutions to be tested as working hypotheses by their consequences"}}

  - id: thinker.lippmann
    name: Walter Lippmann
    born: 1889
    died: 1974
    region: United States
    traditions: [liberalism.social]
    summary: >
      American journalist and adviser to presidents. He argued that citizens see politics through stereotypes
      supplied by the press and cannot govern directly, so public affairs must be run by informed insiders and
      experts, with the public intervening only to back one set of governors against another. The 1938
      Paris colloquium named for him helped launch neoliberalism.
    argues:
      - {position: change.possibility.from-above, in: {author: Walter Lippmann, title: Public Opinion, year: 1922}}
      - {position: history.elites.competing-elites, in: {author: Walter Lippmann, title: The Phantom Public, year: 1925, note: "the public's role is to align itself for or against the ins and outs, not to govern"}}

  - id: thinker.kelsen
    name: Hans Kelsen
    born: 1881
    died: 1973
    region: Austria / United States
    traditions: [liberalism.classical]
    summary: >
      Austrian jurist who drafted the Austrian constitution of 1920 and its constitutional court. His pure
      theory of law treated law as a hierarchy of norms valid by procedure, apart from morality, and he defended
      parliamentary democracy as compromise among parties. Dismissed from his Cologne chair in 1933, he
      emigrated to the United States.
    argues:
      - {position: law.nature.positive-command, in: {author: Hans Kelsen, title: Pure Theory of Law, year: 1934}}
      - {position: democracy.form.representative, in: {author: Hans Kelsen, title: The Essence and Value of Democracy, year: 1920}}

  - id: thinker.mosca
    name: Gaetano Mosca
    born: 1858
    died: 1941
    region: Italy
    traditions: [liberalism.classical]
    summary: >
      Sicilian jurist, deputy and senator, a conservative liberal who distrusted universal suffrage and later
      voted against Mussolini's laws. He argued that in every society an organized minority, the political
      class, rules the disorganized majority, and that the best a society can do is balance rival social
      forces within that rule.
    argues:
      - {position: history.elites.iron-law, in: {author: Gaetano Mosca, title: "Elementi di scienza politica (The Ruling Class)", year: 1896}}

  - id: thinker.berlin
    name: Isaiah Berlin
    born: 1909
    died: 1997
    region: Latvia / United Kingdom
    traditions: [liberalism.classical]
    summary: >
      Riga-born Oxford historian of ideas. He distinguished negative liberty, the area in which a person is
      left alone, from positive liberty, self-mastery, and argued that the second had been turned into a
      warrant for tyranny. He held that human values are plural and cannot all be reconciled, and rejected
      every doctrine of historical inevitability.
    argues:
      - {position: liberty.concept.non-interference, in: {author: Isaiah Berlin, title: Two Concepts of Liberty, year: 1958}}
      - {position: history.motor.contingency, in: {author: Isaiah Berlin, title: Historical Inevitability, year: 1954}}

  - id: thinker.ronald-dworkin
    name: Ronald Dworkin
    born: 1931
    died: 2013
    region: United States / United Kingdom
    traditions: [liberalism.egalitarian]
    summary: >
      American legal philosopher who taught at Oxford and New York University. He held that rights are trumps
      grounded in government's duty of equal concern and respect, that a just distribution should track
      people's choices but not their brute luck, and that even hateful speech must be allowed if laws are to
      be legitimate for all.
    argues:
      - {position: morality.basis.rights-and-consent, in: {author: Ronald Dworkin, title: Taking Rights Seriously, year: 1977}}
      - {position: inequality.justice.luck-unjust, in: {author: Ronald Dworkin, title: "Sovereign Virtue: The Theory and Practice of Equality", year: 2000}}
      - {position: speech.limits.open-marketplace, in: {author: Ronald Dworkin, title: "Freedom's Law: The Moral Reading of the American Constitution", year: 1996}}

  - id: thinker.anderson
    name: Elizabeth Anderson
    born: 1959
    died: null
    region: United States
    traditions: [liberalism.egalitarian]
    summary: >
      American philosopher at the University of Michigan. She argued that the point of equality is not to
      compensate bad luck but to end relations of domination and contempt, and that the modern firm is a
      private government whose bosses rule workers' lives with little accountability.
    argues:
      - {position: equality.concept.relational, in: {author: Elizabeth Anderson, title: What Is the Point of Equality?, year: 1999}}
      - {position: liberty.concept.non-domination, in: {author: Elizabeth Anderson, title: "Private Government: How Employers Rule Our Lives (and Why We Don't Talk about It)", year: 2017}}

  - id: thinker.waldron
    name: Jeremy Waldron
    born: 1953
    died: null
    region: New Zealand / United States
    traditions: [liberalism.social]
    summary: >
      New Zealand-born legal philosopher at New York University. He argued that hate speech is a form of group
      libel that attacks the public assurance of equal standing every citizen needs, and that well-ordered
      liberal democracies may outlaw it.
    argues:
      - {position: speech.limits.dignity-limits, in: {author: Jeremy Waldron, title: The Harm in Hate Speech, year: 2012}}

  - id: thinker.stigler
    name: George Stigler
    born: 1911
    died: 1991
    region: United States
    traditions: [liberalism.chicago]
    summary: >
      Chicago economist and Nobel laureate. He argued that regulation is as a rule acquired by the industry it
      regulates and designed and run for its benefit, so that regulatory agencies serve organized producers
      rather than the public.
    argues:
      - {position: state.nature.captured, in: {author: George J. Stigler, title: The Theory of Economic Regulation, year: 1971}}
      - {position: housing.tenure.market-supply, in: {author: Milton Friedman and George J. Stigler, title: "Roofs or Ceilings? The Current Housing Problem", year: 1946}}

  - id: thinker.habermas
    name: Jürgen Habermas
    born: 1929
    died: null
    region: Germany
    traditions: [marxism.western, liberalism.social]
    summary: >
      German philosopher of the second generation of the Frankfurt School. He defended modernity as an
      unfinished project of communicative reason, grounded constitutional democracy in public deliberation,
      and in the historians' dispute of 1986 attacked conservative historians for relativizing the Holocaust.
    argues:
      - {position: tradition.modernity.enlightenment, in: {author: Jürgen Habermas, title: The Philosophical Discourse of Modernity, year: 1985}}
      - {position: hist.ww2.holocaust-rupture, in: {author: Jürgen Habermas, title: A Kind of Settlement of Damages, year: 1986, note: "Die Zeit, July 1986, opening the Historikerstreit against Nolte and Hillgruber"}}

  - id: thinker.mason
    name: George Mason
    born: 1725
    died: 1792
    region: Virginia
    traditions: [liberalism.republican]
    summary: >
      Virginia planter and slaveholder who drafted the Virginia Declaration of Rights. At the Philadelphia
      convention of 1787 he refused to sign the Constitution because it lacked a bill of rights and
      concentrated power in a distant government, and he led opposition to it in Virginia.
    argues:
      - {position: rights.basis.natural-rights, in: {author: George Mason, title: Virginia Declaration of Rights, year: 1776}}

  - id: thinker.douglass
    name: Frederick Douglass
    born: 1818
    died: 1895
    region: United States
    traditions: [liberalism.republican]
    summary: >
      Escaped from slavery in Maryland in 1838 and became the leading Black abolitionist orator and editor. He
      read the Constitution as an anti-slavery charter, recruited Black soldiers for the Union, and held that
      the oppressed win their rights only by organized struggle.
    argues:
      - {position: rights.basis.won-in-struggle, in: {author: Frederick Douglass, title: West India Emancipation, year: 1857, note: "'Power concedes nothing without a demand. It never did and it never will.'"}}
      - {position: change.possibility.organized-people-can, in: {author: Frederick Douglass, title: West India Emancipation, year: 1857, note: "'If there is no struggle there is no progress'"}}

  - id: thinker.katznelson
    name: Ira Katznelson
    born: 1944
    died: null
    region: United States
    traditions: [liberalism.social]
    summary: >
      Columbia political scientist and historian. He showed that Southern Democrats in Congress shaped New Deal
      and Fair Deal laws to exclude farm and domestic workers and to leave administration to local officials,
      so that the programs channeled their benefits to white Americans.
    argues:
      - {position: hist.new-deal.white-new-deal, in: {author: Ira Katznelson, title: "When Affirmative Action Was White: An Untold History of Racial Inequality in Twentieth-Century America", year: 2005}}

  - id: thinker.shlaes
    name: Amity Shlaes
    born: 1960
    died: null
    region: United States
    traditions: [liberalism.classical]
    summary: >
      American journalist and economic historian. She argued that the New Deal's experiments, taxes and attacks
      on business created an uncertainty that kept private investment low and prolonged the Depression, at the
      cost of the "forgotten man" who paid for them.
    argues:
      - {position: hist.new-deal.prolonged-the-depression, in: {author: Amity Shlaes, title: "The Forgotten Man: A New History of the Great Depression", year: 2007}}

  - id: thinker.garton-ash
    name: Timothy Garton Ash
    born: 1955
    died: null
    region: United Kingdom
    traditions: [liberalism.internationalist]
    summary: >
      British historian and journalist who reported from Warsaw, Budapest, Berlin and Prague in 1989. He
      described the events as negotiated, largely non-violent revolutions in which civil societies recovered
      self-government and Central Europe returned to Europe.
    argues:
      - {position: hist.collapse-1989.peoples-revolutions, in: {author: Timothy Garton Ash, title: "We the People: The Revolution of '89", year: 1990, note: "published in the United States as The Magic Lantern"}}

  - id: thinker.neier
    name: Aryeh Neier
    born: 1937
    died: null
    region: Germany / United States
    traditions: [liberalism.classical]
    summary: >
      Berlin-born refugee who led the American Civil Liberties Union from 1970 to 1978 and later founded Human
      Rights Watch. He defended the right of a Nazi group to march in Skokie, Illinois, holding that freedom
      of speech protects its enemies or no one.
    argues:
      - {position: fascism.response.answer-with-speech, in: {author: Aryeh Neier, title: "Defending My Enemy: American Nazis, the Skokie Case, and the Risks of Freedom", year: 1979}}

  - id: thinker.kalven
    name: Harry Kalven Jr.
    born: 1914
    died: 1974
    region: United States
    traditions: [liberalism.classical]
    summary: >
      University of Chicago law professor and scholar of free speech. He chaired the committee whose 1967
      report held that a university is the home of critics, not itself a critic, and must stay neutral on
      political questions to protect its members' freedom of inquiry.
    argues:
      - {position: university.neutrality.institutional-neutrality, in: {author: Kalven Committee (chair Harry Kalven Jr.), title: "Report on the University's Role in Political and Social Action", year: 1967}}

  - id: thinker.macintyre
    name: Alasdair MacIntyre
    born: 1929
    died: 2025
    region: Scotland / United States
    traditions: [communitarianism]
    summary: >
      Scottish philosopher, a Marxist in his youth and later a Thomist Catholic, who taught at Notre Dame. He
      argued that the Enlightenment project of grounding morality in reason alone had failed, leaving moral
      argument in fragments, and that the virtues can only be learned in communities of shared practice,
      which must now be built and defended locally against the market and the state.
    argues:
      - {position: state.relation.parallel-polis, in: {author: Alasdair MacIntyre, title: After Virtue, year: 1981, note: "the construction of local forms of community while waiting for another St Benedict"}}
      - {position: morality.basis.tradition, in: {author: Alasdair MacIntyre, title: "Whose Justice? Which Rationality?", year: 1988}}

  - id: thinker.sandel
    name: Michael Sandel
    born: 1953
    died: null
    region: United States
    traditions: [communitarianism]
    summary: >
      Harvard political philosopher. Against Rawls he argued that persons are constituted by attachments they do
      not choose, and later that the United States had drifted from having a market economy to being a market
      society in which money corrupts goods that should not be for sale.
    argues:
      - {position: hist.neoliberal-turn.market-society, in: {author: Michael J. Sandel, title: "What Money Can't Buy: The Moral Limits of Markets", year: 2012}}
      - {position: property.commons.not-for-sale, in: {author: Michael J. Sandel, title: "What Money Can't Buy: The Moral Limits of Markets", year: 2012}}
      - {position: property.self-ownership.relational, in: {author: Michael J. Sandel, title: Liberalism and the Limits of Justice, year: 1982, note: "the encumbered self against Rawls's unencumbered self"}}
