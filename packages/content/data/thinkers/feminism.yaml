thinkers:
  - id: thinker.dalla-costa
    name: Mariarosa Dalla Costa
    born: 1943
    region: Italy
    traditions: [marxism.social-reproduction, marxism.autonomism]
    summary: Italian political scientist from the Padua operaista milieu and co-founder of the International Feminist Collective, which launched the Wages for Housework campaign in 1972.
    argues:
      - {position: feminism.subordination.social-reproduction, in: {author: Mariarosa Dalla Costa, title: "Women and the Subversion of the Community", year: 1972, note: "in Dalla Costa and Selma James, The Power of Women and the Subversion of the Community"}}
      - {position: labor.division.paid-and-unpaid, in: {author: Mariarosa Dalla Costa, title: "Women and the Subversion of the Community", year: 1972}}

  - id: thinker.firestone
    name: Shulamith Firestone
    born: 1945
    died: 2012
    region: Canada / United States
    traditions: [feminism.radical]
    summary: Canadian-born co-founder of New York Radical Women and Redstockings, who argued that the biological family is the root of women's subordination and that technology could end it.
    argues:
      - {position: gender.basis.sex-class, in: {author: Shulamith Firestone, title: "The Dialectic of Sex", year: 1970}}
      - {position: family.form.abolition, in: {author: Shulamith Firestone, title: "The Dialectic of Sex", year: 1970}}
      - {position: technology.nature.liberation, in: {author: Shulamith Firestone, title: "The Dialectic of Sex", year: 1970, note: "artificial reproduction as liberation"}}

  - id: thinker.davis
    name: Angela Y. Davis
    born: 1944
    died: null
    region: United States
    traditions: [feminism.black, marxism.black-radical]
    summary: American philosopher and former Communist Party candidate who was tried and acquitted in 1972, and has written on race, class and gender and on the abolition of prisons.
    argues:
      - {position: feminism.subordination.interlocking, in: {author: Angela Y. Davis, title: "Women, Race & Class", year: 1981}}
      - {position: care.work.socialize, in: {author: Angela Y. Davis, title: "Women, Race & Class", year: 1981, note: "chapter 'The Approaching Obsolescence of Housework'"}}
      - {position: prisons.purpose.abolition, in: {author: Angela Y. Davis, title: "Are Prisons Obsolete?", year: 2003}}

  - id: thinker.fraser
    name: Nancy Fraser
    born: 1947
    died: null
    region: United States
    traditions: [marxism.social-reproduction, feminism.materialist]
    summary: American critical theorist who has written on redistribution and recognition, on the crisis of care, and on capitalism's dependence on unpaid reproduction, nature and expropriation.
    argues:
      - {position: feminism.subordination.social-reproduction, in: {author: Nancy Fraser, title: "Contradictions of Capital and Care", year: 2016}}
      - {position: change.agent.many-oppressed, in: {author: Cinzia Arruzza, Tithi Bhattacharya and Nancy Fraser, title: "Feminism for the 99%: A Manifesto", year: 2019}}
      - {position: ecology.crisis-cause.capital-accumulation, in: {author: Nancy Fraser, title: "Cannibal Capitalism", year: 2022}}
