thinkers:
  # ---- North America and the Pacific
  - id: thinker.deloria
    name: Vine Deloria Jr.
    born: 1933
    died: 2005
    region: Standing Rock Sioux / United States
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Standing Rock Sioux lawyer, theologian and executive director of the National Congress of American Indians
      from 1964 to 1967. He argued that Indian tribes are nations whose relation with the United States rests on
      treaties between sovereigns, and that indigenous religions are bound to particular lands rather than to a
      history of salvation.
    argues:
      - {position: property.land.relational, in: {author: Vine Deloria Jr., title: "God Is Red: A Native View of Religion", year: 1973}}
      - {position: indigenous.sovereignty.inherent-nationhood, in: {author: Vine Deloria Jr., title: "Behind the Trail of Broken Treaties: An Indian Declaration of Independence", year: 1974}}

  - id: thinker.coulthard
    name: Glen Sean Coulthard
    region: Yellowknives Dene / Canada
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Yellowknives Dene political theorist at the University of British Columbia. Drawing on Marx and Fanon, he
      argues that Canada's politics of recognition reproduces the colonial relation it claims to end, because
      settler colonialism rests on dispossession of land, and that indigenous peoples should turn to resurgence
      grounded in their relations with the land.
    argues:
      - {position: indigenous.sovereignty.resurgence, in: {author: Glen Sean Coulthard, title: "Red Skin, White Masks: Rejecting the Colonial Politics of Recognition", year: 2014}}
      - {position: settler.colonialism.ongoing-structure, in: {author: Glen Sean Coulthard, title: "Red Skin, White Masks: Rejecting the Colonial Politics of Recognition", year: 2014}}

  - id: thinker.leanne-simpson
    name: Leanne Betasamosake Simpson
    region: Michi Saagiig Nishnaabeg / Canada
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Michi Saagiig Nishnaabeg writer and musician. She argues for radical resurgence: rebuilding Nishnaabeg
      political and economic life on the land, refusing the state's recognition, and opposing capitalism, which
      she treats as inseparable from settler colonialism.
    argues:
      - {position: indigenous.sovereignty.resurgence, in: {author: Leanne Betasamosake Simpson, title: "As We Have Always Done: Indigenous Freedom through Radical Resistance", year: 2017}}

  - id: thinker.alfred
    name: Taiaiake Alfred
    born: 1964
    region: Kahnawà:ke Mohawk / Canada
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Kanien'kehá:ka political scientist and former Marine. He argues that indigenous peoples must reject the
      state-defined status of "Aboriginal" and regenerate their own nations through a warrior ethic of
      nonviolent but uncompromising resistance.
    argues:
      - {position: indigenous.sovereignty.resurgence, in: {author: Taiaiake Alfred, title: "Wasáse: Indigenous Pathways of Action and Freedom", year: 2005}}

  - id: thinker.estes
    name: Nick Estes
    region: Lower Brule Sioux / United States
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Kul Wicasa historian at the University of Minnesota and co-founder of The Red Nation. Writing from the
      Standing Rock protests against the Dakota Access Pipeline, he places them in a long Oceti Sakowin tradition
      of resistance and argues that indigenous liberation requires the return of land and the end of capitalism.
    argues:
      - {position: settler.colonialism.land-back, in: {author: Nick Estes, title: "Our History Is the Future: Standing Rock Versus the Dakota Access Pipeline, and the Long Tradition of Indigenous Resistance", year: 2019}}
      - {position: indigenous.sovereignty.land-is-the-question, in: {author: Nick Estes, title: "Our History Is the Future: Standing Rock Versus the Dakota Access Pipeline, and the Long Tradition of Indigenous Resistance", year: 2019}}

  - id: thinker.laduke
    name: Winona LaDuke
    born: 1959
    region: White Earth Anishinaabe / United States
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Anishinaabe economist and organizer who founded the White Earth Land Recovery Project and Honor the Earth, and
      was the Green Party's vice-presidential candidate in 1996 and 2000. She documents indigenous struggles against
      mines, dams and pipelines and holds that land and the other beings on it are relatives, not resources.
    argues:
      - {position: nature.value.kin-and-relation, in: {author: Winona LaDuke, title: "All Our Relations: Native Struggles for Land and Life", year: 1999}}

  - id: thinker.trask
    name: Haunani-Kay Trask
    born: 1949
    died: 2021
    region: Hawai'i
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Kanaka Maoli scholar and leader of the Hawaiian sovereignty movement. She argued that Hawai'i is an occupied
      nation whose kingdom was overthrown with US troops in 1893, and that tourism and the military continue the
      dispossession of the Hawaiian people.
    argues:
      - {position: settler.colonialism.ongoing-structure, in: {author: Haunani-Kay Trask, title: "From a Native Daughter: Colonialism and Sovereignty in Hawai'i", year: 1993}}

  - id: thinker.tuhiwai-smith
    name: Linda Tuhiwai Smith
    born: 1950
    region: Aotearoa New Zealand
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Māori scholar of education (Ngāti Awa and Ngāti Porou). She argues that Western research has been an
      instrument of imperialism over indigenous peoples and sets out research by and for indigenous communities
      on their own terms.
    argues:
      - {position: tradition.modernity.decolonial, in: {author: Linda Tuhiwai Smith, title: "Decolonizing Methodologies: Research and Indigenous Peoples", year: 1999}}

  # ---- Latin America
  - id: thinker.reinaga
    name: Fausto Reinaga
    born: 1906
    died: 1994
    region: Bolivia
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Aymara-Quechua writer, once a Marxist and a supporter of the 1952 revolution, who founded the Indian Party of
      Aymaras and Quechuas in 1962. He argued that Bolivia's Indians are a nation oppressed by a white and mestizo
      state, and that their liberation is an Indian revolution, not a class struggle led by the left.
    argues:
      - {position: indigenous.sovereignty.inherent-nationhood, in: {author: Fausto Reinaga, title: La revolución india, year: 1970}}

  - id: thinker.quispe
    name: Felipe Quispe
    born: 1942
    died: 2021
    region: Bolivia
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Aymara leader known as El Mallku, founder of the Tupak Katari Indian Movement and co-founder of the Tupak
      Katari Guerrilla Army. Arrested in 1992, he spent five years in prison, then led the peasant confederation
      CSUTCB in the road blockades of 2000 to 2003 and founded the Pachakuti Indigenous Movement.
    argues:
      - {position: violence.political.anti-colonial, in: {author: Felipe Quispe Huanca, title: "Tupak Katari vive y vuelve... carajo", year: 1988}}

  - id: thinker.rivera-cusicanqui
    name: Silvia Rivera Cusicanqui
    born: 1949
    region: Bolivia
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Aymara sociologist and founder of the Andean Oral History Workshop, historian of the Katarista movement. She
      criticizes decolonial theory from Northern universities and, from 2013, the MAS government's "colonial turn"
      toward extraction and one-man rule; in 2019 she rejected both the fraud and the coup accounts of Morales's fall.
    argues:
      - {position: hist.bolivia-2019.neither-evo-nor-the-right, in: {author: Silvia Rivera Cusicanqui, title: "Bolivia's Lesson in Triumphalism", year: 2020, note: "in the Toward Freedom Bolivia Reader"}}

  - id: thinker.menchu
    name: Rigoberta Menchú
    born: 1959
    region: Guatemala
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      K'iche' Maya organizer of the Committee for Peasant Unity, whose father died in the army's burning of the
      Spanish embassy in 1980 and whose mother and brother were killed by the army. Her testimony told the war on
      Guatemala's Maya through her family's story; the anthropologist David Stoll later disputed details of it.
      She received the Nobel Peace Prize in 1992.
    argues:
      - {position: religion.public.prophetic-church, in: {author: Rigoberta Menchú and Elisabeth Burgos-Debray, title: "I, Rigoberta Menchú: An Indian Woman in Guatemala", year: 1983}}

  - id: thinker.krenak
    name: Ailton Krenak
    born: 1953
    region: Brazil
    traditions: [nationalism.indigenous-sovereignty]
    summary: >-
      Krenak leader and writer who addressed Brazil's constituent assembly in 1987 with his face painted black in
      mourning, and co-founded the Union of Indigenous Nations and the Alliance of the Peoples of the Forest. He
      argues that the idea of a single humanity separate from the Earth is what is ending the world.
    argues:
      - {position: development.path.post-development, in: {author: Ailton Krenak, title: Ideias para adiar o fim do mundo, year: 2019, note: "English translation Ideas to Postpone the End of the World, 2020"}}
