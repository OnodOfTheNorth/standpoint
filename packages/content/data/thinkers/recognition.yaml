# Thinkers on the sides of the redistribution-recognition debate (data/debates/culture.yaml)
# who belong to neither the feminist nor the anarchist files.
thinkers:
  - id: thinker.honneth
    name: Axel Honneth
    born: 1949
    died: null
    region: Germany
    traditions: [marxism.western]
    summary: German philosopher who directed the Institute for Social Research in Frankfurt from 2001 to 2018. He holds that social conflicts grow out of experiences of disrespect in love, legal rights and social esteem, and that a theory of recognition explains struggles over distribution too.
    argues:
      - {position: equality.concept.relational, in: {author: Axel Honneth, title: "The Struggle for Recognition: The Moral Grammar of Social Conflicts", year: 1992, note: "German: Kampf um Anerkennung"}}
      - {position: human.nature.plastic-social, in: {author: Axel Honneth, title: "The Struggle for Recognition: The Moral Grammar of Social Conflicts", year: 1992}}

  - id: thinker.michaels
    name: Walter Benn Michaels
    born: 1948
    died: null
    region: United States
    traditions: [socdem.democratic-socialism]
    summary: American literary scholar at the University of Illinois Chicago who argues that the American left's commitment to diversity treats inequality as a problem of discrimination and leaves the distribution of wealth untouched.
    argues:
      - {position: race.nature.class-first, in: {author: Walter Benn Michaels, title: "The Trouble with Diversity: How We Learned to Love Identity and Ignore Inequality", year: 2006}}
      - {position: culture.war.manufactured-diversion, in: {author: Walter Benn Michaels, title: "The Trouble with Diversity: How We Learned to Love Identity and Ignore Inequality", year: 2006}}
