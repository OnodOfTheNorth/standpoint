thinkers:
  # ---- Independence and the national question
  - id: thinker.marti
    name: José Martí
    born: 1853
    died: 1895
    region: Cuba / United States
    traditions: [nationalism.civic]
    summary: >-
      Cuban poet, journalist and founder of the Cuban Revolutionary Party in 1892, who organized the war of
      independence of 1895 from exile and was killed in its first weeks. He warned against the expansion of the
      United States into "our America" and held that a Cuban is more than white or Black, so that a war of
      independence would also end racial division.
    argues:
      - {position: liberty.concept.national-liberation, in: {author: José Martí, title: Nuestra América, year: 1891}}
      - {position: race.nature.mixed-nation, in: {author: José Martí, title: Mi raza, year: 1893}}

  - id: thinker.peron
    name: Juan Domingo Perón
    born: 1895
    died: 1974
    region: Argentina
    traditions: [nationalism.peronism]
    summary: >-
      Army officer and labor secretary after the coup of 1943, elected president of Argentina in 1946, 1951 and
      1973. His governments built the unions into a pillar of the state, nationalized railways and utilities,
      and raised labor's share of income; he called it a third position between capitalism and communism. He was
      overthrown in 1955 and lived in exile until 1973; the Triple A death squad was formed under his last
      government.
    argues:
      - {position: conflict.nature.organic-harmony, in: {author: Juan Domingo Perón, title: La comunidad organizada, year: 1949}}
      - {position: nationalism.kinds.national-popular-front, in: {author: Juan Domingo Perón, title: La hora de los pueblos, year: 1968}}

  - id: thinker.eva-peron
    name: Eva Perón
    born: 1919
    died: 1952
    region: Argentina
    traditions: [nationalism.peronism]
    summary: >-
      Actress who married Juan Perón in 1945, ran the Eva Perón Foundation and founded the Peronist Women's Party,
      and campaigned for women's suffrage, won in 1947. She held that the social aid she gave was justice owed to
      the workers, not charity.
    argues:
      - {position: welfare.state.social-citizenship, in: {author: Eva Perón, title: La razón de mi vida, year: 1951}}

  - id: thinker.jauretche
    name: Arturo Jauretche
    born: 1901
    died: 1974
    region: Argentina
    traditions: [nationalism.peronism]
    summary: >-
      Radical Party militant who co-founded FORJA in 1935 against Argentina's dependence on Britain, and later a
      Peronist essayist. He attacked the "colonial pedagogy" by which the oligarchy and a Europeanized
      intelligentsia taught Argentines to despise their own country and serve foreign interests.
    argues:
      - {position: comprador.nature.sellout-elites, in: {author: Arturo Jauretche, title: Los profetas del odio, year: 1957}}

  # ---- Cuba and the guerrilla road
  - id: thinker.castro
    name: Fidel Castro
    born: 1926
    died: 2016
    region: Cuba
    traditions: [marxism.ml]
    summary: >-
      Lawyer who led the attack on the Moncada barracks in 1953 and the guerrilla war that overthrew Batista in
      1959, then prime minister and president of Cuba until 2008. He declared the revolution socialist in 1961
      and led the Communist Party of Cuba from 1965. His government expropriated US and Cuban owners, built
      universal health care and literacy, sent troops to Angola, and allowed no opposition parties or independent
      press.
    argues:
      - {position: violence.political.resistance-to-tyranny, in: {author: Fidel Castro, title: History Will Absolve Me, year: 1953}}
      - {position: debt.sovereign.already-paid, in: {author: Fidel Castro, title: "How Latin America's and the Third World's Unpayable Foreign Debt Can and Should Be Cancelled", year: 1985, note: "interview with the Mexican daily Excélsior"}}
      - {position: hist.cuban-revolution.marti-completed, in: {author: Fidel Castro and Ignacio Ramonet, title: "Fidel Castro: My Life", year: 2006, note: "Spanish original Cien horas con Fidel"}}

  - id: thinker.fonseca
    name: Carlos Fonseca
    born: 1936
    died: 1976
    region: Nicaragua
    traditions: [marxism.guevarism]
    summary: >-
      Founder of the Sandinista National Liberation Front in 1961, who joined the anti-imperialist legacy of
      Augusto Sandino to the Cuban example of guerrilla war. He was killed by the National Guard in 1976, three
      years before the Sandinistas took power.
    argues:
      - {position: change.means.armed-struggle, in: {author: Carlos Fonseca, title: "Nicaragua: Hora cero", year: 1969}}

  - id: thinker.farber
    name: Samuel Farber
    born: 1939
    region: Cuba / United States
    traditions: [marxism.third-camp]
    summary: >-
      Cuban-born socialist and political scientist at Brooklyn College who left the island in 1958. Writing from
      the tradition of socialism from below, he argues that a guerrilla leadership took power over a demobilized
      working class, chose the Soviet model on its own initiative, and made the unions arms of the state.
    argues:
      - {position: hist.cuban-revolution.revolution-from-above, in: {author: Samuel Farber, title: The Origins of the Cuban Revolution Reconsidered, year: 2006}}

  # ---- The Andes and the Southern Cone
  - id: thinker.guzman
    name: Abimael Guzmán
    born: 1934
    died: 2021
    region: Peru
    traditions: [marxism.mlm]
    summary: >-
      Philosophy professor at Ayacucho who, as Chairman Gonzalo, led the Communist Party of Peru (Shining Path)
      into armed struggle in 1980 and proclaimed Marxism-Leninism-Maoism as a third stage of Marxism. Peru's Truth
      and Reconciliation Commission estimated some 69,000 deaths in the war and attributed about half to the
      party, including massacres of peasants and killings of rival leftists. He was captured in 1992 and died
      in prison.
    argues:
      - {position: change.means.armed-struggle, in: {author: Abimael Guzmán, title: Interview with Chairman Gonzalo, year: 1988, note: "interview in El Diario, Lima"}}
      - {position: state.relation.smash-and-replace, in: {author: Abimael Guzmán, title: Interview with Chairman Gonzalo, year: 1988, note: "interview in El Diario, Lima"}}

  - id: thinker.garcia-linera
    name: Álvaro García Linera
    born: 1962
    region: Bolivia
    traditions: [marxism.mariategui]
    summary: >-
      Mathematician and Marxist sociologist who joined the Tupak Katari Guerrilla Army and was jailed from 1992
      to 1997, then vice-president of Bolivia under Evo Morales from 2006 to 2019. He theorized Bolivia as a
      society of several overlapping civilizations, the communal and the capitalist, and argued for a
      plurinational state in which indigenous majorities hold power.
    argues:
      - {position: indigenous.sovereignty.plurinational-state, in: {author: Álvaro García Linera, title: "La potencia plebeya: Acción colectiva e identidades indígenas, obreras y populares en Bolivia", year: 2008, note: "anthology edited by Pablo Stefanoni"}}

  - id: thinker.galeano
    name: Eduardo Galeano
    born: 1940
    died: 2015
    region: Uruguay
    traditions: [marxism.dependency]
    summary: >-
      Uruguayan journalist and writer, exiled under the dictatorships of Uruguay and Argentina. His history of
      five centuries of plunder traced how Latin America's silver, sugar, rubber, copper and oil built the
      wealth of Europe and the United States and left the region poor.
    argues:
      - {position: poverty.cause.drain, in: {author: Eduardo Galeano, title: "Open Veins of Latin America: Five Centuries of the Pillage of a Continent", year: 1971}}
      - {position: imperialism.nature.unequal-exchange-drain, in: {author: Eduardo Galeano, title: "Open Veins of Latin America: Five Centuries of the Pillage of a Continent", year: 1971}}

  - id: thinker.allende
    name: Salvador Allende
    born: 1908
    died: 1973
    region: Chile
    traditions: [socdem.democratic-socialism]
    summary: >-
      Physician, founder of the Socialist Party of Chile, and president from 1970 at the head of the Popular Unity
      coalition. His government nationalized copper, banks and large firms and extended land reform within the
      constitution. He died in La Moneda palace during the military coup of 11 September 1973.
    argues:
      - {position: elections.role.main-road, in: {author: Salvador Allende, title: First Message to Congress, year: 1971}}
      - {position: state.relation.capture-and-use, in: {author: Salvador Allende, title: First Message to Congress, year: 1971}}
      - {position: hist.chile-1973.peaceful-road-destroyed, in: {author: Salvador Allende, title: Last words to the nation, year: 1973, note: "radio address from La Moneda, 11 September 1973"}}

  - id: thinker.pascal-allende
    name: Andrés Pascal Allende
    born: 1943
    region: Chile
    traditions: [marxism.guevarism]
    summary: >-
      Founding member of the Revolutionary Left Movement (MIR) and its secretary general from 1974, after Miguel
      Enríquez was killed, until 1985. The MIR argued that the old state and army would destroy Popular Unity
      unless the workers built and armed their own organs of power.
    argues:
      - {position: hist.chile-1973.peaceful-road-a-trap, in: {author: Andrés Pascal Allende, title: "El MIR chileno: una experiencia revolucionaria", year: 2003}}

  - id: thinker.frei
    name: Eduardo Frei Montalva
    born: 1911
    died: 1982
    region: Chile
    traditions: [conservatism.christian-democracy]
    summary: >-
      Founder of the Chilean Christian Democratic Party and president from 1964 to 1970, who promised a
      "revolution in liberty": land reform, unionization of farm workers and part-nationalization of copper. In
      opposition to Allende, he defended the 1973 coup as the only escape from a totalitarian takeover; he later
      opposed the military government and died in 1982.
    argues:
      - {position: hist.chile-1973.saved-from-communism, in: {author: Eduardo Frei Montalva, title: Letter to Mariano Rumor, year: 1973, note: "letter of 8 November 1973 to the president of the World Christian Democratic Union"}}

  - id: thinker.letelier
    name: Orlando Letelier
    born: 1932
    died: 1976
    region: Chile / United States
    traditions: [socdem.democratic-socialism]
    summary: >-
      Economist and Allende's ambassador to Washington and minister of defense, imprisoned after the coup and
      exiled in 1974. He argued that the Chicago-trained economists' program of the military government required
      terror to impose, and served Chilean and foreign capital. He was killed by a car bomb in Washington planted
      by agents of the Chilean secret police in September 1976.
    argues:
      - {position: hist.chile-1973.first-neoliberal-laboratory, in: {author: Orlando Letelier, title: "The Chicago Boys in Chile: Economic Freedom's Awful Toll", year: 1976, note: "in The Nation"}}

  - id: thinker.harnecker
    name: Marta Harnecker
    born: 1937
    died: 2019
    region: Chile / Cuba / Venezuela
    traditions: [marxism.structural]
    summary: >-
      Chilean student of Louis Althusser whose textbook of historical materialism trained a generation of Latin
      American militants. After 1973 she worked in Cuba and later advised the Venezuelan government, arguing that
      socialism is built through protagonism: people changing themselves by running their communities and
      workplaces.
    argues:
      - {position: hist.venezuela.communes-from-below, in: {author: Marta Harnecker, title: "A World to Build: New Paths toward Twenty-First Century Socialism", year: 2015}}

  - id: thinker.zibechi
    name: Raúl Zibechi
    born: 1952
    region: Uruguay
    traditions: [marxism.autonomism]
    summary: >-
      Uruguayan journalist and writer on social movements. He reads the Argentine revolt of December 2001 as the
      work of "societies in motion" (unemployed workers' movements, neighborhood assemblies, occupied factories)
      that organized outside parties and the state.
    argues:
      - {position: hist.argentina-2001.popular-power, in: {author: Raúl Zibechi, title: "Genealogía de la revuelta: Argentina, la sociedad en movimiento", year: 2003}}

  - id: thinker.basualdo
    name: Eduardo Basualdo
    region: Argentina
    traditions: [nationalism.peronism]
    summary: >-
      Economist at FLACSO Argentina. He argues that from the 1976 dictatorship until 2001 Argentina's dominant
      groups accumulated through "financial valorization": borrowing abroad, lending at home at high interest
      rates and sending the proceeds out of the country, while the state took on their debts.
    argues:
      - {position: hist.argentina-2001.financial-plunder, in: {author: Eduardo Basualdo, title: "Estudios de historia económica argentina: desde mediados del siglo XX a la actualidad", year: 2006}}

  # ---- Venezuela
  - id: thinker.chavez
    name: Hugo Chávez
    born: 1954
    died: 2013
    region: Venezuela
    traditions: [nationalism.bolivarianism]
    summary: >-
      Army officer who led a failed coup in 1992 and was elected president of Venezuela in 1998, serving until
      his death. His governments rewrote the constitution, took control of the state oil company, funded social
      missions from oil revenue and legislated communal councils and communes; in 2005 he declared the goal of a
      socialism of the twenty-first century.
    argues:
      - {position: world.order.multipolar-sovereignty, in: {author: Hugo Chávez, title: Address to the United Nations General Assembly, year: 2006, note: "20 September 2006"}}
      - {position: hist.venezuela.communes-from-below, in: {author: Hugo Chávez, title: Golpe de timón, year: 2012, note: "address to the council of ministers, 20 October 2012"}}

  - id: thinker.curcio
    name: Pasqualina Curcio
    region: Venezuela
    traditions: [nationalism.bolivarianism]
    summary: >-
      Economist at the Simón Bolívar University in Caracas. She argues that the shortages and inflation in
      Venezuela after 2013 were induced by import and distribution monopolies and by attacks on the exchange rate,
      an economic war rather than the result of socialist policy.
    argues:
      - {position: hist.venezuela.economic-war, in: {author: Pasqualina Curcio, title: "La mano visible del mercado: guerra económica en Venezuela", year: 2016}}

  - id: thinker.naim
    name: Moisés Naím
    born: 1952
    region: Venezuela / United States
    traditions: [liberalism.technocratic]
    summary: >-
      Venezuelan minister of trade and industry in 1989 and 1990, during the IMF-backed program of Carlos Andrés
      Pérez, then an executive director at the World Bank and editor of Foreign Policy. He argues that Venezuela's
      collapse came from price controls, expropriations, the destruction of the oil company and the capture of
      every institution by one party.
    argues:
      - {position: hist.venezuela.socialism-wrecked-it, in: {author: Moisés Naím and Francisco Toro, title: "Venezuela's Suicide: Lessons from a Failed State", year: 2018, note: "in Foreign Affairs"}}

  - id: thinker.coronil
    name: Fernando Coronil
    born: 1944
    died: 2011
    region: Venezuela / United States
    traditions: [nationalism.decolonial]
    summary: >-
      Venezuelan anthropologist who studied how oil turned the Venezuelan state into a "magical" distributor of
      rent, a nation with two bodies, the people and the subsoil, in which political power came from control of
      the oil income rather than from domestic production.
    argues:
      - {position: hist.venezuela.petrostate, in: {author: Fernando Coronil, title: "The Magical State: Nature, Money, and Modernity in Venezuela", year: 1997}}

  - id: thinker.lander
    name: Edgardo Lander
    born: 1942
    region: Venezuela
    traditions: [nationalism.decolonial]
    summary: >-
      Venezuelan sociologist who edited the founding collection on the coloniality of knowledge and supported the
      early Bolivarian process. He argues that the Chávez and Maduro governments deepened the oil-rentier model
      instead of breaking with it, so the state grew larger but weaker and more corrupt.
    argues:
      - {position: hist.venezuela.petrostate, in: {author: Edgardo Lander, title: "The Implosion of Venezuela's Rentier State", year: 2016, note: "Transnational Institute, New Politics Papers"}}

  # ---- Mexico and the Zapatistas
  - id: thinker.comandanta-esther
    name: Comandanta Esther
    region: Mexico (Chiapas)
    traditions: [zapatismo]
    summary: >-
      Tzeltal member of the Zapatista Army's Clandestine Revolutionary Indigenous Committee. On 28 March 2001 she
      addressed the Mexican Congress for the EZLN, speaking as an indigenous woman, to demand that the San Andrés
      accords on indigenous rights and culture be written into the constitution.
    argues:
      - {position: indigenous.sovereignty.within-state-rights, in: {author: Comandanta Esther, title: Speech to the Congress of the Union, year: 2001, note: "28 March 2001"}}
      - {position: hist.zapatistas.indigenous-land-and-dignity, in: {author: Comandanta Esther, title: Speech to the Congress of the Union, year: 2001, note: "28 March 2001"}}

  - id: thinker.boron
    name: Atilio Borón
    born: 1943
    region: Argentina
    traditions: [marxism.leninism]
    summary: >-
      Argentine political scientist and former executive secretary of CLACSO. Against Holloway he argued that the
      state is the organizing center of bourgeois domination, and that a movement which refuses to fight for
      state power leaves capital's rule intact.
    argues:
      - {position: hist.zapatistas.dead-end-without-power, in: {author: Atilio A. Borón, title: "La selva y la polis: interrogantes en torno a la teoría política del zapatismo", year: 2001, note: "in Chiapas, no. 12"}}

  # ---- Liberation theology and pedagogy
  - id: thinker.freire
    name: Paulo Freire
    born: 1921
    died: 1997
    region: Brazil
    traditions: [religious.liberation-theology]
    summary: >-
      Brazilian educator who ran adult literacy campaigns in the Northeast, was jailed and exiled after the 1964
      coup, and later served as education secretary of São Paulo. He argued that the oppressed learn to read the
      word by reading their world, through dialogue that leads to action against oppression rather than through
      the "banking" deposit of knowledge.
    argues:
      - {position: education.purpose.conscientization, in: {author: Paulo Freire, title: Pedagogy of the Oppressed, year: 1968, note: "written 1968; English translation 1970"}}
      - {position: knowledge.basis.practice, in: {author: Paulo Freire, title: Pedagogy of the Oppressed, year: 1968}}

  - id: thinker.boff
    name: Leonardo Boff
    born: 1938
    region: Brazil
    traditions: [religious.liberation-theology]
    summary: >-
      Brazilian Franciscan theologian of the base ecclesial communities. His critique of the hierarchical church
      led the Congregation for the Doctrine of the Faith to impose a year of silence on him in 1985; he left the
      priesthood in 1992 and later joined liberation theology to ecology.
    argues:
      - {position: religion.public.prophetic-church, in: {author: Leonardo Boff, title: "Church: Charism and Power", year: 1981}}

  - id: thinker.romero
    name: Óscar Romero
    born: 1917
    died: 1980
    region: El Salvador
    traditions: [religious.liberation-theology]
    summary: >-
      Archbishop of San Salvador from 1977 who denounced the army's killings of peasants and priests and, the day
      before his death, called on soldiers to disobey orders to kill. He was shot while saying Mass on 24 March
      1980; the UN Truth Commission found the killing was ordered by Roberto D'Aubuisson. He was canonized in 2018.
    argues:
      - {position: religion.public.prophetic-church, in: {author: Óscar Romero, title: The Political Dimension of the Faith from the Perspective of the Option for the Poor, year: 1980, note: "address at the University of Louvain, 2 February 1980"}}

  # ---- Decolonial thought
  - id: thinker.dussel
    name: Enrique Dussel
    born: 1934
    died: 2023
    region: Argentina / Mexico
    traditions: [nationalism.decolonial]
    summary: >-
      Argentine philosopher, exiled to Mexico in 1975 after a bomb attack on his home, founder of the philosophy
      of liberation. He argued that modernity began in 1492 with the conquest of the Americas, so that Europe's
      self-image as the source of reason rests on the concealment of the colonized other.
    argues:
      - {position: tradition.modernity.decolonial, in: {author: Enrique Dussel, title: "1492: El encubrimiento del otro", year: 1992, note: "English translation The Invention of the Americas, 1995"}}

  - id: thinker.quijano
    name: Aníbal Quijano
    born: 1930
    died: 2018
    region: Peru
    traditions: [nationalism.decolonial]
    summary: >-
      Peruvian sociologist who began in dependency theory. He argued that the conquest of America created "race"
      as a classification of humanity and joined it to the division of labor, so that wage labor became the lot of
      Europeans and servitude and slavery that of the colonized, a coloniality of power that outlived colonial
      rule.
    argues:
      - {position: imperialism.nature.coloniality, in: {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000, note: "in Nepantla"}}
      - {position: class.concept.world-and-race, in: {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000, note: "in Nepantla"}}
      - {position: hist.decolonization.coloniality-remains, in: {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000, note: "in Nepantla"}}

  - id: thinker.mignolo
    name: Walter Mignolo
    born: 1941
    region: Argentina / United States
    traditions: [nationalism.decolonial]
    summary: >-
      Argentine semiotician at Duke University. He argues that modernity and coloniality are two sides of one
      matrix of power and that the answer is not alternative modernities but "delinking" from Western categories
      of knowledge.
    argues:
      - {position: tradition.modernity.decolonial, in: {author: Walter D. Mignolo, title: "The Darker Side of Western Modernity: Global Futures, Decolonial Options", year: 2011}}

  - id: thinker.lugones
    name: María Lugones
    born: 1944
    died: 2020
    region: Argentina / United States
    traditions: [feminism.decolonial]
    summary: >-
      Argentine philosopher and popular educator. She argued that colonization imposed a modern gender system on
      the colonized, in which only Europeans were fully men and women, and that decolonial feminism must resist
      the coloniality of gender rather than add women to existing categories.
    argues:
      - {position: gender.basis.colonial-imposition, in: {author: María Lugones, title: "Heterosexualism and the Colonial/Modern Gender System", year: 2007, note: "in Hypatia"}}
      - {position: feminism.subordination.colonial-and-imperial, in: {author: María Lugones, title: Toward a Decolonial Feminism, year: 2010, note: "in Hypatia"}}

  - id: thinker.domitila
    name: Domitila Barrios de Chungara
    born: 1937
    died: 2012
    region: Bolivia
    traditions: [feminism.decolonial]
    summary: >-
      Leader of the Housewives' Committee of the Siglo XX tin mine, jailed and tortured under the military
      governments. At the UN International Women's Year Tribunal in Mexico in 1975 she rejected a feminism that
      set women against men, holding that miners' wives fight beside their husbands against the company and
      imperialism. She calculated how much the companies saved from the housewife's unpaid work.
    argues:
      - {position: feminism.subordination.social-reproduction, in: {author: Domitila Barrios de Chungara and Moema Viezzer, title: "Let Me Speak! Testimony of Domitila, a Woman of the Bolivian Mines", year: 1977, note: "Spanish original Si me permiten hablar, 1977; English 1978"}}

  # ---- The Caribbean and the Black Atlantic
  - id: thinker.james
    name: C. L. R. James
    born: 1901
    died: 1989
    region: Trinidad / Britain / United States
    traditions: [marxism.black-radical, marxism.third-camp]
    summary: >-
      Trinidadian historian, cricket writer and Marxist who organized for Pan-African independence in London in
      the 1930s and later led the Johnson-Forest tendency in the United States, which held the Soviet Union to be
      state capitalist. He argued that the self-organized masses, not parties, make revolutions, and that every
      cook can govern.
    argues:
      - {position: hist.haitian-revolution.universal-emancipation, in: {author: C. L. R. James, title: "The Black Jacobins: Toussaint L'Ouverture and the San Domingo Revolution", year: 1938}}
      - {position: democracy.form.direct, in: {author: C. L. R. James, title: Every Cook Can Govern, year: 1956}}

  - id: thinker.eric-williams
    name: Eric Williams
    born: 1911
    died: 1981
    region: Trinidad and Tobago
    traditions: [marxism.black-radical]
    summary: >-
      Trinidadian historian and founder of the People's National Movement, prime minister of Trinidad and Tobago
      from independence in 1962 until his death. His Oxford thesis argued that slavery financed British
      industrialization, that racism was a consequence of slavery rather than its cause, and that abolition came
      when slavery ceased to pay.
    argues:
      - {position: race.nature.racial-capitalism, in: {author: Eric Williams, title: Capitalism and Slavery, year: 1944}}

  - id: thinker.cesaire
    name: Aimé Césaire
    born: 1913
    died: 2008
    region: Martinique
    traditions: [marxism.black-radical]
    summary: >-
      Martinican poet, co-founder of the Négritude movement and mayor of Fort-de-France for over fifty years. He
      argued that colonization decivilizes the colonizer and turns the colonized into things, and that Nazism was
      colonialism applied to Europeans. He left the French Communist Party in 1956, refusing to subordinate the
      colonial question to it.
    argues:
      - {position: fascism.nature.colonialism-come-home, in: {author: Aimé Césaire, title: Discourse on Colonialism, year: 1950}}
      - {position: imperialism.nature.coloniality, in: {author: Aimé Césaire, title: Discourse on Colonialism, year: 1950}}

  - id: thinker.casimir
    name: Jean Casimir
    born: 1937
    region: Haiti
    traditions: [nationalism.decolonial]
    summary: >-
      Haitian sociologist and diplomat. He argues that Haiti's cultivators built a "counter-plantation" system of
      small family holdings and the lakou against both the colonial planters and the new state's generals who
      tried to keep them on the plantations.
    argues:
      - {position: hist.haitian-revolution.cultivators-revolt, in: {author: Jean Casimir, title: "The Haitians: A Decolonial History", year: 2020, note: "translated by Laurent Dubois"}}

  - id: thinker.beckles
    name: Hilary Beckles
    born: 1955
    region: Barbados
    traditions: [nationalism.pan-africanism]
    summary: >-
      Barbadian historian, vice-chancellor of the University of the West Indies and chair of the CARICOM
      Reparations Commission. He argues that Britain was enriched by slavery and the genocide of the native
      Caribbean peoples and owes the region reparations under the principle of unjust enrichment.
    argues:
