thinkers:
  # ---- China: the revolution, the reform and the present
  - id: thinker.liu-shaoqi
    name: Liu Shaoqi
    born: 1898
    died: 1969
    region: China
    traditions: [marxism.maoism]
    summary: >-
      Organizer of the Chinese labor movement in the 1920s, leading theorist of party building, and head of
      state of the People's Republic from 1959. Attacked in the Cultural Revolution as the leading "capitalist
      roader", he was expelled from the party in 1968 and died in detention in 1969; the party rehabilitated
      him in 1980.
    argues:
      - {position: org.form.vanguard-party, in: {author: Liu Shaoqi, title: How to Be a Good Communist, year: 1939}}
      - {position: hist.chinese-revolution.new-democratic, in: {author: Liu Shaoqi, title: On the Party, year: 1945, note: "report on the revision of the party constitution to the Seventh Congress"}}

  - id: thinker.lin-biao
    name: Lin Biao
    born: 1907
    died: 1971
    region: China
    traditions: [marxism.maoism]
    summary: >-
      Commander of the People's Liberation Army's campaigns in Manchuria in the civil war, defense minister from
      1959 and compiler of the Quotations from Chairman Mao. His 1965 essay set out the world as countryside
      encircling the cities. Named Mao's successor in 1969, he died in a plane crash in Mongolia in 1971 after
      the party accused him of plotting a coup.
    argues:
      - {position: contradiction.primary.imperialism-vs-oppressed, in: {author: Lin Biao, title: "Long Live the Victory of People's War!", year: 1965}}
      - {position: hist.chinese-revolution.peoples-war-model, in: {author: Lin Biao, title: "Long Live the Victory of People's War!", year: 1965}}

  - id: thinker.zhang-chunqiao
    name: Zhang Chunqiao
    born: 1917
    died: 2005
    region: China
    traditions: [marxism.maoism]
    summary: >-
      Shanghai party leader and theorist of the Cultural Revolution left, one of the four leaders arrested in
      October 1976 and later called the Gang of Four. He argued that wage grades and commodity exchange kept
      reproducing "bourgeois right" and a new bourgeoisie inside the party. Sentenced to death in 1981, commuted
      to life imprisonment; he refused to recant.
    argues:
      - {position: hist.china-mao.continuing-revolution, in: {author: Zhang Chunqiao, title: On Exercising All-Round Dictatorship over the Bourgeoisie, year: 1975}}

  - id: thinker.deng-xiaoping
    name: Deng Xiaoping
    born: 1904
    died: 1997
    region: China
    traditions: [marxism.scc]
    summary: >-
      Party general secretary in the 1950s, purged twice in the Cultural Revolution, and from 1978 the leading
      figure of the reform era. He held that China is in the primary stage of socialism, whose task is to
      develop the productive forces, and that markets and foreign capital are tools a socialist state can use.
      In 1989 he backed martial law and the army's clearing of Tiananmen Square on 4 June.
    argues:
      - {position: contradiction.primary.three-worlds, in: {author: Deng Xiaoping, title: Speech at the Special Session of the U.N. General Assembly, year: 1974}}
      - {position: hist.china-mao.achievements-primary, in: {author: Deng Xiaoping, title: Answers to the Italian Journalist Oriana Fallaci, year: 1980}}
      - {position: hist.china-reform.primary-stage, in: {author: Deng Xiaoping, title: Building Socialism with Chinese Characteristics, year: 1984}}
      - {position: markets.nature.socialist-markets, in: {author: Deng Xiaoping, title: "Excerpts from Talks Given in Wuchang, Shenzhen, Zhuhai and Shanghai", year: 1992}}
      - {position: hist.cold-war.two-superpowers, in: {author: Deng Xiaoping, title: Speech at the Special Session of the United Nations General Assembly, year: 1974, note: "10 April 1974: the two superpowers contend for world hegemony"}}
      - {position: intervention.humanitarian.sovereignty-first, in: {author: Deng Xiaoping, title: Speech at the Special Session of the United Nations General Assembly, year: 1974, note: "relations among states on the five principles, including non-interference in internal affairs"}}

  - id: thinker.chen-yun
    name: Chen Yun
    born: 1905
    died: 1995
    region: China
    traditions: [marxism.scc]
    summary: >-
      The party's senior economic planner from the 1940s to the 1980s, who ran the recovery of the early 1950s
      and the retrenchment after the Great Leap Forward. In the reform era he accepted market regulation as a
      supplement but held that the plan must stay primary, the cage in which the bird of the market flies.
    argues:
      - {position: allocation.mechanism.mixed-steered, in: {author: Chen Yun, title: Problems Concerning Planning and the Market, year: 1979, note: "outline of 8 March 1979, in Selected Works, volume 3"}}

  - id: thinker.xi-jinping
    name: Xi Jinping
    born: 1953
    region: China
    traditions: [marxism.scc]
    summary: >-
      General secretary of the Communist Party of China since 2012 and president since 2013. His Thought on
      Socialism with Chinese Characteristics for a New Era was written into the party constitution in 2017; it
      names the principal contradiction as that between the people's needs for a better life and unbalanced
      development, and it launched the Belt and Road Initiative.
    argues:
      - {position: hist.china-present.new-era-socialism, in: {author: Xi Jinping, title: "Secure a Decisive Victory in Building a Moderately Prosperous Society in All Respects and Strive for the Great Success of Socialism with Chinese Characteristics for a New Era", year: 2017, note: "report to the Nineteenth National Congress"}}
      - {position: china.role.partner-that-builds, in: {author: Xi Jinping, title: "Work Together to Build the Silk Road Economic Belt and the 21st Century Maritime Silk Road", year: 2017, note: "opening speech to the Belt and Road Forum, 14 May 2017"}}

  - id: thinker.peng-shuzhi
    name: Peng Shuzhi
    born: 1895
    died: 1983
    region: China / France
    traditions: [marxism.trotskyism]
    summary: >-
      Founding member of the Communist Party of China and a leader of its work in Shanghai in 1925 to 1927, who
      joined the Left Opposition and became the leading Chinese Trotskyist. He held that the Comintern's bloc
      with the Kuomintang delivered the Shanghai workers to Chiang Kai-shek in 1927, and that the state Mao built
      was ruled by a bureaucracy rather than by workers' councils.
    argues:
      - {position: hist.chinese-revolution.betrayed-in-1927, in: {author: Peng Shuzhi, title: Leon Trotsky on China, year: 1976, note: "Peng's introduction to the collection edited by Les Evans and Russell Block"}}
      - {position: hist.china-mao.bureaucratic-squeeze, in: {author: Peng Shuzhi, title: The Chinese Communist Party in Power, year: 1980}}

  - id: thinker.wang-hui
    name: Wang Hui
    born: 1959
    region: China
    traditions: [marxism.western]
    summary: >-
      Historian of Chinese thought at Tsinghua University and former editor of the journal Dushu, the best-known
      figure of what was called the Chinese New Left. He argues that the market reform of the 1990s was built by
      the state, that the protests of 1989 were in part a social movement against it, and that the socialism of
      the twentieth century was an "anti-modern modernity" that tried to go beyond capitalist modernization.
    argues:
      - {position: tradition.modernity.transcend-both, in: {author: Wang Hui, title: Contemporary Chinese Thought and the Question of Modernity, year: 1998, note: "Chinese original in Tianya, 1997; English in Social Text 55"}}

  - id: thinker.wen-tiejun
    name: Wen Tiejun
    born: 1951
    region: China
    traditions: [marxism.third-worldism]
    summary: >-
      Agrarian economist, sent to the countryside in the Cultural Revolution, who named the "three rural issues"
      (peasants, villages, agriculture) and leads China's new rural reconstruction movement. He argues that
      China industrialized by taking surplus from the countryside, and that the collective village and its land
      have repeatedly absorbed the costs of the country's economic crises.
    argues:
      - {position: agrarian.question.communal-tenure, in: {author: Wen Tiejun, title: "Ten Crises: The Political Economy of China's Development (1949–2020)", year: 2021}}
      - {position: hist.china-reform.developmental-state, in: {author: Wen Tiejun, title: "Ten Crises: The Political Economy of China's Development (1949–2020)", year: 2021}}

  - id: thinker.minqi-li
    name: Minqi Li
    region: China / United States
    traditions: [marxism.world-systems]
    summary: >-
      Economist at the University of Utah who was a student activist in 1989 and a political prisoner in China
      from 1990 to 1992. Writing as a Marxist in the world-systems tradition, he argues that the reform restored
      capitalism, that China's cheap labor fed the profits of the core, and that China's rise sharpens the
      contradictions of the capitalist world economy rather than resolving them.
    argues:
      - {position: hist.china-reform.capitalist-restoration, in: {author: Minqi Li, title: The Rise of China and the Demise of the Capitalist World-Economy, year: 2008}}

  - id: thinker.sun-yat-sen
    name: Sun Yat-sen
    born: 1866
    died: 1925
    region: China
    traditions: [nationalism.three-principles]
    summary: >-
      Founder of the Revolutionary Alliance and the Kuomintang and first provisional president of the Republic
      of China in 1912. His Three Principles of the People were nationalism, "democracy" (minquan, the people's power) and the people's
      livelihood, the last including equalization of land rights through taxing land values and land to the
      tiller. In 1923 he allied the Kuomintang with the Soviet Union and the Chinese Communists.
    argues:
      - {position: liberty.concept.national-liberation, in: {author: Sun Yat-sen, title: Three Principles of the People, year: 1924}}
      - {position: property.land.georgist-rent, in: {author: Sun Yat-sen, title: Three Principles of the People, year: 1924, note: "lectures on the people's livelihood"}}
      - {position: agrarian.question.land-to-the-tiller, in: {author: Sun Yat-sen, title: Three Principles of the People, year: 1924, note: "lectures on the people's livelihood"}}

  - id: thinker.chiang-kai-shek
    name: Chiang Kai-shek
    born: 1887
    died: 1975
    region: China / Taiwan
    traditions: [nationalism.three-principles]
    summary: >-
      Commander of the Northern Expedition and leader of the Kuomintang and the Republic of China from 1928. In
      April 1927 his forces massacred Communists and union members in Shanghai. After defeat in the civil war he
      ruled Taiwan from 1949 under martial law, which lasted until 1987.
    argues:
      - {position: nation.question.ethnic, in: {author: Chiang Kai-shek, title: "China's Destiny", year: 1943}}
      - {position: hist.chinese-revolution.communist-conquest, in: {author: Chiang Kai-shek, title: "Soviet Russia in China: A Summing-Up at Seventy", year: 1957}}

  - id: thinker.mou-zongsan
    name: Mou Zongsan
    born: 1909
    died: 1995
    region: China / Hong Kong / Taiwan
    traditions: [religious.confucian]
    summary: >-
      Philosopher of New Confucianism who left the mainland in 1949 and taught in Taiwan and Hong Kong. With Tang
      Junyi, Xu Fuguan and Carsun Chang he signed the 1958 manifesto holding that Chinese culture is a living
      tradition of moral learning from which science and constitutional government can be developed from within.
    argues:
      - {position: tradition.modernity.selective-modernization, in: {author: Mou Zongsan, title: A Manifesto on Behalf of Chinese Culture Respectfully Announced to the People of the World, year: 1958, note: "co-signed with Tang Junyi, Xu Fuguan and Carsun Chang"}}

  - id: thinker.bai
    name: Tongdong Bai
    region: China
    traditions: [religious.political-meritocracy]
    summary: >-
      Professor of philosophy at Fudan University. He argues for a Confucian hybrid constitution in which an elected
      chamber sits beside one chosen for knowledge and moral ability, since one person one vote does not secure
      good government or the protection of liberties.
    argues:
      - {position: democracy.form.political-meritocracy, in: {author: Tongdong Bai, title: "Against Political Equality: The Confucian Case", year: 2019}}

  # ---- Korea and the developmental states
  - id: thinker.kim-jong-il
    name: Kim Jong-il
    born: 1941
    died: 2011
    region: Korea (DPRK)
    traditions: [marxism.juche]
    summary: >-
      Son of Kim Il-sung and leader of the Democratic People's Republic of Korea from 1994 to 2011. His 1982
      treatise codified the Juche idea, that the popular masses are masters of the revolution and that a nation
      must be independent in politics, self-sufficient in the economy and self-reliant in defense; under him the
      state adopted songun, military-first politics. The famine of the mid-1990s killed hundreds of thousands.
    argues:
      - {position: hist.dprk.juche-socialism, in: {author: Kim Jong-il, title: On the Juche Idea, year: 1982}}

  - id: thinker.hwang-jang-yop
    name: Hwang Jang-yop
    born: 1923
    died: 2010
    region: Korea
    traditions: [marxism.juche]
    summary: >-
      President of Kim Il-sung University and a secretary of the Workers' Party, the chief theorist of Juche.
      He defected through the South Korean embassy in Beijing in 1997, the highest-ranking official ever to leave
      the North, and afterwards described the state as a feudal family dictatorship that had betrayed the people.
    argues:
      - {position: hist.dprk.hereditary-tyranny, in: {author: Hwang Jang-yop, title: I Saw the Truth of History, year: 1999, note: "memoir, Korean original Na-neun yeoksa-ui jilli-reul boatda"}}

  - id: thinker.park-chung-hee
    name: Park Chung-hee
    born: 1917
    died: 1979
    region: Korea (ROK)
    traditions: [nationalism.developmental-state]
    summary: >-
      Army officer who took power in South Korea in the coup of May 1961 and ruled until he was assassinated by
      his intelligence chief in 1979. His governments directed credit to chaebol conglomerates under export
      targets and five-year plans; the Yushin constitution of 1972 gave him indefinite rule, and opponents and
      strikers were jailed and tortured.
    argues:
      - {position: development.path.developmental-state, in: {author: Park Chung-hee, title: "Our Nation's Path: Ideology of Social Reconstruction", year: 1962}}
      - {position: state.nature.developmental, in: {author: Park Chung-hee, title: "The Country, the Revolution and I", year: 1963}}

  - id: thinker.lee-kuan-yew
    name: Lee Kuan Yew
    born: 1923
    died: 2015
    region: Singapore
    traditions: [nationalism.developmental-state]
    summary: >-
      First prime minister of Singapore, from 1959 to 1990, and leader of the People's Action Party. His
      government built industry on foreign investment, public housing and a compulsory savings fund, and held
      opponents without trial under the Internal Security Act, beginning with the arrests of Operation Coldstore
      in 1963. He argued that Asian societies place the family and order above individual rights.
    argues:
      - {position: poverty.cause.culture, in: {author: Fareed Zakaria and Lee Kuan Yew, title: "Culture Is Destiny: A Conversation with Lee Kuan Yew", year: 1994, note: "interview in Foreign Affairs"}}
      - {position: development.path.developmental-state, in: {author: Lee Kuan Yew, title: "From Third World to First: The Singapore Story, 1965–2000", year: 2000}}

  - id: thinker.mahathir
    name: Mahathir Mohamad
    born: 1925
    region: Malaysia
    traditions: [nationalism.developmental-state, nationalism.ethnic]
    summary: >-
      Prime minister of Malaysia from 1981 to 2003 and from 2018 to 2020. His book of 1970, banned until he took
      office, argued that the Malays are the definitive people of the country and need state preferences to
      overcome the Chinese hold on commerce; in office he pursued heavy industry and the Look East policy, and in
      1998 imposed capital controls against the IMF's advice.
    argues:
      - {position: nation.question.ethnic, in: {author: Mahathir Mohamad, title: The Malay Dilemma, year: 1970}}
      - {position: racism.remedy.targeted-redress, in: {author: Mahathir Mohamad, title: The Malay Dilemma, year: 1970}}

  # ---- Southeast Asia
  - id: thinker.tan-malaka
    name: Tan Malaka
    born: 1897
    died: 1949
    region: Indonesia
    traditions: [marxism.leninism]
    summary: >-
      Minangkabau teacher, leader of the Indonesian Communist Party and Comintern agent for Southeast Asia. At the
      Comintern's Fourth Congress in 1922 he argued that communists should work with the pan-Islamic movement
      against imperialism, and in 1925 he was the first to set out a program for an Indonesian republic. He was
      executed by an Indonesian army unit in 1949.
    argues:
      - {position: alliances.policy.national-front, in: {author: Tan Malaka, title: Communism and Pan-Islamism, year: 1922, note: "speech to the Fourth Congress of the Communist International"}}
      - {position: liberty.concept.national-liberation, in: {author: Tan Malaka, title: "Naar de 'Republiek Indonesia'", year: 1925}}

  - id: thinker.sukarno
    name: Sukarno
    born: 1901
    died: 1970
    region: Indonesia
    traditions: [nationalism.civic]
    summary: >-
      Leader of the Indonesian independence movement and first president of Indonesia, from 1945 to 1967. He
      sought to unite nationalists, Muslims and Marxists in one front, set out the five principles of Pancasila
      as the basis of the state, and hosted the Bandung conference of Asian and African states in 1955. After
      1965 the army sidelined him, and he died under house arrest.
    argues:
      - {position: alliances.policy.national-front, in: {author: Sukarno, title: "Nationalism, Islam and Marxism", year: 1926}}
      - {position: nation.question.civic, in: {author: Sukarno, title: The Birth of Pancasila, year: 1945, note: "speech of 1 June 1945"}}
      - {position: hist.cold-war.non-alignment, in: {author: Sukarno, title: Let a New Asia and a New Africa Be Born, year: 1955, note: "opening address to the Asian-African Conference at Bandung"}}

  - id: thinker.suharto
    name: Suharto
    born: 1921
    died: 2008
    region: Indonesia
    traditions: [nationalism.developmental-state]
    summary: >-
      Army general who led the response to the killing of six generals on 1 October 1965 and the destruction of
      the Indonesian Communist Party; between 500,000 and a million people were killed in 1965 and 1966 and
      hundreds of thousands imprisoned. He ruled as president from 1967 to 1998, opened the economy to foreign
      capital, and ordered the invasion of East Timor in 1975.
    argues:
      - {position: hist.indonesia-1965.nation-saved, in: {author: Suharto, title: "Soeharto: Pikiran, Ucapan dan Tindakan Saya", year: 1989, note: "autobiography as told to G. Dwipayana and Ramadhan K.H."}}

  - id: thinker.ferdinand-marcos
    name: Ferdinand Marcos
    born: 1917
    died: 1989
    region: Philippines
    traditions: [nationalism.developmental-state]
    summary: >-
      President of the Philippines from 1965 to 1986, who declared martial law in 1972 and ruled by decree
      under what he called constitutional authoritarianism and the New Society. Human rights groups documented
      some 3,000 killings, tens of thousands of arrests and widespread torture under martial law; he was driven
      from power by the EDSA uprising of February 1986.
    argues:
      - {position: hist.martial-law-philippines.golden-age, in: {author: Ferdinand E. Marcos, title: Notes on the New Society of the Philippines, year: 1973, note: "written in the first year of martial law"}}

  - id: thinker.sison
    name: Jose Maria Sison
    born: 1939
    died: 2022
    region: Philippines / Netherlands
    traditions: [marxism.mlm]
    summary: >-
      Founder of the refounded Communist Party of the Philippines in 1968 and of the New People's Army in 1969.
      He analyzed the Philippines as semi-colonial and semi-feudal, ruled by comprador big bourgeois and
      landlords under US imperialism, and called for protracted people's war from the countryside. Imprisoned
      under Marcos from 1977 to 1986, he lived in exile in the Netherlands from 1987.
    argues:
      - {position: comprador.nature.broker-class, in: {author: Amado Guerrero (Jose Maria Sison), title: Philippine Society and Revolution, year: 1970}}
      - {position: change.tempo.protracted-struggle, in: {author: Amado Guerrero (Jose Maria Sison), title: Philippine Society and Revolution, year: 1970}}
      - {position: hist.martial-law-philippines.us-client, in: {author: Jose Maria Sison and Rainer Werning, title: "The Philippine Revolution: The Leader's View", year: 1989}}

  - id: thinker.giap
    name: Vo Nguyen Giap
    born: 1911
    died: 2013
    region: Vietnam
    traditions: [marxism.ml]
    summary: >-
      History teacher who became commander of the Viet Minh and the Vietnam People's Army, victor at Dien Bien
      Phu in 1954 and a leader of the war against the United States. He theorized people's war as political
      mobilization of the peasantry combined with guerrilla and regular forces.
    argues:
      - {position: change.tempo.protracted-struggle, in: {author: Vo Nguyen Giap, title: "People's War, People's Army", year: 1961}}
      - {position: hist.vietnamese-revolution.peoples-war-proved, in: {author: Vo Nguyen Giap and Van Tien Dung, title: How We Won the War, year: 1976}}

  - id: thinker.thich-nhat-hanh
    name: Thich Nhat Hanh
    born: 1926
    died: 2022
    region: Vietnam / France
    traditions: [religious.engaged-buddhism]
    summary: >-
      Vietnamese Zen monk who founded the School of Youth for Social Service and the Order of Interbeing during
      the war. He called for an end to the bombing and a ceasefire and refused both sides, and was barred from
      returning to Vietnam from 1966 to 2005. He coined the term engaged Buddhism.
    argues:
      - {position: hist.vietnamese-revolution.both-sides-war-on-peasants, in: {author: Thich Nhat Hanh, title: "Vietnam: Lotus in a Sea of Fire", year: 1967}}
      - {position: violence.political.never, in: {author: Thich Nhat Hanh, title: "Vietnam: Lotus in a Sea of Fire", year: 1967}}

  - id: thinker.buddhadasa
    name: Buddhadasa Bhikkhu
    born: 1906
    died: 1993
    region: Thailand
    traditions: [religious.engaged-buddhism]
    summary: >-
      Thai monk who founded the forest monastery of Suan Mokkh in 1932 and reread the Pali canon against
      ritualism. In talks of 1974 to 1976 he argued that nature itself is socialist, that nothing should take
      more than it needs, and that selfishness, not any one class, is the root of exploitation.
    argues:
      - {position: cs.greed.a-sin-to-fight, in: {author: Buddhadasa Bhikkhu, title: Dhammic Socialism, year: 1986, note: "talks of 1974–1976, translated and edited by Donald K. Swearer"}}

  - id: thinker.sivaraksa
    name: Sulak Sivaraksa
    born: 1933
    region: Thailand
    traditions: [religious.engaged-buddhism]
    summary: >-
      Thai social critic and founder of NGOs and the International Network of Engaged Buddhists. He argues that
      consumer capitalism and the development model sold to Thailand rest on greed, hatred and delusion, and
      calls for small-scale, self-reliant communities. He has been charged several times under Thailand's
      lèse-majesté law.
    argues:
      - {position: capitalism.nature.market-society, in: {author: Sulak Sivaraksa, title: "Seeds of Peace: A Buddhist Vision for Renewing Society", year: 1992}}

  - id: thinker.walpola-rahula
    name: Walpola Rahula
    born: 1907
    died: 1997
    region: Sri Lanka
    traditions: [religious.buddhist-nationalism]
    summary: >-
      Sinhala Buddhist monk and scholar, author of What the Buddha Taught. His book of 1946 argued that serving
      the welfare of the people and the nation is the monk's duty, and that the history of the Sinhala people and
      of Buddhism in Lanka cannot be separated; it was the charter of the political monks of the 1956 movement.
    argues:
      - {position: religion.public.faith-as-nation, in: {author: Walpola Rahula, title: The Heritage of the Bhikkhu, year: 1946, note: "Sinhala original Bhiksuvage Urumaya; English translation 1974"}}

  - id: thinker.wirathu
    name: Ashin Wirathu
    born: 1968
    region: Myanmar
    traditions: [religious.buddhist-nationalism]
    summary: >-
      Burmese monk and leader of the 969 movement and the Ma Ba Tha association, which preach that Buddhist Burma
      must be protected against Muslims. He was jailed from 2003 to 2012 for inciting anti-Muslim riots; Ma Ba Tha
      campaigned for the race and religion protection laws of 2015, and his sermons against the Rohingya preceded
      the army's expulsions of 2016 and 2017.
    argues: []

  # ---- South Asia
  - id: thinker.roy
    name: M. N. Roy
    born: 1887
    died: 1954
    region: India / Mexico
    traditions: [marxism.leninism]
    summary: >-
      Bengali revolutionary who founded the Mexican Communist Party in 1917 and the émigré Communist Party of
      India in 1920. Against Lenin at the Comintern's Second Congress he argued that the fate of the revolution in
      Europe depended on the colonies and that the colonial bourgeoisie would not lead the fight against empire.
      Expelled from the Comintern in 1929, he later founded Radical Humanism.
    argues:
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: M. N. Roy, title: Supplementary Theses on the National and Colonial Question, year: 1920}}
      - {position: comprador.nature.broker-class, in: {author: M. N. Roy, title: India in Transition, year: 1922}}

  - id: thinker.nehru
    name: Jawaharlal Nehru
    born: 1889
    died: 1964
    region: India
    traditions: [socdem.democratic-socialism]
    summary: >-
      Leader of the Indian National Congress and first prime minister of India, from 1947 to 1964. His
      governments built a secular constitution, a planned mixed economy with a public sector in heavy industry,
      and a foreign policy of non-alignment.
    argues:
      - {position: religion.public.separation, in: {author: Jawaharlal Nehru, title: The Discovery of India, year: 1946}}
      - {position: hist.cold-war.non-alignment, in: {author: Jawaharlal Nehru, title: "India's Foreign Policy: Selected Speeches, September 1946–April 1961", year: 1961}}

  - id: thinker.lohia
    name: Ram Manohar Lohia
    born: 1910
    died: 1967
    region: India
    traditions: [socdem.democratic-socialism]
    summary: >-
      Socialist leader in the independence movement and later in parliament, who held socialism equidistant from
      capitalism and Soviet communism. He argued that caste and sex are the deepest divisions in Indian society
      and called for sixty percent of leadership posts for backward castes, Dalits, Adivasis, women and religious
      minorities.
    argues:
      - {position: caste.question.reservations-and-law, in: {author: Ram Manohar Lohia, title: The Caste System, year: 1964}}

  - id: thinker.kosambi
    name: D. D. Kosambi
    born: 1907
    died: 1966
    region: India
    traditions: [marxism.leninism]
    summary: >-
      Mathematician and historian who wrote Indian history as the presentation, in chronological order, of
      successive changes in the means and relations of production. He described caste as class at a primitive
      level of production, formed as tribes were absorbed into a society of plough agriculture.
    argues:
      - {position: history.motor.class-struggle, in: {author: D. D. Kosambi, title: An Introduction to the Study of Indian History, year: 1956}}
      - {position: caste.question.class-and-caste, in: {author: D. D. Kosambi, title: An Introduction to the Study of Indian History, year: 1956}}

  - id: thinker.ranajit-guha
    name: Ranajit Guha
    born: 1923
    died: 2023
    region: India / Australia / Austria
    traditions: [marxism.gramscian]
    summary: >-
      Historian, former communist, and founder of the Subaltern Studies collective in 1982. He argued that the
      politics of peasants in colonial India formed an autonomous domain that both colonial and nationalist
      historians had written out, and that the Indian bourgeoisie won dominance without hegemony.
    argues:
      - {position: change.agent.peasants-and-oppressed-nations, in: {author: Ranajit Guha, title: Elementary Aspects of Peasant Insurgency in Colonial India, year: 1983}}

  - id: thinker.charu-majumdar
    name: Charu Majumdar
    born: 1918
    died: 1972
    region: India
    traditions: [marxism.maoism]
    summary: >-
      Communist organizer in north Bengal whose writings led to the peasant rising at Naxalbari in 1967 and the
      founding of the Communist Party of India (Marxist-Leninist) in 1969. He called for agrarian revolution by
      guerrilla war and for the "annihilation of class enemies". He died in police custody in Calcutta in 1972.
    argues:
      - {position: change.means.armed-struggle, in: {author: Charu Majumdar, title: The Eight Documents, year: 1965, note: "written 1965–1967"}}
      - {position: agrarian.question.land-to-the-tiller, in: {author: Charu Majumdar, title: The Eight Documents, year: 1965, note: "written 1965–1967"}}

  - id: thinker.kanshi-ram
    name: Kanshi Ram
    born: 1934
    died: 2006
    region: India
    traditions: [nationalism.ambedkarite]
    summary: >-
      Founder of the employees' federation BAMCEF and of the Bahujan Samaj Party in 1984. He argued that joint
      electorates after the Poona Pact of 1932 gave Dalits representatives chosen by caste Hindu parties, and that
      the bahujan majority of lower castes must win political power through its own party.
    argues:
      - {position: equality.concept.group-substantive, in: {author: Kanshi Ram, title: "The Chamcha Age: An Era of the Stooges", year: 1982}}

  - id: thinker.teltumbde
    name: Anand Teltumbde
    born: 1950
    region: India
    traditions: [nationalism.ambedkarite]
    summary: >-
      Engineer, management scholar and civil-rights writer who combines Ambedkar and Marx. He argues that caste
      is reproduced through the class structure of land and labor and that reservations helped a thin layer
      while neoliberal reform and Hindutva worsened the position of most Dalits. Arrested in 2020 in the Bhima
      Koregaon case, he was released on bail in 2022.
    argues:
      - {position: caste.question.class-and-caste, in: {author: Anand Teltumbde, title: "Republic of Caste: Thinking Equality in the Time of Neoliberal Hindutva", year: 2018}}

  - id: thinker.butalia
    name: Urvashi Butalia
    born: 1952
    region: India
    traditions: [feminism.decolonial]
    summary: >-
      Feminist publisher who co-founded Kali for Women, India's first feminist press, in 1984. Her oral history of
      Partition, drawn from some seventy interviews, centers the abduction of women, the killings of women by
      their own families, and the silence that followed.
    argues:
      - {position: hist.partition-india.the-peoples-suffering, in: {author: Urvashi Butalia, title: "The Other Side of Silence: Voices from the Partition of India", year: 1998}}

  - id: thinker.sultan-galiev
    name: Mirsaid Sultan-Galiev
    born: 1892
    died: 1940
    region: Tatarstan / Russia
    traditions: [marxism.leninism]
    summary: >-
      Tatar Bolshevik and the senior Muslim in the Soviet commissariat of nationalities. He argued that the
      colonized Muslim peoples were whole proletarian nations and that revolution in the East mattered more than
      revolution in Europe. Arrested in 1923 for "national deviation", he was shot in 1940.
    argues:
      - {position: contradiction.primary.imperialism-vs-oppressed, in: {author: Mirsaid Sultan-Galiev, title: The Social Revolution and the East, year: 1919}}
      - {position: nationalism.kinds.oppressed-oppressor, in: {author: Mirsaid Sultan-Galiev, title: The Social Revolution and the East, year: 1919}}

  - id: thinker.prashad
    name: Vijay Prashad
    born: 1967
    region: India / United States
    traditions: [marxism.third-worldism]
    summary: >-
      Indian Marxist historian and director of the Tricontinental Institute for Social Research. He tells the "Third
      World" as a political project of the colonized, from the League Against Imperialism in 1927 through Bandung and
      the call for a new international economic order, defeated in the 1980s by debt and the IMF.
    argues:
      - {position: hist.decolonization.liberation-won, in: {author: Vijay Prashad, title: "The Darker Nations: A People's History of the Third World", year: 2007}}

  - id: thinker.kumarappa
    name: J. C. Kumarappa
    born: 1892
    died: 1960
    region: India
    traditions: [nationalism.gandhian]
    summary: >-
      Chartered accountant turned Gandhian economist who organized the All India Village Industries Association
      from 1935. He argued for an "economy of permanence" built on decentralized village production for local
      needs, against large-scale industry that depends on exhausting resources and on concentrated ownership.
    argues:
      - {position: firm.ownership.small-proprietors, in: {author: J. C. Kumarappa, title: Economy of Permanence, year: 1945}}
      - {position: growth.ecology.communities-decide, in: {author: "J. C. Kumarappa", title: "Economy of Permanence", year: 1945}}
