# Thinkers of the smaller socialist and communist tendencies, and the participants in the socialist
# debates (1914, the national question, the Sino-Soviet split, Eurocommunism, Yugoslav self-management,
# Mariátegui and Haya). Added by the gapsA pass; every post-1990 work checked against a catalogue or
# publisher record.
thinkers:
  # ---- Eurocommunism
  - id: thinker.berlinguer
    name: Enrico Berlinguer
    born: 1922
    died: 1984
    region: Italy
    traditions: [marxism.eurocommunism]
    summary: General secretary of the Italian Communist Party from 1972 until his death. After the Chilean coup of 1973 he proposed a "historic compromise" between the Communist, Socialist and Catholic mass parties, and in 1977 told the Moscow anniversary meeting that political democracy, with plural parties and civil liberties, was a universal value.
    argues:
      - {position: alliances.policy.center-coalition, in: {author: Enrico Berlinguer, title: "Riflessioni sull'Italia dopo i fatti del Cile", year: 1973, note: "three articles in Rinascita: a 51 percent majority is not enough; the great popular parties must unite to block a reactionary turn as in Chile"}}
      - {position: party.system.competitive-multiparty, in: {author: Enrico Berlinguer, title: "Speech at the sixtieth anniversary of the October Revolution", year: 1977, note: "Moscow, 2 November 1977: democracy as a historically universal value, including pluralism of parties"}}

  - id: thinker.carrillo
    name: Santiago Carrillo
    born: 1915
    died: 2012
    region: Spain
    traditions: [marxism.eurocommunism]
    summary: General secretary of the Communist Party of Spain from 1960 to 1982, who led it out of clandestinity after Franco's death and into the 1977 elections. His book Eurocommunism and the State argued for a democratic road to socialism through parliament and the democratization of the state apparatus.
    argues:
      - {position: elections.role.main-road, in: {author: Santiago Carrillo, title: "Eurocomunismo y Estado", year: 1977}}
      - {position: party.system.competitive-multiparty, in: {author: Santiago Carrillo, title: "Eurocomunismo y Estado", year: 1977, note: "socialism with political pluralism, alternation and civil liberties"}}

  # ---- Council communism
  - id: thinker.gorter
    name: Herman Gorter
    born: 1864
    died: 1927
    region: Netherlands
    traditions: [marxism.council-communism]
    summary: Dutch poet and Marxist who, with Pannekoek, led the Dutch-German left against the Comintern's line. His open letter answered Lenin's "Left-Wing" Communism by defending the refusal of parliament and the old trade unions in western Europe.
    argues:
      - {position: elections.role.boycott-principle, in: {author: Herman Gorter, title: "Open Letter to Comrade Lenin", year: 1920}}
      - {position: org.form.workers-councils, in: {author: Herman Gorter, title: "Open Letter to Comrade Lenin", year: 1920, note: "factory organizations (Unionen) and councils in place of the old trade unions"}}

  - id: thinker.mattick
    name: Paul Mattick
    born: 1904
    died: 1981
    region: Germany / United States
    traditions: [marxism.council-communism]
    summary: German-born metalworker and council communist who emigrated to the United States in 1926 and edited International Council Correspondence. He wrote on crisis theory and the limits of Keynesian policy and held that the Bolshevik state had built state capitalism.
    argues:
      - {position: crisis.cause.falling-profit, in: {author: Paul Mattick, title: "Marx and Keynes: The Limits of the Mixed Economy", year: 1969}}
      - {position: hist.ussr-stalin.state-capitalism, in: {author: Paul Mattick, title: "Anti-Bolshevik Communism", year: 1978}}

  # ---- Italian communist left
  - id: thinker.damen
    name: Onorato Damen
    born: 1893
    died: 1979
    region: Italy
    traditions: [marxism.left-communism]
    summary: Communist deputy and comrade of Bordiga who was imprisoned under fascism. In 1943 he founded the Internationalist Communist Party (Battaglia Comunista), which treated the Soviet Union as state capitalist and opposed both camps in the Second World War.
    argues:
      - {position: hist.ussr-stalin.state-capitalism, in: {author: Onorato Damen, title: "The Russia We Love and Defend", year: 1943, note: "in Prometeo; the Stalinist state expresses state capitalism, the extreme phase of imperialism"}}

  # ---- Luxemburgism
  - id: thinker.frolich
    name: Paul Frölich
    born: 1884
    died: 1953
    region: Germany
    traditions: [marxism.luxemburgism]
    summary: Founding member of the Communist Party of Germany and editor of Luxemburg's collected works, expelled in 1928 as a right oppositionist, later a leader of the Socialist Workers' Party (SAP). His biography of Luxemburg set out her theory of mass action as a coherent strategy.
    argues:
      - {position: change.means.strike-and-direct-action, in: {author: Paul Frölich, title: "Rosa Luxemburg: Gedanke und Tat", year: 1939, note: "English translation: Rosa Luxemburg: Her Life and Work"}}
      - {position: reform.revolution.revolution-necessary, in: {author: Paul Frölich, title: "Rosa Luxemburg: Gedanke und Tat", year: 1939}}

  - id: thinker.paul-levi
    name: Paul Levi
    born: 1883
    died: 1930
    region: Germany
    traditions: [marxism.luxemburgism]
    summary: Luxemburg's lawyer and her successor at the head of the Communist Party of Germany, expelled in 1921 for denouncing the March Action as a putsch. In 1922 he published her manuscript on the Russian Revolution, with its call for free elections, a free press and the broadest workers' council democracy under siege.
    argues:
      - {position: siege.governance.class-democracy, in: {author: Paul Levi, title: "Einleitung zu Rosa Luxemburg, Die russische Revolution", year: 1922, note: "introduction to his first edition of Luxemburg's 1918 manuscript"}}

  # ---- Hoxhaism
  - id: thinker.amazonas
    name: João Amazonas
    born: 1912
    died: 2002
    region: Brazil
    traditions: [marxism.hoxhaism]
    summary: Leader of the Communist Party of Brazil (PCdoB) from the 1962 split with the pro-Soviet party until 2001, and an organizer of the Araguaia guerrilla. The party aligned with the Party of Labour of Albania after 1976 and held that capitalism had been restored in the Soviet Union and China.
    argues:
      - {position: hist.ussr-late.capitalism-restored-1956, in: {author: João Amazonas, title: "A volta do capitalismo na União Soviética", year: 1991, note: "Princípios no. 21; the gradual transition from socialism to capitalism that began at the 20th Congress"}}

  # ---- The national question (Austro-Marxism)
  - id: thinker.renner
    name: Karl Renner
    born: 1870
    died: 1950
    region: Austria
    traditions: [marxism.austromarxism]
    summary: Austrian Social Democrat and jurist who, with Otto Bauer, proposed national cultural autonomy for the Habsburg lands, organizing nations as associations of persons rather than territories. He later served as chancellor of Austria in 1918–20 and 1945 and as its president from 1945 to 1950.
    argues:
      - {position: nation.question.cultural-autonomy, in: {author: Karl Renner, title: "Staat und Nation", year: 1899, note: "published under the name Synopticus; the personality principle"}}

  # ---- 1914
  - id: thinker.eduard-david
    name: Eduard David
    born: 1863
    died: 1930
    region: Germany
    traditions: [socdem.revisionist]
    summary: Revisionist Social Democrat and Reichstag deputy who wrote on agriculture against Kautsky and led the SPD majority's case for voting the war credits in August 1914. He was later the first president of the Weimar National Assembly and a minister.
    argues:
      - {position: hist.wwi-1914.national-defense, in: {author: Eduard David, title: "Die Sozialdemokratie im Weltkrieg", year: 1915}}
      - {position: reform.revolution.reform-is-the-road, in: {author: Eduard David, title: "Sozialismus und Landwirtschaft", year: 1903}}

  # ---- The Sino-Soviet split
  - id: thinker.khrushchev
    name: Nikita Khrushchev
    born: 1894
    died: 1971
    region: Soviet Union
    traditions: [marxism.ml]
    summary: First secretary of the Communist Party of the Soviet Union from 1953 to 1964. At the 20th Congress in 1956 he denounced Stalin's repressions and set out peaceful coexistence and the possibility of a parliamentary transition to socialism, the line the Chinese and Albanian parties condemned as revisionism.
    argues:
      - {position: elections.role.main-road, in: {author: N. S. Khrushchev, title: "Report of the Central Committee of the CPSU to the 20th Party Congress", year: 1956, note: "section on forms of transition to socialism: winning a stable parliamentary majority"}}
      - {position: hist.cold-war.two-camps, in: {author: N. S. Khrushchev, title: "Report of the Central Committee of the CPSU to the 20th Party Congress", year: 1956, note: "the world socialist system against the imperialist camp"}}

  # ---- Yugoslav self-management
  - id: thinker.kardelj
    name: Edvard Kardelj
    born: 1910
    died: 1979
    region: Slovenia / Yugoslavia
    traditions: [marxism.market-socialism]
    summary: Slovene partisan leader and the chief theorist of Yugoslav self-management, who drafted the 1953, 1963 and 1974 constitutions. His last work set out the system of associated labor and delegate assemblies as the alternative to both Soviet statism and parliamentary democracy.
    argues:
      - {position: hist.yugoslavia.self-management, in: {author: Edvard Kardelj, title: "Pravci razvoja političkog sistema socijalističkog samoupravljanja", year: 1977}}
      - {position: planning.form.self-management, in: {author: Edvard Kardelj, title: "Pravci razvoja političkog sistema socijalističkog samoupravljanja", year: 1977}}

  - id: thinker.markovic
    name: Mihailo Marković
    born: 1923
    died: 2010
    region: Serbia / Yugoslavia
    traditions: [marxism.western]
    summary: Belgrade philosopher and a founder of the Praxis group of Marxist humanists, dismissed from the university in 1975 for criticizing the party. He argued that the state and the ruling party should give way to self-governing councils of recallable delegates at every level.
    argues:
      - {position: democracy.form.council, in: {author: Mihailo Marković, title: "New Forms of Democracy in Socialism", year: 1981, note: "Praxis International 1(1)"}}

  - id: thinker.djilas
    name: Milovan Djilas
    born: 1911
    died: 1995
    region: Montenegro / Yugoslavia
    traditions: [socdem.democratic-socialism]
    summary: Partisan commander and one of Tito's closest deputies, expelled from the leadership in 1954 for demanding democratization and later imprisoned. The New Class argued that communist officials had become a new ruling class through their collective control of nationalized property.
    argues:
      - {position: hist.yugoslavia.new-class, in: {author: Milovan Djilas, title: "The New Class: An Analysis of the Communist System", year: 1957}}

  - id: thinker.samary
    name: Catherine Samary
    region: France
    traditions: [marxism.trotskyism]
    summary: French economist of the Fourth International who specialized in Yugoslavia and eastern Europe. She argued that the market reforms of the 1960s undermined workers' self-management and that debt and austerity then broke the federation apart.
    argues:
      - {position: hist.yugoslavia.undone-by-markets-and-debt, in: {author: Catherine Samary, title: "Le marché contre l'autogestion: l'expérience yougoslave", year: 1988}}
      - {position: hist.yugoslavia.undone-by-markets-and-debt, in: {author: Catherine Samary, title: Yugoslavia Dismembered, year: 1995, note: "translated by Peter Drucker"}}

  # ---- Left populism
  - id: thinker.laclau
    name: Ernesto Laclau
    born: 1935
    died: 2014
    region: Argentina / United Kingdom
    traditions: [socdem.left-populism]
    summary: Argentine political theorist, formed in the Peronist left, who taught at Essex. With Mouffe he argued that political identities and interests are built by linking demands into a chain against a common adversary, and he defended populism as the logic of building a people.
    argues:
      - {position: interests.objective.constructed, in: {author: Ernesto Laclau and Chantal Mouffe, title: "Hegemony and Socialist Strategy: Towards a Radical Democratic Politics", year: 1985}}
      - {position: change.agent.the-people-against-the-elite, in: {author: Ernesto Laclau, title: On Populist Reason, year: 2005}}

  - id: thinker.mouffe
    name: Chantal Mouffe
    born: 1943
    region: Belgium / United Kingdom
    traditions: [socdem.left-populism]
    summary: Belgian political theorist who co-wrote Hegemony and Socialist Strategy with Laclau and developed a theory of agonistic pluralism. She later argued that the left must build a people against the oligarchy to win hegemony from neoliberalism and from the populist right.
    argues:
      - {position: ideology.formation.hegemony, in: {author: Ernesto Laclau and Chantal Mouffe, title: "Hegemony and Socialist Strategy: Towards a Radical Democratic Politics", year: 1985}}
      - {position: change.agent.the-people-against-the-elite, in: {author: Chantal Mouffe, title: For a Left Populism, year: 2018}}

  # ---- Mariátegui and Haya
  - id: thinker.haya-de-la-torre
    name: Víctor Raúl Haya de la Torre
    born: 1895
    died: 1979
    region: Peru
    traditions: [nationalism.aprismo]
    summary: Peruvian student leader who founded the American Popular Revolutionary Alliance (APRA) in exile in Mexico in 1924. He held that imperialism was the first stage of capitalism in Latin America and called for a front of manual and intellectual workers and the middle classes, led by an anti-imperialist state, against it.
    argues:
      - {position: alliances.policy.national-front, in: {author: Víctor Raúl Haya de la Torre, title: El antimperialismo y el APRA, year: 1936, note: "written 1928; chapter on the united front of APRA and its allies"}}
      - {position: nationalism.kinds.national-popular-front, in: {author: Víctor Raúl Haya de la Torre, title: El antimperialismo y el APRA, year: 1936, note: "written 1928"}}
