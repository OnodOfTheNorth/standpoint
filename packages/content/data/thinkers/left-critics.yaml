# Socialist and critical-theory thinkers added by the right-and-liberal agent so that the materialist
# positions and the rival sides of debates in its remit (state, culture, fascism, totalitarianism) name a
# person. None of these names was assigned to another agent.
thinkers:
  - id: thinker.dimitrov
    name: Georgi Dimitrov
    born: 1882
    died: 1949
    region: Bulgaria
    traditions: [marxism.ml]
    summary: >
      Bulgarian printer and trade unionist who became a Comintern leader. Tried by the Nazis for the Reichstag
      fire in 1933, he defended himself and was acquitted. As general secretary of the Communist International
      he set out its 1935 line: fascism as the open terrorist dictatorship of the most reactionary elements of
      finance capital, to be fought by a popular front. He led Bulgaria from 1946 to 1949.
    argues:
      - {position: fascism.nature.finance-capital-dictatorship, in: {author: Georgi Dimitrov, title: The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism, year: 1935, note: "report to the Seventh World Congress of the Comintern"}}
      - {position: fascism.response.popular-front, in: {author: Georgi Dimitrov, title: The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism, year: 1935}}
      - {position: alliances.policy.popular-front, in: {author: Georgi Dimitrov, title: The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism, year: 1935}}

  - id: thinker.losurdo
    name: Domenico Losurdo
    born: 1941
    died: 2018
    region: Italy
    traditions: [marxism.ml]
    summary: >
      Italian Hegelian Marxist philosopher at the University of Urbino. He wrote a counter-history of liberalism
      as the freedom of a white master race, built on slavery and colonial expropriation, and argued that the
      category of totalitarianism equates the Soviet Union with Nazism by erasing property relations and the
      colonial violence of the liberal empires.
    argues:
      - {position: totalitarianism.concept.cold-war-weapon, in: {author: Domenico Losurdo, title: Towards a Critique of the Category of Totalitarianism, year: 2004, note: "Historical Materialism 12:2"}}

  - id: thinker.allen-wood
    name: Allen W. Wood
    born: 1942
    died: null
    region: United States
    traditions: [marxism.analytical]
    summary: >
      American philosopher, a scholar of Kant, Hegel and Marx. In the debate on Marx and justice among
      analytical Marxists he argued that Marx did not condemn capitalism as unjust, since standards of justice
      belong to each mode of production, but as exploitation and domination that block human development.
    argues:
      - {position: morality.basis.historical-class, in: {author: Allen W. Wood, title: The Marxian Critique of Justice, year: 1972, note: "Philosophy and Public Affairs 1:3"}}

  - id: thinker.stuart-hall
    name: Stuart Hall
    born: 1932
    died: 2014
    region: Jamaica / United Kingdom
    traditions: [marxism.gramscian]
    summary: >
      Jamaican-born cultural theorist who directed the Birmingham Centre for Contemporary Cultural Studies.
      Reading Gramsci, he described Thatcherism as authoritarian populism: a project that won working-class
      consent in a crisis of the postwar settlement by speaking to fears about race, crime, the nation and the
      family, so as to carry through a free-market restructuring.
    argues:
      - {position: culture.war.material-roots, in: {author: Stuart Hall, title: The Great Moving Right Show, year: 1979, note: "Marxism Today, January 1979"}}

  - id: thinker.ep-thompson
    name: E. P. Thompson
    born: 1924
    died: 1993
    region: United Kingdom
    traditions: [marxism.western]
    summary: >
      English historian of the working class who left the Communist Party in 1956 and helped found the New
      Left. He argued that the law of eighteenth-century England served the propertied but, to work as law,
      had to bind rulers too, and he exposed his own university's ties to industry and its surveillance of
      staff and students.
    argues:
      - {position: law.nature.contested-terrain, in: {author: E. P. Thompson, title: "Whigs and Hunters: The Origin of the Black Act", year: 1975}}
      - {position: university.neutrality.already-serves-power, in: {author: E. P. Thompson (ed.), title: "Warwick University Ltd: Industry, Management and the Universities", year: 1970}}

  - id: thinker.rameau
    name: Max Rameau
    region: Haiti / United States
    traditions: [marxism.black-radical]
    summary: >
      Haitian-born organizer in Miami, a founder of the land and housing group Take Back the Land and of Pan-
      African Community Action. He proposes that police departments be replaced by forces under the direct
      control of elected boards of the neighborhoods they police, as the Black Panther Party demanded in 1969.
    argues:
      - {position: police.accountability.community-control, in: {author: Max Rameau, title: "Community Control over Police: A Proposition", year: 2017, note: "The Next System Project"}}
