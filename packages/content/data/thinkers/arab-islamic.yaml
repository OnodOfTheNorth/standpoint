thinkers:
  # ---- Arab nationalism and Arab socialism
  - id: thinker.arsuzi
    name: Zaki al-Arsuzi
    born: 1899
    died: 1968
    region: Syria
    traditions: [nationalism.baathism]
    summary: >-
      Alawite teacher from Antioch who led the Arab resistance to the transfer of Alexandretta to Turkey in 1938
      and founded an Arab Ba'ath group in Damascus in 1940, one of the currents that formed the Ba'ath Party. He
      held that the Arab nation is formed by its language, whose roots carry the people's original vision of
      the world.
    argues:
      - {position: nation.question.ethnic, in: {author: Zaki al-Arsuzi, title: "The Genius of Arabic in Its Tongue", year: 1943, note: "Arabic original Abqariyyat al-Arabiyya fi lisaniha"}}

  - id: thinker.bitar
    name: Salah al-Din al-Bitar
    born: 1912
    died: 1980
    region: Syria
    traditions: [nationalism.baathism]
    summary: >-
      Damascene teacher who founded the Arab Ba'ath movement with Michel Aflaq in the 1940s and served several
      times as prime minister of Syria in the 1960s. After the party's military wing seized power in 1966 he went
      into exile and broke with the Syrian government; he was assassinated in Paris in 1980.
    argues: []

  - id: thinker.boumediene
    name: Houari Boumediene
    born: 1932
    died: 1978
    region: Algeria
    traditions: [marxism.arab-socialism]
    summary: >-
      Chief of staff of the Algerian National Liberation Army who took power in the coup of June 1965 against Ahmed
      Ben Bella and ruled until his death. His government nationalized Algeria's hydrocarbons in 1971 and pursued
      state-led industrialization; as chair of the Non-Aligned Movement he called the UN special session of 1974
      that adopted the program for a new international economic order.
    argues:
      - {position: exchange.unequal.terms-of-trade, in: {author: Houari Boumediene, title: Address to the Sixth Special Session of the United Nations General Assembly, year: 1974}}
      - {position: intl.sovereignty.nations-set-own-course, in: {author: Houari Boumediene, title: Address to the Sixth Special Session of the United Nations General Assembly, year: 1974}}

  - id: thinker.gaddafi
    name: Muammar Gaddafi
    born: 1942
    died: 2011
    region: Libya
    traditions: [nationalism.nasserism]
    summary: >-
      Army officer who led the coup of 1969 against the Libyan monarchy, a follower of Nasser, and ruler of Libya
      until 2011. His Third Universal Theory rejected parties and parliaments for people's congresses; his
      government nationalized oil and spread its revenue in housing and welfare. Security forces killed some 1,200
      prisoners at Abu Salim prison in 1996, and Libya accepted responsibility for the Lockerbie bombing in 2003.
      He was killed by rebel fighters in 2011 during a NATO air campaign.
    argues:
      - {position: party.system.partyless, in: {author: Muammar Gaddafi, title: The Green Book, year: 1975}}
      - {position: democracy.form.direct, in: {author: Muammar Gaddafi, title: The Green Book, year: 1975}}

  - id: thinker.mahdi-amel
    name: Mahdi Amel
    born: 1936
    died: 1987
    region: Lebanon
    traditions: [marxism.arab-socialism]
    summary: >-
      Lebanese Communist theorist (Hassan Hamdan) who taught in Algeria and Beirut. He theorized a "colonial mode
      of production" in which the local bourgeoisie is structurally dependent on the imperialist one, and held
      that Lebanese sectarianism is the political form of that bourgeoisie's class rule. He was assassinated in
      Beirut in 1987.
    argues:
      - {position: comprador.nature.broker-class, in: {author: Mahdi Amel, title: Theoretical Prolegomena to the Study of the Impact of Socialist Thought on the National Liberation Movement, year: 1968}}
      - {position: state.nature.class-instrument, in: {author: Mahdi Amel, title: On the Sectarian State, year: 1986}}

  # ---- Kemalism
  - id: thinker.ataturk
    name: Mustafa Kemal Atatürk
    born: 1881
    died: 1938
    region: Turkey
    traditions: [nationalism.kemalism]
    summary: >-
      Ottoman officer who led the Turkish national war of 1919 to 1922 and founded the Republic of Turkey in 1923,
      its president until his death. His government abolished the caliphate, closed the religious courts and
      orders, replaced the Arabic script and made secularism a constitutional principle; the army crushed the
      Kurdish revolt of Sheikh Said in 1925 and the Dersim rising of 1937 and 1938, killing thousands.
    argues:
      - {position: liberty.concept.national-liberation, in: {author: Mustafa Kemal Atatürk, title: Nutuk, year: 1927, note: "the Great Speech to the Republican People's Party congress"}}
      - {position: religion.public.laicite, in: {author: Mustafa Kemal Atatürk, title: Nutuk, year: 1927}}

  - id: thinker.gokalp
    name: Ziya Gökalp
    born: 1876
    died: 1924
    region: Turkey
    traditions: [nationalism.kemalism, nationalism.ethnic]
    summary: >-
      Sociologist and poet of the Committee of Union and Progress, the leading theorist of Turkish nationalism. He
      defined the nation by shared language, culture and upbringing rather than race, and proposed that Turks
      "become Turkish, Muslim and modern": take European civilization while keeping their own national culture.
    argues:
      - {position: tradition.modernity.selective-modernization, in: {author: Ziya Gökalp, title: The Principles of Turkism, year: 1923}}
      - {position: nation.question.ethnic, in: {author: Ziya Gökalp, title: The Principles of Turkism, year: 1923}}

  # ---- Palestine
  - id: thinker.sayegh
    name: Fayez Sayegh
    born: 1922
    died: 1980
    region: Palestine / United States
    traditions: [nationalism.palestinian]
    summary: >-
      Palestinian scholar and diplomat who founded the PLO Research Center in 1965 and drafted UN General Assembly
      resolution 3379 of 1975. He analyzed Zionism as a settler-colonial movement whose aim, a state for Jews on
      land inhabited by Arabs, required the removal of the native population.
    argues:
      - {position: settler.colonialism.ongoing-structure, in: {author: Fayez A. Sayegh, title: Zionist Colonialism in Palestine, year: 1965}}

  - id: thinker.walid-khalidi
    name: Walid Khalidi
    born: 1925
    region: Palestine / Lebanon / United States
    traditions: [nationalism.palestinian]
    summary: >-
      Palestinian historian and co-founder of the Institute for Palestine Studies in 1963. He documented that the
      Haganah's Plan Dalet of March 1948 set out the capture and depopulation of Arab towns and villages, against
      the claim that Palestinians left on orders from Arab leaders.
    argues:
      - {position: hist.nakba-1948.planned-expulsion, in: {author: Walid Khalidi, title: "Plan Dalet: Master Plan for the Conquest of Palestine", year: 1961, note: "in Middle East Forum; reprinted in Journal of Palestine Studies, 1988"}}

  - id: thinker.rashid-khalidi
    name: Rashid Khalidi
    born: 1948
    region: Palestine / United States
    traditions: [nationalism.palestinian]
    summary: >-
      Palestinian-American historian at Columbia University and adviser to the Palestinian delegation at the
      Madrid talks of 1991. He tells the century since the Balfour Declaration as a colonial war on the
      Palestinians waged by the Zionist movement and Israel with British and then American backing.
    argues:
      - {position: hist.nakba-1948.ongoing-structure, in: {author: Rashid Khalidi, title: "The Hundred Years' War on Palestine: A History of Settler Colonialism and Resistance, 1917–2017", year: 2020}}

  - id: thinker.said
    name: Edward Said
    born: 1935
    died: 2003
    region: Palestine / United States
    traditions: [nationalism.palestinian]
    summary: >-
      Palestinian-American literary critic at Columbia University and member of the Palestine National Council
      from 1977 to 1991. He showed how European scholarship on the Orient served colonial rule, wrote the history
      of Zionism from the standpoint of its victims, broke with Arafat over the Oslo accords, and from 1999
      argued for one state with equal citizenship.
    argues:
      - {position: imperialism.nature.coloniality, in: {author: Edward W. Said, title: Orientalism, year: 1978}}
      - {position: settler.colonialism.ongoing-structure, in: {author: Edward W. Said, title: The Question of Palestine, year: 1979}}
      - {position: palestine.question.one-democratic-state, in: {author: Edward W. Said, title: The One-State Solution, year: 1999, note: "in The New York Times Magazine, 10 January 1999"}}

  - id: thinker.arafat
    name: Yasser Arafat
    born: 1929
    died: 2004
    region: Palestine
    traditions: [nationalism.palestinian]
    summary: >-
      Co-founder of Fatah in 1959 and chairman of the Palestine Liberation Organization from 1969. Under him the
      PLO waged armed struggle from Jordan and Lebanon, moved in 1988 to a state on the 1967 lines, and signed the
      Oslo accords of 1993; he was president of the Palestinian Authority from 1996 until his death.
    argues:
      - {position: violence.political.anti-colonial, in: {author: Yasser Arafat, title: Address to the United Nations General Assembly, year: 1974, note: "13 November 1974"}}
      - {position: palestine.question.plo-state, in: {author: Yasser Arafat, title: Address to the United Nations General Assembly in Geneva, year: 1988, note: "13 December 1988"}}

  - id: thinker.habash
    name: George Habash
    born: 1926
    died: 2008
    region: Palestine / Lebanon / Syria
    traditions: [nationalism.palestinian, marxism.arab-socialism]
    summary: >-
      Physician from Lydda, expelled in 1948, who founded the Arab Nationalist Movement and in 1967 the Popular
      Front for the Liberation of Palestine, which turned to Marxism-Leninism. The PFLP held that Palestine would
      be liberated only by people's war against Israel, imperialism and Arab reaction together; it carried out the
      airliner hijackings of 1968 to 1970.
    argues:
      - {position: palestine.question.liberation-of-all-palestine, in: {author: Popular Front for the Liberation of Palestine, title: Strategy for the Liberation of Palestine, year: 1969, note: "program adopted under Habash's leadership"}}

  - id: thinker.kanafani
    name: Ghassan Kanafani
    born: 1936
    died: 1972
    region: Palestine / Lebanon
    traditions: [nationalism.palestinian, marxism.arab-socialism]
    summary: >-
      Palestinian novelist, editor of the PFLP weekly al-Hadaf and the party's spokesman. His class history of the
      great revolt of 1936 to 1939 argued that the peasants and workers were betrayed by the feudal and religious
      leadership and the intervention of the Arab kings. He was killed with his niece by a car bomb in Beirut in 1972,
      an operation attributed to Israeli intelligence.
    argues:
      - {position: comprador.nature.broker-class, in: {author: Ghassan Kanafani, title: The 1936–39 Revolt in Palestine, year: 1972}}

  - id: thinker.leila-khaled
    name: Leila Khaled
    born: 1944
    region: Palestine / Jordan
    traditions: [nationalism.palestinian, marxism.arab-socialism]
    summary: >-
      Member of the Popular Front for the Liberation of Palestine, born in Haifa and made a refugee in 1948. She
      took part in the hijacking of TWA flight 840 in 1969 and the attempted hijacking of an El Al flight in 1970,
      and later sat on the Palestine National Council.
    argues:
      - {position: violence.political.anti-colonial, in: {author: Leila Khaled, title: "My People Shall Live: The Autobiography of a Revolutionary", year: 1973, note: "with George Hajjar"}}

  # ---- Zionism
  - id: thinker.borochov
    name: Ber Borochov
    born: 1881
    died: 1917
    region: Russia
    traditions: [nationalism.zionism-labor]
    summary: >-
      Founder of the Marxist Zionist party Poale Zion. He argued that the Jewish people's class structure was an
      inverted pyramid with few workers in basic production, which only a territory of their own could correct,
      and that the Jewish proletariat's class struggle required that territory in Palestine.
    argues:
      - {position: palestine.question.labor-zionist, in: {author: Ber Borochov, title: Our Platform, year: 1906}}

  - id: thinker.ben-gurion
    name: David Ben-Gurion
    born: 1886
    died: 1973
    region: Israel
    traditions: [nationalism.zionism-labor]
    summary: >-
      Secretary of the Histadrut labor federation, leader of Mapai and of the Jewish Agency, who proclaimed the
      State of Israel in May 1948 and was its first prime minister. His forces' operations in 1948 included the
      expulsions from Lydda and Ramle, and his governments barred the return of the Palestinian refugees and held
      the Arab citizens under military rule until 1966.
    argues:
      - {position: palestine.question.labor-zionist, in: {author: David Ben-Gurion, title: Rebirth and Destiny of Israel, year: 1954}}
      - {position: hist.nakba-1948.war-of-independence, in: {author: David Ben-Gurion, title: "Israel: A Personal History", year: 1971}}

  - id: thinker.jabotinsky
    name: Ze'ev Jabotinsky
    born: 1880
    died: 1940
    region: Russia / Palestine
    traditions: [nationalism.zionism-revisionist]
    summary: >-
      Founder of the Jewish Legion in the First World War and of Revisionist Zionism and its youth movement Betar.
      He argued that no native people accepts colonization voluntarily, so a Jewish majority could be built only
      behind an iron wall of force that the Arabs could not breach, after which agreement would become possible.
    argues:
      - {position: palestine.question.revisionist, in: {author: Ze'ev Jabotinsky, title: The Iron Wall, year: 1923}}

  - id: thinker.begin
    name: Menachem Begin
    born: 1913
    died: 1992
    region: Poland / Israel
    traditions: [nationalism.zionism-revisionist]
    summary: >-
      Commander of the Irgun from 1943, which bombed the King David Hotel in 1946, killing 91 people, and took part
      with Lehi in the killings at Deir Yassin in April 1948. He founded Herut and the Likud and was prime minister
      from 1977 to 1983, signing the peace treaty with Egypt and ordering the invasion of Lebanon in 1982.
    argues:
      - {position: palestine.question.revisionist, in: {author: Menachem Begin, title: The Revolt, year: 1951}}

  # ---- Political Islam and its critics
  - id: thinker.banna
    name: Hassan al-Banna
    born: 1906
    died: 1949
    region: Egypt
    traditions: [religious.islamism-brotherhood]
    summary: >-
      Schoolteacher who founded the Society of the Muslim Brothers in Ismailia in 1928 and built it into a mass
      movement of branches, schools, clinics and a secret armed wing. He taught that Islam is a complete order of
      faith, state, law and economy and that Muslims form one nation. He was shot dead in Cairo in 1949, weeks
      after a Brother assassinated the prime minister.
    argues:
      - {position: religion.public.divine-law, in: {author: Hasan al-Banna, title: Between Yesterday and Today, year: 1978, note: "tract of the 1930s–40s; date is that of Charles Wendell's translation in Five Tracts of Hasan al-Banna"}}
      - {position: nation.belonging.ummah, in: {author: Hasan al-Banna, title: Between Yesterday and Today, year: 1978, note: "tract of the 1930s–40s; date is that of Charles Wendell's translation in Five Tracts of Hasan al-Banna"}}

  - id: thinker.sibai
    name: Mustafa al-Siba'i
    born: 1915
    died: 1964
    region: Syria
    traditions: [religious.islamic-socialism, religious.islamism-brotherhood]
    summary: >-
      Founder and leader of the Syrian Muslim Brotherhood and dean of the Sharia faculty in Damascus. He argued
      that Islam contains its own socialism: wealth belongs to God, owners hold it in trust, and the state may
      limit property, nationalize what the public needs and guarantee every person's livelihood.
    argues:
      - {position: property.private.trust-from-god, in: {author: Mustafa al-Siba'i, title: Ishtirakiyyat al-Islam, year: 1959, note: "The Socialism of Islam"}}

  - id: thinker.shariati
    name: Ali Shariati
    born: 1933
    died: 1977
    region: Iran
    traditions: [religious.islamic-socialism]
    summary: >-
      Iranian sociologist trained in Paris, where he worked with the Algerian revolution's supporters, and lecturer
      at the Hosseiniyeh Ershad in Tehran. He opposed the "Red Shi'ism" of Ali and Hussein, a faith of the oppressed
      against tyrants and exploiters, to the "Black Shi'ism" of clerics allied with the throne, and rejected both
      Western capitalism and Marxist materialism. Jailed by SAVAK in 1973 to 1975, he died in England in 1977.
    argues:
      - {position: religion.public.prophetic-church, in: {author: Ali Shariati, title: Red Shi'ism, year: 1971, note: "lecture Tashayyo-e Alavi va Tashayyo-e Safavi"}}
      - {position: tradition.modernity.transcend-both, in: {author: Ali Shariati, title: Marxism and Other Western Fallacies, year: 1980, note: "lectures of the 1970s, English translation by R. Campbell"}}

  - id: thinker.khamenei
    name: Ali Khamenei
    born: 1939
    region: Iran
    traditions: [religious.islamism-khomeinist]
    summary: >-
      Cleric and student of Khomeini, jailed under the Shah, president of the Islamic Republic from 1981 to 1989
      and Supreme Leader from 1989. Under him the security forces suppressed the protest movements of 2009, 2019
      and 2022, killing hundreds. He presents the revolution as an Islamic and anti-arrogance revolution whose
      second phase must be carried by the young.
    argues:
      - {position: hist.iranian-revolution.islamic-revolution, in: {author: Ali Khamenei, title: Statement on the Second Phase of the Revolution, year: 2019, note: "issued for the fortieth anniversary, February 2019"}}

  - id: thinker.bayat
    name: Asef Bayat
    born: 1954
    region: Iran / United States
    traditions: [religious.post-islamism]
    summary: >-
      Iranian sociologist who studied the workers' councils of 1979 and later named the "post-Islamist turn":
      movements that keep religion in society while accepting civil rights, pluralism and a secular state. He
      documents how the councils that ran Iran's factories in 1979 were dismantled by 1981 and the Shah's
      property passed to state and clerical foundations.
    argues:
      - {position: hist.iranian-revolution.change-of-owners, in: {author: Asef Bayat, title: "Workers and Revolution in Iran: A Third World Experience of Workers' Control", year: 1987}}
      - {position: religion.public.separation, in: {author: Asef Bayat, title: "Making Islam Democratic: Social Movements and the Post-Islamist Turn", year: 2007}}

  - id: thinker.ghannouchi
    name: Rached Ghannouchi
    born: 1941
    region: Tunisia
    traditions: [religious.post-islamism]
    summary: >-
      Co-founder of the Islamic Tendency Movement in 1981, later Ennahda, jailed under Bourguiba and Ben Ali and in
      exile in London from 1989 to 2011. He argued that Islamic government rests on the people's consent and
      public liberties, and in 2016 led Ennahda to separate preaching from party politics as "Muslim democrats".
      Arrested in 2023 under President Saied, he was sentenced to prison terms in the following years.
    argues:
      - {position: democracy.form.representative, in: {author: Rached Ghannouchi, title: Al-Hurriyat al-Amma fi al-Dawla al-Islamiyya, year: 1993, note: "Public Liberties in the Islamic State"}}

  - id: thinker.madkhali
    name: Rabi' al-Madkhali
    born: 1933
    region: Saudi Arabia
    traditions: [religious.salafism-quietist]
    summary: >-
      Saudi hadith scholar at the Islamic University of Medina whose followers are called Madkhalis. He holds that
      the prophets called first to pure monotheism, not to political power, that Muslims owe obedience to their
      rulers, and that the Muslim Brotherhood and its offshoots corrupt the call by putting politics first.
    argues:
      - {position: change.means.example-and-conversion, in: {author: Rabi' ibn Hadi al-Madkhali, title: Manhaj al-Anbiya fi al-Da'wa ila Allah, year: 1984, note: "The Methodology of the Prophets in Calling to Allah"}}

  - id: thinker.albani
    name: Muhammad Nasir al-Din al-Albani
    born: 1914
    died: 1999
    region: Albania / Syria / Jordan
    traditions: [religious.salafism-quietist]
    summary: >-
      Albanian-born hadith scholar who worked as a watch repairer in Damascus and became the leading hadith critic
      of modern Salafism. His program of "purification and education" (al-tasfiya wa-l-tarbiya) held that Muslims
      must first purify belief and practice and educate a generation in them before any political project; he
      taught that part of politics is to leave politics.
    argues: []

  - id: thinker.azzam
    name: Abdullah Azzam
    born: 1941
    died: 1989
    region: Palestine / Jordan / Pakistan
    traditions: [religious.salafi-jihadism]
    summary: >-
      Palestinian Muslim Brotherhood scholar who founded the Services Bureau in Peshawar to bring Arab volunteers
      to the Afghan war, and was a mentor of Osama bin Laden. He held that when unbelievers occupy Muslim land,
      fighting becomes an individual duty for every Muslim, like prayer. He was killed by a car bomb in Peshawar
      in 1989.
    argues:
      - {position: violence.political.religious-duty, in: {author: Abdullah Azzam, title: "Defence of the Muslim Lands: The First Obligation after Iman", year: 1984}}
      - {position: internationalism.community-of-faith, in: {author: Abdullah Azzam, title: Join the Caravan, year: 1987}}

  - id: thinker.naji
    name: Abu Bakr Naji
    region: unknown (pseudonym)
    traditions: [religious.salafi-jihadism]
    summary: >-
      Pseudonymous jihadist strategist whose book circulated online in 2004. He argued that repeated attacks
      should exhaust states and the great powers until regions fall into "savagery", which jihadists would then
      govern by providing order and services, and that extreme violence serves that strategy. The Islamic State
      later took it as a guide.
    argues:
      - {position: change.means.armed-struggle, in: {author: Abu Bakr Naji, title: The Management of Savagery, year: 2004, note: "English translation by William McCants, 2006"}}

  # ---- Feminism and critique
  - id: thinker.mernissi
    name: Fatima Mernissi
    born: 1940
    died: 2015
    region: Morocco
    traditions: [feminism.islamic]
    summary: >-
      Moroccan sociologist who studied women's lives in the Maghreb. Going back to the hadith collections, she
      argued that the traditions used to exclude women from public life were transmitted by men with political
      interests, and that the Prophet's own community gave women a public role.
    argues:
      - {position: feminism.subordination.patriarchal-reading, in: {author: Fatima Mernissi, title: "The Veil and the Male Elite: A Feminist Interpretation of Women's Rights in Islam", year: 1987, note: "French original Le harem politique, 1987; English 1991"}}

  - id: thinker.wadud
    name: Amina Wadud
    born: 1952
    region: United States / Malaysia
    traditions: [feminism.islamic]
    summary: >-
      African-American scholar of the Qur'an who taught in Malaysia and co-founded Sisters in Islam. She reads the
      Qur'an as affirming the full equality of women and men and treats patriarchal rulings as human
      interpretation. In 2005 she led a mixed congregation in Friday prayer in New York.
    argues:
      - {position: feminism.subordination.patriarchal-reading, in: {author: Amina Wadud, title: "Qur'an and Woman: Rereading the Sacred Text from a Woman's Perspective", year: 1992}}

  - id: thinker.el-saadawi
    name: Nawal El Saadawi
    born: 1931
    died: 2021
    region: Egypt
    traditions: [feminism.decolonial]
    summary: >-
      Egyptian physician and novelist, dismissed as director of public health in 1972 for her book on women and
      sex and jailed by Sadat in 1981. She argued that the oppression of Arab women comes from class society and
      patriarchy, reinforced by imperialism, not from Islam as such, and campaigned against female genital
      cutting.
    argues:
      - {position: feminism.subordination.private-property, in: {author: Nawal El Saadawi, title: "The Hidden Face of Eve: Women in the Arab World", year: 1977, note: "Arabic original 1977; English 1980"}}

  - id: thinker.dabashi
    name: Hamid Dabashi
    born: 1951
    region: Iran / United States
    traditions: [nationalism.decolonial]
    summary: >-
      Iranian scholar of comparative literature at Columbia University. He argues that Islam, like Christianity in
      Latin America, must be retrieved as a theology of liberation against empire, and that political Islam as an
      ideology was formed in dialogue with colonial modernity.
    argues:
      - {position: religion.public.prophetic-church, in: {author: Hamid Dabashi, title: "Islamic Liberation Theology: Resisting the Empire", year: 2008}}
