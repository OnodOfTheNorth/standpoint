# Historical events, 1979–1991: the neoliberal turn, the debt crisis and the fall of the Eastern bloc.
events:
  - id: event.volcker-shock
    name: The Volcker shock
    date: "1979-10-06"
    end: "1982-10"
    place: United States, with worldwide effects
    summary: >-
      On 6 October 1979 the US Federal Reserve under Paul Volcker shifted to targeting the money supply,
      letting interest rates rise as far as needed to break inflation running above 11 percent. The
      federal funds rate peaked near 20 percent in 1980–81, US unemployment reached 10.8 percent in late
      1982, and inflation fell to under 4 percent by 1983. High dollar interest rates multiplied the cost
      of the floating-rate loans that governments in Latin America, Africa and Eastern Europe had taken
      in the 1970s, setting up the debt crisis of 1982. With Margaret Thatcher's monetarism in Britain
      and Ronald Reagan's breaking of the air traffic controllers' strike in 1981, it marked a shift in
      economic policy from full employment to price stability as the main goal.
    problematic: hist.neoliberal-turn
    disputed: >-
      Whether the shock was the necessary cure for stagflation (most mainstream economists and Volcker
      himself) or a disciplining of labor and the South that restored the power of capital (David
      Harvey, Gérard Duménil and Dominique Lévy), and how far it caused the debt crisis as against the
      borrowers' own policies.
    stances:
      - tradition: liberalism.chicago
        position: hist.neoliberal-turn.cure-for-stagflation
        note: A painful but necessary cure that ended a decade of inflation and laid the ground for twenty-five years of growth.
      - tradition: socdem.democratic-socialism
        position: hist.neoliberal-turn.restoring-class-power
        note: Mass unemployment was the instrument, and broken unions and soaring returns to capital were the result.
      - tradition: marxism.dependency
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: Washington raised the price of money and the South's debts exploded, the opening blow of a counter-offensive against the Third World.
      - tradition: liberalism.austrian
        position: crisis.cause.credit-distortion
        note: The Fed finally stopped the inflation it had itself created, which proves that no central bank should hold that power.

  - id: event.gwangju-1980
    name: The Gwangju uprising
    date: "1980-05-18"
    end: "1980-05-27"
    place: Gwangju, South Korea
    summary: >-
      After Park Chung-hee's assassination in October 1979, General Chun Doo-hwan seized control of the
      army in December and on 17 May 1980 extended martial law across South Korea, closing universities
      and arresting opposition leaders including Kim Dae-jung. In Gwangju special forces paratroopers
      attacked student protesters and bystanders with clubs and bayonets; citizens took arms from police
      stations, drove the troops out and ran the city through citizens' committees for several days.
      The army retook the city on 27 May. Chun became president, the massacre fed the movement that won
      direct presidential elections in 1987, and in 1996 Chun was convicted of mutiny and treason for
      the coup and the killings, then pardoned in 1997.
    problematic: hist.cold-war
    disputed: >-
      The official count is about 165 civilians killed, with many missing; victims' groups estimate
      several hundred or more. The US commander in Korea agreed to the release of Korean units from the
      combined command for use in restoring order, and US officials say they did not authorize the
      special forces' actions (Tim Shorrock's documents dispute the official account). Claims on the
      Korean right that North Korean agents led the rising have been rejected by South Korean courts
      and inquiries.
    stances:
      - tradition: liberalism.internationalist
        note: A city rose for constitutional government against a military coup, and its memory built the liberal democracy South Korea won in 1987.
      - tradition: marxism.third-worldism
        position: hist.cold-war.counter-revolution-in-the-south
        note: Washington let the generals use troops under its command, and Gwangju taught Korea's students who stood behind the junta.
      - tradition: anarchism.communist
        position: democracy.form.direct
        note: For five days a city without police or army fed and defended itself through assemblies, the Gwangju Commune.
      - tradition: conservatism.national
        note: The army restored order against an armed insurrection in a country still at war with the North.

  - id: event.debt-crisis-1982
    name: The Third World debt crisis
    date: "1982-08-12"
    end: "1989"
    place: Mexico, Latin America and Africa
    summary: >-
      In August 1982 Mexico announced it could no longer service its foreign debt after US interest
      rates and the dollar rose and oil prices fell, and Brazil, Argentina and dozens of other countries
      in Latin America and Africa followed into crisis. Commercial banks stopped lending, and the IMF and
      World Bank lent on condition of structural adjustment: cuts in public spending and subsidies,
      devaluation, privatization and the opening of trade and capital flows. For most of the decade
      Latin America paid more in debt service than it received in new lending, and income per person
      fell, giving the region its "lost decade." The Brady Plan of 1989 converted bank loans into bonds
      with partial write-offs.
    problematic: hist.neoliberal-turn
    disputed: >-
      Whether the crisis was caused by borrowing governments' overspending and state firms (the IMF and
      creditor governments) or by the Volcker rate shock and falling commodity prices (dependency
      writers and many economists), and whether adjustment restored growth or produced a lost decade.
    stances:
      - tradition: marxism.third-worldism
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: The debt became the lever by which the core reopened the South to its capital and ended the hopes of the New International Economic Order.
      - tradition: liberalism.chicago
        position: debt.sovereign.pay-what-you-owe
        note: Governments borrowed recklessly to fund state firms and subsidies, and adjustment imposed the discipline that later opened the region to growth.
      - tradition: marxism.ml
        position: debt.sovereign.already-paid
        note: As Fidel Castro argued in 1985, the debt was unpayable and already paid many times over, and the debtors should refuse it together.
      - tradition: religious.liberation-theology
        position: debt.sovereign.jubilee
        note: The poor of Latin America paid with hunger for loans they never saw, and the debt should be cancelled as a jubilee.
      - tradition: socdem.keynesian
        position: debt.sovereign.orderly-restructuring
        note: Creditors should have written down unpayable debt early instead of forcing a decade of austerity that hurt both sides.

  - id: event.sankara-revolution
    name: The Burkinabè revolution under Thomas Sankara
    date: "1983-08-04"
    end: "1987-10-15"
    place: Burkina Faso (Upper Volta)
    summary: >-
      Captain Thomas Sankara took power in Upper Volta in August 1983 with fellow officers including
      Blaise Compaoré, and in 1984 renamed the country Burkina Faso, "land of upright people." His
      government organized mass vaccination, literacy and tree-planting campaigns and village works
      through Committees for the Defense of the Revolution, banned female genital cutting and forced
      marriage, cut officials' privileges, and urged African states to refuse to pay their foreign debts,
      notably at the Organization of African Unity in July 1987. It dismissed striking teachers in 1984
      and repressed union and political opponents, and tensions grew inside the leadership. On 15
      October 1987 Sankara and twelve others were killed in a coup that brought Compaoré to power until
      2014; in 2022 a military court in Ouagadougou convicted Compaoré in absentia of complicity in the
      murder.
    problematic: hist.sankara
    disputed: >-
      French involvement in the coup is alleged by Sankara's family and supporters; the 2022 trial
      judged Burkinabè defendants, and French archives were only partly opened. Whether the Committees
      for the Defense of the Revolution were organs of popular power or of coercion is argued.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.sankara.self-reliant-revolution
        note: Africa's most honest revolution, which fed itself, freed its women, planted its forests and refused the debt.
      - tradition: marxism.third-worldism
        position: hist.sankara.killed-by-francafrique
        note: A revolution that defied France and the creditors was ended by France's local allies, and Compaoré ruled for twenty-seven years as their man.
      - tradition: marxism.trotskyism
        position: hist.sankara.revolution-from-above
        note: A sincere revolution decreed from above by officers, which lost its base when it turned on the teachers' and workers' unions.
      - tradition: liberalism.internationalist
        position: hist.sankara.military-dictatorship
        note: A charismatic military government without elections or free unions, whatever its achievements.
      - tradition: liberalism.technocratic
        position: hist.sankara.rectification-needed
        note: Admirable goals in health and literacy, pursued with price controls and hostility to investment that could not last.

  - id: event.miners-strike-1984
    name: The British miners' strike
    date: "1984-03-06"
    end: "1985-03-03"
    place: Britain
    summary: >-
      In March 1984 the National Coal Board announced the closure of Cortonwood colliery and plans to cut
      about 20,000 jobs, and the National Union of Mineworkers under Arthur Scargill backed strikes area
      by area without a national ballot, which split the union as most Nottinghamshire miners kept
      working. The government had built up coal stocks and prepared since the late 1970s, and deployed
      police forces from across the country, including in a mass confrontation at the Orgreave coking
      plant on 18 June 1984. Mining families, women's support groups and solidarity networks sustained
      the strike for a year; over 11,000 people were arrested, and among the dead were two pickets and a
      taxi driver killed by striking miners. The strike ended in defeat in March 1985, and British deep
      coal mining was almost entirely closed over the following decades.
    problematic: hist.neoliberal-turn
    disputed: >-
      Whether the strike defended communities against a planned political assault (the NUM; cabinet
      papers released in 2014 showed closure plans larger than admitted) or was an undemocratic
      political strike called without a ballot (the government, much of the Labour leadership, the
      breakaway Union of Democratic Mineworkers). The policing at Orgreave remains disputed.
    stances:
      - tradition: socdem.democratic-socialism
        position: hist.neoliberal-turn.restoring-class-power
        note: The government picked a fight with the strongest union to break organized labour, and the coalfields are still paying.
      - tradition: liberalism.chicago
        position: unions.role.obstacle
        note: Loss-making pits could not be kept open by a strike called without a ballot, and the union's defeat restored management's right to manage.
      - tradition: conservatism.one-nation
        position: hist.neoliberal-turn.market-society
        note: The pit villages were part of the nation, and abandoning them to the market without a plan left wounds no conservative should inflict.
      - tradition: feminism.materialist
        note: Women Against Pit Closures turned miners' wives into organizers, and the strike changed who counted as the labour movement.

  - id: event.cuito-cuanavale
    name: Angola's war and the battle of Cuito Cuanavale
    date: "1987-08"
    end: "1988-12-22"
    place: Angola and Namibia
    summary: >-
      Angola became independent in November 1975 amid war between the MPLA government and the FNLA and
      UNITA, backed at different times by the United States, Zaire and apartheid South Africa, whose
      troops invaded; Cuba sent troops at the MPLA's request, about 50,000 by 1988. In 1987 a government
      offensive against UNITA was turned back by South African forces, which then besieged Angolan and
      Cuban forces at Cuito Cuanavale from late 1987 to March 1988 without taking the town, while
      Cuban-led forces advanced toward the Namibian border. The New York Accords of December 1988
      provided for South Africa's withdrawal from Angola and Namibia's independence, achieved in 1990,
      and Cuban troops left by 1991. The war between the MPLA and UNITA continued until 2002.
    problematic: hist.cuban-revolution
    disputed: >-
      Cuba, Angola and the ANC call Cuito Cuanavale the defeat of apartheid's army and a turning point
      toward Namibian independence and the end of apartheid, as Nelson Mandela said in Havana in 1991.
      South African military accounts call it a successful defensive operation that halted the offensive
      with small losses (Fred Bridgland). Piero Gleijeses stresses the Cuban advance in the southwest as
      decisive.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.cuban-revolution.armed-the-south
        note: Cuba came to Africa to fight apartheid and asked for nothing in return, and Cuito Cuanavale broke the myth of the invincible white army.
      - tradition: marxism.ml
        position: hist.cuban-revolution.armed-the-south
        note: Proletarian internationalism in action, in which a small socialist island helped free Namibia and hasten the end of apartheid.
      - tradition: conservatism.neo
        position: hist.cold-war.victory-over-evil
        note: Supporting UNITA forced the Soviets and Cubans to the table and won the Cuban withdrawal.
      - tradition: nationalism.ethnic
        note: In the Afrikaner nationalist account the Defence Force halted a Soviet-led offensive and withdrew undefeated, and the settlement was a political choice.

  - id: event.caracazo
    name: The Caracazo
    date: "1989-02-27"
    end: "1989-03-05"
    place: Caracas and other Venezuelan cities
    summary: >-
      Weeks after taking office on promises against austerity, President Carlos Andrés Pérez announced an
      IMF-backed package that included a sharp rise in gasoline prices, which raised bus fares. On 27
      February 1989 protests and looting spread from the outskirts of Caracas through the city and other
      towns; the government suspended constitutional guarantees and sent the army and police into the
      poor neighborhoods. The official death toll was 276. The events discredited the parties of the
      Punto Fijo pact and preceded Hugo Chávez's failed coup attempt of February 1992 and his election
      in 1998.
    problematic: hist.neoliberal-turn
    disputed: >-
      Human rights groups and journalists estimate several hundred to over 2,000 dead, and mass graves
      were later found in Caracas; the Inter-American Court of Human Rights ruled against Venezuela over
      the killings. Whether it was a spontaneous revolt against the package (most accounts) or looting
      exploited by agitators (the government's initial account).
    stances:
      - tradition: nationalism.bolivarianism
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: The day the people said no to the IMF and were shot for it, and the day the Bolivarian revolution began.
      - tradition: liberalism.chicago
        position: development.path.integration
        note: Decades of oil-funded subsidies and price controls had to end, and the tragedy was a badly prepared rollout, not reform itself.
      - tradition: commonsense.rigged
        position: cs.rigged.system-rigged
        note: The politicians promised one thing and did the opposite, and the poor were shot for noticing.
      - tradition: religious.liberation-theology
        position: debt.sovereign.jubilee
        note: The barrios paid for the creditors' debt in blood, and the Church's place was with them.

  - id: event.tiananmen-1989
    name: The Tiananmen protests and their suppression
    date: "1989-04-15"
    end: "1989-06-04"
    place: Beijing and other Chinese cities
    summary: >-
      Mourning for the reformist former party leader Hu Yaobang, who died on 15 April 1989, became weeks
      of protest by students against corruption and inflation and for political reform and press
      freedom, joined by workers who formed autonomous unions, with protests in many other cities.
      Students occupied Tiananmen Square and began a hunger strike in May during Mikhail Gorbachev's
      state visit, and the government declared martial law on 20 May. On the night of 3–4 June the army
      forced its way into central Beijing, firing on crowds along the approach roads, and cleared the
      square. Party leader Zhao Ziyang, who had opposed martial law, was removed and held under house
      arrest until his death in 2005, and workers involved were punished more harshly than students,
      some by execution.
    problematic: hist.china-reform
    disputed: >-
      Deaths: the Chinese government's figure is about 200 to 300, including soldiers; other estimates
      run from several hundred to several thousand, and a Chinese Red Cross figure of 2,600 was reported
      and withdrawn. The government calls the events counter-revolutionary turmoil whose suppression
      secured stability; Wang Hui and others argue many protesters' grievances were about inflation and
      corruption under market reform rather than a demand for Western liberalism.
    stances:
      - tradition: marxism.scc
        position: hist.china-reform.primary-stage
        note: The Party stopped a counter-revolutionary turmoil encouraged from abroad and secured the stability that made thirty years of development possible.
      - tradition: liberalism.internationalist
        position: hist.china-reform.prosperity-without-liberty
        note: Economic opening went ahead and political reform was shot down, and the bargain of prosperity without liberty was sealed in blood.
      - tradition: marxism.third-camp
        position: hist.china-reform.capitalist-restoration
        note: The state feared the workers' autonomous federations more than the students, and crushing them cleared the way for the labor market.
      - tradition: nationalism.developmental-state
        position: hist.china-reform.developmental-state
        note: A developmental state that had collapsed like the Soviet Union would have helped no one, and stability came first.

  - id: event.fall-of-berlin-wall
    name: The fall of the Berlin Wall and the revolutions of 1989
    date: "1989-11-09"
    end: "1990-10-03"
    place: Berlin and Eastern Europe
    summary: >-
      In 1989 Poland's Round Table talks led to partly free elections won by Solidarity in June, and
      Hungary opened its border with Austria, through which thousands of East Germans left. Mass
      demonstrations in Leipzig and other cities forced Erich Honecker out in October, and on 9 November
      a confused announcement of new travel rules brought crowds to the Berlin Wall's crossings, which
      the guards opened. Communist governments fell across Eastern Europe by the end of the year,
      violently only in Romania, where Nicolae Ceaușescu was executed. Germany was reunified on 3 October
      1990 by East Germany's accession to the Federal Republic, and the Treuhand agency privatized or
      closed most East German state enterprises, with the loss of over two million jobs.
    problematic: hist.collapse-1989
    disputed: >-
      Whether these were peoples' revolutions for liberal democracy and national independence (most
      accounts) or civic movements that wanted a reformed socialism and were overtaken by absorption into
      the West (many East German dissidents of New Forum). The Treuhand's record is disputed between
      those who call it unavoidable and those who call it a fire sale.
    stances:
      - tradition: liberalism.internationalist
        position: hist.collapse-1989.peoples-revolutions
        note: Peoples' revolutions, mostly peaceful, won liberty and national independence and reunited Europe.
      - tradition: conservatism.christian-democracy
        position: hist.collapse-1989.peoples-revolutions
        note: Peoples who kept their faith, from Solidarity's shipyards to Leipzig's churches, brought down atheist communism.
      - tradition: liberalism.chicago
        position: hist.collapse-1989.end-of-history
        note: The verdict on central planning was in, and liberal capitalism had no rival left.
      - tradition: marxism.ml
        position: hist.collapse-1989.counter-revolution
        note: A counter-revolution that restored capitalism, annexed the GDR and threw millions out of work.
      - tradition: marxism.left-communism
        position: hist.collapse-1989.sideways-step
        note: State capitalism gave way to private capitalism, and the workers changed masters.
      - tradition: socdem.keynesian
        position: hist.collapse-1989.shock-therapy-blunder
        note: The end of the dictatorship was welcome, but the Treuhand's fire sale turned East Germany into a deindustrialized region.

  - id: event.ussr-dissolution
    name: The dissolution of the Soviet Union
    date: "1991-08-19"
    end: "1991-12-26"
    place: USSR
    summary: >-
      In March 1991, in a referendum held in nine of the fifteen republics, over three-quarters of voters
      approved keeping the USSR as a renewed federation. On 19 August members of the leadership put
      Mikhail Gorbachev under house arrest and declared a state of emergency, but the coup collapsed
      within three days amid resistance led by Russian president Boris Yeltsin. Republics declared
      independence, Ukraine's was confirmed by referendum on 1 December, and on 8 December the leaders of
      Russia, Ukraine and Belarus declared the Soviet Union dissolved at Belavezha. Gorbachev resigned on
      25 December, and the Soviet flag was lowered over the Kremlin.
    problematic: hist.collapse-1989
    disputed: >-
      Whether the collapse came from economic failure and national movements (most accounts), from a
      choice by much of the party-state elite to become owners (David Kotz and Fred Weir, Trotskyists),
      or from Western pressure and betrayal at the top (Marxist-Leninists). Whether it was a geopolitical
      catastrophe (Vladimir Putin in 2005) or the liberation of nations (Baltic, Ukrainian and other
      national movements).
    stances:
      - tradition: nationalism.eurasianism
        position: hist.collapse-1989.geopolitical-catastrophe
        note: A great state was dismembered and twenty-five million Russians found themselves abroad overnight.
      - tradition: marxism.trotskyism
        position: hist.collapse-1989.bureaucracy-became-owners
        note: As Trotsky predicted, the bureaucracy turned itself into a property-owning class rather than give power to the workers.
      - tradition: marxism.ml
        position: hist.collapse-1989.counter-revolution
        note: A counter-revolution against the will of the people expressed in March, carried out by traitors at the top.
      - tradition: liberalism.classical
        position: hist.collapse-1989.peoples-revolutions
        note: An empire dissolved almost without bloodshed and its captive nations won independence.
      - tradition: commonsense.declinist
        position: hist.ussr-late.security-and-decency
        note: People had jobs, flats, pensions and order, and lost them all within a year.
