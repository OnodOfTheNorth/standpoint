# Events anchoring history problematics added in data/problematics/gaps-d.yaml.
# Argentina 2001 and Bolivia 2019 already have events (post-cold-war.yaml, present.yaml).
events:
  - id: event.first-world-war
    name: The First World War
    date: "1914-07-28"
    end: "1918-11-11"
    place: Europe, the Middle East, Africa, Asia and the oceans
    summary: >-
      After the assassination of Archduke Franz Ferdinand in Sarajevo on 28 June 1914, Austria-Hungary declared war on
      Serbia on 28 July, and within a week Russia, Germany, France and Britain were at war; the Ottoman Empire, Italy, Japan,
      the United States and others joined later. The Western Front settled into trench warfare, with battles such as Verdun
      and the Somme in 1916 costing hundreds of thousands of lives each. More than a million Indian soldiers served the
      British Empire, France recruited troops in West and North Africa and Indochina, some 140,000 Chinese laborers worked
      behind the Allied lines, and hundreds of thousands of African porters died in the East African campaign. Revolution
      took Russia out of the war in 1917–18, Germany signed an armistice on 11 November 1918, and the empires of Russia,
      Austria-Hungary, Germany and the Ottomans collapsed. Some 15 to 20 million people died.
    problematic: hist.wwi-1914
    disputed: >-
      Responsibility for the outbreak: German war aims and the July crisis (Fritz Fischer), shared miscalculation by all
      powers (Christopher Clark), or rivalry among imperialist powers for colonies and markets (Lenin). Death tolls,
      especially among colonial porters and laborers, are estimates.
    stances:
      - tradition: marxism.leninism
        position: hist.wwi-1914.imperialist-war
        note: A war for the redivision of the world among finance capitals, to be turned into a war against one's own government.
      - tradition: socdem.revisionist
        position: hist.wwi-1914.national-defense
        note: Workers defended their countries, and the labor movement earned its place in the state.
      - tradition: liberalism.internationalist
        position: hist.wwi-1914.german-bid
        note: German leaders gambled on a general war, and the peace that followed tried to build a League to prevent another.
      - tradition: nationalism.decolonial
        position: hist.wwi-1914.colonial-war
        note: The colonies paid in soldiers and laborers and were refused self-rule in 1919.
      - tradition: fascism.italian
        position: hist.wwi-1914.front-generation
        note: The trenches made a new generation that the parliaments betrayed.

  - id: event.martial-law-philippines
    name: Martial law in the Philippines
    date: "1972-09-21"
    end: "1986-02-25"
    place: Philippines
    summary: >-
      President Ferdinand Marcos, elected in 1965 and re-elected in 1969, signed Proclamation 1081 placing the Philippines
      under martial law, dated 21 September 1972 and announced on 23 September, citing communist insurgency and unrest.
      Congress was closed, opposition leaders including Benigno Aquino Jr. were arrested, newspapers were shut and a new
      constitution let Marcos rule by decree. Commonly cited figures, from Amnesty International and later researchers, are
      some 70,000 imprisoned, 34,000 tortured and more than 3,000 killed. War with the Moro National Liberation Front in the
      south killed tens of thousands, and the New People's Army grew in the countryside. Foreign debt rose to more than 20
      billion dollars and monopolies over sugar and coconut went to allies of the president. Martial law was formally lifted
      in January 1981 while Marcos kept decree powers. Aquino was assassinated on his return in August 1983; after a disputed
      snap election in February 1986, a military revolt and millions of people on Epifanio de los Santos Avenue (EDSA) forced
      Marcos into exile in Hawaii on 25 February 1986. His son Ferdinand Marcos Jr. was elected president in 2022.
    problematic: hist.martial-law-philippines
    disputed: >-
      Whether martial law was a personal dictatorship (liberal and church accounts), a US-backed dictatorship of landlords
      and compradors (the Communist Party of the Philippines), or a period of order and development (Marcos loyalists).
      Casualty and detention figures are estimates; a 2013 reparations law recognized more than 11,000 victims.
    stances:
      - tradition: liberalism.internationalist
        position: hist.martial-law-philippines.dictatorship-and-plunder
        note: A kleptocratic dictatorship ended by a peaceful popular uprising.
      - tradition: marxism.mlm
        position: hist.martial-law-philippines.us-client
        note: A US-Marcos fascist dictatorship; EDSA changed the faces of the ruling classes, not their rule.
      - tradition: commonsense.declinist
        position: hist.martial-law-philippines.golden-age
        note: The years of discipline and building, before the oligarchs came back.
      - tradition: conservatism.cst
        position: hist.martial-law-philippines.people-power-grace
        note: The bishops declared the fraud without moral basis, and the faithful brought the dictatorship down without bloodshed.
