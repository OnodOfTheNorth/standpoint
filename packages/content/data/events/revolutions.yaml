# Historical events, 1789–1920: the age of revolutions and the partition of the world.
events:
  - id: event.french-revolution
    name: The French Revolution
    date: "1789-05-05"
    end: "1799-11-09"
    place: France
    summary: >-
      The Estates-General met in May 1789; in June the Third Estate declared itself a National
      Assembly, and on 14 July Parisian crowds stormed the Bastille. In August the Assembly abolished
      feudal privileges and adopted the Declaration of the Rights of Man and of the Citizen, and church
      lands were nationalized and sold. The monarchy fell in 1792, Louis XVI was executed in January
      1793, and the Jacobin government met foreign war and internal revolt with the Terror of 1793–94
      before its own fall in Thermidor. Napoleon Bonaparte's coup of November 1799 closed the
      revolutionary decade.
    problematic: hist.french-revolution
    disputed: >-
      The toll: about 17,000 official death sentences under the Terror and perhaps 35,000–50,000
      deaths in all from it; estimates for the Vendée war run from about 100,000 to about 250,000.
      Some Catholic and Vendéen writers (Reynald Secher) call the Vendée repression a genocide, a label
      most historians reject. The interpretive dispute is whether this was a bourgeois revolution
      (Lefebvre, Soboul) or a political and cultural revolution with no class key (Cobban, Furet).
    stances:
      - tradition: marxism.classical
        position: hist.french-revolution.bourgeois-revolution
        note: The bourgeoisie broke feudal property and cleared the ground for capitalism, carried there by sans-culottes and peasants it then disciplined.
      - tradition: liberalism.republican
        position: hist.french-revolution.rights-of-man
        note: It founded popular sovereignty and the rights of the citizen, the measure every government has had to answer to since.
      - tradition: conservatism.burkean
        position: hist.french-revolution.burkean-catastrophe
        note: It tore down inherited institutions in the name of abstract rights and arrived, by its own logic, at the guillotine and the military dictator.
      - tradition: conservatism.integralism
        position: hist.french-revolution.war-on-faith
        note: It made war on the Church, killed priests and faithful peasants in the Vendée, and put a secular state where Christ's social kingship had stood.
      - tradition: anarchism.communist
        position: hist.french-revolution.unfinished-revolution
        note: The peasants and the sans-culottes made the revolution, and the bourgeoisie shut it down once its new property was safe.
      - tradition: nationalism.decolonial
        position: hist.french-revolution.colonial-limit
        note: Its universal rights stopped at the colony's edge until the enslaved of Saint-Domingue forced the question with arms.

  - id: event.haitian-revolution
    name: The Haitian Revolution
    date: "1791-08-22"
    end: "1804-01-01"
    place: Saint-Domingue (Haiti)
    summary: >-
      In August 1791 enslaved people in northern Saint-Domingue, France's richest colony and a leading
      world producer of sugar and coffee, rose against the plantations. Under pressure from the rising,
      French commissioners abolished slavery in the colony in 1793, and the Convention extended
      abolition to all French colonies in 1794. Toussaint Louverture rose to command the colony, but in
      1802 Napoleon sent an expedition to retake it and restored slavery elsewhere in the French
      empire; Toussaint was deported and died in a French prison in 1803. The army of Jean-Jacques
      Dessalines defeated the expedition and declared Haiti independent on 1 January 1804, the first
      state founded by formerly enslaved people.
    problematic: hist.haitian-revolution
    disputed: >-
      The killing of most remaining French colonists in 1804 is read by some historians as retribution
      and defense against a return of slavery, and by others as a massacre that defines the
      revolution. Whether the revolution was an extension of French republicanism or a revolution of
      African and Creole making in its own right is argued between C. L. R. James, Carolyn Fick,
      Laurent Dubois and Michel-Rolph Trouillot, who also documented how long it was left out of
      Western histories.
    stances:
      - tradition: marxism.black-radical
        position: hist.haitian-revolution.universal-emancipation
        note: The only revolution of its age that made universal freedom literal, and it was won by the enslaved themselves.
      - tradition: nationalism.pan-africanism
        position: hist.haitian-revolution.black-sovereignty
        note: The first Black republic proved that Africans in the Americas could win sovereignty and hold it against every empire.
      - tradition: nationalism.decolonial
        position: hist.haitian-revolution.cultivators-revolt
        note: The cultivators fought planters of every color, and then their own generals, who tried to keep them working the plantations.
      - tradition: liberalism.republican
        position: hist.haitian-revolution.republican-extension
        note: The rights of man reached the colony, carried by the very people the Assembly had first left out.
      - tradition: conservatism.reactionary
        position: hist.haitian-revolution.ruinous-race-war
        note: A servile war, unleashed by Jacobin doctrine, destroyed the richest colony in the world and ended in the slaughter of its white inhabitants.

  - id: event.haiti-indemnity
    name: France's indemnity on Haiti
    date: "1825-04-17"
    end: "1947"
    place: Haiti and France
    summary: >-
      In April 1825 Charles X recognized Haiti's independence on condition that it pay former colonists
      150 million francs and halve customs duties on French goods; French warships stood off
      Port-au-Prince while the terms were accepted. The sum was cut to 90 million francs in 1838.
      Haiti borrowed from French banks to pay the first installment, so the indemnity became a double
      debt of principal and interest; the indemnity itself was paid off by 1883, and loans tied to it
      were serviced until about 1947. The United States occupied Haiti from 1915 to 1934 and took
      control of its customs revenue.
    problematic: hist.haitian-revolution
    disputed: >-
      The cost to Haiti's development is contested: a 2022 New York Times study put the lost growth at
      21 to 115 billion US dollars, and economists dispute the counterfactual. Haiti's government under
      Jean-Bertrand Aristide demanded about 21 billion dollars in restitution in 2003; France has
      acknowledged the history and refused restitution.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.haitian-revolution.made-to-pay
        note: The empires made Haiti buy back the freedom it had already won in war, and the money is owed back to Haiti.
      - tradition: marxism.dependency
        position: poverty.cause.drain
        note: An early case of the drain, in which gunboats forced a periphery to send its surplus to a core's bankers for over a century.
      - tradition: liberalism.classical
        position: poverty.cause.bad-institutions
        note: The indemnity was extortion, but Haiti's lasting poverty owes more to two centuries of predatory rule and insecure property than to a debt long since paid.
      - tradition: religious.liberation-theology
        position: debt.sovereign.jubilee
        note: A debt imposed on the poor for having freed themselves is no debt before God, and justice requires that it be returned.

  - id: event.paris-commune
    name: The Paris Commune
    date: "1871-03-18"
    end: "1871-05-28"
    place: Paris, France
    summary: >-
      After France's defeat by Prussia and the siege of Paris, the city's National Guard resisted the
      Thiers government's attempt on 18 March 1871 to remove its cannon, and Paris elected a Commune.
      It separated church and state, remitted rents owed during the siege, banned night work in
      bakeries, handed workshops abandoned by their owners to workers' cooperatives, and capped
      officials' salaries. Government troops retook the city in the Bloody Week of 21–28 May; during it
      Communards shot hostages, including the Archbishop of Paris, and troops carried out mass summary
      executions. Over 40,000 people were arrested, and thousands were later deported to New Caledonia.
    disputed: >-
      The number killed in the Bloody Week: Robert Tombs estimates about 6,000–7,500, while older
      estimates and Communard accounts give 17,000 to over 20,000. Whether the Commune was a workers'
      government (Marx) or a municipal and patriotic revolt with a socialist minority is debated among
      historians.
    stances:
      - tradition: marxism.leninism
        position: state.relation.smash-and-replace
        note: The first workers' government showed that the working class must smash the old state machine, and it fell for not marching on Versailles or seizing the Bank of France.
      - tradition: anarchism.communist
        position: state.relation.abolish-at-once
        note: A free commune federating from below, defeated because it kept too many habits of representative government and too much respect for property.
      - tradition: anarchism.feminist
        note: Women such as Louise Michel and the Union des femmes fought on the barricades and organized the cooperative workshops, a part of the story the official histories dropped.
      - tradition: socdem.revisionist
        position: reform.revolution.reform-is-the-road
        note: Its heroism and its slaughter show what insurrection costs; the workers' road to power runs through the franchise and organization.
      - tradition: conservatism.burkean
        position: violence.political.state-monopoly
        note: An armed rising against an elected Assembly in a defeated country, which burned the Tuileries and shot its hostages.

  - id: event.berlin-conference
    name: The Berlin Conference
    date: "1884-11-15"
    end: "1885-02-26"
    place: Berlin, Germany
    summary: >-
      At Bismarck's invitation, fourteen states, among them the European colonial powers, the Ottoman
      Empire and the United States, met to set rules for claiming African territory. No African ruler
      or people was represented. The General Act required effective occupation for new coastal claims
      and declared free trade in the Congo basin, and the conference was accompanied by recognition of
      the Congo Free State as the personal possession of Leopold II of Belgium. By 1914 European states
      ruled about 90 percent of Africa; only Ethiopia and Liberia remained independent.
    disputed: >-
      Deaths in the Congo Free State under Leopold's forced rubber collection are disputed: Adam
      Hochschild's widely cited figure of about 10 million is a population-loss estimate that
      demographers say cannot be verified, and other estimates are lower. Historians also dispute how
      far the conference itself drew Africa's borders, which were mostly set by later bilateral treaties.
    stances:
      - tradition: marxism.leninism
        position: imperialism.nature.monopoly-stage
        note: The division of the world among the great powers was the territorial face of capitalism's monopoly stage, and it would end in a war to redivide it.
      - tradition: nationalism.pan-africanism
        position: poverty.cause.colonial-legacy
        note: Africa was carved up at a table where no African sat, and the borders still serve the carvers better than the peoples inside them.
      - tradition: nationalism.decolonial
        position: imperialism.nature.coloniality
        note: Berlin drew the map of coloniality, economies and languages built to face outward, which formal independence did not undo.
      - tradition: conservatism.neo
        position: imperialism.nature.civilizing-order
        note: The powers turned a scramble that threatened war among themselves into rules, and pledged to suppress the slave trade where they ruled.

  - id: event.mexican-revolution
    name: The Mexican Revolution
    date: "1910-11-20"
    end: "1920"
    place: Mexico
    summary: >-
      Francisco Madero called a rising against Porfirio Díaz, who had ruled since 1876 and opened land,
      railways and mines to foreign capital. Díaz fell in 1911, but the revolution split: Emiliano
      Zapata's southern army demanded the return of village lands in the Plan of Ayala, Pancho Villa
      led an army in the north, and the Constitutionalists under Venustiano Carranza won the war. The
      1917 Constitution declared land and subsoil the property of the nation and guaranteed labor
      rights, the basis for later land reform and the 1938 oil nationalization. Zapata was assassinated
      in 1919, and land was redistributed at scale only under Lázaro Cárdenas in the 1930s.
    disputed: >-
      Losses from war, disease, famine and emigration are estimated at roughly 1 to 2 million people.
      Historians divide over whether it was a popular agrarian revolution (John Womack, Alan Knight) or
      a political revolution led by northern elites that the peasants joined and lost (Ramón Eduardo
      Ruiz and other revisionists).
    stances:
      - tradition: zapatismo
        position: agrarian.question.land-to-the-tiller
        note: Zapata's demand, land and liberty for the villages, was betrayed by the state that took his name, and the debt was called in again in 1994.
      - tradition: nationalism.civic
        note: The founding of modern Mexico as a nation of citizens, in which the land and what lies under it belong to the nation.
      - tradition: anarchism.syndicalist
        note: The Flores Magón brothers pointed it toward land and workshops held in common, while the Constitutionalists used the workers' Red Battalions against Zapata and then broke the unions.
      - tradition: marxism.ml
        note: A bourgeois-democratic and anti-imperialist revolution carried by peasants, whose gains in land and oil were real but stopped short of power for workers and peasants.
      - tradition: conservatism.cst
        note: Its land reform answered a real injustice, but its constitution stripped the Church of schools and property and drove the faithful into the Cristero war.
