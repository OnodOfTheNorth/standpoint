# Historical events, 1929–1945: the Depression, fascism and the Second World War.
events:
  - id: event.crash-1929
    name: The Wall Street crash and the Great Depression
    date: "1929-10-24"
    end: "1933"
    place: United States, then worldwide
    summary: >-
      The New York stock market crash of October 1929 was followed by bank failures, falling prices
      and a contraction of credit that spread worldwide. By 1932–33 industrial production in the
      United States and Germany had fallen by around 40 percent, and about a quarter of American
      workers were unemployed. World trade fell by about two-thirds in value between 1929 and 1934 as
      states raised tariffs and left the gold standard. Prices of coffee, sugar, rubber, cotton and
      other primary exports collapsed, hitting colonies and Latin America hard, and several Latin
      American states turned to industrializing behind tariffs to replace imports.
    disputed: >-
      The cause: Milton Friedman and Anna Schwartz blamed the Federal Reserve for letting the money
      supply contract; Keynesians blame a collapse of demand; Austrian economists blame the credit boom
      of the 1920s; Marxists point to falling profitability or overaccumulation.
    stances:
      - tradition: socdem.keynesian
        position: crisis.cause.demand-failure
        note: Spending collapsed and the economy stuck far below full employment, and only public spending could restart it.
      - tradition: liberalism.chicago
        position: crisis.cause.shocks-and-errors
        note: A sharp recession became the Great Depression because the Federal Reserve let a third of the money supply vanish.
      - tradition: liberalism.austrian
        position: crisis.cause.credit-distortion
        note: Cheap credit in the 1920s financed a false boom, and the bust was the correction that intervention then prolonged.
      - tradition: marxism.trotskyism
        position: crisis.cause.falling-profit
        note: The crisis showed capitalism's death agony, with profitability exhausted and the system unable to develop the productive forces.
      - tradition: marxism.dependency
        position: crisis.cause.imperial-drain
        note: The core pushed its crisis onto the periphery through collapsing commodity prices, and the break in links let Latin America begin to industrialize.

  - id: event.nazi-seizure-1933
    name: The Nazi seizure of power
    date: "1933-01-30"
    end: "1934-08-02"
    place: Germany
    summary: >-
      The NSDAP won 37 percent of the vote in the Reichstag election of July 1932 and 33 percent in
      November, when Social Democrats and Communists together polled more. On 30 January 1933
      President Hindenburg appointed Hitler chancellor at the head of a cabinet arranged by
      conservatives around Franz von Papen, who expected to control him. After the Reichstag fire,
      emergency decrees suspended civil rights, and with Communist deputies already arrested the
      Enabling Act passed on 23 March with the Centre Party's votes and only the Social Democrats
      voting against. The unions were dissolved on 2 May, all other parties were gone by July, and the
      first concentration camps held tens of thousands of political prisoners, most of them
      Communists and Social Democrats.
    disputed: >-
      The role of big business: Marxist-Leninists follow Georgi Dimitrov in holding that finance
      capital installed the Nazis; Henry Ashby Turner found industry's funding before 1933 limited,
      while others stress the backing of landowners, the army and part of industry in the final
      months. The Communists' line of calling Social Democrats "social fascists," and the Social
      Democrats' refusal of joint action, are blamed by Trotskyists and many historians for dividing
      the workers' movement.
    stances:
      - tradition: marxism.ml
        position: fascism.nature.finance-capital-dictatorship
        note: The most reactionary, chauvinist and imperialist elements of finance capital handed power to Hitler to smash the workers' movement and prepare war.
      - tradition: marxism.trotskyism
        position: fascism.nature.petty-bourgeois-mass-movement
        note: Big capital used the enraged petty bourgeoisie as a battering ram, and a united front of Communist and Social Democratic workers could have stopped it.
      - tradition: liberalism.social
        position: fascism.nature.paxton-process
        note: Hitler did not seize power so much as receive it from conservative elites who thought they could use him.
      - tradition: liberalism.austrian
        position: fascism.nature.a-form-of-socialism
        note: Collectivism and planning had prepared the ground, and National Socialism was socialism in nationalist dress.
      - tradition: fascism.nazism
        position: fascism.nature.national-rebirth-self-view
        note: The national revolution swept away the parties and the Marxist unions and restored the unity of the people's community.

  - id: event.new-deal
    name: The New Deal
    date: "1933-03-04"
    end: "1939"
    place: United States
    summary: >-
      Franklin Roosevelt took office in March 1933 with about a quarter of the labor force unemployed
      and much of the banking system closed or failing. The New Deal reopened the banks under federal
      supervision, created deposit insurance, separated commercial from investment banking, and put
      millions to work on public projects through the Civilian Conservation Corps and the Works
      Progress Administration. Amid waves of strikes and sit-down occupations, the Wagner Act of 1935
      protected the right to organize, the Social Security Act created old-age pensions and
      unemployment insurance, and the Fair Labor Standards Act of 1938 set a minimum wage. Farm and
      domestic workers, a large share of them Black, were left out of Social Security and the Wagner
      Act.
    problematic: hist.new-deal
    disputed: >-
      Whether it ended the Depression: unemployment stayed above 14 percent until about 1941, and
      Keynesians say the spending was too small while Harold Cole and Lee Ohanian argue its labor and
      cartel policies prolonged the slump. Whether the exclusions of farm and domestic workers were
      demanded by Southern Democrats to protect Jim Crow (Ira Katznelson) or followed administrative
      reasoning (other historians).
    stances:
      - tradition: socdem.keynesian
        position: hist.new-deal.saved-capitalism
        note: Public investment, regulated finance and social insurance saved capitalism from itself and built a broad middle class.
      - tradition: socdem.democratic-socialism
        position: hist.new-deal.won-from-below
        note: The general strikes of 1934 and the sit-downs at Flint won the Wagner Act, not the generosity of the president.
      - tradition: liberalism.austrian
        position: hist.new-deal.prolonged-the-depression
        note: Price-fixing, cartels and uncertainty about property froze investment and turned a slump into a lost decade.
      - tradition: marxism.black-radical
        position: hist.new-deal.white-new-deal
        note: The welfare state was built for white men, and the exclusions were the price the South's planters charged for their votes.
      - tradition: conservatism.paleo
        position: hist.new-deal.unconstitutional-centralization
        note: Washington took powers the Constitution never gave it, and the republic of states became an administrative empire.
      - tradition: marxism.trotskyism
        position: hist.new-deal.disarmed-labor
        note: Capital rescued itself and tied the new industrial unions to the Democratic Party instead of a labor party of their own.

  - id: event.great-terror
    name: The Great Terror
    date: "1936-08"
    end: "1938-11"
    place: USSR
    summary: >-
      Beginning with the first Moscow show trial in August 1936, the Soviet leadership turned the NKVD
      on supposed enemies in the party, the army, the national republics and the population at large.
      Leading Old Bolsheviks, among them Zinoviev, Kamenev and Bukharin, confessed at public trials and
      were shot, and much of the Red Army's senior command was executed. In quota-driven mass
      operations against former kulaks, "anti-Soviet elements" and national minorities such as Poles,
      NKVD records show about 1.5 million arrests and some 680,000 executions in 1937–38. Hundreds of
      thousands more were sent to the labor camps of the Gulag.
    problematic: hist.ussr-stalin
    disputed: >-
      Archive-based totals (Oleg Khlevniuk, J. Arch Getty) put executions at about 680,000–750,000;
      earlier estimates such as Robert Conquest's were higher. Historians debate whether it was
      directed from the top by Stalin (Khlevniuk) or driven partly by regional and bureaucratic
      dynamics (Getty). A few Marxist-Leninist writers (Grover Furr) defend the trials' charges, a
      view nearly all historians reject.
    stances:
      - tradition: marxism.trotskyism
        position: hist.ussr-stalin.degenerated-workers-state
        note: The bureaucracy exterminated the generation that made October in order to secure its own rule.
      - tradition: marxism.maoism
        position: hist.ussr-stalin.crimes-not-necessary
        note: Stalin was a great Marxist who made grave errors, treating contradictions among the people as contradictions with the enemy.
      - tradition: marxism.ml
        position: hist.ussr-stalin.socialism-built
        note: The purges broke a real fifth column on the eve of war, with excesses that the party itself halted in 1938.
      - tradition: marxism.third-camp
        position: hist.ussr-stalin.state-capitalism
        note: The terror completed the victory of the bureaucracy as a new exploiting class over the workers and over what remained of 1917.
      - tradition: liberalism.internationalist
        position: hist.ussr-stalin.totalitarian-twin
        note: Terror as a system of rule, of the same kind as Hitler's, where no one was safe and confession replaced evidence.

  - id: event.spanish-civil-war
    name: The Spanish Civil War
    date: "1936-07-17"
    end: "1939-04-01"
    place: Spain
    summary: >-
      A military rising against the Popular Front government elected in February 1936 failed in
      Madrid, Barcelona and much of the east, setting off a revolution in which unions and militias,
      led by the anarcho-syndicalist CNT in Catalonia and Aragon, collectivized land and industry.
      Germany and Italy sent aircraft, troops and arms to Franco's Nationalists, the Soviet Union armed
      the Republic, and International Brigades of volunteers came from dozens of countries, while
      Britain and France held to non-intervention. In May 1937 street fighting in Barcelona between
      government forces and Communists on one side and anarchists and the POUM on the other ended with
      the POUM banned and its leader Andreu Nin killed in custody. Franco won in April 1939 and ruled
      Spain until his death in 1975.
    disputed: >-
      Total deaths are estimated at 300,000 to over 500,000. Paul Preston estimates about 150,000
      killed by Nationalist repression during and after the war and about 50,000 in the Republican
      zone, including nearly 7,000 clergy. Whether the Republic should have deepened the revolution to
      win the war (anarchists, the POUM, Trotskyists, George Orwell) or put the war first with a broad
      front (Communists, socialists, republicans) is still argued.
    stances:
      - tradition: anarchism.syndicalist
        position: siege.governance.armed-federation
        note: Workers ran the factories and the land in Catalonia and Aragon, and the revolution was defeated as much by the Republic's counter-revolution as by Franco.
      - tradition: marxism.ml
        position: fascism.response.popular-front
        note: Only a popular front of all who defended the Republic could fight fascism, and premature revolution split it.
      - tradition: marxism.trotskyism
        position: fascism.response.workers-united-front
        note: Stalin's popular front strangled the revolution to reassure London and Paris and lost the war it claimed to put first.
      - tradition: conservatism.integralism
        note: The Crusade defended Catholic Spain against the burning of churches and the killing of thousands of priests and religious.
      - tradition: liberalism.social
        note: Britain and France abandoned an elected republic to fascist intervention, a rehearsal for the appeasement that followed.

  - id: event.saltsjobaden-1938
    name: The Saltsjöbaden Agreement
    date: "1938-12-20"
    place: Saltsjöbaden, Sweden
    summary: >-
      After decades of strikes and lockouts, including the general strike of 1909 and the Ådalen
      shootings of 1931 in which soldiers killed five demonstrators, the Swedish Employers'
      Confederation (SAF) and the Swedish Trade Union Confederation (LO) signed the Saltsjöbaden
      Agreement in December 1938. It set procedures for negotiation, limits on industrial action
      against third parties and essential services, and rules on dismissals, so that the two sides
      would settle labor relations without state legislation. It came six years into Social
      Democratic government, which had answered the Depression with public works and a 1933 crisis
      agreement with the Farmers' League. It became a model for the centralized bargaining, solidaristic
      wage policy and welfare state of postwar Sweden.
    problematic: hist.nordic-model
    disputed: >-
      Whether the agreement shows organized labor taming capital (Walter Korpi's power resources
      theory) or employers securing labor peace and keeping control of investment (Marxist critics;
      Peter Swenson argues employers wanted centralized bargaining for their own reasons).
    stances:
      - tradition: socdem.nordic
        position: hist.nordic-model.labor-tamed-capital
        note: Strong unions and a governing labor party brought employers to the table and built the people's home on that foundation.
      - tradition: marxism.trotskyism
        position: hist.nordic-model.class-compromise
        note: The unions traded the strike weapon for a place in managing capitalism, and capital kept command of investment.
      - tradition: marxism.third-worldism
        position: hist.nordic-model.paid-by-the-periphery
        note: Sweden's compromise rested on an export industry that bought cheap raw materials and sold dear, a share in the world drain.
      - tradition: liberalism.classical
        position: hist.nordic-model.markets-built-it
        note: A free contract between private associations, with the state kept out, in an economy already made rich by open trade.
      - tradition: conservatism.national
        position: hist.nordic-model.one-people
        note: The people's home worked because it was the home of one people, with the trust that shared nationhood brings.

  - id: event.ww2
    name: The Second World War
    date: "1939-09-01"
    end: "1945-09-02"
    place: Europe, Asia, Africa and the Pacific
    summary: >-
      Germany's invasion of Poland in September 1939 brought war with Britain and France, joining the
      war Japan had waged in China since 1937. Germany conquered most of continental Europe and in June
      1941 invaded the Soviet Union in a war of annihilation that cost about 27 million Soviet lives,
      and Japan's attacks on Pearl Harbor and on British and Dutch colonies in December 1941 brought
      the United States in. The Red Army's advance from Stalingrad to Berlin, the Western Allies'
      campaigns, and resistance movements from Yugoslavia to China defeated the Axis; Germany
      surrendered in May 1945 and Japan in September, after the United States dropped atomic bombs on
      Hiroshima and Nagasaki. Between 70 and 85 million people died, most of them civilians.
    problematic: hist.ww2
    disputed: >-
      Chinese deaths are estimated at 10 to over 20 million. Whether the atomic bombings were needed to
      end the war (the official US account) or were used with the Soviet Union in mind (Gar Alperovitz)
      is argued. The Molotov–Ribbentrop Pact of August 1939 is read as a betrayal that opened the war
      (liberals, Trotskyists) or as a defensive delay after the Western powers' Munich agreement with
      Hitler (Marxist-Leninists).
    stances:
      - tradition: liberalism.internationalist
        position: hist.ww2.just-war-against-fascism
        note: A just war of the democracies and their allies against fascism, which founded the United Nations and the human rights order.
      - tradition: marxism.ml
        position: hist.ww2.soviet-people-decisive
        note: The Soviet people broke the Nazi war machine at the cost of 27 million lives, while the West delayed the second front.
      - tradition: nationalism.decolonial
        position: hist.ww2.war-of-empires
        note: Empires fought for their colonies with colonial soldiers and colonial famine, and then denied the colonized the freedom they had fought for.
      - tradition: marxism.trotskyism
        position: hist.ww2.several-wars-in-one
        note: An inter-imperialist war, a war of Soviet defense, wars of national liberation and resistance struggles, all at once.
      - tradition: marxism.left-communism
        position: hist.ww2.imperialist-on-both-sides
        note: An imperialist slaughter on every side, in which workers had no camp to choose and antifascism tied them to their own bourgeoisie.
      - tradition: fascism.nazism
        position: hist.ww2.crusade-against-bolshevism
        note: The movement's own account was a defensive war of Europe against Bolshevism and world Jewry, forced on Germany, which it lost.

  - id: event.holocaust
    name: The Holocaust
    date: "1941-06"
    end: "1945-05"
    place: German-occupied Europe
    summary: >-
      Nazi Germany's persecution of Jews, which began with exclusion laws in 1933 and the Nuremberg
      Laws of 1935, became systematic murder after the invasion of the Soviet Union in June 1941, when
      mobile killing units shot Jews in mass executions across the occupied east. From late 1941
      Germany built extermination camps at Chełmno, Bełżec, Sobibór, Treblinka, Majdanek and
      Auschwitz-Birkenau, where Jews deported from across Europe were killed in gas chambers, and the
      Wannsee Conference of January 1942 coordinated the deportations. About six million Jews were
      murdered, roughly two-thirds of Europe's Jews. Roma and Sinti, disabled people, Soviet prisoners
      of war, Poles and others were also murdered in great numbers.
    problematic: hist.ww2
    disputed: >-
      Roma and Sinti deaths are estimated at 200,000 to 500,000, and over 3 million Soviet prisoners
      of war died in German captivity. Historians debate whether the genocide followed a long-held plan
      (intentionalists) or radicalized step by step through war and rivalry among agencies
      (functionalists), and how far it continued colonial violence (Aimé Césaire, Hannah Arendt,
      Jürgen Zimmerer), a comparison others reject as blurring its singularity.
    stances:
      - tradition: nationalism.zionism-labor
        position: hist.ww2.holocaust-rupture
        note: The destruction of European Jewry proved that Jews could rely on no one but themselves and needed a state of their own.
      - tradition: liberalism.internationalist
        position: hist.ww2.holocaust-rupture
        note: A rupture in civilization that gave the world the Genocide Convention, the Universal Declaration and the promise of never again.
      - tradition: marxism.black-radical
        position: fascism.nature.colonialism-come-home
        note: Europe applied to Europeans the methods it had reserved for Africans, Arabs and the peoples of India, as Césaire wrote.
      - tradition: marxism.ml
        position: fascism.nature.finance-capital-dictatorship
        note: The extermination of Jews and the enslavement of Slavs served German monopoly capital's plan for living space and forced labor, and IG Farben built a plant at Auschwitz.
      - tradition: conservatism.christian-democracy
        position: totalitarianism.concept.political-religion
        note: The fruit of a neo-pagan political religion that denied God and the dignity of every human person.

  - id: event.bengal-famine
    name: The Bengal famine
    date: "1943"
    end: "1944"
    place: Bengal, British India
    summary: >-
      Famine in Bengal killed an estimated 2 to 3 million people in 1943–44. It followed the Japanese
      conquest of Burma, which cut rice imports, a cyclone in October 1942, and wartime inflation
      driven by military spending, while the colonial government's denial policy had removed boats and
      rice from coastal districts against a feared invasion. Rice continued to be shipped out of India
      in 1943, and the War Cabinet in London refused or cut requests to import grain. Relief came late,
      after Lord Wavell became Viceroy in October 1943 and set the army to distributing food.
    problematic: hist.ww2
    disputed: >-
      Amartya Sen argued that food supply was not far short and that wartime inflation destroyed
      rural laborers' power to buy food; Mark Tauger and others stress crop disease and a real harvest
      shortfall. How far Churchill and the War Cabinet bear responsibility is disputed between
      Madhusree Mukerjee and defenders such as Arthur Herman.
    stances:
      - tradition: nationalism.decolonial
        position: hist.ww2.war-of-empires
        note: Bengal starved so that an empire's war could be fed, and its dead are left out of the story of the good war.
      - tradition: marxism.third-worldism
        position: hist.ww2.war-of-empires
        note: Colonial India financed the war through forced credits and inflation, and Bengal's poor paid with their lives.
      - tradition: liberalism.social
        note: Famines do not happen where a free press and elected government answer to the hungry, and colonial rule had neither.
      - tradition: conservatism.neo
        note: A wartime famine with many causes, which shipping shortages made hard to relieve, and blaming Churchill alone is anachronistic.
