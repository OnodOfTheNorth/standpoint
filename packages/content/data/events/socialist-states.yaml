# Historical events, 1958–1990: the socialist states in motion, Indonesia, Chile, Iran and Nicaragua.
events:
  - id: event.great-leap-forward
    name: The Great Leap Forward and the famine
    date: "1958-05"
    end: "1962"
    place: China
    summary: >-
      In 1958 the Communist Party launched the Great Leap Forward to overtake Britain's industrial
      output within fifteen years through mass mobilization: peasants were organized into large
      people's communes with communal kitchens, and tens of millions were set to backyard steel
      furnaces and irrigation works. Local officials under political pressure reported inflated
      harvests, the state procured grain and kept exporting it on that basis, and criticism was
      silenced after the 1959 Lushan Conference purged Defense Minister Peng Dehuai. The famine of
      1959–61 was one of the deadliest in recorded history. The leadership retreated from 1961,
      cutting back the communes and grain procurement.
    problematic: hist.china-mao
    disputed: >-
      Excess deaths are estimated from about 15 million to 45 million: about 30 million by Judith
      Banister and other demographers, 36 million by Yang Jisheng, 45 million by Frank Dikötter. Some
      Marxist writers (Utsa Patnaik, Joseph Ball) argue the higher figures rest on flawed demographic
      methods. The party's 1981 resolution acknowledged serious losses and errors.
    stances:
      - tradition: marxism.scc
        position: hist.china-mao.achievements-primary
        note: A serious error of leftist impatience, acknowledged and corrected by the Party, which does not cancel the foundations Mao laid.
      - tradition: liberalism.classical
        position: hist.china-mao.utopian-catastrophe
        note: Utopian planning without prices, property or a free press produced the worst famine in history and silenced anyone who reported it.
      - tradition: marxism.dependency
        position: hist.china-mao.basic-needs-revolution
        note: A catastrophic famine, yet the Mao era as a whole raised life expectancy faster than India, where ordinary deprivation killed more over the decades, as Drèze and Sen observed.
      - tradition: marxism.maoism
        position: hist.china-mao.continuing-revolution
        note: The Leap built rural industry and irrigation by mass initiative, and its hardships came from errors in execution, natural disasters and the Soviet withdrawal of aid.
      - tradition: marxism.trotskyism
        position: hist.china-mao.bureaucratic-squeeze
        note: A bureaucracy answerable to no workers' or peasants' councils squeezed the countryside for industry, and no one dared report the truth up the chain.

  - id: event.indonesia-1965
    name: The Indonesian killings of 1965–66
    date: "1965-10-01"
    end: "1966-03"
    place: Indonesia
    summary: >-
      On the night of 30 September–1 October 1965 a group calling itself the 30 September Movement
      killed six army generals in Jakarta. The army command under General Suharto blamed the Communist
      Party of Indonesia (PKI), then the largest communist party outside the socialist states with about
      three million members, and from October army units and civilian militias, many organized through
      religious groups, killed party members, union and peasant activists, ethnic Chinese and others
      across Java, Bali and Sumatra. Hundreds of thousands more were detained, many for over a decade
      without trial. US officials supplied the army with names of PKI cadres and encouragement, and
      Suharto, who took executive power in March 1966 and ruled until 1998, opened Indonesia to foreign
      investment.
    problematic: hist.indonesia-1965
    disputed: >-
      Deaths are estimated at about 500,000 to 1 million, with some estimates higher. Who organized the
      30 September Movement is disputed: the PKI leadership (the Suharto government's account), a small
      group around PKI chairman Aidit (John Roosa), or dissident officers (Benedict Anderson and Ruth
      McVey). The 2016 International People's Tribunal in The Hague found crimes against humanity;
      Indonesian governments have not accepted its findings.
    stances:
      - tradition: marxism.third-worldism
        position: hist.indonesia-1965.western-backed-extermination
        note: A Western-backed extermination of the largest mass left in the South, which opened the archipelago to foreign capital.
      - tradition: liberalism.internationalist
        position: hist.indonesia-1965.crime-against-humanity
        note: One of the twentieth century's great mass killings, which still awaits truth and justice for victims and their families.
      - tradition: conservatism.traditionalist
        position: hist.indonesia-1965.nation-saved
        note: The nation and its faith were saved from a communist coup in a war of kill or be killed.
      - tradition: marxism.maoism
        position: hist.indonesia-1965.fatal-legal-road
        note: Three million members and no armed force, and the PKI's legal, parliamentary road delivered its cadres unarmed to the army.
      - tradition: nationalism.developmental-state
        position: hist.indonesia-1965.developmental-birth
        note: A terrible beginning to a developmental state that brought decades of growth and cut poverty sharply.
      - tradition: conservatism.neo
        position: hist.indonesia-1965.cold-war-prize
        note: The largest country in Southeast Asia stayed out of the communist bloc, at the height of the war in Vietnam.

  - id: event.cultural-revolution
    name: The Cultural Revolution
    date: "1966-05-16"
    end: "1976-10-06"
    place: China
    summary: >-
      In May 1966 Mao Zedong launched the Great Proletarian Cultural Revolution against "capitalist
      roaders" in the party and called on students organized as Red Guards to attack the party
      headquarters. Schools and universities closed, officials including head of state Liu Shaoqi were
      purged, and teachers, intellectuals and people of "bad class background" were beaten,
      humiliated and killed, while temples, churches and relics were destroyed. Factional fighting
      among mass organizations, including workers' groups that seized power from the Shanghai city
      government in early 1967, was ended by the army, and from 1968 some 17 million urban youths were
      sent down to the countryside. The period ended with Mao's death in September 1976 and the arrest
      of the Gang of Four in October; the party's 1981 resolution held it responsible for the most
      severe setback since 1949.
    problematic: hist.china-mao
    disputed: >-
      Deaths are estimated from several hundred thousand to about 2 million; Andrew Walder and Yang Su
      estimate 750,000 to 1.5 million in rural killings alone. Whether it was a mass movement against a
      new bureaucratic class (Maoists, Alain Badiou) or Mao's struggle against rivals using the masses
      (Roderick MacFarquhar and most historians). Defenders point to the spread of rural health care
      and schooling (Mobo Gao, Dongping Han).
    stances:
      - tradition: marxism.mlm
        position: hist.china-mao.continuing-revolution
        note: The high point of socialism, when the masses were mobilized to stop a new bourgeoisie inside the party from restoring capitalism.
      - tradition: marxism.scc
        position: hist.china-mao.achievements-primary
        note: A grave error launched by Mao and exploited by counter-revolutionary cliques, which the Party has judged and corrected.
      - tradition: conservatism.neo
        position: hist.china-mao.utopian-catastrophe
        note: A utopian frenzy in which children were set on their teachers and parents and a civilization was smashed by decree.
      - tradition: religious.confucian
        position: hist.china-mao.war-on-civilization
        note: A war on China's civilization, its families, its ancestors and Confucius himself, whose damage the country is still repairing.
      - tradition: anarchism.communist
        position: hist.china-mao.bureaucratic-squeeze
        note: Mao used the masses against his rivals, and when Shanghai's workers tried to found a commune he dissolved it and sent in the army.

  - id: event.prague-spring-1968
    name: The Prague Spring and the Warsaw Pact invasion
    date: "1968-01-05"
    end: "1969-04-17"
    place: Czechoslovakia
    summary: >-
      After Alexander Dubček became first secretary of the Czechoslovak Communist Party in January 1968,
      the party ended press censorship and in April adopted an Action Programme promising "socialism
      with a human face," with freedom of speech and assembly; factories elected workers' councils and
      political clubs formed. On the night of 20–21 August armies of the Soviet Union, Poland, Hungary
      and Bulgaria invaded, and about 137 Czechoslovak civilians were killed that year. Dubček was
      replaced by Gustáv Husák in April 1969, and "normalization" purged hundreds of thousands from the
      party and their jobs. The invasion was justified by what became known as the Brezhnev Doctrine of
      limited sovereignty within the socialist bloc.
    problematic: hist.ussr-late
    disputed: >-
      Whether the Prague Spring was a socialist renewal (Dubček, the Eurocommunists, much of the Western
      left) or the beginning of a slide toward capitalism and the West (the Warsaw Pact's case).
      Romania, Yugoslavia, Albania and China all condemned the invasion, for different reasons.
    stances:
      - tradition: marxism.ml
        note: The Warsaw Pact fulfilled its internationalist duty, stopping a counter-revolution that would have opened Czechoslovakia to West German revanchism.
      - tradition: marxism.eurocommunism
        note: Socialism with a human face was the road the Western parties wanted, and the Italian Communists rightly condemned its crushing.
      - tradition: marxism.maoism
        position: hist.ussr-late.capitalism-restored-1956
        note: Soviet social-imperialism treated an ally as a colony, as every imperialism does.
      - tradition: liberalism.internationalist
        position: hist.ussr-late.captive-nations-empire
        note: An empire crushed a people's attempt at reform, proving that the bloc's sovereignty was a fiction.
      - tradition: marxism.trotskyism
        position: hist.ussr-late.bureaucratic-stagnation
        note: The Kremlin bureaucracy feared Prague's workers' councils and free debate more than it feared NATO.

  - id: event.chile-1973
    name: Popular Unity and the Chilean coup
    date: "1970-09-04"
    end: "1973-09-11"
    place: Chile
    summary: >-
      Salvador Allende of the Popular Unity coalition won a 36.6 percent plurality in September 1970 and
      was confirmed by Congress. His government nationalized copper with a unanimous vote of Congress in
      1971, extended land reform and took over banks and large firms, while wages rose and inflation
      then surged. The US government, which had tried to block his inauguration, cut off credit and
      funded opposition parties and newspapers, and employers' and truck owners' strikes in 1972 and
      1973 were met by workers' "industrial cordons" that kept factories running. On 11 September 1973
      the armed forces under Augusto Pinochet bombed the presidential palace, where Allende died, and
      took power; the junta killed or disappeared over 3,000 people and tortured tens of thousands, and
      from 1975 its "Chicago Boys" economists imposed rapid privatization and deregulation.
    problematic: hist.chile-1973
    disputed: >-
      Whether Allende's government broke the constitution (the Chamber of Deputies' resolution of
      August 1973, the Christian Democrats) or the opposition and Washington made the country
      ungovernable (Popular Unity; Peter Kornbluh's documentation of US policy). Whether the economic
      crisis came mainly from wage and money expansion or from the credit blockade and employers'
      strikes is also argued.
    stances:
      - tradition: socdem.democratic-socialism
        position: hist.chile-1973.peaceful-road-destroyed
        note: A road to socialism by votes and law, destroyed by Chilean capital, the generals and Washington.
      - tradition: marxism.guevarism
        position: hist.chile-1973.peaceful-road-a-trap
        note: Allende left the old army intact and the workers unarmed, and the army chose its moment.
      - tradition: conservatism.fusionism
        position: hist.chile-1973.saved-from-communism
        note: The armed forces saved Chile from a Marxist government that had wrecked the economy and was arming for civil war.
      - tradition: conservatism.christian-democracy
        position: hist.chile-1973.tragedy-of-polarization
        note: A tragedy in which both sides broke the rules, and the coup that ended it became a dictatorship no one had voted for.
      - tradition: liberalism.chicago
        position: hist.chile-1973.chicago-miracle
        note: The reforms that followed made Chile the most prosperous country in Latin America.
      - tradition: marxism.dependency
        position: hist.chile-1973.first-neoliberal-laboratory
        note: An imperialist coup for copper that made Chile the first laboratory of neoliberalism, tested on a population under terror.

  - id: event.iranian-revolution
    name: The Iranian Revolution
    date: "1978-01"
    end: "1979-12"
    place: Iran
    summary: >-
      Protests against the Shah that began in January 1978 grew into mass demonstrations and strikes,
      including an oil workers' strike that halted exports, uniting clergy, bazaar merchants, students,
      workers and secular and leftist parties. The Shah left Iran on 16 January 1979, Ayatollah Ruhollah
      Khomeini returned from exile on 1 February, and the army declared its neutrality on 11 February. A
      referendum in March approved an Islamic Republic, and the December 1979 constitution placed
      final authority in the guardianship of the Islamic jurist, held by Khomeini. Between 1981 and
      1983 the new state suppressed the Mojahedin, the Fedaian, the Tudeh party and liberal opponents,
      and in 1988 it executed thousands of political prisoners.
    problematic: hist.iranian-revolution
    disputed: >-
      Deaths in the revolution are estimated at about 2,000 to 3,000 (Emad Baghi's study), far below the
      60,000 claimed at the time; the 1988 prison executions at about 2,800 to over 5,000. Whether the
      clergy's victory followed from its networks and Khomeini's authority, or was a hijacking of a
      broad revolution (Iranian left and liberal accounts, Ervand Abrahamian), is debated.
    stances:
      - tradition: religious.islamism-khomeinist
        position: hist.iranian-revolution.islamic-revolution
        note: An Islamic revolution that restored God's law, ended American domination and gave power to the oppressed.
      - tradition: socdem.democratic-socialism
        position: hist.iranian-revolution.hijacked
        note: Workers, students and the left made the revolution together with the mosques, and the clergy then turned on all of them.
      - tradition: nationalism.bolivarianism
        position: hist.iranian-revolution.anti-imperialist-break
        note: An anti-imperialist revolution broke the United States' hold on Iran and its oil, and has stood under siege ever since.
      - tradition: conservatism.monarchist
        position: hist.iranian-revolution.theocratic-reaction
        note: A theocratic reaction threw away a modernizing nation and its ancient crown.
      - tradition: religious.islamic-socialism
        position: hist.iranian-revolution.red-shiism-betrayed
        note: Shariati's red Shiism of the oppressed fired the revolution, and the clerical establishment betrayed it.
      - tradition: marxism.left-communism
        position: hist.iranian-revolution.change-of-owners
        note: The oil workers' councils were crushed and capital changed owners, from the Shah's court to the clergy's foundations, while class rule stayed.

  - id: event.deng-reform-1978
    name: Reform and opening in China
    date: "1978-12-18"
    end: "1992"
    place: China
    summary: >-
      The Third Plenum of the Communist Party's Eleventh Central Committee in December 1978, under Deng
      Xiaoping's leadership, made economic development the party's central task. Rural communes were
      replaced by the household responsibility system, which let families farm allotted land and sell
      output above quotas; Special Economic Zones opened from 1980 at Shenzhen and other coastal cities
      to foreign investment; and prices were freed gradually under a dual-track system rather than all
      at once. State enterprises stayed central until the 1990s, when many were restructured and tens of
      millions of workers lost their jobs. By World Bank counts the number of Chinese in extreme poverty
      fell by roughly 800 million between 1981 and the late 2010s, while inequality rose sharply.
    problematic: hist.china-reform
    disputed: >-
      Whether the reform era was socialism using markets (the party), capitalist restoration (Maoists,
      many Trotskyists), or a developmental state's success that avoided shock therapy (Giovanni
      Arrighi, Isabella Weber). How far the gains rested on Mao-era land reform, health care and
      literacy is debated.
    stances:
      - tradition: marxism.scc
        position: hist.china-reform.primary-stage
        note: Socialism in its primary stage must develop the productive forces, and reform lifted hundreds of millions from poverty under the Party's leadership.
      - tradition: marxism.mlm
        position: hist.china-reform.capitalist-restoration
        note: The capitalist roaders Mao warned of took power and restored capitalism under the red flag.
      - tradition: liberalism.chicago
        position: hist.china-reform.markets-freed-people
        note: When the state let farmers and firms keep what they earned, markets did what planning never could.
      - tradition: nationalism.developmental-state
        position: hist.china-reform.developmental-state
        note: A strong state steered markets step by step and escaped the shock therapy that wrecked Russia.
      - tradition: marxism.third-worldism
        position: hist.china-reform.workshop-of-the-world
        note: China became the world's workshop, where cheap labor fed the profits of core corporations.

  - id: event.nicaraguan-revolution
    name: The Nicaraguan Revolution and the Contra war
    date: "1979-07-19"
    end: "1990-02-25"
    place: Nicaragua
    summary: >-
      The Sandinista National Liberation Front (FSLN), with broad support that included business groups
      and church base communities, overthrew Anastasio Somoza Debayle in July 1979, ending a family
      dynasty in power with US backing since the 1930s. The Sandinista government took over the Somoza
      family's property, carried out land reform and a 1980 literacy crusade, and won the 1984
      elections. The United States armed and funded the Contra insurgency from Honduras and mined
      Nicaragua's harbors, for which the International Court of Justice ruled against it in 1986; about
      30,000 people died in the Contra war. War, a US trade embargo and economic collapse preceded the
      FSLN's defeat by Violeta Chamorro's opposition coalition in the February 1990 election.
    problematic: hist.cold-war
    disputed: >-
      The fairness of the 1984 election, from which the main opposition coalition withdrew, was judged
      differently by observers. The forced relocation of Miskito communities in 1982 and the
      Iran–Contra affair, in which US officials funded the Contras from secret arms sales to Iran, remain
      contested episodes.
    stances:
      - tradition: religious.liberation-theology
        position: hist.cold-war.counter-revolution-in-the-south
        note: A revolution in which priests served as ministers and the poor learned to read was bled by an empire's proxy army.
      - tradition: conservatism.fusionism
        position: hist.cold-war.victory-over-evil
        note: The Contras were freedom fighters against a Soviet and Cuban outpost on the American mainland.
      - tradition: marxism.ml
        position: hist.cold-war.two-camps
        note: Nicaragua showed that a revolution needs the socialist camp's support to survive imperialism's siege.
      - tradition: liberalism.social
        note: The Sandinistas built a party-state, but they handed over power when they lost in 1990.
      - tradition: nationalism.indigenous-sovereignty
        position: indigenous.sovereignty.inherent-nationhood
        note: The Miskito and other Atlantic Coast peoples were forced from their villages by a revolution that saw only peasants, and won autonomy in 1987 by fighting for it.
