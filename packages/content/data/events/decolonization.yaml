# Historical events, 1945–1975: wars of liberation and the end of formal empire.
events:
  - id: event.vietnamese-revolution
    name: The Vietnamese Revolution and the wars for reunification
    date: "1945-08-19"
    end: "1975-04-30"
    place: Vietnam, with Laos and Cambodia
    summary: >-
      In August 1945 the Viet Minh, led by the Indochinese Communist Party, took power across Vietnam
      as Japan surrendered, and Ho Chi Minh declared the Democratic Republic of Vietnam on 2 September.
      France fought to restore its rule until its defeat at Dien Bien Phu in 1954; the Geneva Accords
      divided the country at the 17th parallel pending elections in 1956, which the US-backed southern
      government refused to hold. The United States escalated from advisers to over half a million
      troops by 1968 and bombed North Vietnam, Laos and Cambodia, while the National Liberation Front
      fought in the south. After the 1973 Paris Peace Accords US forces withdrew, northern forces took
      Saigon on 30 April 1975, and Vietnam was reunified in 1976.
    problematic: hist.vietnamese-revolution
    disputed: >-
      Vietnamese deaths in the American war are estimated from about 1 million to over 3 million (the
      Vietnamese government's figure is about 3 million). Whether the South was a separate nation
      invaded from the North (US official accounts, many South Vietnamese) or half of one nation
      divided by outside powers (most historians of Vietnam). The Viet Minh killed Trotskyist leaders
      such as Tạ Thu Thâu in 1945, and the northern land reform of 1953–56 executed thousands.
    stances:
      - tradition: marxism.ml
        position: hist.vietnamese-revolution.national-liberation
        note: A thirty-year war of national liberation, led by communists, for independence, unity and socialism against France and then the United States.
      - tradition: marxism.guevarism
        position: hist.vietnamese-revolution.peoples-war-proved
        note: A peasant nation defeated the strongest empire on earth, and the task was to create two, three, many Vietnams.
      - tradition: conservatism.neo
        position: hist.vietnamese-revolution.defensible-war-lost
        note: A defensible war to save South Vietnam from communism, won on the battlefield by 1972 and lost in Congress and the press.
      - tradition: liberalism.internationalist
        position: hist.vietnamese-revolution.tragic-mistake
        note: The United States mistook a nationalist civil war for a Cold War front and blundered into a tragedy.
      - tradition: marxism.trotskyism
        position: hist.vietnamese-revolution.stalinists-stopped-short
        note: A heroic revolution whose Stalinist leadership murdered the Trotskyists of Saigon and accepted partition at Geneva at Moscow's and Beijing's urging.
      - tradition: religious.engaged-buddhism
        position: hist.vietnamese-revolution.both-sides-war-on-peasants
        note: As Thich Nhat Hanh said, both sides waged war on the peasants, and those who called for peace were persecuted by both.

  - id: event.mau-mau-emergency
    name: The Mau Mau war and the Kenya Emergency
    date: "1952-10-20"
    end: "1960-01-12"
    place: Kenya
    summary: >-
      The "Land and Freedom Army," known as Mau Mau and drawn mainly from Kikuyu peasants and squatters
      dispossessed by white settlement in Kenya's highlands, took up arms against British rule and
      settler land. The colonial government declared an emergency in October 1952, jailed Jomo Kenyatta
      and other nationalists, and held tens of thousands of Kenyans in detention camps where torture and
      forced labor were systematic; over 1,000 Kenyans were hanged. Official figures counted about
      11,000 rebels killed, against 32 European settler civilians; the rebels also killed many
      Africans loyal to the government. Kenya became independent in 1963 under Kenyatta, and in 2013
      the British government paid compensation to over 5,000 surviving victims of torture.
    problematic: hist.decolonization
    disputed: >-
      Detainees are put at about 80,000 at any one time in official figures and up to 320,000 over the
      emergency by Caroline Elkins; total Kenyan deaths at about 11,000 officially and far higher by
      Elkins and David Anderson. Whether Mau Mau was a national liberation movement or also a Kikuyu
      civil war between rebels and loyalists is debated.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.decolonization.liberation-won
        note: The Land and Freedom Army forced Britain out of Kenya, and the camps show what the empire did to stay.
      - tradition: marxism.dependency
        position: hist.decolonization.flag-independence
        note: The fighters won independence and lost the land, which Kenyatta's government left to settlers or sold on market terms to a new African elite.
      - tradition: conservatism.neo
        position: hist.decolonization.empire-left-order
        note: A brutal insurgency that murdered loyal Africans and settlers was defeated, abuses and all, and Britain left a functioning state.
      - tradition: liberalism.social
        note: The torture camps were a crime the British state hid for half a century, until survivors forced the files open in court.

  - id: event.bandung-1955
    name: The Bandung Conference
    date: "1955-04-18"
    end: "1955-04-24"
    place: Bandung, Indonesia
    summary: >-
      Representatives of 29 Asian and African states, most of them recently independent, met at
      Bandung at the invitation of Indonesia, India, Burma, Ceylon and Pakistan. Leaders including
      Sukarno, Jawaharlal Nehru, Zhou Enlai, Gamal Abdel Nasser and U Nu condemned colonialism "in all
      its manifestations" and adopted ten principles of respect for sovereignty, non-interference and
      peaceful coexistence. The conference prepared the way for the Non-Aligned Movement, founded in
      Belgrade in 1961, and for the Group of 77 at the United Nations in 1964.
    problematic: hist.decolonization
    disputed: >-
      Whether Bandung marked a common Southern project or papered over a split between Western-aligned
      states (Pakistan, the Philippines, Turkey) and neutralists. Western-aligned delegates read
      "colonialism in all its manifestations" as including Soviet rule in Eastern Europe.
    stances:
      - tradition: nationalism.nasserism
        position: hist.cold-war.non-alignment
        note: The peoples of Asia and Africa refused to be pawns in a quarrel of the North and claimed their own place in the world.
      - tradition: marxism.third-worldism
        position: hist.decolonization.liberation-won
        note: The colonized met for the first time without their masters, and the spirit of Bandung was the South's claim to make history.
      - tradition: marxism.maoism
        position: contradiction.primary.imperialism-vs-oppressed
        note: New China joined the Asian and African peoples in a united front against imperialism and colonialism.
      - tradition: liberalism.internationalist
        position: hist.decolonization.self-determination
        note: New nations claimed equal standing under the principles of the UN Charter, and the Charter's promise widened.
      - tradition: conservatism.neo
        position: hist.cold-war.victory-over-evil
        note: Neutrality between freedom and communism was an illusion, as John Foster Dulles said, and several of the neutrals drifted toward Moscow.

  - id: event.suez-1956
    name: The Suez crisis
    date: "1956-07-26"
    end: "1957-03"
    place: Egypt
    summary: >-
      Egypt's president Gamal Abdel Nasser nationalized the Suez Canal Company in July 1956, a week
      after the United States and Britain withdrew offers to fund the Aswan High Dam, and promised to
      compensate shareholders. Under a secret plan agreed at Sèvres, Israel invaded Sinai on 29
      October, and Britain and France bombed Egypt and landed troops at Port Said. Under pressure from
      the United States, which withheld support for the pound, and from the Soviet Union, they accepted
      a ceasefire on 6 November and withdrew, and a UN force was deployed; Israel left Sinai in March
      1957. British prime minister Anthony Eden resigned, and Nasser emerged as the leading figure of
      Arab nationalism.
    problematic: hist.decolonization
    disputed: >-
      Egyptian deaths are estimated at about 1,000 to 3,000, including civilians in Port Said. Britain
      and France cast Nasser as a threat to world trade, and France also targeted his support for
      Algeria's FLN; Egypt and most of the South saw a sovereign state lawfully taking over a company on
      its own territory.
    stances:
      - tradition: nationalism.nasserism
        position: intl.sovereignty.nations-set-own-course
        note: Egypt took back its canal and stood off three armies, restoring Arab dignity after a century of foreign control.
      - tradition: marxism.ml
        note: The Egyptian people's resistance and Soviet warnings defeated the tripartite imperialist aggression.
      - tradition: conservatism.national
        note: Eden was right that Nasser threatened Britain's lifeline, and the humiliation came from Washington, not Cairo.
      - tradition: nationalism.zionism-labor
        note: Israel struck to end raids from Gaza and the blockade of the Straits of Tiran, and won ten years of quiet on its southern border.
      - tradition: liberalism.internationalist
        note: The United States and the UN enforced the Charter even against America's closest allies.

  - id: event.ghana-independence
    name: Ghana's independence and the overthrow of Nkrumah
    date: "1957-03-06"
    end: "1966-02-24"
    place: Ghana
    summary: >-
      The Gold Coast became independent as Ghana on 6 March 1957 under Kwame Nkrumah, whose Convention
      People's Party had won elections under British rule after campaigns of strikes and boycotts.
      Nkrumah's government invested cocoa revenue in schools, roads, the Akosombo dam and state
      industry, hosted the 1958 All-African People's Conference, and made Ghana a one-party state in
      1964. Falling world cocoa prices in the 1960s squeezed the budget and foreign debt grew. On 24
      February 1966, while Nkrumah was abroad, the army and police overthrew him, and he died in exile in
      1972.
    problematic: hist.decolonization
    disputed: >-
      Declassified US papers show Washington knew of and welcomed the 1966 coup; how far the CIA or
      Britain helped bring it about is disputed. Whether Nkrumah's economic program failed through
      overreach, taxation of cocoa farmers and corruption (Robert Bates) or through the cocoa price
      collapse and creditor pressure is debated.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.decolonization.flag-independence
        note: Nkrumah warned in 1965 that neocolonialism was the last stage of imperialism, and the coup that followed proved him right.
      - tradition: marxism.african-socialism
        position: hist.decolonization.liberation-won
        note: Ghana's independence opened the way for the rest, and Accra became a capital of African liberation.
      - tradition: liberalism.chicago
        position: poverty.cause.misrule
        note: The cocoa marketing board taxed farmers to fund prestige projects and a one-party state, and the treasury was empty before the coup.
      - tradition: liberalism.internationalist
        position: hist.decolonization.self-determination
        note: A colony became a sovereign nation by elections and negotiation, a model for peaceful transfer of power.

  - id: event.congo-lumumba
    name: Congo's independence and the killing of Lumumba
    date: "1960-06-30"
    end: "1961-01-17"
    place: Congo (Léopoldville)
    summary: >-
      The Belgian Congo became independent on 30 June 1960 with Patrice Lumumba as prime minister, who
      answered King Baudouin at the ceremony with a speech recalling the humiliations of colonial rule.
      Within weeks the army mutinied against its Belgian officers, Belgian troops intervened, and the
      mineral-rich province of Katanga seceded under Moïse Tshombe with Belgian and mining-company
      support. When the UN force would not end the secession, Lumumba sought Soviet aid; President
      Kasa-Vubu dismissed him in September and army chief Joseph-Désiré Mobutu took power. Lumumba was
      arrested, flown to Katanga and shot on 17 January 1961 by Katangan forces with Belgian officers
      present; the CIA had earlier plotted to poison him.
    problematic: hist.decolonization
    disputed: >-
      A Belgian parliamentary inquiry in 2001 found Belgium bore moral responsibility for the killing;
      the US Church Committee in 1975 documented the CIA poisoning plot but found no proof the CIA
      carried out the killing. Western Cold War accounts blamed Lumumba's own conduct for the crisis.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.decolonization.flag-independence
        note: Lumumba was killed for insisting that Congo's independence include its wealth, and the mining companies kept Katanga.
      - tradition: marxism.third-worldism
        position: hist.cold-war.counter-revolution-in-the-south
        note: The first great Cold War murder in Africa installed Mobutu, who served the West and its mining houses for thirty years.
      - tradition: nationalism.decolonial
        position: hist.decolonization.coloniality-remains
        note: Belgium left a country with a handful of university graduates and its mines in Belgian hands, then removed the man who objected.
      - tradition: liberalism.internationalist
        note: A new state collapsed into mutiny and secession, and the UN's first large peace operation could neither save its government nor stay neutral.
      - tradition: conservatism.neo
        position: hist.cold-war.victory-over-evil
        note: Lumumba's turn to Moscow risked a Soviet foothold in the heart of Africa, and Mobutu kept Congo in the Western camp.

  - id: event.algerian-war
    name: The Algerian war of independence
    date: "1954-11-01"
    end: "1962-07-05"
    place: Algeria and France
    summary: >-
      The National Liberation Front (FLN) launched an armed rising on 1 November 1954 against French
      rule in Algeria, where about a million European settlers held most of the best land and
      political power. France deployed some 400,000 troops, moved over two million rural Algerians into
      regroupment camps, and used torture systematically, notably in the Battle of Algiers in 1957; the
      FLN attacked settlers, rival nationalists and Algerians who served France. The war brought down
      the Fourth Republic in 1958 and returned de Gaulle to power. The Évian Accords of March 1962 led to
      independence on 5 July 1962, after which most settlers left and thousands of harkis who had
      fought for France were killed.
    problematic: hist.decolonization
    disputed: >-
      Algerian deaths are estimated from about 300,000 (most French historians) to 1.5 million (the
      Algerian state's figure), and harki deaths after independence from about 15,000 to over 100,000.
      Whether FLN violence was the colonized's legitimate answer to colonial violence (Fanon, Sartre)
      or terror that matched the army's (Albert Camus's position) is still argued.
    stances:
      - tradition: marxism.black-radical
        position: violence.political.anti-colonial
        note: Colonialism is violence in its natural state and yields only to greater violence, as Fanon wrote from inside the FLN.
      - tradition: marxism.arab-socialism
        position: hist.decolonization.liberation-won
        note: A million martyrs won Algeria's independence, and Algiers became a capital of the world's liberation movements.
      - tradition: conservatism.gaullism
        note: De Gaulle saw that Algeria could not stay French without ruining France, and chose the nation's future over a settler empire.
      - tradition: conservatism.reactionary
        position: hist.decolonization.empire-left-order
        note: Algeria was France, abandoned by de Gaulle, and the settlers and harkis paid with exile and death.
      - tradition: liberalism.social
        note: Systematic torture by the army dishonored the Republic and corrupted the cause it claimed to defend.

  - id: event.bangladesh-1971
    name: The Bangladesh Liberation War
    date: "1971-03-25"
    end: "1971-12-16"
    place: East Pakistan (Bangladesh)
    summary: >-
      After the Awami League, led by Sheikh Mujibur Rahman, won a majority in Pakistan's December 1970
      elections on a program of autonomy for East Pakistan, the military government postponed the
      assembly and on 25 March 1971 launched Operation Searchlight, in which the army killed students,
      intellectuals, Hindus and Awami League supporters. Bengali forces declared independence and
      fought a guerrilla war, and about 10 million refugees fled to India. India intervened in December,
      and Pakistani forces in the east surrendered on 16 December 1971. The United States and China
      backed Pakistan, and the Soviet Union backed India.
    disputed: >-
      Deaths are estimated from about 300,000 to 3 million (the Bangladeshi government's figure), and
      sexual violence against women at 200,000 to 400,000 by Bangladeshi estimates, with some
      researchers giving lower figures. Bangladesh calls it genocide; Pakistan rejects the term.
    stances:
      - tradition: nationalism.civic
        note: A people denied the government it had elected won its own state in a war of liberation.
      - tradition: liberalism.internationalist
        position: intervention.humanitarian.responsibility-to-protect
        note: India's intervention stopped a genocide, an early case for the principle that sovereignty does not cover mass atrocity.
      - tradition: religious.islamism-brotherhood
        note: Jamaat-e-Islami held that the unity of Pakistan as a Muslim homeland had to be defended against an Indian-backed secession.
      - tradition: marxism.ml
        note: The Soviet Union stood with India and the Bengali people, while Washington and Beijing backed the generals.

  - id: event.carnation-revolution
    name: The Carnation Revolution
    date: "1974-04-25"
    end: "1975-11-25"
    place: Portugal and its African colonies
    summary: >-
      On 25 April 1974 the Armed Forces Movement, junior officers worn down by thirteen years of
      colonial war in Angola, Mozambique and Guinea-Bissau, overthrew the Estado Novo dictatorship
      founded by Salazar, and crowds filled Lisbon's streets with carnations. Over the next eighteen
      months workers occupied factories, farm laborers took over estates in the Alentejo, banks and
      major industries were nationalized, and Communist, socialist and far-left forces contested the
      revolution's direction. Portugal recognized Guinea-Bissau's independence in 1974, and Mozambique,
      Cape Verde, São Tomé and Príncipe and Angola became independent in 1975. An action by officers
      aligned with the Socialist Party and the center on 25 November 1975 ended the revolutionary
      period, and a parliamentary constitution was adopted in 1976.
    problematic: hist.decolonization
    disputed: >-
      Whether the revolution was made in Lisbon by officers or in Africa by the liberation movements
      whose wars broke the army (the PAIGC, FRELIMO and MPLA view, shared by many historians), and
      whether 25 November 1975 saved parliamentary government from a Communist seizure (Socialists,
      liberals) or ended a workers' revolution (the far left).
    stances:
      - tradition: marxism.african-socialism
        position: hist.decolonization.liberation-won
        note: The revolution in Lisbon was won in the bush of Guinea, Mozambique and Angola, where Cabral's PAIGC and FRELIMO broke the colonial army.
      - tradition: socdem.revisionist
        position: elections.role.main-road
        note: The Socialists defended parliamentary government against a minority's attempt to seize the revolution, and Portugal joined Europe as a democracy of the ballot.
      - tradition: marxism.ml
        note: The Communist Party led the workers in nationalizing the monopolies and carrying out land reform, the April gains written into the 1976 constitution.
      - tradition: marxism.trotskyism
        note: Workers' commissions and land occupations posed the question of power, and the Communist Party's alliance with the officers let the moment pass.
      - tradition: conservatism.christian-democracy
        note: Portugal escaped one dictatorship without falling into another.

  - id: event.nieo-1974
    name: The oil shock and the call for a New International Economic Order
    date: "1973-10"
    end: "1974-12-12"
    place: OPEC states and the United Nations, New York
    summary: >-
      In October 1973, during the Arab–Israeli war, Arab oil exporters cut production and embargoed the
      United States and the Netherlands, and OPEC members quadrupled the posted price of oil within
      months, taking control of a resource long priced by Western companies. In May 1974 the UN General
      Assembly, on the initiative of the Group of 77 and the Non-Aligned Movement, adopted the
      Declaration on the Establishment of a New International Economic Order, claiming permanent
      sovereignty over natural resources, the right to nationalize, stable commodity prices, transfer
      of technology and reform of the monetary system. The Charter of Economic Rights and Duties of
      States followed in December 1974 over the opposition of the United States, Britain, West Germany
      and three other states. Little of the program was carried out, and the debt crisis of the 1980s
      ended it.
    problematic: hist.decolonization
    disputed: >-
      Whether OPEC's price rise was a transfer from core to periphery or mainly a gain for oil-exporting
      elites that hurt oil-importing poor countries, whose debts grew as petrodollars were recycled
      through Western banks.
    stances:
      - tradition: marxism.third-worldism
        position: imperialism.nature.unequal-exchange-drain
        note: The South tried to set the prices of its own raw materials and labor, and the core answered with the debt crisis.
      - tradition: nationalism.pan-africanism
        position: intl.institutions.build-alternatives
        note: Political independence needed economic independence, and the South had to build its own institutions to win it.
      - tradition: liberalism.chicago
        position: development.path.integration
        note: Cartels and expropriation scare off the investment poor countries need, and East Asia grew by opening to world markets instead.
      - tradition: liberalism.social
        position: intl.institutions.reform-democratize
        note: Fair commodity agreements and reformed institutions could have reconciled North and South, as the Brandt Report later urged.
