# Historical events, 1947–1962: partition, the Chinese Revolution and the early Cold War.
events:
  - id: event.partition-of-india
    name: The Partition of India
    date: "1947-08-14"
    end: "1948"
    place: British India (India, Pakistan and what became Bangladesh)
    summary: >-
      Britain's withdrawal in August 1947 divided British India into India and Pakistan, whose eastern
      wing later became Bangladesh, along a boundary drawn by Cyril Radcliffe in five weeks and
      published two days after independence. Communal violence, already severe since the Calcutta
      killings of August 1946, became mass killing in Punjab and Bengal as some 10 to 20 million people
      crossed the new borders. Tens of thousands of women were abducted, raped or killed, some by their
      own families. The accession of Kashmir to India in October 1947 led to the first war between the
      two new states.
    problematic: hist.partition-india
    disputed: >-
      Deaths are estimated from about 200,000 (a contemporary British figure) to 2 million. Historians
      divide responsibility between British divide-and-rule and haste (Congress and many historians),
      the Muslim League's separatism (Indian nationalist and Hindutva accounts), and the Congress
      leaders' refusal of a looser federation under the 1946 Cabinet Mission plan (Ayesha Jalal).
    stances:
      - tradition: nationalism.civic
        position: hist.partition-india.divide-and-rule
        note: The final act of British divide and rule, which had separated electorates by religion for forty years and then left in a hurry.
      - tradition: nationalism.ethnic
        position: hist.partition-india.muslim-homeland
        note: In the Pakistani national account, the Muslims of the subcontinent were a nation and won a homeland rather than live as a permanent minority.
      - tradition: nationalism.hindutva
        position: hist.partition-india.vivisection
        note: The motherland was vivisected by Muslim separatism, appeased by a Congress leadership that would not defend the Hindu nation.
      - tradition: marxism.ml
        position: hist.partition-india.elite-bargain
        note: A deal among the British, the Congress bourgeoisie and the League's landlords that cut off the 1946 naval mutiny and the peasant risings of Tebhaga and Telangana.
      - tradition: feminism.decolonial
        position: hist.partition-india.the-peoples-suffering
        note: Women's bodies became the border, and their abduction, rape and silencing were the part of Partition that neither state wanted told.
      - tradition: nationalism.ambedkarite
        position: hist.partition-india.separation-better
        note: Ambedkar had argued that if Muslims sought a separate state, a clean separation might serve better than a forced union, and the Dalit question remained on both sides of the line.

  - id: event.nakba
    name: The Nakba and the 1948 war
    date: "1947-11-30"
    end: "1949-07-20"
    place: Mandatory Palestine
    summary: >-
      After the UN General Assembly voted in November 1947 to partition Mandatory Palestine, fighting
      broke out between Zionist and Palestinian Arab forces, and the armies of Arab states entered
      after Israel declared independence on 14 May 1948. By the 1949 armistices Israel held about 78
      percent of Mandatory Palestine, Jordan held the West Bank and Egypt the Gaza Strip. About 700,000
      to 750,000 Palestinians, more than half the Arab population, fled or were expelled, and over 400
      Palestinian villages were emptied and most later destroyed; massacres such as Deir Yassin in
      April 1948 spurred flight. Israel barred the refugees' return, despite UN General Assembly
      Resolution 194 of December 1948, and took over their land and property.
    problematic: hist.nakba-1948
    disputed: >-
      Whether expulsion was planned: Walid Khalidi and Ilan Pappé read Plan Dalet of March 1948 as a
      blueprint for expulsion; Benny Morris concludes the exodus was born of war, not design, with many
      local expulsions; the older Israeli account that Arab leaders ordered Palestinians to leave has
      found no support in the documents. Refugee estimates range from about 520,000 (Israeli) to over
      900,000 (Palestinian). Israeli accounts set the exodus of Jews from Arab countries after 1948
      beside it as a population exchange, a comparison Palestinian historians reject.
    stances:
      - tradition: nationalism.palestinian
        position: hist.nakba-1948.planned-expulsion
        note: A planned ethnic cleansing of Palestine, in which a people was driven from its land and forbidden to return.
      - tradition: nationalism.decolonial
        position: hist.nakba-1948.ongoing-structure
        note: Not one event but the founding of a settler-colonial structure that continues in every demolition and every refugee camp.
      - tradition: nationalism.zionism-labor
        position: hist.nakba-1948.war-of-independence
        note: Israel's war of independence, forced on a small community by Arab rejection of partition and the invasion of five armies.
      - tradition: liberalism.internationalist
        position: hist.nakba-1948.born-of-war
        note: A tragedy born of war, a mix of flight, fear and expulsion, whose refugee question must be settled in a negotiated peace.
      - tradition: nationalism.zionism-revisionist
        position: hist.nakba-1948.population-exchange
        note: One of the era's population exchanges, matched by the Jews driven from Arab lands, who were absorbed while the Arab states kept their refugees in camps.
      - tradition: religious.religious-zionism
        position: hist.nakba-1948.redemption
        note: The return of the Jewish people to the land promised to it, a stage in divine redemption.

  - id: event.tito-stalin-split
    name: The Tito–Stalin split
    date: "1948-06-28"
    place: Yugoslavia
    summary: >-
      After disputes over Yugoslavia's independent policy in the Balkans and over Soviet advisers and
      joint companies, the Cominform expelled the Yugoslav Communist Party in June 1948, accusing it of
      nationalism. Yugoslavia, whose partisans had liberated most of the country themselves, refused
      to submit and imprisoned thousands of Cominform supporters, many in the Goli Otok camp. In 1950
      it introduced workers' councils in enterprises, the start of its self-management system. It took
      Western aid and loans while remaining a one-party socialist state, and in 1961 Belgrade hosted
      the founding conference of the Non-Aligned Movement.
    problematic: hist.yugoslavia
    disputed: >-
      Whether the split came from Tito's ambitions in Albania and a Balkan federation or from Stalin's
      demand for control, and whether self-management was real workers' power or a form of party rule
      that leaned increasingly on markets (Milovan Djilas, Branko Horvat and Susan Woodward differ).
    stances:
      - tradition: marxism.market-socialism
        position: hist.yugoslavia.self-management
        note: Freed from Moscow, Yugoslavia began the most far-reaching experiment in workers' self-management any state has tried.
      - tradition: marxism.third-worldism
        position: hist.yugoslavia.non-aligned
        note: A socialist country refused both blocs and went on to lead the Non-Aligned, proof that the South had a road of its own.
      - tradition: marxism.hoxhaism
        position: hist.yugoslavia.revisionist-capitalism
        note: Tito betrayed Marxism-Leninism, took imperialist money and opened the road to capitalism, and Albania stood with Stalin.
      - tradition: marxism.third-camp
        position: hist.yugoslavia.new-class
        note: As Djilas showed, the break with Stalin left a new class of party officials ruling in the workers' name.

  - id: event.chinese-revolution
    name: The Chinese Revolution
    date: "1946-06"
    end: "1949-10-01"
    place: China
    summary: >-
      After Japan's surrender, civil war between the Kuomintang government and the Communist Party
      resumed in 1946. The Communists, whose base areas had grown during the war against Japan,
      carried out land reform where they ruled and won the Liaoshen, Huaihai and Pingjin campaigns of
      1948–49, taking Beijing, Nanjing and Shanghai in 1949. Mao Zedong proclaimed the People's
      Republic of China on 1 October 1949, and the Kuomintang government withdrew to Taiwan. Land
      reform, carried across the country by 1952, gave landlords' land to peasants, and large numbers
      of landlords were killed after mass struggle meetings.
    problematic: hist.chinese-revolution
    disputed: >-
      Deaths in land reform and the campaigns of the early 1950s are estimated from about 1 million to
      several million. Historians debate whether victory came chiefly from peasant mobilization and
      land reform (William Hinton, Mark Selden), from wartime peasant nationalism (Chalmers Johnson),
      or from Kuomintang corruption, hyperinflation and exhaustion (Lloyd Eastman).
    stances:
      - tradition: marxism.maoism
        position: hist.chinese-revolution.new-democratic
        note: A new-democratic revolution of workers and peasants under Communist leadership overthrew imperialism, feudalism and bureaucrat capital.
      - tradition: marxism.scc
        position: hist.chinese-revolution.wealth-and-power
        note: The Chinese people stood up after a century of humiliation, and the founding of New China began the road to national rejuvenation.
      - tradition: nationalism.three-principles
        position: hist.chinese-revolution.communist-conquest
        note: A Communist conquest backed by Moscow drove the Republic of China to Taiwan, where Sun Yat-sen's principles were kept.
      - tradition: liberalism.classical
        position: hist.chinese-revolution.tragedy-of-liberation
        note: A violent conquest whose land reform and campaigns killed millions and replaced one dictatorship with a far more total one.
      - tradition: marxism.third-camp
        position: hist.chinese-revolution.state-capitalist
        note: A peasant army led by intellectuals carried out a national revolution that built state capitalism, with the urban workers as spectators.
      - tradition: religious.confucian
        position: hist.chinese-revolution.mandate-of-heaven
        note: A failing dynasty lost the Mandate of Heaven and a new house took it, as in China's long cycle.

  - id: event.korean-war
    name: The Korean War
    date: "1950-06-25"
    end: "1953-07-27"
    place: Korea
    summary: >-
      Korea, a Japanese colony since 1910, was divided at the 38th parallel by the United States and the
      Soviet Union in 1945, and separate states were proclaimed in 1948 amid insurgency and repression
      in the south. In June 1950 northern forces invaded the south; a US-led United Nations force drove
      them back nearly to the Chinese border, and Chinese People's Volunteers then entered and pushed
      the front back near the 38th parallel. US bombing destroyed most towns in the north, and both
      sides killed civilians, including the southern government's massacres of suspected leftists in
      the Bodo League killings. The armistice of July 1953 left Korea divided without a peace treaty,
      after an estimated 2.5 to 3 million or more deaths.
    problematic: hist.dprk
    disputed: >-
      Soviet archives show that Stalin approved the north's invasion; the DPRK calls the war a
      response to southern aggression, and Bruce Cumings frames it as a civil war already under way
      before June 1950. Bodo League deaths are estimated from tens of thousands to about 200,000, and
      total deaths at 2.5 to 4 million.
    stances:
      - tradition: marxism.juche
        position: hist.dprk.besieged-survivor
        note: The Fatherland Liberation War defeated the US imperialists' attempt to swallow the whole country, at the cost of every city in the north.
      - tradition: liberalism.internationalist
        position: hist.cold-war.containment-won
        note: The first test of collective security, in which the United Nations stopped an aggression and saved South Korea.
      - tradition: nationalism.decolonial
        position: hist.dprk.divided-nation
        note: A division imposed by outside powers on a nation just freed from colonial rule, and still the root of the problem.
      - tradition: marxism.maoism
        note: The War to Resist US Aggression and Aid Korea showed that the new China would not let imperialism camp on its border.
      - tradition: marxism.third-worldism
        position: hist.cold-war.counter-revolution-in-the-south
        note: The United States fought to restore a government of colonial collaborators and bombed a peasant nation flat to do it.

  - id: event.iran-coup-1953
    name: The coup against Mosaddegh
    date: "1953-08-19"
    place: Tehran, Iran
    summary: >-
      In 1951 Iran's parliament, led by Prime Minister Mohammad Mosaddegh, nationalized the
      Anglo-Iranian Oil Company, and Britain answered with an embargo on Iranian oil and plans to
      remove the government. On 19 August 1953, after a first attempt failed, a coup organized by the
      CIA and Britain's MI6 with royalist officers, paid crowds and part of the clergy overthrew
      Mosaddegh, and Mohammad Reza Shah returned to rule. In 1954 a consortium in which US companies
      held 40 percent took over operation of Iran's oil. The Shah ruled with the SAVAK security service
      until the revolution of 1978–79.
    problematic: hist.cold-war
    disputed: >-
      CIA documents released in 2013 acknowledge the agency's role; some historians (Ray Takeyh,
      Darioush Bayandor) argue that domestic royalists and clergy were decisive. Critics of Mosaddegh
      point to his dissolution of parliament by referendum weeks before the coup.
    stances:
      - tradition: marxism.third-worldism
        position: hist.cold-war.counter-revolution-in-the-south
        note: A nation took back its oil and was punished with a coup, the model for every intervention that followed.
      - tradition: nationalism.civic
        position: intl.sovereignty.nations-set-own-course
        note: Iran's constitutional government was overthrown for reclaiming the nation's own resources.
      - tradition: liberalism.internationalist
        note: A Cold War mistake that overthrew an elected government and bred the anti-Americanism that exploded in 1979.
      - tradition: conservatism.neo
        position: hist.cold-war.victory-over-evil
        note: With the Tudeh party strong and Mosaddegh weak, the coup kept Iran out of Soviet hands.
      - tradition: religious.islamism-khomeinist
        note: The coup showed the Shah to be America's servant, and the revolution of 1979 settled the account.

  - id: event.guatemala-1954
    name: The overthrow of Árbenz
    date: "1954-06-18"
    end: "1954-06-27"
    place: Guatemala
    summary: >-
      Jacobo Árbenz, elected president in 1950, enacted the 1952 Agrarian Reform Law (Decree 900), which
      expropriated uncultivated land on large estates, including much of the United Fruit Company's,
      with compensation at the value declared for tax. The US government, several of whose officials
      had ties to United Fruit, called it communist penetration and organized Operation PBSuccess: a
      CIA-trained force under Carlos Castillo Armas invaded from Honduras in June 1954, backed by air
      raids and radio propaganda, and the army forced Árbenz to resign on 27 June. The land reform was
      reversed. In the civil war of 1960–1996 about 200,000 people were killed or disappeared, and the
      UN-sponsored truth commission attributed 93 percent of violations to the state and found acts of
      genocide against Maya communities.
    problematic: hist.cold-war
    disputed: >-
      Whether US policy was driven mainly by United Fruit's interests (Stephen Schlesinger and Stephen
      Kinzer) or by fear of communist influence in Árbenz's circle, where the Guatemalan Party of Labour
      was close to him (Piero Gleijeses stresses both Árbenz's sympathies and the anticommunist motive).
    stances:
      - tradition: marxism.dependency
        position: hist.cold-war.counter-revolution-in-the-south
        note: A land reform that touched a US fruit company was enough to bring down an elected government, the Cold War's real content in the South.
      - tradition: marxism.guevarism
        note: Guatemala taught that a revolution which leaves the old army intact will be overthrown by it.
      - tradition: conservatism.fusionism
        position: hist.cold-war.victory-over-evil
        note: A Soviet beachhead in the Americas was removed at almost no cost.
      - tradition: nationalism.indigenous-sovereignty
        note: The coup restored the plantation order, and the army it empowered later turned genocide on the Maya communities who worked the land.
      - tradition: liberalism.social
        note: An elected reformer was overthrown in the name of liberty, and Guatemala paid with thirty-six years of war.

  - id: event.khrushchev-secret-speech
    name: Khrushchev's secret speech
    date: "1956-02-25"
    place: Moscow, USSR
    summary: >-
      At a closed session of the Twentieth Congress of the Soviet Communist Party, First Secretary
      Nikita Khrushchev delivered "On the Cult of Personality and Its Consequences," condemning
      Stalin's cult, the mass repression of party members and his conduct of the war's first months.
      The speech was read at party meetings across the USSR and published abroad within months. It was
      followed by the release and rehabilitation of many Gulag prisoners and helped set off the
      upheavals in Poland and Hungary that autumn. China's and Albania's leaders rejected it, and it
      fed the Sino-Soviet split.
    problematic: hist.ussr-late
    disputed: >-
      Whether the speech opened a road to socialist reform (Roy Medvedev, the Eurocommunists) or to
      revisionism and capitalist restoration (Mao, Enver Hoxha). Grover Furr argues its charges were
      false, a claim historians reject.
    stances:
      - tradition: marxism.mlm
        position: hist.ussr-late.capitalism-restored-1956
        note: Khrushchev's revisionism opened the road for a new bourgeoisie inside the party, and from then on the USSR was socialist in name only.
      - tradition: marxism.ml
        position: hist.ussr-late.real-socialism-betrayed
        note: A treacherous attack on Stalin that handed the imperialists their best weapon and began the long road to 1991.
      - tradition: marxism.trotskyism
        position: hist.ussr-late.bureaucratic-stagnation
        note: The bureaucracy denounced one man in order to save the system that produced him.
      - tradition: marxism.eurocommunism
        note: The speech freed each Communist party to seek its own national road, as Togliatti drew from it at once.
      - tradition: liberalism.internationalist
        note: The first official admission of crimes the world already knew, which opened the camps without opening the system.

  - id: event.hungary-1956
    name: The Hungarian uprising
    date: "1956-10-23"
    end: "1956-11-10"
    place: Hungary
    summary: >-
      A student demonstration in Budapest on 23 October 1956 became an armed rising after state
      security police fired on the crowd. Workers' councils formed in factories across the country, and
      the reform Communist Imre Nagy became prime minister, formed a multiparty government and on 1
      November declared Hungary's withdrawal from the Warsaw Pact. Soviet forces attacked Budapest on
      4 November and crushed armed resistance within days, though the Central Workers' Council of
      Greater Budapest kept up strikes into December. About 2,500 Hungarians and 700 Soviet soldiers
      were killed, some 200,000 people fled abroad, and Nagy was executed in 1958.
    problematic: hist.ussr-late
    disputed: >-
      Whether it was a workers' revolution of councils (council communists, Trotskyists, Peter Fryer),
      a national rising for independence and multiparty government (most liberal accounts), or a
      counter-revolution with fascist elements encouraged by Radio Free Europe (the Soviet and
      Hungarian party accounts, which cited the lynching of security police at Republic Square).
    stances:
      - tradition: marxism.council-communism
        position: democracy.form.council
        note: The workers' councils of 1956 were the real thing, and the so-called workers' state sent tanks to crush them.
      - tradition: marxism.trotskyism
        note: A political revolution against the bureaucracy that meant to keep social property, drowned by the Kremlin.
      - tradition: marxism.ml
        note: A counter-revolution in which Horthyite and Western-backed forces lynched Communists, and Soviet troops defended socialism.
      - tradition: conservatism.christian-democracy
        position: hist.ussr-late.captive-nations-empire
        note: A captive Christian nation rose for its faith and independence and was crushed while the West looked on.
      - tradition: nationalism.civic
        note: Hungarians rose for national independence and elected government, and were abandoned by a West busy at Suez.

  - id: event.cuban-revolution
    name: The Cuban Revolution
    date: "1956-12-02"
    end: "1961-04-19"
    place: Cuba
    summary: >-
      Fidel Castro's 26th of July Movement, with urban underground and rural guerrilla forces, waged
      war on the Batista government after landing from the yacht Granma in December 1956, and Batista
      fled on 1 January 1959. The new government carried out agrarian reform in 1959 and nationalized
      US-owned and Cuban enterprises in 1960 as Washington cut Cuba's sugar quota and began an
      embargo, and a 1961 literacy campaign taught some 700,000 adults to read. After the defeat of the
      CIA-organized Bay of Pigs invasion in April 1961, Castro declared the revolution socialist. Cuba
      became a one-party state allied with the Soviet Union, and hundreds of thousands of Cubans
      emigrated, most to the United States.
    problematic: hist.cuban-revolution
    disputed: >-
      Executions after the victory numbered several hundred in 1959, with exile sources giving higher
      totals for the 1960s. Whether the turn to socialism was intended from the start or was driven by
      US hostility to a nationalist revolution is debated among historians.
    stances:
      - tradition: marxism.ml
        position: hist.cuban-revolution.marti-completed
        note: Martí's unfinished war for independence was completed by socialism, ninety miles from the empire.
      - tradition: marxism.guevarism
        position: hist.cuban-revolution.new-human-being
        note: A small guerrilla force created the conditions for revolution, and socialism was to build a new human being through moral incentives.
      - tradition: conservatism.fusionism
        position: hist.cuban-revolution.betrayed-into-dictatorship
        note: A revolution promised elections and the 1940 constitution and delivered a communist dictatorship and the firing squad.
      - tradition: marxism.third-camp
        position: hist.cuban-revolution.revolution-from-above
        note: A revolution made for the workers by guerrilla commanders, which put a bureaucracy where Batista had been.
      - tradition: liberalism.austrian
        position: hist.cuban-revolution.prosperity-destroyed
        note: One of Latin America's richer countries was impoverished by expropriation and planning.

  - id: event.cuban-missile-crisis
    name: The Cuban missile crisis
    date: "1962-10-16"
    end: "1962-10-28"
    place: Cuba, Washington and Moscow
    summary: >-
      After the Bay of Pigs and continued US covert operations against Cuba, and with US Jupiter
      missiles deployed in Turkey and Italy, the Soviet Union secretly placed nuclear-armed missiles in
      Cuba with the Cuban leadership's agreement. US reconnaissance found the sites in October 1962, the
      United States imposed a naval quarantine, and the two powers came close to nuclear war. On 28
      October Khrushchev agreed to remove the missiles in return for a US pledge not to invade Cuba and
      a secret undertaking to withdraw the Jupiters from Turkey. Cuba was not consulted on the
      settlement.
    problematic: hist.cold-war
    disputed: >-
      Whether Kennedy's firmness won the crisis (the early US account) or a secret mutual compromise
      ended it (later scholarship after the Jupiter trade became known). How close the world came is
      debated, with the near-launch of a nuclear torpedo by Soviet submarine B-59 revealed only decades
      later.
    stances:
      - tradition: conservatism.neo
        position: war.militarism.peace-through-strength
        note: Firmness and military superiority made Moscow back down.
      - tradition: conservatism.gaullism
        position: hist.cold-war.security-rivalry
        note: Two great powers tested each other's red lines and deterrence held, which is why France needed its own deterrent.
      - tradition: marxism.guevarism
        position: internationalism.tricontinental
        note: The Soviet Union bargained over Cuba's head, proof that the small nations must rely on one another and not on a great power.
      - tradition: marxism.maoism
        position: hist.cold-war.two-superpowers
        note: Khrushchev moved from adventurism to capitulation, showing the Soviet leadership put superpower bargaining above revolution.
      - tradition: liberalism.internationalist
        note: Diplomacy and restraint averted catastrophe and led to the hotline and the test-ban treaty.
