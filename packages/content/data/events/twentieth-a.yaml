# Historical events, 1914–1933: war, the Russian Revolution and its isolation.
events:
  - id: event.war-credits-1914
    name: The vote for war credits
    date: "1914-08-04"
    place: Berlin, Paris and the capitals of the belligerent states
    summary: >-
      On 4 August 1914 the Social Democratic deputies in the German Reichstag voted as a bloc for war
      credits, after their caucus had approved them by a large majority; Hugo Haase, who had opposed
      them in caucus, read the party's statement of support. The French socialists joined the Union
      sacrée days after Jean Jaurès, who had campaigned against war, was assassinated on 31 July, and
      most socialist parties of the belligerent states backed their governments. The Bolsheviks,
      the Serbian socialists and minorities elsewhere opposed the war, Karl Liebknecht cast the first
      vote against credits in the Reichstag in December 1914, and anti-war socialists met at
      Zimmerwald in 1915. The war killed some 15 to 20 million people, including colonial soldiers and
      porters drawn from India and Africa.
    disputed: >-
      Whether the vote was a betrayal by a leadership grown comfortable in the existing state (Lenin,
      Luxemburg) or a reflection of real patriotic feeling among the members (many labour historians).
      Lenin tied it to a labor aristocracy fed by colonial superprofits, a thesis Marxists still
      dispute.
    stances:
      - tradition: marxism.leninism
        position: war.militarism.imperialist-rivalry
        note: The leaders of the Second International betrayed socialism by voting for an imperialist war, and the task was to turn that war into a civil war against one's own government.
      - tradition: marxism.luxemburgism
        position: nationalism.kinds.all-bourgeois
        note: The International collapsed on 4 August, and the choice before humanity became socialism or barbarism.
      - tradition: socdem.revisionist
        note: Workers had a country to defend against tsarist invasion, and standing with the nation won the labour movement its place in the state.
      - tradition: conservatism.national
        position: internationalism.nation-first
        note: When the test came, workers marched with their countrymen, proving that the nation runs deeper than class.
      - tradition: marxism.third-worldism
        note: It was a war for colonies fought partly with colonial soldiers, and the European socialists who opposed it rarely opposed the empire itself.

  - id: event.russian-revolution
    name: The Russian Revolution
    date: "1917-03-08"
    end: "1918-01-19"
    place: Petrograd and the Russian Empire
    summary: >-
      In February 1917 (Old Style) strikes and mutinies in Petrograd brought down Nicholas II, and a
      Provisional Government shared power with soviets of workers' and soldiers' deputies. The
      government kept Russia in the war, peasants seized land, and by September the Bolsheviks had won
      majorities in the Petrograd and Moscow soviets. On 25 October (7 November New Style) the Petrograd
      Soviet's Military Revolutionary Committee took the capital, and the Second Congress of Soviets
      approved a Soviet government and decrees on peace and land. The Constituent Assembly, elected in
      November with the Socialist Revolutionaries as the largest party, was dispersed by the new
      government in January 1918.
    problematic: hist.russian-revolution
    disputed: >-
      Whether October was a popular insurrection carried by soviet majorities (Alexander Rabinowitch)
      or a minority party's coup (Richard Pipes). The Bolsheviks won about a quarter of the Constituent
      Assembly vote nationally but majorities in the main cities and much of the army.
    stances:
      - tradition: marxism.ml
        position: hist.russian-revolution.new-civilization
        note: The first workers' state, the founding act of a new civilization that showed the working class could take power and hold it.
      - tradition: marxism.trotskyism
        position: hist.russian-revolution.degenerated-under-siege
        note: A genuine workers' revolution, which needed revolution in the West to survive and degenerated when it stayed isolated.
      - tradition: liberalism.classical
        position: hist.russian-revolution.minority-coup
        note: A minority party seized power from a democratic revolution and dispersed the only freely elected assembly Russia had.
      - tradition: anarchism.communist
        position: hist.russian-revolution.soviets-betrayed
        note: The soviets and factory committees made the revolution, and the Bolshevik state took it from them within months.
      - tradition: conservatism.monarchist
        position: hist.russian-revolution.faith-and-nation
        note: The murder of the anointed tsar and the war on the Church were a catastrophe for Russia's faith and nationhood.
      - tradition: marxism.third-worldism
        position: hist.russian-revolution.anti-colonial-signal
        note: The first break in the imperialist chain woke the colonies, and from then on the East had an ally against empire.

  - id: event.russian-civil-war
    name: The Russian Civil War and foreign intervention
    date: "1918-05"
    end: "1922-10"
    place: The former Russian Empire
    summary: >-
      The Red Army fought White armies led by former tsarist officers, Allied intervention forces from
      Britain, France, the United States, Japan and other states, peasant insurgents, and national
      movements across the former empire. The Bolsheviks ran War Communism, with grain requisitioning,
      nationalized industry and, from September 1918, the Cheka's Red Terror; White forces ran their
      own terror, and pogroms by White, Ukrainian nationalist and other forces killed tens of thousands
      of Jews. With famine and epidemics, the war cost an estimated 7 to 12 million lives. The Red Army
      had won in European Russia by late 1920, and the last foreign troops left Vladivostok in 1922.
    problematic: hist.ussr-early
    disputed: >-
      Red Terror deaths are estimated from tens of thousands to well over 100,000, and pogrom deaths
      from about 50,000 to over 100,000. Whether War Communism was forced by the siege (Bolshevik and
      Marxist-Leninist accounts) or an ideological attempt to abolish markets at once (Silvana
      Malle, Richard Pipes) is debated.
    stances:
      - tradition: marxism.leninism
        position: hist.ussr-early.besieged-necessity
        note: Fourteen armies and the old ruling classes made war on the workers' state, and it did what survival required.
      - tradition: anarchism.platformist
        position: hist.ussr-early.kronstadt-makhno
        note: Makhno's insurgent army beat the Whites in Ukraine with free soviets, and the Bolsheviks repaid it by destroying it.
      - tradition: marxism.luxemburgism
        position: hist.ussr-early.workers-democracy-lost
        note: Without free elections and a free press, life dies out in the soviets and only the bureaucracy stays active, as Luxemburg warned in 1918.
      - tradition: conservatism.monarchist
        position: hist.ussr-early.terror-state
        note: From its first months the Bolshevik state ruled by hostage-taking and mass shooting, and the Whites fought for Russia against it.

  - id: event.german-revolution
    name: The German Revolution
    date: "1918-11-03"
    end: "1919-05-02"
    place: Germany
    summary: >-
      A sailors' mutiny at Kiel spread into workers' and soldiers' councils across Germany; the Kaiser
      abdicated on 9 November 1918, and the Social Democrat Friedrich Ebert became head of a
      provisional government. Ebert reached an understanding with the army command to restore order,
      and the national congress of councils in December voted for a National Assembly rather than
      council power. A rising in Berlin in January 1919 was crushed by army units and Freikorps, whose
      officers murdered Rosa Luxemburg and Karl Liebknecht on 15 January. The Bavarian Soviet Republic
      was put down in May 1919, and the Weimar constitution was adopted that August.
    disputed: >-
      Whether the Social Democratic leaders saved parliamentary government from a Bolshevik-style
      seizure or destroyed a council revolution by allying with the officer corps that later helped
      bring Hitler to power (Sebastian Haffner). Historians also dispute how far the councils wanted
      socialism or only peace and parliamentary rule.
    stances:
      - tradition: socdem.revisionist
        position: reform.revolution.reform-is-the-road
        note: Social Democracy won universal suffrage, votes for women and the eight-hour day, and saved the republic from civil war on the Russian model.
      - tradition: marxism.luxemburgism
        position: democracy.form.council
        note: The councils were the revolution, and the Social Democratic leaders drowned them in blood with the same officers who would later serve fascism.
      - tradition: marxism.leninism
        position: org.form.vanguard-party
        note: The German workers had the numbers and lacked a disciplined revolutionary party, founded too late to lead them.
      - tradition: fascism.nazism
        note: The November revolution was a stab in the back by Marxists and Jews against an army undefeated in the field, the founding grievance of the movement.

  - id: event.kronstadt-1921
    name: The Kronstadt rising
    date: "1921-03-01"
    end: "1921-03-18"
    place: Kronstadt naval base, near Petrograd, Soviet Russia
    summary: >-
      Amid strikes in Petrograd, the sailors and garrison of the Kronstadt naval base adopted a
      resolution demanding new soviet elections by secret ballot, freedom of speech and press for
      workers, peasants, anarchists and left socialist parties, and an end to grain requisitioning.
      The Soviet government called the rising a White plot and, after talks failed, the Red Army
      attacked across the ice and took the fortress on 17–18 March. About 8,000 rebels fled to Finland;
      many of those captured were shot and thousands were sent to camps. The Tenth Party Congress,
      meeting at the same time, banned factions inside the party and replaced requisitioning with a
      tax in kind.
    problematic: hist.ussr-early
    disputed: >-
      Whether the 1921 sailors were the revolutionary veterans of 1917 or newer peasant recruits
      (Israel Getzler against Bolshevik accounts), and whether émigré Whites had a hand in it (Paul
      Avrich found émigré plans but no evidence they caused the rising). Executions afterward are
      estimated from several hundred to over 2,000.
    stances:
      - tradition: anarchism.communist
        position: hist.ussr-early.kronstadt-makhno
        note: The sailors asked for the soviets of 1917 and were answered with artillery, the moment the revolution's state turned on the revolution.
      - tradition: marxism.trotskyism
        position: hist.ussr-early.besieged-necessity
        note: A tragic necessity in a starving, besieged country, since a fortress in rebel hands at the gates of Petrograd would have opened the way to the Whites.
      - tradition: marxism.council-communism
        position: hist.ussr-early.workers-democracy-lost
        note: Kronstadt showed that the party ruled over the working class, not through it.
      - tradition: liberalism.classical
        position: hist.ussr-early.terror-state
        note: Workers who asked for free elections and a free press were shot by the state that claimed to rule in their name.

  - id: event.nep
    name: The New Economic Policy
    date: "1921-03"
    end: "1928"
    place: Soviet Russia and the USSR
    summary: >-
      The Tenth Party Congress in March 1921 replaced grain requisitioning with a tax in kind, letting
      peasants sell their surplus on the market. Private trade and small enterprises were legalized
      and foreign concessions sought, while the state kept large industry, banking and foreign trade.
      The Volga famine of 1921–22 killed an estimated several million people despite foreign relief.
      Output recovered toward pre-war levels by the mid-1920s, but grain procurement crises in 1927–28
      led Stalin to resume forced requisitions, and the policy was abandoned by 1929.
    problematic: hist.ussr-early
    disputed: >-
      Famine deaths in 1921–22 are estimated at about 1 to 5 million. Whether the NEP could have
      carried industrialization (Bukharin, later Stephen Cohen) or had reached its limits by 1927
      (the Left Opposition, Stalin, and later Marxist-Leninist writers) is still argued.
    stances:
      - tradition: marxism.market-socialism
        position: hist.ussr-early.nep-road
        note: Bukharin's road of market exchange with the peasants was a real path to socialism, and abandoning it cost millions of lives.
      - tradition: marxism.scc
        position: hist.ussr-early.nep-road
        note: Lenin's NEP showed that socialism must use markets and many forms of ownership while productive forces remain backward, a lesson China later applied.
      - tradition: marxism.trotskyism
        note: The Left Opposition warned that the NEP was strengthening kulaks and traders and demanded planned industrialization before the crisis came.
      - tradition: marxism.ml
        position: hist.ussr-early.besieged-necessity
        note: A necessary retreat to restore the economy, rightly ended when the kulaks withheld grain and war threatened.
      - tradition: liberalism.austrian
        position: calculation.debate.mises-impossible
        note: Within three years even the Bolsheviks had to restore markets to feed the country, which confirmed that a moneyless economy cannot calculate.

  - id: event.shanghai-1927
    name: The Shanghai massacre
    date: "1927-04-12"
    place: Shanghai, China
    summary: >-
      As the Northern Expedition of the Kuomintang and the Communists, allied since 1923 on Comintern
      advice, neared Shanghai in March 1927, Communist-led workers took the city in a general strike
      and armed rising. On 12 April forces under Chiang Kai-shek, aided by the Green Gang and backed by
      Shanghai bankers and merchants, attacked the unions and the Communists, and the purge spread to
      other cities. The Wuhan Kuomintang broke with the Communists in July, and Communist risings at
      Nanchang and Canton failed. Survivors regrouped in the countryside, where Mao Zedong and Zhu De
      built rural bases.
    problematic: hist.chinese-revolution
    disputed: >-
      Deaths in Shanghai are estimated in the hundreds to several thousand, and in the wider purge of
      1927–28 from tens of thousands to several hundred thousand. Trotsky blamed Stalin's Comintern
      line of keeping the Communists inside the Kuomintang; later official Communist histories blamed
      the "right opportunism" of party leader Chen Duxiu.
    stances:
      - tradition: marxism.trotskyism
        position: hist.chinese-revolution.betrayed-in-1927
        note: Stalin's policy of subordinating the workers to the Kuomintang delivered the Shanghai proletariat to its executioners.
      - tradition: marxism.maoism
        position: hist.chinese-revolution.peoples-war-model
        note: The lesson was that a party without its own army is nothing, since political power grows out of the barrel of a gun.
      - tradition: marxism.ml
        note: Chen Duxiu's capitulation left the workers unarmed, and the party corrected the error by building the Red Army.
      - tradition: nationalism.three-principles
        note: The party purge saved the National Revolution from a Communist takeover directed from Moscow.

  - id: event.soviet-collectivization
    name: Soviet collectivization and the famine of 1932–33
    date: "1929-11"
    end: "1933"
    place: USSR, above all Ukraine, Kazakhstan, the North Caucasus and the Volga
    summary: >-
      From late 1929 the Soviet leadership drove peasants into collective farms to secure grain for
      the towns and for export under the First Five-Year Plan. Households classed as kulaks were
      expropriated, about 1.8 million people were deported to special settlements in 1930–31, and
      many were shot. Peasants resisted by slaughtering livestock and by revolt; procurement quotas
      taken from the 1931 and 1932 harvests produced a famine in 1932–33 that killed an estimated 5.5
      to 8.7 million people. By the late 1930s almost all peasant households were in collective farms.
    problematic: hist.ussr-stalin
    disputed: >-
      Ukraine and more than twenty other states recognize the Ukrainian famine (Holodomor, about 3.5
      to 5 million deaths) as genocide, following Robert Conquest and Andrea Graziosi; R. W. Davies and
      Stephen Wheatcroft attribute it to policy failure and ruthless procurement rather than ethnic
      intent; some Marxist-Leninist writers dispute the scale. In Kazakhstan about 1.5 million died,
      close to 40 percent of the Kazakh people.
    stances:
      - tradition: marxism.ml
        position: hist.ussr-stalin.socialism-built
        note: Collectivization ended the kulaks' grip on the grain and fed the industrialization that defeated Hitler, at a cost in which kulak sabotage played its part alongside errors.
      - tradition: marxism.trotskyism
        position: hist.ussr-stalin.degenerated-workers-state
        note: The bureaucracy coddled the kulaks until 1928, then panicked and forced collectivization at gunpoint, wrecking agriculture for a generation.
      - tradition: conservatism.traditionalist
        position: hist.ussr-stalin.war-on-faith-and-nations
        note: A war on the peasantry, its churches and the nations of the empire, ending in a famine-genocide in Ukraine.
      - tradition: liberalism.classical
        position: hist.ussr-stalin.totalitarian-twin
        note: The abolition of peasant property was enforced by deportation and starvation, the clearest proof that planning requires terror.
      - tradition: nationalism.developmental-state
        position: hist.ussr-stalin.developmental-dictatorship
        note: A brutal extraction of surplus from the countryside financed rapid industrialization, at a human cost East Asia's land reforms later showed was avoidable.
