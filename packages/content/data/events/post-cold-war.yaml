# Historical events, 1990–2009: the post-Soviet order, its wars and its crises.
events:
  - id: event.south-africa-1994
    name: The end of apartheid and South Africa's 1994 election
    date: "1990-02-11"
    end: "1994-05-10"
    place: South Africa
    summary: >-
      After decades of mass struggle, armed resistance and international sanctions, and the township
      uprisings and strikes of the 1980s, the National Party government released Nelson Mandela on 11
      February 1990 and legalized the ANC, the PAC and the Communist Party. Negotiations, during which
      political violence killed about 14,000 people, produced an interim constitution with a bill of
      rights and protection for existing property. In the first elections with universal suffrage, on
      27 April 1994, the ANC won 62.6 percent and Mandela became president on 10 May. The new government
      kept a cautious macroeconomic course and adopted the market-oriented GEAR program in 1996, and land
      and wealth remained highly concentrated.
    problematic: hist.decolonization
    disputed: >-
      Whether the transition was a liberation (the ANC, most liberals) or an elite compromise that left
      economic power in white and corporate hands (Sampie Terreblanche, Patrick Bond, the Economic
      Freedom Fighters), and whether internal struggle or sanctions and the end of the Cold War did more
      to force it.
    stances:
      - tradition: liberalism.social
        position: hist.decolonization.self-determination
        note: A negotiated revolution ended apartheid without civil war and founded a constitutional order with one of the world's strongest bills of rights.
      - tradition: nationalism.pan-africanism
        position: settler.colonialism.expropriate-redistribute
        note: The majority won the vote and the settlers kept the land and the mines, so the land must be expropriated without compensation.
      - tradition: marxism.ml
        position: alliances.policy.national-front
        note: The national democratic revolution won its first stage through the alliance of the ANC, the Communist Party and the unions, and the struggle continues.
      - tradition: marxism.dependency
        position: hist.decolonization.flag-independence
        note: An elite transition in which apartheid's corporations kept their grip and the new government adopted the creditors' program on its own.
      - tradition: religious.liberation-theology
        note: Black theology and the Kairos Document put the churches on the side of the oppressed, and truth-telling rather than vengeance made a common future possible.

  - id: event.russian-shock-therapy
    name: Shock therapy in Russia
    date: "1992-01-02"
    end: "1998-08-17"
    place: Russia
    summary: >-
      On 2 January 1992 Russia's government under Yegor Gaidar freed most prices, and inflation reached
      about 2,500 percent that year, wiping out savings. Voucher privatization in 1992–94 and the
      loans-for-shares auctions of 1995–96, in which banks close to the government acquired major oil
      and metals companies cheaply, created a small class of very rich owners. In October 1993 President
      Yeltsin dissolved the parliament, which had resisted the reforms, and had it shelled, and a new
      constitution with strong presidential powers followed. Output fell by around 40 percent over the
      decade, male life expectancy fell from about 64 years in 1990 to about 58 in 1994, and the
      government defaulted in August 1998.
    problematic: hist.collapse-1989
    disputed: >-
      Whether the failure came from reform that was too fast and ignored institutions (Joseph Stiglitz,
      Keynesians) or from reform that was too slow, inconsistent and captured by insiders (Jeffrey
      Sachs, Anders Åslund). Excess deaths in the 1990s are estimated in the millions, with dispute over
      how much to attribute to economic collapse rather than alcohol and health trends.
    stances:
      - tradition: socdem.keynesian
        position: hist.collapse-1989.shock-therapy-blunder
        note: Freeing prices and selling the state before building institutions destroyed savings, output and lives, while China's gradual road showed another way.
      - tradition: liberalism.technocratic
        note: Reform was half-finished and captured by insiders, and Poland's faster and cleaner liberalization shows what consistent policy could have done.
      - tradition: marxism.trotskyism
        position: hist.collapse-1989.bureaucracy-became-owners
        note: The directors and party officials carved up the people's property among themselves, just as Trotsky had predicted.
      - tradition: conservatism.national
        position: hist.neoliberal-turn.betrayal-of-the-nation
        note: Western advisers and a rootless elite stripped the nation's wealth while its soldiers went unpaid and its pensioners starved.
      - tradition: marxism.ml
        position: hist.collapse-1989.counter-revolution
        note: Counter-revolution delivered what it promised to the few, and poverty, early death and humiliation to the many.

  - id: event.yugoslav-wars
    name: The Yugoslav wars
    date: "1991-06-25"
    end: "2001-11"
    place: Slovenia, Croatia, Bosnia and Herzegovina, Serbia, Kosovo and Macedonia
    summary: >-
      Yugoslavia entered the 1980s with heavy foreign debt, and IMF-backed austerity, inflation and
      unemployment sharpened conflicts among its republics as nationalist leaders, among them Slobodan
      Milošević in Serbia and Franjo Tuđman in Croatia, rose to power. Slovenia and Croatia declared
      independence in June 1991 and Bosnia and Herzegovina in 1992, and wars followed with mass
      expulsions, the siege of Sarajevo, and the killing of about 8,000 Bosniak men and boys at
      Srebrenica in July 1995, which the international tribunal ruled genocide. NATO bombed Bosnian Serb
      forces in 1995 before the Dayton Agreement, and bombed Yugoslavia for 78 days in 1999 over Kosovo
      without UN Security Council authorization. About 130,000 to 140,000 people were killed and
      millions displaced.
    problematic: hist.yugoslavia
    disputed: >-
      How much the wars came from economic crisis and Western policy (Susan Woodward and dependency
      writers), from nationalist elites' choices (most historians), or from old ethnic hatreds (a view
      most historians reject). Whether NATO's 1999 war was a lawful humanitarian intervention (NATO
      governments; the Independent International Commission on Kosovo called it "illegal but
      legitimate") or aggression (Russia, China, much of the left).
    stances:
      - tradition: socdem.democratic-socialism
        position: hist.yugoslavia.undone-by-markets-and-debt
        note: Debt, IMF austerity and market reform tore apart a federation that had given its peoples a decent life, and nationalists harvested the wreckage.
      - tradition: liberalism.internationalist
        position: intervention.humanitarian.responsibility-to-protect
        note: Srebrenica showed the price of standing aside, and Kosovo showed that sovereignty cannot shield ethnic cleansing.
      - tradition: nationalism.ethnic
        position: hist.yugoslavia.prison-of-nations
        note: Nations held together by communist force reclaimed their own states, at a terrible price.
      - tradition: commonsense.declinist
        position: hist.yugoslavia.brotherhood-and-unity
        note: We had jobs, holidays on the coast and neighbors of every nation, and the politicians and the war took it all.
      - tradition: marxism.ml
        position: intervention.humanitarian.imperial-pretext
        note: NATO dismembered the last independent state in Europe outside its order and bombed Belgrade in the name of human rights.

  - id: event.rwanda-1994
    name: The genocide against the Tutsi in Rwanda
    date: "1994-04-07"
    end: "1994-07-15"
    place: Rwanda
    summary: >-
      The categories of Hutu and Tutsi had been hardened by Belgian colonial rule, which issued ethnic
      identity cards from the 1930s. After the plane carrying President Juvénal Habyarimana was shot down
      on 6 April 1994, Hutu Power militants in the army, the Interahamwe militias and local government,
      organized in advance and urged on by radio, killed Tutsi and Hutu political opponents across the
      country, an estimated 500,000 to 800,000 people in about 100 days. The UN cut its peacekeeping force
      after ten Belgian peacekeepers were killed, and the major powers avoided calling it genocide for
      weeks. The Rwandan Patriotic Front, a Tutsi-led army that had invaded from Uganda in 1990, defeated
      the government forces by July, and over two million Hutu fled, many to Zaire, where armed
      génocidaires regrouped among the refugees and the Congo wars of 1996–2003 followed.
    disputed: >-
      The Rwandan government's census counts over 1 million dead; Alison Des Forges for Human Rights
      Watch estimated at least 500,000 Tutsi. France's 2021 Duclert report found France bore "heavy and
      overwhelming responsibilities" through its support for Habyarimana's government but not
      complicity in genocide. Killings of civilians by the RPF during and after 1994, estimated in the
      tens of thousands, are disputed and have rarely been prosecuted.
    stances:
      - tradition: liberalism.internationalist
        position: intervention.humanitarian.responsibility-to-protect
        note: The world watched a genocide it could have stopped, and the responsibility to protect was born of that shame.
      - tradition: nationalism.pan-africanism
        position: intervention.humanitarian.neighbors-not-empires
        note: France armed the génocidaires and the UN withdrew, and it was Africans who ended the genocide.
      - tradition: nationalism.decolonial
        position: hist.decolonization.coloniality-remains
        note: Colonial race science invented a Hamitic Tutsi and a native Hutu and stamped it on identity cards, and the genocide was its harvest.
      - tradition: conservatism.cst
        note: Clergy and faithful were among both victims and killers, and the Church had to ask forgiveness, as Pope Francis did in 2017.

  - id: event.zapatista-rising
    name: The Zapatista rising
    date: "1994-01-01"
    end: "1994-01-12"
    place: Chiapas, Mexico
    summary: >-
      On 1 January 1994, the day the North American Free Trade Agreement took effect, the Zapatista Army
      of National Liberation (EZLN), mostly Tzeltal, Tzotzil, Ch'ol and Tojolabal Maya peasants,
      occupied San Cristóbal de las Casas and other towns in Chiapas and declared war on the federal
      government, demanding land, work, housing, health, education and self-government. A 1992 change to
      Article 27 of the Constitution, allowing communal ejido land to be sold, was among the causes. The
      army counterattacked, and after about twelve days of fighting the government declared a ceasefire
      amid national protests. The 1996 San Andrés Accords on indigenous rights were never enacted as
      signed, and the Zapatistas built autonomous municipalities and, from 2003, regional Good Government
      Councils outside the state's structures, which they replaced with local autonomous governments in 2023.
    problematic: hist.zapatistas
    disputed: >-
      Deaths in January 1994 are about 145 by official count and several hundred by others. The roles of
      Bishop Samuel Ruiz's diocese and of urban leftist cadres such as Subcomandante Marcos are read as
      support for indigenous self-organization or as outside leadership. Paramilitary violence continued,
      including the Acteal massacre of 45 people in 1997.
    stances:
      - tradition: zapatismo
        position: hist.zapatistas.autonomy-without-power
        note: We rose to say enough, and we govern ourselves by obeying, building a world where many worlds fit without asking the state's permission.
      - tradition: nationalism.indigenous-sovereignty
        position: hist.zapatistas.indigenous-land-and-dignity
        note: An indigenous rising for land and dignity against NAFTA and against five hundred years of dispossession.
      - tradition: marxism.leninism
        position: hist.zapatistas.dead-end-without-power
        note: Heroic and inspiring, but autonomy in a corner of Chiapas leaves the Mexican state and capital untouched.
      - tradition: liberalism.social
        position: hist.zapatistas.unnecessary-insurgency
        note: Mexico was opening up, and electoral reform, not armed rising, ended one-party rule in 2000.
      - tradition: conservatism.traditionalist
        position: hist.zapatistas.outside-agitators
        note: Outside radicals and politicized priests used real indigenous grievances for an ideological war.

  - id: event.dprk-famine
    name: The North Korean famine
    date: "1994"
    end: "1998"
    place: Democratic People's Republic of Korea
    summary: >-
      After the Soviet Union's collapse ended subsidized oil, fertilizer and trade, North Korea's industry
      and collective agriculture went into steep decline, and floods in 1995 and 1996 destroyed crops and
      farmland. The public distribution system that fed most of the population broke down outside
      favored areas, and the government called the period the Arduous March. By most estimates hundreds
      of thousands died of hunger and related disease, and many people crossed into China. International
      food aid arrived from 1995, and the informal markets that grew during the famine became a lasting
      part of the economy.
    problematic: hist.dprk
    disputed: >-
      Deaths are estimated from about 240,000 to 3.5 million, with most demographic studies between about
      500,000 and 1 million. The causes are disputed between the loss of Soviet support and natural
      disaster (the DPRK government), the failures of planned agriculture and the priority given to the
      military (Stephan Haggard and Marcus Noland), and sanctions and withheld aid (some left accounts).
    stances:
      - tradition: marxism.juche
        position: hist.dprk.besieged-survivor
        note: When the socialist market vanished and floods struck, the people overcame the Arduous March by self-reliance under siege.
      - tradition: liberalism.chicago
        position: hist.dprk.planning-failed
        note: Planned, collectivized agriculture collapsed the moment its subsidies ended, and markets fed people where the state could not.
      - tradition: liberalism.internationalist
        position: hist.dprk.hereditary-tyranny
        note: Food went first to the army and the elite while the state blocked monitoring of aid, and the leadership survived its people.
      - tradition: socdem.democratic-socialism
        position: hist.dprk.national-dynasty
        note: A hereditary court that let its people starve has nothing to do with socialism.

  - id: event.asian-financial-crisis
    name: The Asian financial crisis
    date: "1997-07-02"
    end: "1998-12"
    place: Thailand, Indonesia, South Korea, Malaysia and the Philippines
    summary: >-
      On 2 July 1997 Thailand floated the baht after speculative attacks exhausted its reserves, and
      capital flight spread to Indonesia, South Korea, Malaysia and the Philippines, whose banks and firms
      had borrowed heavily in dollars after capital flows were freed in the early 1990s. The IMF arranged
      rescue packages for Thailand, Indonesia and South Korea on condition of high interest rates, budget
      cuts, bank closures and wider opening to foreign ownership. Indonesia's economy shrank by about 13
      percent in 1998, poverty rose sharply, and Suharto resigned in May 1998 after mass protests and
      riots in which ethnic Chinese were targeted. Malaysia rejected an IMF program and imposed capital
      controls in September 1998.
    problematic: hist.neoliberal-turn
    disputed: >-
      Whether the crisis came from crony capitalism and weak banking in the affected countries (the IMF
      and US Treasury's first reading) or from premature opening to short-term capital and panic worsened
      by IMF conditions (Joseph Stiglitz, Robert Wade). Whether Malaysia's controls helped is debated;
      Ethan Kaplan and Dani Rodrik found they did.
    stances:
      - tradition: liberalism.technocratic
        position: poverty.cause.bad-institutions
        note: Crony lending and implicit state guarantees invited reckless borrowing, and banking and governance reform was the cure.
      - tradition: nationalism.developmental-state
        position: finance.control.capital-controls
        note: The developmental model was sound until Washington pressed it to free capital flows, and Malaysia's controls proved the point.
      - tradition: marxism.dependency
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: Hot money fled, the IMF imposed austerity, and Western capital bought up Asian firms at fire-sale prices.
      - tradition: liberalism.austrian
        position: intl.institutions.moral-hazard
        note: IMF bailouts rescued Western lenders and taught them to lend recklessly again.

  - id: event.argentina-2001
    name: Argentina's collapse of 2001
    date: "2001-12-01"
    end: "2002-12"
    place: Argentina
    summary: >-
      Argentina pegged its peso to the dollar one-to-one in 1991, privatized most state enterprises and
      borrowed heavily abroad, and a recession from 1998 deepened under IMF-backed austerity. In December
      2001 the government froze bank deposits, and on 19–20 December protests, looting and pot-banging
      crowds under the slogan "que se vayan todos" ("all of them must go") brought down President
      Fernando de la Rúa, with 39 people killed. Argentina defaulted on around 90 billion dollars of
      public debt, the largest sovereign default until then, and ended the peg in January 2002 as poverty
      rose above half the population. Unemployed workers' movements, neighborhood assemblies and workers
      who took over and ran abandoned factories were features of the crisis and the recovery that began
      in 2003.
    problematic: hist.argentina-2001
    disputed: >-
      Whether the dollar peg and IMF-backed austerity caused the collapse (Joseph Stiglitz, most
      heterodox economists) or fiscal indiscipline by federal and provincial governments (much of the
      IMF's own review and orthodox economists), and whether the 2005 restructuring with large losses for
      bondholders vindicated default.
    stances:
      - tradition: marxism.autonomism
        position: org.form.horizontal-movement
        note: The assemblies, the piqueteros and the recovered factories showed people running things without bosses or politicians.
      - tradition: commonsense.anti-politics
        position: cs.politicians.all-crooks
        note: All of them must go, every last one, because they stole our savings and all looked after each other.
      - tradition: nationalism.peronism
        position: debt.sovereign.pay-off-to-be-free
        note: Argentina restructured on its own terms and paid off the IMF in 2006 to be free of its conditions.
      - tradition: liberalism.chicago
        position: debt.sovereign.pay-what-you-owe
        note: Argentina spent beyond its means and refused to adjust, and default shut it out of credit markets for years.
      - tradition: marxism.dependency
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: The IMF's favorite pupil was bled by debt service and austerity until it broke.

  - id: event.venezuela-coup-2002
    name: The April 2002 coup attempt in Venezuela
    date: "2002-04-11"
    end: "2002-04-14"
    place: Caracas, Venezuela
    summary: >-
      Hugo Chávez, elected president in 1998, won a new constitution by referendum in 1999 and in 2001
      decreed laws on land and hydrocarbons that raised oil royalties and tightened state control of the
      oil company PDVSA. On 11 April 2002 a large opposition march toward the presidential palace met
      government supporters, and shooting near the Llaguno overpass killed about 19 people. The military
      high command removed Chávez, and Pedro Carmona, head of the business federation Fedecámaras, was
      sworn in as president and dissolved the National Assembly and the Supreme Court. Mass protests from
      the poor neighborhoods and loyal army units restored Chávez on 13–14 April, and an oil-industry
      strike and lockout from December 2002 to February 2003 also failed.
    problematic: hist.venezuela
    disputed: >-
      Who fired on 11 April is disputed between opposition and government accounts, and the private
      media's coverage became part of the dispute. US officials had met opposition figures who took part
      and Washington at first welcomed Chávez's removal; direct US participation has not been
      established, and a 2002 State Department review found no wrongdoing.
    stances:
      - tradition: nationalism.bolivarianism
        position: hist.venezuela.bolivarian-revolution
        note: The people and the army united to defeat a coup of the oligarchy, the media and Washington in forty-eight hours.
      - tradition: marxism.autonomism
        position: hist.venezuela.communes-from-below
        note: The barrios came down from the hills and reversed the coup themselves, and the revolution belonged to them, not to the state.
      - tradition: liberalism.classical
        position: hist.venezuela.socialism-wrecked-it
        note: A government concentrating power and seizing the oil company provoked the crisis, and Carmona's decree discredited the opposition it claimed to lead.
      - tradition: conservatism.neo
        note: Chávez's alliance with Castro and contempt for checks on his power alarmed the country, and the army withdrew its support after the killings.

  - id: event.iraq-2003
    name: The invasion and occupation of Iraq
    date: "2003-03-20"
    end: "2011-12-18"
    place: Iraq
    summary: >-
      A US-led coalition invaded Iraq on 20 March 2003 without UN Security Council authorization, on the
      grounds that Iraq held weapons of mass destruction and had ties to al-Qaeda; the Iraq Survey Group
      reported in 2004 that Iraq had destroyed its stockpiles after 1991 and had no active weapons
      programs. Baghdad fell in April, and the Coalition Provisional Authority dissolved the army, purged
      Ba'ath Party members from public posts and opened the economy to foreign ownership. Insurgency and
      sectarian civil war followed, peaking in 2006–07, and the abuse of prisoners at Abu Ghraib became
      public in 2004. US forces withdrew in December 2011, and the Islamic State, which grew out of the
      insurgency, seized Mosul in 2014.
    disputed: >-
      Iraqi deaths: documented civilian deaths (Iraq Body Count) run to about 200,000 over two decades;
      survey estimates of excess deaths range from about 150,000 to mid-2006 (Iraq Family Health Survey) to
      over 600,000 to mid-2006 (The Lancet). Whether the war's purpose was disarmament, democracy promotion,
      oil and regional hegemony, or a security mistake after 11 September is argued.
    stances:
      - tradition: conservatism.neo
        position: intervention.humanitarian.spread-liberty
        note: Removing a tyrant who had gassed his own people and defied the UN was right, though the occupation was badly run.
      - tradition: marxism.ml
        position: intervention.humanitarian.imperial-pretext
        note: A war of aggression for oil and hegemony, sold with lies, which destroyed a country.
      - tradition: conservatism.paleo
        position: intervention.humanitarian.national-interest-only
        note: A war no American interest required, waged for an ideology of global democracy, which cost a generation of soldiers.
      - tradition: socdem.nordic
        position: intervention.humanitarian.only-with-the-un
        note: Without a Security Council mandate the invasion broke international law and the order small nations rely on.
      - tradition: religious.salafi-jihadism
        position: violence.political.religious-duty
        note: In the movement's own reading, a crusader invasion of a Muslim land made armed jihad a duty on every believer.

  - id: event.financial-crisis-2008
    name: The global financial crisis
    date: "2007-08-09"
    end: "2009-06"
    place: United States and worldwide
    summary: >-
      Losses on US subprime mortgages, packaged into securities and held by banks worldwide, froze
      interbank lending from August 2007. On 15 September 2008 the investment bank Lehman Brothers
      failed; governments rescued banks and the insurer AIG, the US Congress approved a 700 billion
      dollar rescue fund, and central banks cut rates to near zero and began large-scale asset purchases.
      The world economy fell into its deepest recession since the 1930s, world trade collapsed, and
      millions of US families lost their homes to foreclosure. From 2010 the crisis became a eurozone
      debt crisis, and austerity programs followed in Greece, Ireland, Portugal, Spain and elsewhere.
    problematic: hist.neoliberal-turn
    disputed: >-
      The causes: financial deregulation and debt-driven speculation (Keynesians following Hyman
      Minsky), easy money and government housing policy (Austrians and some conservatives, a claim the
      majority of the US Financial Crisis Inquiry Commission rejected in 2011), stagnant wages and falling
      profitability (Marxists), or global savings imbalances (much of mainstream economics).
    stances:
      - tradition: socdem.keynesian
        position: crisis.cause.financial-instability
        note: Minsky was right, since stability bred reckless debt, deregulated finance built a bubble, and only the state could stop the collapse.
      - tradition: liberalism.austrian
        position: crisis.cause.credit-distortion
        note: Cheap money from the Fed and state-backed mortgage lenders inflated the bubble, and bailouts kept the bust from cleansing the system.
      - tradition: marxism.trotskyism
        position: crisis.cause.falling-profit
        note: Low profitability since the 1970s drove capital into speculation, and the crash exposed the system's underlying sickness.
      - tradition: commonsense.rigged
        position: finance.control.no-bailouts
        note: The bankers who caused it got bailed out and kept their bonuses, and the people who lost their homes got nothing.
      - tradition: marxism.world-systems
        position: crisis.cause.underconsumption
        note: Thirty years of flat wages were papered over with household debt until the debt could grow no more.
