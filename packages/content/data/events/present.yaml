# Historical events, 2010 to the present. Entries touching 2025–26 are kept to what is well
# established and should be revisited as the record develops.
events:
  - id: event.arab-uprisings
    name: The Arab uprisings
    date: "2010-12-17"
    end: "2013-08-14"
    place: Tunisia, Egypt, Libya, Yemen, Bahrain, Syria and the wider Arab world
    summary: >-
      The self-immolation of the street vendor Mohamed Bouazizi in Sidi Bouzid on 17 December 2010 set
      off protests across Tunisia, and President Zine El Abidine Ben Ali fled on 14 January 2011. Mass
      protests centered on Cairo's Tahrir Square, together with strikes, forced Hosni Mubarak out on 11
      February, and risings followed in Libya, Yemen, Bahrain and Syria. Bahrain's movement was put down
      with Saudi-led Gulf troops in March 2011, and Syria's rising became a civil war that drew in
      regional and world powers. In Egypt the Muslim Brotherhood's Mohamed Morsi won the 2012
      presidential election and was removed by the army on 3 July 2013 after mass protests; on 14 August
      security forces killed hundreds of his supporters at Rabaa al-Adawiya Square, and Abdel Fattah
      el-Sisi became president in 2014.
    disputed: >-
      Whether these were revolutions for constitutional government, revolts against unemployment and
      austerity (Gilbert Achcar), Islamist awakenings, or, in Libya and Syria, risings captured by
      foreign powers (a view common among Marxist-Leninists and Arab nationalists). Human Rights Watch
      counted at least 817 killed at Rabaa; other counts are higher.
    stances:
      - tradition: religious.islamism-brotherhood
        note: The peoples chose Islam at the ballot box, and the coup in Egypt showed that the West's support for elections ends where Islamists win them.
      - tradition: religious.post-islamism
        note: Tunisia showed that Muslim democrats and secularists could write a constitution together.
      - tradition: marxism.trotskyism
        note: A revolutionary process driven by workers' strikes in Tunisia and Egypt, defeated by the armies, the Gulf monarchies and Islamist leaderships.
      - tradition: liberalism.internationalist
        note: Arab peoples demanded dignity and accountable government, and Western states backed them too late and too unevenly.
      - tradition: marxism.ml
        position: intervention.humanitarian.imperial-pretext
        note: Real grievances were hijacked by Western and Gulf powers to topple governments that resisted them, as Libya and Syria showed.

  - id: event.libya-2011
    name: The Libyan war and NATO intervention
    date: "2011-02-15"
    end: "2011-10-23"
    place: Libya
    summary: >-
      Protests in Benghazi in February 2011 became an armed rebellion against Muammar Gaddafi's
      government, which answered with force. On 17 March the UN Security Council passed Resolution 1973,
      authorizing a no-fly zone and "all necessary measures" to protect civilians, with China, Russia,
      India, Brazil and Germany abstaining; NATO-led air strikes began two days later and continued until
      October, supporting rebel advances, while an African Union plan for a ceasefire was set aside.
      Gaddafi was captured and killed near Sirte on 20 October 2011. Libya then split among rival
      militias and governments, with renewed civil war from 2014, and became a main route for migrants to
      Europe, with reports in 2017 of African migrants sold in slave markets.
    disputed: >-
      Whether an imminent massacre in Benghazi justified intervention (NATO governments, advocates of
      the responsibility to protect) or the threat was overstated and the mandate stretched into
      overthrowing Gaddafi (Russia, China, the African Union, and a 2016 UK parliamentary committee
      report).
    stances:
      - tradition: liberalism.internationalist
        position: intervention.humanitarian.responsibility-to-protect
        note: A massacre in Benghazi was prevented under a UN mandate, even if the aftermath was badly neglected.
      - tradition: nationalism.pan-africanism
        position: intervention.humanitarian.neighbors-not-empires
        note: NATO brushed aside the African Union's plan and left a ruined state whose weapons and chaos spread across the Sahel.
      - tradition: marxism.ml
        position: intervention.humanitarian.imperial-pretext
        note: A humanitarian pretext for destroying an independent oil state, which ended with slave markets.
      - tradition: conservatism.paleo
        position: intervention.humanitarian.national-interest-only
        note: Another war of choice with no national interest at stake, which created a failed state and a migrant route to Europe.

  - id: event.rojava-2012
    name: The Rojava revolution and the self-administration of North and East Syria
    date: "2012-07-19"
    place: Northern and eastern Syria
    summary: >-
      In July 2012, as the Syrian civil war spread, government forces withdrew from Kurdish-majority areas
      of northern Syria, and the Democratic Union Party (PYD) and its People's Protection Units (YPG) took
      control. The administration organized communes and councils on Abdullah Öcalan's program of
      democratic confederalism, with co-chairs of both sexes in every office and women's fighting units
      (YPJ). With US air support, Kurdish forces held Kobani against the Islamic State in 2014–15, and the
      Syrian Democratic Forces, formed in 2015 with Arab and other allies, took Raqqa in 2017; Turkey,
      which regards the PYD as part of the PKK, invaded Afrin in 2018 and areas east of the Euphrates in
      2019. After Bashar al-Assad's government fell in December 2024, the SDF's commander signed an
      agreement in March 2025 with Syria's interim president on integrating the region's institutions
      into the Syrian state; after it stalled, a government offensive in January 2026 took Raqqa and
      Deir ez-Zor, and a new agreement provided for the SDF's phased integration into the state.
    problematic: hist.rojava
    disputed: >-
      How much power the communes hold as against the PYD and its cadres; Human Rights Watch and Amnesty
      International reported arrests of political rivals and forced displacement in some Arab villages,
      which the administration disputed. The PKK, with which Turkey identifies the PYD, announced its
      dissolution in May 2025 after a call from Öcalan. Developments after January 2026 are not recorded here.
    stances:
      - tradition: anarchism.confederalism
        position: hist.rojava.democratic-confederalism
        note: A revolution of communes, ecology and women's liberation without a nation-state, in the middle of a war.
      - tradition: marxism.leninism
        position: hist.rojava.kurdish-self-determination
        note: A stateless nation divided by imperial borders won self-rule after a century of denial.
      - tradition: nationalism.baathism
        position: hist.rojava.separatist-proxy
        note: A US-protected separatist project that partitioned Syria and handed its oil fields to an occupier.
      - tradition: nationalism.kemalism
        position: hist.rojava.pkk-threat
        note: A branch of the PKK armed by Washington on Turkey's border, and a threat to the Turkish nation's security.
      - tradition: marxism.third-camp
        position: hist.rojava.one-party-autonomy
        note: An admirable experiment in a terrible war, run in practice by one party, with real abuses that its supporters should name.
      - tradition: liberalism.internationalist
        position: hist.rojava.heroes-betrayed
        note: The fighters who broke the Islamic State were left to Turkish invasion when Washington pulled back.

  - id: event.belt-and-road
    name: The Belt and Road Initiative and China's new era
    date: "2013-09-07"
    place: China and some 150 partner states
    summary: >-
      Xi Jinping, who became general secretary of the Communist Party in November 2012, announced a "Silk
      Road Economic Belt" in Kazakhstan in September 2013 and a "Maritime Silk Road" in Indonesia the next
      month, later joined as the Belt and Road Initiative. Chinese state banks and companies financed and
      built ports, railways, power plants and roads across Asia, Africa, Latin America and Europe, and
      about 150 states signed cooperation agreements. Some borrowers ran into repayment difficulties, and
      in 2017 Sri Lanka leased Hambantota port to a Chinese company for 99 years. Over the same years
      China expanded its navy and its outposts in the South China Sea, and from 2017 detained large
      numbers of Uyghurs and other Muslims in Xinjiang in facilities the government calls vocational
      training centers.
    problematic: hist.china-present
    disputed: >-
      Whether Belt and Road lending is a debt trap (US officials and many Western analysts) or ordinary
      and often poorly managed development finance on which China has also restructured and lost money
      (Deborah Brautigam). Estimates of Xinjiang detentions range from hundreds of thousands to over a
      million; the Chinese government describes the facilities as counter-terrorism education, and the
      UN human rights office said in 2022 that serious violations there may amount to crimes against
      humanity.
    stances:
      - tradition: marxism.scc
        position: hist.china-present.new-era-socialism
        note: Socialism with Chinese characteristics for a new era shares development with the world through mutually beneficial cooperation.
      - tradition: nationalism.pan-africanism
        position: china.role.partner-that-builds
        note: China built in a decade the railways and ports the West promised Africa for sixty years.
      - tradition: liberalism.internationalist
        position: hist.china-present.threat-to-liberal-order
        note: A one-party state is using loans and infrastructure to export its model and bend the rules-based order.
      - tradition: marxism.mlm
        position: china.role.new-empire
        note: A new imperialism exporting capital and taking resources, like the old ones under a red flag.
      - tradition: conservatism.national
        position: hist.china-present.mercantilist-cheat
        note: A mercantilist rival took our industry with our own elites' help, and now builds its empire with the proceeds.
      - tradition: religious.post-islamism
        position: hist.china-present.surveillance-and-camps
        note: A surveillance state has interned a Muslim people for its faith, and Muslim governments have kept quiet for trade.

  - id: event.greece-2015
    name: The Greek referendum and the third bailout
    date: "2015-01-25"
    end: "2015-08-20"
    place: Greece and the eurozone
    summary: >-
      After five years of loans from eurozone governments and the IMF tied to austerity, during which
      Greece's economy shrank by about a quarter and unemployment passed 25 percent, the left party
      Syriza won the January 2015 election promising to end the bailout conditions. Negotiations with the
      creditors stalled, and after the European Central Bank capped emergency funding the government
      closed the banks and imposed capital controls; on 5 July 2015 about 61 percent of voters rejected
      the creditors' proposals in a referendum. Eight days later Prime Minister Alexis Tsipras accepted a
      third bailout of up to 86 billion euros with harsher conditions, after finance minister Yanis
      Varoufakis had resigned. Syriza split, won a second election in September, and carried out the
      program.
    problematic: hist.neoliberal-turn
    disputed: >-
      Whether Syriza had an alternative, such as leaving the euro (Costas Lapavitsas and the Popular
      Unity split) or a harder confrontation (Varoufakis), or had no realistic choice (Tsipras); whether
      the creditors' terms were needed to hold the currency union together (the German government and EU
      institutions) or were punishment meant to deter other left governments.
    stances:
      - tradition: socdem.democratic-socialism
        position: hist.neoliberal-turn.restoring-class-power
        note: The creditors overrode a people's vote to make an example of the first left government in the eurozone.
      - tradition: liberalism.ordoliberal
        position: debt.sovereign.pay-what-you-owe
        note: A currency union lives by its rules, and Greece had to reform its state and honor its commitments.
      - tradition: marxism.trotskyism
        position: finance.control.nationalize-credit
        note: Tsipras's surrender proved that austerity cannot be broken inside the euro without seizing the banks and breaking with the creditors.
      - tradition: conservatism.national
        position: intl.institutions.globalist-overreach
        note: Unelected officials in Brussels and Frankfurt overruled a sovereign nation's vote.
      - tradition: marxism.dependency
        position: hist.neoliberal-turn.debt-discipline-of-the-south
        note: Europe's own periphery received the structural adjustment once reserved for Latin America and Africa.

  - id: event.bolivia-2019
    name: The Bolivian crisis of 2019
    date: "2019-10-20"
    end: "2020-11-08"
    place: Bolivia
    summary: >-
      Evo Morales, Bolivia's first indigenous president, governed from 2006, nationalized hydrocarbons,
      cut poverty, and in 2009 won a constitution refounding Bolivia as a plurinational state. After
      voters narrowly rejected another term in a 2016 referendum, the constitutional court let him run,
      and his declared first-round victory in the 20 October 2019 election was challenged by the
      opposition and by an Organization of American States audit alleging irregularities. After weeks of
      protests, a police mutiny and the army chief's public call for his resignation, Morales resigned on
      10 November and left the country, and senator Jeanine Áñez declared herself interim president.
      Security forces killed at least 20 protesters, most of them indigenous, at Sacaba and Senkata in
      November; in October 2020 the MAS candidate Luis Arce won the presidency with 55 percent, and in
      2022 Áñez was sentenced to ten years in prison.
    problematic: hist.bolivia-2019
    disputed: >-
      Whether this was a coup (the MAS, much of the Latin American left, several governments) or a popular
      uprising against electoral fraud (the opposition, the OAS, the US government). Independent
      statisticians, including researchers at MIT, disputed the OAS audit's statistical case; others
      defended its findings on irregularities.
    stances:
      - tradition: nationalism.decolonial
        position: indigenous.sovereignty.plurinational-state
        note: A racist coup against the plurinational state, in which police tore the wiphala from their uniforms and the Bible was carried back into the palace.
      - tradition: liberalism.internationalist
        note: Morales defied the 2016 referendum and the audit found manipulation, and his fall was a civic revolt for constitutional rule.
      - tradition: marxism.ml
        note: A US-backed coup against an indigenous socialist government sitting on the world's largest lithium reserves.
      - tradition: conservatism.evangelical-right
        note: Christians who rose against fraud brought the Bible back into a government palace that had shut it out.

  - id: event.ukraine-2022
    name: The Russian invasion of Ukraine
    date: "2022-02-24"
    place: Ukraine and Russia
    summary: >-
      After the 2014 Maidan protests and the fall of President Viktor Yanukovych, Russia annexed Crimea
      and backed separatist forces in the Donbas, where fighting killed about 14,000 people by 2021
      despite the Minsk agreements. On 24 February 2022 Russia launched a full-scale invasion of
      Ukraine; its advance on Kyiv was turned back by April, Ukraine retook ground around Kharkiv and
      Kherson in late 2022, and the front then settled into a war of attrition. NATO states supplied
      Ukraine with weapons, intelligence and money and imposed wide sanctions on Russia, while most
      states of the global South declined to join the sanctions. Millions of Ukrainians fled abroad,
      casualties on both sides are estimated in the hundreds of thousands, and fighting continued
      through 2025.
    disputed: >-
      The causes: Russian imperial revanchism and denial of Ukrainian nationhood (Ukraine, NATO
      governments, most Western scholars), NATO's eastward expansion and Western policy since the 1990s
      (John Mearsheimer, parts of the left and the right), or both. Casualty figures vary widely and are
      disputed by both governments. Developments after 2025 are not recorded here.
    stances:
      - tradition: liberalism.internationalist
        position: contradiction.primary.democracy-vs-autocracy
        note: An unprovoked war of conquest by an autocracy against a sovereign democracy, which the free world must help Ukraine win.
      - tradition: nationalism.eurasianism
        position: world.order.civilizational-poles
        note: Russia is defending its civilization and its people against the Atlantic West's advance to its borders.
      - tradition: conservatism.paleo
        position: world.order.restraint
        note: NATO expansion provoked a great power on its own border, and the answer is a negotiated settlement, not endless war.
      - tradition: marxism.leninism
        position: nation.question.self-determination-leninist
        note: A great-power war against an oppressed nation's right to exist, and Ukraine's self-defense deserves support without illusions in NATO.
      - tradition: marxism.left-communism
        position: contradiction.primary.inter-imperialist-war
        note: A war between Russian and Western imperialism fought with Ukrainian and Russian workers' lives, in which workers have no side.
      - tradition: nationalism.pan-africanism
        position: world.order.multipolar-sovereignty
        note: Africa has no reason to take sides in a European war, and the West's double standards were noticed.

  - id: event.gaza-war-2023
    name: The October 7 attack and the war on Gaza
    date: "2023-10-07"
    place: Israel and the Gaza Strip
    summary: >-
      On 7 October 2023 Hamas-led fighters from Gaza attacked Israeli towns, kibbutzim, army posts and a
      music festival, killing about 1,200 people, most of them civilians, and taking about 250 hostages.
      Israel answered with an air and ground war on the Gaza Strip, under blockade since 2007, which
      displaced most of its 2.1 million people and damaged or destroyed most of its buildings; by mid-2025
      Gaza's health ministry counted over 60,000 Palestinians killed. In January 2024 the International
      Court of Justice, in a case brought by South Africa under the Genocide Convention, ordered Israel to
      prevent genocidal acts and allow aid, and in November 2024 the International Criminal Court issued
      arrest warrants for Benjamin Netanyahu, Yoav Gallant and Hamas commander Mohammed Deif. Famine was
      confirmed in Gaza City by the UN-backed food security classification in August 2025, and a ceasefire
      took effect in October 2025.
    disputed: >-
      Israel disputes the Gaza health ministry's figures, while studies published in The Lancet suggested
      undercounting. Whether Israel's war amounts to genocide is asserted by South Africa's case, a UN
      commission of inquiry in 2025 and many genocide scholars, and rejected by Israel and the United
      States. Whether the 7 October attack was resistance to occupation or terrorism is the dividing line
      of the wider debate. Developments after October 2025 are not recorded here.
    stances:
      - tradition: nationalism.palestinian
        position: hist.nakba-1948.ongoing-structure
        note: A genocide against a people kept under occupation and siege for decades, the Nakba continuing in the open.
      - tradition: nationalism.zionism-revisionist
        position: palestine.question.revisionist
        note: The worst massacre of Jews since the Holocaust demanded the destruction of Hamas, and Israel's security can rest only on its own strength.
      - tradition: liberalism.internationalist
        position: palestine.question.liberal-two-states
        note: Hamas's atrocities and the war's civilian toll both show that only two states for two peoples can end the cycle.
      - tradition: religious.islamism-brotherhood
        position: palestine.question.islamist-resistance
        note: Resistance to occupation and siege is a right and a duty, and Gaza's steadfastness shames the governments of the Muslim world.
      - tradition: conservatism.evangelical-right
        position: palestine.question.christian-zionist
        note: Standing with Israel against those who seek its destruction is a biblical duty.

  - id: event.sahel-alliance
    name: The Sahel coups and the Alliance of Sahel States
    date: "2020-08-18"
    place: Mali, Burkina Faso and Niger
    summary: >-
      Amid armed jihadist insurgencies that French and UN forces had not contained, soldiers took power
      in Mali in 2020 and again in 2021, in Burkina Faso twice in 2022, the second time under Captain
      Ibrahim Traoré, and in Niger in July 2023. The new governments expelled French troops, ended the UN
      mission in Mali, turned to Russian military contractors, and spoke the language of pan-Africanism
      and anti-imperialism, Traoré invoking Thomas Sankara by name. Mali, Burkina Faso and Niger formed the
      Alliance of Sahel States as a mutual-defense pact in September 2023, made it a confederation in July
      2024, and left ECOWAS in January 2025. Promised elections were postponed, and deaths and
      displacement from the conflicts remained high.
    disputed: >-
      Whether these governments are a second decolonization against French influence and the CFA franc
      (their supporters and many pan-Africanists) or military rule that has deepened insecurity and
      repression, with killings of civilians by armies and Russian contractors reported by Human Rights
      Watch and others. Developments after 2025 are not recorded here.
    stances:
      - tradition: nationalism.pan-africanism
        position: hist.decolonization.flag-independence
        note: The second independence, in which the Sahel throws out the French army and its local clients, as Sankara wanted.
      - tradition: marxism.third-worldism
        position: world.order.multipolar-sovereignty
        note: A multipolar world has given the Sahel room to choose its own partners and break with the old colonial power.
      - tradition: liberalism.internationalist
        note: Juntas that cancel elections and invite mercenaries have made the Sahel neither safer nor freer.
      - tradition: marxism.trotskyism
        note: Anti-French speeches cover officers who suppress unions and parties, and liberation needs workers' and peasants' power, not captains.

  - id: event.venezuela-2026
    name: Venezuela's disputed 2024 election and the US seizure of Maduro
    date: "2024-07-28"
    end: "2026-01-03"
    place: Venezuela and the Caribbean
    summary: >-
      Venezuela's economy shrank by roughly three-quarters after 2013 amid falling oil prices, policy
      failures and, from 2017, US financial and oil sanctions, and close to 8 million people emigrated.
      The electoral council declared Nicolás Maduro, Chávez's successor since 2013, the winner of the July
      2024 presidential election without publishing polling-station results, while the opposition
      published tally sheets it said showed that Edmundo González had won. From September 2025 US forces,
      massed in the Caribbean, struck boats the US government said were carrying drugs, killing more than a
      hundred people. On 3 January 2026 US forces carried out strikes in Venezuela and seized Maduro, who was
      flown to the United States to face drug-trafficking charges, and Vice President Delcy Rodríguez
      took over as acting president.
    problematic: hist.venezuela
    disputed: >-
      The causes of the collapse, between policy failure and corruption (most economists) and sanctions
      (Mark Weisbrot and Jeffrey Sachs estimated tens of thousands of deaths from them, a finding others
      contest); the 2024 result, which the Carter Center and a UN panel of experts said lacked
      transparency; and the legality of the boat strikes and the January 2026 operation under
      international and US law. These are recent events; developments after January 2026 are not
      recorded here.
    stances:
      - tradition: conservatism.neo
        position: hist.venezuela.criminal-state-removed
        note: A criminal government tied to drug trafficking that stole an election was rightly removed.
      - tradition: nationalism.bolivarianism
        position: hist.venezuela.economic-war
        note: Years of economic war and an armed kidnapping of the president are the empire's answer to a people who took back their oil.
      - tradition: marxism.trotskyism
        position: hist.venezuela.bolibourgeoisie
        note: A new bureaucratic and military bourgeoisie ruined the revolution, and US aggression must still be opposed without defending it.
      - tradition: liberalism.classical
        position: hist.venezuela.socialism-wrecked-it
        note: Expropriation, price controls and the destruction of checks on power turned the richest country in South America into its largest exodus.
      - tradition: marxism.dependency
        position: hist.venezuela.petrostate
        note: Neither Chávez nor Maduro escaped dependence on oil rent, and the petrostate's crisis left the country open to the empire.
