# Situation-gated pressure scenes for landed property: rent, flats, estates.
nodes:
  - id: pressure.landlord.rent-strike
    type: pressure
    title: The boiler
    tests: change.means.strike-and-direct-action
    gate: {classIs: [landed-capital]}
    text: >
      You own a six-flat building. The mortgage takes most of the rent. The boiler has failed twice this
      winter and the repair quote is 11,000. The tenants have formed an association and are paying rent
      into a holding account until the boiler is replaced and next year's 9% rise is dropped. Your bank
      payment is due on the fifteenth.
    why: This sets your rental income against what you hold about strikes and direct action.
    premises:
      - id: lease-is-lease
        text: The premise that tenants can bargain over a rent they already signed for.
        evidence: [{position: property.private.natural-right, w: 2}, {position: inequality.justice.process-not-pattern, w: 1}, {position: housing.tenure.asset-and-investment, w: 1}]
    conditions:
      - id: if-boiler
        text: It depends whether the boiler really is as bad as they say.
        evidence: [{position: profit.legitimacy.fair-not-gouging, w: 1}]
    options:
      - id: recognize
        text: Replace the boiler, drop the rise, and deal with the association as the tenants' voice from now on.
        pressure: principle
        cost: You take a second loan for the boiler. The building runs at a loss for two years.
        evidence: [{position: change.means.strike-and-direct-action, w: 1}, {position: property.private.social-function, w: 2}]
      - id: notice
        text: Fix the boiler, keep the rise, and don't renew the two organizers' leases when they end.
        pressure: interest
        cost: The strike breaks. You pay 4,000 in legal fees and the local paper prints your name.
        evidence: [{position: property.private.natural-right, w: 2}, {position: change.means.strike-and-direct-action, w: -1}, {position: housing.tenure.asset-and-investment, w: 1}]
      - id: one-by-one
        text: Fix the boiler, keep the rise, and refuse to deal with the association. Talk to each tenant alone.
        pressure: mixed
        cost: Three tenants settle. The rest keep withholding, and the bank adds late fees.
        evidence: [{position: workplace.conflict.partners-with-a-misunderstanding, w: 1}, {position: class.concept.no-such-thing, w: 1}]
      - id: sell
        text: Sell the building to the investment fund that has been writing to you.
        pressure: interest
        cost: You clear the mortgage with a small gain. The fund raises rents 20%; the tenants have a new landlord to fight.
        evidence: [{position: change.means.individual-exit, w: 2}, {position: firm.ownership.private-investors, w: 1}, {position: housing.tenure.asset-and-investment, w: 1}]

  - id: pressure.landlord.rent-freeze
    type: pressure
    title: The referendum
    tests: markets.nature.framed-tool
    gate: {classIs: [landed-capital]}
    text: >
      You rent out a two-bedroom flat. It is your pension plan, and the mortgage has nine years to run. The
      city votes next month on a five-year rent freeze. The agent reckons the flat would lose a fifth of its
      value. Your tenants, a nurse and her teenage son, have put a "Yes" poster in the window.
    why: This sets the value of your property against what you hold about markets needing limits.
    premises:
      - id: no-pension-from-rent
        text: The premise that rent is something a landlord earns.
        evidence: [{position: profit.legitimacy.rent-not-profit, w: 2}, {position: housing.tenure.class-question, w: 2}]
    conditions:
      - id: if-building
        text: It depends whether the city also builds housing, or only caps rents.
        evidence: [{position: markets.nature.framed-tool, w: 1}, {position: property.commons.public-ownership, w: 1}, {position: housing.tenure.social-housing, w: 2}]
    options:
      - id: yes
        text: Vote yes.
        pressure: principle
        cost: The freeze passes. The flat loses about a fifth of its value, and your pension plan has a hole in it.
        evidence: [{position: markets.nature.framed-tool, w: 2}, {position: property.private.social-function, w: 1}, {position: housing.tenure.rent-control, w: 3}]
      - id: no
        text: Vote no, and give money to the landlords' campaign.
        pressure: interest
        cost: The freeze fails by two points. At renewal you raise the rent 12%; your tenants start looking elsewhere.
        evidence: [{position: property.private.natural-right, w: 2}, {position: markets.nature.framed-tool, w: -1}, {position: housing.tenure.market-supply, w: 2}]
      - id: no-but-fair
        text: Vote no, and keep your own tenants' rent flat anyway.
        pressure: mixed
        cost: You give up about 1,400 a year in rent you could charge. Every other rent in the city goes on rising.
        evidence: [{position: profit.legitimacy.fair-not-gouging, w: 2}, {position: welfare.state.subsidiarity, w: 1}]
      - id: sell-first
        text: Sell before the vote, while prices hold.
        pressure: interest
        cost: You get out whole. The buyer wants it for short lets and gives your tenants two months' notice.
        evidence: [{position: change.means.individual-exit, w: 2}, {position: cs.own-first.family-first, w: 1}, {position: housing.tenure.asset-and-investment, w: 2}]

  - id: pressure.landlord.estate
    type: pressure
    title: The fallow field
    tests: property.private.social-function
    gate: {all: [{classIs: [landed-capital]}, {situation: {field: land, in: [own-farm-large]}}]}
    text: >
      Your estate is 1,800 hectares. Four hundred have lain fallow for six years while you wait for a better
      soy price. At dawn, 140 landless families walk onto the fallow land with tools and tarps. The law says
      idle land can be expropriated, paid in twenty-year bonds below market value. Your foreman says the
      police will come if you call.
    why: This sets your land against what you hold about property carrying obligations.
    premises:
      - id: idle-is-mine
        text: The premise that land left idle is anyone else's business.
        evidence: [{position: property.private.natural-right, w: 2}, {position: property.land.freehold, w: 1}]
    conditions:
      - id: if-farm
        text: It depends whether the families will actually farm it.
        evidence: [{position: property.land.to-the-tiller, w: 1}, {position: agrarian.question.family-farm, w: 1}]
    options:
      - id: offer
        text: Offer the 400 hectares to the land agency yourself and take the bonds.
        pressure: principle
        cost: You get about half what the soy buyer would have paid, in twenty years. The other estate owners stop inviting you.
        evidence: [{position: property.private.social-function, w: 2}, {position: property.land.to-the-tiller, w: 1}]
      - id: police
        text: Call the police and get an eviction order.
        pressure: interest
        cost: The eviction takes eleven days and makes the national news. One man is hurt. You keep all 1,800 hectares.
        evidence: [{position: property.private.natural-right, w: 2}, {position: property.land.freehold, w: 2}]
      - id: plant
        text: Rush the 400 hectares into soy so the law can't call it idle, and wait the families out.
        pressure: interest
        cost: You borrow at 19% to plant at a poor price. The families camp by the road for months.
        evidence: [{position: agrarian.question.commercial-farms, w: 2}, {position: property.land.freehold, w: 1}]
      - id: lease
        text: Lease the fallow land to the families as tenant farmers, at a low rent.
        pressure: mixed
        cost: You keep the title and a small rent. The families' movement calls it a trap, and half of them refuse.
        evidence: [{position: property.private.social-function, w: 1}, {position: property.private.natural-right, w: 1}]
