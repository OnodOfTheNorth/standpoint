problematics:
  - id: body.autonomy
    domain: culture
    layer: horizon
    question: "Abortion: whose decision, and on what grounds?"
    plain: When a woman is pregnant and does not want to continue, who decides, and what should the law say?
    short: abortion
    importance: 2
    region: gender
    positions:
      - id: body.autonomy.life-from-conception
        label: A human life from conception; the law must protect it
        claim: >
          From conception the embryo is a living human being with the same right to life as anyone
          else. Abortion is the killing of an innocent person, and the law should forbid it, while
          society supports mothers and children.
        voiced: >
          The right to life is the first of all rights, and it does not depend on size, age or
          whether someone is wanted. We do not ask the strong to decide whether the weak may live.
          Love them both: protect the child and stand by the mother.
        you: >
          You think a human life begins at conception and that the law should protect it from
          abortion, while helping mothers in need.
        because: >
          Biology shows that a new human organism, genetically distinct, begins at fertilization and
          develops continuously; every line drawn later (heartbeat, viability, birth) is arbitrary.
          If the unborn child is a human being, then no private choice can justify killing it, just
          as no private choice justifies killing a newborn. Legal abortion also teaches a society
          that a person's worth depends on being wanted, which threatens the disabled, the sick and
          the old.
        against:
          - from: feminism.liberal
            text: >
              Even if the fetus were a person, nobody is legally required to give their body to keep
              another alive, not even a parent donating a kidney. Forcing a woman to carry a pregnancy
              makes her the only person whose body the state may conscript.
          - from: marxism.social-reproduction
            text: >
              Bans do not end abortion; they end safe abortion for the poor. Rich women travel or pay
              private doctors, as Irish women went to England for decades, while poor women in Brazil
              and Nigeria die from unsafe procedures.
        sources:
          - {author: John Paul II, title: "Evangelium Vitae", year: 1995}
          - {author: Congregation for the Doctrine of the Faith, title: "Declaration on Procured Abortion", year: 1974}
          - {author: Robert P. George and Christopher Tollefsen, title: "Embryo: A Defense of Human Life", year: 2008}
        traditions:
          defining: [conservatism.cst, conservatism.evangelical-right]
          typical: [conservatism.integralism, conservatism.traditionalist, conservatism.christian-democracy, conservatism.paleo, libertarianism.paleo, conservatism.right-populism]
          contested: [conservatism.fusionism, libertarianism.minarchist, religious.liberation-theology]
          rejects: [feminism.liberal, feminism.radical, liberalism.progressive, marxism.social-reproduction, socdem.nordic]
        presupposes: []
        excludes: [body.autonomy.womans-choice, body.autonomy.free-legal-public]
        tension: [body.autonomy.graduated-sanctity]
        tags: []
        analysis:
          gains: [industrial-capital]
          pays: [core-workers, peripheral-workers, reserve-army]
          mechanism: >
            A ban places the cost of unwanted pregnancy on working-class and poor women, who lose
            earnings and take on years of unpaid care, while women with money travel or pay private
            clinics; the added unpaid care work lowers the cost of raising the next generation of
            workers for employers.
          drain: none
          law_of_value: suspends
          disputed: >
            Some materialists note that Catholic social teaching pairs the ban with family wages and
            child support against capital; the class effect then depends on whether that support
            is actually paid.

      - id: body.autonomy.graduated-sanctity
        label: The unborn gains moral weight as it grows; early abortion for serious reason
        claim: >
          The unborn has a moral worth that grows as it develops. Early abortion is allowed for
          serious reasons, and the law should restrict it more strictly as pregnancy advances. The
          mother's life comes first.
        voiced: >
          The soul is breathed into the child after one hundred and twenty days; before that,
          necessity may permit what afterward is forbidden. And if the mother's life is at stake,
          her life comes first, for she is a living person and the child is not yet born.
        you: >
          You think the fetus matters more the further pregnancy goes, so early abortion for good
          reason can be allowed but late abortion should be restricted, and the mother's life
          always comes first.
        because: >
          Nearly every tradition and most people's intuitions treat a six-week embryo differently
          from a baby about to be born. Islamic jurisprudence ties the full protection of the fetus
          to ensoulment at around four months, Jewish law puts the mother's life first until birth,
          and secular law in most of Europe allows abortion on request early and restricts it later.
          Germany's Christian democrats helped write the 1995 compromise under which abortion stays
          unlawful but unpunished in the first twelve weeks after counseling: life protected by
          persuasion and support rather than prison. A graded law fits the moral facts and keeps
          abortion safe without treating it as nothing.
        against:
          - from: conservatism.cst
            text: >
              Development is continuous; there is no moment when a non-person becomes a person. A
              line at twelve weeks or four months is a convention that protects some children and
              abandons others.
          - from: feminism.radical
            text: >
              Every limit hands the final say to doctors, judges and clerics. Women who need a late
              abortion are often the youngest, poorest and most desperate, the ones the limits catch.
        sources:
          - {author: Muhammad al-Bukhari, title: "Sahih al-Bukhari", year: "c. 846", note: "the hadith of Ibn Mas'ud on the stages of creation"}
          - {author: Mishnah, title: "Mishnah, Ohalot 7:6", year: "c. 200"}
          - {author: Supreme Court of the United States, title: "Roe v. Wade", year: 1973}
          - {author: Ronald Dworkin, title: "Life's Dominion", year: 1993}
        traditions:
          defining: [religious.post-islamism, conservatism.christian-democracy]
          typical: [religious.islamism-brotherhood, liberalism.social, socdem.third-way, religious.religious-zionism, religious.islamism-khomeinist]
          contested: [religious.salafism-quietist, liberalism.progressive]
          rejects: [conservatism.integralism, feminism.radical]
        presupposes: []
        excludes: []
        tension: [body.autonomy.life-from-conception, body.autonomy.womans-choice]
        tags: [global-south]
        analysis:
          gains: [professional-managerial]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Graded laws keep early abortion legal through public or private clinics, which serves
            women with money and information who act early, while poor and rural women who learn of
            a pregnancy late or cannot reach a clinic in time fall under the restrictions.
          drain: none
          law_of_value: regulates

      - id: body.autonomy.womans-choice
        label: The woman decides; it is her body
        claim: >
          The decision to continue or end a pregnancy belongs to the pregnant woman alone. The state
          should keep abortion legal, safe and private, and nobody else, husband, priest or judge,
          has the final word.
        voiced: >
          My body, my choice. No woman can be free if she does not control whether and when she
          becomes a mother. Keep your rosaries off our ovaries.
        you: >
          You think abortion is the pregnant woman's decision and that the law should keep it legal,
          safe and private.
        because: >
          Pregnancy happens inside one person's body, carries real risk to her health and life, and
          shapes her whole future. Thomson's argument holds even if the fetus is a person: nobody is
          obliged to lend their body to keep another alive. Where abortion is banned it does not
          stop; it moves into back rooms, and the WHO counts tens of thousands of women dying each
          year from unsafe abortion.
        against:
          - from: conservatism.cst
            text: >
              "Choice" names an act without naming its object. The child is not part of the woman's
              body; it has its own body, and the strong do not get to decide whether the weak live.
          - from: feminism.black
            text: >
              Choice means little to a woman who cannot afford the clinic, the childcare or the
              rent. The language of private choice also leaves out women sterilized against their
              will, who never got to choose to have children.
        sources:
          - {author: Judith Jarvis Thomson, title: "A Defense of Abortion", year: 1971}
          - {author: Simone de Beauvoir, title: "The Second Sex", year: 1949}
        traditions:
          defining: [feminism.liberal]
          typical: [liberalism.progressive, liberalism.social, liberalism.egalitarian, feminism.radical, socdem.nordic, libertarianism.left, feminism.queer]
          contested: [libertarianism.minarchist, libertarianism.objectivist, feminism.black]
          rejects: [conservatism.cst, conservatism.evangelical-right, conservatism.integralism, religious.islamism-brotherhood]
        presupposes: []
        excludes: [body.autonomy.life-from-conception, body.autonomy.national-need]
        tension: [body.autonomy.graduated-sanctity]
        tags: []
        analysis:
          gains: [professional-managerial, core-workers]
          pays: []
          mechanism: >
            Legal abortion lets women control the timing of children and so stay in education and
            paid work; framed as a private choice it leaves the cost of the procedure and of
            raising children with the household, so women with salaries gain most.
          drain: none
          law_of_value: none

      - id: body.autonomy.reproductive-justice
        label: The right to have children, not to have them, and to raise them safely
        claim: >
          The question is wider than abortion. Women need the right not to have children, the
          right to have them without being sterilized or punished, and the means to raise them in
          safety: housing, health care, income and freedom from police violence.
        voiced: >
          Reproductive justice is the human right to maintain personal bodily autonomy, have
          children, not have children, and parent the children we have in safe and sustainable
          communities. Choice is a luxury; justice is a demand.
        you: >
          You think abortion rights matter but are not enough: poor and minority women also need
          protection from forced sterilization and the means to raise the children they want.
        because: >
          The same states that banned abortion for some women sterilized others: Black and Native
          women in the United States, Puerto Rican women, millions of poor men and women during
          India's Emergency in 1975 to 1977, and some three hundred thousand Indigenous women in
          Peru in the 1990s. Population control and abortion bans are two faces of one power over
          whose children are wanted. Only material support for parenting makes any choice real.
        against:
          - from: feminism.liberal
            text: >
              Widening the demand to housing, wages and policing dilutes a clear legal right into a
              program nobody can win at once, and makes abortion rights hostage to everything else.
          - from: conservatism.cst
            text: >
              The movement rightly condemns forced sterilization and the neglect of poor mothers,
              then excludes the unborn child from the very justice it claims for every other life.
        sources:
          - {author: Loretta J. Ross and Rickie Solinger, title: "Reproductive Justice: An Introduction", year: 2017}
          - {author: Dorothy Roberts, title: "Killing the Black Body", year: 1997}
          - {author: Angela Y. Davis, title: "Women, Race and Class", year: 1981}
        traditions:
          defining: [feminism.black]
          typical: [feminism.decolonial, marxism.social-reproduction, marxism.black-radical, nationalism.indigenous-sovereignty, anarchism.feminist]
          contested: [feminism.liberal]
          rejects: [ecology.neo-malthusian, conservatism.evangelical-right]
        presupposes: []
        excludes: [body.autonomy.national-need]
        tension: []
        tags: [global-south]
        analysis:
          gains: [peripheral-workers, reserve-army, core-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Joining abortion rights to public health care, housing and income support moves the cost
            of raising children from poor households onto taxes on capital, and ending coercive
            sterilization removes a tool by which states and donors have managed the numbers of the
            poor in the periphery.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic

      - id: body.autonomy.free-legal-public
        label: Free, legal and public abortion as part of socialized care
        claim: >
          Abortion should be legal, free and provided by the public health service, together with
          sex education, contraception and socialized childcare, so that no woman is forced into or
          out of motherhood by money.
        voiced: >
          Sex education to decide, contraception to avoid abortion, legal abortion so as not to
          die. Legal, safe and free, in the public hospital, for all of us, not only for those who
          can pay.
        you: >
          You think abortion should be free in public hospitals and part of a wider program of
          public childcare, so that money never decides whether a woman becomes a mother.
        because: >
          Soviet Russia in 1920 was the first state to legalize abortion on request in public
          hospitals, and Cuba made it free in the 1960s. Argentina's green wave won legal abortion in
          2020 by mass mobilization, not court rulings, because the fight was about poor women dying
          in clandestine procedures. Control over reproduction has always been a battleground over
          the supply of labor; only public provision takes it out of the market and the pulpit.
        against:
          - from: conservatism.cst
            text: >
              Making abortion a free public service makes every taxpayer a party to it, including
              the millions whose faith forbids it, and treats the child as a health problem.
          - from: liberalism.classical
            text: >
              The Soviet state that legalized abortion in 1920 banned it again in 1936 when it wanted
              more workers and soldiers. A right that depends on the state's plan is not a right.
        sources:
          - {author: Alexandra Kollontai, title: "Communism and the Family", year: 1920}
          - {author: Silvia Federici, title: "Caliban and the Witch", year: 2004}
        traditions:
          defining: [feminism.materialist, marxism.social-reproduction]
          typical: [marxism.trotskyism, marxism.leninism, socdem.democratic-socialism, anarchism.feminist, marxism.autonomism, socdem.nordic]
          contested: [marxism.ml]
          rejects: [conservatism.cst, conservatism.evangelical-right, libertarianism.minarchist]
        presupposes: []
        excludes: [body.autonomy.life-from-conception]
        tension: []
        tags: [global-south]
        analysis:
          gains: [core-workers, peripheral-workers, reserve-army]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Public provision removes price as a barrier, so the poorest women gain most, and funds it
            from general taxation; paired with public childcare it shifts part of the cost of
            reproducing the workforce from women's unpaid hours to the public budget.
          drain: none
          law_of_value: suspends
          consciousness: hegemonic

      - id: body.autonomy.national-need
        label: Births are the nation's concern; the state may encourage or limit them
        claim: >
          How many children a people has decides its future, so the state has a legitimate say.
          Depending on the nation's need it may restrict abortion to raise births, or limit births
          to match resources and development.
        voiced: >
          A nation's numbers are its strength or its burden. Family planning is not a private
          matter when a billion mouths must be fed, nor when the cradles are empty and the villages
          die. The state plans births as it plans grain and steel.
        you: >
          You think the number of children born is a national question, and that the government may
          push births up or down according to what the country needs.
        because: >
          Population shapes everything a state must provide: food, schools, jobs, pensions, soldiers.
          China's birth limits from 1980 are credited by their defenders with easing the pressure
          on land and capital during rapid growth; today Hungary, Russia and others pay families to
          have children because shrinking populations cannot sustain pensions or defense. Leaving
          births to individual whim ignores that their sum is a collective fate.
        against:
          - from: feminism.black
            text: >
              Every population policy lands on women's bodies: forced sterilizations and abortions
              under the one-child policy and India's Emergency, Romania's 1966 abortion ban that
              filled orphanages. The state never plans men's bodies.
          - from: marxism.classical
            text: >
              "Overpopulation" is relative to capital's demand for labor, not to what the earth can
              feed. Malthus blamed the poor for their poverty; his heirs still do.
        sources:
          - {author: Thomas Robert Malthus, title: "An Essay on the Principle of Population", year: 1798}
          - {author: Paul R. Ehrlich, title: "The Population Bomb", year: 1968}
          - {author: Susan Greenhalgh, title: "Just One Child: Science and Policy in Deng's China", year: 2008}
        traditions:
          defining: [ecology.neo-malthusian]
          typical: [nationalism.developmental-state, conservatism.national, nationalism.eurasianism, marxism.scc, nationalism.ethnic]
          contested: [marxism.ml, fascism.identitarian]
          rejects: [feminism.liberal, feminism.black, conservatism.cst, libertarianism.minarchist]
        presupposes: []
        excludes: [body.autonomy.womans-choice, body.autonomy.reproductive-justice]
        tension: []
        tags: [global-south, natalism]
        analysis:
          gains: [industrial-capital, comprador-capital]
          pays: [peasantry, peripheral-workers, reserve-army]
          mechanism: >
            Antinatal campaigns funded by Western donors from the 1960s targeted poor peasant women
            in the periphery and treated their numbers, not the drain, as the cause of poverty;
            natalist policies raise the future labor supply and reward citizens who can already
            afford children through tax credits.
          drain: sustains
          law_of_value: regulates
          disputed: >
            Defenders of China's birth policy argue it raised per-capita income and women's schooling;
            demographers such as Greenhalgh and Wang Feng argue fertility was already falling and the
            coercion was unnecessary.

      - id: body.autonomy.private-matter
        label: Not something I'd do, but not the government's business either
        claim: >
          Abortion is a hard personal decision best left to the woman, her family and her doctor.
          The government should neither push it nor ban it, and politicians should stop fighting
          over it.
        voiced: >
          I wouldn't do it myself, and I don't like it. But who am I to tell another woman what to
          do? It's between her, her doctor and her God, not some politician.
        you: >
          You have your own feelings about abortion but think it is a private decision the
          government should stay out of.
        because: >
          Most people's views are mixed: they find abortion troubling and also distrust anyone who
          would police other people's pregnancies. Women who face the decision weigh their
          relationships, their means and the child's future in concrete terms that no law can
          anticipate. Keeping politics out lets families and consciences handle what they know best.
        against:
          - from: conservatism.evangelical-right
            text: >
              If abortion kills a child, it cannot be a private matter, any more than other killing
              is. Neutrality on whether a human being may be killed is itself a choice.
          - from: feminism.materialist
            text: >
              "Leave it to her and her doctor" assumes there is a clinic, a doctor and the money to
              pay. Stepping back from politics leaves the ban or the access to whoever is fighting.
        sources:
          - {author: Carol Gilligan, title: "In a Different Voice", year: 1982}
        traditions:
          defining: [commonsense.live-and-let-live]
          typical: [libertarianism.minarchist, liberalism.classical, commonsense.anti-politics]
          contested: [conservatism.burkean]
          rejects: [conservatism.integralism, conservatism.evangelical-right]
        presupposes: []
        excludes: [body.autonomy.national-need]
        tension: [body.autonomy.life-from-conception]
        tags: [common-sense]
        analysis:
          gains: [petty-bourgeoisie, professional-managerial]
          pays: [reserve-army]
          mechanism: >
            Treating the matter as private settles nothing about access, so the outcome follows
            local law and income: households with money and a nearby clinic exercise the private
            choice, poor and rural women depend on whatever the organized sides win.
          drain: none
          law_of_value: none

  - id: race.nature
    domain: culture
    layer: analysis
    question: What is race, and what explains racial inequality?
    plain: Why do some racial groups end up richer, safer and more powerful than others?
    short: race
    importance: 3
    region: race
    positions:
      - id: race.nature.prejudice
        label: Racism is prejudice and discrimination by individuals
        claim: >
          Race is a matter of appearance with no deeper meaning. Racial inequality comes from
          prejudice: people judging others by skin color and treating them worse in hiring,
          housing and the law, and from the lasting effects of past discrimination.
        voiced: >
          The problem is in the hearts and minds of people. Prejudice is learned, and it can be
          unlearned. Judge each person as an individual, enforce equal treatment, and the color
          line will fade.
        you: >
          You think racial inequality comes mainly from prejudiced people and unequal treatment,
          and that education and anti-discrimination law are the cure.
        because: >
          Audit studies show it plainly: identical job applications with names that sound Black,
          Arab or Dalit get fewer callbacks. Allport showed how prejudice forms from stereotypes
          and fades with equal-status contact; Myrdal showed America's racial order contradicted
          its own creed. Where law has punished discrimination and schools have taught equality,
          open prejudice has fallen sharply within a generation.
        against:
          - from: marxism.black-radical
            text: >
              Inequality reproduces itself without any prejudiced person: through inherited wealth,
              segregated property values and school funding tied to them. Cure every heart and the
              wealth gap would remain.
          - from: liberalism.classical
            text: >
              Counting every group difference as evidence of prejudice ignores differences in age,
              region, family structure and skills, and turns every disparity into an accusation.
        sources:
          - {author: Gordon W. Allport, title: "The Nature of Prejudice", year: 1954}
          - {author: Gunnar Myrdal, title: "An American Dilemma", year: 1944}
        traditions:
          defining: [liberalism.social]
          typical: [liberalism.progressive, liberalism.internationalist, conservatism.christian-democracy, socdem.third-way]
          contested: [liberalism.classical]
          rejects: [marxism.black-radical, fascism.nazism, fascism.identitarian]
        presupposes: []
        excludes: [race.nature.hereditarian]
        tension: [race.nature.structural]
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Locating racism in attitudes directs remedies to training, education and complaints
            procedures run by salaried professionals, and opens elite schools and firms to minority
            members, while gaps in property, wages and the global division of labor are untouched.
          drain: none
          law_of_value: none

      - id: race.nature.structural
        label: Racism is built into institutions, even without racists
        claim: >
          Race is a social category, not a biological one, and racial inequality is produced by
          institutions: housing, credit, schools, policing and courts that keep sorting people by
          race through ordinary rules, even when nobody intends it.
        voiced: >
          It is not about whether you are a good person. When a bank draws a red line around a
          neighborhood, when schools are funded by local property taxes, when police patrol some
          streets and not others, the system does the work. Racism without racists.
        you: >
          You think racial inequality is built into how institutions work, so it continues even
          when individuals are not prejudiced.
        because: >
          Carmichael and Hamilton distinguished individual racism from institutional racism in
          1967: a bomb in a church versus a thousand Black babies dying each year from poverty and
          neglect. Generations of exclusion from home loans and good schools turned into a wealth
          gap that passes down by inheritance. Brazil's claim to be a racial democracy did not stop
          Black Brazilians from being most of the poor, the imprisoned and those killed by police.
        against:
          - from: liberalism.classical
            text: >
              If every disparity proves structural racism, the theory cannot be tested. Some
              minority groups out-earn the majority under the same "structures," which the theory
              cannot explain.
          - from: marxism.classical
            text: >
              "Structures" with no owners: the account names institutions but not the class that
              runs them and profits, and so ends in diversity offices rather than a fight over
              property.
        sources:
          - {author: Stokely Carmichael and Charles V. Hamilton, title: "Black Power: The Politics of Liberation", year: 1967}
          - {author: Eduardo Bonilla-Silva, title: "Racism without Racists", year: 2003}
          - {author: Michael Omi and Howard Winant, title: "Racial Formation in the United States", year: 1986}
          - {author: Abdias do Nascimento, title: "O genocídio do negro brasileiro", year: 1978}
        traditions:
          defining: [liberalism.progressive]
          typical: [feminism.black, nationalism.black-nationalism, socdem.democratic-socialism, feminism.decolonial, liberalism.egalitarian]
          contested: [marxism.black-radical, socdem.left-populism]
          rejects: [liberalism.classical, conservatism.fusionism, libertarianism.minarchist, fascism.identitarian]
        presupposes: []
        excludes: [race.nature.hereditarian, race.nature.colorblind]
        tension: [race.nature.prejudice, race.nature.class-first]
        tags: [global-south]
        analysis:
          gains: [professional-managerial, core-workers, reserve-army]
          pays: [landed-capital, finance-capital]
          mechanism: >
            Naming institutional mechanisms (lending, zoning, school finance, policing) points to
            rule changes that move resources toward racialized workers and the poor; in practice
            the gains reach first the minority professionals hired to audit and reform those
            institutions.
          drain: none
          law_of_value: regulates
          disputed: >
            Class-first Marxists (Reed, Fields) say it reifies race; racial-capitalism theorists say
            it describes the structures without naming capital as their author.

      - id: race.nature.racial-capitalism
        label: Race was made by capitalism and empire to rank and cheapen labor
        claim: >
          Race was invented in the age of conquest and slavery to divide humanity into peoples
          fit to rule and peoples fit to be worked. Capitalism grew through that division, and
          racial inequality today, inside countries and between them, is its continuation.
        voiced: >
          Capitalism did not abolish racial difference; it fed on it. Slavery and colonial plunder
          financed the take-off of Europe. The color line is the line between the core and the
          periphery, between the worker paid for her labor and the one paid a fraction.
        you: >
          You think race was created to justify slavery and empire, and that capitalism still
          relies on ranking people by race to make some labor cheaper.
        because: >
          Williams showed the profits of the slave trade and plantations fed British industry;
          Du Bois showed how a "public and psychological wage" of whiteness split American workers
          after slavery. Robinson traced racial ranking inside Europe before it was carried abroad.
          Quijano showed the conquest of the Americas sorted the world's labor by race: wage labor
          for Europeans, serfdom and slavery for the rest. Today the wage gap between a worker in
          Dhaka and one in Detroit, doing the same work, runs along the same line.
        against:
          - from: marxism.classical
            text: >
              Capitalism also thrived on wholly white labor in England and on non-racial divisions
              elsewhere. Making race constitutive of capitalism blurs what is general (exploitation)
              with what is historical (a particular way of dividing workers).
          - from: liberalism.classical
            text: >
              Slavery and conquest are older than capitalism, and capitalist countries abolished the
              slave trade. Free markets have raised the incomes of formerly colonized peoples faster
              than any other system.
        sources:
          - {author: Cedric J. Robinson, title: "Black Marxism: The Making of the Black Radical Tradition", year: 1983}
          - {author: Eric Williams, title: "Capitalism and Slavery", year: 1944}
          - {author: W. E. B. Du Bois, title: "Black Reconstruction in America", year: 1935}
          - {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000}
          - {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}
        traditions:
          defining: [marxism.black-radical]
          typical: [marxism.third-worldism, marxism.dependency, nationalism.pan-africanism, nationalism.decolonial, feminism.black, marxism.world-systems]
          contested: [marxism.classical, marxism.trotskyism]
          rejects: [liberalism.classical, conservatism.fusionism, fascism.identitarian]
        presupposes: [history.motor.class-struggle]
        excludes: [race.nature.hereditarian, race.nature.colorblind]
        tension: [race.nature.class-first]
        tags: [global-south]
        analysis:
          gains: [peripheral-workers, reserve-army, peasantry, core-workers]
          pays: [finance-capital, industrial-capital, comprador-capital]
          mechanism: >
            Reading racial inequality as part of the world division of labor joins anti-racist
            struggle in the core to struggles over wages and resources in the periphery, which
            threatens the cheap labor and raw materials that core profits depend on.
          drain: reduces
          law_of_value: suspends
          disputed: >
            Classical Marxists and Reed dispute that race is necessary to capitalism; world-systems
            and dependency writers accept it.
          consciousness: hegemonic

      - id: race.nature.class-first
        label: Race is an ideology; the real inequality is class
        claim: >
          Race has no basis in biology; it is an idea invented to justify particular forms of
          exploitation. Most of what is called racial inequality is class inequality, and treating
          race as a real thing divides workers who share the same interests.
        voiced: >
          Racecraft, not race. The belief in race is like the belief in witchcraft: real in its
          effects, false in its object. Black and white workers are robbed by the same bosses and
          landlords; politics organized around race asks them to fight over crumbs.
        you: >
          You think racial inequality is mostly class inequality, and that politics built around
          race divides working people who should be united.
        because: >
          Fields showed that American racial ideology arose to explain slavery in a society that
          proclaimed liberty, not the other way around. Reed argues that race-based politics serves
          a Black and minority professional class that speaks for the poor while sharing the
          interests of capital. Universal programs (public jobs, health, housing) reach the poor of
          every race and build the unity that race-specific claims undermine.
        against:
          - from: marxism.black-radical
            text: >
              A Black worker with the same income as a white worker still faces more police, worse
              schools and less inherited wealth. Telling her to wait for the class struggle is what
              white labor movements told Black workers for a century.
          - from: liberalism.progressive
            text: >
              Middle-class Black families in the United States have less wealth than poor white
              ones in some measures. Class does not explain that; race does.
        sources:
          - {author: Karen E. Fields and Barbara J. Fields, title: "Racecraft: The Soul of Inequality in American Life", year: 2012}
          - {author: Adolph Reed Jr., title: "Class Notes", year: 2000}
          - {author: Oliver Cromwell Cox, title: "Caste, Class, and Race", year: 1948}
        traditions:
          defining: [marxism.classical]
          typical: [socdem.democratic-socialism, marxism.trotskyism, marxism.analytical, socdem.labourism, socdem.left-populism]
          contested: [marxism.ml, marxism.leninism]
          rejects: [liberalism.progressive, nationalism.black-nationalism, feminism.black]
        presupposes: [class.concept.relation-to-production]
        excludes: [race.nature.hereditarian]
        tension: [race.nature.structural, race.nature.racial-capitalism]
        tags: [debate.fraser-honneth]
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, finance-capital, professional-managerial]
          mechanism: >
            Universal programs paid from taxes on capital raise the floor for all low-wage workers,
            and the critique of race-based brokerage takes positions and funding from the
            professional stratum that manages minority representation.
          drain: none
          law_of_value: regulates
          disputed: >
            Third-Worldists object that a national class-first politics in the core ignores the
            racial division between core and periphery workers.
          consciousness: class-economic

      - id: race.nature.colorblind
        label: Race should not matter; gaps come from culture, family and policy
        claim: >
          The law and the state should treat people as individuals without regard to race. Most
          remaining gaps between groups come from differences in culture, family structure,
          schooling and from bad policies, not from present discrimination.
        voiced: >
          The content of our character, not the color of our skin. Group outcomes differ all over
          the world for reasons of history, skills and culture, and markets punish employers who
          throw away good workers for their color. Racial preferences are just discrimination
          with new victims.
        you: >
          You think race should play no role in law or public life, and that group differences
          today mostly come from culture, family and policy rather than discrimination.
        because: >
          Sowell's comparisons across countries show that minorities with no political power,
          Chinese in Southeast Asia, Indians in East Africa, Jews in Europe, often out-earned the
          majorities who discriminated against them; skills and habits explain more than color.
          Becker showed that discrimination is costly to the employer who practices it, and
          competition wears it down. Treating citizens by race keeps race alive.
        against:
          - from: liberalism.progressive
            text: >
              Neutral rules on unequal ground freeze the result of three centuries of unequal
              treatment. Colorblindness after segregation means keeping what segregation took.
          - from: marxism.black-radical
            text: >
              "Culture" does the work "biology" used to do: it blames the poor for their poverty
              while leaving aside who owns the land, the firms and the banks.
        sources:
          - {author: Thomas Sowell, title: "Race and Culture: A World View", year: 1994}
          - {author: Gary S. Becker, title: "The Economics of Discrimination", year: 1957}
          - {author: Shelby Steele, title: "The Content of Our Character", year: 1990}
        traditions:
          defining: [liberalism.classical, conservatism.fusionism]
          typical: [libertarianism.minarchist, liberalism.chicago, conservatism.neo, libertarianism.objectivist, conservatism.right-populism]
          contested: [conservatism.paleo]
          rejects: [liberalism.progressive, marxism.black-radical, nationalism.black-nationalism]
        presupposes: []
        excludes: [race.nature.structural, race.nature.racial-capitalism]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, landed-capital, petty-bourgeoisie]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Removing race from law while property, credit and school funding stay as they are
            preserves existing distributions of wealth and land; explaining gaps by culture shifts
            responsibility from employers, lenders and landlords to the poor themselves.
          drain: sustains
          law_of_value: extends

      - id: race.nature.hereditarian
        label: Group differences in ability are partly genetic and explain some gaps
        claim: >
          Human populations differ on average in measured cognitive ability, and part of that
          difference is inherited. These differences, not only discrimination or history, explain
          part of the gaps in income and achievement between racial groups.
        voiced: >
          We only follow the data. Intelligence is measurable and highly heritable; the averages
          differ between groups; and pretending otherwise leads to blaming discrimination for every
          gap and to policies that fail. Facts are not hate.
        you: >
          You think racial groups differ on average in inborn ability, and that this explains part
          of why some groups do better than others.
        because: >
          Twin and adoption studies find intelligence highly heritable within populations, and IQ
          scores predict income and schooling. Herrnstein and Murray argued that persistent gaps in
          average scores, which survived decades of school reform, make a purely environmental
          explanation implausible. Proponents say ignoring the possibility makes every gap an
          accusation of racism and dooms remedies built on that premise.
        against:
          - from: liberalism.egalitarian
            text: >
              Heritability within a group says nothing about the cause of differences between
              groups; height is heritable, yet nutrition changed whole nations' average height
              within decades. Flynn showed IQ scores rose sharply in a few generations, far too fast
              for genes, and Black-white score gaps in the United States have narrowed.
          - from: marxism.black-radical
            text: >
              Race science was born to justify slavery and conquest, and its "races" follow colonial
              categories, not genetic clusters: Africa alone holds more genetic diversity than the
              rest of the world combined. Each generation of hereditarians has been wrong about the
              groups they ranked.
          - from: conservatism.cst
            text: >
              Every human being bears the image of God and belongs to one human family; ranking
              peoples by inborn worth denies the dignity on which every right rests.
        sources:
          - {author: Richard J. Herrnstein and Charles Murray, title: "The Bell Curve", year: 1994}
          - {author: Arthur R. Jensen, title: "How Much Can We Boost IQ and Scholastic Achievement?", year: 1969}
          - {author: J. Philippe Rushton, title: "Race, Evolution, and Behavior", year: 1995}
        traditions:
          defining: [fascism.neoreaction]
          typical: [fascism.identitarian, fascism.nazism, libertarianism.paleo, conservatism.paleo, fascism.third-position]
          contested: [libertarianism.objectivist, conservatism.right-populism]
          rejects: [liberalism.social, liberalism.progressive, liberalism.egalitarian, marxism.black-radical, conservatism.cst, marxism.classical]
        presupposes: []
        excludes: [race.nature.structural, race.nature.racial-capitalism, race.nature.prejudice, race.nature.one-human-family]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital, landed-capital]
          pays: [reserve-army, peripheral-workers, core-workers]
          mechanism: >
            Treating gaps as innate justifies cutting spending on schools and remedies for the poor
            and, in works such as Lynn and Vanhanen's on national IQ, explains the poverty of whole
            regions by their people rather than by colonial extraction and unequal exchange, which
            protects those who gain from both.
          drain: sustains
          law_of_value: extends

      - id: race.nature.mixed-nation
        label: Our nation is mixed; racial division is foreign to us
        claim: >
          Here the peoples have mixed for centuries into one nation, and racial categories imported
          from abroad do not fit. Inequality is social and economic, and dividing citizens by race
          would break national unity.
        voiced: >
          We are a mestizo people, the cosmic race, the meeting of Indian, African and European.
          In this land there are no races, only Brazilians, only Mexicans, only Cubans. Talk of
          race is a foreign quarrel brought to divide us.
        you: >
          You think your country is a mixed nation where racial categories do not really apply,
          and that dividing citizens by race would harm national unity.
        because: >
          Latin America never had legal segregation on the American or South African model, and
          mixing across colors was widespread. Freyre and Vasconcelos made mixture the foundation
          of national identity, against European racism that despised mixed peoples. Cuba's
          revolution outlawed discrimination and set out to make a nation in which color counted
          for nothing.
        against:
          - from: liberalism.progressive
            text: >
              In Brazil Black and brown citizens earn about half of what white ones do, and are most
              of those killed by police. The myth of racial democracy is what lets this go unnamed.
          - from: nationalism.indigenous-sovereignty
            text: >
              Mestizaje was a program to absorb Indigenous peoples into the nation by erasing their
              languages and land claims. "We are all mixed" is said by the heirs of the hacienda.
        sources:
          - {author: Gilberto Freyre, title: "Casa-grande e senzala", year: 1933, note: "English title: The Masters and the Slaves"}
          - {author: José Vasconcelos, title: "La raza cósmica", year: 1925}
        traditions:
          defining: [nationalism.civic]
          typical: [nationalism.peronism, conservatism.traditionalist, nationalism.developmental-state, nationalism.kemalism]
          contested: [marxism.ml, nationalism.bolivarianism]
          rejects: [nationalism.black-nationalism, nationalism.indigenous-sovereignty, liberalism.progressive, fascism.identitarian]
        presupposes: []
        excludes: [race.nature.hereditarian]
        tension: [race.nature.structural]
        tags: [global-south]
        analysis:
          gains: [landed-capital, comprador-capital, petty-bourgeoisie]
          pays: [peasantry, reserve-army, peripheral-workers]
          mechanism: >
            Denying that race structures inequality removes the basis for claims to land and
            redress by Black and Indigenous communities, while the light-skinned owners of land and
            business keep holdings acquired under slavery and colonial rule.
          drain: none
          law_of_value: none
          disputed: >
            Some Latin American Marxists credit the national-popular idea of a mixed people with
            uniting the poor against foreign capital; Black and Indigenous movements see it as cover
            for their exclusion.

      - id: race.nature.one-human-family
        label: Racism is a sin against the one human family
        claim: >
          All people descend from one origin and share equal dignity before God. Racism is a sin of
          pride and hatred, and racial division is overcome through repentance, conversion and
          brotherhood across all peoples.
        voiced: >
          There is no superiority of an Arab over a non-Arab, nor of white over black, except in
          piety. God made of one blood all nations of men. Racism is a sin that wounds the body of
          the whole human family.
        you: >
          You see racism as a sin against the equal dignity of all people before God, to be overcome
          by repentance and brotherhood.
        because: >
          Every great religion teaches one human family; the Prophet's farewell sermon and the
          letter of Paul both deny any rank among peoples. Malcolm X found on the pilgrimage to
          Mecca people of every color worshipping as one, and King's movement grew in churches.
          Law can restrain discrimination, but only a change of heart removes the contempt beneath
          it, and faith communities that cross racial lines make that change real.
        against:
          - from: marxism.black-radical
            text: >
              The same churches blessed slavery and apartheid; the Dutch Reformed Church gave
              apartheid its theology. Calling racism a sin of the heart leaves its property
              relations standing.
          - from: liberalism.classical
            text: >
              A public policy built on repentance asks the state to judge consciences. Citizens owe
              each other equal treatment under law, not conversion.
        sources:
          - {author: Pontifical Commission for Justice and Peace, title: "The Church and Racism: Towards a More Fraternal Society", year: 1988}
          - {author: Malcolm X and Alex Haley, title: "The Autobiography of Malcolm X", year: 1965}
          - {author: Martin Luther King Jr., title: "Letter from Birmingham Jail", year: 1963}
        traditions:
          defining: [conservatism.cst]
          typical: [religious.liberation-theology, religious.christian-socialism, conservatism.christian-democracy, religious.islamism-brotherhood, conservatism.evangelical-right, religious.engaged-buddhism]
          contested: [conservatism.integralism]
          rejects: [fascism.nazism, fascism.identitarian]
        presupposes: []
        excludes: [race.nature.hereditarian]
        tension: []
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: []
          mechanism: >
            Religious anti-racism has given poor minority communities organization and moral
            standing, as in the Black church and base communities; as a doctrine of the heart it
            leaves the ownership of land and capital, and so the material gaps, unchanged.
          drain: none
          law_of_value: none

  - id: racism.remedy
    domain: culture
    layer: strategy
    question: What would end racial inequality?
    plain: If racial inequality is to end, what has to be done?
    short: ending racial inequality
    importance: 2
    region: race
    positions:
      - id: racism.remedy.equal-treatment-law
        label: Outlaw discrimination and enforce equal treatment
        claim: >
          Ban racial discrimination in jobs, housing, schools and the law, enforce the ban
          seriously, and let equal treatment over time close the gaps.
        voiced: >
          Equal protection of the laws, for everyone, enforced without fear or favor. The civil
          rights movement won the law; our task is to make every employer, landlord and police
          officer obey it.
        you: >
          You think the answer is strong laws against discrimination, fully enforced, so that every
          person is treated equally.
        because: >
          Legal discrimination was the backbone of racial orders from Jim Crow to apartheid, and
          tearing it down changed millions of lives within a generation. The UN convention against
          racial discrimination of 1965 made equal treatment an international norm. Enforcement
          works: testing and fines change how landlords and employers behave. Equal rules are also
          the only basis every citizen can accept.
        against:
          - from: liberalism.progressive
            text: >
              Equal treatment from now on leaves in place everything unequal treatment already
              built: the wealth, the neighborhoods, the schools. It is a race where one runner
              starts a lap behind.
          - from: marxism.black-radical
            text: >
              Formal equality arrived in the United States and South Africa and the wealth gaps
              barely moved. The law can stop a landlord from refusing a tenant; it cannot give the
              tenant the house.
        sources:
          - {author: United Nations General Assembly, title: "International Convention on the Elimination of All Forms of Racial Discrimination", year: 1965}
          - {author: United States Congress, title: "Civil Rights Act of 1964", year: 1964}
        traditions:
          defining: [liberalism.social]
          typical: [liberalism.classical, liberalism.internationalist, conservatism.christian-democracy, socdem.third-way, liberalism.egalitarian]
          contested: [libertarianism.minarchist]
          rejects: [fascism.identitarian, marxism.black-radical]
        presupposes: [race.nature.prejudice]
        excludes: []
        tension: [racism.remedy.reparations]
        tags: []
        analysis:
          gains: [professional-managerial, core-workers]
          pays: []
          mechanism: >
            Enforced equal treatment opens jobs, credit and housing markets to minority members who
            already have income and qualifications to compete, while those without property or
            skills gain little from access to markets they cannot afford.
          drain: none
          law_of_value: none

      - id: racism.remedy.targeted-redress
        label: Quotas and preferences to correct present gaps
        claim: >
          Equal treatment is not enough after centuries of exclusion. The state should reserve
          places in universities, public jobs and contracts for groups held back by race, until the
          gaps close.
        voiced: >
          The only remedy to past discrimination is present discrimination. Quotas opened the doors
          of Brazil's public universities to Black and Indigenous students for the first time; we
          will keep them open until the classrooms look like the country.
        you: >
          You think the state should reserve university places and jobs for disadvantaged racial
          groups until the gaps are closed.
        because: >
          India's reservations put Dalits and Adivasis into parliament, universities and civil
          service in numbers no amount of anti-discrimination law achieved. Brazil's 2012 quota law
          transformed the makeup of federal universities within a decade. Affirmative action
          targets the gap directly and builds a professional and political class from groups that
          had none, who then change the institutions from inside.
        against:
          - from: liberalism.classical
            text: >
              Preferences judge people by race, the very thing the civil rights movement fought.
              Sowell found that around the world preferences mostly benefit the better-off members
              of the favored group and stir resentment that lasts generations.
          - from: socdem.democratic-socialism
            text: >
              A quota distributes scarce places more fairly; it does not make places less scarce.
              The few who rise become the proof that the system works for the many who do not.
        sources:
          - {author: Ibram X. Kendi, title: "How to Be an Antiracist", year: 2019}
          - {author: Congresso Nacional do Brasil, title: "Lei n.º 12.711 (Lei de Cotas)", year: 2012}
          - {author: Thomas Sowell, title: "Affirmative Action Around the World", year: 2004, note: "critical study"}
        traditions:
          defining: [liberalism.progressive]
          typical: [nationalism.ambedkarite, feminism.black, liberalism.egalitarian, nationalism.black-nationalism, socdem.third-way]
          contested: [socdem.democratic-socialism, marxism.black-radical]
          rejects: [liberalism.classical, libertarianism.minarchist, conservatism.fusionism, conservatism.right-populism]
        presupposes: [race.nature.structural]
        excludes: [racism.remedy.colorblind-markets]
        tension: [racism.remedy.universal-programs]
        tags: [global-south]
        analysis:
          gains: [professional-managerial, petty-bourgeoisie]
          pays: []
          mechanism: >
            Reserved places in universities, civil service and public contracts create a salaried
            and business stratum within racialized groups; the cost falls on majority applicants
            for the same scarce places, not on owners of capital, and the poorest of the favored
            group often lack the schooling to use them.
          drain: none
          law_of_value: regulates
          disputed: >
            Ambedkarites hold that representation in the state is itself power for the whole
            community; class-first Marxists hold it mainly builds a comprador layer within it.

      - id: racism.remedy.reparations
        label: Pay reparations for slavery and colonial plunder
        claim: >
          Wealth taken through slavery, colonial rule and segregation should be paid back: to the
          descendants of the enslaved, and by former colonial powers to the countries they
          plundered, in money, land and cancelled debt.
        voiced: >
          They were paid for their slaves; we were never paid for our labor. Haiti paid France for
          its own freedom. Repair what was stolen: the land, the wages, the debt. Reparations are
          not charity; they are the bill.
        you: >
          You think the descendants of the enslaved and the formerly colonized are owed reparations
          from those who grew rich on slavery and colonial rule.
        because: >
          When Britain abolished slavery in 1833 it paid twenty million pounds in compensation to
          slave owners, not slaves; Haiti paid France an indemnity for its own independence for over
          a century. The wealth gaps between races and between continents trace back to these
          transfers. CARICOM's ten-point plan of 2014 sets out what repair means: debt
          cancellation, health, education and technology transfer.
        against:
          - from: liberalism.classical
            text: >
              Guilt and claims do not pass by blood. Today's taxpayers, many descended from migrants
              or from the poor of Europe, would pay for crimes they did not commit to people who did
              not suffer them.
          - from: marxism.classical
            text: >
              Money paid to individuals would flow back to landlords and retailers within a year.
              Without changing who owns production, reparations are a one-time transfer within a
              system that recreates the gap.
        sources:
          - {author: Ta-Nehisi Coates, title: "The Case for Reparations", year: 2014}
          - {author: Hilary McD. Beckles, title: "Britain's Black Debt: Reparations for Caribbean Slavery and Native Genocide", year: 2013}
          - {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}
        traditions:
          defining: [nationalism.pan-africanism]
          typical: [nationalism.black-nationalism, marxism.black-radical, nationalism.decolonial, marxism.third-worldism, nationalism.indigenous-sovereignty, liberalism.progressive]
          contested: [socdem.democratic-socialism, marxism.classical]
          rejects: [liberalism.classical, libertarianism.minarchist, conservatism.fusionism, conservatism.right-populism]
        presupposes: [race.nature.racial-capitalism]
        excludes: [racism.remedy.colorblind-markets]
        tension: [racism.remedy.equal-treatment-law]
        tags: [global-south]
        analysis:
          gains: [peripheral-workers, peasantry, reserve-army]
          pays: [finance-capital, landed-capital]
          mechanism: >
            Reparations between states, through debt cancellation and transfers, cut the flow of
            interest from periphery to core and return part of what colonial extraction took;
            domestic reparations move wealth from public budgets and old fortunes to the
            descendants of the enslaved.
          drain: reduces
          law_of_value: none
          disputed: >
            Some Marxists argue state-to-state reparations would be captured by comprador elites in
            the recipient countries unless tied to popular control.

      - id: racism.remedy.universal-programs
        label: Universal programs for all workers, and unity across color lines
        claim: >
          Racial gaps close fastest through programs that help everyone who works or is poor: public
          jobs, health care, housing, strong unions. These help the racially excluded most, without
          splitting workers by race.
        voiced: >
          Black and white, unite and fight. A job guarantee, free health care and public housing do
          more for the Black poor than any quota, and they build the majority needed to win them.
        you: >
          You think the best way to end racial inequality is universal programs for all working
          people, which help the most excluded most and keep workers united.
        because: >
          Because racialized groups are overrepresented among the poor, universal programs close
          racial gaps while winning broad support; targeted programs are easy to attack as favors.
          Rustin argued in 1965 that civil rights had to become a movement for jobs and income for
          all. Wilson showed the urban Black poor were hit hardest by the disappearance of
          industrial work, a class change with racial effects.
        against:
          - from: marxism.black-radical
            text: >
              The New Deal was "universal" and excluded farmworkers and domestic workers, which is to
              say most Black workers; the GI Bill paid white veterans' mortgages. Universal programs
              run through racist institutions come out racial.
          - from: liberalism.progressive
            text: >
              A rising tide lifts all boats in the same order. If the gap is racial, a remedy blind to
              race leaves it in place.
        sources:
          - {author: Bayard Rustin, title: "From Protest to Politics: The Future of the Civil Rights Movement", year: 1965}
          - {author: William Julius Wilson, title: "The Truly Disadvantaged", year: 1987}
          - {author: Adolph Reed Jr., title: "Class Notes", year: 2000}
        traditions:
          defining: [socdem.democratic-socialism]
          typical: [socdem.labourism, socdem.nordic, marxism.classical, socdem.left-populism, marxism.trotskyism]
          contested: [socdem.third-way, marxism.leninism]
          rejects: [liberalism.classical, libertarianism.minarchist]
        presupposes: [race.nature.class-first]
        excludes: []
        tension: [racism.remedy.targeted-redress]
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Public employment, health care and housing funded by progressive taxes raise the floor
            under all low-wage workers, which reduces the pressure of the reserve army on wages and
            makes it harder for employers to pit one group of workers against another.
          drain: none
          law_of_value: regulates
          consciousness: class-economic

      - id: racism.remedy.end-racial-capitalism
        label: Only overthrowing capitalism and empire ends racial inequality
        claim: >
          Racial inequality is part of how capitalism and empire work, so it cannot be reformed
          away. It ends only when the racialized poor of the world, together with the workers of
          the core, take power and end the system that needs them cheap.
        voiced: >
          We do not fight racism with racism; we fight it with solidarity. We do not fight
          capitalism with Black capitalism; we fight it with socialism. Our struggle is the
          struggle of the Vietnamese, the Angolans, the Palestinians: one enemy, one fight.
        you: >
          You think racial inequality will end only when capitalism and empire are overthrown by the
          racialized and the exploited acting together worldwide.
        because: >
          Every reform has been absorbed: formal equality produced a Black middle class and left the
          ghetto; independence produced national flags and left the plantations foreign-owned.
          Fanon argued that colonial divisions end only when the colonized seize the structures
          that produce them. The Black Panthers and the liberation movements of Africa and Asia saw
          that the same powers ran the ghetto and the colony.
        against:
          - from: liberalism.social
            text: >
              Waiting for revolution leaves today's victims of discrimination with nothing; civil
              rights law changed more lives than any vanguard.
          - from: nationalism.black-nationalism
            text: >
              Socialist movements led by whites have asked Black people to subordinate their cause
              for a century. Socialist states too kept racial hierarchies, and solidarity has to be
              earned before it is assumed.
        sources:
          - {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}
          - {author: Huey P. Newton, title: "Revolutionary Suicide", year: 1973}
          - {author: Cedric J. Robinson, title: "Black Marxism: The Making of the Black Radical Tradition", year: 1983}
        traditions:
          defining: [marxism.black-radical, marxism.third-worldism]
          typical: [marxism.maoism, marxism.ml, marxism.mlm, nationalism.pan-africanism, marxism.guevarism, anarchism.communist]
          contested: [marxism.trotskyism, nationalism.black-nationalism]
          rejects: [liberalism.classical, liberalism.social, conservatism.fusionism]
        presupposes: [race.nature.racial-capitalism, history.motor.class-struggle]
        excludes: [racism.remedy.colorblind-markets]
        tension: [racism.remedy.self-determination]
        tags: [global-south]
        analysis:
          gains: [peripheral-workers, peasantry, reserve-army, core-workers]
          pays: [finance-capital, industrial-capital, comprador-capital, landed-capital]
          mechanism: >
            Joining racialized workers in the core to anti-imperialist movements in the periphery
            targets the ownership of land, mines and factories that profits from cheap labor, and
            the comprador classes that broker it.
          drain: breaks
          law_of_value: abolishes
          consciousness: hegemonic

      - id: racism.remedy.colorblind-markets
        label: End racial preferences; growth, choice and markets lift every group
        claim: >
          Remove race from all law and policy, including preferences. Economic growth, school
          choice, safe streets and open markets lift disadvantaged groups faster than any program
          that sorts citizens by race.
        voiced: >
          The way to stop discriminating by race is to stop discriminating by race. Give poor kids
          the right to leave failing schools, let people start businesses without licenses and
          permits, keep the streets safe, and get out of the way.
        you: >
          You think the remedy is to take race out of policy completely and rely on growth,
          competition and school choice to lift everyone.
        because: >
          Group mobility has come from work, schooling and enterprise, not from government
          sorting: immigrant groups that arrived poor rose within two generations. Licensing laws,
          minimum wages and zoning shut the poor out of jobs and housing, and fall hardest on
          minorities. Ending preferences ends resentment and lets success be seen as earned.
        against:
          - from: liberalism.progressive
            text: >
              Markets price in the past. Families with no inherited wealth cannot buy in good school
              districts, and "choice" means choice for those who can move.
          - from: marxism.black-radical
            text: >
              The free market sold Africans before it employed them. Leaving racial gaps to the
              market leaves them to the owners who profit from cheap, divided labor.
        sources:
          - {author: Thomas Sowell, title: "Affirmative Action Around the World", year: 2004}
          - {author: Milton Friedman, title: "Capitalism and Freedom", year: 1962}
          - {author: Walter E. Williams, title: "The State Against Blacks", year: 1982}
        traditions:
          defining: [liberalism.classical, libertarianism.minarchist]
          typical: [liberalism.chicago, conservatism.fusionism, libertarianism.objectivist, libertarianism.ancap, conservatism.neo]
          contested: [conservatism.right-populism]
          rejects: [liberalism.progressive, marxism.black-radical, nationalism.pan-africanism]
        presupposes: [race.nature.colorblind]
        excludes: [racism.remedy.targeted-redress, racism.remedy.reparations, racism.remedy.end-racial-capitalism]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital, petty-bourgeoisie]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Ending preferences while deregulating labor and housing leaves inherited wealth gaps in
            place and widens the pool of low-wage labor; school choice moves public education money
            toward private operators and families able to travel or top up fees.
          drain: sustains
          law_of_value: extends

      - id: racism.remedy.self-determination
        label: Build our own power, institutions and economy
        claim: >
          The racially oppressed must build their own organizations, businesses, schools and
          political power, and control their own communities, rather than wait for acceptance from
          the dominant group.
        voiced: >
          Black man, you are on your own. Up, you mighty race, you can accomplish what you will.
          Before we can join anyone as equals, we must define ourselves, control our own
          communities and stop asking permission.
        you: >
          You think racially oppressed people must build their own institutions and power rather
          than rely on integration or on outside allies.
        because: >
          Garvey's movement organized millions with its own ships, newspapers and businesses. Biko's
          Black Consciousness argued that integration on white terms keeps Black people in the
          position of the junior partner, and that liberation starts with the mind. Carmichael and
          Hamilton called for community control of schools, police and economy, because coalitions
          between the powerful and the powerless serve the powerful.
        against:
          - from: marxism.classical
            text: >
              Separate institutions under capitalism produce a separate set of owners and bosses who
              exploit their own people. Black capitalism is still capitalism.
          - from: liberalism.social
            text: >
              Separation abandons the claim on the whole society's wealth and institutions, which
              belong to those whose labor built them as much as anyone.
        sources:
          - {author: Marcus Garvey, title: "Philosophy and Opinions of Marcus Garvey", year: 1923}
          - {author: Steve Biko, title: "I Write What I Like", year: 1978}
          - {author: Stokely Carmichael and Charles V. Hamilton, title: "Black Power: The Politics of Liberation", year: 1967}
        traditions:
          defining: [nationalism.black-nationalism]
          typical: [nationalism.pan-africanism, nationalism.indigenous-sovereignty, nationalism.ambedkarite, marxism.black-radical]
          contested: [marxism.third-worldism]
          rejects: [liberalism.classical, socdem.democratic-socialism, marxism.classical]
        presupposes: [race.nature.structural]
        excludes: []
        tension: [racism.remedy.universal-programs, racism.remedy.end-racial-capitalism]
        tags: [global-south]
        analysis:
          gains: [petty-bourgeoisie, reserve-army]
          pays: []
          mechanism: >
            Community control and separate enterprise build organization and a business and
            professional stratum within the oppressed group; the poor gain schools and services
            under their own control, but ownership of the wider economy is left to others.
          drain: none
          law_of_value: none
          disputed: >
            Black radicals within the tradition (the Panthers, Rodney) argued self-determination must
            be socialist or it produces a comprador layer; Garveyites and cultural nationalists
            disagree.
          consciousness: economic-corporate

      - id: racism.remedy.reconciliation
        label: Truth, forgiveness and reconciliation between peoples
        claim: >
          Racial division ends when the truth about past wrongs is told openly, those responsible
          acknowledge it, victims are heard and honored, and the communities build a shared future
          through forgiveness rather than revenge.
        voiced: >
          Without forgiveness there is no future. We tell the truth, all of it, so that the wounds
          can be cleaned and heal. Ubuntu: my humanity is bound up in yours, the oppressor's
          humanity too.
        you: >
          You think racial division ends through telling the truth about past wrongs, acknowledging
          them, and reconciliation rather than revenge.
        because: >
          South Africa ended apartheid without the civil war many predicted, in part because the
          Truth and Reconciliation Commission let victims speak and perpetrators confess in public.
          Rwanda, Canada and Chile have used similar commissions. Vengeance passes hatred to the next
          generation; acknowledgment and forgiveness break the cycle and let people live together.
        against:
          - from: marxism.black-radical
            text: >
              South Africa got reconciliation and kept the land and mines in white and foreign hands;
              thirty years on it is among the most unequal countries on earth. Forgiveness was asked
              of the poor, and property was spared.
          - from: liberalism.classical
            text: >
              Amnesty for confession trades justice for peace. Victims were asked to forgive killers
              who walked free.
        sources:
          - {author: Desmond Tutu, title: "No Future Without Forgiveness", year: 1999}
          - {author: Truth and Reconciliation Commission of South Africa, title: "Truth and Reconciliation Commission of South Africa Report", year: 1998}
        traditions:
          defining: [religious.christian-socialism]
          typical: [conservatism.cst, religious.liberation-theology, conservatism.christian-democracy, liberalism.social, religious.engaged-buddhism, nationalism.gandhian]
          contested: [nationalism.pan-africanism]
          rejects: [marxism.black-radical, marxism.third-worldism]
        presupposes: [race.nature.one-human-family]
        excludes: []
        tension: [racism.remedy.reparations]
        tags: [global-south]
        analysis:
          gains: [landed-capital, finance-capital, comprador-capital, professional-managerial]
          pays: [reserve-army, peasantry, peripheral-workers]
          mechanism: >
            Settling a racial order through acknowledgment and amnesty, without redistribution,
            secures existing property in land, mines and finance; in South Africa a new Black
            professional and business stratum entered the elite while unemployment among the Black
            poor stayed among the highest in the world.
          drain: sustains
          law_of_value: none
          disputed: >
            Defenders argue the negotiated settlement avoided a war that would have hurt the poor
            most; critics in the ANC's left and the EFF call it the elite pact of 1994.
