# History, part 5: Burkina Faso under Sankara, Venezuela since 1999, Rojava, the Zapatistas.
# See history.yaml and the header of history-c.yaml for the index of history files.
problematics:
  # ------------------------------------------------------------------
  - id: hist.sankara
    domain: history
    layer: analysis
    question: What was Burkina Faso's revolution under Thomas Sankara, 1983–1987?
    plain: >-
      In August 1983 a group of young officers took power in Upper Volta and made Captain Thomas Sankara president. In four years the
      country, renamed Burkina Faso, ran mass vaccination and literacy campaigns, planted millions of trees, banned forced marriage and
      excision, and refused to pay its debt. In October 1987 Sankara was killed in a coup led by his comrade Blaise Compaoré. What was it?
    short: Sankara's Burkina Faso
    importance: 2
    region: history
    positions:
      - id: hist.sankara.self-reliant-revolution
        label: Africa's most honest revolution, self-reliant, feminist and ecological
        claim: >-
          Sankara's revolution showed that one of the poorest countries in the world could feed, vaccinate and school its people by its
          own effort: consume what it produced, free women from forced marriage and excision, stop the desert, and refuse the debt that
          tied it to its old colonizer.
        voiced: >-
          "He who feeds you, controls you. Let us consume only what we ourselves control. The revolution and women's liberation go
          together; we do not talk of women's emancipation as an act of charity."
        you: You see Sankara's Burkina Faso as a model of what an African country can do when it relies on itself.
        because: >-
          In a two-week "commando" campaign in late 1984 some two million or more children were vaccinated against measles, meningitis
          and yellow fever. The regime planted millions of trees against the Sahel's desertification, built schools and clinics by
          popular labor, cut ministers' salaries and sold the official Mercedes fleet. In July 1987 at the OAU in Addis Ababa Sankara
          called on Africa to refuse jointly to pay the debt.
        against:
          - from: liberalism.classical
            text: >-
              Austerity on civil servants, compulsory "popular" labor and price controls hurt the urban workers and traders on whom any
              economy depends; growth was modest.
          - from: marxism.trotskyism
            text: >-
              The revolution came by coup and governed through the army and the Committees for the Defense of the Revolution; when the
              teachers struck in 1984 more than a thousand were dismissed.
        sources:
          - {author: Thomas Sankara, title: "Thomas Sankara Speaks: The Burkina Faso Revolution, 1983–87", year: 1988}
          - {author: Thomas Sankara, title: "Women's Liberation and the African Freedom Struggle", year: 1990}
          - {author: Amber Murrey (ed.), title: "A Certain Amount of Madness: The Life, Politics and Legacies of Thomas Sankara", year: 2018}
        traditions:
          defining: [nationalism.pan-africanism, marxism.african-socialism]
          typical: [marxism.third-worldism, marxism.black-radical, feminism.decolonial, marxism.ecosocialism]
          rejects: [liberalism.chicago]
        presupposes: [development.path.delinking]
        excludes: [hist.sankara.rectification-needed]
        analysis:
          gains: [peasantry, peripheral-workers, reserve-army]
          pays: [comprador-capital, finance-capital, professional-managerial]
          mechanism: >-
            Holding up self-reliance and debt refusal points peripheral states to cut imports and repayments and to spend on rural
            health and food, which reduces the revenue of foreign creditors and importers and the salaries of the urban official layer.
          drain: breaks
          law_of_value: suspends
          consciousness: hegemonic
      - id: hist.sankara.killed-by-francafrique
        label: A revolution ended by France and its local allies for defying them
        claim: >-
          Sankara was killed because he challenged the system by which France and its African allies managed West Africa: the debt, the
          franc zone, the client presidents. Compaoré's coup restored that order, and Compaoré ruled for 27 years as its partner.
        voiced: >-
          "They killed him because he said the debt could not be paid and should not be paid. Françafrique could not allow a poor
          country to show that another road existed."
        you: You think Sankara's death was the work of the neocolonial order he defied, with Compaoré as its instrument.
        because: >-
          Sankara had publicly rebuked President Mitterrand in Ouagadougou in 1986 and had fallen out with Côte d'Ivoire's Houphouët-
          Boigny, France's closest ally in the region and Compaoré's patron by marriage. After 1987 Compaoré signed an IMF adjustment
          program in 1991 and became a pillar of French policy in West Africa. In 2022 a Burkinabè military court convicted Compaoré in
          absentia of complicity in Sankara's murder. Verschave described the French networks behind such client states.
        against:
          - from: liberalism.internationalist
            text: >-
              No document has proven French direction of the coup; the 2022 trial convicted Burkinabè men. Rivalries inside the
              revolutionary leadership are enough to explain it.
          - from: marxism.trotskyism
            text: >-
              Blaming Paris lets off the internal weakness: a revolution without organized mass support among workers was easy to
              decapitate.
        sources:
          - {author: François-Xavier Verschave, title: "La Françafrique: le plus long scandale de la République", year: 1998}
          - {author: Bruno Jaffré, title: "Biographie de Thomas Sankara: la patrie ou la mort", year: 1997}
        traditions:
          defining: [nationalism.pan-africanism]
          typical: [marxism.third-worldism, marxism.dependency, nationalism.black-nationalism, nationalism.decolonial]
          rejects: [liberalism.internationalist]
        presupposes: [comprador.nature.broker-class]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >-
            Explaining the coup by the neocolonial order directs anger at the French state, French firms and the client elites who broker
            the franc zone and the debt, which supports present demands to leave the CFA franc and expel foreign bases.
          drain: breaks
          law_of_value: none
          disputed: >-
            The extent of any French or Ivorian role in the 1987 coup is disputed; archives France has released have not settled it.
      - id: hist.sankara.revolution-from-above
        label: A sincere revolution from above that lost its own base
        claim: >-
          Sankara meant what he said, but his revolution was made by officers and imposed through the army and the Committees for the
          Defense of the Revolution. It clashed with the unions, the teachers and parts of the left, and when the coup came the
          organized people were not there to defend him.
        voiced: >-
          "Sankara was the best of the soldiers, but a revolution decreed from a barracks is not a revolution of the workers. He fired
          the striking teachers and the CDRs bullied the market women."
        you: You admire Sankara but think his revolution, made from above by soldiers, could not last.
        because: >-
          The National Council of the Revolution came to power by coup, banned the old parties and in 1984 dismissed more than a
          thousand striking teachers. The CDRs, meant to organize the people, often acted as neighborhood police. Revolutionary People's
          Tribunals tried former officials. Harsch and Peterson show Sankara himself, in 1987, recognizing that the revolution had lost
          support and calling for a pause, weeks before he was killed.
        against:
          - from: nationalism.pan-africanism
            text: >-
              The "unions" that opposed him were led by a party (the PAI-LIPAD) with its own ambitions for power. A revolution under
              siege from Paris and Abidjan could not wait for consensus.
          - from: liberalism.classical
            text: >-
              The flaw was not that it came from above but that it was a revolution at all; the economy needed markets and investment.
        sources:
          - {author: Ernest Harsch, title: "Thomas Sankara: An African Revolutionary", year: 2014}
          - {author: Brian J. Peterson, title: "Thomas Sankara: A Revolutionary in Cold War Africa", year: 2021}
        traditions:
          typical: [marxism.trotskyism, anarchism.communist, socdem.democratic-socialism, marxism.luxemburgism]
          contested: [marxism.african-socialism]
          rejects: [nationalism.pan-africanism]
        presupposes: [change.agent.workers-as-class]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [professional-managerial]
          mechanism: >-
            Faulting the revolution for its military method directs movements in the South to build unions and mass organizations before
            or instead of seizing state power, which protects workers' independence but leaves officers as the likelier makers of change.
          drain: none
          law_of_value: none
      - id: hist.sankara.military-dictatorship
        label: A charismatic military dictatorship without elections
        claim: >-
          Sankara took power by force, banned parties, ruled without elections and used revolutionary tribunals and neighborhood
          committees against opponents. However attractive his program, it was military rule, and it ended as such rule does, in another
          coup.
        voiced: >-
          "He was likeable, honest and brave, and he was a soldier who seized power and never asked the people for a vote. Charisma is
          not consent."
        you: You see Sankara's government as a military dictatorship, however well-meaning.
        because: >-
          The National Council of the Revolution was never elected; independent unions and parties were suppressed, and opponents were
          detained without trial and some executed after a 1984 plot. Englebert shows how weak institutions in Burkina made every
          government since independence depend on the army, and Sankara's was no exception.
        against:
          - from: nationalism.pan-africanism
            text: >-
              Upper Volta's "elections" before 1983 returned the same French-backed elite; Compaoré held elections for 27 years and
              changed nothing. Popular welfare is a better test.
          - from: marxism.african-socialism
            text: >-
              Liberal procedure in a country of illiterate peasants, without roads or radio, is a form the elite fills with its own men.
        sources:
          - {author: Pierre Englebert, title: "Burkina Faso: Unsteady Statehood in West Africa", year: 1996}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.classical, conservatism.christian-democracy, liberalism.social]
          rejects: [nationalism.pan-africanism, marxism.african-socialism]
        presupposes: [elections.role.choose-and-remove-rulers]
        analysis:
          gains: [professional-managerial, comprador-capital]
          pays: [peasantry]
          mechanism: >-
            Judging the period by elections rather than by welfare favors the educated urban elites who compete in electoral politics,
            and in practice treated Compaoré's elected governments of the 1990s and 2000s as normal while the rural majority stayed poor.
          drain: softens
          law_of_value: none
      - id: hist.sankara.rectification-needed
        label: A well-meant experiment that ignored economics and needed correcting
        claim: >-
          The revolution's austerity, forced labor campaigns and hostility to traders and investors could not last. The "rectification"
          after 1987 and the IMF-backed opening of the 1990s brought Burkina Faso back to the world economy and to growth.
        voiced: >-
          "The young captain had good intentions and no economics. You cannot build a country by sending civil servants to dig ditches
          on Saturdays and chasing away every investor."
        you: You think Sankara's revolution was idealistic and that the market opening after it was necessary.
        because: >-
          Under the revolution civil servants' pay was cut and contributions demanded, urban rents were suspended in 1985, and private
          traders were squeezed; the urban middle class turned against it. After 1991 Burkina Faso adopted structural adjustment, cotton
          output expanded and gold mining grew into the main export. GDP grew faster in the 1990s and 2000s than in the 1980s.
        against:
          - from: nationalism.pan-africanism
            text: >-
              Growth went to the gold companies and to the Compaoré family; Burkina stayed near the bottom of the human development index
              for 27 years, and the people rose against him in 2014.
          - from: marxism.dependency
            text: >-
              Cotton and gold exports are the colonial economy restored: raw materials priced in Paris and London, mines owned abroad.
        sources:
          - {author: Pierre Englebert, title: "Burkina Faso: Unsteady Statehood in West Africa", year: 1996}
        traditions:
          typical: [liberalism.chicago, liberalism.technocratic, liberalism.classical]
          rejects: [nationalism.pan-africanism, marxism.dependency, marxism.african-socialism]
        presupposes: [development.path.integration]
        excludes: [hist.sankara.self-reliant-revolution]
        analysis:
          gains: [comprador-capital, finance-capital, professional-managerial]
          pays: [peasantry, peripheral-workers]
          mechanism: >-
            Endorsing the opening after 1987 backs export cotton and foreign-owned gold mining, whose revenues flow to foreign
            shareholders and the officials who license them, while cotton farmers sell at world prices set elsewhere.
          drain: sustains
          law_of_value: extends
  # ------------------------------------------------------------------
  - id: hist.venezuela
    domain: history
    layer: analysis
    question: What has Venezuela's Bolivarian process been, from Chávez to the present?
    plain: >-
      Hugo Chávez was elected in 1998 and used oil revenue for social programs; he survived a coup in 2002 and an oil lockout. After
      his death in 2013 Nicolás Maduro governed through an economic collapse, US sanctions and disputed elections; millions emigrated.
      In January 2026 US forces seized Maduro. What has it been?
    short: Bolivarian Venezuela
    importance: 2
    region: history
    positions:
      - id: hist.venezuela.bolivarian-revolution
        label: A revolution that put the oil wealth in the hands of the poor
        claim: >-
          Chávez's Bolivarian revolution took back control of oil, rewrote the constitution with the people, and used the revenue for
          health, schooling, food and housing in the barrios. It has been under attack from the Venezuelan oligarchy and Washington from
          the start.
        voiced: >-
          "We have woken the people. The oil belongs to Venezuela, and now it serves the poor, not the oligarchy and the gringo
          companies. Socialism or death!"
        you: You see the Bolivarian process as a revolution of the poor that made Venezuela's oil serve its people.
        because: >-
          The 1999 constitution was drafted by an elected assembly and approved by referendum. After the 2002–03 oil lockout the
          government took real control of PDVSA, and the misiones brought Cuban doctors to poor neighborhoods and literacy and food
          programs to millions; official figures show household poverty roughly halved between 2003 and 2008. In April 2002 a coup
          installed a business leader as president for two days, and the poor of Caracas brought Chávez back.
        against:
          - from: liberalism.classical
            text: >-
              The programs lived on a record oil price. When it fell in 2014 there were no savings and no other exports, and the poor
              were hit hardest by the collapse that followed.
          - from: marxism.trotskyism
            text: >-
              Most of the economy stayed private, the importers grew rich on currency controls, and a new bureaucratic elite took shape
              around the state; this was redistribution of rent, not socialism.
        sources:
          - {author: Marta Harnecker, title: "Understanding the Venezuelan Revolution: Hugo Chávez Talks to Marta Harnecker", year: 2005}
          - {author: George Ciccariello-Maher, title: "We Created Chávez: A People's History of the Venezuelan Revolution", year: 2013}
        traditions:
          defining: [nationalism.bolivarianism]
          typical: [marxism.ml, marxism.third-worldism, religious.liberation-theology, socdem.left-populism]
          rejects: [liberalism.classical, conservatism.neo]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [hist.venezuela.socialism-wrecked-it]
        analysis:
          gains: [peripheral-workers, reserve-army, peasantry]
          pays: [comprador-capital, finance-capital]
          mechanism: >-
            Holding up the Bolivarian process backs state control of oil rent and its use for social programs, which takes revenue from
            foreign oil firms and from the domestic elite that brokered it, but leaves the economy dependent on a single export price.
          drain: reduces
          law_of_value: regulates
          consciousness: hegemonic
      - id: hist.venezuela.communes-from-below
        label: The real revolution was the communes, held back by the state
        claim: >-
          The deepest part of the Bolivarian process was the self-organization of the poor: communal councils, communes, cooperatives
          and barrio collectives. The state both sponsored and smothered them, and their fate decides whether anything remains.
        voiced: >-
          "Commune or nothing! The commune is the space where we will give birth to socialism, from below. The ministries cannot do it
          for us."
        you: You think the heart of Venezuela's process was the communes and barrio organizations, not the government.
        because: >-
          The 2006 law on communal councils gave neighborhood assemblies their own budgets, and from 2009 communes linked them into
          larger units; by the 2010s thousands were registered. In his last cabinet speech, in October 2012, Chávez demanded "commune or
          nothing". Ciccariello-Maher shows communes running farms and distribution while the state bureaucracy and party machine resisted
          handing over resources.
        against:
          - from: marxism.ml
            text: >-
              Communes cannot defend themselves against coups, sanctions and invasion; only a strong state and armed forces could, and the
              communes depended on state money anyway.
          - from: liberalism.classical
            text: >-
              Communal councils became channels of patronage for the governing party, distributing food boxes in exchange for loyalty.
        sources:
          - {author: George Ciccariello-Maher, title: "Building the Commune: Radical Democracy in Venezuela", year: 2016}
          - {author: Hugo Chávez, title: "Golpe de timón (Strike at the Helm)", year: 2012}
        traditions:
          typical: [marxism.autonomism, anarchism.communalism, marxism.mariategui, religious.liberation-theology]
          contested: [nationalism.bolivarianism]
          rejects: [liberalism.classical]
        presupposes: [democracy.form.council]
        analysis:
          gains: [peripheral-workers, reserve-army, peasantry]
          pays: [professional-managerial, comprador-capital]
          mechanism: >-
            Locating the revolution in the communes directs resources and authority to neighborhood and producer assemblies rather than
            ministries, which threatens both the private importers and the state managers who allocate oil revenue.
          drain: reduces
          law_of_value: suspends
      - id: hist.venezuela.petrostate
        label: A petro-state that never escaped its oil rent
        claim: >-
          Under every government since the 1920s Venezuela has lived on oil rent. Chávez spent it on the poor instead of the rich, but
          did not build other industries; when the price collapsed in 2014, so did the country, as it had in the 1980s.
        voiced: >-
          "The magical state lives on rent from the ground, not on work. Whoever controls the oil money is the state, and whoever loses
          it falls."
        you: You think Venezuela's crisis comes from dependence on oil, whatever the government's politics.
        because: >-
          Oil made up over 90 percent of export earnings throughout the Chávez years. Coronil showed how oil rent made the Venezuelan
          state appear as a magical provider long before Chávez; Karl showed how oil booms weaken every other part of an economy. The
          oil price fell from over $100 in 2014 to under $30 in early 2016, and imports, on which food and medicine depended, collapsed.
        against:
          - from: nationalism.bolivarianism
            text: >-
              Diversification takes decades and was sabotaged by the lockout, capital flight and then sanctions that blocked credit and
              oil sales. Blaming oil erases the siege.
          - from: liberalism.chicago
            text: >-
              Norway and Chile manage resource wealth; Venezuela's problem was price controls, expropriations and printing money, not oil.
        sources:
          - {author: Fernando Coronil, title: "The Magical State: Nature, Money, and Modernity in Venezuela", year: 1997}
          - {author: Terry Lynn Karl, title: "The Paradox of Plenty: Oil Booms and Petro-States", year: 1997}
        traditions:
          typical: [marxism.dependency, ecology.degrowth, marxism.world-systems, nationalism.decolonial]
          contested: [nationalism.bolivarianism]
        presupposes: [poverty.cause.colonial-legacy]
        analysis:
          gains: [peripheral-workers]
          pays: [comprador-capital]
          mechanism: >-
            Reading the crisis as rentier dependence points to building domestic agriculture and industry against the import
            interests that oil rent sustains, and casts the extractive model itself, not only its distribution, as the problem.
          drain: reduces
          law_of_value: regulates
      - id: hist.venezuela.socialism-wrecked-it
        label: Populist socialism that wrecked a rich country and ended its liberal democracy
        claim: >-
          Chávez and Maduro concentrated power, packed the courts, expropriated firms and imposed price and currency controls that
          destroyed production. The result was hyperinflation, hunger and the largest exodus in Latin American history, and an elected
          government that stopped losing elections.
        voiced: >-
          "This is what socialism does: the country with the largest oil reserves on earth can't feed its people. Price controls empty
          the shelves, expropriations end investment, and then they jail the opposition."
        you: You think the Bolivarian government's socialist policies caused Venezuela's collapse and destroyed its liberal democracy.
        because: >-
          Oil output fell from about 3 million barrels a day at the end of the 1990s to well under half that before the 2019 sanctions
          on oil, as PDVSA was purged and starved of investment. Inflation passed a million percent in 2018. Over 7 million Venezuelans
          had left by 2024 (UN figures). Corrales and Penfold trace the steady capture of courts, electoral authority and media. After
          the July 2024 election the electoral authority declared Maduro the winner without publishing the tallies by polling station;
          the opposition published tallies showing its candidate ahead.
        against:
          - from: nationalism.bolivarianism
            text: >-
              US financial sanctions from 2017 and the oil embargo from 2019 cut Venezuela off from credit and its main market; the
              opposition backed a coup in 2002, a lockout in 2002–03 and a self-proclaimed president in 2019. Collapse was imposed.
          - from: marxism.dependency
            text: >-
              Output was already falling under the pre-Chávez governments, and the liberal "Punto Fijo" order of 1958–98 had left half
              the country in poverty and massacred protesters in the 1989 Caracazo.
        sources:
          - {author: Javier Corrales and Michael Penfold, title: "Dragon in the Tropics: Hugo Chávez and the Political Economy of Revolution in Venezuela", year: 2011}
          - {author: The Carter Center, title: "Statement on Venezuela's Election", year: 2024}
        traditions:
          defining: [liberalism.classical]
          typical: [liberalism.chicago, liberalism.internationalist, conservatism.christian-democracy, liberalism.austrian]
          rejects: [nationalism.bolivarianism, marxism.ml]
        presupposes: [capitalism.nature.free-exchange]
        excludes: [hist.venezuela.bolivarian-revolution]
        analysis:
          gains: [finance-capital, comprador-capital, professional-managerial]
          pays: [peripheral-workers, reserve-army]
          mechanism: >-
            Blaming socialism alone recommends reopening the oil sector to private and foreign firms and repaying foreign bondholders,
            which would return oil rent to the companies and the Venezuelan elite that held it before 1999.
          drain: sustains
          law_of_value: extends
      - id: hist.venezuela.economic-war
        label: An economic war by Washington that caused the collapse
        claim: >-
          From the 2002 coup to the sanctions of 2017 and 2019, the recognition of a self-proclaimed president and the military
          threats that followed, the United States has waged war on Venezuela by other means. The hunger and emigration are its
          results.
        voiced: >-
          "They blocked our accounts, seized our refinery in the United States and our gold in London, and then said socialism had
          failed. Sanctions are a siege, and sieges starve people."
        you: You think US sanctions and pressure, more than the government's policies, caused Venezuela's crisis.
        because: >-
          The August 2017 sanctions barred Venezuela from refinancing its debt in US markets; the January 2019 measures blocked oil sales
          to the US, its largest cash customer, and handed control of the US refiner CITGO to the opposition; the Bank of England kept
          Venezuela's gold. Weisbrot and Sachs estimated tens of thousands of excess deaths from the 2017 sanctions; the UN independent
          expert de Zayas compared them to medieval sieges.
        against:
          - from: liberalism.classical
            text: >-
              Oil output and the economy had already collapsed before the 2017 sanctions; hyperinflation began in 2016. The death
              estimate rests on contested assumptions.
          - from: marxism.trotskyism
            text: >-
              Sanctions made a disaster worse, but the government's own policies and its bureaucratic elite created it; anti-imperialism
              cannot excuse that.
        sources:
          - {author: Mark Weisbrot and Jeffrey Sachs, title: "Economic Sanctions as Collective Punishment: The Case of Venezuela", year: 2019}
          - {author: Alfred de Zayas, title: "Report of the Independent Expert on the Promotion of a Democratic and Equitable International Order on His Mission to the Bolivarian Republic of Venezuela and Ecuador", year: 2018}
        traditions:
          defining: [marxism.third-worldism]
          typical: [nationalism.bolivarianism, marxism.ml, marxism.dependency, conservatism.paleo]
          rejects: [conservatism.neo, liberalism.internationalist]
        presupposes: [intl.sanctions.economic-war]
        analysis:
          gains: [peripheral-workers, reserve-army]
          pays: [finance-capital]
          mechanism: >-
            Holding sanctions responsible makes lifting them the first demand, which would restore Venezuela's access to credit and oil
            markets on its own terms and deny core governments the use of financial blockade against nationalizing states.
          drain: reduces
          law_of_value: none
          disputed: >-
            The Weisbrot and Sachs estimate of about 40,000 deaths in 2017–18 is disputed; critics note the economic collapse preceded
            the oil sanctions.
      - id: hist.venezuela.bolibourgeoisie
        label: A revolution betrayed by a new bureaucratic and military bourgeoisie
        claim: >-
          The Bolivarian process created a new elite of officials, officers and contractors who grew rich on oil rent and currency
          controls, while workers' control was blocked and dissenting socialists were jailed. Its collapse is their doing as much as
          Washington's.
        voiced: >-
          "The boliburguesía bought dollars at the official rate and sold them on the black market, the generals took the ports and the
          mines, and the workers who tried to run their plants were told to obey."
        you: You think a new bureaucratic and military elite betrayed Venezuela's revolution from inside.
        because: >-
          Under currency controls from 2003, those with access to cheap official dollars could make fortunes; tens of billions of
          dollars went to fictitious import companies. From 2016 the military controlled food distribution and the Orinoco Mining Arc.
          Workers' control at the Guayana steel and aluminum plants was reversed. Ellner, sympathetic to the process, and Uzcátegui, an
          anarchist critic, both document the rise of the new elite.
        against:
          - from: nationalism.bolivarianism
            text: >-
              Corruption is real and is prosecuted; but the left critics' attacks are used by the right and by Washington, who want the
              whole process gone, not purified.
          - from: liberalism.classical
            text: >-
              The new elite was created by the controls and the state economy; there is no "real socialism" that would avoid it.
        sources:
          - {author: Rafael Uzcátegui, title: "Venezuela: la revolución como espectáculo", year: 2010}
          - {author: Steve Ellner, title: "Rethinking Venezuelan Politics: Class, Conflict, and the Chávez Phenomenon", year: 2008}
        traditions:
          typical: [marxism.trotskyism, marxism.third-camp, anarchism.communist, anarchism.syndicalist]
          rejects: [nationalism.bolivarianism]
        presupposes: [comprador.nature.bureaucratic-bourgeoisie]
        analysis:
          gains: [peripheral-workers, core-workers]
          pays: [professional-managerial, comprador-capital]
          mechanism: >-
            Naming a new bureaucratic bourgeoisie directs workers against the officials and officers who capture oil rent, which supports
            independent unions and workers' control but also weakens the government in a contest with Washington.
          drain: none
          law_of_value: suspends
      - id: hist.venezuela.criminal-state-removed
        label: A criminal dictatorship tied to drug trafficking, rightly removed
        claim: >-
          By the 2020s Venezuela's government was a criminal enterprise that stole elections, jailed opponents and worked with drug
          traffickers. On this view the US operation that seized Maduro in January 2026 removed a dictator the Venezuelan people could
          not remove themselves.
        voiced: >-
          "This was not a government but a mafia state: the generals and the ruling family in business with the cartels. The people
          voted him out in 2024 and he refused to go."
        you: You think Maduro's government was a criminal dictatorship, and that removing it by force was justified.
        because: >-
          In 2020 the US Justice Department indicted Maduro and other senior officials on narco-terrorism charges. A UN fact-finding
          mission in 2020 found evidence of extrajudicial killings and torture by security forces. After July 2024 the opposition's
          tallies showed its candidate winning, and the government arrested thousands of protesters. Naím described "mafia states" in
          which criminal networks and governments merge.
        against:
          - from: liberalism.internationalist
            text: >-
              Seizing a head of state by unilateral force breaks the UN Charter and sets a precedent any great power can use. A stolen
              election does not license an invasion.
          - from: nationalism.bolivarianism
            text: >-
              The "narco-state" charge is the pretext, as weapons of mass destruction were in Iraq. The prize is the largest oil reserves
              on earth.
        sources:
          - {author: Moisés Naím, title: "Mafia States: Organized Crime Takes Office", year: 2012, note: "Foreign Affairs"}
          - {author: UN Independent International Fact-Finding Mission on Venezuela, title: "Detailed Findings of the Independent International Fact-Finding Mission on the Bolivarian Republic of Venezuela", year: 2020}
        traditions:
          defining: [conservatism.neo]
          typical: [conservatism.right-populism, conservatism.national, conservatism.fusionism]
          contested: [liberalism.internationalist]
          rejects: [nationalism.bolivarianism, marxism.third-worldism, conservatism.paleo]
        presupposes: [intl.sovereignty.conditional-on-rights]
        excludes: [hist.venezuela.bolivarian-revolution, hist.venezuela.economic-war]
        analysis:
          gains: [finance-capital, comprador-capital]
          pays: [peripheral-workers]
          mechanism: >-
            Justifying removal by outside force establishes that a peripheral government holding large oil reserves can be overthrown
            by the core power, which reopens those reserves to foreign firms and shows every other such government what disobedience
            costs.
          drain: sustains
          law_of_value: extends
  # ------------------------------------------------------------------
  - id: hist.rojava
    domain: history
    layer: analysis
    question: What is the self-administration of North and East Syria, known as Rojava?
    plain: >-
      In 2012, during Syria's civil war, government forces withdrew from the Kurdish-majority north, and the Kurdish PYD and its
      militias took over. They proclaimed autonomous cantons run by communes with women co-chairs, broke the Islamic State's siege of
      Kobanî with US air support, and took Raqqa in 2017. Turkey has attacked them repeatedly. What is it?
    short: Rojava
    importance: 2
    region: history
    positions:
      - id: hist.rojava.democratic-confederalism
        label: A revolution of communes and women's liberation without a nation-state
        claim: >-
          Rojava is the attempt to build democratic confederalism: power in communes and councils rather than a state, co-chairs of each
          sex at every level, women's own armed units, an economy of cooperatives, and coexistence of Kurds, Arabs, Syriacs and others.
        voiced: >-
          "The nation-state is the problem, not the solution. A revolution that does not free women is not a revolution. We are building
          a democratic nation, not a Kurdish state."
        you: You see Rojava as a revolution that is building self-government, women's liberation and ecology without a nation-state.
        because: >-
          The 2014 Social Contract of the cantons guaranteed equal representation of women, set up a co-chair system and recognized
          several languages. The women's units (YPJ) fought at Kobanî and Raqqa. Öcalan's prison writings drew on Bookchin's
          communalism to break with the PKK's earlier aim of a Kurdish state. Knapp, Flach and Ayboğa describe commune assemblies,
          women's houses and cooperatives at work.
        against:
          - from: marxism.ml
            text: >-
              An experiment protected by US air power and sitting on Syria's oil fields is not an alternative to imperialism but a part
              of its strategy in Syria.
          - from: liberalism.internationalist
            text: >-
              Real power lies with the PYD and the military command trained by PKK cadres; rival Kurdish parties were shut down and
              conscription imposed.
        sources:
          - {author: Abdullah Öcalan, title: "Democratic Confederalism", year: 2011}
          - {author: "Michael Knapp, Anja Flach and Ercan Ayboğa", title: "Revolution in Rojava: Democratic Autonomy and Women's Liberation in Syrian Kurdistan", year: 2016}
          - {author: Thomas Schmidinger, title: "Rojava: Revolution, War and the Future of Syria's Kurds", year: 2018}
        traditions:
          defining: [anarchism.confederalism]
          typical: [anarchism.communalism, anarchism.feminist, anarchism.communist, ecology.environmental-justice]
          contested: [marxism.ml]
          rejects: [nationalism.baathism, nationalism.kemalism]
        presupposes: [nation.question.democratic-nation]
        excludes: [hist.rojava.pkk-threat, hist.rojava.separatist-proxy]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, comprador-capital]
          mechanism: >-
            Holding Rojava up as a model directs movements to build communes, cooperatives and women's councils under arms, which
            removes land and local power from tribal landlords and state officials and depends on outside military protection to
            survive.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic
      - id: hist.rojava.kurdish-self-determination
        label: A stateless people winning self-rule after a century of denial
        claim: >-
          The Kurds were divided among four states after 1918 and denied their language and rights in each. In Syria many were stripped
          of citizenship in 1962. Rojava is first of all a Kurdish people taking self-government, by whatever political model.
        voiced: >-
          "For a hundred years we were told we did not exist. In Syria they took our citizenship and our names. Now we govern ourselves,
          and no one will take that back."
        you: You see Rojava mainly as the Kurdish people's right to rule themselves.
        because: >-
          The Sykes–Picot settlement and the 1923 Treaty of Lausanne left the Kurds without a state; Syria's 1962 census stripped around
          120,000 Kurds of citizenship and their descendants stayed stateless. The Kurdish language was restricted in schools in Syria,
          Turkey and Iran. McDowall shows a century of suppressed risings. Autonomy in Syria is the first lasting Kurdish self-rule there.
        against:
          - from: anarchism.confederalism
            text: >-
              Reducing the revolution to Kurdish nationalism misses its point: it is a multi-ethnic democratic project that rejects the
              nation-state, Kurdish or not.
          - from: nationalism.baathism
            text: >-
              The SDF governs large Arab-majority regions, Raqqa and Deir ez-Zor, where Kurds are a small minority; "Kurdish self-rule"
              there is occupation.
        sources:
          - {author: David McDowall, title: "A Modern History of the Kurds", year: 1996}
        traditions:
          typical: [marxism.leninism, nationalism.decolonial, nationalism.ethnic, nationalism.civic]
          contested: [anarchism.confederalism]
          rejects: [nationalism.kemalism, nationalism.baathism]
        presupposes: [nation.question.self-determination-leninist]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [professional-managerial]
          mechanism: >-
            Defending the right of an oppressed nation to self-rule supports Kurdish control over their own land, language and schools
            against the officials and settlers placed by the states that held them, and leaves the class question inside the nation
            open.
          drain: none
          law_of_value: none
      - id: hist.rojava.separatist-proxy
        label: A US-protected separatist project that partitioned Syria
        claim: >-
          Rojava survives because the United States has bases in it. It holds Syria's oil fields and much of its wheat, including large
          Arab-majority areas, and has served Washington's aim of keeping Syria weak and divided.
        voiced: >-
          "They call it a revolution; it is a US protectorate. The Americans guard the oil wells and the Kurdish leadership guards the
          Americans."
        you: You see Rojava as a US-backed project that helped break Syria apart.
        because: >-
          From 2015 US special forces were based in SDF territory, and in 2019 the US president said troops would stay to "keep the oil".
          The SDF has controlled most of Syria's oil and gas fields and its main wheat region, while sanctions blocked the Syrian state's
          reconstruction. Balanche's maps show how much of the SDF's territory is Arab-majority. A movement that relies on an empire's
          air force serves that empire's strategy.
        against:
          - from: anarchism.confederalism
            text: >-
              The Kurds asked every power for help against the Islamic State; only the US answered. The same US abandoned them to Turkey's
              invasions in 2018 and 2019. Tactical alliance is not proxy status.
          - from: nationalism.decolonial
            text: >-
              The Syrian state that calls them separatists stripped Kurds of citizenship and banned their language. "Unity" meant
              Arabization.
        sources:
          - {author: Fabrice Balanche, title: "Sectarianism in Syria's Civil War", year: 2018, note: "on the population of SDF-held areas"}
        traditions:
          defining: [nationalism.baathism]
          typical: [marxism.ml, nationalism.nasserism, marxism.arab-socialism]
          contested: [marxism.third-worldism]
          rejects: [anarchism.confederalism]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [hist.rojava.democratic-confederalism]
        analysis:
          gains: [professional-managerial, peripheral-workers]
          pays: [peasantry]
          mechanism: >-
            Treating Rojava as a proxy prioritizes the territorial unity of the Syrian state over Kurdish self-rule, which would return
            the oil and wheat of the northeast to the central state's officials and contractors.
          drain: reduces
          law_of_value: none
      - id: hist.rojava.pkk-threat
        label: A branch of the PKK on Turkey's border and a security threat
        claim: >-
          On this view the PYD and its militias are the Syrian branch of the PKK, which Turkey, the United States and the EU list as a
          terrorist organization. Their rule along the border is a base for attacks on Turkey, and removing it is a matter of national
          security.
        voiced: >-
          "The PYD is the PKK under another name. We will not allow a terror corridor on our southern border, whatever flag it flies."
        you: You see Rojava as a PKK base that threatens Turkey.
        because: >-
          Öcalan's portraits hang in Rojava's offices, and PKK veterans trained and led its forces. The International Crisis Group
          documented the organizational ties between the PKK and the Syrian Kurdish movement. The PKK fought a war with Turkey from 1984
          that killed tens of thousands. Turkey's operations in Afrin (2018) and east of the Euphrates (2019) were presented as
          self-defense.
        against:
          - from: anarchism.confederalism
            text: >-
              Turkey's own operations displaced hundreds of thousands of Kurds from Afrin and installed Syrian Islamist militias that
              looted and kidnapped; that is ethnic cleansing called security.
          - from: liberalism.internationalist
            text: >-
              The SDF was the West's partner against the Islamic State; it did not attack Turkey from Syria in any sustained way before
              Turkey attacked it.
        sources:
          - {author: International Crisis Group, title: "The PKK's Fateful Choice in Northern Syria", year: 2017}
        traditions:
          defining: [nationalism.kemalism]
          typical: [religious.islamism-brotherhood, nationalism.ethnic]
          rejects: [anarchism.confederalism, marxism.leninism]
        presupposes: [nation.question.civic]
        excludes: [hist.rojava.democratic-confederalism, hist.rojava.kurdish-self-determination]
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: [peasantry, peripheral-workers]
          mechanism: >-
            Treating Kurdish self-rule as terrorism justifies military occupation of the border strip and the resettlement of others in
            Kurdish homes, which hands land and reconstruction contracts to the occupying state's allies.
          drain: none
          law_of_value: none
      - id: hist.rojava.one-party-autonomy
        label: An admirable experiment run by one party, with real abuses
        claim: >-
          Rojava's social program is real, but the PYD and its military command hold the real power: rival parties have been closed,
          journalists detained, men conscripted, and Arab villagers displaced in some areas. Judge it by practice, not by its theory.
        voiced: >-
          "Read Öcalan and you see a federation of free communes. Visit, and you see a party that decides, and commune assemblies that
          carry out."
        you: You think Rojava's ideals are admirable but its practice is one-party rule with real abuses.
        because: >-
          Human Rights Watch in 2014 documented arbitrary arrests and abuse in PYD-run areas. Amnesty International in 2015 documented
          the demolition of homes and displacement of residents in some Arab and Turkmen villages. Rival Kurdish parties aligned with
          Iraqi Kurdistan were shut down. Syrian revolutionaries like Al-Shami and Yassin-Kassab note that the PYD kept a truce with
          Assad's forces while they fought him.
        against:
          - from: anarchism.confederalism
            text: >-
              No revolution at war with the Islamic State and Turkey has had cleaner hands; the abuses were investigated, and the
              commune structures are real and spreading.
          - from: marxism.ml
            text: >-
              The liberal standard of "abuses" is applied to besieged movements and never to their besiegers.
        sources:
          - {author: Human Rights Watch, title: "Under Kurdish Rule: Abuses in PYD-Run Enclaves of Syria", year: 2014}
          - {author: Amnesty International, title: "'We Had Nowhere Else to Go': Forced Displacement and Demolitions in Northern Syria", year: 2015}
          - {author: Robin Yassin-Kassab and Leila Al-Shami, title: "Burning Country: Syrians in Revolution and War", year: 2016}
        traditions:
          typical: [liberalism.internationalist, marxism.third-camp, anarchism.insurrectionary, socdem.democratic-socialism]
          contested: [anarchism.communist]
          rejects: [anarchism.confederalism]
        presupposes: [intl.sovereignty.conditional-on-rights]
        analysis:
          gains: [professional-managerial]
          pays: [peasantry]
          mechanism: >-
            Judging Rojava by human rights standards puts it on the same scale as the states attacking it, which tends to weaken
            outside solidarity with it and strengthens the hand of whichever power, Turkey or Damascus, claims to restore order.
          drain: none
          law_of_value: none
      - id: hist.rojava.heroes-betrayed
        label: The fighters who beat the Islamic State, then were abandoned
        claim: >-
          The Kurdish-led forces did most of the ground fighting that destroyed the Islamic State's territorial rule, losing some 11,000
          fighters, and then were left by the West to face Turkey's invasions and an uncertain future in the new Syria.
        voiced: >-
          "They held Kobanî when everyone said it would fall. They freed the Yazidi women and took Raqqa street by street. And then the
          West left them to Erdoğan."
        you: You admire Rojava's fighters for defeating the Islamic State and think the West betrayed them.
        because: >-
          In late 2014 the Islamic State nearly took Kobanî before Kurdish fighters, with US air strikes, threw it back. In 2014 Kurdish
          forces opened a corridor to rescue Yazidis trapped on Mount Sinjar. The SDF took Raqqa in 2017 and Baghuz, the last Islamic
          State territory, in 2019. Months later the US withdrew from the border and Turkey invaded. Lemmon tells the story of the women
          who fought.
        against:
          - from: marxism.ml
            text: >-
              Gratitude for fighting an enemy the US helped create through the Iraq war does not make the SDF anything but an instrument
              of US strategy.
          - from: anarchism.confederalism
            text: >-
              Hero stories turn a revolution into a war film and its people into victims to pity; what they built matters more than
              what they killed.
        sources:
          - {author: Gayle Tzemach Lemmon, title: "The Daughters of Kobani: A Story of Rebellion, Courage, and Justice", year: 2021}
        traditions:
          typical: [liberalism.internationalist, conservatism.neo, liberalism.social]
          contested: [anarchism.confederalism]
          rejects: [nationalism.kemalism]
        analysis:
          gains: [professional-managerial]
          pays: [peripheral-workers]
          mechanism: >-
            Valuing the SDF mainly as a partner against the Islamic State supports keeping Western forces in Syria, which serves core
            strategic aims and leaves the Kurdish project dependent on the policy of the power that may leave at any time.
          drain: softens
          law_of_value: none
  # ------------------------------------------------------------------
  - id: hist.zapatistas
    domain: history
    layer: analysis
    question: What is the Zapatista movement in Chiapas, since its rising of 1994?
    plain: >-
      On 1 January 1994, the day the North American Free Trade Agreement came into force, the mostly indigenous Zapatista Army of
      National Liberation (EZLN) took towns in Chiapas, Mexico. After twelve days of fighting a ceasefire followed; since then the
      Zapatistas have built autonomous communities with their own schools, clinics and governments. What is it?
    short: the Zapatistas
    importance: 2
    region: history
    positions:
      - id: hist.zapatistas.autonomy-without-power
        label: Autonomy from below, changing the world without taking power
        claim: >-
          The Zapatistas show a new road: not seizing the state but building self-government beside it. Communities govern themselves by
          rotating assemblies whose officials "rule by obeying", with their own schools, clinics and justice, outside the parties and the
          state.
        voiced: >-
          "Here the people command and the government obeys. We do not want to take power; we want a world where many worlds fit."
        you: You see the Zapatistas as proof that people can govern themselves without taking state power.
        because: >-
          In 2003 the Zapatistas set up five caracoles and Juntas of Good Government, rotating posts so that no one becomes a
          professional ruler; they refuse government aid and money. Their schools teach in Tzeltal, Tzotzil and other languages. The
          Sixth Declaration of 2005 called for a movement from below and to the left, outside elections. Holloway argued from their
          example that power-over is reproduced by trying to take it.
        against:
          - from: marxism.leninism
            text: >-
              Thirty years on, the autonomous communities remain poor, surrounded by the Mexican army and cartels, and Mexico's state
              and capital are untouched. Autonomy that power tolerates is not a road to change the world.
          - from: liberalism.classical
            text: >-
              Refusing state services and markets keeps the communities in poverty; their own young people leave for the cities and
              the north.
        sources:
          - {author: EZLN, title: "Sixth Declaration of the Lacandon Jungle", year: 2005}
          - {author: John Holloway, title: "Change the World Without Taking Power", year: 2002}
          - {author: Gloria Muñoz Ramírez, title: "EZLN: 20 y 10, el fuego y la palabra", year: 2003}
        traditions:
          defining: [zapatismo]
          typical: [marxism.autonomism, anarchism.communist, nationalism.indigenous-sovereignty, anarchism.communalism]
          rejects: [marxism.leninism, marxism.ml]
        presupposes: [state.relation.exit-and-build]
        tension: [hist.zapatistas.dead-end-without-power]
        analysis:
          gains: [peasantry, reserve-army]
          pays: [landed-capital]
          mechanism: >-
            Building autonomy beside the state keeps occupied land and local government in community hands, which takes land and labor
            out of the market in those areas while leaving national property and the state intact.
          drain: reduces
          law_of_value: suspends
      - id: hist.zapatistas.indigenous-land-and-dignity
        label: An indigenous rising for land and dignity against NAFTA and five centuries
        claim: >-
          The rising was the answer of Maya peasants to the 1992 end of land reform and to NAFTA, which would flood their markets with
          US corn. It was a struggle for land, recognition and the rights of indigenous peoples, part of five hundred years of
          resistance.
        voiced: >-
          "We are the product of five hundred years of struggle. We have nothing, absolutely nothing, not even a roof, land, work, health,
          food or education. Today we say: enough!"
        you: You see the Zapatista rising as indigenous peoples defending their land and rights against neoliberalism.
        because: >-
          In 1992 Mexico amended Article 27 of the constitution, ending the right to petition for land and allowing communal ejido land to
          be sold. NAFTA took effect on 1 January 1994 and opened Mexico to subsidized US corn. In the San Andrés Accords of 1996 the
          government agreed to indigenous autonomy, then passed a far weaker law in 2001. Harvey traces the rising to decades of land
          struggles organized partly with Bishop Samuel Ruiz's diocese.
        against:
          - from: liberalism.chicago
            text: >-
              Mexican corn growers were among the least productive in the world; freeing land markets and trade raised national income,
              and people moved to better-paid work.
          - from: zapatismo
            text: >-
              The struggle is not only indigenous or agrarian; from the Sixth Declaration on, it is a struggle against capitalism, with
              everyone from below.
        sources:
          - {author: EZLN, title: "First Declaration of the Lacandon Jungle", year: 1993}
          - {author: Neil Harvey, title: "The Chiapas Rebellion: The Struggle for Land and Democracy", year: 1998}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial, religious.liberation-theology, marxism.mariategui, zapatismo]
          rejects: [liberalism.chicago]
        presupposes: [agrarian.question.communal-tenure]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, finance-capital, comprador-capital]
          mechanism: >-
            Defending communal land and indigenous autonomy against trade liberalization blocks the sale of ejido land and the
            displacement of peasants by subsidized imports, which cuts into the gains of agribusiness, ranchers and the traders who
            import grain.
          drain: reduces
          law_of_value: suspends
      - id: hist.zapatistas.dead-end-without-power
        label: Heroic, but a strategic dead end without state power
        claim: >-
          The Zapatistas inspired the world, but refusing to take power left Mexico's capitalism and state untouched and their
          communities encircled. Thirty years later, the cartels and the army hold more of Chiapas than they do.
        voiced: >-
          "You can't change the world without taking power, you can only leave it to those who have it. The Zapatista communities are
          admirable and besieged; the Mexican state is still the state."
        you: You admire the Zapatistas but think their refusal to take power was a mistake.
        because: >-
          The EZLN's autonomy covers a region of Chiapas, while in Mexico as a whole privatization and NAFTA went ahead. Callinicos argued
          against the "change the world without taking power" thesis that capital and state power concentrate and must be confronted.
          Since the 2010s armed groups linked to drug cartels have spread violence and displacement in Chiapas, and the Zapatistas
          themselves warned of civil war there.
        against:
          - from: zapatismo
            text: >-
              Every movement that took power in the twentieth century became the new power. We are not waiting for the state; we are
              living differently now.
          - from: anarchism.communist
            text: >-
              Measuring the Zapatistas by state power applies exactly the yardstick their experience rejects.
        sources:
          - {author: Alex Callinicos, title: "An Anti-Capitalist Manifesto", year: 2003}
          - {author: V. I. Lenin, title: "The State and Revolution", year: 1917}
        traditions:
          typical: [marxism.leninism, marxism.trotskyism, marxism.ml, marxism.guevarism]
          rejects: [zapatismo, marxism.autonomism]
        presupposes: [state.nature.class-instrument]
        tension: [hist.zapatistas.autonomy-without-power]
        analysis:
          gains: [core-workers, peasantry]
          pays: [industrial-capital, finance-capital]
          mechanism: >-
            Judging the Zapatistas by whether they took power directs movements toward contesting the national state and its army,
            which aims at owners' control of national law and budgets but abandons the gains of local autonomy as insufficient.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic
      - id: hist.zapatistas.unnecessary-insurgency
        label: An armed rising Mexico did not need; elections opened the system
        claim: >-
          Mexico's change from one-party rule came through electoral reform and the opposition's victory in 2000, not through an armed
          rising. The Zapatistas' arms, rhetoric and celebrity added drama, but not the change itself.
        voiced: >-
          "Mexico changed at the ballot box. A masked poet with a rifle captured the world's imagination; the voters of 2000 captured
          Los Pinos."
        you: You think Mexico's change came through elections, and that the Zapatista rising was unnecessary.
        because: >-
          The independent electoral institute (IFE) was strengthened in 1996, the PRI lost its majority in the lower house in 1997 and
          the presidency in 2000. Poverty in Chiapas is real, but federal spending there grew and the conflict produced militarization
          more than development. Krauze argues Mexico's history is one of reform by institutions, interrupted at great cost by
          caudillos and risings.
        against:
          - from: zapatismo
            text: >-
              The PRI's grip loosened partly because the rising exposed it to the world in 1994. The parties that won elections afterwards
              all kept NAFTA and the Article 27 reform.
          - from: nationalism.indigenous-sovereignty
            text: >-
              Elections changed which party ruled; they did not return any land or honor the San Andrés Accords.
        sources:
          - {author: Enrique Krauze, title: "Mexico: Biography of Power", year: 1997}
        traditions:
          defining: [liberalism.social]
          typical: [liberalism.classical, conservatism.christian-democracy, socdem.third-way]
          rejects: [zapatismo, nationalism.indigenous-sovereignty]
        presupposes: [elections.role.main-road]
        analysis:
          gains: [professional-managerial, comprador-capital]
          pays: [peasantry]
          mechanism: >-
            Crediting elections with the change separates political reform from the land question, which leaves the 1992 land reform
            and NAFTA in place and the indigenous peasantry exposed to land markets and imports.
          drain: sustains
          law_of_value: extends
      - id: hist.zapatistas.outside-agitators
        label: Outside radicals and activist priests who used indigenous grievances
        claim: >-
          On this view the EZLN was organized by mestizo radicals from Mexico City's universities, led by "Marcos", and grew in a diocese
          whose bishop preached liberation theology. Indigenous grievances were real, but the movement and its image were made by
          outsiders.
        voiced: >-
          "Behind the ski mask was a philosophy graduate from Tampico. He and the priests used the Indians' poverty to stage a
          revolution for the cameras."
        you: You think the Zapatista movement was led and shaped by outsiders who used indigenous grievances.
        because: >-
          In 1995 the government identified Marcos as Rafael Guillén, a former philosophy lecturer; the EZLN grew out of the Forces of
          National Liberation, a guerrilla group founded in the north in 1969. De la Grange and Rico argue that its image was crafted for
          international media. Parts of the Catholic hierarchy accused Bishop Ruiz's catechists of preparing the ground.
        against:
          - from: zapatismo
            text: >-
              The outsiders who came in 1983 were transformed by the communities, not the other way around; the communities decided to
              rise, by consultation, and their own commanders lead.
          - from: religious.liberation-theology
            text: >-
