# History, part 6: the Nordic model, the New Deal, decolonization, and the collapse of 1989-1991.
# See history.yaml and the header of history-c.yaml for the index of history files.
problematics:
  # ------------------------------------------------------------------
  - id: hist.nordic-model
    domain: history
    layer: analysis
    question: What was the Nordic model?
    plain: >-
      From the 1930s Sweden, Norway, Denmark and Finland built universal welfare states with strong unions, central wage bargaining and
      high taxes. Since the 1990s they have privatized parts of it and kept others. What was it, and what made it possible?
    short: the Nordic model
    importance: 2
    region: history
    positions:
      - id: hist.nordic-model.labor-tamed-capital
        label: Proof that organized labor can tame capitalism through votes and unions
        claim: >-
          The Nordic countries show that workers organized in strong unions and a governing labor party can win full employment,
          universal welfare and low inequality without revolution, by using the state to decommodify health, education and income
          security.
        voiced: >-
          "The good home knows no privileged or neglected, no favorites and no stepchildren. We built it with the ballot and the union
          card, not the barricade."
        you: You see the Nordic model as proof that labor can win a good society through unions and elections.
        because: >-
          Swedish Social Democrats governed from 1932 to 1976 without break. Union membership reached around 80 percent; the 1938
          Saltsjöbaden agreement institutionalized central bargaining. Korpi showed that the strength of labor's organization, not
          economic growth, explains how far welfare states go. Esping-Andersen classed the Nordic states as the most decommodifying
          welfare regime: income and services as rights of citizenship rather than of the market.
        against:
          - from: marxism.trotskyism
            text: >-
              Capital kept ownership and command of investment, and from the 1980s it used that power to roll back a large part of the
              model. Taming that can be undone is not taming.
          - from: marxism.third-worldism
            text: >-
              The model rested on the prices of the world economy: cheap imported raw materials and high-value exports. It is not a
              road open to everyone.
        sources:
          - {author: Walter Korpi, title: "The Democratic Class Struggle", year: 1983}
          - {author: Gøsta Esping-Andersen, title: "The Three Worlds of Welfare Capitalism", year: 1990}
          - {author: Gøsta Esping-Andersen, title: "Politics Against Markets: The Social Democratic Road to Power", year: 1985}
        traditions:
          defining: [socdem.nordic]
          typical: [socdem.keynesian, socdem.labourism, socdem.democratic-socialism]
          rejects: [liberalism.austrian, marxism.left-communism]
        presupposes: [elections.role.main-road, unions.role.class-organ]
        analysis:
          gains: [core-workers, professional-managerial]
          pays: [finance-capital]
          mechanism: >-
            Holding the Nordic model as proof backs union density, central bargaining and universal public services, which raise core
            workers' share of national income and protect them from the market, while leaving ownership of industry and the external
            terms of trade unchanged.
          drain: softens
          law_of_value: regulates
          consciousness: class-economic
      - id: hist.nordic-model.stopped-at-the-threshold
        label: A road to socialism abandoned when capital struck back
        claim: >-
          Swedish social democracy went further than any labor movement in the West: in 1976 its unions proposed wage-earner funds that
          would gradually transfer ownership of large firms to workers. Business mobilized, the plan was diluted and then abolished, and
          the movement settled for managing capitalism.
        voiced: >-
          "We want to deprive the capital owners of the power they exercise by virtue of their ownership. All experience shows that
          influence and control are not enough. Ownership plays a decisive role."
        you: You think the Nordic model was on the way to socialism and stopped when owners fought back.
        because: >-
          The Meidner plan of 1976 would have had firms issue new shares each year to union-controlled funds, giving workers majority
          ownership of large firms within decades. In October 1983 some 75,000 people marched in Stockholm against it, organized by the
          employers' federation. The diluted funds of 1984 were abolished in 1991. Pontusson shows the limit came exactly where
          investment decisions were at stake.
        against:
          - from: socdem.nordic
            text: >-
              The wage-earner funds were an overreach that cost the party the 1976 election. The model's strength was precisely that it
              did not touch ownership.
          - from: marxism.left-communism
            text: >-
              Share ownership by union funds is not socialism; the funds would have had to maximize returns like any shareholder.
        sources:
          - {author: Rudolf Meidner, title: "Employee Investment Funds: An Approach to Collective Capital Formation", year: 1978}
          - {author: Jonas Pontusson, title: "The Limits of Social Democracy: Investment Politics in Sweden", year: 1992}
        traditions:
          defining: [socdem.democratic-socialism]
          typical: [marxism.eurocommunism, marxism.analytical]
          contested: [socdem.nordic]
          rejects: [liberalism.austrian, liberalism.chicago]
        presupposes: [firm.ownership.wage-earner-funds]
        analysis:
          gains: [core-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >-
            Treating the wage-earner funds as the unfinished task points core workers' organizations at ownership of capital rather than
            at wages and welfare alone, which threatens owners' control over investment.
          drain: none
          law_of_value: suspends
          consciousness: hegemonic
      - id: hist.nordic-model.class-compromise
        label: A historic class compromise that kept capital in command
        claim: >-
          The Nordic model was a deal: workers gave up the struggle for ownership and accepted wage restraint, rationalization and
          capital's command of investment in exchange for full employment and welfare. It held while profits allowed and was renegotiated
          when they did not.
        voiced: >-
          "Social democrats became the best managers of capitalism. Workers consented to exploitation in exchange for a share of growth,
          and the deal lasted exactly as long as the growth."
        you: You see the Nordic model as a bargain in which workers traded the goal of socialism for security.
        because: >-
          Przeworski showed that the logic of electoral social democracy requires winning middle-class votes and ensuring profits, so
          that reforms must never threaten investment. The Rehn–Meidner model used solidaristic wages to push weaker firms out and
          speed up rationalization in the profitable ones. After the 1990s banking crisis Sweden cut benefits, introduced school
          vouchers (1992) and privatized parts of care.
        against:
          - from: socdem.nordic
            text: >-
              A "compromise" that gave workers the world's highest living standards and lowest inequality is a victory, not a surrender.
          - from: socdem.democratic-socialism
            text: >-
              The Meidner plan shows the compromise was not fixed; the movement could and did push against its limits.
        sources:
          - {author: Adam Przeworski, title: "Capitalism and Social Democracy", year: 1985}
        traditions:
          typical: [marxism.trotskyism, marxism.left-communism, marxism.structural, marxism.analytical]
          rejects: [socdem.nordic]
        presupposes: [workplace.conflict.structural-antagonism]
        analysis:
          gains: [core-workers]
          pays: [professional-managerial]
          mechanism: >-
            Reading the model as a compromise warns workers' organizations that welfare won inside capitalism depends on profits and
            can be withdrawn, which pushes them toward ownership and away from managing the system.
          drain: none
          law_of_value: abolishes
      - id: hist.nordic-model.paid-by-the-periphery
        label: A welfare state partly paid for by the periphery
        claim: >-
          The Nordic countries' wealth rests not only on their workers' organization but on their place in the world economy: cheap raw
          materials and goods from the South, global firms with production abroad, and in Norway an oil fund invested across the world.
        voiced: >-
          "The Swedish worker's welfare includes the coffee picker's poverty. Every universal welfare state in the North is also a
          beneficiary of unequal exchange with the South."
        you: You think the Nordic welfare states rest partly on value taken from poorer countries.
        because: >-
          Hickel and co-authors estimate that the rich countries drained trillions of dollars a year in labor and resources from the
          South through unequal exchange in recent decades; small, export-oriented economies like Sweden's sit at the top of that chain.
          Swedish firms such as IKEA, H&M and Ericsson produce largely through suppliers in low-wage countries. Norway's sovereign
          wealth fund, over a trillion dollars, holds shares in firms worldwide. Cope argues the whole Northern working class shares in
          this.
        against:
          - from: socdem.nordic
            text: >-
              The welfare state was built in the 1930s–60s on Nordic industry and productivity, when trade with the South was a small
              share of the economy.
          - from: marxism.trotskyism
            text: >-
              Nordic workers are exploited by Nordic capital; blaming them for imperialism divides the international working class.
        sources:
          - {author: Zak Cope, title: "Divided World, Divided Class: Global Political Economy and the Stratification of Labour Under Capitalism", year: 2012}
          - {author: "Jason Hickel, Christian Dorninger, Hanspeter Wieland and Intan Suwandi", title: "Imperialist Appropriation in the World Economy: Drain from the Global South through Unequal Exchange, 1990–2015", year: 2022}
        traditions:
          defining: [marxism.third-worldism]
          typical: [marxism.dependency, marxism.world-systems, ecology.degrowth]
          rejects: [socdem.nordic, marxism.trotskyism]
        presupposes: [labor.aristocracy.whole-core-bought]
        analysis:
          gains: [peripheral-workers]
          pays: [core-workers, finance-capital]
          mechanism: >-
            Tracing Nordic welfare partly to unequal exchange turns attention from the share-out inside the core to the terms of trade
            and the value chains through which Southern labor is underpaid, which threatens core workers' material position as well as
            capital's.
          drain: breaks
          law_of_value: none
          disputed: >-
            Materialists split over the labor aristocracy: Cope and Emmanuel hold core workers share in the drain; Trotskyists and many
            Marxists hold core workers are exploited and gain little or nothing from it.
      - id: hist.nordic-model.markets-built-it
        label: Prosperity built by free trade and enterprise, rescued by market reform
        claim: >-
          The Nordic countries grew rich before the welfare state, as small open economies with secure property, free trade and
          entrepreneurs. The high-tax welfare state of the 1970s nearly ruined Sweden; the market reforms after 1990 restored its growth.
        voiced: >-
          "Scandinavia's success came before its welfare states, not because of them. Sweden's Social Democratic heyday ended in
          stagnation, and it was the market reforms that saved it."
        you: You think Nordic prosperity came from markets and free trade, not from the welfare state.
        because: >-
          Between 1870 and 1950 Sweden had one of the fastest growth rates in the world, with low taxes and open trade, and founded
          firms like Volvo, Ericsson and SKF. From the 1970s high taxes and regulation slowed growth until the 1990s crisis. Sweden then
          cut marginal taxes, opened schools and care to private providers, and reformed pensions, and growth returned. Sanandaji argues
          Nordic social outcomes reflect culture and trust that existed before the welfare state.
        against:
          - from: socdem.nordic
            text: >-
              The 1990s crisis came from a deregulated credit bubble, not from the welfare state; and Nordic countries remain high-tax,
              high-welfare and among the most productive in the world.
          - from: marxism.trotskyism
            text: >-
              The "free market" Sweden of 1870–1930 sent a quarter of its people emigrating to America for lack of work.
        sources:
          - {author: Nima Sanandaji, title: "Scandinavian Unexceptionalism: Culture, Markets and the Failure of Third-Way Socialism", year: 2015}
        traditions:
          defining: [liberalism.classical]
          typical: [liberalism.chicago, libertarianism.minarchist, liberalism.austrian]
          rejects: [socdem.nordic, socdem.democratic-socialism]
        presupposes: [capitalism.nature.free-exchange]
        excludes: [hist.nordic-model.labor-tamed-capital]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers, reserve-army]
          mechanism: >-
            Crediting markets for Nordic prosperity recommends tax cuts and the privatization of welfare services, which shifts income
            toward owners and opens schools and care to private firms paid from public budgets.
          drain: sustains
          law_of_value: extends
      - id: hist.nordic-model.one-people
        label: It worked because it was one people, a high-trust national home
        claim: >-
          The Nordic welfare state worked because it was the home of one people who trusted each other and shared a culture, a church and
          a work ethic. It was a national community, not a universal formula, and large-scale immigration strains it.
        voiced: >-
          "The basis of the home is community and togetherness. The people's home was built for the people, and you cannot share a
          home with everyone in the world."
        you: You think the Nordic model worked because the countries were nationally united, and that it depends on that unity.
        because: >-
          Per Albin Hansson's "people's home" speech of 1928 framed the welfare state as a national family. The Nordic countries in the
          mid-twentieth century were unusually homogeneous in language and religion, with Lutheran state churches. Nationalist parties in
          all four countries now argue that welfare for citizens requires limits on immigration, and some social democratic parties,
          notably in Denmark, have moved toward that view.
        against:
          - from: socdem.nordic
            text: >-
              The welfare state was built against the national-conservative right of its day, by a class movement; homogeneity did not
              stop the bitter class conflicts of the 1920s and 1930s.
          - from: nationalism.indigenous-sovereignty
            text: >-
              "One people" erased the Sámi, whose lands were taken and whose children were sent to assimilating schools; Sweden also ran
              a sterilization program from 1935 to 1975.
        sources:
          - {author: Per Albin Hansson, title: "Folkhemmet, medborgarhemmet (The People's Home)", year: 1928}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.right-populism, nationalism.ethnic, commonsense.look-after-your-own]
          contested: [socdem.labourism]
          rejects: [socdem.democratic-socialism, liberalism.social]
        presupposes: [nation.belonging.descent]
        analysis:
          gains: [core-workers, petty-bourgeoisie]
          pays: [reserve-army, peripheral-workers]
          mechanism: >-
            Tying welfare to national membership restricts benefits and jobs to citizens and pushes migrants into a lower tier of the
            labor market, which protects native workers' position while supplying employers with cheaper labor without full rights.
          drain: sustains
          law_of_value: regulates
          consciousness: economic-corporate
  # ------------------------------------------------------------------
  - id: hist.new-deal
    domain: history
    layer: analysis
    question: What was the New Deal?
    plain: >-
      Facing the Great Depression, with a quarter of the workforce unemployed, Franklin Roosevelt's government from 1933 regulated the
      banks, hired millions on public works, created Social Security, protected union organizing under the Wagner Act and paid farmers
      to cut output. What was it?
    short: the New Deal
    importance: 2
    region: history
    positions:
      - id: hist.new-deal.saved-capitalism
        label: A reform that saved capitalism from itself and built a middle class
        claim: >-
          The New Deal rescued a broken market economy with regulation, public spending and social insurance, and laid the foundations
          of the post-war prosperity in which wages rose with productivity. It saved capitalism and the American system from collapse.
        voiced: >-
          "The only thing we have to fear is fear itself. We have always known that heedless self-interest was bad morals; we know now
          that it is bad economics."
        you: You see the New Deal as a reform that saved the economy and made a broad middle class possible.
        because: >-
          Within months banking was stabilized by deposit insurance and the Glass–Steagall Act of 1933. The Works Progress Administration
          employed some 8.5 million people over its life. Social Security (1935) and the Fair Labor Standards Act (1938) set a floor
          under incomes. Keynes provided the theory: in a slump, the state must spend when private investment will not.
        against:
          - from: liberalism.austrian
            text: >-
              Unemployment was still above 14 percent in 1940; only the war ended the Depression. The New Deal's regulations and wage
              policies kept prices and wages too high to recover.
          - from: marxism.trotskyism
            text: >-
              Saving capitalism was precisely the point: it disarmed a radicalizing working class and preserved the owners' power.
        sources:
          - {author: John Maynard Keynes, title: "The General Theory of Employment, Interest and Money", year: 1936}
          - {author: Arthur M. Schlesinger Jr., title: "The Age of Roosevelt: The Crisis of the Old Order", year: 1957}
          - {author: William E. Leuchtenburg, title: "Franklin D. Roosevelt and the New Deal, 1932–1940", year: 1963}
        traditions:
          defining: [socdem.keynesian, liberalism.social]
          typical: [liberalism.progressive, socdem.third-way, conservatism.one-nation]
          rejects: [liberalism.austrian, libertarianism.minarchist]
        presupposes: [capitalism.nature.managed-engine]
        excludes: [hist.new-deal.prolonged-the-depression]
        analysis:
          gains: [core-workers, professional-managerial, industrial-capital]
          pays: [finance-capital]
          mechanism: >-
            Holding the New Deal as a model supports regulating finance and public spending to sustain demand, which raises core wages
            and employment while preserving private ownership and the profitability of industry.
          drain: softens
          law_of_value: regulates
      - id: hist.new-deal.won-from-below
        label: Concessions forced by strikes and the fear of revolution
        claim: >-
          The New Deal's gains for workers were not gifts from Roosevelt. They were forced by the general strikes of 1934, the sit-downs
          of 1936–37, the unemployed movements and the fear among the rich that the system would not survive otherwise.
        voiced: >-
          "Nobody gave us the Wagner Act. We took it in Minneapolis, Toledo and San Francisco in 1934, and in the sit-down at Flint. The
          government moved when the factories stopped."
        you: You think workers won the New Deal's reforms through strikes and mass action.
        because: >-
          In 1934 general strikes shook Toledo, Minneapolis and San Francisco; the Minneapolis Teamsters' strike was led by Trotskyists.
          The Wagner Act came the next year; the Flint sit-down of 1936–37 won recognition at General Motors. Piven and Cloward showed
          that the poor won concessions when they disrupted, not when they organized politely. Roosevelt himself said he was saving the
          system.
        against:
          - from: socdem.keynesian
            text: >-
              Strikes alone won little before 1933; it took a sympathetic government and a legal framework to turn them into lasting
              unions.
          - from: liberalism.classical
            text: >-
              Violent strikes destroyed jobs in the middle of a depression; recovery came despite them.
        sources:
          - {author: Frances Fox Piven and Richard A. Cloward, title: "Poor People's Movements: Why They Succeed, How They Fail", year: 1977}
          - {author: Irving Bernstein, title: "Turbulent Years: A History of the American Worker, 1933–1941", year: 1970}
          - {author: Farrell Dobbs, title: "Teamster Rebellion", year: 1972}
        traditions:
          defining: [socdem.democratic-socialism]
          typical: [marxism.trotskyism, anarchism.syndicalist, marxism.autonomism, marxism.ml]
          rejects: [liberalism.classical]
        presupposes: [change.possibility.organized-people-can]
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, finance-capital]
          mechanism: >-
            Crediting strikes and disruption directs workers to rely on their own collective action rather than on politicians, which
            raises their bargaining power against employers in any period.
          drain: none
          law_of_value: regulates
          consciousness: class-economic
      - id: hist.new-deal.prolonged-the-depression
        label: Government meddling that prolonged the Depression
        claim: >-
          The Depression was caused by the Federal Reserve's monetary errors, and the New Deal made it worse: cartels and wage floors
          under the National Recovery Administration, new taxes, and constant uncertainty for business kept unemployment high for a
          decade.
        voiced: >-
          "The New Deal didn't end the Depression; it made it Great. Every time business was ready to invest, Washington changed the
          rules."
        you: You think the New Deal prolonged the Depression by interfering with markets.
        because: >-
          Unemployment averaged over 17 percent through the 1930s and was still above 14 percent in 1940. Cole and Ohanian estimate that
          New Deal cartel and labor policies kept wages and prices above market levels and delayed recovery by years. Rothbard blamed the
          Federal Reserve's credit expansion for the boom and government intervention for blocking the bust's correction. Shlaes
          describes businesses on strike against uncertainty.
        against:
          - from: socdem.keynesian
            text: >-
              The economy grew fast from 1933 to 1937; the 1937–38 relapse came when Roosevelt balanced the budget, which proves the
              Keynesian point.
          - from: marxism.dependency
            text: >-
              Counting public-works workers as unemployed, as the higher figures do, makes the New Deal look worse by definition.
        sources:
          - {author: Murray N. Rothbard, title: "America's Great Depression", year: 1963}
          - {author: Amity Shlaes, title: "The Forgotten Man: A New History of the Great Depression", year: 2007}
          - {author: Harold L. Cole and Lee E. Ohanian, title: "New Deal Policies and the Persistence of the Great Depression: A General Equilibrium Analysis", year: 2004}
        traditions:
          defining: [liberalism.austrian]
          typical: [liberalism.chicago, libertarianism.minarchist, libertarianism.paleo, conservatism.fusionism]
          rejects: [socdem.keynesian, liberalism.social]
        presupposes: [capitalism.nature.free-exchange]
        excludes: [hist.new-deal.saved-capitalism]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers, reserve-army]
          mechanism: >-
            Blaming the New Deal for the slump argues against public employment, wage floors and union protection in every crisis,
            which leaves wages to fall until profits recover.
          drain: sustains
          law_of_value: extends
      - id: hist.new-deal.white-new-deal
        label: A welfare state built for white men
        claim: >-
          The New Deal's protections were designed to exclude most Black workers: Social Security and the Wagner Act left out farm and
          domestic workers, and federal housing programs drew red lines around Black neighborhoods. It built a white middle class and
          widened the racial wealth gap.
        voiced: >-
          "Affirmative action was white. Southern Democrats wrote the exclusions into the law, and federal mortgages built the suburbs
          for whites only."
        you: You see the New Deal as a program that lifted white workers and left Black workers out.
        because: >-
          Southern Democrats, whose votes Roosevelt needed, ensured that agricultural and domestic workers, most Black workers in the
          South, were excluded from Social Security and labor protections. The Home Owners' Loan Corporation and the Federal Housing
          Administration graded Black neighborhoods as hazardous and refused to insure mortgages there. Katznelson and Rothstein show
          that these policies built the racial wealth gap that persists today.
        against:
          - from: socdem.keynesian
            text: >-
              Black Americans also gained from public works and relief, and voted for Roosevelt in rising numbers from 1936. The
              exclusions were the price of passing anything at all.
          - from: marxism.trotskyism
            text: >-
              Race was used to divide a class; the answer is a universal class program, not a reading that treats white workers as the
              beneficiaries.
        sources:
          - {author: Ira Katznelson, title: "When Affirmative Action Was White: An Untold History of Racial Inequality in Twentieth-Century America", year: 2005}
          - {author: Richard Rothstein, title: "The Color of Law: A Forgotten History of How Our Government Segregated America", year: 2017}
        traditions:
          defining: [marxism.black-radical]
          typical: [feminism.black, nationalism.black-nationalism, liberalism.progressive]
          rejects: [conservatism.fusionism]
        presupposes: [class.concept.world-and-race]
        analysis:
          gains: [peripheral-workers, reserve-army]
          pays: [core-workers, finance-capital]
          mechanism: >-
            Showing that the New Deal's benefits were racially allocated supports claims for redress and universal coverage, which would
            cost the white homeowners and banks who gained from segregated housing markets.
          drain: none
          law_of_value: regulates
      - id: hist.new-deal.unconstitutional-centralization
        label: An unconstitutional expansion of federal power
        claim: >-
          Whatever its economics, the New Deal broke the Constitution's limits on federal power: it regulated local commerce, created
          a permanent administrative state, and when the Supreme Court resisted, Roosevelt tried to pack it.
        voiced: >-
          "The New Deal replaced the Republic of limited powers with a bureaucracy that answers to no voter. Roosevelt threatened the
          Court until it gave way."
        you: You think the New Deal overthrew the Constitution's limits on federal government.
        because: >-
          In 1935 the Supreme Court struck down the National Industrial Recovery Act in Schechter Poultry. In 1937 Roosevelt proposed
          adding up to six justices; the Court then upheld the Wagner Act, and in Wickard v. Filburn (1942) it let Congress regulate wheat
          a farmer grew for his own use. Flynn argued that the New Deal concentrated power in the presidency and its agencies.
        against:
          - from: liberalism.social
            text: >-
              The Constitution was written for a nation of farmers, not for national corporations and national depressions; the Court
              adapted it, as it had to.
          - from: marxism.black-radical
            text: >-
              "States' rights" was the language in which the South defended segregation; federal power was what eventually broke it.
        sources:
          - {author: John T. Flynn, title: "The Roosevelt Myth", year: 1948}
        traditions:
          defining: [conservatism.paleo]
          typical: [conservatism.fusionism, libertarianism.minarchist, libertarianism.paleo]
          rejects: [liberalism.social, socdem.keynesian]
        presupposes: [state.nature.necessary-evil]
        analysis:
          gains: [petty-bourgeoisie, landed-capital]
          pays: [core-workers, reserve-army]
          mechanism: >-
            Treating federal labor and welfare law as unconstitutional returns those powers to the states, where employers and local
            elites can more easily block unions and minimum standards.
          drain: none
          law_of_value: extends
      - id: hist.new-deal.disarmed-labor
        label: Capital's rescue of itself, which tied labor to the Democrats
        claim: >-
          The New Deal channeled the most militant working-class upsurge in American history into a party of capital. The unions won
          recognition and lost independence; within fifteen years the Taft–Hartley Act and the purge of the left had tamed them.
        voiced: >-
          "The CIO's barren marriage with the Democratic Party traded the sit-down for the ballot box and the shop floor for the
          lobby. The New Deal saved American capital from its workers."
        you: You think the New Deal saved capitalism by binding the labor movement to the Democratic Party.
        because: >-
          The Wagner Act brought union recognition under a federal board that set the rules of struggle. The CIO's leaders backed
          Roosevelt and, during the war, a no-strike pledge. In 1947 Taft–Hartley banned sympathy strikes and required unions to purge
          communists, and the unions did. Davis argued that the American working class never built its own party because the New Deal
          coalition absorbed it.
        against:
          - from: socdem.keynesian
            text: >-
              Union membership tripled under the New Deal; a labor party had no chance in the US electoral system, and the alliance
              with the Democrats delivered real gains.
          - from: marxism.ml
            text: >-
              In the face of fascism, supporting the New Deal coalition in a popular front was correct; the Communist Party grew to its
              greatest strength doing so.
        sources:
          - {author: Mike Davis, title: "Prisoners of the American Dream: Politics and Economy in the History of the US Working Class", year: 1986}
        traditions:
          typical: [marxism.trotskyism, marxism.third-camp, marxism.left-communism, anarchism.syndicalist]
          rejects: [socdem.keynesian, marxism.ml]
        presupposes: [state.nature.class-instrument]
        analysis:
          gains: [core-workers]
          pays: [professional-managerial]
          mechanism: >-
            Treating the New Deal as a trap warns unions against dependence on a capitalist party and its labor law, which supports an
            independent workers' party and shop-floor militancy at the cost of short-term political protection.
          drain: none
          law_of_value: abolishes
          consciousness: hegemonic
  # ------------------------------------------------------------------
  - id: hist.decolonization
    domain: history
    layer: analysis
    question: What was decolonization, roughly 1945–1975?
    plain: >-
      In thirty years most of Asia and Africa won independence from European empires, through negotiation, mass movements and wars of
      liberation from Indonesia and Algeria to Vietnam, Kenya, Mozambique and Angola. The number of independent states more than
      doubled. What was decolonization, and was it finished?
    short: decolonization
    importance: 3
    region: history
    positions:
      - id: hist.decolonization.flag-independence
        label: Flag independence without economic independence, neocolonialism
        claim: >-
          The colonies won flags, anthems and seats at the UN, but their economies stayed tied to the old powers: exporting raw
          materials at prices set abroad, borrowing from Western banks, using currencies managed from Paris or London. Where leaders
          tried to change that, they were overthrown.
        voiced: >-
          "The essence of neo-colonialism is that the State which is subject to it is, in theory, independent and has all the outward
          trappings of international sovereignty. In reality its economic system and thus its political policy is directed from
          outside."
        you: You think most former colonies won formal independence but not control of their economies.
        because: >-
          Nkrumah wrote in 1965 that independence without economic power was a new form of colonialism; he was overthrown the next year.
          Lumumba was killed in 1961 with Belgian complicity and US involvement; fourteen African states still use the CFA franc,
          backed by the French Treasury. Fanon warned that a national bourgeoisie would replace the colonizers as their local agents.
          Rodney showed how colonial economies were built to export, not to develop.
        against:
          - from: liberalism.classical
            text: >-
              Some former colonies, from South Korea to Botswana, grew rich after independence. Blaming neocolonialism lets misrule
              off the hook.
          - from: nationalism.decolonial
            text: >-
              The economic reading leaves out the colonization of minds, languages and knowledge, which outlasted the flags too.
        sources:
          - {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}
          - {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}
          - {author: Walter Rodney, title: "How Europe Underdeveloped Africa", year: 1972}
          - {author: Ludo De Witte, title: "The Assassination of Lumumba", year: 1999}
        traditions:
          defining: [nationalism.pan-africanism, marxism.dependency]
          typical: [marxism.third-worldism, marxism.african-socialism, marxism.black-radical, marxism.world-systems]
          rejects: [liberalism.classical, conservatism.neo]
        presupposes: [poverty.cause.drain, comprador.nature.broker-class]
        excludes: [hist.decolonization.empire-left-order]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >-
            Reading decolonization as unfinished points to control of currency, resources and credit as the real stakes, which targets
            the foreign firms, banks and local brokers who take the export surplus.
          drain: breaks
          law_of_value: suspends
          consciousness: hegemonic
      - id: hist.decolonization.liberation-won
        label: The greatest liberation of the century, won by the colonized themselves
        claim: >-
          Decolonization was a world revolution: hundreds of millions of people threw off foreign rule by mass struggle and armed
          liberation, and the new states changed the balance of power in the world. Its achievement is real and is the colonized
          peoples' own.
        voiced: >-
          "We are not fighting for the Portuguese to go so that we can have a black boss in his place. But neither did anyone give us
          our freedom; we took it, with arms where we had to."
        you: You see decolonization as a great victory won by the colonized, and its new states as worth defending.
        because: >-
          Between 1945 and 1975 more than eighty colonies became independent. In Indonesia, Algeria, Vietnam, Kenya, Guinea-Bissau,
          Mozambique and Angola independence was won or hastened by armed struggle; India's came after decades of mass movements. At
          Bandung in 1955 the new states declared their own agenda, and in 1960 the UN declared colonialism contrary to human rights.
          Getachew shows that the anticolonial leaders aimed to remake the whole world order, not only to win states.
        against:
          - from: marxism.trotskyism
            text: >-
              Liberation stopped at national independence under bourgeois or military rulers; without socialist revolution it was
              bound to be reversed.
          - from: conservatism.neo
            text: >-
              Many liberation movements became one-party states that ruined their countries; Zimbabwe and Guinea are not models.
        sources:
          - {author: Amílcar Cabral, title: "Return to the Source: Selected Speeches", year: 1973}
          - {author: Adom Getachew, title: "Worldmaking after Empire: The Rise and Fall of Self-Determination", year: 2019}
          - {author: Vijay Prashad, title: "The Darker Nations: A People's History of the Third World", year: 2007}
        traditions:
          defining: [marxism.third-worldism, marxism.african-socialism]
          typical: [nationalism.nasserism, marxism.ml, nationalism.pan-africanism, marxism.maoism, nationalism.decolonial]
          rejects: [conservatism.neo, conservatism.reactionary]
        presupposes: [violence.political.anti-colonial]
        tension: [hist.decolonization.nonviolent-victory]
        analysis:
          gains: [peripheral-workers, peasantry, professional-managerial]
          pays: [finance-capital, landed-capital]
          mechanism: >-
            Celebrating independence as a victory of the colonized backs the sovereignty of the new states over their resources, which
            cuts foreign claims, while the professional and official layers who staffed the new states gain most directly.
          drain: reduces
          law_of_value: regulates
      - id: hist.decolonization.empire-left-order
        label: Empire left railways, law and parliaments; much went wrong after
        claim: >-
          On this view the European empires, for all their crimes, brought law, administration, railways, schools and parliamentary
          institutions. Hasty withdrawal left fragile states to coups and civil wars; what followed in many countries was worse than
          what came before.
        voiced: >-
          "No organization in history has done more to promote the free movement of goods, capital and labour than the British Empire,
          and none did more to impose Western norms of law, order and governance. Independence too often meant the end of both."
        you: You think the empires left valuable institutions, and that many new states squandered them.
        because: >-
          The British left an Indian civil service, railways and courts; the common law, English as a lingua franca and parliamentary
          forms survive across the former empire. In the Belgian Congo and elsewhere withdrawal within months left no trained
          administrators and was followed by civil war. Ferguson and Gilley argue that many post-colonial governments did worse than the
          colonial administrations on order and growth.
        against:
          - from: marxism.dependency
            text: >-
              The railways ran from mines and plantations to ports; the "order" included the Bengal famines, the Congo's severed hands
              and the Kenyan camps (Elkins). India's share of world output fell from about a quarter to a few percent under British rule.
          - from: liberalism.internationalist
            text: >-
              Gilley's 2017 article was withdrawn by the journal that published it after its editorial board protested its scholarship.
        sources:
          - {author: Niall Ferguson, title: "Empire: How Britain Made the Modern World", year: 2003}
          - {author: Bruce Gilley, title: "The Case for Colonialism", year: 2017, note: "Third World Quarterly; withdrawn by the journal"}
          - {author: Frederick Lugard, title: "The Dual Mandate in British Tropical Africa", year: 1922}
        traditions:
          typical: [conservatism.neo, conservatism.burkean, conservatism.national, conservatism.reactionary]
          rejects: [nationalism.pan-africanism, marxism.dependency, nationalism.decolonial, marxism.third-worldism]
        presupposes: [imperialism.nature.civilizing-order]
        excludes: [hist.decolonization.flag-independence, hist.decolonization.liberation-won]
        analysis:
          gains: [finance-capital, comprador-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >-
            Crediting empire with order and blaming independence for disorder justifies external supervision of former colonies,
            through conditional lending and intervention, which keeps their resources open to the firms of the old powers.
          drain: sustains
          law_of_value: extends
      - id: hist.decolonization.self-determination
        label: The spread of self-determination, peoples becoming equal nations
        claim: >-
          Decolonization extended the principle that peoples govern themselves to the whole world. Through the UN, former colonies became
          sovereign equals with a vote, and the norm against conquest and colonial rule became part of international law.
        voiced: >-
          "The subjection of peoples to alien subjugation, domination and exploitation constitutes a denial of fundamental human
          rights. All peoples have the right to self-determination."
        you: You see decolonization as the spread of self-government and equal sovereignty under international law.
        because: >-
          The UN Charter of 1945 named self-determination as a principle; General Assembly Resolution 1514 of 1960 declared colonialism
          a denial of human rights. UN membership grew from 51 states to over 140 by the mid-1970s, most of them former colonies, and the
          General Assembly became a forum where they held the majority. Wilson's Fourteen Points had promised the principle; the new
          states made it general.
        against:
          - from: nationalism.pan-africanism
            text: >-
              Equal votes in the General Assembly mean little while the Security Council, the IMF and the World Bank are run by the old
              powers.
          - from: nationalism.decolonial
            text: >-
              Self-determination meant accepting colonial borders and the European nation-state form; peoples were "freed" into the
              shape their conquerors had drawn.
        sources:
          - {author: UN General Assembly, title: "Declaration on the Granting of Independence to Colonial Countries and Peoples (Resolution 1514)", year: 1960}
          - {author: Woodrow Wilson, title: "Fourteen Points", year: 1918}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.social, socdem.keynesian, nationalism.civic]
          contested: [nationalism.pan-africanism]
        presupposes: [nation.question.wilsonian]
        analysis:
          gains: [professional-managerial, core-workers]
          pays: [landed-capital]
          mechanism: >-
            Treating formal sovereign equality as the achievement leaves economic hierarchy outside the question, which suits the core
            powers that hold the financial and trade institutions while granting the South a forum and a vote.
          drain: softens
          law_of_value: none
      - id: hist.decolonization.coloniality-remains
        label: Rule ended but coloniality of power and knowledge remains
        claim: >-
          Political independence did not end the hierarchy colonialism created: the ranking of peoples by race, the dominance of European
          languages and knowledge, the elites who think with their former masters' minds. That coloniality still has to be undone.
        voiced: >-
          "The biggest weapon wielded by imperialism is the cultural bomb: it annihilates a people's belief in their names, in their
          languages, in their environment, in their heritage, in themselves."
        you: You think colonialism lives on in culture, language, knowledge and race, even after independence.
        because: >-
          Across Africa, schooling, courts and government still run largely in English, French or Portuguese. Ngũgĩ stopped writing in
          English in protest. Quijano argued that the racial classification of the world created by conquest still organizes who works,
          who rules and whose knowledge counts. Independence that keeps the colonizer's categories reproduces his rule.
        against:
          - from: marxism.dependency
            text: >-
              Culture is downstream of economics: as long as the drain continues, decolonizing syllabi changes nothing material.
          - from: liberalism.classical
            text: >-
              Science, law and languages are not European property; rejecting them as "colonial" hurts the poor who need them most.
        sources:
          - {author: Ngũgĩ wa Thiong'o, title: "Decolonising the Mind: The Politics of Language in African Literature", year: 1986}
          - {author: Aníbal Quijano, title: "Coloniality of Power, Eurocentrism, and Latin America", year: 2000}
        traditions:
          defining: [nationalism.decolonial]
          typical: [feminism.decolonial, nationalism.indigenous-sovereignty, nationalism.black-nationalism]
          contested: [marxism.black-radical]
          rejects: [liberalism.classical]
        presupposes: [imperialism.nature.coloniality]
        analysis:
          gains: [professional-managerial, peripheral-workers]
          pays: [comprador-capital]
          mechanism: >-
            Locating the remaining colonialism in culture and knowledge directs effort toward language, education and identity, which
            empowers Southern intellectuals and challenges Westernized elites but leaves property and the terms of trade less directly
            contested.
          drain: softens
          law_of_value: none
          method: mixed
      - id: hist.decolonization.nonviolent-victory
        label: A moral victory proving the strength of nonviolent mass resistance
        claim: >-
          India's independence, won by mass nonviolent resistance led by Gandhi, showed that the colonized could defeat an empire without
          becoming like it. That was decolonization's greatest lesson, and the violence elsewhere left a heavier legacy.
        voiced: >-
          "Non-violence is the greatest force at the disposal of mankind. The British will leave India not because we have defeated
          them by arms, but because we have made their rule impossible."
        you: You see nonviolent mass resistance as the real lesson of decolonization.
        because: >-
          The Salt March of 1930 and Quit India of 1942 mobilized millions and made British rule morally untenable at home and abroad.
          Gandhi's methods inspired Nkrumah's "positive action" in the Gold Coast and later the US civil rights movement. Where
          independence came through long wars, as in Algeria, the armies that won often ruled afterwards.
        against:
          - from: marxism.third-worldism
            text: >-
              Britain left India after a world war that bankrupted it, the naval mutiny of 1946 and the threat of mass revolt, and left
              a partition that killed hundreds of thousands. Algeria and Vietnam had no nonviolent road.
          - from: nationalism.ambedkarite
            text: >-
              Gandhi's nonviolence protected caste Hindu interests and opposed separate rights for the untouchables.
        sources:
          - {author: M. K. Gandhi, title: "Hind Swaraj", year: 1909}
          - {author: Kwame Nkrumah, title: "Ghana: The Autobiography of Kwame Nkrumah", year: 1957}
        traditions:
          defining: [nationalism.gandhian]
          typical: [anarchism.christian, religious.engaged-buddhism, liberalism.social]
          rejects: [marxism.third-worldism, marxism.maoism]
        presupposes: [violence.political.never]
        tension: [hist.decolonization.liberation-won]
        analysis:
          gains: [professional-managerial, petty-bourgeoisie]
          pays: [peasantry]
          mechanism: >-
            Making nonviolence the lesson favors negotiated transfers of power to educated national elites, which in many countries left
            landlord and colonial property relations in place.
          drain: softens
          law_of_value: none
  # ------------------------------------------------------------------
  - id: hist.collapse-1989
    domain: history
    layer: analysis
    question: What happened in 1989–1991, when the Eastern bloc and the Soviet Union fell?
    plain: >-
      In 1989 the Communist governments of Eastern Europe fell one after another and the Berlin Wall opened. In December 1991 the Soviet
      Union dissolved. In the following years Russia's output fell by around 40 percent and male life expectancy dropped sharply. What
      happened?
    short: the collapse of 1989–1991
    importance: 3
    region: history
    positions:
      - id: hist.collapse-1989.peoples-revolutions
        label: Peoples' revolutions that won liberty and national independence
        claim: >-
          In 1989 the peoples of Eastern Europe, from Solidarity's workers to the crowds of Leipzig and Prague, ended one-party rule
          almost without bloodshed, won free elections, freedom of speech and travel, and in the Baltics and elsewhere national
          independence.
        voiced: >-
          "We the people! Living within the truth, the powerless brought down the powerful without firing a shot. Europe was whole again."
        you: You see 1989 as peoples freeing themselves from imposed dictatorships.
        because: >-
          Solidarity, a union of ten million, won the partly free Polish election of June 1989; in East Germany the Monday marches in
          Leipzig grew to hundreds of thousands and opened the Wall on 9 November; the Velvet Revolution in Prague took ten days. Havel
          had described in 1978 how people "living within the truth" could undo a system that ran on everyday compliance. Garton Ash
          witnessed it as it happened.
        against:
          - from: marxism.ml
            text: >-
              The "revolutions" brought mass unemployment, the sale of industry to Western firms and the emigration of millions of young
              people; many who marched in 1989 were not marching for that.
          - from: marxism.trotskyism
            text: >-
              Solidarity's own program in 1981 was workers' self-management. The workers made 1989; the intellectuals and Western
              advisers decided what it would mean.
        sources:
          - {author: Václav Havel, title: "The Power of the Powerless", year: 1978}
          - {author: Timothy Garton Ash, title: "The Magic Lantern: The Revolution of '89 Witnessed in Warsaw, Budapest, Berlin, and Prague", year: 1990}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.classical, conservatism.christian-democracy, nationalism.civic, socdem.third-way]
          rejects: [marxism.ml, nationalism.eurasianism]
        presupposes: [intl.sovereignty.conditional-on-rights]
        excludes: [hist.collapse-1989.counter-revolution]
        analysis:
          gains: [professional-managerial, finance-capital]
          pays: [core-workers, peasantry]
          mechanism: >-
            Reading 1989 as liberation frames the market transition that followed as its natural fruit, which legitimated the sale of
            public industry, often to Western firms, and the end of guaranteed employment.
          drain: sustains
          law_of_value: extends
      - id: hist.collapse-1989.end-of-history
        label: The victory of liberal capitalism; no alternative remains
        claim: >-
          1989–91 settled the great argument of the twentieth century. Planned economies lost to market economies and one-party states to
          liberal democracies, and no rival system with universal appeal remains.
        voiced: >-
          "What we may be witnessing is not just the end of the Cold War, but the end of history as such: the universalization of Western
          liberal democracy as the final form of human government."
        you: You think 1989–91 proved that liberal capitalism has no serious alternative.
        because: >-
          The Soviet bloc fell without military defeat, from economic exhaustion and loss of faith; its own elites switched sides. China
          had already turned to markets. Fukuyama argued that liberal democracy had no ideological rival left. Sachs's programs in Poland
          showed rapid liberalization could rebuild a market economy within a few years.
        against:
          - from: marxism.scc
            text: >-
              China, which kept its party and its control of finance, grew fastest in the decades after 1991; the countries that took the
              liberal advice collapsed.
          - from: conservatism.postliberal
            text: >-
              Thirty years later liberalism is in crisis in its own heartlands; history did not end, it paused.
        sources:
          - {author: Francis Fukuyama, title: "The End of History and the Last Man", year: 1992}
          - {author: Jeffrey Sachs, title: "Poland's Jump to the Market Economy", year: 1993}
        traditions:
          defining: [liberalism.chicago, liberalism.technocratic]
          typical: [socdem.third-way, conservatism.neo, liberalism.classical]
          rejects: [marxism.ml, marxism.trotskyism, conservatism.postliberal]
        presupposes: [history.motor.ideas]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers, peripheral-workers]
          mechanism: >-
            Declaring no alternative removes socialism from the menu of governments and movements, which strengthens owners' bargaining
            position everywhere and justified the liberalization programs imposed on the South in the 1990s.
          drain: sustains
          law_of_value: extends
          method: idealist
      - id: hist.collapse-1989.counter-revolution
        label: A counter-revolution that restored capitalism and impoverished millions
        claim: >-
          1989–91 was a counter-revolution: socialism was dismantled from above and abroad, public property was stolen by a new class of
          oligarchs, and hundreds of millions lost jobs, pensions and security. Millions died early in the mortality crisis that followed.
        voiced: >-
          "It was the greatest theft in history. They took the factories the people built, sold them to oligarchs and foreigners, and
          millions of our people died of poverty and despair."
        you: You see the collapse of 1989–91 as a counter-revolution and a disaster for working people.
        because: >-
          Russia's GDP fell by around 40 percent between 1990 and 1998; male life expectancy fell from about 64 to under 58 by 1994.
          Stuckler, King and McKee linked rapid mass privatization to higher male death rates across the former bloc. In the 1995
          loans-for-shares deals the largest firms passed to a handful of bankers. In the March 1991 referendum about three quarters of
          voters had backed keeping the Union, which was dissolved nine months later.
        against:
          - from: liberalism.classical
            text: >-
              The system was already bankrupt; the "theft" happened because there was no rule of law, not because of markets. Poland and
              the Baltic states, which reformed fastest, recovered fastest.
          - from: marxism.third-camp
            text: >-
              There was no socialism to overthrow; one form of capitalism became another.
        sources:
          - {author: Roger Keeran and Thomas Kenny, title: "Socialism Betrayed: Behind the Collapse of the Soviet Union", year: 2004}
          - {author: "David Stuckler, Lawrence King and Martin McKee", title: "Mass Privatisation and the Post-Communist Mortality Crisis: A Cross-National Analysis", year: 2009}
          - {author: Kristen Ghodsee and Mitchell A. Orenstein, title: "Taking Stock of Shock: Social Consequences of the 1989 Revolutions", year: 2021}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.juche, marxism.scc, marxism.third-worldism]
          rejects: [liberalism.internationalist, marxism.third-camp, liberalism.chicago]
        presupposes: [hist.ussr-late.real-socialism-betrayed]
        excludes: [hist.collapse-1989.peoples-revolutions, hist.collapse-1989.sideways-step]
        analysis:
          gains: [core-workers, peripheral-workers, reserve-army]
          pays: [finance-capital, comprador-capital]
          mechanism: >-
            Reading 1991 as counter-revolution makes the privatized fortunes illegitimate and renationalization a claim, which threatens
            the oligarchs and Western investors who took the assets.
          drain: reduces
          law_of_value: suspends
          disputed: >-
            Estimates of excess deaths in Russia in the 1990s range from about 3 to over 6 million, depending on method; the causes
            (alcohol, stress, collapse of health care, privatization) are debated.
      - id: hist.collapse-1989.sideways-step
        label: A step sideways, from state capitalism to private capitalism
        claim: >-
          The Eastern bloc was never socialist. 1989–91 replaced one form of capitalist rule with another: the state bureaucracy gave way
          to private owners, often the same people. For workers it was neither a victory nor a defeat of socialism.
        voiced: >-
          "The storm breaks: not the end of socialism, which never existed there, but a move sideways from state capitalism to market
          capitalism. The old bosses kept the factories under new names."
        you: You think the collapse of 1989–91 swapped state capitalism for private capitalism, with no socialism lost.
        because: >-
          Many of the new owners were former managers and party officials, who turned control into ownership. Harman argued in 1990
          that the crisis was that of a state capitalism outcompeted by the world market. Maoists made the related argument that
          capitalism had been restored long before, after 1956. The workers who struck in 1989 struck against their bosses, not for a
          market.
        against:
          - from: marxism.ml
            text: >-
              If nothing changed, explain the collapse of output, the end of full employment, the falling life expectancy and the
              billionaires. Something real was lost.
          - from: marxism.trotskyism
            text: >-
              Nationalized property and the plan were destroyed and replaced by private property; that is a social counter-revolution,
              not a sideways step.
        sources:
          - {author: Chris Harman, title: "The Storm Breaks", year: 1990, note: "International Socialism 46"}
          - {author: Tony Cliff, title: "Stalinist Russia: A Marxist Analysis", year: 1955}
        traditions:
          defining: [marxism.third-camp]
          typical: [marxism.left-communism, marxism.council-communism, marxism.mlm, marxism.hoxhaism, anarchism.communist]
          rejects: [marxism.ml, marxism.trotskyism]
        presupposes: [hist.ussr-stalin.state-capitalism]
        excludes: [hist.collapse-1989.counter-revolution]
        analysis:
          gains: [core-workers]
          pays: [professional-managerial]
          mechanism: >-
            Treating 1991 as a change of form keeps workers' movements independent of any nostalgia for the Soviet state, while
            understating the material losses workers suffered in the transition.
          drain: none
          law_of_value: abolishes
      - id: hist.collapse-1989.bureaucracy-became-owners
        label: The bureaucracy turned itself into owners, as Trotsky predicted
        claim: >-
          The planned economy was destroyed not by the workers or by invasion but by its own ruling layer, which decided it would rather
          own the factories than administer them. The collapse was a revolution from above by the nomenklatura.
        voiced: >-
          "Trotsky said it in 1936: either the workers overthrow the bureaucracy, or the bureaucracy will become a new possessing class.
          In 1991 it did."
        you: You think the Soviet elite itself dismantled the system to make itself rich.
        because: >-
          Kotz and Weir show that the party-state elite, not a popular movement, drove the move to capitalism: surveys found most of the
          elite favored it by 1991 while most citizens did not. Komsomol and ministry officials founded the first private banks; the
          managers of state firms became their owners. Trotsky had predicted the outcome in The Revolution Betrayed.
        against:
          - from: marxism.ml
            text: >-
              The betrayal was ideological, a revisionist leadership, not a "class"; most party members lost everything in 1991.
          - from: liberalism.classical
            text: >-
              Eastern Europe's 1989 was a popular revolt, not an elite maneuver; the Soviet case was different only because Russia had
              no tradition of civil society.
        sources:
          - {author: David Kotz and Fred Weir, title: "Revolution from Above: The Demise of the Soviet System", year: 1997}
          - {author: Leon Trotsky, title: "The Revolution Betrayed", year: 1936}
        traditions:
          defining: [marxism.trotskyism]
          typical: [socdem.democratic-socialism, marxism.luxemburgism]
          rejects: [marxism.ml, liberalism.classical]
        presupposes: [hist.ussr-stalin.degenerated-workers-state]
        analysis:
          gains: [core-workers]
          pays: [professional-managerial, finance-capital]
          mechanism: >-
            Blaming the bureaucracy rather than the planned economy keeps planning on the program and points workers at managerial
            elites as a class that will sell public property if not controlled from below.
          drain: reduces
          law_of_value: suspends
      - id: hist.collapse-1989.geopolitical-catastrophe
        label: The fall of a great state, the century's greatest geopolitical catastrophe
        claim: >-
          The dissolution of the Soviet Union was above all the break-up of a great historic state. Tens of millions of Russians found
          themselves outside Russia overnight, the West broke its promises and expanded NATO eastward, and Russia was humiliated for a
          decade.
        voiced: >-
          "The collapse of the Soviet Union was the greatest geopolitical catastrophe of the century. For the Russian people it became a
          genuine drama: tens of millions of our citizens found themselves outside Russian territory."
        you: You see the end of the USSR as the destruction of a great power and a humiliation for Russia.
        because: >-
          Some 25 million ethnic Russians were left in new states in 1991. NATO admitted Poland, Hungary and the Czech Republic in 1999
          and the Baltic states in 2004, despite assurances Soviet leaders say they were given in 1990. In the 1990s Western advisers
          shaped Russian policy while its economy collapsed. Dugin argued that Russia's destiny is a Eurasian great power opposed to the
          Atlantic sea powers.
        against:
          - from: liberalism.internationalist
            text: >-
              The Baltic, Ukrainian and Central Asian peoples chose independence, by large majorities; calling their freedom a
              catastrophe is the voice of empire.
          - from: marxism.ml
            text: >-
              The catastrophe was the end of socialism, not of a "great state"; Putin's Russia celebrates the empire and condemns Lenin
              for its national republics.
        sources:
          - {author: Vladimir Putin, title: "Annual Address to the Federal Assembly of the Russian Federation", year: 2005}
          - {author: Aleksandr Dugin, title: "Foundations of Geopolitics", year: 1997}
        traditions:
          defining: [nationalism.eurasianism]
          typical: [conservatism.national, conservatism.traditionalist]
          contested: [marxism.ml]
          rejects: [liberalism.internationalist, nationalism.civic]
        presupposes: [history.motor.peoples-in-struggle]
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: [core-workers]
          mechanism: >-
            Framing 1991 as a national catastrophe rather than a social one channels resentment toward the West and lost territory, which
            binds Russian workers to a state that protects the owners of privatized industry.
          drain: none
          law_of_value: none
          method: idealist
      - id: hist.collapse-1989.shock-therapy-blunder
        label: The end of the old system was welcome; shock therapy was the disaster
        claim: >-
          The fall of the old system was inevitable and largely welcome, but the way the transition was done, overnight price
          liberalization and rushed privatization on Western advice, caused an avoidable collapse. Gradual reform, as in China, would have
          spared millions.
        voiced: >-
          "The market Bolsheviks thought you could build capitalism overnight. They freed prices before there was competition and sold
          off industry before there were laws. Russia paid the price."
        you: You think the post-1991 disaster came from shock therapy, not from the end of communism itself.
        because: >-
          Russia freed most prices in January 1992; inflation that year exceeded 2,000 percent, wiping out savings. Voucher and
          loans-for-shares privatization transferred the largest firms to insiders. Stiglitz, then chief economist of the World Bank,
          argued that the IMF's sequencing was the error. Weber shows China rejected the same big-bang advice in 1988 and kept growing.
        against:
          - from: liberalism.chicago
            text: >-
              Poland's shock therapy worked; Russia's failure came from going too slowly and letting insiders capture the reforms.
          - from: marxism.ml
            text: >-
              Gradual capitalism is still capitalism; the disaster was the goal, not the tempo.
        sources:
          - {author: Joseph E. Stiglitz, title: "Globalization and Its Discontents", year: 2002}
          - {author: Isabella M. Weber, title: "How China Escaped Shock Therapy: The Market Reform Debate", year: 2021}
        traditions:
          defining: [socdem.keynesian]
          typical: [nationalism.developmental-state, liberalism.social, socdem.democratic-socialism]
          rejects: [liberalism.chicago, liberalism.austrian]
        presupposes: [capitalism.nature.managed-engine]
        analysis:
          gains: [professional-managerial, core-workers]
          pays: [finance-capital]
          mechanism: >-
            Blaming the method rather than the outcome supports managed, state-sequenced transitions, which protect employment and
            domestic industry from foreign buyers but accept the end of public ownership as the goal.
          drain: softens
          law_of_value: regulates
