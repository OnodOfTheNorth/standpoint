problematics:
  - id: family.form
    domain: culture
    layer: horizon
    question: What is the family for, and what form should it take?
    plain: What is a family, and what should law and society expect of it?
    short: the family
    importance: 3
    region: family
    positions:
      - id: family.form.natural-institution
        label: Marriage of man and woman, open to children, prior to the state
        claim: >
          The family founded on the lifelong marriage of a man and a woman, open to children, is a
          natural institution older than the state. Law and economy should protect it, and the
          state should support it without replacing it.
        voiced: >
          The family is the first and vital cell of society. It has rights prior to any state, and
          the state exists to serve it, not to absorb it. A father, a mother and their children:
          this is not a lifestyle but the order of creation.
        you: >
          You think the family of a married mother and father with their children is the natural
          foundation of society, and that law should protect it.
        because: >
          Children do best, on average, with their own married parents; the family is where each
          generation learns love, duty and sacrifice. When it weakens, the state and the market fill
          the gap, poorly and at great cost. Because the family has its own rights, it is also a
          barrier against both state and market overreach.
        against:
          - from: feminism.radical
            text: >
              The "natural" family has been for most of history a property relation in which wives
              and children belonged to husbands. Its privacy has hidden the violence done inside it.
          - from: liberalism.progressive
            text: >
              Millions of families, single parents, same-sex couples, grandparents raising children,
              do the same work of love. Defining the family narrowly punishes their children.
        sources:
          - {author: John Paul II, title: "Familiaris Consortio", year: 1981}
          - {author: Leo XIII, title: "Rerum Novarum", year: 1891}
          - {author: Mary Eberstadt, title: "How the West Really Lost God", year: 2013}
        traditions:
          defining: [conservatism.cst]
          typical: [conservatism.traditionalist, conservatism.evangelical-right, conservatism.christian-democracy, conservatism.integralism, conservatism.distributism, religious.islamism-brotherhood]
          contested: [conservatism.burkean, conservatism.fusionism]
          rejects: [liberalism.progressive, feminism.radical, feminism.queer, marxism.classical]
        presupposes: [gender.basis.created-order]
        excludes: [family.form.abolition, family.form.chosen-plural]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie, landed-capital]
          pays: [reserve-army]
          mechanism: >
            Making the married household the unit of welfare and care leaves unpaid care work to
            women within it and protects inheritance within families, while single parents and those
            outside the norm receive less support.
          drain: none
          law_of_value: suspends
          disputed: >
            Some socialists note Catholic social teaching backs the family wage, family allowances
            and limits on working hours against capital, which helps working families.

      - id: family.form.chosen-plural
        label: A family is any committed bond adults choose; law should be neutral
        claim: >
          A family is any committed relationship of care that adults choose, whatever its sex,
          number of parents or structure. The law should recognize and protect all of them equally,
          including same-sex marriage.
        voiced: >
          Love makes a family. The state has no business ranking households, and every child
          deserves the same protection whoever is raising them.
        you: >
          You think a family is whatever committed relationship of care people choose, and that the
          law should treat all families equally.
        because: >
          The state's interest is in care and commitment, not in a particular form. Equal
          recognition gives same-sex couples, blended families and single parents the same legal
          security, inheritance and parental rights. Studies of children of same-sex parents find no
          disadvantage from the parents' sex.
        against:
          - from: conservatism.cst
            text: >
              A family is not an arrangement of preferences but a natural institution ordered to
              children. Once marriage means whatever adults want, it means nothing in particular,
              and children lose the claim to a mother and a father.
          - from: marxism.classical
            text: >
              Expanding marriage to new couples extends the private household as the unit of care
              and inheritance, and leaves the economic dependency of its members untouched.
        sources:
          - {author: Andrew Sullivan, title: "Virtually Normal", year: 1995}
          - {author: Supreme Court of the United States, title: "Obergefell v. Hodges", year: 2015}
        traditions:
          defining: [liberalism.progressive]
          typical: [liberalism.social, liberalism.egalitarian, feminism.liberal, socdem.nordic, socdem.third-way]
          contested: [libertarianism.minarchist, feminism.queer]
          rejects: [conservatism.cst, conservatism.evangelical-right, conservatism.integralism, religious.islamism-brotherhood]
        presupposes: []
        excludes: [family.form.natural-institution]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial, core-workers]
          pays: []
          mechanism: >
            Equal recognition extends legal security, tax treatment and inheritance to more
            households, mainly benefiting those with property and benefits to pass on, without
            changing who does unpaid care.
          drain: none
          law_of_value: none

      - id: family.form.private-contract
        label: Take the state out of marriage; family is private contract
        claim: >
          The state should not define or license marriage. Families are voluntary associations,
          and their terms should be set by the people in them, by contract and by their own
          religious or cultural communities.
        voiced: >
          Separate marriage and state. Let churches marry whom they will, let couples sign the
          contracts they choose, and let the government enforce contracts and protect children from
          abuse, nothing more.
        you: >
          You think government should get out of marriage entirely and let people and their
          communities set the terms.
        because: >
          State licensing of marriage turns a private commitment into a political battlefield.
          Privatizing it ends the culture war over its definition: each community keeps its own
          meaning, and nobody's union is imposed on anyone else. Families also regain functions the
          welfare state took from them.
        against:
          - from: feminism.liberal
            text: >
              Contract between unequal parties favors the stronger. Without public rules on divorce,
              support and property, the spouse who stayed home to raise children is left with nothing.
          - from: conservatism.cst
            text: >
              Children cannot sign contracts. Marriage is public because it binds parents to the
              next generation; privatizing it abandons children to adults' preferences.
        sources:
          - {author: Gary S. Becker, title: "A Treatise on the Family", year: 1981}
          - {author: Murray N. Rothbard, title: "For a New Liberty", year: 1973}
        traditions:
          defining: [libertarianism.minarchist]
          typical: [libertarianism.ancap, libertarianism.objectivist, liberalism.chicago]
          contested: [libertarianism.paleo]
          rejects: [conservatism.cst, socdem.nordic, liberalism.progressive]
        presupposes: []
        excludes: [family.form.socialize-care]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, professional-managerial]
          pays: [reserve-army, core-workers]
          mechanism: >
            Moving family terms from public law to private contract favors the party with more
            income and legal resources, and shifting welfare functions back to families places care
            costs on households without savings.
          drain: none
          law_of_value: extends

      - id: family.form.socialize-care
        label: Socialize housework and childcare so the family rests on free union
        claim: >
          The private family household rests on property and on women's unpaid work. Housework,
          childcare and elder care should become public services, so that family ties rest on free
          affection rather than economic dependence.
        voiced: >
          The family ceases to be an economic unit when society takes over the kitchens, the
          laundries and the nurseries. What remains is a free union of equals, bound by love and
          comradeship, not by bread.
        you: >
          You think housework and childcare should be shared by society through public services, so
          that families stay together out of love, not economic need.
        because: >
          The monogamous family arose with private property, to pass it to certain heirs, and it
          made women's labor private and unpaid. Public canteens, laundries, nurseries and
          elder care free women for public life and work. The early Soviet state legalized divorce
          and abortion and planned communal services on this basis.
        against:
          - from: conservatism.cst
            text: >
              The state nursery cannot love a child. Every attempt to take the family's work into
              public hands produced cold institutions and children raised by bureaucracy.
          - from: liberalism.classical
            text: >
              The Soviet experiment retreated in the 1930s to promoting the family and banning
              abortion again, a sign the program ran against what people wanted.
        sources:
          - {author: Friedrich Engels, title: "The Origin of the Family, Private Property and the State", year: 1884}
          - {author: Alexandra Kollontai, title: "Communism and the Family", year: 1920}
        traditions:
          defining: [marxism.classical]
          typical: [marxism.leninism, marxism.social-reproduction, feminism.materialist, marxism.trotskyism, anarchism.feminist]
          contested: [marxism.ml, socdem.nordic]
          rejects: [conservatism.cst, conservatism.evangelical-right, libertarianism.minarchist]
        presupposes: [history.motor.class-struggle]
        excludes: [family.form.natural-institution, family.form.private-contract]
        tension: []
        tags: [kollontai]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Public provision of care funded by taxing profits and wealth moves the cost of
            reproducing the workforce from women's unpaid hours to capital, and lets women bargain
            from independence.
          drain: none
          law_of_value: suspends
          consciousness: hegemonic

      - id: family.form.abolition
        label: Abolish the family as a private unit of property and care
        claim: >
          The private family is the place where care is rationed by blood, property passes down,
          and much violence happens. It should be abolished in favor of chosen, collective forms of
          care open to all, not reformed.
        voiced: >
          Abolish the family, not by destroying love but by making it unnecessary to depend on one
          household for survival. Full surrogacy: care for everyone by everyone.
        you: >
          You think the family as a private unit should eventually be replaced by collective care
          open to everyone.
        because: >
          The family privatizes care: it gives children the luck of their parents' wealth and
          character and leaves them nowhere to go when that fails. Queer people, abused children and
          women in violent homes know that the family is not always a haven. Collective care would
          spread both the burden and the love.
        against:
          - from: conservatism.traditionalist
            text: >
              People do not want to be cared for by "everyone"; they want their own mother. Every
              utopia of collective child-rearing has been abandoned by the people living in it.
          - from: marxism.social-reproduction
            text: >
              For poor and racialized people the family has been a refuge against the state and
              market. Calling for its abolition speaks past the families that slavery, colonial
              boarding schools and deportation already broke up.
        sources:
          - {author: Shulamith Firestone, title: "The Dialectic of Sex", year: 1970}
          - {author: Sophie Lewis, title: "Abolish the Family: A Manifesto for Care and Liberation", year: 2022}
        traditions:
          defining: [feminism.queer]
          typical: [feminism.radical, anarchism.feminist, marxism.autonomism]
          contested: [feminism.materialist, marxism.social-reproduction]
          rejects: [conservatism.cst, conservatism.traditionalist, feminism.black]
        presupposes: []
        excludes: [family.form.natural-institution, family.form.nation-continuity]
        tension: []
        tags: []
        analysis:
          gains: [reserve-army]
          pays: [landed-capital, finance-capital]
          mechanism: >
            Ending the family as the unit of inheritance and dependency would break the transmission
            of wealth through kinship and remove the unpaid household labor that lowers employers'
            wage costs.
          drain: none
          law_of_value: suspends
          disputed: >
            Black feminists and social reproduction theorists argue the program ignores how racial
            capitalism has already destroyed families of the poor.

      - id: family.form.kin-and-lineage
        label: The family is an extended lineage with duties to elders and ancestors
        claim: >
          The family is not a couple and their children but an extended lineage: grandparents,
          aunts, cousins and ancestors, bound by mutual duties of care and respect. Public life
          should support these wider bonds rather than the isolated nuclear household.
        voiced: >
          Filial piety is the root of virtue. A person is a node in a web of kin, not a lonely
          individual. In our tradition no elder is left alone, and no child belongs only to two
          people.
        you: >
          You think family means the whole extended kin group with duties to elders and ancestors,
          not just parents and children.
        because: >
          Across most of the world and most of history, extended kin networks provided care, credit,
          housing and old-age security. The isolated nuclear family is a recent, Western and
          industrial form that leaves the old alone and parents overwhelmed. Nyerere saw in African
          familyhood the model for a socialist society.
        against:
          - from: feminism.liberal
            text: >
              Duties to the lineage fall mostly on daughters-in-law, and elders' authority has meant
              arranged marriages and the control of young women.
          - from: liberalism.classical
            text: >
              Obligations to kin become nepotism in public office and business; impersonal rules
              are what let strangers trust each other.
        sources:
          - {author: Fei Xiaotong, title: "From the Soil", year: 1947}
          - {author: Julius K. Nyerere, title: "Ujamaa: The Basis of African Socialism", year: 1962}
        traditions:
          defining: [religious.confucian]
          typical: [marxism.african-socialism, religious.political-meritocracy, communitarianism, nationalism.indigenous-sovereignty]
          contested: [conservatism.traditionalist]
          rejects: [liberalism.classical, feminism.liberal]
        presupposes: []
        excludes: [family.form.private-contract]
        tension: []
        tags: [global-south]
        analysis:
          gains: [peasantry, petty-bourgeoisie]
          pays: []
          mechanism: >
            Kin obligations provide care and old-age support without state or market, which lets
            states keep social spending low and lets employers pay wages that a single household
            could not live on.
          drain: none
          law_of_value: suspends

      - id: family.form.nation-continuity
        label: Families exist to continue the nation; the state should promote births
        claim: >
          The family's purpose includes continuing the nation. Falling birth rates threaten national
          survival, and the state should actively promote marriage and children among its citizens
          through tax, housing and family policy.
        voiced: >
          A nation that does not have children has no future, and importing people is not the
          answer. We will make it pay to raise a family here: the cradle, not the border, will
          decide our future.
        you: >
          You think families are how the nation continues, and that the government should actively
          encourage citizens to have children.
        because: >
          Birth rates below replacement shrink and age a nation, burden its pensions and push
          governments toward mass migration. Generous support for families, as Hungary and Poland
          have tried, treats children as the public good they are.
        against:
          - from: feminism.liberal
            text: >
              Natalist states treat women's bodies as national resources; Romania's ban on abortion
              in 1966 filled orphanages and killed women through illegal abortions.
          - from: marxism.social-reproduction
            text: >
              People have fewer children because housing is unaffordable and work never stops.
              Tax credits for married citizens do nothing for the workers who cannot afford a home.
        sources:
          - {author: Yoram Hazony, title: "Conservatism: A Rediscovery", year: 2022}
          - {author: Mary Eberstadt, title: "Primal Screams", year: 2019}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.postliberal, conservatism.right-populism, nationalism.ethnic, fascism.identitarian, nationalism.eurasianism]
          contested: [conservatism.cst]
          rejects: [feminism.liberal, liberalism.progressive, feminism.radical]
        presupposes: []
        excludes: [family.form.abolition]
        tension: []
        tags: [natalism]
        analysis:
          gains: [petty-bourgeoisie, professional-managerial]
          pays: [reserve-army]
          mechanism: >
            Natalist subsidies through tax credits and mortgage support go mainly to married,
            employed, property-buying citizens, while migrants and the poor are excluded.
          drain: none
          law_of_value: regulates

  - id: gender.basis
    domain: culture
    layer: analysis
    question: What is gender?
    plain: What makes someone a man or a woman?
    short: gender
    importance: 2
    region: gender
    positions:
      - id: gender.basis.created-order
        label: Male and female are given by nature and creation
        claim: >
          Humans are created male and female, and the difference is bodily, psychological and
          spiritual. Social roles rightly follow from it. A person cannot change their sex, and
          gender cannot be separated from it.
        voiced: >
          Male and female He created them. Sexual difference is not a social construction but a
          gift written into the body, ordered to the union of man and woman and to new life.
        you: >
          You think being a man or a woman is given by nature or by God, and that roles should
          follow from it.
        because: >
          Sex is fixed at conception and shapes every cell. Every human society has recognized two
          sexes and organized life around their difference and complementarity. Denying it
          confuses children and dissolves the family, which rests on the union of the two.
        against:
          - from: feminism.liberal
            text: >
              Biology does not dictate who cooks or who governs. Roles once called natural, women
              barred from universities, from voting, from medicine, collapsed as soon as women were
              admitted.
          - from: feminism.queer
            text: >
              Intersex people, trans people and the many societies with more than two recognized
              genders show that the binary is enforced, not given.
        sources:
          - {author: Congregation for Catholic Education, title: "Male and Female He Created Them", year: 2019}
          - {author: Catechism of the Catholic Church, title: "Catechism of the Catholic Church", year: 1992}
        traditions:
          defining: [conservatism.cst]
          typical: [conservatism.evangelical-right, conservatism.traditionalist, conservatism.integralism, religious.islamism-brotherhood, religious.salafism-quietist, nationalism.eurasianism]
          contested: [religious.confucian]
          rejects: [feminism.queer, feminism.liberal, feminism.materialist]
        presupposes: []
        excludes: [gender.basis.performative, gender.basis.identity]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie]
          pays: [reserve-army]
          mechanism: >
            Assigning roles by sex justifies leaving care work unpaid in the household and keeping
            women in lower-paid, part-time work, which lowers the cost of reproducing labor.
          drain: none
          law_of_value: suspends

      - id: gender.basis.social-roles
        label: Sex is biological; gender roles are learned and can change
        claim: >
          Biological sex is real, but the roles, traits and expectations attached to it are made
          by society. They can and should be changed so that sex does not limit what anyone does.
        voiced: >
          One is not born, but rather becomes, a woman. Anatomy is not destiny: society takes a
          female child and teaches her to be the second sex.
        you: >
          You think bodies are male or female, but that what society expects of men and women is
          learned and can be changed.
        because: >
          The traits called feminine or masculine vary enormously across cultures and centuries,
          which they could not if they were fixed by nature. Women's achievements once the barriers
          fell show how much of "nature" was exclusion.
        against:
          - from: conservatism.traditionalist
            text: >
              Fifty years of telling children that sex differences are learned have not erased them;
              men and women still choose differently when they are freest to choose.
          - from: feminism.queer
            text: >
              The split between natural sex and social gender treats sex as a neutral base. But the
              decision to sort bodies into two kinds is itself a social act.
        sources:
          - {author: Simone de Beauvoir, title: "The Second Sex", year: 1949}
          - {author: Ann Oakley, title: "Sex, Gender and Society", year: 1972}
        traditions:
          defining: [feminism.liberal]
          typical: [liberalism.progressive, liberalism.social, socdem.nordic, feminism.radical]
          contested: [feminism.gender-critical, feminism.queer]
          rejects: [conservatism.cst, conservatism.evangelical-right]
        presupposes: []
        excludes: [gender.basis.created-order]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Treating roles as changeable opens professions and offices to women, which most
            benefits educated women, while the care work they leave is often passed to lower-paid
            women, many of them migrants.
          drain: none
          law_of_value: extends

      - id: gender.basis.sex-class
        label: Sex is real and immutable; gender is a hierarchy to abolish
        claim: >
          Sex is a material, immutable reality, and women are oppressed on the basis of it. Gender
          is the system of roles and stereotypes that keeps women subordinate, so it should be
          abolished, not adopted as an identity. Sex-based rights and spaces must be protected.
        voiced: >
          Woman is a sex class, not a feeling. Gender is the cage, not the key. You cannot identify
          out of a hierarchy built on the body, and you cannot identify into the class it oppresses.
        you: >
          You think womanhood is defined by sex, that gender roles are what oppresses women, and
          that women-only spaces and rights should be based on sex.
        because: >
          Women are oppressed through their bodies: pregnancy, rape, menstruation, sex-selective
          abortion. Replacing sex with gender identity in law erases the category women's rights
          depend on, in prisons, refuges, sport and statistics. Gender roles are not who anyone is;
          they are the stereotypes feminism set out to destroy.
        against:
          - from: feminism.queer
            text: >
              Gender-critical politics defines women by biology, the same move patriarchy made.
              Its campaigns have allied with religious conservatives to restrict trans people's
              medical care and access to public life.
          - from: liberalism.progressive
            text: >
              Trans women are a tiny share of the population and face high rates of violence. A
              feminism that treats them as a threat polices every woman's body.
        sources:
          - {author: Janice G. Raymond, title: "The Transsexual Empire", year: 1979}
          - {author: Sheila Jeffreys, title: "Gender Hurts", year: 2014}
          - {author: Kathleen Stock, title: "Material Girls", year: 2021}
        traditions:
          defining: [feminism.gender-critical]
          typical: [feminism.radical]
          contested: [feminism.materialist, marxism.ml]
          rejects: [feminism.queer, liberalism.progressive]
        presupposes: []
        excludes: [gender.basis.identity, gender.basis.performative]
        tension: [gender.basis.created-order]
        tags: [trans]
        analysis:
          gains: []
          pays: []
          mechanism: >
            The position has no direct effect on property or wages; its legal program allocates
            access to sex-segregated services and spaces, which matters most to women and trans
            people who depend on public prisons, shelters and hospitals.
          drain: none
          law_of_value: none

      - id: gender.basis.identity
        label: Gender is a deep sense of self; trans women are women
        claim: >
          Gender is a person's inner sense of being a man, a woman, both or neither, and it may
          differ from the sex recorded at birth. People should be recognized in law and life
          according to their gender identity.
        voiced: >
          Trans women are women. Trans men are men. Non-binary people are valid. No one knows who you
          are better than you do.
        you: >
          You think a person's gender is who they know themselves to be, and that trans people
          should be recognized as their gender.
        because: >
          Gender identity appears early and persists, and attempts to change it fail and harm.
          Transition and recognition sharply improve trans people's well-being. Recognition costs
          others little and grants a vulnerable minority the ordinary dignity everyone else has.
        against:
          - from: feminism.gender-critical
            text: >
              An inner feeling cannot be the basis of a legal category. If anyone can be a woman by
              declaration, women's sex-based protections mean nothing.
          - from: conservatism.cst
            text: >
              Separating the self from the body is an old dualism. Encouraging children toward
              medical transition before they can consent to its permanent effects is harm, not care.
        sources:
          - {author: Julia Serano, title: "Whipping Girl", year: 2007}
          - {author: Susan Stryker, title: "Transgender History", year: 2008}
        traditions:
          defining: [liberalism.progressive]
          typical: [feminism.liberal, socdem.nordic, liberalism.social]
          contested: [feminism.queer, feminism.radical]
          rejects: [feminism.gender-critical, conservatism.cst, conservatism.evangelical-right]
        presupposes: []
        excludes: [gender.basis.created-order, gender.basis.sex-class]
        tension: []
        tags: [trans]
        analysis:
          gains: []
          pays: []
          mechanism: >
            Legal recognition changes access to documents, services and protection from
            discrimination for trans people, many of whom are poor and excluded from work; it has no
            direct effect on property relations.
          drain: none
          law_of_value: none

      - id: gender.basis.performative
        label: Gender is performed, and sex too is socially made
        claim: >
          Gender is not an inner essence or a natural fact but a pattern of acts repeated under
          social pressure. Even the division of bodies into two sexes is socially produced. The aim
          is to loosen the norms that make some genders and desires unlivable.
        voiced: >
          There is no gender identity behind the expressions of gender; identity is performatively
          constituted by the very expressions said to be its results. Drag does not imitate an
          original; it shows that there is no original.
        you: >
          You think gender, and even the idea of two fixed sexes, is created by how people act and
          are made to act.
        because: >
          If gender were a natural fact it would not need constant policing: in school, in dress, in
          violence against those who deviate. Intersex bodies have been surgically "corrected" to
          fit two categories. Showing that norms are made opens them to change.
        against:
          - from: feminism.materialist
            text: >
              Performance is not the issue; gender is a material relation of exploitation, of who
              does unpaid work and who appropriates it. Subverting norms through parody leaves the
              division of labor untouched.
          - from: feminism.gender-critical
            text: >
              Bodies are not produced by discourse; women get pregnant whatever is said about them.
              A theory that dissolves sex dissolves the subject of feminism.
        sources:
          - {author: Judith Butler, title: "Gender Trouble", year: 1990}
          - {author: Judith Butler, title: "Bodies That Matter", year: 1993}
        traditions:
          defining: [feminism.queer]
          typical: [anarchism.feminist]
          contested: [liberalism.progressive, feminism.decolonial]
          rejects: [feminism.gender-critical, conservatism.cst, feminism.materialist]
        presupposes: []
        excludes: [gender.basis.created-order, gender.basis.sex-class]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            As a theory it has no direct class effect; its main institutional home is the
            university, and its politics address norms and recognition rather than wages or
            property.
          drain: none
          law_of_value: none
          disputed: >
            Some Marxists (Leslie Feinberg, Hennessy) tie gender norms to capitalism's need for the
            family and argue queer theory can be grounded materially.

      - id: gender.basis.class-relation
        label: Men and women are classes made by a relation of exploitation
        claim: >
          "Men" and "women" are social classes produced by a relation in which one group
          appropriates the labor, bodies and time of the other. Sex is the mark, not the cause.
          End the relation and the categories lose their meaning.
        voiced: >
          One is not born a woman. "Woman" exists only in relation to "man", as the slave exists in
          relation to the master. There is no natural group of women; there is a class made by
          appropriation.
        you: >
          You think men and women are groups created by one exploiting the other's labor, and that
          ending the exploitation would end the categories.
        because: >
          Women perform most unpaid domestic labor, which husbands appropriate. The idea of a natural
          sex difference is the ideology that justifies it, as race justifies another exploitation.
          Treating gender as a class relation points to its material basis and to its abolition.
        against:
          - from: feminism.difference
            text: >
              Abolishing the category of woman erases feminine difference instead of valuing it.
              The goal is not to become no-sex but for women to exist on their own terms.
          - from: marxism.classical
            text: >
              Women in a capitalist's family and in a worker's family are not one class: one shares
              in the ownership of production, the other does not. Calling sex a class confuses two
              different relations.
        sources:
          - {author: Monique Wittig, title: "One Is Not Born a Woman", year: 1981}
          - {author: Christine Delphy, title: "Close to Home: A Materialist Analysis of Women's Oppression", year: 1984}
        traditions:
          defining: [feminism.materialist]
          typical: [feminism.radical]
          contested: [feminism.gender-critical, marxism.social-reproduction]
          rejects: [conservatism.cst, feminism.difference]
        presupposes: []
        excludes: [gender.basis.created-order]
        tension: [class.concept.relation-to-production]
        tags: []
        analysis:
          gains: []
          pays: []
          mechanism: >
            Treating the household as a site of exploitation targets men's appropriation of women's
            unpaid labor across classes, so it redistributes within working-class households as
            much as between classes.
          drain: none
          law_of_value: none

      - id: gender.basis.evolved-differences
        label: Evolved sex differences shape behavior, within broad overlap
        claim: >
          Men and women differ on average in some evolved traits and preferences, shaped by
          selection over millions of years. Individuals vary widely and overlap, but group
          differences in outcomes partly reflect these differences, not only discrimination.
        voiced: >
          The blank slate is a myth. Sex differences in interests and temperament show up across
          cultures, in infancy and in the most egalitarian societies. Accept the science, treat
          people as individuals, and stop expecting identical outcomes.
        you: >
          You think men and women differ on average in some inborn traits, and that not every gap
          between them is caused by discrimination.
        because: >
          Differences in average interests, for instance in people versus things, appear across
          cultures and are sometimes larger in more gender-equal countries. Hormonal effects on
          behavior are measurable. Policy that assumes every gap is bias produces quotas that ignore
          what people choose.
        against:
          - from: feminism.liberal
            text: >
              Evolutionary stories are easy to tell after the fact. Measured differences shift
              quickly with social change: women now outnumber men in medicine and law in many
              countries where they were barred a century ago.
          - from: marxism.classical
            text: >
              "Choices" made inside a labor market that pays care work poorly and a household that
              assigns it to women are not evidence of nature.
        sources:
          - {author: Steven Pinker, title: "The Blank Slate", year: 2002}
          - {author: Catherine Hakim, title: "Work-Lifestyle Choices in the 21st Century: Preference Theory", year: 2000}
        traditions:
          defining: []
          typical: [liberalism.classical, libertarianism.objectivist, conservatism.fusionism, technology.transhumanism]
          contested: [liberalism.chicago, conservatism.traditionalist]
          rejects: [feminism.queer, feminism.materialist, feminism.radical]
        presupposes: []
        excludes: [gender.basis.performative]
        tension: []
        tags: []
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: [core-workers]
          mechanism: >
            Explaining pay and occupation gaps by preference removes the case for pay equity and
            revaluing feminized work, which keeps wages in care, retail and cleaning low.
          drain: none
          law_of_value: extends

      - id: gender.basis.colonial-imposition
        label: The gender binary was imposed by colonial rule
        claim: >
          Many colonized societies organized life by seniority, lineage or spiritual role rather
          than by a strict hierarchy of two sexes. Colonial rule imposed European gender norms, and
          decolonization includes undoing them.
        voiced: >
          Gender was not an organizing principle in Yoruba society before the West. The colonizers
          brought "women" as a category of the subordinate, and the modern gender system is part of
          the coloniality of power.
        you: >
          You think the strict division between men and women was spread by colonial rule, and that
          many societies organized themselves differently before.
        because: >
          Colonial administrators dealt only with men as chiefs and landholders, stripping women of
          roles they had held in trade and politics. Colonial laws, including Britain's sodomy laws
          still on the books in many former colonies, criminalized gender and sexual variance that
          local traditions had accepted.
        against:
          - from: feminism.liberal
            text: >
              Precolonial societies had their own patriarchies, bride price, seclusion, foot binding,
              sati. Blaming all subordination on colonialism romanticizes the past.
          - from: religious.islamism-brotherhood
            text: >
              Our religion and traditions distinguished men and women long before Europe; it is the
              Western sexual revolution that is being imposed today.
        sources:
          - {author: Oyèrónkẹ́ Oyěwùmí, title: "The Invention of Women: Making an African Sense of Western Gender Discourses", year: 1997}
          - {author: María Lugones, title: "Heterosexualism and the Colonial/Modern Gender System", year: 2007}
        traditions:
          defining: [feminism.decolonial]
          typical: [nationalism.decolonial, nationalism.indigenous-sovereignty]
          contested: [feminism.queer, marxism.black-radical]
          rejects: [feminism.liberal]
        presupposes: []
        excludes: [gender.basis.created-order]
        tension: []
        tags: [global-south]
        analysis:
          gains: [peasantry]
          pays: []
          mechanism: >
            Naming colonial gender law points to statutes and land and inheritance rules that
            transferred women's customary rights to men and to the colonial state; it has little
            direct effect on present property relations.
          drain: none
          law_of_value: none

  - id: feminism.subordination
    domain: culture
    layer: analysis
    question: What explains the subordination of women?
    plain: Why have women had less power than men, and what keeps it that way?
    short: the subordination of women
    importance: 3
    region: gender
    positions:
      - id: feminism.subordination.barriers-and-bias
        label: Legal barriers, prejudice and socialization
        claim: >
          Women's subordination comes from laws, customs and prejudices that excluded them from
          education, property, work and office, and from socialization that steers them away from
          ambition. Remove the barriers and equalize opportunity, and equality follows.
        voiced: >
          The legal subordination of one sex to the other is wrong in itself, and now one of the
          chief hindrances to human improvement. Give women the same rights, the same education
          and the same opportunities, and let merit decide.
        you: >
          You think women have been held back by unfair laws, prejudice and how girls are raised,
          and that equal rights and opportunity are the cure.
        because: >
          Every time a barrier fell, the vote, university, the professions, women entered and
          excelled. The remaining gaps track remaining barriers: unequal pay, harassment, lack of
          childcare. Equality of opportunity is a principle everyone already claims to hold; feminism
          asks that it be applied.
        against:
          - from: feminism.radical
            text: >
              Formal equality left male violence, pornography and the sexual order untouched. A
              woman can be a CEO and still be raped with impunity.
          - from: marxism.social-reproduction
            text: >
              Liberal feminism's gains went to professional women, whose careers depend on
              low-paid nannies and cleaners, mostly migrant women. Equal opportunity to exploit is
              not liberation.
        sources:
          - {author: Mary Wollstonecraft, title: "A Vindication of the Rights of Woman", year: 1792}
          - {author: John Stuart Mill, title: "The Subjection of Women", year: 1869}
          - {author: Betty Friedan, title: "The Feminine Mystique", year: 1963}
        traditions:
          defining: [feminism.liberal]
          typical: [liberalism.social, liberalism.progressive, liberalism.egalitarian, socdem.third-way]
          contested: [liberalism.classical]
          rejects: [conservatism.traditionalist, feminism.radical]
        presupposes: []
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Opening professions and boardrooms to women raises the incomes of educated women, while
            the care work they no longer do is bought from lower-paid women, often from the
            periphery.
          drain: sustains
          law_of_value: extends

      - id: feminism.subordination.patriarchy
        label: Patriarchy, a system of male power through sexuality and violence
        claim: >
          Women are subordinated by patriarchy: a system of male power, older than class and
          capitalism, maintained above all through control of women's sexuality and bodies, by
          violence, rape, pornography and compulsory heterosexuality.
        voiced: >
          The personal is political. Sexuality is to feminism what work is to Marxism: the thing
          most one's own, most taken away. Male dominance is not an accident of law; it is the
          system, and sex is its core.
        you: >
          You think men as a group hold power over women, kept up through control of women's bodies
          and through violence.
        because: >
          Male violence against women exists in every class and every society; no economic theory
          explains why. The family, religion, law and culture all assign women to men's use. Seeing
          patriarchy as its own system explains why socialist revolutions left it standing.
        against:
          - from: marxism.social-reproduction
            text: >
              A transhistorical patriarchy explains everything and therefore nothing. Women's
              oppression changes form with modes of production and differs by class and race.
          - from: feminism.black
            text: >
              "Women" as one sex class erased Black women, whose oppression ran through race and
              class as much as sex; white women have also been oppressors.
        sources:
          - {author: Kate Millett, title: "Sexual Politics", year: 1970}
          - {author: Shulamith Firestone, title: "The Dialectic of Sex", year: 1970}
          - {author: Catharine A. MacKinnon, title: "Toward a Feminist Theory of the State", year: 1989}
          - {author: Gerda Lerner, title: "The Creation of Patriarchy", year: 1986}
        traditions:
          defining: [feminism.radical]
          typical: [feminism.gender-critical, anarchism.feminist]
          contested: [feminism.materialist]
          rejects: [conservatism.traditionalist, liberalism.classical]
        presupposes: []
        excludes: [feminism.subordination.no-subordination-complementarity, feminism.subordination.evolved-preference]
        tension: [history.motor.class-struggle]
        tags: []
        analysis:
          gains: []
          pays: []
          mechanism: >
            Its program, laws against rape, pornography and prostitution, and women's shelters,
            redistributes protection and power between the sexes across classes, with no direct
            effect on property or the drain.
          drain: none
          law_of_value: regulates

      - id: feminism.subordination.private-property
        label: Private property and class society created women's subordination
        claim: >
          Women's subordination arose with private property and class society, when men gained
          control of surplus and needed heirs. It is maintained by capitalism and will end only with
          the abolition of private property in production and women's full entry into social labor.
        voiced: >
          The overthrow of mother-right was the world-historic defeat of the female sex. The
          emancipation of women becomes possible only when they take part in production on a large
          social scale and domestic work occupies a minor part of their time.
        you: >
          You think women's oppression began with private property and will end only with the end
          of class society.
        because: >
          Women's status varies with the economy: in societies without private surplus women held
          much more power. The bourgeois family exists to pass property to legitimate heirs, which
          requires controlling women's sexuality. Socialist states that brought women into paid
          work and public services transformed their position within a generation.
        against:
          - from: feminism.radical
            text: >
              Socialist revolutions socialized property and left men in charge of politburos and
              kitchens. Patriarchy survived the abolition of capitalism.
          - from: feminism.materialist
            text: >
              Engels' account looks for oppression only in the market and property, and misses the
              exploitation happening inside every working-class household.
        sources:
          - {author: Friedrich Engels, title: "The Origin of the Family, Private Property and the State", year: 1884}
          - {author: August Bebel, title: "Woman and Socialism", year: 1879}
          - {author: Claudia Jones, title: "An End to the Neglect of the Problems of the Negro Woman!", year: 1949}
        traditions:
          defining: [marxism.classical]
          typical: [marxism.leninism, marxism.ml, marxism.trotskyism, marxism.maoism]
          contested: [marxism.social-reproduction]
          rejects: [feminism.radical, conservatism.cst, feminism.liberal]
        presupposes: [history.motor.class-struggle]
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: [feminism.subordination.patriarchy]
        tags: []
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Bringing women into social production with public childcare and equal pay removes the
            discount employers get from women's lower wages and unpaid domestic work.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic

      - id: feminism.subordination.domestic-exploitation
        label: Husbands exploit wives' unpaid domestic labor
        claim: >
          Women are exploited in a domestic mode of production in which husbands appropriate wives'
          unpaid labor. This patriarchal exploitation is a material system of its own, alongside
          capitalism, and women form a class within it.
        voiced: >
          The main enemy of women is not capitalism alone; it is the patriarchal system of
          production in the home, where husbands appropriate women's labor for free. Housework is
          unpaid not because it is useless but because it is done for a husband.
        you: >
          You think men as husbands directly benefit from women's unpaid labor at home, and that
          this is a system of exploitation in its own right.
        because: >
          The same tasks, cooking, cleaning, caring, are paid when done for strangers and unpaid
          when done for a husband, so the difference is the relation, not the work. Divorce
          settlements and the poverty of separated mothers show who held the value of it. A
          materialist analysis must take this production seriously.
        against:
          - from: marxism.social-reproduction
            text: >
              Housework does not produce value for the husband; it reproduces labor power, which
              capital buys. The beneficiary is capital, not the man at the kitchen table.
          - from: feminism.black
            text: >
              For Black and immigrant women, much domestic work has been paid work in other women's
              homes. The single domestic mode does not capture that relation.
        sources:
          - {author: Christine Delphy, title: "The Main Enemy", year: 1970}
          - {author: Christine Delphy, title: "Close to Home: A Materialist Analysis of Women's Oppression", year: 1984}
        traditions:
          defining: [feminism.materialist]
          typical: [feminism.radical]
          contested: [marxism.social-reproduction]
          rejects: [marxism.classical, conservatism.cst]
        presupposes: []
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: [feminism.subordination.social-reproduction]
        tags: []
        analysis:
          gains: []
          pays: []
          mechanism: >
            Its demands, sharing or paying for domestic labor and claims on husbands' income in
            divorce, transfer resources between spouses within each class, with no direct effect
            on capital or the drain.
          drain: none
          law_of_value: none

      - id: feminism.subordination.social-reproduction
        label: Capitalism depends on women's unpaid work of reproducing workers
        claim: >
          Capitalism depends on the unpaid and underpaid work, mostly done by women, of producing
          and maintaining workers: birth, feeding, care, schooling. Women's oppression is rooted in
          this dependence, and class struggle and women's struggle are one.
        voiced: >
          Behind every worker who clocks in stands the work that made her ready: the meals, the
          laundry, the child she raised, the care for her when she is sick. Capital gets all of it
          for free and calls it love.
        you: >
          You think capitalism relies on women's unpaid care work to produce and look after
          workers, and that this is the root of women's oppression.
        because: >
          Labor power, the commodity capital buys, is produced outside the market, in homes, schools
          and hospitals. Capital needs that work done as cheaply as possible, so it pushes it onto
          families and women and cuts public services in every crisis. That explains why women's
          oppression persists after legal equality, and why care and wage struggles belong together.
        against:
          - from: feminism.radical
            text: >
              Reducing women's oppression to its function for capital cannot explain rape, which
              serves no accumulation, or women's subordination before capitalism.
          - from: liberalism.chicago
            text: >
              Household production is a rational division of labor within families, and the market
              now supplies most of it as services. There is no hidden subsidy.
        sources:
          - {author: Lise Vogel, title: "Marxism and the Oppression of Women: Toward a Unitary Theory", year: 1983}
          - {author: Tithi Bhattacharya, title: "Social Reproduction Theory: Remapping Class, Recentering Oppression", year: 2017}
          - {author: Silvia Federici, title: "Caliban and the Witch", year: 2004}
        traditions:
          defining: [marxism.social-reproduction]
          typical: [marxism.autonomism, marxism.trotskyism, marxism.ecosocialism, feminism.materialist]
          contested: [marxism.classical]
          rejects: [liberalism.chicago, feminism.liberal]
        presupposes: [capitalism.nature.exploitation-profit, wage.nature.price-of-labor-power]
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: [feminism.subordination.domestic-exploitation]
        tags: []
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Demands for public care, paid leave and higher wages in nursing, teaching and cleaning
            shift the cost of reproducing labor power from unpaid households back onto capital and
            the state.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic

      - id: feminism.subordination.interlocking
        label: Race, class and sex oppression interlock and cannot be separated
        claim: >
          Women's subordination cannot be explained by sex alone. Race, class, sex and sexuality
          form interlocking systems, and women at their intersections, Black, poor, colonized,
          face forms of oppression none of the single-issue theories capture.
        voiced: >
          If Black women were free, it would mean that everyone else would have to be free, since
          our freedom would necessitate the destruction of all the systems of oppression. We are
          not single-issue people; we do not live single-issue lives.
        you: >
          You think race, class and sex oppression work together, and that you cannot understand one
          without the others.
        because: >
          Courts in the United States refused Black women's discrimination claims because they were
          neither "race" claims nor "sex" claims. Black women worked outside the home long before
          white feminists demanded it, so the liberal script of escaping the home never fit.
          Starting from the most oppressed reveals the whole structure.
        against:
          - from: marxism.classical
            text: >
              Treating class as one oppression among several turns exploitation into an identity
              and leaves the system that produces all of them, capital, unnamed.
          - from: feminism.radical
            text: >
              Splitting women into ever finer groups dissolves the common oppression all women
              share as women.
        sources:
          - {author: Combahee River Collective, title: "A Black Feminist Statement", year: 1977}
          - {author: Kimberlé Crenshaw, title: "Demarginalizing the Intersection of Race and Sex", year: 1989}
          - {author: Angela Y. Davis, title: "Women, Race and Class", year: 1981}
          - {author: bell hooks, title: "Ain't I a Woman: Black Women and Feminism", year: 1981}
        traditions:
          defining: [feminism.black]
          typical: [marxism.black-radical, feminism.decolonial, liberalism.progressive]
          contested: [marxism.social-reproduction]
          rejects: [feminism.gender-critical, conservatism.traditionalist]
        presupposes: []
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: [feminism.subordination.patriarchy]
        tags: []
        analysis:
          gains: [reserve-army, core-workers, peripheral-workers]
          pays: [industrial-capital]
          mechanism: >
            Centering the women at the bottom of labor markets, domestic workers, care aides,
            directs demands toward the lowest-paid and most excluded jobs, raising wages where
            race and sex discounts are largest.
          drain: reduces
          law_of_value: regulates
          disputed: >
            The Combahee statement was explicitly socialist; later liberal uses of intersectionality
            as diversity management drop the class analysis, and Marxists dispute which use prevails.

      - id: feminism.subordination.colonial-and-imperial
        label: Imperialism and colonialism shape women's oppression in the periphery
        claim: >
          For most of the world's women, subordination is shaped by colonialism and imperialism:
          land seizure, export economies, debt and war. Western feminism's picture of the "Third
          World woman" as a passive victim of her own culture serves imperial power.
        voiced: >
          White men saving brown women from brown men has been the alibi of empire. Our women
          lost land to colonial titling, wages to structural adjustment, and sons to wars waged in
          our liberation's name.
        you: >
          You think the oppression of women in poor countries comes largely from colonialism and the
          world economy, not just from their own cultures.
        because: >
          Colonial land laws registered title to men; export agriculture turned women's subsistence
          work into unpaid labor on cash crops; structural adjustment cut the services women
          relied on. When feminism is invoked to justify wars and sanctions, as in Afghanistan in
          2001, it serves those who wage them.
        against:
          - from: feminism.liberal
            text: >
              Child marriage, honor killings and genital cutting are carried out by local men and
              defended by local authorities. Calling every criticism imperial silences the women
              resisting them.
          - from: feminism.islamic
            text: >
              Both empire and local patriarchy oppress; the answer is to reclaim our own tradition's
              justice, not to choose between the West and the patriarchs.
        sources:
          - {author: Chandra Talpade Mohanty, title: "Under Western Eyes: Feminist Scholarship and Colonial Discourses", year: 1984}
          - {author: Gayatri Chakravorty Spivak, title: "Can the Subaltern Speak?", year: 1988}
          - {author: Maria Mies, title: "Patriarchy and Accumulation on a World Scale", year: 1986}
        traditions:
          defining: [feminism.decolonial]
          typical: [marxism.third-worldism, marxism.black-radical, nationalism.decolonial, marxism.autonomism]
          contested: [feminism.liberal]
          rejects: [liberalism.internationalist, conservatism.neo]
        presupposes: [imperialism.nature.unequal-exchange-drain]
        excludes: []
        tension: []
        tags: [global-south]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Locating women's oppression in debt, export agriculture and war points at the
            creditors, agribusiness and arms sellers who profit from them, and at local elites who
            broker the arrangements.
          drain: breaks
          law_of_value: regulates

      - id: feminism.subordination.patriarchal-reading
        label: Patriarchal readings of scripture, not faith itself
        claim: >
          Women's subordination in Muslim societies comes from patriarchal interpretations of the
          Quran and tradition made by men, not from Islam itself. The text's principle of the equal
          worth of all believers supports gender justice when read faithfully.
        voiced: >
          The Quran does not oppress women; men who claimed sole authority to read it did. God made
          men and women from a single soul. We reclaim our right to interpret our own scripture.
        you: >
          You think women's oppression in religious societies comes from men's interpretations of
          scripture, not from the faith, and that reading it anew supports equality.
        because: >
          Classical jurisprudence was written almost entirely by men in patriarchal societies, and
          later authorities treated their rulings as divine. Close reading shows the text addresses
          women as full moral agents. Change rooted in the faith reaches believers whom secular
          feminism cannot.
        against:
          - from: religious.salafism-quietist
            text: >
              The rules on inheritance, testimony and male guardianship are explicit in the text and
              settled by consensus of the scholars. Reinterpretation to fit modern taste is
              innovation.
          - from: feminism.liberal
            text: >
              Fighting on the terrain of scripture concedes that rights depend on scripture. Women
              need equal civil law, whatever the clerics conclude.
        sources:
          - {author: Amina Wadud, title: "Qur'an and Woman", year: 1992}
          - {author: Fatima Mernissi, title: "The Veil and the Male Elite", year: 1987}
          - {author: Asma Barlas, title: "Believing Women in Islam: Unreading Patriarchal Interpretations of the Qur'an", year: 2002}
        traditions:
          defining: [feminism.islamic]
          typical: [religious.post-islamism]
          contested: [religious.islamism-brotherhood, feminism.decolonial]
          rejects: [religious.salafism-quietist, religious.salafi-jihadism]
        presupposes: []
        excludes: [feminism.subordination.no-subordination-complementarity]
        tension: []
        tags: [islam]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Reform of family law through religious argument gives women better terms in divorce,
            custody and inheritance, with gains concentrated among women able to use courts.
          drain: none
          law_of_value: none

      - id: feminism.subordination.erased-difference
        label: Women's difference is erased by a culture that takes man as the norm
        claim: >
          Women are subordinated not because they are kept from being like men but because a culture
          built on the male as the universal norm erases what is distinctly feminine, in language,
          ethics and desire. Liberation means a culture where sexual difference is valued.
        voiced: >
          Equality with men is not liberation; it is assimilation to a male standard. Woman has been
          defined as man's other, his lack. We need a culture of two sexes, where the feminine is not
          a deviation but a world of its own.
        you: >
          You think society treats men as the standard and erases what is different about women,
          and that equality should mean valuing that difference.
        because: >
          Moral psychology built on male subjects ranked women's ethics of care as immature.
          Workplaces built for bodies that do not bear children call pregnancy a problem.
          Demanding sameness leaves the male norm in place; valuing difference changes it.
        against:
          - from: feminism.liberal
            text: >
              "Feminine difference" is the same story patriarchy told: women as caring, intuitive,
              suited to the home. It hands opponents their argument.
          - from: feminism.materialist
            text: >
              The "feminine" is the product of oppression, not its victim. Valuing it values the
              marks of subordination.
        sources:
          - {author: Luce Irigaray, title: "This Sex Which Is Not One", year: 1977}
          - {author: Carol Gilligan, title: "In a Different Voice", year: 1982}
        traditions:
          defining: [feminism.difference]
          typical: []
          contested: [feminism.radical, feminism.islamic]
          rejects: [feminism.materialist, feminism.queer]
        presupposes: []
        excludes: [gender.basis.class-relation]
        tension: []
        tags: []
        analysis:
          gains: []
          pays: []
          mechanism: >
            Its demands, revaluing care and adapting work and institutions to women's bodies, have
            no direct effect on property; they can raise the standing of feminized work or justify
            keeping women in it.
          drain: none
          law_of_value: none

      - id: feminism.subordination.no-subordination-complementarity
        label: Not subordination but complementarity, ordered by God
        claim: >
          Men and women are equal in worth but different in calling. God ordained loving male
          headship in the home and church and the woman's role as helper and nurturer. Where this
          order is lived in love, there is no subordination, only complementary roles.
        voiced: >
          Both Adam and Eve were created in God's image, equal before God as persons. Distinctions
          in masculine and feminine roles are ordained by God as part of the created order. Husbands
          are to lead with humble, sacrificial love, as Christ loved the church.
        you: >
          You think men and women are equal in worth but called by God to different roles, with
          husbands leading in love.
        because: >
          Scripture teaches headship and submission within marriage alongside equal dignity, and
          the church's tradition has held it for two thousand years. Where roles are clear and
          husbands serve rather than dominate, families are stable and children flourish. Feminism
          treated difference as oppression and gave women double burdens.
        against:
          - from: feminism.liberal
            text: >
              "Equal but different" in roles that always give men authority is subordination by
              another name. Headship theology has been used to keep women in abusive marriages.
          - from: feminism.islamic
            text: >
              Every faith has a patriarchal reading of its scripture, and calling it "creation order"
              puts men's interpretations beyond question.
        sources:
          - {author: Council on Biblical Manhood and Womanhood, title: "The Danvers Statement", year: 1987}
          - {author: John Piper and Wayne Grudem, title: "Recovering Biblical Manhood and Womanhood", year: 1991}
        traditions:
          defining: [conservatism.evangelical-right]
          typical: [conservatism.cst, conservatism.traditionalist, religious.islamism-brotherhood, religious.salafism-quietist, religious.confucian]
          contested: [conservatism.christian-democracy]
          rejects: [feminism.liberal, feminism.radical, feminism.islamic, marxism.classical]
        presupposes: [gender.basis.created-order]
        excludes: [feminism.subordination.barriers-and-bias, feminism.subordination.patriarchy]
        tension: []
        tags: [religion]
        analysis:
          gains: [petty-bourgeoisie]
          pays: [reserve-army]
          mechanism: >
            Assigning women to the home as a calling keeps care work unpaid and leaves wives without
            independent income, which lowers the cost of reproducing labor and makes leaving a
            marriage costly.
          drain: none
          law_of_value: suspends

      - id: feminism.subordination.market-uprooted-women
        label: Industrial modernity, not men, uprooted women; feminism served the market
        claim: >
          What harmed women was industrial capitalism, which broke up the household economy, sent
          everyone to wage work and left women to choose between children and survival. Feminism
          that frees women into the labor market serves capital, not women.
        voiced: >
          Feminism promised liberation and delivered two paychecks to pay one mortgage. The market
          wanted women's labor and women's bodies, and liberal feminism handed them over. Women need
          protection, marriage and motherhood honored, not more freedom to be used.
        you: >
          You think modern capitalism, not men, made women's lives harder, and that feminism helped
          the market more than it helped women.
        because: >
          In the pre-industrial household men and women worked together and the woman's work was
          economic. Industry separated home and work, and second-wave feminism completed the
          process by turning women into workers and consumers. Women's reported happiness in rich
          countries has not risen with their liberation.
        against:
          - from: feminism.liberal
            text: >
              The household economy also gave husbands legal ownership of wives' property and
              bodies. Women did not leave it to serve capital but to escape it.
          - from: marxism.social-reproduction
            text: >
              The diagnosis of capital's pressure is right, but the cure is socialized care and
              shorter hours for everyone, not sending women back to depend on husbands.
        sources:
          - {author: Phyllis Schlafly, title: "The Power of the Positive Woman", year: 1977}
          - {author: Mary Harrington, title: "Feminism Against Progress", year: 2023}
          - {author: Christopher Lasch, title: "Women and the Common Life", year: 1997}
        traditions:
          defining: [conservatism.postliberal]
          typical: [conservatism.traditionalist, conservatism.distributism, conservatism.paleo]
          contested: [feminism.gender-critical]
          rejects: [feminism.liberal, liberalism.progressive]
        presupposes: []
        excludes: [feminism.subordination.barriers-and-bias]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie]
          pays: []
          mechanism: >
            It names capital's demand for women's labor correctly but proposes restoring the
            single-earner household, which few working families can afford and which makes women
            dependent on a husband's wage.
          drain: none
          law_of_value: regulates

      - id: feminism.subordination.evolved-preference
        label: Gaps reflect evolved differences and free choices, not subordination
        claim: >
          In rich societies with equal rights, remaining differences between men's and women's
          careers and incomes mostly reflect different average preferences, partly evolved, and
          choices about children. The word subordination no longer describes them.
        voiced: >
          Women are not oppressed by being free to choose. When given equal opportunity, many women
          choose more family time and different careers. That is liberty working, not patriarchy.
        you: >
          You think that where rights are equal, differences between men's and women's lives mostly
          reflect choices, not oppression.
        because: >
          The gender pay gap largely disappears when comparing similar jobs and hours; it grows with
          the arrival of children, as women choose more flexible work. Patriarchy theory cannot
          explain why women now outnumber men at university in most rich countries.
        against:
          - from: feminism.liberal
            text: >
              "Choices" are shaped by who is expected to cut hours when a child arrives. Countries
              with daddy quotas show those choices change with policy.
          - from: marxism.social-reproduction
            text: >
              The jobs women "choose" pay less because women do them; nursing and teaching are paid
              below jobs requiring similar skill.
        sources:
          - {author: Catherine Hakim, title: "Work-Lifestyle Choices in the 21st Century: Preference Theory", year: 2000}
          - {author: Steven Goldberg, title: "The Inevitability of Patriarchy", year: 1973}
          - {author: Susan Pinker, title: "The Sexual Paradox", year: 2008}
        traditions:
          defining: []
          typical: [liberalism.classical, libertarianism.objectivist, conservatism.fusionism, libertarianism.minarchist]
          contested: [liberalism.chicago]
          rejects: [feminism.radical, feminism.materialist, marxism.social-reproduction]
        presupposes: []
        excludes: [feminism.subordination.patriarchy]
        tension: []
        tags: []
        analysis:
          gains: [industrial-capital, finance-capital]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            Explaining gaps by choice removes the case for pay equity and public childcare, which
            keeps wages low in feminized sectors and leaves care costs with households.
          drain: none
          law_of_value: extends

  - id: sexuality.politics
    domain: culture
    layer: horizon
    question: What should law and society say about sexuality?
    plain: Should the law care who people love or have sex with?
    short: sexuality and the law
    importance: 2
    region: gender
    positions:
      - id: sexuality.politics.natural-law
        label: Sex belongs within marriage of man and woman; law should uphold it
        claim: >
          Sexual acts are rightly ordered to the union of a man and a woman in marriage and to new
          life. Law should define marriage as the union of a man and a woman and uphold public
          morality, while persons of every inclination are owed respect and charity.
        voiced: >
          Persons with homosexual inclinations must be accepted with respect, compassion and
          sensitivity. But homosexual acts are contrary to the natural law and cannot be approved,
          and marriage is by its nature the union of one man and one woman.
        you: >
          You think sex belongs within marriage between a man and a woman, and that the law should
          uphold that, while respecting everyone personally.
        because: >
          The sexual union of man and woman is the one bodily act that can make two people one
          flesh and create a new person. Marriage law exists because of that, not because adults
          love each other. A law that teaches otherwise reshapes how every child understands family.
        against:
          - from: liberalism.classical
            text: >
              Consenting adults harm no one by their private lives, and the state has no business
              enforcing a religious idea of sex on citizens who do not share it.
          - from: feminism.queer
            text: >
              "Respect for persons, condemnation of acts" has meant prosecution, conversion therapy,
              lost jobs and children taught they are disordered.
        sources:
          - {author: Catechism of the Catholic Church, title: "Catechism of the Catholic Church", year: 1992}
          - {author: John Finnis, title: "Law, Morality, and Sexual Orientation", year: 1994}
        traditions:
          defining: [conservatism.cst]
          typical: [conservatism.evangelical-right, conservatism.integralism, religious.islamism-brotherhood, religious.salafism-quietist, conservatism.traditionalist]
          contested: [conservatism.christian-democracy, conservatism.burkean]
          rejects: [liberalism.progressive, feminism.queer, liberalism.classical]
        presupposes: [gender.basis.created-order]
        excludes: [sexuality.politics.equal-rights, sexuality.politics.queer-liberation]
        tension: []
        tags: [religion]
        analysis:
          gains: []
          pays: []
          mechanism: >
            The position has no direct effect on property; its laws allocate legal recognition,
            inheritance and parental rights to married heterosexual couples and withhold them from
            others.
          drain: none
          law_of_value: none

      - id: sexuality.politics.equal-rights
        label: Equal rights and protection regardless of sexuality
        claim: >
          What consenting adults do is their own business. The law should decriminalize same-sex
          relations everywhere, recognize same-sex marriage and protect people from discrimination
          on grounds of sexual orientation.
        voiced: >
          Love is love. Equal rights, equal marriage, equal protection: no more and no less than
          anyone else has.
        you: >
          You think the law should treat everyone equally whatever their sexuality, including the
          right to marry.
        because: >
          The harm principle: private acts between consenting adults harm no one. Criminalization
          drove people into blackmail, prison and suicide. Equal marriage gives couples the legal
          security they need and costs no one else anything.
        against:
          - from: conservatism.cst
            text: >
              Redefining marriage is not adding new members to an institution but changing its
              meaning for everyone, and anti-discrimination laws then compel believers to affirm it.
          - from: feminism.queer
            text: >
              Equal rights means admission to marriage, the military and the market on straight
              terms. The poorest queer and trans people, homeless youth and sex workers, gain little.
        sources:
          - {author: John Stuart Mill, title: "On Liberty", year: 1859}
          - {author: Committee on Homosexual Offences and Prostitution, title: "Report of the Departmental Committee on Homosexual Offences and Prostitution (Wolfenden Report)", year: 1957}
        traditions:
          defining: [liberalism.progressive]
          typical: [liberalism.social, liberalism.classical, socdem.nordic, socdem.third-way, feminism.liberal]
          contested: [libertarianism.minarchist]
          rejects: [conservatism.cst, conservatism.evangelical-right, religious.islamism-brotherhood]
        presupposes: []
        excludes: [sexuality.politics.natural-law]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Equal legal status extends marriage benefits, inheritance and employment protection to
            sexual minorities, with greatest gain for those who own property or hold formal jobs.
          drain: none
          law_of_value: none

      - id: sexuality.politics.state-out
        label: The state should neither ban nor mandate; free association
        claim: >
          The state should neither punish private sexual conduct nor require anyone to approve of
          it. Adults should be free to live as they choose, and others free to refuse to associate
          or do business with them.
        voiced: >
          Get the government out of the bedroom and out of the bakery. Your sex life is yours; my
          conscience and my business are mine.
        you: >
          You think the government should neither restrict people's sex lives nor force anyone to
          approve of them.
        because: >
          Coercion in either direction violates individual rights. Sodomy laws and anti-
          discrimination laws both use force to impose one group's morality on another. Markets
          punish bigotry anyway, because discrimination costs customers and talent.
        against:
          - from: liberalism.progressive
            text: >
              "Free association" was the argument for whites-only lunch counters. In a small town
              with one employer and one landlord, refusal to deal is exclusion from life.
          - from: conservatism.cst
            text: >
              A state neutral about the family cannot sustain the institutions free society depends
              on; morality cannot be privatized.
        sources:
          - {author: Murray N. Rothbard, title: "For a New Liberty", year: 1973}
        traditions:
          defining: [libertarianism.minarchist]
          typical: [libertarianism.ancap, libertarianism.objectivist, commonsense.live-and-let-live]
          contested: [libertarianism.paleo, liberalism.classical]
          rejects: [liberalism.progressive, conservatism.cst]
        presupposes: []
        excludes: []
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie]
          pays: []
          mechanism: >
            Removing anti-discrimination law leaves sexual minorities' access to jobs, housing and
            services to employers' and landlords' discretion, which weighs most on those without
            their own means.
          drain: none
          law_of_value: extends

      - id: sexuality.politics.queer-liberation
        label: Against normalization; liberate sexuality from the norm
        claim: >
          The aim is not admission of gay couples into straight institutions but freedom from the
          norms that rank sexual lives, marriage at the top, sex work and non-monogamy at the
          bottom. Queer politics stands with all whose sexuality is policed.
        voiced: >
          We are not asking to be normal; normal is the problem. Queer means refusing the
          hierarchy that rewards the married and punishes the rest.
        you: >
          You think the goal is to stop ranking some sexual lives above others, not to fit gay people
          into marriage and respectability.
        because: >
          Marriage equality brought in couples who look respectable and left out those who do not:
          sex workers, trans people, the poor, people with HIV. Every norm creates an outside, and
          the outside is policed. Liberation means dismantling the norm.
        against:
          - from: liberalism.progressive
            text: >
              Most gay people want to marry, raise children and be left alone. Disdain for their
              choices is a minority's politics imposed on them.
          - from: marxism.ml
            text: >
              Cultural transgression has been absorbed by the market as lifestyle; it changes norms
              in the metropole and nothing for the workers who make rainbow merchandise.
        sources:
          - {author: Michael Warner, title: "The Trouble with Normal", year: 1999}
          - {author: Gayle Rubin, title: "Thinking Sex", year: 1984}
        traditions:
          defining: [feminism.queer]
          typical: [anarchism.feminist, anarchism.insurrectionary]
          contested: [liberalism.progressive]
          rejects: [conservatism.cst, conservatism.evangelical-right, feminism.gender-critical]
        presupposes: []
        excludes: [sexuality.politics.natural-law]
        tension: [sexuality.politics.equal-rights]
        tags: []
        analysis:
          gains: [reserve-army]
          pays: []
          mechanism: >
            Its demands, decriminalizing sex work and HIV status, protecting non-normative
            households, aim at the most excluded, but carry no program for property or wages.
          drain: none
          law_of_value: none

      - id: sexuality.politics.capitalism-and-liberation
        label: Sexual liberation is bound up with ending capitalism and its family
        claim: >
          Capitalism created the conditions for gay and lesbian identity by freeing people from the
          family economy, while upholding the family as the unit of reproduction. Full sexual
          liberation requires ending that contradiction through socialism.
        voiced: >
          Capitalism has created gay people and then it oppresses them. It frees us from the family
          farm and then demands the family as the unit of consumption and care. Gay liberation and
          workers' liberation are one fight.
        you: >
          You think the oppression of gay and trans people is tied to capitalism's need for the
          family, and that full liberation needs socialism.
        because: >
          Wage labor let individuals survive outside the family for the first time, which made gay
          lives possible in cities. Yet capital needs the family to raise workers at no cost, so it
          promotes the family ideal and scapegoats those outside it. The struggle against
          homophobia is therefore a struggle against the system that needs it.
        against:
          - from: liberalism.progressive
            text: >
              Socialist states persecuted gay people: the USSR recriminalized homosexuality in 1934
              and Cuba sent gay men to labor camps in the 1960s. Liberal capitalist democracies won
              equal marriage.
          - from: feminism.queer
            text: >
              Reducing sexuality to economics misses how norms work through culture, medicine and
              psychiatry independent of capital.
        sources:
          - {author: John D'Emilio, title: "Capitalism and Gay Identity", year: 1983}
          - {author: Guy Hocquenghem, title: "Homosexual Desire", year: 1972}
          - {author: Leslie Feinberg, title: "Transgender Warriors", year: 1996}
        traditions:
          defining: []
          typical: [marxism.trotskyism, marxism.social-reproduction, marxism.autonomism, anarchism.communist]
          contested: [marxism.ml, feminism.queer]
          rejects: [conservatism.cst, liberalism.chicago]
        presupposes: [capitalism.nature.exploitation-profit]
        excludes: [sexuality.politics.natural-law]
        tension: []
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital]
          mechanism: >
            Linking sexual liberation to public housing, healthcare and care services removes
            dependency on family support that forces queer and trans workers into poverty or into
            hiding.
          drain: none
          law_of_value: suspends

      - id: sexuality.politics.national-tradition
        label: Each nation defends its own sexual morality against Western imposition
        claim: >
          Sexual morality is part of each nation's culture and faith. The state should protect
          traditional family values, including by restricting the promotion of homosexuality to
          minors, and resist Western pressure to impose its sexual norms.
        voiced: >
          The West calls it human rights; we call it cultural imperialism. Our people's values,
          our faith and our families are not for sale for loans. We will protect our children.
        you: >
          You think each country should uphold its own traditional sexual morality and resist the
          West imposing its values.
        because: >
          Western governments and foundations tie aid and trade to adopting their sexual politics,
          treating other civilizations' morality as backwardness. Majorities in most of the world
          hold traditional views, and sovereignty includes the right to legislate them.
        against:
          - from: liberalism.progressive
            text: >
              Uganda's 2023 law prescribes death for "aggravated homosexuality". Sovereignty is no
              defense for killing or jailing a minority for who they love.
          - from: nationalism.decolonial
            text: >
              Many of these laws are colonial British sodomy laws. Defending them as national
              tradition defends the colonizer's morality.
        sources:
          - {author: Parliament of Uganda, title: "Anti-Homosexuality Act", year: 2023}
          - {author: National Assembly of Hungary, title: "Fundamental Law of Hungary", year: 2011}
        traditions:
          defining: [conservatism.national]
          typical: [nationalism.eurasianism, conservatism.right-populism, religious.islamism-khomeinist, religious.salafism-quietist, conservatism.evangelical-right]
          contested: [conservatism.cst]
          rejects: [liberalism.progressive, feminism.queer, liberalism.internationalist]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [sexuality.politics.equal-rights, sexuality.politics.queer-liberation]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie]
          pays: [reserve-army]
          mechanism: >
            Laws against sexual minorities provide governments a popular cause that costs property
            owners nothing and diverts attention from economic grievances, while exposing minorities
            to violence and loss of work.
          drain: none
          law_of_value: none

      - id: sexuality.politics.anti-imperial-critique
        label: "Universal LGBT identity is a Western export; oppose repression and imposition"
        claim: >
          The categories "gay" and "LGBT" are Western, and campaigns to universalize them impose
          one culture's sexual identities on others, often provoking the repression they claim to
          fight. Oppose both state persecution and imperial missionary politics.
        voiced: >
          The Gay International does not liberate; it produces the very identities it then defends,
          and in doing so gives states the pretext to persecute. Desire in our societies was
          organized differently, and its history is ours to write.
        you: >
          You think Western campaigns for gay rights abroad impose foreign categories and can make
          things worse, while still opposing persecution.
        because: >
          Same-sex desire existed across the Arab and Muslim world without the modern identity
          categories. Western advocacy campaigns forced it into those categories, and states
          answered with crackdowns. "Pinkwashing" uses gay rights to make wars and occupations look
          progressive.
        against:
          - from: liberalism.progressive
            text: >
              Gay and trans people in Kampala, Cairo and Moscow organize under these names
              themselves. Calling their identities imported repeats the state's own line.
          - from: conservatism.national
            text: >
              The critique of Western imposition is correct; but sexual traditions are not only to be
              "historicized", they are to be defended.
        sources:
          - {author: Joseph A. Massad, title: "Desiring Arabs", year: 2007}
          - {author: Jasbir K. Puar, title: "Terrorist Assemblages: Homonationalism in Queer Times", year: 2007}
        traditions:
          defining: [nationalism.decolonial]
          typical: [feminism.decolonial, marxism.third-worldism]
          contested: [feminism.queer]
          rejects: [liberalism.internationalist, conservatism.neo]
        presupposes: []
        excludes: []
        tension: [sexuality.politics.equal-rights]
        tags: [global-south]
        analysis:
          gains: []
          pays: []
          mechanism: >
            It contests the use of rights conditionality by core governments and foundations; it
            has no direct effect on property or wages.
          drain: none
          law_of_value: none

      - id: sexuality.politics.live-and-let-live
        label: What people do in private is their business, but keep it private
        claim: >
          What adults do in private is their own business, and they should be left alone. But it
          should stay private: no pushing it in schools or on children, and no making a show of it.
        voiced: >
          I don't care who anyone sleeps with. Just don't make it everybody's business, and leave
          the kids out of it.
        you: >
          You think people's private lives are their own business, but that sexuality should stay
          private and out of schools.
        because: >
          Tolerance means leaving people alone, not celebrating them. Most people want neither
          persecution nor constant campaigns. Parents, not schools or activists, should decide when
          and how children learn about sex.
        against:
          - from: liberalism.progressive
            text: >
              "Keep it private" applies only to gay people: a straight couple's wedding photo on a
              desk is never "making a show of it". It sends gay children the message to hide.
          - from: conservatism.cst
            text: >
              Indifference is not neutrality. A society that refuses to say what marriage is will have
              it defined by whoever is loudest.
        sources:
          - {author: John Stuart Mill, title: "On Liberty", year: 1859}
        traditions:
          defining: [commonsense.live-and-let-live]
          typical: [conservatism.fusionism, conservatism.burkean, libertarianism.paleo]
          contested: [liberalism.classical]
          rejects: [feminism.queer, conservatism.integralism]
        presupposes: []
        excludes: [sexuality.politics.queer-liberation]
        tension: [sexuality.politics.equal-rights]
        tags: [commonsense]
        analysis:
          gains: []
          pays: []
          mechanism: >
            The position has no direct class content; it tolerates private conduct while keeping
            public institutions, schools above all, under the norms of the majority.
          drain: none
          law_of_value: none
