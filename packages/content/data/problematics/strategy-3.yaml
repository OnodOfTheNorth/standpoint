problematics:
  # ------------------------------------------------------------------
  - id: fascism.nature
    domain: strategy
    layer: analysis
    question: What is fascism?
    plain: When people say "fascism", what are they actually talking about, and where does it come from?
    short: fascism
    importance: 3
    region: fascism
    positions:
      - id: fascism.nature.finance-capital-dictatorship
        label: "Dimitrov: the open terrorist dictatorship of finance capital"
        claim: Fascism is the open terrorist rule of the most reactionary, most chauvinist and most imperialist sections of finance capital, used when parliamentary rule can no longer hold the workers down.
        voiced: "Fascism in power is the open terrorist dictatorship of the most reactionary, most chauvinistic and most imperialist elements of finance capital."
        you: You see fascism as big finance and monopoly capital dropping parliamentary rule and ruling by open terror.
        because: >
          Whatever its slogans, fascism in power did the same things everywhere: it destroyed unions and workers'
          parties, raised profits, rearmed for conquest and handed contracts to the great banks and trusts that had
          financed it. Krupp, IG Farben and Thyssen prospered under Hitler; Fiat and Pirelli under Mussolini. The mass
          movement was the instrument, finance capital the master.
        against:
          - from: marxism.trotskyism
            text: >
              The formula misses the mass movement of the enraged petty bourgeoisie that fascism mobilizes. Treating it
              as a mere tool of bankers led the Comintern to call social democrats "social fascists" and fail to unite against it.
          - from: liberalism.classical
            text: >
              Nazism subordinated capitalists to the party and the war; it was not their tool. Reducing an ideology of race
              and nation to a business plot explains nothing about the Holocaust.
        sources:
          - {author: "Georgi Dimitrov", title: "The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism", year: 1935}
          - {author: "Franz Neumann", title: "Behemoth: The Structure and Practice of National Socialism", year: 1942}
          - {author: "R. Palme Dutt", title: "Fascism and Social Revolution", year: 1934}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.maoism, marxism.hoxhaism, marxism.juche, marxism.mlm, marxism.scc]
          contested: [marxism.gramscian, marxism.third-worldism]
          rejects: [marxism.trotskyism, liberalism.classical, liberalism.austrian]
        presupposes: [state.nature.class-instrument, imperialism.nature.monopoly-stage]
        excludes: [fascism.nature.totalitarian-twin, fascism.nature.a-form-of-socialism]
        tension: []
        tags: [comintern]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Naming finance capital as fascism's master directs antifascist struggle at the banks and monopolies that
            fund it, which threatens their political protection rather than only the street movement.
          drain: reduces
          law_of_value: none
          disputed: >
            Trotskyists, Gramscians and Poulantzas accept the class content but reject the reduction to an instrument;
            some historians (Turner) dispute how far big business funded the Nazis before 1933.
          consciousness: hegemonic

      - id: fascism.nature.petty-bourgeois-mass-movement
        label: "Trotsky: big capital's last resort, using the enraged petty bourgeoisie"
        claim: Fascism is a mass movement of ruined small owners and the desperate, which big capital turns to in a deep crisis to smash the organized working class.
        voiced: "Fascism is the mobilization of the petty bourgeoisie gone mad, hurled against the workers' organizations by finance capital in its hour of need."
        you: You see fascism as a mass movement of desperate small owners and the uprooted, which big business uses to crush workers' organizations.
        because: >
          Fascism's distinctive feature is not dictatorship, which capital has used many times, but a plebeian mass
          movement in the streets that can physically destroy unions and workers' parties. It recruits from shopkeepers,
          farmers, clerks and the unemployed ruined by crisis and abandoned by a workers' movement that offered no way out.
          Capital hands it power when ordinary police repression no longer suffices.
        against:
          - from: marxism.ml
            text: >
              Emphasizing the petty bourgeoisie obscures who holds fascist power: monopoly capital. The class character
              of the movement's base does not decide the class character of its state.
          - from: liberalism.social
            text: >
              Voting studies show the Nazis drew support from every class, including many workers. The petty-bourgeois
              thesis does not fit the evidence.
        sources:
          - {author: "Leon Trotsky", title: "What Next? Vital Questions for the German Proletariat", year: 1932}
          - {author: "Leon Trotsky", title: "Fascism: What It Is and How to Fight It", year: 1944}
          - {author: "Daniel Guérin", title: "Fascism and Big Business", year: 1936}
        traditions:
          defining: [marxism.trotskyism]
          typical: [marxism.third-camp, marxism.luxemburgism]
          contested: [marxism.left-communism]
          rejects: [marxism.ml, liberalism.social]
        presupposes: [state.nature.class-instrument]
        excludes: [fascism.nature.totalitarian-twin]
        tension: [fascism.nature.finance-capital-dictatorship]
        tags: [trotskyism]
        analysis:
          gains: [core-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Locating fascism's force in a mobilized middle class points the workers' movement toward a united front
            and a program that can win small owners away from it, contesting capital's mass reserve.
          drain: none
          law_of_value: none
          consciousness: class-economic

      - id: fascism.nature.crisis-of-hegemony
        label: "Gramsci: a resolution of a crisis of hegemony, a passive revolution"
        claim: Fascism arises when the ruling class loses its ability to lead by consent and no other class can lead either; it resolves the deadlock by force and by reorganizing society from above.
        voiced: "The crisis consists in the fact that the old is dying and the new cannot be born; in this interregnum a great variety of morbid symptoms appear."
        you: You see fascism as what happens when the old rulers can no longer win consent and nobody else can take over, so force fills the gap.
        because: >
          After 1918 Italy's liberal ruling class could no longer win consent, and the workers' movement could not take
          power. Fascism resolved the stalemate by a kind of Caesarism, a force standing above the deadlocked classes, and
          by a passive revolution that modernized the economy and incorporated the masses into corporative bodies without
          giving them power. The analysis explains both the use of force and fascism's capacity to build consent.
        against:
          - from: marxism.ml
            text: >
              Talk of equilibrium and autonomy blurs which class fascism served. Mussolini's state did not stand above
              classes; it froze wages and protected the industrialists.
          - from: liberalism.social
            text: >
              "Crisis of hegemony" is so elastic it fits any period of instability. It cannot say why Italy and Germany
              went fascist and Britain and Sweden did not.
        sources:
          - {author: "Antonio Gramsci", title: "Prison Notebooks", year: 1948, note: "written 1929-1935; on Caesarism and passive revolution"}
          - {author: "Nicos Poulantzas", title: "Fascism and Dictatorship", year: 1970}
          - {author: "August Thalheimer", title: "On Fascism", year: 1930}
        traditions:
          defining: [marxism.gramscian]
          typical: [marxism.structural, marxism.eurocommunism, marxism.western]
          contested: [marxism.trotskyism]
          rejects: [marxism.ml]
        presupposes: [state.nature.relative-autonomy]
        excludes: []
        tension: []
        tags: [gramsci]
        analysis:
          gains: [core-workers]
          pays: []
          mechanism: >
            Reading fascism as a crisis of consent directs the left to build its own hegemony in civil society before
            the crisis, so that the middle strata have another way out than force.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.nature.totalitarian-twin
        label: Fascism and communism as twin forms of totalitarian rule
        claim: Fascism is one form of totalitarianism, a modern type of rule it shares with communism, defined by a single party, an official ideology, terror and total control of society.
        voiced: "Hitler and Stalin: one party, one truth, the camp and the secret police. The colors differ; the system is the same."
        you: You see fascism and communism as two versions of the same thing, a single party trying to control every part of life.
        because: >
          Nazi Germany and the Stalinist USSR shared features no older tyranny had: a mass party fused with the state,
          an ideology claiming to explain history, a secret police, mass terror and camps, and the attempt to remake
          human beings. Both destroyed civil society and the individual. Arendt, Friedrich and Brzezinski showed the
          common structure; Hayek showed that central planning of the economy leads toward it.
        against:
          - from: marxism.ml
            text: >
              The concept was built in the Cold War to equate the power that defeated Nazism with Nazism. It ignores what
              each system did with property: one protected capital, the other abolished it.
          - from: marxism.black-radical
            text: >
              The model treats fascism as a European aberration, ignoring that its methods (camps, racial law, mass killing)
              were developed first in the colonies by liberal empires.
        sources:
          - {author: "Hannah Arendt", title: "The Origins of Totalitarianism", year: 1951}
          - {author: "Carl J. Friedrich and Zbigniew Brzezinski", title: "Totalitarian Dictatorship and Autocracy", year: 1956}
          - {author: "Friedrich Hayek", title: "The Road to Serfdom", year: 1944}
        traditions:
          defining: [liberalism.classical, conservatism.neo]
          typical: [liberalism.austrian, liberalism.internationalist, conservatism.christian-democracy, liberalism.social, marxism.third-camp]
          contested: [socdem.democratic-socialism]
          rejects: [marxism.ml, marxism.maoism, marxism.black-radical]
        presupposes: []
        excludes: [fascism.nature.finance-capital-dictatorship]
        tension: []
        tags: [cold-war]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            Joining fascism and communism in one category places liberal capitalism at the center as the only safe order,
            which delegitimizes socialist movements and justified Cold War interventions against them in the periphery.
          drain: sustains
          law_of_value: none
          disputed: >
            Third-camp Trotskyists and some anti-Stalinist Marxists accept parts of the comparison while rejecting its
            Cold War use; Losurdo and Marxist-Leninists reject the category.
          consciousness: hegemonic

      - id: fascism.nature.reaction-to-bolshevism
        label: "Nolte: a radical reaction to Bolshevism that copied its enemy"
        claim: Fascism was above all a reaction to the Bolshevik revolution, an anti-Marxism that copied the methods of its enemy in a European civil war from 1917 to 1945.
        voiced: "Fascism is anti-Marxism which seeks to destroy the enemy by evolving a radically opposed and yet related ideology and methods."
        you: You see fascism mainly as a frightened, violent reaction to communism that copied communist methods.
        because: >
          Fascism came into being after 1917 and nowhere before. Its leaders spoke constantly of the Bolshevik threat,
          and their followers had seen or feared red revolution in Russia, Hungary, Bavaria and Italy's factory
          occupations. Read in this way, fascism's mass terror was modeled on the terror it feared.
        against:
          - from: marxism.western
            text: >
              The thesis turns Auschwitz into a defensive copy of the Gulag and so relativizes Germany's crimes. That was
              its function in the Historikerstreit.
          - from: marxism.black-radical
            text: >
              Fascist race war had models older than 1917: the colonial wars and exterminations of the European empires.
        sources:
          - {author: "Ernst Nolte", title: "Three Faces of Fascism", year: 1963}
          - {author: "Ernst Nolte", title: "The European Civil War 1917-1945", year: 1987}
          - {author: "Jürgen Habermas", title: "A Kind of Settlement of Damages", year: 1986, note: "critique of Nolte that opened the Historikerstreit"}
        traditions:
          defining: []
          typical: [conservatism.paleo, conservatism.national]
          contested: [conservatism.burkean, conservatism.neo]
          rejects: [marxism.western, marxism.ml, marxism.black-radical, liberalism.social]
        presupposes: []
        excludes: [fascism.nature.colonialism-come-home]
        tension: []
        tags: [historikerstreit]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers]
          mechanism: >
            Making communism the first cause of fascism shifts responsibility from the property-owning classes and
            parties that brought fascists to power onto the workers' movement that frightened them.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.nature.palingenetic-ultranationalism
        label: "Griffin: palingenetic ultranationalism, a myth of national rebirth"
        claim: Fascism is a political ideology whose core is a myth of national rebirth, the belief that a decadent nation must be purged and reborn through a populist, revolutionary ultranationalism.
        voiced: "Fascism is a genus of political ideology whose mythic core is a palingenetic form of populist ultranationalism."
        you: You see fascism as an ideology built on the myth that a decaying nation must be purged and reborn.
        because: >
          Fascism must be understood from what its activists believed, not only from what it did for capital. What
          unites Mussolini, Hitler, the Iron Guard, the Falange and their successors is a mythic core: the nation has
          fallen into decadence and must be reborn through a new order and a new type of person. This definition sorts
          real fascists from ordinary authoritarian conservatives and lets scholars compare movements across time.
        against:
          - from: marxism.ml
            text: >
              An idealist definition by myth tells you what fascists dreamed, not whose interests they served. It cannot
              explain why industrialists funded them.
          - from: liberalism.classical
            text: >
              A definition by ideology alone misses fascism's practice: the one-party state and terror it shares with
              communist systems.
        sources:
          - {author: "Roger Griffin", title: "The Nature of Fascism", year: 1991}
          - {author: "George L. Mosse", title: "The Fascist Revolution", year: 1999}
        traditions:
          defining: []
          typical: [liberalism.social, liberalism.progressive]
          contested: [liberalism.classical]
          rejects: [marxism.ml, marxism.trotskyism]
        presupposes: [history.motor.ideas]
        excludes: []
        tension: []
        tags: [fascism-studies]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Defining fascism by its myth places the fight against it in ideas, education and vigilance, which leaves the
            economic conditions and propertied backers that brought fascists to power outside the definition.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.nature.paxton-process
        label: "Paxton: a process that wins power through a deal with conservative elites"
        claim: Fascism is best defined by what it does, a mass movement of national humiliation and rebirth that comes to power only through a deal with frightened conservative elites, and then radicalizes.
        voiced: "Fascism is a form of political behavior. Watch what it does, not what it says, and watch the conservatives who open the door."
        you: You see fascism as a movement that comes to power when frightened conservative establishments let it in, and then radicalizes.
        because: >
          Fascist programs were inconsistent and shifted constantly; their behavior was not. Fascism passes through
          stages: movement, rooting in a political system, the seizure of power, the exercise of power, and
          radicalization or entropy. Neither Mussolini nor Hitler took power alone; conservative elites invited them in to
          break the left. The decisive question is when established conservatives make that bargain.
        against:
          - from: marxism.ml
            text: >
              A stage model describes, but does not explain why elites needed fascism. That reason is the crisis of
              profitability and the threat from labor.
          - from: conservatism.burkean
            text: >
              The model blames conservatives for every fascism. Many conservatives resisted fascism, and many fascists
              came from the socialist left.
        sources:
          - {author: "Robert O. Paxton", title: "The Anatomy of Fascism", year: 2004}
          - {author: "Robert O. Paxton", title: "The Five Stages of Fascism", year: 1998}
        traditions:
          defining: []
          typical: [liberalism.social, liberalism.progressive, socdem.democratic-socialism]
          contested: [marxism.gramscian]
          rejects: [conservatism.paleo]
        presupposes: []
        excludes: []
        tension: []
        tags: [fascism-studies]
        analysis:
          gains: [core-workers, professional-managerial]
          pays: [landed-capital, industrial-capital]
          mechanism: >
            Focusing on the conservative elites who let fascists in directs pressure at the respectable parties and owners
            who might make that bargain, raising its political cost.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.nature.colonialism-come-home
        label: "Césaire: colonialism turned back on Europe"
        claim: Fascism is colonial rule turned back on Europe, the methods of conquest, racial hierarchy, forced labor and extermination, applied to Europeans.
        voiced: "What the very Christian bourgeois of the twentieth century cannot forgive Hitler is not the crime in itself, but that he applied to Europe colonialist procedures reserved until then for the Arabs, the coolies of India and the Negroes of Africa."
        you: You see fascism as the methods Europe used on its colonies, turned back on Europe itself.
        because: >
          Every element of Nazism had a colonial precedent: racial law, the concentration camp (South Africa, Namibia),
          genocide (the Herero and Nama), the doctrine of living space, the treatment of whole peoples as subhuman. Europe
          tolerated these for centuries as long as the victims were not white. Nazism was not a break with Western
          civilization; it was its colonial underside coming home.
        against:
          - from: liberalism.classical
            text: >
              Colonialism was brutal, but the industrial extermination of the Jews of Europe was unprecedented in aim and
              method. Folding it into colonialism blurs what was distinctive.
          - from: marxism.trotskyism
            text: >
              The colonial parallel is real, but fascism arose from a specific crisis of capital in the core and its
              mass base there, which the boomerang image does not explain.
        sources:
          - {author: "Aimé Césaire", title: "Discourse on Colonialism", year: 1950}
          - {author: "W. E. B. Du Bois", title: "The World and Africa", year: 1947}
          - {author: "George Jackson", title: "Blood in My Eye", year: 1972}
          - {author: "Hannah Arendt", title: "The Origins of Totalitarianism", year: 1951, note: "part two, on imperialism's 'boomerang effect'"}
        traditions:
          defining: [marxism.black-radical]
          typical: [nationalism.pan-africanism, nationalism.decolonial, marxism.third-worldism, nationalism.black-nationalism, feminism.decolonial]
          contested: [marxism.ml]
          rejects: [conservatism.neo, liberalism.internationalist]
        presupposes: [imperialism.nature.monopoly-stage]
        excludes: [fascism.nature.reaction-to-bolshevism]
        tension: [fascism.nature.totalitarian-twin]
        tags: [colonialism]
        analysis:
          gains: [peripheral-workers, peasantry, reserve-army]
          pays: [finance-capital]
          mechanism: >
            Locating fascism's origin in colonial rule makes the defense of liberal empire itself suspect and links
            antifascism in the core to anti-imperialist struggle in the periphery.
          drain: reduces
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.nature.a-form-of-socialism
        label: Fascism was a form of socialism, a creature of the left
        claim: Fascism belongs on the left; it was national socialism, a collectivist movement that grew out of socialism and shared its hostility to free markets and the individual.
        voiced: "The clue is in the name: National Socialist German Workers' Party. Mussolini was a socialist editor. Fascism is collectivism with a flag."
        you: You see fascism as a kind of socialism, a collectivist movement of the left rather than the right.
        because: >
          Mussolini led the Italian Socialist Party's left wing before founding fascism. The Nazis called themselves
          socialists, controlled prices, wages and investment, and despised liberal capitalism. Both fascism and socialism
          subordinate the individual to a collective and the economy to the state. The left's claim that fascism is
          "far right" is a convenient myth.
        against:
          - from: marxism.ml
            text: >
              The Nazis killed the socialists and communists first, abolished independent unions, privatized state
              firms and made industrialists richer. Names are not programs.
          - from: liberalism.social
            text: >
              Historians of every school place fascism on the right: it allied with conservatives, defended property and
              hierarchy, and was founded on hostility to egalitarianism.
        sources:
          - {author: "Ludwig von Mises", title: "Omnipotent Government", year: 1944}
          - {author: "Friedrich Hayek", title: "The Road to Serfdom", year: 1944}
          - {author: "Jonah Goldberg", title: "Liberal Fascism", year: 2008}
        traditions:
          defining: [liberalism.austrian]
          typical: [conservatism.fusionism, libertarianism.minarchist, libertarianism.ancap, libertarianism.objectivist, conservatism.right-populism]
          contested: [libertarianism.paleo]
          rejects: [marxism.ml, liberalism.social, marxism.trotskyism]
        presupposes: [capitalism.nature.free-exchange]
        excludes: [fascism.nature.finance-capital-dictatorship]
        tension: []
        tags: [right]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers]
          mechanism: >
            Placing fascism on the left associates any state economic control and labor collectivism with fascist
            terror, which serves campaigns against unions, public ownership and regulation.
          drain: sustains
          law_of_value: extends
          consciousness: hegemonic

      - id: fascism.nature.national-rebirth-self-view
        label: "Fascism's own account: the spiritual rebirth of the nation"
        claim: In its own terms, fascism is the spiritual and political rebirth of the nation as an organic whole, a state above classes that ends liberal decadence and Marxist class war.
        voiced: "For the fascist, everything is in the state, and nothing human or spiritual exists, much less has value, outside the state."
        you: You see fascism as its own followers saw it, a rebirth of the nation as one body, above class conflict and liberal individualism.
        because: >
          In its own account, fascism answers the decadence of a materialist age: liberalism reduces the people to
          competing individuals, Marxism to warring classes. Fascism claims to restore the nation as a living whole, with
          labor and capital disciplined in corporations under a strong state, and individuals finding meaning in
          sacrifice to something greater. Its record in power includes wars of conquest, racial laws, camps and genocide.
        against:
          - from: liberalism.classical
            text: >
              A state that claims everything human leaves the person nothing. The result was the destruction of all rights,
              aggressive war and mass murder.
          - from: marxism.ml
            text: >
              The "state above classes" was a state for the owners. The corporations disciplined labor and left capital
              in command.
        sources:
          - {author: "Benito Mussolini and Giovanni Gentile", title: "The Doctrine of Fascism", year: 1932}
          - {author: "Giovanni Gentile", title: "Origins and Doctrine of Fascism", year: 1929}
          - {author: "Zeev Sternhell", title: "The Birth of Fascist Ideology", year: 1989}
        traditions:
          defining: [fascism.italian, fascism.national-syndicalism]
          typical: [fascism.nazism, fascism.third-position, fascism.clerical, fascism.identitarian]
          contested: [fascism.traditionalist]
          rejects: [liberalism.classical, marxism.ml, anarchism.communist, conservatism.burkean]
        presupposes: [state.nature.organic-nation]
        excludes: [fascism.nature.finance-capital-dictatorship, fascism.nature.totalitarian-twin]
        tension: []
        tags: [fascism]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie]
          pays: [core-workers, reserve-army, peripheral-workers]
          mechanism: >
            The organic-nation doctrine justified abolishing independent unions and strikes and placing labor under
            corporations led by employers and the party, while conquest supplied land and forced labor abroad.
          drain: sustains
          law_of_value: regulates
          consciousness: hegemonic

      - id: fascism.nature.empty-insult
        label: '"Fascist" has become an insult for anyone you dislike'
        claim: The word "fascism" has lost any fixed meaning and is now mostly used as an insult for opponents.
        voiced: "Everyone I disagree with gets called a fascist these days. The word means nothing anymore."
        you: You think "fascist" has become mostly an insult people throw at those they disagree with.
        because: >
          Already in 1944 Orwell noted that the word was applied to farmers, shopkeepers, Catholics and the war itself.
          Today it is used of almost every politician someone dislikes. Overuse cheapens the memory of real fascism and
          shuts down argument, because no one negotiates with a fascist.
        against:
          - from: marxism.trotskyism
            text: >
              The word has a precise meaning: a mass movement that physically destroys workers' organizations. That it
              is misused does not mean it can never apply.
          - from: liberalism.social
            text: >
              Defenders of every rising fascism said the warnings were hysteria. The cost of noticing too late is much
              higher than the cost of a loose word.
        sources:
          - {author: "George Orwell", title: "What is Fascism?", year: 1944}
          - {author: "Paul Gottfried", title: "Fascism: The Career of a Concept", year: 2016}
        traditions:
          defining: []
          typical: [conservatism.right-populism, conservatism.paleo, commonsense.anti-politics, commonsense.live-and-let-live]
          contested: [liberalism.classical]
          rejects: [marxism.trotskyism, marxism.black-radical]
        presupposes: []
        excludes: []
        tension: []
        tags: [common-sense]
        analysis:
          gains: []
          pays: []
          mechanism: >
            Treating the word as empty lowers vigilance toward movements that do threaten unions, minorities and
            migrants; it also guards against using the charge to silence ordinary opposition, so its effect depends on context.
          drain: none
          law_of_value: none
          consciousness: economic-corporate

  # ------------------------------------------------------------------
  - id: fascism.response
    domain: strategy
    layer: strategy
    question: How should fascism be fought?
    plain: If a fascist movement is growing, what do you do about it?
    short: fighting fascism
    importance: 2
    region: fascism
    positions:
      - id: fascism.response.workers-united-front
        label: A united front of workers' organizations with self-defense
        claim: Fascism is defeated by a united front of all workers' organizations, unions and parties, defending themselves physically and offering a way out of the crisis.
        voiced: "Workers' united front, workers' defense guards. Fascism must be crushed in the egg, by the class it was sent to crush."
        you: You think fascism is beaten by all workers' organizations uniting and defending themselves.
        because: >
          Fascism is a fighting force aimed at workers' organizations, so only their united physical and political
          resistance can stop it. The liberal state will not, and police and army are often sympathetic to the fascists.
          A front that acts together while keeping its program also shows ruined middle classes that the workers can
          lead out of the crisis.
        against:
          - from: marxism.ml
            text: >
              A workers-only front leaves the middle classes and the liberal republic to the fascists. Broader unity is
              needed against the main danger.
          - from: liberalism.social
            text: >
              Workers' militias in the street mirror the fascist ones and give the state an excuse to crack down on
              everyone.
        sources:
          - {author: "Leon Trotsky", title: "For a Workers' United Front Against Fascism", year: 1931}
          - {author: "Leon Trotsky", title: "What Next? Vital Questions for the German Proletariat", year: 1932}
        traditions:
          defining: [marxism.trotskyism]
          typical: [marxism.third-camp, marxism.luxemburgism, anarchism.syndicalist]
          contested: [marxism.leninism]
          rejects: [marxism.ml, liberalism.social]
        presupposes: [fascism.nature.petty-bourgeois-mass-movement]
        excludes: [fascism.response.popular-front]
        tension: []
        tags: [antifascism]
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            United workers' defense removes fascism's main function for capital, breaking workers' organizations,
            and keeps the antifascist alliance free of employers' parties.
          drain: none
          law_of_value: regulates
          consciousness: class-economic

      - id: fascism.response.popular-front
        label: A popular front of all who defend the republic
        claim: Fascism is defeated by the broadest possible alliance of workers' parties, liberals and the middle classes, defending constitutional government together.
        voiced: "Against fascism, everyone who loves the republic belongs in one front. Divisions now are a gift to the enemy."
        you: You think fascism is beaten by the broadest possible alliance of everyone who defends constitutional government.
        because: >
          Fascism wins by isolating the left and winning the center. A popular front denies it the middle classes,
          defends the institutions it seeks to destroy, and wins elections. The wartime alliance of the Soviet Union,
          Britain and the United States, and the Resistance movements that united communists, socialists, Christians and
          liberals, defeated fascism in Europe.
        against:
          - from: marxism.trotskyism
            text: >
              The front ties workers to the liberal parties that will betray them. In Spain the Popular Front held back
              the revolution to reassure them and lost.
          - from: anarchism.communist
            text: >
              Defending the republic means defending the state that pays the police who protect the fascists.
        sources:
          - {author: "Georgi Dimitrov", title: "The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism", year: 1935}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.eurocommunism, socdem.democratic-socialism, liberalism.social, conservatism.christian-democracy]
          contested: [marxism.maoism]
          rejects: [marxism.trotskyism, anarchism.communist, marxism.left-communism]
        presupposes: []
        excludes: [fascism.response.workers-united-front]
        tension: []
        tags: [antifascism]
        analysis:
          gains: [core-workers, petty-bourgeoisie, professional-managerial]
          pays: []
          mechanism: >
            A broad front isolates fascists electorally and socially but sets its program at what liberal partners
            accept, so the economic conditions that fed fascism usually remain.
          drain: sustains
          law_of_value: regulates
          consciousness: hegemonic

      - id: fascism.response.confront-in-the-street
        label: Confront them directly; deny them the streets
        claim: Fascist groups must be confronted directly, by disrupting their meetings, denying them platforms and physically blocking their marches, before they grow.
        voiced: "No platform, no pasarán. You don't debate fascists; you stop them organizing."
        you: You think fascist groups must be physically confronted and denied any platform before they grow.
        because: >
          Fascism grows by showing strength in the street and by recruiting from public events. Every meeting stopped
          and every march blocked denies it that. Cable Street in 1936, the anti-fascist groups of postwar Britain and
          contemporary antifa kept fascist movements marginal where they were active. Waiting for the state means waiting
          until it is too late.
        against:
          - from: liberalism.classical
            text: >
              Silencing speakers by force makes martyrs of them and hands the state a precedent it will use against the
              left. The answer to bad speech is more speech.
          - from: marxism.trotskyism
            text: >
              Small-group confrontations without a mass base turn into gang fights. Only the organized working class can
              defeat a mass fascist movement.
        sources:
          - {author: "Mark Bray", title: "Antifa: The Anti-Fascist Handbook", year: 2017}
          - {author: "Daniel Sonabend", title: "We Fight Fascists: The 43 Group and Their Forgotten Battle for Post-war Britain", year: 2019}
        traditions:
          defining: [anarchism.communist, anarchism.insurrectionary]
          typical: [marxism.autonomism, anarchism.syndicalist, marxism.trotskyism, marxism.black-radical]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.classical, libertarianism.minarchist, conservatism.burkean]
        presupposes: []
        excludes: [fascism.response.answer-with-speech]
        tension: []
        tags: [antifascism]
        analysis:
          gains: [reserve-army, core-workers]
          pays: []
          mechanism: >
            Physically denying fascists public space raises the cost of joining them and protects migrants and minorities
            who are their first targets; it does not touch the conditions or funders behind them.
          drain: none
          law_of_value: none
          consciousness: economic-corporate

      - id: fascism.response.militant-democracy
        label: Ban them through constitutional "militant democracy"
        claim: A liberal state should defend itself by law, banning parties and organizations that aim to abolish constitutional order, before they can use elections to do it.
        voiced: "Democracy must not be tolerant of those who use its freedoms to destroy it. Fire is fought with fire."
        you: You think the state should use the law to ban parties that aim to destroy constitutional government.
        because: >
          Fascists in the 1930s used elections, parliamentary immunity and free assembly to destroy the constitutions
          that protected them. A constitution that cannot defend itself is a suicide pact. Postwar Germany's Basic Law
          bans anti-constitutional parties, and it has not slid back into dictatorship.
        against:
          - from: liberalism.classical
            text: >
              Whoever decides which parties are anti-constitutional holds a dangerous power. Germany banned the
              Communist Party in 1956 under the same law.
          - from: conservatism.right-populism
            text: >
              "Militant democracy" lets the establishment ban its competition and call it defending democracy.
        sources:
          - {author: "Karl Loewenstein", title: "Militant Democracy and Fundamental Rights", year: 1937}
          - {author: "Jan-Werner Müller", title: "Protecting Popular Self-Government from the People? New Normative Perspectives on Militant Democracy", year: 2016}
        traditions:
          defining: [conservatism.christian-democracy, liberalism.social]
          typical: [liberalism.internationalist, liberalism.technocratic, liberalism.progressive, socdem.third-way]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.classical, libertarianism.minarchist, conservatism.right-populism]
        presupposes: [state.nature.neutral-arbiter]
        excludes: []
        tension: []
        tags: [antifascism, law]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Legal bans hand courts and security services the power to define the constitutional order's enemies; in
            practice that power has been used against both the far right and the communist left.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.response.answer-with-speech
        label: Debate them in the open; banning backfires
        claim: Fascist ideas should be met with argument and exposure, never with bans or force, because suppression gives them martyrdom and sets precedents against everyone.
        voiced: "If there be time to expose through discussion the falsehood and fallacies, the remedy to be applied is more speech, not enforced silence."
        you: You think fascist ideas should be beaten in open argument, not banned or shut down by force.
        because: >
          Bans and violence let fascists pose as persecuted truth-tellers and drive them underground where they cannot
          be answered. The powers created to silence them will be used against others; free speech protects the
          dissident left as much as anyone. Open debate exposes how thin fascist ideas are.
        against:
          - from: anarchism.communist
            text: >
              Fascists do not seek debate; they use the platform to recruit and the street to attack. Nobody argued
              Hitler out of power.
          - from: marxism.black-radical
            text: >
              Those who will be targeted first are not the ones being asked to tolerate the debate.
        sources:
          - {author: "John Stuart Mill", title: "On Liberty", year: 1859}
          - {author: "Louis Brandeis", title: "Concurring opinion, Whitney v. California", year: 1927}
          - {author: "Nadine Strossen", title: "Hate: Why We Should Resist It with Free Speech, Not Censorship", year: 2018}
        traditions:
          defining: [liberalism.classical]
          typical: [libertarianism.minarchist, libertarianism.ancap, libertarianism.objectivist, technology.cyberlibertarian]
          contested: [liberalism.social]
          rejects: [anarchism.communist, marxism.ml, conservatism.christian-democracy]
        presupposes: []
        excludes: [fascism.response.confront-in-the-street]
        tension: []
        tags: [speech]
        analysis:
          gains: []
          pays: [reserve-army]
          mechanism: >
            Leaving fascist organizing to the marketplace of ideas lets movements with funded media and street presence
            grow, while minorities and migrants bear the risks of that growth.
          drain: none
          law_of_value: none
          consciousness: economic-corporate

      - id: fascism.response.remove-the-conditions
        label: Remove the conditions that feed it
        claim: Fascism is defeated by removing the insecurity it feeds on, with jobs, housing, secure incomes and a credible alternative to the failing order.
        voiced: "Fascism grows in the soil of unemployment and humiliation. Give people security and a future, and it withers."
        you: You think fascism is beaten by fixing the insecurity and despair it feeds on.
        because: >
          Fascist movements grew where markets collapsed, savings vanished and the established parties offered nothing.
          They gained least where workers had security and a credible left offered a way forward: the New Deal, Swedish
          social democracy in the 1930s. Bans and street fights treat symptoms; economic security removes the cause.
        against:
          - from: anarchism.communist
            text: >
              While you build a welfare program, they are beating migrants in the street. Long-term policy does not stop
              a movement that is organizing now.
          - from: conservatism.right-populism
            text: >
              The people you call fascist are often ordinary citizens with legitimate grievances about immigration and
              culture that no welfare program addresses.
        sources:
          - {author: "Karl Polanyi", title: "The Great Transformation", year: 1944}
          - {author: "Sheri Berman", title: "The Primacy of Politics: Social Democracy and the Making of Europe's Twentieth Century", year: 2006}
        traditions:
          defining: [socdem.keynesian, socdem.democratic-socialism]
          typical: [socdem.nordic, socdem.left-populism, liberalism.social, socdem.labourism]
          contested: [marxism.trotskyism]
          rejects: [libertarianism.minarchist, liberalism.austrian]
        presupposes: []
        excludes: []
        tension: []
        tags: [antifascism, welfare]
        analysis:
          gains: [core-workers, reserve-army, petty-bourgeoisie]
          pays: [finance-capital]
          mechanism: >
            Public employment, housing and income security reduce the insecurity among small owners and workers that
            fascists recruit from, funded by taxing capital and finance.
          drain: softens
          law_of_value: regulates
          disputed: >
            The frame holds that core welfare concessions were funded partly by the drain; social democrats attribute
            them to domestic class compromise.
          consciousness: class-economic

      - id: fascism.response.fight-empire-at-the-root
        label: Fight it at the root, in empire and its domestic outposts
        claim: Fascism is fought by fighting imperialism and its racial order at home and abroad, including the police, prisons and borders that already treat some people as colonies.
        voiced: "Fascism is not coming; for some of us it is already here, in the prisons, the borders, the occupied neighborhoods. Fight empire and you fight fascism."
        you: You think fascism is fought by fighting empire and racial rule, abroad and in the police, prisons and borders at home.
        because: >
          Fascism is colonialism turned inward, so it is not stopped by defending the imperial order that produced it.
          Its methods already operate on racialized populations, at borders, in prisons, in occupied territories. An
          antifascism that defends liberal empire against its fascist wing leaves the source intact. Solidarity with
          national liberation abroad and with communities under policing at home is antifascism in practice.
        against:
          - from: liberalism.social
            text: >
              Calling all policing and border control fascism devalues the word and makes it harder to recognize and stop
              a real fascist party when it rises.
          - from: marxism.trotskyism
            text: >
              Anti-imperialism is essential, but fascism in the core is a specific mass movement that needs a specific
              response from the organized working class.
        sources:
          - {author: "Aimé Césaire", title: "Discourse on Colonialism", year: 1950}
          - {author: "George Jackson", title: "Blood in My Eye", year: 1972}
          - {author: "Walter Rodney", title: "How Europe Underdeveloped Africa", year: 1972}
        traditions:
          defining: [marxism.black-radical]
          typical: [marxism.third-worldism, nationalism.decolonial, nationalism.pan-africanism, marxism.mlm]
          contested: [marxism.ml]
          rejects: [liberalism.social, liberalism.internationalist]
        presupposes: [fascism.nature.colonialism-come-home]
        excludes: []
        tension: [fascism.response.militant-democracy]
        tags: [anti-imperialism]
        analysis:
          gains: [peripheral-workers, reserve-army, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Joining antifascism to anti-imperialism targets the military, financial and carceral apparatus that enforces
            the drain abroad and polices the racialized reserve army at home.
          drain: reduces
          law_of_value: none
          consciousness: hegemonic

      - id: fascism.response.threat-overblown
        label: The threat is overblown; "antifascism" targets ordinary conservatives
        claim: There is no serious fascist threat today; the charge is used by the left and establishment to delegitimize conservative and populist voters.
        voiced: "Every right-winger is a fascist now. 'Antifascism' is how they shut down half the country."
        you: You think the fascist threat today is exaggerated and the label is used to silence conservatives.
        because: >
          Historical fascism needed mass paramilitaries, a cult of violence and a program of conquest; nothing comparable
          exists in Western politics. Labeling populist and conservative voters fascist insults millions of ordinary
          people, justifies censorship and violence against them, and lets the establishment avoid their grievances.
        against:
          - from: liberalism.social
            text: >
              Fascism never announces itself in its full form. Movements that attack courts, the press and minorities
              deserve to be watched before they acquire militias.
          - from: marxism.trotskyism
            text: >
              The people denying the threat are often those whom fascism would serve. Denial is part of how it grows.
        sources:
          - {author: "Paul Gottfried", title: "Fascism: The Career of a Concept", year: 2016}
          - {author: "Paul Gottfried", title: "Antifascism: The Course of a Crusade", year: 2021}
        traditions:
          defining: [conservatism.paleo]
          typical: [conservatism.right-populism, conservatism.national, libertarianism.paleo, fascism.identitarian]
          contested: [conservatism.fusionism]
          rejects: [marxism.trotskyism, anarchism.communist, liberalism.social, marxism.black-radical]
        presupposes: []
        excludes: [fascism.response.confront-in-the-street]
        tension: []
        tags: [right]
        analysis:
          gains: [petty-bourgeoisie, industrial-capital]
          pays: [reserve-army]
          mechanism: >
            Dismissing the threat protects right-wing movements from scrutiny and shields their funders, while migrants
            and minorities face the consequences of any growth the denial permits.
          drain: sustains
          law_of_value: none
          consciousness: hegemonic

  # ------------------------------------------------------------------
  - id: internationalism
    domain: strategy
    layer: strategy
    question: Can change succeed in one country, or only worldwide?
    plain: Can one country go its own way, or does change have to happen everywhere at once?
    short: change in one country or worldwide
    importance: 2
    region: strategy
    positions:
      - id: internationalism.socialism-in-one-country
        label: Socialism can be built in one country
        claim: A single country can build a socialist society by its own efforts, even surrounded by capitalist powers, if it develops its industry and defends itself.
        voiced: "We can and must build socialism in our country. To wait for the world revolution is to surrender."
        you: You think one country can build socialism by its own efforts, even surrounded by hostile powers.
        because: >
          The revolution in the West did not come. A workers' state cannot wait passively; it must industrialize,
          collectivize and arm to survive. The USSR did, and its industry defeated Nazi Germany. China, Vietnam and Cuba
          each built socialism under blockade, and their survival strengthened the world movement more than any
          appeal to world revolution.
        against:
          - from: marxism.trotskyism
            text: >
              The world economy is a single system. A workers' state isolated in it is forced into autarky and a
              bureaucracy, and the Comintern was turned from a tool of revolution into an instrument of Soviet diplomacy.
          - from: liberalism.internationalist
            text: >
              Autarkic socialism produced chronic shortages and fell behind the open economies. Prosperity comes from
              integration, not isolation.
        sources:
          - {author: "J. V. Stalin", title: "Concerning Questions of Leninism", year: 1926}
          - {author: "Nikolai Bukharin", title: "The Path to Socialism and the Worker-Peasant Alliance", year: 1925}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.scc, marxism.juche, marxism.hoxhaism, marxism.maoism]
          contested: [marxism.mlm]
          rejects: [marxism.trotskyism, marxism.left-communism, marxism.council-communism, liberalism.internationalist]
        presupposes: []
        excludes: [internationalism.permanent-revolution]
        tension: []
        tags: [socialism-in-one-country]
        analysis:
          gains: [core-workers, peasantry, peripheral-workers]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            A socialist state that controls trade, credit and investment withdraws its economy from the world law of
            value and keeps its surplus at home, at the cost of isolation and of the internal discipline siege requires.
          drain: breaks
          law_of_value: suspends
          consciousness: hegemonic

      - id: internationalism.permanent-revolution
        label: Permanent revolution; it must spread or die
        claim: A revolution in one country can only survive by spreading internationally; in poor countries the workers must carry the national revolution straight on to socialism.
        voiced: "The socialist revolution begins on the national arena, unfolds on the international, and is completed on the world arena."
        you: You think a revolution in one country must spread internationally or it will degenerate.
        because: >
          Capitalism is a world system, and the productive forces have outgrown national borders. An isolated workers'
          state is strangled or degenerates, as the USSR did under its bureaucracy. In backward countries the national
          bourgeoisie is too weak and too tied to imperialism to carry out its own revolution, so the workers must lead,
          and they cannot stop at democratic tasks.
        against:
          - from: marxism.ml
            text: >
              Waiting for world revolution means surrendering the revolution you have. Trotskyism has never led a
              successful revolution anywhere.
          - from: marxism.maoism
            text: >
              Permanent revolution skips the alliance with the peasantry and the national bourgeoisie that every
              victorious anti-imperialist revolution needed.
        sources:
          - {author: "Leon Trotsky", title: "The Permanent Revolution", year: 1930}
          - {author: "Leon Trotsky", title: "Results and Prospects", year: 1906}
        traditions:
          defining: [marxism.trotskyism]
          typical: [marxism.third-camp]
          contested: [marxism.luxemburgism, marxism.left-communism]
          rejects: [marxism.ml, marxism.maoism, marxism.scc]
        presupposes: [change.agent.workers-as-class]
        excludes: [internationalism.socialism-in-one-country]
        tension: [alliances.policy.national-front]
        tags: [trotskyism]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Insisting on international extension commits revolutionaries to contest capital in the core as well as the
            periphery, but declines the national alliances through which anti-imperialist states have survived.
          drain: reduces
          law_of_value: abolishes
          consciousness: hegemonic

      - id: internationalism.no-national-roads
        label: No national roads; national liberation is a trap
        claim: In the age of imperialism there are no progressive national wars or national roads; only the international working class, against every nation-state, can bring change.
        voiced: "In the era of imperialism there can be no more national wars. Every national struggle ends by tying workers to their own bourgeoisie."
        you: You think national liberation struggles end up serving local bosses, and only international workers' struggle matters.
        because: >
          Every national movement, however radical, ends up building a capitalist state, and workers who supported it
          find new masters in old uniforms. Imperialism is not a policy of some nations but the condition of all of them;
          new states join the system as soon as they are formed. Only internationalism without exceptions keeps
          workers' independence.
        against:
          - from: marxism.leninism
            text: >
              Refusing to support the right of nations to self-determination leaves the oppressed nations to their own
              bourgeoisie and the oppressor nation's workers to chauvinism.
          - from: marxism.third-worldism
            text: >
              A principle that treats the Vietnamese and the American empire as equally imperialist is not internationalism.
              It is neutrality in favor of the stronger.
        sources:
          - {author: "Rosa Luxemburg", title: "The Junius Pamphlet (The Crisis of German Social Democracy)", year: 1916}
          - {author: "Rosa Luxemburg", title: "The National Question and Autonomy", year: 1909}
        traditions:
          defining: [marxism.left-communism]
          typical: [marxism.council-communism, marxism.luxemburgism]
          contested: [marxism.third-camp]
          rejects: [marxism.leninism, marxism.maoism, marxism.third-worldism, nationalism.pan-africanism]
        presupposes: [change.agent.workers-as-class]
        excludes: [internationalism.tricontinental]
        tension: []
        tags: [left-communism]
        analysis:
          gains: [core-workers]
          pays: []
          mechanism: >
            Refusing all national struggles denies support to movements that contest foreign ownership in the periphery,
            so in practice it leaves the drain where it is while preparing for a world revolution.
          drain: none
          law_of_value: none
          disputed: >
            Left communists hold the frame's anti-imperialism ties workers to national capital; Third Worldists hold
            their stance neutralizes solidarity with the periphery.
          consciousness: class-economic

      - id: internationalism.tricontinental
        label: Internationalism of the oppressed nations
        claim: Change comes through the national-popular struggles of the global South, each delinking from imperialism, bound together by solidarity among the dominated nations.
        voiced: "Create two, three, many Vietnams. The internationalism of the peoples, not of empires, is built nation by nation against the center."
        you: You think change comes from the dominated nations of the South each breaking free, and helping each other do it.
        because: >
          The world system is polarized between core and periphery, and the first breaks with it come at its weak links.
          Each national-popular project that delinks, putting its own development before world-market demands, weakens
          the center. Solidarity among them, from Bandung to the Tricontinental to today's South-South cooperation,
          is the real internationalism.
        against:
          - from: marxism.trotskyism
            text: >
              National-popular blocs are led by national bourgeoisies who turn on their workers. Bandung's heirs became
              the comprador elites of the next generation.
          - from: conservatism.national
            text: >
              Solidarity among the South is rhetoric; each nation pursues its interest, and the South's governments trade
              with the West whenever it suits them.
        sources:
          - {author: "Samir Amin", title: "Delinking: Towards a Polycentric World", year: 1985}
          - {author: "Ernesto Che Guevara", title: "Message to the Tricontinental", year: 1967}
          - {author: "Vijay Prashad", title: "The Darker Nations: A People's History of the Third World", year: 2007}
        traditions:
          defining: [marxism.third-worldism]
          typical: [marxism.dependency, marxism.african-socialism, nationalism.bolivarianism, nationalism.pan-africanism, marxism.maoism, marxism.guevarism, nationalism.nasserism]
          contested: [marxism.scc]
          rejects: [marxism.left-communism, liberalism.internationalist, marxism.trotskyism]
        presupposes: [poverty.cause.drain, development.path.delinking]
        excludes: [internationalism.no-national-roads, internationalism.liberal-global-order]
        tension: []
        tags: [anti-imperialism, south]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Delinking states control capital flows, trade and resources, raising the price at which the periphery's
            labor and materials reach the core and reducing the transfer of value.
          drain: breaks
          law_of_value: suspends
          consciousness: hegemonic

      - id: internationalism.nation-first
        label: Each nation for itself; internationalism is a trap
        claim: Each nation should pursue its own interest and way of life; international movements and institutions serve global elites, not peoples.
        voiced: "There is no such thing as a global citizen. We are Americans, Hungarians, Indians. Let every nation govern itself."
        you: You think each nation should pursue its own interests and ignore global movements and institutions.
        because: >
          Nations are the largest communities in which people share loyalty, language and trust enough to govern
          themselves. Global institutions and movements answer to nobody and impose one ideology on many peoples. A world
          of independent nations, each free to pursue its own good, is more peaceful than an empire under one rulebook.
        against:
          - from: liberalism.internationalist
            text: >
              Climate change, pandemics and finance cross borders. A world of nations each for itself leads to trade wars,
              arms races and the war of all against all.
          - from: marxism.leninism
            text: >
              "Nation first" in a rich country means its workers lining up behind their own owners against workers abroad,
              who pay the price.
        sources:
          - {author: "Yoram Hazony", title: "The Virtue of Nationalism", year: 2018}
          - {author: "Pat Buchanan", title: "The Great Betrayal", year: 1998}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.right-populism, conservatism.paleo, nationalism.ethnic, nationalism.hindutva, conservatism.gaullism]
          contested: [nationalism.civic]
          rejects: [liberalism.internationalist, marxism.leninism, marxism.trotskyism]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [internationalism.liberal-global-order]
        tension: []
        tags: [nationalism]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie]
          pays: [peripheral-workers, reserve-army]
          mechanism: >
            In a core country, nation-first policy protects domestic industry and restricts migrants, while leaving the
            nation's finance and firms free to draw on the periphery; workers abroad and migrants bear the costs.
          drain: sustains
          law_of_value: regulates
          disputed: >
            In the periphery, sovereigntist nationalism can reduce the drain; the frame distinguishes oppressor-nation from
            oppressed-nation nationalism.
          consciousness: hegemonic

      - id: internationalism.liberal-global-order
        label: Change through global rules, trade and institutions
        claim: Lasting progress comes through international law, trade agreements and global institutions that bind every nation to common rules.
        voiced: "Commerce and law, not conquest and revolution. Build institutions that make war unprofitable and cooperation routine."
        you: You think progress comes through international law, trade and global institutions that bind all nations.
        because: >
          Trade makes nations depend on each other and war costly. International institutions solve problems no nation
          can solve alone and give small countries rules to appeal to. Since 1945 the rules-based order coincided with
          the longest period without war between great powers and the fastest reduction of poverty in history.
        against:
          - from: marxism.third-worldism
            text: >
              The rules were written by the core and enforce the drain: structural adjustment, intellectual property, the
              dollar. Institutions that protect creditors are not neutral.
          - from: conservatism.national
            text: >
              Global institutions answer to no electorate. They override national choices on borders, trade and law.
        sources:
          - {author: "Immanuel Kant", title: "Perpetual Peace", year: 1795}
          - {author: "Robert O. Keohane", title: "After Hegemony", year: 1984}
          - {author: "G. John Ikenberry", title: "Liberal Leviathan", year: 2011}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.technocratic, socdem.third-way, liberalism.social, ecology.green-growth, conservatism.christian-democracy]
          contested: [conservatism.neo]
          rejects: [conservatism.national, marxism.third-worldism, marxism.ml]
        presupposes: [development.path.integration]
        excludes: [internationalism.nation-first, internationalism.tricontinental]
        tension: []
        tags: [liberalism]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Global rules on trade, investment, intellectual property and debt protect creditors and patent holders in the
            core and bind peripheral states to open markets at world prices.
          drain: sustains
          law_of_value: extends
          consciousness: hegemonic

      - id: internationalism.community-of-faith
        label: The community of faith above nations
        claim: The true community is the community of believers, the umma or the universal Church, which stands above nations, and change means building it across borders.
        voiced: "The nationality of the Muslim is his creed. Borders drawn by colonizers do not divide the believers."
        you: You think the community of believers stands above nations and change means uniting it across borders.
        because: >
          Nationalism is a modern idol that divided believers along borders drawn by colonial powers. Faith unites
          people of every language and color. A movement grounded in God's law across borders can resist both Western
          domination and the corrupt national rulers it installed.
        against:
          - from: nationalism.civic
            text: >
              A political community defined by religion makes non-believers second-class or excludes them entirely.
          - from: marxism.ml
            text: >
              Pan-religious movements are funded by Gulf monarchies and have often served imperial strategy, as in
              Afghanistan in the 1980s.
        sources:
          - {author: "Sayyid Qutb", title: "Milestones", year: 1964}
          - {author: "Jamal al-Din al-Afghani", title: "Refutation of the Materialists", year: 1881}
        traditions:
          defining: [religious.islamism-brotherhood, religious.salafi-jihadism]
          typical: [religious.islamism-khomeinist, conservatism.integralism]
          contested: [religious.post-islamism, religious.islamic-socialism]
          rejects: [nationalism.civic, nationalism.kemalism, nationalism.baathism, marxism.ml]
        presupposes: []
        excludes: [internationalism.nation-first]
        tension: []
        tags: [religion]
        analysis:
          gains: [petty-bourgeoisie, comprador-capital]
          pays: []
          mechanism: >
            Organizing across borders on faith brings together merchants, clergy and the urban poor; where such movements
            hold power they have generally left property relations intact and their stance toward the core varies.
          drain: none
          law_of_value: none
          disputed: >
            Some materialists read Khomeinism and Hezbollah as anti-imperialist forces that reduce the drain; others read
            the Brotherhood current as bazaar capital's politics.
          consciousness: hegemonic

  # ------------------------------------------------------------------
  - id: culture.strategy
    domain: strategy
    layer: strategy
    question: Where should the fight be won first, in culture, in institutions, or in state power?
    plain: Do you change minds first and power follows, or take power first and change minds after?
    short: culture and power
    importance: 2
    region: strategy
    positions:
      - id: culture.strategy.hegemony-first
        label: Win hegemony in civil society before power
        claim: In societies where rule rests on consent, a movement must first win cultural and moral leadership in civil society, building a new bloc, before it can take state power.
        voiced: "In the West the state is only an outer ditch, behind which stands a powerful system of fortresses. The war of position comes first."
        you: You think a movement must win people's hearts and common sense across society before it can take power.
        because: >
          In Russia the state was everything and civil society weak, so a frontal assault worked. In the West, rule rests
          on the consent that schools, churches, media and parties produce daily. A frontal attack breaks on those
          trenches. A movement must build its own intellectuals, culture and alliances, a new common sense, before
          power can be won and kept.
        against:
          - from: marxism.leninism
            text: >
              Hegemony cannot be won while the other side owns the media, the schools and the jobs. The war of position
              without a decisive break becomes endless accommodation, as Eurocommunism showed.
          - from: conservatism.burkean
            text: >
              Treating culture as a battlefield to conquer turns every institution into a weapon. It destroys the shared
              ground on which a society settles its disputes.
        sources:
          - {author: "Antonio Gramsci", title: "Prison Notebooks", year: 1948, note: "written 1929-1935"}
          - {author: "Stuart Hall", title: "The Great Moving Right Show", year: 1979}
          - {author: "Ernesto Laclau and Chantal Mouffe", title: "Hegemony and Socialist Strategy", year: 1985}
        traditions:
          defining: [marxism.gramscian]
          typical: [marxism.eurocommunism, socdem.left-populism, marxism.western, socdem.democratic-socialism]
          contested: [marxism.structural]
          rejects: [marxism.left-communism, conservatism.burkean]
        presupposes: []
        excludes: []
        tension: [culture.strategy.power-first]
        tags: [gramsci]
        analysis:
          gains: [core-workers, professional-managerial]
          pays: []
          mechanism: >
            Building a counter-hegemony organizes workers' intellectuals and institutions that can contest consent,
            though in practice leadership often rests with intellectuals and professionals rather than workers.
          drain: none
          law_of_value: regulates
          consciousness: hegemonic

      - id: culture.strategy.long-march
        label: The long march through the institutions
        claim: Change comes by entering the existing institutions, universities, media, courts, civil service, professions, and transforming them from inside over a generation.
        voiced: "The long march through the institutions: work in them, with them, and against them, until they are ours."
        you: You think change comes from getting into universities, media, courts and the civil service and changing them from inside.
        because: >
          Revolution from outside failed in 1968. But the institutions that shape society are staffed by people, and a
          generation that enters them with different values changes what they teach, report and decide. Attitudes to
          gender, race and sexuality in the West changed this way, through professions and institutions rather than parties.
        against:
          - from: marxism.leninism
            text: >
              The institutions change the marchers. A generation that set out to transform the universities ended up as
              tenured administrators of them.
          - from: conservatism.right-populism
            text: >
              Exactly: the left captured the universities, newsrooms and bureaucracies and now uses them to impose its
              views on everyone who never voted for them.
        sources:
          - {author: "Herbert Marcuse", title: "Counterrevolution and Revolt", year: 1972}
          - {author: "Rudi Dutschke", title: "On Anti-Authoritarianism", year: 1968}
        traditions:
          defining: [marxism.western]
          typical: [liberalism.progressive, feminism.liberal, feminism.queer, marxism.eurocommunism]
          contested: [socdem.democratic-socialism]
          rejects: [conservatism.right-populism, marxism.leninism, anarchism.insurrectionary]
        presupposes: []
        excludes: []
        tension: [culture.strategy.power-first]
        tags: ["1968"]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Changing institutions from inside advances the careers and values of educated professionals who staff them;
            it shifts norms of recognition far more than it shifts ownership or wages.
          drain: none
          law_of_value: none
          consciousness: economic-corporate

      - id: culture.strategy.ideas-and-think-tanks
        label: Change the climate of ideas through intellectuals and think tanks
        claim: Change comes by changing what educated opinion considers possible, through intellectuals, think tanks and policy networks, so that when a crisis comes the right ideas are lying around.
        voiced: "Only a crisis produces real change. When it occurs, the actions taken depend on the ideas that are lying around."
        you: You think change comes from shaping what experts and opinion-makers think, so the right ideas are ready when a crisis hits.
        because: >
          Socialism triumphed in the mid-century because intellectuals, the "secondhand dealers in ideas", had been won
          over. Liberals must do the same: fund scholars and think tanks, train policy people, and wait. The Mont Pelerin
          Society, the IEA and the Atlas Network did exactly this, and their ideas were ready when the stagflation of the
          1970s discredited Keynesianism.
        against:
          - from: marxism.gramscian
            text: >
              The neoliberal think tanks won because capital funded them lavishly in a crisis of profitability. Ideas
              "lie around" when someone with money picks them up.
          - from: conservatism.right-populism
            text: >
              Think-tank conservatism produced policy papers for donors and lost the culture. The voters were never asked.
        sources:
          - {author: "Friedrich Hayek", title: "The Intellectuals and Socialism", year: 1949}
          - {author: "Milton Friedman", title: "Capitalism and Freedom (preface to the 1982 edition)", year: 1982}
          - {author: "Lewis F. Powell Jr.", title: "Attack on American Free Enterprise System (confidential memorandum)", year: 1971}
          - {author: "Philip Mirowski and Dieter Plehwe (eds.)", title: "The Road from Mont Pèlerin", year: 2009}
        traditions:
          defining: [liberalism.austrian, liberalism.chicago]
          typical: [conservatism.fusionism, libertarianism.minarchist, conservatism.neo, socdem.fabian, liberalism.technocratic]
          contested: [technology.effective-altruism]
          rejects: [conservatism.right-populism, anarchism.syndicalist]
        presupposes: [history.motor.ideas]
        excludes: []
        tension: []
        tags: [think-tanks, neoliberalism]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers]
          mechanism: >
            Think tanks are funded by firms and wealthy donors, so the ideas made ready for a crisis are those that serve
            their funders: deregulation, privatization and lower taxes on capital.
          drain: sustains
          law_of_value: extends
          consciousness: hegemonic

      - id: culture.strategy.metapolitics
        label: Politics is downstream of culture
        claim: Politics follows culture, so the fight is over films, music, religion, family life and everyday meaning, long before elections.
        voiced: "Politics is downstream of culture. Win the songs, the stories and the jokes, and the votes will follow."
        you: You think politics follows culture, so the real fight is over stories, entertainment, religion and everyday life.
        because: >
          People vote according to how they see the world, and they get that from music, film, sermons and family more
          than from manifestos. The left won the culture first and the law followed. The right must build its own media,
          art and communities. The Nouvelle Droite called this metapolitics, and the new right media proved it works.
        against:
          - from: marxism.classical
            text: >
              Culture rests on material life. Changing songs and stories without changing who owns the economy leaves
              people's real conditions, and so their politics, where they are.
          - from: liberalism.classical
            text: >
              A culture war waged as strategy treats art and religion as tools, which corrupts both and divides people
              who could otherwise live together.
        sources:
          - {author: "Alain de Benoist", title: "Vu de droite", year: 1977}
          - {author: "Andrew Breitbart", title: "Righteous Indignation", year: 2011}
        traditions:
          defining: [fascism.identitarian, conservatism.right-populism]
          typical: [conservatism.evangelical-right, conservatism.national, fascism.traditionalist, fascism.neoreaction]
          contested: [conservatism.traditionalist]
          rejects: [marxism.classical, liberalism.classical]
        presupposes: [history.motor.ideas]
        excludes: []
        tension: []
        tags: [culture-war]
        analysis:
          gains: [petty-bourgeoisie, industrial-capital]
          pays: [reserve-army]
          mechanism: >
            Moving political conflict into culture organizes workers around identity, faith and nation rather than wages
            and ownership, so economic policy favoring owners passes with less resistance while minorities become the target.
          drain: sustains
          law_of_value: none
          consciousness: hegemonic

      - id: culture.strategy.power-first
        label: Take power first, then remake the culture
        claim: Culture follows power, so a movement must first take the state and then use it to remake education, media and culture.
        voiced: "Without political power, all culture work is dabbling. Take power, then the schools, the press and the arts can serve the people."
        you: You think you must take power first and then use it to change schools, media and culture.
        because: >
          As long as the old ruling class owns the media, funds the arts and controls the schools, its ideas rule.
          Persuasion within that apparatus never reaches the majority. Only when power changes hands can education and
          culture be reorganized, as literacy campaigns in Cuba and China showed. On the right, postliberals now argue
          the same: use the state to remake culture rather than wait for culture to change.
        against:
          - from: marxism.gramscian
            text: >
              A power won without consent must be held by force, and culture imposed from above does not take root. Look
              at how fast official cultures collapsed in 1989.
          - from: liberalism.classical
            text: >
              Using state power to remake culture is the definition of a censor's state, whoever does it.
        sources:
          - {author: "Mao Zedong", title: "Talks at the Yan'an Forum on Literature and Art", year: 1942}
          - {author: "V. I. Lenin", title: "Party Organisation and Party Literature", year: 1905}
          - {author: "Patrick Deneen", title: "Regime Change: Toward a Postliberal Future", year: 2023}
        traditions:
          defining: [marxism.leninism, marxism.maoism]
          typical: [marxism.ml, marxism.mlm, conservatism.postliberal, conservatism.integralism, conservatism.national]
          contested: [marxism.scc]
          rejects: [marxism.gramscian, liberalism.classical, conservatism.traditionalist]
        presupposes: []
        excludes: []
        tension: [culture.strategy.hegemony-first]
        tags: [power]
        analysis:
          gains: []
          pays: []
          mechanism: >
            Taking state power first lets a movement reorganize schools and media around its program; whom that serves
            depends on its program, the expropriation of owners on the left, the protection of family and nation on the right.
          drain: none
          law_of_value: none
          disputed: >
            The class content of power-first differs sharply between the Leninist and postliberal versions; the
            instrument reads it from the program carried, not from the tempo.
          consciousness: hegemonic

      - id: culture.strategy.entryism
        label: Enter an existing mass party and take it over
        claim: Instead of building a new party, enter a large existing party and win control of it from inside.
        voiced: "Go where the masses are. Join the big party, organize inside it, win its branches, and take it over."
        you: You think the best route is to join a big existing party and take it over from inside.
        because: >
          New parties rarely break through electoral systems built for two. Mass parties already have the voters, the
          ballot lines and the money; a disciplined minority can win their branches and nominations. Trotskyists entered
          social democratic parties in the 1930s and later; the Tea Party and the movement around Trump remade the
          Republican Party; insurgent socialists ran inside Democratic and Labour parties.
        against:
          - from: marxism.left-communism
            text: >
              Entrists adapt to the party they enter. They become its left wing and lose their own program.
          - from: liberalism.social
            text: >
              Entryism is a hostile takeover of an organization by a faction that does not share its purpose. It hollows
              out parties as places where coalitions are formed.
        sources:
          - {author: "Michael Crick", title: "The March of Militant", year: 1986}
          - {author: "Theda Skocpol and Vanessa Williamson", title: "The Tea Party and the Remaking of Republican Conservatism", year: 2012}
        traditions:
          defining: [marxism.trotskyism]
          typical: [conservatism.right-populism, socdem.democratic-socialism, conservatism.national]
          contested: [marxism.third-camp]
          rejects: [marxism.left-communism, liberalism.social, anarchism.communist]
        presupposes: []
        excludes: []
        tension: []
        tags: [party]
        analysis:
          gains: []
          pays: []
          mechanism: >
            Entry gives an organized minority access to a mass party's voters, money and ballot line; the class content
            follows the faction, workers' demands in Labour's Militant, tax cuts and immigration control in the Tea Party.
          drain: none
          law_of_value: none
          consciousness: hegemonic

      - id: culture.strategy.build-own-institutions
        label: Build your own institutions, schools, clinics, mutual aid
        claim: Movements should build their own institutions, schools, clinics, food programs, credit unions, that meet people's needs and form a base the state and market cannot take away.
        voiced: "Serve the people, body and soul. A free breakfast program teaches more politics than a hundred speeches."
        you: You think movements should build their own schools, clinics and mutual aid to meet needs and earn people's trust.
        because: >
          People judge a movement by what it does for them. Institutions that feed children, treat the sick and lend to
          the excluded meet real needs, win lasting loyalty, and show the alternative working. The Black Panther survival
          programs, the Muslim Brotherhood's clinics and schools, Hezbollah's social services, and Catholic mutual
          societies all built mass bases this way.
        against:
          - from: socdem.democratic-socialism
            text: >
              Charity programs cannot match public provision and let the state off the hook. People need rights, not
              a movement's goodwill.
          - from: marxism.leninism
            text: >
              Service programs absorb a movement's energy and can be taken over by funders and NGOs. They help people
              survive the system without confronting it.
        sources:
          - {author: "Huey P. Newton", title: "Revolutionary Suicide", year: 1973}
          - {author: "Alondra Nelson", title: "Body and Soul: The Black Panther Party and the Fight Against Medical Discrimination", year: 2011}
          - {author: "Peter Kropotkin", title: "Mutual Aid: A Factor of Evolution", year: 1902}
        traditions:
          defining: [marxism.black-radical, religious.islamism-brotherhood]
          typical: [anarchism.communist, conservatism.cst, religious.liberation-theology, religious.islamism-khomeinist, conservatism.distributism, zapatismo]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.chicago]
        presupposes: []
        excludes: []
        tension: []
        tags: [mutual-aid]
        analysis:
          gains: [reserve-army, core-workers, petty-bourgeoisie]
          pays: []
          mechanism: >
            Movement-run services decommodify food, care and credit for members and build loyalty; they are financed by
            members, donors and religious networks, so their reach and politics follow their funders.
          drain: none
          law_of_value: suspends
          consciousness: class-economic

      - id: culture.strategy.courts-and-law-schools
        label: Win the law schools and the bench
        claim: Change is secured by building a legal movement, scholars, litigators and judges, that makes your reading of the constitution the law of the land.
        voiced: "Legislatures change every few years. Judges serve for life. Train the lawyers, build the network, and fill the bench."
        you: You think lasting change is secured by training lawyers and placing judges who share your view of the law.
        because: >
          Courts decide the limits of what legislatures may do, and judges serve for decades. A movement that trains
          lawyers, funds scholarship, and builds a pipeline into judicial appointments wins rulings that outlast any
          election. The civil rights bar did this from the 1930s to 1954; the conservative legal movement did it from the
          1980s and reversed decades of precedent.
        against:
          - from: socdem.democratic-socialism
            text: >
              Moving decisions to an unelected bench takes them out of reach of majorities. Courts have mostly protected
              property against labor.
          - from: anarchism.communist
            text: >
              Every legal victory is granted by the state and can be withdrawn by it. Rights won in court are only as
              strong as the movement behind them.
        sources:
          - {author: "Steven M. Teles", title: "The Rise of the Conservative Legal Movement", year: 2008}
          - {author: "Mark Tushnet", title: "The NAACP's Legal Strategy against Segregated Education, 1925-1950", year: 1987}
        traditions:
          defining: [conservatism.fusionism]
          typical: [conservatism.evangelical-right, liberalism.progressive, libertarianism.minarchist, conservatism.integralism]
          contested: [liberalism.egalitarian]
          rejects: [socdem.democratic-socialism, anarchism.communist, conservatism.right-populism]
        presupposes: []
        excludes: []
        tension: []
        tags: [courts]
        analysis:
          gains: [finance-capital, professional-managerial]
          pays: [core-workers]
          mechanism: >
            A judiciary shaped by funded legal networks rules on labor law, regulation and campaign finance; since the
            networks are financed by donors, their rulings have tended to protect property and corporate speech.
          drain: sustains
          law_of_value: extends
          disputed: >
            Civil rights litigation used the same method for desegregation; materialists differ on whether the method
            has a class bias or only its dominant funders do.
          consciousness: hegemonic

  # ------------------------------------------------------------------
  - id: consumption.choice
    domain: strategy
    layer: strategy
    question: Does changing what you buy change the world?
    plain: Can you change things by what you buy, or refuse to buy?
    short: consumer choice
    importance: 2
    region: ecology
    positions:
      - id: consumption.choice.consumer-responsibility
        label: Changing what you buy changes the world
        claim: Each purchase supports some practices and starves others, so shifting what you buy, fair trade, less meat, fewer flights, changes the world.
        voiced: "Every time you spend money, you cast a vote for the kind of world you want."
        you: You think changing what you buy, eating less meat, flying less, choosing fair trade, helps change the world.
        because: >
          Firms produce what sells. When enough people refuse a product, sales fall and production shifts: free-range
          eggs, plant-based foods and organic farming all grew from consumer demand. Personal choices also change norms;
          others copy what their neighbors do. And living by your values is right even if no one notices.
        against:
          - from: marxism.ecosocialism
            text: >
              A hundred firms account for most industrial emissions. Asking individuals to shop their way out of a crisis
              made by production lets those firms off the hook.
          - from: liberalism.austrian
            text: >
              Consumers already vote with their money; there is nothing to add. Moralizing about purchases is a way to
              impose one group's preferences on others.
        sources:
          - {author: "Peter Singer and Jim Mason", title: "The Ethics of What We Eat", year: 2006}
          - {author: "Anna Lappé and Frances Moore Lappé", title: "Hope's Edge", year: 2002}
        traditions:
          defining: [liberalism.progressive]
          typical: [ecology.green-growth, liberalism.utilitarian, technology.effective-altruism, ecology.deep-ecology]
          contested: [ecology.degrowth]
          rejects: [marxism.ecosocialism, marxism.classical, liberalism.austrian]
        presupposes: []
        excludes: [consumption.choice.production-decides]
        tension: []
        tags: [consumption]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Ethical consumption shifts market share toward premium products bought by higher-income consumers, which
            rewards firms that brand them, while leaving production methods and ownership elsewhere unchanged.
          drain: none
          law_of_value: extends
          consciousness: economic-corporate

      - id: consumption.choice.organized-boycott
        label: Organized boycotts work as collective weapons
        claim: Individual shopping changes little, but an organized boycott, called by a movement with clear demands, can force a firm or a state to give way.
        voiced: "Not one coin for the oppressor. A boycott is a strike of consumers, and like a strike it works when it is organized."
        you: You think a boycott works when a movement organizes it with clear demands, not as scattered personal choice.
        because: >
          Boycotts work when they are collective, targeted and tied to a struggle. The Montgomery bus boycott, the
          United Farm Workers' grape boycott, the swadeshi boycott of British cloth and the anti-apartheid campaigns
          all had demands, leaders and discipline. BDS is modeled on them.
        against:
          - from: liberalism.classical
            text: >
              Boycotts punish workers and innocent producers along with the target, and their demands are often
              political pressure dressed up as consumer choice.
          - from: marxism.classical
            text: >
              Boycotts can win particular demands, but they leave the power to decide production with owners. The strike,
              not the boycott, hits the source.
        sources:
          - {author: "Palestinian civil society organizations", title: "Palestinian Civil Society Call for BDS", year: 2005}
          - {author: "Martin Luther King Jr.", title: "Stride Toward Freedom: The Montgomery Story", year: 1958}
          - {author: "Mohandas K. Gandhi", title: "Hind Swaraj", year: 1909}
        traditions:
          defining: [nationalism.gandhian, nationalism.palestinian]
          typical: [marxism.black-radical, liberalism.progressive, religious.liberation-theology, socdem.labourism]
          contested: [anarchism.syndicalist]
          rejects: [liberalism.classical, nationalism.zionism-revisionist]
        presupposes: [change.possibility.organized-people-can]
        excludes: []
        tension: []
        tags: [boycott]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [industrial-capital]
          mechanism: >
            An organized boycott cuts a target firm's or state's revenue and reputation until it concedes; its class
            content depends on the struggle it serves.
          drain: reduces
          law_of_value: none
          consciousness: class-economic

      - id: consumption.choice.production-decides
        label: Production decides; consumer choice is a diversion
        claim: What is produced and how is decided by those who own production, so individual consumer choice changes little and distracts from collective action at work and in politics.
        voiced: "You can't shop your way out of capitalism. Production produces consumption, not the other way around."
        you: You think what gets produced is decided by owners, so personal shopping choices change little.
        because: >
          Firms decide what to produce, how and where, for profit; consumers choose only among what is offered at prices
          they can afford. The idea of a personal carbon footprint was popularized by an oil company's advertising.
          Workers who control energy and transport, and governments that plan them, can change what is produced; a
          shopper cannot.
        against:
          - from: liberalism.austrian
            text: >
              Firms that ignore what consumers want go bankrupt. Production follows demand, and demand is the sum of
              consumer choices.
          - from: ecology.deep-ecology
            text: >
              The overconsuming North cannot blame only corporations. Its way of life is the problem, and it must change
              personally as well as politically.
        sources:
          - {author: "Karl Marx", title: "Grundrisse", year: 1939, note: "written 1857-1858"}
          - {author: "Matthew T. Huber", title: "Climate Change as Class War", year: 2022}
          - {author: "Michael Maniates", title: "Individualization: Plant a Tree, Buy a Bike, Save the World?", year: 2001}
        traditions:
          defining: [marxism.classical, marxism.ecosocialism]
          typical: [marxism.ml, anarchism.syndicalist, marxism.trotskyism, ecology.environmental-justice]
          contested: [marxism.degrowth-communism]
          rejects: [liberalism.austrian, liberalism.progressive]
        presupposes: [capitalism.nature.exploitation-profit]
        excludes: [consumption.choice.consumer-responsibility]
        tension: []
        tags: [consumption]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Directing action at production rather than consumption targets the owners who decide investment and the
            workers who can stop it, rather than the purchasing choices of households.
          drain: reduces
          law_of_value: suspends
          disputed: >
            Degrowth communists and Third Worldists (Hickel) hold that core consumption itself rests on the drain and must
            fall; Huber holds that framing consumption alienates core workers.
          consciousness: class-economic

      - id: consumption.choice.consumer-sovereignty
        label: Consumers already rule; let them choose
        claim: In a market economy consumers already direct production by what they buy, so people should simply buy what they value and nobody should lecture them.
        voiced: "The consumer is sovereign. If people want green products they will pay for them. Telling them what to buy is paternalism."
        you: You think shoppers already steer the economy, and nobody should lecture others about what to buy.
        because: >
          Prices register what people want and what things cost, and producers compete to serve consumers. That is the
          most democratic system of production there is: every dollar is a vote, counted daily. If people truly value
          the environment or fair labor, they will pay for it. Lecturing consumers substitutes the preferences of activists for theirs.
        against:
          - from: marxism.classical
            text: >
              Votes counted in dollars give the rich more votes. Consumers choose among what owners decide to produce at
              prices set by competition, not what they need.
          - from: liberalism.social
            text: >
              Prices omit the costs dumped on others, pollution and carbon. Consumer sovereignty with unpriced harms is
              sovereignty to harm.
        sources:
          - {author: "W. H. Hutt", title: "Economists and the Public", year: 1936}
          - {author: "Ludwig von Mises", title: "Human Action", year: 1949}
        traditions:
          defining: [liberalism.austrian, liberalism.chicago]
          typical: [libertarianism.minarchist, libertarianism.ancap, libertarianism.objectivist, commonsense.live-and-let-live]
          contested: [liberalism.classical]
          rejects: [marxism.classical, marxism.ecosocialism, liberalism.social]
        presupposes: [value.source.subjective-utility]
        excludes: [consumption.choice.production-decides]
        tension: []
        tags: [market]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [peripheral-workers]
          mechanism: >
            Treating purchases as votes weights influence by income and leaves the costs of cheap goods, low wages and
            pollution in supplying countries, outside the price.
          drain: sustains
          law_of_value: extends
          consciousness: hegemonic

      - id: consumption.choice.simplicity-as-virtue
        label: Live simply because it is right
        claim: Living simply, buying less and wanting less, is a moral and spiritual discipline worth practicing whether or not it changes the world.
        voiced: "Live simply so that others may simply live. The point is not to change the market; it is to free yourself from it."
        you: You think living simply and wanting less is right in itself, whether or not it changes anything.
        because: >
          Consumer culture breeds restless wanting that never satisfies. Simplicity frees time and attention for God,
          family and neighbor, and refuses complicity in waste. Gandhi spun his own cloth; Thoreau went to the woods;
          Francis of Assisi gave up everything. Their example changed others not through markets but through witness.
        against:
          - from: marxism.classical
            text: >
              Voluntary simplicity is for those who could have more. For the poor, simplicity is not chosen; it is imposed.
          - from: ecology.ecomodernism
            text: >
              Asking people to want less will never move billions out of poverty. Abundance, clean and cheap, is the answer.
        sources:
          - {author: "Henry David Thoreau", title: "Walden", year: 1854}
          - {author: "Pope Francis", title: "Laudato si'", year: 2015}
          - {author: "E. F. Schumacher", title: "Small Is Beautiful", year: 1973}
        traditions:
          defining: [nationalism.gandhian]
          typical: [religious.engaged-buddhism, anarchism.christian, conservatism.cst, ecology.deep-ecology, ecology.degrowth, conservatism.distributism]
          contested: [conservatism.traditionalist]
          rejects: [ecology.ecomodernism, technology.e-acc, libertarianism.objectivist]
        presupposes: []
        excludes: []
        tension: []
        tags: [simplicity, religion]
        analysis:
          gains: []
          pays: []
          mechanism: >
            Personal simplicity reduces the practitioner's consumption and dependence on wages but leaves production,
            ownership and others' consumption as they are; its effect is moral example.
          drain: softens
          law_of_value: none
          consciousness: economic-corporate

      - id: consumption.choice.buy-local-and-national
        label: Buy local, buy national; keep money in the community
        claim: Buying from local and national producers keeps jobs and money in your community and nation instead of sending them abroad.
        voiced: "Buy local, support your neighbors. Every euro spent at home is a job at home."
        you: You think buying local and national keeps jobs and money in your own community.
        because: >
          Global supply chains send money to distant shareholders and jobs to the cheapest labor. Spending locally
          sustains small producers, farms and shops that hold communities together. India's swadeshi movement and
          campaigns to buy national products defended home industry against imperial competition.
        against:
          - from: liberalism.chicago
            text: >
              Buying local means paying more for less. Trade lets everyone specialize and lifts poor countries by giving
              them access to rich markets.
          - from: marxism.third-worldism
            text: >
              "Buy national" in a rich country protects core jobs while the periphery is still drained through finance and
              patents. It is protectionism for the privileged.
        sources:
          - {author: "Wendell Berry", title: "The Unsettling of America", year: 1977}
          - {author: "Mohandas K. Gandhi", title: "Hind Swaraj", year: 1909}
        traditions:
          defining: [conservatism.distributism]
          typical: [conservatism.national, conservatism.right-populism, nationalism.gandhian, anarchism.communalism, ecology.degrowth]
          contested: [socdem.labourism]
          rejects: [liberalism.chicago, liberalism.internationalist, marxism.third-worldism]
        presupposes: []
        excludes: []
        tension: []
        tags: [localism]
        analysis:
          gains: [petty-bourgeoisie, core-workers]
          pays: [peripheral-workers]
          mechanism: >
            Buying local in a core country supports small owners and domestic jobs; in an oppressed country, swadeshi
            protects infant industry. In the core, the loss of export markets falls on peripheral producers.
          drain: none
          law_of_value: regulates
          disputed: >
            The frame reads buy-national in the core as sustaining the drain and in the periphery as reducing it.
          consciousness: economic-corporate
