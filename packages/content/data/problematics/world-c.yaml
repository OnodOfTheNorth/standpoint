# World system, part 3: international institutions, sanctions, sovereignty, war and militarism.
problematics:
  # ------------------------------------------------------------------
  - id: intl.institutions
    domain: world
    layer: analysis
    question: What are the IMF, World Bank, WTO and UN for?
    plain: When the IMF lends a country money with conditions attached, who is that really helping?
    short: international institutions
    importance: 2
    region: world
    positions:
      - id: intl.institutions.cooperation
        label: They solve problems no country can solve alone
        claim: >
          International institutions exist to help states cooperate: to stabilize currencies, lend in crises,
          settle trade disputes and keep the peace. They make every member better off than it would be alone.
        voiced: >
          Without the IMF a balance-of-payments crisis becomes a depression; without the WTO every trade dispute
          becomes a trade war. Institutions are how sovereign states keep promises to each other.
        you: >
          You think bodies like the IMF, World Bank, WTO and UN help countries cooperate and handle problems none
          could handle alone.
        because: >
          Keohane shows that institutions lower the cost of making and checking agreements, so states cooperate
          even without a hegemon forcing them. The Bretton Woods system ended the currency wars of the 1930s.
          WTO dispute settlement let small countries win cases against the United States and the European Union.
          The alternative to imperfect institutions is not freedom but the law of the strongest.
        against:
          - from: marxism.dependency
            text: >
              Votes at the IMF follow money, so the United States holds a veto. Its "help" comes with conditions
              (cut subsidies, privatize, open to capital) that ensure creditors are paid first and the poor last.
          - from: conservatism.national
            text: >
              These bodies answer to no electorate. They have grown from servants of nations into masters of them.
        sources:
          - {author: Robert O. Keohane, title: "After Hegemony", year: 1984}
          - {author: Robert O. Keohane and Joseph S. Nye, title: "Power and Interdependence", year: 1977}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.technocratic, socdem.third-way, liberalism.social, conservatism.christian-democracy]
          contested: [socdem.nordic, liberalism.ordoliberal]
          rejects: [marxism.dependency, marxism.third-worldism, conservatism.national, libertarianism.paleo]
        excludes: [intl.institutions.creditor-instruments]
        analysis:
          gains: [finance-capital, professional-managerial, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Presenting the institutions as neutral cooperation legitimizes conditional lending and trade rules
            whose voting weights follow capital, so creditor claims and patent rents are enforced on periphery
            budgets.
          drain: sustains
          law_of_value: extends

      - id: intl.institutions.power-instruments
        label: They are tools of the great powers that run them
        claim: >
          International institutions reflect the power of the states that created them. They work when the great
          powers want them to and are ignored when they do not.
        voiced: >
          Institutions are a false promise. They are arenas for acting out power relations. The Security Council
          has five vetoes for a reason, and the IMF lends to friends.
        you: >
          You think international bodies are just tools of the powerful countries, used when convenient and
          ignored otherwise.
        because: >
          Mearsheimer shows that institutions have little independent effect: they reflect the distribution of
          power. The UN could not stop the invasion of Iraq or Ukraine; the IMF's biggest loans went to the
          United States' strategic partners. States obey rules when it suits them and leave them when it does not.
        against:
          - from: liberalism.internationalist
            text: >
              If institutions were mere tools, the powers would not spend so much effort shaping and joining them.
              The WTO ruled against the United States repeatedly, and it complied.
          - from: marxism.dependency
            text: >
              The realist sees states but not classes. The IMF serves creditors in every country, including the
              periphery's own banks, not just Washington's strategy.
        sources:
          - {author: John J. Mearsheimer, title: "The False Promise of International Institutions", year: 1994}
          - {author: Hans J. Morgenthau, title: "Politics Among Nations", year: 1948}
        traditions:
          typical: [conservatism.paleo, conservatism.gaullism, conservatism.national]
          contested: [marxism.ml]
          rejects: [liberalism.internationalist, liberalism.technocratic]
        tags: [realism]
        analysis:
          gains: [industrial-capital]
          pays: []
          mechanism: >
            Treating institutions as power arenas encourages each great power to bend them to its own firms and
            allies; it describes the hierarchy without contesting it.
          drain: none
          law_of_value: none

      - id: intl.institutions.creditor-instruments
        label: They enforce the creditors' and the core's claims on poor countries
        claim: >
          The IMF, World Bank and WTO are instruments of core finance and capital. Through loans with conditions,
          trade rules and patent law they force poor countries to open their economies, pay their debts and keep
          wages low.
        voiced: >
          The IMF is the bailiff of the world's banks. It arrives after the crash, lends to pay the creditors, and
          leaves behind privatized water, closed clinics and a currency in ruins. Structural adjustment is
          imperialism with a spreadsheet.
        you: >
          You think the IMF, World Bank and WTO mostly serve rich countries' banks and companies by forcing poor
          countries to open up and pay up.
        because: >
          Payer documented how IMF programs in the 1960s and 70s trapped borrowers in a cycle of debt and
          conditions. Structural adjustment in the 1980s and 90s cut public spending, food subsidies and wages
          across Africa and Latin America, which lost two decades of growth. The WTO's patent rules priced AIDS
          drugs out of reach until mass protest forced a waiver. In every case the creditor was paid.
        against:
          - from: liberalism.technocratic
            text: >
              Countries come to the IMF when they are already broke. Without its loans adjustment would be even more
              brutal, and the reforms it asks for (stable money, honest budgets) are what every growing economy has
              done.
          - from: liberalism.austrian
            text: >
              The IMF does serve creditors, by bailing them out with public money, which encourages reckless lending.
              The answer is to abolish it, not to capture it for different planners.
        sources:
          - {author: Cheryl Payer, title: "The Debt Trap: The IMF and the Third World", year: 1974}
          - {author: Michel Chossudovsky, title: "The Globalisation of Poverty", year: 1997}
          - {author: Quinn Slobodian, title: "Globalists", year: 2018}
        traditions:
          defining: [marxism.dependency, marxism.third-worldism]
          typical: [marxism.ml, marxism.maoism, marxism.mlm, marxism.trotskyism, nationalism.pan-africanism, nationalism.bolivarianism, religious.liberation-theology, marxism.world-systems]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.internationalist, liberalism.technocratic, liberalism.chicago]
        presupposes: [imperialism.nature.unequal-exchange-drain]
        excludes: [intl.institutions.cooperation]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Seeing the institutions as creditor enforcers supports refusing their conditions, defaulting and
            building alternatives, which cuts debt service and opens room for price and capital controls.
          drain: breaks
          law_of_value: suspends

      - id: intl.institutions.reform-democratize
        label: Good institutions, captured; democratize them
        claim: >
          The world needs institutions like the IMF and WTO, but they are run by and for rich countries and their
          financial sectors. Reform their votes, rules and policies and they can serve everyone.
        voiced: >
          The IMF's problem is not that it exists but whom it listens to: the Treasury and Wall Street. Give the
          South its fair share of votes, drop market fundamentalism, and these institutions can do what Keynes
          meant them to do.
        you: >
          You think global bodies like the IMF and WTO are needed but have been run for the rich, and should be
          reformed to give poorer countries a fair say.
        because: >
          Stiglitz, who saw the IMF from inside the World Bank, showed that its policies in East Asia in 1997
          and Russia in the 1990s deepened crises because they served financial interests and market ideology.
          Keynes's original plan for Bretton Woods put burdens on surplus countries too. Reform quotas, allow
          capital controls, cancel unpayable debt, and the institutions can stabilize instead of punish.
        against:
          - from: marxism.dependency
            text: >
              Reform has been promised since the 1970s and the vote shares have barely moved. An institution whose
              purpose is to secure creditors cannot be reformed into a defender of debtors.
          - from: liberalism.chicago
            text: >
              Countries in crisis need discipline, not softer loans. An IMF that lends without conditions will be
              lending into bottomless holes.
        sources:
          - {author: Joseph E. Stiglitz, title: "Globalization and Its Discontents", year: 2002}
          - {author: Dani Rodrik, title: "The Globalization Paradox", year: 2011}
          - {author: Ngaire Woods, title: "The Globalizers", year: 2006}
        traditions:
          defining: [socdem.keynesian]
          typical: [socdem.democratic-socialism, socdem.nordic, liberalism.progressive, liberalism.social, conservatism.cst]
          contested: [liberalism.internationalist]
          rejects: [marxism.third-worldism, liberalism.chicago, conservatism.national]
        analysis:
          gains: [professional-managerial, peripheral-workers]
          pays: [finance-capital]
          mechanism: >
            Reformed quotas, capital-control allowances and debt relief reduce the burden of adjustment and some
            creditor claims, while keeping periphery states inside the same dollar system and patent rules.
          drain: softens
          law_of_value: regulates

      - id: intl.institutions.build-alternatives
        label: The South must build its own institutions
        claim: >
          The postwar institutions were built by and for the rich countries. Poor countries should build their
          own: a New International Economic Order, regional banks, BRICS lending, trade in their own currencies.
        voiced: >
          We asked for a New International Economic Order in 1974 and they gave us structural adjustment. Now we
          build our own banks, our own payment systems, our own funds. We will not ask permission again.
        you: >
          You think poor countries should stop relying on Western-run bodies and build their own banks and
          institutions.
        because: >
          The UN General Assembly's 1974 call for a New International Economic Order demanded sovereignty over
          resources, fair commodity prices and the right to nationalize; the rich countries buried it. Since
          then the Bank of the South, the BRICS New Development Bank and Chinese lending have shown that
          alternatives can lend without structural adjustment. Sovereign institutions are the condition of
          sovereign development.
        against:
          - from: marxism.third-camp
            text: >
              The BRICS bank lends in dollars, follows market rules and is run by governments that crush their own
              workers. A new creditor is still a creditor.
          - from: liberalism.internationalist
            text: >
              Parallel institutions without standards on transparency and lending fragment the system, reward
              bad governance and leave borrowers with less recourse when things go wrong.
        sources:
          - {author: United Nations General Assembly, title: "Declaration on the Establishment of a New International Economic Order", year: 1974}
          - {author: Vijay Prashad, title: "The Poorer Nations", year: 2012}
          - {author: Asian-African Conference, title: "Final Communiqué of the Asian-African Conference of Bandung", year: 1955}
        traditions:
          defining: [nationalism.bolivarianism]
          typical: [marxism.third-worldism, marxism.scc, nationalism.pan-africanism, marxism.ml, nationalism.nasserism, marxism.african-socialism]
          contested: [marxism.world-systems]
          rejects: [liberalism.internationalist, conservatism.neo, marxism.third-camp]
        presupposes: [intl.sovereignty.nations-set-own-course]
        analysis:
          gains: [peripheral-workers, industrial-capital, peasantry]
          pays: [finance-capital]
          mechanism: >
            Alternative lenders and payment systems weaken the dollar's grip and IMF conditionality, cutting core
            creditors' leverage; their gains can go to periphery states and national capitalists rather than
            workers.
          drain: reduces
          law_of_value: regulates

      - id: intl.institutions.globalist-overreach
        label: They are unaccountable bureaucracies that override nations
        claim: >
          International bodies have grown from tools of cooperation among nations into unaccountable
          bureaucracies that impose rules, values and policies no citizen voted for.
        voiced: >
          No one elected the WHO, the WTO appellate judges or the UN rapporteurs. A nation that cannot make its
          own laws is not a nation. Withdraw, or make them servants again.
        you: >
          You think international bodies have too much power over nations and answer to nobody your country
          elected.
        because: >
          Hazony argues supranational institutions are the imperial principle in modern form: they claim to
          speak for universal values and override national self-government. Trade judges struck down national
          laws, and global agencies shaped domestic policy on health and migration. Restoring national
          sovereignty means leaving or curbing bodies that cannot be held to account.
        against:
          - from: liberalism.internationalist
            text: >
              These institutions exist because nations agreed to them, and nations can leave. The powers they have
              were delegated by elected governments; calling that tyranny confuses commitment with conquest.
          - from: marxism.third-worldism
            text: >
              A core nation that leaves the institutions keeps its navy, its currency and its banks. Unilateralism
              by the strong is a sharper instrument of the drain, not a weaker one.
        sources:
          - {author: Yoram Hazony, title: "The Virtue of Nationalism", year: 2018}
          - {author: Patrick J. Buchanan, title: "A Republic, Not an Empire", year: 1999}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.paleo, conservatism.right-populism, libertarianism.paleo, conservatism.postliberal, commonsense.anti-politics]
          contested: [conservatism.gaullism, conservatism.neo]
          rejects: [liberalism.internationalist, liberalism.technocratic, socdem.keynesian]
        presupposes: [imperialism.nature.globalist-project]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie]
          pays: [peripheral-workers]
          mechanism: >
            Withdrawing a core state from multilateral rules frees it to impose bilateral terms and tariffs on
            weaker partners, while its control of currency and finance continues.
          drain: sustains
          law_of_value: regulates

      - id: intl.institutions.moral-hazard
        label: Abolish them; bailouts reward reckless lenders and governments
        claim: >
          The IMF and World Bank should be abolished. Their bailouts reward reckless lenders and spendthrift
          governments, and their loans keep bad rulers in power. Markets would discipline both.
        voiced: >
          The IMF is ineffective, unnecessary and obsolete. Every bailout tells bankers they can lend recklessly
          and governments they can borrow recklessly, because the taxpayer will pay. Close it.
        you: >
          You think the IMF and World Bank should be shut down, because their bailouts encourage reckless lending
          and prop up bad governments.
        because: >
          Shultz, Simon and Wriston argued in 1998 that IMF rescues encouraged the risky lending that caused the
          Asian crisis; Milton Friedman agreed the IMF should go. Bauer and Easterly showed World Bank lending
          financing governments that crushed their own markets. Without a lender of last resort, creditors would
          price risk properly and governments would face the consequences of their own policies.
        against:
          - from: socdem.keynesian
            text: >
              Without a lender of last resort, a run on a country's currency becomes a collapse of its economy, as
              in the 1930s. Markets panic; somebody has to stand behind them.
          - from: marxism.dependency
            text: >
              "Let markets discipline" means let creditors seize what they can. Ending the IMF without ending the
              debts hands poor countries to bondholders and hedge funds directly.
        sources:
          - {author: "George P. Shultz, William E. Simon and Walter B. Wriston", title: "Who Needs the IMF?", year: 1998, note: Wall Street Journal}
          - {author: P. T. Bauer, title: "Equality, the Third World and Economic Delusion", year: 1981}
        traditions:
          defining: [liberalism.austrian]
          typical: [libertarianism.minarchist, libertarianism.ancap, libertarianism.paleo, liberalism.chicago]
          contested: [conservatism.fusionism]
          rejects: [socdem.keynesian, liberalism.internationalist, liberalism.technocratic]
        presupposes: [capitalism.nature.free-exchange]
        analysis:
          gains: [finance-capital, petty-bourgeoisie]
          pays: [peripheral-workers]
          mechanism: >
            Abolishing official lending leaves debt to private markets, where creditors price risk and seize
            assets directly; periphery states lose a buffer and face harsher terms in crises.
          drain: sustains
          law_of_value: extends

  # ------------------------------------------------------------------
  - id: intl.sanctions
    domain: world
    layer: strategy
    question: Are economic sanctions legitimate?
    plain: Is it right to cut a country off from trade and banking to make its government change course?
    short: sanctions
    importance: 2
    region: world
    positions:
      - id: intl.sanctions.legitimate-tool
        label: Sanctions are a legitimate tool short of war
        claim: >
          Economic sanctions are a legitimate way to pressure governments that invade neighbors, build nuclear
          weapons or sponsor terror, because they impose costs without sending soldiers.
        voiced: >
          Between words and war there must be something. Sanctions make aggression expensive. They cut Russia's
          war chest, slowed Iran's bomb and brought apartheid to the table.
        you: >
          You think cutting off trade and finance is a fair way to pressure governments that break international
          rules, and better than war.
        because: >
          Sanctions let states act together against aggression without killing anyone directly. Hufbauer and
          colleagues found they succeed in about a third of cases, especially with modest goals. Zarate shows
          how financial sanctions can isolate the banks of a hostile state. Doing nothing in the face of invasion
          or proliferation signals that aggression pays.
        against:
          - from: marxism.third-worldism
            text: >
              Sanctions are a siege. In Iraq in the 1990s, in Venezuela and in Syria, they killed through hunger and
              shortage of medicine. A weapon that kills civilians to coerce governments is war by other means.
          - from: libertarianism.minarchist
            text: >
              Sanctions are a tax on our own citizens' freedom to trade, and they rarely work. They harden the
              government they target and hand it someone to blame.
        sources:
          - {author: "Gary Clyde Hufbauer, Jeffrey J. Schott and Kimberly Ann Elliott", title: "Economic Sanctions Reconsidered", year: 1985}
          - {author: Juan C. Zarate, title: "Treasury's War", year: 2013}
        traditions:
          defining: [liberalism.internationalist]
          typical: [conservatism.neo, liberalism.technocratic, socdem.third-way, liberalism.progressive, conservatism.christian-democracy]
          contested: [socdem.democratic-socialism, conservatism.national]
          rejects: [marxism.third-worldism, marxism.ml, nationalism.bolivarianism, libertarianism.paleo]
        excludes: [intl.sanctions.economic-war]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Because the core controls the reserve currency and payment systems, sanctions are a weapon only it can
            wield; used against states that nationalize or defy creditors, they protect the existing terms of trade
            and ownership.
          drain: sustains
          law_of_value: none

      - id: intl.sanctions.targeted-for-rights
        label: Sanctions should target rulers and abusers, not peoples
        claim: >
          Broad sanctions punish ordinary people. Sanctions are legitimate when targeted: asset freezes and
          travel bans on the officials, oligarchs and firms responsible for abuses, with humanitarian exemptions.
        voiced: >
          Freeze the general's villa in Marbella, not the country's insulin. Smart sanctions hit those who give
          the orders and spare those who suffer them.
        you: >
          You think sanctions are fair only when they target the leaders and businesses responsible for abuses,
          not the whole population.
        because: >
          After the humanitarian disaster of the Iraq sanctions, the UN and many states moved to targeted
          measures. Cortright and Lopez show that asset freezes and travel bans can pressure elites without
          starving populations. Magnitsky laws let governments punish named torturers and kleptocrats wherever
          they hide their money.
        against:
          - from: marxism.dependency
            text: >
              "Targeted" sanctions on a central bank or state oil company target the whole economy. The list of
              targets is drawn by the foreign ministries of the powers, and it is never their own allies' torturers.
          - from: liberalism.internationalist
            text: >
              Targeted sanctions are too weak to stop a determined aggressor. Against an invasion, only broad
              economic pressure raises the cost enough to matter.
        sources:
          - {author: David Cortright and George A. Lopez, title: "Smart Sanctions: Targeting Economic Statecraft", year: 2002, note: editors}
          - {author: Daniel W. Drezner, title: "The Sanctions Paradox", year: 1999}
        traditions:
          defining: [liberalism.progressive]
          typical: [liberalism.social, socdem.nordic, socdem.democratic-socialism, conservatism.cst, liberalism.internationalist]
          contested: [technology.effective-altruism]
          rejects: [marxism.third-worldism, conservatism.neo]
        analysis:
          gains: [professional-managerial]
          pays: [comprador-capital]
          mechanism: >
            Targeting individuals reduces the civilian toll, but the power to list and freeze still rests on the
            core's control of banking, and its lists follow its interests, so periphery states remain exposed.
          drain: softens
          law_of_value: none

      - id: intl.sanctions.economic-war
        label: Sanctions are economic war on whole peoples
        claim: >
          Sanctions imposed by powerful states are a form of war: a siege that starves populations of food,
          medicine and income to force their governments to submit.
        voiced: >
          They call it diplomacy. Ask the Iraqi mothers, the Cuban children, the Venezuelans who died waiting for
          dialysis. A blockade is a siege, and a siege is war against the people inside the walls.
        you: >
          You think broad sanctions are a kind of war against ordinary people, meant to make them suffer until
          their government gives in.
        because: >
          Mulder shows that the economic weapon was designed after 1914 to break civilian populations. Gordon
          documents how the Iraq sanctions of the 1990s caused mass death from disease and malnutrition. Weisbrot
          and Sachs estimate tens of thousands of excess deaths from sanctions on Venezuela. The targets are
          almost always states that nationalized resources or refused to align, and the official reasons are
          cover.
        against:
          - from: liberalism.internationalist
            text: >
              The governments under sanction choose to spend on armies and palaces instead of medicine. Humanitarian
              exemptions exist; blaming the sanctions excuses rulers who starve their own people.
          - from: marxism.third-camp
            text: >
              Opposing sanctions is right, but this line slides into defending the sanctioned governments
              themselves, including their repression of workers. Opposing the siege must not mean cheering the
              besieged state's police.
        sources:
          - {author: Nicholas Mulder, title: "The Economic Weapon", year: 2022}
          - {author: Joy Gordon, title: "Invisible War: The United States and the Iraq Sanctions", year: 2010}
          - {author: Mark Weisbrot and Jeffrey Sachs, title: "Economic Sanctions as Collective Punishment: The Case of Venezuela", year: 2019}
        traditions:
          defining: [marxism.third-worldism, marxism.ml]
          typical: [nationalism.bolivarianism, marxism.maoism, marxism.juche, nationalism.pan-africanism, marxism.world-systems, religious.islamism-khomeinist, nationalism.eurasianism, conservatism.cst]
          contested: [marxism.trotskyism, marxism.third-camp]
          rejects: [liberalism.internationalist, conservatism.neo]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [intl.sanctions.legitimate-tool]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Treating sanctions as war builds opposition to the core's main weapon against sovereign development,
            protecting periphery states that raise resource prices or nationalize from being starved into reversal.
          drain: breaks
          law_of_value: none
          disputed: >
            Third-camp Marxists oppose sanctions but refuse political support to sanctioned governments; the frame
            judges besieged states with the siege counted in.

      - id: intl.sanctions.solidarity-boycott
        label: Boycotts called by the oppressed are legitimate; sanctions by empires are not
        claim: >
          Sanctions imposed by great powers serve their interests. Boycotts and sanctions called for by an
          oppressed people against its oppressor, and carried out by ordinary people, unions and institutions,
          are legitimate solidarity.
        voiced: >
          The dockers who refused to unload South African cargo did not ask permission from any foreign ministry.
          When the oppressed call for boycott, divestment and sanctions, answering that call is solidarity.
        you: >
          You think boycotts are right when the oppressed themselves call for them and ordinary people carry them
          out, but sanctions by great powers are not.
        because: >
          The boycott of apartheid South Africa began with the ANC's call and grew through students, unions and
          churches before governments acted. Barghouti's BDS movement follows that model for Palestine. The test
          is who calls the measure and against whom: an embargo by an empire on a country that nationalized its
          oil is a siege; a refusal by workers to handle the goods of an occupier is a strike.
        against:
          - from: liberalism.internationalist
            text: >
              Boycotting one country's universities and artists while trading with dozens of worse governments is
              selective and collective punishment, and it shuts down the dialogue that changes minds.
          - from: conservatism.neo
            text: >
              The BDS campaign singles out the one Jewish state for a treatment it gives no one else. Its goal is
              not reform but the end of Israel.
        sources:
          - {author: Omar Barghouti, title: "BDS: Boycott, Divestment, Sanctions", year: 2011}
          - {author: Albert Luthuli, title: "Let My People Go", year: 1962}
        traditions:
          defining: [nationalism.palestinian]
          typical: [marxism.trotskyism, marxism.third-camp, anarchism.syndicalist, socdem.democratic-socialism, religious.liberation-theology, marxism.black-radical, ecology.environmental-justice]
          contested: [marxism.ml, socdem.labourism]
          rejects: [conservatism.neo, liberalism.internationalist, nationalism.zionism-revisionist, religious.religious-zionism]
        presupposes: [solidarity.basis.shared-class]
        analysis:
          gains: [peripheral-workers, core-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Boycotts and labor refusals by core workers and institutions withdraw investment and labor from
            firms profiting from occupation or apartheid, imposing costs that originate below rather than from
            the core state's financial power.
          drain: reduces
          law_of_value: none
          consciousness: class-economic

      - id: intl.sanctions.counterproductive
        label: Sanctions fail and hurt our own traders
        claim: >
          Sanctions rarely achieve their goals. They rally people around the targeted government, enrich
          smugglers, push targets toward rivals, and cost our own firms and consumers. Trade is better than
          embargo.
        voiced: >
          Sixty years of embargo on Cuba and the Castros died in bed. Sanctions are a policy of feeling good while
          achieving nothing. When goods do not cross borders, armies will.
        you: >
          You think sanctions mostly fail, hurt your own country's businesses, and should be used rarely if
          at all.
        because: >
          Pape found that sanctions alone almost never achieve major political goals. Targeted governments
          blame foreigners for shortages and tighten control. Sanctions on Russia rerouted its trade to China,
          India and Turkey and spurred alternatives to the dollar. A libertarian adds that the right to trade is a
          right of individuals that governments have no business revoking for foreign-policy games.
        against:
          - from: liberalism.internationalist
            text: >
              Sanctions do not have to topple a government to work. They raise the cost of aggression, degrade war
              machines and signal resolve; ineffectiveness is an argument for better sanctions.
          - from: marxism.third-worldism
            text: >
              The realist complains that sanctions fail; the people in the sanctioned country are dying while he
              does his sums. The objection is not inefficiency but siege.
        sources:
          - {author: Robert A. Pape, title: "Why Economic Sanctions Do Not Work", year: 1997}
          - {author: Daniel W. Drezner, title: "The Sanctions Paradox", year: 1999}
        traditions:
          typical: [libertarianism.minarchist, libertarianism.ancap, libertarianism.paleo, conservatism.paleo, liberalism.classical, conservatism.gaullism]
          contested: [liberalism.chicago]
          rejects: [conservatism.neo, liberalism.internationalist]
        tags: [realism]
        analysis:
          gains: [industrial-capital, finance-capital]
          pays: []
          mechanism: >
            Opposing sanctions on grounds of ineffectiveness and the right to trade reopens markets for core exporters
            and investors in the targeted country, easing the siege without changing the terms on which they enter.
          drain: softens
          law_of_value: extends

      - id: intl.sanctions.national-leverage
        label: Sanctions and tariffs are weapons for our national interest, not crusades
        claim: >
          A nation should use sanctions, tariffs and export controls freely to protect its own industry, security
          and leverage, especially against strategic rivals, but not as a crusade for human rights abroad.
        voiced: >
          We sanction China because it steals our technology and hollows out our industry, not because we want to
          remake its government. Economic power is national power. Use it for us.
        you: >
          You think your country should use sanctions and tariffs to protect its own interests, but not to try to
          change other countries' governments.
        because: >
          Economic interdependence with a rival is a vulnerability: it lets the rival hold supply chains,
          technology and markets hostage. Export controls on advanced chips and tariffs on strategic goods
          rebuild national capacity. Human-rights sanctions, by contrast, are selective moralism; interest is a
          steadier guide and a more honest one.
        against:
          - from: liberalism.chicago
            text: >
              Tariffs and export bans are taxes on your own consumers and firms. They protect a few industries,
              invite retaliation and leave the nation poorer and the rival richer in new markets.
          - from: marxism.third-worldism
            text: >
              At least it is honest: sanctions to keep a rising rival from climbing the technology ladder are the
              defense of monopoly by state power, exactly the frame's account.
        sources:
          - {author: Robert Lighthizer, title: "No Trade Is Free", year: 2023}
          - {author: Yoram Hazony, title: "The Virtue of Nationalism", year: 2018}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.right-populism, conservatism.postliberal, nationalism.developmental-state]
          contested: [conservatism.neo, conservatism.paleo]
          rejects: [liberalism.chicago, liberalism.internationalist, libertarianism.minarchist]
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: [peripheral-workers, finance-capital]
          mechanism: >
            Export controls and tariffs aimed at rising rivals protect the core's technology monopolies, one of
            the main supports of the drain, by blocking periphery and semi-periphery producers from moving up.
          drain: sustains
          law_of_value: regulates

  # ------------------------------------------------------------------
  - id: intl.sovereignty
    domain: world
    layer: horizon
    question: Should nations set their own course free of outside pressure?
    plain: If a government treats its people badly, do other countries have the right to step in?
    short: national sovereignty
    importance: 3
    region: world
    positions:
      - id: intl.sovereignty.nations-set-own-course
        label: Nations should set their own course free of outside pressure
        claim: >
          Every nation has the right to choose its own political and economic system, control its own resources,
          and be free from foreign intervention, pressure and coercion.
        voiced: >
          Respect for the sovereignty and territorial integrity of all nations; abstention from intervention in
          the internal affairs of another country. These were won with our blood at Dien Bien Phu and Algiers.
          We will not surrender them to lectures from those who colonized us.
        you: >
          You think every nation should be left to decide its own course, without outside powers interfering.
        because: >
          The Bandung conference of 1955 made non-interference a principle of the newly independent nations,
          because "intervention" had always meant the strong deciding for the weak. The UN Charter forbids the use
          of force against any state's territorial integrity. Every intervention justified by rights (Iraq, Libya)
          left the people worse off. Sovereignty is the shield of the weak.
        against:
          - from: liberalism.internationalist
            text: >
              Sovereignty is not a license to murder. Rwanda in 1994 and Srebrenica in 1995 showed the cost of
              treating borders as sacred while people inside them are slaughtered.
          - from: marxism.third-camp
            text: >
              "Sovereignty" protects ruling classes from their own peoples as much as from empires. Workers owe no
              loyalty to the sovereign rights of the government that shoots their strikers.
        sources:
          - {author: Asian-African Conference, title: "Final Communiqué of the Asian-African Conference of Bandung", year: 1955}
          - {author: United Nations, title: "Charter of the United Nations", year: 1945}
          - {author: Kwame Nkrumah, title: "Neo-Colonialism: The Last Stage of Imperialism", year: 1965}
        traditions:
          defining: [nationalism.pan-africanism, nationalism.nasserism]
          typical: [marxism.ml, marxism.scc, marxism.juche, nationalism.bolivarianism, conservatism.gaullism, conservatism.national, conservatism.paleo, nationalism.eurasianism, marxism.third-worldism]
          contested: [marxism.maoism, nationalism.decolonial]
          rejects: [liberalism.internationalist, conservatism.neo, marxism.third-camp]
        excludes: [intl.sovereignty.conditional-on-rights]
        analysis:
          gains: [peripheral-workers, peasantry, industrial-capital, comprador-capital]
          pays: [finance-capital]
          mechanism: >
            Strict non-interference raises the cost to core powers of coups, sanctions and invasions against
            states that nationalize or set their own prices; it also shields periphery ruling classes, including
            compradors, from outside pressure by their own workers' allies.
          drain: reduces
          law_of_value: none
          disputed: >
            The frame backs sovereignty as a defense against the drain; third-camp and anarchist writers stress that
            it also shields ruling classes from their own peoples.

      - id: intl.sovereignty.conditional-on-rights
        label: Sovereignty is conditional on how a government treats its people
        claim: >
          A government's right to be left alone depends on its protecting its own people. When it commits mass
          atrocities, the international community has a responsibility to act.
        voiced: >
          Sovereignty is not a shield for tyrants. It is a responsibility. When a state murders its own people,
          the world must not stand by.
        you: >
          You think a government loses its right to be left alone if it commits atrocities against its own
          people.
        because: >
          Deng and colleagues reframed sovereignty as responsibility in 1996, and the International Commission
          on Intervention and State Sovereignty made it the responsibility to protect in 2001. The world adopted
          it at the 2005 UN summit after the failures in Rwanda and Bosnia. A sovereignty that protects genocide
          is a sovereignty of governments, not of peoples.
        against:
          - from: nationalism.pan-africanism
            text: >
              Who decides when a government has lost its rights? Always the same powers, and always against the
              same kinds of states. Libya in 2011 showed what "responsibility to protect" means: regime change by
              bombing, and a country destroyed.
          - from: conservatism.paleo
            text: >
              We have no business policing other nations' morals. Every crusade to protect other peoples has made
              enemies and cost our own blood.
        sources:
          - {author: International Commission on Intervention and State Sovereignty, title: "The Responsibility to Protect", year: 2001}
          - {author: Francis M. Deng and others, title: "Sovereignty as Responsibility: Conflict Management in Africa", year: 1996}
          - {author: Kofi Annan, title: "Two Concepts of Sovereignty", year: 1999, note: The Economist}
        traditions:
          defining: [liberalism.internationalist]
          typical: [conservatism.neo, liberalism.progressive, socdem.third-way, liberalism.egalitarian, conservatism.christian-democracy]
          contested: [socdem.democratic-socialism, conservatism.cst]
          rejects: [nationalism.pan-africanism, marxism.ml, marxism.third-worldism, conservatism.paleo, conservatism.national]
        excludes: [intl.sovereignty.nations-set-own-course]
        analysis:
          gains: [finance-capital, professional-managerial, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Conditional sovereignty in practice gives the powers with the military and the Security Council veto
            the right to judge and remove periphery governments, which raises the risk for any government that
            challenges core interests.
          drain: sustains
          law_of_value: none

      - id: intl.sovereignty.pooled
        label: Sovereignty is best exercised by pooling it with others
        claim: >
          Small and middle nations gain real control by pooling sovereignty in common institutions, as in the
          European Union or the African Union, which can do what none can alone.
        voiced: >
          A nation of ten million standing alone against global markets has the sovereignty of a cork on the sea.
          Pooled in a union of three hundred million, it sets the rules.
        you: >
          You think countries become stronger, not weaker, by sharing some of their powers in unions with their
          neighbors.
        because: >
          Formal sovereignty means little against markets and great powers. The European Union lets its members
          set standards the world follows and negotiate trade as a giant. Nkrumah argued that only African unity
          could make African independence real. Pooling turns many weak sovereignties into one strong one.
        against:
          - from: conservatism.national
            text: >
              Pooled sovereignty is surrendered sovereignty. Greece learned in 2015 what happens when a pooled
              nation votes against Brussels and Frankfurt.
          - from: marxism.third-worldism
            text: >
              The European Union pools the sovereignty of its core for use on its periphery, Southern Europe
              included. African unity, by contrast, pools the weak against the strong; the label hides opposite
              things.
        sources:
          - {author: Kwame Nkrumah, title: "Africa Must Unite", year: 1963}
          - {author: Robert O. Keohane and Joseph S. Nye, title: "Power and Interdependence", year: 1977}
        traditions:
          typical: [liberalism.internationalist, conservatism.christian-democracy, socdem.third-way, liberalism.ordoliberal, nationalism.pan-africanism]
          contested: [socdem.democratic-socialism, marxism.eurocommunism]
          rejects: [conservatism.national, conservatism.paleo, conservatism.gaullism]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            Pooling among rich states strengthens their bloc's hand in trade and finance over weaker partners;
            pooling among poor states can raise their bargaining power, so the effect depends on who pools with
            whom.
          drain: softens
          law_of_value: regulates

      - id: intl.sovereignty.organized-hypocrisy
        label: Sovereignty is a polite fiction; the strong do what they can
        claim: >
          Sovereignty is honored by the powerful when convenient and ignored when not. In practice strong states
          intervene in weak ones; the principle is a useful convention, not a rule.
        voiced: >
          Sovereignty is organized hypocrisy. The strong do what they can and the weak suffer what they must. Every
          great power intervenes in its backyard; the only question is whose backyard.
        you: >
          You think sovereignty is a nice idea the powerful ignore whenever they want, and always have.
        because: >
          Krasner shows that the supposed rules of sovereignty have been violated constantly since Westphalia,
          by intervention, conditional loans and imposed constitutions. Thucydides' Athenians told the Melians as
          much. Recognizing it lets states act prudently instead of pretending.
        against:
          - from: nationalism.pan-africanism
            text: >
              A description of how the strong behave is not a justification. Sovereignty is a weapon the weak have
              used to win independence, nationalize their resources and resist intervention.
          - from: liberalism.internationalist
            text: >
              Norms change behavior. Conquest of territory, once normal, has become rare since 1945 precisely
              because the rule against it is taken seriously.
        sources:
          - {author: Stephen D. Krasner, title: "Sovereignty: Organized Hypocrisy", year: 1999}
          - {author: Thucydides, title: "History of the Peloponnesian War", year: "c. -400"}
        traditions:
          typical: [conservatism.gaullism, conservatism.paleo]
          contested: [conservatism.neo, nationalism.eurasianism]
          rejects: [nationalism.pan-africanism, liberalism.internationalist]
        tags: [realism]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Treating sovereignty as a fiction normalizes intervention by those able to intervene, who are the core
            powers, and so the coercion that secures their claims on the periphery.
          drain: sustains
          law_of_value: none

      - id: intl.sovereignty.oppressed-nations-first
        label: Oppressed nations may secede; oppressor states may not hold them
        claim: >
          Sovereignty is not equal for all states. Oppressed nations and colonized peoples have the right to
          self-determination, including secession; empires and oppressor states cannot use sovereignty to keep
          them.
        voiced: >
          The right of nations to self-determination means the right to secede and form an independent state.
          Workers of the oppressor nation must defend that right above all; to defend the "integrity" of the
          empire is chauvinism.
        you: >
          You think colonized and oppressed peoples have a right to independence, while powerful states have no
          right to hold onto them in the name of sovereignty.
        because: >
          Lenin argued that the line between oppressor and oppressed nations is the key to the national question
          under imperialism. The sovereignty of Britain over India, of France over Algeria, or of any state over a
          subject nation is the sovereignty of a jailer. Supporting self-determination for the oppressed, and
          refusing it to empires, is how workers of the oppressor nation break with their own rulers.
        against:
          - from: liberalism.internationalist
            text: >
              Who counts as an oppressed nation? Every secessionist movement claims to be one, and the doctrine
              invites endless war over borders.
          - from: marxism.luxemburgism
            text: >
              Luxemburg warned that "self-determination" under capitalism means the self-determination of each
              nation's bourgeoisie. Workers need unity across nations, not more borders.
        sources:
          - {author: V. I. Lenin, title: "The Right of Nations to Self-Determination", year: 1914}
          - {author: Rosa Luxemburg, title: "The National Question and Autonomy", year: 1909}
        traditions:
          defining: [marxism.leninism]
          typical: [marxism.ml, marxism.maoism, marxism.mlm, marxism.trotskyism, nationalism.indigenous-sovereignty, nationalism.palestinian, marxism.black-radical]
          contested: [marxism.third-camp, anarchism.confederalism]
          rejects: [marxism.luxemburgism, conservatism.neo, nationalism.ethnic]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, finance-capital, industrial-capital]
          mechanism: >
            Backing secession and independence for subject nations removes land, resources and labor from the
            direct control of the oppressor state and its investors, cutting the most direct channel of the drain.
          drain: breaks
          law_of_value: none
          disputed: >
            Lenin and Luxemburg on the national question: Luxemburg held that self-determination serves national
            bourgeoisies and divides workers.

      - id: intl.sovereignty.class-over-nation
        label: Workers have no country; national sovereignty is the bosses' claim
        claim: >
          National sovereignty is the claim of a ruling class to rule its territory. Workers owe it nothing; their
          loyalty is to their class across all borders, against every state.
        voiced: >
          The workers have no country. Every flag hides a boss. Down with all national borders and all states;
          the only sovereignty we recognize is that of the workers' councils.
        you: >
          You think national sovereignty means nothing to working people, whose real loyalty is to each other
          across borders.
        because: >
          States are instruments of class rule, and nations are the form in which ruling classes rally workers to
          their wars. Bordiga and the left communists argued that national liberation in the imperialist epoch
          only replaces one exploiter with another; anarchists add that the state itself is the problem. Defending
          any state's sovereignty puts workers under its command.
        against:
          - from: marxism.leninism
            text: >
              Refusing to distinguish between the sovereignty of Britain and that of colonized India puts the
              colonizer and colonized on the same footing, which in practice helps the colonizer.
          - from: nationalism.pan-africanism
            text: >
              It is easy to scorn sovereignty from the metropole. For us it was won at the cost of hundreds of
              thousands of lives, and it is all that stands between our resources and the companies that want them.
        sources:
          - {author: Karl Marx and Friedrich Engels, title: "Manifesto of the Communist Party", year: 1848}
          - {author: Rudolf Rocker, title: "Nationalism and Culture", year: 1937}
        traditions:
          defining: [marxism.left-communism]
          typical: [marxism.council-communism, anarchism.communist, anarchism.syndicalist, anarchism.insurrectionary]
          contested: [marxism.luxemburgism, marxism.third-camp]
          rejects: [marxism.leninism, marxism.ml, nationalism.pan-africanism, conservatism.national]
        presupposes: [state.nature.class-instrument]
        excludes: [intl.sovereignty.nations-set-own-course]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Denying all national claims aims workers' action at every state at once; by refusing to distinguish
            core and periphery states, it gives no support to periphery states resisting the drain.
          drain: none
          law_of_value: abolishes

      - id: intl.sovereignty.god-alone
        label: Sovereignty belongs to God, not to nations or peoples
        claim: >
          Sovereignty belongs to God alone. No nation, people or ruler is sovereign in its own right; states are
          legitimate only as far as they govern by divine law.
        voiced: >
          Sovereignty belongs to God alone. When men claim the right to make law for men, that is servitude of man
          to man. Only when divine law rules is a people free.
        you: >
          You think that ultimate authority belongs to God, and that nations and governments are legitimate only
          as far as they follow divine law.
        because: >
          Qutb argued that every order in which humans legislate for humans, whether liberal, nationalist or
          communist, is jahiliyya (ignorance of God), because it puts some men above others. Mawdudi drew the
          same conclusion for the Islamic state. Catholic integralists, from their own tradition, hold that
          temporal power must be subordinate to spiritual authority. National sovereignty is idolatry of the
          nation.
        against:
          - from: liberalism.classical
            text: >
              God's sovereignty is exercised in practice by those who claim to speak for him. Every theocracy ends
              with clerics ruling in God's name and dissenters punished as heretics.
          - from: marxism.ml
            text: >
              Divine sovereignty has served kings and landlords for millennia. Iran's revolution under God's
              sovereignty kept private property, crushed the left and made the bazaar rich.
        sources:
          - {author: Sayyid Qutb, title: "Milestones", year: 1964}
          - {author: Pope Leo XIII, title: "Immortale Dei", year: 1885}
        traditions:
          defining: [religious.salafi-jihadism]
          typical: [religious.islamism-brotherhood, religious.islamism-khomeinist, conservatism.integralism, religious.religious-zionism]
          contested: [religious.salafism-quietist, conservatism.reactionary]
          rejects: [liberalism.classical, marxism.ml, nationalism.kemalism, religious.post-islamism]
        presupposes: [history.motor.providence]
        analysis:
          gains: [landed-capital, petty-bourgeoisie]
          pays: [peripheral-workers]
          mechanism: >
            Placing sovereignty in divine law and its interpreters tends to leave property relations to religious
            law, which protects merchants and landowners, while giving clerical authorities power to suppress
            secular labor organizations; against foreign rule it can mobilize the poor against core powers.
          drain: none
          law_of_value: none
          disputed: >
            Some Marxists (and Khomeinist currents themselves) read political Islam as anti-imperialist in effect;
            others read it as a vehicle of bazaar and landed classes that crushed the left (Iran 1979–83).

  # ------------------------------------------------------------------
  - id: war.militarism
    domain: world
    layer: analysis
    question: Why do wars happen, and what is military power for?
    plain: When countries go to war, what is really driving it?
    short: war and militarism
    importance: 2
    region: world
    positions:
      - id: war.militarism.anarchy-security
        label: Wars come from the struggle for security among states with no ruler above them
        claim: >
          Wars happen because there is no world government to protect states, so each must look to its own
          security, and one state's defense looks like another's threat.
        voiced: >
          Wars occur because there is nothing to prevent them. In a self-help system, the security of each is the
          insecurity of the others. Great powers are not evil; they are afraid.
        you: >
          You think wars happen mainly because countries have no one above them to keep the peace, so they arm
          against each other out of fear.
        because: >
          Waltz showed that the causes of war lie in the structure of the international system, not in the
          nature of men or states. Mearsheimer adds that great powers seek to maximize power because they can
          never be sure of others' intentions. This explains why states with very different ideologies behave
          alike, and why wars recur across history.
        against:
          - from: marxism.leninism
            text: >
              The "system" is made of capitalist states whose rulers need markets, resources and investment
              outlets. Fear is real, but the scramble for Africa and the oil wars were about profit.
          - from: liberalism.internationalist
            text: >
              Anarchy is what states make of it. Democracies trading with each other and bound by institutions have
              not fought each other; the structure has not changed, but behavior has.
        sources:
          - {author: Kenneth N. Waltz, title: "Man, the State, and War", year: 1959}
          - {author: John J. Mearsheimer, title: "The Tragedy of Great Power Politics", year: 2001}
        traditions:
          typical: [conservatism.paleo, conservatism.gaullism, conservatism.burkean]
          contested: [conservatism.neo]
          rejects: [marxism.leninism, liberalism.internationalist, anarchism.christian]
        tags: [realism]
        analysis:
          gains: [industrial-capital]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            Explaining war by the security dilemma makes armament a permanent necessity and treats the interests
            of arms makers and investors abroad as irrelevant to causes, which shields both from scrutiny.
          drain: sustains
          law_of_value: none

      - id: war.militarism.imperialist-rivalry
        label: Wars come from capitalist competition for markets, resources and profits
        claim: >
          Wars in the capitalist era come from competition among capitals and their states for markets,
          resources, investment outlets and control of the periphery. Military power exists to secure them.
        voiced: >
          War is the continuation of politics by other means, and the politics of capitalism is profit. The
          soldier dies for the oil company, the arms maker and the bondholder. Turn the guns on the war-makers.
        you: >
          You think wars are fought mainly for the profits of the powerful (oil, markets, contracts) whatever
          reasons are given.
        because: >
          Lenin explained 1914 as a war to redivide a world already divided among the powers. Luxemburg showed how
          militarism is itself a field of accumulation and a tool for opening non-capitalist areas. The pattern
          since (oil in Iraq, minerals in Congo, coups against nationalizations) shows that wars follow capital's
          needs. Official reasons are cover.
        against:
          - from: liberalism.classical
            text: >
              War destroys capital and trade; most businessmen hate it. Wars come from nationalism, ideology and
              power-seeking politicians, not from markets that need peace.
          - from: conservatism.neo
            text: >
              Saddam, Putin and the Taliban were not driven by Western profit. Aggressors start wars, and the
              democracies fight them reluctantly and late.
        sources:
          - {author: V. I. Lenin, title: "Imperialism, the Highest Stage of Capitalism", year: 1917}
          - {author: Rosa Luxemburg, title: "The Accumulation of Capital", year: 1913}
          - {author: Carl von Clausewitz, title: "On War", year: 1832}
        traditions:
          defining: [marxism.leninism, marxism.ml]
          typical: [marxism.maoism, marxism.trotskyism, marxism.third-worldism, marxism.luxemburgism, marxism.left-communism, anarchism.communist, anarchism.syndicalist, marxism.mlm]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.classical, conservatism.neo, liberalism.internationalist]
        presupposes: [imperialism.nature.monopoly-stage]
        analysis:
          gains: [core-workers, peripheral-workers, peasantry]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Naming profit as the cause of war turns anti-war movements against arms makers, oil firms and the
            alliances that secure investments abroad, threatening the force that guarantees the drain.
          drain: breaks
          law_of_value: suspends

      - id: war.militarism.arms-profits
        label: A military-industrial complex profits from war and keeps it going
        claim: >
          Military spending and wars are driven by arms makers, contractors and the officials who move between
          them, who profit from permanent preparation for war and lobby for it.
        voiced: >
          War is a racket. A few profit, and the many pay. Beware the unwarranted influence of the military-
          industrial complex. Follow the contracts.
        you: >
          You think wars and huge military budgets are pushed by companies and officials who make money from them.
        because: >
          Eisenhower warned in 1961 of the military-industrial complex's unwarranted influence. Butler, a decorated
          general, wrote that he had served as a gangster for capitalism. Baran and Sweezy and Kidron showed that
          arms spending also props up demand in rich economies, absorbing surplus that would otherwise mean
          crisis. The budget grows regardless of threats because the interests behind it are permanent.
        against:
          - from: conservatism.neo
            text: >
              Military spending as a share of output is far below Cold War levels. The threats are real, and blaming
              contractors is an excuse to disarm in front of aggressors.
          - from: marxism.leninism
            text: >
              The arms lobby is a symptom. The whole capitalist class, not one sector, needs the military to secure
              its markets and investments abroad; a smaller budget would still serve the same masters.
        sources:
          - {author: Dwight D. Eisenhower, title: "Farewell Address", year: 1961}
          - {author: Smedley D. Butler, title: "War Is a Racket", year: 1935}
          - {author: Paul A. Baran and Paul M. Sweezy, title: "Monopoly Capital", year: 1966}
          - {author: Seymour Melman, title: "The Permanent War Economy", year: 1974}
        traditions:
          typical: [liberalism.progressive, socdem.democratic-socialism, libertarianism.paleo, libertarianism.minarchist, conservatism.paleo, commonsense.rigged, anarchism.communist]
          contested: [marxism.leninism, marxism.ml]
          rejects: [conservatism.neo, liberalism.internationalist]
        analysis:
          gains: [core-workers, peripheral-workers]
          pays: [industrial-capital]
          mechanism: >
            Targeting the arms sector can cut military budgets and arms sales, but treating war as one industry's
            racket leaves aside the investments and creditor claims abroad that the military secures.
          drain: softens
          law_of_value: none

      - id: war.militarism.peace-through-strength
        label: Weakness invites war; strength deters it
        claim: >
          Wars happen when aggressors believe they can win. Strong military power and the will to use it deter
          aggression and keep the peace.
        voiced: >
          If you want peace, prepare for war. Every war of our time began when an aggressor smelled weakness:
          Munich, Korea, Crimea. Strength is the only language bullies respect.
        you: >
          You think the surest way to avoid war is to be strong enough that no one dares attack.
        because: >
          Schelling showed how credible threats prevent violence: deterrence works by making aggression costlier
          than restraint. The Cold War never turned hot in Europe because NATO's deterrent held. When the
          democracies disarmed in the 1930s, Hitler advanced; when the West hesitated over Crimea in 2014, Russia
          came back for the rest of Ukraine in 2022.
        against:
          - from: anarchism.christian
            text: >
              Every arms race in history was justified as deterrence, and most ended in war. Preparing for war
              prepares war.
          - from: marxism.third-worldism
            text: >
              Deterrence for whom? The strongest military in the world has fought in dozens of countries since
              1945, none of which threatened it. "Strength" deters the periphery from defending itself.
        sources:
          - {author: Thomas C. Schelling, title: "Arms and Influence", year: 1966}
          - {author: Robert Kagan, title: "Of Paradise and Power", year: 2003}
        traditions:
          defining: [conservatism.neo]
          typical: [conservatism.fusionism, conservatism.national, conservatism.evangelical-right, liberalism.internationalist, conservatism.gaullism]
          contested: [socdem.labourism]
          rejects: [anarchism.christian, nationalism.gandhian, marxism.third-worldism, marxism.trotskyism]
        analysis:
          gains: [industrial-capital, finance-capital]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            High military spending funds arms firms from core taxes and gives the core powers the capacity to
            deter periphery states from nationalizing or realigning, guaranteeing investor claims abroad.
          drain: sustains
          law_of_value: none

      - id: war.militarism.democratic-peace
        label: Autocracies make war; democracy and trade make peace
        claim: >
          Wars are caused mainly by governments not answerable to their people. Liberal democracies, bound by
          trade and international institutions, do not fight each other, so spreading them spreads peace.
        voiced: >
          Liberal democracies do not go to war with each other. Spread representative government, open trade and
          shared institutions and you shrink the zone of war. Kant saw it in 1795.
        you: >
          You think wars mostly come from governments that do not answer to their people, and that more elected
          governments and trade would mean fewer wars.
        because: >
          Kant argued that republics, where citizens bear the cost of war, would be slow to start one, and that a
          league of republics could bring lasting peace. Doyle found that liberal states have almost never fought
          each other. Trade makes war costly; institutions make cooperation routine. Pinker shows violence in
          long-run decline as these forces spread.
        against:
          - from: marxism.third-worldism
            text: >
              Liberal democracies do not fight each other; they fight everyone else. The same democracies have
              bombed, invaded or overthrown elected governments across the South.
          - from: conservatism.paleo
            text: >
              The theory became a license for wars to spread democracy, which produced Iraq and Libya. Peace comes
              from minding your own business.
        sources:
          - {author: Immanuel Kant, title: "Perpetual Peace: A Philosophical Sketch", year: 1795}
          - {author: Michael W. Doyle, title: "Kant, Liberal Legacies, and Foreign Affairs", year: 1983}
          - {author: Steven Pinker, title: "The Better Angels of Our Nature", year: 2011}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.classical, liberalism.technocratic, conservatism.neo, socdem.third-way]
          contested: [liberalism.progressive]
          rejects: [marxism.leninism, marxism.third-worldism, conservatism.paleo]
        presupposes: [capitalism.nature.free-exchange]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [peripheral-workers]
          mechanism: >
            Locating war's cause in undemocratic governments frames the core powers as peaceful and their wars
            against periphery states as defensive or liberating, which legitimizes the force that secures the
            drain.
          drain: sustains
          law_of_value: extends
          method: idealist

      - id: war.militarism.fallen-nature-just-war
        label: War comes from human sin; it is sometimes just but must be limited
        claim: >
          War comes from the pride, greed and fear of fallen human beings, and will not end before the end of
          history. It can be just only for a right cause, by legitimate authority, as a last resort, sparing the
          innocent.
        voiced: >
          War is the fruit of sin. Peace on earth is always fragile, and a ruler may have to take up the sword to
          defend the innocent. But the just war has strict limits, and most wars fail them.
        you: >
          You think war comes from human sinfulness and cannot be abolished, but that it can be just only under
          strict conditions.
        because: >
          Augustine taught that in a fallen world the earthly city lives by force, and that war may be waged only
          to restore peace and punish wrong. Niebuhr argued that groups are more selfish than individuals, so
          collective life will always involve coercion. John XXIII in Pacem in Terris insisted that peace rests on
          justice, truth, charity and liberty, and condemned the arms race.
        against:
          - from: marxism.leninism
            text: >
              Sin does not explain why wars cluster around oil fields and trade routes. Blaming human nature
              excuses the system and its beneficiaries.
          - from: anarchism.christian
            text: >
              Christ told Peter to put away his sword. Just-war theory was invented when the church made peace with
              the empire, and it has blessed nearly every war since.
        sources:
          - {author: Augustine of Hippo, title: "The City of God", year: "c. 426"}
          - {author: Reinhold Niebuhr, title: "Moral Man and Immoral Society", year: 1932}
          - {author: Pope John XXIII, title: "Pacem in Terris", year: 1963}
        traditions:
          defining: [conservatism.cst]
          typical: [conservatism.christian-democracy, conservatism.traditionalist, conservatism.burkean, conservatism.integralism, conservatism.evangelical-right]
          contested: [religious.liberation-theology]
          rejects: [anarchism.christian, marxism.leninism]
        presupposes: [history.motor.providence]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Grounding war in human nature names no class interest behind it; its limiting conditions can restrain
            particular wars, but the account leaves the material causes of war in place.
          drain: none
          law_of_value: none
          method: idealist

      - id: war.militarism.pacifist
        label: War is never justified; violence breeds violence
        claim: >
          War is never justified. Violence produces more violence, and military power exists to dominate. Peace
          comes only through refusal, nonviolent resistance and disarmament.
        voiced: >
          There is no way to peace; peace is the way. The soldier who refuses, the worker who will not make the
          shell, the village that will not inform: these, not armies, end wars.
        you: >
          You think war is always wrong, and that refusal and nonviolent resistance are the only real roads to
          peace.
        because: >
          Tolstoy argued that the state's power rests on men willing to kill on command, and that refusal is the
          one act that dissolves it. Gandhi showed nonviolent mass action could defeat an empire. Every war,
          however just its cause, kills mainly the poor and leaves hatred that seeds the next one.
        against:
          - from: marxism.leninism
            text: >
              Pacifism disarms the oppressed while the oppressors keep their armies. Algeria, Vietnam and South Africa
              were not freed by refusal alone; the colonized have the right to fight.
          - from: conservatism.neo
            text: >
              Pacifism works only against opponents with consciences. Gandhi's methods would not have stopped
              Hitler; in practice pacifism hands victory to whoever is willing to use force.
        sources:
          - {author: Leo Tolstoy, title: "The Kingdom of God Is Within You", year: 1894}
          - {author: M. K. Gandhi, title: "Hind Swaraj", year: 1909}
        traditions:
          defining: [anarchism.christian, nationalism.gandhian]
          typical: [religious.engaged-buddhism, ecology.deep-ecology, anarchism.green]
          contested: [anarchism.communist, religious.christian-socialism]
          rejects: [marxism.leninism, marxism.ml, conservatism.neo, fascism.italian]
        analysis:
          gains: [core-workers, peripheral-workers, peasantry]
          pays: [industrial-capital]
          mechanism: >
            Refusing military service and arms production cuts the supply of soldiers and weapons for all wars,
            including imperial ones; refusing armed resistance also disarms periphery movements facing armed
            occupiers.
          drain: reduces
          law_of_value: none

      - id: war.militarism.war-ennobles
        label: War is the test and renewal of nations
        claim: >
          War is not a misfortune but the supreme test of a nation, where its people rise above selfish life to
          sacrifice. Military power is the measure of a nation's vitality and its right to expand.
        voiced: >
          War alone brings all human energies to their highest tension and puts the stamp of nobility on the
          peoples who have the courage to meet it. Perpetual peace is neither possible nor useful.
        you: >
          You think war tests and renews a nation, and that a nation's strength shows in its readiness to fight.
        because: >
          Mussolini's Doctrine of Fascism, written with Gentile, rejected pacifism as cowardice and held that the
          nation lives through struggle and expansion. Jünger described the trenches as the forging of a new,
          hardened type of man. On this view, a people that will not fight decays into comfort and is conquered by
          one that will.
        against:
          - from: liberalism.classical
            text: >
              The record answers it: fascist Italy's war in Ethiopia used poison gas, and the fascist powers' war
              killed tens of millions and ended in their own nations' ruin and occupation.
          - from: marxism.ml
            text: >
              The heroism of war was sold to workers so that Italian and German industrialists could seize colonies,
              raw materials and slave labor. Fascism crushed the unions first, then sent their members to die.
        sources:
          - {author: Benito Mussolini and Giovanni Gentile, title: "The Doctrine of Fascism", year: 1932}
          - {author: Ernst Jünger, title: "Storm of Steel", year: 1920}
        traditions:
          defining: [fascism.italian, fascism.nazism]
          typical: [fascism.traditionalist, fascism.national-syndicalism, fascism.clerical]
          contested: [fascism.third-position, fascism.identitarian]
          rejects: [liberalism.classical, marxism.ml, anarchism.christian, nationalism.gandhian, liberalism.internationalist]
        analysis:
          gains: [industrial-capital, finance-capital, landed-capital]
          pays: [core-workers, peripheral-workers, peasantry, reserve-army]
          mechanism: >
            Glorifying war mobilizes the nation behind rearmament contracts and colonial conquest, while
            suppressing labor at home; in power, fascist Italy and Germany seized colonies and used forced labor,
            transferring conquered peoples' land and labor to their own capital.
          drain: sustains
          law_of_value: regulates
