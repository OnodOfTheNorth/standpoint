problematics:
  - id: nation.question
    domain: nation
    layer: analysis
    question: What is a nation, and who has the right to self-determination?
    plain: When a people wants its own state, who decides whether it gets one?
    short: the national question
    importance: 3
    region: nation
    positions:
      - id: nation.question.self-determination-leninist
        label: Every nation may secede; defend the oppressed nation's right
        claim: >
          Nations formed with capitalism. Every nation has the right to secede and form its own
          state, and socialists in an oppressor nation must defend that right first of all.
          Defending the right is not the same as urging every nation to use it.
        voiced: >
          The workers of the oppressor nation must demand the right of the oppressed nation to
          secede. Recognizing the right to divorce is not a call for every couple to divorce; it is
          what makes union voluntary. Whoever denies that right to the colony has gone over to his
          own bourgeoisie.
        you: >
          You think every nation has the right to leave the state that holds it, and that people
          in the dominant nation owe that right their strongest support.
        because: >
          Holding a nation by force breeds national hatred, and national hatred splits workers
          along national lines. Only full equality, including the right to leave, lets the workers
          of both nations see their common enemy. Under imperialism the world is divided into a
          handful of oppressor nations and a majority of oppressed ones, and the national movements
          of the oppressed are allies against finance capital.
        against:
          - from: marxism.luxemburgism
            text: >
              "The right of nations" is an empty abstraction. In class society the nation speaks
              with its ruling class's voice. In 1918 the bourgeois governments of Ukraine and the
              Baltic used self-determination to invite German troops against their own workers.
          - from: nationalism.civic
            text: >
              A standing right of secession for every nation turns every election in a
              multinational state into a referendum on its existence and rewards whoever mobilizes
              ethnic grievance most.
        sources:
          - {author: V. I. Lenin, title: "The Right of Nations to Self-Determination", year: 1914}
          - {author: V. I. Lenin, title: "The Socialist Revolution and the Right of Nations to Self-Determination", year: 1916}
          - {author: V. I. Lenin, title: "Preliminary Draft Theses on the National and Colonial Questions", year: 1920}
        traditions:
          defining: [marxism.leninism, marxism.ml]
          typical: [marxism.maoism, marxism.trotskyism, marxism.third-worldism, marxism.mariategui]
          contested: [marxism.scc]
          rejects: [marxism.luxemburgism, marxism.left-communism, nationalism.civic]
        presupposes: [imperialism.nature.monopoly-stage]
        excludes: [nation.question.no-abstract-right]
        tension: []
        tags: [self-determination, lenin-luxemburg]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Backing the secession of colonies and oppressed nations takes territory, markets and
            cheap labor out of the imperial state's control and removes the national hatred its
            rulers use to keep workers divided.
          drain: reduces
          law_of_value: none
          disputed: >
            Luxemburgists and left communists argue the new states passed to local bourgeoisies
            that rejoined the world market as junior partners, so the drain moved rather than shrank.
            Amin and the Third Worldists reply that anticolonial states cut it until the 1980s debt crisis.
          consciousness: hegemonic

      - id: nation.question.no-abstract-right
        label: No abstract right of nations; workers' unity across borders
        claim: >
          Under capitalism a nation has no single will, so "self-determination" in practice means
          rule by its propertied class. Socialists should not back new national states. They should
          fight for workers' unity across existing borders, with local and cultural autonomy.
        voiced: >
          The nation as a homogeneous social whole does not exist. Within every nation stand classes
          with opposed interests. To promise every nation a state is to hand each working class to
          its own bourgeoisie, and each small new state to a great power.
        you: >
          You think talk of a nation's right to its own state hides the question of which class
          will run that state, and that workers should organize across borders instead.
        because: >
          Capitalist development binds territories into larger economic units, so small new states
          end up as dependent clients of big ones. The slogan cannot be applied neutrally: who speaks
          for the nation, the landowners or the workers? It becomes a weapon for whichever class leads
          the national movement. Workers' power across the whole territory, with democratic local
          autonomy, protects national minorities better than new borders do.
        against:
          - from: marxism.leninism
            text: >
              By refusing the right of secession to Poland, Finland and the colonies, this position
              sides in practice with the chauvinism of the oppressor nation. Workers who deny the
              oppressed the right to leave will never earn their trust.
          - from: marxism.third-worldism
            text: >
              The colonized cannot wait for a world revolution led from the metropoles. Where a
              whole nation is exploited from outside, national liberation is the form class
              struggle takes.
        sources:
          - {author: Rosa Luxemburg, title: "The National Question and Autonomy", year: 1909}
          - {author: Rosa Luxemburg, title: "The Junius Pamphlet", year: 1916}
        traditions:
          defining: [marxism.luxemburgism]
          typical: [marxism.left-communism, marxism.council-communism]
          contested: [anarchism.communist]
          rejects: [marxism.leninism, marxism.ml, nationalism.ethnic, marxism.third-worldism]
        presupposes: []
        excludes: [nation.question.self-determination-leninist]
        tension: []
        tags: [self-determination, lenin-luxemburg]
        analysis:
          gains: [core-workers]
          pays: [petty-bourgeoisie]
          mechanism: >
            Refusing to back national states denies the small owners and intelligentsia who lead
            national movements a state of their own, but where the existing state is an empire it
            also leaves the colonized inside the structure that drains them.
          drain: none
          law_of_value: none
          disputed: >
            Leninists and Third Worldists hold that in practice this sustains the drain by leaving
            imperial borders unchallenged; Luxemburgists answer that new states reproduce it.
          consciousness: hegemonic

      - id: nation.question.stalin-definition
        label: A nation is a stable community of language, territory, economy and culture
        claim: >
          A nation is a historically formed, stable community of people with a common language,
          territory, economic life and shared culture. A group lacking any one of these is not a
          nation. Each real nation should have territorial autonomy or its own republic.
        voiced: >
          A nation is not racial or tribal. It is a historically constituted, stable community of
          people, formed on the basis of a common language, territory, economic life and
          psychological make-up shown in a common culture. Only when all of these are present
          together do we have a nation. National in form, socialist in content.
        you: >
          You think a nation can be defined by objective features, shared language, land, economy
          and culture, and that national rights belong to groups that meet the test.
        because: >
          An objective definition stops claims to nationhood from being settled by whoever shouts
          loudest, and ties national rights to a territory where they can actually be exercised.
          On this basis Soviet nationality policy in the 1920s built schools, newspapers and
          administrations in dozens of languages and promoted local people into office.
        against:
          - from: marxism.austromarxism
            text: >
              Tying the nation to territory abandons dispersed nations, Jews and the minorities of
              every mixed region, and forces the state to sort people onto maps. A nation is a
              community of character carried by persons, not by soil.
          - from: marxism.trotskyism
            text: >
              Under bureaucratic rule the definition became an instrument of administration: whole
              peoples, Chechens, Crimean Tatars, Volga Germans, were deported between 1941 and 1944.
              National in form meant nothing once the content was decided in Moscow.
        sources:
          - {author: J. V. Stalin, title: "Marxism and the National Question", year: 1913}
          - {author: Terry Martin, title: "The Affirmative Action Empire: Nations and Nationalism in the Soviet Union, 1923-1939", year: 2001}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.hoxhaism, marxism.maoism, marxism.juche]
          contested: [marxism.leninism]
          rejects: [marxism.austromarxism, nationalism.ethnic]
        presupposes: []
        excludes: [nation.question.cultural-autonomy]
        tension: []
        tags: [definition]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital]
          mechanism: >
            Territorial autonomy with native-language schooling moved posts and education in the
            former colonies of the Russian empire to their own peoples, at the expense of the local
            landed nobility and the settler officials who had held them; groups that failed the test
            got no recognized status.
          drain: reduces
          law_of_value: none
          disputed: >
            Some historians and Central Asian critics argue the cotton monoculture imposed on
            Uzbekistan reproduced a colonial division of labor inside the Soviet Union.

      - id: nation.question.cultural-autonomy
        label: Nations are communities of persons; give them cultural autonomy, not borders
        claim: >
          A nation is a community of character formed by shared history, carried by persons wherever
          they live. In a multinational state each nation should run its own schools and cultural
          life as a self-governing association of its members, while the state stays whole.
        voiced: >
          Nationality belongs to the person, not to the soil. Let each citizen declare a nationality;
          let each nation govern its schools and culture; keep the economy and the state common to
          all workers.
        you: >
          You think nations can share the same streets and the same state if each governs its own
          culture and schools, without needing separate territory.
        because: >
          In mixed regions, Habsburg cities, the Balkans, today's migrant cities, territorial
          self-determination produces new minorities in every new state and ends in population
          transfers. The personal principle lets nations coexist without anyone moving or anyone
          ruling the others, and it keeps the large economic unit socialists need.
        against:
          - from: marxism.leninism
            text: >
              National-cultural autonomy separates workers by nation in their schools and their
              organizations, and hands each nation's culture to its clergy and bourgeoisie. Every
              nation contains two cultures, and this scheme protects the wrong one.
          - from: nationalism.ethnic
            text: >
              Cultural rights granted inside another people's state are rights on sufferance.
              They can be withdrawn by the majority on any day it chooses.
        sources:
          - {author: Otto Bauer, title: "The Question of Nationalities and Social Democracy", year: 1907}
          - {author: V. I. Lenin, title: "Critical Remarks on the National Question", year: 1913}
        traditions:
          defining: [marxism.austromarxism]
          typical: []
          contested: [anarchism.confederalism, communitarianism]
          rejects: [marxism.leninism, marxism.ml, nationalism.ethnic]
        presupposes: []
        excludes: [nation.question.stalin-definition]
        tension: []
        tags: [austro-marxism]
        analysis:
          gains: [core-workers, petty-bourgeoisie]
          pays: []
          mechanism: >
            Separate national school and cultural bodies give each nation's teachers, clergy and
            intelligentsia secure posts and constituencies, while workers keep one labor market and
            one state but are organized culturally apart.
          drain: none
          law_of_value: none
          disputed: >
            Leninists hold it divides the working class; defenders point to the Moravian Compromise
            of 1905 and Estonia's cultural autonomy law of 1925 as workable.

      - id: nation.question.wilsonian
        label: Peoples should govern themselves by consent, under international law
        claim: >
          Each people has a right to choose its own government. Borders should follow nationality
          where possible, settled by agreement among states and international law, not by force.
        voiced: >
          National aspirations must be respected; peoples may now be dominated and governed only by
          their own consent. Self-determination is not a mere phrase. It is an imperative principle
          of action.
        you: >
          You think peoples should choose their own governments, and that an international order of
          law and agreement is the way to settle who gets a state.
        because: >
          The great wars were fought over subject peoples held in empires. A world of states resting
          on the consent of their peoples, bound by treaties and a league of nations, removes that
          cause. Self-determination is government by consent applied between peoples.
        against:
          - from: marxism.third-worldism
            text: >
              At Versailles the principle stopped at the color line. Europe's subject peoples got
              states; Egypt, Korea, India and China were refused, and Germany's colonies passed to
              Britain and France as mandates. Ho Chi Minh's petition was never answered.
          - from: nationalism.civic
            text: >
              Drawing borders by nationality broke multinational states into successor states full
              of new minorities, and gave Hitler the Sudeten German question in 1938.
        sources:
          - {author: Woodrow Wilson, title: "Fourteen Points", year: 1918}
          - {author: Erez Manela, title: "The Wilsonian Moment: Self-Determination and the International Origins of Anticolonial Nationalism", year: 2007}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.social]
          contested: [conservatism.neo]
          rejects: [conservatism.reactionary, marxism.luxemburgism]
        presupposes: []
        excludes: []
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            As applied after 1918, the principle created states in Europe that borrowed from core
            banks under League supervision, while the mandate system kept the Arab East and Africa
            under British and French control; self-determination was granted where it weakened
            rival empires.
          drain: sustains
          law_of_value: none
          disputed: >
            Liberal internationalists argue the principle, written into the UN Charter in 1945,
            later armed decolonization whatever its first use.

      - id: nation.question.civic
        label: The nation is its citizens, bound by shared institutions and will
        claim: >
          A nation is the body of citizens who share political institutions and a will to live
          together, whatever their ancestry. Self-determination belongs to the citizens of existing
          states. Secession is justified only against grave oppression.
        voiced: >
          A nation is a soul, a spiritual principle: a shared past and the present consent to live
          together. Its existence is a daily plebiscite. It is not made by race, language or the
          course of rivers.
        you: >
          You think anyone who joins the political community and accepts its laws belongs to the
          nation, and that breaking up existing states along ethnic lines usually does harm.
        because: >
          Defining the nation by descent makes every minority a permanent suspect and every border a
          war. Defining it by citizenship lets anyone join by choosing the republic. Existing states
          are the only frameworks in which equal rights are actually enforced, so breaking them up by
          ethnicity usually creates new minorities with fewer protections.
        against:
          - from: nationalism.ethnic
            text: >
              No one dies for a constitution. Every civic nation is an older ethnic nation that has
              forgotten its origins and now asks everyone else to adopt its language and holidays.
          - from: marxism.leninism
            text: >
              "The citizens of existing states" freezes borders drawn by conquest. It was France's
              answer to Algeria, declared three French departments, and Britain's to Ireland.
        sources:
          - {author: Ernest Renan, title: "What Is a Nation?", year: 1882}
          - {author: Jürgen Habermas, title: "The Inclusion of the Other", year: 1996}
        traditions:
          defining: [nationalism.civic]
          typical: [liberalism.republican, nationalism.kemalism, conservatism.gaullism, liberalism.social]
          contested: [liberalism.classical]
          rejects: [nationalism.ethnic, fascism.identitarian]
        presupposes: []
        excludes: [nation.question.ethnic]
        tension: []
        tags: [civic-ethnic]
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Treating citizenship as the only national bond keeps conquered territories and internal
            minorities inside one state and one market, and denies them a separate claim to land or
            government; France held Algeria on this basis until 1962.
          drain: none
          law_of_value: none
          disputed: >
            In postcolonial states such as Nyerere's Tanzania, civic nationhood was used against
            ethnic patronage and colonial divide-and-rule, so its effect depends on which state
            applies it.

      - id: nation.question.ethnic
        label: A nation is a people of shared descent, language and culture
        claim: >
          A nation is a people bound by descent, language, culture and memory, existing before any
          state. Each such people has a right to its own state, where it can protect and continue
          itself.
        voiced: >
          A people is a living whole: its language, its songs, its dead and its unborn. The state
          exists to shelter the nation, not the nation to fill the state.
        you: >
          You think a nation is a people with shared roots, and that each people deserves a state
          where it can stay itself.
        because: >
          People experience nationality as kinship and inheritance, not as a contract they signed.
          Nations without states have been persecuted, assimilated or destroyed; a state of its own
          is the only guarantee a people can count on. Shared culture produces the trust that
          welfare states and citizen armies depend on.
        against:
          - from: nationalism.civic
            text: >
              Descent-based nationhood makes every citizen of other origin a guest. In mixed lands
              it ends in exchanges and expulsions: Greece and Turkey in 1923, Partition in 1947,
              the Balkans in the 1990s.
          - from: marxism.classical
            text: >
              The nation is a product of the capitalist market's need for a unified territory and
              language, not an eternal people. The "living whole" hides which class speaks for it.
        sources:
          - {author: Johann Gottlieb Fichte, title: "Addresses to the German Nation", year: 1808}
          - {author: Johann Gottfried Herder, title: "Ideas on the Philosophy of the History of Mankind", year: 1784}
          - {author: Anthony D. Smith, title: "The Ethnic Origins of Nations", year: 1986}
        traditions:
          defining: [nationalism.ethnic]
          typical: [fascism.identitarian, religious.buddhist-nationalism, nationalism.zionism-revisionist]
          contested: [conservatism.national, nationalism.hindutva]
          rejects: [nationalism.civic, marxism.classical, liberalism.classical]
        presupposes: []
        excludes: [nation.question.civic]
        tension: []
        tags: [civic-ethnic]
        analysis:
          gains: [petty-bourgeoisie, landed-capital]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Reserving the state to one descent group gives its members preferred access to land,
            office and jobs, and turns minorities and migrants into a rightless, cheaper labor
            reserve; cross-class national unity damps wage conflict inside the majority.
          drain: none
          law_of_value: none

      - id: nation.question.constructed
        label: Nations are modern constructions with no natural claim
        claim: >
          Nations were made in the last two or three centuries by print, schooling, markets and
          states. They are real as shared belief but carry no natural right; claims to a state are
          political choices, not facts of nature.
        voiced: >
          Nationalism is not the awakening of nations to self-consciousness; it invents nations
          where they do not exist. The nation is an imagined community.
        you: >
          You think nations are recent human inventions, real because people believe in them, but
          not ancient peoples with a natural claim to land.
        because: >
          Before the nineteenth century most Europeans did not speak their "national" language;
          peasants knew village, lord and church. Industrial society needs a mobile, literate
          workforce with a standard culture, so states built nations through schools and armies.
          Seeing this removes the claim that any group's ancient soil overrides present inhabitants.
        against:
          - from: nationalism.ethnic
            text: >
              Modern nations grew on older ethnic cores with their own myths, memories and symbols.
              Modernists cannot explain why people die for something supposedly invented last century.
          - from: nationalism.decolonial
            text: >
              The theory treats colonial nationalisms as copies of a European model. In fact
              colonized peoples built their nation first in an inner domain of religion, family and
              language, before and against the colonial state.
        sources:
          - {author: Ernest Gellner, title: "Nations and Nationalism", year: 1983}
          - {author: Benedict Anderson, title: "Imagined Communities", year: 1983}
          - {author: Eric Hobsbawm, title: "Nations and Nationalism since 1780", year: 1990}
        traditions:
          defining: []
          typical: [marxism.western, liberalism.social]
          contested: [marxism.classical]
          rejects: [nationalism.ethnic, conservatism.national]
        presupposes: []
        excludes: []
        tension: [nation.question.ethnic]
        tags: [method]
        analysis:
          gains: [reserve-army]
          pays: [peasantry]
          mechanism: >
            Used in policy, it removes ancestral title as a ground for claims. That weakens the case
            for excluding migrants by descent, which helps migrant workers held deportable at the
            bottom of the labor market, and weakens indigenous and peasant land claims resting on
            prior occupation, which helps whoever holds the land under the existing state's title.
          drain: none
          law_of_value: none
          disputed: >
            Hobsbawm and Anderson read the construction of nations as tied to print capitalism and
            the state; Partha Chatterjee holds that the modernist account misreads anticolonial
            nations, which formed outside and against the colonial state.

      - id: nation.question.secession-by-consent
        label: Any territory, down to a village, may leave by vote
        claim: >
          Self-determination belongs not to nations but to the inhabitants of any territory, however
          small, who vote to leave a state or join another. The easier it is to leave, the less any
          state can abuse its people.
        voiced: >
          Whenever the inhabitants of a territory, whether a single village, a district or a series
          of districts, make it known by a free plebiscite that they no longer wish to remain in
          their state, their wish must be respected. That is the only way to prevent revolutions,
          civil wars and international wars.
        you: >
          You think any community should be able to vote itself out of a state, because the right to
          leave is the best check on power.
        because: >
          Border wars come from states trying to hold unwilling populations. Cheap exit forces
          governments to compete for residents as firms compete for customers, so many small units
          trading freely with each other are both more peaceful and more prosperous than empires.
        against:
          - from: nationalism.civic
            text: >
              Secession by any village dissolves common citizenship. Rich districts vote to leave
              and take the tax base with them, as the autonomy drives in Santa Cruz, Bolivia and in
              Lombardy show.
          - from: marxism.leninism
            text: >
              Under imperialism micro-secession is a tool. Katanga's secession in 1960, backed by
              Belgian mining interests, aimed to keep the copper away from the Congolese state.
        sources:
          - {author: Ludwig von Mises, title: "Liberalism", year: 1927}
          - {author: Ludwig von Mises, title: "Nation, State, and Economy", year: 1919}
          - {author: Murray N. Rothbard, title: "Nations by Consent: Decomposing the Nation-State", year: 1994}
        traditions:
          defining: [libertarianism.ancap, libertarianism.paleo]
          typical: [liberalism.austrian, libertarianism.minarchist]
          contested: [libertarianism.objectivist]
          rejects: [nationalism.civic, marxism.leninism, conservatism.national]
        presupposes: []
        excludes: []
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, comprador-capital]
          pays: [peripheral-workers, core-workers]
          mechanism: >
            Letting the richest districts exit takes their tax base out of redistribution, and in
            the periphery it lets resource enclaves break from states that tax mining, so owners of
            the resource deal directly with foreign buyers.
          drain: sustains
          law_of_value: extends

      - id: nation.question.democratic-nation
        label: Beyond the nation-state, a democratic nation without a state
        claim: >
          The nation-state, which imposes one people and one language on a territory, is itself the
          problem. Peoples should organize as a "democratic nation": self-governing communes and
          councils across ethnic and religious lines, without a national state.
        voiced: >
          The nation-state is the iron cage of capitalist modernity. The democratic nation is not
          bound to one ethnicity or to borders; it is the free association of communities that
          govern themselves, with women at the center.
        you: >
          You think peoples should govern themselves through local councils that cross ethnic
          lines, rather than each people seeking a state of its own.
        because: >
          Every attempt in the Middle East to give a people its own nation-state created new
          oppressed minorities and new wars. Confederal self-administration lets Kurds, Arabs,
          Syriacs and Turkmen share land, with women's councils and male-female co-chairs, as the
          Autonomous Administration of North and East Syria has practiced since 2014.
        against:
          - from: marxism.ml
            text: >
              A self-administration without its own state survives only under someone's protection.
              Since 2015 the Syrian Kurdish forces have relied on US troops, and their autonomy has
              lasted only as long as that support.
          - from: nationalism.ethnic
            text: >
              The Kurds are among the largest peoples without a state. Renouncing statehood abandons
              a nation denied one since the Treaty of Lausanne in 1923.
        sources:
          - {author: Abdullah Öcalan, title: "Democratic Confederalism", year: 2011}
          - {author: Murray Bookchin, title: "The Next Revolution", year: 2015}
        traditions:
          defining: [anarchism.confederalism]
          typical: [anarchism.communalism]
          contested: [zapatismo]
          rejects: [nationalism.ethnic, marxism.ml]
        presupposes: []
        excludes: [nation.question.ethnic]
        tension: []
        tags: [rojava]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, comprador-capital]
          mechanism: >
            Communal councils and cooperatives took land and oil revenue in northeast Syria out of
            the hands of large landowners and Damascus-linked brokers, but the oil still reaches the
            world market through intermediaries and the territory depends on a core power's army.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Some Marxist-Leninists hold the US alliance makes the project a client; its defenders
            call the alliance tactical and point to the 2019 Turkish offensive as proof it is not.
          consciousness: hegemonic

  - id: nationalism.kinds
    domain: nation
    layer: analysis
    question: Is nationalism one thing, or does it depend on who is oppressing whom?
    plain: Is a colony's nationalism the same as an empire's?
    short: kinds of nationalism
    importance: 2
    region: nation
    positions:
      - id: nationalism.kinds.oppressed-oppressor
        label: The nationalism of the oppressed differs from that of the oppressor
        claim: >
          Nationalism has opposite content depending on position. The nationalism of an oppressed
          nation fights foreign domination and deserves support; the nationalism of an oppressor
          nation defends domination and must be opposed. National liberation must become social
          liberation or a new local elite inherits the colonial state.
        voiced: >
          The nationalism of every oppressed nation has a general democratic content directed
          against oppression, and that content we support without conditions. The nationalism of
          the oppressor nation we fight. And we warn the colonized: if the nation stops at the flag,
          the national bourgeoisie will step into the colonist's shoes.
        you: >
          You think a colony's nationalism and an empire's nationalism are opposites, and you judge
          a nationalism by whether it fights domination or defends it.
        because: >
          The world is divided between a few oppressor nations and a majority of oppressed ones.
          Treating British and Indian nationalism as the same thing erases that division.
          Anticolonial nationalism brought down empires that cosmopolitan principles never touched.
          Fanon and Cabral add the condition: liberation must pass from the nation to the
          peasants and workers, or it ends in a comprador state.
        against:
          - from: marxism.left-communism
            text: >
              The oppressed nation has its own bourgeoisie. Support for national fronts left the
              Indonesian Communist Party tied to Sukarno in 1965, when the army and its allies killed
              hundreds of thousands of its members and supporters.
          - from: conservatism.national
            text: >
              There is no good and bad nationalism by ranking of power. Every nation's loyalty to
              its own is legitimate, the large nation's as much as the small one's.
        sources:
          - {author: V. I. Lenin, title: "The Right of Nations to Self-Determination", year: 1914}
          - {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}
          - {author: Amílcar Cabral, title: "The Weapon of Theory", year: 1966}
        traditions:
          defining: [marxism.leninism, marxism.third-worldism]
          typical: [marxism.ml, marxism.maoism, nationalism.pan-africanism, marxism.african-socialism, marxism.black-radical, nationalism.palestinian]
          contested: [marxism.trotskyism]
          rejects: [marxism.left-communism, conservatism.national, liberalism.classical]
        presupposes: [imperialism.nature.monopoly-stage]
        excludes: [nationalism.kinds.all-bourgeois]
        tension: []
        tags: [anticolonial]
        analysis:
          gains: [peripheral-workers, peasantry]
          pays: [finance-capital, comprador-capital]
          mechanism: >
            Backing nationalist movements against imperial powers targets the state power that
            guarantees concessions, debt service and low export prices in the periphery; Fanon's
            condition aims the movement at the comprador fraction as well.
          drain: reduces
          law_of_value: none
          disputed: >
            Left communists and some Trotskyists hold the gains went to new national bourgeoisies;
            Third Worldists hold anticolonial states did reduce the drain until structural adjustment.
          consciousness: hegemonic

      - id: nationalism.kinds.all-bourgeois
        label: Every nationalism ties workers to their own ruling class
        claim: >
          Every nationalism, of the strong or of the weak, binds workers to their own ruling class.
          National liberation produces new states with new bosses. Workers have no country.
        voiced: >
          The proletariat has no fatherland. National liberation trades a foreign master for a
          native one and drafts the workers into his army. Our enemy is in our own country.
        you: >
          You think nationalism of any kind serves the bosses, whether the nation is powerful or
          colonized.
        because: >
          Nationalism unites classes whose interests are opposed, and in a cross-class bloc the
          class with property leads. In 1914 nationalism destroyed the socialist International in a
          week. Postcolonial history shows national liberation states breaking strikes and peasant
          movements. Only class unity across nations ends exploitation.
        against:
          - from: marxism.leninism
            text: >
              Putting the colonized worker's resistance to the occupier on the same level as the
              colonizer's chauvinism takes the colonizer's side in practice.
          - from: nationalism.pan-africanism
            text: >
              Metropolitan workers' wages and pensions drew partly on the colonies. Telling the
              colonized to wait for class unity with them is telling them to wait forever.
        sources:
          - {author: Karl Marx and Friedrich Engels, title: "Manifesto of the Communist Party", year: 1848}
          - {author: Rudolf Rocker, title: "Nationalism and Culture", year: 1937}
          - {author: Rosa Luxemburg, title: "The Junius Pamphlet", year: 1916}
        traditions:
          defining: [marxism.left-communism]
          typical: [marxism.council-communism, marxism.luxemburgism, anarchism.communist, anarchism.syndicalist, marxism.third-camp]
          contested: []
          rejects: [marxism.ml, marxism.third-worldism, nationalism.pan-africanism, nationalism.nasserism]
        presupposes: [history.motor.class-struggle]
        excludes: [nationalism.kinds.oppressed-oppressor, nationalism.kinds.national-popular-front]
        tension: []
        tags: [internationalism]
        analysis:
          gains: [core-workers]
          pays: [petty-bourgeoisie]
          mechanism: >
            Refusing all national fronts keeps workers' organizations independent of national
            capitalists, but withholding support from anticolonial movements also removes a
            pressure on the imperial states that collect the drain.
          drain: none
          law_of_value: none
          disputed: >
            Third Worldists hold this sustains the drain in practice; left communists reply that
            national states reproduce the same world market and drain within it.

      - id: nationalism.kinds.civic-good-ethnic-bad
        label: Civic patriotism is healthy; ethnic nationalism is dangerous
        claim: >
          Loyalty to shared institutions and equal rights, open to all citizens, fits liberal
          democracy. Loyalty to blood and descent leads to exclusion and violence. The dividing
          line is how membership is defined, not who is powerful.
        voiced: >
          Patriotism attached to a constitution and to equal rights is a civic virtue. Nationalism
          attached to blood is a poison. You can see the line in the burned villages of the Balkans.
        you: >
          You think love of country is fine when it is about shared laws and open to everyone, and
          dangerous when it is about ancestry.
        because: >
          Liberal states need loyalty: people pay taxes and accept election defeats for millions of
          strangers. Attach that loyalty to rights and procedures and it includes newcomers. Attach
          it to descent and it ends in cleansing, as Yugoslavia showed in the 1990s.
        against:
          - from: conservatism.national
            text: >
              Every civic nation has an ethnic core whose language, history and holidays it asks
              everyone to adopt. "Civic" is the name majority nationalism gives itself.
          - from: marxism.leninism
            text: >
              The civic-ethnic line ignores the line between oppressor and oppressed. A civic
              empire is still an empire, and it calls its colonies' resistance "ethnic".
        sources:
          - {author: Michael Ignatieff, title: "Blood and Belonging: Journeys into the New Nationalism", year: 1993}
          - {author: Jürgen Habermas, title: "The Inclusion of the Other", year: 1996}
          - {author: Bernard Yack, title: "The Myth of the Civic Nation", year: 1996, note: "a liberal critique of the distinction, cited for the objection"}
        traditions:
          defining: [nationalism.civic]
          typical: [liberalism.social, liberalism.egalitarian, liberalism.internationalist, liberalism.progressive]
          contested: [conservatism.neo]
          rejects: [nationalism.ethnic, fascism.identitarian]
        presupposes: []
        excludes: []
        tension: [nationalism.kinds.oppressed-oppressor]
        tags: [civic-ethnic]
        analysis:
          gains: [professional-managerial, finance-capital]
          pays: [peripheral-workers]
          mechanism: >
            Ranking nationalisms by membership rules rather than by place in the world system lets
            core states present their own loyalty as civic and the resistance of peripheral nations
            as ethnic, which supplies a justification for sanctions and intervention.
          drain: sustains
          law_of_value: none
          disputed: >
            Some socialists (Habermas's constitutional patriotism has social-democratic defenders)
            hold civic membership is the precondition of any cross-ethnic workers' movement.

      - id: nationalism.kinds.cosmopolitan
        label: All nationalism is a dangerous passion; trade and law should cross borders
        claim: >
          Nationalism of any kind subordinates individuals to an imagined collective and breeds
          war and protectionism. Free trade, the rule of law and institutions above the nation are
          the better path.
        voiced: >
          Nationalism is the tribal instinct in modern dress. Where goods cross borders, armies do
          not. The less borders matter, the less people kill over them.
        you: >
          You think nationalism of any kind is a dangerous emotion, and that trade and law across
          borders make the world safer and richer.
        because: >
          Economic nationalism produced the tariff wars of the 1930s; political nationalism produced
          two world wars. The division of labor across borders makes every nation richer and gives
          each a stake in peace. Individuals, not nations, have rights.
        against:
          - from: conservatism.national
            text: >
              Liberal universalism is an imperial project. It overrides nations' self-government
              through supranational courts and conditions, and calls the resistance populism.
          - from: marxism.third-worldism
            text: >
              Free trade between unequal economies is the channel of the drain. Asking the
              periphery to give up nationalism is asking it to give up protection.
        sources:
          - {author: Karl Popper, title: "The Open Society and Its Enemies", year: 1945}
          - {author: Elie Kedourie, title: "Nationalism", year: 1960}
          - {author: Ludwig von Mises, title: "Nation, State, and Economy", year: 1919}
        traditions:
          defining: [liberalism.classical]
          typical: [liberalism.austrian, liberalism.chicago, liberalism.technocratic, libertarianism.minarchist]
          contested: [liberalism.internationalist]
          rejects: [conservatism.national, nationalism.ethnic, marxism.third-worldism, nationalism.nasserism]
        presupposes: []
        excludes: [nationalism.kinds.virtue-of-nations]
        tension: [development.path.import-substitution]
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Dismantling national protection opens peripheral markets and assets to core firms and
            capital flows, whose terms are set by monopolies of technology and finance.
          drain: sustains
          law_of_value: extends

      - id: nationalism.kinds.virtue-of-nations
        label: A world of independent nations is the best order
        claim: >
          Loyalty to one's own nation, and the principle that each nation governs itself, is the
          best basis for political order. The enemy is imperial universalism, whether liberal,
          communist or religious.
        voiced: >
          The order of free and independent nations is the only one that respects the variety of
          human life. Empires, liberal ones included, promise universal peace and end by imposing a
          single way of life on everyone.
        you: >
          You think the world is best organized as independent nations, each loyal to its own,
          rather than under any universal scheme.
        because: >
          Loyalty runs in widening circles from family to clan to nation. The nation is the largest
          unit whose members feel enough mutual loyalty to govern themselves. Universal schemes have
          no natural limit and justify intervention everywhere; a world of nations limits ambition
          and allows peoples to live differently.
        against:
          - from: liberalism.classical
            text: >
              Someone must define the nation. In practice the state does, and minorities who do not
              fit the national story are the first to pay.
          - from: marxism.leninism
            text: >
              In a core country, national conservatism defends the nation's share of the drain. Its
              "independent nation" keeps bases and banks abroad.
        sources:
          - {author: Yoram Hazony, title: "The Virtue of Nationalism", year: 2018}
          - {author: Yoram Hazony, title: "Conservatism: A Rediscovery", year: 2022}
        traditions:
          defining: [conservatism.national]
          typical: [conservatism.paleo, conservatism.right-populism, conservatism.gaullism, conservatism.postliberal]
          contested: [conservatism.neo, conservatism.burkean]
          rejects: [liberalism.internationalist, liberalism.technocratic, marxism.left-communism]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [nationalism.kinds.cosmopolitan]
        tension: []
        tags: []
        analysis:
          gains: [industrial-capital, petty-bourgeoisie, core-workers]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            In core states it shifts policy from free trade toward tariffs and border control,
            favoring domestic manufacturers and some native workers, while leaving the core's
            military and financial monopolies intact; migrants bear the cost.
          drain: sustains
          law_of_value: regulates
          disputed: >
            In a peripheral state the same principle can defend sovereign development; its effect
            depends on which state applies it.

      - id: nationalism.kinds.ethnopluralism
        label: Every people should keep its own homeland and identity
        claim: >
          Each people has a distinct identity rooted in descent and culture that should be preserved
          in its own homeland. Mass migration and global markets dissolve peoples. The answer is the
          separation of peoples, not a ranking among them.
        voiced: >
          The diversity of peoples is the wealth of humanity. We defend the right to difference of
          every people, ours included, against a global market that would turn all of us into
          interchangeable consumers.
        you: >
          You think each people should keep its own homeland and way of life, and that mixing
          populations through mass migration destroys them.
        because: >
          Liberalism and capitalism homogenize: one market, one consumer culture, one language of
          business. Identity requires boundaries, and a people that becomes a minority in its own
          land loses its self-rule. Separation, unlike older racism, claims no superiority, only
          difference.
        against:
          - from: nationalism.civic
            text: >
              "Separate development of peoples, each in its own homeland" was the official language
              of apartheid and its Bantustans. The right to difference needs a state that sorts
              citizens by descent.
          - from: liberalism.egalitarian
            text: >
              Separation of peoples who already live together can be achieved only by expulsion.
              Its practical program is "remigration", the removal of citizens.
        sources:
          - {author: Alain de Benoist and Charles Champetier, title: "Manifesto for a European Renaissance", year: 1999}
          - {author: Guillaume Faye, title: "Archeofuturism", year: 1998}
        traditions:
          defining: [fascism.identitarian]
          typical: [fascism.third-position, nationalism.ethnic]
          contested: [conservatism.paleo]
          rejects: [nationalism.civic, liberalism.egalitarian, marxism.ml]
        presupposes: []
        excludes: [nationalism.kinds.civic-good-ethnic-bad]
        tension: []
        tags: [far-right]
        analysis:
          gains: [petty-bourgeoisie]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Making residence depend on descent puts migrant workers in deportable status and lowers
            their bargaining power, while native small owners and workers are offered ethnic
            preference in place of higher wages.
          drain: sustains
          law_of_value: none

      - id: nationalism.kinds.national-popular-front
        label: Unite all classes of a dominated nation against imperialism
        claim: >
          In a dominated country the main conflict is between the nation and the foreign powers.
          All classes, national capitalists included, should unite behind a sovereign state to build
          industry, and class conflict must wait.
        voiced: >
          We are for the nation. The worker, the peasant, the soldier and the national industrialist
          are one front against the foreign monopolies. Whoever divides the nation by class does the
          empire's work.
        you: >
          You think a poor country must first unite all its people against foreign domination,
          and settle disputes between rich and poor later.
        because: >
          Foreign capital can outcompete every domestic class, so only a state uniting the whole
          nation can take back the canal, the oil and the mines and build industry behind tariffs.
          Nasser's nationalization of the Suez Canal in 1956, Perón's labor laws and the Bandung
          conference all came from national unity. Splitting the nation by class lets the empire
          divide and rule.
        against:
          - from: marxism.third-worldism
            text: >
              The national bourgeoisie has no vocation to transform the nation; it becomes the
              intermediary of foreign capital. Nasser jailed the communists, Perón's movement turned
              on its own left in 1974, and Sukarno's national front ended in the 1965 massacres.
          - from: liberalism.chicago
            text: >
              Import substitution behind tariffs built protected, inefficient industry, chronic
              inflation and the debt crises of the 1980s.
        sources:
          - {author: Gamal Abdel Nasser, title: "The Philosophy of the Revolution", year: 1954}
          - {author: Sukarno, title: "Nationalism, Islam and Marxism", year: 1926}
          - {author: Mao Zedong, title: "On New Democracy", year: 1940}
        traditions:
          defining: [nationalism.nasserism, nationalism.peronism, nationalism.aprismo]
          typical: [nationalism.baathism, nationalism.kemalism, nationalism.bolivarianism, nationalism.three-principles, nationalism.developmental-state, marxism.arab-socialism]
          contested: [marxism.maoism, marxism.african-socialism]
          rejects: [marxism.left-communism, marxism.trotskyism, liberalism.chicago]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [nationalism.kinds.all-bourgeois]
        tension: []
        tags: [anticolonial, developmentalism]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie, core-workers]
          pays: [comprador-capital, landed-capital, finance-capital]
          mechanism: >
            The cross-class state nationalized foreign assets and broke up large estates, moving
            rents from foreign capital and old landlords to a state-led national bourgeoisie and to
            organized workers, at the price of banning independent unions and parties.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Dependency theorists (Frank) held national bourgeoisies too tied to imperialism to lead;
            Amin held these projects were real advances that stopped short of delinking. Here core-workers means the organized urban workers of the dominated country.
          consciousness: hegemonic

  - id: nation.belonging
    domain: nation
    layer: horizon
    question: Who belongs to the nation?
    plain: What makes someone one of us?
    short: national belonging
    importance: 2
    region: nation
    positions:
      - id: nation.belonging.citizenship
        label: Whoever is born here or naturalizes belongs
        claim: >
          Anyone born on the territory or naturalized as a citizen belongs to the nation, fully and
          equally. Belonging is a legal and political bond, not a matter of origin or culture.
        voiced: >
          The republic knows only citizens. Born here, you are one of us; sworn in, you are one of
          us. No one checks your grandparents.
        you: >
          You think anyone who is born here or becomes a citizen belongs, full stop.
        because: >
          Any other test creates two classes of citizen, with the second class open to suspicion and
          expulsion. Birthright citizenship and open naturalization turn migrants' children into
          equal members within a generation, which is how immigrant nations have held together.
        against:
          - from: conservatism.national
            text: >
              A passport is not a nation. Paper citizenship without shared language, history and
              loyalty produces parallel societies that share a territory and nothing else.
          - from: nationalism.indigenous-sovereignty
            text: >
              Citizenship in the settler state was imposed on indigenous nations who never consented
              to join it. Equal membership in the conqueror's nation is not belonging.
        sources:
          - {author: Ernest Renan, title: "What Is a Nation?", year: 1882}
          - {author: Rogers Brubaker, title: "Citizenship and Nationhood in France and Germany", year: 1992}
        traditions:
          defining: [nationalism.civic]
          typical: [liberalism.republican, liberalism.social, liberalism.progressive, socdem.democratic-socialism]
          contested: [liberalism.classical]
          rejects: [nationalism.ethnic, fascism.identitarian, nationalism.hindutva]
        presupposes: []
        excludes: [nation.belonging.descent]
        tension: []
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: []
          mechanism: >
            Automatic citizenship for those born on the territory ends the deportable status of
            migrant families after one generation, which raises their bargaining power and removes
            employers' supply of rightless labor.
          drain: softens
          law_of_value: none

      - id: nation.belonging.descent
        label: Belonging passes by descent
        claim: >
          Belonging to the nation passes by descent from members of the nation. Those of the
          nation's blood abroad belong and may return; those of other descent living here may be
          residents, but they are not of the nation.
        voiced: >
          A nation is a family of families. Our people scattered abroad are still our people and
          may come home. Living here does not make a stranger kin.
        you: >
          You think belonging to the nation is inherited, and that people of the nation's stock
          abroad belong more than strangers who live here.
        because: >
          Nations persist through generations, and their members feel obligations to kin they have
          never met. Diaspora return laws let peoples scattered by war and persecution come home.
          A state that will not say who its people are cannot protect them.
        against:
          - from: nationalism.civic
            text: >
              Descent rules made generations of Turkish workers' children in Germany foreigners in
              the only country they knew, until the law changed in 2000.
          - from: marxism.classical
            text: >
              Blood law divides workers in the same workplace into members and guests, and the guests
              are always cheaper.
        sources:
          - {author: Johann Gottlieb Fichte, title: "Addresses to the German Nation", year: 1808}
          - {author: Rogers Brubaker, title: "Citizenship and Nationhood in France and Germany", year: 1992}
        traditions:
          defining: [nationalism.ethnic]
          typical: [fascism.identitarian, nationalism.zionism-revisionist, religious.buddhist-nationalism]
          contested: [conservatism.national, nationalism.zionism-labor]
          rejects: [nationalism.civic, liberalism.progressive, marxism.classical]
        presupposes: []
        excludes: [nation.belonging.citizenship]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie, landed-capital]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Keeping residents of other descent out of citizenship keeps them deportable and without
            votes, which holds down their wages and lets the majority's property owners keep land
            and office within the group.
          drain: sustains
          law_of_value: none

      - id: nation.belonging.assimilation
        label: Anyone can belong who takes on the language, culture and loyalty
        claim: >
          Anyone can belong regardless of origin, but belonging means adopting the nation's
          language, customs and loyalty. A nation can absorb newcomers only if they become part of
          it rather than staying apart.
        voiced: >
          Come from anywhere; become one of us. Learn the language, honor the flag, keep the law.
          That is the deal, and it is a generous one.
        you: >
          You think newcomers belong once they learn the language and adopt the way of life, and
          that expecting this is fair.
        because: >
          A common language and culture are what let strangers trust each other, argue in the same
          terms and share a welfare state. Assimilation gave the children of immigrants equal
          footing in the past; letting groups stay apart leaves them stuck at the margins.
        against:
          - from: liberalism.progressive
            text: >
              "Become like us" in practice means "stop being yourself", and the bar keeps moving for
              those whose skin or faith marks them as different whatever they adopt.
          - from: nationalism.indigenous-sovereignty
            text: >
              Assimilation was the official policy behind residential and boarding schools that took
              indigenous children from their families to "kill the Indian, save the man".
        sources:
          - {author: Samuel P. Huntington, title: "Who Are We? The Challenges to America's National Identity", year: 2004}
          - {author: Ernest Renan, title: "What Is a Nation?", year: 1882}
        traditions:
          defining: [nationalism.kemalism]
          typical: [conservatism.national, conservatism.gaullism, nationalism.civic, commonsense.look-after-your-own]
          contested: [liberalism.republican, conservatism.burkean]
          rejects: [liberalism.progressive, communitarianism, nationalism.indigenous-sovereignty]
        presupposes: []
        excludes: [nation.belonging.multicultural]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial, petty-bourgeoisie]
          pays: [reserve-army]
          mechanism: >
            Making belonging conditional on cultural conformity gives the majority's institutions,
            schools, employers and police, discretion to judge who has assimilated, and leaves
            newcomers' rights dependent on that judgment.
          drain: none
          law_of_value: none

      - id: nation.belonging.multicultural
        label: You can belong and keep your own culture
        claim: >
          Belonging to the nation is compatible with keeping a distinct culture, faith and language.
          Minority groups may need specific rights, in schools, language and representation, to
          belong as equals.
        voiced: >
          Equal citizenship does not mean identical citizens. A fair society recognizes that its
          minorities are part of it as they are, not as the majority would like them to be.
        you: >
          You think people can fully belong while keeping their own culture, and that the nation
          should make room for that.
        because: >
          The state is never culturally neutral: it picks a language, holidays and a history.
          Minorities who must give up their culture to belong are paying a price the majority never
          pays. Group-specific rights correct for that, and secure identities make loyal citizens.
        against:
          - from: nationalism.civic
            text: >
              Group rights fix people in the group their parents belonged to and hand power to
              community leaders, often conservative clerics, who speak for them.
          - from: marxism.classical
            text: >
              Managing workers as ethnic communities with brokers and grants divides them by culture
              and leaves the class question untouched.
        sources:
          - {author: Will Kymlicka, title: "Multicultural Citizenship", year: 1995}
          - {author: Bhikhu Parekh, title: "Rethinking Multiculturalism", year: 2000}
        traditions:
          defining: [communitarianism]
          typical: [liberalism.progressive, liberalism.social, socdem.third-way]
          contested: [liberalism.egalitarian, marxism.austromarxism]
          rejects: [nationalism.kemalism, conservatism.national, fascism.identitarian]
        presupposes: []
        excludes: [nation.belonging.assimilation]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial, petty-bourgeoisie]
          pays: []
          mechanism: >
            Recognizing groups through funded community organizations and representation creates
            posts for minority professionals and brokers while leaving the labor market and
            housing, where minority workers are concentrated at the bottom, unchanged.
          drain: none
          law_of_value: none
          disputed: >
            Some antiracist socialists hold that recognition rights were won by working-class
            minority struggles and protect those workers from harassment at work and in school.

      - id: nation.belonging.class-not-nation
        label: Workers have no country; belonging is to the class
        claim: >
          The question of who belongs to the nation is the ruling class's question. Workers of every
          origin share one position, and their belonging is to each other across borders.
        voiced: >
          The workers have no country. We cannot take from them what they have not got. A worker
          from Lagos and a worker from Leeds have more in common than either has with their own boss.
        you: >
          You think working people from different countries belong together more than people of
          different classes in the same nation do.
        because: >
          Nations divide workers who face the same employers and the same market. Every argument
          over who belongs is an argument over who may be paid less and deported. Unity across
          origins is the only belonging that wins anything.
        against:
          - from: conservatism.national
            text: >
              Workers do have a country: its welfare state, its language and its laws protect them,
              and they know it. Internationalism is a creed for those who can move.
          - from: marxism.third-worldism
            text: >
              The worker in Leeds and the worker in Lagos sit on opposite sides of the drain. Unity
              must begin by recognizing that, not by declaring it.
        sources:
          - {author: Karl Marx and Friedrich Engels, title: "Manifesto of the Communist Party", year: 1848}
          - {author: Karl Marx, title: "Letter to Sigfrid Meyer and August Vogt", year: 1870}
        traditions:
          defining: [marxism.classical]
          typical: [marxism.left-communism, marxism.trotskyism, anarchism.syndicalist, anarchism.communist, marxism.council-communism]
          contested: [marxism.ml]
          rejects: [conservatism.national, nationalism.ethnic, fascism.identitarian]
        presupposes: [class.concept.relation-to-production]
        excludes: [nation.belonging.descent]
        tension: []
        tags: [internationalism]
        analysis:
          gains: [core-workers, peripheral-workers, reserve-army]
          pays: [industrial-capital]
          mechanism: >
            Refusing national divisions removes employers' ability to pay workers differently by
            origin and status, and allows common organizing across migrant and native workers.
          drain: reduces
          law_of_value: none
          disputed: >
            Third Worldists hold that core workers' share in the drain makes declared unity hollow
            until it is confronted.
          consciousness: class-economic

      - id: nation.belonging.ummah
        label: The believer's true community is the community of faith
        claim: >
          A Muslim's first belonging is to the ummah, the worldwide community of believers. Nations
          and their borders, many drawn by colonial powers, are secondary or illegitimate divisions
          of one community.
        voiced: >
          Our nationality is our faith. The borders between Muslims were drawn by Sykes and Picot.
          A believer in Jakarta and a believer in Dakar are one body; when one part aches, the whole
          body feels it.
        you: >
          You think your deepest belonging is to the community of your faith worldwide, more than
          to any nation.
        because: >
          The nation-state came to the Muslim world with colonial rule and divided one community
          into rival states run by Westernized elites. Islam teaches brotherhood across race and
          language. Belonging by faith is chosen and universal, unlike belonging by blood or soil.
        against:
          - from: nationalism.baathism
            text: >
              The Arab nation is a historical reality of language and culture shared by Muslims and
              Christians. Making faith the bond divides Arabs and hands politics to clerics.
          - from: religious.post-islamism
            text: >
              Muslims live as citizens of real states, often as minorities. Treating the ummah as a
              political community gives governments a pretext to treat Muslim citizens as disloyal.
        sources:
          - {author: Sayyid Qutb, title: "Milestones", year: 1964}
          - {author: Abul A'la Maududi, title: "The Islamic Law and Constitution", year: 1955}
        traditions:
          defining: [religious.islamism-brotherhood]
          typical: [religious.salafi-jihadism, religious.salafism-quietist, religious.islamism-khomeinist]
          contested: [religious.islamic-socialism]
          rejects: [nationalism.baathism, nationalism.kemalism, nationalism.civic, religious.post-islamism]
        presupposes: []
        excludes: [nation.belonging.descent]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie, professional-managerial]
          pays: []
          mechanism: >
            A faith-based belonging gives religious scholars and the pious merchant and professional
            strata that lead Islamist movements authority across borders, while leaving property
            relations within each state largely untouched.
          drain: none
          law_of_value: none
          disputed: >
            Some scholars (Gilbert Achcar) read Islamist movements as petty-bourgeois; others stress
            their mass base among the urban poor through charity networks.

      - id: nation.belonging.civilizational
        label: Those who hold this land as both fatherland and holy land belong
        claim: >
          The nation is a civilization rooted in a sacred land. Full belonging goes to those for whom
          the land is both the land of their ancestors and the land of their faith. Others may live as
          citizens, but their loyalty is in question.
        voiced: >
          A Hindu is one who regards this land from the Indus to the seas as both his fatherland and
          his holy land. Those whose holy land is elsewhere must make this civilization their own.
        you: >
          You think the nation is a civilization tied to a sacred land and faith, and that full
          belonging means making that inheritance your own.
        because: >
          Nations are not contracts but civilizations, carried by a culture formed over millennia on
          a particular soil. Centuries of conquest and conversion broke that civilization's unity.
          Recovering it means asking all citizens to own its heritage, not erasing it to please
          minorities.
        against:
          - from: nationalism.ambedkarite
            text: >
              If Hindu Raj becomes a fact, it will be the greatest calamity for this country; it is
              a menace to liberty, equality and fraternity. Its "civilization" is the caste order.
          - from: nationalism.civic
            text: >
              Putting the loyalty of Muslim and Christian citizens in question turns minorities into
              suspects; it was the logic of the 2002 Gujarat killings and of citizenship tests aimed at
              Muslims.
        sources:
          - {author: V. D. Savarkar, title: "Essentials of Hindutva", year: 1923}
          - {author: M. S. Golwalkar, title: "Bunch of Thoughts", year: 1966}
        traditions:
          defining: [nationalism.hindutva]
          typical: [religious.buddhist-nationalism, nationalism.eurasianism]
          contested: [conservatism.national]
          rejects: [nationalism.ambedkarite, nationalism.civic, nationalism.gandhian, marxism.ml]
        presupposes: []
        excludes: [nation.belonging.citizenship]
        tension: []
        tags: [india]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Making faith the line of loyalty unites upper-caste traders and owners with lower-caste
            Hindus against religious minorities, diverting wage and land conflict into communal
            conflict while the state favors large domestic and foreign investors.
          drain: none
          law_of_value: extends
          disputed: >
            Some analysts stress Hindutva's mass base among lower castes and the poor through
            welfare delivery; others read it as the political form of Indian monopoly capital.
