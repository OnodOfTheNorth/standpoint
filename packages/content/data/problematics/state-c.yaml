problematics:
  - id: law.nature
    domain: state
    layer: analysis
    question: What is law?
    plain: When something is "the law," what makes it so, and whom does it serve?
    short: the nature of law
    importance: 2
    region: state
    positions:
      - id: law.nature.rule-of-law
        label: Law is a framework of general rules that binds rulers too
        claim: Law is a set of general, public and stable rules that apply equally to officials and citizens; its value is that it limits arbitrary power.
        voiced: >
          Stripped of all technicalities, the rule of law means that government in all its actions is bound by rules fixed
          and announced beforehand, which make it possible to foresee how authority will use its coercive powers. No one is
          above the law, and no one is punished except for a distinct breach of it established in the ordinary courts.
        you: You see law as clear general rules that bind those in power as much as everyone else.
        because: >
          Without general rules known in advance, every citizen depends on the goodwill of whoever holds power. Law that is
          public, prospective, consistent and applied by independent courts lets people plan their lives and resist officials
          who overstep. These formal virtues are not neutral decoration; they are what distinguishes government by law from
          government by command, and they protect the weak more than the strong.
        against:
          - from: marxism.classical
            text: >
              Equal rules applied to unequal owners preserve the inequality. The form of law, equal parties exchanging under
              contract, is the form of commodity exchange, and it hides the compulsion behind the labor contract.
          - from: conservatism.reactionary
            text: >
              Rules do not apply themselves. In the decisive case someone decides, and the liberal fiction of impersonal law only
              hides who that is.
        sources:
          - {author: A. V. Dicey, title: Introduction to the Study of the Law of the Constitution, year: 1885}
          - {author: Lon L. Fuller, title: The Morality of Law, year: 1964}
          - {author: Friedrich A. Hayek, title: The Road to Serfdom, year: 1944, note: "ch. 6, Planning and the Rule of Law"}
        traditions:
          defining: [liberalism.classical, liberalism.social]
          typical: [liberalism.austrian, liberalism.ordoliberal, liberalism.egalitarian, conservatism.christian-democracy, liberalism.internationalist, socdem.nordic]
          contested: [conservatism.burkean, socdem.democratic-socialism]
          rejects: [marxism.ml, conservatism.reactionary, fascism.italian]
        presupposes: []
        excludes: [law.nature.sovereign-decision]
        tension: [law.nature.class-will]
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [reserve-army]
          mechanism: >
            General, predictable rules protect contracts and property titles against both rulers and majorities, which lowers
            investors' risk; they also protect individuals against arbitrary arrest, a gain shared by all classes.
          drain: sustains
          law_of_value: extends
          disputed: E. P. Thompson argued, against many Marxists, that the rule of law is a real limit on power and an unqualified human good, not merely a mask.

      - id: law.nature.positive-command
        label: Law is whatever the recognized authority lays down
        claim: Law is whatever is laid down by the recognized law-making authority through its accepted procedures; whether a law is moral is a separate question.
        voiced: >
          The existence of law is one thing; its merit or demerit is another. A law is a command of the sovereign, or a rule
          recognized by the system's rule of recognition. Bad laws are still law. Keep the two questions apart and you can
          criticize the law clearly.
        you: You think a law is a law because the proper authority made it, whether or not it is just.
        because: >
          Mixing law and morality confuses both. If unjust laws are "not law," judges can override legislation by their own
          moral views, and citizens cannot tell what the law actually requires. Seeing law as a human-made system lets
          reformers say plainly: this is the law, and it is bad, so change it. That clarity drove Bentham's reforms of a
          chaotic common law.
        against:
          - from: conservatism.cst
            text: >
              The Nazi state had valid laws by every procedural test. A theory that cannot say those laws lacked the force of law
              has given up on law's purpose.
          - from: marxism.classical
            text: >
              Asking only who issued a command never asks why it says what it says. Positivism describes the machinery and is
              silent about the class that built it.
        sources:
          - {author: John Austin, title: The Province of Jurisprudence Determined, year: 1832}
          - {author: H. L. A. Hart, title: The Concept of Law, year: 1961}
          - {author: Hans Kelsen, title: Pure Theory of Law, year: 1934}
        traditions:
          defining: [liberalism.utilitarian]
          typical: [liberalism.technocratic, liberalism.social]
          contested: [liberalism.classical, socdem.fabian]
          rejects: [conservatism.cst, conservatism.integralism, religious.islamism-brotherhood]
        presupposes: []
        excludes: [law.nature.natural-law, law.nature.divine-law]
        tension: []
        tags: []
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Treating law as whatever the authority lays down makes its content depend wholly on who controls legislation; the
            doctrine itself favors legal professionals and administrators, who become the interpreters of a self-contained
            system.
          drain: none
          law_of_value: none

      - id: law.nature.natural-law
        label: An unjust law is no law at all
        claim: Human law is real law only when it agrees with a higher moral law knowable by reason; a law that violates it has no claim to obedience.
        voiced: >
          An unjust law is no law at all. Every human law has just so much of the nature of law as is derived from the law of
          nature. One has a moral responsibility to disobey unjust laws, openly, lovingly, and with a willingness to accept
          the penalty.
        you: You believe laws must answer to a higher moral law, and that an unjust law loses its claim on you.
        because: >
          If law were only command, the edicts of a tyrant would bind as much as a just constitution. Every movement that
          defied unjust law, abolitionists, resisters of occupation, the civil rights movement, appealed to a law above the
          state's. Reason can know basic goods (life, family, truth, community) and the law exists to serve them.
        against:
          - from: liberalism.utilitarian
            text: >
              Everyone thinks the laws they dislike are "unjust." If each person decides which laws are real, law dissolves into
              private conscience.
          - from: marxism.classical
            text: >
              "Natural law" has blessed slavery, serfdom and private property in turn. Its content is always the ruling morality
              of the age projected onto nature.
        sources:
          - {author: Thomas Aquinas, title: Summa Theologiae, year: "c. 1270", note: "I-II, q. 95, a. 2"}
          - {author: Martin Luther King Jr., title: Letter from Birmingham Jail, year: 1963}
          - {author: John Finnis, title: Natural Law and Natural Rights, year: 1980}
        traditions:
          defining: [conservatism.cst, conservatism.integralism]
          typical: [conservatism.christian-democracy, conservatism.traditionalist, religious.christian-socialism, religious.liberation-theology, conservatism.evangelical-right]
          contested: [liberalism.classical, nationalism.gandhian]
          rejects: [liberalism.utilitarian, marxism.classical, conservatism.reactionary]
        presupposes: []
        excludes: [law.nature.positive-command]
        tension: []
        tags: [religion]
        analysis:
          gains: [petty-bourgeoisie, core-workers]
          pays: []
          mechanism: >
            Measuring law against a higher moral law gives movements a ground to defy statutes, as the civil rights movement did
            with segregation; its content depends on who interprets natural law, and Church interpretation has backed both
            labor rights and limits on family and sexual liberty.
          drain: none
          law_of_value: regulates

      - id: law.nature.class-will
        label: Law is the will of the ruling class made into rules for all
        claim: Law expresses and secures the dominant relations of production; its central institutions, property and contract, are the legal form of capitalist exchange.
        voiced: >
          Your jurisprudence is but the will of your class made into a law for all, a will whose essential character and
          direction are determined by the economic conditions of existence of your class. The legal subject is the commodity
          owner; the contract is the market in robes.
        you: You see law as the rules of the owning class, written to look like rules for everyone.
        because: >
          Look at the core of any legal code: property, contract, inheritance, the police power. They secure the existing
          distribution of ownership and make the sale of labor look like an exchange between equals. Pashukanis showed that
          the very form of law, abstract equal persons bearing rights, grows out of commodity exchange. Law changes when the
          relations of production change, not before.
        against:
          - from: liberalism.classical
            text: >
              Laws against murder, fraud and theft protect the poor more than the rich. Calling all law class will makes it
              impossible to explain why workers fight so hard to use it.
          - from: marxism.western
            text: >
              Too crude. Law also binds rulers, as Thompson showed in eighteenth-century England, and the ruled have won real
              ground inside it. The legal form is contested terrain, not simply a weapon.
        sources:
          - {author: Karl Marx and Friedrich Engels, title: The Communist Manifesto, year: 1848}
          - {author: Evgeny Pashukanis, title: The General Theory of Law and Marxism, year: 1924}
        traditions:
          defining: [marxism.classical, marxism.leninism, marxism.ml]
          typical: [marxism.maoism, marxism.trotskyism, marxism.left-communism, anarchism.communist]
          contested: [marxism.western, marxism.structural]
          rejects: [liberalism.classical, conservatism.cst, liberalism.utilitarian]
        presupposes: [state.nature.class-instrument]
        excludes: [law.nature.rule-of-law]
        tension: [law.nature.contested-terrain]
        tags: []
        analysis:
          gains: [core-workers, peripheral-workers, peasantry]
          pays: [finance-capital, industrial-capital, landed-capital]
          mechanism: >
            Treating law as class will removes the legitimacy of property and contract law in the eyes of the dispossessed,
            which supports occupations, strikes in breach of injunctions and expropriation without full compensation.
          drain: reduces
          law_of_value: suspends
          disputed: Pashukanis held that law as such would wither with commodity exchange; Vyshinsky and later Soviet jurists held socialism has its own law. Thompson rejected the reduction of law to class will.

      - id: law.nature.contested-terrain
        label: Law serves power but also binds it, so the weak can fight inside it
        claim: Law is shaped by those who rule, but to work as law it must appear just and bind rulers too, which gives the ruled real ground to fight on.
        voiced: >
          The law may be a mediation of class relations, but it is not only that. If the law is evidently partial and unjust,
          it will mask nothing and legitimize nothing. The rule of law itself, imposing effective inhibitions upon power, seems
          to me an unqualified human good.
        you: You see law as made by the powerful but binding them too, so working people can use it as well as suffer it.
        because: >
          Ruling classes could not simply rewrite law at will; to legitimize their rule they had to submit to their own forms,
          and the poor used those forms against them. Labor law, civil rights rulings and land claims show the same: courts
          are hostile ground, but ground that can be won. Abandoning law to the rulers leaves the ruled without one of their
          weapons.
        against:
          - from: marxism.leninism
            text: >
              Courts give ground only where struggle outside them has already shifted power. Fighting on legal terrain trains
              movements to wait for judges.
          - from: liberalism.classical
            text: >
              Treating the rule of law as a tactical terrain means respecting it only when it pays. A law each side uses only
              when convenient is no rule of law.
        sources:
          - {author: E. P. Thompson, title: "Whigs and Hunters: The Origin of the Black Act", year: 1975}
          - {author: Douglas Hay and others, title: "Albion's Fatal Tree: Crime and Society in Eighteenth-Century England", year: 1975}
        traditions:
          defining: [marxism.western]
          typical: [socdem.democratic-socialism, socdem.labourism, marxism.gramscian, marxism.black-radical]
          contested: [marxism.structural, liberalism.republican, nationalism.indigenous-sovereignty]
          rejects: [marxism.left-communism, conservatism.reactionary]
        presupposes: []
        excludes: []
        tension: [law.nature.class-will]
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, landed-capital]
          mechanism: >
            Using legal forms against the powerful wins labor protections, tenant rights and land claims through litigation; it
            also channels movements into legal procedure, where lawyers and professional staff gain influence over strategy.
          drain: none
          law_of_value: regulates
          consciousness: class-economic

      - id: law.nature.inherited-custom
        label: Law is grown, not made; it is the wisdom of generations
        claim: Real law grows out of custom and the accumulated decisions of courts over generations; it is discovered more than invented, and legislators should change it carefully.
        voiced: >
          Law is older than legislation. The common law is the collected reason of ages, combined and refined by the
          experience of generations. Rules that emerged spontaneously, tested in countless disputes, contain more knowledge
          than any legislature could possess.
        you: You see law as wisdom built up over generations, to be changed cautiously rather than drafted from scratch.
        because: >
          Order in society was not designed by anyone. Rules of property, contract and wrongdoing developed as judges settled
          concrete disputes, keeping what worked. Legislation that tries to redesign society from above destroys knowledge
          embedded in those rules and replaces it with the plans of whoever holds power this year.
        against:
          - from: liberalism.utilitarian
            text: >
              The common law was a maze of fictions that served lawyers and landowners. "Accumulated wisdom" is often
              accumulated privilege.
          - from: nationalism.decolonial
            text: >
              Whose custom? In the colonies the common law arrived with the conqueror and erased the customary law of the
              colonized, then called itself the wisdom of the ages.
        sources:
          - {author: Friedrich A. Hayek, title: "Law, Legislation and Liberty, Volume 1: Rules and Order", year: 1973}
          - {author: William Blackstone, title: Commentaries on the Laws of England, year: 1765}
          - {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}
        traditions:
          defining: [conservatism.burkean, liberalism.austrian]
          typical: [conservatism.traditionalist, conservatism.fusionism, conservatism.paleo]
          contested: [libertarianism.ancap, liberalism.classical, religious.confucian]
          rejects: [liberalism.utilitarian, marxism.ml, nationalism.decolonial]
        presupposes: []
        excludes: [law.nature.sovereign-decision]
        tension: [law.nature.positive-command]
        tags: []
        analysis:
          gains: [landed-capital, finance-capital, industrial-capital]
          pays: [core-workers, reserve-army]
          mechanism: >
            Treating property and contract rules as grown wisdom places them beyond legislative redesign, so democratic
            majorities that want to change ownership or labor rules face the charge of destroying spontaneous order.
          drain: sustains
          law_of_value: extends

      - id: law.nature.divine-law
        label: The true law is God's; human rules only apply it
        claim: The true law is given by God through revelation, and human legislation is legitimate only as an application of it within the space it leaves open.
        voiced: >
          Legislation belongs to God. The Shari'ah is a complete scheme of life; it covers worship, family, trade and the
          state. Human beings may legislate in matters God left open, by consultation, but they may not permit what He
          forbade or forbid what He permitted.
        you: You believe the true law is God's, and human lawmaking is legitimate only within it.
        because: >
          Human legislators serve their own interests and change their laws with every shift of power. A law given by God is
          above every party and class, binding rulers and ruled alike. For centuries Islamic jurists, independent of rulers,
          developed the law and checked the powerful; modern secular codes imposed by colonial and nationalist states broke that
          tradition.
        against:
          - from: religious.post-islamism
            text: >
              What is codified as Shari'ah is fiqh, human jurisprudence, fallible and historical. Calling it God's law places
              the jurists' opinions beyond debate.
          - from: liberalism.classical
            text: >
              A law that cannot be changed by those who live under it is not a law of free people. In practice divine law means
              rule by its interpreters.
        sources:
          - {author: Abul A'la Mawdudi, title: The Islamic Law and Constitution, year: 1955}
          - {author: Wael B. Hallaq, title: "The Impossible State: Islam, Politics, and Modernity's Moral Predicament", year: 2013}
        traditions:
          defining: [religious.islamism-brotherhood, religious.islamism-khomeinist, religious.salafism-quietist]
          typical: [religious.salafi-jihadism]
          contested: [religious.religious-zionism, conservatism.integralism, feminism.islamic]
          rejects: [religious.post-islamism, liberalism.classical, marxism.ml, liberalism.utilitarian]
        presupposes: [rights.basis.revealed-law]
        excludes: [law.nature.positive-command]
        tension: []
        tags: [religion, global-south]
        analysis:
          gains: [petty-bourgeoisie, landed-capital]
          pays: [finance-capital]
          mechanism: >
            Making revealed law supreme hands jurists authority over family, inheritance and commerce; it bans interest and
            mandates alms but protects private property and inheritance, so religious scholars and merchants gain standing
            while ownership stays private.
          drain: none
          law_of_value: regulates
          disputed: Hallaq argues the modern state and sharia are structurally incompatible, so "Islamic states" are modern states using sharia's name; Islamists reject this.

      - id: law.nature.sovereign-decision
        label: Behind every legal order stands a decision, not a norm
        claim: Every legal order rests on a sovereign decision that no rule can contain; who decides when the rules run out is who really rules.
        voiced: >
          Sovereign is he who decides on the exception. All law is situational law. The norm presupposes a normal situation,
          and someone must decide whether that situation exists. The liberal dream of the rule of law without a ruler is the
          dream of a decision that nobody makes.
        you: You think that behind every legal system someone has the final say when the rules run out, and that person is who really rules.
        because: >
          Rules cannot interpret, apply or suspend themselves. In any real crisis, a coup, a general strike, a war, the
          constitution says nothing decisive and someone must act. Liberal legalism pretends this moment does not exist and so
          leaves it to whoever seizes it. Seeing it clearly is the first step to deciding responsibly. Weimar's collapse showed
          what happens when no one is willing to decide.
        against:
          - from: liberalism.classical
            text: >
              Schmitt's decisionism led directly to his service to the Nazi state. A theory that places the decider above law
              has no defense against the worst decider.
          - from: marxism.classical
            text: >
              The "decision" is not made by a lonely sovereign but by class forces. Schmitt mystifies which class's emergency is
              declared and against whom.
        sources:
          - {author: Carl Schmitt, title: Political Theology, year: 1922}
          - {author: Carl Schmitt, title: Legality and Legitimacy, year: 1932}
        traditions:
          defining: [conservatism.reactionary]
          typical: [fascism.italian, fascism.nazism, fascism.neoreaction]
          contested: [conservatism.national, conservatism.postliberal, socdem.left-populism]
          rejects: [liberalism.classical, liberalism.social, conservatism.burkean, anarchism.communist]
        presupposes: []
        excludes: [law.nature.rule-of-law, law.nature.inherited-custom]
        tension: []
        tags: [schmitt]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers, reserve-army]
          mechanism: >
            Placing the decision above law licenses executives to suspend legal protections in declared emergencies; in Weimar
            and after, emergency decrees were used against strikes and the workers' parties while property law stayed in force.
          drain: none
          law_of_value: none
          disputed: Left readers of Schmitt (Mouffe) use his account of the political against liberal consensus without his authoritarian conclusions.

  - id: police.role
    domain: state
    layer: analysis
    question: What are the police for?
    plain: When the police show up, who are they there to protect?
    short: the police
    importance: 2
    region: state
    positions:
      - id: police.role.public-safety
        label: Police protect the public and should be made accountable
        claim: Police exist to protect people from crime and violence; their failures are problems of training, oversight and accountability that reform can fix.
        voiced: >
          When someone breaks into your home, you call the police. Most officers do a hard job decently. Bad cops should be
          fired and prosecuted, training improved, body cameras worn. Fix the police; don't abandon the people who need them
          most.
        you: You see the police as there to protect people, and you want bad officers held to account and the force improved.
        because: >
          Crime falls hardest on poor neighborhoods, and surveys there show residents want effective policing, not less of it.
          Where policing has been reformed with oversight, community relationships and limits on force, both crime and abuse
          have fallen. The alternative to accountable police is not no police but private security for the rich and vigilantes
          for everyone else.
        against:
          - from: marxism.black-radical
            text: >
              Reform has been tried for a century: commissions, training, cameras. The killings continue because the institution
              does what it was built to do: control the poor and the racialized.
          - from: conservatism.national
            text: >
              Endless oversight and second-guessing make officers afraid to act, and crime rises in the communities that can least
              afford it.
        sources:
          - {author: "President's Task Force on 21st Century Policing", title: Final Report of the President's Task Force on 21st Century Policing, year: 2015}
          - {author: Tom R. Tyler, title: Why People Obey the Law, year: 1990}
        traditions:
          defining: [liberalism.social, liberalism.progressive]
          typical: [socdem.third-way, socdem.nordic, liberalism.technocratic, conservatism.christian-democracy]
          contested: [socdem.labourism, liberalism.egalitarian]
          rejects: [anarchism.communist, marxism.black-radical, libertarianism.ancap]
        presupposes: [state.nature.neutral-arbiter]
        excludes: [police.role.class-repression]
        tension: [police.role.order-maintenance]
        tags: []
        analysis:
          gains: [professional-managerial, petty-bourgeoisie, core-workers]
          pays: [reserve-army]
          mechanism: >
            Treating policing as a public service to be reformed keeps the institution and its budget while adding oversight
            bodies; enforcement continues to concentrate on poor neighborhoods and street economies, where the reserve army
            lives.
          drain: none
          law_of_value: none

      - id: police.role.order-maintenance
        label: Police hold back disorder; without them everything else collapses
        claim: Police maintain the public order that every other good depends on; they deserve support, and disorder left unchecked breeds crime.
        voiced: >
          The thin blue line stands between civilization and chaos. A broken window left unrepaired tells everyone no one
          cares, and soon all the windows are broken. Support the police. People who riot, loot and threaten others should
          meet the full force of the law.
        you: You see the police as the line between order and chaos and want them backed firmly.
        because: >
          Order is the first public good; the poor and the elderly suffer first when it breaks down. Small disorders signal
          that no one is in control and invite worse crime. Societies that lose confidence in their police see shops close,
          families leave and the vulnerable become prey. Policing is not oppression; it is the condition of a shared life.
        against:
          - from: liberalism.social
            text: >
              Broken-windows enforcement filled jails with people stopped for minor offenses, almost all poor and Black or
              Latino, and the evidence that it cut serious crime is weak.
          - from: anarchism.communist
            text: >
              Whose order? The police protected order against the strikers, the tenants, the civil rights marchers. Order means
              the existing distribution of property and power.
        sources:
          - {author: James Q. Wilson and George L. Kelling, title: "Broken Windows: The Police and Neighborhood Safety", year: 1982}
          - {author: James Q. Wilson, title: Thinking About Crime, year: 1975}
        traditions:
          defining: [conservatism.national, conservatism.right-populism]
          typical: [conservatism.fusionism, conservatism.neo, conservatism.traditionalist, commonsense.declinist, conservatism.one-nation, nationalism.hindutva]
          contested: [socdem.labourism, liberalism.chicago]
          rejects: [anarchism.communist, marxism.black-radical, liberalism.progressive]
        presupposes: []
        excludes: [police.role.abolition, police.role.class-repression]
        tension: [police.role.public-safety]
        tags: [commonsense]
        analysis:
          gains: [petty-bourgeoisie, landed-capital, industrial-capital]
          pays: [reserve-army, core-workers]
          mechanism: >
            Order-maintenance policing targets street trade, loitering and public gatherings, which raises commercial property
            values and shopkeepers' security while criminalizing the unemployed and informal workers who use public space.
          drain: none
          law_of_value: none

      - id: police.role.class-repression
        label: Police exist to protect property and keep workers in line
        claim: Police were created to protect property and suppress the poor, strikers and the colonized; their core function is the defense of the existing class order.
        voiced: >
          Special bodies of armed men: that is what the police are. They break picket lines, evict tenants, guard the factory
          and the bank, and watch the unemployed. Crime fighting is the cover story; class control is the job.
        you: You see the police as there to protect property and the people who own it, against workers and the poor.
        because: >
          Modern police forces arose with industrial capitalism and colonial rule: to control new urban working classes, to
          catch runaway slaves, to subdue colonies. Their history is a history of strikebreaking, eviction and political
          surveillance. Even "ordinary" policing focuses on crimes of the poor and leaves wage theft and fraud by the powerful
          largely alone.
        against:
          - from: liberalism.social
            text: >
              Most police work is responding to theft, assault and domestic violence suffered by working people. A theory that
              cannot see this has no answer when a worker's home is burgled.
          - from: conservatism.national
            text: >
              The officers are themselves working people from working communities. Calling them class enemies abandons those
              communities to criminals.
        sources:
          - {author: V. I. Lenin, title: The State and Revolution, year: 1917}
          - {author: Kristian Williams, title: "Our Enemies in Blue: Police and Power in America", year: 2004}
          - {author: Mark Neocleous, title: "The Fabrication of Social Order: A Critical Theory of Police Power", year: 2000}
        traditions:
          defining: [marxism.leninism, anarchism.communist]
          typical: [marxism.ml, marxism.trotskyism, marxism.maoism, anarchism.syndicalist, anarchism.insurrectionary, marxism.autonomism]
          contested: [socdem.democratic-socialism, socdem.labourism]
          rejects: [liberalism.social, conservatism.national, conservatism.right-populism]
        presupposes: [state.nature.class-instrument]
        excludes: [police.role.public-safety, police.role.order-maintenance]
        tension: []
        tags: []
        analysis:
          gains: [core-workers, reserve-army]
          pays: [industrial-capital, landed-capital]
          mechanism: >
            Seeing police as a class force prepares workers to defend pickets and occupations against them and to refuse
            cooperation, which raises the cost to owners of using police against strikes and evictions.
          drain: none
          law_of_value: none
          consciousness: class-economic

      - id: police.role.colonial-occupation
        label: Police occupy racialized and colonized communities
        claim: In colonized and racialized communities the police function as an occupying force, keeping the colonized in their place on behalf of the settler or dominant group.
        voiced: >
          In the colonies it is the policeman and the soldier who are the official, instituted go-betweens, the spokesmen of
          the settler and his rule of oppression. The police patrol our community like a foreign army. We want an immediate end
          to police brutality and murder of Black people.
        you: You see the police in poor Black, brown and indigenous communities as an occupying force, not a public service.
        because: >
          Colonial police were built to control subject peoples, and many metropolitan methods were first tested in the
          colonies. In the United States, patrols to catch escaped slaves were early forms of policing. The pattern continues
          in who is stopped, searched, shot and jailed, from Ferguson to the favelas to the West Bank. The relation is between
          a dominant group and a subject population, not between a state and equal citizens.
        against:
          - from: liberalism.progressive
            text: >
              Racial disparities are real, but calling the police an occupation erases the fact that the same communities
              demand protection from violent crime, often more than others.
          - from: marxism.classical
            text: >
              Race-first analysis misses that poor white workers are also policed and that Black officers and mayors run many of
              these forces. The relation is one of class, with race as its form.
        sources:
          - {author: Frantz Fanon, title: The Wretched of the Earth, year: 1961}
          - {author: Black Panther Party, title: "The Ten-Point Program", year: 1966}
        traditions:
          defining: [marxism.black-radical, nationalism.black-nationalism]
          typical: [nationalism.decolonial, nationalism.indigenous-sovereignty, nationalism.palestinian, feminism.black, marxism.third-worldism]
          contested: [liberalism.progressive, marxism.classical]
          rejects: [conservatism.national, conservatism.right-populism, liberalism.classical]
        presupposes: [state.nature.settler-structure]
        excludes: [police.role.public-safety]
        tension: []
        tags: [race, settler]
        analysis:
          gains: [reserve-army, peripheral-workers]
          pays: [landed-capital, petty-bourgeoisie]
          mechanism: >
            Naming police as occupiers organizes residents for community control and self-defense, which raises the political
            cost of the policing that keeps racialized labor cheap and clears land for development.
          drain: reduces
          law_of_value: none

      - id: police.role.abolition
        label: Police cannot be reformed; shrink them and build real safety
        claim: Police cannot be reformed into a source of safety; their budgets should be cut and moved to housing, health, care and community responses until police are no longer needed.
        voiced: >
          Reform has had its century. We are not asking for better police; we are asking for fewer and then none. Safety comes
          from housing, health care, jobs and communities that can handle harm themselves. What would it take to make police
          obsolete? That is the question.
        you: You want to shrink the police step by step and replace them with housing, care and community-based safety.
        because: >
          Most calls to police concern mental health crises, homelessness, addiction and disputes that armed officers make
          worse. Police rarely solve serious crime and do little to prevent it; what prevents harm is stable lives. Every reform
          has expanded police budgets and power. Moving money to the conditions of safety is the only route that has not been
          tried.
        against:
          - from: liberalism.social
            text: >
              Where police withdrew, homicides rose, and the victims were overwhelmingly poor and Black. Abolition is a luxury
              for those who will not bear the cost.
          - from: marxism.ml
            text: >
              Police will not be abolished while capital needs them. Abolishing police without taking state power leaves the
              owners to hire private security, as they already do.
        sources:
          - {author: Alex S. Vitale, title: The End of Policing, year: 2017}
          - {author: Mariame Kaba, title: "We Do This 'Til We Free Us", year: 2021}
          - {author: Angela Y. Davis, title: Are Prisons Obsolete?, year: 2003}
        traditions:
          defining: [feminism.black]
          typical: [anarchism.communist, marxism.black-radical, anarchism.feminist, anarchism.insurrectionary]
          contested: [liberalism.progressive, socdem.democratic-socialism, marxism.trotskyism]
          rejects: [conservatism.national, liberalism.social, marxism.ml, conservatism.right-populism]
        presupposes: []
        excludes: [police.role.order-maintenance, police.role.public-safety]
        tension: [police.role.workers-militia]
        tags: []
        analysis:
          gains: [reserve-army, core-workers]
          pays: [landed-capital, petty-bourgeoisie]
          mechanism: >
            Moving police budgets into housing, health and income support transfers public money from enforcement toward the
            unemployed and precarious, and weakens the use of police to clear encampments and evict.
          drain: none
          law_of_value: regulates
          disputed: Materialists split on whether abolition can advance inside capitalism (abolitionists) or requires first taking state power (Leninists).

      - id: police.role.private-security
        label: Security is a service that competing private firms should supply
        claim: Protection from crime is a service like any other and would be supplied better, cheaper and more accountably by competing private firms than by a state monopoly.
        voiced: >
          The production of security should be subject to free competition like the production of anything else. A state
          police answers to no customer; it collects your taxes whether it protects you or not. Insurance companies and
          protection agencies would compete to prevent crime and keep customers satisfied.
        you: You think security should be bought from competing firms, not provided by a state monopoly.
        because: >
          Monopolies serve their customers badly, and state police are a monopoly paid regardless of results, protected by
          qualified immunity and unions from accountability. Private security already outnumbers public police in many
          countries. Agencies that had to keep customers and pay damages for abuses would have every reason to protect people
          and avoid violence.
        against:
          - from: liberalism.classical
            text: >
              Competing protection agencies will either merge into a dominant one, which is a state, or fight each other.
              Justice for those who cannot pay disappears.
          - from: marxism.ml
            text: >
              Security sold on the market goes to those who can pay: gated communities guarded, slums left to gangs, and private
              armies for mining companies in the periphery. This is the Pinkertons, not liberty.
        sources:
          - {author: Gustave de Molinari, title: The Production of Security, year: 1849}
          - {author: Murray N. Rothbard, title: For a New Liberty, year: 1973}
          - {author: David Friedman, title: The Machinery of Freedom, year: 1973}
        traditions:
          defining: [libertarianism.ancap]
          typical: [libertarianism.paleo, anarchism.individualist]
          contested: [libertarianism.minarchist, technology.cyberlibertarian]
          rejects: [liberalism.classical, marxism.ml, socdem.nordic, conservatism.national]
        presupposes: [state.nature.organized-aggression]
        excludes: [police.role.public-safety]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital, landed-capital]
          pays: [reserve-army, core-workers, peripheral-workers]
          mechanism: >
            Selling protection on the market allocates it by ability to pay: owners buy guards for property and plants, while
            the poor get none; private security firms already guard mines and plantations against local communities in the
            periphery.
          drain: sustains
          law_of_value: extends

      - id: police.role.workers-militia
        label: Replace the police with an armed and organized people
        claim: The police should be replaced by a militia drawn from the working people and their communities, elected and accountable to them.
        voiced: >
          We need not a police separate from the people but a universal people's militia, made up of the whole population,
          workers and peasants, under their councils. In our communities we name our own guards; they serve the assembly and
          are replaced when it says so.
        you: You want policing done by the organized community itself, through an armed militia it chooses and controls.
        because: >
          Every revolution has replaced the professional police with armed citizens: the Paris Commune's National Guard, the
          Russian workers' militias of 1917, the community police of Cherán and the Zapatista and Guerrero communities in
          Mexico. A force drawn from the community and answerable to its assembly protects people from crime without becoming
          a separate body of armed men over them.
        against:
          - from: liberalism.social
            text: >
              Armed community groups answer to whoever dominates the community. Militias become vigilantes, settle feuds and
              punish minorities without due process.
          - from: anarchism.individualist
            text: >
              A militia of the "whole people" is still a body that enforces the collective's will on the individual who
              dissents.
        sources:
          - {author: V. I. Lenin, title: Letters from Afar, year: 1917, note: "third letter, Concerning a Proletarian Militia"}
          - {author: Karl Marx, title: The Civil War in France, year: 1871}
        traditions:
          defining: [marxism.leninism]
          typical: [zapatismo, anarchism.communalism, anarchism.confederalism, anarchism.syndicalist, marxism.trotskyism, nationalism.indigenous-sovereignty]
          contested: [marxism.ml, anarchism.communist]
          rejects: [liberalism.social, conservatism.national, libertarianism.ancap]
        presupposes: [state.nature.class-instrument]
        excludes: [police.role.private-security]
        tension: [police.role.abolition]
        tags: []
        analysis:
          gains: [core-workers, peasantry, peripheral-workers]
          pays: [landed-capital, industrial-capital]
          mechanism: >
            Placing armed force in the hands of a community or workers' militia removes owners' ability to call on police
            against strikes, occupations and land claims; Mexican community police have expelled illegal loggers and cartels
            from communal land.
          drain: reduces
          law_of_value: none
          consciousness: hegemonic

  - id: prisons.purpose
    domain: state
    layer: horizon
    question: What are prisons for, and should they exist?
    plain: When someone does serious harm, what should happen to them?
    short: prisons and punishment
    importance: 2
    region: state
    positions:
      - id: prisons.purpose.retribution
        label: Punishment is deserved; the guilty must pay
        claim: People who commit crimes deserve to be punished in proportion to what they did; justice requires it, whatever the other effects.
        voiced: >
          Do the crime, do the time. Punishment is not revenge; it is justice. A person who wrongs another deserves to suffer
          in proportion to the wrong, and a society that refuses to punish betrays the victim. Even if a society were
          dissolving, the last murderer in prison should be executed first.
        you: You believe people who do serious wrong deserve punishment in proportion to it, as a matter of justice.
        because: >
          Treating criminals only as cases to be cured or deterred treats them as objects, not as responsible persons. Holding
          someone to account respects them as a moral agent and respects the victim's standing. Proportionate desert also
          sets limits: no punishing the innocent to deter others, no endless "rehabilitation."
        against:
          - from: socdem.nordic
            text: >
              Desert ignores that most prisoners were shaped by poverty, abuse and addiction. Harsh punishment fills prisons and
              produces more crime, not less.
          - from: marxism.black-radical
            text: >
              "Desert" is assigned by courts that jail poor and Black people for what the rich do with impunity. Retribution
              sanctifies a class and racial sorting.
        sources:
          - {author: Immanuel Kant, title: The Metaphysics of Morals, year: 1797}
          - {author: Andrew von Hirsch, title: "Doing Justice: The Choice of Punishments", year: 1976}
        traditions:
          defining: [conservatism.traditionalist]
          typical: [conservatism.national, conservatism.right-populism, conservatism.evangelical-right, conservatism.fusionism, commonsense.declinist, religious.salafism-quietist]
          contested: [conservatism.cst, liberalism.classical]
          rejects: [socdem.nordic, feminism.black, anarchism.communist]
        presupposes: []
        excludes: [prisons.purpose.abolition]
        tension: [prisons.purpose.rehabilitation]
        tags: [commonsense]
        analysis:
          gains: [petty-bourgeoisie]
          pays: [reserve-army, core-workers]
          mechanism: >
            Retributive sentencing lengthens prison terms for street crimes, which fall mostly on the unemployed and informal
            workers, while white-collar and corporate offenses are charged rarely and punished lightly.
          drain: none
          law_of_value: none

      - id: prisons.purpose.deterrence
        label: Prisons protect society by deterring and incapacitating
        claim: Punishment is justified by its effects; prisons should deter crime and keep dangerous people away from others, at the lowest cost that achieves this.
        voiced: >
          All punishment is in itself evil; it ought only to be admitted in as far as it promises to exclude some greater evil.
          Criminals respond to incentives like everyone else: raise the expected cost of crime and you get less of it. Keep
          the dangerous few off the streets.
        you: You see prisons as tools to deter crime and keep dangerous people away from others, judged by whether they work.
        because: >
          Punishment that achieves nothing is cruelty. Certainty and swiftness of punishment deter better than severity, and
          a small number of repeat offenders commit a large share of serious crime. Judging prisons by cost and effect lets
          us cut useless sentences and focus on what reduces harm.
        against:
          - from: conservatism.cst
            text: >
              If punishment is only a tool, why not punish an innocent person when it deters others? Without desert, there is no
              limit.
          - from: feminism.black
            text: >
              "Incapacitation" built the largest prison system on earth in the United States, and crime trends barely followed
              incarceration rates.
        sources:
          - {author: Cesare Beccaria, title: On Crimes and Punishments, year: 1764}
          - {author: Jeremy Bentham, title: An Introduction to the Principles of Morals and Legislation, year: 1789}
          - {author: Gary S. Becker, title: "Crime and Punishment: An Economic Approach", year: 1968}
        traditions:
          defining: [liberalism.utilitarian, liberalism.chicago]
          typical: [liberalism.technocratic, conservatism.neo, socdem.third-way]
          contested: [liberalism.classical, liberalism.social]
          rejects: [anarchism.communist, feminism.black, conservatism.traditionalist]
        presupposes: []
        excludes: [prisons.purpose.abolition]
        tension: [prisons.purpose.retribution]
        tags: []
        analysis:
          gains: [professional-managerial, petty-bourgeoisie]
          pays: [reserve-army]
          mechanism: >
            Cost-benefit sentencing directs enforcement at the offenses most visible and easiest to deter, those of the poor,
            and treats incapacitation of a "dangerous few" as efficient, which in practice removes unemployed young men from
            depressed labor markets.
          drain: none
          law_of_value: none

      - id: prisons.purpose.rehabilitation
        label: Prisons should prepare people to return as good neighbors
        claim: Losing liberty is the punishment; prison time should be used to prepare people to return to society with education, work and treatment, in humane conditions.
        voiced: >
          The loss of liberty is the punishment. Everything else in prison should prepare the person for life outside, because
          almost all of them will be our neighbors again. Treat people decently and they are more likely to act decently.
        you: You want prisons to prepare people to come back as good neighbors, through decent treatment, education and work.
        because: >
          Nearly every prisoner is released. Countries that run small, humane prisons focused on education, treatment and
          gradual return, such as Norway, have much lower reoffending rates than those that warehouse. That makes everyone
          safer and costs less over time. International minimum standards say the same: the purpose of a sentence is to
          protect society and reduce reoffending through reintegration.
        against:
          - from: conservatism.national
            text: >
              Comfortable prisons tell victims their suffering does not count. Rehabilitation is a fine goal, but justice comes
              first.
          - from: anarchism.communist
            text: >
              A humane cage is still a cage. "Rehabilitation" means adjusting people to the conditions that led them to prison,
              and returning them to the same poverty.
        sources:
          - {author: United Nations General Assembly, title: "United Nations Standard Minimum Rules for the Treatment of Prisoners (the Nelson Mandela Rules)", year: 2015}
          - {author: Nils Christie, title: Limits to Pain, year: 1981}
        traditions:
          defining: [socdem.nordic]
          typical: [liberalism.social, liberalism.progressive, socdem.keynesian, conservatism.christian-democracy, conservatism.cst]
          contested: [socdem.democratic-socialism, liberalism.egalitarian]
          rejects: [conservatism.national, conservatism.right-populism]
        presupposes: []
        excludes: []
        tension: [prisons.purpose.retribution, prisons.purpose.abolition]
        tags: []
        analysis:
          gains: [reserve-army, professional-managerial]
          pays: []
          mechanism: >
            Humane, education-focused prisons cut reoffending and return people to the labor market with skills; they expand the
            professional staff of social workers and teachers inside the system while leaving its intake, mostly the poor,
            unchanged.
          drain: none
          law_of_value: none

      - id: prisons.purpose.reform-through-labor
        label: Offenders should be remade through labor and political education
        claim: Wrongdoers, and enemies of the new society, should be reformed through productive labor and political education until they can rejoin the people as new persons.
        voiced: >
          The reactionaries who do not make trouble will be given land and work so that they can live and remold themselves
          through labor into new people. Labor and collective life transform; idleness and isolation corrupt. Make the offender
          useful to the people and he becomes one of them.
        you: You think offenders should be transformed through useful work and political education, rather than simply locked away or punished.
        because: >
          Crime and counter-revolution have social roots; people formed by the old society can be reformed by new social
          relations. Makarenko's colonies took street children and turned them into skilled, educated citizens through
          collective work and self-government. Productive labor also means the offender repays society rather than costing it.
        against:
          - from: liberalism.social
            text: >
              Labor camps in the Soviet Union and China held millions, many for political views, in conditions that killed
              large numbers. "Reform through labor" was forced labor.
          - from: anarchism.communist
            text: >
              The idea that the state may remold minds through compulsory labor is the prison perfected, not abolished.
        sources:
          - {author: Mao Zedong, title: On the People's Democratic Dictatorship, year: 1949}
          - {author: Anton Makarenko, title: The Pedagogical Poem, year: 1933, note: "published in parts 1933–1936"}
        traditions:
          defining: [marxism.ml, marxism.maoism]
          typical: [marxism.juche, marxism.hoxhaism, marxism.mlm]
          contested: [marxism.scc, marxism.guevarism]
          rejects: [liberalism.social, anarchism.communist, marxism.trotskyism, liberalism.classical]
        presupposes: [siege.governance.revolutionary-dictatorship]
        excludes: [prisons.purpose.abolition]
        tension: []
        tags: []
        analysis:
          gains: [peasantry, core-workers]
          pays: [landed-capital, comprador-capital]
          mechanism: >
            Applied to former landlords and their agents it broke their social power after revolution; the same system extracted
            unpaid labor for state construction, and its intake included workers and party members accused of political
            offenses.
          drain: none
          law_of_value: suspends
          disputed: The scale of political imprisonment and death in Soviet and Chinese labor camps is documented and its interpretation sharply disputed; ML traditions treat excesses as errors under siege, others as intrinsic to the system.

      - id: prisons.purpose.abolition
        label: Prisons manage the poor and should be abolished
        claim: Prisons do not mainly respond to crime; they warehouse people whom the economy has discarded, and they should be replaced step by step by institutions that prevent harm.
        voiced: >
          Prisons are a solution to a problem capital created: surplus people, surplus land, surplus capacity. They make
          social problems disappear by making human beings disappear. Abolition is not just closing prisons; it is building
          the schools, housing, health care and jobs that make prisons obsolete.
        you: You see prisons as a way of storing people the economy has thrown away, and you want to replace them with things that prevent harm.
        because: >
          The US prison population grew fivefold from the 1970s while crime rose and then fell; what drove it was the
          collapse of industrial employment and the political choice to manage the surplus population by caging it, as
          Gilmore showed for California. Prisons concentrate on the poor and racialized and return people more damaged. The
          answer is to remove the conditions of harm, not to perfect cages.
        against:
          - from: liberalism.social
            text: >
              Some people are dangerous now, whatever caused it. Abolition has no answer for the serial abuser or the murderer
              except that society must first be transformed.
          - from: conservatism.national
            text: >
              Victims, most of them poor, need protection. Emptying prisons exports risk to the very neighborhoods abolitionists
              claim to speak for.
        sources:
          - {author: Ruth Wilson Gilmore, title: "Golden Gulag: Prisons, Surplus, Crisis, and Opposition in Globalizing California", year: 2007}
          - {author: Angela Y. Davis, title: Are Prisons Obsolete?, year: 2003}
          - {author: Georg Rusche and Otto Kirchheimer, title: Punishment and Social Structure, year: 1939}
          - {author: Michel Foucault, title: Discipline and Punish, year: 1975}
        traditions:
          defining: [marxism.black-radical, feminism.black]
          typical: [anarchism.communist, anarchism.feminist, anarchism.insurrectionary, feminism.queer]
          contested: [socdem.democratic-socialism, liberalism.progressive, marxism.trotskyism]
          rejects: [conservatism.national, liberalism.chicago, conservatism.traditionalist, marxism.ml]
        presupposes: []
        excludes: [prisons.purpose.retribution, prisons.purpose.deterrence, prisons.purpose.reform-through-labor]
        tension: [prisons.purpose.rehabilitation]
        tags: [race]
        analysis:
          gains: [reserve-army, core-workers]
          pays: [landed-capital, finance-capital]
          mechanism: >
            Closing prisons and moving budgets to housing, health and jobs ends the use of incarceration to absorb workers
            displaced by deindustrialization, and cuts revenue for private prison operators and the rural towns and bondholders
            tied to prison construction.
          drain: none
          law_of_value: regulates
          consciousness: hegemonic

      - id: prisons.purpose.restorative
        label: Repair the harm between offender, victim and community
        claim: The response to harm should be to repair it, bringing together the person harmed, the person responsible and their community to set things right, rather than to impose suffering.
        voiced: >
          Crime is a violation of people and relationships, not of the state. Justice means putting right the harm. The
          conflict belongs to those involved; the state stole it from them. Our elders sit with both families until the
          harm is repaired and the person responsible can return.
        you: You want harm handled by bringing together those involved and their community to repair it, not by inflicting punishment.
        because: >
          Courts take conflicts away from the people involved and turn the victim into a witness. Restorative processes give
          victims answers and repair, hold offenders to face what they did, and draw on community bonds that prevent
          reoffending. Many indigenous and religious traditions practiced justice this way long before prisons existed.
        against:
          - from: conservatism.traditionalist
            text: >
              Some acts call for punishment, not conversation. A circle cannot answer a murder.
          - from: feminism.radical
            text: >
              In cases of domestic and sexual violence, "community" processes can pressure victims to reconcile with abusers and
              shield powerful men inside the community.
        sources:
          - {author: Howard Zehr, title: "Changing Lenses: A New Focus for Crime and Justice", year: 1990}
          - {author: Nils Christie, title: Conflicts as Property, year: 1977}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [zapatismo, anarchism.communalism, anarchism.christian, religious.engaged-buddhism, religious.christian-socialism, socdem.nordic]
          contested: [conservatism.cst, liberalism.progressive, nationalism.gandhian]
          rejects: [conservatism.national, conservatism.right-populism]
        presupposes: []
        excludes: []
        tension: [prisons.purpose.retribution]
        tags: []
        analysis:
          gains: [peasantry, reserve-army]
          pays: []
          mechanism: >
            Moving responses to harm into community processes reduces dependence on courts and prisons, strengthening community
            institutions; its effect on class relations is limited, since it handles interpersonal harm, not property relations.
          drain: none
          law_of_value: none

  - id: violence.political
    domain: state
    layer: strategy
    question: When is political violence justified?
    plain: Is it ever right to use force for a political cause, and who gets to decide?
    short: political violence
    importance: 3
    region: state
    positions:
      - id: violence.political.never
        label: Never; nonviolence is both right and stronger
        claim: Political violence is never justified; nonviolent resistance is morally required and is also the more effective way to change things.
        voiced: >
          Means are ends in the making. Violence begets violence; an eye for an eye leaves the whole world blind. Nonviolence
          is not passivity but the active force of truth: we will wear you down by our capacity to suffer, and in winning our
          freedom we will win you as well.
        you: You hold that political violence is never right and that nonviolent resistance is stronger.
        because: >
          The means used shape the society that results; violent revolutions breed new tyrants. Nonviolent campaigns draw far
          more participants, divide the opponent's supporters and security forces, and succeed more often, as studies of
          resistance campaigns since 1900 found. India's independence movement and the civil rights movement show its power.
        against:
          - from: nationalism.pan-africanism
            text: >
              Nonviolence worked where the opponent had a conscience to reach and a public to shame. Against apartheid's guns, after
              Sharpeville, peaceful protest was met with massacre, and armed struggle became necessary.
          - from: marxism.leninism
            text: >
              The state is already violent every day. Preaching nonviolence to the oppressed and not to the state that shoots them
              disarms only one side.
        sources:
          - {author: M. K. Gandhi, title: Hind Swaraj, year: 1909}
          - {author: Leo Tolstoy, title: The Kingdom of God Is Within You, year: 1894}
          - {author: Martin Luther King Jr., title: Stride Toward Freedom, year: 1958}
          - {author: Erica Chenoweth and Maria J. Stephan, title: "Why Civil Resistance Works", year: 2011}
        traditions:
          defining: [nationalism.gandhian, anarchism.christian]
          typical: [religious.engaged-buddhism, religious.christian-socialism]
          contested: [ecology.deep-ecology, liberalism.progressive, socdem.democratic-socialism]
          rejects: [marxism.leninism, nationalism.pan-africanism, marxism.maoism, libertarianism.paleo, fascism.italian]
        presupposes: []
        excludes: [violence.political.revolutionary, violence.political.anti-colonial, violence.political.regenerative, violence.political.religious-duty]
        tension: [violence.political.self-defense]
        tags: []
        analysis:
          gains: [core-workers, peasantry]
          pays: []
          mechanism: >
            Mass nonviolent action (strikes, boycotts, noncooperation) withdraws labor and consent that owners and rulers depend
            on, and has won concessions; it leaves the coercive apparatus intact, so outcomes depend on whether the army and
            police split.
          drain: none
          law_of_value: none
          disputed: Materialists dispute whether nonviolent transitions (India 1947, South Africa's negotiated end of apartheid) changed property relations or mainly transferred political office.

      - id: violence.political.state-monopoly
        label: Only the lawful state may use force; citizens have the ballot
        claim: In a constitutional state with elections and courts, only the lawful authorities may use force; political violence by citizens is never justified there.
        voiced: >
          Where people can vote, speak, organize and go to court, there is no excuse for bullets. The state holds the monopoly
          on legitimate force precisely so that political disputes are settled by argument and ballots. Whoever takes up arms
          against a constitutional order attacks everyone's right to decide peacefully.
        you: You think that where there are elections and courts, only the lawful state may use force and citizens must use the ballot.
        because: >
          A monopoly of legitimate force is what separates a political community from civil war. Once groups claim a right to
          use violence for their causes, every group will, and the strongest or most ruthless wins. Constitutional channels
          exist for change, and history shows they can deliver it, from universal suffrage to civil rights legislation.
        against:
          - from: marxism.leninism
            text: >
              The "lawful" state's violence is still violence: evictions, police killings, wars abroad. Granting it a monopoly
              means granting the ruling class the only legal guns.
          - from: liberalism.classical
            text: >
              Even a constitutional state can turn tyrant. Locke kept the right of resistance for good reason; unconditional
              obedience is not a liberal principle.
        sources:
          - {author: Max Weber, title: Politics as a Vocation, year: 1919}
          - {author: Karl Popper, title: The Open Society and Its Enemies, year: 1945}
        traditions:
          defining: [liberalism.social, conservatism.christian-democracy]
          typical: [socdem.nordic, socdem.third-way, liberalism.technocratic, conservatism.burkean, conservatism.one-nation, liberalism.internationalist, socdem.revisionist]
          contested: [liberalism.classical, conservatism.national]
          rejects: [marxism.leninism, anarchism.insurrectionary, libertarianism.paleo, nationalism.palestinian]
        presupposes: []
        excludes: [violence.political.revolutionary, violence.political.regenerative]
        tension: [violence.political.resistance-to-tyranny]
        tags: []
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [reserve-army, peripheral-workers]
          mechanism: >
            Granting only the state legitimate force leaves strikes, occupations and protests subject to policing, while the
            state's own force (evictions, strikebreaking, foreign wars) counts as lawful.
          drain: sustains
          law_of_value: none

      - id: violence.political.resistance-to-tyranny
        label: The people may rise against a tyrant who breaks the compact
        claim: When rulers become tyrants, violating rights and closing every peaceful remedy, the people have the right to resist by force and remove them.
        voiced: >
          When a long train of abuses and usurpations evinces a design to reduce the people under absolute despotism, it is
          their right, it is their duty, to throw off such government. The tree of liberty must be refreshed from time to
          time with the blood of patriots and tyrants.
        you: You believe people may take up arms against a government that has become a tyranny and closed every peaceful way out.
        because: >
          Government is a trust; rulers who betray it by attacking the people's lives and liberties put themselves in a state
          of war with them. Without a right of resistance, constitutional limits are only requests. The American Revolution,
          the resistance to Nazi occupation and many anti-dictatorship uprisings rested on this right, and even Catholic
          teaching admits it against manifest, long-standing tyranny.
        against:
          - from: conservatism.burkean
            text: >
              Every rebel thinks his ruler a tyrant. Revolution destroys the inherited order that makes liberty possible, and what
              follows is usually worse.
          - from: marxism.leninism
            text: >
              The "tyrant" in this doctrine is always a political ruler, never a class. The right of resistance stops at the
              factory gate; it defended the property of the American planters, slaves included.
        sources:
          - {author: John Locke, title: Two Treatises of Government, year: 1689, note: "Second Treatise, ch. 19"}
          - {author: Thomas Jefferson, title: The Declaration of Independence, year: 1776}
          - {author: Paul VI, title: Populorum Progressio, year: 1967, note: "§31"}
        traditions:
          defining: [liberalism.classical, liberalism.republican]
          typical: [libertarianism.minarchist, libertarianism.paleo, conservatism.fusionism, nationalism.civic, libertarianism.ancap]
          contested: [conservatism.cst, religious.liberation-theology, conservatism.evangelical-right]
          rejects: [conservatism.burkean, conservatism.reactionary, liberalism.technocratic]
        presupposes: [rights.basis.natural-rights]
        excludes: []
        tension: [violence.political.state-monopoly]
        tags: []
        analysis:
          gains: [petty-bourgeoisie, industrial-capital]
          pays: [landed-capital]
          mechanism: >
            The right of resistance against political tyranny has served propertied classes rising against monarchs and
            colonial governors; it does not extend to resisting employers or landlords, so property relations survive the
            change of rulers.
          drain: none
          law_of_value: none

      - id: violence.political.revolutionary
        label: Revolutionary violence is the midwife of a new society
        claim: Ruling classes do not give up power without force, so revolutionary violence by the oppressed majority is justified to overthrow them and defend the new order.
        voiced: >
          Force is the midwife of every old society pregnant with a new one. No ruling class in history has surrendered its
          power peacefully. The question is not whether there will be violence, for it already exists, but whose. The end
          justifies the means only if the end is the liberation of humanity, and that end determines which means are allowed.
        you: You believe the owning class will not give up power peacefully, so the working majority may have to take it by force.
        because: >
          Every gain threatening property has met force: Paris 1871, Germany 1919, Spain 1936, Indonesia 1965, Chile 1973.
          Elected governments of the left were overthrown by armies when they touched ownership. The violence of the existing
          order, wars, hunger, police, is daily and vast; revolution concentrates the violence needed to end it. Refusing it in
          principle means leaving the owners' violence unanswered.
        against:
          - from: nationalism.gandhian
            text: >
              Means shape ends. A party that seizes power by violence keeps power by violence, and the new society inherits the
              habits of the war that made it.
          - from: liberalism.social
            text: >
              Where peaceful change is possible, revolutionary violence is a choice to kill for an untested program, and its
              record includes terror against the very workers it claimed to free.
        sources:
          - {author: Karl Marx, title: "Capital, Volume I", year: 1867, note: "ch. 31"}
          - {author: Leon Trotsky, title: Their Morals and Ours, year: 1938}
          - {author: V. I. Lenin, title: The State and Revolution, year: 1917}
        traditions:
          defining: [marxism.leninism, marxism.ml]
          typical: [marxism.maoism, marxism.mlm, marxism.trotskyism, marxism.guevarism, marxism.hoxhaism, anarchism.insurrectionary, anarchism.platformist, anarchism.syndicalist]
          contested: [marxism.classical, socdem.democratic-socialism, marxism.eurocommunism]
          rejects: [nationalism.gandhian, liberalism.social, socdem.nordic, anarchism.christian]
        presupposes: [state.nature.class-instrument]
        excludes: [violence.political.never, violence.political.state-monopoly]
        tension: []
        tags: []
        analysis:
          gains: [core-workers, peripheral-workers, peasantry]
          pays: [finance-capital, industrial-capital, landed-capital, comprador-capital]
          mechanism: >
            Accepting revolutionary force prepares the working majority to defeat the armed defense of property, making
            expropriation of owners possible; it also exposes movements to repression and civil war, whose costs fall heavily
            on the workers and peasants who fight them.
          drain: breaks
          law_of_value: abolishes
          consciousness: hegemonic

      - id: violence.political.anti-colonial
        label: The colonized have the right to win liberation by arms
        claim: Colonial rule is founded and maintained by violence, so the colonized are justified in using force to end it; in this setting violence also restores the dignity colonialism destroyed.
        voiced: >
          Decolonization is always a violent phenomenon. The colonial world is a world cut in two, kept apart by soldiers and
          police. At the level of individuals, violence is a cleansing force: it frees the native from his inferiority
          complex. It was only when all else had failed that we turned to armed struggle.
        you: You believe colonized peoples have the right to fight for liberation by arms when colonial rule leaves no other way.
        because: >
          Colonial rule rested on conquest and was kept by massacres, from Sétif to the Mau Mau camps to Sharpeville. When
          peaceful protest was banned and shot at, armed struggle was the only remaining road, as Mandela explained at Rivonia.
          International law itself recognizes the right of peoples under colonial and foreign domination to struggle by all
          available means. The violence of the oppressed answers a violence that came first.
        against:
          - from: liberalism.internationalist
            text: >
              Armed liberation movements often killed civilians and turned on each other; Algeria's independence war gave way to
              decades of military rule. Negotiated independence spared lives across most of Africa.
          - from: nationalism.gandhian
            text: >
              India won independence without an army of liberation. Violence brutalizes those who use it, and the new state
              inherits its fighters' methods.
        sources:
          - {author: Frantz Fanon, title: The Wretched of the Earth, year: 1961}
          - {author: Nelson Mandela, title: I Am Prepared to Die, year: 1964}
          - {author: Amílcar Cabral, title: The Weapon of Theory, year: 1966}
        traditions:
          defining: [nationalism.pan-africanism, marxism.third-worldism]
          typical: [nationalism.palestinian, nationalism.decolonial, marxism.african-socialism, marxism.maoism, marxism.guevarism, nationalism.nasserism, marxism.black-radical, nationalism.indigenous-sovereignty]
          contested: [liberalism.internationalist, religious.liberation-theology]
          rejects: [nationalism.gandhian, conservatism.neo, nationalism.zionism-revisionist]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: [violence.political.never]
        tension: [violence.political.state-monopoly]
        tags: [global-south]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [comprador-capital, finance-capital, landed-capital]
          mechanism: >
            Armed liberation removed colonial administrations and settler landholders and opened the way to nationalizing mines
            and plantations; where comprador classes inherited the state, the property of core firms survived independence.
          drain: reduces
          law_of_value: none
          consciousness: hegemonic

      - id: violence.political.self-defense
        label: Communities may defend themselves by arms when the state won't
        claim: People under attack have the right to defend themselves and their community with arms when the state fails to protect them or is itself the attacker; this is defense, not offensive struggle.
        voiced: >
          We are not going to start anything, but when the Klan rides into our community, we will meet violence with violence.
          It is criminal to teach a man not to defend himself when he is the constant victim of brutal attacks. Self-defense is
          not violence; it is the refusal to be a victim.
        you: You believe a community under attack may arm itself for defense when the authorities won't protect it.
        because: >
          The right to defend one's life is the most basic of all, and it does not disappear because the attacker wears a
          hood or a badge. In the Jim Crow South, armed self-defense by Black communities kept civil rights workers alive and
          deterred the Klan. Indigenous and peasant communities defending land from armed land-grabbers face the same choice.
        against:
          - from: nationalism.gandhian
            text: >
              Armed defense invites escalation and gives the state an excuse to crush the movement; unarmed discipline won more.
          - from: liberalism.social
            text: >
              Private armed groups cannot judge impartially what counts as defense; the line between self-defense and vigilantism
              disappears quickly.
        sources:
          - {author: Robert F. Williams, title: Negroes with Guns, year: 1962}
          - {author: Malcolm X, title: The Ballot or the Bullet, year: 1964}
        traditions:
          defining: [marxism.black-radical, nationalism.black-nationalism]
          typical: [zapatismo, nationalism.indigenous-sovereignty, anarchism.confederalism, libertarianism.paleo, libertarianism.minarchist]
          contested: [anarchism.communist, conservatism.fusionism, marxism.trotskyism]
          rejects: [nationalism.gandhian, liberalism.social, liberalism.technocratic]
        presupposes: []
        excludes: []
        tension: [violence.political.never, violence.political.state-monopoly]
        tags: [race]
        analysis:
          gains: [reserve-army, peasantry, peripheral-workers]
          pays: [landed-capital]
          mechanism: >
            Armed self-defense raises the cost of terror used to keep racialized labor cheap and to clear peasants and indigenous
            people from land; the same doctrine in gun-rights form arms property holders against the poor.
          drain: none
          law_of_value: none

      - id: violence.political.religious-duty
        label: Armed struggle can be a religious duty in defense of the faith
        claim: Armed struggle is justified, and can be obligatory, when it is commanded by religious law to defend the community of believers or to establish God's rule against rulers who abandon it.
        voiced: >
          Jihad in the path of God is a duty when Muslim lands are occupied and rulers govern by other than what God revealed.
          It is not aggression but the removal of obstacles to the freedom of people to worship God alone. This duty has been
          neglected, and the community has paid for it in humiliation.
        you: You believe armed struggle can be a religious duty when the faith or the community of believers is under attack or ruled against God's law.
        because: >
          Religious law has always recognized defensive war, and the occupations of Muslim lands, from Palestine to
          Afghanistan and Iraq, are aggression by any standard. Rulers installed and armed by foreign powers do not govern by
          the faith; peaceful preaching under them has been met with prison and torture, as in Egypt. When all other means
          are closed, armed struggle defends the community.
        against:
          - from: religious.post-islamism
            text: >
              Those who declare fellow Muslims unbelievers and kill civilians violate the faith they claim to defend; the great
              majority of scholars condemn them, and most of their victims are Muslims.
          - from: nationalism.palestinian
            text: >
              Turning a national liberation struggle into a religious war divides the people, Muslim and Christian, and serves the
              occupier's claim that this is a clash of civilizations.
        sources:
          - {author: Sayyid Qutb, title: Milestones, year: 1964}
          - {author: Muhammad Abd al-Salam Faraj, title: The Neglected Duty, year: 1981}
        traditions:
          defining: [religious.salafi-jihadism]
          typical: []
          contested: [religious.islamism-khomeinist, religious.islamism-brotherhood, religious.religious-zionism]
          rejects: [religious.post-islamism, religious.salafism-quietist, nationalism.gandhian, liberalism.internationalist]
        presupposes: [liberty.concept.servitude-to-god-alone]
        excludes: [violence.political.never]
        tension: []
        tags: [religion, global-south]
        analysis:
          gains: [petty-bourgeoisie]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            Armed religious campaigns target occupying armies and governments allied to core powers, but their wars have killed
            mostly local civilians and given core states grounds for further intervention, so the costs fall on peripheral
            workers and peasants.
          drain: none
          law_of_value: none
          disputed: Materialists dispute whether jihadist movements are a form of anti-imperialist resistance with a reactionary program, or a force that in practice strengthens intervention.

      - id: violence.political.regenerative
        label: Struggle and violence renew a decadent people
        claim: Violence and war are not only means but creative forces that regenerate a nation weakened by comfort, materialism and parliamentary talk.
        voiced: >
          War alone brings up to its highest tension all human energy and puts the stamp of nobility upon the peoples who have
          the courage to meet it. Life is struggle. A nation that will not fight is already dying; violence cleanses the
          decadent and forges the new man.
        you: You believe struggle and force can renew a nation grown soft, and that a people unwilling to fight is in decline.
        because: >
          Comfortable bourgeois societies lose their sense of purpose; parliaments talk and nothing is done. Action, discipline
          and the willingness to risk death restore what reasoning cannot: unity, sacrifice and greatness. Sorel saw that a
          myth of decisive struggle moves masses as no program can, and the fascist movements put this into practice.
        against:
          - from: liberalism.classical
            text: >
              This doctrine produced the Second World War, the death camps and tens of millions dead. Its "renewal" was the
              destruction of Europe.
          - from: marxism.ml
            text: >
              Fascist squads fought not decadence but unions and peasant leagues, paid by landowners and industrialists. The cult
              of violence was strikebreaking with banners.
        sources:
          - {author: Benito Mussolini and Giovanni Gentile, title: The Doctrine of Fascism, year: 1932}
          - {author: Georges Sorel, title: Reflections on Violence, year: 1908}
        traditions:
          defining: [fascism.italian, fascism.nazism]
          typical: [fascism.traditionalist, fascism.national-syndicalism, fascism.third-position]
          contested: [fascism.identitarian, anarchism.syndicalist]
          rejects: [liberalism.classical, marxism.ml, nationalism.gandhian, socdem.nordic, conservatism.christian-democracy]
        presupposes: [equality.concept.natural-hierarchy]
        excludes: [violence.political.never, violence.political.state-monopoly]
        tension: []
        tags: [fascism]
        analysis:
          gains: [landed-capital, industrial-capital]
          pays: [core-workers, peasantry, peripheral-workers]
          mechanism: >
            In Italy 1920–1922 fascist squads, funded by landowners and industrialists, burned union halls and peasant league
            offices, breaking organized labor; as state policy the cult of war drove conquest in Ethiopia and the war of
            1939–1945.
          drain: sustains
          law_of_value: none
          disputed: Sorel's own syndicalist doctrine of proletarian violence was directed at the bourgeoisie; whether it belongs with fascism is disputed.
