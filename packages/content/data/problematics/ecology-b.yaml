problematics:
  # ------------------------------------------------------------------
  - id: nature.value
    domain: ecology
    layer: method
    question: Does nature have value in itself?
    plain: Is a forest worth protecting because of what it does for people, or because it matters on its own?
    short: the value of nature
    importance: 2
    region: ecology
    positions:
      - id: nature.value.intrinsic
        label: Yes, all life has value in itself
        claim: Living things and ecosystems have value of their own, whether or not they are useful to human beings.
        voiced: "The well-being and flourishing of human and non-human life on earth have value in themselves, independent of the usefulness of the non-human world for human purposes."
        you: You think plants, animals and ecosystems matter for their own sake, not only because they are useful to people.
        because: >
          A wolf, a coral reef or a river system is not a warehouse of goods for us; it is a form of life
          with its own way of flourishing. If value only comes from human use, then any species with no
          market or medicinal value may be wiped out without loss, which almost no one actually believes.
          Recognizing intrinsic value is the only footing on which wild nature can be protected when its
          destruction would pay. A land ethic enlarges the community to include soils, waters, plants and
          animals.
        against:
          - from: marxism.ecosocialism
            text: >
              Value is a social relation among people; to speak of nature's value "in itself" is to project
              human judgments onto it. The real question is how society organizes its exchange with nature.
          - from: libertarianism.objectivist
            text: >
              Value means value to someone. A world of rocks and plants with no valuer has no values in it.
              Putting nature above human life inverts morality.
        sources:
          - {author: Aldo Leopold, title: A Sand County Almanac, year: 1949}
          - {author: Arne Naess, title: "The Shallow and the Deep, Long-Range Ecology Movement", year: 1973}
          - {author: Holmes Rolston III, title: "Environmental Ethics: Duties to and Values in the Natural World", year: 1988}
        traditions:
          defining: [ecology.deep-ecology]
          typical: [anarchism.primitivist, anarchism.green, religious.engaged-buddhism]
          contested: [nationalism.indigenous-sovereignty, conservatism.cst, ecology.degrowth]
          rejects: [libertarianism.objectivist, ecology.ecomodernism, technology.e-acc, liberalism.utilitarian]
        presupposes: []
        excludes: [nature.value.for-human-use, nature.value.natural-capital]
        tension: [nature.value.metabolism]
        tags: [deep-ecology, ethics]
        analysis:
          gains: [professional-managerial]
          pays: [peasantry]
          mechanism: >
            In practice intrinsic value is defended through protected areas, endangered-species law and
            conservation finance, which empower conservation scientists and NGOs and can close land to the
            peasants and herders who used it.
          drain: none
          law_of_value: suspends
          disputed: >
            Some ecosocialists (Kovel) accept intrinsic value as a check on productivism; Foster and Burkett
            reject it as idealist, preferring Marx's account of nature as a source of use-values.
          method: idealist

      - id: nature.value.kin-and-relation
        label: Nature is kin, and we owe it reciprocity
        claim: The land, rivers and animals are relatives with whom a people has obligations of care and reciprocity, and their value lies in those relations, not in ownership.
        voiced: "We do not own the land; the land owns us. The river is our ancestor, and you do not sell your grandmother."
        you: You think the land, rivers and animals are relatives you owe care to, not property or resources.
        because: >
          For thousands of years Indigenous peoples have lived with their lands through relations of gift
          and obligation: take only what is given, give back, care for the next seven generations. These
          ways of life sustained biodiversity; the lands still held by Indigenous peoples hold a large share
          of what remains. The law is catching up: New Zealand recognized the Whanganui River as a legal
          person in 2017, and Ecuador gave nature constitutional rights in 2008. Those rights must come with
          the return of land and authority to the peoples who carry these relations.
        against:
          - from: ecology.green-growth
            text: >
              A worldview cannot be applied to eight billion people living in cities. Policy needs measurable
              targets and prices, not spiritual relations that most citizens do not share.
          - from: marxism.ml
            text: >
              Romanticizing Indigenous relations to land can freeze communities in poverty and hand their
              representation to NGOs. Peoples have a right to industry and modern life too.
        sources:
          - {author: Vine Deloria Jr., title: "God Is Red: A Native View of Religion", year: 1973}
          - {author: Robin Wall Kimmerer, title: "Braiding Sweetgrass: Indigenous Wisdom, Scientific Knowledge and the Teachings of Plants", year: 2013}
          - {author: Republic of Ecuador, title: Constitución de la República del Ecuador, year: 2008, note: "articles 71–74, rights of nature"}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial, zapatismo, religious.liberation-theology, feminism.decolonial]
          contested: [ecology.deep-ecology, marxism.mariategui, ecology.environmental-justice]
          rejects: [liberalism.chicago, libertarianism.objectivist, ecology.ecomodernism]
        presupposes: [settler.colonialism.land-back]
        excludes: [nature.value.for-human-use]
        tension: [nature.value.natural-capital]
        tags: [indigenous, rights-of-nature]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, comprador-capital, industrial-capital]
          mechanism: >
            Joining nature's value to Indigenous authority over land places territory outside the market and
            gives communities legal grounds to refuse mines, dams and plantations, cutting the supply of cheap
            land and minerals to extraction firms and their state partners.
          drain: reduces
          law_of_value: suspends
          disputed: >
            Marxists differ on whether Indigenous land claims are a class struggle (Mariátegui, Coulthard) or
            a cultural politics that can be absorbed by conservation finance and carbon markets.

      - id: nature.value.natural-capital
        label: Nature is valuable capital we should price
        claim: Nature provides services worth trillions, such as pollination, clean water and climate stability, and protecting it means putting those services into the accounts.
        voiced: "We are destroying natural capital because it is invisible on the balance sheet. What gets measured gets managed."
        you: You think nature is enormously valuable to people and should be measured and priced so that it is protected.
        because: >
          Economies destroy nature because its benefits are free and unrecorded: a forest counts in GDP only
          when it is cut down. Estimates put the value of ecosystem services at more than world GDP. Once
          those services are in national accounts, company reports and investment decisions, protecting
          them becomes rational. Payment for ecosystem services, biodiversity offsets and green bonds turn
          conservation from a cost into an asset.
        against:
          - from: ecology.deep-ecology
            text: >
              Pricing a species means it can be sold, and anything with a price can be traded away for
              something with a higher one. Nature is not capital.
          - from: marxism.ecosocialism
            text: >
              "Natural capital" makes forests and wetlands into new assets for banks. Offsets let a firm
              destroy one place by paying to protect another, often by fencing out the people living there.
        sources:
          - {author: "Robert Costanza and others", title: "The value of the world's ecosystem services and natural capital", year: 1997, note: Nature}
          - {author: "David Pearce, Anil Markandya and Edward B. Barbier", title: Blueprint for a Green Economy, year: 1989}
          - {author: Partha Dasgupta, title: "The Economics of Biodiversity: The Dasgupta Review", year: 2021}
        traditions:
          defining: [ecology.green-growth]
          typical: [liberalism.utilitarian, liberalism.technocratic, liberalism.chicago, technology.effective-altruism]
          contested: [ecology.ecomodernism, conservatism.christian-democracy]
          rejects: [ecology.deep-ecology, marxism.ecosocialism, nationalism.indigenous-sovereignty, ecology.degrowth]
        presupposes: [value.source.subjective-utility]
        excludes: [nature.value.intrinsic]
        tension: [nature.value.kin-and-relation]
        tags: [natural-capital, market]
        analysis:
          gains: [finance-capital, professional-managerial]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Turning ecosystem functions into tradable credits creates new assets for banks, funds and
            consultancies; forests and wetlands in the South are enrolled in carbon and biodiversity markets,
            and local users face restrictions so that Northern buyers can claim the offset.
          drain: sustains
          law_of_value: extends
          method: idealist

      - id: nature.value.creation
        label: Nature is God's creation, held by us in trust
        claim: Nature is good because God made it, and human beings are its stewards, answerable for how they use and hand it on.
        voiced: "The earth is the Lord's, and the fullness thereof. We are tenants, not owners, and we will give an account."
        you: You think nature is God's creation, good in itself, and that people are its stewards rather than its owners.
        because: >
          Every creature reflects its Creator and has its own goodness, which is why the Psalms call on
          mountains and seas to praise God. Humans have a special place, but dominion means care, as a
          shepherd has dominion over a flock. Destroying creation is a sin against God, against the poor
          who depend on it, and against the generations to come. The cry of the earth and the cry of the
          poor are one cry. The same idea runs through Islamic teaching on the human being as trustee of the earth.
        against:
          - from: ecology.deep-ecology
            text: >
              Stewardship still puts humans at the top, managing the rest of life on God's behalf. The
              biblical command to "subdue the earth" is part of the problem.
          - from: liberalism.classical
            text: >
              A religious doctrine of stewardship cannot be the basis of public law in a plural society, and
              in practice it has coexisted comfortably with every kind of exploitation.
        sources:
          - {author: Pope Francis, title: "Laudato Si': On Care for Our Common Home", year: 2015}
          - {author: Leonardo Boff, title: "Ecologia: grito da terra, grito dos pobres", year: 1995, note: "English: Cry of the Earth, Cry of the Poor (1997)"}
          - {author: Seyyed Hossein Nasr, title: "Man and Nature: The Spiritual Crisis of Modern Man", year: 1968}
        traditions:
          defining: [conservatism.cst]
          typical: [religious.liberation-theology, conservatism.distributism, conservatism.christian-democracy, conservatism.traditionalist, religious.christian-socialism, anarchism.christian]
          contested: [conservatism.evangelical-right, religious.islamism-brotherhood]
          rejects: [libertarianism.objectivist, technology.e-acc]
        presupposes: [inequality.justice.stewardship]
        excludes: []
        tension: [nature.value.for-human-use]
        tags: [religion, stewardship]
        analysis:
          gains: [peasantry, petty-bourgeoisie]
          pays: [finance-capital]
          mechanism: >
            Stewardship doctrine supports limits on use and a duty to the poor, which favors small farmers and
            communities against speculative land and resource finance, but it acts through conscience and
            church teaching rather than through ownership, so its force depends on believers in power.
          drain: softens
          law_of_value: regulates
          disputed: >
            Liberation theologians draw from it a critique of capital; evangelical dominionists read stewardship
            as license to develop.
          method: idealist

      - id: nature.value.metabolism
        label: "Nature and labor make wealth together; what matters is how we run the exchange"
        claim: Nature is, with human labor, the source of all real wealth, and the question is not its value in itself but whether society governs its exchange with nature rationally or lets profit run it.
        voiced: "Labour is not the source of all wealth. Nature is just as much the source of use-values. The associated producers must govern their metabolism with nature rationally."
        you: You think nature and human work together create all real wealth, and the question is who controls how we use it.
        because: >
          Market prices count nature as free: the soil's fertility and the atmosphere's capacity enter no
          bill. So an economy run for exchange value will exhaust them. Asking whether a forest has value
          "in itself" moves the debate onto moral ground where nothing gets decided. The practical question
          is who governs the exchange between society and nature: owners chasing profit, or the producers
          themselves, planning for need and for the generations to come, as good heads of household
          hand on the earth improved.
        against:
          - from: ecology.deep-ecology
            text: >
              "Rational regulation" by "associated producers" still makes nature a means to human ends. A
              socialism that grows output for human need can be as destructive as capitalism.
          - from: nationalism.indigenous-sovereignty
            text: >
              Marxism speaks of metabolism and production; we speak of relations with relatives. Industrial
              planners from Moscow to Beijing dammed and drained our lands in the name of rational use.
        sources:
          - {author: Karl Marx, title: Critique of the Gotha Programme, year: 1891, note: "written 1875"}
          - {author: Karl Marx, title: "Capital, Volume III", year: 1894}
          - {author: Paul Burkett, title: "Marx and Nature: A Red and Green Perspective", year: 1999}
          - {author: John Bellamy Foster, title: "Marx's Ecology: Materialism and Nature", year: 2000}
        traditions:
          defining: [marxism.ecosocialism]
          typical: [marxism.degrowth-communism, marxism.classical, marxism.ml]
          contested: [ecology.degrowth, anarchism.communalism]
          rejects: [ecology.green-growth, ecology.deep-ecology, liberalism.chicago]
        presupposes: [value.source.labor]
        excludes: [nature.value.natural-capital]
        tension: [nature.value.intrinsic, nature.value.kin-and-relation]
        tags: [marxism, metabolic-rift]
        analysis:
          gains: [core-workers, peripheral-workers, peasantry]
          pays: [landed-capital, industrial-capital, finance-capital]
          mechanism: >
            Treating nature's use as a question of who governs production directs action at ownership of land,
            energy and industry, which threatens rents and profits drawn from cheap nature, and gives workers
            and peasants a claim to plan its use.
          drain: reduces
          law_of_value: abolishes
          method: materialist

      - id: nature.value.for-human-use
        label: Nature is there for people to use and improve
        claim: Nature has no value apart from people; it is raw material that human work and ingenuity turn into food, shelter, energy and wealth.
        voiced: "Land that is left wholly to nature is called, as indeed it is, waste. It is human labor and mind that make it valuable."
        you: You think nature matters for what people can make of it, and that using it well is how humanity progresses.
        because: >
          Untouched nature is not a garden: it is disease, famine, cold and early death, the condition our
          ancestors spent millennia escaping. Every improvement in human life came from transforming nature:
          draining swamps, damming rivers, mining ore, burning fuel. Value is what serves human life. Protect
          what people want protected, clean air, parks, beauty, but do not sacrifice human prosperity to
          the supposed rights of rivers or snails.
        against:
          - from: ecology.deep-ecology
            text: >
              The species that treats everything else as raw material is sawing off the branch it sits on.
              Human life itself depends on systems we do not understand and cannot replace.
          - from: conservatism.cst
            text: >
              Creation was given to all people and to all generations, not to whoever can seize and use it
              first. Unlimited use is pride, and the poor pay for it.
        sources:
          - {author: John Locke, title: Second Treatise of Government, year: 1689}
          - {author: Francis Bacon, title: Novum Organum, year: 1620}
          - {author: Ayn Rand, title: "The New Left: The Anti-Industrial Revolution", year: 1971}
        traditions:
          defining: [libertarianism.objectivist]
          typical: [technology.e-acc, liberalism.classical, libertarianism.minarchist, technology.transhumanism, technology.r-acc]
          contested: [ecology.ecomodernism, conservatism.evangelical-right, marxism.ml]
          rejects: [ecology.deep-ecology, nationalism.indigenous-sovereignty, conservatism.cst, anarchism.primitivist]
        presupposes: [property.private.natural-right]
        excludes: [nature.value.intrinsic, nature.value.kin-and-relation]
        tension: [nature.value.creation]
        tags: [dominion, property]
        analysis:
          gains: [industrial-capital, landed-capital, finance-capital, comprador-capital]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Defining unimproved land as waste justifies its appropriation by whoever brings capital to it, as
            Locke's argument justified colonial enclosure in the Americas; today it backs mining, logging and
            plantation concessions over customary and Indigenous use.
          drain: sustains
          law_of_value: extends

      - id: nature.value.homeland-of-a-people
        label: Nature is the homeland and blood of a people
        claim: The ecofascist and blood-and-soil view holds that nature's value lies in its bond with a particular people, so defending the land means defending that people's purity and borders; Nazi Germany paired this doctrine with conquest and extermination in the East.
        voiced: "The forest and the people are one. A people torn from its soil dies, and a soil given to strangers is lost."
        you: You think a nation's landscape is bound to its people by blood, and that protecting nature means protecting that people from outsiders.
        because: >
          As its proponents put it, a people grows out of its landscape over centuries, as a tree grows from
          its soil; its customs, character and health are shaped by the land. Cosmopolitan capitalism and
          communism alike uproot peoples, mix them, and turn the land into a commodity. To protect nature is
          to restore that bond: peasants on hereditary farms, forests protected as the nation's heritage,
          and foreigners kept out.
        against:
          - from: ecology.environmental-justice
            text: >
              Blood and soil produced not clean forests but the plan to empty Eastern Europe of Slavs and Jews.
              Its ecology is a cover for expulsion and murder.
          - from: conservatism.burkean
            text: >
              Love of a landscape is the inheritance of a whole community, including those who joined it.
              Turning it into a doctrine of blood corrupts the attachment it claims to honor.
        sources:
          - {author: Janet Biehl and Peter Staudenmaier, title: "Ecofascism: Lessons from the German Experience", year: 1995}
          - {author: Frank Uekötter, title: "The Green and the Brown: A History of Conservation in Nazi Germany", year: 2006}
        traditions:
          defining: [fascism.ecofascism]
          typical: [fascism.nazism, fascism.identitarian]
          contested: [nationalism.ethnic, fascism.traditionalist]
          rejects: [ecology.environmental-justice, marxism.ecosocialism, liberalism.classical, conservatism.cst, anarchism.green]
        presupposes: []
        excludes: [nature.value.kin-and-relation]
        tension: []
        tags: [ecofascism, blood-and-soil]
        analysis:
          gains: [landed-capital, petty-bourgeoisie, industrial-capital]
          pays: [peripheral-workers, peasantry, reserve-army]
          mechanism: >
            Tying land to an ethnic people justified dispossession of those defined as outsiders: in Nazi
            Germany, hereditary farm law for certified German families and plans to settle Germans on land
            taken in the East; today, closed borders that keep the core's land for its citizens.
          drain: sustains
          law_of_value: none

  # ------------------------------------------------------------------
  - id: energy.transition
    domain: ecology
    layer: horizon
    question: Who should pay for and own the energy transition?
    plain: The world must switch from coal, oil and gas. Who pays for the new grids and plants, and who owns them when it's done?
    short: the energy transition
    importance: 2
    region: ecology
    positions:
      - id: energy.transition.market-led
        label: Price carbon and let private investment build it
        claim: Governments should put a price on carbon and provide stable rules and some subsidies, and private firms and investors should build and own the new energy system.
        voiced: "Set the price, set the rules, and get out of the way. Private capital is the only pool big enough to rebuild the world's energy system."
        you: You think the transition should be built by private investors once governments set a carbon price and clear rules.
        because: >
          The investment needed runs to trillions of dollars a year, far beyond what governments can borrow.
          Private capital is already pouring into solar, wind and batteries where returns are clear. A carbon
          price, ideally with the revenue returned to citizens as a dividend, lets every firm find the
          cheapest cuts. Governments should de-risk early projects and fund research, then let competition
          drive costs down, as it already has for solar panels.
        against:
          - from: marxism.ecosocialism
            text: >
              Investors build only what pays, and the returns on renewables are lower and less certain than on
              oil. That is why fossil investment keeps rising. Profitability, not cost, is the barrier.
          - from: conservatism.right-populism
            text: >
              A carbon price is a tax on driving to work and heating your home, dressed up as economics. The
              people who designed it will not feel it.
        sources:
          - {author: William Nordhaus, title: "The Climate Casino: Risk, Uncertainty, and Economics for a Warming World", year: 2013}
          - {author: Climate Leadership Council, title: "Economists' Statement on Carbon Dividends", year: 2019}
          - {author: Nicholas Stern, title: "The Economics of Climate Change: The Stern Review", year: 2006}
        traditions:
          defining: [ecology.green-growth]
          typical: [liberalism.technocratic, liberalism.chicago, socdem.third-way, liberalism.ordoliberal, conservatism.christian-democracy]
          contested: [ecology.ecomodernism, libertarianism.minarchist]
          rejects: [marxism.ecosocialism, socdem.democratic-socialism, conservatism.right-populism]
        presupposes: [ecology.crisis-cause.market-failure]
        excludes: [energy.transition.public-ownership]
        tension: [energy.transition.state-industrial-policy]
        tags: [carbon-price, private-investment]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers, peripheral-workers, reserve-army]
          mechanism: >
            Public guarantees and subsidies absorb the risk while private owners keep the returns on new
            generation, grids and storage; carbon prices without full dividends raise energy bills, a larger
            share of the budgets of workers and the poor.
          drain: sustains
          law_of_value: extends
          disputed: >
            Christophers argues profitability, not price, blocks the transition, so market-led plans will
            stall; green-growth economists reply that falling costs will raise returns.

      - id: energy.transition.public-ownership
        label: Public ownership of energy, with a just transition for workers
        claim: Energy production and grids should be publicly owned and planned, the rich and the fossil firms should pay, and fossil-fuel workers should be guaranteed jobs and incomes.
        voiced: "Energy is a public good. Take it back from the shareholders, build it fast, and no coal miner left behind."
        you: You think energy should be publicly owned and planned, paid for by the rich and the polluters, with jobs guaranteed for energy workers.
        because: >
          Private energy firms will not build renewables at the speed required, because returns are thin,
          and will not write off fossil reserves they count as assets. A public owner can build for need,
          borrow cheaply, keep bills low, and plan the closure of coal and gas with the workers and towns
          that depend on them. Public power in Norway, Quebec and Costa Rica shows it works. The cost
          should fall on fossil profits and great fortunes, not on household bills.
        against:
          - from: liberalism.chicago
            text: >
              State energy monopolies have a record of overruns, political pricing and underinvestment.
              Competition is what drove solar and wind costs down.
          - from: marxism.third-worldism
            text: >
              A public utility in the North still buys its copper, lithium and cobalt at world prices from
              Southern mines. Nationalizing the grid at home does nothing about the drain abroad.
        sources:
          - {author: "Kate Aronoff, Alyssa Battistoni, Daniel Aldana Cohen and Thea Riofrancos", title: "A Planet to Win: Why We Need a Green New Deal", year: 2019}
          - {author: Matthew T. Huber, title: "Climate Change as Class War: Building Socialism on a Warming Planet", year: 2022}
          - {author: Brett Christophers, title: "The Price Is Wrong: Why Capitalism Won't Save the Planet", year: 2024}
        traditions:
          defining: [marxism.ecosocialism, socdem.democratic-socialism]
          typical: [socdem.labourism, marxism.ml, marxism.trotskyism, socdem.left-populism, anarchism.syndicalist]
          contested: [socdem.nordic, ecology.degrowth]
          rejects: [liberalism.chicago, ecology.green-growth, libertarianism.minarchist, conservatism.right-populism]
        presupposes: [firm.ownership.public-municipal]
        excludes: [energy.transition.market-led]
        tension: [energy.transition.no-to-green-extraction]
        tags: [public-ownership, just-transition]
        analysis:
          gains: [core-workers, reserve-army]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Public ownership removes generation and grids from private returns, so energy rents flow to the
            public budget and lower bills, while job guarantees protect fossil-sector workers; the losers are
            the shareholders and lenders of energy firms.
          drain: softens
          law_of_value: suspends
          disputed: >
            Third Worldists argue national public ownership in the core leaves the mineral drain intact unless
            paired with fair prices and Southern ownership of supply chains; Huber gives priority to core
            workers' power as the condition for any change abroad.
          consciousness: class-economic

      - id: energy.transition.state-industrial-policy
        label: The state directs investment to win the green industries
        claim: The state should plan and finance the build-out of solar, batteries, electric vehicles and grids through national development banks and industrial policy, so the nation owns the industries of the future.
        voiced: "Whoever makes the panels, the batteries and the cars will lead this century. The state must lead the investment, and the nation must own the supply chain."
        you: You think the state should drive investment into green industries so the nation leads and owns them.
        because: >
          Every major technology from the internet to solar cells was first financed by states, not
          venture capital. China's state banks, five-year plans and local governments turned solar panels
          and batteries from niche products into the cheapest energy technologies in history and made China
          their dominant producer. The United States answered with subsidies in 2022. A country that leaves
          this to the market will import its energy future.
        against:
          - from: ecology.degrowth
            text: >
              A race for green industrial dominance is still a race for growth, markets and minerals. It
              multiplies mining and makes the transition a weapon of great-power rivalry.
          - from: liberalism.austrian
            text: >
              Governments are bad at picking winners. Overcapacity, wasted subsidies and trade wars are the
              predictable results of industrial policy.
        sources:
          - {author: Mariana Mazzucato, title: "The Entrepreneurial State: Debunking Public vs. Private Sector Myths", year: 2013}
          - {author: Mariana Mazzucato, title: "Mission Economy: A Moonshot Guide to Changing Capitalism", year: 2021}
          - {author: Ha-Joon Chang, title: "Kicking Away the Ladder: Development Strategy in Historical Perspective", year: 2002}
        traditions:
          defining: [marxism.scc]
          typical: [nationalism.developmental-state, socdem.keynesian, liberalism.progressive, conservatism.national, conservatism.gaullism]
          contested: [marxism.ecosocialism, liberalism.technocratic]
          rejects: [liberalism.austrian, liberalism.chicago, libertarianism.minarchist, ecology.degrowth]
        presupposes: []
        excludes: []
        tension: [energy.transition.market-led, energy.transition.no-to-green-extraction]
        tags: [industrial-policy, china]
        analysis:
          gains: [industrial-capital, core-workers, professional-managerial]
          pays: [peripheral-workers, peasantry]
          mechanism: >
            State finance and procurement socialize the risk of building new industries and give national
            firms scale, raising the leading states' share of world manufacturing; demand for minerals
            rises, and mining countries supply them at world prices unless they process them at home.
          drain: softens
          law_of_value: regulates
          disputed: >
            Whether China's green industrial policy reduces the drain (by breaking Western technology
            monopolies and cutting prices for the South) or reproduces it (through new mineral dependencies
            in Africa and Latin America) is contested among Marxists.

      - id: energy.transition.resource-sovereignty
        label: Mineral countries must own and process their own lithium and cobalt
        claim: Countries that hold the transition's minerals, lithium, cobalt, copper and nickel, should own them, refine them at home and set the terms, instead of exporting raw ore to foreign firms.
        voiced: "Lithium is our oil. This time we will not be the quarry of the world: the brine, the refinery and the battery factory will be ours."
        you: You think countries that hold the minerals for clean energy should own and process them, and set the price.
        because: >
          For five centuries Latin America and Africa exported silver, rubber, copper and oil, and the
          wealth was made elsewhere. The energy transition repeats the pattern: Congo mines most of the
          world's cobalt, Chile, Argentina and Bolivia hold most known lithium, and the value is added in
          China, Korea, Europe and the United States. Bolivia put lithium under a state company, Mexico
          nationalized it in 2022, and Indonesia banned raw nickel exports in 2020 to force refining at home.
          Control of the minerals is the South's leverage.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              State lithium uses our water in the salt flats as surely as private lithium does. Resource
              nationalism changes the flag over the mine, not the mine.
          - from: liberalism.chicago
            text: >
              Nationalized mining has a record of corruption and underinvestment; Bolivia's state lithium has
              produced little in fifteen years while Chile and Argentina, open to investors, became major producers.
        sources:
          - {author: Eduardo Galeano, title: "Las venas abiertas de América Latina", year: 1971, note: "English: Open Veins of Latin America (1973)"}
          - {author: Thea Riofrancos, title: "Resource Radicals: From Petro-Nationalism to Post-Extractivism in Ecuador", year: 2020}
          - {author: Samir Amin, title: Delinking, year: 1985, note: "French original La déconnexion"}
        traditions:
          defining: [nationalism.bolivarianism]
          typical: [marxism.dependency, nationalism.developmental-state, marxism.african-socialism, nationalism.pan-africanism, marxism.third-worldism, nationalism.peronism]
          contested: [nationalism.indigenous-sovereignty, ecology.environmental-justice]
          rejects: [liberalism.chicago, liberalism.austrian, ecology.green-growth]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: []
        tension: [energy.transition.no-to-green-extraction]
        tags: [lithium, periphery, resource-nationalism]
        analysis:
          gains: [peripheral-workers, comprador-capital, industrial-capital]
          pays: [finance-capital, core-workers]
          mechanism: >
            State ownership and export bans raise the price and local share of value of minerals, moving rent
            from foreign mining and battery firms to the producing state, which raises costs for core
            manufacturers and consumers; how much reaches workers depends on who controls the state.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Amin's heirs back resource sovereignty as delinking; Gudynas and Svampa call it
            neo-extractivism, the same export model with more state rent.
          consciousness: hegemonic

      - id: energy.transition.no-to-green-extraction
        label: No new sacrifice zones for the North's green cars
        claim: The transition as planned demands new mines, dams and solar farms on Indigenous and peasant land in the South to power the North, and communities have the right to refuse them.
        voiced: "Your green transition is our new colonialism. They took our silver for their banks and our oil for their cars; now they want our water for their batteries."
        you: You think the clean-energy boom is creating new sacrifice zones in poor regions, and communities have the right to say no.
        because: >
          A single electric car battery needs tonnes of ore. Lithium in the Atacama draws down the water of
          Indigenous communities, cobalt in Katanga is mined by hand, including by children, and vast solar
          projects in North Africa are planned to send power to Europe. Replacing every Northern car one
          for one would multiply mining. The answer is less: fewer cars and more public transport in the
          North, consent and the right of refusal for communities, and an end to the extractive model.
        against:
          - from: ecology.ecomodernism
            text: >
              Mining for clean energy is a fraction of the mining for fossil fuels it replaces. Blocking mines
              keeps coal and oil running longer and hurts the poor most.
          - from: nationalism.bolivarianism
            text: >
              A poor nation cannot refuse its own wealth. Without mineral revenue there are no schools,
              clinics or pensions; the task is to control the extraction, not to forbid it.
        sources:
          - {author: Maristella Svampa, title: "Neo-extractivism in Latin America: Socio-environmental Conflicts, the Territorial Turn, and New Political Narratives", year: 2019}
          - {author: Eduardo Gudynas, title: "Extractivisms: Politics, Economy and Ecology", year: 2020}
          - {author: Hamza Hamouchene and Katie Sandwell (eds.), title: "Dismantling Green Colonialism: Energy and Climate Justice in the Arab Region", year: 2023}
        traditions:
          defining: []
          typical: [nationalism.indigenous-sovereignty, ecology.environmental-justice, zapatismo, ecology.degrowth, nationalism.decolonial, anarchism.green, marxism.degrowth-communism]
          contested: [marxism.ecosocialism, ecology.deep-ecology]
          rejects: [ecology.ecomodernism, ecology.green-growth, nationalism.bolivarianism, marxism.scc]
        presupposes: [ecology.crisis-cause.core-appropriation]
        excludes: []
        tension: [energy.transition.resource-sovereignty, energy.transition.public-ownership, energy.transition.state-industrial-policy]
        tags: [extractivism, green-colonialism, indigenous]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [industrial-capital, comprador-capital, finance-capital]
          mechanism: >
            Community vetoes and refusal raise the cost and slow the supply of transition minerals and land,
            cutting the profits of mining firms and their state partners, and forcing core demand down or the
            price up.
          drain: reduces
          law_of_value: suspends
          disputed: >
            Riofrancos and Huber note a dilemma: blocking mines can prolong fossil fuel use; post-extractivists
            answer that the dilemma exists only if Northern consumption is held fixed.

      - id: energy.transition.community-owned
        label: Communities and cooperatives should own their own power
        claim: Energy should be produced locally by cooperatives, towns and households, from sun and wind that cannot be monopolized, so that the gains stay where the power is made.
        voiced: "The sun sends no bill. Put the turbines and panels in the hands of the villages and cooperatives, and the power companies lose their grip on all of us."
        you: You think energy should be owned locally by cooperatives, towns and households rather than by big companies or the central state.
        because: >
          Fossil fuels came from a few places and required huge companies; sunlight and wind fall everywhere.
          Denmark built its wind industry on cooperatives owned by local residents, and German citizens,
          farmers and towns owned a large share of renewable capacity after 2000. Local ownership wins
          consent for turbines, keeps income in rural areas and breaks the political power of the energy
          giants. Neither multinationals nor distant ministries need to own the transition.
        against:
          - from: marxism.ecosocialism
            text: >
              Rooftop solar and village turbines cannot run steelworks or trains. Grids, storage and heavy
              industry need planning on a national scale, and cooperatives mostly benefit those with roofs and savings.
          - from: ecology.green-growth
            text: >
              Small-scale projects cost more per unit of energy than utility-scale ones. The cheapest path is
              large plants and a strong grid.
        sources:
          - {author: Hermann Scheer, title: Energieautonomie, year: 2005, note: "English: Energy Autonomy (2007)"}
          - {author: E. F. Schumacher, title: "Small Is Beautiful: A Study of Economics as if People Mattered", year: 1973}
          - {author: Murray Bookchin, title: The Ecology of Freedom, year: 1982}
        traditions:
          defining: []
          typical: [anarchism.communalism, anarchism.confederalism, conservatism.distributism, ecology.degrowth, socdem.nordic, anarchism.green, anarchism.mutualist]
          contested: [libertarianism.georgist, marxism.ecosocialism]
          rejects: [liberalism.chicago, marxism.ml]
        presupposes: [firm.ownership.commons-community]
        excludes: []
        tension: [energy.transition.state-industrial-policy]
        tags: [cooperatives, local, decentralization]
        analysis:
          gains: [petty-bourgeoisie, peasantry, core-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Local ownership moves the income from generation from utilities and their shareholders to
            cooperatives, farmers and municipalities; members with land, roofs or savings to invest gain most.
          drain: none
          law_of_value: regulates

      - id: energy.transition.keep-energy-cheap
        label: Keep oil, gas and coal; don't make working people pay
        claim: Fossil fuels should stay as long as they are the cheapest reliable energy, because forcing a fast transition raises bills, kills jobs and benefits subsidized green companies.
        voiced: "Drill, mine, and keep the lights on. The green transition is a tax on the working man paid to subsidy farmers."
        you: You think fossil fuels should stay as long as they are cheapest, and that working people should not pay for a forced transition.
        because: >
          Coal, oil and gas still supply about four fifths of the world's energy, and nothing yet replaces them
          in steel, cement, fertilizer, shipping and flight. Rushing the switch has raised power bills in
          Germany and Britain, shut mines and plants in towns that had nothing else, and handed subsidies to
          investors. Poor countries need cheap energy most. Let new sources compete on price; keep what works
          until they do.
        against:
          - from: ecology.green-growth
            text: >
              New solar and wind are now cheaper than new coal and gas in most of the world. The expensive
              path is clinging to old plants while the climate bill grows.
          - from: marxism.ecosocialism
            text: >
              The miners' jobs were destroyed by owners chasing profit long before climate policy. "Cheap
              energy" is the fossil companies' line, and it is their profits it protects.
        sources:
          - {author: Alex Epstein, title: "Fossil Future: Why Global Human Flourishing Requires More Oil, Coal, and Natural Gas, Not Less", year: 2022}
          - {author: Vaclav Smil, title: "How the World Really Works: The Science Behind How We Got Here and Where We're Going", year: 2022}
        traditions:
          defining: []
          typical: [conservatism.right-populism, conservatism.national, libertarianism.paleo, conservatism.paleo, commonsense.look-after-your-own, commonsense.declinist, conservatism.fusionism]
          contested: [socdem.labourism, nationalism.bolivarianism, liberalism.chicago]
          rejects: [ecology.green-growth, marxism.ecosocialism, ecology.degrowth, ecology.environmental-justice]
        presupposes: []
        excludes: [energy.transition.public-ownership, energy.transition.no-to-green-extraction]
        tension: []
        tags: [fossil-fuels, cost-of-living]
        analysis:
          gains: [industrial-capital, finance-capital, landed-capital, comprador-capital]
          pays: [peasantry, peripheral-workers, reserve-army]
          mechanism: >
            Delay protects the value of fossil reserves and plant and the rents of petro-states and their
            licensees, while workers' real wages remain exposed to fossil price swings and the costs of
            heating fall on farmers and the poor in the hottest regions.
          drain: sustains
          law_of_value: extends
          consciousness: economic-corporate

      - id: energy.transition.nuclear-abundance
        label: Build nuclear power and clean abundance for all
        claim: The transition should be built on large amounts of nuclear power alongside renewables, financed and backed by the state, so the whole world can have abundant clean energy.
        voiced: "France decarbonized its grid in fifteen years with reactors. Want to end poverty and save the climate? Split atoms."
        you: You think the transition should rely heavily on nuclear power so everyone can have plenty of clean energy.
        because: >
          Sweden and France built clean electricity grids within about fifteen years in the 1970s and 1980s,
          mostly with nuclear power, faster than any country has done with wind and sun. Nuclear plants run
          day and night on little land and kill fewer people per unit of power than any other source. The
          poor of the world need many times more energy than they use. Abundance, not rationing, is the goal,
          and that requires dense, reliable power backed by state finance.
        against:
          - from: ecology.degrowth
            text: >
              New reactors in Britain, France, Finland and the United States have come in years late and
              billions over budget. Betting the climate on them means more fossil fuel while we wait.
          - from: ecology.environmental-justice
            text: >
              Uranium is mined on Navajo, Aboriginal and Tuareg land, and waste is sent to the communities with
              least power. Nuclear abundance has its own sacrifice zones.
        sources:
          - {author: "John Asafu-Adjaye, Linus Blomqvist, Stewart Brand and others", title: An Ecomodernist Manifesto, year: 2015}
          - {author: Joshua S. Goldstein and Staffan A. Qvist, title: "A Bright Future: How Some Countries Have Solved Climate Change and the Rest Can Follow", year: 2019}
          - {author: Leigh Phillips, title: "Austerity Ecology and the Collapse-Porn Addicts: A Defence of Growth, Progress, Industry and Stuff", year: 2015}
        traditions:
          defining: [ecology.ecomodernism]
          typical: [technology.e-acc, conservatism.gaullism, liberalism.technocratic, technology.technocracy, marxism.scc]
          contested: [marxism.ecosocialism, ecology.green-growth, conservatism.national]
          rejects: [ecology.degrowth, ecology.deep-ecology, anarchism.green, ecology.environmental-justice]
        presupposes: []
        excludes: [energy.transition.community-owned]
        tension: [energy.transition.no-to-green-extraction]
        tags: [nuclear, abundance]
        analysis:
          gains: [industrial-capital, professional-managerial, core-workers]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            State-backed nuclear programs channel public finance to reactor builders and engineering firms and
            secure steady skilled jobs, while uranium mining and waste siting fall on Indigenous and peripheral
            communities from Niger to Saskatchewan.
          drain: softens
          law_of_value: regulates
          disputed: >
            Ecomodernist socialists (Huber, Phillips) see public nuclear as a workers' program; ecosocialists
            in the Foster line and degrowth thinkers see centralized nuclear as a technology that concentrates
            control in states and capital.

  # ------------------------------------------------------------------
  - id: technology.nature
    domain: ecology
    layer: analysis
    question: Is technology a neutral tool, capital's weapon, a liberation, or a threat?
    plain: When a new machine or app arrives, is it just a tool, or does it come with someone's interests built in?
    short: the nature of technology
    importance: 2
    region: technology
    positions:
      - id: technology.nature.neutral-tool
        label: A neutral tool; it depends how you use it
        claim: Technology is a tool like a hammer; it can build a house or break a skull, and the good or harm lies in how people choose to use it.
        voiced: "A knife can cut bread or cut a throat. Blame the hand, not the blade."
        you: You think technology is neutral and that what matters is how people choose to use it.
        because: >
          The same chemistry makes fertilizer and explosives; the same network carries hospital records and
          scams. Machines have no aims of their own. Treating technology as good or evil in itself leads
          either to blind enthusiasm or to blocking useful inventions out of fear. The sensible course is
          to adopt what helps, and make laws against harmful uses, as societies have done with cars, drugs
          and radio.
        against:
          - from: marxism.autonomism
            text: >
              Machines are designed by someone for something. The assembly line was built to take control of
              the pace of work from the worker; it does that whoever "uses" it.
          - from: anarchism.christian
            text: >
              A technology brings its own demands: the car brings motorways, sprawl and oil wars. You cannot
              take the tool and refuse the world it builds.
        sources:
          - {author: Emmanuel G. Mesthene, title: "Technological Change: Its Impact on Man and Society", year: 1970}
          - {author: Karl Popper, title: The Poverty of Historicism, year: 1957}
        traditions:
          defining: []
          typical: [liberalism.classical, liberalism.progressive, liberalism.technocratic, liberalism.social, commonsense.live-and-let-live]
          contested: [marxism.ml, technology.effective-altruism]
          rejects: [marxism.autonomism, anarchism.christian, anarchism.primitivist, technology.r-acc]
        presupposes: []
        excludes: [technology.nature.capitals-weapon, technology.nature.autonomous-force]
        tension: [technology.nature.built-in-politics]
        tags: [common-sense, neutrality]
        analysis:
          gains: [industrial-capital, professional-managerial]
          pays: []
          mechanism: >
            Treating technology as neutral leaves its design and introduction to the firms that pay for it,
            and limits public response to after-the-fact rules on misuse, so owners decide what is built and
            what it does to work.
          drain: none
          law_of_value: none
          method: idealist

      - id: technology.nature.capitals-weapon
        label: Capital's weapon against labor
        claim: Under capitalism, machines are designed and introduced to control workers, cut wages and take skill away from labor, so technology carries the interests of its owners.
        voiced: "Machinery is the most powerful weapon for suppressing strikes. It is the capitalist use of machines, not machines as such, that we fight, and the two cannot be separated under capital."
        you: You think technology under capitalism is built to control workers and cut labor costs, not just to make life better.
        because: >
          Marx showed that machinery was introduced in the factories to break the power of skilled workers
          and lengthen the working day. Numerically controlled machine tools in the United States were chosen
          over equally good alternatives because they moved knowledge from the shop floor to management.
          British industry chose steam over water to put mills near cheap, docile labor. The warehouse
          scanner and the delivery app continue the story. Technology bears the mark of the class that
          commissions it.
        against:
          - from: technology.e-acc
            text: >
              Machines made textiles, food and light cheap for everyone, workers first. Every generation
              predicted mass unemployment from new machines; instead real wages rose.
          - from: marxism.ml
            text: >
              The productive forces are the base of socialism. Seeing machines as enemies confuses the
              capitalist use of technology with technology itself and leads to Luddism.
        sources:
          - {author: Karl Marx, title: "Capital, Volume I", year: 1867, note: "chapter 15, Machinery and Modern Industry"}
          - {author: Raniero Panzieri, title: "Sull'uso capitalistico delle macchine nel neocapitalismo", year: 1961, note: "Quaderni Rossi; English: The Capitalist Use of Machinery"}
          - {author: Harry Braverman, title: "Labor and Monopoly Capital: The Degradation of Work in the Twentieth Century", year: 1974}
          - {author: David F. Noble, title: "Forces of Production: A Social History of Industrial Automation", year: 1984}
        traditions:
          defining: [marxism.autonomism]
          typical: [marxism.classical, marxism.western, marxism.ecosocialism, anarchism.syndicalist, marxism.council-communism]
          contested: [marxism.ml, technology.l-acc]
          rejects: [technology.e-acc, liberalism.chicago, liberalism.austrian, technology.cyberlibertarian]
        presupposes: [workplace.conflict.structural-antagonism]
        excludes: [technology.nature.neutral-tool]
        tension: [technology.nature.liberation]
        tags: [labor-process, automation]
        analysis:
          gains: [core-workers, peripheral-workers, reserve-army]
          pays: [industrial-capital]
          mechanism: >
            Seeing technology as a weapon of control lets workers contest its design, pace and introduction
            at the workplace, through bargaining or refusal, which cuts the cost savings owners expect from
            new machines.
          drain: none
          law_of_value: regulates
          consciousness: class-economic

      - id: technology.nature.liberation
        label: Technology is how humanity frees itself
        claim: Technology is the main engine of human progress, freeing people from hunger, disease and toil, and more of it, faster, is the answer to most problems.
        voiced: "Technology is the glory of human ambition and achievement. There is no material problem that cannot be solved with more technology."
        you: You think technology is the main way humanity frees itself from poverty, disease and drudgery, and want more of it, faster.
        because: >
          Two centuries ago most people lived in extreme poverty and half of all children died young. What
          changed was not morals or politics but steam, electricity, fertilizer, antibiotics, vaccines and
          computers. Every problem now facing humanity, from climate to disease to scarcity, is a problem of
          knowledge, and knowledge can grow without limit. Those who would slow innovation condemn the poor
          to stay poor.
        against:
          - from: marxism.autonomism
            text: >
              The same two centuries brought the factory system, the machine gun and the gas chamber. Whether
              technology frees or binds depends on who owns it.
          - from: conservatism.traditionalist
            text: >
              The power to do more is not the wisdom to know what is worth doing. A society that worships
              technology loses the things no machine can supply: meaning, community, faith.
        sources:
          - {author: David Deutsch, title: "The Beginning of Infinity: Explanations That Transform the World", year: 2011}
          - {author: Marc Andreessen, title: The Techno-Optimist Manifesto, year: 2023}
          - {author: Joel Mokyr, title: "The Lever of Riches: Technological Creativity and Economic Progress", year: 1990}
        traditions:
          defining: [technology.e-acc]
          typical: [technology.transhumanism, ecology.ecomodernism, technology.cyberlibertarian, libertarianism.objectivist, technology.l-acc, marxism.scc]
          contested: [technology.effective-altruism, marxism.ml]
          rejects: [anarchism.primitivist, anarchism.christian, conservatism.traditionalist, ecology.degrowth, ecology.deep-ecology]
        presupposes: [history.motor.ideas]
        excludes: [technology.nature.autonomous-force]
        tension: [technology.nature.capitals-weapon]
        tags: [techno-optimism, progress]
        analysis:
          gains: [finance-capital, industrial-capital, professional-managerial]
          pays: [core-workers, peripheral-workers]
          mechanism: >
            Crediting progress to technology as such legitimates the owners of technology firms and venture
            funds as its agents, and casts limits on their products, or demands by the workers displaced by
            them, as obstacles to progress.
          drain: sustains
          law_of_value: extends
          disputed: >
            Marxists in the productivist line (and left accelerationists) share the view that technology frees
            once owned in common; autonomists and ecosocialists reply that design embodies the relations it was built for.

      - id: technology.nature.autonomous-force
        label: Technique has its own logic and is swallowing human life
        claim: Modern technology is not a set of tools but a system with its own logic of efficiency, which reshapes work, politics and thought to its needs, and human beings are losing control of it.
        voiced: "Technique has become autonomous. It no longer serves man; man adapts himself to technique."
        you: You think modern technology runs on its own logic and is reshaping human life in ways nobody chose.
        because: >
          Every efficient method, once found, must be adopted, because whoever refuses it loses to whoever
          does. So technology spreads by its own momentum, demanding standardized workers, managed citizens
          and endless growth, under capitalism and socialism alike. People do not choose the smartphone, the
          motorway or the industrial farm; they are made to fit them. Freedom begins by refusing the
          promise that the next device will fix what the last one broke.
        against:
          - from: marxism.classical
            text: >
              "Technique" does nothing by itself; capital competes, and that is why methods spread. Making
              technology a demon hides the class that profits from it and makes change look hopeless.
          - from: technology.e-acc
            text: >
              The people who lived without modern technology died young and hungry. Nostalgia for the
              pre-industrial world is a luxury of those who never lived in it.
        sources:
          - {author: Jacques Ellul, title: "La Technique ou l'enjeu du siècle", year: 1954, note: "English: The Technological Society (1964)"}
          - {author: Martin Heidegger, title: "The Question Concerning Technology", year: 1954}
          - {author: Lewis Mumford, title: "The Myth of the Machine: Technics and Human Development", year: 1967}
          - {author: Neil Postman, title: "Technopoly: The Surrender of Culture to Technology", year: 1992}
        traditions:
          defining: [anarchism.christian]
          typical: [anarchism.primitivist, anarchism.green, conservatism.traditionalist, conservatism.postliberal, ecology.deep-ecology, nationalism.gandhian]
          contested: [marxism.western, ecology.degrowth, technology.longtermism]
          rejects: [technology.e-acc, technology.transhumanism, ecology.ecomodernism, marxism.ml, technology.cyberlibertarian]
        presupposes: []
        excludes: [technology.nature.neutral-tool, technology.nature.liberation]
        tension: [technology.nature.capitals-weapon]
        tags: [luddite, ellul, critique-of-technology]
        analysis:
          gains: [petty-bourgeoisie, peasantry]
          pays: []
          mechanism: >
            By locating the danger in technique rather than in ownership it backs refusal and small-scale
            alternatives, which shelter some small producers and communities from industrial competition, but
            it gives no one a lever over the firms that decide what technology is built.
          drain: none
          law_of_value: none
          disputed: >
            Some Marxists (Feenberg, Marcuse) take Ellul's and Heidegger's diagnosis seriously but answer that
            technology's logic is capital's logic and can be redesigned.
          method: idealist

      - id: technology.nature.core-monopoly
        label: Technology monopoly is how rich countries keep the rest dependent
        claim: Control of technology, through patents, research budgets and export controls, is one of the main ways rich countries keep poorer ones as suppliers of cheap labor and raw materials.
        voiced: "The monopoly of technology is the first of the five monopolies by which the center rules the periphery. You may build the factory; you will pay rent on every machine in it."
        you: You think rich countries use their control of technology to keep poorer countries dependent and paying.
        because: >
          The United States, Europe and Japan hold most of the world's patents and charge royalties on them;
          the WTO's TRIPS agreement of 1994 made those rules global. A factory in Bangladesh or Mexico can
          assemble phones or garments but the profit goes to whoever owns the design and the brand. When a
          Southern country closes the gap, as Korea did and China is doing, it is met with tariffs, sanctions
          and bans on chips. Technology is not a neutral gift but a rent collected on the South.
        against:
          - from: liberalism.chicago
            text: >
              Patents reward invention, and technology has spread faster to poor countries in the last forty
              years than ever before. Korea, Taiwan and China caught up by joining world markets, not leaving them.
          - from: marxism.autonomism
            text: >
              Owning the technology nationally changes who collects the rent, not what the machines do to the
              workers who run them. The Chinese factory disciplines labor like the American one.
        sources:
          - {author: Samir Amin, title: Capitalism in the Age of Globalization, year: 1997}
          - {author: Ha-Joon Chang, title: "Kicking Away the Ladder: Development Strategy in Historical Perspective", year: 2002}
          - {author: Cecilia Rikap, title: "Capitalism, Power and Innovation: Intellectual Monopoly Capitalism Uncovered", year: 2021}
        traditions:
          defining: [marxism.third-worldism]
          typical: [marxism.dependency, nationalism.developmental-state, marxism.scc, marxism.world-systems, nationalism.decolonial, marxism.african-socialism]
          contested: [technology.l-acc, marxism.autonomism]
          rejects: [liberalism.chicago, liberalism.internationalist, technology.cyberlibertarian]
        presupposes: [imperialism.nature.unequal-exchange-drain]
        excludes: [technology.nature.neutral-tool]
        tension: []
        tags: [periphery, intellectual-property, monopoly]
        analysis:
          gains: [peripheral-workers, industrial-capital]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Breaking technology monopolies, by compulsory licensing, reverse engineering and state research,
            cuts the royalties and brand rents that core firms collect on goods made in the South and lets
            Southern producers keep more of the value they create.
          drain: breaks
          law_of_value: regulates
          disputed: >
            Marxists dispute whether China's rise in technology breaks the core monopoly (Amin's late view,
            Arrighi) or creates a new core (Ho-fung Hung and others).
          consciousness: hegemonic

      - id: technology.nature.code-escapes-control
        label: Technology lets individuals escape the state's control
        claim: Networks, encryption and digital money let individuals communicate, trade and organize beyond the reach of governments, and that is their great virtue.
        voiced: "Governments of the Industrial World, you weary giants of flesh and steel, I come from Cyberspace, the new home of Mind. You have no sovereignty where we gather."
        you: You think technologies like encryption and digital money let people escape government control, and that this is good.
        because: >
          Every earlier communications technology, from the press to broadcasting, ended up licensed and
          watched by states. The internet and strong encryption break that pattern: code is borderless, and
          mathematics cannot be censored. Bitcoin lets people hold money no central bank can debase and no
          government can freeze, which matters most to people under inflation and capital controls in
          Argentina, Nigeria or Lebanon. Build the tools and the state's monopolies erode by themselves.
        against:
          - from: marxism.western
            text: >
              The "free" internet became five companies harvesting attention and data, and states learned to
              surveil through them. Escaping the state delivered people to the platform owners.
          - from: liberalism.progressive
            text: >
              Untraceable money and unmoderated networks serve ransomware gangs, fraudsters and harassers
              first. The rule of law has to reach online.
        sources:
          - {author: Timothy C. May, title: The Crypto Anarchist Manifesto, year: 1988}
          - {author: John Perry Barlow, title: A Declaration of the Independence of Cyberspace, year: 1996}
          - {author: Satoshi Nakamoto, title: "Bitcoin: A Peer-to-Peer Electronic Cash System", year: 2008}
        traditions:
          defining: [technology.cyberlibertarian]
          typical: [libertarianism.ancap, libertarianism.minarchist, anarchism.individualist, libertarianism.paleo, technology.e-acc]
          contested: [anarchism.insurrectionary, technology.transhumanism]
          rejects: [marxism.western, liberalism.progressive, technology.technocracy, conservatism.national]
        presupposes: [state.nature.necessary-evil]
        excludes: []
        tension: [technology.nature.capitals-weapon]
        tags: [crypto, internet]
        analysis:
          gains: [finance-capital, professional-managerial, petty-bourgeoisie]
          pays: [core-workers, reserve-army]
          mechanism: >
            Escaping public regulation and taxation benefits those who own the networks, the coins and the
            skills to use them; early holders and platform owners gain, while losses from fraud and volatility
            fall on late small buyers.
          drain: none
          law_of_value: extends
          disputed: >
            Some anarchists see encryption as a real tool of resistance for dissidents; Marxist critics (Golumbia)
            see cyberlibertarianism as the ideology of the technology industry.

      - id: technology.nature.built-in-politics
        label: Technology has politics built in, and can be redesigned
        claim: Every technology carries the choices and interests of those who designed it, so the task is not to accept or reject technology but to change who designs it and for what.
        voiced: "Artifacts have politics. The question is never 'technology, yes or no' but 'whose technology, built for whom?'"
        you: You think technologies carry their makers' interests, and that people should have a say in how they are designed.
        because: >
          The low bridges on New York parkways kept buses, and so the poor, away from the beaches; a factory
          can be laid out for surveillance or for teamwork. Design is a series of social choices, which means
          it can be made differently. Workers, users and communities can and should shape technology: through
          unions, public research, open standards, participatory design and public ownership of platforms.
          Neither worship nor refusal; democratic control of design.
        against:
          - from: anarchism.christian
            text: >
              Participation in design is a comforting idea, but the system's need for efficiency always wins.
              You will be invited to choose the color of the cage.
          - from: liberalism.austrian
            text: >
              Design by committee kills invention. The best technologies came from individuals testing ideas in
              markets, not from democratic deliberation.
        sources:
          - {author: Langdon Winner, title: "Do Artifacts Have Politics?", year: 1980}
          - {author: Andrew Feenberg, title: Critical Theory of Technology, year: 1991}
          - {author: Donna Haraway, title: "A Cyborg Manifesto", year: 1985}
        traditions:
          defining: []
          typical: [marxism.western, socdem.democratic-socialism, feminism.materialist, liberalism.progressive, marxism.autonomism, technology.l-acc]
          contested: [marxism.ml, anarchism.communalism]
          rejects: [technology.e-acc, anarchism.primitivist]
        presupposes: []
        excludes: []
        tension: [technology.nature.neutral-tool, technology.nature.autonomous-force]
        tags: [design, sts]
        analysis:
          gains: [core-workers, professional-managerial]
          pays: [industrial-capital]
          mechanism: >
            Opening design to workers and users moves decisions about pace, surveillance and deskilling out of
            management alone, which limits the control and savings owners expect from technology; engineers and
            professionals gain a mediating role.
          drain: none
          law_of_value: regulates

  # ------------------------------------------------------------------
  - id: automation.ownership
    domain: ecology
    layer: horizon
    question: Who should own automation and AI, and who gets the gains?
    plain: If robots and software can do much of the work, who should own them, and what happens to the people whose jobs they take?
    short: the ownership of automation
    importance: 3
    region: technology
    positions:
      - id: automation.ownership.investors-and-markets
        label: Whoever invests owns it; markets spread the gains
        claim: Those who invest in machines and software should own them; the gains reach everyone through cheaper goods, new industries and new jobs.
        voiced: "Machines have been 'taking jobs' for two hundred years, and there are more jobs than ever. What the machine saves, the consumer spends elsewhere."
        you: You think automation should belong to those who invest in it, and that cheaper goods and new jobs will spread the gains.
        because: >
          When looms, tractors and computers arrived, the workers they replaced were absorbed into new work,
          and real incomes rose. Lower costs mean lower prices, which leave buyers more to spend on other
          things, which creates new jobs. Investors take the risk of building new machines; if they could
          not keep the returns they would not build them. Help people retrain, but do not punish the
          investment that makes everyone richer.
        against:
          - from: technology.l-acc
            text: >
              Productivity has grown far faster than wages since the 1970s. The gains of automation have gone
              to owners, and the new jobs are delivery, care and warehouse work at the minimum wage.
          - from: socdem.nordic
            text: >
              Adjustment does not happen by itself; it happens when unions and the state make it happen. Leave
              it to the market and whole towns rot for a generation.
        sources:
          - {author: Frédéric Bastiat, title: "Ce qu'on voit et ce qu'on ne voit pas", year: 1850, note: "English: That Which Is Seen and That Which Is Not Seen"}
          - {author: Henry Hazlitt, title: Economics in One Lesson, year: 1946}
        traditions:
          defining: []
          typical: [liberalism.chicago, liberalism.austrian, libertarianism.minarchist, libertarianism.objectivist, technology.e-acc, liberalism.classical, commonsense.self-reliance]
          contested: [liberalism.technocratic, technology.cyberlibertarian]
          rejects: [technology.l-acc, marxism.autonomism, socdem.democratic-socialism, anarchism.syndicalist]
        presupposes: [property.private.natural-right, firm.ownership.private-investors]
        excludes: [automation.ownership.common-ownership]
        tension: [automation.ownership.bargain-and-share]
        tags: [market, automation]
        analysis:
          gains: [finance-capital, industrial-capital]
          pays: [core-workers, reserve-army, peripheral-workers]
          mechanism: >
            Private ownership of automated capital gives its owners the productivity gain as profit, while
            displaced workers enlarge the labor supply and press wages down; low-wage assembly in the
            periphery loses its edge once machines are cheaper than workers there.
          drain: sustains
          law_of_value: extends

      - id: automation.ownership.dividend
        label: Share the gains through a basic income or a public dividend
        claim: Automation can stay mostly in private hands, but a share of its gains should be paid to everyone as a basic income or a dividend from a public fund.
        voiced: "If the robots do the work, everyone gets a cut. A universal basic income is the dividend of a society that has become productive enough to afford freedom."
        you: You think the gains of automation should be shared with everyone through a basic income or public dividend.
        because: >
          If machines can produce most goods with less labor, tying income to jobs will leave millions
          without either. An unconditional income paid to every citizen, funded by taxes on capital, land,
          data or carbon, or by a public fund that owns shares in automated industry, as Alaska's oil fund
          pays residents, lets people refuse bad jobs, care for others and start projects. It is simple,
          does not stigmatize, and does not require planning the economy.
        against:
          - from: socdem.democratic-socialism
            text: >
              A basic income left on top of private ownership is a subsidy to employers and landlords, who will
              capture it in rents and lower wages. Own the machines, don't beg for a dividend.
          - from: conservatism.cst
            text: >
              Work is not only income but a vocation and a share in creation. Paying people to be idle wounds
              their dignity.
        sources:
          - {author: Philippe Van Parijs and Yannick Vanderborght, title: "Basic Income: A Radical Proposal for a Free Society and a Sane Economy", year: 2017}
          - {author: Martin Ford, title: "Rise of the Robots: Technology and the Threat of a Jobless Future", year: 2015}
          - {author: Thomas Paine, title: Agrarian Justice, year: 1797}
        traditions:
          defining: [libertarianism.left]
          typical: [liberalism.progressive, technology.effective-altruism, technology.transhumanism, libertarianism.georgist, socdem.left-populism]
          contested: [technology.l-acc, socdem.democratic-socialism, technology.cyberlibertarian, socdem.nordic]
          rejects: [conservatism.cst, liberalism.austrian, marxism.ml]
        presupposes: []
        excludes: []
        tension: [automation.ownership.common-ownership, automation.ownership.bargain-and-share]
        tags: [basic-income, dividend]
        analysis:
          gains: [core-workers, reserve-army, petty-bourgeoisie]
          pays: [finance-capital, landed-capital]
          mechanism: >
            An income floor funded by taxes on capital and rent transfers part of the automation surplus to
            citizens and raises workers' bargaining power, but leaves ownership and investment decisions with
            capital, and stops at the national border.
          drain: none
          law_of_value: regulates
          disputed: >
            Some Marxists (Srnicek, Williams) see basic income as a lever toward post-work society; others
            (Gourevitch, Huber) see it as compatible with deepening private ownership.

      - id: automation.ownership.common-ownership
        label: Own the machines in common and cut the working week
        claim: Automated production should be owned in common and used to cut working hours and provide abundance for all, instead of profit for a few.
        voiced: "Demand full automation. Demand the reduction of the working week. Demand a universal basic income. Demand the end of the work ethic."
        you: You think automated production should be owned in common and used to give everyone more free time and plenty.
        because: >
          Machines could already free most people from much of their work, but under private ownership a
          productivity gain becomes either profit or unemployment, never free time. Marx foresaw that once
          production rests on science and machinery, measuring wealth by labor time becomes absurd. Socialize
          the platforms and the automated industries, share the remaining work out among everyone, and the
          gain becomes a shorter week, free services and abundance. Technology is the precondition of a
          post-work society, not its enemy.
        against:
          - from: liberalism.austrian
            text: >
              Socialized platforms would have no prices, no competition and no reason to innovate. Abundance
              comes from the system you propose to abolish.
          - from: ecology.degrowth
            text: >
              "Fully automated luxury" for eight billion people means mines, data centers and power stations
              without end. Abundance has a material footprint.
        sources:
          - {author: Karl Marx, title: Grundrisse, year: 1939, note: "written 1857–58; contains the Fragment on Machines"}
          - {author: Nick Srnicek and Alex Williams, title: "Inventing the Future: Postcapitalism and a World Without Work", year: 2015}
          - {author: Aaron Bastani, title: "Fully Automated Luxury Communism: A Manifesto", year: 2019}
        traditions:
          defining: [technology.l-acc]
          typical: [marxism.autonomism, socdem.democratic-socialism, marxism.classical, anarchism.communist]
          contested: [ecology.degrowth, marxism.ecosocialism, marxism.ml]
          rejects: [liberalism.austrian, liberalism.chicago, technology.e-acc, technology.r-acc]
        presupposes: [property.private.personal-vs-productive]
        excludes: [automation.ownership.investors-and-markets]
        tension: [automation.ownership.dividend]
        tags: [post-work, socialism]
        analysis:
          gains: [core-workers, reserve-army, peripheral-workers]
          pays: [finance-capital, industrial-capital]
          mechanism: >
            Common ownership of automated capital turns productivity gains into shorter hours and free goods
            rather than profit, removing returns on platforms and machines from their present owners.
          drain: reduces
          law_of_value: abolishes
          disputed: >
            Third Worldists note that the hardware of automation depends on mining and assembly in the
            periphery; a post-work core that leaves those relations intact would still rest on the drain.
          consciousness: hegemonic

      - id: automation.ownership.bargain-and-share
        label: Workers bargain over new machines and share the gains
        claim: Unions and the state should negotiate how automation is introduced, so that productivity gains are shared through higher wages, shorter hours, retraining and job security.
        voiced: "We are not against new machines. We are against new machines that only make the owner richer. Bargain over them, and share what they make."
        you: You think unions and government should bargain over how automation comes in, so workers share in what it produces.
        because: >
          Swedish unions in the 1950s accepted new technology and the closure of unprofitable plants, and in
          return won solidaristic wages, retraining and active labor market policy, which kept unemployment
          low through rapid change. German works councils have a say in new technology at work. History shows
          the direction of technology is a choice: when workers have power, automation raises wages; when
          they do not, it replaces them. Give labor a seat at the table and the gains are shared.
        against:
          - from: marxism.autonomism
            text: >
              Bargaining over the pace of your own replacement still accepts the owner's right to replace you.
              Each deal buys a few years of calm for a shrinking core of members.
          - from: liberalism.chicago
            text: >
              Union vetoes slow productivity growth and drive investment abroad, which costs more jobs than it saves.
        sources:
          - {author: Gösta Rehn and Rudolf Meidner, title: Fackföreningsrörelsen och den fulla sysselsättningen, year: 1951, note: "LO report; English: Trade Unions and Full Employment"}
          - {author: Daron Acemoglu and Simon Johnson, title: "Power and Progress: Our Thousand-Year Struggle Over Technology and Prosperity", year: 2023}
        traditions:
          defining: [socdem.nordic]
          typical: [socdem.labourism, socdem.keynesian, conservatism.christian-democracy, liberalism.social, conservatism.cst]
          contested: [anarchism.syndicalist, socdem.democratic-socialism]
          rejects: [liberalism.chicago, libertarianism.minarchist, technology.e-acc]
        presupposes: [unions.role.bargaining-agent]
        excludes: []
        tension: [automation.ownership.investors-and-markets, automation.ownership.refuse-it]
        tags: [unions, codetermination]
        analysis:
          gains: [core-workers, professional-managerial]
          pays: [industrial-capital]
          mechanism: >
            Collective bargaining over technology lets organized workers claim part of the productivity gain
            as wages and hours, at the cost of owners' margins; workers without unions, and peripheral workers
            in the supply chain, are outside the bargain.
          drain: none
          law_of_value: regulates
          consciousness: economic-corporate

      - id: automation.ownership.refuse-it
        label: Refuse machines that degrade work and community
        claim: Workers and communities should have the right to refuse, slow down or break technologies that destroy their livelihoods, skills and ways of life.
        voiced: "The Luddites were right. They did not hate machines; they hated machines used against them, and so do we."
        you: You think workers and communities should be able to refuse or stop technologies that wreck their jobs and lives.
        because: >
          The original Luddites of 1811 were skilled textile workers who broke machines used to undercut wages and
          make shoddy cloth, and they had wide popular support. They lost, and a generation of misery
          followed. Today ride-hail apps, warehouse algorithms and generative AI are introduced with the same
          aim: cheaper, more controllable labor. There is no law of history that says every invention must be
          accepted. Strikes, boycotts, bans and moratoria can stop technologies that serve the few, as
          Hollywood writers limited AI in their 2023 contract.
        against:
          - from: technology.l-acc
            text: >
              Breaking machines defends a shrinking number of jobs and leaves capital in control of the future.
              The goal is to seize the machines, not smash them.
          - from: liberalism.chicago
            text: >
              Had the Luddites won, we would all still weave by hand and live in poverty. Protecting today's
              jobs by blocking tomorrow's is a tax on the young and the poor.
        sources:
          - {author: E. P. Thompson, title: The Making of the English Working Class, year: 1963}
          - {author: Kirkpatrick Sale, title: "Rebels Against the Future: The Luddites and Their War on the Industrial Revolution", year: 1995}
          - {author: Gavin Mueller, title: "Breaking Things at Work: The Luddites Are Right About Why You Hate Your Job", year: 2021}
          - {author: Brian Merchant, title: "Blood in the Machine: The Origins of the Rebellion Against Big Tech", year: 2023}
        traditions:
          defining: []
          typical: [anarchism.green, anarchism.primitivist, anarchism.christian, marxism.autonomism, anarchism.insurrectionary, nationalism.gandhian]
          contested: [anarchism.syndicalist, conservatism.traditionalist]
          rejects: [technology.e-acc, technology.l-acc, liberalism.chicago, technology.transhumanism]
        presupposes: [technology.nature.capitals-weapon]
        excludes: [automation.ownership.investors-and-markets]
        tension: [automation.ownership.common-ownership]
        tags: [luddite, refusal]
        analysis:
          gains: [core-workers, petty-bourgeoisie]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Refusal through strikes, contract terms and bans blocks the cost savings owners expect from new
            technology, protecting existing wages and skills; groups with leverage, such as unionized writers,
            gain most.
          drain: none
          law_of_value: regulates
          consciousness: economic-corporate

      - id: automation.ownership.engineers-plan
        label: Let engineers and experts run automated production for abundance
        claim: Automated production should be run by engineers and scientists according to physical measures of need and capacity, not by owners chasing profit or by politicians.
        voiced: "Replace the price system with a system of energy accounting. Production is an engineering problem; let the engineers run it."
        you: You think automated production should be run by engineers and experts on technical grounds, not by investors or politicians.
        because: >
          Modern industry could already produce plenty for all, but businessmen restrict output to keep prices
          up, and politicians understand nothing of the machines. Measure production and consumption in
          physical units, energy above all, and let those who understand the system run it for maximum
          output at minimum waste. Data and computing now make what the engineers of the 1930s imagined
          possible: an economy steered by measurement rather than by money or votes.
        against:
          - from: liberalism.austrian
            text: >
              No engineer knows what people want or how much of one thing to give up for another; only prices
              tell you. Rule by experts is central planning with a slide rule.
          - from: anarchism.communist
            text: >
              A class of technicians who run production without answering to the producers is a new ruling
              class, whatever it calls itself.
        sources:
          - {author: Thorstein Veblen, title: The Engineers and the Price System, year: 1921}
          - {author: "Technocracy, Inc.", title: Technocracy Study Course, year: 1934}
          - {author: Eden Medina, title: "Cybernetic Revolutionaries: Technology and Politics in Allende's Chile", year: 2011}
        traditions:
          defining: [technology.technocracy]
          typical: [liberalism.technocratic, religious.political-meritocracy]
          contested: [marxism.ml, marxism.scc, socdem.fabian]
          rejects: [liberalism.austrian, anarchism.communist, conservatism.right-populism, libertarianism.minarchist]
        presupposes: []
        excludes: [automation.ownership.investors-and-markets]
        tension: [automation.ownership.common-ownership]
        tags: [technocracy, planning]
        analysis:
          gains: [professional-managerial]
          pays: [finance-capital, core-workers]
          mechanism: >
            Handing production to technical experts displaces owners' control over output and prices, but also
            excludes workers from decisions, concentrating authority in a stratum of engineers and managers.
          drain: none
          law_of_value: suspends

      - id: automation.ownership.national-sovereign-ai
        label: The nation must own its own AI and computing power
        claim: AI, data and computing power are strategic national assets, and each country, above all in the South, must build and own its own instead of depending on a few American or Chinese firms.
        voiced: "Whoever owns the data centers and the models will own the economy. We will not be a digital colony renting intelligence from Silicon Valley."
        you: You think each country should build and own its own AI and computing, instead of depending on a few foreign companies.
        because: >
          A handful of firms in the United States and China own the chips, the cloud, the models and the data.
          Countries that rely on them pay rent on every transaction, ship their citizens' data abroad, and can be
          cut off by sanctions or export controls overnight. African and Latin American data, labor and
          minerals feed AI built elsewhere. Public computing, national data rules, local-language models and
          state investment are the condition of economic sovereignty in this century.
        against:
          - from: liberalism.internationalist
            text: >
              No country of ten million can match the scale of the frontier labs. Autarky in AI means
              second-rate tools at high cost; open markets and shared standards serve small countries better.
          - from: technology.cyberlibertarian
            text: >
              "Sovereign AI" means the state controls what citizens can compute and say. Open models and open
              networks protect people better than national champions.
        sources:
          - {author: Michael Kwet, title: "Digital colonialism: US empire and the new imperialism in the Global South", year: 2019, note: Race & Class}
          - {author: Cecilia Rikap, title: "Capitalism, Power and Innovation: Intellectual Monopoly Capitalism Uncovered", year: 2021}
          - {author: Chris Miller, title: "Chip War: The Fight for the World's Most Critical Technology", year: 2022}
        traditions:
          defining: []
          typical: [nationalism.developmental-state, marxism.scc, conservatism.national, nationalism.decolonial, conservatism.gaullism, marxism.third-worldism, nationalism.pan-africanism]
          contested: [technology.technocracy, socdem.democratic-socialism]
          rejects: [liberalism.internationalist, technology.cyberlibertarian, liberalism.chicago]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: []
        tension: [automation.ownership.investors-and-markets]
        tags: [sovereignty, digital-colonialism, ai]
        analysis:
          gains: [industrial-capital, professional-managerial, peripheral-workers]
          pays: [finance-capital]
          mechanism: >
            National ownership of computing and data rules cuts the rents and data flows captured by a few
            core platforms, keeping value and skilled jobs at home; who in the nation benefits depends on
            whether the state or national firms own the result.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Whether sovereign AI in large states such as China and India reduces the drain or builds new
            centers of rent over smaller countries is disputed.
          consciousness: hegemonic

      - id: automation.ownership.adapt-or-lose
        label: Nobody controls it; learn new skills and look out for yourself
        claim: Automation is coming whatever anyone decides, so the sensible thing is to keep learning, stay flexible and make sure you are one of the people the machines need.
        voiced: "You can't stop progress. The robots are coming for somebody's job; make sure it's not yours."
        you: You think automation can't be stopped, and the best you can do is keep your skills up and look out for yourself.
        because: >
          Studies suggest that a large share of jobs could be automated within a couple of decades, and no
          government has stopped a technology that makes money. Politicians promise to protect jobs and then
          the plant closes anyway. What a person can control is their own skills, savings and willingness to
          move. The people who adapted to computers did well; the ones who waited for help did not.
        against:
          - from: socdem.nordic
            text: >
              Telling each worker to fend for themselves guarantees that the gains go to owners. Collective
              bargaining and public retraining have managed technological change before.
          - from: marxism.autonomism
            text: >
              "Adapt" means competing with your neighbors for fewer jobs at lower pay. The individual answer
              is exactly what lets the owners set the terms.
        sources:
          - {author: Carl Benedikt Frey and Michael A. Osborne, title: "The Future of Employment: How Susceptible Are Jobs to Computerisation?", year: 2013}
        traditions:
          defining: []
          typical: [commonsense.self-reliance, commonsense.anti-politics, commonsense.look-after-your-own, liberalism.chicago]
          contested: [liberalism.technocratic, commonsense.rigged]
          rejects: [socdem.nordic, marxism.autonomism, technology.l-acc, anarchism.syndicalist]
        presupposes: [change.possibility.power-always-wins, change.means.individual-exit]
        excludes: [automation.ownership.common-ownership]
        tension: [automation.ownership.bargain-and-share]
        tags: [common-sense, individual]
        analysis:
          gains: [industrial-capital, finance-capital]
          pays: [core-workers, reserve-army]
          mechanism: >
            Individual adaptation means workers compete with each other for retraining and the remaining jobs,
            which leaves owners to set the terms of automation and keep its gains while workers bear the cost
            of retraining and relocation.
          drain: none
          law_of_value: extends
          consciousness: economic-corporate
