problematics:
  - id: settler.colonialism
    domain: nation
    layer: analysis
    question: What is owed where a nation was founded by settlement?
    plain: If your country was built on land taken from the people who lived there, what follows now?
    short: settler colonialism
    importance: 3
    region: settler
    positions:
      - id: settler.colonialism.ongoing-structure
        label: Settler colonialism is a structure that continues today
        claim: >
          In settler states the taking of land was not a past event but a continuing structure.
          The state exists by holding indigenous land, so it keeps eliminating indigenous peoples as
          peoples, by removal, assimilation, law and the market, as long as it rests on that land.
        voiced: >
          Invasion is a structure, not an event. Settlers came to stay, and what they want is land,
          not native labor. The logic of elimination did not end with the frontier; it runs through
          property law, child removal, blood quantum and the pipeline route.
        you: >
          You think the dispossession of indigenous peoples is not over, because the country's
          property and government still rest on it.
        because: >
          Colonies that exploit native labor need natives; colonies that take land need them gone.
          That is why settler states moved from massacre to removal, to allotment, to boarding
          schools, to the courts' doctrine of discovery: the method changed, the aim of clearing
          title did not. Every acre of private property and every resource lease in a settler state
          descends from that title, so the structure is renewed with each transaction.
        against:
          - from: liberalism.classical
            text: >
              A theory in which every act of the state, schooling, healthcare, employment, counts
              as "elimination" cannot be falsified. Indigenous populations in the United States,
              Canada and Australia are growing, and their members hold equal citizenship.
          - from: marxism.classical
            text: >
              Treating settlers as a single bloc makes white workers the enemy and erases their
              exploitation by the same capital that took the land, which leaves no basis for a
              working-class alliance.
        sources:
          - {author: Patrick Wolfe, title: "Settler Colonialism and the Transformation of Anthropology", year: 1999}
          - {author: Patrick Wolfe, title: "Settler Colonialism and the Elimination of the Native", year: 2006}
          - {author: Lorenzo Veracini, title: "Settler Colonialism: A Theoretical Overview", year: 2010}
          - {author: Frantz Fanon, title: "The Wretched of the Earth", year: 1961}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial, marxism.third-worldism, marxism.black-radical, nationalism.palestinian]
          contested: [marxism.ml, marxism.trotskyism]
          rejects: [liberalism.classical, conservatism.national, conservatism.burkean]
        presupposes: []
        excludes: [settler.colonialism.just-settlement, settler.colonialism.all-nations-conquest]
        tension: []
        tags: [wolfe, settler]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, finance-capital]
          mechanism: >
            If the dispossession is treated as continuing, current land titles, mining leases and
            pipeline permits become contestable, which threatens the rent and resource income of
            landowners, mining firms and the banks that finance them.
          drain: reduces
          law_of_value: none
          disputed: >
            Marxists split: J. Sakai and some Third Worldists treat settler workers as a privileged
            settler class; others hold that settler and indigenous workers share an enemy in capital.

      - id: settler.colonialism.land-back
        label: Return land and jurisdiction to indigenous nations
        claim: >
          What is owed is the return of land and governing authority to indigenous nations, not
          apology or inclusion. Decolonization means indigenous jurisdiction over indigenous land,
          starting with public lands, sacred sites and resource territories.
        voiced: >
          Land back. Decolonization is not a metaphor; it is the repatriation of land and life. We
          are not asking for a seat at your table. We are asking for our table back.
        you: >
          You think the land itself, and the right to govern it, should go back to the indigenous
          nations it was taken from.
        because: >
          Every form of reconciliation that leaves the land where it is leaves the injury where it
          is. Treaties promised land and jurisdiction; returning them honors the settler states' own
          law. Indigenous stewardship has kept land and water in better condition than extraction
          has, so land back is also climate policy.
        against:
          - from: liberalism.egalitarian
            text: >
              Hundreds of millions of people live on this land and most own nothing but their homes.
              Transferring jurisdiction by ancestry creates two classes of residents, and the costs
              fall on ordinary families, not on the corporations that profited.
          - from: conservatism.national
            text: >
              No nation can survive giving away its territory on the basis of grievance. Present
              citizens of every background have built their lives here and owe nothing for events
              before their birth.
        sources:
          - {author: Eve Tuck and K. Wayne Yang, title: "Decolonization Is Not a Metaphor", year: 2012}
          - {author: Nick Estes, title: "Our History Is the Future", year: 2019}
          - {author: The Red Nation, title: "The Red Deal: Indigenous Action to Save Our Earth", year: 2021}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial, ecology.environmental-justice]
          contested: [marxism.ecosocialism, liberalism.progressive]
          rejects: [conservatism.national, liberalism.classical, libertarianism.minarchist]
        presupposes: [settler.colonialism.ongoing-structure]
        excludes: [settler.colonialism.all-nations-conquest, settler.colonialism.just-settlement]
        tension: [property.private.natural-right]
        tags: [settler]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, finance-capital, industrial-capital]
          mechanism: >
            Returning jurisdiction over land and water lets indigenous governments refuse or tax
            mines, pipelines and dams, cutting into the resource rents of extraction firms and their
            creditors; settler homeowners are affected mainly where public and corporate land is
            not enough.
          drain: reduces
          law_of_value: suspends
          consciousness: hegemonic

      - id: settler.colonialism.historical-wrong-reconcile
        label: A historical wrong to acknowledge, repair and reconcile
        claim: >
          The founding of the nation involved grave wrongs against indigenous peoples. What is owed
          is truth-telling, apology, honoring treaties, compensation and recognition of indigenous
          rights within the existing state, so that both peoples can share one country.
        voiced: >
          We took the traditional lands and smashed the traditional way of life. We took the
          children from their mothers. Saying so is where reconciliation begins: a shared future
          built on the truth about the past.
        you: >
          You think the country should face the wrongs done to indigenous peoples, apologize,
          compensate and share power, while remaining one country.
        because: >
          The wrongs are documented and the effects are measurable in health, income and
          incarceration. A nation that tells the truth about itself is stronger, and repair within
          the existing constitution is the path that can win majorities. Australia's Mabo decision,
          Canada's Truth and Reconciliation Commission and treaty settlements in New Zealand moved
          real land and money.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              Recognition granted by the settler state on its own terms reproduces colonial power.
              Reconciliation asks the dispossessed to reconcile themselves to dispossession while the
              pipeline goes through.
          - from: conservatism.national
            text: >
              Permanent apology teaches every child that their country is a crime scene and builds
              a separate legal category of citizen by ancestry.
        sources:
          - {author: Truth and Reconciliation Commission of Canada, title: "Honouring the Truth, Reconciling for the Future", year: 2015}
          - {author: Paul Keating, title: "Redfern Speech", year: 1992}
          - {author: Will Kymlicka, title: "Multicultural Citizenship", year: 1995}
          - {author: First Nations National Constitutional Convention, title: "Uluru Statement from the Heart", year: 2017}
        traditions:
          defining: [liberalism.progressive]
          typical: [liberalism.social, liberalism.egalitarian, socdem.third-way, socdem.nordic, conservatism.christian-democracy]
          contested: [nationalism.indigenous-sovereignty, communitarianism]
          rejects: [conservatism.national, conservatism.right-populism]
        presupposes: []
        excludes: [settler.colonialism.just-settlement]
        tension: [settler.colonialism.ongoing-structure]
        tags: [settler, reconciliation]
        analysis:
          gains: [professional-managerial]
          pays: []
          mechanism: >
            Apology, commissions and negotiated settlements create indigenous corporations,
            consultancies and administrative posts, while settling claims in exchange for the
            extinguishment or certainty of title that mining and development firms need.
          drain: softens
          law_of_value: regulates
          disputed: >
            Some indigenous scholars (Coulthard) read recognition as a strategy of the settler state;
            others count treaty settlements and land returns as real gains for indigenous communities.

      - id: settler.colonialism.all-nations-conquest
        label: Every nation was founded by conquest; equal citizenship now
        claim: >
          Nearly every nation on earth occupies land taken by force from someone. The descendants of
          settlers bear no guilt for the acts of their ancestors. What is owed now is equal
          citizenship and help for anyone in need, not claims based on ancestry.
        voiced: >
          Conquest is the history of every people, including the peoples who were conquered. The
          Aztecs conquered, the Zulu conquered, the Normans conquered. You cannot run a country on
          who got here first. Treat everyone as equal citizens and move forward.
        you: >
          You think conquest is part of every nation's history, and that justice now means equal
          treatment for all citizens rather than special claims based on ancestry.
        because: >
          If prior possession ruled, no border in the world would be secure and every people could
          be evicted by an earlier one. Entitlements tied to things that happened centuries ago fade
          as circumstances change, so the claims that matter are present needs. Equal rights and
          equal opportunity serve indigenous individuals better than separate status.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              "Everyone conquered" is said only by the side that won. The treaties are not ancient
              history: they are law, signed by the settler state, and still unhonored.
          - from: marxism.third-worldism
            text: >
              The conquest is not past; its rents flow today from the land and resources it seized,
              to the descendants and successors of those who seized them.
        sources:
          - {author: Thomas Sowell, title: "Conquests and Cultures: An International History", year: 1998}
          - {author: Jeremy Waldron, title: "Superseding Historic Injustice", year: 1992}
        traditions:
          defining: [liberalism.classical]
          typical: [conservatism.fusionism, libertarianism.minarchist, commonsense.self-reliance, conservatism.right-populism]
          contested: [liberalism.egalitarian, conservatism.burkean]
          rejects: [nationalism.indigenous-sovereignty, nationalism.decolonial, marxism.third-worldism]
        presupposes: []
        excludes: [settler.colonialism.land-back, settler.colonialism.ongoing-structure]
        tension: []
        tags: [settler]
        analysis:
          gains: [landed-capital, finance-capital, petty-bourgeoisie]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Treating dispossession as closed history leaves current land titles and resource leases
            as they are, protecting the rent of those who hold them; indigenous communities are left
            to compete as individuals from the position the dispossession left them in.
          drain: sustains
          law_of_value: extends
          disputed: >
            Waldron himself holds that ongoing disadvantage from historic injustice must be remedied
            under present principles of justice, which can support redistribution.

      - id: settler.colonialism.just-settlement
        label: The settlement was legitimate and built the nation
        claim: >
          The settlers turned land that was thinly used into farms, towns and a nation, by their
          own labor and at great risk. The settlement was a legitimate founding, and the nation it
          built belongs to its people, the settlers' descendants included.
        voiced: >
          Our forebears crossed oceans and deserts, cleared the bush, broke the plains and buried
          their children on this ground. This land is ours because we made it what it is. We have no
          other homeland, and we will not apologize for existing.
        you: >
          You think the settlers built the country through hard labor and sacrifice, and that its
          founding was legitimate.
        because: >
          Land belongs to those who improve it: hunting grounds held by small bands could not claim
          vast territories against people who would farm them. The pioneers brought law, churches,
          schools and industry, and the nation they founded is now home to millions with nowhere
          else to go. A people that doubts its own founding cannot defend itself.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              The land was not empty; it was emptied, by war, smallpox and starvation. The "improvement"
              argument was written by the people taking the land, and the indigenous economies it
              called idle fed nations for thousands of years.
          - from: liberalism.egalitarian
            text: >
              Labor gives a claim to what one makes, not to land already held by others. Courts in
              the settler states themselves, from Mabo to McGirt, have found that native title or reservation boundaries survived.
        sources:
          - {author: John Locke, title: "Second Treatise of Government", year: 1689}
          - {author: Frederick Jackson Turner, title: "The Significance of the Frontier in American History", year: 1893}
          - {author: Theodore Roosevelt, title: "The Winning of the West", year: 1889}
          - {author: Keith Windschuttle, title: "The Fabrication of Aboriginal History, Volume One", year: 2002}
        traditions:
          defining: []
          typical: [conservatism.national, conservatism.right-populism, conservatism.paleo, fascism.identitarian]
          contested: [conservatism.burkean, conservatism.fusionism, religious.religious-zionism]
          rejects: [nationalism.indigenous-sovereignty, nationalism.decolonial, liberalism.progressive, marxism.ml]
        presupposes: []
        excludes: [settler.colonialism.ongoing-structure, settler.colonialism.land-back, settler.colonialism.historical-wrong-reconcile, state.nature.settler-structure]
        tension: []
        tags: [settler]
        analysis:
          gains: [landed-capital, petty-bourgeoisie, core-workers]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Declaring the founding legitimate secures the land titles of farmers, ranchers and
            mining firms and binds settler workers to the state through home and land ownership,
            while indigenous peoples remain without land base.
          drain: sustains
          law_of_value: extends

      - id: settler.colonialism.decolonize-citizenship
        label: Abolish the settler and native categories; one political community
        claim: >
          The colonial state created "settler" and "native" as legal and political identities, and
          they keep the conflict alive. Decolonization means dismantling these categories into
          a single political community with equal rights and land reform, not expelling settlers
          or freezing natives into tribes.
        voiced: >
          South Africa belongs to all who live in it, black and white. Decolonization is not the
          reversal of who rules whom; it is the end of the categories that made one people rulers
          and another subjects. Settlers and natives must become survivors together.
        you: >
          You think the answer is one country with equal rights for everyone, after the legal
          divisions between settler and native are abolished and the land is fairly redistributed.
        because: >
          Expulsion repeats the crime and is impossible where settlers are millions. Permanent
          native status, on the other hand, keeps natives in reserves and customary law run by
          appointed chiefs. The South African transition shows a settler state can be dismantled
          politically; the unfinished task is the land and the economy.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              "One political community" is the old assimilation in new words. Indigenous nations
              are not a colonial category but nations with their own law, older than any settler state.
          - from: nationalism.pan-africanism
            text: >
              South Africa ended legal apartheid but left the land and the mines with the same
              owners. Non-racial citizenship without restitution is settler peace on settler terms.
        sources:
          - {author: Mahmood Mamdani, title: "Neither Settler nor Native", year: 2020}
          - {author: Congress of the People, title: "The Freedom Charter", year: 1955}
          - {author: Mahmood Mamdani, title: "Citizen and Subject", year: 1996}
        traditions:
          defining: []
          typical: [nationalism.decolonial, marxism.african-socialism, socdem.democratic-socialism, marxism.ml]
          contested: [nationalism.pan-africanism, nationalism.palestinian]
          rejects: [conservatism.national, fascism.identitarian]
        presupposes: []
        excludes: [settler.colonialism.just-settlement]
        tension: [settler.colonialism.land-back]
        tags: [settler, south-africa]
        analysis:
          gains: [peripheral-workers, professional-managerial]
          pays: [landed-capital]
          mechanism: >
            Equal citizenship opens state employment, education and business to the formerly
            colonized, but unless land and capital are redistributed the transition mainly enlarges
            a new professional and political elite, as in South Africa after 1994.
          drain: softens
          law_of_value: none
          disputed: >
            The South African Communist Party treats the 1994 settlement as a national democratic
            revolution still in progress; critics on its left read it as a compact with capital.

      - id: settler.colonialism.expropriate-redistribute
        label: Expropriate the land without compensation and redistribute it
        claim: >
          Land taken by conquest should be taken back by the state, without compensation, and
          redistributed to the dispossessed who work it or need it. The question is ownership of
          land and resources, not apology or identity.
        voiced: >
          Our land was stolen; you do not pay a thief for returning what he stole. Expropriation
          without compensation, the land to the people who work it, the mines to the nation.
        you: >
          You think the land taken by settlers should be taken back by the state and given to those
          who were dispossessed, with no payment to current owners.
        because: >
          Market-based land reform, willing buyer and willing seller, moved a few percent of land in
          South Africa in a quarter-century; owners priced their stolen land as they pleased.
          Compensation makes the dispossessed buy back their own land. Only expropriation changes
          who holds the means of life in the countryside.
        against:
          - from: liberalism.classical
            text: >
              Zimbabwe's fast-track land reform after 2000 collapsed commercial agriculture, and
              much of the best land went to politically connected officials rather than the landless.
          - from: nationalism.indigenous-sovereignty
            text: >
              State expropriation puts the land in the hands of the national state, not of the
              peoples it was taken from. A socialist settler state is still a settler state.
        sources:
          - {author: Economic Freedom Fighters, title: "Founding Manifesto", year: 2013}
          - {author: Sam Moyo and Paris Yeros, title: "Reclaiming the Land: The Resurgence of Rural Movements in Africa, Asia and Latin America", year: 2005}
        traditions:
          defining: [nationalism.pan-africanism]
          typical: [marxism.ml, marxism.maoism, marxism.third-worldism, marxism.african-socialism]
          contested: [socdem.democratic-socialism]
          rejects: [liberalism.classical, libertarianism.ancap, liberalism.chicago]
        presupposes: [property.private.personal-vs-productive]
        excludes: [settler.colonialism.all-nations-conquest, settler.colonialism.just-settlement]
        tension: [settler.colonialism.land-back]
        tags: [settler, land]
        analysis:
          gains: [peasantry, peripheral-workers, reserve-army]
          pays: [landed-capital, finance-capital]
          mechanism: >
            Expropriation without compensation transfers land from settler farmers and agribusiness
            to smallholders and the state and wipes out the land-backed loans of the banks that
            financed them, which is why it draws capital flight and sanctions.
          drain: breaks
          law_of_value: suspends
          disputed: >
            Moyo and Yeros read Zimbabwe's reform as a real redistribution to smallholders despite
            elite capture; liberal economists read it as the cause of collapse.
          consciousness: hegemonic

  - id: indigenous.sovereignty
    domain: nation
    layer: horizon
    question: Do indigenous peoples hold sovereignty?
    plain: Are indigenous peoples nations with their own authority, or citizens like everyone else?
    short: indigenous sovereignty
    importance: 2
    region: settler
    positions:
      - id: indigenous.sovereignty.inherent-nationhood
        label: Indigenous nations hold inherent sovereignty, nation to nation
        claim: >
          Indigenous peoples are nations whose sovereignty existed before the settler state and was
          never surrendered. Their relation to the state should be nation to nation, governed by
          treaty, with their own laws, lands and courts.
        voiced: >
          We were nations before you came, and we never stopped being nations. Our treaties were
          made between sovereigns. Our sovereignty does not come from your constitution; your
          presence here comes from our treaties.
        you: >
          You think indigenous peoples are sovereign nations, and that the state should deal with
          them by treaty as with other nations.
        because: >
          The settler states themselves signed treaties with indigenous nations, which only
          sovereigns can do. Those treaties remain law. Sovereignty means the power to decide over
          one's own land and life, and it is the only protection that does not depend on the
          goodwill of a majority that has repeatedly withdrawn it.
        against:
          - from: liberalism.classical
            text: >
              Sovereignty for groups defined by descent creates citizens under two legal orders and
              leaves individuals on reserves without the protections other citizens have.
          - from: marxism.mariategui
            text: >
              Sovereignty without land and without an end to the property system that took it is a
              legal form. The indigenous question is the land question.
        sources:
          - {author: Vine Deloria Jr., title: "Custer Died for Your Sins: An Indian Manifesto", year: 1969}
          - {author: Vine Deloria Jr., title: "Behind the Trail of Broken Treaties", year: 1974}
          - {author: Taiaiake Alfred, title: "Peace, Power, Righteousness: An Indigenous Manifesto", year: 1999}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial]
          contested: [liberalism.progressive]
          rejects: [liberalism.classical, conservatism.national]
        presupposes: []
        excludes: [indigenous.sovereignty.equal-citizenship]
        tension: []
        tags: [settler]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, industrial-capital]
          mechanism: >
            Treaty sovereignty lets indigenous governments require consent for mines, dams and
            pipelines on their territory and tax or refuse them, reducing extraction firms' access to
            cheap land and resources.
          drain: reduces
          law_of_value: regulates

      - id: indigenous.sovereignty.resurgence
        label: Turn away from state recognition; rebuild on the land
        claim: >
          Seeking recognition from the settler state traps indigenous peoples in its terms.
          Indigenous peoples should turn away from the state's politics of recognition and rebuild
          their own governance, languages and land-based ways of life directly.
        voiced: >
          The politics of recognition reproduces the colonial relation it claims to transcend. Our
          freedom will not be granted; it will be practiced: on the land, in our languages, in our
          own governance, whether the state recognizes it or not.
        you: >
          You think indigenous peoples should rebuild their own ways of governing and living on
          the land, instead of asking the state for recognition.
        because: >
          Every round of recognition has traded indigenous claims for state-defined rights, land
          claims settled by extinguishment, self-government on the state's model. Refusal keeps the
          nation's own law alive, and land-based practice builds the alternative the state cannot
          grant or take.
        against:
          - from: liberalism.progressive
            text: >
              Turning away from the state leaves poor communities without the schools, clinics and
              funds the state controls. Recognition has won real land and resources.
          - from: marxism.ml
            text: >
              Small communities withdrawing to the land cannot stop a mining company backed by
              police; that needs power over the state.
        sources:
          - {author: Glen Sean Coulthard, title: "Red Skin, White Masks: Rejecting the Colonial Politics of Recognition", year: 2014}
          - {author: Leanne Betasamosake Simpson, title: "As We Have Always Done: Indigenous Freedom through Radical Resistance", year: 2017}
          - {author: Audra Simpson, title: "Mohawk Interruptus: Political Life Across the Borders of Settler States", year: 2014}
        traditions:
          defining: [nationalism.indigenous-sovereignty]
          typical: [nationalism.decolonial, anarchism.green]
          contested: [zapatismo]
          rejects: [liberalism.progressive, socdem.third-way]
        presupposes: [settler.colonialism.ongoing-structure]
        excludes: [indigenous.sovereignty.within-state-rights]
        tension: []
        tags: [settler]
        analysis:
          gains: [peasantry]
          pays: [landed-capital]
          mechanism: >
            Land-based practice and refusal of extinguishment agreements keep title in dispute,
            which raises the cost and risk of resource projects on unceded land.
          drain: reduces
          law_of_value: suspends

      - id: indigenous.sovereignty.within-state-rights
        label: Self-determination within existing states, with consent over land
        claim: >
          Indigenous peoples have a right to self-determination exercised through autonomy and
          self-government within existing states, including the right to free, prior and informed
          consent over projects on their lands, as set out in the UN Declaration of 2007.
        voiced: >
          Indigenous peoples have the right to autonomy in their internal affairs and to give or
          withhold free, prior and informed consent. These are minimum standards for survival,
          dignity and well-being, and states must make them law.
        you: >
          You think indigenous peoples should govern their own affairs and have a say over their
          lands, within the countries they now live in.
        because: >
          International standards bind states that have signed them and give indigenous peoples a
          tool in courts. Autonomy within the state is achievable now, without territorial secession
          that no state will accept, and consent requirements have already stopped projects.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              "Consent" in practice becomes "consultation", which states and companies satisfy with
              meetings and then build anyway. The Declaration itself protects the territorial
              integrity of states.
          - from: conservatism.national
            text: >
              A veto over national infrastructure for one group on the basis of ancestry puts
              energy and transport for the whole country at the mercy of a few.
        sources:
          - {author: United Nations General Assembly, title: "Declaration on the Rights of Indigenous Peoples", year: 2007}
          - {author: International Labour Organization, title: "Indigenous and Tribal Peoples Convention (No. 169)", year: 1989}
        traditions:
          defining: [liberalism.internationalist]
          typical: [liberalism.progressive, socdem.nordic, liberalism.social]
          contested: [nationalism.indigenous-sovereignty]
          rejects: [conservatism.national]
        presupposes: []
        excludes: [indigenous.sovereignty.resurgence]
        tension: []
        tags: [undrip]
        analysis:
          gains: [professional-managerial, peasantry]
          pays: [industrial-capital]
          mechanism: >
            Consent and consultation rules add delay and negotiated payments to extraction projects,
            transferring part of the resource rent to indigenous bodies, while leaving the project
            decision with the state in most cases.
          drain: softens
          law_of_value: regulates

      - id: indigenous.sovereignty.plurinational-state
        label: Refound the state as plurinational, with indigenous peoples in power
        claim: >
          Where indigenous peoples are a large part of the population, the answer is to refound the
          state itself as plurinational: indigenous nations recognized in the constitution, holding
          state power, with communal land and indigenous law alongside the state's.
        voiced: >
          The colonial republic was built against the indigenous majority. We did not come to be
          recognized by the state; we came to be the state. A plurinational state where the ayllu,
          the community and the nation govern together.
        you: >
          You think indigenous peoples should take power in the state itself and remake it so that
          many nations govern together.
        because: >
          Autonomy within a hostile state is always under threat; holding state power lets
          indigenous peoples nationalize gas, redistribute rents and write communal rights into the
          constitution, as Bolivia did after 2006. Plurinationality ends the fiction that the
          republic was ever one nation.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              Once in power, the plurinational government in Bolivia pushed a highway through the
              TIPNIS indigenous territory in 2011. A state that depends on extraction will act like
              one, whoever runs it.
          - from: liberalism.classical
            text: >
              Plural legal systems and communal land leave individuals without equal rights and
              block the property titles that would let them borrow and invest.
        sources:
          - {author: Constituent Assembly of Bolivia, title: "Political Constitution of the Plurinational State of Bolivia", year: 2009}
          - {author: Álvaro García Linera, title: "La potencia plebeya", year: 2008}
        traditions:
          defining: [nationalism.bolivarianism]
          typical: [nationalism.decolonial, marxism.mariategui, socdem.left-populism]
          contested: [nationalism.indigenous-sovereignty]
          rejects: [liberalism.classical, liberalism.chicago]
        presupposes: [intl.sovereignty.nations-set-own-course]
        excludes: []
        tension: [indigenous.sovereignty.resurgence]
        tags: [bolivia]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [comprador-capital, finance-capital, landed-capital]
          mechanism: >
            Taking the state let Bolivia raise its share of gas revenue from foreign firms and fund
            transfers and public works, moving rent from foreign capital and the lowland landed elite
            to the indigenous majority, while the economy stayed dependent on exporting raw materials.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Critics on the left (Raquel Gutiérrez, indigenous lowland organizations) call it
            neo-extractivism; its defenders hold extraction funds the transition.
          consciousness: hegemonic

      - id: indigenous.sovereignty.land-is-the-question
        label: The indigenous question is the land question, solved by socialism
        claim: >
          The oppression of indigenous peoples is rooted in the large estate and the property system
          that took their land. It ends with agrarian revolution that returns land to indigenous
          communities, building socialism on their communal traditions.
        voiced: >
          The problem of the Indian is rooted in the land tenure system. It is not racial, not
          educational, not administrative; it is economic. Indian socialism will rise from the
          living tradition of the ayllu.
        you: >
          You think the oppression of indigenous peoples is about land, and that socialism built on
          their communal traditions is the way to end it.
        because: >
          Every reform that treated the indigenous question as education, culture or law left the
          hacienda in place and changed nothing. The indigenous community already practices
          collective labor and communal land, so in the Andes socialism has a native root and is
          not a European import.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              Reducing indigenous nations to a land question makes them peasants in a class scheme
              and their nationhood a residue. Many socialist states treated indigenous lands as
              collective farms to be managed from the capital.
          - from: liberalism.classical
            text: >
              Communal tenure keeps people poor; secure individual title is what lets families
              invest, borrow and leave if they choose.
        sources:
          - {author: José Carlos Mariátegui, title: "Seven Interpretive Essays on Peruvian Reality", year: 1928}
        traditions:
          defining: [marxism.mariategui]
          typical: [marxism.maoism, marxism.ml, marxism.mlm]
          contested: [nationalism.indigenous-sovereignty, nationalism.decolonial]
          rejects: [liberalism.classical, liberalism.chicago]
        presupposes: [class.concept.relation-to-production]
        excludes: [indigenous.sovereignty.private-title]
        tension: []
        tags: [latin-america]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [landed-capital, comprador-capital]
          mechanism: >
            Agrarian revolution takes the haciendas and export plantations from landlords tied to
            foreign buyers and gives the land to indigenous communities, ending labor rents and the
            low prices paid for highland labor.
          drain: breaks
          law_of_value: suspends
          consciousness: hegemonic

      - id: indigenous.sovereignty.autonomy-without-state
        label: Autonomous self-government from below, without the state
        claim: >
          Indigenous communities should govern themselves through their own assemblies and
          autonomous municipalities, rotating office and "commanding by obeying", without seeking
          state power or state recognition.
        voiced: >
          We do not want to take power. We want a world where many worlds fit. Here the people
          command and the government obeys.
        you: >
          You think indigenous communities should govern themselves from below, through their own
          assemblies, without trying to run the state.
        because: >
          Since 1994 the Zapatista communities in Chiapas have run their own schools, clinics,
          courts and land without the state, after the government failed to honor the San Andrés
          Accords of 1996. Autonomy built from below cannot be revoked by an election or bought by
          a ministry.
        against:
          - from: marxism.ml
            text: >
              Autonomy that does not touch state power survives at the state's tolerance, in a
              corner of one province, while the Mexican state and cartels encircle it.
          - from: nationalism.bolivarianism
            text: >
              Refusing the state leaves it to the oligarchy. Bolivia shows indigenous peoples can take
              the state and use its revenue for the majority.
        sources:
          - {author: EZLN, title: "Sixth Declaration of the Lacandon Jungle", year: 2005}
          - {author: Government of Mexico and EZLN, title: "San Andrés Accords on Indigenous Rights and Culture", year: 1996}
        traditions:
          defining: [zapatismo]
          typical: [anarchism.communist, anarchism.confederalism, nationalism.decolonial]
          contested: [nationalism.indigenous-sovereignty]
          rejects: [marxism.ml, liberalism.classical]
        presupposes: []
        excludes: [indigenous.sovereignty.private-title]
        tension: [indigenous.sovereignty.plurinational-state]
        tags: [zapatista]
        analysis:
          gains: [peasantry]
          pays: [landed-capital]
          mechanism: >
            Land recovered from ranchers in 1994 is held and worked collectively outside the market,
            so it cannot be bought back, while the communities remain exposed to military and
            paramilitary pressure.
          drain: reduces
          law_of_value: suspends

      - id: indigenous.sovereignty.equal-citizenship
        label: One law for all; indigenous people are equal citizens
        claim: >
          Indigenous people should be equal citizens under the same law as everyone else. Separate
          legal status, reserves and race-based programs keep them apart and dependent, and should
          be phased out.
        voiced: >
          One country, one law, one citizenship. Separate status was the instrument of
          segregation; equality means ending it, not making it permanent.
        you: >
          You think indigenous people should have the same rights and laws as everyone else, with
          no separate status.
        because: >
          Separate legal systems trap people in reserve economies, govern them through band
          councils and bureaucracies, and divide citizens by ancestry. Equal rights, open markets and
          individual choice have lifted other disadvantaged groups and would do the same.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              Canada's 1969 White Paper proposed exactly this, and indigenous nations rejected it
              as cultural genocide by law. Treaties are not race-based programs; they are agreements
              between nations.
          - from: liberalism.progressive
            text: >
              Formal equality after dispossession leaves the dispossessed where dispossession put
              them. Equal treatment of unequal starting points freezes inequality.
        sources:
          - {author: Government of Canada, title: "Statement of the Government of Canada on Indian Policy", year: 1969}
          - {author: Tom Flanagan, title: "First Nations? Second Thoughts", year: 2000}
          - {author: Harold Cardinal, title: "The Unjust Society", year: 1969, note: "cited as the reply to the White Paper"}
        traditions:
          defining: [liberalism.classical]
          typical: [conservatism.fusionism, conservatism.right-populism, libertarianism.minarchist, nationalism.civic]
          contested: [conservatism.burkean]
          rejects: [nationalism.indigenous-sovereignty, liberalism.progressive, nationalism.decolonial]
        presupposes: []
        excludes: [indigenous.sovereignty.inherent-nationhood]
        tension: []
        tags: [settler]
        analysis:
          gains: [landed-capital, industrial-capital]
          pays: [peasantry, peripheral-workers]
          mechanism: >
            Ending collective title and treaty status makes indigenous land alienable and removes
            consent requirements, opening it to purchase, lease and extraction on ordinary terms.
          drain: sustains
          law_of_value: extends

      - id: indigenous.sovereignty.private-title
        label: Sovereignty with private property; let reserves own their land
        claim: >
          Indigenous communities should be free to convert collective reserve land into private,
          tradeable property. Secure individual title would let families build, borrow and
          prosper, as other property owners do.
        voiced: >
          On reserve land you cannot own your house, so you cannot mortgage it. The poverty on
          reserves is the poverty of dead capital. Give our people title and the same tools
          everyone else has.
        you: >
          You think indigenous families would prosper if they could own their land privately and
          use it as security, like other property owners.
        because: >
          Without title, assets cannot be used as collateral, and investment stays out. Communities
          that have adopted property systems have attracted housing and business. The choice
          should belong to the community, not to a federal ministry holding the land in trust.
        against:
          - from: nationalism.indigenous-sovereignty
            text: >
              The 1887 Dawes Act allotted reservation land to individuals in the name of progress;
              within fifty years about two thirds of the land base had passed to non-Indian owners.
          - from: marxism.mariategui
            text: >
              Turning communal land into collateral turns it into a commodity, and commodities flow
              toward those with money.
        sources:
          - {author: Hernando de Soto, title: "The Mystery of Capital", year: 2000}
          - {author: Tom Flanagan, Christopher Alcantara and André Le Dressay, title: "Beyond the Indian Act: Restoring Aboriginal Property Rights", year: 2010}
        traditions:
          defining: []
          typical: [liberalism.chicago, liberalism.austrian, libertarianism.minarchist, conservatism.fusionism]
          contested: [liberalism.classical]
          rejects: [nationalism.indigenous-sovereignty, marxism.mariategui, zapatismo]
        presupposes: [property.private.natural-right]
        excludes: [indigenous.sovereignty.land-is-the-question, indigenous.sovereignty.autonomy-without-state]
        tension: []
        tags: [property]
        analysis:
          gains: [finance-capital, landed-capital, petty-bourgeoisie]
          pays: [peasantry]
          mechanism: >
            Titling makes land mortgageable and saleable, which brings in bank credit and lets
            outside buyers and lenders acquire land through purchase and foreclosure.
          drain: sustains
          law_of_value: extends

  - id: agrarian.question
    domain: nation
    layer: horizon
    question: Who should own and work the land in the countryside?
    plain: Who should own the farms, and who should work them?
    short: the agrarian question
    importance: 2
    region: land
    positions:
      - id: agrarian.question.land-to-the-tiller
        label: Land to those who work it
        claim: >
          Large estates should be broken up and the land given to the peasants and laborers who
          work it, as family farms. Redistributive land reform is the foundation of rural justice
          and of national development.
        voiced: >
          The land belongs to those who work it with their hands. Land and liberty! Break the
          haciendas and give every family a plot it can call its own.
        you: >
          You think the land should belong to the families who farm it, and that big estates should
          be broken up for them.
        because: >
          Landlords who live from rent have no reason to invest, and tenants who give up half their
          harvest cannot. Land reform in Japan, South Korea and Taiwan after 1945 created millions
          of owner-farmers whose rising yields and savings funded industrialization. Peasant
          revolutions from Mexico to China were fought under this slogan because it is what
          peasants want.
        against:
          - from: marxism.ml
            text: >
              Small plots divide the countryside into millions of petty owners who compete,
              borrow and lose their land again. Without cooperation the old inequality returns.
          - from: liberalism.chicago
            text: >
              Freezing farms at family size blocks the consolidation and mechanization that raise
              output; land caps also scare off investment.
        sources:
          - {author: Emiliano Zapata, title: "Plan de Ayala", year: 1911}
          - {author: Sun Yat-sen, title: "Three Principles of the People", year: 1924}
          - {author: Joe Studwell, title: "How Asia Works", year: 2013}
          - {author: Mao Zedong, title: "Report on an Investigation of the Peasant Movement in Hunan", year: 1927}
        traditions:
          defining: [nationalism.three-principles]
          typical: [zapatismo, nationalism.developmental-state, marxism.maoism, nationalism.peronism, conservatism.distributism]
          contested: [marxism.ml]
          rejects: [liberalism.chicago, libertarianism.ancap]
        presupposes: []
        excludes: []
        tension: [agrarian.question.collective-farms]
        tags: [land-reform]
        analysis:
          gains: [peasantry]
          pays: [landed-capital]
          mechanism: >
            Redistribution moves ground rent from landlords to farming families, raising rural
            incomes and the home market, and creates a class of small owners whose loyalty states
            have often sought.
          drain: reduces
          law_of_value: regulates
          disputed: >
            Marxists debate whether peasant land reform is a step to socialism (Mao's first stage) or
            a consolidation of petty property that blocks it (Kautsky, Trotsky).
          consciousness: class-economic

      - id: agrarian.question.collective-farms
        label: Large collective or state farms, planned with industry
        claim: >
          Land should be held in common and worked in large collective or state farms, mechanized
          and planned together with industry. Small peasant farming cannot feed the cities or
          escape poverty.
        voiced: >
          The small farm is doomed by history. Only large-scale collective agriculture, with
          tractors and agronomy, can free the peasant from the moneylender and the kulak and feed a
          growing working class.
        you: >
          You think farming should be organized in large, shared, mechanized farms planned as part
          of the whole economy.
        because: >
          Large farms can use machines, science and irrigation that smallholders cannot afford, and
          they free labor for industry. Collective ownership stops the old cycle in which land
          reform plots are sold off and the rich buy them back. Planned supply of grain to cities is
          the precondition of industrializing a poor country without foreign loans.
        against:
          - from: liberalism.austrian
            text: >
              Collectivization in the USSR in 1929 to 1933 ended in famine that killed millions,
              with the hardest toll in Ukraine and Kazakhstan; the Great Leap Forward famine in China
              in 1959 to 1961 killed tens of millions, by most estimates. Farmers who do not own the
              harvest do not tend it.
          - from: anarchism.communist
            text: >
              State farms replaced the landlord with the ministry. Collectivity imposed from above
              is not the free commune the peasants wanted.
        sources:
          - {author: Karl Kautsky, title: "The Agrarian Question", year: 1899}
          - {author: J. V. Stalin, title: "The Year of the Great Break", year: 1929}
        traditions:
          defining: [marxism.ml]
          typical: [marxism.hoxhaism, marxism.juche, marxism.maoism]
          contested: [marxism.scc, marxism.trotskyism, marxism.african-socialism]
          rejects: [liberalism.austrian, liberalism.chicago, conservatism.distributism, anarchism.mutualist]
        presupposes: [allocation.mechanism.central-planning, property.private.personal-vs-productive]
        excludes: [agrarian.question.commercial-farms]
        tension: [agrarian.question.land-to-the-tiller]
        tags: [collectivization]
        analysis:
          gains: [core-workers]
          pays: [peasantry, landed-capital]
          mechanism: >
            Collective farms let the state buy grain at low fixed prices and transfer the surplus to
            industrial investment and urban food supply, so peasants financed industrialization
            while landlords and rich peasants lost their land.
          drain: breaks
          law_of_value: suspends
          disputed: >
            Death tolls and intent are disputed: the Ukrainian famine is recognized as genocide by
            Ukraine and some states and rejected as such by others; estimates for China's famine
            range from about 15 to 45 million. Bukharin, Chayanov and later market socialists argued
            industrialization could have been financed without forced collectivization.

      - id: agrarian.question.food-sovereignty
        label: Food sovereignty and peasant agroecology
        claim: >
          Peoples have the right to decide their own food systems. Land, seeds and water should be
          in the hands of small farmers, pastoralists and fishers practicing agroecology, with
          agriculture taken out of free trade agreements and agribusiness control.
        voiced: >
          Food sovereignty is the right of peoples to healthy, culturally appropriate food produced
          through ecologically sound methods, and their right to define their own food and
          agriculture systems. Globalize the struggle, globalize hope.
        you: >
          You think small farmers should control land, seed and water and grow food for their own
          people, outside the grip of agribusiness and global markets.
        because: >
          Small farms feed most of the world's people on a minority of its land. Free trade in food
          let subsidized grain from rich countries ruin peasant farmers in Mexico, Haiti and West
          Africa and pushed them into slums and migration. Agroecology rebuilds soils that chemical
          monoculture exhausts.
        against:
          - from: ecology.ecomodernism
            text: >
              Low-input peasant farming needs more land per calorie; feeding eight billion people
              that way means clearing forests. Intensification on less land spares nature.
          - from: liberalism.chicago
            text: >
              Food self-sufficiency raises food prices for the urban poor; trade lets countries buy
              cheaply what others grow best.
        sources:
          - {author: Nyéléni Forum for Food Sovereignty, title: "Declaration of Nyéléni", year: 2007}
          - {author: United Nations General Assembly, title: "Declaration on the Rights of Peasants and Other People Working in Rural Areas", year: 2018}
        traditions:
          defining: []
          typical: [ecology.environmental-justice, zapatismo, marxism.mariategui, ecology.degrowth, religious.liberation-theology]
          contested: [marxism.ecosocialism]
          rejects: [ecology.ecomodernism, liberalism.chicago, ecology.green-growth]
        presupposes: []
        excludes: [agrarian.question.commercial-farms]
        tension: [development.path.integration]
        tags: [via-campesina]
        analysis:
          gains: [peasantry, peripheral-workers]
          pays: [industrial-capital, finance-capital]
          mechanism: >
            Removing agriculture from free trade rules and agribusiness control shields peasant
            producers from dumped grain and seed monopolies, reducing the margins of seed, chemical
            and grain-trading firms based in the core.
          drain: reduces
          law_of_value: regulates
          consciousness: class-economic

      - id: agrarian.question.commercial-farms
        label: Secure title, land markets and commercial farms
        claim: >
          Farmers should hold secure, tradeable title. Land markets let it flow to the most
          productive farmers, farms consolidate and mechanize, and surplus labor moves into better
          paid work in towns.
        voiced: >
          Give the farmer a title deed and a market, and he will do the rest. Every rich country
          got rich by moving people off small farms into factories and offices.
        you: >
          You think farmers need secure ownership and markets, and that letting farms grow larger
          and people move to cities is how countries get richer.
        because: >
          Peasants are poor but rational: they respond to prices when they can keep the returns.
          Secure title brings investment and credit, and land markets let land reach those who farm
          it best. Agricultural productivity growth and migration to cities have been the path out
          of rural poverty everywhere it happened.
        against:
          - from: ecology.environmental-justice
            text: >
              Titling programs and land markets have opened the way to land grabs: foreign funds and
              agribusiness bought or leased millions of hectares in Africa and Asia after 2008,
              evicting the farmers who held customary rights.
          - from: marxism.maoism
            text: >
              The cities do not have jobs for the displaced; they get slums. Commercialization
              concentrates land in the hands of a rural bourgeoisie and comprador exporters.
        sources:
          - {author: Theodore W. Schultz, title: "Transforming Traditional Agriculture", year: 1964}
          - {author: Hernando de Soto, title: "The Mystery of Capital", year: 2000}
        traditions:
          defining: [liberalism.chicago]
          typical: [liberalism.technocratic, liberalism.austrian, libertarianism.minarchist, ecology.ecomodernism]
          contested: [marxism.scc]
          rejects: [marxism.maoism, zapatismo, ecology.degrowth]
        presupposes: []
        excludes: [agrarian.question.collective-farms, agrarian.question.food-sovereignty]
        tension: []
        tags: []
        analysis:
          gains: [finance-capital, landed-capital, comprador-capital]
          pays: [peasantry, reserve-army]
          mechanism: >
            Land markets let creditors, investors and larger farmers accumulate land through
            purchase and foreclosure, while displaced smallholders join the urban reserve of labor
            that holds down wages.
          drain: sustains
          law_of_value: extends

      - id: agrarian.question.family-farm
        label: Widely owned family farms as the root of an independent people
        claim: >
          The countryside should be made of independent family farms, widely owned and passed down,
          protected from both agribusiness and the state. Small proprietors are the backbone of
          self-reliant communities.
        voiced: >
          Three acres and a cow. A man who owns his land is nobody's servant. Agribusiness and the
          bureaucracy both want the farmer gone; we want him multiplied.
        you: >
          You think the countryside should belong to many independent family farmers rather than to
          big companies or the state.
        because: >
          Ownership spread widely makes citizens independent, rooted and responsible; concentrated
          ownership, whether by corporations or the state, makes them employees. Family farms keep
          rural towns, churches and schools alive and care for land they will hand to their children.
        against:
          - from: liberalism.chicago
            text: >
              Protecting small farms with subsidies and restrictions locks people into low incomes
              and raises food prices for everyone else.
          - from: marxism.classical
            text: >
              The family farm survives in rich countries only by self-exploitation and debt to banks
              and agribusiness; it is a petty-bourgeois dream that capital outcompetes every decade.
        sources:
          - {author: Hilaire Belloc, title: "The Servile State", year: 1912}
          - {author: Twelve Southerners, title: "I'll Take My Stand", year: 1930}
          - {author: Wendell Berry, title: "The Unsettling of America: Culture and Agriculture", year: 1977}
        traditions:
          defining: [conservatism.distributism]
          typical: [conservatism.traditionalist, conservatism.cst, conservatism.paleo, conservatism.postliberal]
          contested: [conservatism.right-populism]
          rejects: [liberalism.chicago, marxism.ml]
        presupposes: [property.private.social-function]
        excludes: [agrarian.question.collective-farms]
        tension: []
        tags: []
        analysis:
          gains: [petty-bourgeoisie, peasantry]
          pays: [industrial-capital]
          mechanism: >
            Caps on farm size, antitrust in food processing and credit for small owners shift
            margins from agribusiness and processors to family farmers, at some cost in food prices.
          drain: none
          law_of_value: regulates

      - id: agrarian.question.land-value-tax
        label: Tax away land rent; let anyone farm
        claim: >
          Land is a common inheritance. Its rental value should be collected by the public through a
          tax on land values, replacing other taxes. Then farmers keep what they produce, and
          speculation in idle land ends.
        voiced: >
          We must make land common property. It is not necessary to confiscate land; it is only
          necessary to confiscate rent. Tax the land, not the labor on it.
        you: >
          You think the value of land itself belongs to everyone and should be taxed, so that only
          the work done on it is private.
        because: >
          Nobody made the land, and its value comes from the community around it. Taxing that value
          cannot be passed on or escaped, discourages holding land idle for speculation and lets
          other taxes on work and trade fall. It reaches the landlord without abolishing markets.
        against:
          - from: marxism.classical
            text: >
              Rent is one share of surplus value. Taxing it leaves exploitation in production intact
              and serves industrial capital against landlords.
          - from: libertarianism.ancap
            text: >
              Land first homesteaded by labor is legitimately owned, and a tax on its value is a
              permanent rent paid to the state.
        sources:
          - {author: Henry George, title: "Progress and Poverty", year: 1879}
        traditions:
          defining: [libertarianism.georgist]
          typical: [libertarianism.left, socdem.fabian]
          contested: [liberalism.classical]
          rejects: [libertarianism.ancap, marxism.ml]
        presupposes: []
        excludes: []
        tension: [property.private.natural-right]
        tags: [georgism]
        analysis:
          gains: [industrial-capital, petty-bourgeoisie, peasantry]
          pays: [landed-capital, finance-capital]
          mechanism: >
            A land value tax captures ground rent for the public, lowering land prices and the
            mortgage lending built on them, which helps tenant farmers and producers at the expense
            of landowners and land-backed banks.
          drain: none
          law_of_value: regulates

      - id: agrarian.question.communal-tenure
        label: Land held by the community, allotted by use
        claim: >
          Land belongs to the community, village or lineage, which allots it to families by need
          and use. It should not be sold. Customary and communal tenure should be protected, and
          rural development built on cooperative village life.
        voiced: >
          The land belongs to the dead, the living and the unborn. In our tradition no one could
          sell it, because no one owned it alone. Ujamaa, familyhood, is the basis of our socialism.
        you: >
          You think land should belong to the whole community and be shared out by need, not
          bought and sold.
        because: >
          Communal tenure kept land in the hands of those who use it for centuries and ensured every
          family had access. Turning it into private property creates landlessness where there was
          none. African and Mexican communal traditions show a path to rural socialism that does
          not need to pass through capitalism.
        against:
          - from: liberalism.classical
            text: >
              Tanzania's villagization of 1973 to 1976 moved millions of people, often by force, into
              planned villages, and agricultural output fell. Communal tenure often means chiefs
              controlling land and women denied it.
          - from: feminism.decolonial
            text: >
              Customary tenure, as codified under colonial rule, often gave men and chiefs control
              and left widows and daughters without land rights.
        sources:
