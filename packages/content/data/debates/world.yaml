# Debates over the world economy, imperialism, development and decolonization.
debates:
  - id: debate.unequal-exchange
    name: Emmanuel and Bettelheim on unequal exchange
    date: "1969–1973"
    summary: >-
      Arghiri Emmanuel argued that trade between rich and poor countries transfers value to the rich ones
      because wages differ enormously while capital moves freely and profit rates even out. Charles Bettelheim
      replied that the wage gap reflects differences in productivity and in the development of the forces of
      production. Samir Amin accepted unequal exchange but rejected Emmanuel's conclusion that core workers
      exploit peripheral ones.
    problematic: exchange.unequal
    sides:
      - label: Emmanuel
        thinkers: [thinker.emmanuel]
        positions: [exchange.unequal.wage-gap, imperialism.nature.unequal-exchange-drain, labor.aristocracy.whole-core-bought]
        argument: >-
          Capital moves across borders and profit rates tend to equalize worldwide; labor does not move, and
          wages are set nationally by history and struggle. So when a Kenyan worker and a French worker each
          spend an hour making exports, the French hour buys many Kenyan hours. Low wages are the cause of low
          prices, not the result. Workers in rich countries share in this transfer, which is why
          internationalism has failed.
        texts:
          - {author: Arghiri Emmanuel, title: "Unequal Exchange: A Study of the Imperialism of Trade", year: 1969}
      - label: Bettelheim
        thinkers: [thinker.bettelheim]
        positions: [exchange.unequal.productivity-gap, labor.aristocracy.no-labor-aristocracy, contradiction.primary.capital-vs-labor]
        argument: >-
          Wages are higher in the core because labor there is more productive, equipped with more machinery,
          and so produces more value per hour; core workers may even be more exploited, since they produce
          more surplus value. Starting from wages puts distribution before production. The poverty of the
          periphery comes from the underdevelopment of its productive forces under imperialist domination,
          and core and peripheral workers face a common enemy.
        texts:
          - {author: Charles Bettelheim, title: Theoretical Comments, year: 1969, note: appended to Emmanuel's Unequal Exchange}
      - label: Amin
        thinkers: [thinker.amin]
        positions: [imperialism.nature.unequal-exchange-drain, labor.aristocracy.shares-but-exploited, development.path.delinking]
        argument: >-
          Productivity in export sectors of the periphery is often as high as in the core, yet wages are a
          fraction. The gap in wages is greater than the gap in productivity, and that difference is a transfer
          of value. It is enforced by monopolies over technology, finance and markets and by comprador states.
          Core workers share in the benefit, but the remedy is a delinking of the periphery from the world law of
          value, not moral appeals to core workers.
        texts:
          - {author: Samir Amin, title: Accumulation on a World Scale, year: 1970}
          - {author: Samir Amin, title: Unequal Development, year: 1973}
      - label: Comparative advantage
        thinkers: []
        positions: [exchange.unequal.mutual-gain, poverty.cause.late-development]
        argument: >-
          Liberal economists since David Ricardo hold that trade lets each country specialize in what it does
          relatively best, so both sides end up with more than they could produce alone. Low wages reflect low
          productivity, and trade, investment and technology transfer are how productivity and wages rise.
        texts:
          - {author: David Ricardo, title: On the Principles of Political Economy and Taxation, year: 1817}
    outcome: >-
      The debate fed dependency and world-systems analysis through the 1970s. Mainstream trade theory did not
      engage it. Later work measured the transfer empirically, including estimates by Jason Hickel and
      co-authors in 2022 of resources drained from the global South through unequal exchange.

  - id: debate.labor-aristocracy
    name: Is there a labor aristocracy?
    date: "1882–2012"
    summary: >-
      Engels and Lenin argued that imperial profits let capitalists buy off an upper layer of workers and
      their leaders, which explained reformism in the rich countries. Later writers extended the argument to
      the whole working class of the core, or limited it, or rejected it. The answer decides whether workers
      in rich countries are a force against imperialism.
    problematic: labor.aristocracy
    sides:
      - label: Engels and Lenin
        thinkers: [thinker.engels, thinker.lenin]
        positions: [labor.aristocracy.bribed-stratum, imperialism.nature.monopoly-stage]
        argument: >-
          Monopoly profits from the colonies give the bourgeoisie of the imperial countries the means to bribe a
          privileged layer: skilled workers, union officials and parliamentary leaders. That layer is the social
          base of opportunism and of the parties that voted for war. Socialists must go lower and deeper, to the
          real masses, who gain nothing from empire.
        texts:
          - {author: Friedrich Engels, title: Letter to Karl Kautsky, year: 1882, note: 12 September 1882}
          - {author: V. I. Lenin, title: Imperialism and the Split in Socialism, year: 1916}
      - label: The whole core is bought
        thinkers: [thinker.emmanuel]
        positions: [labor.aristocracy.whole-core-bought, labor.aristocracy.settler-class]
        argument: >-
          Wages in the core are many times higher than in the periphery for the same work, and that difference is
          paid out of the drain. The working class of the rich countries as a whole consumes more value than it
          produces. In settler states the oppressor-nation working class was built on stolen land. The
          revolutionary subject is in the periphery.
        texts:
          - {author: J. Sakai, title: "Settlers: The Mythology of the White Proletariat", year: 1983}
          - {author: Zak Cope, title: "Divided World, Divided Class", year: 2012}
      - label: Shares in the drain, still exploited
        thinkers: [thinker.amin]
        positions: [labor.aristocracy.shares-but-exploited, contradiction.primary.imperialism-vs-oppressed]
        argument: >-
          Core workers benefit from cheap imports and from the welfare and wages that imperial rent finances, and
          this shapes their politics. But they still sell their labor power and are exploited, and capital turns
          on them when the drain is contested. Their interest lies in breaking with imperialism, though the bribe
          makes that hard to see.
        texts:
          - {author: Samir Amin, title: The Law of Worldwide Value, year: 2010}
      - label: No labor aristocracy
        thinkers: []
        positions: [labor.aristocracy.no-labor-aristocracy, contradiction.primary.capital-vs-labor]
        argument: >-
          Critics including Charles Post argue that higher wages in the core reflect higher productivity and
          workers' own organization, not a share of colonial profit. Well-paid workers have often been the most
          militant, and reformism has its roots in the routines of bargaining, not in bribery. The theory blames
          workers for their leaders and abandons the core working class.
        texts:
          - {author: Charles Post, title: "Exploring Working-Class Consciousness: A Critique of the Theory of the 'Labour-Aristocracy'", year: 2010}
    outcome: >-
      The question remains open among Marxists. It divides Third Worldist currents from most Trotskyist and
      orthodox parties in the core, and it shapes how movements in rich countries approach trade, migration and
      war.

  - id: debate.dependency-modernization
    name: Modernization and dependency
    date: "1950–1980"
    summary: >-
      After 1945, economists in the United States held that poor countries were at an early stage of a path
      rich countries had already traveled. Economists in Latin America, Africa and Asia replied that poverty
      in the periphery was produced by its place in the world economy. A third group argued that capitalism was
      in fact developing the periphery.
    problematic: poverty.cause
    sides:
      - label: Modernization theory
        thinkers: []
        positions: [poverty.cause.late-development, development.path.integration, poverty.cause.culture]
        argument: >-
          W. W. Rostow argued that every society passes through the same stages: traditional society, the
          preconditions for take-off, take-off, the drive to maturity and mass consumption. Poor countries need
          savings, investment, modern values and openness to trade and foreign capital. Communism is a disease of
          the transition, which aid and investment can prevent.
        texts:
          - {author: W. W. Rostow, title: "The Stages of Economic Growth: A Non-Communist Manifesto", year: 1960}
      - label: Structuralism and dependent development
        thinkers: []
        positions: [exchange.unequal.terms-of-trade, development.path.import-substitution]
        argument: >-
          Raúl Prebisch and the UN Economic Commission for Latin America showed that the prices of raw materials
          tend to fall against manufactures, so exporters of primary goods run to stand still. Industrialization
          behind tariffs is the way out. Fernando Henrique Cardoso and Enzo Faletto added that development is
          possible within dependency, shaped by alliances between local and foreign capital.
        texts:
          - {author: Raúl Prebisch, title: The Economic Development of Latin America and Its Principal Problems, year: 1950}
          - {author: Fernando Henrique Cardoso and Enzo Faletto, title: Dependency and Development in Latin America, year: 1969}
      - label: Dependency and delinking
        thinkers: [thinker.amin, thinker.rodney]
        positions: [poverty.cause.drain, development.path.delinking, imperialism.nature.unequal-exchange-drain]
        argument: >-
          Underdevelopment is not an original state but the result of centuries of integration into world
          capitalism as a supplier of cheap labor and raw materials. The regions most tied to the metropolis, like
          the sugar coast of Brazil, are the poorest today. Africa was underdeveloped by Europe. Development
          requires breaking the link: delinking, planning and alliances among the periphery.
        texts:
          - {author: Andre Gunder Frank, title: The Development of Underdevelopment, year: 1966}
          - {author: Walter Rodney, title: How Europe Underdeveloped Africa, year: 1972}
          - {author: Samir Amin, title: Unequal Development, year: 1973}
      - label: Imperialism as pioneer of capitalism
        thinkers: []
        positions: [poverty.cause.late-development, history.motor.technology]
        argument: >-
          Bill Warren argued from a Marxist standpoint that capitalism, including imperialism, was developing the
          productive forces of the periphery, as Marx had expected. Industrial growth in Asia and Latin America
          refuted dependency theory. Nationalist anti-imperialism misled the left into backing local ruling
          classes.
        texts:
          - {author: Bill Warren, title: "Imperialism: Pioneer of Capitalism", year: 1980}
    outcome: >-
      Import substitution produced industrial growth in Brazil, Mexico, India and elsewhere until the debt
      crisis of 1982, after which IMF and World Bank programs imposed opening to trade and capital. East
      Asian growth was claimed by both sides: as proof of integration, and as proof of state-led development
      with controlled links. Cardoso became president of Brazil in 1995 and governed by liberalizing.

  - id: debate.ujamaa
    name: Ujamaa and its critics
    date: "1967–1986"
    summary: >-
      In the 1967 Arusha Declaration, Julius Nyerere committed Tanzania to ujamaa, an African socialism of
      self-reliance built on cooperative villages. Market economists and the World Bank later blamed it for
      economic decline. Marxists at the University of Dar es Salaam argued that it had created a bureaucratic
      ruling group rather than socialism.
    problematic: development.path
    sides:
      - label: Nyerere and TANU
        thinkers: [thinker.nyerere]
        positions: [agrarian.question.communal-tenure, development.path.delinking, firm.ownership.state]
        argument: >-
          Traditional African society was built on familyhood: everyone worked, and no one exploited another.
          Tanzania is poor in money and rich in people and land, so it must develop by its own effort, not by
          foreign aid or investment that would make it a dependent. Peasants living and working together in
          villages can receive schools, water and clinics, and the main means of production belong to the
          nation.
        texts:
          - {author: Julius K. Nyerere, title: "Ujamaa: The Basis of African Socialism", year: 1962}
          - {author: Julius K. Nyerere, title: The Arusha Declaration, year: 1967}
          - {author: Julius K. Nyerere, title: Socialism and Rural Development, year: 1967}
      - label: Market critics and the World Bank
        thinkers: []
        positions: [development.path.market-freedom, agrarian.question.commercial-farms, intl.institutions.cooperation]
        argument: >-
          The World Bank's 1981 report argued that African governments had taxed farmers through state marketing
          boards and overvalued currencies, starving agriculture of incentives. Goran Hyden argued that peasants
          not yet captured by the market or the state could withdraw from both. Villagization and state
          enterprises destroyed output; prices, private farms and open trade would restore it.
        texts:
          - {author: Goran Hyden, title: "Beyond Ujamaa in Tanzania: Underdevelopment and an Uncaptured Peasantry", year: 1980}
          - {author: World Bank, title: "Accelerated Development in Sub-Saharan Africa: An Agenda for Action", year: 1981}
      - label: The Dar es Salaam Marxists
        thinkers: []
        positions: [comprador.nature.bureaucratic-bourgeoisie, class.concept.relation-to-production]
        argument: >-
          Issa Shivji argued that nationalization transferred control from foreign capital to a bureaucratic
          bourgeoisie in the state and parastatals, which remained dependent on foreign capital for technology and
          markets. Peasants were moved into villages by officials, not organized by themselves. Socialism
          requires workers and peasants to hold power, not a party-state acting for them.
        texts:
          - {author: Issa G. Shivji, title: Class Struggles in Tanzania, year: 1976}
    outcome: >-
      Between 1973 and 1976 millions of rural Tanzanians were moved into planned villages, many by force. The
      oil shocks, drought and the 1978–79 war with Idi Amin's Uganda deepened an economic crisis. Nyerere left the
      presidency in 1985, and Tanzania signed an IMF agreement in 1986 and liberalized. The ujamaa years left
      high literacy, a shared national language and relative peace between ethnic groups.

  - id: debate.foreign-aid
    name: The aid debate
    date: "1971–2009"
    summary: >-
      Economists and activists have argued for decades over what aid from rich to poor countries does. Peter
      Bauer and later William Easterly and Dambisa Moyo held that aid props up governments and blocks markets.
      Jeffrey Sachs and others held that more aid could end extreme poverty, and Amartya Sen argued for public
      action on health and education. Critics on the left described aid as an instrument of donor power.
    problematic: aid.foreign
    sides:
      - label: Aid harms
        thinkers: []
        positions: [aid.foreign.dependency-and-theft, development.path.market-freedom, poverty.cause.misrule]
        argument: >-
          Peter Bauer argued that if a country has the conditions for development it does not need aid, and if it
          lacks them aid will not supply them. Aid flows to governments, strengthens their grip on the economy and
          rewards bad policy. Easterly added that planners in donor agencies cannot know what works on the ground,
          and Moyo that aid dependency feeds corruption in Africa.
        texts:
          - {author: P. T. Bauer, title: Dissent on Development, year: 1971}
          - {author: William Easterly, title: The White Man's Burden, year: 2006}
          - {author: Dambisa Moyo, title: Dead Aid, year: 2009}
      - label: Aid and public action
        thinkers: [thinker.sen]
        positions: [aid.foreign.saves-lives-give-more, aid.foreign.duty-of-the-rich, liberty.concept.capability]
        argument: >-
          Development is the expansion of what people are able to do and be: to live long, read, move, take part.
          Public provision of health care and schooling raised life expectancy in Sri Lanka, Kerala and China
          before incomes rose. Jeffrey Sachs argued that the poorest countries are stuck in a trap of disease,
          geography and lack of capital that targeted aid can break, at small cost to the rich.
        texts:
          - {author: Amartya Sen, title: Development as Freedom, year: 1999}
          - {author: Jeffrey Sachs, title: The End of Poverty, year: 2005}
      - label: Aid as an instrument of power
        thinkers: []
        positions: [aid.foreign.instrument-of-power, aid.foreign.small-change-from-the-drain, intl.institutions.creditor-instruments]
        argument: >-
          Teresa Hayter, who worked inside the aid system, argued that the World Bank and donor governments used
          aid to impose policies favorable to foreign capital and to block nationalization and land reform. Later
          writers measured the flows: what leaves the South in debt service, profit and unequal exchange dwarfs
          what arrives as aid.
        texts:
          - {author: Teresa Hayter, title: Aid as Imperialism, year: 1971}
          - {author: Jason Hickel, title: "The Divide: A Brief Guide to Global Inequality and Its Solutions", year: 2017}
    outcome: >-
      The UN target of 0.7 percent of national income for aid, set in 1970, was met by only a few donors. The
      Millennium Development Goals of 2000 increased aid for health; deaths from malaria, HIV and child
      mortality fell sharply in the following decades. In 2025 the United States closed most of its aid agency,
      and several European donors cut their budgets.

  - id: debate.fukuyama-huntington
    name: The end of history and the clash of civilizations
    date: "1989–2001"
    summary: >-
      As the Soviet bloc collapsed, Francis Fukuyama argued that liberal democracy and market economies had no
      remaining ideological rival. Samuel Huntington replied that conflict would now run along the lines of
      cultural civilizations. Critics from the global South rejected both as accounts written from the core
      that hid the structure of world power.
    problematic: contradiction.primary
    sides:
      - label: Fukuyama
        thinkers: [thinker.fukuyama]
        positions: [hist.collapse-1989.end-of-history, world.order.liberal-order, progress.idea.steady-improvement]
        argument: >-
          History, understood as the struggle among large ideas about how to organize society, has ended in the
          victory of liberal democracy. Fascism and communism have been tried and failed. Liberal democracy best
          satisfies the human desire for recognition, and market economies best deliver prosperity. Conflicts will
          go on, but no rival principle can claim universal appeal.
        texts:
          - {author: Francis Fukuyama, title: The End of History?, year: 1989}
          - {author: Francis Fukuyama, title: The End of History and the Last Man, year: 1992}
      - label: Huntington
        thinkers: []
        positions: [contradiction.primary.civilizations, world.order.civilizational-poles]
        argument: >-
          Samuel Huntington argued that people define themselves by ancestry, religion, language and custom. With
          the Cold War over, the great divisions are among civilizations: Western, Confucian, Islamic, Hindu,
          Orthodox, Latin American and others. Western values are not universal, and attempts to impose them
          provoke resistance. The West should strengthen itself rather than remake others.
        texts:
          - {author: Samuel P. Huntington, title: The Clash of Civilizations?, year: 1993}
          - {author: Samuel P. Huntington, title: The Clash of Civilizations and the Remaking of World Order, year: 1996}
      - label: Critics from the South
        thinkers: [thinker.amin]
        positions: [contradiction.primary.imperialism-vs-oppressed, imperialism.nature.monopoly-stage]
        argument: >-
          Both accounts take the core's view of itself as the measure. Fukuyama mistakes a victory of capital for the
          end of politics, while billions live under the conditions it produces. Huntington turns conflicts over
          oil, land and sovereignty into conflicts of culture, and so supplies a justification for the wars that
          follow. Edward Said called it a clash of ignorance.
        texts:
          - {author: Samir Amin, title: Eurocentrism, year: 1988}
          - {author: Edward W. Said, title: The Clash of Ignorance, year: 2001}
    outcome: >-
      The September 2001 attacks and the wars in Afghanistan and Iraq were widely read through Huntington's
      frame. Fukuyama broke publicly with the neoconservatives over Iraq in 2006. The rise of China and the
      return of great-power conflict in the 2010s and 2020s led many to declare both theses refuted.

  - id: debate.fanon-violence
    name: Fanon on colonial violence
    date: "1909–1970"
    summary: >-
      Frantz Fanon, writing during the Algerian war, argued that colonialism is violence and yields only to
      greater violence, and that armed struggle remakes the colonized. The Gandhian tradition held that
      nonviolent mass resistance was both more just and more effective. Amílcar Cabral treated armed struggle as
      a political instrument, and Hannah Arendt argued that violence can destroy power but never create it.
    problematic: violence.political
    sides:
      - label: Fanon
        thinkers: [thinker.fanon]
        positions: [violence.political.anti-colonial, violence.political.regenerative, change.agent.peasants-and-oppressed-nations]
        argument: >-
          The colonial world is a world cut in two, held together by the soldier and the policeman. The colonized
          are told daily, by force, that they are less than human. Decolonization is always a violent event,
          because the settler will not leave on request. For the individual, violence is a cleansing force: it
          frees the native from his inferiority complex and restores his self-respect. The peasants, not the
          urban elite, are the revolutionary class.
        texts:
          - {author: Frantz Fanon, title: The Wretched of the Earth, year: 1961}
          - {author: Jean-Paul Sartre, title: Preface to The Wretched of the Earth, year: 1961}
      - label: Cabral
        thinkers: [thinker.cabral]
        positions: [violence.political.anti-colonial, change.means.armed-struggle, change.tempo.protracted-struggle]
        argument: >-
          Armed struggle in Guinea-Bissau was forced on the people after peaceful protest was met with massacre,
          as at Pidjiguiti in 1959. But arms do not make a revolution; political work among the peasants does. The
          aim is not to kill Portuguese but to end colonial rule, and the liberation movement must build schools,
          clinics and people's stores in the liberated areas as it fights.
        texts:
          - {author: Amílcar Cabral, title: The Weapon of Theory, year: 1966}
      - label: The Gandhian tradition
        thinkers: [thinker.gandhi]
        positions: [violence.political.never, change.means.nonviolent-resistance, hist.decolonization.nonviolent-victory]
        argument: >-
          Means are to ends as seed is to tree: a free society cannot grow from killing. Nonviolent resistance
          draws in the whole people, including women and the poor, rather than a few armed men, and it withdraws
          the cooperation on which every empire depends. Violence breeds a new set of rulers trained in violence.
        texts:
          - {author: M. K. Gandhi, title: Hind Swaraj, year: 1909}
      - label: Arendt
        thinkers: []
        positions: []
        argument: >-
          Hannah Arendt argued that power arises when people act together, while violence is only an instrument
          that can destroy power but not create it. Violence may be justified as a short-term response, but it is
          never legitimate. Fanon's and Sartre's praise of violence as creative turns a means into an end, and
          what it produces is more violence.
        texts:
          - {author: Hannah Arendt, title: On Violence, year: 1970}
    outcome: >-
      Algeria won independence in 1962 after a war that killed hundreds of thousands of Algerians. Guinea-Bissau,
      Mozambique and Angola won independence in 1974–75 after armed struggles that helped bring down the
      Portuguese dictatorship. India in 1947 and Ghana in 1957 won independence mainly through mass political
      movements. Fanon died in 1961 and Cabral was assassinated in 1973.

  - id: debate.mariategui-haya
    name: Mariátegui and Haya de la Torre
    date: "1928–1930"
    summary: >-
      In the late 1920s two Peruvians broke over how Latin America should fight imperialism. Víctor Raúl Haya de
      la Torre's APRA called for a multi-class anti-imperialist front led by the middle classes. José Carlos
      Mariátegui argued that only a socialist movement of workers and indigenous peasants could do it, and that
      the native bourgeoisie was tied to foreign capital.
    problematic: alliances.policy
    sides:
      - label: Haya de la Torre and APRA
        thinkers: []
        positions: [alliances.policy.national-front, nationalism.kinds.national-popular-front, comprador.nature.national-bourgeoisie-ally]
        argument: >-
          In Europe imperialism is the last stage of capitalism; in Indo-America it is the first, because
          capitalism arrived as foreign investment. The struggle is therefore national and anti-imperialist before
          it is socialist. The middle classes, threatened by foreign monopolies, must lead workers and peasants in
          a united front and an anti-imperialist state that controls foreign capital.
        texts:
          - {author: Víctor Raúl Haya de la Torre, title: El antiimperialismo y el APRA, year: 1936, note: written 1928}
      - label: Mariátegui
        thinkers: [thinker.mariategui]
        positions: [comprador.nature.broker-class, agrarian.question.communal-tenure, change.agent.peasants-and-oppressed-nations]
        argument: >-
          The problem of the Indian is the problem of land. The Peruvian bourgeoisie grew as an intermediary of
          foreign capital and is bound to the landowners; it will not lead a fight against either. Socialism in
          Peru will be neither copy nor imitation but heroic creation, drawing on the communal traditions of the
          indigenous ayllu and led by workers and peasants.
        texts:
          - {author: José Carlos Mariátegui, title: Seven Interpretive Essays on Peruvian Reality, year: 1928}
          - {author: José Carlos Mariátegui, title: Anti-Imperialist Point of View, year: 1929}
    outcome: >-
      Mariátegui founded the Socialist Party of Peru in 1928 and died in 1930; the party then became the
      Communist Party. APRA became Peru's largest mass party, was repeatedly banned, moved toward accommodation
      with the elite from the 1950s, and governed under Alan García from 1985. Mariátegui became a founding
      reference for Latin American Marxism.
