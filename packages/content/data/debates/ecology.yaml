# Debates over growth, population and the value of nature.
debates:
  - id: debate.degrowth-ecomodernism
    name: Degrowth and ecomodernism
    date: "2015–present"
    summary: >-
      In 2015 eighteen authors associated with the Breakthrough Institute published An Ecomodernist Manifesto,
      arguing that more technology, nuclear power and intensive farming would let humanity use less of nature.
      Degrowth writers answered that no economy has cut its use of energy and materials fast enough while
      growing, and that rich countries must plan to shrink their throughput. Advocates of green growth and a
      pro-growth wing of the ecosocialist left held positions of their own.
    problematic: growth.ecology
    sides:
      - label: Degrowth
        thinkers: []
        positions: [growth.ecology.degrowth, ecology.crisis-cause.capital-accumulation, progress.idea.within-limits, work.future.shorter-hours]
        argument: >-
          Green growth is a hope, not a finding. Where rich countries have cut emissions while growing, they have
          done so far too slowly to meet the Paris targets, and their use of materials has not fallen at all
          once imports are counted. An economy that must grow for profit cannot shrink its footprint in time. Rich
          countries should scale down the production of things nobody needs, shorten the working week, guarantee
          public goods, and leave the room for growth to the South.
        texts:
          - {author: Serge Latouche, title: Petit traité de la décroissance sereine, year: 2007}
          - {author: Giorgos Kallis, title: Degrowth, year: 2018}
          - {author: Jason Hickel, title: "Less Is More: How Degrowth Will Save the World", year: 2020}
          - {author: Jason Hickel and Giorgos Kallis, title: Is Green Growth Possible?, year: 2020}
      - label: Ecomodernism
        thinkers: []
        positions: [growth.ecology.ecomodernism, energy.transition.nuclear-abundance, technology.nature.liberation]
        argument: >-
          Humanity has always used less land and fewer resources per person as it grew richer: cities, intensive
          farming and dense energy spare nature. The way to protect wild places is to decouple human welfare
          from them, with nuclear power, high-yield agriculture and urbanization. Asking the world's poor to stay
          poor for the planet is neither just nor going to happen. Abundance is the cure for environmental damage,
          not its cause.
        texts:
          - {author: John Asafu-Adjei et al., title: An Ecomodernist Manifesto, year: 2015}
          - {author: Michael Shellenberger and Ted Nordhaus, title: The Death of Environmentalism, year: 2004}
      - label: Green growth
        thinkers: []
        positions: [growth.ecology.green-growth, energy.transition.market-led, ecology.crisis-cause.market-failure]
        argument: >-
          Pollution is damage nobody pays for. Put a price on carbon, remove subsidies to fossil fuels, invest in
          clean energy, and markets will do the rest, as falling solar and battery prices already show. Growth
          pays for the transition and keeps it popular. Shrinking the economy would throw millions out of work
          and lose the public consent that climate policy needs.
        texts:
          - {author: OECD, title: Towards Green Growth, year: 2011}
          - {author: Nicholas Stern, title: The Economics of Climate Change, year: 2006}
      - label: Pro-growth ecosocialism
        thinkers: []
        positions: [growth.ecology.ecosocialism, energy.transition.public-ownership, consumption.choice.production-decides]
        argument: >-
          Degrowth speaks the language of sacrifice to workers who already have too little, and will lose them.
          The problem is not that people consume too much but that capital owns the power plants and decides
          what to build. Socialize energy, build clean power at scale, and promise working people more security,
          not less. Climate politics is class war against the owners of fossil capital, and it is won by a mass
          movement of workers, not by preaching restraint.
        texts:
          - {author: Leigh Phillips, title: Austerity Ecology and the Collapse-Porn Addicts, year: 2015}
          - {author: Matthew T. Huber, title: Climate Change as Class War, year: 2022}
    outcome: >-
      The debate remains open. Degrowth gained a hearing in academic and some policy circles, and governments
      of the South continued to insist on their right to develop first. Rich-country governments adopted green
      industrial policy, subsidizing clean energy rather than pricing carbon alone, while global emissions
      continued to rise.

  - id: debate.ehrlich-simon
    name: The Ehrlich–Simon wager
    date: "1980–1990"
    summary: >-
      Biologist Paul Ehrlich warned in 1968 that population growth would bring mass famine and scarcity.
      Economist Julian Simon argued that human ingenuity makes resources more abundant over time. In 1980 Simon
      challenged doomsayers to bet that the price of any raw materials would fall. Ehrlich and two colleagues
      chose copper, chromium, nickel, tin and tungsten. By 1990 all five had fallen in price after inflation,
      and Ehrlich paid Simon 576.07 dollars.
    problematic: population.question
    sides:
      - label: Ehrlich
        thinkers: [thinker.ehrlich]
        positions: [population.question.too-many, ecology.crisis-cause.too-many-people]
        argument: >-
          A finite planet cannot support endless growth in numbers. Environmental damage is the product of
          population, consumption per person and the technology used to supply it, and population multiplies
          the other two. Metal prices are a poor gauge; what matters is soil, water, climate and the living
          systems that do not appear on any price list. Limit births by choice now, or nature will limit them by
          hunger and disease.
        texts:
          - {author: Paul R. Ehrlich, title: The Population Bomb, year: 1968}
          - {author: Paul R. Ehrlich and John P. Holdren, title: Impact of Population Growth, year: 1971}
      - label: Simon
        thinkers: [thinker.julian-simon]
        positions: [population.question.people-are-the-resource, growth.ecology.growth-is-the-cure, ecology.crisis-cause.overstated]
        argument: >-
          Resources are not fixed lumps in the ground. When something grows scarce its price rises, and people
          search for more of it, use it better and find substitutes. Over the long run nearly every raw material
          has become cheaper, and food more plentiful, as population grew. The ultimate resource is people:
          skilled, spirited, hopeful people who invent their way out of shortage, provided markets and liberty
          let them.
        texts:
          - {author: Julian L. Simon, title: The Ultimate Resource, year: 1981}
      - label: Commoner
        thinkers: []
        positions: [population.question.consumption-not-numbers, ecology.crisis-cause.capital-accumulation]
        argument: >-
          Pollution in the United States rose far faster after 1945 than population did. The cause was new
          production technology chosen because it was profitable: synthetic chemicals, detergents, heavy
          fertilizer, larger cars. Population growth in poor countries follows from poverty, much of it made by
          colonial exploitation, and falls when living standards rise. Blaming numbers blames the poor for what
          the owners of industry decided.
        texts:
          - {author: Barry Commoner, title: The Closing Circle, year: 1971}
          - {author: Barry Commoner, title: The Poverty of Power, year: 1976}
    outcome: >-
      Simon won the bet, and the famines of hundreds of millions that Ehrlich had predicted for the 1970s did
      not come. Ehrlich and Stephen Schneider later offered a second bet on fifteen environmental trends,
      including temperature and fish stocks, which Simon declined. Later analyses found that Ehrlich would have
      won over many other ten-year periods. Paul Sabin told the story in The Bet (2013).

  - id: debate.social-deep-ecology
    name: Social ecology and deep ecology
    date: "1973–1991"
    summary: >-
      In 1973 Arne Naess distinguished a shallow ecology concerned with pollution and human health from a deep
      ecology holding that all life has value in itself. At a gathering of United States Greens in 1987, Murray
      Bookchin attacked deep ecology as misanthropic and argued that the domination of nature grows out of
      domination among humans. In 1989 the Indian historian Ramachandra Guha criticized deep ecology from the
      standpoint of peasants in the global South.
    problematic: nature.value
    sides:
      - label: Deep ecology
        thinkers: [thinker.naess]
        positions: [nature.value.intrinsic, growth.ecology.deep-ecology, ecology.crisis-cause.human-mastery, population.question.too-many]
        argument: >-
          The flourishing of non-human life has value in itself, whatever its use to us. Humans have no right to
          reduce the richness of life except to satisfy vital needs. Reformist environmentalism protects nature
          as a resource for affluent people; a deeper change of outlook is needed, in which we identify with the
          whole of life. The flourishing of other species requires a smaller human population and a far lighter
          human presence on the earth.
        texts:
          - {author: Arne Naess, title: "The Shallow and the Deep, Long-Range Ecology Movement", year: 1973}
          - {author: Bill Devall and George Sessions, title: "Deep Ecology: Living as if Nature Mattered", year: 1985}
      - label: Social ecology
        thinkers: [thinker.bookchin]
        positions: [federalism.scale.confederal-communes, ecology.crisis-cause.capital-accumulation, population.question.consumption-not-numbers]
        argument: >-
          The idea of dominating nature arose from the domination of human by human: elders over the young, men
          over women, rulers over the ruled. A market economy that must grow or die is devouring the planet, not
          an abstract humanity. Deep ecology blames people as a species and its fringe has welcomed famine as
          nature's correction. The answer is a society without hierarchy, of confederated self-governing towns
          living in balance with their regions.
        texts:
          - {author: Murray Bookchin, title: The Ecology of Freedom, year: 1982}
          - {author: Murray Bookchin, title: "Social Ecology versus Deep Ecology: A Challenge for the Ecology Movement", year: 1987}
      - label: Environmentalism of the poor
        thinkers: []
        positions: [ecology.crisis-cause.core-appropriation, property.commons.self-governed]
        argument: >-
          Deep ecology's love of wilderness is an American export with harmful effects in India, where tiger
          reserves have been carved out by evicting peasants and forest dwellers. The real threats to the earth
          are the overconsumption of the rich countries and of Southern elites, and militarization. In the South
          the ecological struggles that matter are those of peasants, fishers and forest peoples defending the
          commons they live from, as in the Chipko movement.
        texts:
          - {author: Ramachandra Guha, title: "Radical American Environmentalism and Wilderness Preservation: A Third World Critique", year: 1989}
    outcome: >-
      Bookchin and Earth First! co-founder Dave Foreman debated in 1989 and published the exchange as Defending
      the Earth (1991). Deep ecology influenced direct-action groups and conservation biology. Social ecology
      later reached the Kurdish movement through Abdullah Öcalan. Guha's critique fed the study of
      environmental conflicts in the South.
