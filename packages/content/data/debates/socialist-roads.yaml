# Debates over roads to socialism after 1925: China, the socialist camp, Western Europe, Yugoslavia, Chile, Venezuela.
debates:
  - id: debate.national-bourgeoisie-china
    name: The national bourgeoisie and the Chinese revolution
    date: "1925–1940"
    summary: >-
      In the 1920s the Communist International told the small Chinese Communist Party to work inside the
      Guomindang, on the view that China's national bourgeoisie was an ally against imperialism. Trotsky
      argued that this bourgeoisie was bound to the landlords and foreign capital and would turn on the
      workers. After Chiang Kai-shek massacred communists in 1927, Mao built a different alliance, led by
      the party and based on the peasantry.
    problematic: comprador.nature
    sides:
      - label: The Comintern's bloc of four classes
        thinkers: [thinker.stalin]
        positions: [comprador.nature.national-bourgeoisie-ally, alliances.policy.national-front]
        argument: >-
          China is a semi-colony; its first task is a national revolution against imperialism and the
          warlords, not socialism. The Guomindang unites workers, peasants, the urban petty bourgeoisie and
          the national bourgeoisie in that fight. Communists must stay inside it, strengthen its left, and
          avoid pushing the bourgeoisie into the imperialists' arms before the national revolution is won.
        texts:
          - {author: J. V. Stalin, title: The Prospects of the Revolution in China, year: 1926}
      - label: Trotsky and the Left Opposition
        thinkers: [thinker.trotsky]
        positions: [comprador.nature.broker-class, internationalism.permanent-revolution]
        argument: >-
          In a semi-colony the bourgeoisie is tied by credit, land and trade to the landlords and foreign
          capital, and it fears its own workers more than it hates the imperialists. Subordinating the party
          to the Guomindang disarms the workers and peasants on the eve of the bourgeoisie's turn against them.
          Only the working class, leading the peasantry and building soviets, can carry the anti-imperialist
          revolution through.
        texts:
          - {author: Leon Trotsky, title: The Chinese Revolution and the Theses of Comrade Stalin, year: 1927}
          - {author: Harold Isaacs, title: The Tragedy of the Chinese Revolution, year: 1938}
      - label: Mao's new democracy
        thinkers: [thinker.mao]
        positions: [comprador.nature.national-bourgeoisie-ally, change.agent.peasants-and-oppressed-nations, hist.chinese-revolution.new-democratic, change.tempo.protracted-struggle]
        argument: >-
          The bourgeoisie in China is two classes: the comprador big bourgeoisie that serves imperialism, and
          a national bourgeoisie that wavers but can be won to the national cause. The revolution needs a broad
          front of all four classes, but under the leadership of the Communist Party with its own army and
          base areas, so that no ally can disarm it. The countryside encircles the cities.
        texts:
          - {author: Mao Zedong, title: Analysis of the Classes in Chinese Society, year: 1926}
          - {author: Mao Zedong, title: On New Democracy, year: 1940}
    outcome: >-
      In April 1927 Chiang's forces killed thousands of communists and unionists in Shanghai, and the Wuhan
      Guomindang broke with the communists that summer. The party regrouped in rural base areas, formed a
      second united front with the Guomindang against Japan in 1937, and took power in 1949 on a program of
      new democracy. Private industry belonging to the national bourgeoisie was converted to joint
      state-private ownership by 1956.

  - id: debate.sino-soviet-split
    name: The Sino-Soviet split
    date: "1956–1964"
    summary: >-
      After Khrushchev denounced Stalin in 1956 and proposed peaceful coexistence with the United States and
      a possible peaceful transition to socialism, the Chinese Communist Party accused the Soviet leadership
      of revisionism. The dispute moved from closed meetings to open polemics in 1963 and divided
      communist parties across the world.
    problematic: hist.ussr-late
    sides:
      - label: The CPSU under Khrushchev
        thinkers: [thinker.khrushchev]
        positions: [hist.cold-war.two-camps, hist.ussr-late.rear-base-of-liberation, elections.role.main-road]
        argument: >-
          Nikita Khrushchev's leadership held that nuclear weapons have changed the question of war: a world
          war would destroy socialism along with capitalism. The socialist camp can win by peaceful economic
          competition, and in some countries workers can reach power through parliament. The crimes of the
          Stalin period had to be exposed so that socialism could correct them and renew itself.
        texts:
          - {author: Nikita Khrushchev, title: On the Cult of Personality and Its Consequences, year: 1956}
          - {author: Central Committee of the CPSU, title: Open Letter to Party Organizations and All Communists of the Soviet Union, year: 1963}
      - label: The Chinese and Albanian parties
        thinkers: [thinker.mao, thinker.hoxha]
        positions: [hist.ussr-late.capitalism-restored-1956, contradiction.primary.imperialism-vs-oppressed, hist.ussr-stalin.socialism-built, violence.political.revolutionary]
        argument: >-
          Imperialism has not changed its nature because it has nuclear weapons. Preaching peaceful transition
          disarms revolutionaries, and peaceful coexistence becomes collusion with the United States at the
          expense of the oppressed nations. The attack on Stalin was an attack on the dictatorship of the
          proletariat, and a privileged stratum in the USSR is restoring capitalism under a socialist name.
        texts:
          - {author: Enver Hoxha, title: Speech Delivered at the Meeting of 81 Communist and Workers' Parties in Moscow, year: 1960}
          - {author: Communist Party of China, title: A Proposal Concerning the General Line of the International Communist Movement, year: 1963}
          - {author: Communist Party of China, title: On Khrushchov's Phoney Communism and Its Historical Lessons for the World, year: 1964}
    outcome: >-
      The USSR withdrew its technical advisers from China in 1960. Soviet and Chinese troops fought on the
      Ussuri River in 1969, and China opened relations with the United States in 1971–72. Communist parties
      and movements across Asia, Africa and Latin America split into pro-Soviet and pro-Chinese wings.
      Relations between the two states were normalized in 1989.

  - id: debate.three-worlds
    name: The three worlds theory
    date: "1974–1978"
    summary: >-
      In 1974 Deng Xiaoping presented to the United Nations Mao's view that the world was divided into
      three: the two superpowers, the other industrial countries, and the countries of Asia, Africa and
      Latin America. China called for a broad front against the superpowers, and especially against the
      USSR. The Albanian Party of Labour rejected the theory as an abandonment of class struggle.
    problematic: contradiction.primary
    sides:
      - label: The Chinese party
        thinkers: [thinker.mao]
        positions: [contradiction.primary.three-worlds, hist.ussr-late.capitalism-restored-1956]
        argument: >-
          The main contradiction is between the superpowers, which contend for world hegemony, and the
          countries and peoples they dominate. The Soviet Union, a social-imperialist power on the rise, is
          the more dangerous of the two. The countries of the third world are the main force against
          imperialism, and the second world can be won to a united front against hegemonism.
        texts:
          - {author: Deng Xiaoping, title: Speech at the Special Session of the U.N. General Assembly, year: 1974}
          - {author: People's Daily editorial department, title: "Chairman Mao's Theory of the Differentiation of the Three Worlds Is a Major Contribution to Marxism-Leninism", year: 1977}
      - label: Hoxha and the Albanian party
        thinkers: [thinker.hoxha]
        positions: [contradiction.primary.capital-vs-labor, contradiction.primary.imperialism-vs-oppressed]
        argument: >-
          Dividing the world into three worlds dissolves classes into states. It asks the workers and peoples of
          the third world to unite with their own reactionary rulers, and the second world to unite with its
          monopolies and with US imperialism against the Soviet Union. That is counter-revolutionary in
          practice: a revolution needs the class struggle against every imperialism and every bourgeoisie.
        texts:
          - {author: Enver Hoxha, title: Imperialism and the Revolution, year: 1978}
      - label: The Non-Aligned call for a new economic order
        thinkers: [thinker.boumediene]
        positions: [hist.cold-war.non-alignment, intl.sovereignty.nations-set-own-course, exchange.unequal.terms-of-trade]
        argument: >-
          The governments of the Non-Aligned Movement and the Group of 77 argued that the division that
          mattered was between the industrial countries and the formerly colonized ones, over prices, debt,
          technology and control of natural resources. They demanded sovereignty over resources, fair commodity
          prices and reform of the world's financial institutions rather than alignment with either bloc.
        texts:
          - {author: United Nations General Assembly, title: Declaration on the Establishment of a New International Economic Order, year: 1974}
    outcome: >-
      China cut aid to Albania in 1978 and the two parties broke. Pro-Chinese parties around the world split
      between followers of the Chinese and the Albanian lines. China moved closer to the United States and
      normalized relations in 1979. The new international economic order was never implemented, and the debt
      crisis of the 1980s ended most of its program.

  - id: debate.bad-godesberg
    name: The Bad Godesberg turn
    date: "1956–1960"
    summary: >-
      In 1959 the German Social Democratic Party adopted a program that dropped Marxism as its foundation,
      accepted the market economy and private property in production, and presented the party as a people's
      party rather than a workers' party. In Britain, Anthony Crosland argued the same case for Labour. The
      party left answered that the private ownership of capital was still the source of class power.
    problematic: reform.revolution
    sides:
      - label: The revisionists of the 1950s
        thinkers: [thinker.crosland]
        positions: [allocation.mechanism.social-market, reform.revolution.reform-is-the-road, org.form.broad-party, capitalism.nature.managed-engine]
        argument: >-
          Capitalism has changed: managers have displaced owners, Keynesian policy controls the cycle, and the
          welfare state and full employment have given workers security. Socialism is about equality and
          social justice, not about who owns the shares. The program put it plainly: competition as far as
          possible, planning as far as necessary. A party that wants to govern must speak to the whole people.
        texts:
          - {author: C. A. R. Crosland, title: The Future of Socialism, year: 1956}
          - {author: Social Democratic Party of Germany, title: Godesberg Programme, year: 1959}
      - label: The socialist left
        thinkers: [thinker.miliband]
        positions: [capitalism.nature.exploitation-profit, firm.ownership.state, class.concept.relation-to-production]
        argument: >-
          Owners and managers both serve profit; the wealth and power at the top have not been touched.
          Keynesian management and welfare depend on a boom the party does not control, and private capital
          keeps its veto over investment, jobs and governments. A party that gives up common ownership gives up
          the only means of changing who holds power, and becomes a better manager of capitalism.
        texts:
          - {author: Ralph Miliband, title: "Parliamentary Socialism: A Study in the Politics of Labour", year: 1961}
    outcome: >-
      The SPD conference at Bad Godesberg adopted the program by 324 votes to 16. The SPD entered a grand
      coalition in 1966 and led the federal government from 1969 to 1982. In Britain, Hugh Gaitskell's attempt
      to drop Labour's common-ownership clause failed in 1959–60; Tony Blair rewrote it in 1995.

  - id: debate.eurocommunism
    name: Eurocommunism
    date: "1973–1980"
    summary: >-
      In the 1970s the Italian, Spanish and French communist parties declared their independence from Moscow
      and their commitment to multiparty elections, civil liberties and a gradual road to socialism through
      existing institutions. The Soviet party criticized them, and Trotskyists and other revolutionary
      Marxists argued that they had become social democratic parties.
    problematic: state.relation
    sides:
      - label: Berlinguer and Carrillo
        thinkers: [thinker.berlinguer, thinker.carrillo]
        positions: [state.relation.capture-and-use, party.system.competitive-multiparty, alliances.policy.center-coalition, elections.role.main-road]
        argument: >-
          Enrico Berlinguer drew a lesson from Chile: a left with half the vote cannot transform a country
          against the other half and the army. Italy needed a historic compromise of communist, socialist and
          Catholic masses. Santiago Carrillo argued that in Western Europe socialism must be built through
          parliament, plural parties and liberties won by the workers' movement, democratizing the state
          apparatus from within.
        texts:
          - {author: Enrico Berlinguer, title: Reflections on Italy after the Events in Chile, year: 1973}
          - {author: Santiago Carrillo, title: Eurocommunism and the State, year: 1977}
      - label: Poulantzas's democratic road
        thinkers: [thinker.poulantzas]
        positions: [reform.revolution.non-reformist-reforms, state.nature.relative-autonomy]
        argument: >-
          The state is not a fortress to be stormed from outside; class struggle runs through its apparatuses.
          The road to socialism combines transforming representative institutions with building direct
          democracy at the base. Avoid both the Leninist model of dual power and the social democratic
          management of the existing state.
        texts:
          - {author: Nicos Poulantzas, title: "State, Power, Socialism", year: 1978}
      - label: Revolutionary Marxist critics
        thinkers: [thinker.mandel]
        positions: [state.relation.smash-and-replace, reform.revolution.revolution-necessary, democracy.form.council]
        argument: >-
          Ernest Mandel argued that the Eurocommunist parties had reached the same place as social democracy by
          a different road. A capitalist state's army and administration will not let themselves be
          democratized by a parliamentary majority; Chile showed what they do instead. The way out of
          Stalinism is workers' councils and socialist pluralism, not the bourgeois parliament.
        texts:
          - {author: Ernest Mandel, title: From Stalinism to Eurocommunism, year: 1978}
    outcome: >-
      The Italian Communist Party won 34.4 percent of the vote in 1976 and supported Christian Democratic
      governments from outside until 1979 without entering them. The Spanish party fell to about 4 percent in
      1982, and the French Union of the Left broke apart in 1977. The Italian party dissolved itself in 1991.

  - id: debate.yugoslav-self-management
    name: The Yugoslav self-management debates
    date: "1950–1978"
    summary: >-
      After its break with Stalin in 1948, Yugoslavia handed the management of enterprises to elected workers'
      councils and from 1965 let enterprises compete on markets. Yugoslav reformers, the Praxis philosophers,
      the dissident Milovan Djilas, and the Albanian party argued over whether this was socialist workers'
      control, a market that undermined it, a new ruling class, or capitalism.
    problematic: hist.yugoslavia
    sides:
      - label: The reformers
        thinkers: [thinker.kardelj, thinker.horvat]
        positions: [planning.form.self-management, allocation.mechanism.market-socialism, hist.yugoslavia.self-management]
        argument: >-
          Edvard Kardelj and economists such as Branko Horvat argued that state ownership under central planning
          had produced bureaucracy, not socialism. Socially owned enterprises run by their workers' councils,
          trading on markets and linked by social planning, put the producers in charge. Markets transmit
          information; self-management decides what to do with it.
        texts:
          - {author: Branko Horvat, title: Towards a Theory of Planned Economy, year: 1964}
      - label: The Praxis humanists
        thinkers: [thinker.markovic]
        positions: [planning.form.participatory, democracy.form.council]
        argument: >-
          Mihailo Marković and the Praxis circle defended self-management but argued that the 1965 market reform
          turned enterprises into collective capitalists, competing for profit, laying off workers and widening
          the gap between regions. Self-management needs to rise above the enterprise to councils that plan
          the economy, and the party's monopoly over politics has to end.
        texts:
          - {author: Svetozar Stojanović, title: Between Ideals and Reality, year: 1973}
          - {author: Mihailo Marković, title: From Affluence to Praxis, year: 1974}
      - label: Djilas's new class
        thinkers: [thinker.djilas]
        positions: [hist.yugoslavia.new-class, party.system.competitive-multiparty]
        argument: >-
          Milovan Djilas, once Tito's deputy, argued that communist revolutions create a new class: the party
          bureaucracy, which owns nothing personally but controls all property through the state. Workers'
          councils change nothing while the party decides. Only political pluralism can break that monopoly.
        texts:
          - {author: Milovan Djilas, title: The New Class, year: 1957}
      - label: The Albanian critique
        thinkers: [thinker.hoxha]
        positions: [hist.yugoslavia.revisionist-capitalism]
        argument: >-
          Self-administration is a capitalist theory in socialist dress. Enterprises that own their means of
          production and compete for profit are groups of capitalists, the market rules the plan, and Yugoslavia
          lives on Western credit. The dictatorship of the proletariat and central planning have been abandoned.
        texts:
          - {author: Enver Hoxha, title: "Yugoslav \"Self-Administration\": A Capitalist Theory and Practice", year: 1978}
    outcome: >-
      Workers' councils were introduced in 1950 and the market reform in 1965. Students in Belgrade protested
      inequality in 1968, the Praxis journal was closed and eight Belgrade professors dismissed in 1975, and
      Djilas spent years in prison. Foreign debt grew through the 1970s; IMF austerity programs in the 1980s
      deepened regional conflict, and the federation broke apart in war from 1991.

  - id: debate.china-reform
    name: The Chinese reform debate
    date: "1975–1992"
    summary: >-
      In the last years of Mao's life the party's left, led by Jiang Qing and Zhang Chunqiao, argued that
      wage grades and commodity exchange were breeding a new bourgeoisie inside the party. After Mao died, Deng
      Xiaoping's coalition defeated them and opened China to markets and foreign capital. Planners around Chen
      Yun accepted reform but wanted the plan to stay dominant.
    problematic: hist.china-reform
    sides:
      - label: The Maoist left
        thinkers: [thinker.zhang-chunqiao]
        positions: [hist.china-mao.continuing-revolution, hist.china-reform.capitalist-restoration, planning.form.mass-line]
        argument: >-
          Socialism is a long transition in which classes still exist. Wage differences, commodity exchange and
          material incentives keep reproducing bourgeois right, and the people who benefit from them sit in the
          party's leadership. The revolution must continue under the dictatorship of the proletariat, or those
          capitalist roaders will restore capitalism.
        texts:
          - {author: Zhang Chunqiao, title: On Exercising All-Round Dictatorship over the Bourgeoisie, year: 1975}
          - {author: Charles Bettelheim, title: The Great Leap Backward, year: 1978}
      - label: Deng's reformers
        thinkers: [thinker.deng-xiaoping]
        positions: [hist.china-reform.primary-stage, allocation.mechanism.market-socialism, knowledge.basis.practice, development.path.developmental-state]
        argument: >-
          Deng Xiaoping's coalition held that practice is the sole criterion of truth. Poverty is not
          socialism. China is in the primary stage of socialism, and its main task is to develop the productive
          forces; markets and foreign investment are tools that a socialist state can use. It does not matter
          whether a cat is black or white, so long as it catches mice.
        texts:
          - {author: Guangming Daily special commentator, title: Practice Is the Sole Criterion for Testing Truth, year: 1978}
          - {author: Deng Xiaoping, title: "Emancipate the Mind, Seek Truth from Facts and Unite as One in Looking to the Future", year: 1978}
      - label: Chen Yun's planners
        thinkers: [thinker.chen-yun]
        positions: [allocation.mechanism.mixed-steered, planning.form.material-balances]
        argument: >-
          Chen Yun and the planners accepted rural reform and markets at the margin but argued that the plan
          must remain the cage within which the market bird flies. Without it, investment would overheat,
          prices would run away, and corruption would grow among those who could trade between plan and market.
        texts: []
    outcome: >-
      Jiang Qing, Zhang Chunqiao and two others were arrested in October 1976 and tried in 1980–81. The Third
      Plenum of December 1978 launched reform, and rural communes were dissolved by 1984. Price reform and
      inflation fed the protests of 1989, which were suppressed in June. Deng's southern tour of 1992 led the
      party to adopt the goal of a socialist market economy that year.

  - id: debate.chile-peaceful-road
    name: Chile's peaceful road to socialism
    date: "1970–1973"
    summary: >-
      Salvador Allende's Popular Unity coalition won the 1970 presidential election with 36 percent and set out
      to build socialism through the existing constitution: nationalizing copper and banks, deepening land
      reform, and raising wages. The Revolutionary Left Movement argued that the armed forces and the owners
      would never allow it. The Christian Democrats and the right moved into opposition and, by 1973, called
      the government illegitimate.
    problematic: reform.revolution
    sides:
      - label: Allende and Popular Unity
        thinkers: [thinker.allende]
        positions: [elections.role.main-road, state.relation.capture-and-use, hist.chile-1973.peaceful-road-destroyed]
        argument: >-
          Allende argued that Chile, with its long constitutional tradition and its professional army, could be
          the first country to build socialism by legal means, with pluralism and civil liberties. Workers would
          use the institutions they had won to take the commanding heights of the economy. Arming the people
          against the army would provoke the civil war the right wanted.
        texts:
          - {author: Salvador Allende, title: First Message to Congress, year: 1971}
      - label: The Revolutionary Left Movement (MIR) and the cordones
        thinkers: [thinker.pascal-allende]
        positions: [reform.revolution.revolution-necessary, state.relation.smash-and-replace, hist.chile-1973.peaceful-road-a-trap]
        argument: >-
          The MIR and the industrial belts of Santiago argued that winning the presidency is not winning power.
          The army, the courts, Congress and the owners would strike back, backed by Washington. The workers had
          to build their own organs of power in factories and estates and prepare to defend them, or the road
          would end in a massacre.
        texts: []
      - label: The opposition
        thinkers: [thinker.frei]
        positions: [hist.chile-1973.saved-from-communism, property.private.natural-right]
        argument: >-
          The National Party and, by 1973, most Christian Democrats argued that a minority government was
          seizing property by decree and through occupations, wrecking the economy and arming its supporters.
          On 22 August 1973 the Chamber of Deputies declared that the government had broken the constitution
          and called on the armed forces to restore legal order.
        texts:
          - {author: Chamber of Deputies of Chile, title: Agreement of the Chamber of Deputies, year: 1973, note: resolution of 22 August 1973}
    outcome: >-
      Congress nationalized copper unanimously in 1971. The US government worked to block and then destabilize
      the government, and inflation and a lorry owners' strike shook the economy in 1972–73. The armed forces
      overthrew the government on 11 September 1973; Allende died in the presidential palace. Chilean state
      commissions later documented over 3,000 people killed or disappeared and tens of thousands imprisoned
      and tortured under the military government.

  - id: debate.venezuela-21st-century
    name: Twenty-first-century socialism in Venezuela
    date: "2005–2019"
    summary: >-
      In 2005 Hugo Chávez declared that Venezuela's Bolivarian process would build a socialism of the
      twenty-first century, funded by oil revenue and organized through communal councils and communes.
      Supporters saw a new model of participatory socialism. Liberal critics blamed state control for the later
      collapse, and left critics blamed the oil rent and a new layer of state-connected business.
    problematic: hist.venezuela
    sides:
      - label: Chavismo and the communal project
        thinkers: [thinker.chavez, thinker.harnecker]
        positions: [hist.venezuela.bolivarian-revolution, hist.venezuela.communes-from-below, hist.venezuela.economic-war]
        argument: >-
          Oil wealth, captured from a comprador elite, paid for missions in health, literacy and housing, and
          communal councils let the poor run their own neighborhoods. Michael Lebowitz and Marta Harnecker
          argued that socialism means human development through protagonism: people change themselves by
          running their own affairs. The crisis came from sabotage, the oil price collapse and US sanctions,
          not from socialism.
        texts:
          - {author: Michael A. Lebowitz, title: "Build It Now: Socialism for the Twenty-First Century", year: 2006}
          - {author: Hugo Chávez, title: Golpe de timón, year: 2012, note: address to the council of ministers, 20 October 2012}
          - {author: Marta Harnecker, title: "A World to Build: New Paths toward Twenty-First Century Socialism", year: 2015}
      - label: Liberal critics
        thinkers: [thinker.naim]
        positions: [hist.venezuela.socialism-wrecked-it, poverty.cause.bad-institutions]
        argument: >-
          Price controls, expropriations and the takeover of the oil company destroyed production and
          investment, and the government spent the boom instead of saving it. Courts, the electoral body and the
          central bank were bent to one party's will. When oil prices fell, nothing was left but printing money.
        texts:
          - {author: Javier Corrales and Michael Penfold, title: "Dragon in the Tropics: Hugo Chávez and the Political Economy of Revolution in Venezuela", year: 2011}
      - label: Left critics of the petro-state
        thinkers: [thinker.coronil, thinker.lander]
        positions: [hist.venezuela.petrostate, hist.venezuela.bolibourgeoisie]
        argument: >-
          Venezuela changed who distributed the oil rent, not how the country lived. Imports paid for by oil kept
          domestic farming and industry weak, and access to cheap dollars created a new bourgeoisie inside and
          around the state. Socialism cannot be built on a rentier economy without delinking from it.
        texts:
          - {author: Fernando Coronil, title: "The Magical State: Nature, Money, and Modernity in Venezuela", year: 1997}
    outcome: >-
      A coup in April 2002 removed Chávez for two days before mass protests and loyal troops restored him.
      Communal councils were legislated in 2006 and communes in 2010. After Chávez died in 2013 and oil prices
      fell in 2014, output collapsed, inflation reached hyperinflation, and over seven million people
      emigrated. The United States imposed financial sanctions in 2017 and oil sanctions in 2019.
