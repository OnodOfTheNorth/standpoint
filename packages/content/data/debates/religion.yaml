# Debates over religion, nation and the state.
debates:
  - id: debate.hindutva-secularism
    name: Hindutva and Nehruvian secularism
    date: "1923–present"
    summary: >-
      In 1923 V. D. Savarkar defined a Hindu as one who holds India to be both fatherland and holy land, and
      the Rashtriya Swayamsevak Sangh, founded in 1925, organized to make that idea the basis of the nation.
      Jawaharlal Nehru and the Congress held that India belonged equally to all its religious communities and
      that the state should have no religion. Gandhi held a third view, that public life should be religious
      but that all faiths were equal. The quarrel shaped Partition, the constitution and Indian politics since.
    problematic: religion.public
    sides:
      - label: Hindutva
        thinkers: [thinker.savarkar, thinker.golwalkar]
        positions: [religion.public.faith-as-nation, nation.belonging.civilizational, caste.question.hindu-unity, hist.partition-india.vivisection]
        argument: >-
          Hindutva is not a creed but a nationality: the common blood, culture and history of a people for whom
          this land is both fatherland and holy land. A nation is a people with one culture, and India's culture
          is Hindu. Those whose holy lands lie elsewhere may live here in full safety, but must honor that culture
          as their own. Secularism as practiced in India appeases minorities and divides the majority, and caste
          divisions have kept Hindus weak for a thousand years. Unite them, and the nation will stand.
        texts:
          - {author: V. D. Savarkar, title: Essentials of Hindutva, year: 1923}
          - {author: M. S. Golwalkar, title: We or Our Nationhood Defined, year: 1939}
          - {author: M. S. Golwalkar, title: Bunch of Thoughts, year: 1966}
      - label: Nehruvian secularism
        thinkers: [thinker.nehru]
        positions: [religion.public.separation, nation.belonging.citizenship, tradition.modernity.enlightenment, development.path.import-substitution]
        argument: >-
          India is an ancient palimpsest on which layer after layer of thought and culture has been written,
          and no layer is the true one. The state must belong to all its citizens equally and profess no
          religion. Communalism is a cover for the interests of landlords and the upper classes, and the
          communalism of the majority is the most dangerous, because it can pass for nationalism. The real
          enemies are poverty and ignorance, and they are beaten by science, planning and industry.
        texts:
          - {author: Jawaharlal Nehru, title: The Discovery of India, year: 1946}
      - label: Gandhi
        thinkers: [thinker.gandhi]
        positions: [nation.belonging.multicultural, violence.political.never, change.possibility.changed-hearts]
        argument: >-
          Politics without religion is a death trap, but religion here means the moral law common to every
          faith, not the rule of one community. Hindus and Muslims are brothers who share this land, and India
          cannot cease to be one nation because people of different religions live in it. Unity comes from
          each community purifying itself and trusting the other, not from a state that keeps faith out of
          public life or a majority that rules in the name of its gods.
        texts:
          - {author: M. K. Gandhi, title: Hind Swaraj, year: 1909}
    outcome: >-
      Gandhi was shot dead in January 1948 by Nathuram Godse, a Hindu nationalist who had been an RSS member;
      whether he had left the RSS by then is disputed. The RSS was banned in 1948 and 1949. The 1950
      constitution established no state religion, and the 42nd Amendment of 1976 added the word secular to its
      preamble. Hindutva activists demolished the Babri Masjid in Ayodhya in 1992. The Bharatiya Janata Party,
      which descends from the RSS movement, led governments from 1998 to 2004 and has governed since 2014.

  - id: debate.qutb-nasser
    name: Qutb and Nasser
    date: "1954–1966"
    summary: >-
      The Muslim Brotherhood first welcomed the Free Officers who took power in Egypt in 1952. They split over
      whether the new order would rest on Islamic law or on Arab nationalism and state-led development. After a
      shooting at Gamal Abdel Nasser in 1954 was blamed on the Brotherhood, thousands of its members were
      imprisoned, Sayyid Qutb among them. In prison Qutb wrote Milestones, which judged Nasser's state and all
      states that legislate for themselves to be outside Islam. He was hanged in 1966.
    problematic: nation.belonging
    sides:
      - label: Qutb
        thinkers: [thinker.qutb]
        positions: [intl.sovereignty.god-alone, liberty.concept.servitude-to-god-alone, religion.public.divine-law, nation.belonging.ummah]
        argument: >-
          Sovereignty belongs to God alone. Any society in which human beings make law for one another, whether
          capitalist, communist or nationalist, lives in jahiliyya, the ignorance that preceded revelation, even
          if its people call themselves Muslims. Islam already contains social justice: zakat, the ban on usury,
          the duty to the poor. Borrowing socialism or nationalism from Europe divides the community of believers
          by race and soil. A vanguard of believers must form, live by God's law and lead the rest back to it.
        texts:
          - {author: Sayyid Qutb, title: Social Justice in Islam, year: 1949}
          - {author: Sayyid Qutb, title: Milestones, year: 1964}
      - label: Nasser
        thinkers: [thinker.nasser]
        positions: [nationalism.kinds.national-popular-front, liberty.concept.national-liberation, party.system.national-front-party, development.path.import-substitution]
        argument: >-
          Egypt suffered under three masters at once: the British occupier, a king, and the pashas who owned the
          land and the capital. The revolution must be twofold, political to expel the occupier and social to
          end feudalism and monopoly. Islam is part of the nation's heritage and its moral spirit, but a party
          that uses religion to divide the nation serves the old landowners and the kings who fund it. Arab unity,
          land reform and planned industry are the road to independence.
        texts:
          - {author: Gamal Abdel Nasser, title: The Philosophy of the Revolution, year: 1954}
          - {author: Gamal Abdel Nasser, title: The National Charter, year: 1962}
    outcome: >-
      The Brotherhood's leaders maintain that the 1954 shooting was staged; the government held it was a
      Brotherhood plot. Egypt's defeat by Israel in 1967 weakened Arab socialism across the region. Anwar
      Sadat released Brotherhood prisoners in the 1970s and opened the economy to foreign capital. Qutb's
      Milestones influenced later Islamist currents, including armed groups. A Brotherhood candidate, Mohamed
      Morsi, won Egypt's presidential election in 2012 and was removed by the army in 2013.

  - id: debate.liberation-theology-vatican
    name: Liberation theology and the Vatican
    date: "1968–1986"
    summary: >-
      At Medellín in 1968 the Latin American bishops spoke of institutionalized violence and the church's duty
      to the poor. Gustavo Gutiérrez's A Theology of Liberation (1971) gave the movement its name. Under Pope
      John Paul II, the Congregation for the Doctrine of the Faith, headed by Cardinal Joseph Ratzinger, issued
      an instruction in 1984 warning against theologies that borrowed Marxist analysis, and a second, more
      positive one in 1986. Leonardo Boff was ordered to a year of silence in 1985.
    problematic: religion.public
    sides:
      - label: Liberation theology
        thinkers: [thinker.gutierrez]
        positions: [religion.public.prophetic-church, education.purpose.conscientization, poverty.cause.drain]
        argument: >-
          Theology is critical reflection on what Christians do, in the light of the Word. In Latin America the
          poor are not poor by fate but because of structures of dependence and domination, which the bishops
          rightly called institutionalized violence. God loves the poor first, and salvation includes liberation
          from sin made into social structures. A church that stays neutral in a divided society sides with the
          powerful. Using the tools of social science, including Marxist ones, is how faith sees the world it
          must change.
        texts:
          - {author: Gustavo Gutiérrez, title: A Theology of Liberation, year: 1971}
          - {author: Leonardo Boff, title: "Church: Charism and Power", year: 1981}
      - label: The Congregation for the Doctrine of the Faith
        thinkers: [thinker.ratzinger]
        positions: [conflict.nature.organic-harmony, solidarity.basis.one-body, human.nature.fallen]
        argument: >-
          The preferential option for the poor belongs to the Gospel, and the misery of millions is a scandal.
          But Marxist analysis cannot be borrowed in pieces: it brings class struggle as the law of history,
          atheism and the justification of violence. It reduces salvation to politics and the Kingdom of God to
          a social program, and sets a church of the people against the bishops. The deepest slavery is sin, and
          true liberation begins there. The Church's social doctrine teaches solidarity and the common good,
          not war between classes.
        texts:
          - {author: Congregation for the Doctrine of the Faith, title: "Instruction on Certain Aspects of the 'Theology of Liberation'", year: 1984}
          - {author: Congregation for the Doctrine of the Faith, title: Instruction on Christian Freedom and Liberation, year: 1986}
    outcome: >-
      Archbishop Óscar Romero of San Salvador, who had taken the side of the poor, was shot dead while saying
      Mass in 1980, and six Jesuits of the Central American University were killed by the Salvadoran army in
      1989. Through the 1980s and 1990s the Vatican appointed bishops opposed to the movement, and evangelical
      churches grew fast among the Latin American poor. Gutiérrez was never condemned, and under Pope Francis
      the Vatican's tone toward the movement warmed; Romero was canonized in 2018.
