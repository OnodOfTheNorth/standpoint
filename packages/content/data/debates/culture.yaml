# Debates over caste, race, recognition and the work of care.
debates:
  - id: debate.gandhi-ambedkar
    name: Gandhi and Ambedkar on caste
    date: "1931–1945"
    summary: >-
      At the Round Table Conference of 1931 B. R. Ambedkar asked for separate electorates for the untouchable
      castes, and M. K. Gandhi opposed them. When the British Communal Award of 1932 granted them, Gandhi
      began a fast unto death in Yerwada prison, and Ambedkar signed the Poona Pact, which replaced separate
      electorates with reserved seats inside joint electorates. In 1936 Ambedkar's undelivered speech
      Annihilation of Caste drew a public reply from Gandhi, and the two disagreed over whether caste could be
      reformed from within Hinduism or had to be destroyed.
    problematic: caste.question
    sides:
      - label: Gandhi
        thinkers: [thinker.gandhi]
        positions: [caste.question.purify-hinduism, change.possibility.changed-hearts, change.means.example-and-conversion]
        argument: >-
          Untouchability is a sin and an excrescence on Hinduism, not its essence. Varna is a law of hereditary
          calling in which the scavenger's work is as honorable as the priest's; what must go is the idea of high
          and low. The cure is penance and self-purification by caste Hindus: open the temples, the wells and the
          schools, and change their hearts. Separate electorates would cut the untouchables off from Hindu society
          for ever and make the wound permanent.
        texts:
          - {author: M. K. Gandhi, title: A Vindication of Caste, year: 1936, note: "replies in Harijan, reprinted in the 1937 edition of Annihilation of Caste"}
      - label: Ambedkar
        thinkers: [thinker.ambedkar]
        positions: [caste.question.annihilation, caste.question.reservations-and-law, equality.concept.group-substantive]
        argument: >-
          Caste is not a division of labor but a division of laborers, graded one above the other. Its authority
          rests on the shastras, so it cannot be reformed while the scriptures that sanction it remain sacred.
          A change of heart asks the oppressed to wait on the goodwill of their oppressors, which they have waited
          on for centuries. The untouchables need political power of their own, guaranteed in law, and then the
          destruction of the religious notions on which caste is founded.
        texts:
          - {author: B. R. Ambedkar, title: Annihilation of Caste, year: 1936}
          - {author: B. R. Ambedkar, title: What Congress and Gandhi Have Done to the Untouchables, year: 1945}
    outcome: >-
      The Poona Pact held, and Gandhi founded the Harijan Sevak Sangh for the uplift of the untouchable castes.
      Ambedkar chaired the drafting committee of India's constitution of 1950, which abolished untouchability
      and provided reserved seats and posts. In 1956 he converted to Buddhism at Nagpur with hundreds of
      thousands of followers, weeks before his death. Gandhi's own views on caste shifted in his last years
      toward open support for inter-caste marriage. Dalit movements still dispute his legacy.

  - id: debate.du-bois-washington
    name: Du Bois and Washington on the road to equality
    date: "1895–1909"
    summary: >-
      In his Atlanta Exposition address of 1895, Booker T. Washington, head of the Tuskegee Institute, urged
      Black Southerners to build economic strength through vocational education and work and to set aside the
      fight against segregation for the time being. W. E. B. Du Bois answered in The Souls of Black Folk in 1903
      that this traded away the vote, civil rights and higher education. The quarrel split Black leadership in
      the United States for a generation.
    problematic: racism.remedy
    sides:
      - label: Washington
        thinkers: []
        positions: [racism.remedy.self-determination, cs.hard-work.effort-pays, change.tempo.inevitability-of-gradualness]
        argument: >-
          Cast down your bucket where you are. A people forty years out of slavery, in a South where whites hold
          the land, the courts and the guns, gains nothing by agitation it cannot back. It gains by owning land,
          learning trades and making itself indispensable to the Southern economy. In all things purely social we
          can be as separate as the fingers, yet one as the hand in all things essential to mutual progress.
          Rights follow property and usefulness; no race that has anything to contribute to the markets of the
          world is long ostracized.
        texts:
          - {author: Booker T. Washington, title: Atlanta Exposition Address, year: 1895}
          - {author: Booker T. Washington, title: Up from Slavery, year: 1901}
      - label: Du Bois
        thinkers: [thinker.du-bois]
        positions: [racism.remedy.equal-treatment-law, education.purpose.critical-citizens, change.means.law-and-courts]
        argument: >-
          Washington asks Black people to give up political power, insistence on civil rights and the higher
          education of their youth. In the years of that bargain came disfranchisement, legal segregation and the
          withdrawal of aid from Black colleges. A people without the vote cannot protect the property it is told
          to acquire. The race will be saved by its exceptional men and women, the Talented Tenth, trained to lead,
          and by ceaseless agitation for the full rights of citizens.
        texts:
          - {author: W. E. B. Du Bois, title: The Souls of Black Folk, year: 1903}
          - {author: W. E. B. Du Bois, title: The Talented Tenth, year: 1903}
    outcome: >-
      Du Bois co-founded the Niagara Movement in 1905 and the NAACP in 1909, which pursued civil rights through
      the courts and the press. Historians later found that Washington had secretly funded legal challenges to
      disfranchisement. Marcus Garvey's movement took up Washington's call for Black enterprise in a
      pan-African form. Du Bois himself left the NAACP in 1934 after urging Black economic cooperation within
      segregation, and moved toward Marxism in Black Reconstruction in America (1935).

  - id: debate.fraser-honneth
    name: Fraser and Honneth on redistribution and recognition
    date: "1995–2003"
    summary: >-
      In 1995 Nancy Fraser argued that struggles for recognition of groups were displacing struggles over the
      distribution of wealth, just as inequality was rising. Axel Honneth held that every social struggle,
      distribution included, grows out of the experience of being denied recognition. Their exchange was
      published as a joint book in 2003. Iris Marion Young and Judith Butler attacked Fraser's distinction from
      one side, and class-first critics of identity politics attacked recognition politics from the other.
    problematic: equality.concept
    sides:
      - label: Fraser
        thinkers: [thinker.fraser]
        positions: [equality.concept.relational, equality.concept.group-substantive, culture.war.material-roots]
        argument: >-
          Justice has two dimensions that cannot be reduced to one another. Maldistribution denies people the
          resources to take part as peers; misrecognition denies them the standing. A low-paid immigrant woman
          suffers both, and a remedy for one can worsen the other. The test is parity of participation. Remedies
          that only affirm group identities leave the structures that produce injustice intact; transformative
          remedies, socialist economics joined to the breaking down of fixed identities, change them.
        texts:
          - {author: Nancy Fraser, title: "From Redistribution to Recognition? Dilemmas of Justice in a 'Post-Socialist' Age", year: 1995}
          - {author: Nancy Fraser and Axel Honneth, title: "Redistribution or Recognition? A Political-Philosophical Exchange", year: 2003}
      - label: Honneth
        thinkers: []
        positions: [equality.concept.relational, human.nature.plastic-social]
        argument: >-
          People form a sense of themselves only through others: love gives self-confidence, equal rights give
          self-respect, and social esteem for one's contribution gives self-worth. Social struggles start from the
          moral experience of being disrespected in one of these spheres. Fights over wages and welfare are
          themselves fights over how a group's work is valued. A single theory of recognition, grounded in what
          people actually suffer, explains both kinds of struggle better than two separate standards.
        texts:
          - {author: Axel Honneth, title: "The Struggle for Recognition: The Moral Grammar of Social Conflicts", year: 1992}
      - label: Young and Butler
        thinkers: []
        positions: [feminism.subordination.interlocking, sexuality.politics.capitalism-and-liberation]
        argument: >-
          Splitting economy from culture is the mistake. The regulation of sexuality and the gendered family are
          part of how capitalism reproduces its workforce, so the persecution of queer people is not merely
          cultural. Racial and gender hierarchies are built into the division of labor itself. A two-box scheme
          ends up ranking struggles, and the struggles placed in the cultural box are told to wait.
        texts:
          - {author: Iris Marion Young, title: "Unruly Categories: A Critique of Nancy Fraser's Dual Systems Theory", year: 1997}
          - {author: Judith Butler, title: Merely Cultural, year: 1997}
      - label: Class first
        thinkers: []
        positions: [race.nature.class-first, culture.war.manufactured-diversion, racism.remedy.universal-programs]
        argument: >-
          Recognition politics treats inequality as a failure to respect difference. But being poor is not an
          identity to be respected; it is a condition to be abolished. A university or a firm can become perfectly
          diverse while the gap between rich and poor widens, and the rich lose nothing by it. A left that fights
          over representation instead of ownership and wages has accepted the market's distribution and argued
          only about who gets to the top of it.
        texts:
          - {author: Walter Benn Michaels, title: "The Trouble with Diversity: How We Learned to Love Identity and Ignore Inequality", year: 2006}
    outcome: >-
      Fraser later argued that progressive neoliberalism had joined recognition politics to financial
      deregulation, and that its collapse opened the way to right-wing populism. The quarrel between class and
      identity on the left continued in the debates over intersectionality, universal programs and reparations.

  - id: debate.wages-for-housework
    name: Wages for housework
    date: "1972–1983"
    summary: >-
      In 1972 Mariarosa Dalla Costa and Selma James argued that housework produces the labor power capitalism
      depends on, and the International Wages for Housework Campaign began demanding that the state pay for it.
      Socialist feminists answered that a wage would tie women to the home, and called for housework and
      childcare to be made public services. Liberal feminists and Catholic social teaching offered rival
      answers of their own.
    problematic: care.work
    sides:
      - label: Wages for housework
        thinkers: [thinker.dalla-costa]
        positions: [care.work.wages-for-housework, feminism.subordination.social-reproduction, labor.division.paid-and-unpaid]
        argument: >-
          They say it is love. We say it is unwaged work. Every day the housewife produces and repairs the worker
          the factory uses, for nothing, and her lack of a wage is what makes her work invisible and her
          dependence on a man look natural. Demanding a wage for it is not a plan to stay in the kitchen; it is a
          lever to refuse the work, to expose it as work for capital, and to break the hierarchy that runs from the
          waged to the unwaged.
        texts:
          - {author: Mariarosa Dalla Costa and Selma James, title: The Power of Women and the Subversion of the Community, year: 1972}
          - {author: Silvia Federici, title: Wages Against Housework, year: 1975}
      - label: Socialize housework
        thinkers: [thinker.davis]
        positions: [care.work.socialize, family.form.socialize-care, feminism.subordination.interlocking]
        argument: >-
          Paying wives for housework would institutionalize their domestic slavery. Black women have done other
          people's housework for wages for generations, and the wage freed none of them. Housework is isolated,
          repetitive and unproductive because it is done privately in millions of homes. The answer is to
          industrialize and socialize it: public childcare, collective kitchens and cleaning done by well-paid
          workers, so that women enter social production as equals.
        texts:
          - {author: Angela Y. Davis, title: "The Approaching Obsolescence of Housework: A Working-Class Perspective", year: 1981, note: "chapter of Women, Race and Class"}
          - {author: Margaret Benston, title: The Political Economy of Women's Liberation, year: 1969}
      - label: Out of the home
        thinkers: []
        positions: [care.work.market-service, feminism.subordination.barriers-and-bias]
        argument: >-
          The housewife's trouble is the problem that has no name: a life confined to home and family, with no
          work of her own. The way out is education, a career and equal pay, with the old prejudices about
          women's place removed from law and custom. Domestic work can be shared, mechanized or bought as a
          service. Paying women to stay home would only gild the cage.
        texts:
          - {author: Betty Friedan, title: The Feminine Mystique, year: 1963}
      - label: The family wage
        thinkers: []
        positions: [care.work.family-vocation, wage.nature.just-wage]
        argument: >-
          The work of a mother in the home is real work and deserves recognition from society. It should not be
          made a commodity, nor should mothers be forced into paid jobs by need. A just wage for the head of the
          family, or family allowances and grants to mothers who devote themselves to their families, would let
          families care for their own without being driven apart by the labor market.
        texts:
          - {author: John Paul II, title: Laborem Exercens, year: 1981}
    outcome: >-
      No state adopted wages for housework. The campaign continued through the Global Women's Strike, and
      Venezuela's constitution of 1999 recognized housework as economic activity entitling homemakers to social
      security. Most rich countries moved toward women's paid employment with market and public childcare.
      Social reproduction theory, from Lise Vogel's Marxism and the Oppression of Women (1983) onward, took up
      the question of how unpaid care sustains capital.
