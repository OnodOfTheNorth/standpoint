# Debates inside the socialist movement, 1868–1935: state, party, reform, war and the first workers' state.
debates:
  - id: debate.marx-bakunin
    name: Marx and Bakunin in the First International
    date: "1868–1872"
    summary: >-
      The International Workingmen's Association split over what workers should do about the state.
      Marx and the General Council argued for workers' parties that would take political power and use
      it during a transition. Bakunin and the federalist sections argued that any state, including one
      run in workers' names, would rule over them, and that the state had to be abolished at once.
    problematic: state.relation
    sides:
      - label: Marx, Engels and the General Council
        thinkers: [thinker.marx, thinker.engels]
        positions: [state.relation.strengthen-then-wither, org.form.mass-party, change.agent.workers-as-class, state.nature.class-instrument]
        argument: >-
          The bourgeoisie rules through the state, so the working class must organize as a political party
          and win state power, as the Paris Commune began to do. Only a class that holds power can expropriate
          the owners and defend the expropriation. Once classes are gone, the state loses its reason to exist
          and dies out. Declaring it abolished on the first day leaves the old owners armed and the workers disarmed.
        texts:
          - {author: Karl Marx, title: The Civil War in France, year: 1871}
          - {author: Karl Marx and Friedrich Engels, title: Fictitious Splits in the International, year: 1872}
          - {author: Friedrich Engels, title: On Authority, year: 1874, note: written 1872}
      - label: Bakunin and the anti-authoritarian federalists
        thinkers: [thinker.bakunin]
        positions: [state.relation.abolish-at-once, state.nature.hierarchy-as-such, elections.role.boycott-principle, org.form.union-syndicalist]
        argument: >-
          A state run by workers' delegates is still a state: a minority governing a majority from above. The
          delegates stop being workers the day they take office and become a new ruling stratum, a red
          bureaucracy. Liberation must be organized from below, through free federations of workers' and
          peasants' associations, and the state must be destroyed in the revolution itself, not handed a
          new owner.
        texts:
          - {author: Mikhail Bakunin, title: Statism and Anarchy, year: 1873}
          - {author: Mikhail Bakunin, title: God and the State, year: 1882}
    outcome: >-
      The Hague Congress of September 1872 expelled Bakunin and James Guillaume and moved the General
      Council to New York, where the International dissolved in 1876. The federalist sections met at
      Saint-Imier days after the Hague Congress and founded their own International, the starting point
      of the organized anarchist movement. Marxist parties went on to form the Second International in 1889.

  - id: debate.bernstein-luxemburg
    name: The revisionism controversy
    date: "1896–1899"
    summary: >-
      Eduard Bernstein, a leading theorist of German Social Democracy, argued that capitalism was not
      heading for collapse and that socialism would come through steady reforms, unions and elections.
      Rosa Luxemburg replied that reforms could not change the ownership of production and that only the
      conquest of political power could. Karl Kautsky defended party orthodoxy against Bernstein while
      keeping the party's practice gradual.
    problematic: reform.revolution
    sides:
      - label: Bernstein's revision
        thinkers: [thinker.bernstein]
        positions: [reform.revolution.reform-is-the-road, elections.role.main-road, change.tempo.inevitability-of-gradualness]
        argument: >-
          The facts have moved: small property is not disappearing, crises are softening as credit and cartels
          spread, and workers are winning wages, laws and the vote. The party already acts as a party of reform;
          it should say so. Socialism is the extension of democratic rights into economic life, won step by step.
          The final goal is nothing to me; the movement is everything.
        texts:
          - {author: Eduard Bernstein, title: The Preconditions of Socialism, year: 1899, note: published in English as Evolutionary Socialism}
      - label: Luxemburg and the revolutionary left
        thinkers: [thinker.luxemburg]
        positions: [reform.revolution.revolution-necessary, state.nature.class-instrument, unions.role.class-organ]
        argument: >-
          Reforms and revolution are not two speeds of one road; they differ in kind. Unions can only bargain
          over the price of labor power inside the wage system, and parliament can only legislate inside the
          property order. Crises are built into capitalism and will return. Drop the final goal and the party
          becomes a party of social reform of capitalism, not of its abolition.
        texts:
          - {author: Rosa Luxemburg, title: Social Reform or Revolution?, year: 1899}
      - label: Kautsky's orthodox center
        thinkers: [thinker.kautsky]
        positions: [change.tempo.wait-for-conditions, org.form.mass-party]
        argument: >-
          The concentration of capital and the growth of the working class are real, and they make socialism
          necessary. The party's task is to organize the class and win a parliamentary majority, preparing for
          a seizure of power that history will bring. It is a revolutionary party, but not one that makes
          revolutions on command.
        texts:
          - {author: Karl Kautsky, title: Bernstein and the Social Democratic Programme, year: 1899}
          - {author: Karl Kautsky, title: The Road to Power, year: 1909}
    outcome: >-
      SPD congresses at Hanover in 1899 and Dresden in 1903 condemned revisionism by large majorities, and
      Bernstein stayed in the party. The unions and the parliamentary group continued to work along gradual
      lines, and in 1914 the party voted for war credits. After 1918 the SPD governed the Weimar Republic as
      a reform party, and Bernstein's views became its practice and, in 1959, its program.

  - id: debate.lenin-luxemburg-organization
    name: Lenin and Luxemburg on the party
    date: "1902–1906"
    summary: >-
      After the 1903 split in the Russian Social Democratic Labour Party, Lenin defended a party of
      professional revolutionaries under central direction. Luxemburg answered that this centralism would
      put a committee in place of the class, and that workers learn by acting in mass struggles that no
      center can plan. The 1905 revolution, with its mass strikes and councils, became evidence for both.
    problematic: org.form
    sides:
      - label: Lenin and the Bolsheviks
        thinkers: [thinker.lenin]
        positions: [org.form.vanguard-party, democracy.form.democratic-centralism]
        argument: >-
          Left to themselves, workers reach trade-union consciousness: they fight their own employer for better
          terms. Socialist consciousness has to be brought in, and that takes an organization of trained
          revolutionaries able to survive the political police. Discipline in action and open debate before
          the decision make a party that can lead when the crisis comes.
        texts:
          - {author: V. I. Lenin, title: What Is to Be Done?, year: 1902}
          - {author: V. I. Lenin, title: "One Step Forward, Two Steps Back", year: 1904}
      - label: Luxemburg and the critics of centralism
        thinkers: [thinker.luxemburg, thinker.trotsky]
        positions: [org.form.mass-party, change.agent.workers-as-class, change.means.strike-and-direct-action]
        argument: >-
          Social democratic tactics are not invented by a central committee; they arise from the struggle of
          the class itself. Ultra-centralism turns the party into an obedient apparatus and the workers into
          its followers. Errors made by a real workers' movement are more fruitful than the wisdom of the best
          central committee. The mass strike shows the class moving faster than any leadership.
        texts:
          - {author: Rosa Luxemburg, title: Organizational Questions of the Russian Social Democracy, year: 1904}
          - {author: Leon Trotsky, title: Our Political Tasks, year: 1904}
          - {author: Rosa Luxemburg, title: "The Mass Strike, the Political Party and the Trade Unions", year: 1906}
    outcome: >-
      The Bolshevik and Menshevik factions became separate parties by 1912. Trotsky joined the Bolsheviks in
      1917. After October the Communist International made the Bolshevik model binding on its member parties
      through the twenty-one conditions of 1920. Luxemburg's position became the reference point for later
      council communists, Luxemburgists and critics of the Leninist party.

  - id: debate.lenin-luxemburg-national-question
    name: Lenin and Luxemburg on self-determination
    date: "1908–1916"
    summary: >-
      Socialists in the Russian and Austro-Hungarian empires disagreed over whether to back the right of
      subject nations to form their own states. Luxemburg held that national independence was a bourgeois
      aim that would divide workers. Lenin held that workers of an oppressing nation had to defend the
      oppressed nation's right to secede, or they would be complicit in its oppression. The Austrian
      Marxists proposed cultural autonomy without separate states.
    problematic: nation.question
    sides:
      - label: Lenin and the Bolsheviks
        thinkers: [thinker.lenin, thinker.stalin]
        positions: [nation.question.self-determination-leninist, nationalism.kinds.oppressed-oppressor, nation.question.stalin-definition]
        argument: >-
          Nations are divided into oppressors and oppressed, and that division runs through the workers too.
          A Great Russian worker who denies Poles or Finns the right to their own state is defending the
          tsar's empire. Recognizing the right to secede does not mean urging every nation to secede; it
          removes the grievance that lets the bourgeoisie of the oppressed nation lead its workers, and it
          makes voluntary union possible.
        texts:
          - {author: J. V. Stalin, title: Marxism and the National Question, year: 1913}
          - {author: V. I. Lenin, title: The Right of Nations to Self-Determination, year: 1914}
          - {author: V. I. Lenin, title: The Discussion on Self-Determination Summed Up, year: 1916}
      - label: Luxemburg and the Polish Social Democrats
        thinkers: [thinker.luxemburg]
        positions: [nation.question.no-abstract-right, nationalism.kinds.all-bourgeois]
        argument: >-
          The "nation" as a unit with one will is a fiction: it contains classes with opposed interests. A right
          of nations in general is an abstraction that, in practice, hands the national movement to its
          bourgeoisie and gentry. Poland's economy is bound to Russia's, and Polish workers' future lies in a
          common revolution with Russian workers, not in a new frontier.
        texts:
          - {author: Rosa Luxemburg, title: The National Question and Autonomy, year: 1909}
          - {author: Rosa Luxemburg, title: The Russian Revolution, year: 1922, note: written 1918}
      - label: Austro-Marxist cultural autonomy
        thinkers: []
        positions: [nation.question.cultural-autonomy]
        argument: >-
          Otto Bauer and Karl Renner argued that in a multinational empire where nations live intermixed,
          territorial states would trap minorities. Nations should be organized as self-governing cultural
          associations of persons, wherever they live, inside one democratic federal state. That keeps the
          workers' movement and the economy united while giving each people its schools and language.
        texts:
          - {author: Otto Bauer, title: The Question of Nationalities and Social Democracy, year: 1907}
    outcome: >-
      In power the Bolsheviks recognized Finnish independence in December 1917 and formed the USSR in 1922
      as a federation of union republics with a formal right of secession. Luxemburg criticized this policy
      in 1918 as feeding nationalism. The national question then shaped Comintern policy toward the
      colonies from 1920 onward. The Austro-Hungarian empire broke up into national states in 1918.

  - id: debate.war-credits-1914
    name: 1914 and the war credits
    date: "1914–1916"
    summary: >-
      On 4 August 1914 the SPD group in the Reichstag voted for the German government's war credits, and
      most socialist parties in the belligerent countries backed their own governments. A minority held
      that the war was a contest between imperial powers and that workers should oppose it. The vote broke
      the Second International.
    problematic: internationalism
    sides:
      - label: National defense (SPD majority, French socialists)
        thinkers: []
        positions: [internationalism.nation-first, reform.revolution.reform-is-the-road]
        argument: >-
          The party's leaders, Friedrich Ebert and Philipp Scheidemann among them, argued that Germany faced
          invasion by tsarist Russia, the most reactionary power in Europe, and that a party of millions could
          not abandon the country in its hour of danger. Voting against would bring repression and isolate the
          party from its own members at the front. Defending the nation would also win workers recognition and
          rights after the war.
        texts:
          - {author: SPD Reichstag group, title: Declaration on the War Credits, year: 1914, note: read by Hugo Haase on 4 August 1914}
      - label: Kautsky and the center
        thinkers: [thinker.kautsky]
        positions: [imperialism.nature.foreign-policy-choice, change.tempo.wait-for-conditions]
        argument: >-
          The International is an instrument of peace, not of war. Imperialism is a policy that capital might
          abandon for a cartel of the great powers, an ultra-imperialism, if the costs of rivalry rise. The
          task is to press for a negotiated peace and keep the party united, not split it during a war.
        texts:
          - {author: Karl Kautsky, title: Ultra-imperialism, year: 1914}
      - label: Zimmerwald left
        thinkers: [thinker.lenin, thinker.luxemburg]
        positions: [imperialism.nature.inter-imperialist-rivalry, contradiction.primary.inter-imperialist-war, internationalism.no-national-roads]
        argument: >-
          This is a war among imperial powers over colonies, markets and spheres of investment; no side is
          defending anything workers need. The leaders who voted credits have gone over to their own
          bourgeoisies. Socialists must vote against, work for the defeat of their own government, and turn
          the imperialist war into a war of the classes. A new International is needed.
        texts:
          - {author: V. I. Lenin and G. Zinoviev, title: Socialism and War, year: 1915}
          - {author: Rosa Luxemburg, title: The Junius Pamphlet, year: 1916}
    outcome: >-
      Karl Liebknecht cast the first vote against war credits in December 1914. Anti-war socialists met at
      Zimmerwald in 1915. The SPD split in 1917 with the founding of the USPD, and the Russian Bolsheviks
      took power on an anti-war program that year. The Communist International was founded in 1919 on the
      break of 1914.

  - id: debate.lenin-kautsky
    name: Lenin and Kautsky on the dictatorship of the proletariat
    date: "1918–1920"
    summary: >-
      After the Bolsheviks dissolved the Constituent Assembly in January 1918, Kautsky argued that
      socialism required a parliament elected by universal suffrage and that the Bolshevik government was
      a minority dictatorship. Lenin and Trotsky replied that parliamentary rule is the rule of capital and
      that the soviets were a higher form of rule by the majority. Luxemburg defended the revolution against
      Kautsky while warning against the suppression of political liberty.
    problematic: democracy.form
    sides:
      - label: Kautsky
        thinkers: [thinker.kautsky]
        positions: [democracy.form.representative, elections.role.main-road, party.system.competitive-multiparty]
        argument: >-
          Socialism means the rule of the majority, and that can only be established and checked through
          universal suffrage, free press and competing parties. A party that seizes power in a backward
          country without a majority must govern by force, and force against the majority turns into rule
          by a bureaucracy and terror. The dictatorship of the proletariat, if it means anything, means a
          workers' majority in a parliament.
        texts:
          - {author: Karl Kautsky, title: The Dictatorship of the Proletariat, year: 1918}
          - {author: Karl Kautsky, title: Terrorism and Communism, year: 1919}
      - label: Lenin and Trotsky
        thinkers: [thinker.lenin, thinker.trotsky]
        positions: [democracy.form.council, state.relation.smash-and-replace, siege.governance.revolutionary-dictatorship]
        argument: >-
          There is no pure democracy above classes. A parliament elected under capitalism leaves the army,
          courts, press and property in the hands of the owners. The soviets give workers and poor peasants
          direct power, and the expropriated class will use every means, including foreign invasion, to
          return. Against that, the revolution must defend itself by force; to demand otherwise is to disarm it.
        texts:
          - {author: V. I. Lenin, title: The State and Revolution, year: 1917}
          - {author: V. I. Lenin, title: The Proletarian Revolution and the Renegade Kautsky, year: 1918}
          - {author: Leon Trotsky, title: Terrorism and Communism, year: 1920}
      - label: Luxemburg's critical solidarity
        thinkers: [thinker.luxemburg]
        positions: [democracy.form.council, siege.governance.class-democracy]
        argument: >-
          The Bolsheviks were right to take power, and Kautsky's parliamentarism is a cover for doing nothing.
          But the dictatorship of the class must be the work of the class, not of a party clique. Without
          general elections, free press and assembly, life in the soviets dies and the bureaucracy alone stays
          active. Freedom only for supporters of the government is no freedom at all.
        texts:
          - {author: Rosa Luxemburg, title: The Russian Revolution, year: 1922, note: written 1918}
    outcome: >-
      The Soviet government consolidated one-party rule during the civil war of 1918–1921 and banned
      factions inside the party in 1921. Kautsky became a leading voice of social democratic opposition to
      Bolshevism, and the Communist International, founded in 1919, broke with the parties he represented.
      Luxemburg was killed in Berlin in January 1919 by Freikorps troops under a Social Democratic government.

  - id: debate.left-communism-1920
    name: Lenin and the left communists
    date: "1920–1921"
    summary: >-
      In the new Communist International, Dutch, German and Italian communists argued that parliaments and
      established trade unions had become instruments of capitalist rule and should be boycotted. Lenin
      replied that communists must work inside them while workers still trusted them. The dispute was over
      tactics in a revolutionary period that did not, in the end, produce revolutions in the West.
    problematic: elections.role
    sides:
      - label: Lenin and the Comintern majority
        thinkers: [thinker.lenin]
        positions: [elections.role.tribune, alliances.policy.united-front, unions.role.class-organ]
        argument: >-
          As long as millions of workers follow parliamentarians and union officials, communists who refuse to
          go where the workers are leave them to reformist leaders. Parliament is a tribune for exposing the
          system; the unions are where the class is organized. Refusing every compromise as a matter of
          principle is a childish disorder, not revolutionary firmness.
        texts:
          - {author: V. I. Lenin, title: "'Left-Wing' Communism: An Infantile Disorder", year: 1920}
      - label: Dutch-German council communists
        thinkers: [thinker.pannekoek]
        positions: [elections.role.boycott-principle, org.form.workers-councils]
        argument: >-
          The West is not Russia. Here the bourgeoisie rules less by force than by the ideas workers absorb,
          and parliaments and union bureaucracies are the institutions that keep those ideas in place. Workers
          must learn to act for themselves through factory organizations and councils. Sending deputies to
          parliament teaches them to wait for leaders.
        texts:
          - {author: Herman Gorter, title: Open Letter to Comrade Lenin, year: 1920}
          - {author: Anton Pannekoek, title: World Revolution and Communist Tactics, year: 1920}
      - label: Bordiga's abstentionists
        thinkers: [thinker.bordiga]
        positions: [elections.role.boycott-principle, org.form.vanguard-party]
        argument: >-
          Elections absorb a communist party into the routine of bourgeois politics and blur the line between
          revolution and reform. The party must be a disciplined, programmatically pure organization of the
          class's vanguard, and its break with parliament must be visible to every worker.
        texts:
          - {author: Amadeo Bordiga, title: Theses of the Abstentionist Communist Fraction of the Italian Socialist Party, year: 1920}
    outcome: >-
      The Second Congress of the Comintern in 1920 required parliamentary participation and work in the
      unions. The German KAPD left the Comintern's orbit in 1921, and council communism survived as a small
      current. Bordiga accepted the decision, led the Communist Party of Italy from 1921, and was removed from
      its leadership in the mid-1920s.

  - id: debate.soviet-industrialization
    name: The Soviet industrialization debate
    date: "1924–1929"
    summary: >-
      Under the New Economic Policy the Soviet state owned large industry while millions of peasant farms
      sold grain on the market. The Bolsheviks argued over how a poor, encircled country could build industry.
      The Left Opposition wanted fast industrialization funded by a squeeze on the peasantry; Bukharin wanted
      slow growth through peasant prosperity and cooperatives; Stalin first backed Bukharin and then, from
      1928, imposed forced collectivization and crash industrialization.
    problematic: development.path
    sides:
      - label: The Left Opposition (Trotsky, Preobrazhensky)
        thinkers: [thinker.trotsky]
        positions: [development.path.planned-industrialization, internationalism.permanent-revolution, allocation.mechanism.central-planning]
        argument: >-
          A workers' state in a peasant country must accumulate fast or be swallowed by the market around it.
          Like early capitalism, socialism needs a primitive accumulation: resources must be transferred from
          the private peasant sector to state industry through prices and taxes. Delay strengthens the
          wealthy peasants and traders and leaves the country unarmed. Lasting success depends on revolution
          spreading abroad.
        texts:
          - {author: Yevgeni Preobrazhensky, title: The New Economics, year: 1926}
          - {author: Leon Trotsky, title: Towards Socialism or Capitalism?, year: 1925}
      - label: Bukharin and the Right
        thinkers: [thinker.bukharin]
        positions: [hist.ussr-early.nep-road, allocation.mechanism.mixed-steered, agrarian.question.family-farm]
        argument: >-
          The revolution rests on the alliance of workers and peasants. Squeezing the peasantry will break that
          alliance and force the state into war against most of the population. Let peasants prosper, draw them
          into cooperatives through the market, and grow industry at the pace the countryside can sustain. We
          will ride into socialism on a peasant nag, slowly, but we will arrive.
        texts:
          - {author: Nikolai Bukharin, title: The Path to Socialism and the Worker-Peasant Alliance, year: 1925}
          - {author: Nikolai Bukharin, title: Notes of an Economist, year: 1928}
      - label: Stalin's turn
        thinkers: [thinker.stalin]
        positions: [development.path.planned-industrialization, agrarian.question.collective-farms, internationalism.socialism-in-one-country, siege.governance.national-security-state]
        argument: >-
          The grain crisis of 1927–28 showed that the market lets wealthy peasants hold the state to ransom.
          The country is fifty or a hundred years behind the advanced powers and must close the gap in ten
          years or be crushed. Collective farms will secure grain and free labor for industry, and the
          central plan will build heavy industry and defense at a pace no market could deliver.
        texts:
          - {author: J. V. Stalin, title: The Right Deviation in the C.P.S.U.(B.), year: 1929}
          - {author: J. V. Stalin, title: A Year of Great Change, year: 1929}
          - {author: J. V. Stalin, title: The Tasks of Business Executives, year: 1931}
    outcome: >-
      The Left Opposition was expelled in 1927 and Trotsky deported in 1929; Bukharin was defeated the same
      year. The first Five-Year Plan (1928–1932) and forced collectivization built heavy industry at great
      speed, and the famine of 1932–1933 killed millions, most heavily in Ukraine and Kazakhstan.
      Preobrazhensky was shot in 1937, Bukharin in 1938, and Trotsky was killed in Mexico in 1940.

  - id: debate.socialism-in-one-country
    name: Socialism in one country and permanent revolution
    date: "1924–1930"
    summary: >-
      After revolutions in Germany and Hungary failed, the Soviet leadership argued over whether socialism
      could be completed inside the USSR alone. Stalin, backed by Bukharin, said it could. Trotsky said that
      the revolution would either spread or degenerate, because a single backward country could not
      escape the pressure of the world economy.
    problematic: internationalism
    sides:
      - label: Stalin and the party majority
        thinkers: [thinker.stalin, thinker.bukharin]
        positions: [internationalism.socialism-in-one-country]
        argument: >-
          The USSR has the land, the resources and the workers' state needed to build socialism with its own
          forces. Waiting on revolutions abroad would leave the country passive and demoralized. Building
          socialism here is itself the greatest help to the world revolution, and only foreign military
          intervention could make the final victory impossible.
        texts:
          - {author: J. V. Stalin, title: The October Revolution and the Tactics of the Russian Communists, year: 1924}
          - {author: J. V. Stalin, title: Concerning Questions of Leninism, year: 1926}
      - label: Trotsky and the Left Opposition
        thinkers: [thinker.trotsky]
        positions: [internationalism.permanent-revolution]
        argument: >-
          The productive forces of capitalism already outgrow national borders; socialism, which must surpass
          capitalism, cannot be built inside them. In a backward country the working class can take power
          first, but it can hold and complete the revolution only as part of a world revolution. A national
          socialism will adapt to its isolation through a bureaucracy that trades away revolutions abroad.
        texts:
          - {author: Leon Trotsky, title: Results and Prospects, year: 1906}
          - {author: Leon Trotsky, title: The Third International After Lenin, year: 1928}
          - {author: Leon Trotsky, title: The Permanent Revolution, year: 1930}
    outcome: >-
      The Fourteenth Party Conference adopted the thesis of socialism in one country in 1925, and it became
      the official doctrine of the USSR and the Comintern. Trotsky's supporters founded the Fourth
      International in 1938. The dispute shaped every later argument over the Chinese, Cuban and
      Vietnamese revolutions and over the Soviet Union's relation to movements abroad.

  - id: debate.fascism-united-front
    name: How to fight fascism, 1928–1935
    date: "1928–1935"
    summary: >-
      While the Nazi party grew in Germany, the Communist International treated social democracy as the main
      obstacle and called it "social fascism". Trotsky called for a united front of the communist and social
      democratic workers' parties. After Hitler took power, the Comintern turned in 1935 to a popular front
      that included liberal and middle-class parties.
    problematic: fascism.response
    sides:
      - label: The Third Period line
        thinkers: [thinker.stalin]
        positions: [alliances.policy.class-against-class, fascism.nature.finance-capital-dictatorship]
        argument: >-
          Capitalism has entered its final crisis, and every bourgeois party is moving toward fascism.
          Social democracy holds workers back from revolution and shares in the repression of communists, as
          the Berlin police showed in May 1929. Communists must win the workers away from their social
          democratic leaders, a united front from below only, never alliances with those leaders.
        texts:
          - {author: J. V. Stalin, title: Concerning the International Situation, year: 1924}
      - label: Trotsky's workers' united front
        thinkers: [thinker.trotsky]
        positions: [alliances.policy.united-front, fascism.response.workers-united-front, fascism.nature.petty-bourgeois-mass-movement]
        argument: >-
          Fascism is a mass movement of a ruined middle class that big capital hires to smash every workers'
          organization, communist and social democratic alike. The two workers' parties must strike together
          against it while keeping their separate programs: march separately, strike together. Calling the
          social democrats fascists hands Hitler a divided working class.
        texts:
          - {author: Leon Trotsky, title: For a Workers' United Front Against Fascism, year: 1931}
          - {author: Leon Trotsky, title: "What Next? Vital Questions for the German Proletariat", year: 1932}
      - label: Dimitrov's popular front
        thinkers: []
        positions: [alliances.policy.popular-front, fascism.response.popular-front, fascism.nature.finance-capital-dictatorship]
        argument: >-
          Georgi Dimitrov told the Seventh Comintern Congress that fascism is the open terrorist dictatorship of
          the most reactionary, chauvinist and imperialist elements of finance capital. Against it, workers
          must unite with peasants, the urban middle classes and every party ready to defend constitutional
          rule, and communists should support governments that block fascism's road to power.
        texts:
          - {author: Georgi Dimitrov, title: The Fascist Offensive and the Tasks of the Communist International in the Struggle of the Working Class against Fascism, year: 1935}
    outcome: >-
      The KPD and SPD never formed a united front, and the Nazi government destroyed both parties and the
      unions in 1933. The Comintern adopted the popular front in 1935; popular front governments took office
      in Spain and France in 1936. Trotskyists criticized them as class collaboration, and the Spanish
      republic was defeated in 1939.
