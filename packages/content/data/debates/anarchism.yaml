# Debates inside anarchism over organization.
debates:
  - id: debate.platform-synthesis
    name: The Platform and the Synthesis
    date: "1926–1929"
    summary: >-
      In 1926 the Dielo Truda group of Russian and Ukrainian anarchist exiles in Paris, among them Nestor
      Makhno and Peter Arshinov, published an Organizational Platform calling for a General Union of
      Anarchists with a shared program and collective responsibility. Voline and other exiles replied that this
      would turn anarchism into a party, and Sébastien Faure proposed instead a synthesis of anarchist
      communists, syndicalists and individualists in one federation. Errico Malatesta wrote a critique of his
      own, and corresponded with Makhno over it.
    problematic: org.form
    sides:
      - label: The Platform
        thinkers: [thinker.makhno]
        positions: [org.form.specific-anarchist-organization, siege.governance.armed-federation]
        argument: >-
          Anarchism lost the Russian Revolution not because its ideas were wrong but because it was scattered
          into small groups with no common line, while the Bolsheviks were organized. Anarchists need a union
          with theoretical unity, tactical unity, collective responsibility and federalism: each member answers
          for the union's line and the union for each member. Such a union does not rule the masses; it wins
          their trust inside the unions, councils and armed defense of the revolution.
        texts:
          - {author: Dielo Truda group, title: Organizational Platform of the General Union of Anarchists (Draft), year: 1926}
      - label: The Synthesis
        thinkers: []
        positions: [org.form.broad-party, liberty.concept.social-anarchist]
        argument: >-
          The Platform smuggles in a central committee, a party line and discipline, everything anarchism exists
          to oppose. Anarchist communism, syndicalism and individualism are not rival sects but parts of one
          truth, each answering a different need. They should federate freely, respecting each other's
          differences, and agree on what unites them: the rejection of the state and of exploitation.
        texts:
          - {author: Voline and others, title: Reply to the Platform, year: 1927}
          - {author: Sébastien Faure, title: La Synthèse anarchiste, year: 1928}
      - label: Malatesta
        thinkers: [thinker.malatesta]
        positions: [org.form.specific-anarchist-organization, authority.legitimacy.justify-or-dismantle]
        argument: >-
          Anarchists must organize, and those who reject organization in principle condemn themselves to
          impotence. But collective responsibility, if it means the majority binds the minority, is the
          principle of government. An anarchist organization must leave its members and groups free to act
          as they think best within a shared aim, settling disputes by agreement, not by votes that bind.
        texts:
          - {author: Errico Malatesta, title: A Project of Anarchist Organisation, year: 1927}
    outcome: >-
      Neither model united the movement at the time. Synthesist federations became common in France and
      elsewhere after the Second World War. The Platform was revived by the especifista current in South
      America, starting with the Uruguayan Anarchist Federation founded in 1956, and by platformist groups
      in Europe, Ireland and South Africa from the 1980s onward.

  - id: debate.bookchin-lifestyle
    name: Social anarchism or lifestyle anarchism
    date: "1995–1997"
    summary: >-
      In 1995 Murray Bookchin published Social Anarchism or Lifestyle Anarchism, attacking currents he saw as
      replacing the organized, revolutionary anarchism of the workers' movement with personal rebellion,
      mysticism and hostility to technology and reason. His targets included Hakim Bey's temporary autonomous
      zones and John Zerzan's primitivism. Bob Black replied with Anarchy after Leftism in 1997.
    problematic: org.form
    sides:
      - label: Social anarchism
        thinkers: [thinker.bookchin]
        positions: [federalism.scale.confederal-communes, democracy.form.direct, liberty.concept.social-anarchist]
        argument: >-
          Anarchism is a social movement for a free society, not a style of personal revolt. Lifestyle anarchism
          turns rebellion into self-expression, ecstatic experiences and boutique withdrawal, which capitalism is
          happy to sell back. It despises reason, organization and history, and dreams of a primitive past that
          never existed. Freedom requires institutions: popular assemblies, confederated municipalities and an
          organized movement with a program, built to take power from the state and capital in public.
        texts:
          - {author: Murray Bookchin, title: "Social Anarchism or Lifestyle Anarchism: An Unbridgeable Chasm", year: 1995}
      - label: Post-left anarchy
        thinkers: []
        positions: [org.form.affinity-groups, state.relation.exit-and-build, work.future.abolish-wage-labor]
        argument: >-
          Bookchin's social anarchism is the left with a black flag: programs, assemblies, municipal elections
          and the same worship of work and organization that turned every left into a new authority. Freedom is
          lived now or not at all. Create zones of autonomy, temporary if need be, in which people play, refuse
          work and escape control, and abandon the dream of a final revolution administered by assemblies.
        texts:
          - {author: Bob Black, title: The Abolition of Work, year: 1985}
          - {author: Hakim Bey, title: "T.A.Z.: The Temporary Autonomous Zone", year: 1991}
          - {author: Bob Black, title: Anarchy after Leftism, year: 1997}
      - label: Primitivism
        thinkers: []
        positions: [technology.nature.autonomous-force, automation.ownership.refuse-it]
        argument: >-
          Domination did not begin with capitalism or the state but with agriculture, division of labor and
          symbolic culture, which turned free foragers into workers and subjects. Technology is not neutral:
          every system of mass production requires hierarchy to run it. Self-managed factories would still be
          factories. Liberation means unmaking civilization itself.
        texts:
          - {author: John Zerzan, title: Future Primitive and Other Essays, year: 1994}
    outcome: >-
      Bookchin broke publicly with anarchism in his last years and called his politics communalism. His
      libertarian municipalism was taken up by Abdullah Öcalan and shaped the Kurdish movement's democratic
      confederalism. Insurrectionary, post-left and primitivist currents remained influential in the
      anarchist milieu of North America and Europe.
