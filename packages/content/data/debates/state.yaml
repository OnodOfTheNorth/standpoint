# Debates over the state, rights, constitutions and justice.
debates:
  - id: debate.burke-paine
    name: Burke and Paine on the French Revolution
    date: "1790–1792"
    summary: >-
      Edmund Burke's Reflections on the Revolution in France attacked the revolution's claim to rebuild
      government on abstract rights and defended inherited institutions. Thomas Paine replied in Rights of Man
      that every generation has the right to govern itself and that hereditary rule has no title. The exchange
      became a founding text for both conservatism and radical republicanism.
    problematic: rights.basis
    sides:
      - label: Burke
        thinkers: [thinker.burke]
        positions: [rights.basis.inheritance, tradition.modernity.inherited-wisdom, reform.revolution.change-to-conserve, hist.french-revolution.burkean-catastrophe]
        argument: >-
          Society is a partnership between the living, the dead and those yet to be born. Its institutions carry
          the accumulated wisdom of generations, more than any one reasoner can hold. Our liberties are an
          entailed inheritance, not deductions from abstract rights; tear down the old order in the name of
          metaphysical rights and nothing will restrain power but force. A state without the means of some change
          is without the means of its conservation, but change must be gradual and repair, not demolition.
        texts:
          - {author: Edmund Burke, title: Reflections on the Revolution in France, year: 1790}
          - {author: Edmund Burke, title: An Appeal from the New to the Old Whigs, year: 1791}
      - label: Paine
        thinkers: [thinker.paine]
        positions: [rights.basis.natural-rights, authority.legitimacy.consent, hist.french-revolution.rights-of-man, democracy.form.representative]
        argument: >-
          Every age and generation must be as free to act for itself as the ages before it. The vanity of
          governing beyond the grave is the most insolent of tyrannies. Rights belong to people by nature, and
          government is legitimate only as a compact among them; a hereditary monarch is as absurd as a hereditary
          mathematician. Burke pities the plumage and forgets the dying bird. A government by the people can tax
          the rich to support the old, the young and the poor.
        texts:
          - {author: Mary Wollstonecraft, title: A Vindication of the Rights of Men, year: 1790}
          - {author: Thomas Paine, title: Rights of Man, year: 1791}
    outcome: >-
      Rights of Man sold in very large numbers among British artisans and radical societies. Paine was tried
      in absentia for seditious libel in 1792, sat in the French National Convention, and was imprisoned during
      the Terror. The British government suppressed the radical societies in 1794–95. Burke's book became the
      founding text of modern conservatism.

  - id: debate.federalists-antifederalists
    name: Federalists and Anti-Federalists
    date: "1787–1788"
    summary: >-
      The proposed United States Constitution of 1787 would replace a loose league of states with a strong
      national government. Its defenders, writing as Publius, argued that a large republic would control
      factions and secure property and commerce. Its opponents argued that it would create a distant
      government of the wealthy beyond the people's control, and demanded a bill of rights.
    problematic: federalism.scale
    sides:
      - label: The Federalists
        thinkers: [thinker.madison]
        positions: [federalism.scale.strong-center, democracy.form.representative, authority.legitimacy.consent]
        argument: >-
          The causes of faction are sown in human nature, and the most common is the unequal distribution of
          property. In a small republic a majority faction can oppress the minority; in a large one, with many
          interests and representatives chosen from wide districts, no faction can easily dominate. Ambition must
          be made to counteract ambition through separated powers. A weak union invites foreign danger, debt
          default and domestic insurrection.
        texts:
          - {author: Alexander Hamilton, James Madison and John Jay, title: The Federalist, year: 1788}
      - label: The Anti-Federalists
        thinkers: [thinker.mason]
        positions: [federalism.scale.states-and-exit, federalism.scale.subsidiarity, rights.basis.natural-rights]
        argument: >-
          Writers as Brutus and the Federal Farmer argued that a free republic must be small enough for the people
          to know and check their representatives. A national government with power to tax, raise armies and
          override state law would be run by a few wealthy men far from the people. Its broad clauses would let it
          absorb the states. At minimum, it needs a bill of rights protecting the press, juries and conscience.
        texts:
          - {author: Brutus (probably Robert Yates), title: Brutus No. 1, year: 1787}
          - {author: The Federal Farmer, title: Letters from the Federal Farmer, year: 1787}
    outcome: >-
      The Constitution was ratified in 1788 and the first ten amendments, the Bill of Rights, were adopted in
      1791 in response to Anti-Federalist demands. Neither side spoke for enslaved people, whom the
      Constitution counted as three-fifths of a person for apportionment, or for the Native nations whose land
      the new government would take.

  - id: debate.schmitt-kelsen
    name: Schmitt and Kelsen on the guardian of the constitution
    date: "1931"
    summary: >-
      In the crisis of the Weimar Republic, Carl Schmitt argued that the president, elected by the whole people
      and holding emergency powers, should be the guardian of the constitution. Hans Kelsen answered that a
      constitutional court should play that role and that Schmitt's argument handed the constitution to one
      man. The exchange took place as Germany was governed by presidential emergency decree.
    problematic: law.nature
    sides:
      - label: Schmitt
        thinkers: [thinker.schmitt]
        positions: [law.nature.sovereign-decision, emergency.powers.sovereign-exception, state.nature.sovereign-order]
        argument: >-
          Sovereign is he who decides on the exception. No norm applies itself: in a real crisis someone must decide
          what the situation is and what must be done. A court can only judge cases under existing law; it cannot
          defend the political unity of the people against parties that would tear it apart. The president, chosen
          by the whole nation and armed with Article 48, stands above the parties and can protect the
          constitution.
        texts:
          - {author: Carl Schmitt, title: Political Theology, year: 1922}
          - {author: Carl Schmitt, title: The Guardian of the Constitution, year: 1931}
      - label: Kelsen
        thinkers: [thinker.kelsen]
        positions: [law.nature.positive-command, democracy.form.representative, party.system.competitive-multiparty]
        argument: >-
          Hans Kelsen argued that law is a hierarchy of norms whose validity derives from the constitution. Whether
          an act violates the constitution is a legal question that an independent court can decide, as Austria's
          does. Making the head of the executive the guardian of the constitution means letting the party that
          must be checked check itself. Parliamentary rule rests on compromise among parties, and Schmitt's
          unified people is a fiction that serves one-man rule.
        texts:
          - {author: Hans Kelsen, title: The Essence and Value of Democracy, year: 1920}
          - {author: Hans Kelsen, title: Who Ought to Be the Guardian of the Constitution?, year: 1931}
          - {author: Hans Kelsen, title: Pure Theory of Law, year: 1934}
    outcome: >-
      In 1932 Schmitt represented the Reich government before the state court after it deposed the Prussian
      government by decree. In 1933 Hitler's government used emergency decrees and the Enabling Act to suspend
      the constitution. Schmitt joined the Nazi party that May; Kelsen, who was Jewish, was dismissed from his
      chair in Cologne and emigrated. Most postwar constitutions in Europe adopted constitutional courts on
      Kelsen's model.

  - id: debate.miliband-poulantzas
    name: Miliband and Poulantzas on the capitalist state
    date: "1969–1976"
    summary: >-
      Ralph Miliband's The State in Capitalist Society showed that the people who run the state in capitalist
      countries come mostly from or are tied to the business class. Nicos Poulantzas replied in New Left Review
      that this method missed the point: the state serves capital because of its place in the structure of
      society, whoever staffs it. The exchange ran for seven years.
    problematic: state.nature
    sides:
      - label: Miliband
        thinkers: [thinker.miliband]
        positions: [state.nature.class-instrument, ideology.formation.ruling-ideas]
        argument: >-
          Pluralist political science claims the state is a neutral arena of competing groups. The evidence says
          otherwise: senior civil servants, judges, generals and ministers share social origins, education and
          interests with the owners of capital, and business holds a structural advantage in pressure and
          resources. The state acts for the capitalist class because of who runs it and who influences it.
        texts:
          - {author: Ralph Miliband, title: The State in Capitalist Society, year: 1969}
          - {author: Ralph Miliband, title: "The Capitalist State: Reply to Nicos Poulantzas", year: 1970}
          - {author: Ralph Miliband, title: Poulantzas and the Capitalist State, year: 1973}
      - label: Poulantzas
        thinkers: [thinker.poulantzas]
        positions: [state.nature.relative-autonomy, class.concept.relation-to-production]
        argument: >-
          Showing the class origins of officials concedes the pluralists' terms: it implies that a state staffed by
          workers' sons would serve workers. The capitalist state serves capital because of its function in
          holding together a society divided into classes. It has relative autonomy from any single fraction of
          capital, which lets it organize the dominant classes and disorganize the dominated ones. Its personnel
          are secondary.
        texts:
          - {author: Nicos Poulantzas, title: Political Power and Social Classes, year: 1968}
          - {author: Nicos Poulantzas, title: The Problem of the Capitalist State, year: 1969}
          - {author: Nicos Poulantzas, title: "The Capitalist State: A Reply to Miliband and Laclau", year: 1976}
    outcome: >-
      The debate fixed the labels instrumentalist and structuralist, which both men rejected as caricatures,
      and launched a wider Marxist literature on the state. Poulantzas's final book, State, Power, Socialism
      (1978), described the state as a condensation of class relations. Miliband continued the empirical
      approach in Capitalist Democracy in Britain (1982).

  - id: debate.rawls-nozick
    name: Rawls and Nozick on justice
    date: "1971–1974"
    summary: >-
      John Rawls argued that a just society is one whose principles people would choose without knowing their
      place in it, and that inequalities are just only if they benefit the worst off. Robert Nozick, his
      Harvard colleague, replied that justice concerns how holdings were acquired and transferred, not what
      pattern they form, and that redistribution is a form of forced labor.
    problematic: inequality.justice
    sides:
      - label: Rawls
        thinkers: [thinker.rawls]
        positions: [equality.concept.difference-principle, inequality.justice.luck-unjust, welfare.state.social-citizenship]
        argument: >-
          No one deserves their natural talents or their starting place in society; these are arbitrary from a moral
          point of view. Imagine choosing principles behind a veil of ignorance about your class, talents and
          beliefs. You would secure equal basic liberties and fair equality of opportunity, and you would accept
          inequalities only if they improved the position of the least advantaged. Justice is the first virtue of
          social institutions.
        texts:
          - {author: John Rawls, title: A Theory of Justice, year: 1971}
      - label: Nozick
        thinkers: [thinker.nozick]
        positions: [inequality.justice.process-not-pattern, property.self-ownership.full, state.nature.necessary-evil]
        argument: >-
          Individuals have rights, and there are things no person or group may do to them. Whatever arises from a
          just situation by just steps is itself just. If people freely pay to watch Wilt Chamberlain play, the
          resulting inequality violates no one's rights, and any pattern can be kept only by continual
          interference in free choices. Taxation of earnings from labor is on a par with forced labor. Only a
          minimal state that protects against force, theft and fraud is justified.
        texts:
          - {author: Robert Nozick, title: "Anarchy, State, and Utopia", year: 1974}
    outcome: >-
      The two books defined the terms of academic political philosophy for decades. Rawls revised his theory in
      Political Liberalism (1993) and later favored a property-owning democracy over the welfare state. Nozick
      wrote in 1989 that his earlier libertarian position now seemed to him seriously inadequate. In politics,
      Nozick's book was read alongside the neoliberal turn of the 1980s.

  - id: debate.cohen-rawls
    name: Analytical Marxism and the Rawlsian left
    date: "1972–2009"
    summary: >-
      G. A. Cohen, an analytical Marxist, argued that Rawls's own premises condemned the inequality Rawls
      allowed: if talented people demand higher pay as an incentive, they are choosing inequality. Rawlsians
      replied that justice applies to institutions, not to personal choices. Other Marxists held that the whole
      argument about justice missed what Marx said about capitalism.
    problematic: equality.concept
    sides:
      - label: The Rawlsian view
        thinkers: [thinker.rawls]
        positions: [equality.concept.difference-principle, welfare.state.social-citizenship]
        argument: >-
          Principles of justice govern the basic structure of society: its constitution, property system and
          main institutions. Within a just structure, people may pursue their own aims, including higher pay.
          Incentives that raise output and so improve the position of the worst off are permitted. A
          property-owning democracy, which spreads ownership of capital widely, can secure fair equality of
          opportunity.
        texts:
          - {author: John Rawls, title: "Justice as Fairness: A Restatement", year: 2001}
      - label: Cohen's egalitarian critique
        thinkers: [thinker.cohen]
        positions: [inequality.justice.luck-unjust, equality.concept.classless, firm.ownership.public-municipal]
        argument: >-
          G. A. Cohen argued that if the talented would work as hard for equal pay but refuse to unless paid more,
          the inequality comes from their choice, not from necessity, and a society of people committed to the
          difference principle would not need it. The personal is political: justice requires an ethos, not only
          rules. Against Nozick, he argued that self-ownership leads to inequality only if the world is up for
          grabs. Socialism is the community and equality that people already live on a camping trip.
        texts:
          - {author: G. A. Cohen, title: "Incentives, Inequality, and Community", year: 1992}
          - {author: G. A. Cohen, title: "Self-Ownership, Freedom, and Equality", year: 1995}
          - {author: G. A. Cohen, title: Rescuing Justice and Equality, year: 2008}
          - {author: G. A. Cohen, title: Why Not Socialism?, year: 2009}
      - label: The Marxist critique of justice
        thinkers: [thinker.allen-wood]
        positions: [inequality.justice.class-exploitation, morality.basis.historical-class]
        argument: >-
          Allen Wood argued that Marx did not condemn capitalism as unjust: by the standards of its own exchange,
          the wage is paid in full. Standards of justice belong to modes of production. The case against
          capitalism is that it rests on exploitation and domination and blocks human development, and it is made
          by a class in struggle, not by philosophers designing principles.
        texts:
          - {author: Allen W. Wood, title: The Marxian Critique of Justice, year: 1972}
    outcome: >-
      Analytical Marxism, centered on the September Group of Cohen, John Roemer, Jon Elster and Erik Olin Wright,
      faded as a school by the 2000s. Cohen died in 2009. The idea of a property-owning democracy as a
      left reading of Rawls was revived in the 2010s.

  - id: debate.totalitarianism-concept
    name: The totalitarianism debate
    date: "1932–2019"
    summary: >-
      The word totalitarian was first used approvingly by Italian Fascists for a state that embraces all of life.
      After 1945 Western scholars used it to group Nazi Germany and the Soviet Union as one kind of rule. Critics
      argued that the concept erased the opposite class content of the two systems and served Cold War policy.
    problematic: totalitarianism.concept
    sides:
      - label: The Fascist total state
        thinkers: [thinker.mussolini, thinker.gentile]
        positions: [totalitarianism.concept.total-state-ideal, state.nature.organic-nation]
        argument: >-
          For the Fascist, everything is in the State, and nothing human or spiritual exists, much less has value,
          outside the State. The liberal state is a night watchman over atoms; the Fascist state is the conscience
          of the nation, educating and organizing the whole life of the people.
        texts:
          - {author: Benito Mussolini and Giovanni Gentile, title: The Doctrine of Fascism, year: 1932}
      - label: Arendt's new form of rule
        thinkers: [thinker.arendt]
        positions: [totalitarianism.concept.novel-form]
        argument: >-
          Hannah Arendt argued that Nazism and Stalinism were something new: not tyranny but rule by ideology and
          terror over masses uprooted from class, community and party. The camps were their central institution,
          laboratories for proving that everything is possible. Ordinary political categories cannot grasp them.
        texts:
          - {author: Hannah Arendt, title: The Origins of Totalitarianism, year: 1951}
      - label: Cold War liberals
        thinkers: [thinker.hayek, thinker.popper, thinker.kirkpatrick]
        positions: [totalitarianism.concept.syndrome-model, totalitarianism.concept.road-from-planning]
        argument: >-
          Totalitarian systems share a syndrome: an official ideology, a single mass party, a police terror, a
          monopoly of communications and arms, and central control of the economy. Central planning concentrates
          power over every life, which is why socialism and fascism are kin. Right-wing authoritarian
          governments differ because they leave society and property largely alone and can evolve.
        texts:
          - {author: F. A. Hayek, title: The Road to Serfdom, year: 1944}
          - {author: Karl Popper, title: The Open Society and Its Enemies, year: 1945}
          - {author: Carl J. Friedrich and Zbigniew Brzezinski, title: Totalitarian Dictatorship and Autocracy, year: 1956}
          - {author: Jeane Kirkpatrick, title: Dictatorships and Double Standards, year: 1979}
      - label: Critics of the concept
        thinkers: [thinker.losurdo, thinker.dimitrov]
        positions: [totalitarianism.concept.cold-war-weapon, fascism.nature.finance-capital-dictatorship]
        argument: >-
          Social historians of the USSR found a society full of conflict, initiative and improvisation that the
          model's picture of total control could not explain. Domenico Losurdo argued that the category lumps
          together a system that defended capitalist property and colonial expansion with one that abolished
          them, while excluding the colonial empires whose camps and mass killings came first. Its political
          function was to place communism and fascism on one side and liberal empire on the other.
        texts:
          - {author: J. Arch Getty, title: Origins of the Great Purges, year: 1985}
          - {author: Domenico Losurdo, title: Towards a Critique of the Category of Totalitarianism, year: 2004}
    outcome: >-
      The concept dominated Western political science in the 1950s and was challenged by social historians from
      the 1970s. It returned after 1989 in Eastern European memory politics, and the European Parliament
      adopted a resolution in 2019 placing Nazi and communist rule side by side. Its use remains disputed.
