id: descent.communist-tendencies
title: Which communism?
blurb: For people who think revolution is necessary. Moscow, Beijing, Trotsky or the councils, decided on the real splits of the last hundred years.
region: strategy
gate:
  any:
    - {weight: {position: state.nature.class-instrument, gt: 0.25}}
    - {weight: {position: elections.role.tribune, gt: 0.25}}
    - {weight: {position: party.system.leading-party, gt: 0.25}}
